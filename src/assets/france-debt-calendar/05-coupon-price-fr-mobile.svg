<svg xmlns="http://www.w3.org/2000/svg" width="440" height="1381" viewBox="0 0 440 1381" role="img" aria-labelledby="france-debt-time-debt-5-fr-m-title france-debt-time-debt-5-fr-m-desc" font-family="DejaVu Sans, Arial, sans-serif" style="width:100%;height:auto"><title id="france-debt-time-debt-5-fr-m-title">Le coupon raconte seulement une partie du prix</title><desc id="france-debt-time-debt-5-fr-m-desc">Le coupon raconte seulement une partie du prix. Source : AFT, résultat d’adjudication du 1er octobre 2026.. Prix moyen pondéré coté hors coupon couru. Rendement de 5,40 % repris de l’AFT, non recomposé à partir d’un simple ratio. Le schéma des coupons est non proportionnel au nombre de dates.</desc><rect width="440" height="1381" fill="var(--color-ink, #0c0d10)"/><text x="24.000" y="38.000" data-max-width="392.000" font-size="14" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="24.000" dy="0.000">l0g / 05 / TRANSACTION OBSERVÉE</tspan></text><text x="24.000" y="83.000" data-max-width="392.000" font-size="29" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start"><tspan x="24.000" dy="0.000">Le coupon raconte</tspan><tspan x="24.000" dy="33.930">seulement une partie</tspan><tspan x="24.000" dy="33.930">du prix</tspan></text><text x="24.000" y="182.860" data-max-width="392.000" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="24.000" dy="0.000">OAT 2 % du 25 mai 2048. Adjudication</tspan><tspan x="24.000" dy="25.650">du 1er octobre 2026, règlement le 5</tspan><tspan x="24.000" dy="25.650">octobre.</tspan></text><line x1="24.000" y1="255.160" x2="416.000" y2="255.160" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1"/><text x="24.000" y="295.160" data-max-width="392.000" font-size="17" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start"><tspan x="24.000" dy="0.000">PRIX COTÉ AU DÉPART</tspan></text><text x="24.000" y="348.160" data-max-width="392.000" font-size="43" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start"><tspan x="24.000" dy="0.000">57,23 €</tspan></text><text x="24.000" y="384.160" data-max-width="392.000" font-size="20" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="24.000" dy="0.000">Pour 100 € de nominal, hors coupon</tspan><tspan x="24.000" dy="25.600">couru.</tspan></text><line x1="24.000" y1="434.760" x2="416.000" y2="434.760" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1.5"/><text x="24.000" y="479.760" data-max-width="392.000" font-size="17" font-weight="700" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="start"><tspan x="24.000" dy="0.000">COUPON CONTRACTUEL</tspan></text><text x="24.000" y="532.760" data-max-width="392.000" font-size="43" font-weight="700" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="start"><tspan x="24.000" dy="0.000">2 € / an</tspan></text><text x="24.000" y="568.760" data-max-width="392.000" font-size="20" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="24.000" dy="0.000">Calculé sur 100 € de nominal, pas sur</tspan><tspan x="24.000" dy="25.600">le prix payé.</tspan></text><line x1="24.000" y1="619.360" x2="416.000" y2="619.360" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1.5"/><text x="24.000" y="664.360" data-max-width="392.000" font-size="17" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start"><tspan x="24.000" dy="0.000">PRINCIPAL EN 2048</tspan></text><text x="24.000" y="717.360" data-max-width="392.000" font-size="43" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start"><tspan x="24.000" dy="0.000">100 €</tspan></text><text x="24.000" y="753.360" data-max-width="392.000" font-size="20" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="24.000" dy="0.000">À rembourser le 25 mai 2048, avec le</tspan><tspan x="24.000" dy="25.600">dernier coupon.</tspan></text><line x1="24.000" y1="803.960" x2="416.000" y2="803.960" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1.5"/><rect x="24.000" y="848.960" width="392.000" height="176.000" rx="4" fill="var(--color-paper, #e7e9ee)"/><text x="44.000" y="895.960" data-max-width="352.000" font-size="43" font-weight="700" fill="var(--color-ink, #0c0d10)" text-anchor="start"><tspan x="44.000" dy="0.000">5,40 %</tspan></text><text x="44.000" y="930.960" data-max-width="352.000" font-size="17" font-weight="700" fill="var(--color-ink, #0c0d10)" text-anchor="start"><tspan x="44.000" dy="0.000">RENDEMENT MOYEN PUBLIÉ</tspan></text><text x="44.000" y="964.960" data-max-width="352.000" font-size="19" font-weight="400" fill="var(--color-ink, #0c0d10)" text-anchor="start"><tspan x="44.000" dy="0.000">Il intègre les coupons et le</tspan><tspan x="44.000" dy="24.320">remboursement, aux dates prévues.</tspan></text><text x="24.000" y="1065.960" data-max-width="392.000" font-size="21" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start"><tspan x="24.000" dy="0.000">Pour le Trésor : moins de cash</tspan><tspan x="24.000" dy="26.880">reçu par euro de nominal oblige</tspan><tspan x="24.000" dy="26.880">à regarder aussi le principal</tspan><tspan x="24.000" dy="26.880">promis à la fin.</tspan></text><line x1="24.000" y1="1187.600" x2="416.000" y2="1187.600" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1"/><text x="24.000" y="1216.600" data-max-width="392.000" font-size="16" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="24.000" dy="0.000">Source : AFT, résultat d’adjudication du</tspan><tspan x="24.000" dy="21.120">1er octobre 2026.</tspan></text><text x="24.000" y="1264.720" data-max-width="392.000" font-size="16" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="24.000" dy="0.000">Prix moyen pondéré coté hors coupon couru.</tspan><tspan x="24.000" dy="21.120">Rendement de 5,40 % repris de l’AFT, non</tspan><tspan x="24.000" dy="21.120">recomposé à partir d’un simple ratio. Le schéma</tspan><tspan x="24.000" dy="21.120">des coupons est non proportionnel au nombre</tspan><tspan x="24.000" dy="21.120">de dates.</tspan></text></svg>
