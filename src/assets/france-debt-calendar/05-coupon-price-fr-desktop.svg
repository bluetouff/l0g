<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="879" viewBox="0 0 1200 879" role="img" aria-labelledby="france-debt-time-debt-5-fr-d-title france-debt-time-debt-5-fr-d-desc" font-family="DejaVu Sans, Arial, sans-serif" style="width:100%;height:auto"><title id="france-debt-time-debt-5-fr-d-title">Le coupon raconte seulement une partie du prix</title><desc id="france-debt-time-debt-5-fr-d-desc">Le coupon raconte seulement une partie du prix. Source : AFT, résultat d’adjudication du 1er octobre 2026.. Prix moyen pondéré coté hors coupon couru. Rendement de 5,40 % repris de l’AFT, non recomposé à partir d’un simple ratio. Le schéma des coupons est non proportionnel au nombre de dates.</desc><rect width="1200" height="879" fill="var(--color-ink, #0c0d10)"/><text x="48.000" y="44.000" data-max-width="1104.000" font-size="16" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="48.000" dy="0.000">l0g / 05 / TRANSACTION OBSERVÉE</tspan></text><text x="48.000" y="106.000" data-max-width="1104.000" font-size="38" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start"><tspan x="48.000" dy="0.000">Le coupon raconte seulement une partie du prix</tspan></text><text x="48.000" y="144.000" data-max-width="1104.000" font-size="21" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="48.000" dy="0.000">OAT 2 % du 25 mai 2048. Adjudication du 1er octobre 2026, règlement le 5 octobre.</tspan></text><line x1="48.000" y1="165.000" x2="1152.000" y2="165.000" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1"/><text x="48.000" y="205.000" data-max-width="330.000" font-size="18" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start"><tspan x="48.000" dy="0.000">PRIX COTÉ AU DÉPART</tspan></text><text x="48.000" y="280.000" data-max-width="330.000" font-size="45" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start"><tspan x="48.000" dy="0.000">57,23 €</tspan></text><text x="48.000" y="329.000" data-max-width="330.000" font-size="22" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="48.000" dy="0.000">Pour 100 € de nominal, hors</tspan><tspan x="48.000" dy="28.160">coupon couru.</tspan></text><text x="438.000" y="205.000" data-max-width="330.000" font-size="18" font-weight="700" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="start"><tspan x="438.000" dy="0.000">COUPON CONTRACTUEL</tspan></text><text x="438.000" y="280.000" data-max-width="330.000" font-size="45" font-weight="700" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="start"><tspan x="438.000" dy="0.000">2 € / an</tspan></text><text x="438.000" y="329.000" data-max-width="330.000" font-size="22" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="438.000" dy="0.000">Calculé sur le nominal, pas</tspan><tspan x="438.000" dy="28.160">sur le prix payé.</tspan></text><text x="828.000" y="205.000" data-max-width="330.000" font-size="18" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start"><tspan x="828.000" dy="0.000">PRINCIPAL EN 2048</tspan></text><text x="828.000" y="280.000" data-max-width="330.000" font-size="45" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start"><tspan x="828.000" dy="0.000">100 €</tspan></text><text x="828.000" y="329.000" data-max-width="330.000" font-size="22" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="828.000" dy="0.000">Remboursement le 25 mai,</tspan><tspan x="828.000" dy="28.160">avec le dernier coupon.</tspan></text><line x1="60.000" y1="419.000" x2="1140.000" y2="419.000" stroke="var(--color-muted, #8b909b)" stroke-width="2"/><circle cx="60" cy="419.0" r="7" fill="var(--color-signal, #5eead4)"/><circle cx="480" cy="419.0" r="7" fill="var(--color-topic-blue, #7aa2f7)"/><circle cx="690" cy="419.0" r="7" fill="var(--color-topic-blue, #7aa2f7)"/><circle cx="900" cy="419.0" r="7" fill="var(--color-topic-blue, #7aa2f7)"/><circle cx="1140" cy="419.0" r="7" fill="var(--color-paper, #e7e9ee)"/><text x="60.000" y="459.000" data-max-width="270.000" font-size="20" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start"><tspan x="60.000" dy="0.000">Octobre 2026</tspan></text><text x="580.000" y="459.000" data-max-width="380.000" font-size="20" font-weight="700" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="middle"><tspan x="580.000" dy="0.000">Coupons annuels</tspan></text><text x="1140.000" y="459.000" data-max-width="280.000" font-size="20" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="end"><tspan x="1140.000" dy="0.000">Mai 2048</tspan></text><rect x="48.000" y="516.000" width="1104.000" height="139.000" rx="4" fill="var(--color-paper, #e7e9ee)"/><text x="76.000" y="585.000" data-max-width="295.000" font-size="48" font-weight="700" fill="var(--color-ink, #0c0d10)" text-anchor="start"><tspan x="76.000" dy="0.000">5,40 %</tspan></text><text x="422.000" y="558.000" data-max-width="690.000" font-size="19" font-weight="700" fill="var(--color-ink, #0c0d10)" text-anchor="start"><tspan x="422.000" dy="0.000">RENDEMENT MOYEN PUBLIÉ PAR L’AFT</tspan></text><text x="422.000" y="595.000" data-max-width="690.000" font-size="22" font-weight="400" fill="var(--color-ink, #0c0d10)" text-anchor="start"><tspan x="422.000" dy="0.000">Le calcul valorise tous les coupons et le principal à leurs</tspan><tspan x="422.000" dy="28.160">dates. Le ratio coupon/prix ne suffit pas.</tspan></text><text x="48.000" y="697.000" data-max-width="1104.000" font-size="24" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start"><tspan x="48.000" dy="0.000">Pour le Trésor : moins de cash reçu par euro de nominal oblige à regarder aussi</tspan><tspan x="48.000" dy="30.720">le principal promis à la fin.</tspan></text><line x1="48.000" y1="768.720" x2="1152.000" y2="768.720" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1"/><text x="48.000" y="797.720" data-max-width="1104.000" font-size="17" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="48.000" dy="0.000">Source : AFT, résultat d’adjudication du 1er octobre 2026.</tspan></text><text x="48.000" y="824.720" data-max-width="1104.000" font-size="17" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="48.000" dy="0.000">Prix moyen pondéré coté hors coupon couru. Rendement de 5,40 % repris de l’AFT, non recomposé à partir d’un simple ratio. Le</tspan><tspan x="48.000" dy="22.440">schéma des coupons est non proportionnel au nombre de dates.</tspan></text></svg>
