<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="879" viewBox="0 0 1200 879" role="img" aria-labelledby="france-debt-time-debt-5-en-d-title france-debt-time-debt-5-en-d-desc" font-family="DejaVu Sans, Arial, sans-serif" style="width:100%;height:auto"><title id="france-debt-time-debt-5-en-d-title">The coupon tells only part of the price</title><desc id="france-debt-time-debt-5-en-d-desc">The coupon tells only part of the price. Source: AFT auction results, 1 October 2026.. Weighted quoted clean price excludes accrued interest. The 5.40% yield is reported by AFT, not reconstructed from a simple ratio. Coupon markers are schematic, not a count of payment dates.</desc><rect width="1200" height="879" fill="var(--color-ink, #0c0d10)"/><text x="48.000" y="44.000" data-max-width="1104.000" font-size="16" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="48.000" dy="0.000">l0g / 05 / OBSERVED TRANSACTION</tspan></text><text x="48.000" y="106.000" data-max-width="1104.000" font-size="38" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start"><tspan x="48.000" dy="0.000">The coupon tells only part of the price</tspan></text><text x="48.000" y="144.000" data-max-width="1104.000" font-size="21" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="48.000" dy="0.000">2% OAT due 25 May 2048. Auction on 1 October 2026, settlement on 5 October.</tspan></text><line x1="48.000" y1="165.000" x2="1152.000" y2="165.000" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1"/><text x="48.000" y="205.000" data-max-width="330.000" font-size="18" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start"><tspan x="48.000" dy="0.000">QUOTED INITIAL PRICE</tspan></text><text x="48.000" y="280.000" data-max-width="330.000" font-size="45" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start"><tspan x="48.000" dy="0.000">€57.23</tspan></text><text x="48.000" y="329.000" data-max-width="330.000" font-size="22" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="48.000" dy="0.000">Per €100 face value,</tspan><tspan x="48.000" dy="28.160">excluding accrued interest.</tspan></text><text x="438.000" y="205.000" data-max-width="330.000" font-size="18" font-weight="700" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="start"><tspan x="438.000" dy="0.000">CONTRACTUAL COUPON</tspan></text><text x="438.000" y="280.000" data-max-width="330.000" font-size="45" font-weight="700" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="start"><tspan x="438.000" dy="0.000">€2 a year</tspan></text><text x="438.000" y="329.000" data-max-width="330.000" font-size="22" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="438.000" dy="0.000">Calculated on face value, not</tspan><tspan x="438.000" dy="28.160">on purchase price.</tspan></text><text x="828.000" y="205.000" data-max-width="330.000" font-size="18" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start"><tspan x="828.000" dy="0.000">PRINCIPAL IN 2048</tspan></text><text x="828.000" y="280.000" data-max-width="330.000" font-size="45" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start"><tspan x="828.000" dy="0.000">€100</tspan></text><text x="828.000" y="329.000" data-max-width="330.000" font-size="22" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="828.000" dy="0.000">Repaid on 25 May, alongside</tspan><tspan x="828.000" dy="28.160">the last coupon.</tspan></text><line x1="60.000" y1="419.000" x2="1140.000" y2="419.000" stroke="var(--color-muted, #8b909b)" stroke-width="2"/><circle cx="60" cy="419.0" r="7" fill="var(--color-signal, #5eead4)"/><circle cx="480" cy="419.0" r="7" fill="var(--color-topic-blue, #7aa2f7)"/><circle cx="690" cy="419.0" r="7" fill="var(--color-topic-blue, #7aa2f7)"/><circle cx="900" cy="419.0" r="7" fill="var(--color-topic-blue, #7aa2f7)"/><circle cx="1140" cy="419.0" r="7" fill="var(--color-paper, #e7e9ee)"/><text x="60.000" y="459.000" data-max-width="270.000" font-size="20" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start"><tspan x="60.000" dy="0.000">October 2026</tspan></text><text x="580.000" y="459.000" data-max-width="380.000" font-size="20" font-weight="700" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="middle"><tspan x="580.000" dy="0.000">Annual coupons</tspan></text><text x="1140.000" y="459.000" data-max-width="280.000" font-size="20" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="end"><tspan x="1140.000" dy="0.000">May 2048</tspan></text><rect x="48.000" y="516.000" width="1104.000" height="139.000" rx="4" fill="var(--color-paper, #e7e9ee)"/><text x="76.000" y="585.000" data-max-width="295.000" font-size="48" font-weight="700" fill="var(--color-ink, #0c0d10)" text-anchor="start"><tspan x="76.000" dy="0.000">5.40%</tspan></text><text x="422.000" y="558.000" data-max-width="690.000" font-size="19" font-weight="700" fill="var(--color-ink, #0c0d10)" text-anchor="start"><tspan x="422.000" dy="0.000">AVERAGE YIELD PUBLISHED BY AFT</tspan></text><text x="422.000" y="595.000" data-max-width="690.000" font-size="22" font-weight="400" fill="var(--color-ink, #0c0d10)" text-anchor="start"><tspan x="422.000" dy="0.000">The calculation values every coupon and principal payment</tspan><tspan x="422.000" dy="28.160">at its date. Coupon divided by price is insufficient.</tspan></text><text x="48.000" y="697.000" data-max-width="1104.000" font-size="24" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start"><tspan x="48.000" dy="0.000">For the Treasury, less cash received per euro of face value makes the principal</tspan><tspan x="48.000" dy="30.720">promised at maturity essential to the comparison.</tspan></text><line x1="48.000" y1="768.720" x2="1152.000" y2="768.720" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1"/><text x="48.000" y="797.720" data-max-width="1104.000" font-size="17" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="48.000" dy="0.000">Source: AFT auction results, 1 October 2026.</tspan></text><text x="48.000" y="824.720" data-max-width="1104.000" font-size="17" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="48.000" dy="0.000">Weighted quoted clean price excludes accrued interest. The 5.40% yield is reported by AFT, not reconstructed from a simple</tspan><tspan x="48.000" dy="22.440">ratio. Coupon markers are schematic, not a count of payment dates.</tspan></text></svg>
