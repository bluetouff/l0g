<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="874" viewBox="0 0 1200 874" role="img" aria-labelledby="france-debt-time-debt-6-fr-d-title france-debt-time-debt-6-fr-d-desc" font-family="DejaVu Sans, Arial, sans-serif" style="width:100%;height:auto"><title id="france-debt-time-debt-6-fr-d-title">Le risque change de côté avec la durée</title><desc id="france-debt-time-debt-6-fr-d-desc">Le risque change de côté avec la durée. Source : calculs l0g, modèle M2. Valeurs pour 100 € de nominal.. Coupons annuels, aucun temps écoulé, aucun défaut. La variation de marché n’est pas automatiquement une perte réalisée. Le risque du portefeuille dépend aussi des autres actifs et engagements.</desc><rect width="1200" height="874" fill="var(--color-ink, #0c0d10)"/><text x="48.000" y="44.000" data-max-width="1104.000" font-size="16" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="48.000" dy="0.000">l0g / 06 / MODÈLE HYPOTHÉTIQUE</tspan></text><text x="48.000" y="106.000" data-max-width="1104.000" font-size="38" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start"><tspan x="48.000" dy="0.000">Le risque change de côté avec la durée</tspan></text><text x="48.000" y="144.000" data-max-width="1104.000" font-size="21" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="48.000" dy="0.000">Deux titres fictifs émis au pair. Hausse immédiate du rendement de marché de 1 point.</tspan></text><line x1="48.000" y1="165.000" x2="1152.000" y2="165.000" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1"/><text x="48.000" y="200.000" data-max-width="498.000" font-size="30" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start"><tspan x="48.000" dy="0.000">Titre à 2 ans</tspan></text><text x="48.000" y="241.000" data-max-width="498.000" font-size="21" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="48.000" dy="0.000">Coupon 3 % ; rendement 3 % → 4 %.</tspan></text><text x="48.000" y="301.000" data-max-width="498.000" font-size="18" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="48.000" dy="0.000">INVESTISSEUR : VALEUR DU TITRE</tspan></text><rect x="48.000" y="326.000" width="498.000" height="38.000" rx="0" fill="var(--color-surface-2, #171a20)"/><rect x="48.000" y="326.000" width="488.607" height="38.000" rx="0" fill="var(--color-signal, #5eead4)"/><text x="48.000" y="424.000" data-max-width="498.000" font-size="39" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start"><tspan x="48.000" dy="0.000">100 € → 98,11 €</tspan></text><text x="48.000" y="463.000" data-max-width="498.000" font-size="22" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start"><tspan x="48.000" dy="0.000">Variation : -1,89 %.</tspan></text><line x1="48.000" y1="500.000" x2="546.000" y2="500.000" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1.5"/><text x="48.000" y="542.000" data-max-width="498.000" font-size="18" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="48.000" dy="0.000">ÉMETTEUR : COUPON INCHANGÉ</tspan></text><text x="48.000" y="587.000" data-max-width="498.000" font-size="24" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start"><tspan x="48.000" dy="0.000">3 € par an pour 100 € de nominal. Le</tspan><tspan x="48.000" dy="30.720">principal revient dans 2 ans.</tspan></text><text x="654.000" y="200.000" data-max-width="498.000" font-size="30" font-weight="700" fill="var(--color-down, #ff4d87)" text-anchor="start"><tspan x="654.000" dy="0.000">Titre à 10 ans</tspan></text><text x="654.000" y="241.000" data-max-width="498.000" font-size="21" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="654.000" dy="0.000">Coupon 5 % ; rendement 5 % → 6 %.</tspan></text><text x="654.000" y="301.000" data-max-width="498.000" font-size="18" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="654.000" dy="0.000">INVESTISSEUR : VALEUR DU TITRE</tspan></text><rect x="654.000" y="326.000" width="498.000" height="38.000" rx="0" fill="var(--color-surface-2, #171a20)"/><rect x="654.000" y="326.000" width="461.347" height="38.000" rx="0" fill="var(--color-down, #ff4d87)"/><text x="654.000" y="424.000" data-max-width="498.000" font-size="39" font-weight="700" fill="var(--color-down, #ff4d87)" text-anchor="start"><tspan x="654.000" dy="0.000">100 € → 92,64 €</tspan></text><text x="654.000" y="463.000" data-max-width="498.000" font-size="22" font-weight="700" fill="var(--color-down, #ff4d87)" text-anchor="start"><tspan x="654.000" dy="0.000">Variation : -7,36 %.</tspan></text><line x1="654.000" y1="500.000" x2="1152.000" y2="500.000" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1.5"/><text x="654.000" y="542.000" data-max-width="498.000" font-size="18" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="654.000" dy="0.000">ÉMETTEUR : COUPON INCHANGÉ</tspan></text><text x="654.000" y="587.000" data-max-width="498.000" font-size="24" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start"><tspan x="654.000" dy="0.000">5 € par an pour 100 € de nominal. Le</tspan><tspan x="654.000" dy="30.720">principal revient dans 10 ans.</tspan></text><text x="48.000" y="691.000" data-max-width="1104.000" font-size="26" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start"><tspan x="48.000" dy="0.000">Une valeur de marché plus volatile pour le porteur peut financer un</tspan><tspan x="48.000" dy="33.280">calendrier plus prévisible pour l’État.</tspan></text><line x1="48.000" y1="764.280" x2="1152.000" y2="764.280" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1"/><text x="48.000" y="793.280" data-max-width="1104.000" font-size="17" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="48.000" dy="0.000">Source : calculs l0g, modèle M2. Valeurs pour 100 € de nominal.</tspan></text><text x="48.000" y="820.280" data-max-width="1104.000" font-size="17" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="48.000" dy="0.000">Coupons annuels, aucun temps écoulé, aucun défaut. La variation de marché n’est pas automatiquement une perte réalisée. Le</tspan><tspan x="48.000" dy="22.440">risque du portefeuille dépend aussi des autres actifs et engagements.</tspan></text></svg>
