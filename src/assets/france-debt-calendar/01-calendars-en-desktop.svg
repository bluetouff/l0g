pon locked for ten years</tspan></text><text x="48.000" y="412.000" data-max-width="130.000" font-size="18" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="48.000" dy="0.000">5 × 2 YEARS</tspan></text><rect x="190.000" y="388.000" width="183.800" height="68.000" rx="4" fill="var(--color-signal, #5eead4)"/><text x="282.400" y="431.000" data-max-width="172.800" font-size="22" font-weight="700" fill="var(--color-ink, #0c0d10)" text-anchor="middle"><tspan x="282.400" dy="0.000">3%</tspan></text><rect x="380.800" y="388.000" width="183.800" height="68.000" rx="4" fill="var(--color-surface-2, #171a20)"/><text x="473.200" y="431.000" data-max-width="172.800" font-size="22" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="middle"><tspan x="473.200" dy="0.000">Reset</tspan></text><circle cx="380.8" cy="486.0" r="7" fill="var(--color-amber, #f5b13d)"/><line x1="380.800" y1="460.000" x2="380.800" y2="476.000" stroke="var(--color-amber, #f5b13d)" stroke-width="2"/><rect x="571.600" y="388.000" width="183.800" height="68.000" rx="4" fill="var(--color-surface-2, #171a20)"/><text x="664.000" y="431.000" data-max-width="172.800" font-size="22" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="middle"><tspan x="664.000" dy="0.000">Reset</tspan></text><circle cx="571.6" cy="486.0" r="7" fill="var(--color-amber, #f5b13d)"/><line x1="571.600" y1="460.000" x2="571.600" y2="476.000" stroke="var(--color-amber, #f5b13d)" stroke-width="2"/><rect x="762.400" y="388.000" width="183.800" height="68.000" rx="4" fill="var(--color-surface-2, #171a20)"/><text x="854.800" y="431.000" data-max-width="172.800" font-size="22" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="middle"><tspan x="854.800" dy="0.000">Reset</tspan></text><circle cx="762.4000000000001" cy="486.0" r="7" fill="var(--color-amber, #f5b13d)"/><line x1="762.400" y1="460.000" x2="762.400" y2="476.000" stroke="var(--color-amber, #f5b13d)" stroke-width="2"/><rect x="953.200" y="388.000" width="183.800" height="68.000" rx="4" fill="var(--color-surface-2, #171a20)"/><text x="1045.600" y="431.000" data-max-width="172.800" font-size="22" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="middle"><tspan x="1045.600" dy="0.000">Reset</tspan></text><circle cx="953.2" cy="486.0" r="7" fill="var(--color-amber, #f5b13d)"/><line x1="953.200" y1="460.000" x2="953.200" y2="476.000" stroke="var(--color-amber, #f5b13d)" stroke-width="2"/><line x1="190.000" y1="255.000" x2="190.000" y2="245.000" stroke="var(--color-muted, #8b909b)" stroke-width="1.5"/><text x="190.000" y="235.000" data-max-width="80.000" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="middle"><tspan x="190.000" dy="0.000">0</tspan></text><line x1="380.800" y1="255.000" x2="380.800" y2="245.000" stroke="var(--color-muted, #8b909b)" stroke-width="1.5"/><text x="380.800" y="235.000" data-max-width="80.000" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="middle"><tspan x="380.800" dy="0.000">2</tspan></text><line x1="571.600" y1="255.000" x2="571.600" y2="245.000" stroke="var(--color-muted, #8b909b)" stroke-width="1.5"/><text x="571.600" y="235.000" data-max-width="80.000" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="middle"><tspan x="571.600" dy="0.000">4</tspan></text><line x1="762.400" y1="255.000" x2="762.400" y2="245.000" stroke="var(--color-muted, #8b909b)" stroke-width="1.5"/><text x="762.400" y="235.000" data-max-width="80.000" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="middle"><tspan x="762.400" dy="0.000">6</tspan></text><line x1="953.200" y1="255.000" x2="953.200" y2="245.000" stroke="var(--color-muted, #8b909b)" stroke-width="1.5"/><text x="953.200" y="235.000" data-max-width="80.000" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="middle"><tspan x="953.200" dy="0.