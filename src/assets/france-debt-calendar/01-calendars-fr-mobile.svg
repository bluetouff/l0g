<svg xmlns="http://www.w3.org/2000/svg" width="440" height="1556" viewBox="0 0 440 1556" role="img" aria-labelledby="france-debt-time-debt-1-fr-m-title france-debt-time-debt-1-fr-m-desc" font-family="DejaVu Sans, Arial, sans-serif" style="width:100%;height:auto"><title id="france-debt-time-debt-1-fr-m-title">Dix milliards, deux calendriers</title><desc id="france-debt-time-debt-1-fr-m-desc">Dix milliards, deux calendriers. Source : calculs l0g, modèle M1.. Émissions au pair, coupons annuels payés par le budget. Le cumul des émissions brutes vaut 50 Md€ pour le court, contre 10 Md€ pour le long ; l’encours reste 10 Md€.</desc><rect width="440" height="1556" fill="var(--color-ink, #0c0d10)"/><text x="24.000" y="38.000" data-max-width="392.000" font-size="14" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="24.000" dy="0.000">l0g / 01 / MODÈLE HYPOTHÉTIQUE</tspan></text><text x="24.000" y="83.000" data-max-width="392.000" font-size="29" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start"><tspan x="24.000" dy="0.000">Dix milliards, deux</tspan><tspan x="24.000" dy="33.930">calendriers</tspan></text><text x="24.000" y="148.930" data-max-width="392.000" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="24.000" dy="0.000">Même besoin pendant dix ans. Les</tspan><tspan x="24.000" dy="25.650">intérêts et les dates de retour au</tspan><tspan x="24.000" dy="25.650">marché changent.</tspan></text><line x1="24.000" y1="221.230" x2="416.000" y2="221.230" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1"/><text x="24.000" y="246.230" data-max-width="392.000" font-size="18" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start"><tspan x="24.000" dy="0.000">UN CONTRAT DE DIX ANS</tspan></text><rect x="24.000" y="264.230" width="392.000" height="80.000" rx="4" fill="var(--color-paper, #e7e9ee)"/><text x="220.000" y="299.230" data-max-width="360.000" font-size="29" font-weight="700" fill="var(--color-ink, #0c0d10)" text-anchor="middle"><tspan x="220.000" dy="0.000">5 % / an</tspan></text><text x="220.000" y="327.230" data-max-width="360.000" font-size="18" font-weight="400" fill="var(--color-ink, #0c0d10)" text-anchor="middle"><tspan x="220.000" dy="0.000">Taux fixé jusqu’à l’an 10</tspan></text><text x="24.000" y="393.230" data-max-width="392.000" font-size="18" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start"><tspan x="24.000" dy="0.000">CINQ CONTRATS DE DEUX ANS</tspan></text><text x="24.000" y="456.230" data-max-width="80.000" font-size="23" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start"><tspan x="24.000" dy="0.000">0–2</tspan></text><rect x="105.000" y="426.230" width="311.000" height="72.000" rx="4" fill="var(--color-signal, #5eead4)"/><text x="124.000" y="456.230" data-max-width="270.000" font-size="23" font-weight="700" fill="var(--color-ink, #0c0d10)" text-anchor="start"><tspan x="124.000" dy="0.000">3 % / an</tspan></text><text x="124.000" y="482.230" data-max-width="270.000" font-size="18" font-weight="400" fill="var(--color-ink, #0c0d10)" text-anchor="start"><tspan x="124.000" dy="0.000">Premier contrat</tspan></text><line x1="260.000" y1="503.230" x2="260.000" y2="525.230" stroke="var(--color-amber, #f5b13d)" stroke-width="2"/><path d="M 255.84398742012667 517.2470456949865 L 260 525.23 L 264.15601257987333 517.2470456949865" stroke="var(--color-amber, #f5b13d)" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="24.000" y="564.230" data-max-width="80.000" font-size="23" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start"><tspan x="24.000" dy="0.000">2–4</tspan></text><rect x="105.000" y="534.230" width="311.000" height="72.000" rx="4" fill="var(--color-surface-2, #171a20)"/><text x="124.000" y="564.230" data-max-width="270.000" font-size="23" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start"><tspan x="124.000" dy="0.000">Nouveau taux</tspan></text><text x="124.000" y="590.230" data-max-width="270.000" font-size="18" font-weight="400" fill="var(--color-signal, #5eead4)" text-anchor="start"><tspan x="124.000" dy="0.000">10 Md€ à refinancer</tspan></text><line x1="260.000" y1="611.230" x2="260.000" y2="633.230" stroke="var(--color-amber, #f5b13d)" stroke-width="2"/><path d="M 255.84398742012667 625.2470456949865 L 260 633.23 L 264.15601257987333 625.2470456949865" stroke="var(--color-amber, #f5b13d)" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="24.000" y="672.230" data-max-width="80.000" font-size="23" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start"><tspan x="24.000" dy="0.000">4–6</tspan></text><rect x="105.000" y="642.230" width="311.000" height="72.000" rx="4" fill="var(--color-surface-2, #171a20)"/><text x="124.000" y="672.230" data-max-width="270.000" font-size="23" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start"><tspan x="124.000" dy="0.000">Nouveau taux</tspan></text><text x="124.000" y="698.230" data-max-width="270.000" font-size="18" font-weight="400" fill="var(--color-signal, #5eead4)" text-anchor="start"><tspan x="124.000" dy="0.000">10 Md€ à refinancer</tspan></text><line x1="260.000" y1="719.230" x2="260.000" y2="741.230" stroke="var(--color-amber, #f5b13d)" stroke-width="2"/><path d="M 255.84398742012667 733.2470456949865 L 260 741.23 L 264.15601257987333 733.2470456949865" stroke="var(--color-amber, #f5b13d)" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="24.000" y="780.230" data-max-width="80.000" font-size="23" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start"><tspan x="24.000" dy="0.000">6–8</tspan></text><rect x="105.000" y="750.230" width="311.000" height="72.000" rx="4" fill="var(--color-surface-2, #171a20)"/><text x="124.000" y="780.230" data-max-wi