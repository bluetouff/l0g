/tspan></text><line x1="24.000" y1="1111.830" x2="416.000" y2="1111.830" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1.5"/><text x="24.000" y="1154.830" data-max-width="392.000" font-size="34" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start"><tspan x="24.000" dy="0.000">4</tspan></text><text x="24.000" y="1186.830" data-max-width="392.000" font-size="20" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="24.000" dy="0.000">refinancements supplémentaires</tspan><tspan x="24.000" dy="25.600">avant l’échéance finale.</tspan></text><line x1="24.000" y1="1247.430" x2="416.000" y2="1247.430" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1.5"/><text x="24.000" y="1290.430" data-max-width="392.000" font-size="34" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start"><tspan x="24.000" dy="0.000">10 Md€</tspan></text><text x="24.000" y="1322.430" data-max-width="392.000" font-size="20" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="24.000" dy="0.000">de principal à rembourser à dix ans</tspan><tspan x="24.000" dy="25.600">dans les deux stratégies.</tspan></text><line x1="24.000" y1="1405.030" x2="416.000" y2="1405.030" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1"/><text x="24.000" y="1434.030" data-max-width="392.000" font-size="16" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="24.000" dy="0.000">Source : calculs l0g, modèle M1.</tspan></text><text x="24.000" y="1461.030" data-max-width="392.000" font-size="16" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="24.000" dy="0.000">Émissions au pair, coupons annuels payés par</tspan><tspan x="24.000" dy="21.120">le budget. Le cumul des émissions brutes vaut</tspan><tspan x="24.000" dy="21.120">50 Md€ pour le court, contre 10 Md€ pour le</tspan><tspan x="24.000