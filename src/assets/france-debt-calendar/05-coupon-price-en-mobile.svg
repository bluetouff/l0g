<svg xmlns="http://www.w3.org/2000/svg" width="440" height="1348" viewBox="0 0 440 1348" role="img" aria-labelledby="france-debt-time-debt-5-en-m-title france-debt-time-debt-5-en-m-desc" font-family="DejaVu Sans, Arial, sans-serif" style="width:100%;height:auto"><title id="france-debt-time-debt-5-en-m-title">The coupon tells only part of the price</title><desc id="france-debt-time-debt-5-en-m-desc">The coupon tells only part of the price. Source: AFT auction results, 1 October 2026.. Weighted quoted clean price excludes accrued interest. The 5.40% yield is reported by AFT, not reconstructed from a simple ratio. Coupon markers are schematic, not a count of payment dates.</desc><rect width="440" height="1348" fill="var(--color-ink, #0c0d10)"/><text x="24.000" y="38.000" data-max-width="392.000" font-size="14" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="24.000" dy="0.000">l0g / 05 / OBSERVED TRANSACTION</tspan></text><text x="24.000" y="83.000" data-max-width="392.000" font-size="29" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start"><tspan x="24.000" dy="0.000">The coupon tells only</tspan><tspan x="24.000" dy="33.930">part of the price</tspan></text><text x="24.000" y="148.930" data-max-width="392.000" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="24.000" dy="0.000">2% OAT due 25 May 2048. Auction on 1</tspan><tspan x="24.000" dy="25.650">October 2026, settlement on 5 October.</tspan></text><line x1="24.000" y1="195.580" x2="416.000" y2="195.580" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1"/><text x="24.000" y="235.580" data-max-width="392.000" font-size="17" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start"><tspan x="24.000" dy="0.000">QUOTED INITIAL PRICE</tspan></text><text x="24.000" y="288.580" data-max-width="392.000" font-size="43" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start"><tspan x="24.000" dy="0.000">€57.23</tspan></text><text x="24.000" y="324.580" data-max-width="392.000" font-size="20" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="24.000" dy="0.000">Per €100 face value, excluding</tspan><tspan x="24.000" dy="25.600">accrued interest.</tspan></text><line x1="24.000" y1="375.180" x2="416.000" y2="375.180" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1.5"/><text x="24.000" y="420.180" data-max-width="392.000" font-size="17" font-weight="700" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="start"><tspan x="24.000" dy="0.000">CONTRACTUAL COUPON</tspan></text><text x="24.000" y="473.180" data-max-width="392.000" font-size="43" font-weight="700" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="start"><tspan x="24.000" dy="0.000">€2 a year</tspan></text><text x="24.000" y="509.180" data-max-width="392.000" font-size="20" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="24.000" dy="0.000">Calculated on €100 face value, not on</tspan><tspan x="24.000" dy="25.600">the purchase price.</tspan></text><line x1="24.000" y1="559.780" x2="416.000" y2="559.780" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1.5"/><text x="24.000" y="604.780" data-max-width="392.000" font-size="17" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start"><tspan x="24.000" dy="0.000">PRINCIPAL IN 2048</tspan></text><text x="24.000" y="657.780" data-max-width="392.000" font-size="43" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start"><tspan x="24.000" dy="0.000">€100</tspan></text><text x="24.000" y="693.780" data-max-width="392.000" font-size="20" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="24.000" dy="0.000">Repaid on 25 May 2048, alongside the</tspan><tspan x="24.000" dy="25.600">final coupon.</tspan></text><line x1="24.000" y1="744.380" x2="416.000" y2="744.380" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1.5"/><rect x="24.000" y="789.380" width="392.000" height="176.000" rx="4" fill="var(--color-paper, #e7e9ee)"/><text x="44.000" y="836.380" data-max-width="352.000" font-size="43" font-weight="700" fill="var(--color-ink, #0c0d10)" text-anchor="start"><tspan x="44.000" dy="0.000">5.40%</tspan></text><text x="44.000" y="871.380" data-max-width="352.000" font-size="17" font-weight="700" fill="var(--color-ink, #0c0d10)" text-anchor="start"><tspan x="44.000" dy="0.000">REPORTED AVERAGE YIELD</tspan></text><text x="44.000" y="905.380" data-max-width="352.000" font-size="19" font-weight="400" fill="var(--color-ink, #0c0d10)" text-anchor="start"><tspan x="44.000" dy="0.000">It includes coupons and principal</tspan><tspan x="44.000" dy="24.320">repayment at their scheduled dates.</tspan></text><text x="24.000" y="1006.380" data-max-width="392.000" font-size="21" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start"><tspan x="24.000" dy="0.000">For the Treasury, less cash</tspan><tspan x="24.000" dy="26.880">received per euro of face value</tspan><tspan x="24.000" dy="26.880">makes the principal promised at</tspan><tspan x="24.000" dy="26.880">maturity essential to the</tspan><tspan x="24.000" dy="26.880">comparison.</tspan></text><line x1="24.000" y1="1154.900" x2="416.000" y2="1154.900" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1"/><text x="24.000" y="1183.900" data-max-width="392.000" font-size="16" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="24.000" dy="0.000">Source: AFT auction results, 1 October</tspan><tspan x="24.000" dy="21.120">2026.</tspan></text><text x="24.000" y="1232.020" data-max-width="392.000" font-size="16" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="24.000" dy="0.000">Weighted quoted clean price excludes accrued</tspan><tspan x="24.000" dy="21.120">interest. The 5.40% yield is reported by AFT, not</tspan><tspan x="24.000" dy="21.120">reconstructed from a simple ratio. Coupon</tspan><tspan x="24.000" dy="21.120">markers are schematic, not a count of payment</tspan><tspan x="24.000" dy="21.120">dates.</tspan></text></svg>
