chor="start"><tspan x="124.000" dy="0.000">New coupon</tspan></text><text x="124.000" y="590.230" data-max-width="270.000" font-size="18" font-weight="400" fill="var(--color-signal, #5eead4)" text-anchor="start"><tspan x="124.000" dy="0.000">€10bn to refinance</tspan></text><line x1="260.000" y1="611.230" x2="260.000" y2="633.230" stroke="var(--color-amber, #f5b13d)" stroke-width="2"/><path d="M 255.84398742012667 625.2470456949865 L 260 633.23 L 264.15601257987333 625.2470456949865" stroke="var(--color-amber, #f5b13d)" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="24.000" y="672.230" data-max-width="80.000" font-size="23" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start"><tspan x="24.000" dy="0.000">4–6</tspan></text><rect x="105.000" y="642.230" width="311.000" height="72.000" rx="4" fill="var(--color-surface-2, #171a20)"/><text x="124.000" y="672.230" data-max-width="270.000" font-size="23" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start"><tspan x="124.000" dy="0.000">New coupon</tspan></text><text x="124.000" y="698.230" data-max-width="270.000" font-size="18" font-weight="400" fill="var(--color-signal, #5eead4)" text-anchor="start"><tspan x="124.000" dy="0.000">€10bn to refinance</tspan></text><line x1="260.000" y1="719.230" x2="260.000" y2="741.230" stroke="var(--color-amber, #f5b13d)" stroke-width="2"/><path d="M 255.84398742012667 733.2470456949865 L 260 741.23 L 264.15601257987333 733.2470456949865" stroke="var(--color-amber, #f5b13d)" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="24.000" y="780.230" data-max-width="80.000" font-size="23" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start"><tspan x="24.000" dy="0.000">6–8</tspan></text><rect x="105.000" y="750.230" width="311.000" height="72.000" rx="4" fill="var(--color-surface-2, #171a20)"/><text x="124.000" y="780.230" data-max-width="270.000" font-size="23"