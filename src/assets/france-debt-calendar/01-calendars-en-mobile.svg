color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1.5"/><text x="24.000" y="1129.230" data-max-width="392.000" font-size="34" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start"><tspan x="24.000" dy="0.000">4</tspan></text><text x="24.000" y="1161.230" data-max-width="392.000" font-size="20" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="24.000" dy="0.000">additional refinancings before the final</tspan><tspan x="24.000" dy="25.600">maturity.</tspan></text><line x1="24.000" y1="1221.830" x2="416.000" y2="1221.830" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1.5"/><text x="24.000" y="1264.830" data-max-width="392.000" font-size="34" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start"><tspan x="24.000" dy="0.000">€10bn</tspan></text><text x="24.000" y="1296.830" data-max-width="392.000" font-size="20" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="24.000" dy="0.000">principal repaid in year ten in both</tspan><tspan x="24.000" dy="25.600">strategies.</tspan></text><line x1="24.000" y1="1379.430" x2="416.000" y2="1379.430" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1"/><text x="24.000" y="1408.430" data-max-width="392.000" font-size="16" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="24.000" dy="0.000">Source: l0g calculations, model M1.</tspan></text><text x="24.000" y="1435.430" data-max-width="392.000" font-size="16" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="24.000" dy="0.000">Issuance at par, annual coupons paid from the</tspan><tspan x="24.000" dy="21.120">budget. Gross issuance totals €50bn for the</tspan><tspan x="24.000" dy="21.120">short strategy and €10bn for the long one;</tspan><tspan x="24.000" dy="21.120">outstanding principal stays at €10bn.</tspan></text></svg>
