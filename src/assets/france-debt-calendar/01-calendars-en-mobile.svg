<svg xmlns="http://www.w3.org/2000/svg" width="440" height="1530" viewBox="0 0 440 1530" role="img" aria-labelledby="france-debt-time-debt-1-en-m-title france-debt-time-debt-1-en-m-desc" font-family="DejaVu Sans, Arial, sans-serif" style="width:100%;height:auto"><title id="france-debt-time-debt-1-en-m-title">€10 billion, two calendars</title><desc id="france-debt-time-debt-1-en-m-desc">€10 billion, two calendars. Source: l0g calculations, model M1.. Issuance at par, annual coupons paid from the budget. Gross issuance totals €50bn for the short strategy and €10bn for the long one; outstanding principal stays at €10bn.</desc><rect width="440" height="1530" fill="var(--color-ink, #0c0d10)"/><text x="24.000" y="38.000" data-max-width="392.000" font-size="14" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="24.000" dy="0.000">l0g / 01 / ILLUSTRATIVE MODEL</tspan></text><text x="24.000" y="83.000" data-max-width="392.000" font-size="29" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start"><tspan x="24.000" dy="0.000">€10 billion, two</tspan><tspan x="24.000" dy="33.930">calendars</tspan></text><text x="24.000" y="148.930" data-max-width="392.000" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="24.000" dy="0.000">The same ten-year funding need.</tspan><tspan x="24.000" dy="25.650">Interest and market-return dates</tspan><tspan x="24.000" dy="25.650">change.</tspan></text><line x1="24.000" y1="221.230" x2="416.000" y2="221.230" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1"/><text x="24.000" y="246.230" data-max-width="392.000" font-size="18" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start"><tspan x="24.000" dy="0.000">ONE TEN-YEAR CONTRACT</tspan></text><rect x="24.000" y="264.230" width="392.000" height="80.000" rx="4" fill="var(--color-paper, #e7e9ee)"/><text x="220.000" y="299.230" data-max-width="360.000" font-si