<svg xmlns="http://www.w3.org/2000/svg" width="440" height="1346" viewBox="0 0 440 1346" role="img" aria-labelledby="france-debt-time-debt-6-en-m-title france-debt-time-debt-6-en-m-desc" font-family="DejaVu Sans, Arial, sans-serif" style="width:100%;height:auto"><title id="france-debt-time-debt-6-en-m-title">Maturity shifts the risk between the two sides</title><desc id="france-debt-time-debt-6-en-m-desc">Maturity shifts the risk between the two sides. Source: l0g calculations, model M2. Values per €100 face value.. Annual coupons; no elapsed time or default. A market-value change is not automatically a realised loss. Portfolio risk also depends on other assets and liabilities.</desc><rect width="440" height="1346" fill="var(--color-ink, #0c0d10)"/><text x="24.000" y="38.000" data-max-width="392.000" font-size="14" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="24.000" dy="0.000">l0g / 06 / ILLUSTRATIVE MODEL</tspan></text><text x="24.000" y="83.000" data-max-width="392.000" font-size="29" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start"><tspan x="24.000" dy="0.000">Maturity shifts the risk</tspan><tspan x="24.000" dy="33.930">between the two sides</tspan></text><text x="24.000" y="148.930" data-max-width="392.000" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="24.000" dy="0.000">Two fictional bonds issued at par. Market</tspan><tspan x="24.000" dy="25.650">yields rise immediately by 1 percentage</tspan><tspan x="24.000" dy="25.650">point.</tspan></text><line x1="24.000" y1="221.230" x2="416.000" y2="221.230" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1"/><text x="24.000" y="256.230" data-max-width="392.000" font-size="26" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start"><tspan x="24.000" dy="0.000">2-year bond</tspan></text><text x="24.000" y="290.230" data-max-width="392.000" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="24.000" dy="0.000">3% coupon; yield 3% → 4%.</tspan></text><text x="24.000" y="327.230" data-max-width="392.000" font-size="17" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="24.000" dy="0.000">INVESTOR: MARKET VALUE</tspan></text><rect x="24.000" y="345.230" width="392.000" height="31.000" rx="0" fill="var(--color-surface-2, #171a20)"/><rect x="24.000" y="345.230" width="384.607" height="31.000" rx="0" fill="var(--color-signal, #5eead4)"/><text x="24.000" y="424.230" data-max-width="392.000" font-size="29" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start"><tspan x="24.000" dy="0.000">€100 → €98.11</tspan></text><text x="24.000" y="461.230" data-max-width="392.000" font-size="20" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start"><tspan x="24.000" dy="0.000">Change: -1.89%.</tspan></text><text x="24.000" y="503.230" data-max-width="392.000" font-size="17" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="24.000" dy="0.000">ISSUER: COUPON UNCHANGED</tspan></text><text x="24.000" y="539.230" data-max-width="392.000" font-size="21" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start"><tspan x="24.000" dy="0.000">€3 a year per €100 face value.</tspan><tspan x="24.000" dy="26.880">Principal falls due in 2 years.</tspan></text><line x1="24.000" y1="604.110" x2="416.000" y2="604.110" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="24.000" y="653.110" data-max-width="392.000" font-size="26" font-weight="700" fill="var(--color-down, #ff4d87)" text-anchor="start"><tspan x="24.000" dy="0.000">10-year bond</tspan></text><text x="24.000" y="687.110" data-max-width="392.000" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="24.000" dy="0.000">5% coupon; yield 5% → 6%.</tspan></text><text x="24.000" y="724.110" data-max-width="392.000" font-size="17" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="24.000" dy="0.000">INVESTOR: MARKET VALUE</tspan></text><rect x="24.000" y="742.110" width="392.000" height="31.000" rx="0" fill="var(--color-surface-2, #171a20)"/><rect x="24.000" y="742.110" width="363.148" height="31.000" rx="0" fill="var(--color-down, #ff4d87)"/><text x="24.000" y="821.110" data-max-width="392.000" font-size="29" font-weight="700" fill="var(--color-down, #ff4d87)" text-anchor="start"><tspan x="24.000" dy="0.000">€100 → €92.64</tspan></text><text x="24.000" y="858.110" data-max-width="392.000" font-size="20" font-weight="700" fill="var(--color-down, #ff4d87)" text-anchor="start"><tspan x="24.000" dy="0.000">Change: -7.36%.</tspan></text><text x="24.000" y="900.110" data-max-width="392.000" font-size="17" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="24.000" dy="0.000">ISSUER: COUPON UNCHANGED</tspan></text><text x="24.000" y="936.110" data-max-width="392.000" font-size="21" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start"><tspan x="24.000" dy="0.000">€5 a year per €100 face value.</tspan><tspan x="24.000" dy="26.880">Principal falls due in 10 years.</tspan></text><line x1="24.000" y1="1000.990" x2="416.000" y2="1000.990" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="24.000" y="1049.990" data-max-width="392.000" font-size="22" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start"><tspan x="24.000" dy="0.000">A more volatile market value</tspan><tspan x="24.000" dy="28.160">for the holder can fund a more</tspan><tspan x="24.000" dy="28.160">predictable schedule for the</tspan><tspan x="24.000" dy="28.160">State.</tspan></text><line x1="24.000" y1="1174.470" x2="416.000" y2="1174.470" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1"/><text x="24.000" y="1203.470" data-max-width="392.000" font-size="16" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="24.000" dy="0.000">Source: l0g calculations, model M2. Values</tspan><tspan x="24.000" dy="21.120">per €100 face value.</tspan></text><text x="24.000" y="1251.590" data-max-width="392.000" font-size="16" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="24.000" dy="0.000">Annual coupons; no elapsed time or default. A</tspan><tspan x="24.000" dy="21.120">market-value change is not automatically a</tspan><tspan x="24.000" dy="21.120">realised loss. Portfolio risk also depends on</tspan><tspan x="24.000" dy="21.120">other assets and liabilities.</tspan></text></svg>
