<svg xmlns="http://www.w3.org/2000/svg" width="440" height="1368" viewBox="0 0 440 1368" role="img" aria-labelledby="france-debt-time-debt-6-fr-m-title france-debt-time-debt-6-fr-m-desc" font-family="DejaVu Sans, Arial, sans-serif" style="width:100%;height:auto"><title id="france-debt-time-debt-6-fr-m-title">Le risque change de côté avec la durée</title><desc id="france-debt-time-debt-6-fr-m-desc">Le risque change de côté avec la durée. Source : calculs l0g, modèle M2. Valeurs pour 100 € de nominal.. Coupons annuels, aucun temps écoulé, aucun défaut. La variation de marché n’est pas automatiquement une perte réalisée. Le risque du portefeuille dépend aussi des autres actifs et engagements.</desc><rect width="440" height="1368" fill="var(--color-ink, #0c0d10)"/><text x="24.000" y="38.000" data-max-width="392.000" font-size="14" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="24.000" dy="0.000">l0g / 06 / MODÈLE HYPOTHÉTIQUE</tspan></text><text x="24.000" y="83.000" data-max-width="392.000" font-size="29" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start"><tspan x="24.000" dy="0.000">Le risque change de</tspan><tspan x="24.000" dy="33.930">côté avec la durée</tspan></text><text x="24.000" y="148.930" data-max-width="392.000" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="24.000" dy="0.000">Deux titres fictifs émis au pair. Hausse</tspan><tspan x="24.000" dy="25.650">immédiate du rendement de marché de</tspan><tspan x="24.000" dy="25.650">1 point.</tspan></text><line x1="24.000" y1="221.230" x2="416.000" y2="221.230" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1"/><text x="24.000" y="256.230" data-max-width="392.000" font-size="26" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start"><tspan x="24.000" dy="0.000">Titre à 2 ans</tspan></text><text x="24.000" y="290.230" data-max-width="392.000" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="24.000" dy="0.000">Coupon 3 % ; rendement 3 % → 4 %.</tspan></text><text x="24.000" y="327.230" data-max-width="392.000" font-size="17" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="24.000" dy="0.000">INVESTISSEUR : VALEUR DU TITRE</tspan></text><rect x="24.000" y="345.230" width="392.000" height="31.000" rx="0" fill="var(--color-surface-2, #171a20)"/><rect x="24.000" y="345.230" width="384.607" height="31.000" rx="0" fill="var(--color-signal, #5eead4)"/><text x="24.000" y="424.230" data-max-width="392.000" font-size="29" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start"><tspan x="24.000" dy="0.000">100 € → 98,11 €</tspan></text><text x="24.000" y="461.230" data-max-width="392.000" font-size="20" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start"><tspan x="24.000" dy="0.000">Variation : -1,89 %.</tspan></text><text x="24.000" y="503.230" data-max-width="392.000" font-size="17" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="24.000" dy="0.000">ÉMETTEUR : COUPON INCHANGÉ</tspan></text><text x="24.000" y="539.230" data-max-width="392.000" font-size="21" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start"><tspan x="24.000" dy="0.000">3 € par an pour 100 € de nominal.</tspan><tspan x="24.000" dy="26.880">Le principal revient dans 2 ans.</tspan></text><line x1="24.000" y1="604.110" x2="416.000" y2="604.110" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="24.000" y="653.110" data-max-width="392.000" font-size="26" font-weight="700" fill="var(--color-down, #ff4d87)" text-anchor="start"><tspan x="24.000" dy="0.000">Titre à 10 ans</tspan></text><text x="24.000" y="687.110" data-max-width="392.000" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="24.000" dy="0.000">Coupon 5 % ; rendement 5 % → 6 %.</tspan></text><text x="24.000" y="724.110" data-max-width="392.000" font-size="17" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="24.000" dy="0.000">INVESTISSEUR : VALEUR DU TITRE</tspan></text><rect x="24.000" y="742.110" width="392.000" height="31.000" rx="0" fill="var(--color-surface-2, #171a20)"/><rect x="24.000" y="742.110" width="363.148" height="31.000" rx="0" fill="var(--color-down, #ff4d87)"/><text x="24.000" y="821.110" data-max-width="392.000" font-size="29" font-weight="700" fill="var(--color-down, #ff4d87)" text-anchor="start"><tspan x="24.000" dy="0.000">100 € → 92,64 €</tspan></text><text x="24.000" y="858.110" data-max-width="392.000" font-size="20" font-weight="700" fill="var(--color-down, #ff4d87)" text-anchor="start"><tspan x="24.000" dy="0.000">Variation : -7,36 %.</tspan></text><text x="24.000" y="900.110" data-max-width="392.000" font-size="17" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="24.000" dy="0.000">ÉMETTEUR : COUPON INCHANGÉ</tspan></text><text x="24.000" y="936.110" data-max-width="392.000" font-size="21" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start"><tspan x="24.000" dy="0.000">5 € par an pour 100 € de nominal.</tspan><tspan x="24.000" dy="26.880">Le principal revient dans 10 ans.</tspan></text><line x1="24.000" y1="1000.990" x2="416.000" y2="1000.990" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="24.000" y="1049.990" data-max-width="392.000" font-size="22" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start"><tspan x="24.000" dy="0.000">Une valeur de marché plus</tspan><tspan x="24.000" dy="28.160">volatile pour le porteur peut</tspan><tspan x="24.000" dy="28.160">financer un calendrier plus</tspan><tspan x="24.000" dy="28.160">prévisible pour l’État.</tspan></text><line x1="24.000" y1="1174.470" x2="416.000" y2="1174.470" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1"/><text x="24.000" y="1203.470" data-max-width="392.000" font-size="16" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="24.000" dy="0.000">Source : calculs l0g, modèle M2. Valeurs</tspan><tspan x="24.000" dy="21.120">pour 100 € de nominal.</tspan></text><text x="24.000" y="1251.590" data-max-width="392.000" font-size="16" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start"><tspan x="24.000" dy="0.000">Coupons annuels, aucun temps écoulé, aucun</tspan><tspan x="24.000" dy="21.120">défaut. La variation de marché n’est pas</tspan><tspan x="24.000" dy="21.120">automatiquement une perte réalisée. Le risque</tspan><tspan x="24.000" dy="21.120">du portefeuille dépend aussi des autres actifs et</tspan><tspan x="24.000" dy="21.120">engagements.</tspan></text></svg>
