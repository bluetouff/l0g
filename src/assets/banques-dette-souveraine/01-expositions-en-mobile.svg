aper, #e7e9ee)" text-anchor="start">is core regulatory capital. This ratio is not a loss.</text><line x1="44" y1="1098.07" x2="576" y2="1098.07" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2" opacity="1"/><text x="44.00" y="1136.07" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Source: EBA, Risk Assessment Report, June 2026 (S03).</text><text x="44.00" y="1172.07" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">End-2024 and end-2025 stocks. Sovereign exposures extend</text><text x="44.00" y="1194.87" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">beyond French bonds. Rounded values; net risk sensitivities</text><text x="44.00" y="1217.67" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">are not shown.</text></svg>
