<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1144" viewBox="0 0 1120 1144" role="img" aria-labelledby="sovereign-banks-title-3-en-False sovereign-banks-desc-3-en-False" style="width:100%;height:auto"><title id="sovereign-banks-title-3-en-False">One price, three accounting routes</title><desc id="sovereign-banks-desc-3-en-False">The same market-price decline is recognised differently by accounting category. All remain exposed to the price at which the asset can be sold or pledged.</desc><defs><marker id="sovereign-banks-a71d3c0-3-en-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-signal, #5eead4)"/></marker><marker id="sovereign-banks-aefb879-3-en-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-amber, #f5b13d)"/></marker><marker id="sovereign-banks-af19c90-3-en-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-down, #ff4d87)"/></marker><marker id="sovereign-banks-a9fc6f2-3-en-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-topic-blue, #7aa2f7)"/></marker><marker id="sovereign-banks-aa9b9c7-3-en-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-muted, #8b909b)"/></marker></defs><rect width="1120" height="1144" fill="var(--color-ink, #0c0d10)"/><text x="44.00" y="45.00" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">l0g  /  BANKS &amp; DEBT</text><text x="1076.00" y="45.00" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="end">03</text><text x="44.00" y="109.00" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">One price, three accounting routes</text><text x="44.00" y="148.46" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Debt security · simplified treatment, excluding hedge accounting.</text><rect x="44" y="181.95999999999998" width="1032" height="96" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="66.00" y="215.96" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">A COMMON ECONOMIC SHOCK</text><text x="66.00" y="259.96" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Market value: 100 → 88.13</text><path d="M560 278.96 V317.96 H204 V338.96" fill="none" stroke="var(--color-muted, #8b909b)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sovereign-banks-aa9b9c7-3-en-False)"/><path d="M560 278.96 V338.96" fill="none" stroke="var(--color-muted, #8b909b)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sovereign-banks-aa9b9c7-3-en-False)"/><path d="M560 278.96 V317.96 H916 V338.96" fill="none" stroke="var(--color-muted, #8b909b)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sovereign-banks-aa9b9c7-3-en-False)"/><rect x="44" y="345.96" width="320" height="468" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="66.00" y="392.96" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="start">AC</text><text x="66.00" y="442.96" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Amortised cost</text><text x="66.00" y="496.46" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">The market-rate move</text><text x="66.00" y="527.71" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">alone does not mark</text><text x="66.00" y="558.96" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">down the carrying value.</text><line x1="66" y1="666.96" x2="342" y2="666.96" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2" opacity="1"/><text x="66.00" y="709.96" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Expected credit losses;</text><text x="66.00" y="738.71" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">consequences of a sale.</text><rect x="400" y="345.96" width="320" height="468" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="422.00" y="392.96" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">FVOCI</text><text x="422.00" y="442.96" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Fair value through</text><text x="422.00" y="480.46" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">OCI</text><text x="422.00" y="533.96" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Revaluation in other</text><text x="422.00" y="565.21" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">comprehensive income</text><text x="422.00" y="596.46" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">and equity.</text><line x1="422" y1="666.96" x2="698" y2="666.96" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2" opacity="1"/><text x="422.00" y="709.96" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Interest and credit:</text><text x="422.00" y="738.71" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">separate rules. Adjust</text><text x="422.00" y="767.46" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">prudential effects.</text><rect x="756" y="345.96" width="320" height="468" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="778.00" y="392.96" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">FVPL</text><text x="778.00" y="442.96" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Fair value through</text><text x="778.00" y="480.46" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">profit or loss</text><text x="778.00" y="533.96" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">The change in value</text><text x="778.00" y="565.21" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">enters profit or loss.</text><line x1="778" y1="666.96" x2="1054" y2="666.96" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2" opacity="1"/><text x="778.00" y="709.96" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Match the movement with</text><text x="778.00" y="738.71" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">hedging gains or losses.</text><rect x="44" y="855.96" width="1032" height="125" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-amber, #f5b13d)" stroke-width="2"/><text x="66.00" y="899.96" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">Liquidity still depends on the price that can be realised.</text><text x="66.00" y="941.71" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">On sale or pledge, accounting classification does not set the market price.</text><line x1="44" y1="1020.96" x2="1076" y2="1020.96" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2" opacity="1"/><text x="44.00" y="1056.96" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Sources: IFRS Foundation, HMRC, ECB (S06–S09, S21).</text><text x="44.00" y="1091.46" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Rate example without default. FVOCI interest and credit losses follow separate rules. Net CET1 effects also depend on hedges,</text><text x="44.00" y="1113.06" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">tax and prudential adjustments.</text></svg>
