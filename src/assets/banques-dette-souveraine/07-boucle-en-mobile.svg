<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1934" viewBox="0 0 620 1934" role="img" aria-labelledby="sovereign-banks-title-7-en-True sovereign-banks-desc-7-en-True" style="width:100%;height:auto"><title id="sovereign-banks-title-7-en-True">The feedback can reinforce itself</title><desc id="sovereign-banks-desc-7-en-True">Conditional feedback from sovereign debt to bank constraints, lending and activity, then public finances. Starting conditions: 16% CET1, 154.91% LCR and 2.17% NPL in Q2 2026 for ECB significant institutions.</desc><defs><marker id="sovereign-banks-a71d3c0-7-en-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-signal, #5eead4)"/></marker><marker id="sovereign-banks-aefb879-7-en-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-amber, #f5b13d)"/></marker><marker id="sovereign-banks-af19c90-7-en-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-down, #ff4d87)"/></marker><marker id="sovereign-banks-a9fc6f2-7-en-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-topic-blue, #7aa2f7)"/></marker><marker id="sovereign-banks-aa9b9c7-7-en-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-muted, #8b909b)"/></marker></defs><rect width="620" height="1934" fill="var(--color-ink, #0c0d10)"/><text x="44.00" y="45.00" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">l0g  /  BANKS &amp; DEBT</text><text x="576.00" y="45.00" font-family="Arial, Helvetica, sans-serif" font-size="22" 