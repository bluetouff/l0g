in="round" marker-end="url(#sovereign-banks-aa9b9c7-7-en-True)"/><rect x="70" y="600.17" width="506" height="171" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="92.00" y="645.17" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="start">Lending and activity slow</text><text x="92.00" y="686.42" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Weaker investment, consumption and</text><text x="92.00" y="716.42" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">borrowers.</text><path d="M323 775.17 V803.17" fill="none" stroke="var(--color-muted, #8b909b)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sovereign-banks-aa9b9c7-7-en-True)"/><rect x="70" y="813.17" width="506" height="171" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="92.00" y="858.17" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">Public finances deteriorate</text><text x="92.00" y="899.42" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Slower tax receipts and greater funding</text><text x="92.00" y="929.42" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">needs.</text><path d="M70 897.17 H40 V259.16999999999996 H66" fill="none" stroke="var(--color-amber, #f5b13d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sovereign-banks-aefb879-7-en-True)" stroke-dasharray="7 7"/><text x="44.00" y="1051.17" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">STARTING CONDITIONS BEFORE OCTOBER</text><rect x="44" y="1099.17" width="532" height="131" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="64.00" y="1135.17" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">CET1</text><text x="64.00" y="1194.17" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">16.00%</text><text x="300.00" y="1178.17" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Capital / risk-weighted</text><text x="300.00" y="1205.67" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">assets</text><rect x="44" y="1254.17" width="532" height="131" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="64.00" y="1290.17" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">LCR</text><text x="64.00" y="1349.17" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">154.91%</text><text x="300.00" y="1333.17" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Liquid assets / stressed</text><text x="300.00" y="1360.67" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">net outflows</text><rect x="44" y="1409.17" width="532" height="131" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="64.00" y="1445.17" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">Non-performing loans</text><text x="64.00" y="1504.17" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">2.17%</text><text x="300.00" y="1488.17" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Non-performing share</text><text x="44.00" y="1593.17" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Q2 2026 · significant institutions supervised</text><text x="44.00" y="1623.17" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">by the ECB.</text><text x="44.00" y="1682.17" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Diversification, hedging and liquidity can</text><text x="44.00" y="1713.42" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">interrupt the loop. The ECB’s TPI is conditional.</text><line x1="44" y1="1760.17" x2="576" y2="1760.17" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2" opacity="1"/><text x="44.00" y="1798.17" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Sources: BIS / CGFS (S05); ECB (S15, S17).</text><text x="44.00" y="1834.17" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">End-June aggregates, released 15 September. NPL measure</text><text x="44.00" y="1856.97" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">excludes central bank cash balances and other demand</text><text x="44.00" y="1879.77" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">deposits. Neither a measure of the 7 October shock nor an</text><text x="44.00" y="1902.57" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">individual bank diagnosis.</text></svg>
