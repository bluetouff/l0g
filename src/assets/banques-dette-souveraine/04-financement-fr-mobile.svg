<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1754" viewBox="0 0 620 1754" role="img" aria-labelledby="sovereign-banks-title-4-fr-True sovereign-banks-desc-4-fr-True" style="width:100%;height:auto"><title id="sovereign-banks-title-4-fr-True">Le nouveau taux arrive par échéances</title><desc id="sovereign-banks-desc-4-fr-True">Sur 10 milliards de dette, refinancer 25 % à un coût supérieur d’un point ajoute 25 millions de charge annuelle, et non 100 millions immédiatement. Exemple de Deutsche Bank séparé.</desc><defs><marker id="sovereign-banks-a71d3c0-4-fr-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-signal, #5eead4)"/></marker><marker id="sovereign-banks-aefb879-4-fr-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-amber, #f5b13d)"/></marker><marker id="sovereign-banks-af19c90-4-fr-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-down, #ff4d87)"/></marker><marker id="sovereign-banks-a9fc6f2-4-fr-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-topic-blue, #7aa2f7)"/></marker><marker id="sovereign-banks-aa9b9c7-4-fr-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-muted, #8b909b)"/></marker></defs><rect width="620" height="1754" fill="var(--color-ink, #0c0d10)"/><text x="44.00" y="45.00" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">l0g  /  BANQUES &amp; DETTE</text><text x="576.00" y="45.00" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="end">04</text><text x="44.00" y="101.00" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Le nouveau taux arrive par</text><text x="44.00" y="139.42" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">échéances</text><text x="44.00" y="178.84" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Simulation · 10 Md€ de dette fixe · un quart</text><text x="44.00" y="207.59" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">renouvelé à +100 pb.</text><text x="44.00" y="261.34" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">LE STOCK ET LA TRANCHE REFINANCÉE</text><rect x="44" y="307.34" width="254" height="155" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-amber, #f5b13d)" stroke-width="2"/><text x="62.00" y="355.34" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">2,5 Md€</text><text x="62.00" y="402.34" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Au nouveau taux</text><rect x="322" y="307.34" width="254" height="155" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="340.00" y="355.34" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">2,5 Md€</text><text x="340.00" y="402.34" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Ancien coupon</text><rect x="44" y="486.34" width="254" height="155" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="62.00" y="534.34" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">2,5 Md€</text><text x="62.00" y="581.34" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Ancien coupon</text><rect x="322" y="486.34" width="254" height="155" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="340.00" y="534.34" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">2,5 Md€</text><text x="340.00" y="581.34" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Ancien coupon</text><rect x="44" y="690.3399999999999" width="532" height="225" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-amber, #f5b13d)" stroke-width="2"/><text x="66.00" y="725.34" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">CHARGE ANNUELLE SUPPLÉMENTAIRE</text><text x="66.00" y="790.34" font-family="Arial, Helvetica, sans-serif" font-size="49" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">25 millions d’euros</text><text x="66.00" y="831.59" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">2,5 milliards refinancés × 1 point de taux.</text><text x="44.00" y="981.34" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Le coût de l’année dépend aussi du mois</text><text x="44.00" y="1013.84" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">d’émission.</text><text x="44.00" y="1079.34" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Une dette fixe ancienne garde son coupon. Les</text><text x="44.00" y="1109.34" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">dépôts, les taux variables et les couvertures ont</text><text x="44.00" y="1139.34" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">leurs propres calendriers.</text><line x1="44" y1="1196.34" x2="576" y2="1196.34" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2" opacity="1"/><text x="44.00" y="1244.34" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="start">UN EXEMPLE RÉEL DE PRÉFINANCEMENT</text><rect x="44" y="1286.34" width="532" height="252" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="66.00" y="1332.34" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="start">Deutsche Bank : 9 Md€ déjà émis</text><text x="66.00" y="1373.84" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Au 17 juillet 2026, pour un programme annuel</text><text x="66.00" y="1403.84" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">de 10 à 15 Md€.</text><text x="66.00" y="1441.84" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Ce cas réel est distinct de la simulation ci-dessus.</text><line x1="44" y1="1578.34" x2="576" y2="1578.34" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2" opacity="1"/><text x="44.00" y="1616.34" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Sources : calcul l0g; Deutsche Bank, 30.07.2026,</text><text x="44.00" y="1641.34" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">diapositive 14 (S12).</text><text x="44.00" y="1677.34" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Simulation : régime annuel plein après renouvellement, hors</text><text x="44.00" y="1700.14" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">couvertures, fiscalité, dépôts et variation de bilan. Programme</text><text x="44.00" y="1722.94" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">DB : émissions au 17 juillet, pas besoins restant au 7 octobre.</text></svg>
