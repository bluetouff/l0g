<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1127" viewBox="0 0 1120 1127" role="img" aria-labelledby="sovereign-banks-title-6-fr-False sovereign-banks-desc-6-fr-False" style="width:100%;height:auto"><title id="sovereign-banks-title-6-fr-False">Le taux fixe déplace le choc</title><desc id="sovereign-banks-desc-6-fr-False">Part fixe 99,5 % dans la production de crédit immobilier d’août. Taux moyen hors renégociations 3,27 % en juin, 3,30 % en juillet, 3,32 % en août. Contrats anciens, nouveaux prêts et financement bancaire réagissent à des dates différentes.</desc><defs><marker id="sovereign-banks-a71d3c0-6-fr-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-signal, #5eead4)"/></marker><marker id="sovereign-banks-aefb879-6-fr-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-amber, #f5b13d)"/></marker><marker id="sovereign-banks-af19c90-6-fr-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-down, #ff4d87)"/></marker><marker id="sovereign-banks-a9fc6f2-6-fr-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-topic-blue, #7aa2f7)"/></marker><marker id="sovereign-banks-aa9b9c7-6-fr-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-muted, #8b909b)"/></marker></defs><rect width="1120" height="1127" fill="var(--color-ink, #0c0d10)"/><text x="44.00" y="45.00" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">l0g  /  BANQUES &amp; DETTE</text><text x="1076.00" y="45.00" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="end">06</text><text x="44.00" y="109.00" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Le taux fixe déplace le choc</text><text x="44.00" y="148.46" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">France · nouveaux crédits à l’habitat · août 2026 provisoire.</text><rect x="44" y="181.95999999999998" width="1032" height="140" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="66.00" y="248.96" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">99,5 % à taux fixe</text><text x="66.00" y="299.46" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Part de la production du mois, et non du stock de prêts.</text><text x="44.00" y="383.96" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="start">LE TAUX MOYEN DES NOUVEAUX PRÊTS</text><rect x="44.0" y="407.96" width="332.0" height="139" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="60.00" y="446.96" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Juin</text><text x="60.00" y="509.96" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="start">3,27 %</text><rect x="394.0" y="407.96" width="332.0" height="139" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="410.00" y="446.96" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Juillet</text><text x="410.00" y="509.96" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="start">3,30 %</text><rect x="744.0" y="407.96" width="332.0" height="139" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="760.00" y="446.96" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Août</text><text x="760.00" y="509.96" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="start">3,32 %</text><text x="44.00" y="603.96" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Hors renégociations, frais et assurance.</text><rect x="44" y="638.96" width="320" height="325" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="67.00" y="685.96" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">Prêt fixe déjà signé</text><text x="67.00" y="736.21" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">La mensualité</text><text x="67.00" y="767.46" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">contractuelle demeure</text><text x="67.00" y="798.71" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">stable. Le revenu du</text><text x="67.00" y="829.96" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">ménage peut, lui, se</text><text x="67.00" y="861.21" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">dégrader.</text><rect x="400" y="638.96" width="320" height="325" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="423.00" y="685.96" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="start">Nouveau crédit</text><text x="423.00" y="736.21" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Le taux proposé suit</text><text x="423.00" y="767.46" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">progressivement les</text><text x="423.00" y="798.71" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">conditions de</text><text x="423.00" y="829.96" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">financement et la</text><text x="423.00" y="861.21" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">concurrence.</text><rect x="756" y="638.96" width="320" height="325" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="779.00" y="685.96" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">Bilan de la banque</text><text x="779.00" y="736.21" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Les ressources se</text><text x="779.00" y="767.46" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">renouvellent à leur</text><text x="779.00" y="798.71" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">rythme. Les couvertures</text><text x="779.00" y="829.96" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">gèrent l’écart avec les</text><text x="779.00" y="861.21" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">actifs.</text><line x1="44" y1="1003.96" x2="1076" y2="1003.96" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2" opacity="1"/><text x="44.00" y="1039.96" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Source : Banque de France, publication du 06.10.2026 (S14).</text><text x="44.00" y="1074.46" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">99,5 % : flux non CVS, renégociations incluses, crédits relais exclus. Taux moyens : hors renégociations, frais et assurance.</text><text x="44.00" y="1096.06" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Deux périmètres statistiques distincts. Mécanisme des contrats à taux fixe.</text></svg>
