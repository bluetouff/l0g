<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1144" viewBox="0 0 1120 1144" role="img" aria-labelledby="sovereign-banks-title-3-fr-False sovereign-banks-desc-3-fr-False" style="width:100%;height:auto"><title id="sovereign-banks-title-3-fr-False">Un prix, trois chemins comptables</title><desc id="sovereign-banks-desc-3-fr-False">La même baisse de valeur de marché se transmet différemment selon la catégorie comptable. Toutes restent exposées au prix de réalisation ou de mobilisation du collatéral.</desc><defs><marker id="sovereign-banks-a71d3c0-3-fr-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-signal, #5eead4)"/></marker><marker id="sovereign-banks-aefb879-3-fr-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-amber, #f5b13d)"/></marker><marker id="sovereign-banks-af19c90-3-fr-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-down, #ff4d87)"/></marker><marker id="sovereign-banks-a9fc6f2-3-fr-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-topic-blue, #7aa2f7)"/></marker><marker id="sovereign-banks-aa9b9c7-3-fr-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-muted, #8b909b)"/></marker></defs><rect width="1120" height="1144" fill="var(--color-ink, #0c0d10)"/><text x="44.00" y="45.00" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">l0g  /  BANQUES &amp; DETTE</text><text x="1076.00" y="45.00" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="end">03</text><text x="44.00" y="109.00" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Un prix, trois chemins comptables</text><text x="44.00" y="148.46" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Titre de dette · lecture simplifiée, hors comptabilité de couverture.</text><rect x="44" y="181.95999999999998" width="1032" height="96" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="66.00" y="215.96" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">CHOC ÉCONOMIQUE COMMUN</text><text x="66.00" y="259.96" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Valeur de marché : 100 → 88,13</text><path d="M560 278.96 V317.96 H204 V338.96" fill="none" stroke="var(--color-muted, #8b909b)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sovereign-banks-aa9b9c7-3-fr-False)"/><path d="M560 278.96 V338.96" fill="none" stroke="var(--color-muted, #8b909b)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sovereign-banks-aa9b9c7-3-fr-False)"/><path d="M560 278.96 V317.96 H916 V338.96" fill="none" stroke="var(--color-muted, #8b909b)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sovereign-banks-aa9b9c7-3-fr-False)"/><rect x="44" y="345.96" width="320" height="468" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="66.00" y="392.96" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="start">AC</text><text x="66.00" y="442.96" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Coût amorti</text><text x="66.00" y="496.46" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Valeur comptable peu</text><text x="66.00" y="527.71" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">sensible au seul taux de</text><text x="66.00" y="558.96" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">marché.</text><line x1="66" y1="666.96" x2="342" y2="666.96" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2" opacity="1"/><text x="66.00" y="709.96" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Pertes de crédit attendues;</text><text x="66.00" y="738.71" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">effet d’une vente.</text><rect x="400" y="345.96" width="320" height="468" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="422.00" y="392.96" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">FVOCI</text><text x="422.00" y="442.96" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Juste valeur par</text><text x="422.00" y="480.46" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">OCI</text><text x="422.00" y="533.96" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Réévaluation dans les</text><text x="422.00" y="565.21" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">autres éléments du</text><text x="422.00" y="596.46" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">résultat global et les</text><text x="422.00" y="627.71" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">capitaux propres.</text><line x1="422" y1="666.96" x2="698" y2="666.96" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2" opacity="1"/><text x="422.00" y="709.96" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Intérêts et crédit : règles</text><text x="422.00" y="738.71" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">propres. Effet prudentiel à</text><text x="422.00" y="767.46" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">retraiter.</text><rect x="756" y="345.96" width="320" height="468" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="778.00" y="392.96" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">FVPL</text><text x="778.00" y="442.96" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Juste valeur par</text><text x="778.00" y="480.46" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">résultat</text><text x="778.00" y="533.96" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">La variation de valeur</text><text x="778.00" y="565.21" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">traverse le résultat.</text><line x1="778" y1="666.96" x2="1054" y2="666.96" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2" opacity="1"/><text x="778.00" y="709.96" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Rapprocher les gains ou</text><text x="778.00" y="738.71" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">pertes des couvertures.</text><rect x="44" y="855.96" width="1032" height="125" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-amber, #f5b13d)" stroke-width="2"/><text x="66.00" y="899.96" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">La liquidité regarde toujours le prix mobilisable.</text><text x="66.00" y="941.71" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Vente ou garantie : la classification comptable ne fixe pas le prix de marché.</text><line x1="44" y1="1020.96" x2="1076" y2="1020.96" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2" opacity="1"/><text x="44.00" y="1056.96" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Sources : IFRS Foundation, HMRC, BCE (S06–S09, S21).</text><text x="44.00" y="1091.46" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Exemple de taux, sans défaut. Pour FVOCI, intérêts et pertes de crédit suivent leurs règles. Les effets nets sur CET1 dépendent</text><text x="44.00" y="1113.06" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">aussi des couvertures, impôts et ajustements prudentiels.</text></svg>
