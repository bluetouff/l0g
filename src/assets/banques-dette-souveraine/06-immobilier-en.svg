<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1127" viewBox="0 0 1120 1127" role="img" aria-labelledby="sovereign-banks-title-6-en-False sovereign-banks-desc-6-en-False" style="width:100%;height:auto"><title id="sovereign-banks-title-6-en-False">Fixed rates shift the timing of the shock</title><desc id="sovereign-banks-desc-6-en-False">Fixed-rate share of August housing loan production is 99.5%. Average new loan rates excluding renegotiations are 3.27% in June, 3.30% in July and 3.32% in August. Existing contracts, new loans and bank funding adjust at different times.</desc><defs><marker id="sovereign-banks-a71d3c0-6-en-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-signal, #5eead4)"/></marker><marker id="sovereign-banks-aefb879-6-en-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-amber, #f5b13d)"/></marker><marker id="sovereign-banks-af19c90-6-en-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-down, #ff4d87)"/></marker><marker id="sovereign-banks-a9fc6f2-6-en-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-topic-blue, #7aa2f7)"/></marker><marker id="sovereign-banks-aa9b9c7-6-en-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-muted, #8b909b)"/></marker></defs><rect width="1120" height="1127" fill="var(--color-ink, #0c0d10)"/><text x="44.00" y="45.00" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">l0g  /  BANKS &amp; DEBT</text><text x="1076.00" y="45.00" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="end">06</text><text x="44.00" y="109.00" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Fixed rates shift the timing of the shock</text><text x="44.00" y="148.46" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">France · new housing credit · provisional August 2026 data.</text><rect x="44" y="181.95999999999998" width="1032" height="140" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="66.00" y="248.96" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">99.5% fixed-rate</text><text x="66.00" y="299.46" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Share of the month’s new lending, not of outstanding loans.</text><text x="44.00" y="383.96" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="start">AVERAGE INTEREST RATE ON NEW LOANS</text><rect x="44.0" y="407.96" width="332.0" height="139" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="60.00" y="446.96" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">June</text><text x="60.00" y="509.96" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="start">3.27%</text><rect x="394.0" y="407.96" width="332.0" height="139" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="410.00" y="446.96" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">July</text><text x="410.00" y="509.96" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="start">3.30%</text><rect x="744.0" y="407.96" width="332.0" height="139" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="760.00" y="446.96" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">August</text><text x="760.00" y="509.96" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="start">3.32%</text><text x="44.00" y="603.96" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Excluding renegotiations, fees and insurance.</text><rect x="44" y="638.96" width="320" height="325" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="67.00" y="685.96" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">Existing fixed-rate</text><text x="67.00" y="722.21" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">loan</text><text x="67.00" y="772.46" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">The contractual</text><text x="67.00" y="803.71" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">instalment stays</text><text x="67.00" y="834.96" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">unchanged. Household</text><text x="67.00" y="866.21" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">income can still</text><text x="67.00" y="897.46" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">deteriorate.</text><rect x="400" y="638.96" width="320" height="325" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="423.00" y="685.96" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="start">New borrowing</text><text x="423.00" y="736.21" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">The offered rate</text><text x="423.00" y="767.46" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">gradually reflects</text><text x="423.00" y="798.71" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">funding conditions and</text><text x="423.00" y="829.96" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">competition.</text><rect x="756" y="638.96" width="320" height="325" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="779.00" y="685.96" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">The bank’s balance</text><text x="779.00" y="722.21" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">sheet</text><text x="779.00" y="772.46" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Funding reprices on its</text><text x="779.00" y="803.71" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">own schedule. Hedges</text><text x="779.00" y="834.96" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">manage the mismatch</text><text x="779.00" y="866.21" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">with assets.</text><line x1="44" y1="1003.96" x2="1076" y2="1003.96" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2" opacity="1"/><text x="44.00" y="1039.96" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Source: Banque de France, released 6 Oct 2026 (S14).</text><text x="44.00" y="1074.46" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">99.5%: unadjusted new lending, including renegotiations and excluding bridge loans. Average rates exclude renegotiations, fees</text><text x="44.00" y="1096.06" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">and insurance. Different statistical scopes; fixed-rate contract mechanism.</text></svg>
