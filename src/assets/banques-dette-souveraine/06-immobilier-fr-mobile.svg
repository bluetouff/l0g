-color-paper, #e7e9ee)" text-anchor="start">La mensualité contractuelle demeure</text><text x="66.00" y="870.42" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">stable. Le revenu du ménage peut, lui, se</text><text x="66.00" y="901.67" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">dégrader.</text><rect x="44" y="971.92" width="532" height="200" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="66.00" y="1017.92" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="start">Nouveau crédit</text><text x="66.00" y="1063.17" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Le taux proposé suit progressivement les</text><text x="66.00" y="1094.42" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">conditions de financement et la</text><text x="66.00" y="1125.67" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">concurrence.</text><rect x="44" y="1195.92" width="532" height="200" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="66.00" y="1241.92" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">Bilan de la banque</text><text x="66.00" y="1287.17" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Les ressources se renouvellent à leur</text><text x="66.00" y="1318.42" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">rythme. Les couvertures gèrent l’écart avec</text><text x="66.00" y="1349.67" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">les actifs.</text><line x1="44" y1="1435.92" x2="576" y2="1435.92" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2" opacity="1"/><text x="44.00" y="1473.92" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Source : Banque de France, publication du 06.10.2026</text><text x="44.00" y="1498.92" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">(S14).</text><text x="44.00" y="1534.92" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">99,5 % : flux non CVS, renégociations incluses, crédits relais</text><text x="44.00" y="1557.72" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">exclus. Taux moyens : hors renégociations, frais et assurance.</text><text x="44.00" y="1580.52" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Deux périmètres statistiques distincts. Mécanisme des contrats</text><text x="44.00" y="1603.32" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">à taux fixe.</text></svg>
