<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1635" viewBox="0 0 620 1635" role="img" aria-labelledby="sovereign-banks-title-6-fr-True sovereign-banks-desc-6-fr-True" style="width:100%;height:auto"><title id="sovereign-banks-title-6-fr-True">Le taux fixe déplace le choc</title><desc id="sovereign-banks-desc-6-fr-True">Part fixe 99,5 % dans la production de crédit immobilier d’août. Taux moyen hors renégociations 3,27 % en juin, 3,30 % en juillet, 3,32 % en août. Contrats anciens, nouveaux prêts et financement bancaire réagissent à des dates différentes.</desc><defs><marker id="sovereign-banks-a71d3c0-6-fr-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-signal, #5eead4)"/></marker><marker id="sovereign-banks-aefb879-6-fr-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-amber, #f5b13d)"/></marker><marker id="sovereign-banks-af19c90-6-fr-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-down, #ff4d87)"/></marker><marker id="sovereign-banks-a9fc6f2-6-fr-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-topic-blue, #7aa2f7)"/></marker><marker id="sovereign-banks-aa9b9c7-6-fr-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-muted, #8b909b)"/></marker></defs><rect width="620" height="1635" fill="var(--color-ink, #0c0d10)"/><text x="44.00" y="45.00" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">l0g  /  BANQUES &amp; DETTE</text><text x="576.00" y="45.00" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="end">06</text><text x="44.00" y="101.00" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Le taux fixe déplace le choc</text><text x="44.00" y="140.42" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">France · nouveaux crédits à l’habitat · août 2026</text><text x="44.00" y="169.17" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">provisoire.</text><rect x="44" y="202.92" width="532" height="174" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="66.00" y="269.92" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">99,5 % à taux fixe</text><text x="66.00" y="320.42" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Part de la production du mois, et non du</text><text x="66.00" y="351.67" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">stock de prêts.</text><text x="44.00" y="438.92" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="start">LE TAUX MOYEN DES NOUVEAUX PRÊTS</text><rect x="44.0" y="483.91999999999996" width="165.33333333333334" height="139" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="60.00" y="522.92" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start"