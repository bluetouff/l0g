9ee)" text-anchor="start">dénominateur est le capital de meilleure qualité.</text><text x="44.00" y="1071.92" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Ce ratio n’est pas une perte.</text><line x1="44" y1="1118.4" x2="576" y2="1118.4" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2" opacity="1"/><text x="44.00" y="1156.40" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Source : EBA, Risk Assessment Report, juin 2026 (S03).</text><text x="44.00" y="1192.40" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Stocks fin 2024 et fin 2025. Expositions souveraines :</text><text x="44.00" y="1215.20" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">périmètre plus large que les seules obligations françaises.</text><text x="44.00" y="1238.00" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Montants arrondis; sensibilités nettes non représentées.</text></svg>
