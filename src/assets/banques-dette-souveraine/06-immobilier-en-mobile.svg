<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1648" viewBox="0 0 620 1648" role="img" aria-labelledby="sovereign-banks-title-6-en-True sovereign-banks-desc-6-en-True" style="width:100%;height:auto"><title id="sovereign-banks-title-6-en-True">Fixed rates shift the timing of the shock</title><desc id="sovereign-banks-desc-6-en-True">Fixed-rate share of August housing loan production is 99.5%. Average new loan rates excluding renegotiations are 3.27% in June, 3.30% in July and 3.32% in August. Existing contracts, new loans and bank funding adjust at different times.</desc><defs><marker id="sovereign-banks-a71d3c0-6-en-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-signal, #5eead4)"/></marker><marker id="sovereign-banks-aefb879-6-en-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-amber, #f5b13d)"/></marker><marker id="sovereign-banks-af19c90-6-en-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-down, #ff4d87)"/></marker><marker id="sovereign-banks-a9fc6f2-6-en-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-topic-blue, #7aa2f7)"/></marker><marker id="sovereign-banks-aa9b9c7-6-en-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-muted, #8b909b)"/></marker></defs><rect width="620" height="1648" fill="var(--color-ink, #0c0d10)"/><text x="44.00" y="45.00" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">l0g  /  BANKS &amp; DEBT</text><text x="576.00" y="45.00" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="end">06</text><text x="44.00" y="101.00" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Fixed rates shift the timing of</text><text x="44.00" y="139.42" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">the shock</text><text x="44.00" y="178.84" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">France · new housing credit · provisional August</text><text x="44.00" y="207.59" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">2026 data.</text><rect x="44" y="241.33999999999997" width="532" height="174" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="66.00" y="308.34" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">99.5% fixed-rate</text><text x="66.00" y="358.84" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Share of the month’s new lending, not of</text><text x="66.00" y="390.09" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">outstanding loans.</text><text x="44.00" y="477.34" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="start">AVERAGE INTEREST RATE ON NEW LOANS</text><rect x="44.0" y="522.3399999999999" width="165.33333333333334" height="139" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="60.00" y="561.34" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">June</text><text x="60.00" y="616.34" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="start">3.27%</text><rect x="227.33333333333334" y="522.3399999999999" width="165.33333333333334" height="139" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="243.33" y="561.34" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">July</text><text x="243.33" y="616.34" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="start">3.30%</text><rect x="410.6666666666667" y="522.3399999999999" width="165.33333333333334" height="139" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="426.67" y="561.34" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">August</text><text x="426.67" y="616.34" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="start">3.32%</text><text x="44.00" y="718.34" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Excluding renegotiations, fees and insurance.</text><rect x="44" y="786.3399999999999" width="532" height="200" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="66.00" y="832.34" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">Existing fixed-rate loan</text><text x="66.00" y="877.59" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">The contractual instalment stays</text><text x="66.00" y="908.84" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">unchanged. Household income can still</text><text x="66.00" y="940.09" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">deteriorate.</text><rect x="44" y="1010.3399999999999" width="532" height="200" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="66.00" y="1056.34" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="start">New borrowing</text><text x="66.00" y="1101.59" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">The offered rate gradually reflects funding</text><text x="66.00" y="1132.84" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">conditions and competition.</text><rect x="44" y="1234.34" width="532" height="200" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="66.00" y="1280.34" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">The bank’s balance sheet</text><text x="66.00" y="1325.59" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Funding reprices on its own schedule.</text><text x="66.00" y="1356.84" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Hedges manage the mismatch with assets.</text><line x1="44" y1="1474.34" x2="576" y2="1474.34" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2" opacity="1"/><text x="44.00" y="1512.34" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Source: Banque de France, released 6 Oct 2026 (S14).</text><text x="44.00" y="1548.34" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">99.5%: unadjusted new lending, including renegotiations and</text><text x="44.00" y="1571.14" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">excluding bridge loans. Average rates exclude renegotiations,</text><text x="44.00" y="1593.94" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">fees and insurance. Different statistical scopes; fixed-rate</text><text x="44.00" y="1616.74" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">contract mechanism.</text></svg>
