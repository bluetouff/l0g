<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1669" viewBox="0 0 620 1669" role="img" aria-labelledby="sovereign-banks-title-3-fr-True sovereign-banks-desc-3-fr-True" style="width:100%;height:auto"><title id="sovereign-banks-title-3-fr-True">Un prix, trois chemins comptables</title><desc id="sovereign-banks-desc-3-fr-True">La même baisse de valeur de marché se transmet différemment selon la catégorie comptable. Toutes restent exposées au prix de réalisation ou de mobilisation du collatéral.</desc><defs><marker id="sovereign-banks-a71d3c0-3-fr-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-signal, #5eead4)"/></marker><marker id="sovereign-banks-aefb879-3-fr-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-amber, #f5b13d)"/></marker><marker id="sovereign-banks-af19c90-3-fr-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-down, #ff4d87)"/></marker><marker id="sovereign-banks-a9fc6f2-3-fr-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-topic-blue, #7aa2f7)"/></marker><marker id="sovereign-banks-aa9b9c7-3-fr-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-muted, #8b909b)"/></marker></defs><rect width="620" height="1669" fill="var(--color-ink, #0c0d10)"/><text x="44.00" y="45.00" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">l0g  /  BANQUES &amp; DETTE</text><text x="576.00" y="45.00" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="end">03</text><text x="44.00" y="101.00" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Un prix, trois chemins</text><text x="44.00" y="139.42" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">comptables</text><text x="44.00" y="178.84" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Titre de dette · lecture simplifiée, hors comptabilité</text><text x="44.00" y="207.59" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">de couverture.</text><rect x="44" y="241.33999999999997" width="532" height="120" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="66.00" y="275.34" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">CHOC ÉCONOMIQUE COMMUN</text><text x="66.00" y="319.34" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Valeur de marché : 100 → 88,13</text><rect x="44" y="399.34" width="532" height="262" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="66.00" y="439.34" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="start">AC</text><text x="66.00" y="483.34" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Coût amorti</text><text x="66.00" y="528.34" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Valeur comptable peu sensible au seul taux</text><text x="66.00" y="558.34" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">de marché.</text><text x="66.00" y="596.34" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Pertes de crédit attendues; effet d’une vente.</text><rect x="44" y="686.3399999999999" width="532" height="262" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="66.00" y="726.34" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">FVOCI</text><text x="66.00" y="770.34" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Juste valeur par OCI</text><text x="66.00" y="815.34" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Réévaluation dans les autres éléments du</text><text x="66.00" y="845.34" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">résultat global et les capitaux propres.</text><text x="66.00" y="883.34" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Intérêts et crédit : règles propres. Effet prudentiel</text><text x="66.00" y="910.84" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">à retraiter.</text><rect x="44" y="973.3399999999999" width="532" height="262" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="66.00" y="1013.34" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">FVPL</text><text x="66.00" y="1057.34" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Juste valeur par résultat</text><text x="66.00" y="1102.34" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">La variation de valeur traverse le résultat.</text><text x="66.00" y="1140.34" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Rapprocher les gains ou pertes des couvertures.</text><rect x="44" y="1270.34" width="532" height="185" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-amber, #f5b13d)" stroke-width="2"/><text x="66.00" y="1314.34" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">La liquidité regarde toujours le prix</text><text x="66.00" y="1348.09" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">mobilisable.</text><text x="66.00" y="1389.84" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Vente ou garantie : la classification comptable</text><text x="66.00" y="1418.59" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">ne fixe pas le prix de marché.</text><line x1="44" y1="1495.34" x2="576" y2="1495.34" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2" opacity="1"/><text x="44.00" y="1533.34" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Sources : IFRS Foundation, HMRC, BCE (S06–S09, S21).</text><text x="44.00" y="1569.34" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Exemple de taux, sans défaut. Pour FVOCI, intérêts et pertes</text><text x="44.00" y="1592.14" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">de crédit suivent leurs règles. Les effets nets sur CET1</text><text x="44.00" y="1614.94" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">dépendent aussi des couvertures, impôts et ajustements</text><text x="44.00" y="1637.74" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">prudentiels.</text></svg>
