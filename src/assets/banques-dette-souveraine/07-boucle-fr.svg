text x="68.00" y="623.96" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">besoins de financement accrus.</text><path d="M504 281.96 H612" fill="none" stroke="var(--color-amber, #f5b13d)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sovereign-banks-aefb879-7-fr-False)"/><path d="M850 388.96 V441.96" fill="none" stroke="var(--color-down, #ff4d87)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sovereign-banks-af19c90-7-fr-False)"/><path d="M615 552.96 H507" fill="none" stroke="var(--color-topic-blue, #7aa2f7)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sovereign-banks-a9fc6f2-7-fr-False)"/><path d="M270 443.96 V388.96" fill="none" stroke="var(--color-signal, #5eead4)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sovereign-banks-a71d3c0-7-fr-False)" stroke-dasharray="7 7"/><text x="44.00" y="722.96" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">LE POINT DE DÉPART AVANT OCTOBRE</text><rect x="44" y="748.96" width="320" height="191" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="64.00" y="787.96" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">CET1</text><text x="64.00" y="856.96" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">16,00 %</text><text x="64.00" y="894.96" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Capital / actifs pondérés</text><rect x="400" y="748.96" width="320" height="191" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="420.00" y="787.96" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">LCR</text><text x="420.00" y="856.96" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">154,91 %</text><text x="420.00" y="894.96" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Liquidité / sorties nettes en</text><text x="420.00" y="921.21" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">stress</text><rect x="756" y="748.96" width="320" height="191" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="776.00" y="787.96" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">Prêts non performants</text><text x="776.00" y="856.96" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">2,17 %</text><text x="776.00" y="894.96" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Part des prêts dégradés</text><text x="44.00" y="997.96" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">T2 2026 · établissements importants supervisés par la BCE.</text><text x="44.00" y="1056.96" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">La diversification, les couvertures et la liquidité peuvent freiner le circuit. Le TPI de la BCE</text><text x="44.00" y="1088.21" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">est conditionnel.</text><line x1="44" y1="1134.96" x2="1076" y2="1134.96" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2" opacity="1"/><text x="44.00" y="1170.96" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Sources : BIS / CGFS (S05); BCE (S15, S17).</text><text x="44.00" y="1205.46" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Ratios agrégés à fin juin, publiés le 15 septembre. NPL : hors disponibilités de banque centrale et autres dépôts à vue. Ni mesure</text><text x="44.00" y="1227.06" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">du choc du 7 octobre, ni diagnostic individuel.</text></svg>
