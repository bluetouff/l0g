r(--color-paper, #e7e9ee)" text-anchor="start">Recettes moins dynamiques et besoins de</text><text x="92.00" y="958.17" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">financement accrus.</text><path d="M70 925.92 H40 V287.91999999999996 H66" fill="none" stroke="var(--color-amber, #f5b13d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sovereign-banks-aefb879-7-fr-True)" stroke-dasharray="7 7"/><text x="44.00" y="1079.92" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">LE POINT DE DÉPART AVANT OCTOBRE</text><rect x="44" y="1127.92" width="532" height="131" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="64.00" y="1163.92" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">CET1</text><text x="64.00" y="1222.92" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">16,00 %</text><text x="300.00" y="1206.92" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Capital / actifs pondérés</text><rect x="44" y="1282.92" width="532" height="131" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="64.00" y="1318.92" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">LCR</text><text x="64.00" y="1377.92" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">154,91 %</text><text x="300.00" y="1361.92" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Liquidité / sorties nettes</text><text x="300.00" y="1389.42" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">en stress</text><rect x="44" y="1437.92" width="532" height="131" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="64.00" y="1473.92" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">Prêts non performants</text><text x="64.00" y="1532.92" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">2,17 %</text><text x="300.00" y="1516.92" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Part des prêts dégradés</text><text x="44.00" y="1621.92" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">T2 2026 · établissements importants</text><text x="44.00" y="1651.92" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">supervisés par la BCE.</text><text x="44.00" y="1710.92" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">La diversification, les couvertures et la liquidité</text><text x="44.00" y="1742.17" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">peuvent freiner le circuit. Le TPI de la BCE est</text><text x="44.00" y="1773.42" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">conditionnel.</text><line x1="44" y1="1820.17" x2="576" y2="1820.17" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2" opacity="1"/><text x="44.00" y="1858.17" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Sources : BIS / CGFS (S05); BCE (S15, S17).</text><text x="44.00" y="1894.17" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Ratios agrégés à fin juin, publiés le 15 septembre. NPL : hors</text><text x="44.00" y="1916.97" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">disponibilités de banque centrale et autres dépôts à vue. Ni</text><text x="44.00" y="1939.77" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">mesure du choc du 7 octobre, ni diagnostic individuel.</text></svg>
