<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1716" viewBox="0 0 620 1716" role="img" aria-labelledby="sovereign-banks-title-4-en-True sovereign-banks-desc-4-en-True" style="width:100%;height:auto"><title id="sovereign-banks-title-4-en-True">The new rate arrives at maturity</title><desc id="sovereign-banks-desc-4-en-True">Refinancing 25% of €10bn at a rate one point higher adds €25m of annual interest expense, not €100m immediately. Deutsche Bank’s reported prefunding is shown separately.</desc><defs><marker id="sovereign-banks-a71d3c0-4-en-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-signal, #5eead4)"/></marker><marker id="sovereign-banks-aefb879-4-en-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-amber, #f5b13d)"/></marker><marker id="sovereign-banks-af19c90-4-en-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-down, #ff4d87)"/></marker><marker id="sovereign-banks-a9fc6f2-4-en-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-topic-blue, #7aa2f7)"/></marker><marker id="sovereign-banks-aa9b9c7-4-en-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-muted, #8b909b)"/></marker></defs><rect width="620" height="1716" fill="var(--color-ink, #0c0d10)"/><text x="44.00" y="45.00" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">l0g  /  BANKS &amp; DEBT</text><text x="576.00" y="45.00" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="end">04</text><text x="44.00" y="101.00" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">The new rate arrives at maturity</text><text x="44.00" y="140.42" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Illustration · €10bn fixed-rate debt · one quarter</text><text x="44.00" y="169.17" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">refinanced at +100bp.</text><text x="44.00" y="222.92" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">THE DEBT STOCK AND THE REFINANCED TRANCHE</text><rect x="44" y="268.91999999999996" width="254" height="155" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-amber, #f5b13d)" stroke-width="2"/><text x="62.00" y="316.92" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">€2.5bn</text><text x="62.00" y="363.92" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">At the new rate</text><rect x="322" y="268.91999999999996" width="254" height="155" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="340.00" y="316.92" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">€2.5bn</text><text x="340.00" y="363.92" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Old coupon</text><rect x="44" y="447.91999999999996" width="254" height="155" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="62.00" y="495.92" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">€2.5bn</text><text x="62.00" y="542.92" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Old coupon</text><rect x="322" y="447.91999999999996" width="254" height="155" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="340.00" y="495.92" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">€2.5bn</text><text x="340.00" y="542.92" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Old coupon</text><rect x="44" y="651.92" width="532" height="225" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-amber, #f5b13d)" stroke-width="2"/><text x="66.00" y="686.92" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">ADDITIONAL ANNUAL INTEREST EXPENSE</text><text x="66.00" y="751.92" font-family="Arial, Helvetica, sans-serif" font-size="49" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">€25 million</text><text x="66.00" y="793.17" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">€2.5bn refinanced × a 1 percentage point</text><text x="66.00" y="821.92" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">increase.</text><text x="44.00" y="942.92" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">First-year expense also depends on the</text><text x="44.00" y="975.42" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">issuance month.</text><text x="44.00" y="1040.92" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Old fixed-rate debt keeps its coupon. Deposits,</text><text x="44.00" y="1070.92" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">floating-rate debt and hedges have their own</text><text x="44.00" y="1100.92" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">repricing schedules.</text><line x1="44" y1="1157.92" x2="576" y2="1157.92" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2" opacity="1"/><text x="44.00" y="1205.92" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="start">A REPORTED EXAMPLE OF PREFUNDING</text><rect x="44" y="1247.92" width="532" height="252" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="66.00" y="1293.92" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="start">Deutsche Bank: €9bn already</text><text x="66.00" y="1331.42" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="start">issued</text><text x="66.00" y="1372.92" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">By 17 July 2026, against a full-year €10–15bn</text><text x="66.00" y="1402.92" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">programme.</text><text x="66.00" y="1440.92" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">This reported case is separate from the illustration</text><text x="66.00" y="1468.42" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">above.</text><line x1="44" y1="1539.92" x2="576" y2="1539.92" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2" opacity="1"/><text x="44.00" y="1577.92" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Sources: l0g calculation; Deutsche Bank, 30 Jul 2026, slide</text><text x="44.00" y="1602.92" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">14 (S12).</text><text x="44.00" y="1638.92" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Model: full-year run rate after refinancing, excluding hedges,</text><text x="44.00" y="1661.72" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">tax, deposits and balance-sheet changes. DB issuance is as of</text><text x="44.00" y="1684.52" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">17 July, not remaining needs on 7 October.</text></svg>
