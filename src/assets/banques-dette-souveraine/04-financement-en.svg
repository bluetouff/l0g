<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1205" viewBox="0 0 1120 1205" role="img" aria-labelledby="sovereign-banks-title-4-en-False sovereign-banks-desc-4-en-False" style="width:100%;height:auto"><title id="sovereign-banks-title-4-en-False">The new rate arrives at maturity</title><desc id="sovereign-banks-desc-4-en-False">Refinancing 25% of €10bn at a rate one point higher adds €25m of annual interest expense, not €100m immediately. Deutsche Bank’s reported prefunding is shown separately.</desc><defs><marker id="sovereign-banks-a71d3c0-4-en-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-signal, #5eead4)"/></marker><marker id="sovereign-banks-aefb879-4-en-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-amber, #f5b13d)"/></marker><marker id="sovereign-banks-af19c90-4-en-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-down, #ff4d87)"/></marker><marker id="sovereign-banks-a9fc6f2-4-en-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-topic-blue, #7aa2f7)"/></marker><marker id="sovereign-banks-aa9b9c7-4-en-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-muted, #8b909b)"/></marker></defs><rect width="1120" height="1205" fill="var(--color-ink, #0c0d10)"/><text x="44.00" y="45.00" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">l0g  /  BANKS &amp; DEBT</text><text x="1076.00" y="45.00" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="end">04</text><text x="44.00" y="109.00" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">The new rate arrives at maturity</text><text x="44.00" y="148.46" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Illustration · €10bn fixed-rate debt · one quarter refinanced at +100bp.</text><text x="44.00" y="201.96" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">THE DEBT STOCK AND THE REFINANCED TRANCHE</text><rect x="44.0" y="247.95999999999998" width="246.0" height="150" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-amber, #f5b13d)" stroke-width="2"/><text x="63.00" y="296.96" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">€2.5bn</text><text x="63.00" y="345.96" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Refinanced at the</text><text x="63.00" y="374.71" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">new rate</text><rect x="306.0" y="247.95999999999998" width="246.0" height="150" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="325.00" y="296.96" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">€2.5bn</text><text x="325.00" y="345.96" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Existing coupon</text><text x="325.00" y="374.71" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">until maturity</text><rect x="568.0" y="247.95999999999998" width="246.0" height="150" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="587.00" y="296.96" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">€2.5bn</text><text x="587.00" y="345.96" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Existing coupon</text><text x="587.00" y="374.71" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">until maturity</text><rect x="830.0" y="247.95999999999998" width="246.0" height="150" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="849.00" y="296.96" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">€2.5bn</text><text x="849.00" y="345.96" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Existing coupon</text><text x="849.00" y="374.71" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">until maturity</text><rect x="44" y="441.96" width="1032" height="176" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-amber, #f5b13d)" stroke-width="2"/><text x="66.00" y="476.96" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">ADDITIONAL ANNUAL INTEREST EXPENSE</text><text x="66.00" y="541.96" font-family="Arial, Helvetica, sans-serif" font-size="49" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">€25 million</text><text x="66.00" y="583.21" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">€2.5bn refinanced × a 1 percentage point increase.</text><text x="44.00" y="679.96" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">First-year expense also depends on the issuance month.</text><text x="44.00" y="740.96" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Old fixed-rate debt keeps its coupon. Deposits, floating-rate debt and hedges have their own</text><text x="44.00" y="770.96" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">repricing schedules.</text><line x1="44" y1="808.96" x2="1076" y2="808.96" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2" opacity="1"/><text x="44.00" y="856.96" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="start">A REPORTED EXAMPLE OF PREFUNDING</text><rect x="44" y="879.96" width="1032" height="162" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="66.00" y="925.96" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="start">Deutsche Bank: €9bn already issued</text><text x="66.00" y="967.46" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">By 17 July 2026, against a full-year €10–15bn programme.</text><text x="66.00" y="1005.46" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">This reported case is separate from the illustration above.</text><line x1="44" y1="1081.96" x2="1076" y2="1081.96" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2" opacity="1"/><text x="44.00" y="1117.96" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Sources: l0g calculation; Deutsche Bank, 30 Jul 2026, slide 14 (S12).</text><text x="44.00" y="1152.46" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Model: full-year run rate after refinancing, excluding hedges, tax, deposits and balance-sheet changes. DB issuance is as of 17</text><text x="44.00" y="1174.06" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">July, not remaining needs on 7 October.</text></svg>
