<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1646" viewBox="0 0 620 1646" role="img" aria-labelledby="sovereign-banks-title-3-en-True sovereign-banks-desc-3-en-True" style="width:100%;height:auto"><title id="sovereign-banks-title-3-en-True">One price, three accounting routes</title><desc id="sovereign-banks-desc-3-en-True">The same market-price decline is recognised differently by accounting category. All remain exposed to the price at which the asset can be sold or pledged.</desc><defs><marker id="sovereign-banks-a71d3c0-3-en-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-signal, #5eead4)"/></marker><marker id="sovereign-banks-aefb879-3-en-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-amber, #f5b13d)"/></marker><marker id="sovereign-banks-af19c90-3-en-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-down, #ff4d87)"/></marker><marker id="sovereign-banks-a9fc6f2-3-en-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-topic-blue, #7aa2f7)"/></marker><marker id="sovereign-banks-aa9b9c7-3-en-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-muted, #8b909b)"/></marker></defs><rect width="620" height="1646" fill="var(--color-ink, #0c0d10)"/><text x="44.00" y="45.00" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">l0g  /  BANKS &amp; DEBT</text><text x="576.00" y="45.00" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="end">03</text><text x="44.00" y="101.00" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">One price, three accounting</text><text x="44.00" y="139.42" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">routes</text><text x="44.00" y="178.84" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Debt security · simplified treatment, excluding</text><text x="44.00" y="207.59" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">hedge accounting.</text><rect x="44" y="241.33999999999997" width="532" height="120" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="66.00" y="275.34" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">A COMMON ECONOMIC SHOCK</text><text x="66.00" y="319.34" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Market value: 100 → 88.13</text><rect x="44" y="399.34" width="532" height="262" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="66.00" y="439.34" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="start">AC</text><text x="66.00" y="483.34" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Amortised cost</text><text x="66.00" y="528.34" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">The market-rate move alone does not mark</text><text x="66.00" y="558.34" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">down the carrying value.</text><text x="66.00" y="596.34" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Expected credit losses; consequences of a sale.</text><rect x="44" y="686.3399999999999" width="532" height="262" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="66.00" y="726.34" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">FVOCI</text><text x="66.00" y="770.34" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Fair value through OCI</text><text x="66.00" y="815.34" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Revaluation in other comprehensive income</text><text x="66.00" y="845.34" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">and equity.</text><text x="66.00" y="883.34" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Interest and credit: separate rules. Adjust</text><text x="66.00" y="910.84" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">prudential effects.</text><rect x="44" y="973.3399999999999" width="532" height="262" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="66.00" y="1013.34" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">FVPL</text><text x="66.00" y="1057.34" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Fair value through profit or loss</text><text x="66.00" y="1102.34" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">The change in value enters profit or loss.</text><text x="66.00" y="1140.34" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Match the movement with hedging gains or</text><text x="66.00" y="1167.84" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">losses.</text><rect x="44" y="1270.34" width="532" height="185" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-amber, #f5b13d)" stroke-width="2"/><text x="66.00" y="1314.34" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">Liquidity still depends on the price</text><text x="66.00" y="1348.09" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">that can be realised.</text><text x="66.00" y="1389.84" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">On sale or pledge, accounting classification</text><text x="66.00" y="1418.59" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">does not set the market price.</text><line x1="44" y1="1495.34" x2="576" y2="1495.34" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2" opacity="1"/><text x="44.00" y="1533.34" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Sources: IFRS Foundation, HMRC, ECB (S06–S09, S21).</text><text x="44.00" y="1569.34" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Rate example without default. FVOCI interest and credit losses</text><text x="44.00" y="1592.14" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">follow separate rules. Net CET1 effects also depend on</text><text x="44.00" y="1614.94" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">hedges, tax and prudential adjustments.</text></svg>
