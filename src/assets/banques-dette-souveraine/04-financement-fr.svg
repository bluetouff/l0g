<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1205" viewBox="0 0 1120 1205" role="img" aria-labelledby="sovereign-banks-title-4-fr-False sovereign-banks-desc-4-fr-False" style="width:100%;height:auto"><title id="sovereign-banks-title-4-fr-False">Le nouveau taux arrive par échéances</title><desc id="sovereign-banks-desc-4-fr-False">Sur 10 milliards de dette, refinancer 25 % à un coût supérieur d’un point ajoute 25 millions de charge annuelle, et non 100 millions immédiatement. Exemple de Deutsche Bank séparé.</desc><defs><marker id="sovereign-banks-a71d3c0-4-fr-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-signal, #5eead4)"/></marker><marker id="sovereign-banks-aefb879-4-fr-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-amber, #f5b13d)"/></marker><marker id="sovereign-banks-af19c90-4-fr-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-down, #ff4d87)"/></marker><marker id="sovereign-banks-a9fc6f2-4-fr-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-topic-blue, #7aa2f7)"/></marker><marker id="sovereign-banks-aa9b9c7-4-fr-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-muted, #8b909b)"/></marker></defs><rect width="1120" height="1205" fill="var(--color-ink, #0c0d10)"/><text x="44.00" y="45.00" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">l0g  /  BANQUES &amp; DETTE</text><text x="1076.00" y="45.00" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="end">04</text><text x="44.00" y="109.00" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Le nouveau taux arrive par échéances</text><text x="44.00" y="148.46" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Simulation · 10 Md€ de dette fixe · un quart renouvelé à +100 pb.</text><text x="44.00" y="201.96" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">LE STOCK ET LA TRANCHE REFINANCÉE</text><rect x="44.0" y="247.95999999999998" width="246.0" height="150" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-amber, #f5b13d)" stroke-width="2"/><text x="63.00" y="296.96" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">2,5 Md€</text><text x="63.00" y="345.96" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Renouvelés au</text><text x="63.00" y="374.71" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">nouveau taux</text><rect x="306.0" y="247.95999999999998" width="246.0" height="150" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="325.00" y="296.96" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">2,5 Md€</text><text x="325.00" y="345.96" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Coupon inchangé</text><text x="325.00" y="374.71" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">jusque-là</text><rect x="568.0" y="247.95999999999998" width="246.0" height="150" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="587.00" y="296.96" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">2,5 Md€</text><text x="587.00" y="345.96" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Coupon inchangé</text><text x="587.00" y="374.71" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">jusque-là</text><rect x="830.0" y="247.95999999999998" width="246.0" height="150" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="849.00" y="296.96" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">2,5 Md€</text><text x="849.00" y="345.96" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Coupon inchangé</text><text x="849.00" y="374.71" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">jusque-là</text><rect x="44" y="441.96" width="1032" height="176" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-amber, #f5b13d)" stroke-width="2"/><text x="66.00" y="476.96" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">CHARGE ANNUELLE SUPPLÉMENTAIRE</text><text x="66.00" y="541.96" font-family="Arial, Helvetica, sans-serif" font-size="49" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">25 millions d’euros</text><text x="66.00" y="583.21" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">2,5 milliards refinancés × 1 point de taux.</text><text x="44.00" y="679.96" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Le coût de l’année dépend aussi du mois d’émission.</text><text x="44.00" y="740.96" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Une dette fixe ancienne garde son coupon. Les dépôts, les taux variables et les couvertures ont</text><text x="44.00" y="770.96" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">leurs propres calendriers.</text><line x1="44" y1="808.96" x2="1076" y2="808.96" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2" opacity="1"/><text x="44.00" y="856.96" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="start">UN EXEMPLE RÉEL DE PRÉFINANCEMENT</text><rect x="44" y="879.96" width="1032" height="162" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="66.00" y="925.96" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="start">Deutsche Bank : 9 Md€ déjà émis</text><text x="66.00" y="967.46" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Au 17 juillet 2026, pour un programme annuel de 10 à 15 Md€.</text><text x="66.00" y="1005.46" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Ce cas réel est distinct de la simulation ci-dessus.</text><line x1="44" y1="1081.96" x2="1076" y2="1081.96" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2" opacity="1"/><text x="44.00" y="1117.96" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Sources : calcul l0g; Deutsche Bank, 30.07.2026, diapositive 14 (S12).</text><text x="44.00" y="1152.46" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Simulation : régime annuel plein après renouvellement, hors couvertures, fiscalité, dépôts et variation de bilan. Programme DB :</text><text x="44.00" y="1174.06" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">émissions au 17 juillet, pas besoins restant au 7 octobre.</text></svg>
