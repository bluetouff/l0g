<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1440" viewBox="0 0 1120 1440" role="img" aria-labelledby="sovereign-banks-title-2-en-False sovereign-banks-desc-2-en-False" style="width:100%;height:auto"><title id="sovereign-banks-title-2-en-False">Time amplifies the price decline</title><desc id="sovereign-banks-desc-2-en-False">At yields rising from 3% to 4.5%, prices are 97.19 at two years, 93.42 at five, 88.13 at ten and 80.49 at twenty. Ten-year collateral capacity falls from 95 to 83.72.</desc><defs><marker id="sovereign-banks-a71d3c0-2-en-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-signal, #5eead4)"/></marker><marker id="sovereign-banks-aefb879-2-en-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-amber, #f5b13d)"/></marker><marker id="sovereign-banks-af19c90-2-en-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-down, #ff4d87)"/></marker><marker id="sovereign-banks-a9fc6f2-2-en-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-topic-blue, #7aa2f7)"/></marker><marker id="sovereign-banks-aa9b9c7-2-en-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-muted, #8b909b)"/></marker></defs><rect width="1120" height="1440" fill="var(--color-ink, #0c0d10)"/><text x="44.00" y="45.00" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">l0g  /  BANKS &amp; DEBT</text><text x="1076.00" y="45.00" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="end">02</text><text x="44.00" y="109.00" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Time amplifies the price decline</text><text x="44.00" y="148.46" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Calculated example · 3% fixed coupon · yield 3% → 4.5%.</text><rect x="44" y="181.95999999999998" width="1032" height="116" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="66.00" y="227.96" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">€100 initially → €88.13 after the shock</text><text x="66.00" y="268.71" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">The same ten-year bond. The same contractual payments.</text><text x="44.00" y="362.96" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">POST-SHOCK VALUE PER €100 OF INITIAL VALUE</text><text x="44.00" y="430.96" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">2-year maturity</text><text x="1076.00" y="431.96" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="var(--color-down, #ff4d87)" text-anchor="end">−2.81%</text><rect x="44" y="451.96" width="930" height="31" rx="0" fill="var(--color-line-strong, rgba(255, 255, 255, 0.20))"/><rect x="44" y="451.96" width="903.8762848835879" height="31" rx="0" fill="var(--color-topic-blue, #7aa2f7)"/><text x="991.00" y="473.96" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">97.19</text><text x="44.00" y="549.96" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">5-year maturity</text><text x="1076.00" y="550.96" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="var(--color-down, #ff4d87)" text-anchor="end">−6.58%</text><rect x="44" y="570.96" width="930" height="31" rx="0" fill="var(--color-line-strong, rgba(255, 255, 255, 0.20))"/><rect x="44" y="570.96" width="868.7598244152122" height="31" rx="0" fill="var(--color-topic-blue, #7aa2f7)"/><text x="991.00" y="592.96" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">93.42</text><text x="44.00" y="668.96" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">10-year maturity</text><text x="1076.00" y="669.96" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="var(--color-down, #ff4d87)" text-anchor="end">−11.87%</text><rect x="44" y="689.96" width="930" height="31" rx="0" fill="var(--color-line-strong, rgba(255, 255, 255, 0.20))"/><rect x="44" y="689.96" width="819.6175814293138" height="31" rx="0" fill="var(--color-signal, #5eead4)"/><text x="991.00" y="711.96" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">88.13</text><text x="44.00" y="787.96" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">20-year maturity</text><text x="1076.00" y="788.96" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="var(--color-down, #ff4d87)" text-anchor="end">−19.51%</text><rect x="44" y="808.96" width="930" height="31" rx="0" fill="var(--color-line-strong, rgba(255, 255, 255, 0.20))"/><rect x="44" y="808.96" width="748.5392865022217" height="31" rx="0" fill="var(--color-topic-blue, #7aa2f7)"/><text x="991.00" y="830.96" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">80.49</text><line x1="44.0" y1="886.96" x2="44.0" y2="893.96" stroke="var(--color-muted, #8b909b)" stroke-width="2" opacity="1"/><text x="44.00" y="920.96" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="middle">0</text><line x1="276.5" y1="886.96" x2="276.5" y2="893.96" stroke="var(--color-muted, #8b909b)" stroke-width="2" opacity="1"/><text x="276.50" y="920.96" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="middle">25</text><line x1="509.0" y1="886.96" x2="509.0" y2="893.96" stroke="var(--color-muted, #8b909b)" stroke-width="2" opacity="1"/><text x="509.00" y="920.96" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="middle">50</text><line x1="741.5" y1="886.96" x2="741.5" y2="893.96" stroke="var(--color-muted, #8b909b)" stroke-width="2" opacity="1"/><text x="741.50" y="920.96" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="middle">75</text><line x1="974.0" y1="886.96" x2="974.0" y2="893.96" stroke="var(--color-muted, #8b909b)" stroke-width="2" opacity="1"/><text x="974.00" y="920.96" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="middle">100</text><line x1="44" y1="886.96" x2="974" y2="886.96" stroke="var(--color-muted, #8b909b)" stroke-width="2" opacity="1"/><text x="44.00" y="988.96" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">THE SAME BOND IS PLEDGED AS COLLATERAL</text><rect x="44.0" y="1014.96" width="504.0" height="195" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="64.00" y="1051.96" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Before</text><text x="64.00" y="1106.96" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">€95.00</text><text x="64.00" y="1149.96" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Funding after a 5% haircut</text><rect x="572.0" y="1014.96" width="504.0" height="195" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="592.00" y="1051.96" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">After</text><text x="592.00" y="1106.96" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">€83.72</text><text x="592.00" y="1149.96" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Funding after a 5% haircut</text><text x="44.00" y="1269.96" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">€11.28 less funding capacity, with no haircut increase.</text><line x1="44" y1="1316.98" x2="1076" y2="1316.98" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2" opacity="1"/><text x="44.00" y="1352.98" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Sources: l0g calculation; ECB collateral framework (S08, S09).</text><text x="44.00" y="1387.48" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Instantaneous model, annual coupons, initially at par, redemption at 100. No default, accrued interest, tax or hedge. The</text><text x="44.00" y="1409.08" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">illustrative 5% haircut is not an ECB schedule.</text></svg>
