<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 410" role="img" aria-labelledby="ai-map-fr-market-m-title ai-map-fr-market-m-desc" font-family="Inter Variable, Inter, sans-serif" font-weight="400" class="ai-map-svg" style="width:100%;height:auto">
<title id="ai-map-fr-market-m-title">L’IA s’installe dans la dette longue</title>
<desc id="ai-map-fr-market-m-desc">Dans l’encadré BCE publié le 17 novembre 2026, les hyperscalers américains représentent près de 8 % des obligations d’entreprise en euros de qualité investment grade ayant plus de dix ans de maturité résiduelle. Le chiffre porte sur la valeur de marché au 30 juin 2026 de ce segment de l’indice ICE BofA Euro Corporate, et non sur l’ensemble de l’indice. La seconde partie est un mécanisme conditionnel : des recettes décevantes peuvent conduire à une prime de risque plus élevée et à une baisse du prix des obligations. Les portefeuilles des assureurs et fonds de pension peuvent subir cette variation. La BCE observe une surpondération encore modeste. Les flèches ne quantifient aucune perte et ne prévoient aucun choc.</desc>
<text x="20" y="27" font-size="18" font-weight="500" text-anchor="start" fill="var(--color-paper)">L’IA dans la dette longue</text>
<text x="20" y="49" font-size="14" font-weight="400" text-anchor="start" fill="var(--color-muted)">Obligations en euros · investment grade</text>
<text x="20" y="67" font-size="14" font-weight="400" text-anchor="start" fill="var(--color-muted)">Maturité résiduelle supérieure à 10 ans</text>
<text x="20" y="103" font-size="18" font-weight="500" text-anchor="start" fill="var(--color-signal)">Près de 8 %</text>
<text x="150" y="94" font-size="14" font-weight="400" text-anchor="start" fill="var(--color-paper)">émis par les hyperscalers</text>
<text x="150" y="111" font-size="14" font-weight="400" text-anchor="start" fill="var(--color-paper)">américains</text>
<rect x="20" y="125" width="340" height="11" rx="2" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<rect x="20" y="125" width="27.2" height="11" rx="1" fill="var(--color-signal)" stroke="none" stroke-width="1"/>
<text x="20" y="155" font-size="14" font-weight="400" text-anchor="start" fill="var(--color-muted)">Valeur de marché · 30 juin 2026</text>
<line x1="20" y1="173" x2="360" y2="173" stroke="var(--color-line-strong)" stroke-width="1.1"/>
<text x="20" y="195" font-size="14" font-weight="500" text-anchor="start" fill="var(--color-paper)">Si les recettes déçoivent…</text>
