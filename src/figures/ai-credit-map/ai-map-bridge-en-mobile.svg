<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 420" role="img" aria-labelledby="ai-map-en-bridge-m-title ai-map-en-bridge-m-desc" font-family="Inter Variable, Inter, sans-serif" font-weight="400" class="ai-map-svg" style="width:100%;height:auto">
<title id="ai-map-en-bridge-m-title">Private credit’s banking connection</title>
<desc id="ai-map-en-bridge-m-desc">Two relationships are documented separately. The 11 September 2026 agreement commits Deutsche Bank New York for $150 million and First Citizens for $100 million to Athena III’s facility. At 30 September, $75 million was drawn in total; individual bank drawings are not specified here. Athena III is a wholly owned, consolidated OTF subsidiary. Separately, OTF’s consolidated portfolio held $8.969 million of funded CoreWeave DDTL 5.5 principal at 30 September. Athena III’s assets form a specific collateral pool. A specific link between the CoreWeave position and that pool is not established, as shown by the dashed connection. Arrows describe documented relationships, not proportionate cash flows or a tracing of bank money to CoreWeave. Source: SEC, Athena III agreement and OTF 10-Q.</desc>
