<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 334" role="img" aria-labelledby="ai-map-fr-bridge-d-title ai-map-fr-bridge-d-desc" font-family="Inter Variable, Inter, sans-serif" font-weight="400" class="ai-map-svg" style="width:100%;height:auto">
<title id="ai-map-fr-bridge-d-title">Le lien bancaire du crédit privé</title>
<desc id="ai-map-fr-bridge-d-desc">Deux relations sont établies séparément. Le contrat du 11 septembre 2026 engage Deutsche Bank New York à hauteur de 150 millions de dollars et First Citizens à hauteur de 100 millions envers la facilité d’Athena III. Au 30 septembre, 75 millions sont tirés au total ; les tirages individuels ne sont pas publiés ici. Athena III est une filiale détenue à 100 % et consolidée d’OTF. Le portefeuille consolidé d’OTF détient séparément 8,969 millions de principal financé CoreWeave DDTL 5.5 au 30 septembre. Les actifs d’Athena III forment un pool de sûretés spécifique. Le rattachement de la position CoreWeave à ce pool n’est pas établi ; le trait pointillé matérialise cette lacune. Les flèches décrivent les relations identifiées, sans échelle de flux ni attribution des fonds bancaires à CoreWeave. Source : SEC, contrat Athena III et 10-Q OTF.</desc>
