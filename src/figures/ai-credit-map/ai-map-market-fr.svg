<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" role="img" aria-labelledby="ai-map-fr-market-d-title ai-map-fr-market-d-desc" font-family="Inter Variable, Inter, sans-serif" font-weight="400" class="ai-map-svg" style="width:100%;height:auto">
<title id="ai-map-fr-market-d-title">L’IA s’installe dans la dette longue</title>
<desc id="ai-map-fr-market-d-desc">Dans l’encadré BCE publié le 17 novembre 2026, les hyperscalers américains représentent près de 8 % des obligations d’entreprise en euros de qualité investment grade ayant plus de dix ans de maturité résiduelle. Le chiffre porte sur la valeur de marché au 30 juin 2026 de ce segment de l’indice ICE BofA Euro Corporate, et non sur l’ensemble de l’indice. La seconde partie est un mécanisme conditionnel : des recettes décevantes peuvent conduire à une prime de risque plus élevée et à une baisse du prix des obligations. Les portefeuilles des assureurs et fonds de pension peuvent subir cette variation. La BCE observe une surpondération encore modeste. Les flèches ne quantifient aucune perte et ne prévoient aucun choc.</desc>
<text x="20" y="28" font-size="20.4" font-weight="500" text-anchor="start" fill="var(--color-paper)">L’IA s’installe dans la dette longue</text>
<text x="20" y="49" font-size="13.6" font-weight="400" text-anchor="start" fill="var(--color-muted)">Obligations en euros · investment grade · maturité résiduelle supérieure à 10 ans</text>
<text x="20" y="89" font-size="20.4" font-weight="500" text-anchor="start" fill="var(--color-signal)">Près de 8 %</text>
<text x="151" y="89" font-size="13.6" font-weight="400" text-anchor="start" fill="var(--color-paper)">émis par les hyperscalers américains</text>
<rect x="20" y="107" width="640" height="11" rx="2" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<rect x="20" y="107" width="51.2" height="11" rx="1" fill="var(--color-signal)" stroke="none" stroke-width="1"/>
<text x="20" y="141" font-size="13.6" font-weight="400" text-anchor="start" fill="var(--color-muted)">Part à la valeur de marché · 30 juin 2026</text>
<text x="660" y="141" font-size="13.6" font-weight="400" text-anchor="end" fill="var(--color-muted)">Au sein du segment &gt; 10 ans</text>
