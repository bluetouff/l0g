<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 420" role="img" aria-labelledby="ai-map-fr-holdings-m-title ai-map-fr-holdings-m-desc" font-family="Inter Variable, Inter, sans-serif" font-weight="400" class="ai-map-svg" style="width:100%;height:auto">
<title id="ai-map-fr-holdings-m-title">Six portefeuilles sur un même prêt</title>
<desc id="ai-map-fr-holdings-m-desc">Au 30 septembre 2026, le principal tiré de DDTL 5.5 de CoreWeave est de 1 555 millions de dollars. Six portefeuilles publiés identifient ensemble 57,778 millions financés, soit environ 3,7 %. Ares Core Infrastructure Fund : 23,960 ; Apollo Debt Solutions BDC (ADS) : 13,004 ; Blue Owl Technology Finance Corp. (OTF) et Blue Owl Capital Corporation (OBDC) : 8,969 chacun ; HPS Corporate Lending Fund : 2,212 et HPS Corporate Capital Solutions Fund : 0,664 millions, reconstitués à partir des déclarations. La barre générale est proportionnelle au principal total. Le zoom a sa propre échelle, de 0 à 24 millions. Les 38,850 millions d’engagements non tirés sont présentés séparément. Cet échantillon est non exhaustif. Sources : SEC, CoreWeave et déclarations de portefeuille au 30 septembre 2026.</desc>
