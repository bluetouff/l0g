<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 334" role="img" aria-labelledby="ai-map-en-holdings-d-title ai-map-en-holdings-d-desc" font-family="Inter Variable, Inter, sans-serif" font-weight="400" class="ai-map-svg" style="width:100%;height:auto">
<title id="ai-map-en-holdings-d-title">Six portfolios holding the same loan</title>
<desc id="ai-map-en-holdings-d-desc">At 30 September 2026, CoreWeave DDTL 5.5 had $1,555 million of drawn principal. Six disclosed portfolios identify $57.778 million funded, around 3.7%. Ares Core Infrastructure Fund: 23.960; Apollo Debt Solutions BDC (ADS): 13.004; Blue Owl Technology Finance Corp. (OTF) and Blue Owl Capital Corporation (OBDC): 8.969 each; HPS Corporate Lending Fund: 2.212 and HPS Corporate Capital Solutions Fund: 0.664 million, reconstructed from filings. The overall bar is proportional to total principal. The enlarged positions use their own 0–24 million scale. The $38.850 million of undrawn commitments is shown separately. The sample is not exhaustive. Sources: SEC, CoreWeave and portfolio disclosures at 30 September 2026.</desc>
