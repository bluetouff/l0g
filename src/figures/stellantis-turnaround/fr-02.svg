<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="stl-fr-02-title stl-fr-02-desc" style="width:100%;height:auto" class="l0g-stellantis-svg"><title id="stl-fr-02-title">L’usine ralentit, les factures restent</title><desc id="stl-fr-02-desc">Le fournisseur livre des pièces au constructeur ; le constructeur expédie au réseau indépendant et encaisse rapidement. Les fournisseurs sont payés plus tard. La vente au client final suit son propre calendrier.</desc><rect id="stl-fr-02-frame" x="0" y="0" width="1000" height="680" rx="0" fill="var(--color-ink)"/><text data-panel="stl-fr-02-frame" x="40" y="34" fill="var(--color-signal)" font-family="l0g Stellantis" font-size="24" font-weight="700" text-anchor="start">l0g / STELLANTIS</text><text data-panel="stl-fr-02-frame" x="960" y="34" fill="var(--color-muted)" font-family="l0g Stellantis" font-size="24" font-weight="400" text-anchor="end">02</text><text data-panel="stl-fr-02-frame" x="40" y="85" fill="var(--color-paper)" font-family="l0g Stellantis" font-size="34" font-weight="700" text-anchor="start">L’usine ralentit, les factures restent</text><text data-panel="stl-fr-02-frame" x="40" y="135" fill="var(--color-muted)" font-family="l0g Stellantis" font-size="24" font-weight="400" text-anchor="start">Pièces, véhicules et calendriers de paiement</text><rect id="stl-fr-02-card-actor-0" x="40" y="190" width="260" height="110" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="stl-fr-02-card-actor-0" x="56" y="228" fill="var(--color-paper)" font-family="l0g Stellantis" font-size="24" font-weight="700" text-anchor="start">Fournisseur</text><text data-panel="stl-fr-02-card-actor-0" x="56" y="278" fill="var(--color-muted)" font-family="l0g Stellantis" font-size="24" font-weight="400" text-anchor="start">Pièces et matières</text><path data-connector="goods-0" d="M306 245 L358 245" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path data-connector="goods-0-tip" d="M350.97934 248.835404 L358 245 L350.97934 241.164596" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect id="stl-fr-02-card-actor-1" x="370" y="190" width="260" height="110" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="stl-fr-02-card-actor-1" x="386" y="228" fill="var(--color-paper)" font-family="l0g Stellantis" font-size="24" font-weight="700" text-anchor="start">Constructeur</text><text data-panel="stl-fr-02-card-actor-1" x="386" y="278" fill="var(--color-muted)" font-family="l0g Stellantis" font-size="24" font-weight="400" text-anchor="start">Stock industriel</text><path data-connector="goods-1" d="M636 245 L688 245" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path data-connector="goods-1-tip" d="M680.97934 248.835404 L688 245 L680.97934 241.164596" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect id="stl-fr-02-card-actor-2" x="700" y="190" width="260" height="110" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="stl-fr-02-card-actor-2" x="716" y="228" fill="var(--color-paper)" font-family="l0g Stellantis" font-size="24" font-weight="700" text-anchor="start">Concessionnaire</text><text data-panel="stl-fr-02-card-actor-2" x="716" y="278" fill="var(--color-muted)" font-family="l0g Stellantis" font-size="24" font-weight="400" text-anchor="start">Stock indépendant</text><path data-connector="dealer-cash" d="M830 309 L830 410 L570 410 L570 309" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path data-connector="dealer-cash-tip" d="M573.835404 316.02066 L570 309 L566.164596 316.02066" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="stl-fr-02-frame" x="590" y="355" fill="var(--color-signal)" font-family="l0g Stellantis" font-size="24" font-weight="700" text-anchor="start">Cash reçu</text><text data-panel="stl-fr-02-frame" x="590" y="387.4" fill="var(--color-signal)" font-family="l0g Stellantis" font-size="24" font-weight="700" text-anchor="start">rapidement</text><path data-connector="supplier-cash" d="M430 309 L430 510 L170 510 L170 309" fill="none" stroke="var(--color-amber)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path data-connector="supplier-cash-tip" d="M173.835404 316.02066 L170 309 L166.164596 316.02066" fill="none" stroke="var(--color-amber)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="stl-fr-02-frame" x="195" y="443" fill="var(--color-amber)" font-family="l0g Stellantis" font-size="24" font-weight="700" text-anchor="start">Fournisseurs</text><text data-panel="stl-fr-02-frame" x="195" y="475.4" fill="var(--color-amber)" font-family="l0g Stellantis" font-size="24" font-weight="700" text-anchor="start">réglés plus</text><text data-panel="stl-fr-02-frame" x="195" y="507.8" fill="var(--color-amber)" font-family="l0g Stellantis" font-size="24" font-weight="700" text-anchor="start">tard</text><rect id="stl-fr-02-card-retail" x="40" y="560" width="920" height="70" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="stl-fr-02-card-retail" x="58" y="590" fill="var(--color-muted)" font-family="l0g Stellantis" font-size="24" font-weight="400" text-anchor="start">La vente à l’automobiliste suit son propre calendrier.</text></svg>