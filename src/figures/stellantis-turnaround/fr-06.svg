<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="stl-fr-06-title stl-fr-06-desc" style="width:100%;height:auto" class="l0g-stellantis-svg"><title id="stl-fr-06-title">Deux seuils pour le dernier trimestre</title><desc id="stl-fr-06-desc">405 M€ au T4 égaleraient le flux annuel 2025 ; une amélioration exige davantage. Un flux de 4 930 M€ annulerait la consommation des neuf premiers mois. Répéter les 2 784 M€ du T4 2025 donnerait −2 146 M€ sur 2026 : scénario pédagogique.</desc><rect id="stl-fr-06-frame" x="0" y="0" width="1000" height="680" rx="0" fill="var(--color-ink)"/><text data-panel="stl-fr-06-frame" x="40" y="34" fill="var(--color-signal)" font-family="l0g Stellantis" font-size="24" font-weight="700" text-anchor="start">l0g / STELLANTIS</text><text data-panel="stl-fr-06-frame" x="960" y="34" fill="var(--color-muted)" font-family="l0g Stellantis" font-size="24" font-weight="400" text-anchor="end">06</text><text data-panel="stl-fr-06-frame" x="40" y="85" fill="var(--color-paper)" font-family="l0g Stellantis" font-size="34" font-weight="700" text-anchor="start">Deux seuils pour le dernier trimestre</text><text data-panel="stl-fr-06-frame" x="40" y="135" fill="var(--color-muted)" font-family="l0g Stellantis" font-size="24" font-weight="400" text-anchor="start">FCF industriel du T4 2026 · M€</text><rect id="stl-fr-06-card-threshold-0" x="40" y="185" width="920" height="105" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="stl-fr-06-card-threshold-0" x="56" y="219" fill="var(--color-paper)" font-family="l0g Stellantis" font-size="24" font-weight="700" text-anchor="start">Égaler le flux annuel de 2025</text><text data-panel="stl-fr-06-card-threshold-0" x="940" y="223" fill="var(--color-amber)" font-family="l0g Stellantis" font-size="32" font-weight="700" text-anchor="end">405 M€</text><rect data-metric="q4-threshold-eurm" data-value="405" x="240" y="249" width="50.111562" height="24" rx="0" fill="var(--color-amber)"/><rect id="stl-fr-06-card-threshold-1" x="40" y="310" width="920" height="105" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="stl-fr-06-card-threshold-1" x="56" y="344" fill="var(--color-paper)" font-family="l0g Stellantis" font-size="24" font-weight="700" text-anchor="start">Rejouer le T4 2025 : scénario</text><text data-panel="stl-fr-06-card-threshold-1" x="940" y="348" fill="var(--color-signal)" font-family="l0g Stellantis" font-size="32" font-weight="700" text-anchor="end">2 784 M€</text><rect data-metric="q4-threshold-eurm" data-value="2784" x="240" y="374" width="344.470588" height="24" rx="0" fill="var(--color-signal)"/><rect id="stl-fr-06-card-threshold-2" x="40" y="435" width="920" height="105" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="stl-fr-06-card-threshold-2" x="56" y="469" fill="var(--color-paper)" font-family="l0g Stellantis" font-size="24" font-weight="700" text-anchor="start">Atteindre zéro sur toute l’année</text><text data-panel="stl-fr-06-card-threshold-2" x="940" y="473" fill="var(--color-accent)" font-family="l0g Stellantis" font-size="32" font-weight="700" text-anchor="end">4 930 M€</text><rect data-metric="q4-threshold-eurm" data-value="4930" x="240" y="499" width="610" height="24" rx="0" fill="var(--color-accent)"/><text data-panel="stl-fr-06-frame" x="40" y="603" fill="var(--color-signal)" font-family="l0g Stellantis" font-size="30" font-weight="700" text-anchor="start">Scénario historique : −2 146 M€ sur l’année 2026.</text><text data-panel="stl-fr-06-frame" x="40" y="650" fill="var(--color-muted)" font-family="l0g Stellantis" font-size="24" font-weight="400" text-anchor="start">T4 2026 inconnu · scénario distinct d’une prévision.</text></svg>