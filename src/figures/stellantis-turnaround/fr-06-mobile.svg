<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1080" role="img" aria-labelledby="stl-fr-06-mobile-title stl-fr-06-mobile-desc" style="width:100%;height:auto" class="l0g-stellantis-svg"><title id="stl-fr-06-mobile-title">Deux seuils pour le dernier trimestre</title><desc id="stl-fr-06-mobile-desc">405 M€ au T4 égaleraient le flux annuel 2025 ; une amélioration exige davantage. Un flux de 4 930 M€ annulerait la consommation des neuf premiers mois. Répéter les 2 784 M€ du T4 2025 donnerait −2 146 M€ sur 2026 : scénario pédagogique.</desc><rect id="stl-fr-06-mobile-frame" x="0" y="0" width="420" height="1080" rx="0" fill="var(--color-ink)"/><text data-panel="stl-fr-06-mobile-frame" x="24" y="34" fill="var(--color-signal)" font-family="l0g Stellantis" font-size="18" font-weight="700" text-anchor="start">l0g / STELLANTIS</text><text data-panel="stl-fr-06-mobile-frame" x="396" y="34" fill="var(--color-muted)" font-family="l0g Stellantis" font-size="18" font-weight="400" text-anchor="end">06</text><text data-panel="stl-fr-06-mobile-frame" x="24" y="76" fill="var(--color-paper)" font-family="l0g Stellantis" font-size="28" font-weight="700" text-anchor="start">Deux seuils pour le</text><text data-panel="stl-fr-06-mobile-frame" x="24" y="109.04" fill="var(--color-paper)" font-family="l0g Stellantis" font-size="28" font-weight="700" text-anchor="start">dernier trimestre</text><text data-panel="stl-fr-06-mobile-frame" x="24" y="150" fill="var(--color-muted)" font-family="l0g Stellantis" font-size="18" font-weight="400" text-anchor="start">FCF industriel du T4 2026 · M€</text><rect id="stl-fr-06-mobile-card-threshold-0" x="24" y="180" width="372" height="210" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="stl-fr-06-mobile-card-threshold-0" x="40" y="214" fill="var(--color-paper)" font-family="l0g Stellantis" font-size="18" font-weight="700" text-anchor="start">Égaler le flux annuel de 2025</text><text data-panel="stl-fr-06-mobile-card-threshold-0" x="40" y="285" fill="var(--color-amber)" font-family="l0g Stellantis" font-size="30" font-weight="700" text-anchor="start">405 M€</text><rect data-metric="q4-threshold-eurm" data-value="405" x="40" y="328" width="27.602434" height="24" rx="0" fill="var(--color-amber)"/><rect id="stl-fr-06-mobile-card-threshold-1" x="24" y="420" width="372" height="210" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="stl-fr-06-mobile-card-threshold-1" x="40" y="454" fill="var(--color-paper)" font-family="l0g Stellantis" font-size="18" font-weight="700" text-anchor="start">Rejouer le T4 2025 : scénario</text><text data-panel="stl-fr-06-mobile-card-threshold-1" x="40" y="525" fill="var(--color-signal)" font-family="l0g Stellantis" font-size="30" font-weight="700" text-anchor="start">2 784 M€</text><rect data-metric="q4-threshold-eurm" data-value="2784" x="40" y="568" width="189.741176" height="24" rx="0" fill="var(--color-signal)"/><rect id="stl-fr-06-mobile-card-threshold-2" x="24" y="660" width="372" height="210" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="stl-fr-06-mobile-card-threshold-2" x="40" y="694" fill="var(--color-paper)" font-family="l0g Stellantis" font-size="18" font-weight="700" text-anchor="start">Atteindre zéro sur toute l’année</text><text data-panel="stl-fr-06-mobile-card-threshold-2" x="40" y="765" fill="var(--color-accent)" font-family="l0g Stellantis" font-size="30" font-weight="700" text-anchor="start">4 930 M€</text><rect data-metric="q4-threshold-eurm" data-value="4930" x="40" y="808" width="336" height="24" rx="0" fill="var(--color-accent)"/><text data-panel="stl-fr-06-mobile-frame" x="24" y="943" fill="var(--color-signal)" font-family="l0g Stellantis" font-size="24" font-weight="700" text-anchor="start">Scénario historique :</text><text data-panel="stl-fr-06-mobile-frame" x="24" y="975.4" fill="var(--color-signal)" font-family="l0g Stellantis" font-size="24" font-weight="700" text-anchor="start">−2 146 M€ sur 2026.</text><text data-panel="stl-fr-06-mobile-frame" x="24" y="1030" fill="var(--color-muted)" font-family="l0g Stellantis" font-size="18" font-weight="400" text-anchor="start">T4 2026 inconnu · scénario distinct</text><text data-panel="stl-fr-06-mobile-frame" x="24" y="1054.3" fill="var(--color-muted)" font-family="l0g Stellantis" font-size="18" font-weight="400" text-anchor="start">d’une prévision.</text></svg>