<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1080" role="img" aria-labelledby="stl-fr-02-mobile-title stl-fr-02-mobile-desc" style="width:100%;height:auto" class="l0g-stellantis-svg"><title id="stl-fr-02-mobile-title">L’usine ralentit, les factures restent</title><desc id="stl-fr-02-mobile-desc">Le fournisseur livre des pièces au constructeur ; le constructeur expédie au réseau indépendant et encaisse rapidement. Les fournisseurs sont payés plus tard. La vente au client final suit son propre calendrier.</desc><rect id="stl-fr-02-mobile-frame" x="0" y="0" width="420" height="1080" rx="0" fill="var(--color-ink)"/><text data-panel="stl-fr-02-mobile-frame" x="24" y="34" fill="var(--color-signal)" font-family="l0g Stellantis" font-size="18" font-weight="700" text-anchor="start">l0g / STELLANTIS</text><text data-panel="stl-fr-02-mobile-frame" x="396" y="34" fill="var(--color-muted)" font-family="l0g Stellantis" font-size="18" font-weight="400" text-anchor="end">02</text><text data-panel="stl-fr-02-mobile-frame" x="24" y="76" fill="var(--color-paper)" font-family="l0g Stellantis" font-size="28" font-weight="700" text-anchor="start">L’usine ralentit, les</text><text data-panel="stl-fr-02-mobile-frame" x="24" y="109.04" fill="var(--color-paper)" font-family="l0g Stellantis" font-size="28" font-weight="700" text-anchor="start">factures restent</text><text data-panel="stl-fr-02-mobile-frame" x="24" y="150" fill="var(--color-muted)" font-family="l0g Stellantis" font-size="18" font-weight="400" text-anchor="start">Pièces, véhicules et calendriers de</text><text data-panel="stl-fr-02-mobile-frame" x="24" y="174.3" fill="var(--color-muted)" font-family="l0g Stellantis" font-size="18" font-weight="400" text-anchor="start">paiement</text><rect id="stl-fr-02-mobile-card-actor-0" x="70" y="180" width="326" height="90" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="stl-fr-02-mobile-card-actor-0" x="86" y="213" fill="var(--color-paper)" font-family="l0g Stellantis" font-size="22" font-weight="700" text-anchor="start">Fournisseur</text><text data-panel="stl-fr-02-mobile-card-actor-0" x="86" y="248" fill="var(--color-muted)" font-family="l0g Stellantis" font-size="18" font-weight="400" text-anchor="start">Pièces et matières</text><path data-connector="goods-0" d="M233 276 L233 345" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path data-connector="goods-0-tip" d="M229.164596 337.97934 L233 345 L236.835404 337.97934" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="stl-fr-02-mobile-frame" x="255" y="315" fill="var(--color-muted)" font-family="l0g Stellantis" font-size="18" font-weight="400" text-anchor="start">Pièces</text><rect id="stl-fr-02-mobile-card-actor-1" x="70" y="360" width="326" height="90" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="stl-fr-02-mobile-card-actor-1" x="86" y="393" fill="var(--color-paper)" font-family="l0g Stellantis" font-size="22" font-weight="700" text-anchor="start">Constructeur</text><text data-panel="stl-fr-02-mobile-card-actor-1" x="86" y="428" fill="var(--color-muted)" font-family="l0g Stellantis" font-size="18" font-weight="400" text-anchor="start">Stock industriel</text><path data-connector="goods-1" d="M233 456 L233 525" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path data-connector="goods-1-tip" d="M229.164596 517.97934 L233 525 L236.835404 517.97934" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="stl-fr-02-mobile-frame" x="255" y="495" fill="var(--color-muted)" font-family="l0g Stellantis" font-size="18" font-weight="400" text-anchor="start">Véhicule</text><rect id="stl-fr-02-mobile-card-actor-2" x="70" y="540" width="326" height="90" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="stl-fr-02-mobile-card-actor-2" x="86" y="573" fill="var(--color-paper)" font-family="l0g Stellantis" font-size="22" font-weight="700" text-anchor="start">Concessionnaire</text><text data-panel="stl-fr-02-mobile-card-actor-2" x="86" y="608" fill="var(--color-muted)" font-family="l0g Stellantis" font-size="18" font-weight="400" text-anchor="start">Stock indépendant</text><path data-connector="goods-2" d="M233 636 L233 705" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path data-connector="goods-2-tip" d="M229.164596 697.97934 L233 705 L236.835404 697.97934" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="stl-fr-02-mobile-frame" x="255" y="675" fill="var(--color-muted)" font-family="l0g Stellantis" font-size="18" font-weight="400" text-anchor="start">Véhicule</text><rect id="stl-fr-02-mobile-card-actor-3" x="70" y="720" width="326" height="90" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="stl-fr-02-mobile-card-actor-3" x="86" y="753" fill="var(--color-paper)" font-family="l0g Stellantis" font-size="22" font-weight="700" text-anchor="start">Automobiliste</text><text data-panel="stl-fr-02-mobile-card-actor-3" x="86" y="788" fill="var(--color-muted)" font-family="l0g Stellantis" font-size="18" font-weight="400" text-anchor="start">Vente finale</text><path data-connector="dealer-cash" d="M403 585 L409 585 L409 405 L403 405" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path data-connector="dealer-cash-tip" d="M410.02066 401.164596 L403 405 L410.02066 408.835404" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path data-connector="supplier-cash" d="M64 405 L24 405 L24 225 L64 225" fill="none" stroke="var(--color-amber)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path data-connector="supplier-cash-tip" d="M56.97934 228.835404 L64 225 L56.97934 221.164596" fill="none" stroke="var(--color-amber)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="stl-fr-02-mobile-frame" x="24" y="870" fill="var(--color-signal)" font-family="l0g Stellantis" font-size="18" font-weight="700" text-anchor="start">Réseau → constructeur : cash rapide</text><text data-panel="stl-fr-02-mobile-frame" x="24" y="925" fill="var(--color-amber)" font-family="l0g Stellantis" font-size="18" font-weight="700" text-anchor="start">Constructeur → fournisseur :</text><text data-panel="stl-fr-02-mobile-frame" x="24" y="949.3" fill="var(--color-amber)" font-family="l0g Stellantis" font-size="18" font-weight="700" text-anchor="start">paiement différé</text><text data-panel="stl-fr-02-mobile-frame" x="24" y="1004" fill="var(--color-muted)" font-family="l0g Stellantis" font-size="18" font-weight="400" text-anchor="start">Stocks du constructeur et du réseau</text><text data-panel="stl-fr-02-mobile-frame" x="24" y="1028.3" fill="var(--color-muted)" font-family="l0g Stellantis" font-size="18" font-weight="400" text-anchor="start">séparés.</text></svg>