<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1080" role="img" aria-labelledby="stl-en-03-mobile-title stl-en-03-mobile-desc" style="width:100%;height:auto" class="l0g-stellantis-svg"><title id="stl-en-03-mobile-title">Investment payments fall</title><desc id="stl-en-03-mobile-desc">Industrial free cash flow improves from −EUR7,309m to −EUR4,930m. Arithmetic contributions: operations +252, lower investment and associated payments +2,198, equity/acquisitions +415, disposals −481 and pensions −5.</desc><rect id="stl-en-03-mobile-frame" x="0" y="0" width="420" height="1080" rx="0" fill="var(--color-ink)"/><text data-panel="stl-en-03-mobile-frame" x="24" y="34" fill="var(--color-signal)" font-family="l0g Stellantis" font-size="18" font-weight="700" text-anchor="start">l0g / STELLANTIS</text><text data-panel="stl-en-03-mobile-frame" x="396" y="34" fill="var(--color-muted)" font-family="l0g Stellantis" font-size="18" font-weight="400" text-anchor="end">03</text><text data-panel="stl-en-03-mobile-frame" x="24" y="76" fill="var(--color-paper)" font-family="l0g Stellantis" font-size="28" font-weight="700" text-anchor="start">Investment payments</text><text data-panel="stl-en-03-mobile-frame" x="24" y="109.04" fill="var(--color-paper)" font-family="l0g Stellantis" font-size="28" font-weight="700" text-anchor="start">fall</text><text data-panel="stl-en-03-mobile-frame" x="24" y="150" fill="var(--color-muted)" font-family="l0g Stellantis" font-size="18" font-weight="400" text-anchor="start">Nine months 2025 → 2026 · EUR millions</text><rect id="stl-en-03-mobile-card-start" data-metric="fcf-start-eurm" data-value="-7309" x="24" y="180" width="372" height="100" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="stl-en-03-mobile-card-start" x="42" y="214" fill="var(--color-muted)" font-family="l0g Stellantis" font-size="20" font-weight="400" text-anchor="start">9M 2025</text><text data-panel="stl-en-03-mobile-card-start" x="42" y="257" fill="var(--color-amber)" font-family="l0g Stellantis" font-size="30" font-weight="700" text-anchor="start">−EUR7,309m</text><text data-panel="stl-en-03-mobile-frame" x="24" y="328" fill="var(--color-paper)" font-family="l0g Stellantis" font-size="18" font-weight="700" text-anchor="start">Operations</text><text data-panel="stl-en-03-mobile-frame" x="396" y="352" fill="var(--color-signal)" font-family="l0g Stellantis" font-size="24" font-weight="700" text-anchor="end">+252</text><line x1="100" y1="370" x2="100" y2="395" stroke="var(--color-line-strong)" stroke-width="1"/><rect data-metric="bridge-change-eurm" data-value="252" x="100" y="372" width="30.24" height="20" rx="0" fill="var(--color-signal)"/><text data-panel="stl-en-03-mobile-frame" x="24" y="428" fill="var(--color-paper)" font-family="l0g Stellantis" font-size="18" font-weight="700" text-anchor="start">Investment and</text><text data-panel="stl-en-03-mobile-frame" x="24" y="452.3" fill="var(--color-paper)" font-family="l0g Stellantis" font-size="18" font-weight="700" text-anchor="start">payments</text><text data-panel="stl-en-03-mobile-frame" x="396" y="452" fill="var(--color-signal)" font-family="l0g Stellantis" font-size="24" font-weight="700" text-anchor="end">+2,198</text><line x1="100" y1="470" x2="100" y2="495" stroke="var(--color-line-strong)" stroke-width="1"/><rect data-metric="bridge-change-eurm" data-value="2198" x="100" y="472" width="263.76" height="20" rx="0" fill="var(--color-signal)"/><text data-panel="stl-en-03-mobile-frame" x="24" y="528" fill="var(--color-paper)" font-family="l0g Stellantis" font-size="18" font-weight="700" text-anchor="start">Equity and acquisitions</text><text data-panel="stl-en-03-mobile-frame" x="396" y="552" fill="var(--color-signal)" font-family="l0g Stellantis" font-size="24" font-weight="700" text-anchor="end">+415</text><line x1="100" y1="570" x2="100" y2="595" stroke="var(--color-line-strong)" stroke-width="1"/><rect data-metric="bridge-chan