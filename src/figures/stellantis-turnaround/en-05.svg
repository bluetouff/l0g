<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="stl-en-05-title stl-en-05-desc" style="width:100%;height:auto" class="l0g-stellantis-svg"><title id="stl-en-05-title">Hybrid financing buys time</title><desc id="stl-en-05-desc">Three tranches: EUR2.2bn at 6.25%, EUR1.8bn at 6.875%, GBP865m at 8.25%. Reported net proceeds EUR4.927bn. Financing cash flow and IAS32 equity classification; perpetual securities and conditional coupon deferral.</desc><rect id="stl-en-05-frame" x="0" y="0" width="1000" height="680" rx="0" fill="var(--color-ink)"/><text data-panel="stl-en-05-frame" x="40" y="34" fill="var(--color-signal)" font-family="l0g Stellantis" font-size="24" font-weight="700" text-anchor="start">l0g / STELLANTIS</text><text data-panel="stl-en-05-frame" x="960" y="34" fill="var(--color-muted)" font-family="l0g Stellantis" font-size="24" font-weight="400" text-anchor="end">05</text><text data-panel="stl-en-05-frame" x="40" y="85" fill="var(--color-paper)" font-family="l0g Stellantis" font-size="34" font-weight="700" text-anchor="start">Hybrid financing buys time</text><text data-panel="stl-en-05-frame" x="40" y="135" fill="var(--color-muted)" font-family="l0g Stellantis" font-size="24" font-weight="400" text-anchor="start">March 2026 issue · original currencies</text><rect id="stl-en-05-card-tranche-0" x="40" y="185" width="292" height="154" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="stl-en-05-card-tranche-0" x="56" y="227" fill="var(--color-paper)" font-family="l0g Stellantis" font-size="32" font-weight="700" text-anchor="start">EUR2.2bn</text><text data-panel="stl-en-05-card-tranche-0" x="56" y="275" fill="var(--color-muted)" font-family="l0g Stellantis" font-size="24" font-weight="400" text-anchor="start">Initial coupon</text><text data-panel="stl-en-05-card-tranche-0" x="316" y="317" fill="var(--color-amber)" font-family="l0g Stellantis" font-size="28" font-weight="700" text-anchor="end">6.25%</text><path data-connector="branch-0" d="M186 346 L186 370" fill="none" stroke="var(--color-line-strong)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect id="stl-en-05-card-tranche-1" x="354" y="185" width="292" height="154" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="stl-en-05-card-tranche-1" x="370" y="227" fill="var(--color-paper)" font-family="l0g Stellantis" font-size="32" font-weight="700" text-anchor="start">EUR1.8bn</text><text data-panel="stl-en-05-card-tranche-1" x="370" y="275" fill="var(--color-muted)" font-family="l0g Stellantis" font-size="24" font-weight="400" text-anchor="start">Initial coupon</text><text data-panel="stl-en-05-card-tranche-1" x="630" y="317" fill="var(--color-amber)" font-family="l0g Stellantis" font-size="28" font-weight="700" text-anchor="end">6.875%</text><path data-connector="branch-1" d="M500 346 L500 370" fill="none" stroke="var(--color-line-strong)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect id="stl-en-05-card-tranche-2" x="668" y="185" width="292" height="154" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="stl-en-05-card-tranche-2" x="684" y="227" fill="var(--color-paper)" font-family="l0g Stellantis" font-size="32" font-weight="700" text-anchor="start">GBP865m</text><text data-panel="stl-en-05-card-tranche-2" x="684" y="275" fill="var(--color-muted)" font-family="l0g Stellantis" font-size="24" font-weight="400" text-anchor="start">Initial coupon</text><text data-panel="stl-en-05-card-tranche-2" x="944" y="317" fill="var(--color-amber)" font-family="l0g Stellantis" font-size="28" font-weight="700" text-anchor="end">8.25%</text><path data-connector="branch-2" d="M814 346 L814 370" fill="none" stroke="var(--color-line-strong)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path data-connector="join" d="M186 370 L814 370" fill="none" stroke="var(--color-line-strong)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path data-connector="proceeds" d="M500 370 L500 399" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path data-connector="proceeds-tip" d="M496.164596 391.97934 L500 399 L503.835404 391.97934" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect id="stl-en-05-card-net" x="220" y="411" width="560" height="110" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="stl-en-05-card-net" x="500" y="456" fill="var(--color-signal)" font-family="l0g Stellantis" font-size="36" font-weight="700" text-anchor="middle">EUR4.927bn net</text><text data-panel="stl-en-05-card-net" x="500" y="495" fill="var(--color-muted)" font-family="l0g Stellantis" font-size="24" font-weight="400" text-anchor="middle">Net proceeds reported in the accounts</text><text data-panel="stl-en-05-frame" x="40" y="573" fill="var(--color-signal)" font-family="l0g Stellantis" font-size="26" font-weight="700" text-anchor="start">Financing cash flow</text><text data-panel="stl-en-05-frame" x="540" y="573" fill="var(--color-amber)" font-family="l0g Stellantis" font-size="26" font-weight="700" text-anchor="start">IAS 32 equity</text><text data-panel="stl-en-05-frame" x="40" y="612" fill="var(--color-muted)" font-family="l0g Stellantis" font-size="24" font-weight="400" text-anchor="start">Outside industrial FCF</text><text data-panel="stl-en-05-frame" x="540" y="612" fill="var(--color-muted)" font-family="l0g Stellantis" font-size="24" font-weight="400" text-anchor="start">Coupons may be deferred</text><text data-panel="stl-en-05-frame" x="40" y="651" fill="var(--color-muted)" font-family="l0g Stellantis" font-size="24" font-weight="400" text-anchor="start">Perpetual securities; deferral remains subject to contractual terms.</text></svg>