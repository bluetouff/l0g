ta-panel="stl-en-03-frame" x="615" y="566" fill="var(--color-paper)" font-family="l0g Stellantis" font-size="24" font-weight="400" text-anchor="middle">Disposals</text><line x1="650" y1="411.775" x2="710" y2="411.775" stroke="var(--color-line-strong)" stroke-width="1"/><rect data-metric="bridge-change-eurm" data-value="-5" x="710" y="411.775" width="70" height="0.215" rx="0" fill="var(--color-accent)"/><text data-panel="stl-en-03-frame" x="745" y="398.775" fill="var(--color-accent)" font-family="l0g Stellantis" font-size="24" font-weight="700" text-anchor="middle">−5</text><text data-panel="stl-en-03-frame" x="745" y="566" fill="var(--color-paper)" font-family="l0g Stellantis" font-size="24" font-weight="400" text-anchor="middle">Pensions</text><line x1="780" y1="411.99" x2="840" y2="411.99" stroke="var(--color-line-strong)" stroke-width="1"/><rect data-metric="fcf-end-eurm" data-value="-4930" x="840" y="200" width="70" height="211.99" rx="0" fill="var(--color-amber)"/><text data-panel="stl-en-03-frame" x="875" y="187" fill="var(--color-amber)" font-family="l0g Stellantis" font-size="24" font-weight="700" text-anchor="middle">−4,930</text><text data-panel="stl-en-03-frame" x="875" y="566" fill="var(--color-paper)" font-family="l0g Stellantis" font-size="24" font-weight="700" text-anchor="middle">9M 2026</text><text data-panel="stl-en-03-frame" x="40" y="614" fill="var(--color-signal)" font-family="l0g Stellantis" font-size="24" font-weight="700" text-anchor="start">+EUR2,379m total; +EUR2,198m from investment and payments.</text><text data-panel="stl-en-03-frame" x="40" y="651" fill="var(--color-muted)" font-family="l0g Stellantis" font-size="24" font-weight="400" text-anchor="start">Accounting bridge contributions; effects are interdependent.</text></svg>