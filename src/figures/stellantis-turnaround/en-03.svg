<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="stl-en-03-title stl-en-03-desc" style="width:100%;height:auto" class="l0g-stellantis-svg"><title id="stl-en-03-title">Investment payments fall</title><desc id="stl-en-03-desc">Industrial free cash flow improves from −EUR7,309m to −EUR4,930m. Arithmetic contributions: operations +252, lower investment and associated payments +2,198, equity/acquisitions +415, disposals −481 and pensions −5.</desc><rect id="stl-en-03-frame" x="0" y="0" width="1000" height="680" rx="0" fill="var(--color-ink)"/><text data-panel="stl-en-03-frame" x="40" y="34" fill="var(--color-signal)" font-family="l0g Stellantis" font-size="24" font-weight="700" text-anchor="start">l0g / STELLANTIS</text><text data-panel="stl-en-03-frame" x="960" y="34" fill="var(--color-muted)" font-family="l0g Stellantis" font-size="24" font-weight="400" text-anchor="end">03</text><text data-panel="stl-en-03-frame" x="40" y="85" fill="var(--color-paper)" font-family="l0g Stellantis" font-size="34" font-weight="700" text-anchor="start">Investment payments fall</text><text data-panel="stl-en-03-frame" x="40" y="135" fill="var(--color-muted)" font-family="l0g Stellantis" font-size="24" font-weight="400" text-anchor="start">Nine months 2025 → 2026 · EUR millions</text><rect data-metric="fcf-start-eurm" data-value="-7309" x="60" y="200" width="70" height="314.287" rx="0" fill="var(--color-amber)"/><text data-panel="stl-en-03-frame" x="95" y="187" fill="var(--color-amber)" font-family="l0g Stellantis" font-size="24" font-weight="700" text-anchor="middle">−7,309</text><text data-panel="stl-en-03-frame" x="95" y="566" fill="var(--color-paper)" font-family="l0g Stellantis" font-size="24" font-weight="700" text-anchor="middle">9M 2025</text><line x1="130" y1="514.287" x2="190" y2="514.287" stroke="var(--color-line-strong)" stroke-width="1"/><rect data-metric="bridge-change-eurm" data-value="252" x="190" y="503.451" width="70" height="10.8