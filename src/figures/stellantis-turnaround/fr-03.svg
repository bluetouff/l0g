<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="stl-fr-03-title stl-fr-03-desc" style="width:100%;height:auto" class="l0g-stellantis-svg"><title id="stl-fr-03-title">Investissements : paiements réduits</title><desc id="stl-fr-03-desc">Le flux industriel passe de −7 309 à −4 930 M€. Contributions arithmétiques : exploitation +252, moindres investissements et paiements +2 198, participations +415, cessions −481, retraites −5.</desc><rect id="stl-fr-03-frame" x="0" y="0" width="1000" height="680" rx="0" fill="var(--color-ink)"/><text data-panel="stl-fr-03-frame" x="40" y="34" fill="var(--color-signal)" font-family="l0g Stellantis" font-size="24" font-weight="700" text-anchor="start">l0g / STELLANTIS</text><text data-panel="stl-fr-03-frame" x="960" y="34" fill="var(--color-muted)" font-family="l0g Stellantis" font-size="24" font-weight="400" text-anchor="end">03</text><text data-panel="stl-fr-03-frame" x="40" y="85" fill="var(--color-paper)" font-family="l0g Stellantis" font-size="34" font-weight="700" text-anchor="start">Investissements : paiements réduits</text><text data-panel="stl-fr-03-frame" x="40" y="135" fill="var(--color-muted)" font-family="l0g Stellantis" font-size="24" font-weight="400" text-anchor="start">Neuf mois 2025 → 2026 · millions d’euros</text><rect data-metric="fcf-start-eurm" data-value="-7309" x="60" y="200" width="70" height="314.287" rx="0" fill="var(--color-amber)"/><text data-panel="stl-fr-03-frame" x="95" y="187" fill="var(--color-amber)" font-family="l0g Stellantis" font-size="24" font-weight="700" text-anchor="middle">−7 309</text><text data-panel="stl-fr-03-frame" x="95" y="566" fill="var(--color-paper)" font-family="l0g Stellantis" font-size="24" font-weight="700" text-anchor="middle">9M 2025</text><line x1="130" y1="514.287" x2="190" y2="514.287" stroke="var(--color-line-strong)" stroke-width="1"/><rect data-metric="bridge-change-eurm" data-value="252" x="190" y="503.451" width="70" height="10.