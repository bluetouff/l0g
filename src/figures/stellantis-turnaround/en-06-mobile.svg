<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1080" role="img" aria-labelledby="stl-en-06-mobile-title stl-en-06-mobile-desc" style="width:100%;height:auto" class="l0g-stellantis-svg"><title id="stl-en-06-mobile-title">Two fourth-quarter thresholds</title><desc id="stl-en-06-mobile-desc">EUR405m Q4 cash flow would match full-year 2025; improvement needs more. EUR4,930m would offset the first nine months. Repeating Q4 2025 cash flow of EUR2,784m gives −EUR2,146m for 2026: a teaching scenario.</desc><rect id="stl-en-06-mobile-frame" x="0" y="0" width="420" height="1080" rx="0" fill="var(--color-ink)"/><text data-panel="stl-en-06-mobile-frame" x="24" y="34" fill="var(--color-signal)" font-family="l0g Stellantis" font-size="18" font-weight="700" text-anchor="start">l0g / STELLANTIS</text><text data-panel="stl-en-06-mobile-frame" x="396" y="34" fill="var(--color-muted)" font-family="l0g Stellantis" font-size="18" font-weight="400" text-anchor="end">06</text><text data-panel="stl-en-06-mobile-frame" x="24" y="76" fill="var(--color-paper)" font-family="l0g Stellantis" font-size="28" font-weight="700" text-anchor="start">Two fourth-quarter</text><text data-panel="stl-en-06-mobile-frame" x="24" y="109.04" fill="var(--color-paper)" font-family="l0g Stellantis" font-size="28" font-weight="700" text-anchor="start">thresholds</text><text data-panel="stl-en-06-mobile-frame" x="24" y="150" fill="var(--color-muted)" font-family="l0g Stellantis" font-size="18" font-weight="400" text-anchor="start">Q4 2026 industrial FCF · EUR millions</text><rect id="stl-en-06-mobile-card-threshold-0" x="24" y="180" width="372" height="210" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="stl-en-06-mobile-card-threshold-0" x="40" y="214" fill="var(--color-paper)" font-family="l0g Stellantis" font-size="18" font-weight="700" text-anchor="start">Match full-year 2025 cash flow</text><text data-panel="stl-en-06-mobile-card-threshold-0" x="40" y="285" fill="var(--color-amber)" font-family="l0g Stellantis" font-size="30" font-weight="700" text-anchor="start">405 EUR m</text><rect data-metric="q4-threshold-eurm" data-value="405" x="40" y="328" width="27.602434" height="24" rx="0" fill="var(--color-amber)"/><rect id="stl-en-06-mobile-card-threshold-1" x="24" y="420" width="372" height="210" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="stl-en-06-mobile-card-threshold-1" x="40" y="454" fill="var(--color-paper)" font-family="l0g Stellantis" font-size="18" font-weight="700" text-anchor="start">Repeat Q4 2025: scenario</text><text data-panel="stl-en-06-mobile-card-threshold-1" x="40" y="525" fill="var(--color-signal)" font-family="l0g Stellantis" font-size="30" font-weight="700" text-anchor="start">2,784 EUR m</text><rect data-metric="q4-threshold-eurm" data-value="2784" x="40" y="568" width="189.741176" height="24" rx="0" fill="var(--color-signal)"/><rect id="stl-en-06-mobile-card-threshold-2" x="24" y="660" width="372" height="210" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="stl-en-06-mobile-card-threshold-2" x="40" y="694" fill="var(--color-paper)" font-family="l0g Stellantis" font-size="18" font-weight="700" text-anchor="start">Reach zero for the full year</text><text data-panel="stl-en-06-mobile-card-threshold-2" x="40" y="765" fill="var(--color-accent)" font-family="l0g Stellantis" font-size="30" font-weight="700" text-anchor="start">4,930 EUR m</text><rect data-metric="q4-threshold-eurm" data-value="4930" x="40" y="808" width="336" height="24" rx="0" fill="var(--color-accent)"/><text data-panel="stl-en-06-mobile-frame" x="24" y="943" fill="var(--color-signal)" font-family="l0g Stellantis" font-size="24" font-weight="700" text-anchor="start">Historical-repeat scenario:</text><text data-panel="stl-en-06-mobile-frame" x="24" y="975.4" fill="var(--color-signal)" font-family="l0g Stellantis" font-size="24" font-weight="700" text-anchor="start">−EUR2,146m for 2026.</text><text data-panel="stl-en-06-mobile-frame" x="24" y="1030" fill="var(--color-muted)" font-family="l0g Stellantis" font-size="18" font-weight="400" text-anchor="start">Q4 2026 unknown · scenario separate</text><text data-panel="stl-en-06-mobile-frame" x="24" y="1054.3" fill="var(--color-muted)" font-family="l0g Stellantis" font-size="18" font-weight="400" text-anchor="start">from a forecast.</text></svg>