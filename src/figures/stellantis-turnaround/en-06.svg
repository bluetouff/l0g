<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="stl-en-06-title stl-en-06-desc" style="width:100%;height:auto" class="l0g-stellantis-svg"><title id="stl-en-06-title">Two fourth-quarter thresholds</title><desc id="stl-en-06-desc">EUR405m Q4 cash flow would match full-year 2025; improvement needs more. EUR4,930m would offset the first nine months. Repeating Q4 2025 cash flow of EUR2,784m gives −EUR2,146m for 2026: a teaching scenario.</desc><rect id="stl-en-06-frame" x="0" y="0" width="1000" height="680" rx="0" fill="var(--color-ink)"/><text data-panel="stl-en-06-frame" x="40" y="34" fill="var(--color-signal)" font-family="l0g Stellantis" font-size="24" font-weight="700" text-anchor="start">l0g / STELLANTIS</text><text data-panel="stl-en-06-frame" x="960" y="34" fill="var(--color-muted)" font-family="l0g Stellantis" font-size="24" font-weight="400" text-anchor="end">06</text><text data-panel="stl-en-06-frame" x="40" y="85" fill="var(--color-paper)" font-family="l0g Stellantis" font-size="34" font-weight="700" text-anchor="start">Two fourth-quarter thresholds</text><text data-panel="stl-en-06-frame" x="40" y="135" fill="var(--color-muted)" font-family="l0g Stellantis" font-size="24" font-weight="400" text-anchor="start">Q4 2026 industrial FCF · EUR millions</text><rect id="stl-en-06-card-threshold-0" x="40" y="185" width="920" height="105" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="stl-en-06-card-threshold-0" x="56" y="219" fill="var(--color-paper)" font-family="l0g Stellantis" font-size="24" font-weight="700" text-anchor="start">Match full-year 2025 cash flow</text><text data-panel="stl-en-06-card-threshold-0" x="940" y="223" fill="var(--color-amber)" font-family="l0g Stellantis" font-size="32" font-weight="700" text-anchor="end">405 EUR m</text><rect data-metric="q4-threshold-eurm" data-value="405" x="240" y="249" width="50.111562" height="24" rx="0" fill="var(--color-amber)"/><rect id="stl-en-06-card-threshold-1" x="40" y="310" width="920" height="105" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="stl-en-06-card-threshold-1" x="56" y="344" fill="var(--color-paper)" font-family="l0g Stellantis" font-size="24" font-weight="700" text-anchor="start">Repeat Q4 2025: scenario</text><text data-panel="stl-en-06-card-threshold-1" x="940" y="348" fill="var(--color-signal)" font-family="l0g Stellantis" font-size="32" font-weight="700" text-anchor="end">2,784 EUR m</text><rect data-metric="q4-threshold-eurm" data-value="2784" x="240" y="374" width="344.470588" height="24" rx="0" fill="var(--color-signal)"/><rect id="stl-en-06-card-threshold-2" x="40" y="435" width="920" height="105" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="stl-en-06-card-threshold-2" x="56" y="469" fill="var(--color-paper)" font-family="l0g Stellantis" font-size="24" font-weight="700" text-anchor="start">Reach zero for the full year</text><text data-panel="stl-en-06-card-threshold-2" x="940" y="473" fill="var(--color-accent)" font-family="l0g Stellantis" font-size="32" font-weight="700" text-anchor="end">4,930 EUR m</text><rect data-metric="q4-threshold-eurm" data-value="4930" x="240" y="499" width="610" height="24" rx="0" fill="var(--color-accent)"/><text data-panel="stl-en-06-frame" x="40" y="603" fill="var(--color-signal)" font-family="l0g Stellantis" font-size="30" font-weight="700" text-anchor="start">Historical-repeat scenario: −EUR2,146m for 2026.</text><text data-panel="stl-en-06-frame" x="40" y="650" fill="var(--color-muted)" font-family="l0g Stellantis" font-size="24" font-weight="400" text-anchor="start">Q4 2026 unknown · scenario separate from a forecast.</text></svg>