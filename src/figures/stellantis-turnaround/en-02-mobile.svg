<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1080" role="img" aria-labelledby="stl-en-02-mobile-title stl-en-02-mobile-desc" style="width:100%;height:auto" class="l0g-stellantis-svg"><title id="stl-en-02-mobile-title">Output slows, invoices keep arriving</title><desc id="stl-en-02-mobile-desc">Suppliers deliver parts; the manufacturer ships to an independent dealer and collects cash quickly. Suppliers are paid later. The final retail sale has its own timing.</desc><rect id="stl-en-02-mobile-frame" x="0" y="0" width="420" height="1080" rx="0" fill="var(--color-ink)"/><text data-panel="stl-en-02-mobile-frame" x="24" y="34" fill="var(--color-signal)" font-family="l0g Stellantis" font-size="18" font-weight="700" text-anchor="start">l0g / STELLANTIS</text><text data-panel="stl-en-02-mobile-frame" x="396" y="34" fill="var(--color-muted)" font-family="l0g Stellantis" font-size="18" font-weight="400" text-anchor="end">02</text><text data-panel="stl-en-02-mobile-frame" x="24" y="76" fill="var(--color-paper)" font-family="l0g Stellantis" font-size="28" font-weight="700" text-anchor="start">Output slows, invoices</text><text data-panel="stl-en-02-mobile-frame" x="24" y="109.04" fill="var(--color-paper)" font-family="l0g Stellantis" font-size="28" font-weight="700" text-anchor="start">keep arriving</text><text data-panel="stl-en-02-mobile-frame" x="24" y="150" fill="var(--color-muted)" font-family="l0g Stellantis" font-size="18" font-weight="400" text-anchor="start">Parts, vehicles and payment timing</text><rect id="stl-en-02-mobile-card-actor-0" x="70" y="180" width="326" height="90" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="stl-en-02-mobile-card-actor-0" x="86" y="213" fill="var(--color-paper)" font-family="l0g Stellantis" font-size="22" font-weight="700" text-anchor="start">Supplier</text><text data-panel="stl-en-02-mobile-card-actor-0" x="86" y="248" fill="var(--color-muted)" font-family="l0g Stellan