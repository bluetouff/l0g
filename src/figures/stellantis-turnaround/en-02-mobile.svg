ont-size="22" font-weight="700" text-anchor="start">Dealer</text><text data-panel="stl-en-02-mobile-card-actor-2" x="86" y="608" fill="var(--color-muted)" font-family="l0g Stellantis" font-size="18" font-weight="400" text-anchor="start">Independent inventory</text><path data-connector="goods-2" d="M233 636 L233 705" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path data-connector="goods-2-tip" d="M229.164596 697.97934 L233 705 L236.835404 697.97934" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="stl-en-02-mobile-frame" x="255" y="675" fill="var(--color-muted)" font-family="l0g Stellantis" font-size="18" font-weight="400" text-anchor="start">Vehicle</text><rect id="stl-en-02-mobile-card-actor-3" x="70" y="720" width="326" height="90" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="stl-en-02-mobile-card-actor-3" x="86" y="753" fill="var(--color-paper)" font-family="l0g Stellantis" font-size="22" font-weight="700" text-anchor="start">Motorist</text><text data-panel="stl-en-02-mobile-card-actor-3" x="86" y="788" fill="var(--color-muted)" font-family="l0g Stellantis" font-size="18" font-weight="400" text-anchor="start">Final retail sale</text><path data-connector="dealer-cash" d="M403 585 L409 585 L409 405 L403 405" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path data-connector="dealer-cash-tip" d="M410.02066 401.164596 L403 405 L410.02066 408.835404" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path data-connector="supplier-cash" d="M64 405 L24 405 L24 225 L64 225" fill="none" stroke="var(--color-amber)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path data-connector="supplier-cash-tip" d="M56.97934 228.835404 L64 225 L56.97934 221.164596" fill="none" stroke="var(--color-amber)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="stl-en-02-mobile-frame" x="24" y="870" fill="var(--color-signal)" font-family="l0g Stellantis" font-size="18" font-weight="700" text-anchor="start">Dealer → maker: quick collection</text><text data-panel="stl-en-02-mobile-frame" x="24" y="925" fill="var(--color-amber)" font-family="l0g Stellantis" font-size="18" font-weight="700" text-anchor="start">Maker → supplier: later payment</text><text data-panel="stl-en-02-mobile-frame" x="24" y="1004" fill="var(--color-muted)" font-family="l0g Stellantis" font-size="18" font-weight="400" text-anchor="start">Manufacturer and dealer stocks remain</text><text data-panel="stl-en-02-mobile-frame" x="24" y="1028.3" fill="var(--color-muted)" font-family="l0g Stellantis" font-size="18" font-weight="400" text-anchor="start">separate.</text></svg>