<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1080" role="img" aria-labelledby="stl-en-05-mobile-title stl-en-05-mobile-desc" style="width:100%;height:auto" class="l0g-stellantis-svg"><title id="stl-en-05-mobile-title">Hybrid financing buys time</title><desc id="stl-en-05-mobile-desc">Three tranches: EUR2.2bn at 6.25%, EUR1.8bn at 6.875%, GBP865m at 8.25%. Reported net proceeds EUR4.927bn. Financing cash flow and IAS32 equity classification; perpetual securities and conditional coupon deferral.</desc><rect id="stl-en-05-mobile-frame" x="0" y="0" width="420" height="1080" rx="0" fill="var(--color-ink)"/><text data-panel="stl-en-05-mobile-frame" x="24" y="34" fill="var(--color-signal)" font-family="l0g Stellantis" font-size="18" font-weight="700" text-anchor="start">l0g / STELLANTIS</text><text data-panel="stl-en-05-mobile-frame" x="396" y="34" fill="var(--color-muted)" font-family="l0g Stellantis" font-size="18" font-weight="400" text-anchor="end">05</text><text data-panel="stl-en-05-mobile-frame" x="24" y="76" fill="var(--color-paper)" font-family="l0g Stellantis" font-size="28" font-weight="700" text-anchor="start">Hybrid financing buys</text><text data-panel="stl-en-05-mobile-frame" x="24" y="109.04" fill="var(--color-paper)" font-family="l0g Stellantis" font-size="28" font-weight="700" text-anchor="start">time</text><text data-panel="stl-en-05-mobile-frame" x="24" y="150" fill="var(--color-muted)" font-family="l0g Stellantis" font-size="18" font-weight="400" text-anchor="start">March 2026 issue · original currencies</text><rect id="stl-en-05-mobile-card-tranche-0" x="70" y="180" width="326" height="126" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="stl-en-05-mobile-card-tranche-0" x="86" y="222" fill="var(--color-paper)" font-family="l0g Stellantis" font-size="28" font-weight="700" text-anchor="start">EUR2.2bn</text><text data-panel="stl-en-05-mobile-card-tranche-0" x="86" y="266" fill="var(--color-muted)" font-family="l0g Stellantis" font-size="18" font-weight="400" text-anchor="start">Initial coupon</text><text data-panel="stl-en-05-mobile-card-tranche-0" x="380" y="294" fill="var(--color-amber)" font-family="l0g Stellantis" font-size="24" font-weight="700" text-anchor="end">6.25%</text><path data-connector="branch-0" d="M64 243 L24 243" fill="none" stroke="var(--color-line-strong)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect id="stl-en-05-mobile-card-tranche-1" x="70" y="365" width="326" height="126" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="stl-en-05-mobile-card-tranche-1" x="86" y="407" fill="var(--color-paper)" font-family="l0g Stellantis" font-size="28" font-weight="700" text-anchor="start">EUR1.8bn</text><text data-panel="stl-en-05-mobile-card-tranche-1" x="86" y="451" fill="var(--color-muted)" font-family="l0g Stellantis" font-size="18" font-weight="400" text-anchor="start">Initial coupon</text><text data-panel="stl-en-05-mobile-card-tranche-1" x="380" y="479" fill="var(--color-amber)" font-family="l0g Stellantis" font-size="24" font-weight="700" text-anchor="end">6.875%</text><path data-connector="branch-1" d="M64 428 L24 428" fill="none" stroke="var(--color-line-strong)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect id="stl-en-05-mobile-card-tranche-2" x="70" y="550" width="326" height="126" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="stl-en-05-mobile-card-tranche-2" x="86" y="592" fill="var(--color-paper)" font-family="l0g Stellantis" font-size="28" font-weight="700" text-anchor="start">GBP865m</text><text data-panel="stl-en-05-mobile-card-tranche-2" x="86" y="636" fill="var(--color-muted)" font-family="l0g Stellantis" font-size="18" font-weight="400" text-anchor="start">Initial coupon</text><text data-panel="stl-en-05-mobile-card-tranche-2" x="380" y="664" fill="var(--color-amber)" font-family="l0g Stellantis" font-size="24" font-weight="700" text-anchor="end">8.25%</text><path data-connector="branch-2" d="M64 613 L24 613" fill="none" stroke="var(--color-line-strong)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path data-connector="proceeds" d="M24 243 L24 735 L210 735 L210 770" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path data-connector="proceeds-tip" d="M206.164596 762.97934 L210 770 L213.835404 762.97934" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect id="stl-en-05-mobile-card-net" x="24" y="790" width="372" height="114" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="stl-en-05-mobile-card-net" x="42" y="836" fill="var(--color-signal)" font-family="l0g Stellantis" font-size="30" font-weight="700" text-anchor="start">EUR4.927bn net</text><text data-panel="stl-en-05-mobile-card-net" x="42" y="875" fill="var(--color-muted)" font-family="l0g Stellantis" font-size="18" font-weight="400" text-anchor="start">Reported net euro proceeds</text><text data-panel="stl-en-05-mobile-frame" x="24" y="947" fill="var(--color-signal)" font-family="l0g Stellantis" font-size="18" font-weight="700" text-anchor="start">Financing · outside industrial FCF</text><text data-panel="stl-en-05-mobile-frame" x="24" y="989" fill="var(--color-amber)" font-family="l0g Stellantis" font-size="18" font-weight="700" text-anchor="start">IAS 32 equity · perpetual securities</text><text data-panel="stl-en-05-mobile-frame" x="24" y="1033" fill="var(--color-muted)" font-family="l0g Stellantis" font-size="18" font-weight="400" text-anchor="start">Coupon deferral is conditional.</text></svg>