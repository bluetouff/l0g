<title id="arkea-maine-en-d-title">Maine: from seizure to announced return</title><desc id="arkea-maine-en-d-desc">A proportional timeline of an individual court case. Seizure of 470773 USDT on March 6, 2024; civil complaint January 17, 2025; forfeiture June 25, 2025; DOJ announcement of approximately470735 dollars to be returned March 13, 2026. The737days run from seizure to announcement; final-credit date is undocumented. Distinct units and amounts are preserved, with no explanation of their difference or inferred average recovery time.</desc>
