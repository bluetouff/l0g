<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="arkea-control-en-d-title arkea-control-en-d-desc" style="width:100%;height:auto" class="l0g-arkea-svg">
<title id="arkea-control-en-d-title">Control can overlap on the same token</title><desc id="arkea-control-en-d-desc">Generic examples of native USDC with the controls documented by Circle. A custodian controls the account and signing means; the issuer retains token controls. In self-custody, the holder controls signing means while token restrictions still apply. Bitcoin has different levers: keys or a custodian. No actual Arkéa transaction is represented.</desc>
