<text x="24" y="42" font-family="l0g Arkea Recovery" font-size="24" font-weight="400" text-anchor="start" fill="var(--color-signal)" data-panel="arkea-control-en-d-header">l0g / RECOVERY</text>
<text x="24" y="92" font-family="l0g Arkea Recovery" font-size="34" font-weight="400" text-anchor="start" fill="var(--color-paper)" data-panel="arkea-control-en-d-header">Control can overlap on the same token</text>
