<title id="arkea-transfer-fr-d-title">Le virement change d’interlocuteur</title><desc id="arkea-transfer-fr-d-desc">Circuit générique : un arrêt peut intervenir avant exécution ; après crédit, le rappel demande un retour conditionnel. Le solde disponible, le droit et la coopération déterminent la suite. Le circuit utilisé chez Arkéa reste à établir.</desc>
