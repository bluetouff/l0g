<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="arkea-maine-fr-d-title arkea-maine-fr-d-desc" style="width:100%;height:auto" class="l0g-arkea-svg">
<title id="arkea-maine-fr-d-title">Maine : de la saisie au retour annoncé</title><desc id="arkea-maine-fr-d-desc">Chronologie proportionnelle d’un dossier judiciaire individuel. Saisie de 470773 USDT le 6 mars 2024 ; plainte civile le 17 janvier 2025 ; confiscation le 25 juin 2025 ; annonce par le DOJ du retour d’environ 470735 dollars le 13 mars 2026. Écart de 737 jours entre saisie et annonce, sans date documentée de crédit final. Montants et unités différents conservés ; aucune explication de leur différence ni délai moyen n’est déduit.</desc>
