<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 920" role="img" aria-labelledby="arkea-control-fr-m-title arkea-control-fr-m-desc" style="width:100%;height:auto" class="l0g-arkea-svg">
<title id="arkea-control-fr-m-title">Les leviers se superposent sur un même jeton</title><desc id="arkea-control-fr-m-desc">Exemples génériques portant sur un USDC natif doté des contrôles décrits par Circle. Chez un dépositaire, celui-ci contrôle le compte et les moyens de signature ; l’émetteur conserve ses contrôles sur le jeton. En garde autonome, le détenteur possède les moyens de signature, avec les restrictions du jeton toujours applicables. Bitcoin relève d’autres leviers : clés ou dépositaire. Aucune opération du cas Arkéa n’est représentée.</desc>
