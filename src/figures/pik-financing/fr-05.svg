<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="pik-fr-05-title pik-fr-05-desc" style="width:100%;height:auto" class="l0g-pik-svg"><title id="pik-fr-05-title">Le revenu précède parfois le cash</title><desc id="pik-fr-05-desc">OTF : revenus d’investissement comptabilisés au deuxième trimestre 2026, en millions de dollars. Le PIK représente 7,46% au titre des intérêts et 12,51% avec les dividendes. 25,224 M $ d’intérêts PIK et 17,062 M $ de dividendes PIK sur 338,032 M $ de revenus d’investissement. Le solde 295,746 M $ désigne d’autres revenus comptabilisés, dont l’encaissement doit être vérifié séparément. Portefeuille technologique ; aucun lien de prêt avec DevCo n’est inféré.</desc><rect id="pik-fr-05-frame" x="0" y="0" width="1000" height="680" rx="0" fill="var(--color-ink)"/><text data-panel="pik-fr-05-frame" x="40" y="34" fill="var(--color-signal)" font-family="l0g PIK" font-size="24" font-weight="700" text-anchor="start">l0g / PIK</text><text data-panel="pik-fr-05-frame" x="960" y="34" fill="var(--color-muted)" font-family="l0g PIK" font-size="24" font-weight="400" text-anchor="end">05</text><text data-panel="pik-fr-05-frame" x="40" y="88" fill="var(--color-paper)" font-family="l0g PIK" font-size="34" font-weight="700" text-anchor="start">Le revenu précède parfois le cash</text><text data-panel="pik-fr-05-frame" x="40" y="134" fill="var(--color-muted)" font-family="l0g PIK" font-size="24" font-weight="400" text-anchor="start">OTF · T2/Q2 2026 · M$ / USDm</text><rect id="pik-fr-05-card-total" x="40" y="180" width="920" height="130" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-fr-05-card-total" x="62" y="229" fill="var(--color-signal)" font-family="l0g PIK" font-size="40" font-weight="700" text-anchor="start">338,032 M$</text><text data-panel="pik-fr-05-card-total" x="420" y="225" fill="var(--color-paper)" font-family="l0g PIK" font-size="24" font-weight="400" text-anchor="start">Revenus d’investissement comptabilisés</text><rect id="pik-fr-05-card-0" x="40" y="330" width="920" height="64" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-fr-05-card-0" x="54" y="361" fill="var(--color-paper)" font-family="l0g PIK" font-size="24" font-weight="700" text-anchor="start">Intérêts PIK</text><text data-panel="pik-fr-05-card-0" x="470" y="363" fill="var(--color-amber)" font-family="l0g PIK" font-size="28" font-weight="700" text-anchor="start">25,224</text><rect data-metric="income-usdm" data-value="25.224" x="660" y="353" width="20.147442" height="22" rx="8" fill="var(--color-amber)"/><rect id="pik-fr-05-card-1" x="40" y="406" width="920" height="64" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-fr-05-card-1" x="54" y="437" fill="var(--color-paper)" font-family="l0g PIK" font-size="24" font-weight="700" text-anchor="start">Dividendes PIK</text><text data-panel="pik-fr-05-card-1" x="470" y="439" fill="var(--color-accent)" font-family="l0g PIK" font-size="28" font-weight="700" text-anchor="start">17,062</text><rect data-metric="income-usdm" data-value="17.062" x="660" y="429" width="13.628118" height="22" rx="8" fill="var(--color-accent)"/><rect id="pik-fr-05-card-2" x="40" y="482" width="920" height="64" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-fr-05-card-2" x="54" y="513" fill="var(--color-paper)" font-family="l0g PIK" font-size="24" font-weight="700" text-anchor="start">Autres revenus</text><text data-panel="pik-fr-05-card-2" x="470" y="515" fill="var(--color-signal)" font-family="l0g PIK" font-size="28" font-weight="700" text-anchor="start">295,746</text><rect data-metric="income-usdm" data-value="295.746" x="660" y="505" width="236.22444" height="22" rx="8" fill="var(--color-signal)"/><text data-panel="pik-fr-05-frame" x="40" y="582" fill="var(--color-paper)" font-family="l0g PIK" font-size="24" font-weight="400" text-anchor="start">PIK : 7,46 % intérêts ; 12,51 % avec dividendes.</text><text data-panel="pik-fr-05-frame" x="40" y="614.4" fill="var(--color-paper)" font-family="l0g PIK" font-size="24" font-weight="400" text-anchor="start">Autres revenus : encaissement à vérifier.</text><text data-panel="pik-fr-05-frame" x="40" y="665" fill="var(--color-muted)" font-family="l0g PIK" font-size="24" font-weight="400" text-anchor="start">S10 · revenus, avant charges du véhicule</text></svg>