<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="pik-fr-02-title pik-fr-02-desc" style="width:100%;height:auto" class="l0g-pik-svg"><title id="pik-fr-02-title">Le PIK renforce la priorité</title><desc id="pik-fr-02-desc">Titres préférentiels TopCo 2 : les dividendes PIK augmentent les droits prioritaires de l’investisseur. Le schéma présente les distributions entre porteurs de titres. 60,1 M $ sur juin–août 2026, sans annualisation. Taux initial 12,75%, accumulation quotidienne et composition semestrielle. Distributions sous restrictions et exceptions contractuelles. Droits de vente possibles en 2032 et choix cash/PIK jusqu’en 2035 selon les conditions prévues.</desc><rect id="pik-fr-02-frame" x="0" y="0" width="1000" height="680" rx="0" fill="var(--color-ink)"/><text data-panel="pik-fr-02-frame" x="40" y="34" fill="var(--color-signal)" font-family="l0g PIK" font-size="24" font-weight="700" text-anchor="start">l0g / PIK</text><text data-panel="pik-fr-02-frame" x="960" y="34" fill="var(--color-muted)" font-family="l0g PIK" font-size="24" font-weight="400" text-anchor="end">02</text><text data-panel="pik-fr-02-frame" x="40" y="88" fill="var(--color-paper)" font-family="l0g PIK" font-size="34" font-weight="700" text-anchor="start">Le PIK renforce la priorité</text><text data-panel="pik-fr-02-frame" x="40" y="134" fill="var(--color-muted)" font-family="l0g PIK" font-size="24" font-weight="400" text-anchor="start">TopCo2 · titres préférentiels / preferred equity</text><rect id="pik-fr-02-card-headline" x="40" y="170" width="920" height="114" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-fr-02-card-headline" x="62" y="216" fill="var(--color-signal)" font-family="l0g PIK" font-size="40" font-weight="700" text-anchor="start">60,1 M$</text><text data-panel="pik-fr-02-card-headline" x="340" y="208" fill="var(--color-muted)" font-family="l0g PIK" font-size="24" font-weight=