<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1080" role="img" aria-labelledby="pik-fr-02-mobile-title pik-fr-02-mobile-desc" style="width:100%;height:auto" class="l0g-pik-svg"><title id="pik-fr-02-mobile-title">Le PIK renforce la priorité</title><desc id="pik-fr-02-mobile-desc">Titres préférentiels TopCo 2 : les dividendes PIK augmentent les droits prioritaires de l’investisseur. Le schéma présente les distributions entre porteurs de titres. 60,1 M $ sur juin–août 2026, sans annualisation. Taux initial 12,75%, accumulation quotidienne et composition semestrielle. Distributions sous restrictions et exceptions contractuelles. Droits de vente possibles en 2032 et choix cash/PIK jusqu’en 2035 selon les conditions prévues.</desc><rect id="pik-fr-02-mobile-frame" x="0" y="0" width="420" height="1080" rx="0" fill="var(--color-ink)"/><text data-panel="pik-fr-02-mobile-frame" x="24" y="34" fill="var(--color-signal)" font-family="l0g PIK" font-size="18" font-weight="700" text-anchor="start">l0g / PIK</text><text data-panel="pik-fr-02-mobile-frame" x="396" y="34" fill="var(--color-muted)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="end">02</text><text data-panel="pik-fr-02-mobile-frame" x="24" y="76" fill="var(--color-paper)" font-family="l0g PIK" font-size="28" font-weight="700" text-anchor="start">Le PIK renforce la</text><text data-panel="pik-fr-02-mobile-frame" x="24" y="109.04" fill="var(--color-paper)" font-family="l0g PIK" font-size="28" font-weight="700" text-anchor="start">priorité</text><text data-panel="pik-fr-02-mobile-frame" x="24" y="136" fill="var(--color-muted)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">TopCo2 · titres préférentiels / preferred</text><text data-panel="pik-fr-02-mobile-frame" x="24" y="160.3" fill="var(--color-muted)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">equity</text><rect id="pik-fr-02-mobile-card-headline" x="24" y="178" width="372" heigh