" stroke-width="1"/><text data-panel="pik-fr-02-mobile-card-waterfall1" x="38" y="515" fill="var(--color-amber)" font-family="l0g PIK" font-size="18" font-weight="700" text-anchor="start">02</text><text data-panel="pik-fr-02-mobile-card-waterfall1" x="82" y="518" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">Dividendes préférentiels impayés</text><line x1="210" y1="561" x2="210" y2="574" stroke="var(--color-signal)" stroke-width="2"/><path d="M206.164596 566.979340 L210.0 574 L213.835404 566.979340" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect id="pik-fr-02-mobile-card-waterfall2" x="24" y="577" width="372" height="68" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-fr-02-mobile-card-waterfall2" x="38" y="601" fill="var(--color-amber)" font-family="l0g PIK" font-size="18" font-weight="700" text-anchor="start">03</text><text data-panel="pik-fr-02-mobile-card-waterfall2" x="82" y="604" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">Montant prioritaire à atteindre</text><line x1="210" y1="647" x2="210" y2="660" stroke="var(--color-signal)" stroke-width="2"/><path d="M206.164596 652.979340 L210.0 660 L213.835404 652.979340" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect id="pik-fr-02-mobile-card-waterfall3" x="24" y="663" width="372" height="68" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-fr-02-mobile-card-waterfall3" x="38" y="687" fill="var(--color-signal)" font-family="l0g PIK" font-size="18" font-weight="700" text-anchor="start">04</text><text data-panel="pik-fr-02-mobile-card-waterfall3" x="82" y="690" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">Solde aux porteurs ordinaires</text><rect id="pik-fr-02-mobile-card-date0" x="24" y="778" width="372" height="92" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-fr-02-mobile-card-date0" x="38" y="812" fill="var(--color-amber)" font-family="l0g PIK" font-size="24" font-weight="700" text-anchor="start">2032</text><text data-panel="pik-fr-02-mobile-card-date0" x="121" y="805" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">Processus de vente possible</text><text data-panel="pik-fr-02-mobile-card-date0" x="121" y="829.3" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">si les titres restent en</text><text data-panel="pik-fr-02-mobile-card-date0" x="121" y="853.6" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">circulation</text><rect id="pik-fr-02-mobile-card-date1" x="24" y="882" width="372" height="92" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-fr-02-mobile-card-date1" x="38" y="916" fill="var(--color-amber)" font-family="l0g PIK" font-size="24" font-weight="700" text-anchor="start">2035</text><text data-panel="pik-fr-02-mobile-card-date1" x="121" y="909" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">Choix cash/PIK jusqu’au 6</text><text data-panel="pik-fr-02-mobile-card-date1" x="121" y="933.3" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">octobre,</text><text data-panel="pik-fr-02-mobile-card-date1" x="121" y="957.6" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">sous exceptions</text><text data-panel="pik-fr-02-mobile-frame" x="24" y="1022" fill="var(--color-muted)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">S01/S08/S09 · distributions sous</text><text data-panel="pik-fr-02-mobile-frame" x="24" y="1046.3" fill="var(--color-muted)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">restrictions</text></svg>