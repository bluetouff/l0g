<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1080" role="img" aria-labelledby="pik-en-05-mobile-title pik-en-05-mobile-desc" style="width:100%;height:auto" class="l0g-pik-svg"><title id="pik-en-05-mobile-title">Income can precede cash collection</title><desc id="pik-en-05-mobile-desc">OTF recognised investment income for Q 2 2026, USD millions. PIK interest represents 7.46%; including PIK dividends takes the share to 12.51%. $25.224 m PIK interest plus $17.062 m PIK dividends on $338.032 m of investment income. The remaining $295.746 m is other recognised income, whose collection requires separate evidence. Technology portfolio; no lending link to DevCo is inferred.</desc><rect id="pik-en-05-mobile-frame" x="0" y="0" width="420" height="1080" rx="0" fill="var(--color-ink)"/><text data-panel="pik-en-05-mobile-frame" x="24" y="34" fill="var(--color-signal)" font-family="l0g PIK" font-size="18" font-weight="700" text-anchor="start">l0g / PIK</text><text data-panel="pik-en-05-mobile-frame" x="396" y="34" fill="var(--color-muted)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="end">05</text><text data-panel="pik-en-05-mobile-frame" x="24" y="76" fill="var(--color-paper)" font-family="l0g PIK" font-size="28" font-weight="700" text-anchor="start">Income can precede</text><text data-panel="pik-en-05-mobile-frame" x="24" y="109.04" fill="var(--color-paper)" font-family="l0g PIK" font-size="28" font-weight="700" text-anchor="start">cash collection</text><text data-panel="pik-en-05-mobile-frame" x="24" y="136" fill="var(--color-muted)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">OTF · T2/Q2 2026 · M$ / USDm</text><rect id="pik-en-05-mobile-card-total" x="24" y="180" width="372" height="130" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-en-05-mobile-card-total" x="42" y="229" fill="var(--color-signal)" font-family="l0g PIK" font-size="30" font-weight="700" text-anchor="start">$338.032m</text><text data-panel="pik-en-05-mobile-card-total" x="42" y="272" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">Recognised investment income</text><rect id="pik-en-05-mobile-card-0" x="24" y="350" width="372" height="150" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-en-05-mobile-card-0" x="38" y="381" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="700" text-anchor="start">PIK interest</text><text data-panel="pik-en-05-mobile-card-0" x="38" y="425" fill="var(--color-amber)" font-family="l0g PIK" font-size="24" font-weight="700" text-anchor="start">25.224</text><rect data-metric="income-usdm" data-value="25.224" x="38" y="455" width="25.669333" height="22" rx="8" fill="var(--color-amber)"/><rect id="pik-en-05-mobile-card-1" x="24" y="524" width="372" height="150" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-en-05-mobile-card-1" x="38" y="555" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="700" text-anchor="start">PIK dividends</text><text data-panel="pik-en-05-mobile-card-1" x="38" y="599" fill="var(--color-accent)" font-family="l0g PIK" font-size="24" font-weight="700" text-anchor="start">17.062</text><rect data-metric="income-usdm" data-value="17.062" x="38" y="629" width="17.363232" height="22" rx="8" fill="var(--color-accent)"/><rect id="pik-en-05-mobile-card-2" x="24" y="698" width="372" height="150" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-en-05-mobile-card-2" x="38" y="729" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="700" text-anchor="start">Other recognised income</text><text data-panel="pik-en-05-mobile-card-2" x="38" y="773" fill="var(--color-signal)" font-family="l0g PIK" font-size="24" font-weight="700" text-anchor="start">295.746</text><rect data-metric="income-usdm" data-value="295.746" x="38" y="803" width="300.967435" height="22" rx="8" fill="var(--color-signal)"/><text data-panel="pik-en-05-mobile-frame" x="24" y="928" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">PIK: 7.46% interest; 12.51% with</text><text data-panel="pik-en-05-mobile-frame" x="24" y="952.3" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">dividends.</text><text data-panel="pik-en-05-mobile-frame" x="24" y="976.6" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">Other income differs from cash collected.</text><text data-panel="pik-en-05-mobile-frame" x="24" y="1022" fill="var(--color-muted)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">S10 · income before vehicle expenses</text></svg>