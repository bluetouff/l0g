<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1080" role="img" aria-labelledby="pik-en-06-mobile-title pik-en-06-mobile-desc" style="width:100%;height:auto" class="l0g-pik-svg"><title id="pik-en-06-mobile-title">Capitalised and paid in cash</title><desc id="pik-en-06-mobile-desc">CoreWeave:$806 m net of capitalised amounts plus $176 m included in asset costs comprise $982 m of cash interest payments for H 1 2026. $176 m is already included in $982 m. Adding interest to asset cost and paying a creditor in kind describe different treatments. Consolidated six-month amounts in nominal dollars, without annualisation.</desc><rect id="pik-en-06-mobile-frame" x="0" y="0" width="420" height="1080" rx="0" fill="var(--color-ink)"/><text data-panel="pik-en-06-mobile-frame" x="24" y="34" fill="var(--color-signal)" font-family="l0g PIK" font-size="18" font-weight="700" text-anchor="start">l0g / PIK</text><text data-panel="pik-en-06-mobile-frame" x="396" y="34" fill="var(--color-muted)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="end">06</text><text data-panel="pik-en-06-mobile-frame" x="24" y="76" fill="var(--color-paper)" font-family="l0g PIK" font-size="28" font-weight="700" text-anchor="start">Capitalised and paid in</text><text data-panel="pik-en-06-mobile-frame" x="24" y="109.04" fill="var(--color-paper)" font-family="l0g PIK" font-size="28" font-weight="700" text-anchor="start">cash</text><text data-panel="pik-en-06-mobile-frame" x="24" y="136" fill="var(--color-muted)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">CoreWeave · S1/H1 2026 · M$ / USDm</text><rect id="pik-en-06-mobile-card-total" x="24" y="185" width="372" height="130" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-en-06-mobile-card-total" x="42" y="238" fill="var(--color-signal)" font-family="l0g PIK" font-size="40" font-weight="700" text-anchor="start">$982m</text><text data-panel="pik-en-06-mobile-card-total" x="42" y="282" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">Cash interest payments</text><rect id="pik-en-06-mobile-card-0" x="24" y="365" width="372" height="208" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-en-06-mobile-card-0" x="40" y="413" fill="var(--color-signal)" font-family="l0g PIK" font-size="32" font-weight="700" text-anchor="start">$806m</text><text data-panel="pik-en-06-mobile-card-0" x="40" y="457" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">Net of capitalised amounts</text><rect data-metric="cash-interest-usdm" data-value="806" x="40" y="510" width="279.063136" height="24" rx="8" fill="var(--color-signal)"/><rect id="pik-en-06-mobile-card-1" x="24" y="600" width="372" height="208" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-en-06-mobile-card-1" x="40" y="648" fill="var(--color-amber)" font-family="l0g PIK" font-size="32" font-weight="700" text-anchor="start">$176m</text><text data-panel="pik-en-06-mobile-card-1" x="40" y="692" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">Included in asset costs</text><rect data-metric="cash-interest-usdm" data-value="176" x="40" y="745" width="60.936864" height="24" rx="8" fill="var(--color-amber)"/><text data-panel="pik-en-06-mobile-frame" x="24" y="900" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">806 + 176 = 982</text><text data-panel="pik-en-06-mobile-frame" x="24" y="924.3" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">Two accounting treatments, one cash</text><text data-panel="pik-en-06-mobile-frame" x="24" y="948.6" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">total.</text><text data-panel="pik-en-06-mobile-frame" x="24" y="1022" fill="var(--color-muted)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">S13 · $176m already included in the</text><text data-panel="pik-en-06-mobile-frame" x="24" y="1046.3" fill="var(--color-muted)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">$982m</text></svg>