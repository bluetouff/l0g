ht="400" text-anchor="start">months</text><rect id="pik-en-01-mobile-card-term1" x="151" y="802" width="118" height="152" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-en-01-mobile-card-term1" x="167" y="845" fill="var(--color-amber)" font-family="l0g PIK" font-size="26" font-weight="700" text-anchor="start">1.10×</text><text data-panel="pik-en-01-mobile-card-term1" x="167" y="875" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">After 4,</text><text data-panel="pik-en-01-mobile-card-term1" x="167" y="899.3" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">before 12</text><text data-panel="pik-en-01-mobile-card-term1" x="167" y="923.6" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">months</text><rect id="pik-en-01-mobile-card-term2" x="278" y="802" width="118" height="152" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-en-01-mobile-card-term2" x="294" y="845" fill="var(--color-amber)" font-family="l0g PIK" font-size="26" font-weight="700" text-anchor="start">1.25×</text><text data-panel="pik-en-01-mobile-card-term2" x="294" y="875" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">From 12</text><text data-panel="pik-en-01-mobile-card-term2" x="294" y="899.3" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">months</text><text data-panel="pik-en-01-mobile-frame" x="24" y="1022" fill="var(--color-muted)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">S03–S07 · multiples are not annual rates</text></svg>