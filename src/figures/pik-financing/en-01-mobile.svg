<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1080" role="img" aria-labelledby="pik-en-01-mobile-title pik-en-01-mobile-desc" style="width:100%;height:auto" class="l0g-pik-svg"><title id="pik-en-01-mobile-title">The PIK loan reaches its exit</title><desc id="pik-en-01-mobile-desc">Historical DevCo loan: a $45 m initial draw, then $40 m within the original $55 m discretionary envelope, leaving $15 m conditional. Fully repaid on 29 May 2026. Contract and repayment dates. The 1.06/1.10/1.25 first-draw multiples are not annual rates. Some terms are redacted; no realised lender return is reconstructed.</desc><rect id="pik-en-01-mobile-frame" x="0" y="0" width="420" height="1080" rx="0" fill="var(--color-ink)"/><text data-panel="pik-en-01-mobile-frame" x="24" y="34" fill="var(--color-signal)" font-family="l0g PIK" font-size="18" font-weight="700" text-anchor="start">l0g / PIK</text><text data-panel="pik-en-01-mobile-frame" x="396" y="34" fill="var(--color-muted)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="end">01</text><text data-panel="pik-en-01-mobile-frame" x="24" y="76" fill="var(--color-paper)" font-family="l0g PIK" font-size="28" font-weight="700" text-anchor="start">The PIK loan reaches</text><text data-panel="pik-en-01-mobile-frame" x="24" y="109.04" fill="var(--color-paper)" font-family="l0g PIK" font-size="28" font-weight="700" text-anchor="start">its exit</text><text data-panel="pik-en-01-mobile-frame" x="24" y="136" fill="var(--color-muted)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">DevCo · 2025–2026 · M$ / USDm</text><rect id="pik-en-01-mobile-card-0" x="24" y="180" width="372" height="170" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-en-01-mobile-card-0" x="40" y="208" fill="var(--color-muted)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">18.12.2025</text><text data-panel="pik-en-01-mobile-card-0" x="40" y="250" fill="var(--color-signal)" font-family="l0g PIK" font-size="30" font-weight="700" text-anchor="start">$45m</text><text data-panel="pik-en-01-mobile-card-0" x="40" y="283" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="700" text-anchor="start">Initial draw</text><text data-panel="pik-en-01-mobile-card-0" x="40" y="312" fill="var(--color-muted)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">8%; monthly PIK for twelve months.</text><line x1="210" y1="353" x2="210" y2="366" stroke="var(--color-signal)" stroke-width="2"/><path d="M206.164596 358.979340 L210.0 366 L213.835404 358.979340" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect id="pik-en-01-mobile-card-1" x="24" y="374" width="372" height="170" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-en-01-mobile-card-1" x="40" y="402" fill="var(--color-muted)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">24.02.2026</text><text data-panel="pik-en-01-mobile-card-1" x="40" y="444" fill="var(--color-signal)" font-family="l0g PIK" font-size="30" font-weight="700" text-anchor="start">$40m</text><text data-panel="pik-en-01-mobile-card-1" x="40" y="477" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="700" text-anchor="start">Further draw</text><text data-panel="pik-en-01-mobile-card-1" x="40" y="506" fill="var(--color-muted)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">Within the $55m envelope; $15m</text><text data-panel="pik-en-01-mobile-card-1" x="40" y="530.3" fill="var(--color-muted)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">conditional.</text><line x1="210" y1="547" x2="210" y2="560" stroke="var(--color-signal)" stroke-width="2"/><path d="M206.164596 552.979340 L210.0 560 L213.835404 552.979340" fill="none" s