<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1080" role="img" aria-labelledby="pik-fr-03-mobile-title pik-fr-03-mobile-desc" style="width:100%;height:auto" class="l0g-pik-svg"><title id="pik-fr-03-mobile-title">Trois rythmes, un même taux</title><desc id="pik-fr-03-mobile-desc">Modèle fictif M 01 : trois rythmes de paiement à un taux annuel identique de 12%. Les paiements plus tardifs produisent une dette finale plus élevée. 100 M $ de principal initial, trois ans, intérêts capitalisés annuellement et aucun remboursement de principal intermédiaire. Coupons cash cumulés :36/19,10/0 M $ ; dette finale :100/119,10/140,49 M $. Le rendement promis reste 12% si tous les paiements sont honorés. Hors frais, fiscalité et défaut.</desc><rect id="pik-fr-03-mobile-frame" x="0" y="0" width="420" height="1080" rx="0" fill="var(--color-ink)"/><text data-panel="pik-fr-03-mobile-frame" x="24" y="34" fill="var(--color-signal)" font-family="l0g PIK" font-size="18" font-weight="700" text-anchor="start">l0g / PIK</text><text data-panel="pik-fr-03-mobile-frame" x="396" y="34" fill="var(--color-muted)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="end">03</text><text data-panel="pik-fr-03-mobile-frame" x="24" y="76" fill="var(--color-paper)" font-family="l0g PIK" font-size="28" font-weight="700" text-anchor="start">Trois rythmes, un</text><text data-panel="pik-fr-03-mobile-frame" x="24" y="109.04" fill="var(--color-paper)" font-family="l0g PIK" font-size="28" font-weight="700" text-anchor="start">même taux</text><text data-panel="pik-fr-03-mobile-frame" x="24" y="136" fill="var(--color-muted)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">M01 fictif / hypothetical · 100 M$ · 12 % ·</text><text data-panel="pik-fr-03-mobile-frame" x="24" y="160.3" fill="var(--color-muted)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">3 ans/years</text><rect id="pik-fr-03-mobile-card-0" x="24" y="180" width="372" height="214" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-fr-03-mobile-card-0" x="40" y="215" fill="var(--color-signal)" font-family="l0g PIK" font-size="24" font-weight="700" text-anchor="start">CASH</text><text data-panel="pik-fr-03-mobile-card-0" x="40" y="255" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">Coupons cash : 36,00</text><text data-panel="pik-fr-03-mobile-card-0" x="40" y="295" fill="var(--color-amber)" font-family="l0g PIK" font-size="20" font-weight="700" text-anchor="start">Dette finale : 100,00</text><rect data-metric="final-debt" data-value="100" x="40" y="326" width="226.666667" height="28" rx="8" fill="var(--color-amber)"/><rect id="pik-fr-03-mobile-card-1" x="24" y="417" width="372" height="214" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-fr-03-mobile-card-1" x="40" y="452" fill="var(--color-signal)" font-family="l0g PIK" font-size="24" font-weight="700" text-anchor="start">50 % PIK</text><text data-panel="pik-fr-03-mobile-card-1" x="40" y="492" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">Coupons cash : 19,10</text><text data-panel="pik-fr-03-mobile-card-1" x="40" y="532" fill="var(--color-amber)" font-family="l0g PIK" font-size="20" font-weight="700" text-anchor="start">Dette finale : 119,10</text><rect data-metric="final-debt" data-value="119.1016" x="40" y="563" width="269.963627" height="28" rx="8" fill="var(--color-amber)"/><rect id="pik-fr-03-mobile-card-2" x="24" y="654" width="372" height="214" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-fr-03-mobile-card-2" x="40" y="689" fill="var(--color-signal)" font-family="l0g PIK" font-size="24" font-weight="700" text-anchor="start">100 % PIK</text><text data-panel="pik-fr-03-mobile-card-2" x="40" y="729" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">Coupons cash : 0,00</text><text data-panel="pik-fr-03-mobile-card-2" x="40" y="769" fill="var(--color-amber)" font-family="l0g PIK" font-size="20" font-weight="700" text-anchor="start">Dette finale : 140,49</text><rect data-metric="final-debt" data-value="140.4928" x="40" y="800" width="318.450347" height="28" rx="8" fill="var(--color-amber)"/><text data-panel="pik-fr-03-mobile-frame" x="24" y="933" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">Rendement promis : 12 % si tous les</text><text data-panel="pik-fr-03-mobile-frame" x="24" y="957.3" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">paiements sont honorés.</text><text data-panel="pik-fr-03-mobile-frame" x="24" y="1022" fill="var(--color-muted)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">M01 · M$ · sans frais, impôts ni défaut</text></svg>