<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1080" role="img" aria-labelledby="pik-fr-05-mobile-title pik-fr-05-mobile-desc" style="width:100%;height:auto" class="l0g-pik-svg"><title id="pik-fr-05-mobile-title">Le revenu précède parfois le cash</title><desc id="pik-fr-05-mobile-desc">OTF : revenus d’investissement comptabilisés au deuxième trimestre 2026, en millions de dollars. Le PIK représente 7,46% au titre des intérêts et 12,51% avec les dividendes. 25,224 M $ d’intérêts PIK et 17,062 M $ de dividendes PIK sur 338,032 M $ de revenus d’investissement. Le solde 295,746 M $ désigne d’autres revenus comptabilisés, dont l’encaissement doit être vérifié séparément. Portefeuille technologique ; aucun lien de prêt avec DevCo n’est inféré.</desc><rect id="pik-fr-05-mobile-frame" x="0" y="0" width="420" height="1080" rx="0" fill="var(--color-ink)"/><text data-panel="pik-fr-05-mobile-frame" x="24" y="34" fill="var(--color-signal)" font-family="l0g PIK" font-size="18" font-weight="700" text-anchor="start">l0g / PIK</text><text data-panel="pik-fr-05-mobile-frame" x="396" y="34" fill="var(--color-muted)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="end">05</text><text data-panel="pik-fr-05-mobile-frame" x="24" y="76" fill="var(--color-paper)" font-family="l0g PIK" font-size="28" font-weight="700" text-anchor="start">Le revenu précède</text><text data-panel="pik-fr-05-mobile-frame" x="24" y="109.04" fill="var(--color-paper)" font-family="l0g PIK" font-size="28" font-weight="700" text-anchor="start">parfois le cash</text><text data-panel="pik-fr-05-mobile-frame" x="24" y="136" fill="var(--color-muted)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">OTF · T2/Q2 2026 · M$ / USDm</text><rect id="pik-fr-05-mobile-card-total" x="24" y="180" width="372" height="130" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-fr-05-mobile-card-total" x="42" y="229" fill="var(--color-signal)" font-family="l0g PIK" font-size="30" font-weight="700" text-anchor="start">338,032 M$</text><text data-panel="pik-fr-05-mobile-card-total" x="42" y="272" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">Revenus d’investissement</text><text data-panel="pik-fr-05-mobile-card-total" x="42" y="296.3" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">comptabilisés</text><rect id="pik-fr-05-mobile-card-0" x="24" y="350" width="372" height="150" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-fr-05-mobile-card-0" x="38" y="381" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="700" text-anchor="start">Intérêts PIK</text><text data-panel="pik-fr-05-mobile-card-0" x="38" y="425" fill="var(--color-amber)" font-family="l0g PIK" font-size="24" font-weight="700" text-anchor="start">25,224</text><rect data-metric="income-usdm" data-value="25.224" x="38" y="455" width="25.669333" height="22" rx="8" fill="var(--color-amber)"/><rect id="pik-fr-05-mobile-card-1" x="24" y="524" width="372" height="150" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-fr-05-mobile-card-1" x="38" y="555" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="700" text-anchor="start">Dividendes PIK</text><text data-panel="pik-fr-05-mobile-card-1" x="38" y="599" fill="var(--color-accent)" font-family="l0g PIK" font-size="24" font-weight="700" text-anchor="start">17,062</text><rect data-metric="income-usdm" data-value="17.062" x="38" y="629" width="17.363232" height="22" rx="8" fill="var(--color-accent)"/><rect id="pik-fr-05-mobile-card-2" x="24" y="698" width="372" height="150" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-fr-05-mobile-card-2" x="38" y="729" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="700" text-anchor="start">Autres revenus</text><text data-panel="pik-fr-05-mobile-card-2" x="38" y="773" fill="var(--color-signal)" font-family="l0g PIK" font-size="24" font-weight="700" text-anchor="start">295,746</text><rect data-metric="income-usdm" data-value="295.746" x="38" y="803" width="300.967435" height="22" rx="8" fill="var(--color-signal)"/><text data-panel="pik-fr-05-mobile-frame" x="24" y="928" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">PIK : 7,46 % intérêts ; 12,51 % avec</text><text data-panel="pik-fr-05-mobile-frame" x="24" y="952.3" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">dividendes.</text><text data-panel="pik-fr-05-mobile-frame" x="24" y="976.6" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">Autres revenus : encaissement à vérifier.</text><text data-panel="pik-fr-05-mobile-frame" x="24" y="1022" fill="var(--color-muted)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">S10 · revenus, avant charges du véhicule</text></svg>