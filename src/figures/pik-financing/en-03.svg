<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="pik-en-03-title pik-en-03-desc" style="width:100%;height:auto" class="l0g-pik-svg"><title id="pik-en-03-title">Three schedules, one common rate</title><desc id="pik-en-03-desc">Hypothetical M 01: three payment schedules with a common 12% annual rate. Deferring payments produces a larger terminal debt balance. $100 m initial principal, three years, annual compounding and no interim principal repayments. Cumulative cash coupons:$36 m/$19.10 m/$0 m; terminal debt:$100 m/$119.10 m/$140.49 m. Promised yield remains 12% if every payment is made. Excludes fees, tax and default.</desc><rect id="pik-en-03-frame" x="0" y="0" width="1000" height="680" rx="0" fill="var(--color-ink)"/><text data-panel="pik-en-03-frame" x="40" y="34" fill="var(--color-signal)" font-family="l0g PIK" font-size="24" font-weight="700" text-anchor="start">l0g / PIK</text><text data-panel="pik-en-03-frame" x="960" y="34" fill="var(--color-muted)" font-family="l0g PIK" font-size="24" font-weight="400" text-anchor="end">03</text><text data-panel="pik-en-03-frame" x="40" y="88" fill="var(--color-paper)" font-family="l0g PIK" font-size="34" font-weight="700" text-anchor="start">Three schedules, one common rate</text><text data-panel="pik-en-03-frame" x="40" y="134" fill="var(--color-muted)" font-family="l0g PIK" font-size="24" font-weight="400" text-anchor="start">M01 fictif / hypothetical · 100 M$ · 12 % · 3 ans/years</text><rect id="pik-en-03-card-0" x="40" y="178" width="920" height="112" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-en-03-card-0" x="56" y="213" fill="var(--color-signal)" font-family="l0g PIK" font-size="26" font-weight="700" text-anchor="start">CASH</text><text data-panel="pik-en-03-card-0" x="56" y="255" fill="var(--color-paper)" font-family="l0g PIK" font-size="24" font-weight="400" text-anchor="start">Cash coupons: 36.00</text><text data-panel="pik-en-03-card-0" x="438" y="213" fill="var(--color-amber)" font-family="l0g PIK" font-size="26" font-weight="700" text-anchor="start">Final debt: 100.00</text><rect data-metric="final-debt" data-value="100" x="438" y="234" width="320" height="28" rx="8" fill="var(--color-amber)"/><rect id="pik-en-03-card-1" x="40" y="308" width="920" height="112" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-en-03-card-1" x="56" y="343" fill="var(--color-signal)" font-family="l0g PIK" font-size="26" font-weight="700" text-anchor="start">50 % PIK</text><text data-panel="pik-en-03-card-1" x="56" y="385" fill="var(--color-paper)" font-family="l0g PIK" font-size="24" font-weight="400" text-anchor="start">Cash coupons: 19.10</text><text data-panel="pik-en-03-card-1" x="438" y="343" fill="var(--color-amber)" font-family="l0g PIK" font-size="26" font-weight="700" text-anchor="start">Final debt: 119.10</text><rect data-metric="final-debt" data-value="119.1016" x="438" y="364" width="381.12512" height="28" rx="8" fill="var(--color-amber)"/><rect id="pik-en-03-card-2" x="40" y="438" width="920" height="112" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-en-03-card-2" x="56" y="473" fill="var(--color-signal)" font-family="l0g PIK" font-size="26" font-weight="700" text-anchor="start">100 % PIK</text><text data-panel="pik-en-03-card-2" x="56" y="515" fill="var(--color-paper)" font-family="l0g PIK" font-size="24" font-weight="400" text-anchor="start">Cash coupons: 0.00</text><text data-panel="pik-en-03-card-2" x="438" y="473" fill="var(--color-amber)" font-family="l0g PIK" font-size="26" font-weight="700" text-anchor="start">Final debt: 140.49</text><rect data-metric="final-debt" data-value="140.4928" x="438" y="494" width="449.57696" height="28" rx="8" fill="var(--color-amber)"/><text data-panel="pik-en-03-frame" x="40" y="606" fill="var(--color-paper)" font-family="l0g PIK" font-size="24" font-weight="400" text-anchor="start">Promised yield: 12% if every payment is made.</text><text data-panel="pik-en-03-frame" x="40" y="665" fill="var(--color-muted)" font-family="l0g PIK" font-size="24" font-weight="400" text-anchor="start">M01 · USDm · excludes fees, tax and default</text></svg>