<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1080" role="img" aria-labelledby="pik-en-04-mobile-title pik-en-04-mobile-desc" style="width:100%;height:auto" class="l0g-pik-svg"><title id="pik-en-04-mobile-title">Refinancing leaves a funding gap</title><desc id="pik-en-04-mobile-desc">Hypothetical M 01: terminal debt of $140.49 m exceeds assumed refinancing capacity of $120 m, leaving a $20.49 m funding gap. $100 m initial debt at 12%, all-PIK over three years. Assumed lending capacity:$30 m EBITDA multiplied by 4. EBITDA needed at the same multiple:$35.12 m. This is a teaching assumption; EBITDA differs from available cash.</desc><rect id="pik-en-04-mobile-frame" x="0" y="0" width="420" height="1080" rx="0" fill="var(--color-ink)"/><text data-panel="pik-en-04-mobile-frame" x="24" y="34" fill="var(--color-signal)" font-family="l0g PIK" font-size="18" font-weight="700" text-anchor="start">l0g / PIK</text><text data-panel="pik-en-04-mobile-frame" x="396" y="34" fill="var(--color-muted)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="end">04</text><text data-panel="pik-en-04-mobile-frame" x="24" y="76" fill="var(--color-paper)" font-family="l0g PIK" font-size="28" font-weight="700" text-anchor="start">Refinancing leaves a</text><text data-panel="pik-en-04-mobile-frame" x="24" y="109.04" fill="var(--color-paper)" font-family="l0g PIK" font-size="28" font-weight="700" text-anchor="start">funding gap</text><text data-panel="pik-en-04-mobile-frame" x="24" y="136" fill="var(--color-muted)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">M01 fictif / hypothetical · M$ / USDm</text><rect id="pik-en-04-mobile-card-0" x="24" y="186" width="372" height="156" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-en-04-mobile-card-0" x="40" y="221" fill="var(--color-paper)" font-family="l0g PIK" font-size="20" font-weight="700" text-anchor="start">Debt to refinance</text><text data-panel="pik-en-04-mobile-card-0" x="40" y="266" fill="var(--color-amber)" font-family="l0g PIK" font-size="28" font-weight="700" text-anchor="start">140.49</text><rect data-metric="refinance-debt" data-value="140.4928" x="40" y="292" width="318.450347" height="26" rx="8" fill="var(--color-amber)"/><rect id="pik-en-04-mobile-card-1" x="24" y="366" width="372" height="156" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-en-04-mobile-card-1" x="40" y="401" fill="var(--color-paper)" font-family="l0g PIK" font-size="20" font-weight="700" text-anchor="start">Capacity: 4 × 30</text><text data-panel="pik-en-04-mobile-card-1" x="40" y="446" fill="var(--color-signal)" font-family="l0g PIK" font-size="28" font-weight="700" text-anchor="start">120.00</text><rect data-metric="refinance-capacity" data-value="120" x="40" y="472" width="272" height="26" rx="8" fill="var(--color-signal)"/><rect id="pik-en-04-mobile-card-gap" x="24" y="570" width="372" height="150" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-en-04-mobile-card-gap" x="40" y="606" fill="var(--color-paper)" font-family="l0g PIK" font-size="22" font-weight="700" text-anchor="start">Funding gap</text><text data-panel="pik-en-04-mobile-card-gap" x="40" y="656" fill="var(--color-accent)" font-family="l0g PIK" font-size="36" font-weight="700" text-anchor="start">20.49</text><rect id="pik-en-04-mobile-card-threshold" x="24" y="754" width="372" height="198" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-en-04-mobile-card-threshold" x="40" y="790" fill="var(--color-paper)" font-family="l0g PIK" font-size="20" font-weight="700" text-anchor="start">EBITDA needed at 4×</text><text data-panel="pik-en-04-mobile-card-threshold" x="40" y="840" fill="var(--color-signal)" font-family="l0g PIK" font-size="34" font-weight="700" text-anchor="start">35.12</text><text data-panel="pik-en-04-mobile-card-threshold" x="40" y="878" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">An assumed lending limit,</text><text data-panel="pik-en-04-mobile-card-threshold" x="40" y="902.3" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">separate from available cash.</text><text data-panel="pik-en-04-mobile-frame" x="24" y="1022" fill="var(--color-muted)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">M01 · EBITDA differs from available cash</text></svg>