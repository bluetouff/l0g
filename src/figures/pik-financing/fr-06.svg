<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="pik-fr-06-title pik-fr-06-desc" style="width:100%;height:auto" class="l0g-pik-svg"><title id="pik-fr-06-title">Capitalisé et payé en espèces</title><desc id="pik-fr-06-desc">CoreWeave :806 M $ hors montants capitalisés et 176 M $ intégrés au coût des actifs composent 982 M $ d’intérêts payés au premier semestre 2026. 176 M $ est déjà inclus dans 982 M $. Capitaliser une charge dans le coût d’un actif et rémunérer un créancier en PIK décrivent des traitements différents. Données consolidées semestrielles en dollars courants, sans annualisation.</desc><rect id="pik-fr-06-frame" x="0" y="0" width="1000" height="680" rx="0" fill="var(--color-ink)"/><text data-panel="pik-fr-06-frame" x="40" y="34" fill="var(--color-signal)" font-family="l0g PIK" font-size="24" font-weight="700" text-anchor="start">l0g / PIK</text><text data-panel="pik-fr-06-frame" x="960" y="34" fill="var(--color-muted)" font-family="l0g PIK" font-size="24" font-weight="400" text-anchor="end">06</text><text data-panel="pik-fr-06-frame" x="40" y="88" fill="var(--color-paper)" font-family="l0g PIK" font-size="34" font-weight="700" text-anchor="start">Capitalisé et payé en espèces</text><text data-panel="pik-fr-06-frame" x="40" y="134" fill="var(--color-muted)" font-family="l0g PIK" font-size="24" font-weight="400" text-anchor="start">CoreWeave · S1/H1 2026 · M$ / USDm</text><rect id="pik-fr-06-card-total" x="40" y="185" width="920" height="130" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-fr-06-card-total" x="62" y="238" fill="var(--color-signal)" font-family="l0g PIK" font-size="46" font-weight="700" text-anchor="start">982 M$</text><text data-panel="pik-fr-06-card-total" x="390" y="232" fill="var(--color-paper)" font-family="l0g PIK" font-size="26" font-weight="400" text-anchor="start">Intérêts payés en espèces</text><rect id="pik-fr-06-card-0" x="40" y="365" width="450" height="180" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-fr-06-card-0" x="56" y="413" fill="var(--color-signal)" font-family="l0g PIK" font-size="38" font-weight="700" text-anchor="start">806 M$</text><text data-panel="pik-fr-06-card-0" x="56" y="457" fill="var(--color-paper)" font-family="l0g PIK" font-size="24" font-weight="400" text-anchor="start">Hors montants capitalisés</text><rect data-metric="cash-interest-usdm" data-value="806" x="56" y="510" width="343.083503" height="24" rx="8" fill="var(--color-signal)"/><rect id="pik-fr-06-card-1" x="510" y="365" width="450" height="180" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-fr-06-card-1" x="526" y="413" fill="var(--color-amber)" font-family="l0g PIK" font-size="38" font-weight="700" text-anchor="start">176 M$</text><text data-panel="pik-fr-06-card-1" x="526" y="457" fill="var(--color-paper)" font-family="l0g PIK" font-size="24" font-weight="400" text-anchor="start">Inclus dans le coût des actifs</text><rect data-metric="cash-interest-usdm" data-value="176" x="526" y="510" width="74.916497" height="24" rx="8" fill="var(--color-amber)"/><text data-panel="pik-fr-06-frame" x="40" y="602" fill="var(--color-paper)" font-family="l0g PIK" font-size="24" font-weight="400" text-anchor="start">806 + 176 = 982</text><text data-panel="pik-fr-06-frame" x="40" y="634.4" fill="var(--color-paper)" font-family="l0g PIK" font-size="24" font-weight="400" text-anchor="start">Deux traitements comptables, un même cash payé.</text><text data-panel="pik-fr-06-frame" x="40" y="665" fill="var(--color-muted)" font-family="l0g PIK" font-size="24" font-weight="400" text-anchor="start">S13 · 176 M$ déjà inclus dans les 982 M$</text></svg>