<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="pik-fr-01-title pik-fr-01-desc" style="width:100%;height:auto" class="l0g-pik-svg"><title id="pik-fr-01-title">Le prêt PIK retrouve sa sortie</title><desc id="pik-fr-01-desc">Prêt DevCo historique : premier tirage de 45 M $, puis 40 M $ dans l’enveloppe discrétionnaire initiale de 55 M $, avec 15 M $ conditionnels restants. Remboursement intégral le 29 mai 2026. Dates des contrats et de la sortie. Les multiples 1,06/1,10/1,25 concernent le premier tirage et ne sont pas des taux annuels. Certaines clauses sont expurgées ; aucune rémunération effectivement réalisée n’est reconstituée.</desc><rect id="pik-fr-01-frame" x="0" y="0" width="1000" height="680" rx="0" fill="var(--color-ink)"/><text data-panel="pik-fr-01-frame" x="40" y="34" fill="var(--color-signal)" font-family="l0g PIK" font-size="24" font-weight="700" text-anchor="start">l0g / PIK</text><text data-panel="pik-fr-01-frame" x="960" y="34" fill="var(--color-muted)" font-family="l0g PIK" font-size="24" font-weight="400" text-anchor="end">01</text><text data-panel="pik-fr-01-frame" x="40" y="88" fill="var(--color-paper)" font-family="l0g PIK" font-size="34" font-weight="700" text-anchor="start">Le prêt PIK retrouve sa sortie</text><text data-panel="pik-fr-01-frame" x="40" y="134" fill="var(--color-muted)" font-family="l0g PIK" font-size="24" font-weight="400" text-anchor="start">DevCo · 2025–2026 · M$ / USDm</text><rect id="pik-fr-01-card-0" x="40" y="170" width="292" height="244" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-fr-01-card-0" x="56" y="198" fill="var(--color-muted)" font-family="l0g PIK" font-size="24" font-weight="400" text-anchor="start">18.12.2025</text><text data-panel="pik-fr-01-card-0" x="56" y="240" fill="var(--color-signal)" font-family="l0g PIK" font-size="32" font-weight="700" text-anchor="start">45 M$</text><text data-panel="pik-fr-01-card-0" x="56" y="273" fill="var(--color-paper)" font-family="l0g PIK" font-size="24" font-weight="700" text-anchor="start">Premier tirage</text><text data-panel="pik-fr-01-card-0" x="56" y="337" fill="var(--color-muted)" font-family="l0g PIK" font-size="24" font-weight="400" text-anchor="start">8 % ; PIK mensuel</text><text data-panel="pik-fr-01-card-0" x="56" y="369.4" fill="var(--color-muted)" font-family="l0g PIK" font-size="24" font-weight="400" text-anchor="start">pendant douze mois.</text><line x1="335" y1="292" x2="350" y2="292" stroke="var(--color-signal)" stroke-width="2"/><path d="M342.979340 295.835404 L350 292 L342.979340 288.164596" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect id="pik-fr-01-card-1" x="354" y="170" width="292" height="244" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-fr-01-card-1" x="370" y="198" fill="var(--color-muted)" font-family="l0g PIK" font-size="24" font-weight="400" text-anchor="start">24.02.2026</text><text data-panel="pik-fr-01-card-1" x="370" y="240" fill="var(--color-signal)" font-family="l0g PIK" font-size="32" font-weight="700" text-anchor="start">40 M$</text><text data-panel="pik-fr-01-card-1" x="370" y="273" fill="var(--color-paper)" font-family="l0g PIK" font-size="24" font-weight="700" text-anchor="start">Tirage</text><text data-panel="pik-fr-01-card-1" x="370" y="305.4" fill="var(--color-paper)" font-family="l0g PIK" font-size="24" font-weight="700" text-anchor="start">supplémentaire</text><text data-panel="pik-fr-01-card-1" x="370" y="337" fill="var(--color-muted)" font-family="l0g PIK" font-size="24" font-weight="400" text-anchor="start">Dans l’enveloppe de</text><text data-panel="pik-fr-01-card-1" x="370" y="369.4" fill="var(--color-muted)" font-family="l0g PIK" font-size="24" font-weight="400" text-anchor="start">55 M$ ; 15 M$ sous</text><text data-panel="pik-fr-01-card-1" x="370" y="401.8" fill="var(--color-muted)" font-family="l0g PIK" font-size="24" font-weight="400" text-anchor="start">conditions.</text><line x1="649" y1="292" x2="664" y2="292" stroke="var(--color-signal)" stroke-width="2"/><path d="M656.979340 295.835404 L664 292 L656.979340 288.164596" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect id="pik-fr-01-card-2" x="668" y="170" width="292" height="244" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-fr-01-card-2" x="684" y="198" fill="var(--color-muted)" font-family="l0g PIK" font-size="24" font-weight="400" text-anchor="start">29.05.2026</text><text data-panel="pik-fr-01-card-2" x="684" y="240" fill="var(--color-amber)" font-family="l0g PIK" font-size="32" font-weight="700" text-anchor="start">REMBOURSÉ</text><text data-panel="pik-fr-01-card-2" x="684" y="273" fill="var(--color-paper)" font-family="l0g PIK" font-size="24" font-weight="700" text-anchor="start">Principal et</text><text data-panel="pik-fr-01-card-2" x="684" y="305.4" fill="var(--color-paper)" font-family="l0g PIK" font-size="24" font-weight="700" text-anchor="start">rémunération</text><text data-panel="pik-fr-01-card-2" x="684" y="337" fill="var(--color-muted)" font-family="l0g PIK" font-size="24" font-weight="400" text-anchor="start">Règlement intégral</text><text data-panel="pik-fr-01-card-2" x="684" y="369.4" fill="var(--color-muted)" font-family="l0g PIK" font-size="24" font-weight="400" text-anchor="start">documenté dans le</text><text data-panel="pik-fr-01-card-2" x="684" y="401.8" fill="var(--color-muted)" font-family="l0g PIK" font-size="24" font-weight="400" text-anchor="start">10-K.</text><text data-panel="pik-fr-01-frame" x="40" y="456" fill="var(--color-paper)" font-family="l0g PIK" font-size="26" font-weight="700" text-anchor="start">Multiples du premier tirage</text><rect id="pik-fr-01-card-term0" x="40" y="480" width="292" height="118" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-fr-01-card-term0" x="56" y="524" fill="var(--color-amber)" font-family="l0g PIK" font-size="32" font-weight="700" text-anchor="start">1,06×</text><text data-panel="pik-fr-01-card-term0" x="56" y="553" fill="var(--color-paper)" font-family="l0g PIK" font-size="24" font-weight="400" text-anchor="start">0 à 4 mois</text><rect id="pik-fr-01-card-term1" x="354" y="480" width="292" height="118" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-fr-01-card-term1" x="370" y="524" fill="var(--color-amber)" font-family="l0g PIK" font-size="32" font-weight="700" text-anchor="start">1,10×</text><text data-panel="pik-fr-01-card-term1" x="370" y="553" fill="var(--color-paper)" font-family="l0g PIK" font-size="24" font-weight="400" text-anchor="start">Après 4, avant 12</text><text data-panel="pik-fr-01-card-term1" x="370" y="585.4" fill="var(--color-paper)" font-family="l0g PIK" font-size="24" font-weight="400" text-anchor="start">mois</text><rect id="pik-fr-01-card-term2" x="668" y="480" width="292" height="118" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-fr-01-card-term2" x="684" y="524" fill="var(--color-amber)" font-family="l0g PIK" font-size="32" font-weight="700" text-anchor="start">1,25×</text><text data-panel="pik-fr-01-card-term2" x="684" y="553" fill="var(--color-paper)" font-family="l0g PIK" font-size="24" font-weight="400" text-anchor="start">Dès 12 mois</text><text data-panel="pik-fr-01-frame" x="40" y="665" fill="var(--color-muted)" font-family="l0g PIK" font-size="24" font-weight="400" text-anchor="start">Sources S03–S07 · coefficients non annualisés</text></svg>