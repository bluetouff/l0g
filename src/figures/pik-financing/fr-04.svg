<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="pik-fr-04-title pik-fr-04-desc" style="width:100%;height:auto" class="l0g-pik-svg"><title id="pik-fr-04-title">Le relais exige du capital</title><desc id="pik-fr-04-desc">Modèle fictif M 01 : la dette finale de 140,49 M $ dépasse une capacité de refinancement supposée de 120 M $, soit 20,49 M $ à trouver. Dette initiale 100 M $, taux 12%, tout-PIK pendant trois ans. Capacité hypothétique : EBITDA de 30 M $ multiplié par 4. EBITDA requis au même multiple :35,12 M $. Le multiple constitue une hypothèse pédagogique ; l’EBITDA est distinct de la trésorerie disponible.</desc><rect id="pik-fr-04-frame" x="0" y="0" width="1000" height="680" rx="0" fill="var(--color-ink)"/><text data-panel="pik-fr-04-frame" x="40" y="34" fill="var(--color-signal)" font-family="l0g PIK" font-size="24" font-weight="700" text-anchor="start">l0g / PIK</text><text data-panel="pik-fr-04-frame" x="960" y="34" fill="var(--color-muted)" font-family="l0g PIK" font-size="24" font-weight="400" text-anchor="end">04</text><text data-panel="pik-fr-04-frame" x="40" y="88" fill="var(--color-paper)" font-family="l0g PIK" font-size="34" font-weight="700" text-anchor="start">Le relais exige du capital</text><text data-panel="pik-fr-04-frame" x="40" y="134" fill="var(--color-muted)" font-family="l0g PIK" font-size="24" font-weight="400" text-anchor="start">M01 fictif / hypothetical · M$ / USDm</text><rect id="pik-fr-04-card-0" x="40" y="180" width="920" height="112" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-fr-04-card-0" x="56" y="215" fill="var(--color-paper)" font-family="l0g PIK" font-size="26" font-weight="700" text-anchor="start">Dette à refinancer</text><text data-panel="pik-fr-04-card-0" x="470" y="215" fill="var(--color-amber)" font-family="l0g PIK" font-size="32" font-weight="700" text-anchor="start">140,49</text><rect data-metric="refinance-debt" data-value="140.4928" x="470" y="237" width="421.4784" height="26" rx="8" fill="var(--color-amber)"/><rect id="pik-fr-04-card-1" x="40" y="315" width="920" height="112" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-fr-04-card-1" x="56" y="350" fill="var(--color-paper)" font-family="l0g PIK" font-size="26" font-weight="700" text-anchor="start">Capacité : 4 × 30</text><text data-panel="pik-fr-04-card-1" x="470" y="350" fill="var(--color-signal)" font-family="l0g PIK" font-size="32" font-weight="700" text-anchor="start">120,00</text><rect data-metric="refinance-capacity" data-value="120" x="470" y="372" width="360" height="26" rx="8" fill="var(--color-signal)"/><rect id="pik-fr-04-card-gap" x="40" y="470" width="440" height="144" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-fr-04-card-gap" x="56" y="506" fill="var(--color-paper)" font-family="l0g PIK" font-size="26" font-weight="700" text-anchor="start">À trouver</text><text data-panel="pik-fr-04-card-gap" x="56" y="556" fill="var(--color-accent)" font-family="l0g PIK" font-size="40" font-weight="700" text-anchor="start">20,49</text><rect id="pik-fr-04-card-threshold" x="510" y="470" width="450" height="144" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-fr-04-card-threshold" x="526" y="506" fill="var(--color-paper)" font-family="l0g PIK" font-size="26" font-weight="700" text-anchor="start">EBITDA requis à 4×</text><text data-panel="pik-fr-04-card-threshold" x="526" y="556" fill="var(--color-signal)" font-family="l0g PIK" font-size="38" font-weight="700" text-anchor="start">35,12</text><text data-panel="pik-fr-04-frame" x="40" y="665" fill="var(--color-muted)" font-family="l0g PIK" font-size="24" font-weight="400" text-anchor="start">M01 · EBITDA distinct de la trésorerie</text></svg>