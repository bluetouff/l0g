<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="pik-en-02-title pik-en-02-desc" style="width:100%;height:auto" class="l0g-pik-svg"><title id="pik-en-02-title">PIK enlarges the priority claim</title><desc id="pik-en-02-desc">TopCo 2 preferred equity: PIK dividends enlarge the investor’s priority claim. The diagram summarises distributions among security holders. $60.1 m for June–August 2026, without annualisation. Initial 12.75% rate, daily accrual and semi-annual compounding. Distributions remain subject to contractual restrictions and exceptions. Sale rights can arise in 2032; cash/PIK elections extend to 2035 under specified conditions.</desc><rect id="pik-en-02-frame" x="0" y="0" width="1000" height="680" rx="0" fill="var(--color-ink)"/><text data-panel="pik-en-02-frame" x="40" y="34" fill="var(--color-signal)" font-family="l0g PIK" font-size="24" font-weight="700" text-anchor="start">l0g / PIK</text><text data-panel="pik-en-02-frame" x="960" y="34" fill="var(--color-muted)" font-family="l0g PIK" font-size="24" font-weight="400" text-anchor="end">02</text><text data-panel="pik-en-02-frame" x="40" y="88" fill="var(--color-paper)" font-family="l0g PIK" font-size="34" font-weight="700" text-anchor="start">PIK enlarges the priority claim</text><text data-panel="pik-en-02-frame" x="40" y="134" fill="var(--color-muted)" font-family="l0g PIK" font-size="24" font-weight="400" text-anchor="start">TopCo2 · titres préférentiels / preferred equity</text><rect id="pik-en-02-card-headline" x="40" y="170" width="920" height="114" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-en-02-card-headline" x="62" y="216" fill="var(--color-signal)" font-family="l0g PIK" font-size="40" font-weight="700" text-anchor="start">$60.1m</text><text data-panel="pik-en-02-card-headline" x="340" y="208" fill="var(--color-muted)" font-family="l0g PIK" font-size="24" font-weight="400" text-anchor="