<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1080" role="img" aria-labelledby="pik-en-03-mobile-title pik-en-03-mobile-desc" style="width:100%;height:auto" class="l0g-pik-svg"><title id="pik-en-03-mobile-title">Three schedules, one common rate</title><desc id="pik-en-03-mobile-desc">Hypothetical M 01: three payment schedules with a common 12% annual rate. Deferring payments produces a larger terminal debt balance. $100 m initial principal, three years, annual compounding and no interim principal repayments. Cumulative cash coupons:$36 m/$19.10 m/$0 m; terminal debt:$100 m/$119.10 m/$140.49 m. Promised yield remains 12% if every payment is made. Excludes fees, tax and default.</desc><rect id="pik-en-03-mobile-frame" x="0" y="0" width="420" height="1080" rx="0" fill="var(--color-ink)"/><text data-panel="pik-en-03-mobile-frame" x="24" y="34" fill="var(--color-signal)" font-family="l0g PIK" font-size="18" font-weight="700" text-anchor="start">l0g / PIK</text><text data-panel="pik-en-03-mobile-frame" x="396" y="34" fill="var(--color-muted)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="end">03</text><text data-panel="pik-en-03-mobile-frame" x="24" y="76" fill="var(--color-paper)" font-family="l0g PIK" font-size="28" font-weight="700" text-anchor="start">Three schedules, one</text><text data-panel="pik-en-03-mobile-frame" x="24" y="109.04" fill="var(--color-paper)" font-family="l0g PIK" font-size="28" font-weight="700" text-anchor="start">common rate</text><text data-panel="pik-en-03-mobile-frame" x="24" y="136" fill="var(--color-muted)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">M01 fictif / hypothetical · 100 M$ · 12 % ·</text><text data-panel="pik-en-03-mobile-frame" x="24" y="160.3" fill="var(--color-muted)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">3 ans/years</text><rect id="pik-en-03-mobile-card-0" x="24" y="180" width="372" height="214" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-en-03-mobile-card-0" x="40" y="215" fill="var(--color-signal)" font-family="l0g PIK" font-size="24" font-weight="700" text-anchor="start">CASH</text><text data-panel="pik-en-03-mobile-card-0" x="40" y="255" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">Cash coupons: 36.00</text><text data-panel="pik-en-03-mobile-card-0" x="40" y="295" fill="var(--color-amber)" font-family="l0g PIK" font-size="20" font-weight="700" text-anchor="start">Final debt: 100.00</text><rect data-metric="final-debt" data-value="100" x="40" y="326" width="226.666667" height="28" rx="8" fill="var(--color-amber)"/><rect id="pik-en-03-mobile-card-1" x="24" y="417" width="372" height="214" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-en-03-mobile-card-1" x="40" y="452" fill="var(--color-signal)" font-family="l0g PIK" font-size="24" font-weight="700" text-anchor="start">50 % PIK</text><text data-panel="pik-en-03-mobile-card-1" x="40" y="492" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">Cash coupons: 19.10</text><text data-panel="pik-en-03-mobile-card-1" x="40" y="532" fill="var(--color-amber)" font-family="l0g PIK" font-size="20" font-weight="700" text-anchor="start">Final debt: 119.10</text><rect data-metric="final-debt" data-value="119.1016" x="40" y="563" width="269.963627" height="28" rx="8" fill="var(--color-amber)"/><rect id="pik-en-03-mobile-card-2" x="24" y="654" width="372" height="214" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-en-03-mobile-card-2" x="40" y="689" fill="var(--color-signal)" font-family="l0g PIK" font-size="24" font-weight="700" text-anchor="start">100 % PIK</text><text data-panel="pik-en-03-mobile-card-2" x="40" y="729" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">Cash coupons: 0.00</text><text data-panel="pik-en-03-mobile-card-2" x="40" y="769" fill="var(--color-amber)" font-family="l0g PIK" font-size="20" font-weight="700" text-anchor="start">Final debt: 140.49</text><rect data-metric="final-debt" data-value="140.4928" x="40" y="800" width="318.450347" height="28" rx="8" fill="var(--color-amber)"/><text data-panel="pik-en-03-mobile-frame" x="24" y="933" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">Promised yield: 12% if every payment is</text><text data-panel="pik-en-03-mobile-frame" x="24" y="957.3" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">made.</text><text data-panel="pik-en-03-mobile-frame" x="24" y="1022" fill="var(--color-muted)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">M01 · USDm · excludes fees, tax and</text><text data-panel="pik-en-03-mobile-frame" x="24" y="1046.3" fill="var(--color-muted)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">default</text></svg>