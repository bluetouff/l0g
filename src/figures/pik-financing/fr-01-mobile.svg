<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1080" role="img" aria-labelledby="pik-fr-01-mobile-title pik-fr-01-mobile-desc" style="width:100%;height:auto" class="l0g-pik-svg"><title id="pik-fr-01-mobile-title">Le prêt PIK retrouve sa sortie</title><desc id="pik-fr-01-mobile-desc">Prêt DevCo historique : premier tirage de 45 M $, puis 40 M $ dans l’enveloppe discrétionnaire initiale de 55 M $, avec 15 M $ conditionnels restants. Remboursement intégral le 29 mai 2026. Dates des contrats et de la sortie. Les multiples 1,06/1,10/1,25 concernent le premier tirage et ne sont pas des taux annuels. Certaines clauses sont expurgées ; aucune rémunération effectivement réalisée n’est reconstituée.</desc><rect id="pik-fr-01-mobile-frame" x="0" y="0" width="420" height="1080" rx="0" fill="var(--color-ink)"/><text data-panel="pik-fr-01-mobile-frame" x="24" y="34" fill="var(--color-signal)" font-family="l0g PIK" font-size="18" font-weight="700" text-anchor="start">l0g / PIK</text><text data-panel="pik-fr-01-mobile-frame" x="396" y="34" fill="var(--color-muted)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="end">01</text><text data-panel="pik-fr-01-mobile-frame" x="24" y="76" fill="var(--color-paper)" font-family="l0g PIK" font-size="28" font-weight="700" text-anchor="start">Le prêt PIK retrouve sa</text><text data-panel="pik-fr-01-mobile-frame" x="24" y="109.04" fill="var(--color-paper)" font-family="l0g PIK" font-size="28" font-weight="700" text-anchor="start">sortie</text><text data-panel="pik-fr-01-mobile-frame" x="24" y="136" fill="var(--color-muted)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">DevCo · 2025–2026 · M$ / USDm</text><rect id="pik-fr-01-mobile-card-0" x="24" y="180" width="372" height="170" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-fr-01-mobile-card-0" x="40" y="208" fill="var(--color-muted)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">18.12.2025</text><text data-panel="pik-fr-01-mobile-card-0" x="40" y="250" fill="var(--color-signal)" font-family="l0g PIK" font-size="30" font-weight="700" text-anchor="start">45 M$</text><text data-panel="pik-fr-01-mobile-card-0" x="40" y="283" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="700" text-anchor="start">Premier tirage</text><text data-panel="pik-fr-01-mobile-card-0" x="40" y="312" fill="var(--color-muted)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">8 % ; PIK mensuel pendant douze</text><text data-panel="pik-fr-01-mobile-card-0" x="40" y="336.3" fill="var(--color-muted)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">mois.</text><line x1="210" y1="353" x2="210" y2="366" stroke="var(--color-signal)" stroke-width="2"/><path d="M206.164596 358.979340 L210.0 366 L213.835404 358.979340" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect id="pik-fr-01-mobile-card-1" x="24" y="374" width="372" height="170" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-fr-01-mobile-card-1" x="40" y="402" fill="var(--color-muted)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">24.02.2026</text><text data-panel="pik-fr-01-mobile-card-1" x="40" y="444" fill="var(--color-signal)" font-family="l0g PIK" font-size="30" font-weight="700" text-anchor="start">40 M$</text><text data-panel="pik-fr-01-mobile-card-1" x="40" y="477" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="700" text-anchor="start">Tirage supplémentaire</text><text data-panel="pik-fr-01-mobile-card-1" x="40" y="506" fill="var(--color-muted)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">Dans l’enveloppe de 55 M$ ; 15 M$</text><text data-panel="pik-fr-01-mobile-card-1" x="40" y="530.3" fill="var(--color-muted)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">sous conditions.</text><line x1="210" y1="547" x2="210" y2="560" stroke="var(--color-signal)" stroke-width="2"/><path d="M206.164596 552.979340 L210.0 560 L213.835404 552.979340" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect id="pik-fr-01-mobile-card-2" x="24" y="568" width="372" height="170" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-fr-01-mobile-card-2" x="40" y="596" fill="var(--color-muted)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">29.05.2026</text><text data-panel="pik-fr-01-mobile-card-2" x="40" y="638" fill="var(--color-amber)" font-family="l0g PIK" font-size="30" font-weight="700" text-anchor="start">REMBOURSÉ</text><text data-panel="pik-fr-01-mobile-card-2" x="40" y="671" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="700" text-anchor="start">Principal et rémunération</text><text data-panel="pik-fr-01-mobile-card-2" x="40" y="700" fill="var(--color-muted)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">Règlement intégral documenté dans</text><text data-panel="pik-fr-01-mobile-card-2" x="40" y="724.3" fill="var(--color-muted)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">le 10-K.</text><text data-panel="pik-fr-01-mobile-frame" x="24" y="777" fill="var(--color-paper)" font-family="l0g PIK" font-size="20" font-weight="700" text-anchor="start">Multiples du premier tirage</text><rect id="pik-fr-01-mobile-card-term0" x="24" y="802" width="118" height="152" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-fr-01-mobile-card-term0" x="40" y="845" fill="var(--color-amber)" font-family="l0g PIK" font-size="26" font-weight="700" text-anchor="start">1,06×</text><text data-panel="pik-fr-01-mobile-card-term0" x="40" y="875" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">0 à 4</text><text data-panel="pik-fr-01-mobile-card-term0" x="40" y="899.3" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">mois</text><rect id="pik-fr-01-mobile-card-term1" x="151" y="802" width="118" height="152" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-fr-01-mobile-card-term1" x="167" y="845" fill="var(--color-amber)" font-family="l0g PIK" font-size="26" font-weight="700" text-anchor="start">1,10×</text><text data-panel="pik-fr-01-mobile-card-term1" x="167" y="875" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">Après 4,</text><text data-panel="pik-fr-01-mobile-card-term1" x="167" y="899.3" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">avant 12</text><text data-panel="pik-fr-01-mobile-card-term1" x="167" y="923.6" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">mois</text><rect id="pik-fr-01-mobile-card-term2" x="278" y="802" width="118" height="152" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-fr-01-mobile-card-term2" x="294" y="845" fill="var(--color-amber)" font-family="l0g PIK" font-size="26" font-weight="700" text-anchor="start">1,25×</text><text data-panel="pik-fr-01-mobile-card-term2" x="294" y="875" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">Dès 12</text><text data-panel="pik-fr-01-mobile-card-term2" x="294" y="899.3" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">mois</text><text data-panel="pik-fr-01-mobile-frame" x="24" y="1022" fill="var(--color-muted)"