<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1080" role="img" aria-labelledby="pik-en-02-mobile-title pik-en-02-mobile-desc" style="width:100%;height:auto" class="l0g-pik-svg"><title id="pik-en-02-mobile-title">PIK enlarges the priority claim</title><desc id="pik-en-02-mobile-desc">TopCo 2 preferred equity: PIK dividends enlarge the investor’s priority claim. The diagram summarises distributions among security holders. $60.1 m for June–August 2026, without annualisation. Initial 12.75% rate, daily accrual and semi-annual compounding. Distributions remain subject to contractual restrictions and exceptions. Sale rights can arise in 2032; cash/PIK elections extend to 2035 under specified conditions.</desc><rect id="pik-en-02-mobile-frame" x="0" y="0" width="420" height="1080" rx="0" fill="var(--color-ink)"/><text data-panel="pik-en-02-mobile-frame" x="24" y="34" fill="var(--color-signal)" font-family="l0g PIK" font-size="18" font-weight="700" text-anchor="start">l0g / PIK</text><text data-panel="pik-en-02-mobile-frame" x="396" y="34" fill="var(--color-muted)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="end">02</text><text data-panel="pik-en-02-mobile-frame" x="24" y="76" fill="var(--color-paper)" font-family="l0g PIK" font-size="28" font-weight="700" text-anchor="start">PIK enlarges the</text><text data-panel="pik-en-02-mobile-frame" x="24" y="109.04" fill="var(--color-paper)" font-family="l0g PIK" font-size="28" font-weight="700" text-anchor="start">priority claim</text><text data-panel="pik-en-02-mobile-frame" x="24" y="136" fill="var(--color-muted)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">TopCo2 · titres préférentiels / preferred</text><text data-panel="pik-en-02-mobile-frame" x="24" y="160.3" fill="var(--color-muted)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">equity</text><rect id="pik-en-02-mobile-card-headline" x="24" y="178" width="372" height="126" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-en-02-mobile-card-headline" x="42" y="224" fill="var(--color-signal)" font-family="l0g PIK" font-size="34" font-weight="700" text-anchor="start">$60.1m</text><text data-panel="pik-en-02-mobile-card-headline" x="42" y="259" fill="var(--color-muted)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">PIK dividends · June–August 2026</text><text data-panel="pik-en-02-mobile-frame" x="24" y="342" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">Initial 12.75% · daily accrual</text><text data-panel="pik-en-02-mobile-frame" x="24" y="366.3" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">Semi-annual compounding</text><rect id="pik-en-02-mobile-card-waterfall0" x="24" y="405" width="372" height="68" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-en-02-mobile-card-waterfall0" x="38" y="429" fill="var(--color-amber)" font-family="l0g PIK" font-size="18" font-weight="700" text-anchor="start">01</text><text data-panel="pik-en-02-mobile-card-waterfall0" x="82" y="432" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">Specified indemnities</text><line x1="210" y1="475" x2="210" y2="488" stroke="var(--color-signal)" stroke-width="2"/><path d="M206.164596 480.979340 L210.0 488 L213.835404 480.979340" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect id="pik-en-02-mobile-card-waterfall1" x="24" y="491" width="372" height="68" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-en-02-mobile-card-waterfall1" x="38" y="515" fill="var(--color-amber)" font-family="l0g PIK" font-size="18" font-weight="700" text-anchor="start">02</text><text data-panel="pik-en-02-mobile-card-waterfall1" x="82" y="518" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">Unpaid preferred dividends</text><line x1="210" y1="561" x2="210" y2="574" stroke="var(--color-signal)" stroke-width="2"/><path d="M206.164596 566.979340 L210.0 574 L213.835404 566.979340" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect id="pik-en-02-mobile-card-waterfall2" x="24" y="577" width="372" height="68" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-en-02-mobile-card-waterfall2" x="38" y="601" fill="var(--color-amber)" font-family="l0g PIK" font-size="18" font-weight="700" text-anchor="start">03</text><text data-panel="pik-en-02-mobile-card-waterfall2" x="82" y="604" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">Up to liquidation preference</text><line x1="210" y1="647" x2="210" y2="660" stroke="var(--color-signal)" stroke-width="2"/><path d="M206.164596 652.979340 L210.0 660 L213.835404 652.979340" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect id="pik-en-02-mobile-card-waterfall3" x="24" y="663" width="372" height="68" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-en-02-mobile-card-waterfall3" x="38" y="687" fill="var(--color-signal)" font-family="l0g PIK" font-size="18" font-weight="700" text-anchor="start">04</text><text data-panel="pik-en-02-mobile-card-waterfall3" x="82" y="690" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">Residual to common holders</text><rect id="pik-en-02-mobile-card-date0" x="24" y="778" width="372" height="92" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-en-02-mobile-card-date0" x="38" y="812" fill="var(--color-amber)" font-family="l0g PIK" font-size="24" font-weight="700" text-anchor="start">2032</text><text data-panel="pik-en-02-mobile-card-date0" x="121" y="805" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">Sale process can be</text><text data-panel="pik-en-02-mobile-card-date0" x="121" y="829.3" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">required</text><text data-panel="pik-en-02-mobile-card-date0" x="121" y="853.6" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">if units remain outstanding</text><rect id="pik-en-02-mobile-card-date1" x="24" y="882" width="372" height="92" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-en-02-mobile-card-date1" x="38" y="916" fill="var(--color-amber)" font-family="l0g PIK" font-size="24" font-weight="700" text-anchor="start">2035</text><text data-panel="pik-en-02-mobile-card-date1" x="121" y="909" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">Cash/PIK election until6</text><text data-panel="pik-en-02-mobile-card-date1" x="121" y="933.3" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">October,</text><text data-panel="pik-en-02-mobile-card-date1" x="121" y="957.6" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">subject to exceptions</text><text data-panel="pik-en-02-mobile-frame" x="24" y="1022" fill="var(--color-muted)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">S01/S08/S09 · distribution restrictions</text><text data-panel="pik-en-02-mobile-frame" x="24" y="1046.3" fill="var(--color-muted)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">apply</text></svg>