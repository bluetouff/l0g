<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="pik-fr-03-title pik-fr-03-desc" style="width:100%;height:auto" class="l0g-pik-svg"><title id="pik-fr-03-title">Trois rythmes, un même taux</title><desc id="pik-fr-03-desc">Modèle fictif M 01 : trois rythmes de paiement à un taux annuel identique de 12%. Les paiements plus tardifs produisent une dette finale plus élevée. 100 M $ de principal initial, trois ans, intérêts capitalisés annuellement et aucun remboursement de principal intermédiaire. Coupons cash cumulés :36/19,10/0 M $ ; dette finale :100/119,10/140,49 M $. Le rendement promis reste 12% si tous les paiements sont honorés. Hors frais, fiscalité et défaut.</desc><rect id="pik-fr-03-frame" x="0" y="0" width="1000" height="680" rx="0" fill="var(--color-ink)"/><text data-panel="pik-fr-03-frame" x="40" y="34" fill="var(--color-signal)" font-family="l0g PIK" font-size="24" font-weight="700" text-anchor="start">l0g / PIK</text><text data-panel="pik-fr-03-frame" x="960" y="34" fill="var(--color-muted)" font-family="l0g PIK" font-size="24" font-weight="400" text-anchor="end">03</text><text data-panel="pik-fr-03-frame" x="40" y="88" fill="var(--color-paper)" font-family="l0g PIK" font-size="34" font-weight="700" text-anchor="start">Trois rythmes, un même taux</text><text data-panel="pik-fr-03-frame" x="40" y="134" fill="var(--color-muted)" font-family="l0g PIK" font-size="24" font-weight="400" text-anchor="start">M01 fictif / hypothetical · 100 M$ · 12 % · 3 ans/years</text><rect id="pik-fr-03-card-0" x="40" y="178" width="920" height="112" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-fr-03-card-0" x="56" y="213" fill="var(--color-signal)" font-family="l0g PIK" font-size="26" font-weight="700" text-anchor="start">CASH</text><text data-panel="pik-fr-03-card-0" x="56" y="255" fill="var(--color-paper)" font-family="l0g PIK" font-size="24" font-weight="400" text-anchor="start">Coupons cash : 36,00</text><text data-panel="pik-fr-03-card-0" x="438" y="213" fill="var(--color-amber)" font-family="l0g PIK" font-size="26" font-weight="700" text-anchor="start">Dette finale : 100,00</text><rect data-metric="final-debt" data-value="100" x="438" y="234" width="320" height="28" rx="8" fill="var(--color-amber)"/><rect id="pik-fr-03-card-1" x="40" y="308" width="920" height="112" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-fr-03-card-1" x="56" y="343" fill="var(--color-signal)" font-family="l0g PIK" font-size="26" font-weight="700" text-anchor="start">50 % PIK</text><text data-panel="pik-fr-03-card-1" x="56" y="385" fill="var(--color-paper)" font-family="l0g PIK" font-size="24" font-weight="400" text-anchor="start">Coupons cash : 19,10</text><text data-panel="pik-fr-03-card-1" x="438" y="343" fill="var(--color-amber)" font-family="l0g PIK" font-size="26" font-weight="700" text-anchor="start">Dette finale : 119,10</text><rect data-metric="final-debt" data-value="119.1016" x="438" y="364" width="381.12512" height="28" rx="8" fill="var(--color-amber)"/><rect id="pik-fr-03-card-2" x="40" y="438" width="920" height="112" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-fr-03-card-2" x="56" y="473" fill="var(--color-signal)" font-family="l0g PIK" font-size="26" font-weight="700" text-anchor="start">100 % PIK</text><text data-panel="pik-fr-03-card-2" x="56" y="515" fill="var(--color-paper)" font-family="l0g PIK" font-size="24" font-weight="400" text-anchor="start">Coupons cash : 0,00</text><text data-panel="pik-fr-03-card-2" x="438" y="473" fill="var(--color-amber)" font-family="l0g PIK" font-size="26" font-weight="700" text-anchor="start">Dette finale : 140,49</text><rect data-metric="final-debt" data-value="140.4928" x="438" y="494" width="449.57696" height="28" rx="8" fill="var(--color-amber)"/><text data-panel="pik-fr-03-frame" x="40" y="606" fill="var(--color-paper)" font-family="l0g PIK" font-size="24" font-weight="400" text-anchor="start">Rendement promis : 12 % si tous les paiements sont honorés.</text><text data-panel="pik-fr-03-frame" x="40" y="665" fill="var(--color-muted)" font-family="l0g PIK" font-size="24" font-weight="400" text-anchor="start">M01 · M$ · sans frais, impôts ni défaut</text></svg>