<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1080" role="img" aria-labelledby="pik-fr-06-mobile-title pik-fr-06-mobile-desc" style="width:100%;height:auto" class="l0g-pik-svg"><title id="pik-fr-06-mobile-title">Capitalisé et payé en espèces</title><desc id="pik-fr-06-mobile-desc">CoreWeave :806 M $ hors montants capitalisés et 176 M $ intégrés au coût des actifs composent 982 M $ d’intérêts payés au premier semestre 2026. 176 M $ est déjà inclus dans 982 M $. Capitaliser une charge dans le coût d’un actif et rémunérer un créancier en PIK décrivent des traitements différents. Données consolidées semestrielles en dollars courants, sans annualisation.</desc><rect id="pik-fr-06-mobile-frame" x="0" y="0" width="420" height="1080" rx="0" fill="var(--color-ink)"/><text data-panel="pik-fr-06-mobile-frame" x="24" y="34" fill="var(--color-signal)" font-family="l0g PIK" font-size="18" font-weight="700" text-anchor="start">l0g / PIK</text><text data-panel="pik-fr-06-mobile-frame" x="396" y="34" fill="var(--color-muted)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="end">06</text><text data-panel="pik-fr-06-mobile-frame" x="24" y="76" fill="var(--color-paper)" font-family="l0g PIK" font-size="28" font-weight="700" text-anchor="start">Capitalisé et payé en</text><text data-panel="pik-fr-06-mobile-frame" x="24" y="109.04" fill="var(--color-paper)" font-family="l0g PIK" font-size="28" font-weight="700" text-anchor="start">espèces</text><text data-panel="pik-fr-06-mobile-frame" x="24" y="136" fill="var(--color-muted)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">CoreWeave · S1/H1 2026 · M$ / USDm</text><rect id="pik-fr-06-mobile-card-total" x="24" y="185" width="372" height="130" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-fr-06-mobile-card-total" x="42" y="238" fill="var(--color-signal)" font-family="l0g PIK" font-size="40" font-weight="700" text-anchor="start">982 M$</text><text data-panel="pik-fr-06-mobile-card-total" x="42" y="282" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">Intérêts payés en espèces</text><rect id="pik-fr-06-mobile-card-0" x="24" y="365" width="372" height="208" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-fr-06-mobile-card-0" x="40" y="413" fill="var(--color-signal)" font-family="l0g PIK" font-size="32" font-weight="700" text-anchor="start">806 M$</text><text data-panel="pik-fr-06-mobile-card-0" x="40" y="457" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">Hors montants capitalisés</text><rect data-metric="cash-interest-usdm" data-value="806" x="40" y="510" width="279.063136" height="24" rx="8" fill="var(--color-signal)"/><rect id="pik-fr-06-mobile-card-1" x="24" y="600" width="372" height="208" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-fr-06-mobile-card-1" x="40" y="648" fill="var(--color-amber)" font-family="l0g PIK" font-size="32" font-weight="700" text-anchor="start">176 M$</text><text data-panel="pik-fr-06-mobile-card-1" x="40" y="692" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">Inclus dans le coût des actifs</text><rect data-metric="cash-interest-usdm" data-value="176" x="40" y="745" width="60.936864" height="24" rx="8" fill="var(--color-amber)"/><text data-panel="pik-fr-06-mobile-frame" x="24" y="900" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">806 + 176 = 982</text><text data-panel="pik-fr-06-mobile-frame" x="24" y="924.3" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">Deux traitements comptables, un même</text><text data-panel="pik-fr-06-mobile-frame" x="24" y="948.6" fill="var(--color-paper)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">cash payé.</text><text data-panel="pik-fr-06-mobile-frame" x="24" y="1022" fill="var(--color-muted)" font-family="l0g PIK" font-size="18" font-weight="400" text-anchor="start">S13 · 176 M$ déjà inclus dans les 982 M$</text></svg>