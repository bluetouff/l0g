<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="pik-en-04-title pik-en-04-desc" style="width:100%;height:auto" class="l0g-pik-svg"><title id="pik-en-04-title">Refinancing leaves a funding gap</title><desc id="pik-en-04-desc">Hypothetical M 01: terminal debt of $140.49 m exceeds assumed refinancing capacity of $120 m, leaving a $20.49 m funding gap. $100 m initial debt at 12%, all-PIK over three years. Assumed lending capacity:$30 m EBITDA multiplied by 4. EBITDA needed at the same multiple:$35.12 m. This is a teaching assumption; EBITDA differs from available cash.</desc><rect id="pik-en-04-frame" x="0" y="0" width="1000" height="680" rx="0" fill="var(--color-ink)"/><text data-panel="pik-en-04-frame" x="40" y="34" fill="var(--color-signal)" font-family="l0g PIK" font-size="24" font-weight="700" text-anchor="start">l0g / PIK</text><text data-panel="pik-en-04-frame" x="960" y="34" fill="var(--color-muted)" font-family="l0g PIK" font-size="24" font-weight="400" text-anchor="end">04</text><text data-panel="pik-en-04-frame" x="40" y="88" fill="var(--color-paper)" font-family="l0g PIK" font-size="34" font-weight="700" text-anchor="start">Refinancing leaves a funding gap</text><text data-panel="pik-en-04-frame" x="40" y="134" fill="var(--color-muted)" font-family="l0g PIK" font-size="24" font-weight="400" text-anchor="start">M01 fictif / hypothetical · M$ / USDm</text><rect id="pik-en-04-card-0" x="40" y="180" width="920" height="112" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-en-04-card-0" x="56" y="215" fill="var(--color-paper)" font-family="l0g PIK" font-size="26" font-weight="700" text-anchor="start">Debt to refinance</text><text data-panel="pik-en-04-card-0" x="470" y="215" fill="var(--color-amber)" font-family="l0g PIK" font-size="32" font-weight="700" text-anchor="start">140.49</text><rect data-metric="refinance-debt" data-value="140.4928" x="470" y="237" width="421.4784" height="26" rx="8" fill="var(--color-amber)"/><rect id="pik-en-04-card-1" x="40" y="315" width="920" height="112" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-en-04-card-1" x="56" y="350" fill="var(--color-paper)" font-family="l0g PIK" font-size="26" font-weight="700" text-anchor="start">Capacity: 4 × 30</text><text data-panel="pik-en-04-card-1" x="470" y="350" fill="var(--color-signal)" font-family="l0g PIK" font-size="32" font-weight="700" text-anchor="start">120.00</text><rect data-metric="refinance-capacity" data-value="120" x="470" y="372" width="360" height="26" rx="8" fill="var(--color-signal)"/><rect id="pik-en-04-card-gap" x="40" y="470" width="440" height="144" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-en-04-card-gap" x="56" y="506" fill="var(--color-paper)" font-family="l0g PIK" font-size="26" font-weight="700" text-anchor="start">Funding gap</text><text data-panel="pik-en-04-card-gap" x="56" y="556" fill="var(--color-accent)" font-family="l0g PIK" font-size="40" font-weight="700" text-anchor="start">20.49</text><rect id="pik-en-04-card-threshold" x="510" y="470" width="450" height="144" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="pik-en-04-card-threshold" x="526" y="506" fill="var(--color-paper)" font-family="l0g PIK" font-size="26" font-weight="700" text-anchor="start">EBITDA needed at 4×</text><text data-panel="pik-en-04-card-threshold" x="526" y="556" fill="var(--color-signal)" font-family="l0g PIK" font-size="38" font-weight="700" text-anchor="start">35.12</text><text data-panel="pik-en-04-frame" x="40" y="665" fill="var(--color-muted)" font-family="l0g PIK" font-size="24" font-weight="400" text-anchor="start">M01 · EBITDA differs from available cash</text></svg>