<text x="16" y="30" font-size="17" fill="var(--color-paper)" text-anchor="start" font-weight="500">Ending a contract frees up funds</text>
<text x="16" y="49" font-size="12" fill="var(--color-muted)" text-anchor="start" font-weight="400">Fictional example · $100 million appropriation</text>
