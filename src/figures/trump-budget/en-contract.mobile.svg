<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 342 270" width="100%" height="auto" style="width:100%;height:auto" role="img" aria-labelledby="trump-budget-en-contract-mobile-title trump-budget-en-contract-mobile-desc" xml:lang="en">
<title id="trump-budget-en-contract-mobile-title">Ending a contract frees up funds</title>
<desc id="trump-budget-en-contract-mobile-desc">Fictional example in millions of U.S. dollars before and after termination without costs. Cumulative payments stay at 40. Unpaid obligations fall from 20 to 5. Unobligated funds rise from 40 to 55 after a deobligation of 15. The law and the period of availability govern reuse.</desc>
