<text x="16" y="30" font-size="17" fill="var(--color-paper)" text-anchor="start" font-weight="500">From Navy funding to detention</text>
<text x="16" y="49" font-size="12" fill="var(--color-muted)" text-anchor="start" font-weight="400">May 19, 2025 transfer · US$ millions</text>
<path d="M16 61H326" fill="none" stroke="var(--color-line)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
