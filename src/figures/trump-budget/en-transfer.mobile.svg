<text x="54" y="107" font-size="13" fill="var(--color-paper)" text-anchor="start" font-weight="400">capital fund</text>
<circle cx="31" cy="158" r="13" fill="var(--color-surface)" stroke="var(--color-signal)" stroke-width="1"/>
<g transform="translate(20 147)" aria-hidden="true"><path d="M11 3l7 3v5c0 4-3 6-7 8-4-2-7-4-7-8V6zM7.5 11h7m-2-2 2 2-2 2" fill="none" stroke="var(--color-signal)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/></g>
<text x="54" y="155" font-size="13" fill="var(--color-paper)" text-anchor="start" font-weight="400">Pentagon</text>
