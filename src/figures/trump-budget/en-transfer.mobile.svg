<text x="56" y="224" font-size="15" fill="var(--color-accent)" text-anchor="start" font-weight="500">442</text>
<text x="91" y="224" font-size="12" fill="var(--color-paper)" text-anchor="start" font-weight="400">Support for ICE detention</text>
