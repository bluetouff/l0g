<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 572 223" width="100%" height="auto" style="width:100%;height:auto" role="img" aria-labelledby="trump-budget-en-transfer-wide-title trump-budget-en-transfer-wide-desc" xml:lang="en">
<title id="trump-budget-en-transfer-wide-title">Navy funds routed toward detention</title>
<desc id="trump-budget-en-transfer-wide-desc">The Pentagon transferred $447 million from the Navy working capital fund through its counterdrug account. Military officials said $442 million was for ICE detention support and $5 million for reimbursements related to military detention spending at Guantánamo.</desc>
