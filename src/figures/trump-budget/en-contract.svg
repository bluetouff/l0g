<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 572 249" width="100%" height="auto" style="width:100%;height:auto" role="img" aria-labelledby="trump-budget-en-contract-wide-title trump-budget-en-contract-wide-desc" xml:lang="en">
<title id="trump-budget-en-contract-wide-title">Ending a contract frees up funds</title>
<desc id="trump-budget-en-contract-wide-desc">Fictional example in millions of U.S. dollars before and after termination without costs. Cumulative payments stay at 40. Unpaid obligations fall from 20 to 5. Unobligated funds rise from 40 to 55 after a deobligation of 15. The law and the period of availability govern reuse.</desc>
<rect x="0.5" y="0.5" width="571" height="248" rx="9" fill="var(--color-ink)" fill-opacity="1" stroke="var(--color-line)"/>
<text x="16" y="30" font-size="17" fill="var(--color-paper)" text-anchor="start" font-weight="500">Ending a contract frees up funds</text>
<text x="16" y="49" font-size="12" fill="var(--color-muted)" text-anchor="start" font-weight="400">Fictional example · $100 million appropriation</text>
<path d="M16 61H556" fill="none" stroke="var(--color-line)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="16" y="88" font-size="13" fill="var(--color-paper)" text-anchor="start" font-weight="500">Before termination</text>
<rect x="16.5" y="96" width="215.0" height="28" rx="3" fill="var(--color-topic-blue)" fill-opacity="0.13" stroke="var(--color-topic-blue)"/>
<text x="124.0" y="114" font-size="12" fill="var(--color-topic-blue)" text-anchor="middle" font-weight="500">40</text>
<rect x="232.5" y="96" width="107.0" height="28" rx="3" fill="var(--color-accent)" fill-opacity="0.13" stroke="var(--color-accent)"/>
<text x="286.0" y="114" font-size="12" fill="var(--color-accent)" text-anchor="middle" font-weight="500">20</text>
<rect x="340.5" y="96" width="215.0" height="28" rx="3" fill="var(--color-signal)" fill-opacity="0.13" stroke="var(--color-signal)"/>
<text x="448.0" y="114" font-size="12" fill="var(--color-signal)" text-anchor="middle" font-weight="500">40</text>
<text x="16" y="151" font-size="13" fill="var(--color-paper)" text-anchor="start" font-weight="500">After termination</text>
<rect x="16.5" y="159" width="215.0" height="28" rx="3" fill="var(--color-topic-blue)" fill-opacity="0.13" stroke="var(--color-topic-blue)"/>
<text x="124.0" y="177" font-size="12" fill="var(--color-topic-blue)" text-anchor="middle" font-weight="500">40</text>
<rect x="232.5" y="159" width="26.0" height="28" rx="3" fill="var(--color-accent)" fill-opacity="0.13" stroke="var(--color-accent)"/>
<text x="245.5" y="177" font-size="12" fill="var(--color-accent)" text-anchor="middle" font-weight="500">5</text>
<rect x="259.5" y="159" width="296.0" height="28" rx="3" fill="var(--color-signal)" fill-opacity="0.13" stroke="var(--color-signal)"/>
<text x="407.5" y="177" font-size="12" fill="var(--color-signal)" text-anchor="middle" font-weight="500">55</text>
<path d="M340.0 124v14" fill="none" stroke="var(--color-accent)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M259.0 151v-13H340.0v13" fill="none" stroke="var(--color-signal)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="348.0" y="141" font-size="12" fill="var(--color-signal)" text-anchor="start" font-weight="400">$15m released</text>
<path d="M16 200H556" fill="none" stroke="var(--color-line)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
