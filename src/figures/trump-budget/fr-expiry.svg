<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 572 253" width="100%" height="auto" style="width:100%;height:auto" role="img" aria-labelledby="trump-budget-fr-expiry-wide-title trump-budget-fr-expiry-wide-desc" xml:lang="fr">
<title id="trump-budget-fr-expiry-wide-title">Crédits et délais du Congrès</title>
<desc id="trump-budget-fr-expiry-wide-desc">Le président propose une annulation de crédits le 25 septembre 2026. Le GAO situe leur échéance au 30 septembre et la fin de l’examen au Congrès au 9 novembre au plus tôt. Devenir des crédits non établi.</desc>
