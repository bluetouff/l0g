<title id="trump-budget-fr-expiry-mobile-title">Crédits et délais du Congrès</title>
<desc id="trump-budget-fr-expiry-mobile-desc">Le président propose une annulation de crédits le 25 septembre 2026. Le GAO situe leur échéance au 30 septembre et la fin de l’examen au Congrès au 9 novembre au plus tôt. Devenir des crédits non établi.</desc>
