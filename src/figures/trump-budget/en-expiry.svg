<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 572 253" width="100%" height="auto" style="width:100%;height:auto" role="img" aria-labelledby="trump-budget-en-expiry-wide-title trump-budget-en-expiry-wide-desc" xml:lang="en">
<title id="trump-budget-en-expiry-wide-title">Funds and the congressional clock</title>
<desc id="trump-budget-en-expiry-wide-desc">The President proposes rescissions on September 25, 2026. GAO puts the expiration date at September 30 and the earliest end of congressional review at November 9. The final disposition of the funds is unverified.</desc>
<rect x="0.5" y="0.5" width="571" height="252" rx="9" fill="var(--color-ink)" fill-opacity="1" stroke="var(--color-line)"/>
<text x="16" y="30" font-size="17" fill="var(--color-paper)" text-anchor="start" font-weight="500">Funds and the congressional clock</text>
<text x="16" y="49" font-size="12" fill="var(--color-muted)" text-anchor="start" font-weight="400">Proposed rescission · $810m · 11 accounts</text>
<path d="M16 61H556" fill="none" stroke="var(--color-line)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M79 104H285" fill="none" stroke="var(--color-accent)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M79 115H487m-4-3 4 3-4 3" fill="none" stroke="var(--color-signal)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="3 4"/>
<circle cx="79" cy="110" r="16" fill="var(--color-surface)" stroke="var(--color-paper)" stroke-width="1"/>
<g transform="translate(68 99)" aria-hidden="true"><path d="M6 3h8l3 3v13H6zM14 3v4h3m-8 4h5m-5 4h5" fill="none" stroke="var(--color-paper)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/></g>
<text x="79" y="151" font-size="13" fill="var(--color-paper)" text-anchor="middle" font-weight="500">Sep. 25, 2026</text>
<text x="79" y="170" font-size="12" fill="var(--color-paper)" text-anchor="middle" font-weight="400">Proposal to Congress</text>
<circle cx="285" cy="110" r="16" fill="var(--color-surface)" stroke="var(--color-accent)" stroke-width="1"/>
<g transform="translate(274 99)" aria-hidden="true"><path d="M4 6h14v12H4zM4 9h14M7 4v4m8-4v4m-6 5 4 3m0-3-4 3" fill="none" stroke="var(--color-accent)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/></g>
<text x="285" y="151" font-size="13" fill="var(--color-accent)" text-anchor="middle" font-weight="500">Sep. 30, 2026</text>
<text x="285" y="170" font-size="12" fill="var(--color-paper)" text-anchor="middle" font-weight="400">Funds due to expire</text>
<circle cx="487" cy="110" r="16" fill="var(--color-surface)" stroke="var(--color-signal)" stroke-width="1"/>
<g transform="translate(476 99)" aria-hidden="true"><path d="M2 8l9-5 9 5M4 9h14M5 10v7m4-7v7m4-7v7m4-7v7M3 19h16" fill="none" stroke="var(--color-signal)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/></g>
<text x="487" y="151" font-size="13" fill="var(--color-signal)" text-anchor="middle" font-weight="500">Nov. 9, 2026</text>
<text x="487" y="170" font-size="12" fill="var(--color-paper)" text-anchor="middle" font-weight="400">Earliest end of review</text>
<path d="M16 189H556" fill="none" stroke="var(--color-line)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M18 207h16" fill="none" stroke="var(--color-accent)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="42" y="211" font-size="12" fill="var(--color-muted)" text-anchor="start" font-weight="400">Before funds expire</text>
<path d="M224 207h16" fill="none" stroke="var(--color-signal)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="3 4"/>
<text x="248" y="211" font-size="12" fill="var(--color-muted)" text-anchor="start" font-weight="400">Congressional review period</text>
<text x="16" y="234" font-size="12" fill="var(--color-muted)" text-anchor="start" font-weight="400">Final status of the accounts unverified</text>
</svg>
