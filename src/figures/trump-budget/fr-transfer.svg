<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 572 223" width="100%" height="auto" style="width:100%;height:auto" role="img" aria-labelledby="trump-budget-fr-transfer-wide-title trump-budget-fr-transfer-wide-desc" xml:lang="fr">
<title id="trump-budget-fr-transfer-wide-title">Des crédits de la marine vers la détention</title>
<desc id="trump-budget-fr-transfer-wide-desc">Le Pentagone transfère 447 millions de dollars du fonds de roulement de la marine via son compte de lutte antidrogue. Des responsables militaires indiquent que 442 millions étaient destinés au soutien de la détention par l’ICE et 5 millions au remboursement des frais militaires de détention à Guantánamo.</desc>
<rect x="0.5" y="0.5" width="571" height="222" rx="9" fill="var(--color-ink)" fill-opacity="1" stroke="var(--color-line)"/>
<text x="16" y="30" font-size="17" fill="var(--color-paper)" text-anchor="start" font-weight="500">Des crédits de la marine vers la détention</text>
<text x="16" y="49" font-size="12" fill="var(--color-muted)" text-anchor="start" font-weight="400">Transfert du 19 mai 2025 · M$ US</text>
<path d="M16 61H556" fill="none" stroke="var(--color-line)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M100 115H239m-5-3 5 3-5 3" fill="none" stroke="var(--color-signal)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="169" y="104" font-size="14" fill="var(--color-signal)" text-anchor="middle" font-weight="500">447</text>
<path d="M275 115h50V102h31m-4-3 4 3-4 3M325 115v49h31m-4-3 4 3-4 3" fill="none" stroke="var(--color-line-strong)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="83" cy="115" r="16" fill="var(--color-surface)" stroke="var(--color-signal)" stroke-width="1"/>
<g transform="translate(72 104)" aria-hidden="true"><path d="M2 14h18l-3 4H6zM6 14V9h11v5M9 9V6h5v3M11 6V3M3 20c1 0 1-1 2-1s1 1 2 1m8 0c1 0 1-1 2-1s1 1 2 1" fill="none" stroke="var(--color-signal)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/></g>
<text x="83" y="156" font-size="13" fill="var(--color-paper)" text-anchor="middle" font-weight="400">Fonds de roulement</text>
<text x="83" y="173" font-size="13" fill="var(--color-paper)" text-anchor="middle" font-weight="400">de la marine</text>
<circle cx="258" cy="115" r="16" fill="var(--color-surface)" stroke="var(--color-signal)" stroke-width="1"/>
<g transform="translate(247 104)" aria-hidden="true"><path d="M11 3l7 3v5c0 4-3 6-7 8-4-2-7-4-7-8V6zM7.5 11h7m-2-2 2 2-2 2" fill="none" stroke="var(--color-signal)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/></g>
<text x="258" y="156" font-size="13" fill="var(--color-paper)" text-anchor="middle" font-weight="400">Compte antidrogue</text>
<text x="258" y="173" font-size="13" fill="var(--color-paper)" text-anchor="middle" font-weight="400">du Pentagone</text>
<text x="366" y="81" font-size="12" fill="var(--color-muted)" text-anchor="start" font-weight="400">Usages selon le DOD</text>
<text x="366" y="107" font-size="16" fill="var(--color-accent)" text-anchor="start" font-weight="500">442</text>
<text x="366" y="126" font-size="12" fill="var(--color-paper)" text-anchor="start" font-weight="400">Soutien à la détention ICE</text>
<text x="366" y="169" font-size="16" fill="var(--color-accent)" text-anchor="start" font-weight="500">5</text>
<text x="366" y="187" font-size="12" fill="var(--color-paper)" text-anchor="start" font-weight="400">Remboursements militaires</text>
<text x="366" y="203" font-size="12" fill="var(--color-paper)" text-anchor="start" font-weight="400">liés à Guantánamo</text>
