<title id="ozans-cooling-fr-m-title">Une boucle d’eau transporte la chaleur vers l’air</title><desc id="ozans-cooling-fr-m-desc">Schéma simplifié du refroidissement sec projeté. Un remplissage initial de 1 000 mètres cubes par bâtiment est prévu, avec des appoints ponctuels non quantifiés. Les usages sanitaires et leur rejet estimé de 10,4 mètres cubes par jour constituent un autre circuit.</desc>
