<title id="ozans-financing-en-d-title">Funding follows asset categories</title><desc id="ozans-financing-en-d-desc">Google would fund 70 % and RTE 30 % of public substation and first-link costs. Google would fully fund second links and the private substation. RTE’s total contribution remains unquantified by the published cost breakdown.</desc>
