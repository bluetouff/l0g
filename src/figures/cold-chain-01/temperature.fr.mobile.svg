="start">denrée et historique</text><rect id="cc-temperature-fr-m-panel-legal" x="28" y="773" width="364" height="175" rx="8" fill="var(--color-surface-2)" stroke="none" stroke-width="0"/><text data-panel="cc-temperature-fr-m-panel-legal" x="46" y="825" font-family="l0g Cold Chain" font-size="37" font-weight="700" fill="var(--color-amber)" text-anchor="start">−18</text><circle cx="135.4912" cy="799.84" r="2.405" fill="none" stroke="var(--color-amber)" stroke-width="1.5"/><text data-panel="cc-temperature-fr-m-panel-legal" x="143.4912" y="825" font-family="l0g Cold Chain" font-size="37" font-weight="700" fill="var(--color-amber)" text-anchor="start">C</text><text data-panel="cc-temperature-fr-m-panel-legal" x="46" y="864" font-family="l0g Cold Chain" font-size="18" font-weight="400" fill="var(--color-paper)" text-anchor="start">Aliments surgelés : tous les points</text><text data-panel="cc-temperature-fr-m-panel-legal" x="46" y="888" font-family="l0g Cold Chain" font-size="18" font-weight="400" fill="var(--color-paper)" text-anchor="start">du produit.</text><text data-panel="cc-temperature-fr-m-panel-legal" x="46" y="924" font-family="l0g Cold Chain" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">Tolérances encadrées</text><text data-panel="cc-temperature-fr-m-frame" x="28" y="1001" font-family="l0g Cold Chain" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">Objets de preuve distincts ; aucune</text><text data-panel="cc-temperature-fr-m-frame" x="28" y="1026" font-family="l0g Cold Chain" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">mesure d’incident.</text><text data-panel="cc-temperature-fr-m-frame" x="28" y="1060" font-family="l0g Cold Chain" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">[06, 11, 12, 13]</text></svg>