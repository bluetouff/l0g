<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1080" role="img" aria-labelledby="cc-temperature-fr-m-t cc-temperature-fr-m-d" style="width:100%;height:auto" class="l0g-cold-chain-svg"><title id="cc-temperature-fr-m-t">Consigne, air et produit</title><desc id="cc-temperature-fr-m-d">La consigne est une instruction ; la sonde observe l’air ; la température du produit concerne la denrée. La référence européenne de moins 18 degrés Celsius concerne les aliments surgelés avec ses tolérances.</desc><rect id="cc-temperature-fr-m-frame" x="0" y="0" width="420" height="1080" rx="0" fill="var(--color-ink)" stroke="none" stroke-width="0"/><text data-panel="cc-temperature-fr-m-frame" x="28" y="40" font-family="l0g Cold Chain" font-size="18" font-weight="700" fill="var(--color-signal)" text-anchor="start">l0g / FROID</text><text data-panel="cc-temperature-fr-m-frame" x="392" y="40" font-family="l0g Cold Chain" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="end">03</text><text data-panel="cc-temperature-fr-m-frame" x="28" y="88" font-family="l0g Cold Chain" font-size="27" font-weight="700" fill="var(--color-paper)" text-anchor="start">Consigne, air et produit</text><text data-panel="cc-temperature-fr-m-frame" x="28" y="121" font-family="l0g Cold Chain" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">Trois objets de preuve à distinguer</text><rect id="cc-temperature-fr-m-card-setpoint" x="28" y="198" width="364" height="120" rx="8" fill="var(--color-surface-2)" stroke="none" stroke-width="0"/><text data-panel="cc-temperature-fr-m-card-setpoint" x="46" y="232" font-family="l0g Cold Chain" font-size="24" font-weight="700" fill="var(--color-signal)" text-anchor="start">Consigne</text><text data-panel="cc-temperature-fr-m-card-setpoint" x="210" y="285" font-family="l0g Cold Chain" font-size="36" font-weight="700" fill="var(--color-paper)" text-anchor="middle">T cible</text><path data-connector="instruction-head" d="M213.