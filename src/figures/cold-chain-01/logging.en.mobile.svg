<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1080" role="img" aria-labelledby="cc-logging-en-m-t cc-logging-en-m-d" style="width:100%;height:auto" class="l0g-cold-chain-svg"><title id="cc-logging-en-m-t">Four readings, one hourly average</title><desc id="cc-logging-en-m-d">Four symbolic readings separated by fifteen-minute intervals are aggregated by arithmetic mean in an hourly report. No victim readings or installation are represented.</desc><rect id="cc-logging-en-m-frame" x="0" y="0" width="420" height="1080" rx="0" fill="var(--color-ink)" stroke="none" stroke-width="0"/><text data-panel="cc-logging-en-m-frame" x="28" y="40" font-family="l0g Cold Chain" font-size="18" font-weight="700" fill="var(--color-signal)" text-anchor="start">l0g / COLD CHAIN</text><text data-panel="cc-logging-en-m-frame" x="392" y="40" font-family="l0g Cold Chain" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="end">04</text><text data-panel="cc-logging-en-m-frame" x="28" y="88" font-family="l0g Cold Chain" font-size="27" font-weight="700" fill="var(--color-paper)" text-anchor="start">Four readings, one</text><text data-panel="cc-logging-en-m-frame" x="28" y="123" font-family="l0g Cold Chain" font-size="27" font-weight="700" fill="var(--color-paper)" text-anchor="start">hourly average</text><text data-panel="cc-logging-en-m-frame" x="28" y="156" font-family="l0g Cold Chain" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">From readings to the report</text><text data-panel="cc-logging-en-m-frame" x="28" y="195" font-family="l0g Cold Chain" font-size="22" font-weight="700" fill="var(--color-signal)" text-anchor="start">4 samples</text><rect id="cc-logging-en-m-card-sample-0" x="28" y="228" width="76" height="78" rx="8" fill="var(--color-surface-2)" stroke="none" stroke-width="0" data-metric="sample" data-value="1"/><text data-panel="cc-logging-en-m-card-sample-0" x="66" y="278" font-family="l0g Cold Chain" font-size="25" font-weight="700" fill="var(--color-paper)" text-anchor="middle">T1</text><path data-connector="time-0-head" d="M117 263.85 L124 267 L117 270.15" fill="none" stroke="var(--color-line-strong)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path data-connector="time-0" d="M104 267 L124 267" fill="none" stroke="var(--color-line-strong)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="cc-logging-en-m-frame" x="114" y="345" font-family="l0g Cold Chain" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="middle">15 min</text><path data-connector="aggregate-0" d="M66 306 L66 393" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect id="cc-logging-en-m-card-sample-1" x="124" y="228" width="76" height="78" rx="8" fill="var(--color-surface-2)" stroke="none" stroke-width="0" data-metric="sample" data-value="2"/><text data-panel="cc-logging-en-m-card-sample-1" x="162" y="278" font-family="l0g Cold Chain" font-size="25" font-weight="700" fill="var(--color-paper)" text-anchor="middle">T2</text><path data-connector="time-1-head" d="M213 263.85 L220 267 L213 270.15" fill="none" stroke="var(--color-line-strong)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path data-connector="time-1" d="M200 267 L220 267" fill="none" stroke="var(--color-line-strong)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="cc-logging-en-m-frame" x="210" y="345" font-family="l0g Cold Chain" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="middle">15 min</text><path data-connector="aggregate-1" d="M162 306 L162 393" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect id="cc-logging-en-m-card-sample-2" x="220" y="228" width="76" height="78" rx="8" fill="var(--color-surface-2)" stroke="none" stroke-width="0" data-metric="sample" data-value="3"/><text data-panel="cc-logging-en-m-card-sample-2" x="258" y="278" font-family="l0g Cold Chain" font-size="25" font-weight="700" fill="var(--color-paper)" text-anchor="middle">T3</text><path data-connector="time-2-head" d="M309 263.85 L316 267 L309 270.15" fill="none" stroke="var(--color-line-strong)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path data-connector="time-2" d="M296 267 L316 267" fill="none" stroke="var(--color-line-strong)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="cc-logging-en-m-frame" x="306" y="345" font-family="l0g Cold Chain" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="middle">15 min</text><path data-connector="aggregate-2" d="M258 306 L258 393" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect id="cc-logging-en-m-card-sample-3" x="316" y="228" width="76" height="78" rx="8" fill="var(--color-surface-2)" stroke="none" stroke-width="0" data-metric="sample" data-value="4"/><text data-panel="cc-logging-en-m-card-sample-3" x="354" y="278" font-family="l0g Cold Chain" font-size="25" font-weight="700" fill="var(--color-paper)" text-anchor="middle">T4</text><path data-connector="aggregate-3" d="M354 306 L354 393" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path data-connector="aggregate-bus" d="M66 393 L354 393" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path data-connector="hourly-head" d="M213.15 436 L210 443 L206.85 436" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path data-connector="hourly" d="M210 393 L210 443" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect id="cc-logging-en-m-card-hourly" x="28" y="443" width="364" height="125" rx="8" fill="var(--color-surface-2)" stroke="none" stroke-width="0"/><text data-panel="cc-logging-en-m-card-hourly" x="210" y="492" font-family="l0g Cold Chain" font-size="26" font-weight="700" fill="var(--color-amber)" text-anchor="middle">1 hourly value</text><text data-panel="cc-logging-en-m-card-hourly" x="210" y="535" font-family="l0g Cold Chain" font-size="18" font-weight="400" fill="var(--color-paper)" text-anchor="middle">in the report</text><path data-connector="formula-head" d="M213.15 608 L210 615 L206.85 608" fill="none" stroke="var(--color-amber)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path data-connector="formula" d="M210 568 L210 615" fill="none" stroke="var(--color-amber)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect id="cc-logging-en-m-panel-formula" x="28" y="615" width="364" height="91" rx="8" fill="var(--color-surface-2)" stroke="none" stroke-width="0"/><text data-panel="cc-logging-en-m-panel-formula" x="210" y="670" font-family="l0g Cold Chain" font-size="22" font-weight="700" fill="var(--color-paper)" text-anchor="middle">(T1 + T2 + T3 + T4) / 4</text><rect id="cc-logging-en-m-card-raw" x="28" y="768" width="364" height="141" rx="8" fill="var(--color-surface-2)" stroke="none" stroke-width="0"/><text data-panel="cc-logging-en-m-card-raw" x="46" y="806" font-family="l0g Cold Chain" font-size="23" font-weight="700" fill="var(--color-signal)" text-anchor="start">Average retained</text><text data-panel="cc-logging-en-m-card-raw" x="46" y="846" font-family="l0g Cold Chain" font-size="18" font-weight="400" fill="var(--color-paper)" text-anchor="start">Find maxima and duration in the</text><text data-panel="cc-logging-en-m-card-raw" x="46" y="871" font-family="l0g Cold Chain" font-size="18" font-weight="400" fill="var(--color-paper)" text-anchor="start">underlying data.</text><text data-panel="cc-logging-en-m-frame" x="28" y="978" font-family="l0g Cold Chain" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">Documented manual feature. Use at</text><text data-panel="cc-logging-en-m-frame" x="28" y="1003" font-family="l0g Cold Chain" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">victim sites is unknown.</text><text data-panel="cc-logging-en-m-frame" x="28" y="1058" font-family="l0g Cold Chain" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">[07]</text></svg>