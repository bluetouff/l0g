<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="cc-logging-fr-d-t cc-logging-fr-d-d" style="width:100%;height:auto" class="l0g-cold-chain-svg"><title id="cc-logging-fr-d-t">Quatre relevés, une moyenne horaire</title><desc id="cc-logging-fr-d-d">Quatre relevés symboliques espacés de quinze minutes sont agrégés par moyenne arithmétique dans un rapport horaire. Aucune valeur ou installation de victime n’est représentée.</desc><rect id="cc-logging-fr-d-frame" x="0" y="0" width="1000" height="680" rx="0" fill="var(--color-ink)" stroke="none" stroke-width="0"/><text data-panel="cc-logging-fr-d-frame" x="28" y="45" font-family="l0g Cold Chain" font-size="24" font-weight="700" fill="var(--color-signal)" text-anchor="start">l0g / FROID</text><text data-panel="cc-logging-fr-d-frame" x="972" y="45" font-family="l0g Cold Chain" font-size="24" font-weight="400" fill="var(--color-muted)" text-anchor="end">04</text><text data-panel="cc-logging-fr-d-frame" x="28" y="100" font-family="l0g Cold Chain" font-size="36" font-weight="700" fill="var(--color-paper)" text-anchor="start">Quatre relevés, une moyenne horaire</text><text data-panel="cc-logging-fr-d-frame" x="28" y="140" font-family="l0g Cold Chain" font-size="24" font-weight="400" fill="var(--color-muted)" text-anchor="start">Du relevé au rapport</text><text data-panel="cc-logging-fr-d-frame" x="28" y="195" font-family="l0g Cold Chain" font-size="27" font-weight="700" fill="var(--color-signal)" text-anchor="start">4 échantillons</text><rect id="cc-logging-fr-d-card-sample-0" x="40" y="240" width="100" height="100" rx="8" fill="var(--color-surface-2)" stroke="none" stroke-width="0" data-metric="sample" data-value="1"/><text data-panel="cc-logging-fr-d-card-sample-0" x="90" y="305" font-family="l0g Cold Chain" font-size="36" font-weight="700" fill="var(--color-paper)" text-anchor="middle">T1</text><path data-connector="time-0-head" d="M191 285.95 L200 290 L191 294.05" fill="none" stroke="var(--color-line-strong)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path data-connector="time-0" d="M140 290 L200 290" fill="none" stroke="var(--color-line-strong)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="cc-logging-fr-d-frame" x="170" y="385" font-family="l0g Cold Chain" font-size="24" font-weight="400" fill="var(--color-muted)" text-anchor="middle">15 min</text><path data-connector="aggregate-0" d="M90 340 L90 425" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect id="cc-logging-fr-d-card-sample-1" x="200" y="240" width="100" height="100" rx="8" fill="var(--color-surface-2)" stroke="none" stroke-width="0" data-metric="sample" data-value="2"/><text data-panel="cc-logging-fr-d-card-sample-1" x="250" y="305" font-family="l0g Cold Chain" font-size="36" font-weight="700" fill="var(--color-paper)" text-anchor="middle">T2</text><path data-connector="time-1-head" d="M351 285.95 L360 290 L351 294.05" fill="none" stroke="var(--color-line-strong)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path data-connector="time-1" d="M300 290 L360 290" fill="none" stroke="var(--color-line-strong)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="cc-logging-fr-d-frame" x="330" y="385" font-family="l0g Cold Chain" font-size="24" font-weight="400" fill="var(--color-muted)" text-anchor="middle">15 min</text><path data-connector="aggregate-1" d="M250 340 L250 425" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect id="cc-logging-fr-d-card-sample-2" x="360" y="240" width="100" height="100" rx="8" fill="var(--color-surface-2)" stroke="none" stroke-width="0" data-metric="sample" data-value="3"/><text data-panel="cc-logging-fr-d-card-sample-2" x="410" y="305" font-family="l0g Cold Chain" font-size="36" font-weight="700" fill="var(--color-paper)" text-anchor="middle">T3</text><path data-connector="time-2-head" d="M511 285.95 L520 290 L511 294.05" fill="none" stroke="var(--color-line-strong)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path data-connector="time-2" d="M460 290 L520 290" fill="none" stroke="var(--color-line-strong)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="cc-logging-fr-d-frame" x="490" y="385" font-family="l0g Cold Chain" font-size="24" font-weight="400" fill="var(--color-muted)" text-anchor="middle">15 min</text><path data-connector="aggregate-2" d="M410 340 L410 425" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect id="cc-logging-fr-d-card-sample-3" x="520" y="240" width="100" height="100" rx="8" fill="var(--color-surface-2)" stroke="none" stroke-width="0" data-metric="sample" data-value="4"/><text data-panel="cc-logging-fr-d-card-sample-3" x="570" y="305" font-family="l0g Cold Chain" font-size="36" font-weight="700" fill="var(--color-paper)" text-anchor="middle">T4</text><path data-connector="aggregate-3" d="M570 340 L570 425" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path data-connector="aggregate-bus-head" d="M735 285.95 L744 290 L735 294.05" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path data-connector="aggregate-bus" d="M90 425 L670 425 L670 290 L744 290" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect id="cc-logging-fr-d-card-hourly" x="744" y="226" width="228" height="134" rx="8" fill="var(--color-surface-2)" stroke="none" stroke-width="0"/><text data-panel="cc-logging-fr-d-card-hourly" x="858" y="277" font-family="l0g Cold Chain" font-size="30" font-weight="700" fill="var(--color-amber)" text-anchor="middle">1 valeur</text><text data-panel="cc-logging-fr-d-card-hourly" x="858" y="322" font-family="l0g Cold Chain" font-size="26" font-weight="400" fill="var(--color-paper)" text-anchor="middle">horaire</text><rect id="cc-logging-fr-d-panel-formula" x="28" y="479" width="944" height="76" rx="8" fill="var(--color-surface-2)" stroke="none" stroke-width="0"/><text data-panel="cc-logging-fr-d-panel-formula" x="500" y="529" font-family="l0g Cold Chain" font-size="32" font-weight="700" fill="var(--color-paper)" text-anchor="middle">(T1 + T2 + T3 + T4) / 4</text><text data-panel="cc-logging-fr-d-frame" x="28" y="600" font-family="l0g Cold Chain" font-size="24" font-weight="400" fill="var(--color-paper)" text-anchor="start">Moyenne, maximum et durée demandent des informations différentes.</text><text data-panel="cc-logging-fr-d-frame" x="28" y="638" font-family="l0g Cold Chain" font-size="24" font-weight="400" fill="var(--color-muted)" text-anchor="start">Fonction du manuel ; usage chez les victimes inconnu.</text><text data-panel="cc-logging-fr-d-frame" x="28" y="669" font-family="l0g Cold Chain" font-size="24" font-weight="400" fill="var(--color-muted)" text-anchor="start">[07]</text></svg>