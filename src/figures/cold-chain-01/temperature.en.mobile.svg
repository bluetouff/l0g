<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1080" role="img" aria-labelledby="cc-temperature-en-m-t cc-temperature-en-m-d" style="width:100%;height:auto" class="l0g-cold-chain-svg"><title id="cc-temperature-en-m-t">Setpoint, air and product</title><desc id="cc-temperature-en-m-d">The setpoint is an instruction; a sensor observes air; product temperature concerns the food itself. The European minus 18 degrees Celsius reference applies to quick-frozen food with its specified tolerances.</desc><rect id="cc-temperature-en-m-frame" x="0" y="0" width="420" height="1080" rx="0" fill="var(--color-ink)" stroke="none" stroke-width="0"/><text data-panel="cc-temperature-en-m-frame" x="28" y="40" font-family="l0g Cold Chain" font-size="18" font-weight="700" fill="var(--color-signal)" text-anchor="start">l0g / COLD CHAIN</text><text data-panel="cc-temperature-en-m-frame" x="392" y="40" font-family="l0g Cold Chain" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="end">03</text><text data-panel="cc-temperature-en-m-frame" x="28" y="88" font-family="l0g Cold Chain" font-size="27" font-weight="700" fill="var(--color-paper)" text-anchor="start">Setpoint, air and</text><text data-panel="cc-temperature-en-m-frame" x="28" y="123" font-family="l0g Cold Chain" font-size="27" font-weight="700" fill="var(--color-paper)" text-anchor="start">product</text><text data-panel="cc-temperature-en-m-frame" x="28" y="156" font-family="l0g Cold Chain" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">Three distinct objects of evidence</text><rect id="cc-temperature-en-m-card-setpoint" x="28" y="198" width="364" height="120" rx="8" fill="var(--color-surface-2)" stroke="none" stroke-width="0"/><text data-panel="cc-temperature-en-m-card-setpoint" x="46" y="232" font-family="l0g Cold Chain" font-size="24" font-weight="700" fill="var(--color-signal)" text-anchor="start">Setpoint</text><text data-panel="cc-temperature-en-m-card-setpoint" x="210" y="285" font-family="l0g Cold Chain" font-size="36" font-weight="700" fill="var(--color-paper)" text-anchor="middle">Target T</text><path data-connector="instruction-head" d="M213.15 356 L210 363 L206.85 356" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path data-connector="instruction" d="M210 318 L210 363" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect id="cc-temperature-en-m-panel-cabinet" x="28" y="373" width="364" height="352" rx="8" fill="var(--color-surface-2)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="cc-temperature-en-m-panel-cabinet" x="46" y="415" font-family="l0g Cold Chain" font-size="24" font-weight="700" fill="var(--color-amber)" text-anchor="start">Air</text><text data-panel="cc-temperature-en-m-panel-cabinet" x="46" y="452" font-family="l0g Cold Chain" font-size="18" font-weight="400" fill="var(--color-paper)" text-anchor="start">Reading at the sensor location</text><circle cx="356" cy="424" r="6" fill="var(--color-amber)"/><path data-connector="sensor" d="M356 430 L356 478" fill="none" stroke="var(--color-amber)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect id="cc-temperature-en-m-panel-product" x="78" y="521" width="264" height="145" rx="8" fill="var(--color-ink)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="cc-temperature-en-m-panel-product" x="96" y="559" font-family="l0g Cold Chain" font-size="24" font-weight="700" fill="var(--color-paper)" text-anchor="start">Food</text><text data-panel="cc-temperature-en-m-panel-product" x="96" y="595" font-family="l0g Cold Chain" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">Temperature inside the</text><text data-panel="cc-temperature-en-m-panel-product" x="96" y="619" font-family="l0g Cold Chain" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">food, and its history</text><rect id="cc-temperature-en-m-panel-legal" x="28" y="773" width="364" height="175" rx="8" fill="var(--color-surface-2)" stroke="none" stroke-width="0"/><text data-panel="cc-temperature-en-m-panel-legal" x="46" y="825" font-family="l0g Cold Chain" font-size="37" font-weight="700" fill="var(--color-amber)" text-anchor="start">−18</text><circle cx="135.4912" cy="799.84" r="2.405" fill="none" stroke="var(--color-amber)" stroke-width="1.5"/><text data-panel="cc-temperature-en-m-panel-legal" x="143.4912" y="825" font-family="l0g Cold Chain" font-size="37" font-weight="700" fill="var(--color-amber)" text-anchor="start">C</text><text data-panel="cc-temperature-en-m-panel-legal" x="46" y="864" font-family="l0g Cold Chain" font-size="18" font-weight="400" fill="var(--color-paper)" text-anchor="start">Quick-frozen foods: all points in the</text><text data-panel="cc-temperature-en-m-panel-legal" x="46" y="888" font-family="l0g Cold Chain" font-size="18" font-weight="400" fill="var(--color-paper)" text-anchor="start">product.</text><text data-panel="cc-temperature-en-m-panel-legal" x="46" y="924" font-family="l0g Cold Chain" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">Specified tolerances</text><text data-panel="cc-temperature-en-m-frame" x="28" y="1001" font-family="l0g Cold Chain" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">Distinct evidence objects; no incident</text><text data-panel="cc-temperature-en-m-frame" x="28" y="1026" font-family="l0g Cold Chain" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">readings.</text><text data-panel="cc-temperature-en-m-frame" x="28" y="1060" font-family="l0g Cold Chain" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">[06, 11, 12, 13]</text></svg>