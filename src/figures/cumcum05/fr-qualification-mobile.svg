<text data-panel="cumcum05-fr-qualification-m-card-test-0" x="40" y="714" fill="var(--color-paper)" font-family="l0g CumCum05" font-size="21" font-weight="700" text-anchor="start">Identifier le bénéficiaire</text>
<text data-panel="cumcum05-fr-qualification-m-card-test-0" x="40" y="746" fill="var(--color-muted)" font-family="l0g CumCum05" font-size="17" font-weight="400" text-anchor="start">Destinataire réel du revenu, selon les</text>
<text data-panel="cumcum05-fr-qualification-m-card-test-0" x="40" y="769" fill="var(--color-muted)" font-family="l0g CumCum05" font-size="17" font-weight="400" text-anchor="start">conditions légales.</text>
<rect id="cumcum05-fr-qualification-m-card-test-1" x="24" y="822" width="372.000000000" height="154" rx="8" fill="var(--color-surface)" stroke="var(--color-accent)" stroke-width="1"/>
<text data-panel="cumcum05-fr-qualification-m-card-test-1" x="40" y="851" fill="var(--color-accent)" font-family="l0g CumCum05" font-size="17" font-weight="700" text-anchor="start">ART.119 bis A</text>
<text data-panel="cumcum05-fr-qualification-m-card-test-1" x="40" y="886" fill="var(--color-paper)" font-family="l0g CumCum05" font-size="21" font-weight="700" text-anchor="start">Qualifier le transfert</text>
<text data-panel="cumcum05-fr-qualification-m-card-test-1" x="40" y="918" fill="var(--color-muted)" font-family="l0g CumCum05" font-size="17" font-weight="400" text-anchor="start">Certains versements ou transferts sont</text>
<text data-panel="cumcum05-fr-qualification-m-card-test-1" x="40" y="941" fill="var(--color-muted)" font-family="l0g CumCum05" font-size="17" font-weight="400" text-anchor="start">réputés constituer un revenu distribué.</text>
<text data-panel="cumcum05-fr-qualification-m-frame" x="24" y="1038" fill="var(--color-signal)" font-family="l0g CumCum05" font-size="17" font-weight="700" text-anchor="start">S03 / avis, points 4–5 / S04 / art.96</text>
<text data-panel="cumcum05-fr-qualification-m-frame" x="24" y="1064" fill="var(--color-muted)" font-family="l0g CumCum05" font-size="17" font-weight="400" text-anchor="start">Exemple conceptuel / aucune opération</text>
<text data-panel="cumcum05-fr-qualification-m-frame" x="24" y="1087" fill="var(--color-muted)" font-family="l0g CumCum05" font-size="17" font-weight="400" text-anchor="start">bancaire attribuée.</text>
</svg>
