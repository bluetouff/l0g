<path d="M 205 314 L 210 321 L 215 314" fill="none" stroke="var(--color-signal)" stroke-width="2"/>
<rect id="cumcum05-fr-qualification-m-card-flow-1" x="24" y="324" width="372.000000000" height="130" rx="8" fill="var(--color-surface)"/>
<text data-panel="cumcum05-fr-qualification-m-card-flow-1" x="40" y="352" fill="var(--color-signal)" font-family="l0g CumCum05" font-size="17" font-weight="700" text-anchor="start">INTERMÉDIAIRE</text>
<text data-panel="cumcum05-fr-qualification-m-card-flow-1" x="40" y="386" fill="var(--color-paper)" font-family="l0g CumCum05" font-size="20" font-weight="700" text-anchor="start">Reçoit et transmet</text>
<text data-panel="cumcum05-fr-qualification-m-card-flow-1" x="40" y="418" fill="var(--color-muted)" font-family="l0g CumCum05" font-size="17" font-weight="400" text-anchor="start">La valeur circule par un ou plusieurs</text>
<text data-panel="cumcum05-fr-qualification-m-card-flow-1" x="40" y="441" fill="var(--color-muted)" font-family="l0g CumCum05" font-size="17" font-weight="400" text-anchor="start">contrats.</text>
<path d="M 210 457 L 210 475" fill="none" stroke="var(--color-signal)" stroke-width="2"/>
<path d="M 205 468 L 210 475 L 215 468" fill="none" stroke="var(--color-signal)" stroke-width="2"/>
