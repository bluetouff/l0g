<text data-panel="cumcum05-fr-qualification-m-frame" x="24" y="30" fill="var(--color-signal)" font-family="l0g CumCum05" font-size="17" font-weight="700" text-anchor="start">l0g / CUM-CUM 05 / 01</text>
<text data-panel="cumcum05-fr-qualification-m-frame" x="24" y="72" fill="var(--color-paper)" font-family="l0g CumCum05" font-size="26" font-weight="700" text-anchor="start">Le bénéficiaire et la</text>
