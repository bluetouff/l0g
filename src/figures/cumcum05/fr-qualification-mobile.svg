<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cumcum05-fr-qualification-m-title cumcum05-fr-qualification-m-desc" viewBox="0 0 420 1120" style="width:100%;height:auto" class="l0g-cumcum05-svg">
<title id="cumcum05-fr-qualification-m-title">Le bénéficiaire et la nature du revenu</title><desc id="cumcum05-fr-qualification-m-desc">France / loi du 14.02.2025 / art.119 bis et 119 bis A</desc>
