<text data-panel="cumcum05-fr-qualification-m-card-flow-0" x="40" y="232" fill="var(--color-paper)" font-family="l0g CumCum05" font-size="20" font-weight="700" text-anchor="start">Verse le dividende</text>
<text data-panel="cumcum05-fr-qualification-m-card-flow-0" x="40" y="264" fill="var(--color-muted)" font-family="l0g CumCum05" font-size="17" font-weight="400" text-anchor="start">Un revenu distribué à l’origine.</text>
