<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cumcum05-en-market-d-title cumcum05-en-market-d-desc" viewBox="0 0 1000 720" style="width:100%;height:auto" class="l0g-cumcum05-svg">
<title id="cumcum05-en-market-d-title">Knowledge can precede market execution</title><desc id="cumcum05-en-market-d-desc">Two schematic paths / opinion of 27.01.2025</desc>
<rect id="cumcum05-en-market-d-frame" x="0" y="0" width="1000.000000000" height="720" rx="8" fill="var(--color-ink)"/>
<text data-panel="cumcum05-en-market-d-frame" x="24" y="30" fill="var(--color-signal)" font-family="l0g CumCum05" font-size="22" font-weight="700" text-anchor="start">l0g / CUM-CUM 05 / 02</text>
<text data-panel="cumcum05-en-market-d-frame" x="24" y="80" fill="var(--color-paper)" font-family="l0g CumCum05" font-size="30" font-weight="700" text-anchor="start">Knowledge can precede market execution</text>
<text data-panel="cumcum05-en-market-d-frame" x="24" y="110" fill="var(--color-muted)" font-family="l0g CumCum05" font-size="22" font-weight="400" text-anchor="start">Two schematic paths / opinion of 27.01.2025</text>
<rect id="cumcum05-en-market-d-card-path-0" x="24" y="160" width="464.000000000" height="190" rx="8" fill="var(--color-surface)"/>
<text data-panel="cumcum05-en-market-d-card-path-0" x="40" y="189" fill="var(--color-signal)" font-family="l0g CumCum05" font-size="22" font-weight="700" text-anchor="start">MATCHED ON THE MARKET</text>
<text data-panel="cumcum05-en-market-d-card-path-0" x="40" y="223" fill="var(--color-paper)" font-family="l0g CumCum05" font-size="27" font-weight="700" text-anchor="start">Unknown counterparty</text>
<text data-panel="cumcum05-en-market-d-card-path-0" x="40" y="255" fill="var(--color-muted)" font-family="l0g CumCum05" font-size="22" font-weight="400" text-anchor="start">The information actually available</text>
<text data-panel="cumcum05-en-market-d-card-path-0" x="40" y="284" fill="var(--color-muted)" font-family="l0g CumCum05" font-size="22" font-weight="400" text-anchor="start">requires examination.</text>
<path d="M 256 353 L 256 377" fill="none" stroke="var(--color-signal)" stroke-width="2"/>
<path d="M 251 370 L 256 377 L 261 370" fill="none" stroke="var(--color-signal)" stroke-width="2"/>
<rect id="cumcum05-en-market-d-card-path-1" x="512" y="160" width="464.000000000" height="190" rx="8" fill="var(--color-surface)"/>
<text data-panel="cumcum05-en-market-d-card-path-1" x="528" y="189" fill="var(--color-amber)" font-family="l0g CumCum05" font-size="22" font-weight="700" text-anchor="start">NEGOTIATED BEFOREHAND</text>
<text data-panel="cumcum05-en-market-d-card-path-1" x="528" y="223" fill="var(--color-paper)" font-family="l0g CumCum05" font-size="27" font-weight="700" text-anchor="start">Known counterparty</text>
<text data-panel="cumcum05-en-market-d-card-path-1" x="528" y="255" fill="var(--color-muted)" font-family="l0g CumCum05" font-size="22" font-weight="400" text-anchor="start">An over-the-counter agreement</text>
<text data-panel="cumcum05-en-market-d-card-path-1" x="528" y="284" fill="var(--color-muted)" font-family="l0g CumCum05" font-size="22" font-weight="400" text-anchor="start">precedes execution.</text>
<path d="M 744 353 L 744 377" fill="none" stroke="var(--color-amber)" stroke-width="2"/>
<path d="M 739 370 L 744 377 L 749 370" fill="none" stroke="var(--color-amber)" stroke-width="2"/>
<rect id="cumcum05-en-market-d-card-market" x="24" y="380" width="952.000000000" height="88" rx="8" fill="var(--color-surface)" stroke="var(--color-signal)" stroke-width="1"/>
<text data-panel="cumcum05-en-market-d-card-market" x="40" y="412" fill="var(--color-signal)" font-family="l0g CumCum05" font-size="25" font-weight="700" text-anchor="start">SAME REGULATED MARKET</text>
<text data-panel="cumcum05-en-market-d-card-market" x="40" y="446" fill="var(--color-paper)" font-family="l0g CumCum05" font-size="22" font-weight="400" text-anchor="start">The execution venue leaves two possible histories of knowledge.</text>
<rect id="cumcum05-en-market-d-card-opinion-0" x="24" y="492" width="464.000000000" height="142" rx="8" fill="var(--color-surface)"/>
<text data-panel="cumcum05-en-market-d-card-opinion-0" x="40" y="521" fill="var(--color-signal)" font-family="l0g CumCum05" font-size="23" font-weight="700" text-anchor="start">PARAGRAPH 12</text>
<text data-panel="cumcum05-en-market-d-card-opinion-0" x="40" y="555" fill="var(--color-paper)" font-family="l0g CumCum05" font-size="22" font-weight="400" text-anchor="start">Examine information limits and the</text>
<text data-panel="cumcum05-en-market-d-card-opinion-0" x="40" y="584" fill="var(--color-paper)" font-family="l0g CumCum05" font-size="22" font-weight="400" text-anchor="start">conditions for withholding.</text>
<rect id="cumcum05-en-market-d-card-opinion-1" x="512" y="492" width="464.000000000" height="142" rx="8" fill="var(--color-surface)"/>
<text data-panel="cumcum05-en-market-d-card-opinion-1" x="528" y="521" fill="var(--color-amber)" font-family="l0g CumCum05" font-size="23" font-weight="700" text-anchor="start">PARAGRAPH 13</text>
<text data-panel="cumcum05-en-market-d-card-opinion-1" x="528" y="555" fill="var(--color-paper)" font-family="l0g CumCum05" font-size="22" font-weight="400" text-anchor="start">Withhold when conditions are met,</text>
<text data-panel="cumcum05-en-market-d-card-opinion-1" x="528" y="584" fill="var(--color-paper)" font-family="l0g CumCum05" font-size="22" font-weight="400" text-anchor="start">including after an OTC agreement.</text>
<text data-panel="cumcum05-en-market-d-frame" x="24" y="668" fill="var(--color-signal)" font-family="l0g CumCum05" font-size="22" font-weight="700" text-anchor="start">S03 / Conseil d’État / paras.12–13</text>
<text data-panel="cumcum05-en-market-d-frame" x="24" y="700" fill="var(--color-muted)" font-family="l0g CumCum05" font-size="22" font-weight="400" text-anchor="start">Assess price and margin indications alongside other facts.</text>
</svg>
