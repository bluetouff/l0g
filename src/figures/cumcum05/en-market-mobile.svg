<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cumcum05-en-market-m-title cumcum05-en-market-m-desc" viewBox="0 0 420 1100" style="width:100%;height:auto" class="l0g-cumcum05-svg">
<title id="cumcum05-en-market-m-title">Knowledge can precede market execution</title><desc id="cumcum05-en-market-m-desc">Two schematic paths / opinion of 27.01.2025</desc>
<rect id="cumcum05-en-market-m-frame" x="0" y="0" width="420.000000000" height="1100" rx="8" fill="var(--color-ink)"/>
<text data-panel="cumcum05-en-market-m-frame" x="24" y="30" fill="var(--color-signal)" font-family="l0g CumCum05" font-size="17" font-weight="700" text-anchor="start">l0g / CUM-CUM 05 / 02</text>
<text data-panel="cumcum05-en-market-m-frame" x="24" y="72" fill="var(--color-paper)" font-family="l0g CumCum05" font-size="26" font-weight="700" text-anchor="start">Knowledge can precede</text>
<text data-panel="cumcum05-en-market-m-frame" x="24" y="105" fill="var(--color-paper)" font-family="l0g CumCum05" font-size="26" font-weight="700" text-anchor="start">market execution</text>
<text data-panel="cumcum05-en-market-m-frame" x="24" y="135" fill="var(--color-muted)" font-family="l0g CumCum05" font-size="17" font-weight="400" text-anchor="start">Two schematic paths / opinion of</text>
<text data-panel="cumcum05-en-market-m-frame" x="24" y="158" fill="var(--color-muted)" font-family="l0g CumCum05" font-size="17" font-weight="400" text-anchor="start">27.01.2025</text>
<rect id="cumcum05-en-market-m-card-path-0" x="24" y="165" width="372.000000000" height="152" rx="8" fill="var(--color-surface)"/>
<text data-panel="cumcum05-en-market-m-card-path-0" x="40" y="194" fill="var(--color-signal)" font-family="l0g CumCum05" font-size="17" font-weight="700" text-anchor="start">MATCHED ON THE MARKET</text>
<text data-panel="cumcum05-en-market-m-card-path-0" x="40" y="228" fill="var(--color-paper)" font-family="l0g CumCum05" font-size="21" font-weight="700" text-anchor="start">Unknown counterparty</text>
<text data-panel="cumcum05-en-market-m-card-path-0" x="40" y="260" fill="var(--color-muted)" font-family="l0g CumCum05" font-size="17" font-weight="400" text-anchor="start">The information actually available</text>
<text data-panel="cumcum05-en-market-m-card-path-0" x="40" y="283" fill="var(--color-muted)" font-family="l0g CumCum05" font-size="17" font-weight="400" text-anchor="start">requires examination.</text>
<path d="M 210 320 L 210 338" fill="none" stroke="var(--color-signal)" stroke-width="2"/>
<path d="M 205 331 L 210 338 L 215 331" fill="none" stroke="var(--color-signal)" stroke-width="2"/>
<rect id="cumcum05-en-market-m-card-path-1" x="24" y="341" width="372.000000000" height="152" rx="8" fill="var(--color-surface)"/>
<text data-panel="cumcum05-en-market-m-card-path-1" x="40" y="370" fill="var(--color-amber)" font-family="l0g CumCum05" font-size="17" font-weight="700" text-anchor="start">NEGOTIATED BEFOREHAND</text>
<text data-panel="cumcum05-en-market-m-card-path-1" x="40" y="404" fill="var(--color-paper)" font-family="l0g CumCum05" font-size="21" font-weight="700" text-anchor="start">Known counterparty</text>
<text data-panel="cumcum05-en-market-m-card-path-1" x="40" y="436" fill="var(--color-muted)" font-family="l0g CumCum05" font-size="17" font-weight="400" text-anchor="start">An over-the-counter agreement</text>
<text data-panel="cumcum05-en-market-m-card-path-1" x="40" y="459" fill="var(--color-muted)" font-family="l0g CumCum05" font-size="17" font-weight="400" text-anchor="start">precedes execution.</text>
<path d="M 210 496 L 210 514" fill="none" stroke="var(--color-amber)" stroke-width="2"/>
<path d="M 205 507 L 210 514 L 215 507" fill="none" stroke="var(--color-amber)" stroke-width="2"/>
<rect id="cumcum05-en-market-m-card-market" x="24" y="517" width="372.000000000" height="110" rx="8" fill="var(--color-surface)" stroke="var(--color-signal)" stroke-width="1"/>
<text data-panel="cumcum05-en-market-m-card-market" x="40" y="549" fill="var(--color-signal)" font-family="l0g CumCum05" font-size="18" font-weight="700" text-anchor="start">SAME REGULATED MARKET</text>
<text data-panel="cumcum05-en-market-m-card-market" x="40" y="583" fill="var(--color-paper)" font-family="l0g CumCum05" font-size="17" font-weight="400" text-anchor="start">The execution venue leaves two</text>
<text data-panel="cumcum05-en-market-m-card-market" x="40" y="606" fill="var(--color-paper)" font-family="l0g CumCum05" font-size="17" font-weight="400" text-anchor="start">possible histories of knowledge.</text>
<rect id="cumcum05-en-market-m-card-opinion-0" x="24" y="657" width="372.000000000" height="128" rx="8" fill="var(--color-surface)"/>
<text data-panel="cumcum05-en-market-m-card-opinion-0" x="40" y="686" fill="var(--color-signal)" font-family="l0g CumCum05" font-size="18" font-weight="700" text-anchor="start">PARAGRAPH 12</text>
<text data-panel="cumcum05-en-market-m-card-opinion-0" x="40" y="720" fill="var(--color-paper)" font-family="l0g CumCum05" font-size="17" font-weight="400" text-anchor="start">Examine information limits and the</text>
<text data-panel="cumcum05-en-market-m-card-opinion-0" x="40" y="743" fill="var(--color-paper)" font-family="l0g CumCum05" font-size="17" font-weight="400" text-anchor="start">conditions for withholding.</text>
<rect id="cumcum05-en-market-m-card-opinion-1" x="24" y="803" width="372.000000000" height="128" rx="8" fill="var(--color-surface)"/>
<text data-panel="cumcum05-en-market-m-card-opinion-1" x="40" y="832" fill="var(--color-amber)" font-family="l0g CumCum05" font-size="18" font-weight="700" text-anchor="start">PARAGRAPH 13</text>
<text data-panel="cumcum05-en-market-m-card-opinion-1" x="40" y="866" fill="var(--color-paper)" font-family="l0g CumCum05" font-size="17" font-weight="400" text-anchor="start">Withhold when conditions are met,</text>
<text data-panel="cumcum05-en-market-m-card-opinion-1" x="40" y="889" fill="var(--color-paper)" font-family="l0g CumCum05" font-size="17" font-weight="400" text-anchor="start">including after an OTC agreement.</text>
<text data-panel="cumcum05-en-market-m-frame" x="24" y="1003" fill="var(--color-signal)" font-family="l0g CumCum05" font-size="17" font-weight="700" text-anchor="start">S03 / Conseil d’État / paras.12–13</text>
<text data-panel="cumcum05-en-market-m-frame" x="24" y="1029" fill="var(--color-muted)" font-family="l0g CumCum05" font-size="17" font-weight="400" text-anchor="start">Assess price and margin indications</text>
<text data-panel="cumcum05-en-market-m-frame" x="24" y="1052" fill="var(--color-muted)" font-family="l0g CumCum05" font-size="17" font-weight="400" text-anchor="start">alongside other facts.</text>
</svg>
