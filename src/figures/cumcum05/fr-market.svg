<text data-panel="cumcum05-fr-market-d-card-opinion-1" x="528" y="613" fill="var(--color-paper)" font-family="l0g CumCum05" font-size="22" font-weight="400" text-anchor="start">gré.</text>
<text data-panel="cumcum05-fr-market-d-frame" x="24" y="668" fill="var(--color-signal)" font-family="l0g CumCum05" font-size="22" font-weight="700" text-anchor="start">S03 / Conseil d’État / points 12–13</text>
