<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cumcum05-fr-market-d-title cumcum05-fr-market-d-desc" viewBox="0 0 1000 720" style="width:100%;height:auto" class="l0g-cumcum05-svg">
