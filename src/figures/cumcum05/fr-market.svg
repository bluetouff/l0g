<text data-panel="cumcum05-fr-market-d-card-opinion-1" x="528" y="555" fill="var(--color-paper)" font-family="l0g CumCum05" font-size="22" font-weight="400" text-anchor="start">Retenue si les conditions sont réunies,</text>
