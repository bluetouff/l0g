<text data-panel="cumcum05-fr-market-m-frame" x="24" y="1029" fill="var(--color-muted)" font-family="l0g CumCum05" font-size="17" font-weight="400" text-anchor="start">Indices de prix et de marge à examiner</text>
<text data-panel="cumcum05-fr-market-m-frame" x="24" y="1052" fill="var(--color-muted)" font-family="l0g CumCum05" font-size="17" font-weight="400" text-anchor="start">avec les autres faits.</text>
