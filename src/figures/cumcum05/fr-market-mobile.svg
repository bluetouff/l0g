<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cumcum05-fr-market-m-title cumcum05-fr-market-m-desc" viewBox="0 0 420 1100" style="width:100%;height:auto" class="l0g-cumcum05-svg">
