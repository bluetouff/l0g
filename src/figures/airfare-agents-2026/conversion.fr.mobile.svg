<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 800" role="img" aria-labelledby="af-conversion-fr-m-title af-conversion-fr-m-desc" style="width:100%;height:auto" class="l0g-airfare-agents-svg">
<title id="af-conversion-fr-m-title">Un voyageur, plusieurs compteurs</title><desc id="af-conversion-fr-m-desc">Une même cohorte synthétique de1000intentions et100réservations. Dix ou mille requêtes par intention changent le taux de conversion calculé par requête.</desc>
