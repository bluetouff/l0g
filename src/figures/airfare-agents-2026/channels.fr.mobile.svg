<text data-panel="af-channels-fr-m-channel-2" x="40" y="481" font-family="l0g Airfare Agents" font-size="23" font-weight="700" text-anchor="start" fill="var(--color-accent)">Retenues</text>
<text data-panel="af-channels-fr-m-channel-2" x="40" y="511" font-family="l0g Airfare Agents" font-size="19" font-weight="400" text-anchor="start" fill="var(--color-paper)">→ Sièges indisponibles</text>
