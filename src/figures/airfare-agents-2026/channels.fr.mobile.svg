<text data-panel="af-channels-fr-m-channel-3" x="40" y="683" font-family="l0g Airfare Agents" font-size="19" font-weight="400" text-anchor="start" fill="var(--color-paper)">Concurrence renforcée</text>
<text data-panel="af-channels-fr-m-channel-3" x="40" y="709" font-family="l0g Airfare Agents" font-size="18.5" font-weight="400" text-anchor="start" fill="var(--color-muted)">Contre-mécanisme proposé</text>
