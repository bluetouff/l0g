<text data-panel="af-channels-fr-m-frame" x="22" y="38" font-family="l0g Airfare Agents" font-size="19" font-weight="400" text-anchor="start" fill="var(--color-signal)">l0g / VOLS ET AGENTS IA</text>
<text data-panel="af-channels-fr-m-frame" x="22" y="82" font-family="l0g Airfare Agents" font-size="28" font-weight="700" text-anchor="start" fill="var(--color-paper)">Quatre chemins</text>
<text data-panel="af-channels-fr-m-frame" x="22" y="116" font-family="l0g Airfare Agents" font-size="28" font-weight="700" text-anchor="start" fill="var(--color-paper)">vers le billet</text>
<text data-panel="af-channels-fr-m-frame" x="22" y="148" font-family="l0g Airfare Agents" font-size="19" font-weight="400" text-anchor="start" fill="var(--color-amber)">Mécanismes et niveaux de preuve</text>
<rect id="af-channels-fr-m-channel-0" stroke="var(--color-line-strong)" stroke-width="1" x="22" y="164" width="376" height="126" rx="12" fill="var(--color-surface)"/>
<text data-panel="af-channels-fr-m-channel-0" x="40" y="195" font-family="l0g Airfare Agents" font-size="23" font-weight="700" text-anchor="start" fill="var(--color-signal)">Consultations</text>
<text data-panel="af-channels-fr-m-channel-0" x="40" y="225" font-family="l0g Airfare Agents" font-size="19" font-weight="400" text-anchor="start" fill="var(--color-paper)">→ Travail informatique</text>
<text data-panel="af-channels-fr-m-channel-0" x="40" y="254" font-family="l0g Airfare Agents" font-size="19" font-weight="400" text-anchor="start" fill="var(--color-paper)">Coût, cache, quotas</text>
<text data-panel="af-channels-fr-m-channel-0" x="40" y="280" font-family="l0g Airfare Agents" font-size="18.5" font-weight="400" text-anchor="start" fill="var(--color-muted)">Canal documenté [08, 09]</text>
<rect id="af-channels-fr-m-channel-1" stroke="var(--color-line-strong)" stroke-width="1" x="22" y="307" width="376" height="126" rx="12" fill="var(--color-surface)"/>
