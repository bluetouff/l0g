<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 800" role="img" aria-labelledby="af-channels-fr-m-title af-channels-fr-m-desc" style="width:100%;height:auto" class="l0g-airfare-agents-svg">
<title id="af-channels-fr-m-title">Quatre chemins vers le billet</title><desc id="af-channels-fr-m-desc">Quatre transmissions distinctes : coût informatique, signal de demande biaisé, retenues de sièges et meilleure comparaison. Les niveaux de preuve diffèrent.</desc>
