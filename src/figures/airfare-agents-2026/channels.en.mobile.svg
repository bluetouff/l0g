<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 800" role="img" aria-labelledby="af-channels-en-m-title af-channels-en-m-desc" style="width:100%;height:auto" class="l0g-airfare-agents-svg">
<title id="af-channels-en-m-title">Four routes to the ticket</title><desc id="af-channels-en-m-desc">Four separate mechanisms: computing costs, a biased demand signal, seat holds and better comparison. Evidence levels differ.</desc>
<rect id="af-channels-en-m-frame" stroke="var(--color-line-strong)" stroke-width="1" x="0" y="0" width="420" height="800" rx="16" fill="var(--color-ink)"/>
<text data-panel="af-channels-en-m-frame" x="22" y="38" font-family="l0g Airfare Agents" font-size="19" font-weight="400" text-anchor="start" fill="var(--color-signal)">l0g / AIRFARES &amp; AI AGENTS</text>
<text data-panel="af-channels-en-m-frame" x="22" y="82" font-family="l0g Airfare Agents" font-size="28" font-weight="700" text-anchor="start" fill="var(--color-paper)">Four routes</text>
<text data-panel="af-channels-en-m-frame" x="22" y="116" font-family="l0g Airfare Agents" font-size="28" font-weight="700" text-anchor="start" fill="var(--color-paper)">to the ticket</text>
<text data-panel="af-channels-en-m-frame" x="22" y="148" font-family="l0g Airfare Agents" font-size="19" font-weight="400" text-anchor="start" fill="var(--color-amber)">Mechanisms and evidence levels</text>
<rect id="af-channels-en-m-channel-0" stroke="var(--color-line-strong)" stroke-width="1" x="22" y="164" width="376" height="126" rx="12" fill="var(--color-surface)"/>
<text data-panel="af-channels-en-m-channel-0" x="40" y="195" font-family="l0g Airfare Agents" font-size="23" font-weight="700" text-anchor="start" fill="var(--color-signal)">Searches</text>
<text data-panel="af-channels-en-m-channel-0" x="40" y="225" font-family="l0g Airfare Agents" font-size="19" font-weight="400" text-anchor="start" fill="var(--color-paper)">→ Computing work</text>
<text data-panel="af-channels-en-m-channel-0" x="40" y="254" font-family="l0g Airfare Agents" font-size="19" font-weight="400" text-anchor="start" fill="var(--color-paper)">Cost, cache, quotas</text>
<text data-panel="af-channels-en-m-channel-0" x="40" y="280" font-family="l0g Airfare Agents" font-size="18.5" font-weight="400" text-anchor="start" fill="var(--color-muted)">Documented channel [08, 09]</text>
<rect id="af-channels-en-m-channel-1" stroke="var(--color-line-strong)" stroke-width="1" x="22" y="307" width="376" height="126" rx="12" fill="var(--color-surface)"/>
<text data-panel="af-channels-en-m-channel-1" x="40" y="338" font-family="l0g Airfare Agents" font-size="23" font-weight="700" text-anchor="start" fill="var(--color-amber)">Biased signal</text>
<text data-panel="af-channels-en-m-channel-1" x="40" y="368" font-family="l0g Airfare Agents" font-size="19" font-weight="400" text-anchor="start" fill="var(--color-paper)">→ Forecasts / offers adjusted</text>
<text data-panel="af-channels-en-m-channel-1" x="40" y="397" font-family="l0g Airfare Agents" font-size="19" font-weight="400" text-anchor="start" fill="var(--color-paper)">Conditional transmission</text>
<text data-panel="af-channels-en-m-channel-1" x="40" y="423" font-family="l0g Airfare Agents" font-size="18.5" font-weight="400" text-anchor="start" fill="var(--color-muted)">l0g hypothesis [04, 05]</text>
<rect id="af-channels-en-m-channel-2" stroke="var(--color-line-strong)" stroke-width="1" x="22" y="450" width="376" height="126" rx="12" fill="var(--color-surface)"/>
<text data-panel="af-channels-en-m-channel-2" x="40" y="481" font-family="l0g Airfare Agents" font-size="23" font-weight="700" text-anchor="start" fill="var(--color-accent)">Seat holds</text>
<text data-panel="af-channels-en-m-channel-2" x="40" y="511" font-family="l0g Airfare Agents" font-size="19" font-weight="400" text-anchor="start" fill="var(--color-paper)">→ Unavailable seats</text>
<text data-panel="af-channels-en-m-channel-2" x="40" y="540" font-family="l0g Airfare Agents" font-size="19" font-weight="400" text-anchor="start" fill="var(--color-paper)">Reduced availability</text>
<text data-panel="af-channels-en-m-channel-2" x="40" y="566" font-family="l0g Airfare Agents" font-size="18.5" font-weight="400" text-anchor="start" fill="var(--color-muted)">Generic threat [10]</text>
<rect id="af-channels-en-m-channel-3" stroke="var(--color-line-strong)" stroke-width="1" x="22" y="593" width="376" height="126" rx="12" fill="var(--color-surface)"/>
<text data-panel="af-channels-en-m-channel-3" x="40" y="624" font-family="l0g Airfare Agents" font-size="23" font-weight="700" text-anchor="start" fill="var(--color-signal)">Comparison</text>
<text data-panel="af-channels-en-m-channel-3" x="40" y="654" font-family="l0g Airfare Agents" font-size="19" font-weight="400" text-anchor="start" fill="var(--color-paper)">→ More visible alternatives</text>
<text data-panel="af-channels-en-m-channel-3" x="40" y="683" font-family="l0g Airfare Agents" font-size="19" font-weight="400" text-anchor="start" fill="var(--color-paper)">Stronger competition</text>
<text data-panel="af-channels-en-m-channel-3" x="40" y="709" font-family="l0g Airfare Agents" font-size="18.5" font-weight="400" text-anchor="start" fill="var(--color-muted)">Proposed counter-mechanism</text>
<path data-connector="footer" d="M22 747 H398" fill="none" stroke="var(--color-line-strong)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text data-panel="af-channels-en-m-frame" x="22" y="780" font-family="l0g Airfare Agents" font-size="19" font-weight="400" text-anchor="start" fill="var(--color-muted)">l0g · no quantified net effect</text>
</svg>
