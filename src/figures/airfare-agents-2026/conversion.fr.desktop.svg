<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="af-conversion-fr-d-title af-conversion-fr-d-desc" style="width:100%;height:auto" class="l0g-airfare-agents-svg">
<title id="af-conversion-fr-d-title">Un voyageur, plusieurs compteurs</title><desc id="af-conversion-fr-d-desc">Une même cohorte synthétique de1000intentions et100réservations. Dix ou mille requêtes par intention changent le taux de conversion calculé par requête.</desc>
<rect id="af-conversion-fr-d-frame" stroke="var(--color-line-strong)" stroke-width="1" x="0" y="0" width="1000" height="650" rx="16" fill="var(--color-ink)"/>
<text data-panel="af-conversion-fr-d-frame" x="32" y="42" font-family="l0g Airfare Agents" font-size="24" font-weight="400" text-anchor="start" fill="var(--color-signal)">l0g / VOLS ET AGENTS IA</text>
<text data-panel="af-conversion-fr-d-frame" x="32" y="94" font-family="l0g Airfare Agents" font-size="36" font-weight="700" text-anchor="start" fill="var(--color-paper)">Un voyageur, plusieurs compteurs</text>
<text data-panel="af-conversion-fr-d-frame" x="32" y="131" font-family="l0g Airfare Agents" font-size="24" font-weight="400" text-anchor="start" fill="var(--color-amber)">Cohorte synthétique</text>
<rect id="af-conversion-fr-d-cohort" x="32" y="162" width="936" height="76" rx="12" fill="var(--color-surface-2)"/>
<text data-panel="af-conversion-fr-d-cohort" data-metric="intentions" data-value="1000" x="54" y="209" font-family="l0g Airfare Agents" font-size="28" font-weight="700" text-anchor="start" fill="var(--color-paper)">1 000 intentions de voyage</text>
<text data-panel="af-conversion-fr-d-cohort" data-metric="bookings" data-value="100" x="946" y="209" font-family="l0g Airfare Agents" font-size="28" font-weight="700" text-anchor="end" fill="var(--color-signal)">100 réservations</text>
<rect id="af-conversion-fr-d-case-0" stroke="var(--color-line-strong)" stroke-width="1" x="32" y="269" width="448" height="230" rx="12" fill="var(--color-surface)"/>
<text data-panel="af-conversion-fr-d-case-0" x="56" y="310" font-family="l0g Airfare Agents" font-size="24" font-weight="700" text-anchor="start" fill="var(--color-signal)">EXPLORATION LIMITÉE</text>
<text data-panel="af-conversion-fr-d-case-0" data-metric="requests-per-intention" data-value="10" x="56" y="358" font-family="l0g Airfare Agents" font-size="25" font-weight="400" text-anchor="start" fill="var(--color-paper)">10 requêtes / projet</text>
<text data-panel="af-conversion-fr-d-case-0" data-metric="total-requests" data-value="10000" x="56" y="412" font-family="l0g Airfare Agents" font-size="38" font-weight="700" text-anchor="start" fill="var(--color-paper)">10 000</text>
<text data-panel="af-conversion-fr-d-case-0" data-metric="request-conversion" data-value="1" x="56" y="468" font-family="l0g Airfare Agents" font-size="27" font-weight="700" text-anchor="start" fill="var(--color-signal)">Conversion : 1 %</text>
<rect id="af-conversion-fr-d-case-1" stroke="var(--color-line-strong)" stroke-width="1" x="520" y="269" width="448" height="230" rx="12" fill="var(--color-surface)"/>
<text data-panel="af-conversion-fr-d-case-1" x="544" y="310" font-family="l0g Airfare Agents" font-size="24" font-weight="700" text-anchor="start" fill="var(--color-amber)">EXPLORATION INTENSIVE</text>
<text data-panel="af-conversion-fr-d-case-1" data-metric="requests-per-intention" data-value="1000" x="544" y="358" font-family="l0g Airfare Agents" font-size="25" font-weight="400" text-anchor="start" fill="var(--color-paper)">1 000 requêtes / projet</text>
<text data-panel="af-conversion-fr-d-case-1" data-metric="total-requests" data-value="1000000" x="544" y="412" font-family="l0g Airfare Agents" font-size="38" font-weight="700" text-anchor="start" fill="var(--color-paper)">1 000 000</text>
<text data-panel="af-conversion-fr-d-case-1" data-metric="request-conversion" data-value="0.01" x="544" y="468" font-family="l0g Airfare Agents" font-size="27" font-weight="700" text-anchor="start" fill="var(--color-amber)">Conversion : 0,01 %</text>
<rect id="af-conversion-fr-d-intent-conversion" x="32" y="530" width="936" height="61" rx="12" fill="var(--color-surface-2)"/>
<text data-panel="af-conversion-fr-d-intent-conversion" data-metric="intention-conversion" data-value="10" x="52" y="571" font-family="l0g Airfare Agents" font-size="28" font-weight="700" text-anchor="start" fill="var(--color-signal)">Intentions → réservations : 100 / 1 000 = 10 %</text>
<path data-connector="footer" d="M22 597 H978" fill="none" stroke="var(--color-line-strong)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text data-panel="af-conversion-fr-d-frame" x="22" y="630" font-family="l0g Airfare Agents" font-size="24" font-weight="400" text-anchor="start" fill="var(--color-muted)">Calcul l0g · données hypothétiques</text>
</svg>
