<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 572 238" width="100%" height="auto" style="width:100%;height:auto" role="img" aria-labelledby="trump-custody-fr-custody-wide-title trump-custody-fr-custody-wide-desc" xml:lang="fr">
<title id="trump-custody-fr-custody-wide-title">Recettes vénézuéliennes sous garde</title>
<desc id="trump-custody-fr-custody-wide-desc">Les acheteurs visés versent leurs paiements au compte de garde prévu par les licences OFAC. Les recettes restent la propriété du Venezuela. La banque centrale soumet des demandes de décaissement, le département d’État donne les instructions et le Trésor les exécute. Les fonds servent aux opérations de change avec des banques commerciales ou au règlement de fournisseurs autorisés.</desc>
