<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 342 314" width="100%" height="auto" style="width:100%;height:auto" role="img" aria-labelledby="trump-custody-en-custody-mobile-title trump-custody-en-custody-mobile-desc" xml:lang="en">
<title id="trump-custody-en-custody-mobile-title">Venezuelan revenue in custody</title>
<desc id="trump-custody-en-custody-mobile-desc">Buyers subject to OFAC license requirements pay into the custody account. Venezuela retains ownership. Its central bank submits disbursement requests, the State Department issues instructions, and Treasury carries them out. Funds go toward foreign exchange operations with commercial banks or to approved vendors.</desc>
