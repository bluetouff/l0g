<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 572 216" width="100%" height="auto" style="width:100%;height:auto" role="img" aria-labelledby="trump-custody-fr-parks-wide-title trump-custody-fr-parks-wide-desc" xml:lang="fr">
<title id="trump-custody-fr-parks-wide-title">Les dons au réseau des parcs</title>
<desc id="trump-custody-fr-parks-wide-desc">Les dons acceptés alimentent le compte fédéral de donations du National Park Service, 014-8037. Une autorisation budgétaire permanente permet d’utiliser ces fonds pour des missions admissibles du réseau des parcs, selon les conditions des dons. Les droits d’entrée relèvent d’un régime distinct.</desc>
