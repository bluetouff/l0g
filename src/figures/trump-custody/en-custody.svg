<text x="16" y="30" font-size="17" fill="var(--color-paper)" text-anchor="start" font-weight="500">Venezuelan revenue in custody</text>
<text x="16" y="49" font-size="12" fill="var(--color-muted)" text-anchor="start" font-weight="400">Executive Order 14373 · U.S. custody · 2026</text>
