<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 572 266" width="100%" height="auto" style="width:100%;height:auto" role="img" aria-labelledby="trump-custody-fr-ledger-wide-title trump-custody-fr-ledger-wide-desc" xml:lang="fr">
<title id="trump-custody-fr-ledger-wide-title">Rapprochement du compte de garde</title>
<desc id="trump-custody-fr-ledger-wide-desc">Dépôts : 12 263,715 millions, moins 12 107,622 millions de décaissements, plus 12,515 millions d’intérêts, moins 0,050 million encore au Qatar. Le solde du compte de garde actif est de 168,558 millions de dollars fin septembre 2026. Montants arrondis au millier.</desc>
<rect x="0.5" y="0.5" width="571" height="265" rx="9" fill="var(--color-ink)" fill-opacity="1" stroke="var(--color-line)"/>
<text x="16" y="30" font-size="17" fill="var(--color-paper)" text-anchor="start" font-weight="500">Rapprochement du compte de garde</text>
<text x="16" y="49" font-size="12" fill="var(--color-muted)" text-anchor="start" font-weight="400">Millions de dollars US · au 30 septembre 2026</text>
<path d="M16 61H556" fill="none" stroke="var(--color-line)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="16" y="82" font-size="12" fill="var(--color-muted)" text-anchor="start" font-weight="400">Flux cumulés · janvier à septembre</text>
<path d="M16 166H556" fill="none" stroke="var(--color-line)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="16" y="188" font-size="12" fill="var(--color-muted)" text-anchor="start" font-weight="400">Soldes · fin septembre</text>
<rect x="16.5" y="221.5" width="539" height="29" rx="4" fill="var(--color-signal)" fill-opacity="0.08" stroke="var(--color-line)"/>
<text x="26" y="108" font-size="14" fill="var(--color-paper)" text-anchor="middle" font-weight="400">+</text>
<text x="43" y="108" font-size="13" fill="var(--color-paper)" text-anchor="start" font-weight="400">Dépôts cumulés</text>
<text x="548" y="108" font-size="13" fill="var(--color-paper)" text-anchor="end" font-weight="400">12 263,715</text>
<text x="26" y="132" font-size="14" fill="var(--color-paper)" text-anchor="middle" font-weight="400">−</text>
<text x="43" y="132" font-size="13" fill="var(--color-paper)" text-anchor="start" font-weight="400">Décaissements cumulés</text>
<text x="548" y="132" font-size="13" fill="var(--color-paper)" text-anchor="end" font-weight="400">12 107,622</text>
<text x="26" y="156" font-size="14" fill="var(--color-paper)" text-anchor="middle" font-weight="400">+</text>
<text x="43" y="156" font-size="13" fill="var(--color-paper)" text-anchor="start" font-weight="400">Intérêts de réinvestissement</text>
<text x="548" y="156" font-size="13" fill="var(--color-paper)" text-anchor="end" font-weight="400">12,515</text>
<text x="26" y="211" font-size="14" fill="var(--color-paper)" text-anchor="middle" font-weight="400">−</text>
<text x="43" y="211" font-size="13" fill="var(--color-paper)" text-anchor="start" font-weight="400">Reliquat laissé au Qatar</text>
<text x="548" y="211" font-size="13" fill="var(--color-paper)" text-anchor="end" font-weight="400">0,050</text>
<text x="26" y="241" font-size="14" fill="var(--color-signal)" text-anchor="middle" font-weight="500">=</text>
<text x="43" y="241" font-size="13" fill="var(--color-signal)" text-anchor="start" font-weight="500">Solde du compte actif</text>
<text x="548" y="241" font-size="14" fill="var(--color-signal)" text-anchor="end" font-weight="500">168,558</text>
</svg>
