<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" role="img" aria-labelledby="ai-creditors-fr-scope-d-title ai-creditors-fr-scope-d-desc" font-family="Inter Variable, Inter, sans-serif" font-weight="400" style="width:100%;height:auto" class="ai-creditors-opening-svg">
  <title id="ai-creditors-fr-scope-d-title">Le périmètre sectoriel des 62 milliards d’euros de la BCE</title>
  <desc id="ai-creditors-fr-scope-d-desc">La BCE estime à environ 62 milliards d’euros les prêts des banques de la zone euro à des entreprises de secteurs associés à l’IA, sur données du deuxième trimestre 2026. Les secteurs retenus comprennent les centres de données, les semi-conducteurs et les logiciels. Les prêts indirects, dont ceux via des SPV, et certains centres de données classés dans l’immobilier sont exclus. Cet indicateur sectoriel n’est ni un total de l’exposition à l’IA ni un plancher. Les zones du schéma n’indiquent aucune proportion. Source : note BCE du 9 novembre 2026, note 8.</desc>
  <text x="20" y="48" font-size="15.2" font-weight="500" text-anchor="start" fill="var(--color-muted)">ESTIMATION BCE</text>
  <text x="20" y="104" font-size="22.8" font-weight="400" text-anchor="start" fill="var(--color-signal)" data-metric="sector-estimate-eur-bn" data-value="62">62 Md€</text>
  <text x="20" y="137" font-size="17" font-weight="400" text-anchor="start" fill="var(--color-paper)">Au T2 2026</text>
  <text x="20" y="169" font-size="15.2" font-weight="400" text-anchor="start" fill="var(--color-muted)">Banques de la zone euro</text>
  <line x1="247" y1="28" x2="247" y2="193" stroke="var(--color-line-strong)" stroke-width="1" />
  <text x="274" y="48" font-size="17" font-weight="500" text-anchor="start" fill="var(--color-paper)">Secteurs retenus</text>
