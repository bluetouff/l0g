  <text x="311" y="180" font-size="15.5" font-weight="400" text-anchor="start" fill="var(--color-paper)">Logiciels</text>
  <line x1="509" y1="28" x2="509" y2="193" stroke="var(--color-line-strong)" stroke-width="1" />
  <text x="533" y="48" font-size="17" font-weight="500" text-anchor="start" fill="var(--color-amber)">Hors mesure</text>
  <g data-icon="spv" transform="translate(545 89) scale(0.88)" fill="none" stroke="var(--color-muted)" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><circle cx="-8" cy="7" r="3" /><circle cx="0" cy="-8" r="3" /><circle cx="9" cy="7" r="3" /><path d="m-6.5 4.3 5-9.5M1.6-5.3l5.8 9.6M-5 7H6" /></g>
