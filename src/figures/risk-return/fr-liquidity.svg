<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 572 277" width="100%" height="auto" style="width:100%;height:auto" role="img" aria-labelledby="risk-return-fr-liquidity-wide-title risk-return-fr-liquidity-wide-desc" xml:lang="fr">
<title id="risk-return-fr-liquidity-wide-title">Deux lignes de crédit sous pression</title>
<desc id="risk-return-fr-liquidity-wide-desc">L’entreprise peut tirer sur sa ligne de trésorerie auprès de la banque A. Un fonds de crédit confronté à un besoin de liquidités peut mobiliser sa propre facilité auprès de la banque B. Les deux tirages augmentent les besoins de trésorerie des prêteurs.</desc>
