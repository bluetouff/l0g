<title id="risk-return-en-liquidity-narrow-title">Two credit lines come under pressure</title>
<desc id="risk-return-en-liquidity-narrow-desc">The company can draw on its credit line with Bank A. A credit fund in need of cash can draw on its own line with Bank B. Both draws increase the lending banks’ cash needs.</desc>
