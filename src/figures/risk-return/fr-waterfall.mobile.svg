<title id="risk-return-fr-waterfall-narrow-title">Quand la perte atteint le prêteur</title>
<desc id="risk-return-fr-waterfall-narrow-desc">Dans cet exemple fictif, un fonds investit 8 millions d’euros dans une tranche, financée par 4 millions d’apport et 4 millions de dette. Après 4 millions de pertes, les 4 millions restants reviennent à la banque. Après 6 millions de pertes, il reste 2 millions à la banque, qui perd 2 millions lors de la liquidation supposée.</desc>
