<text x="22" y="29" text-anchor="start" font-size="18" fill="var(--color-paper)">Quand la perte atteint le prêteur</text>
<text x="22" y="47" text-anchor="start" font-size="12" fill="var(--color-muted)">Exemple fictif · placement initial de 8 M€</text>
