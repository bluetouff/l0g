<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 265" width="100%" height="auto" style="width:100%;height:auto" role="img" aria-labelledby="risk-return-en-waterfall-narrow-title risk-return-en-waterfall-narrow-desc" xml:lang="en">
<title id="risk-return-en-waterfall-narrow-title">When losses reach the fund’s lender</title>
<desc id="risk-return-en-waterfall-narrow-desc">In this example a fund invests €8 million in a tranche, financed with €4 million of equity and €4 million of debt. After €4 million in losses the bank gets the remaining €4 million. After €6 million in losses the bank gets €2 million and loses €2 million on the assumed liquidation.</desc>
<rect x=".5" y=".5" width="319" height="264" rx="9" fill="var(--color-ink)" stroke="var(--color-line)"/>
<text x="15" y="29" text-anchor="start" font-size="16" fill="var(--color-paper)">When losses reach the fund’s lender</text>
<text x="15" y="47" text-anchor="start" font-size="12" fill="var(--color-muted)">Illustrative example · €8m initial investment</text>
<path d="M15 59H305" fill="none" stroke="var(--color-line)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
<defs><pattern id="risk-return-en-waterfall-narrow-lost" width="5" height="5" patternUnits="userSpaceOnUse"><path d="M0 5 5 0" fill="none" stroke="var(--color-muted)" stroke-opacity=".34" stroke-width=".75"/></pattern></defs>
<text x="17" y="81" text-anchor="start" font-size="11.5" fill="var(--color-muted)">Loss on the</text>
<text x="17" y="97" text-anchor="start" font-size="11.5" fill="var(--color-muted)">tranche</text>
<text x="158.0" y="90" text-anchor="middle" font-size="12" fill="var(--color-muted)">Tranche value (€m)</text>
<text x="271" y="81" text-anchor="middle" font-size="11.5" fill="var(--color-muted)">Bank</text>
<text x="271" y="97" text-anchor="middle" font-size="11.5" fill="var(--color-muted)">loss</text>
<text x="17" y="124" text-anchor="start" font-size="13" fill="var(--color-paper)">€0m</text>
