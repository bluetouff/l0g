<text x="118.2" y="124" text-anchor="middle" font-size="13" fill="var(--color-topic-blue)">4</text>
<rect x="158.0" y="109" width="76.4" height="22" rx="2" fill="var(--color-signal)" fill-opacity=".12" stroke="var(--color-signal)" stroke-width=".75"/>
<text x="196.2" y="124" text-anchor="middle" font-size="13" fill="var(--color-signal)">4</text>
