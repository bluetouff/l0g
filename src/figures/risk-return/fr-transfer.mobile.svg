<text x="265" y="126" text-anchor="middle" font-size="11.5" fill="var(--color-muted)">Protège 8 M€</text>
<text x="160" y="80" text-anchor="middle" font-size="11.5" fill="var(--color-topic-blue)">Prime</text>
