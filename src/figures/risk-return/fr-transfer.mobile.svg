<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 264" width="100%" height="auto" style="width:100%;height:auto" role="img" aria-labelledby="risk-return-fr-transfer-narrow-title risk-return-fr-transfer-narrow-desc" xml:lang="fr">
<title id="risk-return-fr-transfer-narrow-title">Les pertes se répartissent par tranche</title>
<desc id="risk-return-fr-transfer-narrow-desc">Dans cet exemple fictif, la banque conserve les prêts et paie une prime au fonds. Sur 6 millions d’euros de pertes, la banque prend les 2 premiers et le fonds les 4 suivants. Sur 15 millions, le fonds prend 8 millions et la banque 7, dont les 5 au-delà de la protection.</desc>
