<svg xmlns="http://www.w3.org/2000/svg" id="sfi-limits-en-d-0" width="100%" height="auto" viewBox="0 0 1200 690" role="img" aria-labelledby="sfi-limits-en-d-1 sfi-limits-en-d-3" style="width:100%;height:auto" font-family="Inter Variable, Inter, sans-serif" font-weight="400" xml:lang="en">
  <title id="sfi-limits-en-d-1">How far compensation can reach</title>
  <desc id="sfi-limits-en-d-3">Three bars with a common zero origin and scale show the maximum CLC liability schedule, SDR 89.77 million, CLC plus the 1992 Fund, SDR 203 million, and the combined total including the Supplementary Fund, SDR 750 million. The CLC limit depends on gross tonnage. Admissibility and exclusions, including war and hostilities, are considered before these ceilings. For admissible damage within their territories, Oman is a 1992 Fund member and France is also a Supplementary Fund member. These values are neither assessed losses nor payments for Caroline Bezengi.</desc>
  <metadata>{"publisher": "l0g", "license": "CC-BY-4.0", "cutoff": "2026-11-19", "language": "en", "chart": "plafonds", "unit": "Million Special Drawing Rights (SDR); cumulative statutory compensation limits per incident", "period": "Current limits and country status checked2026-11-19", "limits": "CLC89.77 is the maximum of a gross-tonnage-based scale, not every ship limit.203 includes CLC payments;750 includes CLC and1992Fund. Common zero and linear scale. Territory and admissibility apply. No valuation or available compensation for CarolineBezengi.", "sources": [{"id": "S05", "url": "https://documentservices.iopcfunds.org/download/85381/en/IOPC-OCT26-11-2_en.pdf"}, {"id": "S08", "url": "https://iopcfunds.org/wp-content/uploads/2018/06/Text-of-Conventions_e.pdf"}, {"id": "S10", "url": "https://iopcfunds.org/wp-content/uploads/2021/11/ITOPF-IG-IOPC-Compensation-booklet_e.pdf"}, {"id": "S11", "url": "https://documentservices.iopcfunds.org/wp-content/uploads/sites/2/2026/01/2026-1_ratifications_e.pdf"}, {"id": "S25", "url": "https://iopcfunds.org/about-us/legal-framework/1992-fund-convention-supplementary-fund-protocol/"}]}</metadata>
