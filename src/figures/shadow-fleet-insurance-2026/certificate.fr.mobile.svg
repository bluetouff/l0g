<svg xmlns="http://www.w3.org/2000/svg" id="sfi-certificate-fr-m-0" width="100%" height="auto" viewBox="0 0 600 816" role="img" aria-labelledby="sfi-certificate-fr-m-1 sfi-certificate-fr-m-3" style="width:100%;height:auto" font-family="Inter Variable, Inter, sans-serif" font-weight="400" xml:lang="fr">
  <title id="sfi-certificate-fr-m-1">Du certificat à l’indemnisation</title>
  <desc id="sfi-certificate-fr-m-3">Avant un sinistre, l’assureur fournit une Blue Card, l’État compétent délivre un certificat CLC et le navire le présente aux contrôles. Après le sinistre, les victimes peuvent agir directement contre l’assureur ou le garant. La garantie dépend de la cause, du territoire et des dommages recevables. Le schéma distingue certification et indemnisation.</desc>
  <metadata>{"publisher": "l0g", "license": "CC-BY-4.0", "cutoff": "2026-11-19", "language": "fr", "chart": "certificat", "unit": "Qualitative certification and direct-action pathways; unscaled arrows", "period": "Convention framework and public administrative guidance checked2026-11-19", "limits": "Illustrative legal mechanism, not the certificate or policy of a named ship. A state certificate is distinct from a state guarantee to pay. Direct action and compensation remain subject to treaty scope and admissibility.", "sources": [{"id": "S08", "url": "https://iopcfunds.org/wp-content/uploads/2018/06/Text-of-Conventions_e.pdf"}, {"id": "S13", "url": "https://www.dma.dk/ship-survey-and-registration/apply-for-a-certificate"}]}</metadata>
