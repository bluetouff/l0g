<text data-panel="small-parcels-fr-logistics-d-card-1-2" x="708" y="501" fill="var(--color-paper)" font-family="l0g Small Parcels" font-size="23" font-weight="700" text-anchor="start">Commande client</text>
<text data-panel="small-parcels-fr-logistics-d-card-1-2" x="708" y="535" fill="var(--color-muted)" font-family="l0g Small Parcels" font-size="22" font-weight="400" text-anchor="start">Vente depuis le stock</text>
