<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="small-parcels-fr-logistics-d-title small-parcels-fr-logistics-d-desc" viewBox="0 0 1000 680" style="width:100%;height:auto" class="l0g-small-parcels-svg">
<title id="small-parcels-fr-logistics-d-title">La vente précède ou suit l’importation</title>
<desc id="small-parcels-fr-logistics-d-desc">Un achat conclu avant l’importation et une vente depuis un stock déjà dédouané suivent deux séquences différentes. Le passage par un entrepôt européen se lit avec cette chronologie. Schéma qualitatif simplifié. En haut, la vente au consommateur précède l’importation : un hub ou un entrepôt intermédiaire ne change pas automatiquement son caractère de vente à distance importée. En bas, des marchandises sont importées en gros et mises en libre pratique avant la vente au consommateur : le régime ordinaire d’importation et les coûts du stock s’appliquent. Les droits ordinaires dépendent du produit, de son origine et du régime ; la TVA suit ses règles propres. Les flèches ne mesurent aucun volume. La figure ne suggère aucune garantie d’exonération ni classement automatique.</desc>
<rect id="small-parcels-fr-logistics-d-frame" x="0" y="0" width="1000" height="680" fill="var(--color-ink)"/>
<text data-panel="small-parcels-fr-logistics-d-frame" x="40" y="40" fill="var(--color-signal)" font-family="l0g Small Parcels" font-size="22" font-weight="700" text-anchor="start">l0g / COLIS</text>
<text data-panel="small-parcels-fr-logistics-d-frame" x="960" y="40" fill="var(--color-muted)" font-family="l0g Small Parcels" font-size="22" font-weight="400" text-anchor="end">04 / 05</text>
<text data-panel="small-parcels-fr-logistics-d-frame" x="40" y="93" fill="var(--color-paper)" font-family="l0g Small Parcels" font-size="34" font-weight="700" text-anchor="start">La vente précède ou suit l’importation</text>
<text data-panel="small-parcels-fr-logistics-d-frame" x="40" y="137" fill="var(--color-muted)" font-family="l0g Small Parcels" font-size="22" font-weight="400" text-anchor="start">Deux séquences · flèches qualitatives</text>
<text data-panel="small-parcels-fr-logistics-d-frame" x="40" y="179" fill="var(--color-signal)" font-family="l0g Small Parcels" font-size="23" font-weight="700" text-anchor="start">COMMANDE AVANT IMPORTATION</text>
