<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="small-parcels-fr-incidence-d-title small-parcels-fr-incidence-d-desc" viewBox="0 0 1000 680" style="width:100%;height:auto" class="l0g-small-parcels-svg">
<title id="small-parcels-fr-incidence-d-title">Répartir les quatre euros de frais</title>
<desc id="small-parcels-fr-incidence-d-desc">Scénario choisi : deux lignes, 4 € de nouveaux frais, moitié répercutée. Avec une TVA supposée de 20 % collectée à la vente, le panier passe de 24 € à 26,40 € TTC. Simulation de transmission du seul supplément de novembre : F = 2 € × n, n = 2 lignes supposées admissibles. Prix initial HT = 20 €, transmission t = 50 %, TVA supposée = 20 %. Prix final TTC = (20 + F × t) × 1,20 = 26,40 €. Part client HT = 2 €, part absorbée = 2 €, TVA supplémentaire = 0,40 €. La barre partage F hors TVA ; la TVA est dessinée séparément. Les droits antérieurs de 3 € et les autres coûts sont supposés intégrés au prix initial et constants. Illustration avec TVA collectée à la vente lorsque la refacturation entre dans sa base. Aucune admissibilité IOSS, valeur intrinsèque ou classification n’est déterminée ; les autres régimes de TVA à l’importation ne sont pas simulés. Aucun taux de transmission observé n’est avancé.</desc>
<rect id="small-parcels-fr-incidence-d-frame" x="0" y="0" width="1000" height="680" fill="var(--color-ink)"/>
<text data-panel="small-parcels-fr-incidence-d-frame" x="40" y="40" fill="var(--color-signal)" font-family="l0g Small Parcels" font-size="22" font-weight="700" text-anchor="start">l0g / COLIS</text>
<text data-panel="small-parcels-fr-incidence-d-frame" x="960" y="40" fill="var(--color-muted)" font-family="l0g Small Parcels" font-size="22" font-weight="400" text-anchor="end">05 / 05</text>
<text data-panel="small-parcels-fr-incidence-d-frame" x="40" y="93" fill="var(--color-paper)" font-family="l0g Small Parcels" font-size="34" font-weight="700" text-anchor="start">Répartir les quatre euros de frais</text>
<text data-panel="small-parcels-fr-incidence-d-frame" x="40" y="137" fill="var(--color-muted)" font-family="l0g Small Parcels" font-size="22" font-weight="400" text-anchor="start">Exemple fictif · prix initial 20 € HT · TVA 20 %</text>
<text data-panel="small-parcels-fr-incidence-d-frame" x="40" y="195" fill="var(--color-paper)" font-family="l0g Small Parcels" font-size="27" font-weight="700" text-anchor="start">4 € de frais à partager</text>
<text data-panel="small-parcels-fr-incidence-d-frame" x="960" y="195" fill="var(--color-muted)" font-family="l0g Small Parcels" font-size="22" font-weight="400" text-anchor="end">2 lignes · 50 % répercutés</text>
