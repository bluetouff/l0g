<rect data-metric="absorbed" data-value="2" x="500" y="245" width="400" height="50" fill="var(--color-amber)"/>
<text data-panel="small-parcels-fr-incidence-d-frame" x="100" y="343" fill="var(--color-signal)" font-family="l0g Small Parcels" font-size="26" font-weight="700" text-anchor="start">2 € · client HT</text>
<text data-panel="small-parcels-fr-incidence-d-frame" x="900" y="343" fill="var(--color-amber)" font-family="l0g Small Parcels" font-size="26" font-weight="700" text-anchor="end">2 € · absorbés</text>
<text data-panel="small-parcels-fr-incidence-d-frame" x="500" y="414" fill="var(--color-accent)" font-family="l0g Small Parcels" font-size="26" font-weight="700" text-anchor="middle">TVA : 2 € × 20 % = 0,40 €</text>
<text data-panel="small-parcels-fr-incidence-d-frame" x="170" y="513" fill="var(--color-paper)" font-family="l0g Small Parcels" font-size="32" font-weight="700" text-anchor="middle">24 € TTC</text>
<line x1="320" y1="500" x2="635" y2="500" stroke="var(--color-signal)" stroke-width="3"/>
<path d="M 626 494 L 635 500 L 626 506" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
