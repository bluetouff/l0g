<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="small-parcels-fr-timeline-m-title small-parcels-fr-timeline-m-desc" viewBox="0 0 420 820" style="width:100%;height:auto" class="l0g-small-parcels-svg">
<title id="small-parcels-fr-timeline-m-title">Trois dates, deux frais européens</title>
<desc id="small-parcels-fr-timeline-m-desc">La taxe française de mars s’arrête en juillet. Dans le circuit admissible au forfait, le droit européen de 3 € est rejoint par les frais de 2 € le 1er novembre 2026. Chronologie schématique, espacements sans échelle de durée. La taxe française est abrogée avec effet au 1er juillet par le décret 2026-589. Le forfait européen de 3 € vise les ventes à distance importées en envois d’une valeur intrinsèque ≤ 150 €, dans le circuit admissible. Les frais européens de 2 € concernent les ventes à distance importées, sans ce plafond. Total illustré : 5 € par ligne soumise aux deux mesures, avant effets de TVA et frais privés. Situation documentaire au 30 octobre 2026 : les frais de novembre sont adoptés, leur application est future.</desc>
<rect id="small-parcels-fr-timeline-m-frame" x="0" y="0" width="420" height="820" fill="var(--color-ink)"/>
<text data-panel="small-parcels-fr-timeline-m-frame" x="28" y="34" fill="var(--color-signal)" font-family="l0g Small Parcels" font-size="17" font-weight="700" text-anchor="start">l0g / COLIS</text>
<text data-panel="small-parcels-fr-timeline-m-frame" x="392" y="34" fill="var(--color-muted)" font-family="l0g Small Parcels" font-size="17" font-weight="400" text-anchor="end">01 / 05</text>
<text data-panel="small-parcels-fr-timeline-m-frame" x="28" y="81" fill="var(--color-paper)" font-family="l0g Small Parcels" font-size="25" font-weight="700" text-anchor="start">Le calendrier des frais</text>
<text data-panel="small-parcels-fr-timeline-m-frame" x="28" y="117" fill="var(--color-muted)" font-family="l0g Small Parcels" font-size="17" font-weight="400" text-anchor="start">2026 · montants par ligne assujettie</text>
<rect id="small-parcels-fr-timeline-m-card-0" x="28" y="170" width="364" height="125" fill="var(--color-surface)"/>
<text data-panel="small-parcels-fr-timeline-m-card-0" x="44" y="199" fill="var(--color-muted)" font-family="l0g Small Parcels" font-size="17" font-weight="700" text-anchor="start">1er MARS 2026</text>
<text data-panel="small-parcels-fr-timeline-m-card-0" x="44" y="230" fill="var(--color-paper)" font-family="l0g Small Parcels" font-size="21" font-weight="700" text-anchor="start">Taxe française</text>
<text data-panel="small-parcels-fr-timeline-m-card-0" x="376" y="232" fill="var(--color-accent)" font-family="l0g Small Parcels" font-size="31" font-weight="700" text-anchor="end">2 €</text>
<text data-panel="small-parcels-fr-timeline-m-card-0" x="44" y="264" fill="var(--color-muted)" font-family="l0g Small Parcels" font-size="17" font-weight="400" text-anchor="start">Abrogée au 1er juillet</text>
<line x1="210" y1="298" x2="210" y2="309" stroke="var(--color-signal)" stroke-width="3"/>
<path d="M 204 300 L 210 309 L 216 300" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect id="small-parcels-fr-timeline-m-card-1" x="28" y="315" width="364" height="125" fill="var(--color-surface)"/>
<text data-panel="small-parcels-fr-timeline-m-card-1" x="44" y="344" fill="var(--color-muted)" font-family="l0g Small Parcels" font-size="17" font-weight="700" text-anchor="start">1er JUILLET 2026</text>
<text data-panel="small-parcels-fr-timeline-m-card-1" x="44" y="375" fill="var(--color-paper)" font-family="l0g Small Parcels" font-size="21" font-weight="700" text-anchor="start">Droit européen</text>
<text data-panel="small-parcels-fr-timeline-m-card-1" x="376" y="377" fill="var(--color-signal)" font-family="l0g Small Parcels" font-size="31" font-weight="700" text-anchor="end">3 €</text>
<text data-panel="small-parcels-fr-timeline-m-card-1" x="44" y="409" fill="var(--color-muted)" font-family="l0g Small Parcels" font-size="17" font-weight="400" text-anchor="start">Circuit admissible jusqu’à 150 €</text>
<line x1="210" y1="443" x2="210" y2="454" stroke="var(--color-signal)" stroke-width="3"/>
<path d="M 204 445 L 210 454 L 216 445" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect id="small-parcels-fr-timeline-m-card-2" x="28" y="460" width="364" height="125" fill="var(--color-surface)"/>
<text data-panel="small-parcels-fr-timeline-m-card-2" x="44" y="489" fill="var(--color-muted)" font-family="l0g Small Parcels" font-size="17" font-weight="700" text-anchor="start">1er NOVEMBRE 2026</text>
<text data-panel="small-parcels-fr-timeline-m-card-2" x="44" y="520" fill="var(--color-paper)" font-family="l0g Small Parcels" font-size="21" font-weight="700" text-anchor="start">Frais européens</text>
<text data-panel="small-parcels-fr-timeline-m-card-2" x="376" y="522" fill="var(--color-signal)" font-family="l0g Small Parcels" font-size="31" font-weight="700" text-anchor="end">2 €</text>
<text data-panel="small-parcels-fr-timeline-m-card-2" x="44" y="554" fill="var(--color-muted)" font-family="l0g Small Parcels" font-size="17" font-weight="400" text-anchor="start">Ventes à distance</text>
<text data-panel="small-parcels-fr-timeline-m-card-2" x="44" y="577" fill="var(--color-muted)" font-family="l0g Small Parcels" font-size="17" font-weight="400" text-anchor="start">Sans plafond de valeur</text>
<rect id="small-parcels-fr-timeline-m-card-sum" x="28" y="625" width="364" height="135" fill="var(--color-surface)"/>
<text data-panel="small-parcels-fr-timeline-m-card-sum" x="44" y="656" fill="var(--color-muted)" font-family="l0g Small Parcels" font-size="17" font-weight="700" text-anchor="start">À PARTIR DU 1er NOVEMBRE</text>
<text data-panel="small-parcels-fr-timeline-m-card-sum" x="210" y="699" fill="var(--color-signal)" font-family="l0g Small Parcels" font-size="30" font-weight="700" text-anchor="middle">3 € + 2 € = 5 €</text>
<text data-panel="small-parcels-fr-timeline-m-card-sum" x="210" y="734" fill="var(--color-paper)" font-family="l0g Small Parcels" font-size="17" font-weight="400" text-anchor="middle">Par ligne soumise aux deux mesures</text>
<text data-panel="small-parcels-fr-timeline-m-frame" x="28" y="793" fill="var(--color-muted)" font-family="l0g Small Parcels" font-size="17" font-weight="400" text-anchor="start">R01 · R03 · R09 · R10</text>
</svg>
