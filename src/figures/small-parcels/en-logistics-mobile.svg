<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="small-parcels-en-logistics-m-title small-parcels-en-logistics-m-desc" viewBox="0 0 420 820" style="width:100%;height:auto" class="l0g-small-parcels-svg">
<title id="small-parcels-en-logistics-m-title">The sale comes before or after import</title>
<desc id="small-parcels-en-logistics-m-desc">An order placed before import and a sale from stock already cleared in the EU follow different sequences. An EU warehouse must be understood in that chronology. Simplified qualitative diagram. Top: the consumer sale precedes import, so an intermediate hub or warehouse does not automatically change its imported-distance-sale status. Bottom: goods are imported in bulk and released for free circulation before the consumer sale; ordinary import rules and inventory costs apply. Ordinary duty depends on the product, origin and procedure; VAT follows its own rules. Arrow widths do not encode volumes. The diagram provides no automatic exemption or classification.</desc>
<rect id="small-parcels-en-logistics-m-frame" x="0" y="0" width="420" height="820" fill="var(--color-ink)"/>
<text data-panel="small-parcels-en-logistics-m-frame" x="28" y="34" fill="var(--color-signal)" font-family="l0g Small Parcels" font-size="17" font-weight="700" text-anchor="start">l0g / PARCELS</text>
<text data-panel="small-parcels-en-logistics-m-frame" x="392" y="34" fill="var(--color-muted)" font-family="l0g Small Parcels" font-size="17" font-weight="400" text-anchor="end">04 / 05</text>
<text data-panel="small-parcels-en-logistics-m-frame" x="28" y="81" fill="var(--color-paper)" font-family="l0g Small Parcels" font-size="25" font-weight="700" text-anchor="start">The timing of the sale</text>
<text data-panel="small-parcels-en-logistics-m-frame" x="28" y="117" fill="var(--color-muted)" font-family="l0g Small Parcels" font-size="17" font-weight="400" text-anchor="start">Two sequences · qualitative arrows</text>
<text data-panel="small-parcels-en-logistics-m-frame" x="28" y="171" fill="var(--color-signal)" font-family="l0g Small Parcels" font-size="18" font-weight="700" text-anchor="start">ORDER BEFORE IMPORT</text>
<rect id="small-parcels-en-logistics-m-card-0-0" x="28" y="190" width="364" height="70" fill="var(--color-surface)"/>
<text data-panel="small-parcels-en-logistics-m-card-0-0" x="44" y="218" fill="var(--color-paper)" font-family="l0g Small Parcels" font-size="21" font-weight="700" text-anchor="start">1  Customer order</text>
<text data-panel="small-parcels-en-logistics-m-card-0-0" x="44" y="244" fill="var(--color-muted)" font-family="l0g Small Parcels" font-size="17" font-weight="400" text-anchor="start">Goods outside the EU</text>
