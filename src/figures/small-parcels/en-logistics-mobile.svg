<path d="M 204 691 L 210 700 L 216 691" fill="none" stroke="var(--color-amber)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect id="small-parcels-en-logistics-m-card-1-2" x="28" y="705" width="364" height="64" fill="var(--color-surface)"/>
<text data-panel="small-parcels-en-logistics-m-card-1-2" x="44" y="733" fill="var(--color-paper)" font-family="l0g Small Parcels" font-size="21" font-weight="700" text-anchor="start">3  Customer order</text>
<text data-panel="small-parcels-en-logistics-m-card-1-2" x="44" y="756" fill="var(--color-muted)" font-family="l0g Small Parcels" font-size="17" font-weight="400" text-anchor="start">Sale from stock</text>
<text data-panel="small-parcels-en-logistics-m-frame" x="28" y="793" fill="var(--color-muted)" font-family="l0g Small Parcels" font-size="17" font-weight="400" text-anchor="start">R05 · R06 · R07</text>
