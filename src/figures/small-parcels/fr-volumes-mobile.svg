<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="small-parcels-fr-volumes-m-title small-parcels-fr-volumes-m-desc" viewBox="0 0 420 820" style="width:100%;height:auto" class="l0g-small-parcels-svg">
<title id="small-parcels-fr-volumes-m-title">1,39 à 5,88 milliards d’items</title>
<desc id="small-parcels-fr-volumes-m-desc">Les « items in LVC » recensés par DG TAXUD passent de 1,39 à 5,88 milliards entre 2022 et 2025. Ces unités statistiques décrivent le flux ; elles ne constituent pas une assiette fiscale pour 2026. UE-27, base Surveillance, extraction du 6 février 2026. Transcription manuelle vérifiée des quatre valeurs du même graphique officiel : 1,39 ; 2,44 ; 4,67 ; 5,88 milliards. Axe à zéro, valeurs publiées arrondies. Le périmètre déclaré inclut H7, IOSS et les items de valeur intrinsèque inférieure à 150 €. La notice n’établit pas l’équivalence entre items statistiques, objets physiques, colis et lignes taxables de 2026. Le texte de la page conserve un ancien arrondi de 4,6 pour 2024 ; le graphique de même millésime est utilisé ici. Aucun revenu fiscal n’est extrapolé.</desc>
