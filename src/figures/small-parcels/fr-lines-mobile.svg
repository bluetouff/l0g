<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="small-parcels-fr-lines-m-title small-parcels-fr-lines-m-desc" viewBox="0 0 420 820" style="width:100%;height:auto" class="l0g-small-parcels-svg">
<title id="small-parcels-fr-lines-m-title">Les objets et les lignes douanières</title>
<desc id="small-parcels-fr-lines-m-desc">Quatre objets peuvent tenir sur une seule ligne douanière ; deux objets peuvent en occuper deux. Chaque ligne soumise aux deux mesures porte 3 € de droit et 2 € de frais. Deux paniers pédagogiques dans le circuit admissible au forfait, de valeur intrinsèque ≤ 150 €, après le 1er novembre 2026. Cas A : quatre T-shirts identiques supposés correctement déclarés sur une ligne. Cas B : un T-shirt et un jouet supposés déclarés sur deux lignes soumises aux frais. Le classement, la description et, lorsqu’elle est requise, l’origine déterminent les lignes. H7 : SH6 ; H6 : NC8 ; H1 : TARIC10. Les dessins ne déterminent aucun code douanier. Montants avant TVA et frais privés ; aucun regroupement artificiel n’est supposé.</desc>
