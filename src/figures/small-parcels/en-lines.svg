<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="small-parcels-en-lines-d-title small-parcels-en-lines-d-desc" viewBox="0 0 1000 680" style="width:100%;height:auto" class="l0g-small-parcels-svg">
<title id="small-parcels-en-lines-d-title">Objects and customs lines</title>
<desc id="small-parcels-en-lines-d-desc">Four objects may share one customs line; two objects may require two. Each line liable for both measures carries €3 of duty and a €2 fee. Two teaching examples in the eligible flat-duty route, with consignment intrinsic value ≤ €150, from 1 November 2026. A: four identical T-shirts assumed to be correctly declared on one line. B: a T-shirt and a toy assumed to occupy two liable lines. Classification, description and origin where required determine the lines. H7: HS6; H6: CN8; H1: TARIC10. Drawings assign no tariff codes. Amounts precede VAT and private fees; no artificial grouping is assumed.</desc>
