<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="small-parcels-en-volumes-m-title small-parcels-en-volumes-m-desc" viewBox="0 0 420 820" style="width:100%;height:auto" class="l0g-small-parcels-svg">
<title id="small-parcels-en-volumes-m-title">From 1.39 to 5.88 billion items</title>
<desc id="small-parcels-en-volumes-m-desc">DG TAXUD’s reported ‘items in LVC’ rise from 1.39 billion to 5.88 billion between 2022 and 2025. These statistical units describe the flow; they are not a 2026 tax base. EU27, Surveillance database, extracted 6 February 2026. Four manually transcribed and visually verified values from the same official chart: 1.39, 2.44, 4.67 and 5.88 billion. Zero baseline; published values are rounded. The stated scope includes H7, IOSS and items with intrinsic value below €150. The technical note does not equate statistical items, physical objects, parcels or 2026 chargeable customs lines. Page prose retains an older 4.6 figure for 2024; this chart uses the same-vintage series throughout. No tax revenue is extrapolated.</desc>
<rect id="small-parcels-en-volumes-m-frame" x="0" y="0" width="420" height="820" fill="var(--color-ink)"/>
<text data-panel="small-parcels-en-volumes-m-frame" x="28" y="34" fill="var(--color-signal)" font-family="l0g Small Parcels" font-size="17" font-weight="700" text-anchor="start">l0g / PARCELS</text>
<text data-panel="small-parcels-en-volumes-m-frame" x="392" y="34" fill="var(--color-muted)" font-family="l0g Small Parcels" font-size="17" font-weight="400" text-anchor="end">03 / 05</text>
<text data-panel="small-parcels-en-volumes-m-frame" x="28" y="81" fill="var(--color-paper)" font-family="l0g Small Parcels" font-size="25" font-weight="700" text-anchor="start">5.88 billion in 2025</text>
<text data-panel="small-parcels-en-volumes-m-frame" x="28" y="117" fill="var(--color-muted)" font-family="l0g Small Parcels" font-size="17" font-weight="400" text-anchor="start">EU27 · items in LVC · extracted 6</text>
<text data-panel="small-parcels-en-volumes-m-frame" x="28" y="141" fill="var(--color-muted)" font-family="l0g Small Parcels" font-size="17" font-weight="400" text-anchor="start">February 2026</text>
<text data-panel="small-parcels-en-volumes-m-frame" x="28" y="222" fill="var(--color-paper)" font-family="l0g Small Parcels" font-size="21" font-weight="700" text-anchor="start">2022</text>
