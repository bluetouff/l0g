<text data-panel="small-parcels-en-volumes-m-frame" x="392" y="422" fill="var(--color-signal)" font-family="l0g Small Parcels" font-size="22" font-weight="700" text-anchor="end">4.67</text>
<rect data-metric="volume-2" data-value="4.67" x="55" y="442" width="256.85" height="30" fill="var(--color-signal)"/>
