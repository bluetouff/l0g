<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="small-parcels-en-lines-m-title small-parcels-en-lines-m-desc" viewBox="0 0 420 820" style="width:100%;height:auto" class="l0g-small-parcels-svg">
<title id="small-parcels-en-lines-m-title">Objects and customs lines</title>
<desc id="small-parcels-en-lines-m-desc">Four objects may share one customs line; two objects may require two. Each line liable for both measures carries €3 of duty and a €2 fee. Two teaching examples in the eligible flat-duty route, with consignment intrinsic value ≤ €150, from 1 November 2026. A: four identical T-shirts assumed to be correctly declared on one line. B: a T-shirt and a toy assumed to occupy two liable lines. Classification, description and origin where required determine the lines. H7: HS6; H6: CN8; H1: TARIC10. Drawings assign no tariff codes. Amounts precede VAT and private fees; no artificial grouping is assumed.</desc>
<rect id="small-parcels-en-lines-m-frame" x="0" y="0" width="420" height="820" fill="var(--color-ink)"/>
<text data-panel="small-parcels-en-lines-m-frame" x="28" y="34" fill="var(--color-signal)" font-family="l0g Small Parcels" font-size="17" font-weight="700" text-anchor="start">l0g / PARCELS</text>
<text data-panel="small-parcels-en-lines-m-frame" x="392" y="34" fill="var(--color-muted)" font-family="l0g Small Parcels" font-size="17" font-weight="400" text-anchor="end">02 / 05</text>
<text data-panel="small-parcels-en-lines-m-frame" x="28" y="81" fill="var(--color-paper)" font-family="l0g Small Parcels" font-size="25" font-weight="700" text-anchor="start">Count the customs lines</text>
<text data-panel="small-parcels-en-lines-m-frame" x="28" y="117" fill="var(--color-muted)" font-family="l0g Small Parcels" font-size="17" font-weight="400" text-anchor="start">Teaching examples · eligible route up</text>
