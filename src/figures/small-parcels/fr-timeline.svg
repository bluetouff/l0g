<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="small-parcels-fr-timeline-d-title small-parcels-fr-timeline-d-desc" viewBox="0 0 1000 680" style="width:100%;height:auto" class="l0g-small-parcels-svg">
<title id="small-parcels-fr-timeline-d-title">Trois dates, deux frais européens</title>
<desc id="small-parcels-fr-timeline-d-desc">La taxe française de mars s’arrête en juillet. Dans le circuit admissible au forfait, le droit européen de 3 € est rejoint par les frais de 2 € le 1er novembre 2026. Chronologie schématique, espacements sans échelle de durée. La taxe française est abrogée avec effet au 1er juillet par le décret 2026-589. Le forfait européen de 3 € vise les ventes à distance importées en envois d’une valeur intrinsèque ≤ 150 €, dans le circuit admissible. Les frais européens de 2 € concernent les ventes à distance importées, sans ce plafond. Total illustré : 5 € par ligne soumise aux deux mesures, avant effets de TVA et frais privés. Situation documentaire au 30 octobre 2026 : les frais de novembre sont adoptés, leur application est future.</desc>
<rect id="small-parcels-fr-timeline-d-frame" x="0" y="0" width="1000" height="680" fill="var(--color-ink)"/>
<text data-panel="small-parcels-fr-timeline-d-frame" x="40" y="40" fill="var(--color-signal)" font-family="l0g Small Parcels" font-size="22" font-weight="700" text-anchor="start">l0g / COLIS</text>
<text data-panel="small-parcels-fr-timeline-d-frame" x="960" y="40" fill="var(--color-muted)" font-family="l0g Small Parcels" font-size="22" font-weight="400" text-anchor="end">01 / 05</text>
<text data-panel="small-parcels-fr-timeline-d-frame" x="40" y="93" fill="var(--color-paper)" font-family="l0g Small Parcels" font-size="34" font-weight="700" text-anchor="start">Trois dates, deux frais européens</text>
<text data-panel="small-parcels-fr-timeline-d-frame" x="40" y="137" fill="var(--color-muted)" font-family="l0g Small Parcels" font-size="22" font-weight="400" text-anchor="start">2026 · montants par ligne assujettie</text>
<rect id="small-parcels-fr-timeline-d-card-0" x="40" y="190" width="290" height="225" fill="var(--color-surface)"/>
<text data-panel="small-parcels-fr-timeline-d-card-0" x="60" y="230" fill="var(--color-muted)" font-family="l0g Small Parcels" font-size="22" font-weight="700" text-anchor="start">1er MARS</text>
<text data-panel="small-parcels-fr-timeline-d-card-0" x="60" y="275" fill="var(--color-paper)" font-family="l0g Small Parcels" font-size="25" font-weight="700" text-anchor="start">Taxe française</text>
<text data-panel="small-parcels-fr-timeline-d-card-0" x="60" y="335" fill="var(--color-accent)" font-family="l0g Small Parcels" font-size="42" font-weight="700" text-anchor="start">2 €</text>
<text data-panel="small-parcels-fr-timeline-d-card-0" x="60" y="376" fill="var(--color-muted)" font-family="l0g Small Parcels" font-size="22" font-weight="400" text-anchor="start">Abrogée au 1er</text>
<text data-panel="small-parcels-fr-timeline-d-card-0" x="60" y="403" fill="var(--color-muted)" font-family="l0g Small Parcels" font-size="22" font-weight="400" text-anchor="start">juillet</text>
<line x1="335" y1="300" x2="349" y2="300" stroke="var(--color-signal)" stroke-width="3"/>
<path d="M 340 294 L 349 300 L 340 306" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect id="small-parcels-fr-timeline-d-card-1" x="355" y="190" width="290" height="225" fill="var(--color-surface)"/>
<text data-panel="small-parcels-fr-timeline-d-card-1" x="375" y="230" fill="var(--color-muted)" font-family="l0g Small Parcels" font-size="22" font-weight="700" text-anchor="start">1er JUILLET</text>
<text data-panel="small-parcels-fr-timeline-d-card-1" x="375" y="275" fill="var(--color-paper)" font-family="l0g Small Parcels" font-size="25" font-weight="700" text-anchor="start">Droit européen</text>
<text data-panel="small-parcels-fr-timeline-d-card-1" x="375" y="335" fill="var(--color-signal)" font-family="l0g Small Parcels" font-size="42" font-weight="700" text-anchor="start">3 €</text>
<text data-panel="small-parcels-fr-timeline-d-card-1" x="375" y="376" fill="var(--color-muted)" font-family="l0g Small Parcels" font-size="22" font-weight="400" text-anchor="start">Circuit admissible</text>
<text data-panel="small-parcels-fr-timeline-d-card-1" x="375" y="403" fill="var(--color-muted)" font-family="l0g Small Parcels" font-size="22" font-weight="400" text-anchor="start">jusqu’à 150 €</text>
<line x1="650" y1="300" x2="664" y2="300" stroke="var(--color-signal)" stroke-width="3"/>
<path d="M 655 294 L 664 300 L 655 306" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect id="small-parcels-fr-timeline-d-card-2" x="670" y="190" width="290" height="225" fill="var(--color-surface)"/>
<text data-panel="small-parcels-fr-timeline-d-card-2" x="690" y="230" fill="var(--color-muted)" font-family="l0g Small Parcels" font-size="22" font-weight="700" text-anchor="start">1er NOVEMBRE</text>
<text data-panel="small-parcels-fr-timeline-d-card-2" x="690" y="275" fill="var(--color-paper)" font-family="l0g Small Parcels" font-size="25" font-weight="700" text-anchor="start">Frais européens</text>
<text data-panel="small-parcels-fr-timeline-d-card-2" x="690" y="335" fill="var(--color-signal)" font-family="l0g Small Parcels" font-size="42" font-weight="700" text-anchor="start">2 €</text>
<text data-panel="small-parcels-fr-timeline-d-card-2" x="690" y="376" fill="var(--color-muted)" font-family="l0g Small Parcels" font-size="22" font-weight="400" text-anchor="start">Ventes à distance</text>
<text data-panel="small-parcels-fr-timeline-d-card-2" x="690" y="403" fill="var(--color-muted)" font-family="l0g Small Parcels" font-size="22" font-weight="400" text-anchor="start">Sans plafond de valeur</text>
<rect id="small-parcels-fr-timeline-d-card-sum" x="40" y="470" width="920" height="130" fill="var(--color-surface)"/>
<text data-panel="small-parcels-fr-timeline-d-card-sum" x="64" y="511" fill="var(--color-muted)" font-family="l0g Small Parcels" font-size="22" font-weight="700" text-anchor="start">DÈS LE 1er NOVEMBRE</text>
<text data-panel="small-parcels-fr-timeline-d-card-sum" x="64" y="561" fill="var(--color-signal)" font-family="l0g Small Parcels" font-size="38" font-weight="700" text-anchor="start">3 € + 2 € = 5 €</text>
<text data-panel="small-parcels-fr-timeline-d-card-sum" x="935" y="552" fill="var(--color-paper)" font-family="l0g Small Parcels" font-size="22" font-weight="400" text-anchor="end">par ligne soumise aux deux mesures</text>
<text data-panel="small-parcels-fr-timeline-d-frame" x="40" y="653" fill="var(--color-muted)" font-family="l0g Small Parcels" font-size="22" font-weight="400" text-anchor="start">R01 · R03 · R09 · R10</text>
</svg>
