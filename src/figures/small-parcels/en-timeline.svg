<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="small-parcels-en-timeline-d-title small-parcels-en-timeline-d-desc" viewBox="0 0 1000 680" style="width:100%;height:auto" class="l0g-small-parcels-svg">
<title id="small-parcels-en-timeline-d-title">Three dates, two EU charges</title>
<desc id="small-parcels-en-timeline-d-desc">France’s March tax ends in July. For eligible imports, the €3 EU duty is joined by a €2 handling fee on 1 November 2026. Schematic chronology; spacing does not encode duration. Decree 2026-589 records the French tax’s repeal effective 1 July. The €3 EU flat duty covers eligible imported distance sales in consignments with intrinsic value ≤ €150. The €2 EU handling fee covers imported distance sales without that ceiling. The illustrated €5 applies to a line liable for both charges, before VAT effects and private fees. Evidence cut-off: 30 October 2026. The November fee is adopted but has yet to apply.</desc>
<rect id="small-parcels-en-timeline-d-frame" x="0" y="0" width="1000" height="680" fill="var(--color-ink)"/>
<text data-panel="small-parcels-en-timeline-d-frame" x="40" y="40" fill="var(--color-signal)" font-family="l0g Small Parcels" font-size="22" font-weight="700" text-anchor="start">l0g / PARCELS</text>
<text data-panel="small-parcels-en-timeline-d-frame" x="960" y="40" fill="var(--color-muted)" font-family="l0g Small Parcels" font-size="22" font-weight="400" text-anchor="end">01 / 05</text>
<text data-panel="small-parcels-en-timeline-d-frame" x="40" y="93" fill="var(--color-paper)" font-family="l0g Small Parcels" font-size="34" font-weight="700" text-anchor="start">Three dates, two EU charges</text>
<text data-panel="small-parcels-en-timeline-d-frame" x="40" y="137" fill="var(--color-muted)" font-family="l0g Small Parcels" font-size="22" font-weight="400" text-anchor="start">2026 · amounts per liable line</text>
<rect id="small-parcels-en-timeline-d-card-0" x="40" y="190" width="290" height="225" fill="var(--color-surface)"/>
<text data-panel="small-parcels-en-timeline-d-card-0" x="60" y="230" fill="var(--color-muted)" font-family="l0g Small Parcels" font-size="22" font-weight="700" text-anchor="start">1 MARCH</text>
<text data-panel="small-parcels-en-timeline-d-card-0" x="60" y="275" fill="var(--color-paper)" font-family="l0g Small Parcels" font-size="25" font-weight="700" text-anchor="start">French tax</text>
<text data-panel="small-parcels-en-timeline-d-card-0" x="60" y="335" fill="var(--color-accent)" font-family="l0g Small Parcels" font-size="42" font-weight="700" text-anchor="start">2 €</text>
<text data-panel="small-parcels-en-timeline-d-card-0" x="60" y="376" fill="var(--color-muted)" font-family="l0g Small Parcels" font-size="22" font-weight="400" text-anchor="start">Repealed from 1 July</text>
<line x1="335" y1="300" x2="349" y2="300" stroke="var(--color-signal)" stroke-width="3"/>
<path d="M 340 294 L 349 300 L 340 306" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect id="small-parcels-en-timeline-d-card-1" x="355" y="190" width="290" height="225" fill="var(--color-surface)"/>
<text data-panel="small-parcels-en-timeline-d-card-1" x="375" y="230" fill="var(--color-muted)" font-family="l0g Small Parcels" font-size="22" font-weight="700" text-anchor="start">1 JULY</text>
<text data-panel="small-parcels-en-timeline-d-card-1" x="375" y="275" fill="var(--color-paper)" font-family="l0g Small Parcels" font-size="25" font-weight="700" text-anchor="start">EU flat duty</text>
<text data-panel="small-parcels-en-timeline-d-card-1" x="375" y="335" fill="var(--color-signal)" font-family="l0g Small Parcels" font-size="42" font-weight="700" text-anchor="start">3 €</text>
<text data-panel="small-parcels-en-timeline-d-card-1" x="375" y="376" fill="var(--color-muted)" font-family="l0g Small Parcels" font-size="22" font-weight="400" text-anchor="start">Eligible route up to</text>
<text data-panel="small-parcels-en-timeline-d-card-1" x="375" y="403" fill="var(--color-muted)" font-family="l0g Small Parcels" font-size="22" font-weight="400" text-anchor="start">€150</text>
<line x1="650" y1="300" x2="664" y2="300" stroke="var(--color-signal)" stroke-width="3"/>
<path d="M 655 294 L 664 300 L 655 306" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect id="small-parcels-en-timeline-d-card-2" x="670" y="190" width="290" height="225" fill="var(--color-surface)"/>
<text data-panel="small-parcels-en-timeline-d-card-2" x="690" y="230" fill="var(--color-muted)" font-family="l0g Small Parcels" font-size="22" font-weight="700" text-anchor="start">1 NOVEMBER</text>
<text data-panel="small-parcels-en-timeline-d-card-2" x="690" y="275" fill="var(--color-paper)" font-family="l0g Small Parcels" font-size="25" font-weight="700" text-anchor="start">EU handling fee</text>
<text data-panel="small-parcels-en-timeline-d-card-2" x="690" y="335" fill="var(--color-signal)" font-family="l0g Small Parcels" font-size="42" font-weight="700" text-anchor="start">2 €</text>
<text data-panel="small-parcels-en-timeline-d-card-2" x="690" y="376" fill="var(--color-muted)" font-family="l0g Small Parcels" font-size="22" font-weight="400" text-anchor="start">Imported distance sales</text>
<text data-panel="small-parcels-en-timeline-d-card-2" x="690" y="403" fill="var(--color-muted)" font-family="l0g Small Parcels" font-size="22" font-weight="400" text-anchor="start">No value ceiling</text>
<rect id="small-parcels-en-timeline-d-card-sum" x="40" y="470" width="920" height="130" fill="var(--color-surface)"/>
<text data-panel="small-parcels-en-timeline-d-card-sum" x="64" y="511" fill="var(--color-muted)" font-family="l0g Small Parcels" font-size="22" font-weight="700" text-anchor="start">FROM 1 NOVEMBER 2026</text>
<text data-panel="small-parcels-en-timeline-d-card-sum" x="64" y="561" fill="var(--color-signal)" font-family="l0g Small Parcels" font-size="38" font-weight="700" text-anchor="start">3 € + 2 € = 5 €</text>
<text data-panel="small-parcels-en-timeline-d-card-sum" x="935" y="552" fill="var(--color-paper)" font-family="l0g Small Parcels" font-size="22" font-weight="400" text-anchor="end">per line liable for both charges</text>
<text data-panel="small-parcels-en-timeline-d-frame" x="40" y="653" fill="var(--color-muted)" font-family="l0g Small Parcels" font-size="22" font-weight="400" text-anchor="start">R01 · R03 · R09 · R10</text>
</svg>
