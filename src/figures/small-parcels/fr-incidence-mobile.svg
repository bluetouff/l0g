<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="small-parcels-fr-incidence-m-title small-parcels-fr-incidence-m-desc" viewBox="0 0 420 820" style="width:100%;height:auto" class="l0g-small-parcels-svg">
<title id="small-parcels-fr-incidence-m-title">Répartir les quatre euros de frais</title>
<desc id="small-parcels-fr-incidence-m-desc">Scénario choisi : deux lignes, 4 € de nouveaux frais, moitié répercutée. Avec une TVA supposée de 20 % collectée à la vente, le panier passe de 24 € à 26,40 € TTC. Simulation de transmission du seul supplément de novembre : F = 2 € × n, n = 2 lignes supposées admissibles. Prix initial HT = 20 €, transmission t = 50 %, TVA supposée = 20 %. Prix final TTC = (20 + F × t) × 1,20 = 26,40 €. Part client HT = 2 €, part absorbée = 2 €, TVA supplémentaire = 0,40 €. La barre partage F hors TVA ; la TVA est dessinée séparément. Les droits antérieurs de 3 € et les autres coûts sont supposés intégrés au prix initial et constants. Illustration avec TVA collectée à la vente lorsque la refacturation entre dans sa base. Aucune admissibilité IOSS, valeur intrinsèque ou classification n’est déterminée ; les autres régimes de TVA à l’importation ne sont pas simulés. Aucun taux de transmission observé n’est avancé.</desc>
<rect id="small-parcels-fr-incidence-m-frame" x="0" y="0" width="420" height="820" fill="var(--color-ink)"/>
<text data-panel="small-parcels-fr-incidence-m-frame" x="28" y="34" fill="var(--color-signal)" font-family="l0g Small Parcels" font-size="17" font-weight="700" text-anchor="start">l0g / COLIS</text>
<text data-panel="small-parcels-fr-incidence-m-frame" x="392" y="34" fill="var(--color-muted)" font-family="l0g Small Parcels" font-size="17" font-weight="400" text-anchor="end">05 / 05</text>
<text data-panel="small-parcels-fr-incidence-m-frame" x="28" y="81" fill="var(--color-paper)" font-family="l0g Small Parcels" font-size="25" font-weight="700" text-anchor="start">Le partage des frais</text>
<text data-panel="small-parcels-fr-incidence-m-frame" x="28" y="117" fill="var(--color-muted)" font-family="l0g Small Parcels" font-size="17" font-weight="400" text-anchor="start">Exemple fictif · prix initial 20 € HT</text>
<text data-panel="small-parcels-fr-incidence-m-frame" x="28" y="141" fill="var(--color-muted)" font-family="l0g Small Parcels" font-size="17" font-weight="400" text-anchor="start">· TVA 20 %</text>
<text data-panel="small-parcels-fr-incidence-m-frame" x="28" y="195" fill="var(--color-paper)" font-family="l0g Small Parcels" font-size="23" font-weight="700" text-anchor="start">4 € DE NOUVEAUX FRAIS</text>
<text data-panel="small-parcels-fr-incidence-m-frame" x="28" y="222" fill="var(--color-muted)" font-family="l0g Small Parcels" font-size="17" font-weight="400" text-anchor="start">2 lignes · 50 % répercutés</text>
<rect data-metric="passed" data-value="2" x="28" y="231" width="182" height="44" fill="var(--color-signal)"/>
<rect data-metric="absorbed" data-value="2" x="210" y="231" width="182" height="44" fill="var(--color-amber)"/>
<text data-panel="small-parcels-fr-incidence-m-frame" x="28" y="319" fill="var(--color-signal)" font-family="l0g Small Parcels" font-size="29" font-weight="700" text-anchor="start">2 €</text>
<text data-panel="small-parcels-fr-incidence-m-frame" x="392" y="319" fill="var(--color-amber)" font-family="l0g Small Parcels" font-size="29" font-weight="700" text-anchor="end">2 €</text>
<text data-panel="small-parcels-fr-incidence-m-frame" x="28" y="352" fill="var(--color-muted)" font-family="l0g Small Parcels" font-size="17" font-weight="400" text-anchor="start">Client HT</text>
<text data-panel="small-parcels-fr-incidence-m-frame" x="392" y="352" fill="var(--color-muted)" font-family="l0g Small Parcels" font-size="17" font-weight="400" text-anchor="end">Absorbés</text>
<text data-panel="small-parcels-fr-incidence-m-frame" x="210" y="416" fill="var(--color-accent)" font-family="l0g Small Parcels" font-size="23" font-weight="700" text-anchor="middle">TVA : 2 € × 20 % = 0,40 €</text>
<text data-panel="small-parcels-fr-incidence-m-frame" x="210" y="494" fill="var(--color-paper)" font-family="l0g Small Parcels" font-size="29" font-weight="700" text-anchor="middle">24 € TTC</text>
