<text data-panel="small-parcels-en-logistics-d-card-1-2" x="708" y="501" fill="var(--color-paper)" font-family="l0g Small Parcels" font-size="23" font-weight="700" text-anchor="start">Customer order</text>
<text data-panel="small-parcels-en-logistics-d-card-1-2" x="708" y="535" fill="var(--color-muted)" font-family="l0g Small Parcels" font-size="22" font-weight="400" text-anchor="start">Sale from stock</text>
<text data-panel="small-parcels-en-logistics-d-frame" x="40" y="607" fill="var(--color-muted)" font-family="l0g Small Parcels" font-size="22" font-weight="400" text-anchor="start">The sale sequence determines the route; the address alone does not.</text>
