<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="small-parcels-en-logistics-d-title small-parcels-en-logistics-d-desc" viewBox="0 0 1000 680" style="width:100%;height:auto" class="l0g-small-parcels-svg">
<title id="small-parcels-en-logistics-d-title">The sale comes before or after import</title>
<desc id="small-parcels-en-logistics-d-desc">An order placed before import and a sale from stock already cleared in the EU follow different sequences. An EU warehouse must be understood in that chronology. Simplified qualitative diagram. Top: the consumer sale precedes import, so an intermediate hub or warehouse does not automatically change its imported-distance-sale status. Bottom: goods are imported in bulk and released for free circulation before the consumer sale; ordinary import rules and inventory costs apply. Ordinary duty depends on the product, origin and procedure; VAT follows its own rules. Arrow widths do not encode volumes. The diagram provides no automatic exemption or classification.</desc>
<rect id="small-parcels-en-logistics-d-frame" x="0" y="0" width="1000" height="680" fill="var(--color-ink)"/>
<text data-panel="small-parcels-en-logistics-d-frame" x="40" y="40" fill="var(--color-signal)" font-family="l0g Small Parcels" font-size="22" font-weight="700" text-anchor="start">l0g / PARCELS</text>
<text data-panel="small-parcels-en-logistics-d-frame" x="960" y="40" fill="var(--color-muted)" font-family="l0g Small Parcels" font-size="22" font-weight="400" text-anchor="end">04 / 05</text>
<text data-panel="small-parcels-en-logistics-d-frame" x="40" y="93" fill="var(--color-paper)" font-family="l0g Small Parcels" font-size="34" font-weight="700" text-anchor="start">The sale comes before or after import</text>
<text data-panel="small-parcels-en-logistics-d-frame" x="40" y="137" fill="var(--color-muted)" font-family="l0g Small Parcels" font-size="22" font-weight="400" text-anchor="start">Two sequences · qualitative arrows</text>
<text data-panel="small-parcels-en-logistics-d-frame" x="40" y="179" fill="var(--color-signal)" font-family="l0g Small Parcels" font-size="23" font-weight="700" text-anchor="start">ORDER BEFORE IMPORT</text>
