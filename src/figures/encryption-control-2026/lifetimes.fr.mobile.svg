<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 920" role="img" aria-labelledby="control-lifetimes-fr-m-title control-lifetimes-fr-m-desc" class="l0g-control-svg" style="width:100%;height:auto">
<title id="control-lifetimes-fr-m-title">La capacité, la mesure et les copies ont leurs durées</title><desc id="control-lifetimes-fr-m-desc">Trois frises qualitatives. Une capacité peut précéder et suivre une autorisation. Les données déjà capturées suivent leurs règles de livraison et de conservation.</desc>
