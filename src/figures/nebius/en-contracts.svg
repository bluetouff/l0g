<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="en-contracts-title-contracts-en en-contracts-desc" viewBox="0 0 1440 845" style="width:100%;height:auto" class="l0g-nebius-credit-svg"><title id="en-contracts-title-contracts-en">One promise, several conditions</title><desc id="en-contracts-desc">Capacity deals produce revenue only when services are delivered. SEC 20-F 2025 · SEC 6-K 16 MAR 2026</desc><rect x="0" y="0" width="1440" height="845" rx="0" fill="var(--color-ink)" id="nebius-en-contracts-panel-0" /><rect x="40" y="38" width="106" height="39" rx="18" fill="var(--color-surface-2)" id="nebius-en-contracts-panel-1" /><text x="93" y="65" fill="var(--color-signal)" font-family="l0g Nebius Credit" font-size="24" font-weight="700" text-anchor="middle" opacity="1" data-panel="nebius-en-contracts-panel-1">FIG. 06</text><text x="160" y="64" fill="var(--color-muted)" font-family="l0g Nebius Credit" font-size="24" font-weight="700" text-anchor="start" opacity="1" data-panel="nebius-en-contracts-panel-0">NEBIUS / CREDIT</text><path d="M40 100 L1400 100" fill="none" stroke="var(--color-line-strong)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="43" y="164" fill="var(--color-paper)" font-family="l0g Nebius Credit" font-size="47" font-weight="700" text-anchor="start" opacity="1" data-panel="nebius-en-contracts-panel-0">One promise, several conditions</text><text x="44" y="210" fill="var(--color-muted)" font-family="l0g Nebius Credit" font-size="24" font-weight="400" text-anchor="start" opacity="1" data-panel="nebius-en-contracts-panel-0">Capacity deals produce revenue only when services are delivered</text><rect x="42" y="273" width="655" height="419" rx="20" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1" id="nebius-en-contracts-panel-2" /><text x="74" y="318" fill="var(--color-signal)" font-family="l0g Nebius Credit" font-size="24" font-weight="700" text-anchor="start" opacity="1" data-panel="nebius-en-contracts-panel-2">MICROSOFT · 2025 DEAL</text><text x="75" y="390" fill="var(--color-paper)" font-family="l0g Nebius Credit" font-size="57" font-weight="700" text-anchor="start" opacity="1" data-panel="nebius-en-contracts-panel-2">$17.4bn</text><text x="74" y="430" fill="var(--color-muted)" font-family="l0g Nebius Credit" font-size="24" font-weight="400" text-anchor="start" opacity="1" data-panel="nebius-en-contracts-panel-2">estimated, conditional contract value</text><path d="M100 482 H634" fill="none" stroke="var(--color-line-strong)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><circle cx="100" cy="482" r="10" fill="var(--color-signal)" opacity="1" /><circle cx="634" cy="482" r="10" fill="var(--color-signal)" opacity="1" /><circle cx="100" cy="482" r="8" fill="var(--color-signal)" opacity="1" /><text x="165" y="520" fill="var(--color-paper)" font-family="l0g Nebius Credit" font-size="24" font-weight="700" text-anchor="middle" opacity="1" data-panel="nebius-en-contracts-panel-2">GPU delivery</text><circle cx="360" cy="482" r="8" fill="var(--color-amber)" opacity="1" /><text x="360" y="520" fill="var(--color-paper)" font-family="l0g Nebius Credit" font-size="24" font-weight="700" text-anchor="middle" opacity="1" data-panel="nebius-en-contracts-panel-2">Availability</text><circle cx="635" cy="482" r="8" fill="var(--color-signal)" opacity="1" /><text x="555" y="520" fill="var(--color-paper)" font-family="l0g Nebius Credit" font-size="24" font-weight="700" text-anchor="middle" opacity="1" data-panel="nebius-en-contracts-panel-2">Services</text><text x="78" y="595" fill="var(--color-signal)" font-family="l0g Nebius Credit" font-size="24" font-weight="400" text-anchor="start" opacity="1" data-panel="nebius-en-contracts-panel-2">$6.958bn contractual upfront payments</text><text x="78" y="649" fill="var(--color-muted)" font-family="l0g Nebius Credit" font-size="24" font-weight="400" text-anchor="start" opacity="1" data-panel="nebius-en-contracts-panel-2">Service credits / tranche termination rights</text><rect x="743" y="273" width="655" height="419" rx="20" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1" id="nebius-en-contracts-panel-3" /><text x="775" y="318" fill="var(--color-accent)" font-family="l0g Nebius Credit" font-size="24" font-weight="700" text-anchor="start" opacity="1" data-panel="nebius-en-contracts-panel-3">META · 2026 DEAL</text><rect x="770" y="357" width="600" height="120" rx="18" fill="var(--color-surface-2)" id="nebius-en-contracts-panel-4" /><rect x="770" y="357" width="267" height="120" rx="18" fill="var(--color-surface-2)" id="nebius-en-contracts-panel-5" /><text x="792" y="402" fill="var(--color-paper)" font-family="l0g Nebius Credit" font-size="42" font-weight="700" text-anchor="start" opacity="1" data-panel="nebius-en-contracts-panel-5">$12bn</text><text x="792" y="434" fill="var(--color-muted)" font-family="l0g Nebius Credit" font-size="24" font-weight="400" text-anchor="start" opacity="1" data-panel="nebius-en-contracts-panel-5">Dedicated capacity</text><text x="1058" y="392" fill="var(--color-amber)" font-family="l0g Nebius Credit" font-size="31" font-weight="700" text-anchor="start" opacity="1" data-panel="nebius-en-contracts-panel-4">up to $15bn</text><text x="1058" y="433" fill="var(--color-muted)" font-family="l0g Nebius Credit" font-size="24" font-weight="400" text-anchor="start" opacity="1" data-panel="nebius-en-contracts-panel-4">Unsold capacity</text><text x="781" y="544" fill="var(--color-paper)" font-family="l0g Nebius Credit" font-size="24" font-weight="400" text-anchor="start" opacity="1" data-panel="nebius-en-contracts-panel-3">The fallback depends on capacity</text><text x="781" y="584" fill="var(--color-muted)" font-family="l0g Nebius Credit" font-size="24" font-weight="400" text-anchor="start" opacity="1" data-panel="nebius-en-contracts-panel-3">not sold to third-party customers.</text><text x="781" y="649" fill="var(--color-accent)" font-family="l0g Nebius Credit" font-size="24" font-weight="400" text-anchor="start" opacity="1" data-panel="nebius-en-contracts-panel-3">Headline maximum: $27bn</text><text x="68" y="730" fill="var(--color-muted)" font-family="l0g Nebius Credit" font-size="24" font-weight="400" text-anchor="start" opacity="1" data-panel="nebius-en-contracts-panel-0">Contract values ≠ current cash collected; the two columns follow different commercial terms.</text><path d="M40 754 L1400 754" fill="none" stroke="var(--color-line-strong)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="42" y="786" fill="var(--color-signal)" font-family="l0g Nebius Credit" font-size="24" font-weight="700" text-anchor="start" opacity="1" data-panel="nebius-en-contracts-panel-0">l0g.fr  /  INVESTIGATION</text><text x="1398" y="786" fill="var(--color-muted)" font-family="l0g Nebius Credit" font-size="24" font-weight="400" text-anchor="end" opacity="1" data-panel="nebius-en-contracts-panel-0">S08 · S09 · S10</text></svg>