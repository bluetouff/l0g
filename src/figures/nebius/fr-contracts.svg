<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fr-contracts-title-contracts-fr fr-contracts-desc" viewBox="0 0 1440 845" style="width:100%;height:auto" class="l0g-nebius-credit-svg"><title id="fr-contracts-title-contracts-fr">Une promesse, plusieurs conditions</title><desc id="fr-contracts-desc">Les contrats de capacité créent des revenus sous conditions d’exécution. SEC 20-F 2025 · SEC 6-K 16 MAR 2026</desc><rect x="0" y="0" width="1440" height="845" rx="0" fill="var(--color-ink)" id="nebius-fr-contracts-panel-0" /><rect x="40" y="38" width="106" height="39" rx="18" fill="var(--color-surface-2)" id="nebius-fr-contracts-panel-1" /><text x="93" y="65" fill="var(--color-signal)" font-family="l0g Nebius Credit" font-size="24" font-weight="700" text-anchor="middle" opacity="1" data-panel="nebius-fr-contracts-panel-1">FIG. 06</text><text x="160" y="64" fill="var(--color-muted)" font-family="l0g Nebius Credit" font-size="24" font-weight="700" text-anchor="start" opacity="1" data-panel="nebius-fr-contracts-panel-0">NEBIUS / CRÉDIT</text><path d="M40 100 L1400 100" fill="none" stroke="var(--color-line-strong)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="43" y="164" fill="var(--color-paper)" font-family="l0g Nebius Credit" font-size="47" font-weight="700" text-anchor="start" opacity="1" data-panel="nebius-fr-contracts-panel-0">Une promesse, plusieurs conditions</text><text x="44" y="210" fill="var(--color-muted)" font-family="l0g Nebius Credit" font-size="24" font-weight="400" text-anchor="start" opacity="1" data-panel="nebius-fr-contracts-panel-0">Les contrats de capacité créent des revenus sous conditions d’exécution</text><rect x="42" y="273" width="655" height="419" rx="20" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1" id="nebius-fr-contracts-panel-2" /><text x="74" y="318" fill="var(--color-signal)" font-family="l0g Nebius Credit" font-size="24" font-weight="700" text-anchor="start" opa