ata-panel="nebius-fr-contracts-panel-2">Droits à crédits de service / résiliation de tranche</text><rect x="743" y="273" width="655" height="419" rx="20" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1" id="nebius-fr-contracts-panel-3" /><text x="775" y="318" fill="var(--color-accent)" font-family="l0g Nebius Credit" font-size="24" font-weight="700" text-anchor="start" opacity="1" data-panel="nebius-fr-contracts-panel-3">META · ACCORD 2026</text><rect x="770" y="357" width="600" height="120" rx="18" fill="var(--color-surface-2)" id="nebius-fr-contracts-panel-4" /><rect x="770" y="357" width="267" height="120" rx="18" fill="var(--color-surface-2)" id="nebius-fr-contracts-panel-5" /><text x="792" y="402" fill="var(--color-paper)" font-family="l0g Nebius Credit" font-size="42" font-weight="700" text-anchor="start" opacity="1" data-panel="nebius-fr-contracts-panel-5">12 Md$</text><text x="792" y="434" fill="var(--color-muted)" font-family="l0g Nebius Credit" font-size="24" font-weight="400" text-anchor="start" opacity="1" data-panel="nebius-fr-contracts-panel-5">Capacité dédiée</text><text x="1058" y="392" fill="var(--color-amber)" font-family="l0g Nebius Credit" font-size="31" font-weight="700" text-anchor="start" opacity="1" data-panel="nebius-fr-contracts-panel-4">jusqu’à 15 Md$</text><text x="1058" y="433" fill="var(--color-muted)" font-family="l0g Nebius Credit" font-size="24" font-weight="400" text-anchor="start" opacity="1" data-panel="nebius-fr-contracts-panel-4">Capacité invendue</text><text x="781" y="544" fill="var(--color-paper)" font-family="l0g Nebius Credit" font-size="24" font-weight="400" text-anchor="start" opacity="1" data-panel="nebius-fr-contracts-panel-3">Le complément dépend de la capacité</text><text x="781" y="584" fill="var(--color-muted)" font-family="l0g Nebius Credit" font-size="24" font-weight="400" text-anchor="start" opacity="1" data-panel="nebius-fr-contracts-panel-3">non écoulée auprès d’autres clients.</text><text x="781" y="649" fill="var(--color-accent)" font-family="l0g Nebius Credit" font-size="24" font-weight="400" text-anchor="start" opacity="1" data-panel="nebius-fr-contracts-panel-3">Plafond annoncé : 27 Md$</text><text x="68" y="730" fill="var(--color-muted)" font-family="l0g Nebius Credit" font-size="24" font-weight="400" text-anchor="start" opacity="1" data-panel="nebius-fr-contracts-panel-0">Valeurs de contrats ≠ revenu encaissé aujourd’hui ; les deux colonnes suivent des clauses différentes.</text><path d="M40 754 L1400 754" fill="none" stroke="var(--color-line-strong)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="42" y="786" fill="var(--color-signal)" font-family="l0g Nebius Credit" font-size="24" font-weight="700" text-anchor="start" opacity="1" data-panel="nebius-fr-contracts-panel-0">l0g.fr  /  ENQUÊTE</text><text x="1398" y="786" fill="var(--color-muted)" font-family="l0g Nebius Credit" font-size="24" font-weight="400" text-anchor="end" opacity="1" data-panel="nebius-fr-contracts-panel-0">S08 · S09 · S10</text></svg>