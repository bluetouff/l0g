<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="en-contracts-mobile-title-contracts-en en-contracts-mobile-desc" viewBox="0 0 760 1280" style="width:100%;height:auto" class="l0g-nebius-credit-svg"><title id="en-contracts-mobile-title-contracts-en">Contracts with conditions</title><desc id="en-contracts-mobile-desc">Capacity deals produce revenue only when services are delivered. SEC 20-F 2025 · SEC 6-K 16 MAR 2026</desc><rect x="0" y="0" width="760" height="1280" rx="0" fill="var(--color-ink)" id="nebius-en-contracts-mobile-panel-0" /><rect x="40" y="38" width="132" height="39" rx="18" fill="var(--color-surface-2)" id="nebius-en-contracts-mobile-panel-1" /><text x="106" y="65" fill="var(--color-signal)" font-family="l0g Nebius Credit" font-size="30" font-weight="700" text-anchor="middle" opacity="1" data-panel="nebius-en-contracts-mobile-panel-1">FIG. 06</text><text x="196" y="64" fill="var(--color-muted)" font-family="l0g Nebius Credit" font-size="30" font-weight="700" text-anchor="start" opacity="1" data-panel="nebius-en-contracts-mobile-panel-0">NEBIUS / CREDIT</text><path d="M40 100 L720 100" fill="none" stroke="var(--color-line-strong)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="43" y="166" fill="var(--color-paper)" font-family="l0g Nebius Credit" font-size="35" font-weight="700" text-anchor="start" opacity="1" data-panel="nebius-en-contracts-mobile-panel-0">Contracts with conditions</text><text x="44" y="207" fill="var(--color-muted)" font-family="l0g Nebius Credit" font-size="30" font-weight="400" text-anchor="start" opacity="1" data-panel="nebius-en-contracts-mobile-panel-0">Stated value and delivery terms</text><rect x="41" y="254" width="678" height="432" rx="19" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1" id="nebius-en-contracts-mobile-panel-2" /><text x="72" y="302" fill="var(--color-signal)" font-family="l0g Nebius Credit" font-size="30" font-weight="700" text-anchor="start" opacity="1" data-panel="nebius-en-contracts-mobile-panel-2">MICROSOFT</text><text x="72" y="379" fill="var(--color-paper)" font-family="l0g Nebius Credit" font-size="55" font-weight="700" text-anchor="start" opacity="1" data-panel="nebius-en-contracts-mobile-panel-2">$17.4bn</text><text x="72" y="428" fill="var(--color-muted)" font-family="l0g Nebius Credit" font-size="30" font-weight="400" text-anchor="start" opacity="1" data-panel="nebius-en-contracts-mobile-panel-2">Conditional estimated value</text><text x="72" y="491" fill="var(--color-signal)" font-family="l0g Nebius Credit" font-size="30" font-weight="400" text-anchor="start" opacity="1" data-panel="nebius-en-contracts-mobile-panel-2">Upfront terms: $6.958bn</text><text x="72" y="548" fill="var(--color-paper)" font-family="l0g Nebius Credit" font-size="30" font-weight="400" text-anchor="start" opacity="1" data-panel="nebius-en-contracts-mobile-panel-2">Delivery + availability → service</text><text x="72" y="601" fill="var(--color-muted)" font-family="l0g Nebius Credit" font-size="30" font-weight="400" text-anchor="start" opacity="1" data-panel="nebius-en-contracts-mobile-panel-2">Credits / termination possible</text><rect x="41" y="715" width="678" height="431" rx="19" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1" id="nebius-en-contracts-mobile-panel-3" /><text x="72" y="763" fill="var(--color-accent)" font-family="l0g Nebius Credit" font-size="30" font-weight="700" text-anchor="start" opacity="1" data-panel="nebius-en-contracts-mobile-panel-3">META · 2026</text><text x="72" y="837" fill="var(--color-paper)" font-family="l0g Nebius Credit" font-size="53" font-weight="700" text-anchor="start" opacity="1" data-panel="nebius-en-contracts-mobile-panel-3">$12bn</text><text x="72" y="877" fill="var(--color-muted)" font-family="l0g Nebius Credit" font-size="30" font-weight="400" text-anchor="start" opacity="1" data-panel="nebius-en-contracts-mobile-panel-3">Dedicated capacity</text><path d="M72 922 L676 922" fill="none" stroke="var(--color-line-strong)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="72" y="982" fill="var(--color-amber)" font-family="l0g Nebius Credit" font-size="34" font-weight="700" text-anchor="start" opacity="1" data-panel="nebius-en-contracts-mobile-panel-3">up to +$15bn</text><text x="72" y="1026" fill="var(--color-muted)" font-family="l0g Nebius Credit" font-size="30" font-weight="400" text-anchor="start" opacity="1" data-panel="nebius-en-contracts-mobile-panel-3">Fallback on unsold compute capacity</text><text x="72" y="1101" fill="var(--color-paper)" font-family="l0g Nebius Credit" font-size="30" font-weight="400" text-anchor="start" opacity="1" data-panel="nebius-en-contracts-mobile-panel-3">Published maximum: $27bn</text><path d="M40 1205 L720 1205" fill="none" stroke="var(--color-line-strong)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="42" y="1248" fill="var(--color-signal)" font-family="l0g Nebius Credit" font-size="30" font-weight="700" text-anchor="start" opacity="1" data-panel="nebius-en-contracts-mobile-panel-0">l0g.fr</text><text x="718" y="1248" fill="var(--color-muted)" font-family="l0g Nebius Credit" font-size="30" font-weight="400" text-anchor="end" opacity="1" data-panel="nebius-en-contracts-mobile-panel-0">S08 · S09 · S10</text></svg>