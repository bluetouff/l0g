<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" style="width:100%;height:auto" class="l0g-ces-households-svg" role="img" aria-labelledby="ces-fr-transmission-d-title ces-fr-transmission-d-desc"><title id="ces-fr-transmission-d-title">Une hausse attendue, deux réactions possibles</title><desc id="ces-fr-transmission-d-desc">L’effet sur les achats dépend du revenu attendu, des réserves et de la capacité à payer aujourd’hui. Schéma analytique fondé sur les mécanismes de la littérature, et non reconstitution causale de septembre 2026. Flèches en pointillés : enchaînements possibles sous conditions. Les surfaces ne représentent aucun montant, effectif ou poids dans la population.</desc><rect id="ces-fr-transmission-d-frame" x="0" y="0" width="1000" height="650" rx="5" fill="var(--color-ink)"></rect><text data-panel="ces-fr-transmission-d-frame" x="40" y="34" fill="var(--color-signal)" font-family="l0g CES Households" font-size="22" font-weight="700" text-anchor="start">l0g / 07</text><line x1="40" y1="47" x2="960" y2="47" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-fr-transmission-d-frame" x="40" y="90" fill="var(--color-paper)" font-family="l0g CES Households" font-size="32" font-weight="700" text-anchor="start">Une hausse attendue, deux réactions possibles</text><text data-panel="ces-fr-transmission-d-frame" x="40" y="121" fill="var(--color-muted)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">Mécanisme conditionnel  /  intensités et probabilités non chiffrées</text><rect id="ces-fr-transmission-d-card-start" x="265" y="168" width="470" height="93" rx="5" fill="var(--color-surface)" stroke="var(--color-signal)" stroke-width="1.5"></rect><text data-panel="ces-fr-transmission-d-card-start" x="279" y="197" fill="var(--color-signal)" font-family="l0g CES Households" font-size="24" font-weight="700" text-anchor="start">Prix futurs attendus en hausse</text><text data-panel="ces-fr-transmission-d-card-start" x="279" y="227" fill="var(--color-paper)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">Réponses selon la situation du foyer.</text><path d="M 500 261 L 500 282 L 260 282 L 260 310" fill="none" stroke="var(--color-muted)" stroke-width="1.8" stroke-dasharray="6 5"></path><path d="M 256 300 L 260 310 L 264 300" fill="none" stroke="var(--color-muted)" stroke-width="1.8"></path><path d="M 500 261 L 500 282 L 740 282 L 740 310" fill="none" stroke="var(--color-muted)" stroke-width="1.8" stroke-dasharray="6 5"></path><path d="M 736 300 L 740 310 L 744 300" fill="none" stroke="var(--color-muted)" stroke-width="1.8"></path><rect id="ces-fr-transmission-d-card-low" x="40" y="310" width="440" height="130" rx="5" fill="var(--color-surface)" stroke="var(--color-amber)" stroke-width="1.5"></rect><text data-panel="ces-fr-transmission-d-card-low" x="54" y="339" fill="var(--color-amber)" font-family="l0g CES Households" font-size="24" font-weight="700" text-anchor="start">Revenu incertain, faible</text><text data-panel="ces-fr-transmission-d-card-low" x="54" y="370.68" fill="var(--color-amber)" font-family="l0g CES Households" font-size="24" font-weight="700" text-anchor="start">marge</text><text data-panel="ces-fr-transmission-d-card-low" x="54" y="400.68" fill="var(--color-paper)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">Réserves limitées ; dépenses</text><text data-panel="ces-fr-transmission-d-card-low" x="54" y="429.72" fill="var(--color-paper)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">essentielles prioritaires.</text><rect id="ces-fr-transmission-d-card-high" x="520" y="310" width="440" height="110" rx="5" fill="var(--color-surface)" stroke="var(--color-signal)" stroke-width="1.5"></rect><text data-panel="ces-fr-transmission-d-card-high" x="534" y="339" fill="var(--color-signal)" font-family="l0g CES Households" font-size="24" font-weight="700" text-anchor="start">Liquidités et revenu plus sûr</text><text data-panel="ces-fr-transmission-d-card-high" x="534" y="369" fill="var(--color-paper)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">Payer maintenant en conservant une</text><text data-panel="ces-fr-transmission-d-card-high" x="534" y="398.04" fill="var(--color-paper)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">réserve.</text><path d="M 260 440 L 260 469" fill="none" stroke="var(--color-amber)" stroke-width="1.8" stroke-dasharray="6 5"></path><path d="M 256 459 L 260 469 L 264 459" fill="none" stroke="var(--color-amber)" stroke-width="1.8"></path><path d="M 740 420 L 740 469" fill="none" stroke="var(--color-signal)" stroke-width="1.8" stroke-dasharray="6 5"></path><path d="M 736 459 L 740 469 L 744 459" fill="none" stroke="var(--color-signal)" stroke-width="1.8"></path><rect id="ces-fr-transmission-d-card-cut" x="40" y="470" width="440" height="98" rx="5" fill="var(--color-surface)" stroke="var(--color-amber)" stroke-width="1.5"></rect><text data-panel="ces-fr-transmission-d-card-cut" x="54" y="499" fill="var(--color-amber)" font-family="l0g CES Households" font-size="24" font-weight="700" text-anchor="start">Différer, substituer, réduire</text><text data-panel="ces-fr-transmission-d-card-cut" x="54" y="529" fill="var(--color-paper)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">Volumes d’achats potentiellement</text><text data-panel="ces-fr-transmission-d-card-cut" x="54" y="558.04" fill="var(--color-paper)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">freinés.</text><rect id="ces-fr-transmission-d-card-buy" x="520" y="470" width="440" height="98" rx="5" fill="var(--color-surface)" stroke="var(--color-signal)" stroke-width="1.5"></rect><text data-panel="ces-fr-transmission-d-card-buy" x="534" y="499" fill="var(--color-signal)" font-family="l0g CES Households" font-size="24" font-weight="700" text-anchor="start">Avancer un achat durable</text><text data-panel="ces-fr-transmission-d-card-buy" x="534" y="529" fill="var(--color-paper)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">Une dépense déplacée vers</text><text data-panel="ces-fr-transmission-d-card-buy" x="534" y="558.04" fill="var(--color-paper)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">aujourd’hui.</text><text data-panel="ces-fr-transmission-d-frame" x="40" y="602" fill="var(--color-paper)" font-family="l0g CES Households" font-size="22" font-weight="700" text-anchor="start">L’effet total dépend de la répartition de ces situations.</text><text data-panel="ces-fr-transmission-d-frame" x="40" y="637" fill="var(--color-muted)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">Pointillés : liens conditionnels  /  analyse l0g  /  [S08, S09, S15]</text></svg>
