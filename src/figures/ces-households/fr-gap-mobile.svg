<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 870" style="width:100%;height:auto" class="l0g-ces-households-svg" role="img" aria-labelledby="ces-fr-gap-m-title ces-fr-gap-m-desc"><title id="ces-fr-gap-m-title">Le décalage reste de 2,6 points</title><desc id="ces-fr-gap-m-desc">Revenus et dépenses prévus gagnent chacun 0,1 point. L’écart ne se creuse pas entre août et septembre. Comparaison de moyennes de taux individuels, pondérées par la population. Écart août : 3,6 − 1,0 = 2,6 points ; septembre : 3,7 − 1,1 = 2,6. Ce calcul ne mesure ni la croissance de masses agrégées, ni une baisse du taux d’épargne ou du pouvoir d’achat.</desc><rect id="ces-fr-gap-m-frame" x="0" y="0" width="420" height="870" rx="5" fill="var(--color-ink)"></rect><text data-panel="ces-fr-gap-m-frame" x="22" y="31" fill="var(--color-signal)" font-family="l0g CES Households" font-size="17" font-weight="700" text-anchor="start">l0g / 03</text><line x1="22" y1="45" x2="398" y2="45" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-fr-gap-m-frame" x="22" y="83" fill="var(--color-paper)" font-family="l0g CES Households" font-size="25" font-weight="700" text-anchor="start">Le décalage reste de 2,6</text><text data-panel="ces-fr-gap-m-frame" x="22" y="116" fill="var(--color-paper)" font-family="l0g CES Households" font-size="25" font-weight="700" text-anchor="start">points</text><text data-panel="ces-fr-gap-m-frame" x="22" y="144" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">Attentes nominales à douze mois  / </text><text data-panel="ces-fr-gap-m-frame" x="22" y="166.44" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">moyennes winsorisées à 2 %</text><rect x="22" y="200" width="14" height="14" rx="5" fill="var(--color-signal)"></rect><text data-panel="ces-fr-gap-m-frame" x="46" y="217" fill="var(--color-paper)" font-family="l0g CES