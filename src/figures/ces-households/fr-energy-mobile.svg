<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1040" style="width:100%;height:auto" class="l0g-ces-households-svg" role="img" aria-labelledby="ces-fr-energy-m-title ces-fr-energy-m-desc"><title id="ces-fr-energy-m-title">L’énergie concentre la hausse des prix</title><desc id="ces-fr-energy-m-desc">Environ 9 % du panier, mais 45 % du taux d’inflation annuel publié : l’énergie concentre une grande part de la hausse. Poids énergétique : 90,3 ‰ / 10 = 9,03 %. Part descriptive de l’inflation : 1,71 / 3,8 × 100 = 45 %. Les quatre contributions arrondies totalisent 3,77 points, contre 3,8 % pour le total arrondi. Les deux barres à 100 % ont des dénominateurs différents, explicitement nommés.</desc><rect id="ces-fr-energy-m-frame" x="0" y="0" width="420" height="1040" rx="5" fill="var(--color-ink)"></rect><text data-panel="ces-fr-energy-m-frame" x="22" y="31" fill="var(--color-signal)" font-family="l0g CES Households" font-size="17" font-weight="700" text-anchor="start">l0g / 02</text><line x1="22" y1="45" x2="398" y2="45" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-fr-energy-m-frame" x="22" y="83" fill="var(--color-paper)" font-family="l0g CES Households" font-size="25" font-weight="700" text-anchor="start">L’énergie concentre la</text><text data-panel="ces-fr-energy-m-frame" x="22" y="116" fill="var(--color-paper)" font-family="l0g CES Households" font-size="25" font-weight="700" text-anchor="start">hausse des prix</text><text data-panel="ces-fr-energy-m-frame" x="22" y="144" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">IPCH  /  zone euro à 21 pays  /  septembre</text><text data-panel="ces-fr-energy-m-frame" x="22" y="166.44" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">2026</text><text data-panel="ces-fr-energy-m-frame" x="22" y="220" fill="var(--color-paper)" font-family="l0g CES Households" font-size="17" font-weight="700" text-anchor="start">Poids dans le panier</text><text data-panel="ces-fr-energy-m-frame" x="398" y="262" fill="var(--color-signal)" font-family="l0g CES Households" font-size="26" font-weight="700" text-anchor="end">9,03 %</text><rect id="ces-fr-energy-m-card-denom-0" x="22" y="278" width="376" height="19" rx="5" fill="var(--color-surface-2)"></rect><rect x="22" y="278" width="33.9528" height="19" rx="5" fill="var(--color-signal)"></rect><text data-panel="ces-fr-energy-m-frame" x="22" y="328" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">dépenses représentées dans l’IPCH</text><text data-panel="ces-fr-energy-m-frame" x="22" y="370" fill="var(--color-paper)" font-family="l0g CES Households" font-size="17" font-weight="700" text-anchor="start">Part de l’inflation annuelle</text><text data-panel="ces-fr-energy-m-frame" x="398" y="412" fill="var(--color-accent)" font-family="l0g CES Households" font-size="26" font-weight="700" text-anchor="end">45 %</text><rect id="ces-fr-energy-m-card-denom-1" x="22" y="428" width="376" height="19" rx="5" fill="var(--color-surface-2)"></rect><rect x="22" y="428" width="169.2" height="19" rx="5" fill="var(--color-accent)"></rect><text data-panel="ces-fr-energy-m-frame" x="22" y="478" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">contribution / total arrondi</text><text data-panel="ces-fr-energy-m-frame" x="22" y="535" fill="var(--color-paper)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">Énergie</text><text data-panel="ces-fr-energy-m-frame" x="398" y="535" fill="var(--color-accent)" font-family="l0g CES Households" font-size="17" font-weight="700" text-anchor="end">1,71 pt</text><rect x="22" y="549" width="321.48" height="15" rx="5" fill="var(--color-accent)"></rect><text data-panel="ces-fr-energy-m-frame" x="22" y="614" fill="var(--color-paper)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">Services</text><text data-panel="ces-fr-energy-m-frame" x="398" y="614" fill="var(--color-paper)" font-family="l0g CES Households" font-size="17" font-weight="700" text-anchor="end">1,52 pt</text><rect x="22" y="628" width="285.76" height="15" rx="5" fill="var(--color-signal)"></rect><text data-panel="ces-fr-energy-m-frame" x="22" y="693" fill="var(--color-paper)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">Biens hors énergie</text><text data-panel="ces-fr-energy-m-frame" x="398" y="693" fill="var(--color-paper)" font-family="l0g CES Households" font-size="17" font-weight="700" text-anchor="end">0,29 pt</text><rect x="22" y="707" width="54.52" height="15" rx="5" fill="var(--color-signal)"></rect><text data-panel="ces-fr-energy-m-frame" x="22" y="772" fill="var(--color-paper)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">Alimentation, alcool, tabac</text><text data-panel="ces-fr-energy-m-frame" x="398" y="772" fill="var(--color-paper)" font-family="l0g CES Households" font-size="17" font-weight="700" text-anchor="end">0,25 pt</text><rect x="22" y="786" width="47" height="15" rx="5" fill="var(--color-signal)"></rect><line x1="22" y1="860" x2="398" y2="860" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-fr-energy-m-frame" x="22" y="889" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">0</text><text data-panel="ces-fr-energy-m-frame" x="210" y="889" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="middle">1</text><text data-panel="ces-fr-energy-m-frame" x="398" y="889" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="end">2</text><line x1="22" y1="913" x2="398" y2="913" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-fr-energy-m-frame" x="22" y="932" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">Contributions en points. Somme : 3,77 ;</text><text data-panel="ces-fr-energy-m-frame" x="22" y="954.44" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">total publié : 3,8 %.</text><text data-panel="ces-fr-energy-m-frame" x="22" y="977.44" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">Eurostat  /  16.10.2026  /  [S02]  /  calculs</text><text data-panel="ces-fr-energy-m-frame" x="22" y="999.88" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">l0g</text></svg>
