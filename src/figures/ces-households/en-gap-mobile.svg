<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 870" style="width:100%;height:auto" class="l0g-ces-households-svg" role="img" aria-labelledby="ces-en-gap-m-title ces-en-gap-m-desc"><title id="ces-en-gap-m-title">The gap remains 2.6 points</title><desc id="ces-en-gap-m-desc">Expected income and spending growth each rise by 0.1 point. Their gap does not widen between August and September. Population-weighted means of individual growth rates. August gap: 3.6 − 1.0 = 2.6 points; September: 3.7 − 1.1 = 2.6. This does not measure growth in aggregate totals or a decline in the saving rate or purchasing power.</desc><rect id="ces-en-gap-m-frame" x="0" y="0" width="420" height="870" rx="5" fill="var(--color-ink)"></rect><text data-panel="ces-en-gap-m-frame" x="22" y="31" fill="var(--color-signal)" font-family="l0g CES Households" font-size="17" font-weight="700" text-anchor="start">l0g / 03</text><line x1="22" y1="45" x2="398" y2="45" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-en-gap-m-frame" x="22" y="83" fill="var(--color-paper)" font-family="l0g CES Households" font-size="25" font-weight="700" text-anchor="start">The gap remains 2.6</text><text data-panel="ces-en-gap-m-frame" x="22" y="116" fill="var(--color-paper)" font-family="l0g CES Households" font-size="25" font-weight="700" text-anchor="start">points</text><text data-panel="ces-en-gap-m-frame" x="22" y="144" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">Twelve-month nominal expectations  /  2%</text><text data-panel="ces-en-gap-m-frame" x="22" y="166.44" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">winsorised means</text><rect x="22" y="200" width="14" height="14" rx="5" fill="var(--color-signal)"></rect><text data-panel="ces-en-gap-m-frame" x="46" y="217" fill="var(--color-paper)" font-family="l0g CES Households" font-size="17" font-wei