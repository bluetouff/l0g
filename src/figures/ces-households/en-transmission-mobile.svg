<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1170" style="width:100%;height:auto" class="l0g-ces-households-svg" role="img" aria-labelledby="ces-en-transmission-m-title ces-en-transmission-m-desc"><title id="ces-en-transmission-m-title">One price rise, two possible responses</title><desc id="ces-en-transmission-m-desc">The spending response depends on expected income, reserves and the ability to pay today. Analytical diagram based on research mechanisms, not a causal reconstruction of September 2026. Dashed arrows show conditional possibilities. Areas do not encode money, respondent counts or population shares.</desc><rect id="ces-en-transmission-m-frame" x="0" y="0" width="420" height="1170" rx="5" fill="var(--color-ink)"></rect><text data-panel="ces-en-transmission-m-frame" x="22" y="31" fill="var(--color-signal)" font-family="l0g CES Households" font-size="17" font-weight="700" text-anchor="start">l0g / 07</text><line x1="22" y1="45" x2="398" y2="45" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-en-transmission-m-frame" x="22" y="83" fill="var(--color-paper)" font-family="l0g CES Households" font-size="25" font-weight="700" text-anchor="start">One price rise, two</text><text data-panel="ces-en-transmission-m-frame" x="22" y="116" fill="var(--color-paper)" font-family="l0g CES Households" font-size="25" font-weight="700" text-anchor="start">possible responses</text><text data-panel="ces-en-transmission-m-frame" x="22" y="144" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">Conditional mechanism  /  unquantified</text><text data-panel="ces-en-transmission-m-frame" x="22" y="166.44" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">strength and probability</text><rect id="ces-en-transmission-m-card-start" x="22" y="207" width="376" height="112" rx="5" fill="var(--color-surface)" stroke="var(--color-signal)" stroke-width="1.5"></rect><text data-panel="ces-en-transmission-m-card-start" x="36" y="236" fill="var(--color-signal)" font-family="l0g CES Households" font-size="19" font-weight="700" text-anchor="start">Higher prices expected ahead</text><text data-panel="ces-en-transmission-m-card-start" x="36" y="261" fill="var(--color-paper)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">Responses depend on circumstances.</text><path d="M 210 319 L 210 334 L 30 334 L 30 382 L 48 382" fill="none" stroke="var(--color-amber)" stroke-width="1.8" stroke-dasharray="6 5"></path><path d="M 38 386 L 48 382 L 38 378" fill="none" stroke="var(--color-amber)" stroke-width="1.8"></path><path d="M 210 319 L 210 334 L 30 334 L 30 760 L 48 760" fill="none" stroke="var(--color-muted)" stroke-width="1.8" stroke-dasharray="6 5"></path><path d="M 38 764 L 48 760 L 38 756" fill="none" stroke="var(--color-muted)" stroke-width="1.8"></path><rect id="ces-en-transmission-m-card-low" x="48" y="350" width="350" height="135" rx="5" fill="var(--color-surface)" stroke="var(--color-amber)" stroke-width="1.5"></rect><text data-panel="ces-en-transmission-m-card-low" x="62" y="379" fill="var(--color-amber)" font-family="l0g CES Households" font-size="19" font-weight="700" text-anchor="start">Little room, uncertain income</text><text data-panel="ces-en-transmission-m-card-low" x="62" y="404" fill="var(--color-paper)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">Limited reserves; essential expenses</text><text data-panel="ces-en-transmission-m-card-low" x="62" y="426.44" fill="var(--color-paper)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">take priority.</text><path d="M 223 485 L 223 529" fill="none" stroke="var(--color-amber)" stroke-width="1.8" stroke-dasharray="6 5"></path><path d="M 219 519 L 223 529 L 227 519" fill="none" stroke="var(--color-amber)" stroke-width="1.8"></path><rect id="ces-en-transmission-m-card-cut" x="48" y="530" width="350" height="115" rx="5" fill="var(--color-surface)" stroke="var(--color-amber)" stroke-width="1.5"></rect><text data-panel="ces-en-transmission-m-card-cut" x="62" y="559" fill="var(--color-amber)" font-family="l0g CES Households" font-size="19" font-weight="700" text-anchor="start">Postpone, substitute, cut</text><text data-panel="ces-en-transmission-m-card-cut" x="62" y="584" fill="var(--color-paper)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">Potentially weaker purchasing</text><text data-panel="ces-en-transmission-m-card-cut" x="62" y="606.44" fill="var(--color-paper)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">volumes.</text><rect id="ces-en-transmission-m-card-high" x="48" y="707" width="350" height="135" rx="5" fill="var(--color-surface)" stroke="var(--color-signal)" stroke-width="1.5"></rect><text data-panel="ces-en-transmission-m-card-high" x="62" y="736" fill="var(--color-signal)" font-family="l0g CES Households" font-size="19" font-weight="700" text-anchor="start">Cash and more secure income</text><text data-panel="ces-en-transmission-m-card-high" x="62" y="761" fill="var(--color-paper)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">Able to pay today while keeping a</text><text data-panel="ces-en-transmission-m-card-high" x="62" y="783.44" fill="var(--color-paper)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">buffer.</text><path d="M 223 842 L 223 886" fill="none" stroke="var(--color-signal)" stroke-width="1.8" stroke-dasharray="6 5"></path><path d="M 219 876 L 223 886 L 227 876" fill="none" stroke="var(--color-signal)" stroke-width="1.8"></path><rect id="ces-en-transmission-m-card-buy" x="48" y="887" width="350" height="115" rx="5" fill="var(--color-surface)" stroke="var(--color-signal)" stroke-width="1.5"></rect><text data-panel="ces-en-transmission-m-card-buy" x="62" y="916" fill="var(--color-signal)" font-family="l0g CES Households" font-size="19" font-weight="700" text-anchor="start">Buy a durable item sooner</text><text data-panel="ces-en-transmission-m-card-buy" x="62" y="941" fill="var(--color-paper)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">Spending shifts towards today.</text><text data-panel="ces-en-transmission-m-frame" x="22" y="1045" fill="var(--color-paper)" font-family="l0g CES Households" font-size="18" font-weight="700" text-anchor="start">The total effect depends on how</text><text data-panel="ces-en-transmission-m-frame" x="22" y="1068.76" fill="var(--color-paper)" font-family="l0g CES Households" font-size="18" font-weight="700" text-anchor="start">these situations are distributed.</text><line x1="22" y1="1101" x2="398" y2="1101" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-en-transmission-m-frame" x="22" y="1120" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">Dashed links: conditional possibilities  /  l0g</text><text data-panel="ces-en-transmission-m-frame" x="22" y="1142.44" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">analysis  /  [S08, S09, S15]</text></svg>
