><text data-panel="ces-en-budgets-m-frame" x="44" y="921.714286" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="end">100</text><line x1="51" y1="852.857143" x2="396" y2="852.857143" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-en-budgets-m-frame" x="44" y="858.857143" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="end">200</text><line x1="51" y1="790" x2="396" y2="790" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-en-budgets-m-frame" x="44" y="796" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="end">300</text><rect x="86" y="962.857143" width="48" height="15.714286" rx="5" fill="var(--color-amber)"></rect><text data-panel="ces-en-budgets-m-frame" x="110" y="778" fill="var(--color-paper)" font-family="l0g CES Households" font-size="17" font-weight="700" text-anchor="middle">25.00</text><line x1="134" y1="962.857143" x2="168" y2="962.857143" stroke="var(--color-muted)" stroke-width="1.5"></line><text data-panel="ces-en-budgets-m-frame" x="110" y="1038" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="middle">Initial</text><text data-panel="ces-en-budgets-m-frame" x="110" y="1060" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="middle">balance</text><rect x="168" y="945.571429" width="48" height="17.285714" rx="5" fill="var(--color-signal)"></rect><text data-panel="ces-en-budgets-m-frame" x="192" y="778" fill="var(--color-signal)" font-family="l0g CES Households" font-size="17" font-weight="700" text-anchor="middle">+27.50</text><line x1="216" y1="945.571429" x2="250" y2="945.571429" stroke="var(--color-muted)" stroke-width="1.5"></line><text data-panel="ces-en-budgets-m-frame" x="192" y="1038" fill="var(--color-mut