<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1240" style="width:100%;height:auto" class="l0g-ces-households-svg" role="img" aria-labelledby="ces-en-budgets-m-title ces-en-budgets-m-desc"><title id="ces-en-budgets-m-title">The starting buffer changes the result</title><desc id="ces-en-budgets-m-desc">The same assumed growth rates leave the first budget in surplus and push the second into deficit. Two fictional budgets, each with initial income of €2,500. Initial spending: €2,250 and €2,475. Illustrative application of +1.1% to income and +3.7% to spending, without an assumed monthly path. Balance = income minus spending. Exact changes are calculated before rounding to cents; common −€50 to €300 axis. No population share or average outcome is inferred.</desc><rect id="ces-en-budgets-m-frame" x="0" y="0" width="420" height="1240" rx="5" fill="var(--color-ink)"></rect><text data-panel="ces-en-budgets-m-frame" x="22" y="31" fill="var(--color-signal)" font-family="l0g CES Households" font-size="17" font-weight="700" text-anchor="start">l0g / 04</text><line x1="22" y1="45" x2="398" y2="45" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-en-budgets-m-frame" x="22" y="83" fill="var(--color-paper)" font-family="l0g CES Households" font-size="25" font-weight="700" text-anchor="start">The starting buffer</text><text data-panel="ces-en-budgets-m-frame" x="22" y="116" fill="var(--color-paper)" font-family="l0g CES Households" font-size="25" font-weight="700" text-anchor="start">changes the result</text><text data-panel="ces-en-budgets-m-frame" x="22" y="144" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">FICTIONAL EXAMPLE  /  euros per month</text><text data-panel="ces-en-budgets-m-frame" x="22" y="206" fill="var(--color-paper)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">Income: €2,500; +1.1%. Spending: +3.7%.</text><text data-panel="ces-en-budgets-m-frame" x="22" y="290" fill="var(--color-paper)" font-family="l0g CES Households" font-size="20" font-weight="700" text-anchor="start">Budget A</text><text data-panel="ces-en-budgets-m-frame" x="22" y="320" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">Spending: €2,250</text><line x1="51" y1="580" x2="396" y2="580" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-en-budgets-m-frame" x="44" y="586" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="end">-50</text><line x1="51" y1="548.571429" x2="396" y2="548.571429" stroke="var(--color-muted)" stroke-width="1.5"></line><text data-panel="ces-en-budgets-m-frame" x="44" y="554.571429" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="end">0</text><line x1="51" y1="485.714286" x2="396" y2="485.714286" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-en-budgets-m-frame" x="44" y="491.714286" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="end">100</text><line x1="51" y1="422.857143" x2="396" y2="422.857143" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-en-budgets-m-frame" x="44" y="428.857143" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="end">200</text><line x1="51" y1="360" x2="396" y2="360" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-en-budgets-m-frame" x="44" y="366" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="end">300</text><rect x="86" y="391.428571" width="48" height="157.142857" rx="5" fill="var(--color-amber)"></rect><text data-panel="ces-en-budgets-m-frame" x="110" y="348" fill="var(--color-paper)" font-fam