<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1020" style="width:100%;height:auto" class="l0g-ces-households-svg" role="img" aria-labelledby="ces-en-gradient-m-title ces-en-gradient-m-desc"><title id="ces-en-gradient-m-title">Income groups see different futures</title><desc id="ces-en-gradient-m-desc">The bottom income group expects slightly faster income growth, but higher unemployment and mortgage rates. Household net disposable-income quintiles are country- and wave-specific. Three separate scales, each starting at zero. Unemployment and mortgage rates are market expectations, not personal unemployment or received loan offers. Growth-rate differences are not euro-income differences.</desc><rect id="ces-en-gradient-m-frame" x="0" y="0" width="420" height="1020" rx="5" fill="var(--color-ink)"></rect><text data-panel="ces-en-gradient-m-frame" x="22" y="31" fill="var(--color-signal)" font-family="l0g CES Households" font-size="17" font-weight="700" text-anchor="start">l0g / 05</text><line x1="22" y1="45" x2="398" y2="45" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-en-gradient-m-frame" x="22" y="83" fill="var(--color-paper)" font-family="l0g CES Households" font-size="25" font-weight="700" text-anchor="start">Income groups see</text><text data-panel="ces-en-gradient-m-frame" x="22" y="116" fill="var(--color-paper)" font-family="l0g CES Households" font-size="25" font-weight="700" text-anchor="start">different futures</text><text data-panel="ces-en-gradient-m-frame" x="22" y="144" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">September 2026  /  twelve-month</text><text data-panel="ces-en-gradient-m-frame" x="22" y="166.44" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">expectations  /  2% winsorised means</text><rect x="22" y="222" width="14" height="14" rx="5" fill="var(--color-accent)"></rect><text data-panel="ces-en-gradient-m-frame" x="46" y="238" fill="var(--color-paper)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">Bottom quintile</text><rect x="22" y="253" width="14" height="14" rx="5" fill="var(--color-signal)"></rect><text data-panel="ces-en-gradient-m-frame" x="46" y="269" fill="var(--color-paper)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">Top quintile</text><text data-panel="ces-en-gradient-m-frame" x="22" y="330" fill="var(--color-paper)" font-family="l0g CES Households" font-size="18" font-weight="700" text-anchor="start">Nominal income growth</text><rect x="22" y="357" width="238.5" height="17" rx="5" fill="var(--color-accent)"></rect><text data-panel="ces-en-gradient-m-frame" x="272.5" y="373" fill="var(--color-accent)" font-family="l0g CES Households" font-size="17" font-weight="700" text-anchor="start">1.5 %</text><rect x="22" y="391" width="190.8" height="17" rx="5" fill="var(--color-signal)"></rect><text data-panel="ces-en-gradient-m-frame" x="224.8" y="407" fill="var(--color-signal)" font-family="l0g CES Households" font-size="17" font-weight="700" text-anchor="start">1.2 %</text><line x1="22" y1="441" x2="340" y2="441" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-en-gradient-m-frame" x="22" y="466" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">0</text><text data-panel="ces-en-gradient-m-frame" x="181" y="466" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="middle">1</text><text data-panel="ces-en-gradient-m-frame" x="340" y="466" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="end">2</text><text data-panel="ces-en-gradient-m-frame" x="22" y="515" fill="var(--color-paper)" font-family="l0g CES Households" font-size="18" font-weight="700" text-anchor="start">Expected unemployment rate</text><rect x="22" y="542" width="270.3" height="17" rx="5" fill="var(--color-accent)"></rect><text data-panel="ces-en-gradient-m-frame" x="304.3" y="558" fill="var(--color-accent)" font-family="l0g CES Households" font-size="17" font-weight="700" text-anchor="start">13.6 %</text><rect x="22" y="576" width="192.7875" height="17" rx="5" fill="var(--color-signal)"></rect><text data-panel="ces-en-gradient-m-frame" x="226.7875" y="592" fill="var(--color-signal)" font-family="l0g CES Households" font-size="17" font-weight="700" text-anchor="start">9.7 %</text><line x1="22" y1="626" x2="340" y2="626" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-en-gradient-m-frame" x="22" y="651" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">0</text><text data-panel="ces-en-gradient-m-frame" x="181" y="651" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="middle">8</text><text data-panel="ces-en-gradient-m-frame" x="340" y="651" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="end">16</text><text data-panel="ces-en-gradient-m-frame" x="22" y="700" fill="var(--color-paper)" font-family="l0g CES Households" font-size="18" font-weight="700" text-anchor="start">Expected mortgage rate</text><rect x="22" y="727" width="302.1" height="17" rx="5" fill="var(--color-accent)"></rect><text data-panel="ces-en-gradient-m-frame" x="336.1" y="743" fill="var(--color-accent)" font-family="l0g CES Households" font-size="17" font-weight="700" text-anchor="start">5.7 %</text><rect x="22" y="761" width="233.2" height="17" rx="5" fill="var(--color-signal)"></rect><text data-panel="ces-en-gradient-m-frame" x="267.2" y="777" fill="var(--color-signal)" font-family="l0g CES Households" font-size="17" font-weight="700" text-anchor="start">4.4 %</text><line x1="22" y1="811" x2="340" y2="811" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-en-gradient-m-frame" x="22" y="836" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">0</text><text data-panel="ces-en-gradient-m-frame" x="181" y="836" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="middle">3</text><text data-panel="ces-en-gradient-m-frame" x="340" y="836" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="end">6</text><line x1="22" y1="901" x2="398" y2="901" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-en-gradient-m-frame" x="22" y="920" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">Three separate scales. Expectations about</text><text data-panel="ces-en-gradient-m-frame" x="22" y="942.44" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">market rates.</text><text data-panel="ces-en-gradient-m-frame" x="22" y="965.44" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">ECB / CES  /  23 Oct 2026  /  [S01, S03,</text><text data-panel="ces-en-gradient-m-frame" x="22" y="987.88" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">S04]</text></svg>
