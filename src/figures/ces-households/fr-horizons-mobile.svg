<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 850" style="width:100%;height:auto" class="l0g-ces-households-svg" role="img" aria-labelledby="ces-fr-horizons-m-title ces-fr-horizons-m-desc"><title id="ces-fr-horizons-m-title">Trois horizons, un seul petit mouvement</title><desc id="ces-fr-horizons-m-desc">L’anticipation à un an augmente de 0,1 point ; celles à trois et cinq ans sont stables. Échelle commune de 0 à 4 %. Les horizons à trois et cinq ans concernent les mois 24–36 et 48–60, et non une hausse cumulée. Le repère de 2 % rappelle la cible IPCH de la BCE ; cette cible ne porte pas sur la médiane CES. Aucun intervalle de confiance n’est fourni dans le communiqué.</desc><rect id="ces-fr-horizons-m-frame" x="0" y="0" width="420" height="850" rx="5" fill="var(--color-ink)"></rect><text data-panel="ces-fr-horizons-m-frame" x="22" y="31" fill="var(--color-signal)" font-family="l0g CES Households" font-size="17" font-weight="700" text-anchor="start">l0g / 01</text><line x1="22" y1="45" x2="398" y2="45" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-fr-horizons-m-frame" x="22" y="83" fill="var(--color-paper)" font-family="l0g CES Households" font-size="25" font-weight="700" text-anchor="start">Trois horizons, un seul</text><text data-panel="ces-fr-horizons-m-frame" x="22" y="116" fill="var(--color-paper)" font-family="l0g CES Households" font-size="25" font-weight="700" text-anchor="start">petit mouvement</text><text data-panel="ces-fr-horizons-m-frame" x="22" y="144" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">Médianes pondérées  /  août et septembre</text><text data-panel="ces-fr-horizons-m-frame" x="22" y="166.44" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">2026</text><circle cx="29" cy="184" r="6" fill="var(--color-ink)" stroke="var(--color-muted)" stroke-width="2"></circle><text data-panel="ces-fr-horizons-m-frame" x="45" y="190" fill="var(--color-paper)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">Août</text><circle cx="185" cy="184" r="6" fill="var(--color-signal)"></circle><text data-panel="ces-fr-horizons-m-frame" x="201" y="190" fill="var(--color-paper)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">Septembre</text><text data-panel="ces-fr-horizons-m-frame" x="22" y="240" fill="var(--color-paper)" font-family="l0g CES Households" font-size="19" font-weight="700" text-anchor="start">À un an</text><text data-panel="ces-fr-horizons-m-frame" x="398" y="240" fill="var(--color-signal)" font-family="l0g CES Households" font-size="20" font-weight="700" text-anchor="end">3,0 → 3,1 %</text><text data-panel="ces-fr-horizons-m-frame" x="22" y="269" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">mois 0–12</text><line x1="30" y1="305" x2="390" y2="305" stroke="var(--color-line-strong)" stroke-width="1.5"></line><line x1="30" y1="299" x2="30" y2="311" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-fr-horizons-m-frame" x="30" y="341" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">0</text><line x1="120" y1="299" x2="120" y2="311" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-fr-horizons-m-frame" x="120" y="341" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="middle">1</text><line x1="210" y1="299" x2="210" y2="311" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-fr-horizons-m-frame" x="210" y="341" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="middle">2</text><line x1="300" y1="299" x2="300" y2="311" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-fr-horizons-m-frame" x="300" y="341" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="middle">3</text><line x1="390" y1="299" x2="390" y2="311" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-fr-horizons-m-frame" x="390" y="341" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="end">4</text><line x1="210" y1="291" x2="210" y2="319" stroke="var(--color-amber)" stroke-width="1.5" stroke-dasharray="6 5"></line><circle cx="300" cy="296" r="6" fill="var(--color-ink)" stroke="var(--color-muted)" stroke-width="2"></circle><circle cx="309" cy="314" r="6" fill="var(--color-signal)"></circle><text data-panel="ces-fr-horizons-m-frame" x="22" y="395" fill="var(--color-paper)" font-family="l0g CES Households" font-size="19" font-weight="700" text-anchor="start">À trois ans</text><text data-panel="ces-fr-horizons-m-frame" x="398" y="395" fill="var(--color-signal)" font-family="l0g CES Households" font-size="20" font-weight="700" text-anchor="end">2,9 → 2,9 %</text><text data-panel="ces-fr-horizons-m-frame" x="22" y="424" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">mois 24–36</text><line x1="30" y1="460" x2="390" y2="460" stroke="var(--color-line-strong)" stroke-width="1.5"></line><line x1="30" y1="454" x2="30" y2="466" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-fr-horizons-m-frame" x="30" y="496" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">0</text><line x1="120" y1="454" x2="120" y2="466" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-fr-horizons-m-frame" x="120" y="496" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="middle"