rt">: cible IPCH de la BCE.</text><text data-panel="ces-fr-horizons-m-frame" x="22" y="805.44" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">BCE / CES  /  23.10.2026  /  [S01, S03, S04,</text><text data-panel="ces-fr-horizons-m-frame" x="22" y="827.88" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">S13]</text></svg>
