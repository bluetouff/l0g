<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" style="width:100%;height:auto" class="l0g-ces-households-svg" role="img" aria-labelledby="ces-fr-budgets-d-title ces-fr-budgets-d-desc"><title id="ces-fr-budgets-d-title">La marge de départ change le résultat</title><desc id="ces-fr-budgets-d-desc">Avec les mêmes taux hypothétiques, le premier budget conserve un surplus ; le second passe en déficit. Deux budgets fictifs, revenu initial de 2 500 €. Dépenses initiales : 2 250 € et 2 475 €. Application illustrative de +1,1 % au revenu et +3,7 % aux dépenses, sans trajectoire mensuelle supposée. Solde = revenu − dépenses. Les variations exactes sont calculées avant arrondi au centime ; axe commun −50 à 300 €. Aucun poids de population ni résultat moyen n’est inféré.</desc><rect id="ces-fr-budgets-d-frame" x="0" y="0" width="1000" height="650" rx="5" fill="var(--color-ink)"></rect><text data-panel="ces-fr-budgets-d-frame" x="40" y="34" fill="var(--color-signal)" font-family="l0g CES Households" font-size="22" font-weight="700" text-anchor="start">l0g / 04</text><line x1="40" y1="47" x2="960" y2="47" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-fr-budgets-d-frame" x="40" y="90" fill="var(--color-paper)" font-family="l0g CES Households" font-size="32" font-weight="700" text-anchor="start">La marge de départ change le résultat</text><text data-panel="ces-fr-budgets-d-frame" x="40" y="121" fill="var(--color-muted)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">EXEMPLE FICTIF  /  euros par mois</text><text data-panel="ces-fr-budgets-d-frame" x="40" y="160" fill="var(--color-paper)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">Revenu : 2 500 € ; +1,1 %. Dépenses : +3,7 %.</text><text data-panel="ces-fr-budgets-d-frame" x="40" y="206" fill="var(--color-paper)" font-family="l0g CES Households" font-size="25" font-weight="700" text-anchor="start">Budge