<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" style="width:100%;height:auto" class="l0g-ces-households-svg" role="img" aria-labelledby="ces-en-horizons-d-title ces-en-horizons-d-desc"><title id="ces-en-horizons-d-title">Three horizons, one small change</title><desc id="ces-en-horizons-d-desc">One-year expectations rise by 0.1 point; three- and five-year expectations are unchanged. Common 0–4% scale. Three- and five-year horizons refer to months 24–36 and 48–60, not cumulative inflation. The 2% reference is the ECB’s HICP target, not a target for the CES median. The release provides no confidence interval.</desc><rect id="ces-en-horizons-d-frame" x="0" y="0" width="1000" height="650" rx="5" fill="var(--color-ink)"></rect><text data-panel="ces-en-horizons-d-frame" x="40" y="34" fill="var(--color-signal)" font-family="l0g CES Households" font-size="22" font-weight="700" text-anchor="start">l0g / 01</text><line x1="40" y1="47" x2="960" y2="47" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-en-horizons-d-frame" x="40" y="90" fill="var(--color-paper)" font-family="l0g CES Households" font-size="32" font-weight="700" text-anchor="start">Three horizons, one small change</text><text data-panel="ces-en-horizons-d-frame" x="40" y="121" fill="var(--color-muted)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">Weighted medians  /  August and September 2026</text><circle cx="47" cy="157" r="6" fill="var(--color-ink)" stroke="var(--color-muted)" stroke-width="2"></circle><text data-panel="ces-en-horizons-d-frame" x="63" y="163" fill="var(--color-paper)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">August</text><circle cx="220" cy="157" r="6" fill="var(--color-signal)"></circle><text data-panel="ces-en-horizons-d-frame" x="236" y="163" fill="var(--color-paper)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">September</text><text data-panel="ces-en-horizons-d-frame" x="40" y="215" fill="var(--color-paper)" font-family="l0g CES Households" font-size="24" font-weight="700" text-anchor="start">One year ahead</text><text data-panel="ces-en-horizons-d-frame" x="960" y="215" fill="var(--color-signal)" font-family="l0g CES Households" font-size="25" font-weight="700" text-anchor="end">3.0 → 3.1 %</text><text data-panel="ces-en-horizons-d-frame" x="40" y="244" fill="var(--color-muted)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">months 0–12</text><line x1="318" y1="253" x2="938" y2="253" stroke="var(--color-line-strong)" stroke-width="1.5"></line><line x1="318" y1="247" x2="318" y2="259" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-en-horizons-d-frame" x="318" y="289" fill="var(--color-muted)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">0</text><line x1="473" y1="247" x2="473" y2="259" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-en-horizons-d-frame" x="473" y="289" fill="var(--color-muted)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="middle">1</text><line x1="628" y1="247" x2="628" y2="259" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-en-horizons-d-frame" x="628" y="289" fill="var(--color-muted)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="middle">2</text><line x1="783" y1="247" x2="783" y2="259" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-en-horizons-d-frame" x="783" y="289" fill="var(--color-muted)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="middle">3</text><line x1="938" y1="247" x2="938" y2="259" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-en-horizons-d-frame" x="938" y="289" fill="var(--color-muted)" font-fam