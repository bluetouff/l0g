<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" style="width:100%;height:auto" class="l0g-ces-households-svg" role="img" aria-labelledby="ces-en-transmission-d-title ces-en-transmission-d-desc"><title id="ces-en-transmission-d-title">One price rise, two possible responses</title><desc id="ces-en-transmission-d-desc">The spending response depends on expected income, reserves and the ability to pay today. Analytical diagram based on research mechanisms, not a causal reconstruction of September 2026. Dashed arrows show conditional possibilities. Areas do not encode money, respondent counts or population shares.</desc><rect id="ces-en-transmission-d-frame" x="0" y="0" width="1000" height="650" rx="5" fill="var(--color-ink)"></rect><text data-panel="ces-en-transmission-d-frame" x="40" y="34" fill="var(--color-signal)" font-family="l0g CES Households" font-size="22" font-weight="700" text-anchor="start">l0g / 07</text><line x1="40" y1="47" x2="960" y2="47" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-en-transmission-d-frame" x="40" y="90" fill="var(--color-paper)" font-family="l0g CES Households" font-size="32" font-weight="700" text-anchor="start">One price rise, two possible responses</text><text data-panel="ces-en-transmission-d-frame" x="40" y="121" fill="var(--color-muted)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">Conditional mechanism  /  unquantified strength and probability</text><rect id="ces-en-transmission-d-card-start" x="265" y="168" width="470" height="93" rx="5" fill="var(--color-surface)" stroke="var(--color-signal)" stroke-width="1.5"></rect><text data-panel="ces-en-transmission-d-card-start" x="279" y="197" fill="var(--color-signal)" font-family="l0g CES Households" font-size="24" font-weight="700" text-anchor="start">Higher prices expected ahead</text><text data-panel="ces-en-transmission-d-card-start" x="279" y="227" fill="var(--color-paper)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">Responses depend on circumstances.</text><path d="M 500 261 L 500 282 L 260 282 L 260 310" fill="none" stroke="var(--color-muted)" stroke-width="1.8" stroke-dasharray="6 5"></path><path d="M 256 300 L 260 310 L 264 300" fill="none" stroke="var(--color-muted)" stroke-width="1.8"></path><path d="M 500 261 L 500 282 L 740 282 L 740 310" fill="none" stroke="var(--color-muted)" stroke-width="1.8" stroke-dasharray="6 5"></path><path d="M 736 300 L 740 310 L 744 300" fill="none" stroke="var(--color-muted)" stroke-width="1.8"></path><rect id="ces-en-transmission-d-card-low" x="40" y="310" width="440" height="130" rx="5" fill="var(--color-surface)" stroke="var(--color-amber)" stroke-width="1.5"></rect><text data-panel="ces-en-transmission-d-card-low" x="54" y="339" fill="var(--color-amber)" font-family="l0g CES Households" font-size="24" font-weight="700" text-anchor="start">Little room, uncertain income</text><text data-panel="ces-en-transmission-d-card-low" x="54" y="369" fill="var(--color-paper)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">Limited reserves; essential expenses</text><text data-panel="ces-en-transmission-d-card-low" x="54" y="398.04" fill="var(--color-paper)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">take priority.</text><rect id="ces-en-transmission-d-card-high" x="520" y="310" width="440" height="110" rx="5" fill="var(--color-surface)" stroke="var(--color-signal)" stroke-width="1.5"></rect><text data-panel="ces-en-transmission-d-card-high" x="534" y="339" fill="var(--color-signal)" font-family="l0g CES Households" font-size="24" font-weight="700" text-anchor="start">Cash and more secure income</text><text data-panel="ces-en-transmission-d-card-high" x="534" y="369" fill="var(--color-paper)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">Able to pay today while keeping a</text><text data-panel="ces-en-transmission-d-card-high" x="534" y="398.04" fill="var(--color-paper)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">buffer.</text><path d="M 260 440 L 260 469" fill="none" stroke="var(--color-amber)" stroke-width="1.8" stroke-dasharray="6 5"></path><path d="M 256 459 L 260 469 L 264 459" fill="none" stroke="var(--color-amber)" stroke-width="1.8"></path><path d="M 740 420 L 740 469" fill="none" stroke="var(--color-signal)" stroke-width="1.8" stroke-dasharray="6 5"></path><path d="M 736 459 L 740 469 L 744 459" fill="none" stroke="var(--color-signal)" stroke-width="1.8"></path><rect id="ces-en-transmission-d-card-cut" x="40" y="470" width="440" height="98" rx="5" fill="var(--color-surface)" stroke="var(--color-amber)" stroke-width="1.5"></rect><text data-panel="ces-en-transmission-d-card-cut" x="54" y="499" fill="var(--color-amber)" font-family="l0g CES Households" font-size="24" font-weight="700" text-anchor="start">Postpone, substitute, cut</text><text data-panel="ces-en-transmission-d-card-cut" x="54" y="529" fill="var(--color-paper)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">Potentially weaker purchasing</text><text data-panel="ces-en-transmission-d-card-cut" x="54" y="558.04" fill="var(--color-paper)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">volumes.</text><rect id="ces-en-transmission-d-card-buy" x="520" y="470" width="440" height="98" rx="5" fill="var(--color-surface)" stroke="var(--color-signal)" stroke-width="1.5"></rect><text data-panel="ces-en-transmission-d-card-buy" x="534" y="499" fill="var(--color-signal)" font-family="l0g CES Households" font-size="24" font-weight="700" text-anchor="start">Buy a durable item sooner</text><text data-panel="ces-en-transmission-d-card-buy" x="534" y="529" fill="var(--color-paper)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">Spending shifts towards today.</text><text data-panel="ces-en-transmission-d-frame" x="40" y="602" fill="var(--color-paper)" font-family="l0g CES Households" font-size="22" font-weight="700" text-anchor="start">The total effect depends on how these situations are distributed.</text><text data-panel="ces-en-transmission-d-frame" x="40" y="637" fill="var(--color-muted)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">Dashed links: conditional possibilities  /  l0g analysis  /  [S08, S09, S15]</text></svg>
