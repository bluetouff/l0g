<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" style="width:100%;height:auto" class="l0g-ces-households-svg" role="img" aria-labelledby="ces-fr-energy-d-title ces-fr-energy-d-desc"><title id="ces-fr-energy-d-title">L’énergie concentre la hausse des prix</title><desc id="ces-fr-energy-d-desc">Environ 9 % du panier, mais 45 % du taux d’inflation annuel publié : l’énergie concentre une grande part de la hausse. Poids énergétique : 90,3 ‰ / 10 = 9,03 %. Part descriptive de l’inflation : 1,71 / 3,8 × 100 = 45 %. Les quatre contributions arrondies totalisent 3,77 points, contre 3,8 % pour le total arrondi. Les deux barres à 100 % ont des dénominateurs différents, explicitement nommés.</desc><rect id="ces-fr-energy-d-frame" x="0" y="0" width="1000" height="650" rx="5" fill="var(--color-ink)"></rect><text data-panel="ces-fr-energy-d-frame" x="40" y="34" fill="var(--color-signal)" font-family="l0g CES Households" font-size="22" font-weight="700" text-anchor="start">l0g / 02</text><line x1="40" y1="47" x2="960" y2="47" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-fr-energy-d-frame" x="40" y="90" fill="var(--color-paper)" font-family="l0g CES Households" font-size="32" font-weight="700" text-anchor="start">L’énergie concentre la hausse des prix</text><text data-panel="ces-fr-energy-d-frame" x="40" y="121" fill="var(--color-muted)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">IPCH  /  zone euro à 21 pays  /  septembre 2026</text><text data-panel="ces-fr-energy-d-frame" x="40" y="180" fill="var(--color-paper)" font-family="l0g CES Households" font-size="22" font-weight="700" text-anchor="start">Poids dans le panier</text><text data-panel="ces-fr-energy-d-frame" x="480" y="222" fill="var(--color-signal)" font-family="l0g CES Households" font-size="31" font-weight="700" text-anchor="end">9,03 %</text><rect id="ces-fr-energy-d-card-denom-0" x="40" y="238" width="440" height="19" rx="5" fill="var(--color-surface-2)"></rect><rect x="40" y="238" width="39.732" height="19" rx="5" fill="var(--color-signal)"></rect><text data-panel="ces-fr-energy-d-frame" x="40" y="288" fill="var(--color-muted)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">dépenses représentées dans l’IPCH</text><text data-panel="ces-fr-energy-d-frame" x="520" y="180" fill="var(--color-paper)" font-family="l0g CES Households" font-size="22" font-weight="700" text-anchor="start">Part de l’inflation annuelle</text><text data-panel="ces-fr-energy-d-frame" x="960" y="222" fill="var(--color-accent)" font-family="l0g CES Households" font-size="31" font-weight="700" text-anchor="end">45 %</text><rect id="ces-fr-energy-d-card-denom-1" x="520" y="238" width="440" height="19" rx="5" fill="var(--color-surface-2)"></rect><rect x="520" y="238" width="198" height="19" rx="5" fill="var(--color-accent)"></rect><text data-panel="ces-fr-energy-d-frame" x="520" y="288" fill="var(--color-muted)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">contribution / total arrondi</text><text data-panel="ces-fr-energy-d-frame" x="40" y="365" fill="var(--color-paper)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">Énergie</text><text data-panel="ces-fr-energy-d-frame" x="960" y="365" fill="var(--color-accent)" font-family="l0g CES Households" font-size="22" font-weight="700" text-anchor="end">1,71 pt</text><rect x="470" y="347" width="333.45" height="15" rx="5" fill="var(--color-accent)"></rect><text data-panel="ces-fr-energy-d-frame" x="40" y="411" fill="var(--color-paper)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">Services</text><text data-panel="ces-fr-energy-d-frame" x="960" y="411" fill="var(--color-paper)" font-family="l0g CES Households" font-size="22" font-weight="700" text-anchor="end">1,52 pt</text><rect x="470" y="393" width="296.4" height="15" rx="5" fill="var(--color-signal)"></rect><text data-panel="ces-fr-energy-d-frame" x="40" y="457" fill="var(--color-paper)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">Biens hors énergie</text><text data-panel="ces-fr-energy-d-frame" x="960" y="457" fill="var(--color-paper)" font-family="l0g CES Households" font-size="22" font-weight="700" text-anchor="end">0,29 pt</text><rect x="470" y="439" width="56.55" height="15" rx="5" fill="var(--color-signal)"></rect><text data-panel="ces-fr-energy-d-frame" x="40" y="503" fill="var(--color-paper)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">Alimentation, alcool, tabac</text><text data-panel="ces-fr-energy-d-frame" x="960" y="503" fill="var(--color-paper)" font-family="l0g CES Households" font-size="22" font-weight="700" text-anchor="end">0,25 pt</text><rect x="470" y="485" width="48.75" height="15" rx="5" fill="var(--color-signal)"></rect><line x1="470" y1="554" x2="860" y2="554" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-fr-energy-d-frame" x="470" y="583" fill="var(--color-muted)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">0</text><text data-panel="ces-fr-energy-d-frame" x="665" y="583" fill="var(--color-muted)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="middle">1</text><text data-panel="ces-fr-energy-d-frame" x="860" y="583" fill="var(--color-muted)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="end">2</text><line x1="40" y1="585" x2="960" y2="585" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-fr-energy-d-frame" x="40" y="604" fill="var(--color-muted)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">Contributions en points. Somme : 3,77 ; total publié : 3,8 %.</text><text data-panel="ces-fr-energy-d-frame" x="40" y="632" fill="var(--color-muted)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">Eurostat  /  16.10.2026  /  [S02]  /  calculs l0g</text></svg>
