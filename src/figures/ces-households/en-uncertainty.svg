<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" style="width:100%;height:auto" class="l0g-ces-households-svg" role="img" aria-labelledby="ces-en-uncertainty-d-title ces-en-uncertainty-d-desc"><title id="ces-en-uncertainty-d-title">Uncertainty accompanies postponement</title><desc id="ces-en-uncertainty-d-desc">Households with less predictable finances more often plan to reduce spending or postpone major purchases. Groups compared in November 2025, published in Economic Bulletin 1/2026. Shares are conditional on group; multiple responses are possible. Eleven-point gaps are descriptive, not causal effects, September 2026 observations or mutually exclusive categories.</desc><rect id="ces-en-uncertainty-d-frame" x="0" y="0" width="1000" height="650" rx="5" fill="var(--color-ink)"></rect><text data-panel="ces-en-uncertainty-d-frame" x="40" y="34" fill="var(--color-signal)" font-family="l0g CES Households" font-size="22" font-weight="700" text-anchor="start">l0g / 06</text><line x1="40" y1="47" x2="960" y2="47" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-en-uncertainty-d-frame" x="40" y="90" fill="var(--color-paper)" font-family="l0g CES Households" font-size="32" font-weight="700" text-anchor="start">Uncertainty accompanies postponement</text><text data-panel="ces-en-uncertainty-d-frame" x="40" y="121" fill="var(--color-muted)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">HISTORICAL DATA  /  November 2025  /  weighted shares</text><rect x="40" y="160" width="14" height="14" rx="5" fill="var(--color-accent)"></rect><text data-panel="ces-en-uncertainty-d-frame" x="64" y="176" fill="var(--color-paper)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">Less predictable finances</text><rect x="40" y="188" width="14" height="14" rx="5" fill="var(--color-signal)"></rect><text data-panel="ces-en-uncertainty-d-frame" x="64" y="204" fill="var(--color-paper)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">More predictable finances</text><text data-panel="ces-en-uncertainty-d-frame" x="40" y="240" fill="var(--color-paper)" font-family="l0g CES Households" font-size="23" font-weight="700" text-anchor="start">Reduce usual spending</text><rect x="270" y="267" width="530" height="18" rx="5" fill="var(--color-accent)"></rect><text data-panel="ces-en-uncertainty-d-frame" x="810" y="284" fill="var(--color-accent)" font-family="l0g CES Households" font-size="22" font-weight="700" text-anchor="start">53 %</text><rect x="270" y="306" width="420" height="18" rx="5" fill="var(--color-signal)"></rect><text data-panel="ces-en-uncertainty-d-frame" x="700" y="323" fill="var(--color-signal)" font-family="l0g CES Households" font-size="22" font-weight="700" text-anchor="start">42 %</text><text data-panel="ces-en-uncertainty-d-frame" x="40" y="365" fill="var(--color-muted)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">Descriptive gap: 11 points</text><text data-panel="ces-en-uncertainty-d-frame" x="40" y="400" fill="var(--color-paper)" font-family="l0g CES Households" font-size="23" font-weight="700" text-anchor="start">Delay or cancel a major purchase</text><rect x="270" y="427" width="370" height="18" rx="5" fill="var(--color-accent)"></rect><text data-panel="ces-en-uncertainty-d-frame" x="650" y="444" fill="var(--color-accent)" font-family="l0g CES Households" font-size="22" font-weight="700" text-anchor="start">37 %</text><rect x="270" y="466" width="260" height="18" rx="5" fill="var(--color-signal)"></rect><text data-panel="ces-en-uncertainty-d-frame" x="540" y="483" fill="var(--color-signal)" font-family="l0g CES Households" font-size="22" font-weight="700" text-anchor="start">26 %</text><text data-panel="ces-en-uncertainty-d-frame" x="40" y="525" fill="var(--color-muted)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">Descriptive gap: 11 points</text><line x1="270" y1="555" x2="870" y2="555" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-en-uncertainty-d-frame" x="270" y="582" fill="var(--color-muted)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">0 %</text><text data-panel="ces-en-uncertainty-d-frame" x="470" y="582" fill="var(--color-muted)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="middle">20 %</text><text data-panel="ces-en-uncertainty-d-frame" x="670" y="582" fill="var(--color-muted)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="middle">40 %</text><text data-panel="ces-en-uncertainty-d-frame" x="870" y="582" fill="var(--color-muted)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="end">60 %</text><line x1="40" y1="591" x2="960" y2="591" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-en-uncertainty-d-frame" x="40" y="610" fill="var(--color-muted)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">Multiple responses. Descriptive association between groups.</text><text data-panel="ces-en-uncertainty-d-frame" x="40" y="638" fill="var(--color-muted)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">ECB  /  Bulletin 1/2026  /  [S07]  /  November 2025</text></svg>
