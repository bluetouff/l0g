<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1020" style="width:100%;height:auto" class="l0g-ces-households-svg" role="img" aria-labelledby="ces-fr-gradient-m-title ces-fr-gradient-m-desc"><title id="ces-fr-gradient-m-title">Un avenir différent selon le revenu</title><desc id="ces-fr-gradient-m-desc">Le bas de la distribution attend un peu plus de croissance du revenu, mais un chômage et des taux immobiliers plus élevés. Quintiles de revenu net disponible du ménage propres à chaque pays et vague. Trois échelles distinctes, chacune partant de zéro. Chômage et taux immobiliers sont des anticipations de marché ; ils ne mesurent ni le chômage personnel ni des offres de prêt reçues. Les différences de taux ne sont pas des différences de revenu en euros.</desc><rect id="ces-fr-gradient-m-frame" x="0" y="0" width="420" height="1020" rx="5" fill="var(--color-ink)"></rect><text data-panel="ces-fr-gradient-m-frame" x="22" y="31" fill="var(--color-signal)" font-family="l0g CES Households" font-size="17" font-weight="700" text-anchor="start">l0g / 05</text><line x1="22" y1="45" x2="398" y2="45" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-fr-gradient-m-frame" x="22" y="83" fill="var(--color-paper)" font-family="l0g CES Households" font-size="25" font-weight="700" text-anchor="start">Un avenir différent selon</text><text data-panel="ces-fr-gradient-m-frame" x="22" y="116" fill="var(--color-paper)" font-family="l0g CES Households" font-size="25" font-weight="700" text-anchor="start">le revenu</text><text data-panel="ces-fr-gradient-m-frame" x="22" y="144" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">Septembre 2026  /  attentes à douze mois  /</text><text data-panel="ces-fr-gradient-m-frame" x="22" y="166.44" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">moyennes winsorisées à 2 %</text><rect x="22" y="222" width="14" height="14" rx="5" fill="var(--color-accent)"></rect><text data-panel="ces-fr-gradient-m-frame" x="46" y="238" fill="var(--color-paper)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">Quintile inférieur</text><rect x="22" y="253" width="14" height="14" rx="5" fill="var(--color-signal)"></rect><text data-panel="ces-fr-gradient-m-frame" x="46" y="269" fill="var(--color-paper)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">Quintile supérieur</text><text data-panel="ces-fr-gradient-m-frame" x="22" y="330" fill="var(--color-paper)" font-family="l0g CES Households" font-size="18" font-weight="700" text-anchor="start">Croissance du revenu nominal</text><rect x="22" y="357" width="238.5" height="17" rx="5" fill="var(--color-accent)"></rect><text data-panel="ces-fr-gradient-m-frame" x="272.5" y="373" fill="var(--color-accent)" font-family="l0g CES Households" font-size="17" font-weight="700" text-anchor="start">1,5 %</text><rect x="22" y="391" width="190.8" height="17" rx="5" fill="var(--color-signal)"></rect><text data-panel="ces-fr-gradient-m-frame" x="224.8" y="407" fill="var(--color-signal)" font-family="l0g CES Households" font-size="17" font-weight="700" text-anchor="start">1,2 %</text><line x1="22" y1="441" x2="340" y2="441" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-fr-gradient-m-frame" x="22" y="466" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">0</text><text data-panel="ces-fr-gradient-m-frame" x="181" y="466" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="middle">1</text><text data-panel="ces-fr-gradient-m-frame" x="340" y="466" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="end">2</text><text data-panel="ces-fr-gradient-m-frame" x="22" y="515" fill="va