<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" style="width:100%;height:auto" class="l0g-ces-households-svg" role="img" aria-labelledby="ces-fr-horizons-d-title ces-fr-horizons-d-desc"><title id="ces-fr-horizons-d-title">Trois horizons, un seul petit mouvement</title><desc id="ces-fr-horizons-d-desc">L’anticipation à un an augmente de 0,1 point ; celles à trois et cinq ans sont stables. Échelle commune de 0 à 4 %. Les horizons à trois et cinq ans concernent les mois 24–36 et 48–60, et non une hausse cumulée. Le repère de 2 % rappelle la cible IPCH de la BCE ; cette cible ne porte pas sur la médiane CES. Aucun intervalle de confiance n’est fourni dans le communiqué.</desc><rect id="ces-fr-horizons-d-frame" x="0" y="0" width="1000" height="650" rx="5" fill="var(--color-ink)"></rect><text data-panel="ces-fr-horizons-d-frame" x="40" y="34" fill="var(--color-signal)" font-family="l0g CES Households" font-size="22" font-weight="700" text-anchor="start">l0g / 01</text><line x1="40" y1="47" x2="960" y2="47" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-fr-horizons-d-frame" x="40" y="90" fill="var(--color-paper)" font-family="l0g CES Households" font-size="32" font-weight="700" text-anchor="start">Trois horizons, un seul petit mouvement</text><text data-panel="ces-fr-horizons-d-frame" x="40" y="121" fill="var(--color-muted)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">Médianes pondérées  /  août et septembre 2026</text><circle cx="47" cy="157" r="6" fill="var(--color-ink)" stroke="var(--color-muted)" stroke-width="2"></circle><text data-panel="ces-fr-horizons-d-frame" x="63" y="163" fill="var(--color-paper)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">Août</text><circle cx="220" cy="157" r="6" fill="var(--color-signal)"></circle><text data-panel="ces-fr-horizons-d-frame" x="236" y="163" fill="var(--color-paper)" font-family="l0g CES Househol