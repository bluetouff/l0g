<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" style="width:100%;height:auto" class="l0g-ces-households-svg" role="img" aria-labelledby="ces-en-gradient-d-title ces-en-gradient-d-desc"><title id="ces-en-gradient-d-title">Income groups see different futures</title><desc id="ces-en-gradient-d-desc">The bottom income group expects slightly faster income growth, but higher unemployment and mortgage rates. Household net disposable-income quintiles are country- and wave-specific. Three separate scales, each starting at zero. Unemployment and mortgage rates are market expectations, not personal unemployment or received loan offers. Growth-rate differences are not euro-income differences.</desc><rect id="ces-en-gradient-d-frame" x="0" y="0" width="1000" height="650" rx="5" fill="var(--color-ink)"></rect><text data-panel="ces-en-gradient-d-frame" x="40" y="34" fill="var(--color-signal)" font-family="l0g CES Households" font-size="22" font-weight="700" text-anchor="start">l0g / 05</text><line x1="40" y1="47" x2="960" y2="47" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-en-gradient-d-frame" x="40" y="90" fill="var(--color-paper)" font-family="l0g CES Households" font-size="32" font-weight="700" text-anchor="start">Income groups see different futures</text><text data-panel="ces-en-gradient-d-frame" x="40" y="121" fill="var(--color-muted)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">September 2026  /  twelve-month expectations  /  2% winsorised means</text><rect x="40" y="162" width="14" height="14" rx="5" fill="var(--color-accent)"></rect><text data-panel="ces-en-gradient-d-frame" x="64" y="178" fill="var(--color-paper)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">Bottom quintile</text><rect x="410" y="162" width="14" height="14" rx="5" fill="var(--color-signal)"></rect><text data-panel="ces-en-gradient-d-frame" x="434" y="178" fill="var(--color-paper)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">Top quintile</text><text data-panel="ces-en-gradient-d-frame" x="40" y="233" fill="var(--color-paper)" font-family="l0g CES Households" font-size="23" font-weight="700" text-anchor="start">Nominal income growth</text><rect x="430" y="250" width="330" height="17" rx="5" fill="var(--color-accent)"></rect><text data-panel="ces-en-gradient-d-frame" x="772" y="266" fill="var(--color-accent)" font-family="l0g CES Households" font-size="22" font-weight="700" text-anchor="start">1.5 %</text><rect x="430" y="284" width="264" height="17" rx="5" fill="var(--color-signal)"></rect><text data-panel="ces-en-gradient-d-frame" x="706" y="300" fill="var(--color-signal)" font-family="l0g CES Households" font-size="22" font-weight="700" text-anchor="start">1.2 %</text><line x1="430" y1="324" x2="870" y2="324" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-en-gradient-d-frame" x="430" y="349" fill="var(--color-muted)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">0</text><text data-panel="ces-en-gradient-d-frame" x="650" y="349" fill="var(--color-muted)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="middle">1</text><text data-panel="ces-en-gradient-d-frame" x="870" y="349" fill="var(--color-muted)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="end">2</text><text data-panel="ces-en-gradient-d-frame" x="40" y="348" fill="var(--color-paper)" font-family="l0g CES Households" font-size="23" font-weight="700" text-anchor="start">Expected unemployment rate</text><rect x="430" y="365" width="374" height="17" rx="5" fill="var(--color-accent)"></rect><text data-panel="ces-en-gradient-d-frame" x="816" y="381" fill="var(--color-accent)" font-family="l0g CES Households" font-size="22" font-weight="700" text-anchor="start">13.6 %</text><rect x="430" y="399" width="266.75" height="17" rx="5" fill="var(--color-signal)"></rect><text data-panel="ces-en-gradient-d-frame" x="708.75" y="415" fill="var(--color-signal)" font-family="l0g CES Households" font-size="22" font-weight="700" text-anchor="start">9.7 %</text><line x1="430" y1="439" x2="870" y2="439" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-en-gradient-d-frame" x="430" y="464" fill="var(--color-muted)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">0</text><text data-panel="ces-en-gradient-d-frame" x="650" y="464" fill="var(--color-muted)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="middle">8</text><text data-panel="ces-en-gradient-d-frame" x="870" y="464" fill="var(--color-muted)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="end">16</text><text data-panel="ces-en-gradient-d-frame" x="40" y="463" fill="var(--color-paper)" font-family="l0g CES Households" font-size="23" font-weight="700" text-anchor="start">Expected mortgage rate</text><rect x="430" y="480" width="418" height="17" rx="5" fill="var(--color-accent)"></rect><text data-panel="ces-en-gradient-d-frame" x="860" y="496" fill="var(--color-accent)" font-family="l0g CES Households" font-size="22" font-weight="700" text-anchor="start">5.7 %</text><rect x="430" y="514" width="322.666667" height="17" rx="5" fill="var(--color-signal)"></rect><text data-panel="ces-en-gradient-d-frame" x="764.666667" y="530" fill="var(--color-signal)" font-family="l0g CES Households" font-size="22" font-weight="700" text-anchor="start">4.4 %</text><line x1="430" y1="554" x2="870" y2="554" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-en-gradient-d-frame" x="430" y="579" fill="var(--color-muted)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">0</text><text data-panel="ces-en-gradient-d-frame" x="650" y="579" fill="var(--color-muted)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="middle">3</text><text data-panel="ces-en-gradient-d-frame" x="870" y="579" fill="var(--color-muted)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="end">6</text><line x1="40" y1="589" x2="960" y2="589" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-en-gradient-d-frame" x="40" y="608" fill="var(--color-muted)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">Three separate scales. Expectations about market rates.</text><text data-panel="ces-en-gradient-d-frame" x="40" y="636" fill="var(--color-muted)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">ECB / CES  /  23 Oct 2026  /  [S01, S03, S04]</text></svg>
