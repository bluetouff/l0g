<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1010" style="width:100%;height:auto" class="l0g-ces-households-svg" role="img" aria-labelledby="ces-fr-uncertainty-m-title ces-fr-uncertainty-m-desc"><title id="ces-fr-uncertainty-m-title">L’incertitude accompagne les reports</title><desc id="ces-fr-uncertainty-m-desc">Les ménages à l’avenir financier moins prévisible déclarent plus souvent vouloir réduire ou reporter leurs achats. Comparaison de groupes en novembre 2025, publiée dans le Bulletin économique 1/2026. Parts conditionnelles à chaque groupe, réponses multiples possibles. Les écarts de 11 points sont descriptifs. Ni effet causal identifié par cette comparaison, ni mesure de septembre 2026, ni somme de catégories exclusives.</desc><rect id="ces-fr-uncertainty-m-frame" x="0" y="0" width="420" height="1010" rx="5" fill="var(--color-ink)"></rect><text data-panel="ces-fr-uncertainty-m-frame" x="22" y="31" fill="var(--color-signal)" font-family="l0g CES Households" font-size="17" font-weight="700" text-anchor="start">l0g / 06</text><line x1="22" y1="45" x2="398" y2="45" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-fr-uncertainty-m-frame" x="22" y="83" fill="var(--color-paper)" font-family="l0g CES Households" font-size="25" font-weight="700" text-anchor="start">L’incertitude accompagne</text><text data-panel="ces-fr-uncertainty-m-frame" x="22" y="116" fill="var(--color-paper)" font-family="l0g CES Households" font-size="25" font-weight="700" text-anchor="start">les reports</text><text data-panel="ces-fr-uncertainty-m-frame" x="22" y="144" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">DONNÉES HISTORIQUES  /  novembre 2025 </text><text data-panel="ces-fr-uncertainty-m-frame" x="22" y="166.44" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">/  parts pondérées</text><rect x="22" y="220" width="1