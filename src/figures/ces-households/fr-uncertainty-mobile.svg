fill="var(--color-accent)"></rect><text data-panel="ces-fr-uncertainty-m-frame" x="241.666667" y="645" fill="var(--color-accent)" font-family="l0g CES Households" font-size="17" font-weight="700" text-anchor="start">37 %</text><rect x="22" y="667" width="147.333333" height="18" rx="5" fill="var(--color-signal)"></rect><text data-panel="ces-fr-uncertainty-m-frame" x="179.333333" y="684" fill="var(--color-signal)" font-family="l0g CES Households" font-size="17" font-weight="700" text-anchor="start">26 %</text><text data-panel="ces-fr-uncertainty-m-frame" x="22" y="741" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">Écart descriptif : 11 points</text><line x1="22" y1="821" x2="362" y2="821" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-fr-uncertainty-m-frame" x="22" y="848" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">0 %</text><text data-panel="ces-fr-uncertainty-m-frame" x="135.333333" y="848" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="middle">20 %</text><text data-panel="ces-fr-uncertainty-m-frame" x="248.666667" y="848" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="middle">40 %</text><text data-panel="ces-fr-uncertainty-m-frame" x="362" y="848" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="end">60 %</text><line x1="22" y1="903" x2="398" y2="903" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-fr-uncertainty-m-frame" x="22" y="922" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">Réponses multiples. Association descriptive</text><text data-panel="ces-fr-uncertainty-m-frame" x="22" y="944.44" fill="var(--color-muted)" font-family=