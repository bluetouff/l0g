dth="1.5"></line><line x1="430.5" y1="482" x2="430.5" y2="496" stroke="var(--color-muted)" stroke-width="1.5"></line><line x1="833.5" y1="482" x2="833.5" y2="496" stroke="var(--color-muted)" stroke-width="1.5"></line><text data-panel="ces-fr-gap-d-frame" x="632" y="520" fill="var(--color-paper)" font-family="l0g CES Households" font-size="22" font-weight="700" text-anchor="middle">2,6 points</text><line x1="260" y1="540" x2="880" y2="540" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-fr-gap-d-frame" x="260" y="568" fill="var(--color-muted)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">0 %</text><text data-panel="ces-fr-gap-d-frame" x="415" y="568" fill="var(--color-muted)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="middle">1 %</text><text data-panel="ces-fr-gap-d-frame" x="570" y="568" fill="var(--color-muted)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="middle">2 %</text><text data-panel="ces-fr-gap-d-frame" x="725" y="568" fill="var(--color-muted)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="middle">3 %</text><text data-panel="ces-fr-gap-d-frame" x="880" y="568" fill="var(--color-muted)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="end">4 %</text><line x1="40" y1="589" x2="960" y2="589" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-fr-gap-d-frame" x="40" y="608" fill="var(--color-muted)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">Moyennes de taux individuels, pondérées par la population.</text><text data-panel="ces-fr-gap-d-frame" x="40" y="636" fill="var(--color-muted)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">BCE / CES  /  23.10.2026  /  [S01, S03]</text></svg>
