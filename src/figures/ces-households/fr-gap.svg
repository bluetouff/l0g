<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" style="width:100%;height:auto" class="l0g-ces-households-svg" role="img" aria-labelledby="ces-fr-gap-d-title ces-fr-gap-d-desc"><title id="ces-fr-gap-d-title">Le décalage reste de 2,6 points</title><desc id="ces-fr-gap-d-desc">Revenus et dépenses prévus gagnent chacun 0,1 point. L’écart ne se creuse pas entre août et septembre. Comparaison de moyennes de taux individuels, pondérées par la population. Écart août : 3,6 − 1,0 = 2,6 points ; septembre : 3,7 − 1,1 = 2,6. Ce calcul ne mesure ni la croissance de masses agrégées, ni une baisse du taux d’épargne ou du pouvoir d’achat.</desc><rect id="ces-fr-gap-d-frame" x="0" y="0" width="1000" height="650" rx="5" fill="var(--color-ink)"></rect><text data-panel="ces-fr-gap-d-frame" x="40" y="34" fill="var(--color-signal)" font-family="l0g CES Households" font-size="22" font-weight="700" text-anchor="start">l0g / 03</text><line x1="40" y1="47" x2="960" y2="47" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-fr-gap-d-frame" x="40" y="90" fill="var(--color-paper)" font-family="l0g CES Households" font-size="32" font-weight="700" text-anchor="start">Le décalage reste de 2,6 points</text><text data-panel="ces-fr-gap-d-frame" x="40" y="121" fill="var(--color-muted)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">Attentes nominales à douze mois  /  moyennes winsorisées à 2 %</text><rect x="40" y="153" width="14" height="14" rx="5" fill="var(--color-signal)"></rect><text data-panel="ces-fr-gap-d-frame" x="64" y="170" fill="var(--color-paper)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">Revenus</text><rect x="310" y="153" width="14" height="14" rx="5" fill="var(--color-accent)"></rect><text data-panel="ces-fr-gap-d-frame" x="334" y="170" fill="var(--color-paper)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">Dépenses</t