<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1010" style="width:100%;height:auto" class="l0g-ces-households-svg" role="img" aria-labelledby="ces-en-uncertainty-m-title ces-en-uncertainty-m-desc"><title id="ces-en-uncertainty-m-title">Uncertainty accompanies postponement</title><desc id="ces-en-uncertainty-m-desc">Households with less predictable finances more often plan to reduce spending or postpone major purchases. Groups compared in November 2025, published in Economic Bulletin 1/2026. Shares are conditional on group; multiple responses are possible. Eleven-point gaps are descriptive, not causal effects, September 2026 observations or mutually exclusive categories.</desc><rect id="ces-en-uncertainty-m-frame" x="0" y="0" width="420" height="1010" rx="5" fill="var(--color-ink)"></rect><text data-panel="ces-en-uncertainty-m-frame" x="22" y="31" fill="var(--color-signal)" font-family="l0g CES Households" font-size="17" font-weight="700" text-anchor="start">l0g / 06</text><line x1="22" y1="45" x2="398" y2="45" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-en-uncertainty-m-frame" x="22" y="83" fill="var(--color-paper)" font-family="l0g CES Households" font-size="25" font-weight="700" text-anchor="start">Uncertainty accompanies</text><text data-panel="ces-en-uncertainty-m-frame" x="22" y="116" fill="var(--color-paper)" font-family="l0g CES Households" font-size="25" font-weight="700" text-anchor="start">postponement</text><text data-panel="ces-en-uncertainty-m-frame" x="22" y="144" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">HISTORICAL DATA  /  November 2025  / </text><text data-panel="ces-en-uncertainty-m-frame" x="22" y="166.44" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">weighted shares</text><rect x="22" y="220" width="14" height="14" rx="5" fill="var(--color-accent)"></rect><text data-panel="ces-en-uncertainty-m-frame" x="46" y="236" fill="var(--color-paper)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">Less predictable finances</text><rect x="22" y="249" width="14" height="14" rx="5" fill="var(--color-signal)"></rect><text data-panel="ces-en-uncertainty-m-frame" x="46" y="265" fill="var(--color-paper)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">More predictable finances</text><text data-panel="ces-en-uncertainty-m-frame" x="22" y="335" fill="var(--color-paper)" font-family="l0g CES Households" font-size="18" font-weight="700" text-anchor="start">Reduce usual spending</text><rect x="22" y="388" width="300.333333" height="18" rx="5" fill="var(--color-accent)"></rect><text data-panel="ces-en-uncertainty-m-frame" x="332.333333" y="405" fill="var(--color-accent)" font-family="l0g CES Households" font-size="17" font-weight="700" text-anchor="start">53 %</text><rect x="22" y="427" width="238" height="18" rx="5" fill="var(--color-signal)"></rect><text data-panel="ces-en-uncertainty-m-frame" x="270" y="444" fill="var(--color-signal)" font-family="l0g CES Households" font-size="17" font-weight="700" text-anchor="start">42 %</text><text data-panel="ces-en-uncertainty-m-frame" x="22" y="501" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">Descriptive gap: 11 points</text><text data-panel="ces-en-uncertainty-m-frame" x="22" y="575" fill="var(--color-paper)" font-family="l0g CES Households" font-size="18" font-weight="700" text-anchor="start">Delay or cancel a major purchase</text><rect x="22" y="628" width="209.666667" height="18" rx="5" fill="var(--color-accent)"></rect><text data-panel="ces-en-uncertainty-m-frame" x="241.666667" y="645" fill="var(--color-accent)" font-family="l0g CES Households" font-size="17" font-weight="700" text-anchor="start">37 %</text><rect x="22" y="667" width="147.333333" height="18" rx="5" fill="var(--color-signal)"></rect><text data-panel="ces-en-uncertainty-m-frame" x="179.333333" y="684" fill="var(--color-signal)" font-family="l0g CES Households" font-size="17" font-weight="700" text-anchor="start">26 %</text><text data-panel="ces-en-uncertainty-m-frame" x="22" y="741" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">Descriptive gap: 11 points</text><line x1="22" y1="821" x2="362" y2="821" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-en-uncertainty-m-frame" x="22" y="848" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">0 %</text><text data-panel="ces-en-uncertainty-m-frame" x="135.333333" y="848" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="middle">20 %</text><text data-panel="ces-en-uncertainty-m-frame" x="248.666667" y="848" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="middle">40 %</text><text data-panel="ces-en-uncertainty-m-frame" x="362" y="848" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="end">60 %</text><line x1="22" y1="903" x2="398" y2="903" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-en-uncertainty-m-frame" x="22" y="922" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">Multiple responses. Descriptive association</text><text data-panel="ces-en-uncertainty-m-frame" x="22" y="944.44" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">between groups.</text><text data-panel="ces-en-uncertainty-m-frame" x="22" y="967.44" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">ECB  /  Bulletin 1/2026  /  [S07]  / </text><text data-panel="ces-en-uncertainty-m-frame" x="22" y="989.88" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">November 2025</text></svg>
