<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" style="width:100%;height:auto" class="l0g-ces-households-svg" role="img" aria-labelledby="ces-fr-uncertainty-d-title ces-fr-uncertainty-d-desc"><title id="ces-fr-uncertainty-d-title">L’incertitude accompagne les reports</title><desc id="ces-fr-uncertainty-d-desc">Les ménages à l’avenir financier moins prévisible déclarent plus souvent vouloir réduire ou reporter leurs achats. Comparaison de groupes en novembre 2025, publiée dans le Bulletin économique 1/2026. Parts conditionnelles à chaque groupe, réponses multiples possibles. Les écarts de 11 points sont descriptifs. Ni effet causal identifié par cette comparaison, ni mesure de septembre 2026, ni somme de catégories exclusives.</desc><rect id="ces-fr-uncertainty-d-frame" x="0" y="0" width="1000" height="650" rx="5" fill="var(--color-ink)"></rect><text data-panel="ces-fr-uncertainty-d-frame" x="40" y="34" fill="var(--color-signal)" font-family="l0g CES Households" font-size="22" font-weight="700" text-anchor="start">l0g / 06</text><line x1="40" y1="47" x2="960" y2="47" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-fr-uncertainty-d-frame" x="40" y="90" fill="var(--color-paper)" font-family="l0g CES Households" font-size="32" font-weight="700" text-anchor="start">L’incertitude accompagne les reports</text><text data-panel="ces-fr-uncertainty-d-frame" x="40" y="121" fill="var(--color-muted)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">DONNÉES HISTORIQUES  /  novembre 2025  /  parts pondérées</text><rect x="40" y="160" width="14" height="14" rx="5" fill="var(--color-accent)"></rect><text data-panel="ces-fr-uncertainty-d-frame" x="64" y="176" fill="var(--color-paper)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">Avenir financier moins prévisible</text><rect x="40" y="188" width="14" height="14" rx="5" fill="var(--color-signal)"></rect><text data-panel="ces-fr-uncertainty-d-frame" x="64" y="204" fill="var(--color-paper)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">Avenir financier plus prévisible</text><text data-panel="ces-fr-uncertainty-d-frame" x="40" y="240" fill="var(--color-paper)" font-family="l0g CES Households" font-size="23" font-weight="700" text-anchor="start">Réduire les dépenses usuelles</text><rect x="270" y="267" width="530" height="18" rx="5" fill="var(--color-accent)"></rect><text data-panel="ces-fr-uncertainty-d-frame" x="810" y="284" fill="var(--color-accent)" font-family="l0g CES Households" font-size="22" font-weight="700" text-anchor="start">53 %</text><rect x="270" y="306" width="420" height="18" rx="5" fill="var(--color-signal)"></rect><text data-panel="ces-fr-uncertainty-d-frame" x="700" y="323" fill="var(--color-signal)" font-family="l0g CES Households" font-size="22" font-weight="700" text-anchor="start">42 %</text><text data-panel="ces-fr-uncertainty-d-frame" x="40" y="365" fill="var(--color-muted)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">Écart descriptif : 11 points</text><text data-panel="ces-fr-uncertainty-d-frame" x="40" y="400" fill="var(--color-paper)" font-family="l0g CES Households" font-size="23" font-weight="700" text-anchor="start">Différer ou annuler un achat important</text><rect x="270" y="427" width="370" height="18" rx="5" fill="var(--color-accent)"></rect><text data-panel="ces-fr-uncertainty-d-frame" x="650" y="444" fill="var(--color-accent)" font-family="l0g CES Households" font-size="22" font-weight="700" text-anchor="start">37 %</text><rect x="270" y="466" width="260" height="18" rx="5" fill="var(--color-signal)"></rect><text data-panel="ces-fr-uncertainty-d-frame" x="540" y="483" fill="var(--color-signal)" font-family="l0g CES Households" font-size="22" font-weight="700" text-anchor="start">26 %</text><text data-panel="ces-fr-uncertainty-d-frame" x="40" y="525" fill="var(--color-muted)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">Écart descriptif : 11 points</text><line x1="270" y1="555" x2="870" y2="555" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-fr-uncertainty-d-frame" x="270" y="582" fill="var(--color-muted)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">0 %</text><text data-panel="ces-fr-uncertainty-d-frame" x="470" y="582" fill="var(--color-muted)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="middle">20 %</text><text data-panel="ces-fr-uncertainty-d-frame" x="670" y="582" fill="var(--color-muted)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="middle">40 %</text><text data-panel="ces-fr-uncertainty-d-frame" x="870" y="582" fill="var(--color-muted)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="end">60 %</text><line x1="40" y1="591" x2="960" y2="591" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-fr-uncertainty-d-frame" x="40" y="610" fill="var(--color-muted)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">Réponses multiples. Association descriptive entre groupes.</text><text data-panel="ces-fr-uncertainty-d-frame" x="40" y="638" fill="var(--color-muted)" font-family="l0g CES Households" font-size="22" font-weight="400" text-anchor="start">BCE  /  Bulletin 1/2026  /  [S07]  /  novembre 2025</text></svg>
