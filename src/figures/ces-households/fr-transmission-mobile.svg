<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1170" style="width:100%;height:auto" class="l0g-ces-households-svg" role="img" aria-labelledby="ces-fr-transmission-m-title ces-fr-transmission-m-desc"><title id="ces-fr-transmission-m-title">Une hausse attendue, deux réactions possibles</title><desc id="ces-fr-transmission-m-desc">L’effet sur les achats dépend du revenu attendu, des réserves et de la capacité à payer aujourd’hui. Schéma analytique fondé sur les mécanismes de la littérature, et non reconstitution causale de septembre 2026. Flèches en pointillés : enchaînements possibles sous conditions. Les surfaces ne représentent aucun montant, effectif ou poids dans la population.</desc><rect id="ces-fr-transmission-m-frame" x="0" y="0" width="420" height="1170" rx="5" fill="var(--color-ink)"></rect><text data-panel="ces-fr-transmission-m-frame" x="22" y="31" fill="var(--color-signal)" font-family="l0g CES Households" font-size="17" font-weight="700" text-anchor="start">l0g / 07</text><line x1="22" y1="45" x2="398" y2="45" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-fr-transmission-m-frame" x="22" y="83" fill="var(--color-paper)" font-family="l0g CES Households" font-size="25" font-weight="700" text-anchor="start">Une hausse attendue,</text><text data-panel="ces-fr-transmission-m-frame" x="22" y="116" fill="var(--color-paper)" font-family="l0g CES Households" font-size="25" font-weight="700" text-anchor="start">deux réactions possibles</text><text data-panel="ces-fr-transmission-m-frame" x="22" y="144" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">Mécanisme conditionnel  /  intensités et</text><text data-panel="ces-fr-transmission-m-frame" x="22" y="166.44" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">probabilités non chiffrées</text><rect id="ces-fr-transmission-m-card-start" x="22" y="207" width="376" height="112" rx="5" fill="var(--color-surface)" stroke="var(--color-signal)" stroke-width="1.5"></rect><text data-panel="ces-fr-transmission-m-card-start" x="36" y="236" fill="var(--color-signal)" font-family="l0g CES Households" font-size="19" font-weight="700" text-anchor="start">Prix futurs attendus en hausse</text><text data-panel="ces-fr-transmission-m-card-start" x="36" y="261" fill="var(--color-paper)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">Réponses selon la situation du foyer.</text><path d="M 210 319 L 210 334 L 30 334 L 30 382 L 48 382" fill="none" stroke="var(--color-amber)" stroke-width="1.8" stroke-dasharray="6 5"></path><path d="M 38 386 L 48 382 L 38 378" fill="none" stroke="var(--color-amber)" stroke-width="1.8"></path><path d="M 210 319 L 210 334 L 30 334 L 30 760 L 48 760" fill="none" stroke="var(--color-muted)" stroke-width="1.8" stroke-dasharray="6 5"></path><path d="M 38 764 L 48 760 L 38 756" fill="none" stroke="var(--color-muted)" stroke-width="1.8"></path><rect id="ces-fr-transmission-m-card-low" x="48" y="350" width="350" height="135" rx="5" fill="var(--color-surface)" stroke="var(--color-amber)" stroke-width="1.5"></rect><text data-panel="ces-fr-transmission-m-card-low" x="62" y="379" fill="var(--color-amber)" font-family="l0g CES Households" font-size="19" font-weight="700" text-anchor="start">Revenu incertain, faible</text><text data-panel="ces-fr-transmission-m-card-low" x="62" y="404.08" fill="var(--color-amber)" font-family="l0g CES Households" font-size="19" font-weight="700" text-anchor="start">marge</text><text data-panel="ces-fr-transmission-m-card-low" x="62" y="429.08" fill="var(--color-paper)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">Réserves limitées ; dépenses</text><text data-panel="ces-fr-transmission-m-card-low" x="62" y="451.52" fill="var(--color-paper)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">essentielles prioritaires.</text><path d="M 223 485 L 223 529" fill="none" stroke="var(--color-amber)" stroke-width="1.8" stroke-dasharray="6 5"></path><path d="M 219 519 L 223 529 L 227 519" fill="none" stroke="var(--color-amber)" stroke-width="1.8"></path><rect id="ces-fr-transmission-m-card-cut" x="48" y="530" width="350" height="115" rx="5" fill="var(--color-surface)" stroke="var(--color-amber)" stroke-width="1.5"></rect><text data-panel="ces-fr-transmission-m-card-cut" x="62" y="559" fill="var(--color-amber)" font-family="l0g CES Households" font-size="19" font-weight="700" text-anchor="start">Différer, substituer, réduire</text><text data-panel="ces-fr-transmission-m-card-cut" x="62" y="584" fill="var(--color-paper)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">Volumes d’achats potentiellement</text><text data-panel="ces-fr-transmission-m-card-cut" x="62" y="606.44" fill="var(--color-paper)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">freinés.</text><rect id="ces-fr-transmission-m-card-high" x="48" y="707" width="350" height="135" rx="5" fill="var(--color-surface)" stroke="var(--color-signal)" stroke-width="1.5"></rect><text data-panel="ces-fr-transmission-m-card-high" x="62" y="736" fill="var(--color-signal)" font-family="l0g CES Households" font-size="19" font-weight="700" text-anchor="start">Liquidités et revenu plus sûr</text><text data-panel="ces-fr-transmission-m-card-high" x="62" y="761" fill="var(--color-paper)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">Payer maintenant en conservant une</text><text data-panel="ces-fr-transmission-m-card-high" x="62" y="783.44" fill="var(--color-paper)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">réserve.</text><path d="M 223 842 L 223 886" fill="none" stroke="var(--color-signal)" stroke-width="1.8" stroke-dasharray="6 5"></path><path d="M 219 876 L 223 886 L 227 876" fill="none" stroke="var(--color-signal)" stroke-width="1.8"></path><rect id="ces-fr-transmission-m-card-buy" x="48" y="887" width="350" height="115" rx="5" fill="var(--color-surface)" stroke="var(--color-signal)" stroke-width="1.5"></rect><text data-panel="ces-fr-transmission-m-card-buy" x="62" y="916" fill="var(--color-signal)" font-family="l0g CES Households" font-size="19" font-weight="700" text-anchor="start">Avancer un achat durable</text><text data-panel="ces-fr-transmission-m-card-buy" x="62" y="941" fill="var(--color-paper)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">Une dépense déplacée vers</text><text data-panel="ces-fr-transmission-m-card-buy" x="62" y="963.44" fill="var(--color-paper)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">aujourd’hui.</text><text data-panel="ces-fr-transmission-m-frame" x="22" y="1045" fill="var(--color-paper)" font-family="l0g CES Households" font-size="18" font-weight="700" text-anchor="start">L’effet total dépend de la répartition</text><text data-panel="ces-fr-transmission-m-frame" x="22" y="1068.76" fill="var(--color-paper)" font-family="l0g CES Households" font-size="18" font-weight="700" text-anchor="start">de ces situations.</text><line x1="22" y1="1101" x2="398" y2="1101" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-fr-transmission-m-frame" x="22" y="1120" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">Pointillés : liens conditionnels  /  analyse l0g</text><text data-panel="ces-fr-transmission-m-frame" x="22" y="1142.44" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">/  [S08, S09, S15]</text></svg>
