<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1240" style="width:100%;height:auto" class="l0g-ces-households-svg" role="img" aria-labelledby="ces-fr-budgets-m-title ces-fr-budgets-m-desc"><title id="ces-fr-budgets-m-title">La marge de départ change le résultat</title><desc id="ces-fr-budgets-m-desc">Avec les mêmes taux hypothétiques, le premier budget conserve un surplus ; le second passe en déficit. Deux budgets fictifs, revenu initial de 2 500 €. Dépenses initiales : 2 250 € et 2 475 €. Application illustrative de +1,1 % au revenu et +3,7 % aux dépenses, sans trajectoire mensuelle supposée. Solde = revenu − dépenses. Les variations exactes sont calculées avant arrondi au centime ; axe commun −50 à 300 €. Aucun poids de population ni résultat moyen n’est inféré.</desc><rect id="ces-fr-budgets-m-frame" x="0" y="0" width="420" height="1240" rx="5" fill="var(--color-ink)"></rect><text data-panel="ces-fr-budgets-m-frame" x="22" y="31" fill="var(--color-signal)" font-family="l0g CES Households" font-size="17" font-weight="700" text-anchor="start">l0g / 04</text><line x1="22" y1="45" x2="398" y2="45" stroke="var(--color-line-strong)" stroke-width="1.5"></line><text data-panel="ces-fr-budgets-m-frame" x="22" y="83" fill="var(--color-paper)" font-family="l0g CES Households" font-size="25" font-weight="700" text-anchor="start">La marge de départ</text><text data-panel="ces-fr-budgets-m-frame" x="22" y="116" fill="var(--color-paper)" font-family="l0g CES Households" font-size="25" font-weight="700" text-anchor="start">change le résultat</text><text data-panel="ces-fr-budgets-m-frame" x="22" y="144" fill="var(--color-muted)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">EXEMPLE FICTIF  /  euros par mois</text><text data-panel="ces-fr-budgets-m-frame" x="22" y="206" fill="var(--color-paper)" font-family="l0g CES Households" font-size="17" font-weight="400" text-anchor="start">Revenu : 2 500 € ; +1,1 %. Dépenses :</text><text d