<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="compute-fr-risk-m-title compute-fr-risk-m-desc" viewBox="0 0 420 1140" style="width:100%;height:auto" class="l0g-compute-price-svg"><title id="compute-fr-risk-m-title">Le revenu circule, la garantie décide</title><desc id="compute-fr-risk-m-desc">Schéma conceptuel du revenu client, de l’achat de matériel et du service de dette. Les flèches ne quantifient aucun flux réel. DDTL4.0:plafond8,5milliards,recours limité à la maison mère et couverture1,15sous conditions. DDTL5.5:plafond2,6milliards,garantie CoreWeave,Inc.et couverture1,35sous conditions. Plafonds distincts des soldes tirés.</desc><rect id="compute-fr-risk-m-frame" x="0" y="0" width="420" height="1140" rx="8" fill="var(--color-ink)" stroke="var(--color-line-strong)" stroke-width="1.5"/><text data-panel="compute-fr-risk-m-frame" x="20" y="38" fill="var(--color-paper)" font-family="l0g Compute Price" font-size="22" font-weight="700" text-anchor="start">Le revenu circule,</text><text data-panel="compute-fr-risk-m-frame" x="20" y="67" fill="var(--color-paper)" font-family="l0g Compute Price" font-size="22" font-weight="700" text-anchor="start">la garantie décide</text><text data-panel="compute-fr-risk-m-frame" x="20" y="105" fill="var(--color-muted)" font-family="l0g Compute Price" font-size="18" font-weight="400" text-anchor="start">Flux conceptuels, recours</text><text data-panel="compute-fr-risk-m-frame" x="20" y="128" fill="var(--color-muted)" font-family="l0g Compute Price" font-size="18" font-weight="400" text-anchor="start">contractuels distincts</text><text data-panel="compute-fr-risk-m-frame" x="20" y="149" fill="var(--color-muted)" font-family="l0g Compute Price" font-size="18" font-weight="400" text-anchor="start">Plafonds autorisés · emprunts tirés</text><text data-panel="compute-fr-risk-m-frame" x="20" y="172" fill="var(--color-muted)" font-family="l0g Compute Price" font-size="18" font-weight="400" text-anchor="start">à distinguer<