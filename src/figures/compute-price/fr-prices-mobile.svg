<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="compute-fr-prices-m-title compute-fr-prices-m-desc" viewBox="0 0 420 700" style="width:100%;height:auto" class="l0g-compute-price-svg">
  <title id="compute-fr-prices-m-title">Même GPU, deux prix affichés</title>
  <desc id="compute-fr-prices-m-desc">Deux tarifs simultanés pour une instance nord-américaine à huit GPU HGX H100. Offre à la demande 49,24 dollars par heure; spot 19,71 dollars. Le spot est interruptible. Observation 31 octobre 2026, sans comparaison historique ni revenu réalisé.</desc>
  <rect id="compute-fr-prices-m-frame" x="0" y="0" width="420" height="700" fill="var(--color-ink)"></rect>
  <text data-panel="compute-fr-prices-m-frame" x="22" y="40" fill="var(--color-paper)" font-family="l0g Compute Price" font-size="22" font-weight="400" text-anchor="start">Même GPU,</text>
  <text data-panel="compute-fr-prices-m-frame" x="22" y="70" fill="var(--color-paper)" font-family="l0g Compute Price" font-size="22" font-weight="400" text-anchor="start">deux prix affichés</text>
  <text data-panel="compute-fr-prices-m-frame" x="22" y="116" fill="var(--color-muted)" font-family="l0g Compute Price" font-size="18" font-weight="400" text-anchor="start">CoreWeave · Amérique du Nord</text>
  <text data-panel="compute-fr-prices-m-frame" x="22" y="143" fill="var(--color-muted)" font-family="l0g Compute Price" font-size="18" font-weight="400" text-anchor="start">31 octobre 2026</text>
  <text data-panel="compute-fr-prices-m-frame" x="22" y="181" fill="var(--color-paper)" font-family="l0g Compute Price" font-size="18" font-weight="400" text-anchor="start">HGX H100 × 8 · 8 × 80 GB</text>
  <text data-panel="compute-fr-prices-m-frame" x="22" y="208" fill="var(--color-muted)" font-family="l0g Compute Price" font-size="18" font-weight="400" text-anchor="start">Dollars par heure et par instance</text>
  <line x1="22" y1="234" x2="398" y2="234" stroke="var(--color-line-strong)" stroke-width="0.8"></line>
  <text data-panel="compute-fr-prices-m-frame" x="22" y="270" fill="var(--color-paper)" font-family="l0g Compute Price" font-size="20" font-weight="400" text-anchor="start">À la demande</text>
  <text data-panel="compute-fr-prices-m-frame" x="22" y="315" fill="var(--color-signal)" font-family="l0g Compute Price" font-size="34" font-weight="400" text-anchor="start">49,24 $ / heure</text>
  <rect x="22" y="340" width="366.0" height="8" rx="1" fill="var(--color-signal)" data-metric="instance-price" data-value="49.24"></rect>
  <text data-panel="compute-fr-prices-m-frame" x="22" y="385" fill="var(--color-muted)" font-family="l0g Compute Price" font-size="18" font-weight="400" text-anchor="start">Facturation à l’usage</text>
  <text data-panel="compute-fr-prices-m-frame" x="22" y="445" fill="var(--color-paper)" font-family="l0g Compute Price" font-size="20" font-weight="400" text-anchor="start">Spot / interruptible</text>
  <text data-panel="compute-fr-prices-m-frame" x="22" y="490" fill="var(--color-muted)" font-family="l0g Compute Price" font-size="34" font-weight="400" text-anchor="start">19,71 $ / heure</text>
  <rect x="22" y="515" width="146.504062" height="8" rx="1" fill="var(--color-muted)" data-metric="instance-price" data-value="19.71"></rect>
  <text data-panel="compute-fr-prices-m-frame" x="22" y="560" fill="var(--color-muted)" font-family="l0g Compute Price" font-size="18" font-weight="400" text-anchor="start">Disponibilité interruptible</text>
  <text data-panel="compute-fr-prices-m-frame" x="22" y="620" fill="var(--color-muted)" font-family="l0g Compute Price" font-size="18" font-weight="400" text-anchor="start">Deux offres au même instant</text>
  <text data-panel="compute-fr-prices-m-frame" x="22" y="664" fill="var(--color-muted)" font-family="l0g Compute Price" font-size="18" font-weight="400" text-anchor="start">S05 · CoreWeave · USD / instance-h</text>
</svg>
