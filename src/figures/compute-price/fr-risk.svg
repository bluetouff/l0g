<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="compute-fr-risk-d-title compute-fr-risk-d-desc" viewBox="0 0 1000 680" style="width:100%;height:auto" class="l0g-compute-price-svg"><title id="compute-fr-risk-d-title">Le revenu circule, la garantie décide</title><desc id="compute-fr-risk-d-desc">Schéma conceptuel du revenu client, de l’achat de matériel et du service de dette. Les flèches ne quantifient aucun flux réel. DDTL4.0:plafond8,5milliards,recours limité à la maison mère et couverture1,15sous conditions. DDTL5.5:plafond2,6milliards,garantie CoreWeave,Inc.et couverture1,35sous conditions. Plafonds distincts des soldes tirés.</desc><rect id="compute-fr-risk-d-frame" x="0" y="0" width="1000" height="680" rx="8" fill="var(--color-ink)" stroke="var(--color-line-strong)" stroke-width="1.5"/><text data-panel="compute-fr-risk-d-frame" x="30" y="49" fill="var(--color-paper)" font-family="l0g Compute Price" font-size="32" font-weight="700" text-anchor="start">Le revenu circule, la garantie décide</text><text data-panel="compute-fr-risk-d-frame" x="30" y="95" fill="var(--color-muted)" font-family="l0g Compute Price" font-size="24" font-weight="400" text-anchor="start">Flux conceptuels, recours contractuels distincts</text><text data-panel="compute-fr-risk-d-frame" x="30" y="128" fill="var(--color-muted)" font-family="l0g Compute Price" font-size="24" font-weight="400" text-anchor="start">Plafonds autorisés · emprunts tirés à distinguer</text><rect id="compute-fr-risk-d-card-reserved" x="30" y="180" width="260" height="95" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1.5"/><text data-panel="compute-fr-risk-d-card-reserved" x="48" y="214" fill="var(--color-paper)" font-family="l0g Compute Price" font-size="26" font-weight="700" text-anchor="start">Client réservé</text><text data-panel="compute-fr-risk-d-card-reserved" x="48" y="249" fill="var(--color-paper)" font-family="l0g Compute Price" font-size="24" font-weight