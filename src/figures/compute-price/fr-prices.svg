<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="compute-fr-prices-d-title compute-fr-prices-d-desc" viewBox="0 0 1000 520" style="width:100%;height:auto" class="l0g-compute-price-svg">
  <title id="compute-fr-prices-d-title">Même GPU, deux prix affichés</title>
  <desc id="compute-fr-prices-d-desc">Deux tarifs simultanés pour une instance nord-américaine à huit GPU HGX H100. Offre à la demande 49,24 dollars par heure; spot 19,71 dollars. Le spot est interruptible. Observation 31 octobre 2026, sans comparaison historique ni revenu réalisé.</desc>
  <rect id="compute-fr-prices-d-frame" x="0" y="0" width="1000" height="520" fill="var(--color-ink)"></rect>
  <text data-panel="compute-fr-prices-d-frame" x="36" y="52" fill="var(--color-paper)" font-family="l0g Compute Price" font-size="32" font-weight="400" text-anchor="start">Même GPU, deux prix affichés</text>
  <text data-panel="compute-fr-prices-d-frame" x="36" y="96" fill="var(--color-muted)" font-family="l0g Compute Price" font-size="24" font-weight="400" text-anchor="start">CoreWeave · Amérique du Nord · 31 octobre 2026</text>
  <text data-panel="compute-fr-prices-d-frame" x="36" y="136" fill="var(--color-muted)" font-family="l0g Compute Price" font-size="24" font-weight="400" text-anchor="start">HGX H100 × 8 · 8 × 80 GB · USD / instance-h</text>
  <line x1="36" y1="165" x2="964" y2="165" stroke="var(--color-line-strong)" stroke-width="0.8"></line>
  <text data-panel="compute-fr-prices-d-frame" x="36" y="210" fill="var(--color-paper)" font-family="l0g Compute Price" font-size="26" font-weight="400" text-anchor="start">À la demande</text>
  <text data-panel="compute-fr-prices-d-frame" x="964" y="214" fill="var(--color-signal)" font-family="l0g Compute Price" font-size="40" font-weight="400" text-anchor="end">49,24 $ / heure</text>
  <rect x="36" y="250" width="890.0" height="10" rx="1" fill="var(--color-signal)" data-metric="instance-price" data-value="49.24"></rect>
  <text data-panel="compute-fr-prices-d-frame" x="36" y="298" fill="var(--color-muted)" font-family="l0g Compute Price" font-size="24" font-weight="400" text-anchor="start">Facturation à l’usage</text>
  <text data-panel="compute-fr-prices-d-frame" x="36" y="362" fill="var(--color-paper)" font-family="l0g Compute Price" font-size="26" font-weight="400" text-anchor="start">Spot / interruptible</text>
  <text data-panel="compute-fr-prices-d-frame" x="964" y="366" fill="var(--color-muted)" font-family="l0g Compute Price" font-size="40" font-weight="400" text-anchor="end">19,71 $ / heure</text>
  <rect x="36" y="402" width="356.253046" height="10" rx="1" fill="var(--color-muted)" data-metric="instance-price" data-value="19.71"></rect>
  <text data-panel="compute-fr-prices-d-frame" x="36" y="450" fill="var(--color-muted)" font-family="l0g Compute Price" font-size="24" font-weight="400" text-anchor="start">Disponibilité interruptible</text>
  <text data-panel="compute-fr-prices-d-frame" x="36" y="502" fill="var(--color-muted)" font-family="l0g Compute Price" font-size="24" font-weight="400" text-anchor="start">S05 · CoreWeave · Deux offres au même instant</text>
</svg>
