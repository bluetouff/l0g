<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="compute-en-prices-m-title compute-en-prices-m-desc" viewBox="0 0 420 700" style="width:100%;height:auto" class="l0g-compute-price-svg">
  <title id="compute-en-prices-m-title">Same GPUs, two posted prices</title>
  <desc id="compute-en-prices-m-desc">Two simultaneous North American HGX H100 eight-GPU instance rates:49.24 dollars per hour on demand,19.71 spot. Spot is interruptible. Observed31October2026; not a historical price change or realised revenue.</desc>
  <rect id="compute-en-prices-m-frame" x="0" y="0" width="420" height="700" fill="var(--color-ink)"></rect>
  <text data-panel="compute-en-prices-m-frame" x="22" y="40" fill="var(--color-paper)" font-family="l0g Compute Price" font-size="22" font-weight="400" text-anchor="start">Same GPU,</text>
  <text data-panel="compute-en-prices-m-frame" x="22" y="70" fill="var(--color-paper)" font-family="l0g Compute Price" font-size="22" font-weight="400" text-anchor="start">two quoted prices</text>
  <text data-panel="compute-en-prices-m-frame" x="22" y="116" fill="var(--color-muted)" font-family="l0g Compute Price" font-size="18" font-weight="400" text-anchor="start">CoreWeave · North America</text>
  <text data-panel="compute-en-prices-m-frame" x="22" y="143" fill="var(--color-muted)" font-family="l0g Compute Price" font-size="18" font-weight="400" text-anchor="start">31 October 2026</text>
  <text data-panel="compute-en-prices-m-frame" x="22" y="181" fill="var(--color-paper)" font-family="l0g Compute Price" font-size="18" font-weight="400" text-anchor="start">HGX H100 × 8 · 8 × 80 GB</text>
  <text data-panel="compute-en-prices-m-frame" x="22" y="208" fill="var(--color-muted)" font-family="l0g Compute Price" font-size="18" font-weight="400" text-anchor="start">USD per hour, per instance</text>
  <line x1="22" y1="234" x2="398" y2="234" stroke="var(--color-line-strong)" stroke-width="0.8"></line>
  <text data-panel="compute-en-prices-m-frame" x="22" y="270" fill="var(--color-paper)" font-family="l0g Compute Price" font-size="20" font-weight="400" text-anchor="start">On demand</text>
  <text data-panel="compute-en-prices-m-frame" x="22" y="315" fill="var(--color-signal)" font-family="l0g Compute Price" font-size="34" font-weight="400" text-anchor="start">$49.24 / hour</text>
  <rect x="22" y="340" width="366.0" height="8" rx="1" fill="var(--color-signal)" data-metric="instance-price" data-value="49.24"></rect>
  <text data-panel="compute-en-prices-m-frame" x="22" y="385" fill="var(--color-muted)" font-family="l0g Compute Price" font-size="18" font-weight="400" text-anchor="start">Usage-based billing</text>
  <text data-panel="compute-en-prices-m-frame" x="22" y="445" fill="var(--color-paper)" font-family="l0g Compute Price" font-size="20" font-weight="400" text-anchor="start">Spot / interruptible</text>
  <text data-panel="compute-en-prices-m-frame" x="22" y="490" fill="var(--color-muted)" font-family="l0g Compute Price" font-size="34" font-weight="400" text-anchor="start">$19.71 / hour</text>
  <rect x="22" y="515" width="146.504062" height="8" rx="1" fill="var(--color-muted)" data-metric="instance-price" data-value="19.71"></rect>
  <text data-panel="compute-en-prices-m-frame" x="22" y="560" fill="var(--color-muted)" font-family="l0g Compute Price" font-size="18" font-weight="400" text-anchor="start">Interruptible availability</text>
  <text data-panel="compute-en-prices-m-frame" x="22" y="620" fill="var(--color-muted)" font-family="l0g Compute Price" font-size="18" font-weight="400" text-anchor="start">Two simultaneous offers</text>
  <text data-panel="compute-en-prices-m-frame" x="22" y="664" fill="var(--color-muted)" font-family="l0g Compute Price" font-size="18" font-weight="400" text-anchor="start">S05 · CoreWeave · USD / instance-h</text>
</svg>
