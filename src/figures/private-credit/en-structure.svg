<text data-panel="credit-en-structure-d-card-step-2" x="771" y="229" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="22" font-weight="400" text-anchor="start">Fund units.</text>
<text data-panel="credit-en-structure-d-card-step-2" x="771" y="258" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="22" font-weight="400" text-anchor="start">Cash distributed.</text>
