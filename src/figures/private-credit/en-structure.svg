<text data-panel="credit-en-structure-d-card-step-1" x="368" y="179" fill="var(--color-signal)" font-family="l0g Private Credit" font-size="22" font-weight="700" text-anchor="start">MASTER FUND</text>
<path d="M 381.82 244.2 L 381.82 225.72 L 389.74 225.72 L 389.74 244.2" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
