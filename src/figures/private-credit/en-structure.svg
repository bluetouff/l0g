<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="credit-en-structure-d-title credit-en-structure-d-desc" viewBox="0 0 1000 650" style="width:100%;height:auto" class="l0g-private-credit-svg">
<title id="credit-en-structure-d-title">Two priorities in the chain of rights</title><desc id="credit-en-structure-d-desc">Generic structure: the feeder subscribes for master-fund units. Corporate loans pay interest and principal to the fund. Fund expenses and debt service precede distributions to unit holders. The feeder then receives distributions under contract and pays senior notes, junior notes, then residual equity. An investor may hold several ranks. Flows and priorities are not to scale; no Partners Group terms are assumed. Sources [3, 4].</desc>
<rect id="credit-en-structure-d-frame" x="0" y="0" width="1000" height="650" rx="10" fill="var(--color-ink)"/>
<text data-panel="credit-en-structure-d-frame" x="24" y="30" fill="var(--color-signal)" font-family="l0g Private Credit" font-size="22" font-weight="700" text-anchor="start">01 / PRIVATE CREDIT AND INSURERS</text>
<text data-panel="credit-en-structure-d-frame" x="24" y="72" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="30" font-weight="700" text-anchor="start">Two priorities in the chain of rights</text>
<text data-panel="credit-en-structure-d-frame" x="24" y="108" fill="var(--color-muted)" font-family="l0g Private Credit" font-size="22" font-weight="400" text-anchor="start">Generic structure · feeder holds master-fund units · flows not to scale</text>
<rect id="credit-en-structure-d-card-step-0" x="22" y="146" width="300" height="170" rx="10" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
