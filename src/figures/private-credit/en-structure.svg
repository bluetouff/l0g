<rect id="credit-en-structure-d-card-priority-0" x="22" y="397" width="456" height="135" rx="10" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="credit-en-structure-d-card-priority-0" x="40" y="431" fill="var(--color-amber)" font-family="l0g Private Credit" font-size="22" font-weight="700" text-anchor="start">PRIORITY WITHIN THE FUND</text>
<text data-panel="credit-en-structure-d-card-priority-0" x="40" y="473" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="22" font-weight="400" text-anchor="start">1. Expenses and debt service</text>
<text data-panel="credit-en-structure-d-card-priority-0" x="40" y="505" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="22" font-weight="400" text-anchor="start">2. Residual distribution to units</text>
<rect id="credit-en-structure-d-card-priority-1" x="522" y="397" width="456" height="135" rx="10" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="credit-en-structure-d-card-priority-1" x="540" y="431" fill="var(--color-amber)" font-family="l0g Private Credit" font-size="22" font-weight="700" text-anchor="start">PRIORITY WITHIN THE FEEDER</text>
<text data-panel="credit-en-structure-d-card-priority-1" x="540" y="473" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="22" font-weight="400" text-anchor="start">1. Senior notes → 2. Junior notes</text>
<text data-panel="credit-en-structure-d-card-priority-1" x="540" y="505" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="22" font-weight="400" text-anchor="start">3. Residual equity</text>
<text data-panel="credit-en-structure-d-frame" x="24" y="575" fill="var(--color-muted)" font-family="l0g Private Credit" font-size="22" font-weight="400" text-anchor="start">An investor may hold several ranks. Each priority belongs to its own entity.</text>
<text data-panel="credit-en-structure-d-frame" x="24" y="604" fill="var(--color-muted)" font-family="l0g Private Credit" font-size="22" font-weight="400" text-anchor="start">Senior rank in the feeder applies after the master fund’s obligations.</text>
<text data-panel="credit-en-structure-d-frame" x="24" y="633" fill="var(--color-muted)" font-family="l0g Private Credit" font-size="22" font-weight="400" text-anchor="start">S&amp;P Global, 25 September 2026; Fitch, 24 September 2025 [3, 4].</text>
