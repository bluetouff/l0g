<text data-panel="credit-en-structure-d-card-step-2" x="696" y="179" fill="var(--color-signal)" font-family="l0g Private Credit" font-size="22" font-weight="700" text-anchor="start">FEEDER</text>
<path d="M 708.5 213.84 L 732.92 213.84 L 741.5 222.42 L 741.5 248.16 L 708.5 248.16 L 708.5 213.84" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
