<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="credit-en-capital-d-title credit-en-capital-d-desc" viewBox="0 0 1000 650" style="width:100%;height:auto" class="l0g-private-credit-svg">
<title id="credit-en-capital-d-title">Three decisions before the calculation</title><desc id="credit-en-capital-d-desc">Three decisions: classify the debt under SSAP 26 and INT 24-01, designate credit risk under the applicable SVO-manual route, apply the portfolio capital formula. Selected pre-tax Life/Fraternal year-end 2026 factors, non-CLO/CBO/CDO column: 1.A 0.158%, 1.G 1.016%, 2.B 1.523%, 2.C 2.168%, 3.B 4.537%. Zero-to-5% axis. Example: US$100 million adjusted carrying value times 1.523% equals US$1.523 million before other adjustments and aggregation. No designation of Partners Group notes is assumed. NAIC sources [6, 7, 8, 9].</desc>
<rect id="credit-en-capital-d-frame" x="0" y="0" width="1000" height="650" rx="10" fill="var(--color-ink)"/>
<text data-panel="credit-en-capital-d-frame" x="24" y="30" fill="var(--color-signal)" font-family="l0g Private Credit" font-size="22" font-weight="700" text-anchor="start">03 / PRIVATE CREDIT AND INSURERS</text>
<text data-panel="credit-en-capital-d-frame" x="24" y="72" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="30" font-weight="700" text-anchor="start">Three decisions before the calculation</text>
<rect id="credit-en-capital-d-card-decision-0" x="22" y="132" width="300" height="149" rx="10" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="credit-en-capital-d-card-decision-0" x="38" y="161" fill="var(--color-signal)" font-family="l0g Private Credit" font-size="22" font-weight="700" text-anchor="start">1. CLASSIFY</text>
<text data-panel="credit-en-capital-d-card-decision-0" x="38" y="190" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="22" font-weight="400" text-anchor="start">Creditor relationship,</text>
<text data-panel="credit-en-capital-d-card-decision-0" x="38" y="218" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="22" font-weight="400" text-anchor="start">substantive protection.</text>
<text data-panel="credit-en-capital-d-card-decision-0" x="38" y="269" fill="var(--color-muted)" font-family="l0g Private Credit" font-size="22" font-weight="400" text-anchor="start">SSAP 26 / INT 24-01</text>
<path d="M 324 207 L 344 207" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 336.0000 211.4000 L 344 207 L 336.0000 202.6000" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
