<text data-panel="credit-en-capital-d-card-decision-2" x="694" y="161" fill="var(--color-signal)" font-family="l0g Private Credit" font-size="22" font-weight="700" text-anchor="start">3. CALCULATE</text>
<text data-panel="credit-en-capital-d-card-decision-2" x="694" y="190" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="22" font-weight="400" text-anchor="start">Category and value,</text>
