<text data-panel="credit-en-capital-d-card-decision-1" x="366" y="161" fill="var(--color-signal)" font-family="l0g Private Credit" font-size="22" font-weight="700" text-anchor="start">2. DESIGNATE</text>
<text data-panel="credit-en-capital-d-card-decision-1" x="366" y="190" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="22" font-weight="400" text-anchor="start">Eligibility, rating and</text>
<text data-panel="credit-en-capital-d-card-decision-1" x="366" y="218" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="22" font-weight="400" text-anchor="start">applicable review route.</text>
<text data-panel="credit-en-capital-d-card-decision-1" x="366" y="269" fill="var(--color-muted)" font-family="l0g Private Credit" font-size="22" font-weight="400" text-anchor="start">SVO P&amp;P Manual</text>
<path d="M 652 207 L 672 207" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 664.0000 211.4000 L 672 207 L 664.0000 202.6000" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
