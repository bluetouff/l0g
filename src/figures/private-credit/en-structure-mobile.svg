<path d="M 206.1500 355.0000 L 210 362 L 213.8500 355.0000" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 210 675 L 210 718" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 206.1500 711.0000 L 210 718 L 213.8500 711.0000" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 18 878 L 7 878 L 7 429 L 18 429" fill="none" stroke="var(--color-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/>
<path d="M 11.0000 432.8500 L 18 429 L 11.0000 425.1500" fill="none" stroke="var(--color-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text data-panel="credit-en-structure-m-frame" x="24" y="1080" fill="var(--color-muted)" font-family="l0g Private Credit" font-size="17" font-weight="400" text-anchor="start">Mint: receipts and distributions.</text>
<text data-panel="credit-en-structure-m-frame" x="24" y="1106" fill="var(--color-muted)" font-family="l0g Private Credit" font-size="17" font-weight="400" text-anchor="start">Rose: feeder subscription for fund units.</text>
<text data-panel="credit-en-structure-m-frame" x="24" y="1132" fill="var(--color-muted)" font-family="l0g Private Credit" font-size="17" font-weight="400" text-anchor="start">An investor may hold several ranks.</text>
<text data-panel="credit-en-structure-m-frame" x="24" y="1158" fill="var(--color-muted)" font-family="l0g Private Credit" font-size="17" font-weight="400" text-anchor="start">Senior priority in the feeder applies</text>
<text data-panel="credit-en-structure-m-frame" x="24" y="1184" fill="var(--color-muted)" font-family="l0g Private Credit" font-size="17" font-weight="400" text-anchor="start">after the master fund’s obligations.</text>
<text data-panel="credit-en-structure-m-frame" x="24" y="1210" fill="var(--color-muted)" font-family="l0g Private Credit" font-size="17" font-weight="400" text-anchor="start">S&amp;P Global, 2026; Fitch, 2025 [3, 4].</text>
