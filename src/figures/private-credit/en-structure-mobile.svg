<path d="M 48.3 795.9 L 58.2 795.9" fill="none" stroke="var(--color-line-strong)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text data-panel="credit-en-structure-m-card-step-2" x="95" y="761" fill="var(--color-signal)" font-family="l0g Private Credit" font-size="17" font-weight="700" text-anchor="start">FEEDER</text>
<text data-panel="credit-en-structure-m-card-step-2" x="95" y="794" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="17" font-weight="400" text-anchor="start">Assets: master-fund units.</text>
<text data-panel="credit-en-structure-m-card-step-2" x="95" y="819" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="17" font-weight="400" text-anchor="start">Cash after fund obligations.</text>
<text data-panel="credit-en-structure-m-card-step-2" x="32" y="878" fill="var(--color-amber)" font-family="l0g Private Credit" font-size="17" font-weight="700" text-anchor="start">PRIORITY WITHIN THE FEEDER</text>
<text data-panel="credit-en-structure-m-card-step-2" x="32" y="915" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="17" font-weight="400" text-anchor="start">1. Senior notes</text>
<text data-panel="credit-en-structure-m-card-step-2" x="32" y="945" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="17" font-weight="400" text-anchor="start">2. Junior notes</text>
<text data-panel="credit-en-structure-m-card-step-2" x="32" y="975" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="17" font-weight="400" text-anchor="start">3. Residual equity</text>
