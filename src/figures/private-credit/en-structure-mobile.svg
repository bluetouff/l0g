<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="credit-en-structure-m-title credit-en-structure-m-desc" viewBox="0 0 420 1240" style="width:100%;height:auto" class="l0g-private-credit-svg">
<title id="credit-en-structure-m-title">Two priorities in the chain of rights</title><desc id="credit-en-structure-m-desc">Generic structure: the feeder subscribes for master-fund units. Corporate loans pay interest and principal to the fund. Fund expenses and debt service precede distributions to unit holders. The feeder then receives distributions under contract and pays senior notes, junior notes, then residual equity. An investor may hold several ranks. Flows and priorities are not to scale; no Partners Group terms are assumed. Sources [3, 4].</desc>
<rect id="credit-en-structure-m-frame" x="0" y="0" width="420" height="1240" rx="10" fill="var(--color-ink)"/>
<text data-panel="credit-en-structure-m-frame" x="20" y="30" fill="var(--color-signal)" font-family="l0g Private Credit" font-size="17" font-weight="700" text-anchor="start">01 / PRIVATE CREDIT AND INSURERS</text>
<text data-panel="credit-en-structure-m-frame" x="20" y="65" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="22" font-weight="700" text-anchor="start">Two priorities in</text>
<text data-panel="credit-en-structure-m-frame" x="20" y="93" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="22" font-weight="700" text-anchor="start">the chain of rights</text>
<text data-panel="credit-en-structure-m-frame" x="24" y="130" fill="var(--color-muted)" font-family="l0g Private Credit" font-size="17" font-weight="400" text-anchor="start">The feeder holds master-fund units.</text>
<text data-panel="credit-en-structure-m-frame" x="24" y="155" fill="var(--color-muted)" font-family="l0g Private Credit" font-size="17" font-weight="400" text-anchor="start">Generic drawing, not to scale.</text>
<rect id="credit-en-structure-m-card-step-0" x="16" y="185" width="388" height="145" rx="10" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<path d="M 40.6 255.0 L 40.6 241.8 L 51.6 235.75 L 51.6 241.8 L 62.6 235.75 L 62.6 255.0 L 40.6 255.0" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 66.45 255.0 L 66.45 230.8 L 71.95 230.8 L 71.95 255.0" fill="none" stroke="var(--color-amber)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 37.85 258.3 L 74.7 258.3" fill="none" stroke="var(--color-line-strong)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text data-panel="credit-en-structure-m-card-step-0" x="95" y="219" fill="var(--color-signal)" font-family="l0g Private Credit" font-size="17" font-weight="700" text-anchor="start">CORPORATE LOANS</text>
<text data-panel="credit-en-structure-m-card-step-0" x="95" y="252" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="17" font-weight="400" text-anchor="start">Interest and principal received</text>
<text data-panel="credit-en-structure-m-card-step-0" x="95" y="277" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="17" font-weight="400" text-anchor="start">by the master fund.</text>
<rect id="credit-en-structure-m-card-step-1" x="16" y="368" width="388" height="305" rx="10" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<path d="M 43.35 438.0 L 43.35 422.6 L 49.95 422.6 L 49.95 438.0" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
