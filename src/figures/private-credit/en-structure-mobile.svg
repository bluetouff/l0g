<path d="M 62.05 438.0 L 62.05 422.6 L 68.65 422.6 L 68.65 438.0" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 38.95 417.65 L 56.0 409.95 L 73.05 417.65 L 38.95 417.65" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 37.3 441.85 L 74.7 441.85" fill="none" stroke="var(--color-line-strong)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text data-panel="credit-en-structure-m-card-step-1" x="95" y="402" fill="var(--color-signal)" font-family="l0g Private Credit" font-size="17" font-weight="700" text-anchor="start">MASTER FUND</text>
<text data-panel="credit-en-structure-m-card-step-1" x="95" y="435" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="17" font-weight="400" text-anchor="start">Loan portfolio; reserves and</text>
<text data-panel="credit-en-structure-m-card-step-1" x="95" y="460" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="17" font-weight="400" text-anchor="start">distributions under contract.</text>
<text data-panel="credit-en-structure-m-card-step-1" x="32" y="519" fill="var(--color-amber)" font-family="l0g Private Credit" font-size="17" font-weight="700" text-anchor="start">PRIORITY WITHIN THE FUND</text>
<text data-panel="credit-en-structure-m-card-step-1" x="32" y="556" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="17" font-weight="400" text-anchor="start">1. Expenses and debt service</text>
<text data-panel="credit-en-structure-m-card-step-1" x="32" y="586" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="17" font-weight="400" text-anchor="start">2. Residual distribution to units</text>
<rect id="credit-en-structure-m-card-step-2" x="16" y="727" width="388" height="305" rx="10" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
