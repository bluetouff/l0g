<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="credit-fr-capital-d-title credit-fr-capital-d-desc" viewBox="0 0 1000 650" style="width:100%;height:auto" class="l0g-private-credit-svg">
<title id="credit-fr-capital-d-title">Trois décisions avant le calcul</title><desc id="credit-fr-capital-d-desc">Trois décisions : qualifier la créance selon SSAP 26 et INT 24-01, désigner le risque selon la voie applicable du manuel SVO, appliquer la formule de capital au portefeuille. Facteurs sélectionnés Life/Fraternal avant fiscalité, arrêté 2026, colonne hors CLO/CBO/CDO : 1.A 0,158 %, 1.G 1,016 %, 2.B 1,523 %, 2.C 2,168 %, 3.B 4,537 %. Axe zéro à 5 %. Exemple : 100 millions de dollars de valeur comptable ajustée multipliés par 1,523 % donnent 1,523 million avant les autres ajustements et l’agrégation. Aucune désignation des notes Partners Group présumée. Sources NAIC [6, 7, 8, 9].</desc>
<rect id="credit-fr-capital-d-frame" x="0" y="0" width="1000" height="650" rx="10" fill="var(--color-ink)"/>
<text data-panel="credit-fr-capital-d-frame" x="24" y="30" fill="var(--color-signal)" font-family="l0g Private Credit" font-size="22" font-weight="700" text-anchor="start">03 / CRÉDIT PRIVÉ ET ASSUREURS</text>
<text data-panel="credit-fr-capital-d-frame" x="24" y="72" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="30" font-weight="700" text-anchor="start">Trois décisions avant le calcul</text>
<rect id="credit-fr-capital-d-card-decision-0" x="22" y="132" width="300" height="149" rx="10" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="credit-fr-capital-d-card-decision-0" x="38" y="161" fill="var(--color-signal)" font-family="l0g Private Credit" font-size="22" font-weight="700" text-anchor="start">1. QUALIFIER</text>
<text data-panel="credit-fr-capital-d-card-decision-0" x="38" y="190" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="22" font-weight="400" text-anchor="start">Relation de créancier,</text>
<text data-panel="credit-fr-capital-d-card-decision-0" x="38" y="218" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="22" font-weight="400" text-anchor="start">protection substantielle.</text>
<text data-panel="credit-fr-capital-d-card-decision-0" x="38" y="269" fill="var(--color-muted)" font-family="l0g Private Credit" font-size="22" font-weight="400" text-anchor="start">SSAP 26 / INT 24-01</text>
<path d="M 324 207 L 344 207" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 336.0000 211.4000 L 344 207 L 336.0000 202.6000" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect id="credit-fr-capital-d-card-decision-1" x="350" y="132" width="300" height="149" rx="10" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="credit-fr-capital-d-card-decision-1" x="366" y="161" fill="var(--color-signal)" font-family="l0g Private Credit" font-size="22" font-weight="700" text-anchor="start">2. DÉSIGNER</text>
<text data-panel="credit-fr-capital-d-card-decision-1" x="366" y="190" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="22" font-weight="400" text-anchor="start">Éligibilité, notation,</text>
<text data-panel="credit-fr-capital-d-card-decision-1" x="366" y="218" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="22" font-weight="400" text-anchor="start">examen selon la voie.</text>
<text data-panel="credit-fr-capital-d-card-decision-1" x="366" y="269" fill="var(--color-muted)" font-family="l0g Private Credit" font-size="22" font-weight="400" text-anchor="start">SVO P&amp;P Manual</text>
<path d="M 652 207 L 672 207" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 664.0000 211.4000 L 672 207 L 664.0000 202.6000" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect id="credit-fr-capital-d-card-decision-2" x="678" y="132" width="300" height="149" rx="10" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="credit-fr-capital-d-card-decision-2" x="694" y="161" fill="var(--color-signal)" font-family="l0g Private Credit" font-size="22" font-weight="700" text-anchor="start">3. CALCULER</text>
<text data-panel="credit-fr-capital-d-card-decision-2" x="694" y="190" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="22" font-weight="400" text-anchor="start">Catégorie et valeur,</text>
