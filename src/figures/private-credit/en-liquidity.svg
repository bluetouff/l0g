<text data-panel="credit-en-liquidity-d-card-measure-2" x="695" y="299" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="22" font-weight="400" text-anchor="start">specific to the notes.</text>
<text data-panel="credit-en-liquidity-d-frame" x="24" y="389" fill="var(--color-muted)" font-family="l0g Private Credit" font-size="22" font-weight="400" text-anchor="start">A conditional reserve or facility can bridge a gap; drawings remain repayable.</text>
<text data-panel="credit-en-liquidity-d-frame" x="24" y="418" fill="var(--color-muted)" font-family="l0g Private Credit" font-size="22" font-weight="400" text-anchor="start">Deferring redemption retains fund cash and extends the investor’s wait.</text>
<text data-panel="credit-en-liquidity-d-frame" x="24" y="465" fill="var(--color-amber)" font-family="l0g Private Credit" font-size="22" font-weight="700" text-anchor="start">AT THE INSURER</text>
