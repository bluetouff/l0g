<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="credit-en-liquidity-d-title credit-en-liquidity-d-desc" viewBox="0 0 1000 650" style="width:100%;height:auto" class="l0g-private-credit-svg">
<title id="credit-en-liquidity-d-title">Getting cash there on time</title><desc id="credit-en-liquidity-d-desc">Unit NAV is an estimate at a given date. Feeder cash comes from distributions and contractually permitted redemptions; it pays note interest and principal on their own schedule. A reserve or facility can bridge a mismatch under conditions; drawings remain repayable. Deferring redemption retains fund cash and prolongs investors’ wait. At the insurer, asset inflows and liquid reserves meet annuities, claims, redemptions and margin calls. Dates, amounts and currencies must be matched. Qualitative diagram; contractual safeguards vary. Fitch [4], FSB [13], IAIS [14].</desc>
<rect id="credit-en-liquidity-d-frame" x="0" y="0" width="1000" height="650" rx="10" fill="var(--color-ink)"/>
<text data-panel="credit-en-liquidity-d-frame" x="24" y="30" fill="var(--color-signal)" font-family="l0g Private Credit" font-size="22" font-weight="700" text-anchor="start">04 / PRIVATE CREDIT AND INSURERS</text>
<text data-panel="credit-en-liquidity-d-frame" x="24" y="72" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="30" font-weight="700" text-anchor="start">Getting cash there on time</text>
<rect id="credit-en-liquidity-d-card-measure-0" x="22" y="136" width="300" height="218" rx="10" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="credit-en-liquidity-d-card-measure-0" x="39" y="167" fill="var(--color-signal)" font-family="l0g Private Credit" font-size="22" font-weight="700" text-anchor="start">VALUE OF THE UNITS</text>
<text data-panel="credit-en-liquidity-d-card-measure-0" x="39" y="203" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="22" font-weight="400" text-anchor="start">Fund net asset value</text>
<text data-panel="credit-en-liquidity-d-card-measure-0" x="39" y="235" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="22" font-weight="400" text-anchor="start">× ownership share</text>
<text data-panel="credit-en-liquidity-d-card-measure-0" x="39" y="267" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="22" font-weight="400" text-anchor="start">= NAV of fund units</text>
<text data-panel="credit-en-liquidity-d-card-measure-0" x="39" y="299" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="22" font-weight="400" text-anchor="start">Estimate at a given date.</text>
<rect id="credit-en-liquidity-d-card-measure-1" x="350" y="136" width="300" height="218" rx="10" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="credit-en-liquidity-d-card-measure-1" x="367" y="167" fill="var(--color-signal)" font-family="l0g Private Credit" font-size="22" font-weight="700" text-anchor="start">CASH RECEIVED</text>
<text data-panel="credit-en-liquidity-d-card-measure-1" x="367" y="203" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="22" font-weight="400" text-anchor="start">Distributions and</text>
<text data-panel="credit-en-liquidity-d-card-measure-1" x="367" y="235" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="22" font-weight="400" text-anchor="start">permitted redemptions.</text>
<text data-panel="credit-en-liquidity-d-card-measure-1" x="367" y="267" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="22" font-weight="400" text-anchor="start">Cash held by the feeder.</text>
<text data-panel="credit-en-liquidity-d-card-measure-1" x="367" y="299" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="22" font-weight="400" text-anchor="start">Redemptions may wait.</text>
<path d="M 652 241 L 672 241" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 664.0000 245.4000 L 672 241 L 664.0000 236.6000" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect id="credit-en-liquidity-d-card-measure-2" x="678" y="136" width="300" height="218" rx="10" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="credit-en-liquidity-d-card-measure-2" x="695" y="167" fill="var(--color-accent)" font-family="l0g Private Credit" font-size="22" font-weight="700" text-anchor="start">CASH DUE</text>
<text data-panel="credit-en-liquidity-d-card-measure-2" x="695" y="203" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="22" font-weight="400" text-anchor="start">Contractual interest.</text>
<text data-panel="credit-en-liquidity-d-card-measure-2" x="695" y="235" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="22" font-weight="400" text-anchor="start">Principal at maturity.</text>
