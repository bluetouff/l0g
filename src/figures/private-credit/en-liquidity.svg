<text data-panel="credit-en-liquidity-d-card-insurer-1" x="367" y="510" fill="var(--color-amber)" font-family="l0g Private Credit" font-size="22" font-weight="700" text-anchor="start">LIQUID BUFFER</text>
<text data-panel="credit-en-liquidity-d-card-insurer-1" x="367" y="537" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="22" font-weight="400" text-anchor="start">Cash and readily</text>
<text data-panel="credit-en-liquidity-d-card-insurer-1" x="367" y="564" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="22" font-weight="400" text-anchor="start">available liquid assets.</text>
<path d="M 653 533 L 672 533" fill="none" stroke="var(--color-amber)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 664.0000 537.4000 L 672 533 L 664.0000 528.6000" fill="none" stroke="var(--color-amber)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect id="credit-en-liquidity-d-card-insurer-2" x="678" y="483" width="300" height="99" rx="10" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="credit-en-liquidity-d-card-insurer-2" x="695" y="510" fill="var(--color-amber)" font-family="l0g Private Credit" font-size="22" font-weight="700" text-anchor="start">OBLIGATIONS</text>
<text data-panel="credit-en-liquidity-d-card-insurer-2" x="695" y="537" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="22" font-weight="400" text-anchor="start">Annuities, claims,</text>
<text data-panel="credit-en-liquidity-d-card-insurer-2" x="695" y="564" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="22" font-weight="400" text-anchor="start">redemptions, margins.</text>
<text data-panel="credit-en-liquidity-d-frame" x="24" y="613" fill="var(--color-muted)" font-family="l0g Private Credit" font-size="22" font-weight="400" text-anchor="start">Match dates, amounts and currencies. Qualitative; safeguards vary by contract.</text>
<text data-panel="credit-en-liquidity-d-frame" x="24" y="639" fill="var(--color-muted)" font-family="l0g Private Credit" font-size="22" font-weight="400" text-anchor="start">Fitch, 2025; FSB, 2026; IAIS, 2025 [4, 13, 14].</text>
