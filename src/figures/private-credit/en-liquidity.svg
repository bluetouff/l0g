<text data-panel="credit-en-liquidity-d-card-insurer-0" x="39" y="510" fill="var(--color-amber)" font-family="l0g Private Credit" font-size="22" font-weight="700" text-anchor="start">ASSET INFLOWS</text>
<text data-panel="credit-en-liquidity-d-card-insurer-0" x="39" y="537" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="22" font-weight="400" text-anchor="start">Income from the</text>
