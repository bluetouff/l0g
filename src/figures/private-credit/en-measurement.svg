<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="credit-en-measurement-d-title credit-en-measurement-d-desc" viewBox="0 0 1000 650" style="width:100%;height:auto" class="l0g-private-credit-svg">
<title id="credit-en-measurement-d-title">Broad exposure, structures to identify</title><desc id="credit-en-measurement-d-desc">US insurers at year-end 2025, US$ billion book/adjusted carrying value, NAIC scope after identifiable overlap removal: privately rated bonds 512; BDCs and private-credit funds 32; other private placements 580; bank loans 44; middle-market CLOs 42; total 1210. The first two categories sum to 544. Zero-to-600-billion axis. The total uses a broad private-credit definition; feeders require separate identification. It is a year-end 2025 stock, distinct from Partners Group’s US$510 million capital raise announced in October 2026. Sources [1, 12].</desc>
<rect id="credit-en-measurement-d-frame" x="0" y="0" width="1000" height="650" rx="10" fill="var(--color-ink)"/>
<text data-panel="credit-en-measurement-d-frame" x="24" y="30" fill="var(--color-signal)" font-family="l0g Private Credit" font-size="22" font-weight="700" text-anchor="start">05 / PRIVATE CREDIT AND INSURERS</text>
<text data-panel="credit-en-measurement-d-frame" x="24" y="72" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="30" font-weight="700" text-anchor="start">Broad exposure, structures to identify</text>
<text data-panel="credit-en-measurement-d-frame" x="24" y="108" fill="var(--color-muted)" font-family="l0g Private Credit" font-size="22" font-weight="400" text-anchor="start">US insurers · year-end 2025</text>
