<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="credit-en-liquidity-m-title credit-en-liquidity-m-desc" viewBox="0 0 420 1350" style="width:100%;height:auto" class="l0g-private-credit-svg">
<title id="credit-en-liquidity-m-title">Getting cash there on time</title><desc id="credit-en-liquidity-m-desc">Unit NAV is an estimate at a given date. Feeder cash comes from distributions and contractually permitted redemptions; it pays note interest and principal on their own schedule. A reserve or facility can bridge a mismatch under conditions; drawings remain repayable. Deferring redemption retains fund cash and prolongs investors’ wait. At the insurer, asset inflows and liquid reserves meet annuities, claims, redemptions and margin calls. Dates, amounts and currencies must be matched. Qualitative diagram; contractual safeguards vary. Fitch [4], FSB [13], IAIS [14].</desc>
