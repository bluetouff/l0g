<text data-panel="credit-fr-measurement-m-frame" x="20" y="30" fill="var(--color-signal)" font-family="l0g Private Credit" font-size="17" font-weight="700" text-anchor="start">05 / CRÉDIT PRIVÉ ET ASSUREURS</text>
