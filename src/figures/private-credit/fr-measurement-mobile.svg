<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="credit-fr-measurement-m-title credit-fr-measurement-m-desc" viewBox="0 0 420 1255" style="width:100%;height:auto" class="l0g-private-credit-svg">
<title id="credit-fr-measurement-m-title">Une exposition large, des structures à identifier</title><desc id="credit-fr-measurement-m-desc">Assureurs américains fin 2025, milliards de dollars de valeur comptable ajustée, périmètre NAIC après retrait des recoupements identifiables : obligations notées à titre privé 512 ; BDC et fonds de crédit privé 32 ; autres placements privés 580 ; prêts bancaires 44 ; CLO de prêts aux entreprises moyennes 42 ; total 1210. Les deux premières catégories totalisent 544. Axe zéro à 600 milliards. Le total couvre une définition large du crédit privé ; les feeders nécessitent une identification propre. C’est un stock fin 2025, distinct de la collecte Partners Group 510 millions annoncée en octobre 2026. Sources [1, 12].</desc>
