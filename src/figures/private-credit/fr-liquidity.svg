<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="credit-fr-liquidity-d-title credit-fr-liquidity-d-desc" viewBox="0 0 1000 650" style="width:100%;height:auto" class="l0g-private-credit-svg">
<title id="credit-fr-liquidity-d-title">Faire arriver le cash au bon moment</title><desc id="credit-fr-liquidity-d-desc">La NAV des parts est une estimation à une date donnée. Le cash du feeder provient des distributions et rachats autorisés par contrat ; il paie intérêts et principal selon les notes. Une réserve ou facilité peut couvrir un décalage sous conditions ; les tirages restent remboursables. Reporter un rachat conserve le cash du fonds et prolonge l’attente de l’investisseur. Chez l’assureur, flux de tous actifs et réserves liquides se confrontent aux rentes, prestations, rachats et appels de marge. Dates, montants et devises doivent être rapprochés. Schéma qualitatif, garanties propres au contrat. Fitch [4], FSB [13], IAIS [14].</desc>
<rect id="credit-fr-liquidity-d-frame" x="0" y="0" width="1000" height="650" rx="10" fill="var(--color-ink)"/>
<text data-panel="credit-fr-liquidity-d-frame" x="24" y="30" fill="var(--color-signal)" font-family="l0g Private Credit" font-size="22" font-weight="700" text-anchor="start">04 / CRÉDIT PRIVÉ ET ASSUREURS</text>
<text data-panel="credit-fr-liquidity-d-frame" x="24" y="72" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="30" font-weight="700" text-anchor="start">Faire arriver le cash au bon moment</text>
<rect id="credit-fr-liquidity-d-card-measure-0" x="22" y="136" width="300" height="218" rx="10" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="credit-fr-liquidity-d-card-measure-0" x="39" y="167" fill="var(--color-signal)" font-family="l0g Private Credit" font-size="22" font-weight="700" text-anchor="start">VALEUR DES PARTS</text>
<text data-panel="credit-fr-liquidity-d-card-measure-0" x="39" y="203" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="22" font-weight="400" text-anchor="start">Actif net du fonds</text>
<text data-panel="credit-fr-liquidity-d-card-measure-0" x="39" y="235" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="22" font-weight="400" text-anchor="start">× quote-part détenue</text>
<text data-panel="credit-fr-liquidity-d-card-measure-0" x="39" y="267" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="22" font-weight="400" text-anchor="start">= NAV des parts</text>
<text data-panel="credit-fr-liquidity-d-card-measure-0" x="39" y="299" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="22" font-weight="400" text-anchor="start">Estimation à une date.</text>
<rect id="credit-fr-liquidity-d-card-measure-1" x="350" y="136" width="300" height="218" rx="10" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="credit-fr-liquidity-d-card-measure-1" x="367" y="167" fill="var(--color-signal)" font-family="l0g Private Credit" font-size="22" font-weight="700" text-anchor="start">CASH REÇU</text>
<text data-panel="credit-fr-liquidity-d-card-measure-1" x="367" y="203" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="22" font-weight="400" text-anchor="start">Distributions et rachats</text>
<text data-panel="credit-fr-liquidity-d-card-measure-1" x="367" y="235" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="22" font-weight="400" text-anchor="start">autorisés par contrat.</text>
<text data-panel="credit-fr-liquidity-d-card-measure-1" x="367" y="267" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="22" font-weight="400" text-anchor="start">Trésorerie du feeder.</text>
