<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="credit-fr-capital-m-title credit-fr-capital-m-desc" viewBox="0 0 420 1260" style="width:100%;height:auto" class="l0g-private-credit-svg">
<title id="credit-fr-capital-m-title">Trois décisions avant le calcul</title><desc id="credit-fr-capital-m-desc">Trois décisions : qualifier la créance selon SSAP 26 et INT 24-01, désigner le risque selon la voie applicable du manuel SVO, appliquer la formule de capital au portefeuille. Facteurs sélectionnés Life/Fraternal avant fiscalité, arrêté 2026, colonne hors CLO/CBO/CDO : 1.A 0,158 %, 1.G 1,016 %, 2.B 1,523 %, 2.C 2,168 %, 3.B 4,537 %. Axe zéro à 5 %. Exemple : 100 millions de dollars de valeur comptable ajustée multipliés par 1,523 % donnent 1,523 million avant les autres ajustements et l’agrégation. Aucune désignation des notes Partners Group présumée. Sources NAIC [6, 7, 8, 9].</desc>
<rect id="credit-fr-capital-m-frame" x="0" y="0" width="420" height="1260" rx="10" fill="var(--color-ink)"/>
<text data-panel="credit-fr-capital-m-frame" x="20" y="30" fill="var(--color-signal)" font-family="l0g Private Credit" font-size="17" font-weight="700" text-anchor="start">03 / CRÉDIT PRIVÉ ET ASSUREURS</text>
<text data-panel="credit-fr-capital-m-frame" x="20" y="65" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="22" font-weight="700" text-anchor="start">Trois décisions</text>
<text data-panel="credit-fr-capital-m-frame" x="20" y="93" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="22" font-weight="700" text-anchor="start">avant le calcul</text>
<rect id="credit-fr-capital-m-card-decision-0" x="16" y="143" width="388" height="117" rx="10" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="credit-fr-capital-m-card-decision-0" x="32" y="172" fill="var(--color-signal)" font-family="l0g Private Credit" font-size="17" font-weight="700" text-anchor="start">1. QUALIFIER</text>
<text data-panel="credit-fr-capital-m-card-decision-0" x="32" y="201" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="17" font-weight="400" text-anchor="start">Relation de créancier,</text>
<text data-panel="credit-fr-capital-m-card-decision-0" x="32" y="224" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="17" font-weight="400" text-anchor="start">protection substantielle.</text>
<text data-panel="credit-fr-capital-m-card-decision-0" x="32" y="248" fill="var(--color-muted)" font-family="l0g Private Credit" font-size="17" font-weight="400" text-anchor="start">SSAP 26 / INT 24-01</text>
<rect id="credit-fr-capital-m-card-decision-1" x="16" y="275" width="388" height="117" rx="10" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="credit-fr-capital-m-card-decision-1" x="32" y="304" fill="var(--color-signal)" font-family="l0g Private Credit" font-size="17" font-weight="700" text-anchor="start">2. DÉSIGNER</text>
<text data-panel="credit-fr-capital-m-card-decision-1" x="32" y="333" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="17" font-weight="400" text-anchor="start">Éligibilité, notation,</text>
<text data-panel="credit-fr-capital-m-card-decision-1" x="32" y="356" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="17" font-weight="400" text-anchor="start">examen selon la voie.</text>
<text data-panel="credit-fr-capital-m-card-decision-1" x="32" y="380" fill="var(--color-muted)" font-family="l0g Private Credit" font-size="17" font-weight="400" text-anchor="start">SVO P&amp;P Manual</text>
<rect id="credit-fr-capital-m-card-decision-2" x="16" y="407" width="388" height="117" rx="10" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="credit-fr-capital-m-card-decision-2" x="32" y="436" fill="var(--color-signal)" font-family="l0g Private Credit" font-size="17" font-weight="700" text-anchor="start">3. CALCULER</text>
<text data-panel="credit-fr-capital-m-card-decision-2" x="32" y="465" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="17" font-weight="400" text-anchor="start">Catégorie et valeur,</text>
<text data-panel="credit-fr-capital-m-card-decision-2" x="32" y="488" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="17" font-weight="400" text-anchor="start">risques agrégés.</text>
<text data-panel="credit-fr-capital-m-card-decision-2" x="32" y="512" fill="var(--color-muted)" font-family="l0g Private Credit" font-size="17" font-weight="400" text-anchor="start">Life / Fraternal RBC</text>
<text data-panel="credit-fr-capital-m-frame" x="24" y="570" fill="var(--color-muted)" font-family="l0g Private Credit" font-size="17" font-weight="400" text-anchor="start">Facteurs Life avant fiscalité · fin 2026</text>
