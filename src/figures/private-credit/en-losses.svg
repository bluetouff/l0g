<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="credit-en-losses-d-title credit-en-losses-d-desc" viewBox="0 0 1000 650" style="width:100%;height:auto" class="l0g-private-credit-svg">
<title id="credit-en-losses-d-title">Priority allocates losses</title><desc id="credit-en-losses-d-desc">Fictional 100-unit model: senior 60, junior 20, residual equity 20. One final net cash amount is allocated after master-fund debt and expenses, in senior, junior, equity order. Losses of 10, 25 and 50 leave 90, 75 and 50, paid 60/20/10, 60/15/0 and 50/0/0. Junior losses start above 20 total loss; senior above 40. Holding all ranks preserves total loss. Excludes interest, time, tax, FX and feeder expenses; no probability or rating. Parameters do not represent Partners Group. l0g calculations; Fitch concept [4].</desc>
