<path d="M 242.0 1028 L 242.0 1034" fill="none" stroke="var(--color-line-strong)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text data-panel="credit-en-capital-m-frame" x="242.0" y="1060" fill="var(--color-muted)" font-family="l0g Private Credit" font-size="17" font-weight="400" text-anchor="middle">3%</text>
<path d="M 306.0 1028 L 306.0 1034" fill="none" stroke="var(--color-line-strong)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
