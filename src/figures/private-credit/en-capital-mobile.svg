<text data-panel="credit-en-capital-m-frame" x="388" y="852" fill="var(--color-amber)" font-family="l0g Private Credit" font-size="17" font-weight="700" text-anchor="end">2.168%</text>
<rect id="credit-en-capital-m-bar-3" x="50" y="862" width="138.752" height="23" rx="0" fill="var(--color-amber)"/>
