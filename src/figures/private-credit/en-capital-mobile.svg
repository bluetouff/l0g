<text data-panel="credit-en-capital-m-frame" x="388" y="924" fill="var(--color-amber)" font-family="l0g Private Credit" font-size="17" font-weight="700" text-anchor="end">4.537%</text>
<rect id="credit-en-capital-m-bar-4" x="50" y="934" width="290.368" height="23" rx="0" fill="var(--color-amber)"/>
