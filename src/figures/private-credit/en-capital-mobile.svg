<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="credit-en-capital-m-title credit-en-capital-m-desc" viewBox="0 0 420 1260" style="width:100%;height:auto" class="l0g-private-credit-svg">
<title id="credit-en-capital-m-title">Three decisions before the calculation</title><desc id="credit-en-capital-m-desc">Three decisions: classify the debt under SSAP 26 and INT 24-01, designate credit risk under the applicable SVO-manual route, apply the portfolio capital formula. Selected pre-tax Life/Fraternal year-end 2026 factors, non-CLO/CBO/CDO column: 1.A 0.158%, 1.G 1.016%, 2.B 1.523%, 2.C 2.168%, 3.B 4.537%. Zero-to-5% axis. Example: US$100 million adjusted carrying value times 1.523% equals US$1.523 million before other adjustments and aggregation. No designation of Partners Group notes is assumed. NAIC sources [6, 7, 8, 9].</desc>
<rect id="credit-en-capital-m-frame" x="0" y="0" width="420" height="1260" rx="10" fill="var(--color-ink)"/>
<text data-panel="credit-en-capital-m-frame" x="20" y="30" fill="var(--color-signal)" font-family="l0g Private Credit" font-size="17" font-weight="700" text-anchor="start">03 / PRIVATE CREDIT AND INSURERS</text>
<text data-panel="credit-en-capital-m-frame" x="20" y="65" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="22" font-weight="700" text-anchor="start">Three decisions</text>
<text data-panel="credit-en-capital-m-frame" x="20" y="93" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="22" font-weight="700" text-anchor="start">before the calculation</text>
<rect id="credit-en-capital-m-card-decision-0" x="16" y="143" width="388" height="117" rx="10" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="credit-en-capital-m-card-decision-0" x="32" y="172" fill="var(--color-signal)" font-family="l0g Private Credit" font-size="17" font-weight="700" text-anchor="start">1. CLASSIFY</text>
<text data-panel="credit-en-capital-m-card-decision-0" x="32" y="201" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="17" font-weight="400" text-anchor="start">Creditor relationship,</text>
<text data-panel="credit-en-capital-m-card-decision-0" x="32" y="224" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="17" font-weight="400" text-anchor="start">substantive protection.</text>
<text data-panel="credit-en-capital-m-card-decision-0" x="32" y="248" fill="var(--color-muted)" font-family="l0g Private Credit" font-size="17" font-weight="400" text-anchor="start">SSAP 26 / INT 24-01</text>
<rect id="credit-en-capital-m-card-decision-1" x="16" y="275" width="388" height="117" rx="10" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="credit-en-capital-m-card-decision-1" x="32" y="304" fill="var(--color-signal)" font-family="l0g Private Credit" font-size="17" font-weight="700" text-anchor="start">2. DESIGNATE</text>
<text data-panel="credit-en-capital-m-card-decision-1" x="32" y="333" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="17" font-weight="400" text-anchor="start">Eligibility, rating and</text>
<text data-panel="credit-en-capital-m-card-decision-1" x="32" y="356" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="17" font-weight="400" text-anchor="start">applicable review route.</text>
<text data-panel="credit-en-capital-m-card-decision-1" x="32" y="380" fill="var(--color-muted)" font-family="l0g Private Credit" font-size="17" font-weight="400" text-anchor="start">SVO P&amp;P Manual</text>
<rect id="credit-en-capital-m-card-decision-2" x="16" y="407" width="388" height="117" rx="10" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="credit-en-capital-m-card-decision-2" x="32" y="436" fill="var(--color-signal)" font-family="l0g Private Credit" font-size="17" font-weight="700" text-anchor="start">3. CALCULATE</text>
<text data-panel="credit-en-capital-m-card-decision-2" x="32" y="465" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="17" font-weight="400" text-anchor="start">Category and value,</text>
<text data-panel="credit-en-capital-m-card-decision-2" x="32" y="488" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="17" font-weight="400" text-anchor="start">risk aggregation.</text>
<text data-panel="credit-en-capital-m-card-decision-2" x="32" y="512" fill="var(--color-muted)" font-family="l0g Private Credit" font-size="17" font-weight="400" text-anchor="start">Life / Fraternal RBC</text>
<text data-panel="credit-en-capital-m-frame" x="24" y="570" fill="var(--color-muted)" font-family="l0g Private Credit" font-size="17" font-weight="400" text-anchor="start">Pre-tax Life factors · year-end 2026</text>
