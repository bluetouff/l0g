<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="credit-fr-liquidity-m-title credit-fr-liquidity-m-desc" viewBox="0 0 420 1350" style="width:100%;height:auto" class="l0g-private-credit-svg">
<title id="credit-fr-liquidity-m-title">Faire arriver le cash au bon moment</title><desc id="credit-fr-liquidity-m-desc">La NAV des parts est une estimation à une date donnée. Le cash du feeder provient des distributions et rachats autorisés par contrat ; il paie intérêts et principal selon les notes. Une réserve ou facilité peut couvrir un décalage sous conditions ; les tirages restent remboursables. Reporter un rachat conserve le cash du fonds et prolonge l’attente de l’investisseur. Chez l’assureur, flux de tous actifs et réserves liquides se confrontent aux rentes, prestations, rachats et appels de marge. Dates, montants et devises doivent être rapprochés. Schéma qualitatif, garanties propres au contrat. Fitch [4], FSB [13], IAIS [14].</desc>
