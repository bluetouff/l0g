<text data-panel="credit-fr-liquidity-m-frame" x="20" y="30" fill="var(--color-signal)" font-family="l0g Private Credit" font-size="17" font-weight="700" text-anchor="start">04 / CRÉDIT PRIVÉ ET ASSUREURS</text>
<text data-panel="credit-fr-liquidity-m-frame" x="20" y="65" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="22" font-weight="700" text-anchor="start">Faire arriver le cash</text>
<text data-panel="credit-fr-liquidity-m-frame" x="20" y="93" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="22" font-weight="700" text-anchor="start">au bon moment</text>
