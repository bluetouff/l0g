<text data-panel="credit-fr-structure-d-frame" x="24" y="575" fill="var(--color-muted)" font-family="l0g Private Credit" font-size="22" font-weight="400" text-anchor="start">Un investisseur peut détenir plusieurs rangs. Chaque entité garde ses priorités.</text>
