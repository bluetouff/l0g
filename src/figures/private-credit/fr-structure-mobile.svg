<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="credit-fr-structure-m-title credit-fr-structure-m-desc" viewBox="0 0 420 1240" style="width:100%;height:auto" class="l0g-private-credit-svg">
<title id="credit-fr-structure-m-title">Deux priorités dans la chaîne des droits</title><desc id="credit-fr-structure-m-desc">Structure générique : le feeder souscrit des parts du fonds maître. Les prêts aux entreprises fournissent intérêts et remboursements au fonds. Les frais et le service de la dette du fonds passent avant le solde distribuable aux parts. Le feeder reçoit ensuite les distributions selon les contrats et paie notes senior, notes junior, puis capital résiduel. Un investisseur peut détenir plusieurs rangs. Flux et priorités sans échelle ; aucune clause attribuée à Partners Group. Sources [3, 4].</desc>
<rect id="credit-fr-structure-m-frame" x="0" y="0" width="420" height="1240" rx="10" fill="var(--color-ink)"/>
<text data-panel="credit-fr-structure-m-frame" x="20" y="30" fill="var(--color-signal)" font-family="l0g Private Credit" font-size="17" font-weight="700" text-anchor="start">01 / CRÉDIT PRIVÉ ET ASSUREURS</text>
<text data-panel="credit-fr-structure-m-frame" x="20" y="65" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="22" font-weight="700" text-anchor="start">Deux priorités dans</text>
<text data-panel="credit-fr-structure-m-frame" x="20" y="93" fill="var(--color-paper)" font-family="l0g Private Credit" font-size="22" font-weight="700" text-anchor="start">la chaîne des droits</text>
<text data-panel="credit-fr-structure-m-frame" x="24" y="130" fill="var(--color-muted)" font-family="l0g Private Credit" font-size="17" font-weight="400" text-anchor="start">Le feeder détient des parts du fonds.</text>
<text data-panel="credit-fr-structure-m-frame" x="24" y="155" fill="var(--color-muted)" font-family="l0g Private Credit" font-size="17" font-weight="400" text-anchor="start">Schéma générique, sans échelle.</text>
