<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="credit-fr-losses-d-title credit-fr-losses-d-desc" viewBox="0 0 1000 650" style="width:100%;height:auto" class="l0g-private-credit-svg">
<title id="credit-fr-losses-d-title">La priorité répartit les pertes</title><desc id="credit-fr-losses-d-desc">Modèle fictif de 100 unités : senior 60, junior 20, capital résiduel 20. Un seul cash final net est réparti après les dettes et frais du fonds maître, selon priorité senior, junior, capital. Les pertes 10, 25 et 50 laissent respectivement 90, 75 et 50 ; paiements 60/20/10, 60/15/0 et 50/0/0. Junior touché au-delà de 20 de perte totale, senior au-delà de 40. Détenir tous les rangs conserve la perte totale. Hors intérêts, temps, fiscalité, change et frais du feeder ; aucune probabilité ni notation. Paramètres distincts de Partners Group. Calculs l0g ; concept Fitch [4].</desc>
