<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="iron-fr-economics-m-title iron-fr-economics-m-desc" viewBox="0 0 420 1150" style="width:100%;height:auto" class="l0g-iron-ore-svg">
<title id="iron-fr-economics-m-title">Les coûts montent, le prix réalisé recule</title><desc id="iron-fr-economics-m-desc">Hématite Fortescue. Trimestres septembre 2025, juin 2026 et septembre 2026 : C1 de 18,17, 19,37 et 21,98 US$/tonne humide ; prix réalisé de 88,86, 88,85 et 79,79 US$/tonne sèche. Deux échelles distinctes, toutes deux à zéro. Diesel : effet déclaré d’environ +1,40 US$/tonne humide sur un an. Le C1 et le prix ont des bases et périmètres distincts ; une marge demande leur rapprochement, fret et redevances compris. Sources [1, 4].</desc>
