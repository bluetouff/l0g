<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="iron-fr-grades-d-title iron-fr-grades-d-desc" viewBox="0 0 1000 650" style="width:100%;height:auto" class="l0g-iron-ore-svg">
<title id="iron-fr-grades-d-title">Même fer contenu, masses et recettes différentes</title><desc id="iron-fr-grades-d-desc">Exemples arithmétiques sur matière sèche : 1 tonne de fer contenu demande 1/0,58 = 1,724 tonne de minerai à 58 %, 1/0,61 = 1,639 tonne à 61 % ou 1/0,67 = 1,493 tonne à 67 %. Fer contenu en menthe, fraction non-Fe en ambre, même échelle 0 à 2 tonnes. La fraction non-Fe comprend l’oxygène lié au fer. Mélange théorique : 2 tonnes à 58 % et 1 tonne à 67 % donnent 3 tonnes à 61 % et 1,83 tonne de Fe. Le haut-fourneau nécessite une charge préparée avec coke, granulométrie, tenue, chimie et minéralogie adaptées. Schéma sans échelle. Sources : calculs l0g, recherche et Nippon Steel [11, 12].</desc>
