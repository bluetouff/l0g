<text data-panel="iron-fr-grades-d-frame" x="24" y="30" fill="var(--color-signal)" font-family="l0g Iron Ore" font-size="22" font-weight="700" text-anchor="start">04 / MINERAI ET POUVOIR</text>
<text data-panel="iron-fr-grades-d-frame" x="24" y="72" fill="var(--color-paper)" font-family="l0g Iron Ore" font-size="30" font-weight="700" text-anchor="start">Même fer contenu, masses et recettes différentes</text>
