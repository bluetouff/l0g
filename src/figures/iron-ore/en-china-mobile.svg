<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="iron-en-china-m-title iron-en-china-m-desc" viewBox="0 0 420 1040" style="width:100%;height:auto" class="l0g-iron-ore-svg">
<title id="iron-en-china-m-title">More ore imported, less steel produced</title><desc id="iron-en-china-m-desc">China, January–September 2026, year-on-year change: iron ore imports 954.97 Mt, up 4.1%; crude steel 724.77 Mt, down 2.9%. Each rate retains its own comparable prior-year base. Common −5% to +5% scale. Input and output volumes are not subtracted to infer stocks: moisture, transformation, grades, ownership and timing differ. Arrivals, stocks and blends, steelmaking form a qualitative chain. Sources: GACC data reproduced by Mysteel, NBS, worldsteel [13, 14, 15].</desc>
