<text data-panel="iron-en-economics-d-frame" x="24" y="30" fill="var(--color-signal)" font-family="l0g Iron Ore" font-size="22" font-weight="700" text-anchor="start">03 / ORE AND BARGAINING</text>
<text data-panel="iron-en-economics-d-frame" x="24" y="72" fill="var(--color-paper)" font-family="l0g Iron Ore" font-size="30" font-weight="700" text-anchor="start">Costs rise as realised prices decline</text>
