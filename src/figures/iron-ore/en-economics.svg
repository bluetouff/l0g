<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="iron-en-economics-d-title iron-en-economics-d-desc" viewBox="0 0 1000 650" style="width:100%;height:auto" class="l0g-iron-ore-svg">
<title id="iron-en-economics-d-title">Costs rise as realised prices decline</title><desc id="iron-en-economics-d-desc">Fortescue hematite. September 2025, June 2026 and September 2026 quarters: C1 of US$18.17, 19.37 and 21.98 per wet tonne; realised price of US$88.86, 88.85 and 79.79 per dry tonne. Separate zero-based scales. Diesel: stated year-on-year effect of about +US$1.40 per wet tonne. C1 and realised price use different bases and scopes; a margin requires reconciliation, including freight and royalties. Sources [1, 4].</desc>
