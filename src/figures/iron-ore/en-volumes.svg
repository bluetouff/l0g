<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="iron-en-volumes-d-title iron-en-volumes-d-desc" viewBox="0 0 1000 650" style="width:100%;height:auto" class="l0g-iron-ore-svg">
<title id="iron-en-volumes-d-title">Sales lag behind shipments</title><desc id="iron-en-volumes-d-desc">Fortescue, July–September 2026, 100% operations: 46.8 million wet tonnes shipped and 42.9 sold, a 3.9 Mt arithmetic gap between two flows. Management describes approximately 4 Mt of inventory build; the total inventory balance also requires the opening stock. Forecast issued on 22 October: a further 4–5 Mt inventory build in October; possible production adjustments if talks extend beyond late December. Sales may include earlier shipments. Sources [1, 2, 3].</desc>
<rect id="iron-en-volumes-d-frame" x="0" y="0" width="1000" height="650" rx="12" fill="var(--color-ink)"/>
<text data-panel="iron-en-volumes-d-frame" x="24" y="30" fill="var(--color-signal)" font-family="l0g Iron Ore" font-size="22" font-weight="700" text-anchor="start">01 / ORE AND BARGAINING</text>
<text data-panel="iron-en-volumes-d-frame" x="24" y="72" fill="var(--color-paper)" font-family="l0g Iron Ore" font-size="30" font-weight="700" text-anchor="start">Sales lag behind shipments</text>
<text data-panel="iron-en-volumes-d-frame" x="24" y="108" fill="var(--color-muted)" font-family="l0g Iron Ore" font-size="22" font-weight="400" text-anchor="start">Fortescue · July–September 2026 · 100% operations · million wet tonnes</text>
