<text data-panel="iron-en-volumes-d-card-forecast" x="364" y="505" fill="var(--color-amber)" font-family="l0g Iron Ore" font-size="34" font-weight="700" text-anchor="start">+4–5 Mt</text>
<text data-panel="iron-en-volumes-d-card-forecast" x="574" y="503" fill="var(--color-paper)" font-family="l0g Iron Ore" font-size="22" font-weight="400" text-anchor="start">expected additional inventory build</text>
<text data-panel="iron-en-volumes-d-card-forecast" x="364" y="535" fill="var(--color-muted)" font-family="l0g Iron Ore" font-size="22" font-weight="400" text-anchor="start">Adjustments possible after late December.</text>
<text data-panel="iron-en-volumes-d-frame" x="24" y="582" fill="var(--color-muted)" font-family="l0g Iron Ore" font-size="22" font-weight="400" text-anchor="start">About 4 Mt built this quarter, management says. Total stocks are a separate measure.</text>
<text data-panel="iron-en-volumes-d-frame" x="24" y="609" fill="var(--color-muted)" font-family="l0g Iron Ore" font-size="22" font-weight="400" text-anchor="start">Sales may include earlier shipments. Common scale, zero baseline.</text>
