<text data-panel="iron-en-volumes-m-frame" x="24" y="843" fill="var(--color-muted)" font-family="l0g Iron Ore" font-size="17" font-weight="400" text-anchor="start">About 4 Mt built during the quarter,</text>
<text data-panel="iron-en-volumes-m-frame" x="24" y="869" fill="var(--color-muted)" font-family="l0g Iron Ore" font-size="17" font-weight="400" text-anchor="start">management says; total stock differs.</text>
<text data-panel="iron-en-volumes-m-frame" x="24" y="895" fill="var(--color-muted)" font-family="l0g Iron Ore" font-size="17" font-weight="400" text-anchor="start">Bars: common scale, zero baseline.</text>
<text data-panel="iron-en-volumes-m-frame" x="24" y="921" fill="var(--color-muted)" font-family="l0g Iron Ore" font-size="17" font-weight="400" text-anchor="start">Million wet tonnes; quarterly flows.</text>
<text data-panel="iron-en-volumes-m-frame" x="24" y="947" fill="var(--color-muted)" font-family="l0g Iron Ore" font-size="17" font-weight="400" text-anchor="start">Fortescue, 8 and 22 October [1, 2, 3].</text>
