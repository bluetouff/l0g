<text data-panel="iron-en-volumes-m-card-forecast" x="32" y="667" fill="var(--color-amber)" font-family="l0g Iron Ore" font-size="34" font-weight="700" text-anchor="start">+4–5 Mt</text>
<text data-panel="iron-en-volumes-m-card-forecast" x="32" y="700" fill="var(--color-paper)" font-family="l0g Iron Ore" font-size="17" font-weight="400" text-anchor="start">expected additional inventory build.</text>
<text data-panel="iron-en-volumes-m-card-forecast" x="32" y="725" fill="var(--color-paper)" font-family="l0g Iron Ore" font-size="17" font-weight="400" text-anchor="start">Possible production adjustments</text>
<text data-panel="iron-en-volumes-m-card-forecast" x="32" y="750" fill="var(--color-paper)" font-family="l0g Iron Ore" font-size="17" font-weight="400" text-anchor="start">if talks extend beyond</text>
