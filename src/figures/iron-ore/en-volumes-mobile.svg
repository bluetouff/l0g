<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="iron-en-volumes-m-title iron-en-volumes-m-desc" viewBox="0 0 420 990" style="width:100%;height:auto" class="l0g-iron-ore-svg">
<title id="iron-en-volumes-m-title">Sales lag behind shipments</title><desc id="iron-en-volumes-m-desc">Fortescue, July–September 2026, 100% operations: 46.8 million wet tonnes shipped and 42.9 sold, a 3.9 Mt arithmetic gap between two flows. Management describes approximately 4 Mt of inventory build; the total inventory balance also requires the opening stock. Forecast issued on 22 October: a further 4–5 Mt inventory build in October; possible production adjustments if talks extend beyond late December. Sales may include earlier shipments. Sources [1, 2, 3].</desc>
<rect id="iron-en-volumes-m-frame" x="0" y="0" width="420" height="990" rx="12" fill="var(--color-ink)"/>
<text data-panel="iron-en-volumes-m-frame" x="20" y="30" fill="var(--color-signal)" font-family="l0g Iron Ore" font-size="17" font-weight="700" text-anchor="start">01 / ORE AND BARGAINING</text>
<text data-panel="iron-en-volumes-m-frame" x="20" y="65" fill="var(--color-paper)" font-family="l0g Iron Ore" font-size="22" font-weight="700" text-anchor="start">Sales lag behind shipments</text>
<text data-panel="iron-en-volumes-m-frame" x="24" y="133" fill="var(--color-muted)" font-family="l0g Iron Ore" font-size="17" font-weight="400" text-anchor="start">Fortescue · July–September 2026</text>
<text data-panel="iron-en-volumes-m-frame" x="24" y="158" fill="var(--color-muted)" font-family="l0g Iron Ore" font-size="17" font-weight="400" text-anchor="start">100% operations · million wet tonnes</text>
<rect id="iron-en-volumes-m-card-flows" x="16" y="180" width="388" height="380" rx="12" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="iron-en-volumes-m-card-flows" x="32" y="214" fill="var(--color-paper)" font-family="l0g Iron Ore" font-size="17" font-weight="700" text-anchor="start">Two flows in the same quarter</text>
<text data-panel="iron-en-volumes-m-card-flows" x="32" y="265" fill="var(--color-paper)" font-family="l0g Iron Ore" font-size="17" font-weight="700" text-anchor="start">Shipped</text>
<text data-panel="iron-en-volumes-m-card-flows" x="386" y="265" fill="var(--color-signal)" font-family="l0g Iron Ore" font-size="25" font-weight="700" text-anchor="end">46.8</text>
