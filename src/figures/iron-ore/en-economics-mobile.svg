<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="iron-en-economics-m-title iron-en-economics-m-desc" viewBox="0 0 420 1150" style="width:100%;height:auto" class="l0g-iron-ore-svg">
<title id="iron-en-economics-m-title">Costs rise as realised prices decline</title><desc id="iron-en-economics-m-desc">Fortescue hematite. September 2025, June 2026 and September 2026 quarters: C1 of US$18.17, 19.37 and 21.98 per wet tonne; realised price of US$88.86, 88.85 and 79.79 per dry tonne. Separate zero-based scales. Diesel: stated year-on-year effect of about +US$1.40 per wet tonne. C1 and realised price use different bases and scopes; a margin requires reconciliation, including freight and royalties. Sources [1, 4].</desc>
<rect id="iron-en-economics-m-frame" x="0" y="0" width="420" height="1150" rx="12" fill="var(--color-ink)"/>
<text data-panel="iron-en-economics-m-frame" x="20" y="30" fill="var(--color-signal)" font-family="l0g Iron Ore" font-size="17" font-weight="700" text-anchor="start">03 / ORE AND BARGAINING</text>
<text data-panel="iron-en-economics-m-frame" x="20" y="65" fill="var(--color-paper)" font-family="l0g Iron Ore" font-size="22" font-weight="700" text-anchor="start">Costs rise as realised</text>
<text data-panel="iron-en-economics-m-frame" x="20" y="93" fill="var(--color-paper)" font-family="l0g Iron Ore" font-size="22" font-weight="700" text-anchor="start">prices decline</text>
