<text data-panel="iron-fr-volumes-d-card-forecast" x="364" y="505" fill="var(--color-amber)" font-family="l0g Iron Ore" font-size="34" font-weight="700" text-anchor="start">+4–5 Mt</text>
<text data-panel="iron-fr-volumes-d-card-forecast" x="574" y="503" fill="var(--color-paper)" font-family="l0g Iron Ore" font-size="22" font-weight="400" text-anchor="start">de stocks supplémentaires attendus</text>
<text data-panel="iron-fr-volumes-d-card-forecast" x="364" y="535" fill="var(--color-muted)" font-family="l0g Iron Ore" font-size="22" font-weight="400" text-anchor="start">Ajustements possibles après fin décembre.</text>
<text data-panel="iron-fr-volumes-d-frame" x="24" y="582" fill="var(--color-muted)" font-family="l0g Iron Ore" font-size="22" font-weight="400" text-anchor="start">La direction décrit environ 4 Mt d’accumulation trimestrielle ; le solde total est distinct.</text>
<text data-panel="iron-fr-volumes-d-frame" x="24" y="609" fill="var(--color-muted)" font-family="l0g Iron Ore" font-size="22" font-weight="400" text-anchor="start">Les ventes peuvent porter sur d’anciennes expéditions. Même échelle, origine zéro.</text>
<text data-panel="iron-fr-volumes-d-frame" x="24" y="636" fill="var(--color-muted)" font-family="l0g Iron Ore" font-size="22" font-weight="400" text-anchor="start">Fortescue, communiqués des 8 et 22 octobre ; conférence du 22/10/2026 [1, 2, 3].</text>
</svg>
