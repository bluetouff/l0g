<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="iron-fr-grades-m-title iron-fr-grades-m-desc" viewBox="0 0 420 1400" style="width:100%;height:auto" class="l0g-iron-ore-svg">
<title id="iron-fr-grades-m-title">Même fer contenu, masses et recettes différentes</title><desc id="iron-fr-grades-m-desc">Exemples arithmétiques sur matière sèche : 1 tonne de fer contenu demande 1/0,58 = 1,724 tonne de minerai à 58 %, 1/0,61 = 1,639 tonne à 61 % ou 1/0,67 = 1,493 tonne à 67 %. Fer contenu en menthe, fraction non-Fe en ambre, même échelle 0 à 2 tonnes. La fraction non-Fe comprend l’oxygène lié au fer. Mélange théorique : 2 tonnes à 58 % et 1 tonne à 67 % donnent 3 tonnes à 61 % et 1,83 tonne de Fe. Le haut-fourneau nécessite une charge préparée avec coke, granulométrie, tenue, chimie et minéralogie adaptées. Schéma sans échelle. Sources : calculs l0g, recherche et Nippon Steel [11, 12].</desc>
<rect id="iron-fr-grades-m-frame" x="0" y="0" width="420" height="1400" rx="12" fill="var(--color-ink)"/>
<text data-panel="iron-fr-grades-m-frame" x="20" y="30" fill="var(--color-signal)" font-family="l0g Iron Ore" font-size="17" font-weight="700" text-anchor="start">04 / MINERAI ET POUVOIR</text>
<text data-panel="iron-fr-grades-m-frame" x="20" y="65" fill="var(--color-paper)" font-family="l0g Iron Ore" font-size="22" font-weight="700" text-anchor="start">Même fer contenu,</text>
<text data-panel="iron-fr-grades-m-frame" x="20" y="93" fill="var(--color-paper)" font-family="l0g Iron Ore" font-size="22" font-weight="700" text-anchor="start">masses et recettes différentes</text>
<rect id="iron-fr-grades-m-card-mass" x="16" y="125" width="388" height="385" rx="12" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="iron-fr-grades-m-card-mass" x="34" y="159" fill="var(--color-paper)" font-family="l0g Iron Ore" font-size="17" font-weight="700" text-anchor="start">Pour 1 t de Fe · minerai sec (t)</text>
<text data-panel="iron-fr-grades-m-card-mass" x="34" y="187" fill="var(--color-paper)" font-family="l0g Iron Ore" font-size="17" font-weight="700" text-anchor="start">Fe : menthe · non-Fe : ambre</text>
<text data-panel="iron-fr-grades-m-card-mass" x="34" y="255" fill="var(--color-paper)" font-family="l0g Iron Ore" font-size="17" font-weight="700" text-anchor="start">58 % Fe</text>
