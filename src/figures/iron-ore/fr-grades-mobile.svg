<rect id="iron-fr-grades-m-card-blend" x="16" y="534" width="388" height="247" rx="12" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="iron-fr-grades-m-card-blend" x="34" y="566" fill="var(--color-signal)" font-family="l0g Iron Ore" font-size="17" font-weight="700" text-anchor="start">MÉLANGE THÉORIQUE SEC</text>
<text data-panel="iron-fr-grades-m-card-blend" x="34" y="606" fill="var(--color-paper)" font-family="l0g Iron Ore" font-size="20" font-weight="700" text-anchor="start">2 t à 58 %</text>
<text data-panel="iron-fr-grades-m-card-blend" x="179" y="606" fill="var(--color-muted)" font-family="l0g Iron Ore" font-size="22" font-weight="400" text-anchor="middle">+</text>
<text data-panel="iron-fr-grades-m-card-blend" x="204" y="606" fill="var(--color-paper)" font-family="l0g Iron Ore" font-size="20" font-weight="700" text-anchor="start">1 t à 67 %</text>
