<rect id="iron-fr-grades-m-blend-67" x="262.0" y="628" width="114.0" height="17" rx="2" fill="var(--color-amber)"/>
<text data-panel="iron-fr-grades-m-card-blend" x="34" y="687" fill="var(--color-paper)" font-family="l0g Iron Ore" font-size="17" font-weight="700" text-anchor="start">3 t à 61 % Fe · 1,83 t de Fe contenu</text>
<text data-panel="iron-fr-grades-m-card-blend" x="34" y="721" fill="var(--color-muted)" font-family="l0g Iron Ore" font-size="17" font-weight="400" text-anchor="start">Calculs de composition : 1 / (teneur / 100).</text>
<text data-panel="iron-fr-grades-m-card-blend" x="34" y="746" fill="var(--color-muted)" font-family="l0g Iron Ore" font-size="17" font-weight="400" text-anchor="start">Le non-Fe inclut l’oxygène lié au fer.</text>
<text data-panel="iron-fr-grades-m-card-blend" x="34" y="771" fill="var(--color-muted)" font-family="l0g Iron Ore" font-size="17" font-weight="400" text-anchor="start">Pertes et rendement acier hors calcul.</text>
<rect id="iron-fr-grades-m-card-furnace" x="16" y="803" width="388" height="489" rx="12" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="iron-fr-grades-m-card-furnace" x="34" y="836" fill="var(--color-signal)" font-family="l0g Iron Ore" font-size="17" font-weight="700" text-anchor="start">HAUT-FOURNEAU</text>
<text data-panel="iron-fr-grades-m-card-furnace" x="34" y="869" fill="var(--color-muted)" font-family="l0g Iron Ore" font-size="17" font-weight="400" text-anchor="start">Forme, tenue et chimie.</text>
<text data-panel="iron-fr-grades-m-card-furnace" x="34" y="895" fill="var(--color-muted)" font-family="l0g Iron Ore" font-size="17" font-weight="400" text-anchor="start">Minerai préparé + coke</text>
