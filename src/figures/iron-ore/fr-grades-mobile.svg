<rect id="iron-fr-grades-m-bar-nonfe-58" x="241" y="237" width="83.275862" height="24" rx="2" fill="var(--color-amber)"/>
<text data-panel="iron-fr-grades-m-card-mass" x="389" y="256" fill="var(--color-paper)" font-family="l0g Iron Ore" font-size="17" font-weight="700" text-anchor="end">1,724</text>
<text data-panel="iron-fr-grades-m-card-mass" x="34" y="327" fill="var(--color-paper)" font-family="l0g Iron Ore" font-size="17" font-weight="700" text-anchor="start">61 % Fe</text>
<rect id="iron-fr-grades-m-bar-fe-61" x="126" y="309" width="115" height="24" rx="2" fill="var(--color-signal)"/>
<rect id="iron-fr-grades-m-bar-nonfe-61" x="241" y="309" width="73.52459" height="24" rx="2" fill="var(--color-amber)"/>
<text data-panel="iron-fr-grades-m-card-mass" x="389" y="328" fill="var(--color-paper)" font-family="l0g Iron Ore" font-size="17" font-weight="700" text-anchor="end">1,639</text>
<text data-panel="iron-fr-grades-m-card-mass" x="34" y="399" fill="var(--color-paper)" font-family="l0g Iron Ore" font-size="17" font-weight="700" text-anchor="start">67 % Fe</text>
