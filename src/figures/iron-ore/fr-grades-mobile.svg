<text data-panel="iron-fr-grades-m-card-furnace" x="386" y="1199" fill="var(--color-accent)" font-family="l0g Iron Ore" font-size="17" font-weight="400" text-anchor="end">Fonte</text>
<text data-panel="iron-fr-grades-m-card-furnace" x="34" y="1223" fill="var(--color-muted)" font-family="l0g Iron Ore" font-size="17" font-weight="400" text-anchor="start">Fines agglomérées, boulettes</text>
<text data-panel="iron-fr-grades-m-card-furnace" x="34" y="1249" fill="var(--color-muted)" font-family="l0g Iron Ore" font-size="17" font-weight="400" text-anchor="start">ou morceaux calibrés.</text>
<text data-panel="iron-fr-grades-m-card-furnace" x="34" y="1275" fill="var(--color-muted)" font-family="l0g Iron Ore" font-size="17" font-weight="400" text-anchor="start">Schéma sans échelle.</text>
<text data-panel="iron-fr-grades-m-frame" x="24" y="1329" fill="var(--color-muted)" font-family="l0g Iron Ore" font-size="17" font-weight="400" text-anchor="start">Teneurs choisies, aucun rendement déduit.</text>
<text data-panel="iron-fr-grades-m-frame" x="24" y="1354" fill="var(--color-muted)" font-family="l0g Iron Ore" font-size="17" font-weight="400" text-anchor="start">Calculs l0g ; Webster et al., 2017 ;</text>
