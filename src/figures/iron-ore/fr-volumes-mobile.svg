<text data-panel="iron-fr-volumes-m-card-flows" x="32" y="545" fill="var(--color-muted)" font-family="l0g Iron Ore" font-size="17" font-weight="400" text-anchor="start">Cargaisons distinctes possibles.</text>
<rect id="iron-fr-volumes-m-card-forecast" x="16" y="585" width="388" height="215" rx="12" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="iron-fr-volumes-m-card-forecast" x="32" y="617" fill="var(--color-amber)" font-family="l0g Iron Ore" font-size="17" font-weight="700" text-anchor="start">OCTOBRE · PRÉVISION DU 22/10</text>
<text data-panel="iron-fr-volumes-m-card-forecast" x="32" y="667" fill="var(--color-amber)" font-family="l0g Iron Ore" font-size="34" font-weight="700" text-anchor="start">+4–5 Mt</text>
<text data-panel="iron-fr-volumes-m-card-forecast" x="32" y="700" fill="var(--color-paper)" font-family="l0g Iron Ore" font-size="17" font-weight="400" text-anchor="start">d’augmentation de stocks attendue.</text>
<text data-panel="iron-fr-volumes-m-card-forecast" x="32" y="725" fill="var(--color-paper)" font-family="l0g Iron Ore" font-size="17" font-weight="400" text-anchor="start">Adaptations de production possibles</text>
<text data-panel="iron-fr-volumes-m-card-forecast" x="32" y="750" fill="var(--color-paper)" font-family="l0g Iron Ore" font-size="17" font-weight="400" text-anchor="start">si les discussions se prolongent</text>
<text data-panel="iron-fr-volumes-m-card-forecast" x="32" y="775" fill="var(--color-paper)" font-family="l0g Iron Ore" font-size="17" font-weight="400" text-anchor="start">au-delà de fin décembre.</text>
<text data-panel="iron-fr-volumes-m-frame" x="24" y="843" fill="var(--color-muted)" font-family="l0g Iron Ore" font-size="17" font-weight="400" text-anchor="start">Environ 4 Mt accumulées au trimestre,</text>
<text data-panel="iron-fr-volumes-m-frame" x="24" y="869" fill="var(--color-muted)" font-family="l0g Iron Ore" font-size="17" font-weight="400" text-anchor="start">selon la direction ; solde total distinct.</text>
<text data-panel="iron-fr-volumes-m-frame" x="24" y="895" fill="var(--color-muted)" font-family="l0g Iron Ore" font-size="17" font-weight="400" text-anchor="start">Barres : même échelle, origine zéro.</text>
<text data-panel="iron-fr-volumes-m-frame" x="24" y="921" fill="var(--color-muted)" font-family="l0g Iron Ore" font-size="17" font-weight="400" text-anchor="start">Mt humides ; flux trimestriels.</text>
<text data-panel="iron-fr-volumes-m-frame" x="24" y="947" fill="var(--color-muted)" font-family="l0g Iron Ore" font-size="17" font-weight="400" text-anchor="start">Fortescue, 8 et 22 octobre 2026 [1, 2, 3].</text>
