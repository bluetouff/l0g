<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="iron-fr-volumes-m-title iron-fr-volumes-m-desc" viewBox="0 0 420 990" style="width:100%;height:auto" class="l0g-iron-ore-svg">
<title id="iron-fr-volumes-m-title">La vente prend du retard sur l’expédition</title><desc id="iron-fr-volumes-m-desc">Fortescue, juillet–septembre 2026, 100 % des opérations : 46,8 Mt humides expédiées, 42,9 vendues, différence arithmétique 3,9 Mt entre deux flux. La direction décrit une augmentation des stocks d’environ 4 Mt ; le stock total exige le niveau de départ. Prévision du 22 octobre : augmentation supplémentaire de 4–5 Mt en octobre ; adaptations possibles de production si les discussions se prolongent au-delà de fin décembre. Les cargaisons vendues peuvent provenir d’expéditions antérieures. Sources [1, 2, 3].</desc>
<rect id="iron-fr-volumes-m-frame" x="0" y="0" width="420" height="990" rx="12" fill="var(--color-ink)"/>
<text data-panel="iron-fr-volumes-m-frame" x="20" y="30" fill="var(--color-signal)" font-family="l0g Iron Ore" font-size="17" font-weight="700" text-anchor="start">01 / MINERAI ET POUVOIR</text>
<text data-panel="iron-fr-volumes-m-frame" x="20" y="65" fill="var(--color-paper)" font-family="l0g Iron Ore" font-size="22" font-weight="700" text-anchor="start">La vente prend du retard</text>
<text data-panel="iron-fr-volumes-m-frame" x="20" y="93" fill="var(--color-paper)" font-family="l0g Iron Ore" font-size="22" font-weight="700" text-anchor="start">sur l’expédition</text>
<text data-panel="iron-fr-volumes-m-frame" x="24" y="133" fill="var(--color-muted)" font-family="l0g Iron Ore" font-size="17" font-weight="400" text-anchor="start">Fortescue · juillet–septembre 2026</text>
<text data-panel="iron-fr-volumes-m-frame" x="24" y="158" fill="var(--color-muted)" font-family="l0g Iron Ore" font-size="17" font-weight="400" text-anchor="start">100 % des opérations · Mt humides</text>
<rect id="iron-fr-volumes-m-card-flows" x="16" y="180" width="388" height="380" rx="12" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="iron-fr-volumes-m-card-flows" x="32" y="214" fill="var(--color-paper)" font-family="l0g Iron Ore" font-size="17" font-weight="700" text-anchor="start">Deux flux du même trimestre</text>
<text data-panel="iron-fr-volumes-m-card-flows" x="32" y="265" fill="var(--color-paper)" font-family="l0g Iron Ore" font-size="17" font-weight="700" text-anchor="start">Expédié</text>
<text data-panel="iron-fr-volumes-m-card-flows" x="386" y="265" fill="var(--color-signal)" font-family="l0g Iron Ore" font-size="25" font-weight="700" text-anchor="end">46,8</text>
