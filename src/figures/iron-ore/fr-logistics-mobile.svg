<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="iron-fr-logistics-m-title iron-fr-logistics-m-desc" viewBox="0 0 420 1190" style="width:100%;height:auto" class="l0g-iron-ore-svg">
<title id="iron-fr-logistics-m-title">Du minerai expédié à l’argent encaissé</title><desc id="iron-fr-logistics-m-desc">Chaîne hématite générique : extraction au Pilbara, rail vers Port Hedland, chargement maritime, stock portuaire chinois, sidérurgie. Les stocks peuvent appartenir à Fortescue Trading (Shanghai). Flux physique, transfert de contrôle et paiement sont trois événements distincts. Le contrat fixe le contrôle et les échéances de paiement. Le retour monétaire est schématique, sans délai ni montant ; une attente peut prolonger le financement du stock. Sources [1, 4].</desc>
