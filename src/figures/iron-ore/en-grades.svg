<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="iron-en-grades-d-title iron-en-grades-d-desc" viewBox="0 0 1000 650" style="width:100%;height:auto" class="l0g-iron-ore-svg">
<title id="iron-en-grades-d-title">Equal iron content, different masses and burdens</title><desc id="iron-en-grades-d-desc">Dry-mass arithmetic examples: one tonne of contained iron requires 1/0.58 = 1.724 tonnes of 58% ore, 1/0.61 = 1.639 tonnes at 61%, or 1/0.67 = 1.493 tonnes at 67%. Iron in mint and non-Fe in amber use the same zero-to-two-tonne scale. Non-Fe includes oxygen bound to iron. Theoretical blend: two tonnes at 58% plus one at 67% yield three tonnes at 61%, with 1.83 tonnes of iron. A blast furnace needs prepared burden with coke and suitable size, strength, chemistry and mineralogy. Drawing not to scale. Sources: l0g calculations, research and Nippon Steel [11, 12].</desc>
<rect id="iron-en-grades-d-frame" x="0" y="0" width="1000" height="650" rx="12" fill="var(--color-ink)"/>
<text data-panel="iron-en-grades-d-frame" x="24" y="30" fill="var(--color-signal)" font-family="l0g Iron Ore" font-size="22" font-weight="700" text-anchor="start">04 / ORE AND BARGAINING</text>
<text data-panel="iron-en-grades-d-frame" x="24" y="72" fill="var(--color-paper)" font-family="l0g Iron Ore" font-size="30" font-weight="700" text-anchor="start">Equal iron content, different masses and burdens</text>
