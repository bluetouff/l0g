<text data-panel="iron-en-grades-d-card-mass" x="40" y="177" fill="var(--color-paper)" font-family="l0g Iron Ore" font-size="22" font-weight="700" text-anchor="start">Fe: mint · non-Fe: amber</text>
<text data-panel="iron-en-grades-d-card-mass" x="40" y="245" fill="var(--color-paper)" font-family="l0g Iron Ore" font-size="22" font-weight="700" text-anchor="start">58% Fe</text>
<rect id="iron-en-grades-d-bar-fe-58" x="162" y="227" width="177.5" height="24" rx="2" fill="var(--color-signal)"/>
<rect id="iron-en-grades-d-bar-nonfe-58" x="339.5" y="227" width="128.534483" height="24" rx="2" fill="var(--color-amber)"/>
