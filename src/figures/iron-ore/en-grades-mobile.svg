<text data-panel="iron-en-grades-m-card-furnace" x="386" y="1199" fill="var(--color-accent)" font-family="l0g Iron Ore" font-size="17" font-weight="400" text-anchor="end">Hot metal</text>
<text data-panel="iron-en-grades-m-card-furnace" x="34" y="1223" fill="var(--color-muted)" font-family="l0g Iron Ore" font-size="17" font-weight="400" text-anchor="start">Sinter, pellets or lumps.</text>
<text data-panel="iron-en-grades-m-card-furnace" x="34" y="1249" fill="var(--color-muted)" font-family="l0g Iron Ore" font-size="17" font-weight="400" text-anchor="start">Product-specific preparation.</text>
<text data-panel="iron-en-grades-m-card-furnace" x="34" y="1275" fill="var(--color-muted)" font-family="l0g Iron Ore" font-size="17" font-weight="400" text-anchor="start">Drawing not to scale.</text>
<text data-panel="iron-en-grades-m-frame" x="24" y="1329" fill="var(--color-muted)" font-family="l0g Iron Ore" font-size="17" font-weight="400" text-anchor="start">Illustrative grades; no yield is inferred.</text>
<text data-panel="iron-en-grades-m-frame" x="24" y="1354" fill="var(--color-muted)" font-family="l0g Iron Ore" font-size="17" font-weight="400" text-anchor="start">l0g calculations; Webster et al., 2017;</text>
<text data-panel="iron-en-grades-m-frame" x="24" y="1379" fill="var(--color-muted)" font-family="l0g Iron Ore" font-size="17" font-weight="400" text-anchor="start">Nippon Steel, 2020 [11, 12].</text>
</svg>
