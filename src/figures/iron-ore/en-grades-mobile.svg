<path d="M 241 451 L 241 457" fill="none" stroke="var(--color-line-strong)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text data-panel="iron-en-grades-m-card-mass" x="241" y="481" fill="var(--color-muted)" font-family="l0g Iron Ore" font-size="17" font-weight="400" text-anchor="middle">1</text>
<path d="M 298.5 451 L 298.5 457" fill="none" stroke="var(--color-line-strong)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text data-panel="iron-en-grades-m-card-mass" x="298.5" y="481" fill="var(--color-muted)" font-family="l0g Iron Ore" font-size="17" font-weight="400" text-anchor="middle">1.5</text>
<path d="M 356 451 L 356 457" fill="none" stroke="var(--color-line-strong)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text data-panel="iron-en-grades-m-card-mass" x="356" y="481" fill="var(--color-muted)" font-family="l0g Iron Ore" font-size="17" font-weight="400" text-anchor="middle">2</text>
<rect id="iron-en-grades-m-card-blend" x="16" y="534" width="388" height="247" rx="12" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="iron-en-grades-m-card-blend" x="34" y="566" fill="var(--color-signal)" font-family="l0g Iron Ore" font-size="17" font-weight="700" text-anchor="start">THEORETICAL DRY BLEND</text>
<text data-panel="iron-en-grades-m-card-blend" x="34" y="606" fill="var(--color-paper)" font-family="l0g Iron Ore" font-size="20" font-weight="700" text-anchor="start">2 t at 58%</text>
<text data-panel="iron-en-grades-m-card-blend" x="179" y="606" fill="var(--color-muted)" font-family="l0g Iron Ore" font-size="22" font-weight="400" text-anchor="middle">+</text>
<text data-panel="iron-en-grades-m-card-blend" x="204" y="606" fill="var(--color-paper)" font-family="l0g Iron Ore" font-size="20" font-weight="700" text-anchor="start">1 t at 67%</text>
<rect id="iron-en-grades-m-blend-58" x="34" y="628" width="228.0" height="17" rx="2" fill="var(--color-signal)"/>
<rect id="iron-en-grades-m-blend-67" x="262.0" y="628" width="114.0" height="17" rx="2" fill="var(--color-amber)"/>
<text data-panel="iron-en-grades-m-card-blend" x="34" y="687" fill="var(--color-paper)" font-family="l0g Iron Ore" font-size="17" font-weight="700" text-anchor="start">3 t at 61% Fe · 1.83 t contained Fe</text>
<text data-panel="iron-en-grades-m-card-blend" x="34" y="721" fill="var(--color-muted)" font-family="l0g Iron Ore" font-size="17" font-weight="400" text-anchor="start">Composition: 1 / (grade / 100).</text>
<text data-panel="iron-en-grades-m-card-blend" x="34" y="746" fill="var(--color-muted)" font-family="l0g Iron Ore" font-size="17" font-weight="400" text-anchor="start">Non-Fe includes oxygen bound to iron.</text>
<text data-panel="iron-en-grades-m-card-blend" x="34" y="771" fill="var(--color-muted)" font-family="l0g Iron Ore" font-size="17" font-weight="400" text-anchor="start">Losses and steel yield are outside scope.</text>
<rect id="iron-en-grades-m-card-furnace" x="16" y="803" width="388" height="489" rx="12" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="iron-en-grades-m-card-furnace" x="34" y="836" fill="var(--color-signal)" font-family="l0g Iron Ore" font-size="17" font-weight="700" text-anchor="start">BLAST FURNACE</text>
<text data-panel="iron-en-grades-m-card-furnace" x="34" y="869" fill="var(--color-muted)" font-family="l0g Iron Ore" font-size="17" font-weight="400" text-anchor="start">Size, strength and chemistry.</text>
<text data-panel="iron-en-grades-m-card-furnace" x="34" y="895" fill="var(--color-muted)" font-family="l0g Iron Ore" font-size="17" font-weight="400" text-anchor="start">Prepared ore + coke</text>
<path d="M 210.0 905 L 210.0 941" fill="none" stroke="var(--color-amber)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 206.1500 934.0000 L 210.0 941 L 213.8500 934.0000" fill="none" stroke="var(--color-amber)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
