<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="iron-en-grades-m-title iron-en-grades-m-desc" viewBox="0 0 420 1400" style="width:100%;height:auto" class="l0g-iron-ore-svg">
<title id="iron-en-grades-m-title">Equal iron content, different masses and burdens</title><desc id="iron-en-grades-m-desc">Dry-mass arithmetic examples: one tonne of contained iron requires 1/0.58 = 1.724 tonnes of 58% ore, 1/0.61 = 1.639 tonnes at 61%, or 1/0.67 = 1.493 tonnes at 67%. Iron in mint and non-Fe in amber use the same zero-to-two-tonne scale. Non-Fe includes oxygen bound to iron. Theoretical blend: two tonnes at 58% plus one at 67% yield three tonnes at 61%, with 1.83 tonnes of iron. A blast furnace needs prepared burden with coke and suitable size, strength, chemistry and mineralogy. Drawing not to scale. Sources: l0g calculations, research and Nippon Steel [11, 12].</desc>
<rect id="iron-en-grades-m-frame" x="0" y="0" width="420" height="1400" rx="12" fill="var(--color-ink)"/>
<text data-panel="iron-en-grades-m-frame" x="20" y="30" fill="var(--color-signal)" font-family="l0g Iron Ore" font-size="17" font-weight="700" text-anchor="start">04 / ORE AND BARGAINING</text>
<text data-panel="iron-en-grades-m-frame" x="20" y="65" fill="var(--color-paper)" font-family="l0g Iron Ore" font-size="22" font-weight="700" text-anchor="start">Equal iron content,</text>
<text data-panel="iron-en-grades-m-frame" x="20" y="93" fill="var(--color-paper)" font-family="l0g Iron Ore" font-size="22" font-weight="700" text-anchor="start">different masses and burdens</text>
<rect id="iron-en-grades-m-card-mass" x="16" y="125" width="388" height="385" rx="12" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="iron-en-grades-m-card-mass" x="34" y="159" fill="var(--color-paper)" font-family="l0g Iron Ore" font-size="17" font-weight="700" text-anchor="start">For 1 t Fe · dry ore (t)</text>
<text data-panel="iron-en-grades-m-card-mass" x="34" y="187" fill="var(--color-paper)" font-family="l0g Iron Ore" font-size="17" font-weight="700" text-anchor="start">Fe: mint · non-Fe: amber</text>
<text data-panel="iron-en-grades-m-card-mass" x="34" y="255" fill="var(--color-paper)" font-family="l0g Iron Ore" font-size="17" font-weight="700" text-anchor="start">58% Fe</text>
<rect id="iron-en-grades-m-bar-fe-58" x="126" y="237" width="115" height="24" rx="2" fill="var(--color-signal)"/>
<rect id="iron-en-grades-m-bar-nonfe-58" x="241" y="237" width="83.275862" height="24" rx="2" fill="var(--color-amber)"/>
<text data-panel="iron-en-grades-m-card-mass" x="389" y="256" fill="var(--color-paper)" font-family="l0g Iron Ore" font-size="17" font-weight="700" text-anchor="end">1.724</text>
<text data-panel="iron-en-grades-m-card-mass" x="34" y="327" fill="var(--color-paper)" font-family="l0g Iron Ore" font-size="17" font-weight="700" text-anchor="start">61% Fe</text>
<rect id="iron-en-grades-m-bar-fe-61" x="126" y="309" width="115" height="24" rx="2" fill="var(--color-signal)"/>
<rect id="iron-en-grades-m-bar-nonfe-61" x="241" y="309" width="73.52459" height="24" rx="2" fill="var(--color-amber)"/>
<text data-panel="iron-en-grades-m-card-mass" x="389" y="328" fill="var(--color-paper)" font-family="l0g Iron Ore" font-size="17" font-weight="700" text-anchor="end">1.639</text>
<text data-panel="iron-en-grades-m-card-mass" x="34" y="399" fill="var(--color-paper)" font-family="l0g Iron Ore" font-size="17" font-weight="700" text-anchor="start">67% Fe</text>
<rect id="iron-en-grades-m-bar-fe-67" x="126" y="381" width="115" height="24" rx="2" fill="var(--color-signal)"/>
<rect id="iron-en-grades-m-bar-nonfe-67" x="241" y="381" width="56.641791" height="24" rx="2" fill="var(--color-amber)"/>
<text data-panel="iron-en-grades-m-card-mass" x="389" y="400" fill="var(--color-paper)" font-family="l0g Iron Ore" font-size="17" font-weight="700" text-anchor="end">1.493</text>
<path d="M 126 451 L 126 457" fill="none" stroke="var(--color-line-strong)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text data-panel="iron-en-grades-m-card-mass" x="126" y="481" fill="var(--color-muted)" font-family="l0g Iron Ore" font-size="17" font-weight="400" text-anchor="middle">0</text>
<path d="M 183.5 451 L 183.5 457" fill="none" stroke="var(--color-line-strong)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
