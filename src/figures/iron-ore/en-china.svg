<text data-panel="iron-en-china-d-frame" x="24" y="30" fill="var(--color-signal)" font-family="l0g Iron Ore" font-size="22" font-weight="700" text-anchor="start">05 / ORE AND BARGAINING</text>
<text data-panel="iron-en-china-d-frame" x="24" y="72" fill="var(--color-paper)" font-family="l0g Iron Ore" font-size="30" font-weight="700" text-anchor="start">More ore imported, less steel produced</text>
