<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="iron-fr-china-m-title iron-fr-china-m-desc" viewBox="0 0 420 1040" style="width:100%;height:auto" class="l0g-iron-ore-svg">
<title id="iron-fr-china-m-title">Plus de minerai importé, moins d’acier produit</title><desc id="iron-fr-china-m-desc">Chine, janvier–septembre 2026, variations sur un an : importations de minerai de fer 954,97 Mt, +4,1 % ; acier brut 724,77 Mt, −2,9 %. Chaque variation conserve sa propre base comparable annuelle. Échelle commune de −5 à +5 %. Les volumes d’entrée et de sortie ne sont pas soustraits pour déduire les stocks : humidité, transformations, qualités, propriétaires et calendriers diffèrent. La chaîne arrivages, stocks et mélanges, sidérurgie est qualitative. Sources : données GACC reprises par Mysteel, NBS, worldsteel [13, 14, 15].</desc>
