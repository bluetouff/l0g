<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 800" role="img" aria-labelledby="giga-fr-cap-m-title giga-fr-cap-m-desc" style="width:100%;height:auto" class="l0g-giga-tax-svg">
<title id="giga-fr-cap-m-title">Le plafond coupe le signal fiscal</title><desc id="giga-fr-cap-m-desc">Illustration conditionnelle : chiffre d’affaires français fictif de 1 million d’euros par an, constant ; plafond de 15 % choisi pour cet exemple, soit 150 000 euros. Taxe brute à 0,055 euro par gigaoctet. Le plafond est atteint à 2 727 272,727 gigaoctets ; au-delà, un gigaoctet supplémentaire laisse le montant inchangé. Le texte mentionne aussi 2 % du chiffre d’affaires total avec le mot « ou » : cette figure ne tranche pas l’articulation juridique.</desc>
<rect id="giga-fr-cap-m-frame" x="0" y="0" width="420" height="800" rx="0" fill="var(--color-ink)"/>
<rect id="giga-fr-cap-m-header" x="16" y="16" width="388" height="136" rx="10" fill="var(--color-ink)"/>
<text data-panel="giga-fr-cap-m-header" x="28" y="46" font-family="l0g Giga Tax" font-size="18" font-weight="700" fill="var(--color-signal)" text-anchor="start">LE PLAFOND ET SES EFFETS</text>
<text data-panel="giga-fr-cap-m-header" x="28" y="82" font-family="l0g Giga Tax" font-size="26" font-weight="700" fill="var(--color-paper)" text-anchor="start">Le plafond coupe</text>
<text data-panel="giga-fr-cap-m-header" x="28" y="115" font-family="l0g Giga Tax" font-size="26" font-weight="700" fill="var(--color-paper)" text-anchor="start">le signal fiscal</text>
<rect id="giga-fr-cap-m-body" x="16" y="172" width="388" height="464" rx="10" fill="var(--color-ink)"/>
<text data-panel="giga-fr-cap-m-body" x="28" y="202" font-family="l0g Giga Tax" font-size="20" font-weight="400" fill="var(--color-muted)" text-anchor="start">Taxe annuelle (€)</text>
<text data-panel="giga-fr-cap-m-body" x="70" y="244" font-family="l0g Giga Tax" font-size="20" font-weight="700" fill="var(--color-signal)" text-anchor="start">Plafond : 150 000 €</text>
