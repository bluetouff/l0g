<text data-panel="giga-fr-cap-m-footer" x="28" y="751" font-family="l0g Giga Tax" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">Hypothèse : CA France de 1 M€,</text>
<text data-panel="giga-fr-cap-m-footer" x="28" y="778" font-family="l0g Giga Tax" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">plafond de 15 %, revenu constant.</text>
