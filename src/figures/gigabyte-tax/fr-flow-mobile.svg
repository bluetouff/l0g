<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 800" role="img" aria-labelledby="giga-fr-flow-m-title giga-fr-flow-m-desc" style="width:100%;height:auto" class="l0g-giga-tax-svg">
<title id="giga-fr-flow-m-title">La taxe suit un autre circuit que les données</title><desc id="giga-fr-flow-m-desc">Mécanisme proposé par I-1358 : l’émetteur livre des données, le fournisseur d’accès mesure des volumes agrégés et les transmet à l’administration fiscale ; l’émetteur verse la taxe. Les pointillés représentent des ajustements économiques possibles, dont la répartition dépend du marché. Les flèches ne représentent aucun montant.</desc>
<rect id="giga-fr-flow-m-frame" x="0" y="0" width="420" height="800" rx="0" fill="var(--color-ink)"/>
<rect id="giga-fr-flow-m-header" x="16" y="16" width="388" height="136" rx="10" fill="var(--color-ink)"/>
<text data-panel="giga-fr-flow-m-header" x="28" y="46" font-family="l0g Giga Tax" font-size="18" font-weight="700" fill="var(--color-signal)" text-anchor="start">LE CIRCUIT PROPOSÉ</text>
<text data-panel="giga-fr-flow-m-header" x="28" y="82" font-family="l0g Giga Tax" font-size="26" font-weight="700" fill="var(--color-paper)" text-anchor="start">Qui verse, qui mesure,</text>
<text data-panel="giga-fr-flow-m-header" x="28" y="115" font-family="l0g Giga Tax" font-size="26" font-weight="700" fill="var(--color-paper)" text-anchor="start">qui peut payer au final</text>
<rect id="giga-fr-flow-m-body" x="16" y="160" width="388" height="488" rx="10" fill="var(--color-ink)"/>
<rect id="giga-fr-flow-m-card-issuer" x="40" y="180" width="145" height="88" rx="8" fill="var(--color-surface)" stroke="var(--color-signal)" stroke-width="2"/>
<text data-panel="giga-fr-flow-m-card-issuer" x="112.5" y="214" font-family="l0g Giga Tax" font-size="22" font-weight="700" fill="var(--color-paper)" text-anchor="middle">Émetteur</text>
<text data-panel="giga-fr-flow-m-card-issuer" x="112.5" y="246" font-family="l0g Giga Tax" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="middle">Contenu</text>
<rect id="giga-fr-flow-m-card-reader" x="235" y="180" width="145" height="88" rx="8" fill="var(--color-surface)" stroke="var(--color-signal)" stroke-width="2"/>
<text data-panel="giga-fr-flow-m-card-reader" x="307.5" y="214" font-family="l0g Giga Tax" font-size="22" font-weight="700" fill="var(--color-paper)" text-anchor="middle">Abonné</text>
<text data-panel="giga-fr-flow-m-card-reader" x="307.5" y="246" font-family="l0g Giga Tax" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="middle">Données</text>
<rect id="giga-fr-flow-m-card-access" x="130" y="330" width="160" height="88" rx="8" fill="var(--color-surface)" stroke="var(--color-signal)" stroke-width="2"/>
<text data-panel="giga-fr-flow-m-card-access" x="210" y="364" font-family="l0g Giga Tax" font-size="20" font-weight="700" fill="var(--color-paper)" text-anchor="middle">Opérateur</text>
<text data-panel="giga-fr-flow-m-card-access" x="210" y="396" font-family="l0g Giga Tax" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="middle">Mesure</text>
<path data-connector="data-to-access" d="M112 274 L112 374 L124 374" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path data-connector="data-to-access-arrow" d="M117 367 L124 374 L117 381" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
