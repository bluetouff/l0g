<path data-connector="possible-incidence" d="M34 224 L24 224 L24 626 L395 626 L395 224 L386 224" fill="none" stroke="var(--color-accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7"/>
<path data-connector="possible-incidence-arrow" d="M393 217 L386 224 L393 231" fill="none" stroke="var(--color-accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text data-panel="giga-fr-flow-m-body" x="210" y="609" font-family="l0g Giga Tax" font-size="18" font-weight="400" fill="var(--color-accent)" text-anchor="middle">Prix, publicité, services</text>
<rect id="giga-fr-flow-m-footer" x="16" y="676" width="388" height="110" rx="10" fill="var(--color-ink)"/>
<text data-panel="giga-fr-flow-m-footer" x="28" y="702" font-family="l0g Giga Tax" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">Turquoise : données et mesures</text>
<text data-panel="giga-fr-flow-m-footer" x="28" y="735" font-family="l0g Giga Tax" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">Ambre : versement fiscal</text>
<text data-panel="giga-fr-flow-m-footer" x="28" y="768" font-family="l0g Giga Tax" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">Pointillés : effets possibles</text>
