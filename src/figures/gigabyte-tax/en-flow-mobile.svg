<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 800" role="img" aria-labelledby="giga-en-flow-m-title giga-en-flow-m-desc" style="width:100%;height:auto" class="l0g-giga-tax-svg">
<title id="giga-en-flow-m-title">The tax follows a separate route from the data</title><desc id="giga-en-flow-m-desc">Proposed mechanism in I-1358: the provider sends data, the access provider measures aggregate volumes and reports them to the tax authority; the content provider pays the tax. Dotted arrows represent possible economic adjustments whose distribution depends on the market. Arrow widths represent no amount.</desc>
<rect id="giga-en-flow-m-frame" x="0" y="0" width="420" height="800" rx="0" fill="var(--color-ink)"/>
<rect id="giga-en-flow-m-header" x="16" y="16" width="388" height="136" rx="10" fill="var(--color-ink)"/>
<text data-panel="giga-en-flow-m-header" x="28" y="46" font-family="l0g Giga Tax" font-size="18" font-weight="700" fill="var(--color-signal)" text-anchor="start">THE PROPOSED SYSTEM</text>
<text data-panel="giga-en-flow-m-header" x="28" y="82" font-family="l0g Giga Tax" font-size="26" font-weight="700" fill="var(--color-paper)" text-anchor="start">Who pays the tax,</text>
<text data-panel="giga-en-flow-m-header" x="28" y="115" font-family="l0g Giga Tax" font-size="26" font-weight="700" fill="var(--color-paper)" text-anchor="start">who bears the cost</text>
<rect id="giga-en-flow-m-body" x="16" y="160" width="388" height="488" rx="10" fill="var(--color-ink)"/>
<rect id="giga-en-flow-m-card-issuer" x="40" y="180" width="145" height="88" rx="8" fill="var(--color-surface)" stroke="var(--color-signal)" stroke-width="2"/>
<text data-panel="giga-en-flow-m-card-issuer" x="112.5" y="214" font-family="l0g Giga Tax" font-size="22" font-weight="700" fill="var(--color-paper)" text-anchor="middle">Provider</text>
<text data-panel="giga-en-flow-m-card-issuer" x="112.5" y="246" font-family="l0g Giga Tax" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="middle">Content</text>
<rect id="giga-en-flow-m-card-reader" x="235" y="180" width="145" height="88" rx="8" fill="var(--color-surface)" stroke="var(--color-signal)" stroke-width="2"/>
<text data-panel="giga-en-flow-m-card-reader" x="307.5" y="214" font-family="l0g Giga Tax" font-size="22" font-weight="700" fill="var(--color-paper)" text-anchor="middle">Subscriber</text>
<text data-panel="giga-en-flow-m-card-reader" x="307.5" y="246" font-family="l0g Giga Tax" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="middle">Receives data</text>
<rect id="giga-en-flow-m-card-access" x="130" y="330" width="160" height="88" rx="8" fill="var(--color-surface)" stroke="var(--color-signal)" stroke-width="2"/>
<text data-panel="giga-en-flow-m-card-access" x="210" y="364" font-family="l0g Giga Tax" font-size="20" font-weight="700" fill="var(--color-paper)" text-anchor="middle">ISP</text>
<text data-panel="giga-en-flow-m-card-access" x="210" y="396" font-family="l0g Giga Tax" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="middle">Measurement</text>
<path data-connector="data-to-access" d="M112 274 L112 374 L124 374" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path data-connector="data-to-access-arrow" d="M117 367 L124 374 L117 381" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path data-connector="data-to-subscriber" d="M296 374 L307 374 L307 274" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path data-connector="data-to-subscriber-arrow" d="M300 281 L307 274 L314 281" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect id="giga-en-flow-m-card-state" x="140" y="495" width="140" height="88" rx="8" fill="var(--color-surface)" stroke="var(--color-amber)" stroke-width="2"/>
<text data-panel="giga-en-flow-m-card-state" x="210" y="530" font-family="l0g Giga Tax" font-size="22" font-weight="700" fill="var(--color-paper)" text-anchor="middle">State</text>
<text data-panel="giga-en-flow-m-card-state" x="210" y="561" font-family="l0g Giga Tax" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="middle">Tax authority</text>
<path data-connector="measured-volumes" d="M210 424 L210 489" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
