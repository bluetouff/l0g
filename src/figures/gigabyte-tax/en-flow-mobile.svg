<text data-panel="giga-en-flow-m-body" x="230" y="459" font-family="l0g Giga Tax" font-size="18" font-weight="400" fill="var(--color-signal)" text-anchor="start">Volumes</text>
<path data-connector="tax-payment" d="M65 274 L65 540 L134 540" fill="none" stroke="var(--color-amber)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path data-connector="tax-payment-arrow" d="M127 533 L134 540 L127 547" fill="none" stroke="var(--color-amber)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text data-panel="giga-en-flow-m-body" x="75" y="518" font-family="l0g Giga Tax" font-size="18" font-weight="700" fill="var(--color-amber)" text-anchor="start">Tax</text>
<path data-connector="possible-incidence" d="M34 224 L24 224 L24 626 L395 626 L395 224 L386 224" fill="none" stroke="var(--color-accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7"/>
<path data-connector="possible-incidence-arrow" d="M393 217 L386 224 L393 231" fill="none" stroke="var(--color-accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text data-panel="giga-en-flow-m-body" x="210" y="609" font-family="l0g Giga Tax" font-size="18" font-weight="400" fill="var(--color-accent)" text-anchor="middle">Prices, advertising, services</text>
<rect id="giga-en-flow-m-footer" x="16" y="676" width="388" height="110" rx="10" fill="var(--color-ink)"/>
<text data-panel="giga-en-flow-m-footer" x="28" y="702" font-family="l0g Giga Tax" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">Turquoise: data and measurement</text>
<text data-panel="giga-en-flow-m-footer" x="28" y="735" font-family="l0g Giga Tax" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">Amber: tax payment</text>
<text data-panel="giga-en-flow-m-footer" x="28" y="768" font-family="l0g Giga Tax" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">Dotted lines: possible effects</text>
</svg>
