<text data-panel="giga-fr-cap-d-body" x="500" y="555" font-family="l0g Giga Tax" font-size="24" font-weight="400" fill="var(--color-muted)" text-anchor="middle">Volume annuel (millions de Go)</text>
<rect id="giga-fr-cap-d-footer" x="16" y="600" width="968" height="68" rx="10" fill="var(--color-ink)"/>
<text data-panel="giga-fr-cap-d-footer" x="40" y="626" font-family="l0g Giga Tax" font-size="24" font-weight="400" fill="var(--color-muted)" text-anchor="start">Hypothèse : 1 M€ de CA France, plafond de 15 %, revenu constant</text>
<text data-panel="giga-fr-cap-d-footer" x="40" y="658" font-family="l0g Giga Tax" font-size="24" font-weight="400" fill="var(--color-muted)" text-anchor="start">Ambre : calcul brut à 0,055 €/Go · Turquoise : montant plafonné</text>
</svg>
