<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" style="width:100%;height:auto" class="l0g-meta-capital-svg" role="img" aria-labelledby="meta-capital-fr-forward-d-title meta-capital-fr-forward-d-desc"><title id="meta-capital-fr-forward-d-title">Le forward en deux étapes</title><desc id="meta-capital-fr-forward-d-desc">Montage initial attendu le 29 octobre 2026 : les intermédiaires empruntent 40 millions d’actions A et les vendent aux investisseurs au prix de 625 dollars. Meta ne reçoit aucun produit initial prévu. En règlement physique, Meta livre de nouvelles actions contre le prix forward ajusté ; les intermédiaires rendent les titres empruntés. Le prix initial est de 622,91875 dollars par action. Après le dividende C et l’approbation de cotation, les contrats se scindent en branches A et C, avec ajustements.</desc>
