<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" style="width:100%;height:auto" class="l0g-meta-capital-svg" role="img" aria-labelledby="meta-capital-en-votes-d-title meta-capital-en-votes-d-desc"><title id="meta-capital-en-votes-d-title">Meta: shares and voting rights</title><desc id="meta-capital-en-votes-d-desc">On 1 October 2026, Meta has 2,214,455,318 Class A and 341,786,026 Class B shares. Class B represents 13.37% of shares and 60.68% of votes, with ten votes per share versus one for A. C will have no vote with statutory or charter exceptions. The planned dividend of one C per A or B preserves ownership fractions at a constant share structure.</desc>
