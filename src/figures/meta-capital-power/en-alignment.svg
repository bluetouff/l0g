<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" style="width:100%;height:auto" class="l0g-meta-capital-svg" role="img" aria-labelledby="meta-capital-en-alignment-d-title meta-capital-en-alignment-d-desc"><title id="meta-capital-en-alignment-d-title">Releasing the founder’s C shares</title><desc id="meta-capital-en-alignment-d-desc">The founder agreement frees an initial 20% of C shares from the matching rule. The remaining 80% follow conditions tied to A or B disposals, B-to-A conversion or contractual credits. The quarterly route adds 2.5 percentage points of the initial base per eligible quarter, up to 32 quarters, subject to continued leadership. The curve shows this route alone.</desc>
