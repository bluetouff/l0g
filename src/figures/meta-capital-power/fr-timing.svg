<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" style="width:100%;height:auto" class="l0g-meta-capital-svg" role="img" aria-labelledby="meta-capital-fr-timing-d-title meta-capital-fr-timing-d-desc"><title id="meta-capital-fr-timing-d-title">Des instruments aux échéances différentes</title><desc id="meta-capital-fr-timing-d-desc">Arrêt documentaire au 28 octobre 2026. Le prix des opérations est fixé le 26 octobre et le communiqué affiché le 27. La clôture est attendue le 29 octobre : 12,5 milliards de dollars d’actions préférentielles convertibles et un forward A de 25 milliards. Le forward diffère le produit pour Meta jusqu’au règlement, au plus tard le 19 novembre 2027. La classe C doit prendre effet le 19 janvier 2027, tandis que les dates du dividende restent à annoncer. La conversion obligatoire des préférentielles est attendue autour du 15 août 2029. Un programme ATM d’environ 60 milliards de dollars de C est envisagé, sans accord conclu ni calendrier fixé.</desc>
