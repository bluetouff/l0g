<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" style="width:100%;height:auto" class="l0g-meta-capital-svg" role="img" aria-labelledby="meta-capital-en-forward-d-title meta-capital-en-forward-d-desc"><title id="meta-capital-en-forward-d-title">The forward in two stages</title><desc id="meta-capital-en-forward-d-desc">Initial transaction expected on 29 October 2026: intermediaries borrow 40 million Class A shares and sell them to investors at $625. Meta expects no initial proceeds. Under physical settlement, Meta delivers new shares for the adjusted forward price; intermediaries return borrowed shares. The initial forward price is $622.91875 per share. After the C dividend and listing approval, contracts split into A and C transactions with adjustments.</desc>
