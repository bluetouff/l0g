<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1080" style="width:100%;height:auto" class="l0g-meta-capital-svg" role="img" aria-labelledby="meta-capital-fr-votes-m-title meta-capital-fr-votes-m-desc"><title id="meta-capital-fr-votes-m-title">Meta : les titres et les droits de vote</title><desc id="meta-capital-fr-votes-m-desc">Au 1er octobre 2026, Meta compte 2 214 455 318 actions A et 341 786 026 actions B. Les B représentent 13,37 % des titres et 60,68 % des voix grâce à leurs dix votes par action, contre un pour A. C aura zéro vote sauf exceptions légales ou statutaires. Le dividende prévu d’une C pour chaque A ou B conserve les fractions de titres à structure constante.</desc>
