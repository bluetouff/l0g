<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" style="width:100%;height:auto" class="l0g-meta-capital-svg" role="img" aria-labelledby="meta-capital-fr-alignment-d-title meta-capital-fr-alignment-d-desc"><title id="meta-capital-fr-alignment-d-title">La libération des C du fondateur</title><desc id="meta-capital-fr-alignment-d-desc">Le contrat du fondateur prévoit une fraction de base de 20 % de C libres de la règle d’appariement. Les 80 % restants suivent des conditions liées à la cession de A ou B, à la conversion de B en A ou à des crédits contractuels. La voie trimestrielle ajoute 2,5 points de la base initiale par trimestre admissible, jusqu’à 32 trimestres, sous condition de continuité de la direction. La courbe représente cette voie seule.</desc>
