<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" style="width:100%;height:auto" class="l0g-meta-capital-svg" role="img" aria-labelledby="meta-capital-en-timing-d-title meta-capital-en-timing-d-desc"><title id="meta-capital-en-timing-d-title">Different instruments, different deadlines</title><desc id="meta-capital-en-timing-d-desc">Documentary cutoff: 28 October 2026. Pricing is dated 26 October and the release posted on 27 October. Closing is expected on 29 October: $12.5 billion in mandatory convertible preferred stock and a $25 billion Class A forward. The forward defers proceeds to Meta until settlement, by 19 November 2027. C creation is set to take effect on 19 January 2027, while dividend dates remain to be announced. Mandatory preferred conversion is expected around 15 August 2029. An approximately $60 billion C ATM programme is contemplated, with no agreement yet entered into and no fixed schedule.</desc>
