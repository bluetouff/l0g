<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cumcum-en-comparison-d-title cumcum-en-comparison-d-desc" viewBox="0 0 1000 650" style="width:100%;height:auto" class="l0g-cumcum-svg">
<title id="cumcum-en-comparison-d-title">Two routes to a fiscal loss</title><desc id="cumcum-en-comparison-d-desc">Cum-cum: interposition changes tax treatment and withholding is avoided or reduced. Cum-ex: tax certificates and credit or refund claims without corresponding collection. Qualitative diagram; no loss estimate.</desc>
<rect id="cumcum-en-comparison-d-frame" x="0" y="0" width="1000" height="650" rx="8" fill="var(--color-ink)"/>
<text data-panel="cumcum-en-comparison-d-frame" x="24" y="30" fill="var(--color-signal)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">l0g / CUM-CUM / 04</text>
<text data-panel="cumcum-en-comparison-d-frame" x="24" y="74" fill="var(--color-paper)" font-family="l0g CumCum" font-size="30" font-weight="700" text-anchor="start">Two routes to a fiscal loss</text>
<text data-panel="cumcum-en-comparison-d-frame" x="24" y="112" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Locate the advantage before measuring it</text>
<rect id="cumcum-en-comparison-d-card-case-0" x="24" y="150" width="464" height="365" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<path d="M 27 153 L 27 512" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text data-panel="cumcum-en-comparison-d-card-case-0" x="44" y="181" fill="var(--color-signal)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">CUM-CUM</text>
<text data-panel="cumcum-en-comparison-d-card-case-0" x="44" y="222" fill="var(--color-paper)" font-family="l0g CumCum" font-size="26" font-weight="700" text-anchor="start">Withholding is avoided</text>
<text data-panel="cumcum-en-comparison-d-card-case-0" x="44" y="256" fill="var(--color-paper)" font-family="l0g CumCum" font-size="26" font-weight="700" text-anchor="start">or reduced</text>
<text data-panel="cumcum-en-comparison-d-card-case-0" x="44" y="305" fill="var(--color-signal)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">•</text>
<text data-panel="cumcum-en-comparison-d-card-case-0" x="66" y="305" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Temporary holding</text>
<path d="M 49 314 L 49 328" fill="none" stroke="var(--color-line-strong)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text data-panel="cumcum-en-comparison-d-card-case-0" x="44" y="346" fill="var(--color-signal)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">•</text>
<text data-panel="cumcum-en-comparison-d-card-case-0" x="66" y="346" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Different tax treatment</text>
<path d="M 49 355 L 49 369" fill="none" stroke="var(--color-line-strong)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text data-panel="cumcum-en-comparison-d-card-case-0" x="44" y="387" fill="var(--color-signal)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">•</text>
<text data-panel="cumcum-en-comparison-d-card-case-0" x="66" y="387" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Value shared by contract</text>
<path d="M 44 411 L 468 411" fill="none" stroke="var(--color-line-strong)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text data-panel="cumcum-en-comparison-d-card-case-0" x="44" y="441" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Examine: shares, counterparties,</text>
<text data-panel="cumcum-en-comparison-d-card-case-0" x="44" y="470" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">pricing and beneficial ownership.</text>
<rect id="cumcum-en-comparison-d-card-case-1" x="512" y="150" width="464" height="365" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<path d="M 515 153 L 515 512" fill="none" stroke="var(--color-amber)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text data-panel="cumcum-en-comparison-d-card-case-1" x="532" y="181" fill="var(--color-amber)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">CUM-EX</text>
<text data-panel="cumcum-en-comparison-d-card-case-1" x="532" y="222" fill="var(--color-paper)" font-family="l0g CumCum" font-size="26" font-weight="700" text-anchor="start">A tax claim without</text>
<text data-panel="cumcum-en-comparison-d-card-case-1" x="532" y="256" fill="var(--color-paper)" font-family="l0g CumCum" font-size="26" font-weight="700" text-anchor="start">corresponding collection</text>
<text data-panel="cumcum-en-comparison-d-card-case-1" x="532" y="305" fill="var(--color-amber)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">•</text>
<text data-panel="cumcum-en-comparison-d-card-case-1" x="554" y="305" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Withholding certificates</text>
<path d="M 537 314 L 537 328" fill="none" stroke="var(--color-line-strong)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text data-panel="cumcum-en-comparison-d-card-case-1" x="532" y="346" fill="var(--color-amber)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">•</text>
<text data-panel="cumcum-en-comparison-d-card-case-1" x="554" y="346" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Tax credit or refund</text>
<path d="M 537 355 L 537 369" fill="none" stroke="var(--color-line-strong)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text data-panel="cumcum-en-comparison-d-card-case-1" x="532" y="387" fill="var(--color-amber)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">•</text>
<text data-panel="cumcum-en-comparison-d-card-case-1" x="554" y="387" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">No matching tax collected</text>
<path d="M 532 411 L 956 411" fill="none" stroke="var(--color-line-strong)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text data-panel="cumcum-en-comparison-d-card-case-1" x="532" y="441" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Examine: tax actually paid,</text>
<text data-panel="cumcum-en-comparison-d-card-case-1" x="532" y="470" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">certificates and claims.</text>
<text data-panel="cumcum-en-comparison-d-frame" x="24" y="562" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Cases and losses require separate measurement.</text>
<text data-panel="cumcum-en-comparison-d-frame" x="24" y="595" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Qualitative drawing; details vary across countries and cases.</text>
<text data-panel="cumcum-en-comparison-d-frame" x="24" y="628" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">CE, 27 Jan 2025; Bundestag, 18/12700, 20 Jun 2017, p.76 [S3, S11].</text>
</svg>
