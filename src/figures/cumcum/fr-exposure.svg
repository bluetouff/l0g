<text data-panel="cumcum-fr-exposure-d-frame" x="24" y="560" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Exposition économique et bénéficiaire effectif : analyses distinctes.</text>
<text data-panel="cumcum-fr-exposure-d-frame" x="24" y="594" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Le droit d’utiliser le revenu et l’obligation de reversement comptent.</text>
<text data-panel="cumcum-fr-exposure-d-frame" x="24" y="628" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Contrat simplifié ; garanties omises. CJIP §23 ; CE ; BOFiP §30 [S1, S3, S8].</text>
