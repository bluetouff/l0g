<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cumcum-fr-exposure-d-title cumcum-fr-exposure-d-desc" viewBox="0 0 1000 650" style="width:100%;height:auto" class="l0g-cumcum-svg">
<title id="cumcum-fr-exposure-d-title">Le titre et sa performance se séparent</title><desc id="cumcum-fr-exposure-d-desc">Schéma de contrat : l’intermédiaire détient le titre et reçoit le dividende, un contrat transmet la variation du prix et une composante liée au dividende à l’investisseur. La composante de financement et les pertes éventuelles créent des flux inverses. La qualification fiscale dépend des engagements et du droit applicable.</desc>
<rect id="cumcum-fr-exposure-d-frame" x="0" y="0" width="1000" height="650" rx="8" fill="var(--color-ink)"/>
<text data-panel="cumcum-fr-exposure-d-frame" x="24" y="30" fill="var(--color-signal)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">l0g / CUM-CUM / 03</text>
<text data-panel="cumcum-fr-exposure-d-frame" x="24" y="74" fill="var(--color-paper)" font-family="l0g CumCum" font-size="30" font-weight="700" text-anchor="start">Le titre et sa performance se séparent</text>
<text data-panel="cumcum-fr-exposure-d-frame" x="24" y="112" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Un contrat transmet une exposition économique</text>
<rect id="cumcum-fr-exposure-d-card-property" x="24" y="145" width="952" height="150" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="cumcum-fr-exposure-d-card-property" x="44" y="179" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">CIRCUIT DE PROPRIÉTÉ ET DU DIVIDENDE</text>
<text data-panel="cumcum-fr-exposure-d-card-property" x="44" y="234" fill="var(--color-paper)" font-family="l0g CumCum" font-size="26" font-weight="700" text-anchor="start">Société émettrice</text>
<text data-panel="cumcum-fr-exposure-d-card-property" x="750" y="234" fill="var(--color-amber)" font-family="l0g CumCum" font-size="26" font-weight="700" text-anchor="start">Intermédiaire</text>
<text data-panel="cumcum-fr-exposure-d-card-property" x="750" y="271" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Détenteur du titre</text>
<path d="M 316 225 L 720 225" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
