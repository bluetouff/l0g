<path d="M 853 299 L 853 319" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 849.1500 312.0000 L 853 319 L 856.8500 312.0000" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect id="cumcum-fr-exposure-d-card-contract" x="24" y="326" width="952" height="188" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="cumcum-fr-exposure-d-card-contract" x="44" y="359" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">CIRCUIT CONTRACTUEL</text>
<text data-panel="cumcum-fr-exposure-d-card-contract" x="44" y="413" fill="var(--color-signal)" font-family="l0g CumCum" font-size="26" font-weight="700" text-anchor="start">Investisseur</text>
<text data-panel="cumcum-fr-exposure-d-card-contract" x="44" y="449" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Exposition reçue</text>
