<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cumcum-en-exposure-d-title cumcum-en-exposure-d-desc" viewBox="0 0 1000 650" style="width:100%;height:auto" class="l0g-cumcum-svg">
<title id="cumcum-en-exposure-d-title">Ownership and performance can part</title><desc id="cumcum-en-exposure-d-desc">Contract schematic: an intermediary holds the share and receives its dividend. A contract passes price performance and a dividend-related component to an investor. Financing and potential losses create flows in the opposite direction. Tax status depends on the obligations and applicable law.</desc>
<rect id="cumcum-en-exposure-d-frame" x="0" y="0" width="1000" height="650" rx="8" fill="var(--color-ink)"/>
<text data-panel="cumcum-en-exposure-d-frame" x="24" y="30" fill="var(--color-signal)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">l0g / CUM-CUM / 03</text>
<text data-panel="cumcum-en-exposure-d-frame" x="24" y="74" fill="var(--color-paper)" font-family="l0g CumCum" font-size="30" font-weight="700" text-anchor="start">Ownership and performance can part</text>
<text data-panel="cumcum-en-exposure-d-frame" x="24" y="112" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">A contract passes on economic exposure</text>
<rect id="cumcum-en-exposure-d-card-property" x="24" y="145" width="952" height="150" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="cumcum-en-exposure-d-card-property" x="44" y="179" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">SHARE OWNERSHIP AND DIVIDEND ROUTE</text>
<text data-panel="cumcum-en-exposure-d-card-property" x="44" y="234" fill="var(--color-paper)" font-family="l0g CumCum" font-size="26" font-weight="700" text-anchor="start">Issuing company</text>
<text data-panel="cumcum-en-exposure-d-card-property" x="750" y="234" fill="var(--color-amber)" font-family="l0g CumCum" font-size="26" font-weight="700" text-anchor="start">Intermediary</text>
<text data-panel="cumcum-en-exposure-d-card-property" x="750" y="271" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Holds the share</text>
<path d="M 316 225 L 720 225" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 713.0000 228.8500 L 720 225 L 713.0000 221.1500" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text data-panel="cumcum-en-exposure-d-card-property" x="518" y="210" fill="var(--color-amber)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="middle">Dividend</text>
<path d="M 853 299 L 853 319" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 849.1500 312.0000 L 853 319 L 856.8500 312.0000" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect id="cumcum-en-exposure-d-card-contract" x="24" y="326" width="952" height="188" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="cumcum-en-exposure-d-card-contract" x="44" y="359" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">CONTRACTUAL ROUTE</text>
<text data-panel="cumcum-en-exposure-d-card-contract" x="44" y="413" fill="var(--color-signal)" font-family="l0g CumCum" font-size="26" font-weight="700" text-anchor="start">Investor</text>
<text data-panel="cumcum-en-exposure-d-card-contract" x="44" y="449" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Receives exposure</text>
<text data-panel="cumcum-en-exposure-d-card-contract" x="756" y="413" fill="var(--color-amber)" font-family="l0g CumCum" font-size="25" font-weight="700" text-anchor="start">Intermediary</text>
<text data-panel="cumcum-en-exposure-d-card-contract" x="520" y="388" fill="var(--color-signal)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="middle">Price return + dividend component</text>
<path d="M 728 405 L 310 405" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 317.0000 401.1500 L 310 405 L 317.0000 408.8500" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 310 461 L 728 461" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/>
<path d="M 721.0000 464.8500 L 728 461 L 721.0000 457.1500" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text data-panel="cumcum-en-exposure-d-card-contract" x="520" y="497" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="middle">Financing / losses under the contract</text>
<text data-panel="cumcum-en-exposure-d-frame" x="24" y="560" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Economic exposure and beneficial ownership: distinct assessments.</text>
<text data-panel="cumcum-en-exposure-d-frame" x="24" y="594" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Rights to use income and duties to pass it on matter for the tax analysis.</text>
<text data-panel="cumcum-en-exposure-d-frame" x="24" y="628" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Simplified terms; collateral omitted. CJIP §23; CE; BOFiP §30 [S1, S3, S8].</text>
</svg>
