<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cumcum-en-cycle-d-title cumcum-en-cycle-d-desc" viewBox="0 0 1000 650" style="width:100%;height:auto" class="l0g-cumcum-svg">
<title id="cumcum-en-cycle-d-title">The shares change hands</title><desc id="cumcum-en-cycle-d-desc">Temporary transfer before the ex-date, dividend entitlement at the intermediary, payment, and unwind. Economic exposure may be retained by contract. Conceptual diagram, not an actual trade or calendar.</desc>
<rect id="cumcum-en-cycle-d-frame" x="0" y="0" width="1000" height="650" rx="8" fill="var(--color-ink)"/>
<text data-panel="cumcum-en-cycle-d-frame" x="24" y="30" fill="var(--color-signal)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">l0g / CUM-CUM / 01</text>
<text data-panel="cumcum-en-cycle-d-frame" x="24" y="74" fill="var(--color-paper)" font-family="l0g CumCum" font-size="30" font-weight="700" text-anchor="start">The shares change hands</text>
<text data-panel="cumcum-en-cycle-d-frame" x="24" y="112" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">One sequence, distinct dates</text>
<rect id="cumcum-en-cycle-d-card-step-0" x="24" y="170" width="220" height="192" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="cumcum-en-cycle-d-frame" x="36" y="154" fill="var(--color-amber)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">01 BEFORE</text>
<text data-panel="cumcum-en-cycle-d-card-step-0" x="38" y="211" fill="var(--color-signal)" font-family="l0g CumCum" font-size="24" font-weight="700" text-anchor="start">Investor</text>
<path d="M 38 232 L 230 232" fill="none" stroke="var(--color-line-strong)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
