<text data-panel="cumcum-en-cycle-d-frame" x="280" y="154" fill="var(--color-amber)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">02 EX-DATE</text>
<text data-panel="cumcum-en-cycle-d-card-step-1" x="282" y="211" fill="var(--color-amber)" font-family="l0g CumCum" font-size="24" font-weight="700" text-anchor="start">Intermediary</text>
