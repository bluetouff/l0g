<text data-panel="cumcum-en-cycle-d-card-step-0" x="38" y="287" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">transfer of the</text>
<text data-panel="cumcum-en-cycle-d-card-step-0" x="38" y="316" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">shares</text>
