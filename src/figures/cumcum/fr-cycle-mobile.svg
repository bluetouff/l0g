<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cumcum-fr-cycle-m-title cumcum-fr-cycle-m-desc" viewBox="0 0 420 950" style="width:100%;height:auto" class="l0g-cumcum-svg">
<title id="cumcum-fr-cycle-m-title">Le titre change de mains</title><desc id="cumcum-fr-cycle-m-desc">Transfert temporaire avant le détachement, droit au dividende chez l’intermédiaire, paiement, puis dénouement. L’exposition économique peut subsister par contrat. Schéma conceptuel, sans calendrier ni transaction réelle.</desc>
<rect id="cumcum-fr-cycle-m-frame" x="0" y="0" width="420" height="950" rx="8" fill="var(--color-ink)"/>
<text data-panel="cumcum-fr-cycle-m-frame" x="20" y="30" fill="var(--color-signal)" font-family="l0g CumCum" font-size="17" font-weight="700" text-anchor="start">l0g / CUM-CUM / 01</text>
<text data-panel="cumcum-fr-cycle-m-frame" x="20" y="66" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">Le titre change de mains</text>
<text data-panel="cumcum-fr-cycle-m-frame" x="20" y="106" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Une séquence, des dates distinctes</text>
<rect id="cumcum-fr-cycle-m-card-step-0" x="80" y="138" width="320" height="124" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="cumcum-fr-cycle-m-frame" x="20" y="169" fill="var(--color-amber)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">01</text>
<text data-panel="cumcum-fr-cycle-m-card-step-0" x="96" y="166" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="700" text-anchor="start">AVANT</text>
<text data-panel="cumcum-fr-cycle-m-card-step-0" x="96" y="198" fill="var(--color-signal)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">Investisseur</text>
<text data-panel="cumcum-fr-cycle-m-card-step-0" x="96" y="225" fill="var(--color-paper)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Transfert temporaire</text>
<text data-panel="cumcum-fr-cycle-m-card-step-0" x="96" y="248" fill="var(--color-paper)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">des titres</text>
<path d="M 42 189 L 42 271" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 38.1500 264.0000 L 42 271 L 45.8500 264.0000" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect id="cumcum-fr-cycle-m-card-step-1" x="80" y="276" width="320" height="124" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="cumcum-fr-cycle-m-frame" x="20" y="307" fill="var(--color-amber)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">02</text>
<text data-panel="cumcum-fr-cycle-m-card-step-1" x="96" y="304" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="700" text-anchor="start">DÉTACHEMENT</text>
<text data-panel="cumcum-fr-cycle-m-card-step-1" x="96" y="336" fill="var(--color-amber)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">Intermédiaire</text>
<text data-panel="cumcum-fr-cycle-m-card-step-1" x="96" y="363" fill="var(--color-paper)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Le droit au dividende</text>
<text data-panel="cumcum-fr-cycle-m-card-step-1" x="96" y="386" fill="var(--color-paper)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">est détaché de l’action</text>
<path d="M 42 327 L 42 409" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 38.1500 402.0000 L 42 409 L 45.8500 402.0000" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect id="cumcum-fr-cycle-m-card-step-2" x="80" y="414" width="320" height="124" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="cumcum-fr-cycle-m-frame" x="20" y="445" fill="var(--color-amber)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">03</text>
<text data-panel="cumcum-fr-cycle-m-card-step-2" x="96" y="442" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="700" text-anchor="start">PAIEMENT</text>
<text data-panel="cumcum-fr-cycle-m-card-step-2" x="96" y="474" fill="var(--color-amber)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">Intermédiaire</text>
<text data-panel="cumcum-fr-cycle-m-card-step-2" x="96" y="501" fill="var(--color-paper)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Le dividende brut</text>
<text data-panel="cumcum-fr-cycle-m-card-step-2" x="96" y="524" fill="var(--color-paper)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">est encaissé</text>
<path d="M 42 465 L 42 547" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 38.1500 540.0000 L 42 547 L 45.8500 540.0000" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect id="cumcum-fr-cycle-m-card-step-3" x="80" y="552" width="320" height="124" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="cumcum-fr-cycle-m-frame" x="20" y="583" fill="var(--color-amber)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">04</text>
<text data-panel="cumcum-fr-cycle-m-card-step-3" x="96" y="580" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="700" text-anchor="start">DÉNOUEMENT</text>
<text data-panel="cumcum-fr-cycle-m-card-step-3" x="96" y="612" fill="var(--color-signal)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">Investisseur</text>
<text data-panel="cumcum-fr-cycle-m-card-step-3" x="96" y="639" fill="var(--color-paper)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Retour des titres ;</text>
<text data-panel="cumcum-fr-cycle-m-card-step-3" x="96" y="662" fill="var(--color-paper)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">règlements contractuels</text>
<rect id="cumcum-fr-cycle-m-card-contract" x="20" y="704" width="380" height="70" rx="8" fill="var(--color-surface-2)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="cumcum-fr-cycle-m-card-contract" x="36" y="733" fill="var(--color-accent)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">L’exposition économique peut</text>
<text data-panel="cumcum-fr-cycle-m-card-contract" x="36" y="757" fill="var(--color-accent)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">être maintenue par contrat.</text>
<text data-panel="cumcum-fr-cycle-m-frame" x="20" y="814" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="700" text-anchor="start">CIRCUIT DU REVENU</text>
<text data-panel="cumcum-fr-cycle-m-frame" x="20" y="845" fill="var(--color-paper)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Société → intermédiaire → investisseur</text>
<text data-panel="cumcum-fr-cycle-m-frame" x="20" y="872" fill="var(--color-paper)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Le revenu suit les engagements du contrat.</text>
<text data-panel="cumcum-fr-cycle-m-frame" x="20" y="897" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Schéma pédagogique, sans échelle de temps.</text>
<text data-panel="cumcum-fr-cycle-m-frame" x="20" y="918" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Garanties et dépositaires omis.</text>
<text data-panel="cumcum-fr-cycle-m-frame" x="20" y="939" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">CJIP CACIB ; CE ; SEC [S1, S3, S5].</text>
</svg>
