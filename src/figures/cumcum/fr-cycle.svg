<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cumcum-fr-cycle-d-title cumcum-fr-cycle-d-desc" viewBox="0 0 1000 650" style="width:100%;height:auto" class="l0g-cumcum-svg">
<title id="cumcum-fr-cycle-d-title">Le titre change de mains</title><desc id="cumcum-fr-cycle-d-desc">Transfert temporaire avant le détachement, droit au dividende chez l’intermédiaire, paiement, puis dénouement. L’exposition économique peut subsister par contrat. Schéma conceptuel, sans calendrier ni transaction réelle.</desc>
