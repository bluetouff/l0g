<text data-panel="cumcum-fr-cycle-d-frame" x="24" y="74" fill="var(--color-paper)" font-family="l0g CumCum" font-size="30" font-weight="700" text-anchor="start">Le titre change de mains</text>
<text data-panel="cumcum-fr-cycle-d-frame" x="24" y="112" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Une séquence, des dates distinctes</text>
