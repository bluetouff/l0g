<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cumcum-en-comparison-m-title cumcum-en-comparison-m-desc" viewBox="0 0 420 1000" style="width:100%;height:auto" class="l0g-cumcum-svg">
<title id="cumcum-en-comparison-m-title">Two routes to a fiscal loss</title><desc id="cumcum-en-comparison-m-desc">Cum-cum: interposition changes tax treatment and withholding is avoided or reduced. Cum-ex: tax certificates and credit or refund claims without corresponding collection. Qualitative diagram; no loss estimate.</desc>
<rect id="cumcum-en-comparison-m-frame" x="0" y="0" width="420" height="1000" rx="8" fill="var(--color-ink)"/>
<text data-panel="cumcum-en-comparison-m-frame" x="20" y="30" fill="var(--color-signal)" font-family="l0g CumCum" font-size="17" font-weight="700" text-anchor="start">l0g / CUM-CUM / 04</text>
<text data-panel="cumcum-en-comparison-m-frame" x="20" y="66" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">Two routes to a fiscal loss</text>
<text data-panel="cumcum-en-comparison-m-frame" x="20" y="106" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Locate the advantage before measuring it</text>
<rect id="cumcum-en-comparison-m-card-case-0" x="20" y="141" width="380" height="343" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<path d="M 23 144 L 23 481" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text data-panel="cumcum-en-comparison-m-card-case-0" x="40" y="172" fill="var(--color-signal)" font-family="l0g CumCum" font-size="17" font-weight="700" text-anchor="start">CUM-CUM</text>
<text data-panel="cumcum-en-comparison-m-card-case-0" x="40" y="213" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">Withholding is avoided or</text>
<text data-panel="cumcum-en-comparison-m-card-case-0" x="40" y="240" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">reduced</text>
<text data-panel="cumcum-en-comparison-m-card-case-0" x="40" y="296" fill="var(--color-signal)" font-family="l0g CumCum" font-size="17" font-weight="700" text-anchor="start">•</text>
<text data-panel="cumcum-en-comparison-m-card-case-0" x="62" y="296" fill="var(--color-paper)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Temporary holding</text>
<path d="M 45 305 L 45 319" fill="none" stroke="var(--color-line-strong)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text data-panel="cumcum-en-comparison-m-card-case-0" x="40" y="337" fill="var(--color-signal)" font-family="l0g CumCum" font-size="17" font-weight="700" text-anchor="start">•</text>
<text data-panel="cumcum-en-comparison-m-card-case-0" x="62" y="337" fill="var(--color-paper)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Different tax treatment</text>
<path d="M 45 346 L 45 360" fill="none" stroke="var(--color-line-strong)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text data-panel="cumcum-en-comparison-m-card-case-0" x="40" y="378" fill="var(--color-signal)" font-family="l0g CumCum" font-size="17" font-weight="700" text-anchor="start">•</text>
<text data-panel="cumcum-en-comparison-m-card-case-0" x="62" y="378" fill="var(--color-paper)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Value shared by contract</text>
<path d="M 40 402 L 380 402" fill="none" stroke="var(--color-line-strong)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text data-panel="cumcum-en-comparison-m-card-case-0" x="40" y="432" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Examine: shares, counterparties,</text>
<text data-panel="cumcum-en-comparison-m-card-case-0" x="40" y="456" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">pricing and beneficial ownership.</text>
<rect id="cumcum-en-comparison-m-card-case-1" x="20" y="511" width="380" height="343" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<path d="M 23 514 L 23 851" fill="none" stroke="var(--color-amber)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text data-panel="cumcum-en-comparison-m-card-case-1" x="40" y="542" fill="var(--color-amber)" font-family="l0g CumCum" font-size="17" font-weight="700" text-anchor="start">CUM-EX</text>
<text data-panel="cumcum-en-comparison-m-card-case-1" x="40" y="583" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">A tax claim without</text>
<text data-panel="cumcum-en-comparison-m-card-case-1" x="40" y="610" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">corresponding collection</text>
<text data-panel="cumcum-en-comparison-m-card-case-1" x="40" y="666" fill="var(--color-amber)" font-family="l0g CumCum" font-size="17" font-weight="700" text-anchor="start">•</text>
<text data-panel="cumcum-en-comparison-m-card-case-1" x="62" y="666" fill="var(--color-paper)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Withholding certificates</text>
<path d="M 45 675 L 45 689" fill="none" stroke="var(--color-line-strong)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text data-panel="cumcum-en-comparison-m-card-case-1" x="40" y="707" fill="var(--color-amber)" font-family="l0g CumCum" font-size="17" font-weight="700" text-anchor="start">•</text>
<text data-panel="cumcum-en-comparison-m-card-case-1" x="62" y="707" fill="var(--color-paper)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Tax credit or refund</text>
<path d="M 45 716 L 45 730" fill="none" stroke="var(--color-line-strong)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text data-panel="cumcum-en-comparison-m-card-case-1" x="40" y="748" fill="var(--color-amber)" font-family="l0g CumCum" font-size="17" font-weight="700" text-anchor="start">•</text>
<text data-panel="cumcum-en-comparison-m-card-case-1" x="62" y="748" fill="var(--color-paper)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">No matching tax collected</text>
<path d="M 40 772 L 380 772" fill="none" stroke="var(--color-line-strong)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text data-panel="cumcum-en-comparison-m-card-case-1" x="40" y="802" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Examine: tax actually paid,</text>
<text data-panel="cumcum-en-comparison-m-card-case-1" x="40" y="826" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">certificates and claims.</text>
<text data-panel="cumcum-en-comparison-m-frame" x="20" y="919" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Distinct evidence and measurements.</text>
<text data-panel="cumcum-en-comparison-m-frame" x="20" y="942" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Qualitative drawing; no loss estimate.</text>
<text data-panel="cumcum-en-comparison-m-frame" x="20" y="965" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">CE, 27 Jan 2025; Bundestag,</text>
<text data-panel="cumcum-en-comparison-m-frame" x="20" y="988" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">18/12700, p.76 [S3, S11].</text>
</svg>
