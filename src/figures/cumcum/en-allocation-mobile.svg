<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cumcum-en-allocation-m-title cumcum-en-allocation-m-desc" viewBox="0 0 420 930" style="width:100%;height:auto" class="l0g-cumcum-svg">
<title id="cumcum-en-allocation-m-title">The same €100, shared differently</title><desc id="cumcum-en-allocation-m-desc">Model: 15% withholding and 90% returned. Reference: investor 85, tax 15. Arrangement: investor 90, intermediary 10, withholding zero. Investor improvement 5 plus intermediary retention 10 equals 15.</desc>
<rect id="cumcum-en-allocation-m-frame" x="0" y="0" width="420" height="930" rx="8" fill="var(--color-ink)"/>
<text data-panel="cumcum-en-allocation-m-frame" x="20" y="30" fill="var(--color-signal)" font-family="l0g CumCum" font-size="17" font-weight="700" text-anchor="start">l0g / CUM-CUM / 02</text>
<text data-panel="cumcum-en-allocation-m-frame" x="20" y="66" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">The same €100,</text>
<text data-panel="cumcum-en-allocation-m-frame" x="20" y="94" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">shared differently</text>
<text data-panel="cumcum-en-allocation-m-frame" x="20" y="137" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Model: 15% withheld; 90% returned.</text>
<text data-panel="cumcum-en-allocation-m-frame" x="20" y="191" fill="var(--color-paper)" font-family="l0g CumCum" font-size="17" font-weight="700" text-anchor="start">DIRECT RECEIPT</text>
<rect id="cumcum-en-allocation-m-card-bar-0-0" x="20.0" y="216" width="323.0" height="51" rx="8" fill="var(--color-signal)"/>
<text data-panel="cumcum-en-allocation-m-card-bar-0-0" x="34.0" y="249.5" fill="var(--color-ink)" font-family="l0g CumCum" font-size="23" font-weight="700" text-anchor="start">€85</text>
<rect id="cumcum-en-allocation-m-card-bar-0-1" x="343.0" y="216" width="57.0" height="51" rx="8" fill="var(--color-accent)"/>
<text data-panel="cumcum-en-allocation-m-card-bar-0-1" x="371.5" y="249.5" fill="var(--color-ink)" font-family="l0g CumCum" font-size="20" font-weight="700" text-anchor="middle">15</text>
<text data-panel="cumcum-en-allocation-m-frame" x="20" y="301" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Investor: €85</text>
<text data-panel="cumcum-en-allocation-m-frame" x="20" y="329" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">French withholding: €15</text>
<text data-panel="cumcum-en-allocation-m-frame" x="20" y="416" fill="var(--color-paper)" font-family="l0g CumCum" font-size="17" font-weight="700" text-anchor="start">WITH AN INTERMEDIARY</text>
<rect id="cumcum-en-allocation-m-card-bar-1-0" x="20.0" y="441" width="342.0" height="51" rx="8" fill="var(--color-signal)"/>
<text data-panel="cumcum-en-allocation-m-card-bar-1-0" x="34.0" y="474.5" fill="var(--color-ink)" font-family="l0g CumCum" font-size="23" font-weight="700" text-anchor="start">€90</text>
<rect id="cumcum-en-allocation-m-card-bar-1-1" x="362.0" y="441" width="38.0" height="51" rx="8" fill="var(--color-amber)"/>
<text data-panel="cumcum-en-allocation-m-card-bar-1-1" x="381.0" y="474.5" fill="var(--color-ink)" font-family="l0g CumCum" font-size="20" font-weight="700" text-anchor="middle">10</text>
<text data-panel="cumcum-en-allocation-m-frame" x="20" y="526" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Investor: €90</text>
<text data-panel="cumcum-en-allocation-m-frame" x="20" y="554" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Intermediary: €10 gross</text>
<text data-panel="cumcum-en-allocation-m-frame" x="20" y="582" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Modelled withholding: €0</text>
<rect id="cumcum-en-allocation-m-card-equation" x="20" y="634" width="380" height="154" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="cumcum-en-allocation-m-card-equation" x="36" y="665" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="700" text-anchor="start">THE WITHHOLDING GAP IS SHARED</text>
<text data-panel="cumcum-en-allocation-m-card-equation" x="36" y="713" fill="var(--color-paper)" font-family="l0g CumCum" font-size="31" font-weight="700" text-anchor="start">€5 + €10 = €15</text>
<text data-panel="cumcum-en-allocation-m-card-equation" x="36" y="747" fill="var(--color-paper)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Investor gain + intermediary retention</text>
<text data-panel="cumcum-en-allocation-m-card-equation" x="36" y="771" fill="var(--color-paper)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">= withholding avoided</text>
<text data-panel="cumcum-en-allocation-m-frame" x="20" y="833" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">The €10 precedes costs and other taxes.</text>
<text data-panel="cumcum-en-allocation-m-frame" x="20" y="858" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">l0g model: a historical mechanism,</text>
<text data-panel="cumcum-en-allocation-m-frame" x="20" y="883" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">before reassessment; not an average.</text>
<text data-panel="cumcum-en-allocation-m-frame" x="20" y="908" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">CACIB CJIP, 5 Sep 2025, §34 [S1].</text>
</svg>
