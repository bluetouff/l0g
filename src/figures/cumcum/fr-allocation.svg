<text data-panel="cumcum-fr-allocation-d-card-equation" x="335" y="547" fill="var(--color-paper)" font-family="l0g CumCum" font-size="32" font-weight="700" text-anchor="start">+</text>
<text data-panel="cumcum-fr-allocation-d-card-equation" x="674" y="547" fill="var(--color-paper)" font-family="l0g CumCum" font-size="32" font-weight="700" text-anchor="start">=</text>
<text data-panel="cumcum-fr-allocation-d-frame" x="24" y="607" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Modèle l0g, hors frais, autres impôts et redressements. Aucun taux moyen observé.</text>
<text data-panel="cumcum-fr-allocation-d-frame" x="24" y="636" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Les exemples 90 % et 85 % viennent de la CJIP CACIB, 05.09.2025, §34 [S1].</text>
