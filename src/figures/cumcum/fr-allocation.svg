<text data-panel="cumcum-fr-allocation-d-card-equation" x="401" y="550" fill="var(--color-amber)" font-family="l0g CumCum" font-size="32" font-weight="700" text-anchor="start">10 €</text>
<text data-panel="cumcum-fr-allocation-d-card-equation" x="735" y="507" fill="var(--color-accent)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">RETENUE ÉVITÉE</text>
