<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cumcum-fr-comparison-d-title cumcum-fr-comparison-d-desc" viewBox="0 0 1000 650" style="width:100%;height:auto" class="l0g-cumcum-svg">
<title id="cumcum-fr-comparison-d-title">Deux circuits de perte fiscale</title><desc id="cumcum-fr-comparison-d-desc">Cum-cum : traitement différent par interposition et retenue évitée ou réduite. Cum-ex : attestations et demandes d’imputation ou remboursement sans collecte correspondante. Schéma qualitatif ; aucune estimation de pertes.</desc>
<rect id="cumcum-fr-comparison-d-frame" x="0" y="0" width="1000" height="650" rx="8" fill="var(--color-ink)"/>
<text data-panel="cumcum-fr-comparison-d-frame" x="24" y="30" fill="var(--color-signal)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">l0g / CUM-CUM / 04</text>
<text data-panel="cumcum-fr-comparison-d-frame" x="24" y="74" fill="var(--color-paper)" font-family="l0g CumCum" font-size="30" font-weight="700" text-anchor="start">Deux circuits de perte fiscale</text>
<text data-panel="cumcum-fr-comparison-d-frame" x="24" y="112" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Localiser l’avantage avant de le mesurer</text>
<rect id="cumcum-fr-comparison-d-card-case-0" x="24" y="150" width="464" height="365" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<path d="M 27 153 L 27 512" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text data-panel="cumcum-fr-comparison-d-card-case-0" x="44" y="181" fill="var(--color-signal)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">CUM-CUM</text>
<text data-panel="cumcum-fr-comparison-d-card-case-0" x="44" y="222" fill="var(--color-paper)" font-family="l0g CumCum" font-size="26" font-weight="700" text-anchor="start">Le prélèvement est évité</text>
<text data-panel="cumcum-fr-comparison-d-card-case-0" x="44" y="256" fill="var(--color-paper)" font-family="l0g CumCum" font-size="26" font-weight="700" text-anchor="start">ou réduit</text>
<text data-panel="cumcum-fr-comparison-d-card-case-0" x="44" y="305" fill="var(--color-signal)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">•</text>
<text data-panel="cumcum-fr-comparison-d-card-case-0" x="66" y="305" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Détention temporaire</text>
<path d="M 49 314 L 49 328" fill="none" stroke="var(--color-line-strong)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text data-panel="cumcum-fr-comparison-d-card-case-0" x="44" y="346" fill="var(--color-signal)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">•</text>
<text data-panel="cumcum-fr-comparison-d-card-case-0" x="66" y="346" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Traitement fiscal différent</text>
<path d="M 49 355 L 49 369" fill="none" stroke="var(--color-line-strong)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text data-panel="cumcum-fr-comparison-d-card-case-0" x="44" y="387" fill="var(--color-signal)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">•</text>
<text data-panel="cumcum-fr-comparison-d-card-case-0" x="66" y="387" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Valeur partagée par contrat</text>
<path d="M 44 411 L 468 411" fill="none" stroke="var(--color-line-strong)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text data-panel="cumcum-fr-comparison-d-card-case-0" x="44" y="441" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">À examiner : titres, contreparties,</text>
<text data-panel="cumcum-fr-comparison-d-card-case-0" x="44" y="470" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">prix et bénéficiaire effectif.</text>
<rect id="cumcum-fr-comparison-d-card-case-1" x="512" y="150" width="464" height="365" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<path d="M 515 153 L 515 512" fill="none" stroke="var(--color-amber)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text data-panel="cumcum-fr-comparison-d-card-case-1" x="532" y="181" fill="var(--color-amber)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">CUM-EX</text>
<text data-panel="cumcum-fr-comparison-d-card-case-1" x="532" y="222" fill="var(--color-paper)" font-family="l0g CumCum" font-size="26" font-weight="700" text-anchor="start">Une créance fiscale</text>
<text data-panel="cumcum-fr-comparison-d-card-case-1" x="532" y="256" fill="var(--color-paper)" font-family="l0g CumCum" font-size="26" font-weight="700" text-anchor="start">sans collecte correspondante</text>
<text data-panel="cumcum-fr-comparison-d-card-case-1" x="532" y="305" fill="var(--color-amber)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">•</text>
<text data-panel="cumcum-fr-comparison-d-card-case-1" x="554" y="305" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Attestations de retenue</text>
<path d="M 537 314 L 537 328" fill="none" stroke="var(--color-line-strong)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text data-panel="cumcum-fr-comparison-d-card-case-1" x="532" y="346" fill="var(--color-amber)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">•</text>
<text data-panel="cumcum-fr-comparison-d-card-case-1" x="554" y="346" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Imputation ou remboursement</text>
<path d="M 537 355 L 537 369" fill="none" stroke="var(--color-line-strong)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text data-panel="cumcum-fr-comparison-d-card-case-1" x="532" y="387" fill="var(--color-amber)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">•</text>
<text data-panel="cumcum-fr-comparison-d-card-case-1" x="554" y="387" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Impôt non perçu à due concurrence</text>
<path d="M 532 411 L 956 411" fill="none" stroke="var(--color-line-strong)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text data-panel="cumcum-fr-comparison-d-card-case-1" x="532" y="441" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">À examiner : impôt réellement versé,</text>
<text data-panel="cumcum-fr-comparison-d-card-case-1" x="532" y="470" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">attestations et demandes.</text>
<text data-panel="cumcum-fr-comparison-d-frame" x="24" y="562" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Les dossiers et les pertes se mesurent séparément.</text>
<text data-panel="cumcum-fr-comparison-d-frame" x="24" y="595" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Schémas qualitatifs ; modalités variables selon les pays et les dossiers.</text>
<text data-panel="cumcum-fr-comparison-d-frame" x="24" y="628" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">CE, 27.01.2025 ; Bundestag, 18/12700, 20.06.2017, p.76 [S3, S11].</text>
</svg>
