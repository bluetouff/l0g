<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cumcum-fr-comparison-m-title cumcum-fr-comparison-m-desc" viewBox="0 0 420 1000" style="width:100%;height:auto" class="l0g-cumcum-svg">
<title id="cumcum-fr-comparison-m-title">Deux circuits de perte fiscale</title><desc id="cumcum-fr-comparison-m-desc">Cum-cum : traitement différent par interposition et retenue évitée ou réduite. Cum-ex : attestations et demandes d’imputation ou remboursement sans collecte correspondante. Schéma qualitatif ; aucune estimation de pertes.</desc>
<rect id="cumcum-fr-comparison-m-frame" x="0" y="0" width="420" height="1000" rx="8" fill="var(--color-ink)"/>
<text data-panel="cumcum-fr-comparison-m-frame" x="20" y="30" fill="var(--color-signal)" font-family="l0g CumCum" font-size="17" font-weight="700" text-anchor="start">l0g / CUM-CUM / 04</text>
<text data-panel="cumcum-fr-comparison-m-frame" x="20" y="66" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">Deux circuits de perte fiscale</text>
<text data-panel="cumcum-fr-comparison-m-frame" x="20" y="106" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Localiser l’avantage avant de le mesurer</text>
<rect id="cumcum-fr-comparison-m-card-case-0" x="20" y="141" width="380" height="343" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
