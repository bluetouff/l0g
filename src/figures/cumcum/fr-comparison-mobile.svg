<text data-panel="cumcum-fr-comparison-m-frame" x="20" y="919" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Des preuves et des mesures distinctes.</text>
<text data-panel="cumcum-fr-comparison-m-frame" x="20" y="942" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Schémas qualitatifs, sans perte estimée.</text>
<text data-panel="cumcum-fr-comparison-m-frame" x="20" y="965" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">CE, 27.01.2025 ; Bundestag,</text>
