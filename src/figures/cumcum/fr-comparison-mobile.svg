<text data-panel="cumcum-fr-comparison-m-card-case-0" x="40" y="240" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">ou réduit</text>
<text data-panel="cumcum-fr-comparison-m-card-case-0" x="40" y="296" fill="var(--color-signal)" font-family="l0g CumCum" font-size="17" font-weight="700" text-anchor="start">•</text>
