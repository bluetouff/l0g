<text data-panel="cumcum-fr-comparison-m-card-case-0" x="62" y="337" fill="var(--color-paper)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Traitement fiscal différent</text>
<path d="M 45 346 L 45 360" fill="none" stroke="var(--color-line-strong)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
