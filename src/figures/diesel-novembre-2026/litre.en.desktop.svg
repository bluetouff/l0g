<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="100%" height="auto" style="width:100%;height:auto" role="img" xml:lang="en" aria-labelledby="dnf-litre-en-desktop-title dnf-litre-en-desktop-desc">
<title id="dnf-litre-en-desktop-title">Inside a litre of diesel</title>
<desc id="dnf-litre-en-desktop-desc">The 13 November French pump price is 212.29 euro cents per litre, comprising 116.16 before tax, 60.75 in excise and 35.38 in VAT. The pre-tax price is about 15.2 euro cents above the wholesale quote of 101.0.</desc>
<rect x="0" y="0" width="600" height="280" rx="13" fill="var(--color-surface)"/>
<rect x=".5" y=".5" width="599" height="279" rx="13" fill="none" stroke="var(--color-line)"/>
<text x="24" y="33" fill="var(--color-paper)" font-size="18" font-weight="400" text-anchor="start">Inside a litre of diesel</text>
<text x="24" y="57" fill="var(--color-muted)" font-size="12.5" font-weight="400" text-anchor="start">France, 13 Nov 2026</text>
<text x="576" y="57" fill="var(--color-amber)" font-size="16" font-weight="400" text-anchor="end">212.29 c€/L</text>
<line x1="24" y1="71" x2="576" y2="71" stroke="var(--color-line)" stroke-width="1"/>
<text x="175.02" y="95" fill="var(--color-muted)" font-size="12.8" font-weight="400" text-anchor="middle">Pre-tax</text>
<rect x="24.0" y="105" width="302.041" height="33" rx="0" fill="var(--color-signal)" opacity=".14"/>
