<text x="50" y="268" fill="var(--color-signal)" font-size="13.3" font-weight="400" text-anchor="start">101.0 c€/L</text>
<g transform="translate(327 237)"><path d="M10 3c2.5 3.3 5 5.7 5 9a5 5 0 0 1-10 0c0-3.3 2.5-5.7 5-9Zm-3 9a3 3 0 0 0 3 3" fill="none" stroke="var(--color-amber)" stroke-width="1.05" stroke-linecap="round" stroke-linejoin="round"/></g>
