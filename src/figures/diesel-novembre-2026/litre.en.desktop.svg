<text x="175.02" y="128" fill="var(--color-signal)" font-size="15.2" font-weight="500" text-anchor="middle">116.16</text>
<text x="405.023" y="95" fill="var(--color-muted)" font-size="12.8" font-weight="400" text-anchor="middle">Excise</text>
