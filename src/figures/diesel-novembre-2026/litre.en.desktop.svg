<rect x="286.622" y="203" width="39.419" height="12" rx="0" fill="var(--color-amber)" opacity=".72"/>
<line x1="326.041" y1="186" x2="326.041" y2="215" stroke="var(--color-line-strong)" stroke-width="1" stroke-dasharray="3 4"/>
<line x1="326.041" y1="141" x2="326.041" y2="158" stroke="var(--color-line-strong)" stroke-width="1"/>
<line x1="306.331" y1="216" x2="306.331" y2="227" stroke="var(--color-amber)" stroke-width="1"/>
<line x1="306.331" y1="227" x2="335" y2="227" stroke="var(--color-amber)" stroke-width="1"/>
