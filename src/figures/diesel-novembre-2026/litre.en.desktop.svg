<line x1="326.291" y1="105" x2="483.754" y2="105" stroke="var(--color-topic-blue)" stroke-width="2"/>
<text x="405.023" y="128" fill="var(--color-topic-blue)" font-size="15.2" font-weight="500" text-anchor="middle">60.75</text>
<text x="530.002" y="95" fill="var(--color-muted)" font-size="12.8" font-weight="400" text-anchor="middle">VAT</text>
<rect x="484.004" y="105" width="91.996" height="33" rx="0" fill="var(--color-amber)" opacity=".14"/>
