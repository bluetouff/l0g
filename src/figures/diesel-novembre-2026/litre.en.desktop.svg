<text x="530.002" y="128" fill="var(--color-amber)" font-size="15.2" font-weight="500" text-anchor="middle">35.38</text>
<line x1="24" y1="161" x2="576" y2="161" stroke="var(--color-line)" stroke-width="1"/>
<text x="24" y="180" fill="var(--color-paper)" font-size="14.5" font-weight="400" text-anchor="start">A closer look at the pre-tax price</text>
