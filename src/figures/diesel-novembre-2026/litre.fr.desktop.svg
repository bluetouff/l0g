<title id="dnf-litre-fr-desktop-title">Dans un litre de gazole</title>
<desc id="dnf-litre-fr-desktop-desc">Le prix français TTC du 13 novembre est de 212,29 c€/L, dont 116,16 hors taxes, 60,75 d’accise et 35,38 de TVA. Le prix hors taxes dépasse d’environ 15,2 c€/L la cotation de gros de 101,0 c€/L.</desc>
