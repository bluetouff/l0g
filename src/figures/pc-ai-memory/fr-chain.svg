<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pc-ai-fr-chain-d-title pc-ai-fr-chain-d-desc" viewBox="0 0 1000 680" style="width:100%;height:auto" class="l0g-pc-ai-memory-svg">
<title id="pc-ai-fr-chain-d-title">Du silicium à l’étiquette</title>
<desc id="pc-ai-fr-chain-d-desc">Deux filières industrielles, puis des contrats, des stocks et des choix commerciaux. Chaque étape peut modifier la transmission du coût. Schéma d’analyse construit à partir des documents des fournisseurs et des fabricants de PC. DRAM et NAND restent deux filières distinctes. Les flèches décrivent des relations qualitatives et leur largeur ne mesure aucun volume. Les branches prix, configuration et marge représentent des réponses possibles, dont la combinaison varie selon l’entreprise. Certains engagements sécurisent des quantités tout en laissant des prix à négocier. Les variations de change, de fiscalité et de concurrence sont des facteurs supplémentaires.</desc>
<rect id="pc-ai-fr-chain-d-frame" x="0" y="0" width="1000" height="680" fill="var(--color-ink)"/>
<text data-panel="pc-ai-fr-chain-d-frame" x="40" y="40" fill="var(--color-signal)" font-family="l0g PC AI Memory" font-size="22" font-weight="700" text-anchor="start">l0g / MÉMOIRE</text>
<text data-panel="pc-ai-fr-chain-d-frame" x="960" y="40" fill="var(--color-muted)" font-family="l0g PC AI Memory" font-size="22" font-weight="400" text-anchor="end">03 / 05</text>
<text data-panel="pc-ai-fr-chain-d-frame" x="40" y="93" fill="var(--color-paper)" font-family="l0g PC AI Memory" font-size="34" font-weight="700" text-anchor="start">Du silicium à l’étiquette</text>
<text data-panel="pc-ai-fr-chain-d-frame" x="40" y="137" fill="var(--color-muted)" font-family="l0g PC AI Memory" font-size="22" font-weight="400" text-anchor="start">Relations qualitatives · contrats, stocks et arbitrages</text>
