<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pc-ai-en-average-m-title pc-ai-en-average-m-desc" viewBox="0 0 420 820" style="width:100%;height:auto" class="l0g-pc-ai-memory-svg">
<title id="pc-ai-en-average-m-title">Fewer units, higher revenue</title>
<desc id="pc-ai-en-average-m-desc">HP Personal Systems: unit volumes −15.8%, average selling price +40.8%, revenue +18.5%. The average combines pricing, currency and the products actually sold. HP Form 10-Q signed 26 August 2026: Personal Systems, three months ended 31 July 2026 versus three months ended 31 July 2025. Worldwide business, revenue in current US dollars. Reported changes converted to indices, comparable 2025 period = 100. Multiplying rounded factors gives 1.185536; the chart retains the reported revenue increase of 18.5%. Portfolio ASP is not constant-specification inflation and cannot be compared directly with the French index.</desc>
