<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pc-ai-en-model-m-title pc-ai-en-model-m-desc" viewBox="0 0 420 820" style="width:100%;height:auto" class="l0g-pc-ai-memory-svg">
<title id="pc-ai-en-model-m-title">Track the €150 extra cost</title>
<desc id="pc-ai-en-model-m-desc">Fictional example. Illustrative scenario: a €150 cost doubles; 60% of the increase reaches the buyer. The €1,000 price before tax becomes €1,090. Teaching example with chosen assumptions: initial price P₀ = €1,000, exposed cost C₀ = €150, cost increase g = 100%, pass-through t = 60%. All amounts exclude tax; exchange rates, tax rates and other costs stay fixed. Price addition = C₀ × g × t = €90; absorbed cost = €60. Flow widths reflect the assumed 60/40 split. No parameter represents a market average or forecast.</desc>
<rect id="pc-ai-en-model-m-frame" x="0" y="0" width="420" height="820" fill="var(--color-ink)"/>
<text data-panel="pc-ai-en-model-m-frame" x="28" y="34" fill="var(--color-signal)" font-family="l0g PC AI Memory" font-size="17" font-weight="700" text-anchor="start">l0g / MEMORY</text>
<text data-panel="pc-ai-en-model-m-frame" x="392" y="34" fill="var(--color-muted)" font-family="l0g PC AI Memory" font-size="17" font-weight="400" text-anchor="end">05 / 05</text>
<text data-panel="pc-ai-en-model-m-frame" x="28" y="81" fill="var(--color-paper)" font-family="l0g PC AI Memory" font-size="25" font-weight="700" text-anchor="start">Sharing the extra cost</text>
<text data-panel="pc-ai-en-model-m-frame" x="28" y="117" fill="var(--color-muted)" font-family="l0g PC AI Memory" font-size="17" font-weight="400" text-anchor="start">Fictional scenario · before tax ·</text>
<text data-panel="pc-ai-en-model-m-frame" x="28" y="141" fill="var(--color-muted)" font-family="l0g PC AI Memory" font-size="17" font-weight="400" text-anchor="start">other costs fixed</text>
<text data-panel="pc-ai-en-model-m-frame" x="28" y="183" fill="var(--color-paper)" font-family="l0g PC AI Memory" font-size="22" font-weight="700" text-anchor="start">Exposed cost</text>
<text data-panel="pc-ai-en-model-m-frame" x="28" y="210" fill="var(--color-paper)" font-family="l0g PC AI Memory" font-size="22" font-weight="700" text-anchor="start">150 €</text>
<rect data-metric="exposed-0" data-value="150" x="28" y="226" width="182.0" height="30" fill="var(--color-muted)"/>
<text data-panel="pc-ai-en-model-m-frame" x="28" y="295" fill="var(--color-paper)" font-family="l0g PC AI Memory" font-size="22" font-weight="700" text-anchor="start">300 €</text>
<rect data-metric="exposed-1" data-value="300" x="28" y="311" width="364.0" height="30" fill="var(--color-signal)"/>
<text data-panel="pc-ai-en-model-m-frame" x="28" y="390" fill="var(--color-paper)" font-family="l0g PC AI Memory" font-size="24" font-weight="700" text-anchor="start">Extra cost: €150</text>
<rect data-metric="passed" data-value="90" x="28" y="421" width="218.4" height="45" fill="var(--color-signal)"/>
<rect data-metric="absorbed" data-value="60" x="246.4" y="421" width="145.6" height="45" fill="var(--color-amber)"/>
<text data-panel="pc-ai-en-model-m-frame" x="28" y="507" fill="var(--color-signal)" font-family="l0g PC AI Memory" font-size="19" font-weight="700" text-anchor="start">Customer: €90</text>
<text data-panel="pc-ai-en-model-m-frame" x="392" y="507" fill="var(--color-amber)" font-family="l0g PC AI Memory" font-size="19" font-weight="700" text-anchor="end">Absorbed: €60</text>
<text data-panel="pc-ai-en-model-m-frame" x="28" y="540" fill="var(--color-muted)" font-family="l0g PC AI Memory" font-size="18" font-weight="400" text-anchor="start">60%</text>
<text data-panel="pc-ai-en-model-m-frame" x="392" y="540" fill="var(--color-muted)" font-family="l0g PC AI Memory" font-size="18" font-weight="400" text-anchor="end">40%</text>
<text data-panel="pc-ai-en-model-m-frame" x="210" y="611" fill="var(--color-paper)" font-family="l0g PC AI Memory" font-size="31" font-weight="700" text-anchor="middle">1 000 €</text>
<line x1="210" y1="630" x2="210" y2="660" stroke="var(--color-signal)" stroke-width="3"/>
<path d="M 204 651 L 210 660 L 216 651" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text data-panel="pc-ai-en-model-m-frame" x="210" y="706" fill="var(--color-signal)" font-family="l0g PC AI Memory" font-size="34" font-weight="700" text-anchor="middle">1 090 €</text>
<text data-panel="pc-ai-en-model-m-frame" x="210" y="746" fill="var(--color-muted)" font-family="l0g PC AI Memory" font-size="18" font-weight="400" text-anchor="middle">Price before tax</text>
<text data-panel="pc-ai-en-model-m-frame" x="28" y="793" fill="var(--color-muted)" font-family="l0g PC AI Memory" font-size="17" font-weight="400" text-anchor="start">l0g calculation · fictional inputs</text>
