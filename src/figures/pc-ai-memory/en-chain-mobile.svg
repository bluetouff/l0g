<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pc-ai-en-chain-m-title pc-ai-en-chain-m-desc" viewBox="0 0 420 820" style="width:100%;height:auto" class="l0g-pc-ai-memory-svg">
<title id="pc-ai-en-chain-m-title">From silicon to the price tag</title>
<desc id="pc-ai-en-chain-m-desc">Two manufacturing chains, followed by contracts, inventories and commercial choices. Every stage can change how a cost reaches the buyer. Analytical diagram based on supplier and PC-maker disclosures. DRAM and NAND remain distinct manufacturing chains. Arrows show qualitative relationships; their width does not encode volumes. Pricing, specification and margin are possible responses whose combination varies by business. Some supply agreements secure quantities while leaving prices open to negotiation. Currency, taxes and competition add further influences.</desc>
