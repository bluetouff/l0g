<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pc-ai-fr-chain-m-title pc-ai-fr-chain-m-desc" viewBox="0 0 420 820" style="width:100%;height:auto" class="l0g-pc-ai-memory-svg">
<title id="pc-ai-fr-chain-m-title">Du silicium à l’étiquette</title>
<desc id="pc-ai-fr-chain-m-desc">Deux filières industrielles, puis des contrats, des stocks et des choix commerciaux. Chaque étape peut modifier la transmission du coût. Schéma d’analyse construit à partir des documents des fournisseurs et des fabricants de PC. DRAM et NAND restent deux filières distinctes. Les flèches décrivent des relations qualitatives et leur largeur ne mesure aucun volume. Les branches prix, configuration et marge représentent des réponses possibles, dont la combinaison varie selon l’entreprise. Certains engagements sécurisent des quantités tout en laissant des prix à négocier. Les variations de change, de fiscalité et de concurrence sont des facteurs supplémentaires.</desc>
