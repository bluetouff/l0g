<title id="pc-ai-en-index-m-title">The rebound after the 2025 dip</title>
<desc id="pc-ai-en-index-m-desc">France: +6.2% from September 2025 to September 2026, and +0.5% from September 2024. The starting point changes the picture. Insee monthly series 011816928: computers, laptops and tablets, all households, France. Average 2025 = 100; constant-quality price measurement. All 33 raw monthly observations, January 2024–September 2026; no smoothing or additional seasonal adjustment. Vertical axis spans 94–110, with explicit tick marks. Change = (final index / initial index − 1) × 100. September indices: 101.90 in 2024, 96.41 in 2025, 102.38 in 2026. Series updated 15 October 2026, retrieved 30 October. The curve does not apportion the causes of the change.</desc>
