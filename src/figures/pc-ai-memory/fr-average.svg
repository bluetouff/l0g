<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pc-ai-fr-average-d-title pc-ai-fr-average-d-desc" viewBox="0 0 1000 680" style="width:100%;height:auto" class="l0g-pc-ai-memory-svg">
<title id="pc-ai-fr-average-d-title">Vendre moins, encaisser davantage</title>
<desc id="pc-ai-fr-average-d-desc">HP Personal Systems : volumes −15,8 %, prix moyen +40,8 %, chiffre d’affaires +18,5 %. La moyenne reflète les tarifs, le change et les produits effectivement vendus. HP, 10-Q signé le 26 août 2026, Personal Systems, trois mois clos le 31 juillet 2026 comparés aux trois mois clos le 31 juillet 2025. Périmètre mondial, chiffre d’affaires en dollars courants. Les variations publiées sont converties en indices, période comparable 2025 = 100. La multiplication des facteurs arrondis donne 1,185536 ; le graphique retient la hausse de chiffre d’affaires publiée de 18,5 %. L’ASP du portefeuille ne mesure pas l’inflation d’une configuration identique et ne se compare pas directement à l’indice français.</desc>
