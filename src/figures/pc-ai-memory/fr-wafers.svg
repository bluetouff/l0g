<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pc-ai-fr-wafers-d-title pc-ai-fr-wafers-d-desc" viewBox="0 0 1000 680" style="width:100%;height:auto" class="l0g-pc-ai-memory-svg">
<title id="pc-ai-fr-wafers-d-title">Autant de bits, davantage de silicium</title>
<desc id="pc-ai-fr-wafers-d-desc">Micron estime qu’à quantité de bits et nœud technologique identiques, la HBM3E mobilise environ trois fois l’offre de wafers de la DDR5. Source : Micron, remarques préparées du 26 juin 2024, p. 6. Une unité graphique représente une unité relative de ressources de wafers ; les trois disques HBM3E matérialisent le rapport approximatif de 3 pour 1. Les produits dessinés sont schématiques : aucun nombre de modules produits par wafer n’est suggéré. Le ratio est une estimation du fabricant pour HBM3E contre DDR5, et ne s’étend ni à la NAND, ni aux prix, ni à la consommation électrique.</desc>
