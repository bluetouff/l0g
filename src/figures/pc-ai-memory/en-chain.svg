<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pc-ai-en-chain-d-title pc-ai-en-chain-d-desc" viewBox="0 0 1000 680" style="width:100%;height:auto" class="l0g-pc-ai-memory-svg">
<title id="pc-ai-en-chain-d-title">From silicon to the price tag</title>
<desc id="pc-ai-en-chain-d-desc">Two manufacturing chains, followed by contracts, inventories and commercial choices. Every stage can change how a cost reaches the buyer. Analytical diagram based on supplier and PC-maker disclosures. DRAM and NAND remain distinct manufacturing chains. Arrows show qualitative relationships; their width does not encode volumes. Pricing, specification and margin are possible responses whose combination varies by business. Some supply agreements secure quantities while leaving prices open to negotiation. Currency, taxes and competition add further influences.</desc>
<rect id="pc-ai-en-chain-d-frame" x="0" y="0" width="1000" height="680" fill="var(--color-ink)"/>
<text data-panel="pc-ai-en-chain-d-frame" x="40" y="40" fill="var(--color-signal)" font-family="l0g PC AI Memory" font-size="22" font-weight="700" text-anchor="start">l0g / MEMORY</text>
<text data-panel="pc-ai-en-chain-d-frame" x="960" y="40" fill="var(--color-muted)" font-family="l0g PC AI Memory" font-size="22" font-weight="400" text-anchor="end">03 / 05</text>
<text data-panel="pc-ai-en-chain-d-frame" x="40" y="93" fill="var(--color-paper)" font-family="l0g PC AI Memory" font-size="34" font-weight="700" text-anchor="start">From silicon to the price tag</text>
<text data-panel="pc-ai-en-chain-d-frame" x="40" y="137" fill="var(--color-muted)" font-family="l0g PC AI Memory" font-size="22" font-weight="400" text-anchor="start">Qualitative links · contracts, inventory and choices</text>
