<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pc-ai-fr-model-d-title pc-ai-fr-model-d-desc" viewBox="0 0 1000 680" style="width:100%;height:auto" class="l0g-pc-ai-memory-svg">
<title id="pc-ai-fr-model-d-title">Suivre les 150 euros de surcoût</title>
<desc id="pc-ai-fr-model-d-desc">Exemple fictif. Scénario fictif : un coût de 150 € double ; 60 % du surcoût passent au client. Le prix hors taxes de 1 000 € devient 1 090 €. Calcul pédagogique, avec hypothèses choisies pour l’illustration : prix initial P₀ = 1 000 €, coût exposé C₀ = 150 €, hausse g = 100 %, transmission t = 60 %. Tous les montants sont hors taxes ; change, taux de taxe et autres coûts restent fixes. Supplément = C₀ × g × t = 90 € ; surcoût absorbé = 60 €. Le partage graphique est proportionnel aux 60/40 du scénario. Aucun paramètre ne représente une moyenne du marché ni une prévision.</desc>
<rect id="pc-ai-fr-model-d-frame" x="0" y="0" width="1000" height="680" fill="var(--color-ink)"/>
<text data-panel="pc-ai-fr-model-d-frame" x="40" y="40" fill="var(--color-signal)" font-family="l0g PC AI Memory" font-size="22" font-weight="700" text-anchor="start">l0g / MÉMOIRE</text>
<text data-panel="pc-ai-fr-model-d-frame" x="960" y="40" fill="var(--color-muted)" font-family="l0g PC AI Memory" font-size="22" font-weight="400" text-anchor="end">05 / 05</text>
<text data-panel="pc-ai-fr-model-d-frame" x="40" y="93" fill="var(--color-paper)" font-family="l0g PC AI Memory" font-size="34" font-weight="700" text-anchor="start">Suivre les 150 euros de surcoût</text>
<text data-panel="pc-ai-fr-model-d-frame" x="40" y="137" fill="var(--color-muted)" font-family="l0g PC AI Memory" font-size="22" font-weight="400" text-anchor="start">Scénario fictif · hors taxes · autres coûts fixes</text>
<rect id="pc-ai-fr-model-d-card-cost" x="40" y="180" width="450" height="280" fill="var(--color-surface)"/>
<text data-panel="pc-ai-fr-model-d-card-cost" x="62" y="222" fill="var(--color-paper)" font-family="l0g PC AI Memory" font-size="26" font-weight="700" text-anchor="start">Le coût exposé double</text>
<rect data-metric="exposed-0" data-value="150" x="62" y="278" width="162.5" height="36" fill="var(--color-muted)"/>
<text data-panel="pc-ai-fr-model-d-card-cost" x="236.5" y="305" fill="var(--color-paper)" font-family="l0g PC AI Memory" font-size="23" font-weight="700" text-anchor="start">150 €</text>
<rect data-metric="exposed-1" data-value="300" x="62" y="365" width="325.0" height="36" fill="var(--color-signal)"/>
<text data-panel="pc-ai-fr-model-d-card-cost" x="399.0" y="392" fill="var(--color-paper)" font-family="l0g PC AI Memory" font-size="23" font-weight="700" text-anchor="start">300 €</text>
<rect id="pc-ai-fr-model-d-card-share" x="530" y="180" width="430" height="280" fill="var(--color-surface)"/>
<text data-panel="pc-ai-fr-model-d-card-share" x="554" y="222" fill="var(--color-paper)" font-family="l0g PC AI Memory" font-size="26" font-weight="700" text-anchor="start">Surcoût : 150 €</text>
<rect data-metric="passed" data-value="90" x="554" y="278" width="225.6" height="45" fill="var(--color-signal)"/>
<rect data-metric="absorbed" data-value="60" x="779.6" y="278" width="150.4" height="45" fill="var(--color-amber)"/>
<text data-panel="pc-ai-fr-model-d-card-share" x="554" y="372" fill="var(--color-signal)" font-family="l0g PC AI Memory" font-size="23" font-weight="700" text-anchor="start">90 € · client</text>
<text data-panel="pc-ai-fr-model-d-card-share" x="554" y="418" fill="var(--color-amber)" font-family="l0g PC AI Memory" font-size="23" font-weight="700" text-anchor="start">60 € · absorbés</text>
<text data-panel="pc-ai-fr-model-d-frame" x="170" y="553" fill="var(--color-paper)" font-family="l0g PC AI Memory" font-size="38" font-weight="700" text-anchor="middle">1 000 €</text>
<line x1="335" y1="540" x2="650" y2="540" stroke="var(--color-signal)" stroke-width="3"/>
<path d="M 641 534 L 650 540 L 641 546" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text data-panel="pc-ai-fr-model-d-frame" x="795" y="553" fill="var(--color-signal)" font-family="l0g PC AI Memory" font-size="42" font-weight="700" text-anchor="middle">1 090 €</text>
<text data-panel="pc-ai-fr-model-d-frame" x="490" y="513" fill="var(--color-muted)" font-family="l0g PC AI Memory" font-size="22" font-weight="400" text-anchor="middle">60 % transmis</text>
<text data-panel="pc-ai-fr-model-d-frame" x="40" y="613" fill="var(--color-muted)" font-family="l0g PC AI Memory" font-size="22" font-weight="400" text-anchor="start">Tous les montants sont hors taxes ; paramètres fictifs.</text>
<text data-panel="pc-ai-fr-model-d-frame" x="40" y="653" fill="var(--color-muted)" font-family="l0g PC AI Memory" font-size="22" font-weight="400" text-anchor="start">Calcul l0g · hypothèses fictives</text>
</svg>
