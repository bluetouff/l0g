<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pc-ai-en-wafers-m-title pc-ai-en-wafers-m-desc" viewBox="0 0 420 820" style="width:100%;height:auto" class="l0g-pc-ai-memory-svg">
<title id="pc-ai-en-wafers-m-title">Equal bits, more silicon</title>
<desc id="pc-ai-en-wafers-m-desc">Micron estimates that HBM3E uses roughly three times the wafer supply of DDR5 for the same number of bits on the same technology node. Source: Micron prepared remarks, 26 June 2024, p. 6. Each drawn disc represents one relative unit of wafer resources; three discs express the approximate 3:1 ratio. Product drawings are schematic and imply no number of modules produced per wafer. This is the manufacturer's estimate for HBM3E versus DDR5. It does not apply to NAND, selling prices or power consumption.</desc>
