<rect x="158" y="164" width="134" height="49" rx="5" fill="var(--color-surface-2)" stroke="var(--color-signal)" stroke-width="1"/>
<text x="225" y="185" font-size="15" fill="var(--color-signal)" text-anchor="middle">US HQ*</text>
<text x="225" y="204" font-size="14" fill="var(--color-paper)" text-anchor="middle">Exclusion</text>
<path d="M160 227V255" fill="none" stroke="var(--color-muted)" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"/>
