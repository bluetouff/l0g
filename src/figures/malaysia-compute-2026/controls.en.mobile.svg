<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" viewBox="0 0 320 448" role="img" aria-labelledby="my-controls-en-m-title my-controls-en-m-desc" font-family="Inter Variable, Inter, sans-serif" font-weight="400" style="width:100%;height:auto">
<title id="my-controls-en-m-title">Two reviews for the same equipment</title>
<desc id="my-controls-en-m-desc">Partial map of the US rule published on 19 November 2026. Destination controls for five countries and controls on specific computing end-uses have separate tests. The US-headquarters exclusion, with monthly reporting, leaves the end-use review applicable.</desc>
<text x="14" y="25" font-size="17" fill="var(--color-paper)" text-anchor="start">Destination and end-use</text>
<text x="14" y="47" font-size="14" fill="var(--color-muted)" text-anchor="start">Two separate reviews</text>
<rect x="14" y="65" width="292" height="162" rx="5" fill="var(--color-surface)" stroke="var(--color-amber)" stroke-width="1"/>
<text x="28" y="91" font-size="16" fill="var(--color-amber)" text-anchor="start">1. Destination</text>
<text x="28" y="114" font-size="14" fill="var(--color-paper)" text-anchor="start">Malaysia · Singapore · Indonesia</text>
<text x="28" y="135" font-size="14" fill="var(--color-paper)" text-anchor="start">Thailand · Brazil</text>
<path d="M160 144V153H84V164" fill="none" stroke="var(--color-amber)" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"/>
