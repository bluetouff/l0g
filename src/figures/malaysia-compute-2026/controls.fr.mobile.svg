<svg xmlns="http://www.w3.org/2000/svg" xml:lang="fr" viewBox="0 0 320 448" role="img" aria-labelledby="my-controls-fr-m-title my-controls-fr-m-desc" font-family="Inter Variable, Inter, sans-serif" font-weight="400" style="width:100%;height:auto">
<title id="my-controls-fr-m-title">Deux examens sur le même équipement</title>
<desc id="my-controls-fr-m-desc">Carte partielle de la règle américaine publiée le 19 novembre 2026. Le contrôle de destination vers cinq pays et le contrôle de certains usages du calcul ont des critères distincts. La dispense liée au siège américain, soumise à un rapport mensuel, ne dispense pas d’examiner l’usage final.</desc>
<text x="14" y="25" font-size="17" fill="var(--color-paper)" text-anchor="start">Destination et usage</text>
<text x="14" y="47" font-size="14" fill="var(--color-muted)" text-anchor="start">Deux examens distincts</text>
<rect x="14" y="65" width="292" height="162" rx="5" fill="var(--color-surface)" stroke="var(--color-amber)" stroke-width="1"/>
<text x="28" y="91" font-size="16" fill="var(--color-amber)" text-anchor="start">1. Destination</text>
<text x="28" y="114" font-size="14" fill="var(--color-paper)" text-anchor="start">Malaisie · Singapour · Indonésie</text>
<text x="28" y="135" font-size="14" fill="var(--color-paper)" text-anchor="start">Thaïlande · Brésil</text>
<path d="M160 144V153H84V164" fill="none" stroke="var(--color-amber)" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"/>
