<text x="28" y="306" font-size="14" fill="var(--color-paper)" text-anchor="start">Siège ou mère ultime de l’entreprise</text>
<text x="28" y="327" font-size="14" fill="var(--color-paper)" text-anchor="start">à Macao ou dans D:5</text>
