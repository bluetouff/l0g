<text x="83" y="226" font-size="13" fill="var(--color-muted)" text-anchor="middle">case by case</text>
<rect x="147" y="182" width="113" height="66" rx="5" fill="var(--color-surface-2)" stroke="var(--color-signal)" stroke-width="1"/>
<text x="203.5" y="205" font-size="14" fill="var(--color-signal)" text-anchor="middle">US HQ*</text>
<text x="203.5" y="226" font-size="13" fill="var(--color-paper)" text-anchor="middle">Exclusion</text>
<rect x="326" y="76" width="256" height="192" rx="5" fill="var(--color-surface)" stroke="var(--color-accent)" stroke-width="1"/>
