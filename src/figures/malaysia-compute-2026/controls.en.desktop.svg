<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" viewBox="0 0 600 330" role="img" aria-labelledby="my-controls-en-d-title my-controls-en-d-desc" font-family="Inter Variable, Inter, sans-serif" font-weight="400" style="width:100%;height:auto">
<title id="my-controls-en-d-title">Two reviews for the same equipment</title>
<desc id="my-controls-en-d-desc">Partial map of the US rule published on 19 November 2026. Destination controls for five countries and controls on specific computing end-uses have separate tests. The US-headquarters exclusion, with monthly reporting, leaves the end-use review applicable.</desc>
<text x="18" y="27" font-size="17.5" fill="var(--color-paper)" text-anchor="start">Two reviews for the same equipment</text>
<text x="18" y="49" font-size="13" fill="var(--color-muted)" text-anchor="start">Items covered by the categories in the rule</text>
<rect x="18" y="76" width="255" height="192" rx="5" fill="var(--color-surface)" stroke="var(--color-amber)" stroke-width="1"/>
<text x="33" y="102" font-size="16" fill="var(--color-amber)" text-anchor="start">1. Destination</text>
<text x="33" y="126" font-size="13" fill="var(--color-paper)" text-anchor="start">Malaysia · Singapore · Indonesia</text>
<text x="33" y="145" font-size="13" fill="var(--color-paper)" text-anchor="start">Thailand · Brazil</text>
<path d="M145 158V168H83V182" fill="none" stroke="var(--color-amber)" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M145 168H209V182" fill="none" stroke="var(--color-signal)" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"/>
