<svg xmlns="http://www.w3.org/2000/svg" xml:lang="fr" viewBox="0 0 600 330" role="img" aria-labelledby="my-controls-fr-d-title my-controls-fr-d-desc" font-family="Inter Variable, Inter, sans-serif" font-weight="400" style="width:100%;height:auto">
<title id="my-controls-fr-d-title">Deux examens sur le même équipement</title>
<desc id="my-controls-fr-d-desc">Carte partielle de la règle américaine publiée le 19 novembre 2026. Le contrôle de destination vers cinq pays et le contrôle de certains usages du calcul ont des critères distincts. La dispense liée au siège américain, soumise à un rapport mensuel, ne dispense pas d’examiner l’usage final.</desc>
<text x="18" y="27" font-size="17.5" fill="var(--color-paper)" text-anchor="start">Deux examens sur le même équipement</text>
<text x="18" y="49" font-size="13" fill="var(--color-muted)" text-anchor="start">Matériels couverts par les catégories du texte</text>
<rect x="18" y="76" width="255" height="192" rx="5" fill="var(--color-surface)" stroke="var(--color-amber)" stroke-width="1"/>
<text x="33" y="102" font-size="16" fill="var(--color-amber)" text-anchor="start">1. Destination</text>
<text x="33" y="126" font-size="13" fill="var(--color-paper)" text-anchor="start">Malaisie · Singapour · Indonésie</text>
<text x="33" y="145" font-size="13" fill="var(--color-paper)" text-anchor="start">Thaïlande · Brésil</text>
<path d="M145 158V168H83V182" fill="none" stroke="var(--color-amber)" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M145 168H209V182" fill="none" stroke="var(--color-signal)" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="31" y="182" width="104" height="66" rx="5" fill="var(--color-surface-2)" stroke="var(--color-amber)" stroke-width="1"/>
<text x="83" y="205" font-size="14" fill="var(--color-paper)" text-anchor="middle">Licence</text>
<text x="83" y="226" font-size="13" fill="var(--color-muted)" text-anchor="middle">au cas par cas</text>
<rect x="147" y="182" width="113" height="66" rx="5" fill="var(--color-surface-2)" stroke="var(--color-signal)" stroke-width="1"/>
<text x="203.5" y="205" font-size="14" fill="var(--color-signal)" text-anchor="middle">Siège US*</text>
<text x="203.5" y="226" font-size="13" fill="var(--color-paper)" text-anchor="middle">Dispense</text>
<rect x="326" y="76" width="256" height="192" rx="5" fill="var(--color-surface)" stroke="var(--color-accent)" stroke-width="1"/>
<text x="341" y="102" font-size="16" fill="var(--color-accent)" text-anchor="start">2. Usage du calcul</text>
<text x="341" y="128" font-size="13" fill="var(--color-paper)" text-anchor="start">Entreprise : siège ou mère ultime</text>
<text x="341" y="148" font-size="13" fill="var(--color-paper)" text-anchor="start">à Macao ou dans D:5</text>
<rect x="343" y="175" width="23" height="7" rx="1" fill="var(--color-surface-2)" stroke="var(--color-accent)" stroke-width="1"/>
<path d="M348 178.5H357" fill="none" stroke="var(--color-accent)" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="343" y="184" width="23" height="7" rx="1" fill="var(--color-surface-2)" stroke="var(--color-accent)" stroke-width="1"/>
