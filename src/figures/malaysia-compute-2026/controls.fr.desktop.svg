<rect x="382" y="175" width="23" height="7" rx="1" fill="var(--color-surface-2)" stroke="var(--color-accent)" stroke-width="1"/>
<path d="M387 178.5H396" fill="none" stroke="var(--color-accent)" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="382" y="184" width="23" height="7" rx="1" fill="var(--color-surface-2)" stroke="var(--color-accent)" stroke-width="1"/>
<path d="M387 187.5H396" fill="none" stroke="var(--color-accent)" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="382" y="193" width="23" height="7" rx="1" fill="var(--color-surface-2)" stroke="var(--color-accent)" stroke-width="1"/>
<path d="M387 196.5H396" fill="none" stroke="var(--color-accent)" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M366 187H382" fill="none" stroke="var(--color-accent)" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"/>
<text x="421" y="187" font-size="15" fill="var(--color-paper)" text-anchor="start">Accès &gt;12 M</text>
<text x="421" y="208" font-size="13" fill="var(--color-muted)" text-anchor="start">TPP agrégé</text>
<text x="341" y="244" font-size="13" fill="var(--color-muted)" text-anchor="start">Matériels visés + connaissance</text>
<path d="M273 190H326" fill="none" stroke="var(--color-muted)" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M321 187L326 190L321 193" fill="none" stroke="var(--color-muted)" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"/>
<text x="18" y="294" font-size="13" fill="var(--color-muted)" text-anchor="start">* Siège US du destinataire/utilisateur final ou de sa mère ultime.</text>
<text x="18" y="315" font-size="13" fill="var(--color-muted)" text-anchor="start">Rapport mensuel au BIS. L’examen de l’usage demeure applicable.</text>
</svg>
