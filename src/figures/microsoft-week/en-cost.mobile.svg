<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 309" width="100%" height="auto" style="width:100%;height:auto" role="img" aria-labelledby="microsoft-week-en-cost-mobile-title microsoft-week-en-cost-mobile-desc" xml:lang="en">
<title id="microsoft-week-en-cost-mobile-title">From delay to loss</title>
<desc id="microsoft-week-en-cost-mobile-desc">Of one million euros of sales excluding tax, 500,000 are exposed. The fallback processes 200,000 euros. Another 225,000 are recovered and 75,000 are lost. Lost contribution of 26,250 euros and extra costs of 40,000 euros produce a cost of 66,250 euros before insurance, service credits, funding and taxes.</desc>
<rect x="0.5" y="0.5" width="319" height="308" rx="9" fill="var(--color-ink)" fill-opacity="1" stroke="var(--color-line)"/>
<text x="16" y="30" font-size="16" fill="var(--color-paper)" text-anchor="start">From delay to loss</text>
<text x="16" y="48" font-size="12" fill="var(--color-muted)" text-anchor="start">Hypothetical case · €1,000,000 in sales excl. tax</text>
<g transform="translate(287 17)" aria-hidden="true"><path d="M5 2h7l4 4v12H5zm7 0v4h4M8 9h5m-5 3h5m-5 3h3" fill="none" stroke="var(--color-signal)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></g>
<path d="M16 60L304 60" fill="none" stroke="var(--color-line)" stroke-width="1"/>
<text x="16" y="83" font-size="13" fill="var(--color-paper)" text-anchor="start">Outage begins</text>
<text x="304" y="83" font-size="12" fill="var(--color-accent)" text-anchor="end">€500,000 exposed</text>
<rect x="16.5" y="91" width="143" height="10" rx="0" fill="var(--color-topic-blue)" fill-opacity="0.22" stroke="var(--color-topic-blue)"/>
<rect x="160.5" y="91" width="143" height="10" rx="0" fill="var(--color-accent)" fill-opacity="0.22" stroke="var(--color-accent)"/>
<text x="16" y="125" font-size="13" fill="var(--color-paper)" text-anchor="start">Outage ends</text>
<text x="304" y="125" font-size="12" fill="var(--color-accent)" text-anchor="end">€300,000 pending</text>
<rect x="16.5" y="133" width="143" height="10" rx="0" fill="var(--color-topic-blue)" fill-opacity="0.22" stroke="var(--color-topic-blue)"/>
<rect x="160.5" y="133" width="56.6" height="10" rx="0" fill="var(--color-signal)" fill-opacity="0.22" stroke="var(--color-signal)"/>
<rect x="218.1" y="133" width="85.4" height="10" rx="0" fill="var(--color-accent)" fill-opacity="0.22" stroke="var(--color-accent)"/>
<text x="16" y="167" font-size="13" fill="var(--color-paper)" text-anchor="start">After recovery</text>
<text x="304" y="167" font-size="12" fill="var(--color-accent)" text-anchor="end">€75,000 lost</text>
<rect x="16.5" y="175" width="143" height="10" rx="0" fill="var(--color-topic-blue)" fill-opacity="0.22" stroke="var(--color-topic-blue)"/>
<rect x="160.5" y="175" width="56.6" height="10" rx="0" fill="var(--color-signal)" fill-opacity="0.22" stroke="var(--color-signal)"/>
<rect x="218.1" y="175" width="63.8" height="10" rx="0" fill="var(--color-amber)" fill-opacity="0.22" stroke="var(--color-amber)"/>
<rect x="282.9" y="175" width="20.6" height="10" rx="0" fill="var(--color-accent)" fill-opacity="0.22" stroke="var(--color-accent)"/>
<circle cx="19" cy="199" r="3" fill="var(--color-topic-blue)"/>
<text x="28" y="203" font-size="11" fill="var(--color-muted)" text-anchor="start">Unaffected</text>
<circle cx="163" cy="199" r="3" fill="var(--color-signal)"/>
<text x="172" y="203" font-size="11" fill="var(--color-muted)" text-anchor="start">Fallback</text>
<circle cx="19" cy="218" r="3" fill="var(--color-amber)"/>
<text x="28" y="222" font-size="11" fill="var(--color-muted)" text-anchor="start">Recovered</text>
<circle cx="163" cy="218" r="3" fill="var(--color-accent)"/>
<text x="172" y="222" font-size="11" fill="var(--color-muted)" text-anchor="start">Pending or lost</text>
<path d="M16 240L304 240" fill="none" stroke="var(--color-line)" stroke-width="1"/>
<text x="64" y="266" font-size="15" fill="var(--color-paper)" text-anchor="middle">€26,250</text>
<text x="64" y="286" font-size="11" fill="var(--color-muted)" text-anchor="middle">Lost contribution</text>
<text x="112" y="266" font-size="14" fill="var(--color-muted)" text-anchor="middle">+</text>
<text x="160" y="266" font-size="15" fill="var(--color-paper)" text-anchor="middle">€40,000</text>
<text x="160" y="286" font-size="11" fill="var(--color-muted)" text-anchor="middle">Extra costs</text>
<text x="208" y="266" font-size="14" fill="var(--color-muted)" text-anchor="middle">=</text>
<text x="256" y="266" font-size="15" fill="var(--color-signal)" text-anchor="middle">€66,250</text>
<text x="256" y="286" font-size="11" fill="var(--color-muted)" text-anchor="middle">Total cost</text>
</svg>
