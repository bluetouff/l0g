<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 245" width="100%" height="auto" style="width:100%;height:auto" role="img" aria-labelledby="microsoft-week-fr-incident-mobile-title microsoft-week-fr-incident-mobile-desc" xml:lang="fr">
<title id="microsoft-week-fr-incident-mobile-title">Le retour de la messagerie</title>
<desc id="microsoft-week-fr-incident-mobile-desc">Microsoft situe le début de la panne au 12 novembre à 16 h 20 UTC et la fin de son impact actif au 13 à 16 h 10, après 23 h 50. La surveillance se poursuit pendant 12 h 05, jusqu’au 14 à 4 h 15. Le 13, la disponibilité en Europe revient au niveau attendu à 11 h 35 et le webmail mondial à 14 h 17.</desc>
