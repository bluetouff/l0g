<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 245" width="100%" height="auto" style="width:100%;height:auto" role="img" aria-labelledby="microsoft-week-en-incident-mobile-title microsoft-week-en-incident-mobile-desc" xml:lang="en">
<title id="microsoft-week-en-incident-mobile-title">Email service returns in stages</title>
<desc id="microsoft-week-en-incident-mobile-desc">Microsoft places the start of the outage on 12 November at 16:20 UTC and the end of its active impact on 13 November at 16:10, 23 hours and 50 minutes later. Monitoring continued for 12 hours and 5 minutes, until 04:15 on 14 November. On 13 November, European availability returned to expected levels at 11:35 and global webmail at 14:17.</desc>
