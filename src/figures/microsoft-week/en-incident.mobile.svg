<text x="16" y="30" font-size="16" fill="var(--color-paper)" text-anchor="start">Email service returns in stages</text>
<text x="16" y="48" font-size="12" fill="var(--color-muted)" text-anchor="start">12–14 November 2026 · all times UTC</text>
<g transform="translate(287 17)" aria-hidden="true"><path d="M2 4h16v12H2zM2 5l8 6 8-6m-11 4-5 5m11-5 5 5" fill="none" stroke="var(--color-signal)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></g>
<path d="M16 60L304 60" fill="none" stroke="var(--color-line)" stroke-width="1"/>
