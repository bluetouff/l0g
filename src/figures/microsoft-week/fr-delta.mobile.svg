<title id="microsoft-week-fr-delta-mobile-title">Delta chiffre l’impact du choc</title>
<desc id="microsoft-week-fr-delta-mobile-desc">Delta Air Lines estime une perte de recettes de 380 millions de dollars, 170 millions de charges supplémentaires hors carburant et 50 millions économisés en carburant, soit un impact net d’environ 500 millions sur le résultat d’exploitation du trimestre clos en septembre 2024.</desc>
