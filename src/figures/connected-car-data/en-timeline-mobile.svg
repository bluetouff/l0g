<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="connected-car-en-timeline-m-title connected-car-en-timeline-m-desc" viewBox="0 0 420 900" style="width:100%;height:auto" class="l0g-connected-car-svg">
<title id="connected-car-en-timeline-m-title">From data sharing to announced agreements</title><desc id="connected-car-en-timeline-m-desc">An ordinal timeline of announcements: GM said sharing stopped on 20 March 2024, the FTC proposed an order on 16 January 2025, its final order was announced on 14 January 2026, California announced its settlement on 8 May 2026, and a $220 million multistate agreement was announced on 29 October 2026. The last point, 30 November 2026, is the agreement’s planned effective date and remains future as of 31 October. Spacing is not proportional to elapsed time. Figures from different proceedings are not added together.</desc>
<rect x="0" y="0" width="420" height="900" fill="var(--color-ink)"/>
<rect id="connected-car-en-timeline-m-header" x="16" y="12" width="388" height="132" rx="8" fill="var(--color-ink)"/>
<text data-panel="connected-car-en-timeline-m-header" x="28" y="38" font-family="l0g Connected Car" font-size="18" font-weight="700" fill="var(--color-signal)" text-anchor="start">l0g / CAR DATA</text>
<text data-panel="connected-car-en-timeline-m-header" x="392" y="38" font-family="l0g Connected Car" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="end">03 / 03</text>
<text data-panel="connected-car-en-timeline-m-header" x="28" y="79" font-family="l0g Connected Car" font-size="24" font-weight="700" fill="var(--color-paper)" text-anchor="start">From data sharing</text>
<text data-panel="connected-car-en-timeline-m-header" x="28" y="110" font-family="l0g Connected Car" font-size="24" font-weight="700" fill="var(--color-paper)" text-anchor="start">to announced agreements</text>
<path data-connector="timeline-past" d="M32 181 L32 629" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path data-connector="timeline-planned" d="M32 629 L32 741" fill="none" stroke="var(--color-amber)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7"/>
<rect id="connected-car-en-timeline-m-event-0" x="56" y="150" width="348" height="96" rx="8" fill="var(--color-surface)"/>
<circle data-event="0" data-status="reported" cx="32" cy="181" r="8" fill="var(--color-signal)" stroke="var(--color-signal)" stroke-width="3"/>
<path data-connector="tick-0" d="M42 181 L52 181" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text data-panel="connected-car-en-timeline-m-event-0" x="72" y="177" font-family="l0g Connected Car" font-size="20" font-weight="700" fill="var(--color-paper)" text-anchor="start">20 March 2024</text>
<text data-panel="connected-car-en-timeline-m-event-0" x="72" y="204" font-family="l0g Connected Car" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">Sharing halted,</text>
<text data-panel="connected-car-en-timeline-m-event-0" x="72" y="231" font-family="l0g Connected Car" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">according to GM</text>
<rect id="connected-car-en-timeline-m-event-1" x="56" y="262" width="348" height="96" rx="8" fill="var(--color-surface)"/>
<circle data-event="1" data-status="announced" cx="32" cy="293" r="8" fill="var(--color-signal)" stroke="var(--color-signal)" stroke-width="3"/>
<path data-connector="tick-1" d="M42 293 L52 293" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text data-panel="connected-car-en-timeline-m-event-1" x="72" y="289" font-family="l0g Connected Car" font-size="20" font-weight="700" fill="var(--color-paper)" text-anchor="start">16 January 2025</text>
<text data-panel="connected-car-en-timeline-m-event-1" x="72" y="316" font-family="l0g Connected Car" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">FTC: proposed order</text>
<text data-panel="connected-car-en-timeline-m-event-1" x="72" y="343" font-family="l0g Connected Car" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">and allegations</text>
<rect id="connected-car-en-timeline-m-event-2" x="56" y="374" width="348" height="96" rx="8" fill="var(--color-surface)"/>
<circle data-event="2" data-status="announced" cx="32" cy="405" r="8" fill="var(--color-signal)" stroke="var(--color-signal)" stroke-width="3"/>
<path data-connector="tick-2" d="M42 405 L52 405" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text data-panel="connected-car-en-timeline-m-event-2" x="72" y="401" font-family="l0g Connected Car" font-size="20" font-weight="700" fill="var(--color-paper)" text-anchor="start">14 January 2026</text>
<text data-panel="connected-car-en-timeline-m-event-2" x="72" y="428" font-family="l0g Connected Car" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">FTC announces</text>
<text data-panel="connected-car-en-timeline-m-event-2" x="72" y="455" font-family="l0g Connected Car" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">its final order</text>
<rect id="connected-car-en-timeline-m-event-3" x="56" y="486" width="348" height="96" rx="8" fill="var(--color-surface)"/>
<circle data-event="3" data-status="announced" cx="32" cy="517" r="8" fill="var(--color-signal)" stroke="var(--color-signal)" stroke-width="3"/>
<path data-connector="tick-3" d="M42 517 L52 517" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text data-panel="connected-car-en-timeline-m-event-3" x="72" y="513" font-family="l0g Connected Car" font-size="20" font-weight="700" fill="var(--color-paper)" text-anchor="start">8 May 2026</text>
<text data-panel="connected-car-en-timeline-m-event-3" x="72" y="540" font-family="l0g Connected Car" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">California agreement</text>
<text data-panel="connected-car-en-timeline-m-event-3" x="72" y="567" font-family="l0g Connected Car" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">announced</text>
<rect id="connected-car-en-timeline-m-event-4" x="56" y="598" width="348" height="96" rx="8" fill="var(--color-surface)"/>
<circle data-event="4" data-status="announced" cx="32" cy="629" r="8" fill="var(--color-signal)" stroke="var(--color-signal)" stroke-width="3"/>
<path data-connector="tick-4" d="M42 629 L52 629" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text data-panel="connected-car-en-timeline-m-event-4" x="72" y="625" font-family="l0g Connected Car" font-size="20" font-weight="700" fill="var(--color-paper)" text-anchor="start">29 October 2026</text>
<text data-panel="connected-car-en-timeline-m-event-4" x="72" y="652" font-family="l0g Connected Car" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">$220m multistate</text>
<text data-panel="connected-car-en-timeline-m-event-4" x="72" y="679" font-family="l0g Connected Car" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">agreement announced</text>
<rect id="connected-car-en-timeline-m-event-5" x="56" y="710" width="348" height="96" rx="8" fill="var(--color-surface)" stroke="var(--color-amber)" stroke-width="2"/>
<circle data-event="5" data-status="planned" cx="32" cy="741" r="8" fill="var(--color-ink)" stroke="var(--color-amber)" stroke-width="3"/>
<path data-connector="tick-5" d="M42 741 L52 741" fill="none" stroke="var(--color-amber)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text data-panel="connected-car-en-timeline-m-event-5" x="72" y="737" font-family="l0g Connected Car" font-size="20" font-weight="700" fill="var(--color-amber)" text-anchor="start">30 November 2026</text>
<text data-panel="connected-car-en-timeline-m-event-5" x="72" y="764" font-family="l0g Connected Car" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">Effective date</text>
<text data-panel="connected-car-en-timeline-m-event-5" x="72" y="791" font-family="l0g Connected Car" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">planned in agreement</text>
<rect id="connected-car-en-timeline-m-footer" x="16" y="810" width="388" height="78" rx="8" fill="var(--color-ink)"/>
<text data-panel="connected-car-en-timeline-m-footer" x="28" y="831" font-family="l0g Connected Car" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">30 November is a planned date,</text>
<text data-panel="connected-car-en-timeline-m-footer" x="28" y="855" font-family="l0g Connected Car" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">future as of 31 October 2026.</text>
<text data-panel="connected-car-en-timeline-m-footer" x="28" y="879" font-family="l0g Connected Car" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">Spacing is not proportional.</text>
</svg>
