<rect id="connected-car-en-flow-m-card-3" x="40" y="618" width="340" height="110" rx="8" fill="var(--color-surface)" stroke="var(--color-amber)" stroke-width="2"/>
<text data-panel="connected-car-en-flow-m-card-3" x="60" y="652" font-family="l0g Connected Car" font-size="24" font-weight="700" fill="var(--color-paper)" text-anchor="start">Car insurance</text>
<text data-panel="connected-car-en-flow-m-card-3" x="60" y="681" font-family="l0g Connected Car" font-size="20" font-weight="400" fill="var(--color-muted)" text-anchor="start">Target market</text>
<rect id="connected-car-en-flow-m-footer" x="16" y="810" width="388" height="78" rx="8" fill="var(--color-ink)"/>
<text data-panel="connected-car-en-flow-m-footer" x="28" y="831" font-family="l0g Connected Car" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">2020–2024 · historical circuit</text>
<text data-panel="connected-car-en-flow-m-footer" x="28" y="855" font-family="l0g Connected Car" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">Described transfer: solid line</text>
<text data-panel="connected-car-en-flow-m-footer" x="28" y="879" font-family="l0g Connected Car" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">Target market: dashed line</text>
</svg>
