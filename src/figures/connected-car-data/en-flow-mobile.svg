<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="connected-car-en-flow-m-title connected-car-en-flow-m-desc" viewBox="0 0 420 900" style="width:100%;height:auto" class="l0g-connected-car-svg">
<title id="connected-car-en-flow-m-title">Driving data moves towards an insurance market</title><desc id="connected-car-en-flow-m-desc">A qualitative diagram of the historical flows described in the US cases. Vehicle data is collected through OnStar and Smart Driver and then passed to Verisk and LexisNexis. A dashed branch identifies the insurance market targeted by the resulting products. No volume, premium change or direct transfer to every insurer is represented.</desc>
<rect x="0" y="0" width="420" height="900" fill="var(--color-ink)"/>
<rect id="connected-car-en-flow-m-header" x="16" y="12" width="388" height="132" rx="8" fill="var(--color-ink)"/>
<text data-panel="connected-car-en-flow-m-header" x="28" y="38" font-family="l0g Connected Car" font-size="18" font-weight="700" fill="var(--color-signal)" text-anchor="start">l0g / CAR DATA</text>
<text data-panel="connected-car-en-flow-m-header" x="392" y="38" font-family="l0g Connected Car" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="end">01 / 03</text>
<text data-panel="connected-car-en-flow-m-header" x="28" y="79" font-family="l0g Connected Car" font-size="24" font-weight="700" fill="var(--color-paper)" text-anchor="start">From driving data</text>
<text data-panel="connected-car-en-flow-m-header" x="28" y="110" font-family="l0g Connected Car" font-size="24" font-weight="700" fill="var(--color-paper)" text-anchor="start">to an insurance market</text>
<rect id="connected-car-en-flow-m-card-0" x="40" y="174" width="340" height="110" rx="8" fill="var(--color-surface)" stroke="var(--color-signal)" stroke-width="2"/>
<text data-panel="connected-car-en-flow-m-card-0" x="60" y="208" font-family="l0g Connected Car" font-size="24" font-weight="700" fill="var(--color-paper)" text-anchor="start">Vehicle</text>
<text data-panel="connected-car-en-flow-m-card-0" x="60" y="237" font-family="l0g Connected Car" font-size="20" font-weight="400" fill="var(--color-muted)" text-anchor="start">Braking and speed</text>
<text data-panel="connected-car-en-flow-m-card-0" x="60" y="266" font-family="l0g Connected Car" font-size="20" font-weight="400" fill="var(--color-muted)" text-anchor="start">Location</text>
<path data-connector="flow-0" d="M210 286 L210 312" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path data-connector="flow-0-arrow" d="M203 303 L210 312 L217 303" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect id="connected-car-en-flow-m-card-1" x="40" y="322" width="340" height="110" rx="8" fill="var(--color-surface)" stroke="var(--color-signal)" stroke-width="2"/>
<text data-panel="connected-car-en-flow-m-card-1" x="60" y="356" font-family="l0g Connected Car" font-size="24" font-weight="700" fill="var(--color-paper)" text-anchor="start">GM / OnStar</text>
<text data-panel="connected-car-en-flow-m-card-1" x="60" y="385" font-family="l0g Connected Car" font-size="20" font-weight="400" fill="var(--color-muted)" text-anchor="start">Smart Driver</text>
<text data-panel="connected-car-en-flow-m-card-1" x="60" y="414" font-family="l0g Connected Car" font-size="20" font-weight="400" fill="var(--color-muted)" text-anchor="start">Collection and sharing</text>
<path data-connector="flow-1" d="M210 434 L210 460" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path data-connector="flow-1-arrow" d="M203 451 L210 460 L217 451" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect id="connected-car-en-flow-m-card-2" x="40" y="470" width="340" height="110" rx="8" fill="var(--color-surface)" stroke="var(--color-signal)" stroke-width="2"/>
<text data-panel="connected-car-en-flow-m-card-2" x="60" y="504" font-family="l0g Connected Car" font-size="24" font-weight="700" fill="var(--color-paper)" text-anchor="start">Data brokers</text>
<text data-panel="connected-car-en-flow-m-card-2" x="60" y="533" font-family="l0g Connected Car" font-size="20" font-weight="400" fill="var(--color-muted)" text-anchor="start">Verisk / LexisNexis</text>
<text data-panel="connected-car-en-flow-m-card-2" x="60" y="562" font-family="l0g Connected Car" font-size="20" font-weight="400" fill="var(--color-muted)" text-anchor="start">Separate data scopes</text>
<path data-connector="flow-2" d="M210 582 L210 608" fill="none" stroke="var(--color-amber)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7"/>
