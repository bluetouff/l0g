<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="connected-car-fr-flow-m-title connected-car-fr-flow-m-desc" viewBox="0 0 420 900" style="width:100%;height:auto" class="l0g-connected-car-svg">
<title id="connected-car-fr-flow-m-title">Des données du véhicule au marché de l’assurance</title><desc id="connected-car-fr-flow-m-desc">Schéma qualitatif des flux historiques décrits dans les dossiers américains. Les données du véhicule sont collectées via OnStar et Smart Driver puis transmises à Verisk et LexisNexis. La branche en pointillés représente le marché de l’assurance visé par les produits. Aucun volume, taux de prime ou transfert direct à chaque assureur n’est représenté.</desc>
<rect x="0" y="0" width="420" height="900" fill="var(--color-ink)"/>
<rect id="connected-car-fr-flow-m-header" x="16" y="12" width="388" height="132" rx="8" fill="var(--color-ink)"/>
<text data-panel="connected-car-fr-flow-m-header" x="28" y="38" font-family="l0g Connected Car" font-size="18" font-weight="700" fill="var(--color-signal)" text-anchor="start">l0g / DONNÉES AUTO</text>
<text data-panel="connected-car-fr-flow-m-header" x="392" y="38" font-family="l0g Connected Car" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="end">01 / 03</text>
<text data-panel="connected-car-fr-flow-m-header" x="28" y="79" font-family="l0g Connected Car" font-size="24" font-weight="700" fill="var(--color-paper)" text-anchor="start">Du véhicule</text>
<text data-panel="connected-car-fr-flow-m-header" x="28" y="110" font-family="l0g Connected Car" font-size="24" font-weight="700" fill="var(--color-paper)" text-anchor="start">au marché de l’assurance</text>
<rect id="connected-car-fr-flow-m-card-0" x="40" y="174" width="340" height="110" rx="8" fill="var(--color-surface)" stroke="var(--color-signal)" stroke-width="2"/>
<text data-panel="connected-car-fr-flow-m-card-0" x="60" y="208" font-family="l0g Connected Car" font-size="24" font-weight="700" fill="var(--color-paper)" text-anchor="start">Véhicule</text>
<text data-panel="connected-car-fr-flow-m-card-0" x="60" y="237" font-family="l0g Connected Car" font-size="20" font-weight="400" fill="var(--color-muted)" text-anchor="start">Freinages, vitesse</text>
<text data-panel="connected-car-fr-flow-m-card-0" x="60" y="266" font-family="l0g Connected Car" font-size="20" font-weight="400" fill="var(--color-muted)" text-anchor="start">Localisation</text>
<path data-connector="flow-0" d="M210 286 L210 312" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path data-connector="flow-0-arrow" d="M203 303 L210 312 L217 303" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect id="connected-car-fr-flow-m-card-1" x="40" y="322" width="340" height="110" rx="8" fill="var(--color-surface)" stroke="var(--color-signal)" stroke-width="2"/>
<text data-panel="connected-car-fr-flow-m-card-1" x="60" y="356" font-family="l0g Connected Car" font-size="24" font-weight="700" fill="var(--color-paper)" text-anchor="start">GM / OnStar</text>
<text data-panel="connected-car-fr-flow-m-card-1" x="60" y="385" font-family="l0g Connected Car" font-size="20" font-weight="400" fill="var(--color-muted)" text-anchor="start">Smart Driver</text>
<text data-panel="connected-car-fr-flow-m-card-1" x="60" y="414" font-family="l0g Connected Car" font-size="20" font-weight="400" fill="var(--color-muted)" text-anchor="start">Collecte et partage</text>
<path data-connector="flow-1" d="M210 434 L210 460" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
