<text data-panel="connected-car-fr-flow-m-card-2" x="60" y="533" font-family="l0g Connected Car" font-size="20" font-weight="400" fill="var(--color-muted)" text-anchor="start">Verisk / LexisNexis</text>
<text data-panel="connected-car-fr-flow-m-card-2" x="60" y="562" font-family="l0g Connected Car" font-size="20" font-weight="400" fill="var(--color-muted)" text-anchor="start">Contrats différents</text>
