<text data-panel="connected-car-fr-flow-m-card-3" x="60" y="652" font-family="l0g Connected Car" font-size="24" font-weight="700" fill="var(--color-paper)" text-anchor="start">Assurance auto</text>
<text data-panel="connected-car-fr-flow-m-card-3" x="60" y="681" font-family="l0g Connected Car" font-size="20" font-weight="400" fill="var(--color-muted)" text-anchor="start">Débouché commercial</text>
<rect id="connected-car-fr-flow-m-footer" x="16" y="810" width="388" height="78" rx="8" fill="var(--color-ink)"/>
<text data-panel="connected-car-fr-flow-m-footer" x="28" y="831" font-family="l0g Connected Car" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">2020–2024 · circuit historique décrit</text>
<text data-panel="connected-car-fr-flow-m-footer" x="28" y="855" font-family="l0g Connected Car" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">Transfert décrit : trait plein</text>
<text data-panel="connected-car-fr-flow-m-footer" x="28" y="879" font-family="l0g Connected Car" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">Débouché visé : pointillés</text>
