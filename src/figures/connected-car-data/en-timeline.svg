<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="connected-car-en-timeline-d-title connected-car-en-timeline-d-desc" viewBox="0 0 1000 640" style="width:100%;height:auto" class="l0g-connected-car-svg">
<title id="connected-car-en-timeline-d-title">From data sharing to announced agreements</title><desc id="connected-car-en-timeline-d-desc">An ordinal timeline of announcements: GM said sharing stopped on 20 March 2024, the FTC proposed an order on 16 January 2025, its final order was announced on 14 January 2026, California announced its settlement on 8 May 2026, and a $220 million multistate agreement was announced on 29 October 2026. The last point, 30 November 2026, is the agreement’s planned effective date and remains future as of 31 October. Spacing is not proportional to elapsed time. Figures from different proceedings are not added together.</desc>
<rect x="0" y="0" width="1000" height="640" fill="var(--color-ink)"/>
<rect id="connected-car-en-timeline-d-header" x="16" y="12" width="968" height="118" rx="8" fill="var(--color-ink)"/>
<text data-panel="connected-car-en-timeline-d-header" x="32" y="40" font-family="l0g Connected Car" font-size="22" font-weight="700" fill="var(--color-signal)" text-anchor="start">l0g / CAR DATA</text>
<text data-panel="connected-car-en-timeline-d-header" x="968" y="40" font-family="l0g Connected Car" font-size="22" font-weight="400" fill="var(--color-muted)" text-anchor="end">03 / 03</text>
<text data-panel="connected-car-en-timeline-d-header" x="32" y="82" font-family="l0g Connected Car" font-size="32" font-weight="700" fill="var(--color-paper)" text-anchor="start">From data sharing to announced agreements</text>
<text data-panel="connected-car-en-timeline-d-header" x="32" y="118" font-family="l0g Connected Car" font-size="22" font-weight="400" fill="var(--color-muted)" text-anchor="start">United States · sharing cutoff, announcements and a planned date</text>
<path data-connector="timeline-past" d="M64 320 L760 320" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path data-connector="timeline-planned" d="M760 320 L934 320" fill="none" stroke="var(--color-amber)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7"/>
<rect id="connected-car-en-timeline-d-event-0" x="24" y="152" width="280" height="126" rx="8" fill="var(--color-surface)"/>
<path data-connector="tick-0" d="M64 308 L64 294 L164 294 L164 280" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<circle data-event="0" data-status="reported" cx="64" cy="320" r="9" fill="var(--color-signal)" stroke="var(--color-signal)" stroke-width="3"/>
<text data-panel="connected-car-en-timeline-d-event-0" x="164" y="184" font-family="l0g Connected Car" font-size="23" font-weight="700" fill="var(--color-paper)" text-anchor="middle">20 March 2024</text>
<text data-panel="connected-car-en-timeline-d-event-0" x="164" y="219" font-family="l0g Connected Car" font-size="22" font-weight="400" fill="var(--color-muted)" text-anchor="middle">Sharing halted,</text>
<text data-panel="connected-car-en-timeline-d-event-0" x="164" y="254" font-family="l0g Connected Car" font-size="22" font-weight="400" fill="var(--color-muted)" text-anchor="middle">according to GM</text>
<rect id="connected-car-en-timeline-d-event-1" x="24" y="370" width="280" height="126" rx="8" fill="var(--color-surface)"/>
<path data-connector="tick-1" d="M238 332 L238 350 L164 350 L164 368" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<circle data-event="1" data-status="announced" cx="238" cy="320" r="9" fill="var(--color-signal)" stroke="var(--color-signal)" stroke-width="3"/>
<text data-panel="connected-car-en-timeline-d-event-1" x="164" y="402" font-family="l0g Connected Car" font-size="23" font-weight="700" fill="var(--color-paper)" text-anchor="middle">16 January 2025</text>
<text data-panel="connected-car-en-timeline-d-event-1" x="164" y="437" font-family="l0g Connected Car" font-size="22" font-weight="400" fill="var(--color-muted)" text-anchor="middle">FTC: proposed order</text>
<text data-panel="connected-car-en-timeline-d-event-1" x="164" y="472" font-family="l0g Connected Car" font-size="22" font-weight="400" fill="var(--color-muted)" text-anchor="middle">and allegations</text>
<rect id="connected-car-en-timeline-d-event-2" x="360" y="152" width="280" height="126" rx="8" fill="var(--color-surface)"/>
<path data-connector="tick-2" d="M412 308 L412 294 L500 294 L500 280" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<circle data-event="2" data-status="announced" cx="412" cy="320" r="9" fill="var(--color-signal)" stroke="var(--color-signal)" stroke-width="3"/>
<text data-panel="connected-car-en-timeline-d-event-2" x="500" y="184" font-family="l0g Connected Car" font-size="23" font-weight="700" fill="var(--color-paper)" text-anchor="middle">14 January 2026</text>
<text data-panel="connected-car-en-timeline-d-event-2" x="500" y="219" font-family="l0g Connected Car" font-size="22" font-weight="400" fill="var(--color-muted)" text-anchor="middle">FTC announces</text>
<text data-panel="connected-car-en-timeline-d-event-2" x="500" y="254" font-family="l0g Connected Car" font-size="22" font-weight="400" fill="var(--color-muted)" text-anchor="middle">its final order</text>
<rect id="connected-car-en-timeline-d-event-3" x="360" y="370" width="280" height="126" rx="8" fill="var(--color-surface)"/>
<path data-connector="tick-3" d="M586 332 L586 350 L500 350 L500 368" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<circle data-event="3" data-status="announced" cx="586" cy="320" r="9" fill="var(--color-signal)" stroke="var(--color-signal)" stroke-width="3"/>
<text data-panel="connected-car-en-timeline-d-event-3" x="500" y="402" font-family="l0g Connected Car" font-size="23" font-weight="700" fill="var(--color-paper)" text-anchor="middle">8 May 2026</text>
<text data-panel="connected-car-en-timeline-d-event-3" x="500" y="437" font-family="l0g Connected Car" font-size="22" font-weight="400" fill="var(--color-muted)" text-anchor="middle">California agreement</text>
<text data-panel="connected-car-en-timeline-d-event-3" x="500" y="472" font-family="l0g Connected Car" font-size="22" font-weight="400" fill="var(--color-muted)" text-anchor="middle">announced</text>
<rect id="connected-car-en-timeline-d-event-4" x="696" y="152" width="280" height="126" rx="8" fill="var(--color-surface)"/>
<path data-connector="tick-4" d="M760 308 L760 294 L836 294 L836 280" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<circle data-event="4" data-status="announced" cx="760" cy="320" r="9" fill="var(--color-signal)" stroke="var(--color-signal)" stroke-width="3"/>
<text data-panel="connected-car-en-timeline-d-event-4" x="836" y="184" font-family="l0g Connected Car" font-size="23" font-weight="700" fill="var(--color-paper)" text-anchor="middle">29 October 2026</text>
<text data-panel="connected-car-en-timeline-d-event-4" x="836" y="219" font-family="l0g Connected Car" font-size="22" font-weight="400" fill="var(--color-muted)" text-anchor="middle">$220m multistate</text>
<text data-panel="connected-car-en-timeline-d-event-4" x="836" y="254" font-family="l0g Connected Car" font-size="22" font-weight="400" fill="var(--color-muted)" text-anchor="middle">agreement announced</text>
<rect id="connected-car-en-timeline-d-event-5" x="696" y="370" width="280" height="126" rx="8" fill="var(--color-surface)" stroke="var(--color-amber)" stroke-width="2"/>
<path data-connector="tick-5" d="M934 332 L934 350 L836 350 L836 368" fill="none" stroke="var(--color-amber)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<circle data-event="5" data-status="planned" cx="934" cy="320" r="9" fill="var(--color-ink)" stroke="var(--color-amber)" stroke-width="3"/>
<text data-panel="connected-car-en-timeline-d-event-5" x="836" y="402" font-family="l0g Connected Car" font-size="23" font-weight="700" fill="var(--color-amber)" text-anchor="middle">30 November 2026</text>
<text data-panel="connected-car-en-timeline-d-event-5" x="836" y="437" font-family="l0g Connected Car" font-size="22" font-weight="400" fill="var(--color-muted)" text-anchor="middle">Effective date</text>
<text data-panel="connected-car-en-timeline-d-event-5" x="836" y="472" font-family="l0g Connected Car" font-size="22" font-weight="400" fill="var(--color-muted)" text-anchor="middle">planned in agreement</text>
<rect id="connected-car-en-timeline-d-footer" x="16" y="550" width="968" height="78" rx="8" fill="var(--color-ink)"/>
<text data-panel="connected-car-en-timeline-d-footer" x="32" y="578" font-family="l0g Connected Car" font-size="22" font-weight="400" fill="var(--color-muted)" text-anchor="start">Final point: a planned date after the 31 October 2026 cutoff.</text>
<text data-panel="connected-car-en-timeline-d-footer" x="32" y="608" font-family="l0g Connected Car" font-size="22" font-weight="400" fill="var(--color-muted)" text-anchor="start">Ordinal spacing: distances do not represent elapsed time.</text>
</svg>
