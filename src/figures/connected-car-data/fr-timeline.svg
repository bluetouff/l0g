<text data-panel="connected-car-fr-timeline-d-event-4" x="836" y="219" font-family="l0g Connected Car" font-size="22" font-weight="400" fill="var(--color-muted)" text-anchor="middle">Accord multistate</text>
<text data-panel="connected-car-fr-timeline-d-event-4" x="836" y="254" font-family="l0g Connected Car" font-size="22" font-weight="400" fill="var(--color-muted)" text-anchor="middle">de 220 M$ annoncé</text>
<rect id="connected-car-fr-timeline-d-event-5" x="696" y="370" width="280" height="126" rx="8" fill="var(--color-surface)" stroke="var(--color-amber)" stroke-width="2"/>
<path data-connector="tick-5" d="M934 332 L934 350 L836 350 L836 368" fill="none" stroke="var(--color-amber)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<circle data-event="5" data-status="planned" cx="934" cy="320" r="9" fill="var(--color-ink)" stroke="var(--color-amber)" stroke-width="3"/>
<text data-panel="connected-car-fr-timeline-d-event-5" x="836" y="402" font-family="l0g Connected Car" font-size="23" font-weight="700" fill="var(--color-amber)" text-anchor="middle">30 novembre 2026</text>
<text data-panel="connected-car-fr-timeline-d-event-5" x="836" y="437" font-family="l0g Connected Car" font-size="22" font-weight="400" fill="var(--color-muted)" text-anchor="middle">Entrée en vigueur</text>
<text data-panel="connected-car-fr-timeline-d-event-5" x="836" y="472" font-family="l0g Connected Car" font-size="22" font-weight="400" fill="var(--color-muted)" text-anchor="middle">prévue par l’accord</text>
<rect id="connected-car-fr-timeline-d-footer" x="16" y="550" width="968" height="78" rx="8" fill="var(--color-ink)"/>
<text data-panel="connected-car-fr-timeline-d-footer" x="32" y="578" font-family="l0g Connected Car" font-size="22" font-weight="400" fill="var(--color-muted)" text-anchor="start">Dernier point : date prévue, postérieure au 31 octobre 2026.</text>
<text data-panel="connected-car-fr-timeline-d-footer" x="32" y="608" font-family="l0g Connected Car" font-size="22" font-weight="400" fill="var(--color-muted)" text-anchor="start">Espacement ordinal : les distances ne représentent pas les durées.</text>
