<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="connected-car-en-contracts-d-title connected-car-en-contracts-d-desc" viewBox="0 0 1000 640" style="width:100%;height:auto" class="l0g-connected-car-svg">
<title id="connected-car-en-contracts-d-title">Two contracts cover different sets of data</title><desc id="connected-car-en-contracts-d-desc">The data split described in paragraphs 14 and 15 of the California complaint. The Verisk contract covered identity and driving information while excluding precise GPS location; that contractual scope is not a technical audit of deliveries. LexisNexis also received precise GPS coordinates; it did not use them in its driving ratings. These statements are attributed to the complaint. No specific insurer or individual premium change is inferred.</desc>
<rect x="0" y="0" width="1000" height="640" fill="var(--color-ink)"/>
