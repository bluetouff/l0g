<text data-panel="connected-car-en-contracts-d-header" x="32" y="40" font-family="l0g Connected Car" font-size="22" font-weight="700" fill="var(--color-signal)" text-anchor="start">l0g / CAR DATA</text>
<text data-panel="connected-car-en-contracts-d-header" x="968" y="40" font-family="l0g Connected Car" font-size="22" font-weight="400" fill="var(--color-muted)" text-anchor="end">02 / 03</text>
<text data-panel="connected-car-en-contracts-d-header" x="32" y="82" font-family="l0g Connected Car" font-size="32" font-weight="700" fill="var(--color-paper)" text-anchor="start">Two contracts cover different sets of data</text>
<text data-panel="connected-car-en-contracts-d-header" x="32" y="118" font-family="l0g Connected Car" font-size="22" font-weight="400" fill="var(--color-muted)" text-anchor="start">California complaint · paragraphs 14–15 · allegations in the case</text>
