<text data-panel="connected-car-en-contracts-d-card-0" x="46" y="385" font-family="l0g Connected Car" font-size="22" font-weight="400" fill="var(--color-muted)" text-anchor="start">Identity and driving</text>
<text data-panel="connected-car-en-contracts-d-card-0" x="46" y="427" font-family="l0g Connected Car" font-size="22" font-weight="400" fill="var(--color-muted)" text-anchor="start">Precise GPS excluded</text>
