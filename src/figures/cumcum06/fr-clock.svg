<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cumcum06-fr-clock-d-title cumcum06-fr-clock-d-desc" viewBox="0 0 1000 720" style="width:100%;height:auto" class="l0g-cumcum06-svg">
