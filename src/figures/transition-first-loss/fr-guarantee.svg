<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="transition-fl-fr-guarantee-d-title transition-fl-fr-guarantee-d-desc" viewBox="0 0 1000 700" style="width:100%;height:auto" class="l0g-transition-first-loss-svg"><title id="transition-fl-fr-guarantee-d-title">Verdant : la garantie couvre une obligation</title><desc id="transition-fl-fr-guarantee-d-desc">Programme de garantie GuarantCo annoncé à 792 milliards VND sur quinze ans, en deux phases. Les émissions initiales notées totalisent 390 milliards VND. Les obligataires financent les émetteurs de Verdant, qui financent des installations solaires. En cas de défaut de paiement couvert, le garant paie selon son engagement. FiinRatings note les émetteurs BB+ et les obligations garanties AAA sur l’échelle nationale vietnamienne. Le nominal garanti est un engagement conditionnel ; la page ne confirme pas un décaissement intégral du programme.</desc><rect id="transition-fl-fr-guarantee-d-frame" x="0" y="0" width="1000" height="700" fill="var(--color-ink)"/><text data-panel="transition-fl-fr-guarantee-d-frame" x="40" y="42" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="22" font-weight="700" text-anchor="start">l0g / TRANSITION</text><text data-panel="transition-fl-fr-guarantee-d-frame" x="960" y="42" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="end">05 / 07</text><text data-panel="transition-fl-fr-guarantee-d-frame" x="40" y="94" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="32" font-weight="700" text-anchor="start">Verdant : la garantie couvre une obligation</text><text data-panel="transition-fl-fr-guarantee-d-frame" x="40" y="145" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="start">Viet Nam · dette en monnaie locale · 2026</text><text data-panel="transition-fl-fr-guarantee-d-frame" x="40" y="215" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="34" font-weight="700" text-anchor="start">792 Md VND · 15 ans</text><text data-panel="transition-fl-fr-guarantee-d-frame" x="960" y="215" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="24" font-weight="400" text-anchor="end">390 Md VND initialement notés</text><rect id="transition-fl-fr-guarantee-d-card-flow-0" x="33" y="265" width="284" height="130" fill="var(--color-ink)"/><text data-panel="transition-fl-fr-guarantee-d-card-flow-0" x="50" y="306" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="22" font-weight="700" text-anchor="start">Obligataires</text><text data-panel="transition-fl-fr-guarantee-d-card-flow-0" x="50" y="346" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="22" font-weight="700" text-anchor="start">Apportent le capital</text><line x1="327" y1="332" x2="351" y2="332" stroke="var(--color-signal)" stroke-width="3"/><path d="M 342 326 L 351 332 L 342 338" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect id="transition-fl-fr-guarantee-d-card-flow-1" x="358" y="265" width="284" height="130" fill="var(--color-ink)"/><text data-panel="transition-fl-fr-guarantee-d-card-flow-1" x="375" y="306" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="22" font-weight="700" text-anchor="start">Émetteurs Verdant</text><text data-panel="transition-fl-fr-guarantee-d-card-flow-1" x="375" y="346" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="22" font-weight="700" text-anchor="start">Portent la dette</text><line x1="652" y1="332" x2="676" y2="332" stroke="var(--color-signal)" stroke-width="3"/><path d="M 667 326 L 676 332 L 667 338" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect id="transition-fl-fr-guarantee-d-card-flow-2" x="683" y="265" width="284" height="130" fill="var(--color-ink)"/><text data-panel="transition-fl-fr-guarantee-d-card-flow-2" x="700" y="306" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="22" font-weight="700" text-anchor="start">Solaire</text><text data-panel="transition-fl-fr-guarantee-d-card-flow-2" x="700" y="346" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="22" font-weight="700" text-anchor="start">Produit les recettes</text><text data-panel="transition-fl-fr-guarantee-d-frame" x="40" y="461" fill="var(--color-amber)" font-family="l0g Transition First Loss" font-size="29" font-weight="700" text-anchor="start">GuarantCo</text><text data-panel="transition-fl-fr-guarantee-d-frame" x="960" y="461" fill="var(--color-amber)" font-family="l0g Transition First Loss" font-size="23" font-weight="400" text-anchor="end">Paiement aux porteurs si défaut couvert</text><line x1="160" y1="431" x2="160" y2="407" stroke="var(--color-amber)" stroke-width="3"/><path d="M 154 416 L 160 407 L 166 416" fill="none" stroke="var(--color-amber)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="transition-fl-fr-guarantee-d-frame" x="40" y="549" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="29" font-weight="700" text-anchor="start">BB+ émetteurs</text><text data-panel="transition-fl-fr-guarantee-d-frame" x="960" y="549" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="29" font-weight="700" text-anchor="end">AAA obligations garanties</text><text data-panel="transition-fl-fr-guarantee-d-frame" x="40" y="604" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="start">Échelle nationale vietnamienne · coût et recours contractuels à documenter</text><line x1="40" y1="638" x2="960" y2="638" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="transition-fl-fr-guarantee-d-frame" x="40" 