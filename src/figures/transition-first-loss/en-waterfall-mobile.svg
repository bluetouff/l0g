<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="transition-fl-en-waterfall-m-title transition-fl-en-waterfall-m-desc" viewBox="0 0 420 850" style="width:100%;height:auto" class="l0g-transition-first-loss-svg"><title id="transition-fl-en-waterfall-m-title">Seniority allocates losses</title><desc id="transition-fl-en-waterfall-m-desc">Fictional example: $100 million of capital, comprising $10 million public, $20 million private equity and $70 million senior debt. For a fixed $25 million loss, structure A allocates $10 million to the public and $15 million to private equity; structure B allocates $5 million to the public and $20 million to private equity. Senior debt absorbs zero in both cases. Curves show structure A for total losses from zero to $100 million. No default probability is estimated.</desc><rect id="transition-fl-en-waterfall-m-frame" x="0" y="0" width="420" height="850" fill="var(--color-ink)"/><text data-panel="transition-fl-en-waterfall-m-frame" x="22" y="35" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="17" font-weight="700" text-anchor="start">l0g / TRANSITION</text><text data-panel="transition-fl-en-waterfall-m-frame" x="398" y="35" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="end">02 / 07</text><text data-panel="transition-fl-en-waterfall-m-frame" x="22" y="76" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="25" font-weight="700" text-anchor="start">Seniority allocates losses</text><text data-panel="transition-fl-en-waterfall-m-frame" x="22" y="117" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="start">Fictional example · $100m · fixed</text><text data-panel="transition-fl-en-waterfall-m-frame" x="22" y="140" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="start">$25m loss</text><text data-panel="transition-fl-en-waterfall-m-frame" x="28" y="211" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="20" font-weight="700" text-anchor="start">Capital: $10m / $20m / $70m</text><text data-panel="transition-fl-en-waterfall-m-frame" x="28" y="246" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="18" font-weight="400" text-anchor="start">Public → Private → Senior</text><text data-panel="transition-fl-en-waterfall-m-frame" x="28" y="276" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="18" font-weight="400" text-anchor="start">A : 10 + 15 + 0 = 25</text><rect data-metric="loss-a-0" data-value="10" x="28.0" y="294" width="145.6" height="22" fill="var(--color-accent)"/><rect data-metric="loss-a-1" data-value="15" x="173.6" y="294" width="218.4" height="22" fill="var(--color-amber)"/><text data-panel="transition-fl-en-waterfall-m-frame" x="28" y="350" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="18" font-weight="400" text-anchor="start">Private → Public → Senior</text><text data-panel="transition-fl-en-waterfall-m-frame" x="28" y="380" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="18" font-weight="400" text-anchor="start">B : 20 + 5 + 0 = 25</text><rect data-metric="loss-b-0" data-value="20" x="28.0" y="398" width="291.2" height="22" fill="var(--color-amber)"/><rect data-metric="loss-b-1" data-value="5" x="319.2" y="398" width="72.8" height="22" fill="var(--color-accent)"/><text data-panel="transition-fl-en-waterfall-m-frame" x="62" y="462" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="19" font-weight="700" text-anchor="start">Waterfall A · $m</text><line x1="62" y1="655.0" x2="378" y2="655.0" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="transition-fl-en-waterfall-m-frame" x="52" y="661.0" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="end">0</text><line x1="62" y1="605.285714" x2="378" y2="605.285714" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="transition-fl-en-waterfall-m-frame" x="52" y="611.285714" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="end">20</text><line x1="62" y1="555.571429" x2="378" y2="555.571429" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="transition-fl-en-waterfall-m-frame" x="52" y="561.571429" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="end">40</text><line x1="62" y1="481.0" x2="378" y2="481.0" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="transition-fl-en-waterfall-m-frame" x="52" y="487.0" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="end">70</text><path d="M 62.0 655.0 L 93.6 630.142857 L 156.8 630.142857 L 378.0 630.142857" fill="none" stroke="var(--color-accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 62.0 655.0 L 93.6 655.0 L 156.8 605.285714 L 378.0 605.285714" fill="none" stroke="var(--color-amber)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 62.0 655.0 L 93.6 655.0 L 156.8 655.0 L 378.0 481.0" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="transition-fl-en-waterfall-m-frame" x="62.0" y="686" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="middle">0</text><text data-panel="transition-fl-en-waterfall-m-frame" x="220.0" y="686" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="middle">50</text><text data-panel="transition-fl-en-waterfall-m-frame" x="378.0" y="686" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="middle">100</text><text data-panel="transition-fl-en-waterfall-m-frame" x="378" y="720" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="end">Total loss ($m)</text><text data-panel="transition-fl-en-waterfall-m-frame" x="28" y="756" fill="var(--color-accent)" font-family="l0g Transition First Loss" font-size="18" font-weight="700" text-anchor="start">Public</text><text data-panel="transition-fl-en-waterfall-m-frame" x="156" y="756" fill="var(--color-amber)" font-family="l0g Transition First Loss" font-size="18" font-weight="700" text-anchor="start">Private</text><text data-panel="transition-fl-en-waterfall-m-frame" x="284" y="756" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="18" font-weight="700" text-anchor="start">Senior</text><line x1="22" y1="788" x2="398" y2="788" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="transition-fl-en-waterfall-m-frame" x="22" y="820" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="start">R01 · G02 | Fictional model</text></svg>
