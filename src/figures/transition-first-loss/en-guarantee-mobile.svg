<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="transition-fl-en-guarantee-m-title transition-fl-en-guarantee-m-desc" viewBox="0 0 420 850" style="width:100%;height:auto" class="l0g-transition-first-loss-svg"><title id="transition-fl-en-guarantee-m-title">Verdant: the guarantee</title><desc id="transition-fl-en-guarantee-m-desc">GuarantCo announced a VND 792 billion guarantee programme over fifteen years in two phases. Initially rated issues total VND 390 billion. Bondholders finance Verdant issuers, which finance solar assets. On a covered payment default, the guarantor pays according to its undertaking. FiinRatings assigns issuers BB+ and guaranteed bonds AAA on the Vietnamese national scale. Guaranteed face value is a contingent commitment; the page does not confirm full programme disbursement.</desc><rect id="transition-fl-en-guarantee-m-frame" x="0" y="0" width="420" height="850" fill="var(--color-ink)"/><text data-panel="transition-fl-en-guarantee-m-frame" x="22" y="35" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="17" font-weight="700" text-anchor="start">l0g / TRANSITION</text><text data-panel="transition-fl-en-guarantee-m-frame" x="398" y="35" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="end">05 / 07</text><text data-panel="transition-fl-en-guarantee-m-frame" x="22" y="76" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="25" font-weight="700" text-anchor="start">Verdant: the guarantee</text><text data-panel="transition-fl-en-guarantee-m-frame" x="22" y="117" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="start">Viet Nam · local-currency debt · 2026</text><text data-panel="transition-fl-en-guarantee-m-frame" x="28" y="212" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="25" font-weight="700" text-anchor="start">VND792bn · 15 years</text><text data-panel="transition-fl-en-guarantee-m-frame" x="28" y="248" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="18" font-weight="400" text-anchor="start">VND390bn initially rated</text><rect id="transition-fl-en-guarantee-m-card-flow-0" x="22" y="283" width="376" height="90" fill="var(--color-ink)"/><text data-panel="transition-fl-en-guarantee-m-card-flow-0" x="40" y="313" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="20" font-weight="700" text-anchor="start">Bondholders</text><text data-panel="transition-fl-en-guarantee-m-card-flow-0" x="40" y="345" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="20" font-weight="700" text-anchor="start">Subscribe to the bonds</text><line x1="210" y1="384" x2="210" y2="424" stroke="var(--color-signal)" stroke-width="3"/><path d="M 204 415 L 210 424 L 216 415" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect id="transition-fl-en-guarantee-m-card-flow-1" x="22" y="436" width="376" height="90" fill="var(--color-ink)"/><text data-panel="transition-fl-en-guarantee-m-card-flow-1" x="40" y="466" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="20" font-weight="700" text-anchor="start">Verdant issuers</text><text data-panel="transition-fl-en-guarantee-m-card-flow-1" x="40" y="498" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="20" font-weight="700" text-anchor="start">Finance solar assets</text><text data-panel="transition-fl-en-guarantee-m-frame" x="28" y="573" fill="var(--color-amber)" font-family="l0g Transition First Loss" font-size="21" font-weight="700" text-anchor="start">GuarantCo → bondholders</text><text data-panel="transition-fl-en-guarantee-m-frame" x="28" y="609" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="18" font-weight="400" text-anchor="start">Payment on a covered default</text><text data-panel="transition-fl-en-guarantee-m-frame" x="28" y="679" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="18" font-weight="700" text-anchor="start">Issuers BB+ → bonds AAA</text><text data-panel="transition-fl-en-guarantee-m-frame" x="28" y="715" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="18" font-weight="700" text-anchor="start">Vietnamese national rating scale</text><line x1="22" y1="788" x2="398" y2="788" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="transition-fl-en-guarantee-m-frame" x="22" y="820" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="start">C06 · C07 · C08 · C09 | VND</text></svg>
