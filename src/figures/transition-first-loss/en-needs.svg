<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="transition-fl-en-needs-d-title transition-fl-en-needs-d-desc" viewBox="0 0 1000 700" style="width:100%;height:auto" class="l0g-transition-first-loss-svg"><title id="transition-fl-en-needs-d-title">The scope of the $3.7 billion</title><desc id="transition-fl-en-needs-d-desc">Estimated international public finance needs, cumulative 2026–2035, APS: around $0.1 billion for rooftop solar, over $0.2 billion for decentralized solutions, $1.1 billion for batteries and nearly $2.3 billion for offshore wind. 2025 dollars at market exchange rates. Three countries: Indonesia, Philippines and Viet Nam. Only part would be used in blended structures.</desc><rect id="transition-fl-en-needs-d-frame" x="0" y="0" width="1000" height="700" fill="var(--color-ink)"/><text data-panel="transition-fl-en-needs-d-frame" x="40" y="42" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="22" font-weight="700" text-anchor="start">l0g / TRANSITION</text><text data-panel="transition-fl-en-needs-d-frame" x="960" y="42" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="end">01 / 07</text><text data-panel="transition-fl-en-needs-d-frame" x="40" y="94" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="32" font-weight="700" text-anchor="start">The scope of the $3.7 billion</text><text data-panel="transition-fl-en-needs-d-frame" x="40" y="145" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="start">Projected need · APS · cumulative 2026–2035</text><text data-panel="transition-fl-en-needs-d-frame" x="40" y="215" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="42" font-weight="700" text-anchor="start">~ $3.7bn</text><text data-panel="transition-fl-en-needs-d-frame" x="960" y="215" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="28" font-weight="700" text-anchor="end">2026 → 2035</text><text data-panel="transition-fl-en-needs-d-frame" x="40" y="281" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="24" font-weight="700" text-anchor="start">Rooftop solar</text><text data-panel="transition-fl-en-needs-d-frame" x="960" y="281" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="23" font-weight="700" text-anchor="end">~ 0.1</text><rect data-metric="need-1" data-value="0.1" x="365" y="260" width="19.2" height="26" fill="var(--color-signal)"/><text data-panel="transition-fl-en-needs-d-frame" x="40" y="353" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="24" font-weight="700" text-anchor="start">Decentralized</text><text data-panel="transition-fl-en-needs-d-frame" x="960" y="353" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="23" font-weight="700" text-anchor="end">&gt; 0.2</text><rect data-metric="need-2" data-value="0.2" x="365" y="332" width="38.4" height="26" fill="var(--color-signal)"/><line x1="406.4" y1="345" x2="423.4" y2="345" stroke="var(--color-signal)" stroke-width="3"/><path d="M 414.4 339 L 423.4 345 L 414.4 351" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="transition-fl-en-needs-d-frame" x="40" y="425" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="24" font-weight="700" text-anchor="start">Battery storage</text><text data-panel="transition-fl-en-needs-d-frame" x="960" y="425" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="23" font-weight="700" text-anchor="end">~ 1.1</text><rect data-metric="need-3" data-value="1.1" x="365" y="404" width="211.2" height="26" fill="var(--color-signal)"/><text data-panel="transition-fl-en-needs-d-frame" x="40" y="497" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="24" font-weight="700" text-anchor="start">Offshore wind</text><text data-panel="transition-fl-en-needs-d-frame" x="960" y="497" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="23" font-weight="700" text-anchor="end">nearly 2.3</text><rect data-metric="need-4" data-value="2.3" x="365" y="476" width="441.6" height="26" fill="var(--color-signal)"/><line x1="365" y1="543" x2="845" y2="543" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="transition-fl-en-needs-d-frame" x="365.0" y="573" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="middle">0</text><text data-panel="transition-fl-en-needs-d-frame" x="557.0" y="573" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="middle">1</text><text data-panel="transition-fl-en-needs-d-frame" x="749.0" y="573" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="middle">2</text><text data-panel="transition-fl-en-needs-d-frame" x="960" y="573" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="end">USD bn, 2025</text><text data-panel="transition-fl-en-needs-d-frame" x="40" y="610" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="start">Indonesia · Philippines · Viet Nam | 2025 dollars at market exchange rates</text><line x1="40" y1="638" x2="960" y2="638" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="transition-fl-en-needs-d-frame" x="40" y="670" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="start">R01 | Estimated public finance need</text></svg>
