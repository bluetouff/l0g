<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="transition-fl-fr-needs-m-title transition-fl-fr-needs-m-desc" viewBox="0 0 420 850" style="width:100%;height:auto" class="l0g-transition-first-loss-svg"><title id="transition-fl-fr-needs-m-title">3,7 milliards sur dix ans</title><desc id="transition-fl-fr-needs-m-desc">Besoins estimés de financement public international, cumul 2026–2035, scénario APS : environ 0,1 milliard pour le solaire en toiture, plus de 0,2 pour les solutions décentralisées, 1,1 pour les batteries et près de 2,3 pour l’éolien en mer. Dollars 2025 aux taux de change de marché. Trois pays : Indonésie, Philippines et Viet Nam. Une partie seulement serait utilisée dans des structures mixtes.</desc><rect id="transition-fl-fr-needs-m-frame" x="0" y="0" width="420" height="850" fill="var(--color-ink)"/><text data-panel="transition-fl-fr-needs-m-frame" x="22" y="35" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="17" font-weight="700" text-anchor="start">l0g / TRANSITION</text><text data-panel="transition-fl-fr-needs-m-frame" x="398" y="35" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="end">01 / 07</text><text data-panel="transition-fl-fr-needs-m-frame" x="22" y="76" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="25" font-weight="700" text-anchor="start">3,7 milliards sur dix ans</text><text data-panel="transition-fl-fr-needs-m-frame" x="22" y="117" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="start">Besoin projeté · APS · cumul</text><text data-panel="transition-fl-fr-needs-m-frame" x="22" y="140" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="start">2026–2035</text><text data-panel="transition-fl-fr-needs-m-frame" x="28" y="211" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="32" font-weight="700" text-anchor="start">~ 3,7 Md$</text><text data-panel="transition-fl-fr-needs-m-frame" x="392" y="211" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="20" font-weight="700" text-anchor="end">2026 → 2035</text><text data-panel="transition-fl-fr-needs-m-frame" x="28" y="245" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="19" font-weight="700" text-anchor="start">Solaire en toiture</text><text data-panel="transition-fl-fr-needs-m-frame" x="392" y="245" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="21" font-weight="700" text-anchor="end">~ 0,1</text><rect data-metric="need-1" data-value="0.1" x="28" y="260" width="14.56" height="18" fill="var(--color-signal)"/><text data-panel="transition-fl-fr-needs-m-frame" x="28" y="333" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="19" font-weight="700" text-anchor="start">Décentralisé</text><text data-panel="transition-fl-fr-needs-m-frame" x="392" y="333" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="21" font-weight="700" text-anchor="end">&gt; 0,2</text><rect data-metric="need-2" data-value="0.2" x="28" y="348" width="29.12" height="18" fill="var(--color-signal)"/><line x1="60.12" y1="357" x2="77.12" y2="357" stroke="var(--color-signal)" stroke-width="3"/><path d="M 68.12 351 L 77.12 357 L 68.12 363" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="transition-fl-fr-needs-m-frame" x="28" y="421" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="19" font-weight="700" text-anchor="start">Batteries</text><text data-panel="transition-fl-fr-needs-m-frame" x="392" y="421" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="21" font-weight="700" text-anchor="end">~ 1,1</text><rect data-metric="need-3" data-value="1.1" x="28" y="436" width="160.16" height="18" fill="var(--color-signal)"/><text data-panel="transition-fl-fr-needs-m-frame" x="28" y="509" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="19" font-weight="700" text-anchor="start">Éolien en mer</text><text data-panel="transition-fl-fr-needs-m-frame" x="392" y="509" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="21" font-weight="700" text-anchor="end">près de 2,3</text><rect data-metric="need-4" data-value="2.3" x="28" y="524" width="334.88" height="18" fill="var(--color-signal)"/><line x1="28" y1="590" x2="392" y2="590" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="transition-fl-fr-needs-m-frame" x="28.0" y="620" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="middle">0</text><text data-panel="transition-fl-fr-needs-m-frame" x="173.6" y="620" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="middle">1</text><text data-panel="transition-fl-fr-needs-m-frame" x="319.2" y="620" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="middle">2</text><text data-panel="transition-fl-fr-needs-m-frame" x="392" y="650" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="end">Md USD 2025</text><text data-panel="transition-fl-fr-needs-m-frame" x="28" y="680" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="18" font-weight="400" text-anchor="start">Indonésie · Philippines · Viet Nam</text><text data-panel="transition-fl-fr-needs-m-frame" x="28" y="715" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="18" font-weight="400" text-anchor="start">Engagements annoncés supposés tenus</text><text data-panel="transition-fl-fr-needs-m-frame" x="28" y="750" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="18" font-weight="400" text-anchor="start">Une partie passe par la finance mixte.</text><line x1="22" y1="788" x2="398" y2="788" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="transition-fl-fr-needs-m-frame" x="22" y="820" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="start">R01 | Besoin public estimé</text></svg>
