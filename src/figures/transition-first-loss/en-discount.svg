<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="transition-fl-en-discount-d-title transition-fl-en-discount-d-desc" viewBox="0 0 1000 700" style="width:100%;height:auto" class="l0g-transition-first-loss-svg"><title id="transition-fl-en-discount-d-title">A $10m loan has two values</title><desc id="transition-fl-en-discount-d-desc">Fictional $10 million loan, 2% annual coupon, principal repaid at year ten and a conventional 7% discount rate. Coupons have a present value of $1.405m; principal has a present value of $5.083m. The total calculated before rounding is $6.49m, a $3.51m gap to the funds advanced. The example excludes default, fees and tax. It illustrates a pricing concession.</desc><rect id="transition-fl-en-discount-d-frame" x="0" y="0" width="1000" height="700" fill="var(--color-ink)"/><text data-panel="transition-fl-en-discount-d-frame" x="40" y="42" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="22" font-weight="700" text-anchor="start">l0g / TRANSITION</text><text data-panel="transition-fl-en-discount-d-frame" x="960" y="42" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="end">03 / 07</text><text data-panel="transition-fl-en-discount-d-frame" x="40" y="94" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="32" font-weight="700" text-anchor="start">A $10m loan has two values</text><text data-panel="transition-fl-en-discount-d-frame" x="40" y="145" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="start">Fictional loan · 2% coupon · ten years · 7% reference</text><text data-panel="transition-fl-en-discount-d-frame" x="40" y="215" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="26" font-weight="700" text-anchor="start">Coupons: $0.2m each year</text><rect data-metric="coupon-nominal-1" data-value="0.2" x="65.0" y="250" width="34.0" height="170" fill="var(--color-muted)"/><rect data-metric="coupon-pv-1" data-value="0.186916" x="65.0" y="261.121495" width="34.0" height="158.878505" fill="var(--color-signal)"/><text data-panel="transition-fl-en-discount-d-frame" x="82.0" y="448" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="middle">1</text><rect data-metric="coupon-nominal-2" data-value="0.2" x="107.0" y="250" width="34.0" height="170" fill="var(--color-muted)"/><rect data-metric="coupon-pv-2" data-value="0.174688" x="107.0" y="271.515416" width="34.0" height="148.484584" fill="var(--color-signal)"/><text data-panel="transition-fl-en-discount-d-frame" x="124.0" y="448" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="middle">2</text><rect data-metric="coupon-nominal-3" data-value="0.2" x="149.0" y="250" width="34.0" height="170" fill="var(--color-muted)"/><rect data-metric="coupon-pv-3" data-value="0.16326" x="149.0" y="281.229361" width="34.0" height="138.770639" fill="var(--color-signal)"/><text data-panel="transition-fl-en-discount-d-frame" x="166.0" y="448" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="middle">3</text><rect data-metric="coupon-nominal-4" data-value="0.2" x="191.0" y="250" width="34.0" height="170" fill="var(--color-muted)"/><rect data-metric="coupon-pv-4" data-value="0.152579" x="191.0" y="290.307814" width="34.0" height="129.692186" fill="var(--color-signal)"/><text data-panel="transition-fl-en-discount-d-frame" x="208.0" y="448" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="middle">4</text><rect data-metric="coupon-nominal-5" data-value="0.2" x="233.0" y="250" width="34.0" height="170" fill="var(--color-muted)"/><rect data-metric="coupon-pv-5" data-value="0.142597" x="233.0" y="298.792349" width="34.0" height="121.207651" fill="var(--color-signal)"/><text data-panel="transition-fl-en-discount-d-frame" x="250.0" y="448" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="middle">5</text><rect data-metric="coupon-nominal-6" data-value="0.2" x="275.0" y="250" width="34.0" height="170" fill="var(--color-muted)"/><rect data-metric="coupon-pv-6" data-value="0.133268" x="275.0" y="306.721822" width="34.0" height="113.278178" fill="var(--color-signal)"/><text data-panel="transition-fl-en-discount-d-frame" x="292.0" y="448" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="middle">6</text><rect data-metric="coupon-nominal-7" data-value="0.2" x="317.0" y="250" width="34.0" height="170" fill="var(--color-muted)"/><rect data-metric="coupon-pv-7" data-value="0.12455" x="317.0" y="314.132544" width="34.0" height="105.867456" fill="var(--color-signal)"/><text data-panel="transition-fl-en-discount-d-frame" x="334.0" y="448" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="middle">7</text><rect data-metric="coupon-nominal-8" data-value="0.2" x="359.0" y="250" width="34.0" height="170" fill="var(--color-muted)"/><rect data-metric="coupon-pv-8" data-value="0.116402" x="359.0" y="321.058452" width="34.0" height="98.941548" fill="var(--color-signal)"/><text data-panel="transition-fl-en-discount-d-frame" x="376.0" y="448" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="middle">8</text><rect data-metric="coupon-nominal-9" data-value="0.2" x="401.0" y="250" width="34.0" height="170" fill="var(--color-muted)"/><rect data-metric="coupon-pv-9" data-value="0.108787" x="401.0" y="327.531264" width="34.0" height="92.468736" fill="var(--color-signal)"/><text data-panel="transition-fl-en-discount-d-frame" x="418.0" y="448" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="middle">9</text><rect data-metric="coupon-nominal-10" data-value="0.2" x="443.0" y="250" width="34.0" height="170" fill="var(--color-muted)"/><rect data-metric="coupon-pv-10" data-value="0.10167" x="443.0" y="333.58062" width="34.0" height="86.41938" fill="var(--color-signal)"/><text data-panel="transition-fl-en-discount-d-frame" x="460.0" y="448" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="middle">10</text><text data-panel="transition-fl-en-discount-d-frame" x="485" y="474" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="end">Payment year</text><text data-panel="transition-fl-en-discount-d-frame" x="565" y="215" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="26" font-weight="700" text-anchor="start">Principal in year 10</text><text data-panel="transition-fl-en-discount-d-frame" x="565" y="267" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="31" font-weight="700" text-anchor="start">$10.000m → $5.083m</text><text data-panel="transition-fl-en-discount-d-frame" x="565" y="425" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="start">Grey: nominal</text><text data-panel="transition-fl-en-discount-d-frame" x="565" y="460" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="start">Turquoise: present value</text><text data-panel="transition-fl-en-discount-d-frame" x="565" y="336" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="24" font-weight="400" text-anchor="start">Present value of all coupons</text><text data-panel="transition-fl-en-discount-d-frame" x="565" y="376" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="24" font-weight="400" text-anchor="start">$1.405m</text><rect data-metric="loan-pv" data-value="6.488209" x="40" y="550" width="596.915249" height="30" fill="var(--color-signal)"/><rect data-metric="loan-gap" data-value="3.511791" x="636.915249" y="550" width="323.084751" height="30" fill="var(--color-accent)"/><text data-panel="transition-fl-en-discount-d-frame" x="40" y="625" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="26" font-weight="700" text-anchor="start">$6.49m present value</text><text data-panel="transition-fl-en-discount-d-frame" x="960" y="625" fill="var(--color-accent)" font-family="l0g Transition First Loss" font-size="26" font-weight="700" text-anchor="end">$3.51m concession</text><line x1="40" y1="638" x2="960" y2="638" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="transition-fl-en-discount-d-frame" x="40" y="670" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="start">G05 · G06 | Certain cash flows, no fees</text></svg>
