<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="transition-fl-fr-guarantee-m-title transition-fl-fr-guarantee-m-desc" viewBox="0 0 420 850" style="width:100%;height:auto" class="l0g-transition-first-loss-svg"><title id="transition-fl-fr-guarantee-m-title">Verdant : la garantie</title><desc id="transition-fl-fr-guarantee-m-desc">Programme de garantie GuarantCo annoncé à 792 milliards VND sur quinze ans, en deux phases. Les émissions initiales notées totalisent 390 milliards VND. Les obligataires financent les émetteurs de Verdant, qui financent des installations solaires. En cas de défaut de paiement couvert, le garant paie selon son engagement. FiinRatings note les émetteurs BB+ et les obligations garanties AAA sur l’échelle nationale vietnamienne. Le nominal garanti est un engagement conditionnel ; la page ne confirme pas un décaissement intégral du programme.</desc><rect id="transition-fl-fr-guarantee-m-frame" x="0" y="0" width="420" height="850" fill="var(--color-ink)"/><text data-panel="transition-fl-fr-guarantee-m-frame" x="22" y="35" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="17" font-weight="700" text-anchor="start">l0g / TRANSITION</text><text data-panel="transition-fl-fr-guarantee-m-frame" x="398" y="35" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="end">05 / 07</text><text data-panel="transition-fl-fr-guarantee-m-frame" x="22" y="76" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="25" font-weight="700" text-anchor="start">Verdant : la garantie</text><text data-panel="transition-fl-fr-guarantee-m-frame" x="22" y="117" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="start">Viet Nam · dette en monnaie locale ·</text><text data-panel="transition-fl-fr-guarantee-m-frame" x="22" y="140" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="start">2026</text><text data-panel="transition-fl-fr-guarantee-m-frame" x="28" y="212" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="25" font-weight="700" text-anchor="start">792 Md VND · 15 ans</text><text data-panel="transition-fl-fr-guarantee-m-frame" x="28" y="248" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="18" font-weight="400" text-anchor="start">390 Md VND initialement notés</text><rect id="transition-fl-fr-guarantee-m-card-flow-0" x="22" y="283" width="376" height="90" fill="var(--color-ink)"/><text data-panel="transition-fl-fr-guarantee-m-card-flow-0" x="40" y="313" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="20" font-weight="700" text-anchor="start">Obligataires</text><text data-panel="transition-fl-fr-guarantee-m-card-flow-0" x="40" y="345" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="20" font-weight="700" text-anchor="start">Souscrivent les titres</text><line x1="210" y1="384" x2="210" y2="424" stroke="var(--color-signal)" stroke-width="3"/><path d="M 204 415 L 210 424 L 216 415" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect id="transition-fl-fr-guarantee-m-card-flow-1" x="22" y="436" width="376" height="90" fill="var(--color-ink)"/><text data-panel="transition-fl-fr-guarantee-m-card-flow-1" x="40" y="466" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="20" font-weight="700" text-anchor="start">Émetteurs Verdant</text><text data-panel="transition-fl-fr-guarantee-m-card-flow-1" x="40" y="498" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="20" font-weight="700" text-anchor="start">Financent le solaire</text><text data-panel="transition-fl-fr-guarantee-m-frame" x="28" y="573" fill="var(--color-amber)" font-family="l0g Transition First Loss" font-size="21" font-weight="700" text-anchor="start">GuarantCo → obligataires</text><text data-panel="transition-fl-fr-guarantee-m-frame" x="28" y="609" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="18" font-weight="400" text-anchor="start">Paiement si défaut couvert</text><text data-panel="transition-fl-fr-guarantee-m-frame" x="28" y="679" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="18" font-weight="700" text-anchor="start">Émetteurs BB+ → obligations AAA</text><text data-panel="transition-fl-fr-guarantee-m-frame" x="28" y="715" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="18" font-weight="700" text-anchor="start">Échelle nationale vietnamienne</text><line x1="22" y1="788" x2="398" y2="788" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="transition-fl-fr-guarantee-m-frame" x="22" y="820" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="start">C06 · C07 · C08 · C09 | VND</text></svg>
