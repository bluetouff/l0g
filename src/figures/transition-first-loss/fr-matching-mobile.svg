<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="transition-fl-fr-matching-m-title transition-fl-fr-matching-m-desc" viewBox="0 0 420 850" style="width:100%;height:auto" class="l0g-transition-first-loss-svg"><title id="transition-fl-fr-matching-m-title">Choisir l’aide adaptée</title><desc id="transition-fl-fr-matching-m-desc">Carte analytique du cycle d’un projet : préparer règles et revenus, tester le risque finançable, boucler le financement, construire et exploiter, puis réexaminer le soutien. L’éolien en mer des Philippines et du Viet Nam demande de la préparation, des cadres d’achat et des infrastructures. Les batteries nécessitent des revenus crédibles. Le solaire en toiture peut bénéficier d’agrégation et de protection ciblée du risque client. Les dernières dessertes isolées peuvent exiger une subvention de service durable. Le choix dépend du contrat, de l’additionnalité et du minimum de concession.</desc><rect id="transition-fl-fr-matching-m-frame" x="0" y="0" width="420" height="850" fill="var(--color-ink)"/><text data-panel="transition-fl-fr-matching-m-frame" x="22" y="35" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="17" font-weight="700" text-anchor="start">l0g / TRANSITION</text><text data-panel="transition-fl-fr-matching-m-frame" x="398" y="35" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="end">07 / 07</text><text data-panel="transition-fl-fr-matching-m-frame" x="22" y="76" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="25" font-weight="700" text-anchor="start">Choisir l’aide adaptée</text><text data-panel="transition-fl-fr-matching-m-frame" x="22" y="117" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="start">Synthèse qualitative · financement</text><text data-panel="transition-fl-fr-matching-m-frame" x="22" y="140" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="start">des renouvelables</text><text data-panel="transition-fl-fr-matching-m-frame" x="28" y="210" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="20" font-weight="700" text-anchor="start">Préparer → isoler le blocage</text><text data-panel="transition-fl-fr-matching-m-frame" x="28" y="250" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="20" font-weight="700" text-anchor="start">Déployer → réexaminer</text><path d="M 395 268 L 395 283 L 28 283 L 28 265" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="transition-fl-fr-matching-m-frame" x="28" y="340" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="21" font-weight="700" text-anchor="start">Éolien en mer</text><line x1="28" y1="368" x2="51" y2="368" stroke="var(--color-amber)" stroke-width="3"/><path d="M 42 362 L 51 368 L 42 374" fill="none" stroke="var(--color-amber)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="transition-fl-fr-matching-m-frame" x="67" y="374" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="start">Cadre public, ports, réseau</text><text data-panel="transition-fl-fr-matching-m-frame" x="28" y="440" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="21" font-weight="700" text-anchor="start">Batteries</text><line x1="28" y1="468" x2="51" y2="468" stroke="var(--color-amber)" stroke-width="3"/><path d="M 42 462 L 51 468 L 42 474" fill="none" stroke="var(--color-amber)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="transition-fl-fr-matching-m-frame" x="67" y="474" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="start">Revenus crédibles, risque ciblé</text><text data-panel="transition-fl-fr-matching-m-frame" x="28" y="540" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="21" font-weight="700" text-anchor="start">Solaire en toiture</text><line x1="28" y1="568" x2="51" y2="568" stroke="var(--color-amber)" stroke-width="3"/><path d="M 42 562 L 51 568 L 42 574" fill="none" stroke="var(--color-amber)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="transition-fl-fr-matching-m-frame" x="67" y="574" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="start">Agrégation, risque client</text><text data-panel="transition-fl-fr-matching-m-frame" x="28" y="640" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="21" font-weight="700" text-anchor="start">Accès isolé</text><line x1="28" y1="668" x2="51" y2="668" stroke="var(--color-amber)" stroke-width="3"/><path d="M 42 662 L 51 668 L 42 674" fill="none" stroke="var(--color-amber)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="transition-fl-fr-matching-m-frame" x="67" y="674" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="start">Service électrique à subventionner</text><text data-panel="transition-fl-fr-matching-m-frame" x="28" y="752" fill="var(--color-amber)" font-family="l0g Transition First Loss" font-size="18" font-weight="700" text-anchor="start">Risque défini · concession minimale</text><line x1="22" y1="788" x2="398" y2="788" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="transition-fl-fr-matching-m-frame" x="22" y="820" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="start">R01 · G01 | Synthèse l0g</text></svg>
