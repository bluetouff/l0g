<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="transition-fl-en-matching-d-title transition-fl-en-matching-d-desc" viewBox="0 0 1000 700" style="width:100%;height:auto" class="l0g-transition-first-loss-svg"><title id="transition-fl-en-matching-d-title">Match support to the constraint</title><desc id="transition-fl-en-matching-d-desc">Analytical project-cycle map: prepare rules and revenues, test the financeable risk, close financing, build and operate, then reassess support. Offshore wind in the Philippines and Viet Nam needs preparation, procurement frameworks and infrastructure. Batteries need credible revenues. Rooftop solar may benefit from aggregation and targeted customer-risk support. Remote last-mile service may require lasting service subsidies. The choice depends on contracts, additionality and minimum concessionality.</desc><rect id="transition-fl-en-matching-d-frame" x="0" y="0" width="1000" height="700" fill="var(--color-ink)"/><text data-panel="transition-fl-en-matching-d-frame" x="40" y="42" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="22" font-weight="700" text-anchor="start">l0g / TRANSITION</text><text data-panel="transition-fl-en-matching-d-frame" x="960" y="42" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="end">07 / 07</text><text data-panel="transition-fl-en-matching-d-frame" x="40" y="94" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="32" font-weight="700" text-anchor="start">Match support to the constraint</text><text data-panel="transition-fl-en-matching-d-frame" x="40" y="145" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="start">Qualitative synthesis · renewable-energy finance</text><text data-panel="transition-fl-en-matching-d-frame" x="40" y="211" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="24" font-weight="700" text-anchor="start">Prepare</text><line x1="235" y1="203" x2="262" y2="203" stroke="var(--color-signal)" stroke-width="3"/><path d="M 253 197 L 262 203 L 253 209" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="transition-fl-en-matching-d-frame" x="280" y="211" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="24" font-weight="700" text-anchor="start">Isolate risk</text><line x1="475" y1="203" x2="502" y2="203" stroke="var(--color-signal)" stroke-width="3"/><path d="M 493 197 L 502 203 L 493 209" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="transition-fl-en-matching-d-frame" x="520" y="211" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="24" font-weight="700" text-anchor="start">Deploy</text><line x1="715" y1="203" x2="742" y2="203" stroke="var(--color-signal)" stroke-width="3"/><path d="M 733 197 L 742 203 L 733 209" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="transition-fl-en-matching-d-frame" x="760" y="211" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="24" font-weight="700" text-anchor="start">Reassess</text><path d="M 894 228 L 894 250 L 110 250 L 110 229" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="transition-fl-en-matching-d-frame" x="40" y="324" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="25" font-weight="700" text-anchor="start">Offshore wind</text><line x1="300" y1="316" x2="335" y2="316" stroke="var(--color-amber)" stroke-width="3"/><path d="M 326 310 L 335 316 L 326 322" fill="none" stroke="var(--color-amber)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="transition-fl-en-matching-d-frame" x="365" y="324" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="23" font-weight="400" text-anchor="start">Prepare projects, procurement, ports and grid</text><text data-panel="transition-fl-en-matching-d-frame" x="40" y="402" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="25" font-weight="700" text-anchor="start">Battery storage</text><line x1="300" y1="394" x2="335" y2="394" stroke="var(--color-amber)" stroke-width="3"/><path d="M 326 388 L 335 394 L 326 400" fill="none" stroke="var(--color-amber)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="transition-fl-en-matching-d-frame" x="365" y="402" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="23" font-weight="400" text-anchor="start">Establish revenues; target the risk</text><text data-panel="transition-fl-en-matching-d-frame" x="40" y="480" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="25" font-weight="700" text-anchor="start">Rooftop solar</text><line x1="300" y1="472" x2="335" y2="472" stroke="var(--color-amber)" stroke-width="3"/><path d="M 326 466 L 335 472 L 326 478" fill="none" stroke="var(--color-amber)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="transition-fl-en-matching-d-frame" x="365" y="480" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="23" font-weight="400" text-anchor="start">Aggregate and address customer risk</text><text data-panel="transition-fl-en-matching-d-frame" x="40" y="558" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="25" font-weight="700" text-anchor="start">Last-mile service</text><line x1="300" y1="550" x2="335" y2="550" stroke="var(--color-amber)" stroke-width="3"/><path d="M 326 544 L 335 550 L 326 556" fill="none" stroke="var(--color-amber)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="transition-fl-en-matching-d-frame" x="365" y="558" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="23" font-weight="400" text-anchor="start">Service subsidy if revenue is insufficient</text><text data-panel="transition-fl-en-matching-d-frame" x="40" y="621" fill="var(--color-amber)" font-family="l0g Transition First Loss" font-size="23" font-weight="700" text-anchor="start">Defined risk · minimum concession · tracked outcomes</text><line x1="40" y1="638" x2="960" y2="638" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="transition-fl-en-matching-d-frame" x="40" y="670" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="start">R01 · G01 | l0g synthesis</text></svg>
