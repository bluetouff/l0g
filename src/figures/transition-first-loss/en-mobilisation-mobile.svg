<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="transition-fl-en-mobilisation-m-title transition-fl-en-mobilisation-m-desc" viewBox="0 0 420 850" style="width:100%;height:auto" class="l0g-transition-first-loss-svg"><title id="transition-fl-en-mobilisation-m-title">Two mobilization ratios</title><desc id="transition-fl-en-mobilisation-m-desc">For Southeast Asian renewable-energy and battery deals excluding Singapore recorded by Convergence as of May 2026, one concessional dollar is associated with $1.40 of private capital. The broader ratio is $3.01 of commercial capital, including development institutions. The numerators differ and the second includes the first. They describe the funding structure. Additionality assessment requires a counterfactual and observed outcomes.</desc><rect id="transition-fl-en-mobilisation-m-frame" x="0" y="0" width="420" height="850" fill="var(--color-ink)"/><text data-panel="transition-fl-en-mobilisation-m-frame" x="22" y="35" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="17" font-weight="700" text-anchor="start">l0g / TRANSITION</text><text data-panel="transition-fl-en-mobilisation-m-frame" x="398" y="35" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="end">06 / 07</text><text data-panel="transition-fl-en-mobilisation-m-frame" x="22" y="76" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="25" font-weight="700" text-anchor="start">Two mobilization ratios</text><text data-panel="transition-fl-en-mobilisation-m-frame" x="22" y="117" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="start">Southeast Asia excluding Singapore ·</text><text data-panel="transition-fl-en-mobilisation-m-frame" x="22" y="140" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="start">May 2026</text><text data-panel="transition-fl-en-mobilisation-m-frame" x="28" y="210" fill="var(--color-amber)" font-family="l0g Transition First Loss" font-size="18" font-weight="700" text-anchor="start">Base: USD1 concessional</text><text data-panel="transition-fl-en-mobilisation-m-frame" x="28" y="266" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="20" font-weight="700" text-anchor="start">Private</text><text data-panel="transition-fl-en-mobilisation-m-frame" x="392" y="266" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="23" font-weight="700" text-anchor="end">1.40</text><rect data-metric="mobilisation-0" data-value="1.4" x="28" y="284" width="145.6" height="25" fill="var(--color-signal)"/><text data-panel="transition-fl-en-mobilisation-m-frame" x="28" y="377" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="20" font-weight="700" text-anchor="start">Broader commercial</text><text data-panel="transition-fl-en-mobilisation-m-frame" x="392" y="377" fill="var(--color-accent)" font-family="l0g Transition First Loss" font-size="23" font-weight="700" text-anchor="end">3.01</text><rect data-metric="mobilisation-1" data-value="3.01" x="28" y="395" width="313.04" height="25" fill="var(--color-accent)"/><text data-panel="transition-fl-en-mobilisation-m-frame" x="28" y="490" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="18" font-weight="400" text-anchor="start">Commercial total includes private capital.</text><text data-panel="transition-fl-en-mobilisation-m-frame" x="28" y="525" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="18" font-weight="400" text-anchor="start">54 deals · about $17.9bn total</text><text data-panel="transition-fl-en-mobilisation-m-frame" x="28" y="620" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="19" font-weight="700" text-anchor="start">Before: a no-support scenario</text><line x1="210" y1="633" x2="210" y2="652" stroke="var(--color-signal)" stroke-width="3"/><path d="M 204 643 L 210 652 L 216 643" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="transition-fl-en-mobilisation-m-frame" x="28" y="678" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="19" font-weight="700" text-anchor="start">Structure: minimum concession</text><line x1="210" y1="691" x2="210" y2="710" stroke="var(--color-signal)" stroke-width="3"/><path d="M 204 701 L 210 710 L 216 701" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="transition-fl-en-mobilisation-m-frame" x="28" y="736" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="19" font-weight="700" text-anchor="start">After: outcomes and withdrawal</text><line x1="22" y1="788" x2="398" y2="788" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="transition-fl-en-mobilisation-m-frame" x="22" y="820" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="start">R01 · G01 | Descriptive ratios</text></svg>
