<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="transition-fl-fr-discount-d-title transition-fl-fr-discount-d-desc" viewBox="0 0 1000 700" style="width:100%;height:auto" class="l0g-transition-first-loss-svg"><title id="transition-fl-fr-discount-d-title">Dix millions prêtés, deux valeurs</title><desc id="transition-fl-fr-discount-d-desc">Prêt fictif de 10 millions USD, coupon annuel de 2 %, principal remboursé à dix ans et actualisation conventionnelle à 7 %. Les coupons ont une valeur actuelle de 1,405 M$ ; le principal, de 5,083 M$. Le total calculé avant arrondi vaut 6,49 M$, soit un écart de 3,51 M$ aux fonds avancés. L’exemple laisse hors champ défaut, frais et fiscalité. Il illustre une concession de rémunération.</desc><rect id="transition-fl-fr-discount-d-frame" x="0" y="0" width="1000" height="700" fill="var(--color-ink)"/><text data-panel="transition-fl-fr-discount-d-frame" x="40" y="42" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="22" font-weight="700" text-anchor="start">l0g / TRANSITION</text><text data-panel="transition-fl-fr-discount-d-frame" x="960" y="42" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="end">03 / 07</text><text data-panel="transition-fl-fr-discount-d-frame" x="40" y="94" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="32" font-weight="700" text-anchor="start">Dix millions prêtés, deux valeurs</text><text data-panel="transition-fl-fr-discount-d-frame" x="40" y="145" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="start">Prêt fictif · coupon 2 % · dix ans · référence 7 %</text><text data-panel="transition-fl-fr-discount-d-frame" x="40" y="215" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="26" font-weight="700" text-anchor="start">Coupons : 0,2 M$ par an</text><rect data-metric="coupon-nominal-1" data