 First Loss" font-size="24" font-weight="400" text-anchor="start">1,405 M$</text><rect data-metric="loan-pv" data-value="6.488209" x="40" y="550" width="596.915249" height="30" fill="var(--color-signal)"/><rect data-metric="loan-gap" data-value="3.511791" x="636.915249" y="550" width="323.084751" height="30" fill="var(--color-accent)"/><text data-panel="transition-fl-fr-discount-d-frame" x="40" y="625" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="26" font-weight="700" text-anchor="start">6,49 M$ actualisés</text><text data-panel="transition-fl-fr-discount-d-frame" x="960" y="625" fill="var(--color-accent)" font-family="l0g Transition First Loss" font-size="26" font-weight="700" text-anchor="end">3,51 M$ de concession</text><line x1="40" y1="638" x2="960" y2="638" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="transition-fl-fr-discount-d-frame" x="40" y="670" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="start">G05 · G06 | Flux certains, hors frais</text></svg>
