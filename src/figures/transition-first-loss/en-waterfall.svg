<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="transition-fl-en-waterfall-d-title transition-fl-en-waterfall-d-desc" viewBox="0 0 1000 700" style="width:100%;height:auto" class="l0g-transition-first-loss-svg"><title id="transition-fl-en-waterfall-d-title">Seniority allocates the losses</title><desc id="transition-fl-en-waterfall-d-desc">Fictional example: $100 million of capital, comprising $10 million public, $20 million private equity and $70 million senior debt. For a fixed $25 million loss, structure A allocates $10 million to the public and $15 million to private equity; structure B allocates $5 million to the public and $20 million to private equity. Senior debt absorbs zero in both cases. Curves show structure A for total losses from zero to $100 million. No default probability is estimated.</desc><rect id="transition-fl-en-waterfall-d-frame" x="0" y="0" width="1000" height="700" fill="var(--color-ink)"/><text data-panel="transition-fl-en-waterfall-d-frame" x="40" y="42" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="22" font-weight="700" text-anchor="start">l0g / TRANSITION</text><text data-panel="transition-fl-en-waterfall-d-frame" x="960" y="42" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="end">02 / 07</text><text data-panel="transition-fl-en-waterfall-d-frame" x="40" y="94" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="32" font-weight="700" text-anchor="start">Seniority allocates the losses</text><text data-panel="transition-fl-en-waterfall-d-frame" x="40" y="145" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="start">Fictional example · $100m · fixed $25m loss</text><text data-panel="transition-fl-en-waterfall-d-frame" x="40" y="211" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="24" font-weight="700" text-anchor="start">Capital: 10 public / 20 private / 70 senior</text><text data-panel="transition-fl-en-waterfall-d-frame" x="40" y="280" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="25" font-weight="700" text-anchor="start">A · public first</text><rect data-metric="loss-a-0" data-value="10" x="40.0" y="305" width="156.0" height="30" fill="var(--color-accent)"/><rect data-metric="loss-a-1" data-value="15" x="196.0" y="305" width="234.0" height="30" fill="var(--color-amber)"/><text data-panel="transition-fl-en-waterfall-d-frame" x="40" y="374" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="start">Public 10 · private 15 · senior 0</text><text data-panel="transition-fl-en-waterfall-d-frame" x="40" y="425" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="25" font-weight="700" text-anchor="start">B · private first</text><rect data-metric="loss-b-0" data-value="20" x="40.0" y="450" width="312.0" height="30" fill="var(--color-amber)"/><rect data-metric="loss-b-1" data-value="5" x="352.0" y="450" width="78.0" height="30" fill="var(--color-accent)"/><text data-panel="transition-fl-en-waterfall-d-frame" x="40" y="519" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="start">Public 5 · private 20 · senior 0</text><text data-panel="transition-fl-en-waterfall-d-frame" x="565" y="260" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="24" font-weight="700" text-anchor="start">Waterfall A · $m</text><line x1="565" y1="510.0" x2="955" y2="510.0" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="transition-fl-en-waterfall-d-frame" x="555" y="516.0" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="end">0</text><line x1="565" y1="447.142857" x2="955" y2="447.142857" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="transition-fl-en-waterfall-d-frame" x="555" y="453.142857" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="end">20</text><line x1="565" y1="384.285714" x2="955" y2="384.285714" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="transition-fl-en-waterfall-d-frame" x="555" y="390.285714" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="end">40</text><line x1="565" y1="290.0" x2="955" y2="290.0" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="transition-fl-en-waterfall-d-frame" x="555" y="296.0" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="end">70</text><path d="M 565.0 510.0 L 604.0 478.571429 L 682.0 478.571429 L 955.0 478.571429" fill="none" stroke="var(--color-accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 565.0 510.0 L 604.0 510.0 L 682.0 447.142857 L 955.0 447.142857" fill="none" stroke="var(--color-amber)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 565.0 510.0 L 604.0 510.0 L 682.0 510.0 L 955.0 290.0" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="transition-fl-en-waterfall-d-frame" x="565.0" y="541" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="middle">0</text><text data-panel="transition-fl-en-waterfall-d-frame" x="760.0" y="541" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="middle">50</text><text data-panel="transition-fl-en-waterfall-d-frame" x="955.0" y="541" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="middle">100</text><text data-panel="transition-fl-en-waterfall-d-frame" x="955" y="575" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="end">Total loss ($m)</text><text data-panel="transition-fl-en-waterfall-d-frame" x="565" y="635" fill="var(--color-accent)" font-family="l0g Transition First Loss" font-size="22" font-weight="700" text-anchor="start">Public</text><text data-panel="transition-fl-en-waterfall-d-frame" x="698" y="635" fill="var(--color-amber)" font-family="l0g Transition First Loss" font-size="22" font-weight="700" text-anchor="start">Private</text><text data-panel="transition-fl-en-waterfall-d-frame" x="831" y="635" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="22" font-weight="700" text-anchor="start">Senior</text><line x1="40" y1="638" x2="960" y2="638" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="transition-fl-en-waterfall-d-frame" x="40" y="670" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="start">R01 · G02 | Fictional model</text></svg>
