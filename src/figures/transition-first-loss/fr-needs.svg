<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="transition-fl-fr-needs-d-title transition-fl-fr-needs-d-desc" viewBox="0 0 1000 700" style="width:100%;height:auto" class="l0g-transition-first-loss-svg"><title id="transition-fl-fr-needs-d-title">Le périmètre des 3,7 milliards</title><desc id="transition-fl-fr-needs-d-desc">Besoins estimés de financement public international, cumul 2026–2035, scénario APS : environ 0,1 milliard pour le solaire en toiture, plus de 0,2 pour les solutions décentralisées, 1,1 pour les batteries et près de 2,3 pour l’éolien en mer. Dollars 2025 aux taux de change de marché. Trois pays : Indonésie, Philippines et Viet Nam. Une partie seulement serait utilisée dans des structures mixtes.</desc><rect id="transition-fl-fr-needs-d-frame" x="0" y="0" width="1000" height="700" fill="var(--color-ink)"/><text data-panel="transition-fl-fr-needs-d-frame" x="40" y="42" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="22" font-weight="700" text-anchor="start">l0g / TRANSITION</text><text data-panel="transition-fl-fr-needs-d-frame" x="960" y="42" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="end">01 / 07</text><text data-panel="transition-fl-fr-needs-d-frame" x="40" y="94" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="32" font-weight="700" text-anchor="start">Le périmètre des 3,7 milliards</text><text data-panel="transition-fl-fr-needs-d-frame" x="40" y="145" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="start">Besoin projeté · APS · cumul 2026–2035</text><text data-panel="transition-fl-fr-needs-d-frame" x="40" y="215" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="42" font-weight="700" text-anchor="start">~ 3,7 Md$</text><text data-panel="transition-fl-fr-needs-d-frame" x="960" y="215" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="28" font-weight="700" text-anchor="end">2026 → 2035</text><text data-panel="transition-fl-fr-needs-d-frame" x="40" y="281" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="24" font-weight="700" text-anchor="start">Solaire en toiture</text><text data-panel="transition-fl-fr-needs-d-frame" x="960" y="281" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="23" font-weight="700" text-anchor="end">~ 0,1</text><rect data-metric="need-1" data-value="0.1" x="365" y="260" width="19.2" height="26" fill="var(--color-signal)"/><text data-panel="transition-fl-fr-needs-d-frame" x="40" y="353" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="24" font-weight="700" text-anchor="start">Décentralisé</text><text data-panel="transition-fl-fr-needs-d-frame" x="960" y="353" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="23" font-weight="700" text-anchor="end">&gt; 0,2</text><rect data-metric="need-2" data-value="0.2" x="365" y="332" width="38.4" height="26" fill="var(--color-signal)"/><line x1="406.4" y1="345" x2="423.4" y2="345" stroke="var(--color-signal)" stroke-width="3"/><path d="M 414.4 339 L 423.4 345 L 414.4 351" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="transition-fl-fr-needs-d-frame" x="40" y="425" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="24" font-weight="700" text-anchor="start">Batteries</text><text data-panel="transition-fl-fr-needs-d-frame" x="960" y="425" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="23" font-weight="700" text-anchor="end">~ 1,1</text><rect data-metric="need-3" data-value="1.1" x="365" y="404" width="211.2" height="26" fill="var(--color-signal)"/><text data-panel="transition-fl-fr-needs-d-frame" x="40" y="497" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="24" font-weight="700" text-anchor="start">Éolien en mer</text><text data-panel="transition-fl-fr-needs-d-frame" x="960" y="497" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="23" font-weight="700" text-anchor="end">près de 2,3</text><rect data-metric="need-4" data-value="2.3" x="365" y="476" width="441.6" height="26" fill="var(--color-signal)"/><line x1="365" y1="543" x2="845" y2="543" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="transition-fl-fr-needs-d-frame" x="365.0" y="573" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="middle">0</text><text data-panel="transition-fl-fr-needs-d-frame" x="557.0" y="573" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="middle">1</text><text data-panel="transition-fl-fr-needs-d-frame" x="749.0" y="573" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="middle">2</text><text data-panel="transition-fl-fr-needs-d-frame" x="960" y="573" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="end">Md USD 2025</text><text data-panel="transition-fl-fr-needs-d-frame" x="40" y="610" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="start">Indonésie · Philippines · Viet Nam | Dollars 2025 aux taux de marché</text><line x1="40" y1="638" x2="960" y2="638" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="transition-fl-fr-needs-d-frame" x="40" y="670" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="start">R01 | Besoin public estimé</text></svg>
