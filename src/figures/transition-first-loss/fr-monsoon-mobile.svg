<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="transition-fl-fr-monsoon-m-title transition-fl-fr-monsoon-m-desc" viewBox="0 0 420 850" style="width:100%;height:auto" class="l0g-transition-first-loss-svg"><title id="transition-fl-fr-monsoon-m-title">Monsoon : le don de 10 M$</title><desc id="transition-fl-fr-monsoon-m-desc">Montage signé annoncé par ADB le 1er mars 2023 pour le parc Monsoon de 600 MW au Laos, exportant au Viet Nam. Package de 692,55 millions USD : prêt A ADB 100, prêt B 150, prêts concessionnels 50, prêts parallèles 382,55, don 10. Le don alimente une réserve qui couvre une partie du service de dette senior lorsque la production ou livraison est soumise à une restriction extrême. Les montants décrivent le montage signé, pas des pertes réalisées ni les décaissements complets.</desc><rect id="transition-fl-fr-monsoon-m-frame" x="0" y="0" width="420" height="850" fill="var(--color-ink)"/><text data-panel="transition-fl-fr-monsoon-m-frame" x="22" y="35" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="17" font-weight="700" text-anchor="start">l0g / TRANSITION</text><text data-panel="transition-fl-fr-monsoon-m-frame" x="398" y="35" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="end">04 / 07</text><text data-panel="transition-fl-fr-monsoon-m-frame" x="22" y="76" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="25" font-weight="700" text-anchor="start">Monsoon : le don de 10 M$</text><text data-panel="transition-fl-fr-monsoon-m-frame" x="22" y="117" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="start">Laos → Viet Nam · 600 MW · signature</text><text data-panel="transition-fl-fr-monsoon-m-frame" x="22" y="140" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="start">2023</text><text data-panel="transition-fl-fr-monsoon-m-frame" x="28" y="211" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="29" font-weight="700" text-anchor="start">692,55 M$ signés</text><rect data-metric="monsoon-package-1" data-value="100" x="28.0" y="239" width="52.559382" height="24" fill="var(--color-signal)"/><rect data-metric="monsoon-package-2" data-value="150" x="80.559382" y="239" width="78.839073" height="24" fill="var(--color-amber)"/><rect data-metric="monsoon-package-3" data-value="50" x="159.398455" y="239" width="26.279691" height="24" fill="var(--color-accent)"/><rect data-metric="monsoon-package-4" data-value="382.55" x="185.678146" y="239" width="201.065916" height="24" fill="var(--color-muted)"/><rect data-metric="monsoon-package-5" data-value="10" x="386.744062" y="239" width="5.255938" height="24" fill="var(--color-signal)"/><text data-panel="transition-fl-fr-monsoon-m-frame" x="28" y="302" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="start">ADB A 100 · B 150 · concessionnels 50</text><text data-panel="transition-fl-fr-monsoon-m-frame" x="28" y="330" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="start">Parallèles 382,55 · don 10 M$</text><rect id="transition-fl-fr-monsoon-m-card-0" x="22" y="352" width="376" height="91" fill="var(--color-ink)"/><text data-panel="transition-fl-fr-monsoon-m-card-0" x="40" y="381" fill="var(--color-accent)" font-family="l0g Transition First Loss" font-size="20" font-weight="700" text-anchor="start">Restriction</text><text data-panel="transition-fl-fr-monsoon-m-card-0" x="40" y="413" fill="var(--color-accent)" font-family="l0g Transition First Loss" font-size="20" font-weight="700" text-anchor="start">Moins de recettes</text><line x1="210" y1="450" x2="210" y2="473" stroke="var(--color-signal)" stroke-width="3"/><path d="M 204 464 L 210 473 L 216 464" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect id="transition-fl-fr-monsoon-m-card-1" x="22" y="490" width="376" height="91" fill="var(--color-ink)"/><text data-panel="transition-fl-fr-monsoon-m-card-1" x="40" y="519" fill="var(--color-amber)" font-family="l0g Transition First Loss" font-size="20" font-weight="700" text-anchor="start">Réserve : don de 10 M$</text><text data-panel="transition-fl-fr-monsoon-m-card-1" x="40" y="551" fill="var(--color-amber)" font-family="l0g Transition First Loss" font-size="20" font-weight="700" text-anchor="start">Risque ciblé</text><line x1="210" y1="588" x2="210" y2="611" stroke="var(--color-signal)" stroke-width="3"/><path d="M 204 602 L 210 611 L 216 602" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect id="transition-fl-fr-monsoon-m-card-2" x="22" y="628" width="376" height="91" fill="var(--color-ink)"/><text data-panel="transition-fl-fr-monsoon-m-card-2" x="40" y="657" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="20" font-weight="700" text-anchor="start">Une part de la dette senior</text><text data-panel="transition-fl-fr-monsoon-m-card-2" x="40" y="689" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="20" font-weight="700" text-anchor="start">Paiements soutenus</text><line x1="22" y1="788" x2="398" y2="788" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="transition-fl-fr-monsoon-m-frame" x="22" y="820" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="start">C01 · C11 | ADB · 2023</text></svg>
