<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="transition-fl-fr-matching-d-title transition-fl-fr-matching-d-desc" viewBox="0 0 1000 700" style="width:100%;height:auto" class="l0g-transition-first-loss-svg"><title id="transition-fl-fr-matching-d-title">Choisir l’aide selon le blocage</title><desc id="transition-fl-fr-matching-d-desc">Carte analytique du cycle d’un projet : préparer règles et revenus, tester le risque finançable, boucler le financement, construire et exploiter, puis réexaminer le soutien. L’éolien en mer des Philippines et du Viet Nam demande de la préparation, des cadres d’achat et des infrastructures. Les batteries nécessitent des revenus crédibles. Le solaire en toiture peut bénéficier d’agrégation et de protection ciblée du risque client. Les dernières dessertes isolées peuvent exiger une subvention de service durable. Le choix dépend du contrat, de l’additionnalité et du minimum de concession.</desc><rect id="transition-fl-fr-matching-d-frame" x="0" y="0" width="1000" height="700" fill="var(--color-ink)"/><text data-panel="transition-fl-fr-matching-d-frame" x="40" y="42" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="22" font-weight="700" text-anchor="start">l0g / TRANSITION</text><text data-panel="transition-fl-fr-matching-d-frame" x="960" y="42" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="end">07 / 07</text><text data-panel="transition-fl-fr-matching-d-frame" x="40" y="94" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="32" font-weight="700" text-anchor="start">Choisir l’aide selon le blocage</text><text data-panel="transition-fl-fr-matching-d-frame" x="40" y="145" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="start">Synthèse qualitative · financement des renouvelables</text><text data-panel="transition-fl-fr-matching-d-frame" x="40" y="211" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="24" font-weight="700" text-anchor="start">Préparer</text><line x1="235" y1="203" x2="262" y2="203" stroke="var(--color-signal)" stroke-width="3"/><path d="M 253 197 L 262 203 L 253 209" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="transition-fl-fr-matching-d-frame" x="280" y="211" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="24" font-weight="700" text-anchor="start">Isoler</text><line x1="475" y1="203" x2="502" y2="203" stroke="var(--color-signal)" stroke-width="3"/><path d="M 493 197 L 502 203 L 493 209" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="transition-fl-fr-matching-d-frame" x="520" y="211" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="24" font-weight="700" text-anchor="start">Déployer</text><line x1="715" y1="203" x2="742" y2="203" stroke="var(--color-signal)" stroke-width="3"/><path d="M 733 197 L 742 203 L 733 209" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="transition-fl-fr-matching-d-frame" x="760" y="211" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="24" font-weight="700" text-anchor="start">Réexaminer</text><path d="M 894 228 L 894 250 L 110 250 L 110 229" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="transition-fl-fr-matching-d-frame" x="40" y="324" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="25" font-weight="700" text-anchor="start">Éolien en mer</text><line x1="300" y1="316" x2="335" y2="316" stroke="var(--color-amber)" stroke-width="3"/><path d="M 326 310 L 335 316 L 326 322" fill="none" stroke="var(--color-amber)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="transition-fl-fr-matching-d-frame" x="365" y="324" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="23" font-weight="400" text-anchor="start">Préparer projets, achats, ports et réseau</text><text data-panel="transition-fl-fr-matching-d-frame" x="40" y="402" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="25" font-weight="700" text-anchor="start">Batteries</text><line x1="300" y1="394" x2="335" y2="394" stroke="var(--color-amber)" stroke-width="3"/><path d="M 326 388 L 335 394 L 326 400" fill="none" stroke="var(--color-amber)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="transition-fl-fr-matching-d-frame" x="365" y="402" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="23" font-weight="400" text-anchor="start">Établir les revenus ; cibler le risque</text><text data-panel="transition-fl-fr-matching-d-frame" x="40" y="480" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="25" font-weight="700" text-anchor="start">Solaire en toiture</text><line x1="300" y1="472" x2="335" y2="472" stroke="var(--color-amber)" stroke-width="3"/><path d="M 326 466 L 335 472 L 326 478" fill="none" stroke="var(--color-amber)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="transition-fl-fr-matching-d-frame" x="365" y="480" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="23" font-weight="400" text-anchor="start">Agréger et traiter le risque client</text><text data-panel="transition-fl-fr-matching-d-frame" x="40" y="558" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="25" font-weight="700" text-anchor="start">Accès isolé</text><line x1="300" y1="550" x2="335" y2="550" stroke="var(--color-amber)" stroke-width="3"/><path d="M 326 544 L 335 550 L 326 556" fill="none" stroke="var(--color-amber)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="transition-fl-fr-matching-d-frame" x="365" y="558" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="23" font-weight="400" text-anchor="start">Subvention de service si recettes insuffisantes</text><text data-panel="transition-fl-fr-matching-d-frame" x="40" y="621" fill="var(--color-amber)" font-family="l0g Transition First Loss" font-size="23" font-weight="700" text-anchor="start">Risque défini · concession minimale · résultats suivis</text><line x1="40" y1="638" x2="960" y2="638" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="transition-fl-fr-matching-d-frame" x="40" y="670" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="start">R01 · G01 | Synthèse l0g</text></svg>
