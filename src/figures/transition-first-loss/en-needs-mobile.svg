<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="transition-fl-en-needs-m-title transition-fl-en-needs-m-desc" viewBox="0 0 420 850" style="width:100%;height:auto" class="l0g-transition-first-loss-svg"><title id="transition-fl-en-needs-m-title">$3.7 billion over ten years</title><desc id="transition-fl-en-needs-m-desc">Estimated international public finance needs, cumulative 2026–2035, APS: around $0.1 billion for rooftop solar, over $0.2 billion for decentralized solutions, $1.1 billion for batteries and nearly $2.3 billion for offshore wind. 2025 dollars at market exchange rates. Three countries: Indonesia, Philippines and Viet Nam. Only part would be used in blended structures.</desc><rect id="transition-fl-en-needs-m-frame" x="0" y="0" width="420" height="850" fill="var(--color-ink)"/><text data-panel="transition-fl-en-needs-m-frame" x="22" y="35" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="17" font-weight="700" text-anchor="start">l0g / TRANSITION</text><text data-panel="transition-fl-en-needs-m-frame" x="398" y="35" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="end">01 / 07</text><text data-panel="transition-fl-en-needs-m-frame" x="22" y="76" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="25" font-weight="700" text-anchor="start">$3.7 billion over ten</text><text data-panel="transition-fl-en-needs-m-frame" x="22" y="108" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="25" font-weight="700" text-anchor="start">years</text><text data-panel="transition-fl-en-needs-m-frame" x="22" y="149" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="start">Projected need · APS · cumulative</text><text data-panel="transition-fl-en-needs-m-frame" x="22" y="172" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="start">2026–2035</text><text data-panel="transition-fl-en-needs-m-frame" x="28" y="211" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="32" font-weight="700" text-anchor="start">~ $3.7bn</text><text data-panel="transition-fl-en-needs-m-frame" x="392" y="211" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="20" font-weight="700" text-anchor="end">2026 → 2035</text><text data-panel="transition-fl-en-needs-m-frame" x="28" y="245" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="19" font-weight="700" text-anchor="start">Rooftop solar</text><text data-panel="transition-fl-en-needs-m-frame" x="392" y="245" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="21" font-weight="700" text-anchor="end">~ 0.1</text><rect data-metric="need-1" data-value="0.1" x="28" y="260" width="14.56" height="18" fill="var(--color-signal)"/><text data-panel="transition-fl-en-needs-m-frame" x="28" y="333" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="19" font-weight="700" text-anchor="start">Decentralized</text><text data-panel="transition-fl-en-needs-m-frame" x="392" y="333" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="21" font-weight="700" text-anchor="end">&gt; 0.2</text><rect data-metric="need-2" data-value="0.2" x="28" y="348" width="29.12" height="18" fill="var(--color-signal)"/><line x1="60.12" y1="357" x2="77.12" y2="357" stroke="var(--color-signal)" stroke-width="3"/><path d="M 68.12 351 L 77.12 357 L 68.12 363" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="transition-fl-en-needs-m-frame" x="28" y="421" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="19" font-weight="700" text-anchor="start">Battery storage</text><text data-panel="transition-fl-en-needs-m-frame" x="392" y="421" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="21" font-weight="700" text-anchor="end">~ 1.1</text><rect data-metric="need-3" data-value="1.1" x="28" y="436" width="160.16" height="18" fill="var(--color-signal)"/><text data-panel="transition-fl-en-needs-m-frame" x="28" y="509" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="19" font-weight="700" text-anchor="start">Offshore wind</text><text data-panel="transition-fl-en-needs-m-frame" x="392" y="509" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="21" font-weight="700" text-anchor="end">nearly 2.3</text><rect data-metric="need-4" data-value="2.3" x="28" y="524" width="334.88" height="18" fill="var(--color-signal)"/><line x1="28" y1="590" x2="392" y2="590" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="transition-fl-en-needs-m-frame" x="28.0" y="620" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="middle">0</text><text data-panel="transition-fl-en-needs-m-frame" x="173.6" y="620" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="middle">1</text><text data-panel="transition-fl-en-needs-m-frame" x="319.2" y="620" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="middle">2</text><text data-panel="transition-fl-en-needs-m-frame" x="392" y="650" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="end">USD bn, 2025</text><text data-panel="transition-fl-en-needs-m-frame" x="28" y="680" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="18" font-weight="400" text-anchor="start">Indonesia · Philippines · Viet Nam</text><text data-panel="transition-fl-en-needs-m-frame" x="28" y="715" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="18" font-weight="400" text-anchor="start">Assumes announced pledges are met</text><text data-panel="transition-fl-en-needs-m-frame" x="28" y="750" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="18" font-weight="400" text-anchor="start">Only part uses blended structures.</text><line x1="22" y1="788" x2="398" y2="788" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="transition-fl-en-needs-m-frame" x="22" y="820" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="start">R01 | Estimated public finance need</text></svg>
