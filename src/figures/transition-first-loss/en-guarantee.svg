<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="transition-fl-en-guarantee-d-title transition-fl-en-guarantee-d-desc" viewBox="0 0 1000 700" style="width:100%;height:auto" class="l0g-transition-first-loss-svg"><title id="transition-fl-en-guarantee-d-title">Verdant: a guarantee backs the bonds</title><desc id="transition-fl-en-guarantee-d-desc">GuarantCo announced a VND 792 billion guarantee programme over fifteen years in two phases. Initially rated issues total VND 390 billion. Bondholders finance Verdant issuers, which finance solar assets. On a covered payment default, the guarantor pays according to its undertaking. FiinRatings assigns issuers BB+ and guaranteed bonds AAA on the Vietnamese national scale. Guaranteed face value is a contingent commitment; the page does not confirm full programme disbursement.</desc><rect id="transition-fl-en-guarantee-d-frame" x="0" y="0" width="1000" height="700" fill="var(--color-ink)"/><text data-panel="transition-fl-en-guarantee-d-frame" x="40" y="42" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="22" font-weight="700" text-anchor="start">l0g / TRANSITION</text><text data-panel="transition-fl-en-guarantee-d-frame" x="960" y="42" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="end">05 / 07</text><text data-panel="transition-fl-en-guarantee-d-frame" x="40" y="94" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="32" font-weight="700" text-anchor="start">Verdant: a guarantee backs the bonds</text><text data-panel="transition-fl-en-guarantee-d-frame" x="40" y="145" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="start">Viet Nam · local-currency debt · 2026</text><text data-panel="transition-fl-en-guarantee-d-frame" x="40" y="215" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="34" font-weight="700" text-anchor="start">VND792bn · 15 years</text><text data-panel="transition-fl-en-guarantee-d-frame" x="960" y="215" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="24" font-weight="400" text-anchor="end">VND390bn initially rated</text><rect id="transition-fl-en-guarantee-d-card-flow-0" x="33" y="265" width="284" height="130" fill="var(--color-ink)"/><text data-panel="transition-fl-en-guarantee-d-card-flow-0" x="50" y="306" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="22" font-weight="700" text-anchor="start">Bondholders</text><text data-panel="transition-fl-en-guarantee-d-card-flow-0" x="50" y="346" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="22" font-weight="700" text-anchor="start">Provide the capital</text><line x1="327" y1="332" x2="351" y2="332" stroke="var(--color-signal)" stroke-width="3"/><path d="M 342 326 L 351 332 L 342 338" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect id="transition-fl-en-guarantee-d-card-flow-1" x="358" y="265" width="284" height="130" fill="var(--color-ink)"/><text data-panel="transition-fl-en-guarantee-d-card-flow-1" x="375" y="306" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="22" font-weight="700" text-anchor="start">Verdant issuers</text><text data-panel="transition-fl-en-guarantee-d-card-flow-1" x="375" y="346" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="22" font-weight="700" text-anchor="start">Issue the debt</text><line x1="652" y1="332" x2="676" y2="332" stroke="var(--color-signal)" stroke-width="3"/><path d="M 667 326 L 676 332 L 667 338" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect id="transition-fl-en-guarantee-d-card-flow-2" x="683" y="265" width="284" height="130" fill="var(--color-ink)"/><text data-panel="transition-fl-en-guarantee-d-card-flow-2" x="700" y="306" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="22" font-weight="700" text-anchor="start">Solar assets</text><text data-panel="transition-fl-en-guarantee-d-card-flow-2" x="700" y="346" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="22" font-weight="700" text-anchor="start">Generate revenue</text><text data-panel="transition-fl-en-guarantee-d-frame" x="40" y="461" fill="var(--color-amber)" font-family="l0g Transition First Loss" font-size="29" font-weight="700" text-anchor="start">GuarantCo</text><text data-panel="transition-fl-en-guarantee-d-frame" x="960" y="461" fill="var(--color-amber)" font-family="l0g Transition First Loss" font-size="23" font-weight="400" text-anchor="end">Payment to bondholders on a covered default</text><line x1="160" y1="431" x2="160" y2="407" stroke="var(--color-amber)" stroke-width="3"/><path d="M 154 416 L 160 407 L 166 416" fill="none" stroke="var(--color-amber)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="transition-fl-en-guarantee-d-frame" x="40" y="549" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="29" font-weight="700" text-anchor="start">BB+ issuers</text><text data-panel="transition-fl-en-guarantee-d-frame" x="960" y="549" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="29" font-weight="700" text-anchor="end">AAA guaranteed bonds</text><text data-panel="transition-fl-en-guarantee-d-frame" x="40" y="604" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="start">Vietnamese national scale · guarantee pricing and recourse to document</text><line x1="40" y1="638" x2="960" y2="638" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="transition-fl-en-guarantee-d-frame" x="40" y="670" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="start">C06 · C07 · C08 · C09 | VND</text></svg>
