<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="transition-fl-fr-monsoon-d-title transition-fl-fr-monsoon-d-desc" viewBox="0 0 1000 700" style="width:100%;height:auto" class="l0g-transition-first-loss-svg"><title id="transition-fl-fr-monsoon-d-title">Monsoon : un don protège le service de dette</title><desc id="transition-fl-fr-monsoon-d-desc">Montage signé annoncé par ADB le 1er mars 2023 pour le parc Monsoon de 600 MW au Laos, exportant au Viet Nam. Package de 692,55 millions USD : prêt A ADB 100, prêt B 150, prêts concessionnels 50, prêts parallèles 382,55, don 10. Le don alimente une réserve qui couvre une partie du service de dette senior lorsque la production ou livraison est soumise à une restriction extrême. Les montants décrivent le montage signé, pas des pertes réalisées ni les décaissements complets.</desc><rect id="transition-fl-fr-monsoon-d-frame" x="0" y="0" width="1000" height="700" fill="var(--color-ink)"/><text data-panel="transition-fl-fr-monsoon-d-frame" x="40" y="42" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="22" font-weight="700" text-anchor="start">l0g / TRANSITION</text><text data-panel="transition-fl-fr-monsoon-d-frame" x="960" y="42" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="end">04 / 07</text><text data-panel="transition-fl-fr-monsoon-d-frame" x="40" y="94" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="32" font-weight="700" text-anchor="start">Monsoon : un don protège le service de dette</text><text data-panel="transition-fl-fr-monsoon-d-frame" x="40" y="145" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="start">Laos → Viet Nam · 600 MW · signature 2023</text><text data-panel="transition-fl-fr-monsoon-d-frame" x="40" y="211" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="36" font-weight="700" text-anchor="start">692,55 M$ signés</text><rect data-metric="monsoon-package-1" data-value="100" x="40.0" y="239" width="132.842394" height="24" fill="var(--color-signal)"/><rect data-metric="monsoon-package-2" data-value="150" x="172.842394" y="239" width="199.263591" height="24" fill="var(--color-amber)"/><rect data-metric="monsoon-package-3" data-value="50" x="372.105985" y="239" width="66.421197" height="24" fill="var(--color-accent)"/><rect data-metric="monsoon-package-4" data-value="382.55" x="438.527182" y="239" width="508.188578" height="24" fill="var(--color-muted)"/><rect data-metric="monsoon-package-5" data-value="10" x="946.715761" y="239" width="13.284239" height="24" fill="var(--color-signal)"/><text data-panel="transition-fl-fr-monsoon-d-frame" x="40" y="307" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="start">Prêt A 100 · prêt B 150 · concessionnels 50 · parallèles 382,55 · don 10 M$</text><rect id="transition-fl-fr-monsoon-d-card-0" x="33" y="370" width="284" height="143" fill="var(--color-ink)"/><text data-panel="transition-fl-fr-monsoon-d-card-0" x="50" y="414" fill="var(--color-accent)" font-family="l0g Transition First Loss" font-size="22" font-weight="700" text-anchor="start">Restriction</text><text data-panel="transition-fl-fr-monsoon-d-card-0" x="50" y="457" fill="var(--color-accent)" font-family="l0g Transition First Loss" font-size="22" font-weight="700" text-anchor="start">→ recettes réduites</text><line x1="327" y1="442" x2="351" y2="442" stroke="var(--color-signal)" stroke-width="3"/><path d="M 342 436 L 351 442 L 342 448" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect id="transition-fl-fr-monsoon-d-card-1" x="358" y="370" width="284" height="143" fill="var(--color-ink)"/><text data-panel="transition-fl-fr-monsoon-d-card-1" x="375" y="414" fill="var(--color-amber)" font-family="l0g Transition First Loss" font-size="22" font-weight="700" text-anchor="start">Réserve de 10 M$</text><text data-panel="transition-fl-fr-monsoon-d-card-1" x="375" y="457" fill="var(--color-amber)" font-family="l0g Transition First Loss" font-size="22" font-weight="700" text-anchor="start">financée par le don</text><line x1="652" y1="442" x2="676" y2="442" stroke="var(--color-signal)" stroke-width="3"/><path d="M 667 436 L 676 442 L 667 448" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect id="transition-fl-fr-monsoon-d-card-2" x="683" y="370" width="284" height="143" fill="var(--color-ink)"/><text data-panel="transition-fl-fr-monsoon-d-card-2" x="700" y="414" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="22" font-weight="700" text-anchor="start">Service de dette</text><text data-panel="transition-fl-fr-monsoon-d-card-2" x="700" y="457" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="22" font-weight="700" text-anchor="start">senior soutenu</text><text data-panel="transition-fl-fr-monsoon-d-frame" x="40" y="589" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="23" font-weight="400" text-anchor="start">Un risque de restriction couvert, dans les limites contractuelles.</text><text data-panel="transition-fl-fr-monsoon-d-frame" x="40" y="625" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="23" font-weight="400" text-anchor="start">Signature du financement ; décaissement intégral à établir.</text><line x1="40" y1="638" x2="960" y2="638" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="transition-fl-fr-monsoon-d-frame" x="40" y="670" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="start">C01 · C11 | ADB · 2023</text></svg>
