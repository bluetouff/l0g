<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="transition-fl-fr-mobilisation-m-title transition-fl-fr-mobilisation-m-desc" viewBox="0 0 420 850" style="width:100%;height:auto" class="l0g-transition-first-loss-svg"><title id="transition-fl-fr-mobilisation-m-title">Deux ratios de mobilisation</title><desc id="transition-fl-fr-mobilisation-m-desc">Dans les opérations renouvelables et batteries d’Asie du Sud-Est hors Singapour recensées par Convergence à mai 2026, un dollar concessionnel est associé à 1,40 dollar privé. Le ratio élargi est 3,01 dollars commerciaux, y compris ceux des institutions de développement. Les deux numérateurs sont distincts et le second inclut le premier. Ils décrivent la structure financière. Le suivi de l’additionnalité demande un scénario sans intervention et des résultats observés.</desc><rect id="transition-fl-fr-mobilisation-m-frame" x="0" y="0" width="420" height="850" fill="var(--color-ink)"/><text data-panel="transition-fl-fr-mobilisation-m-frame" x="22" y="35" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="17" font-weight="700" text-anchor="start">l0g / TRANSITION</text><text data-panel="transition-fl-fr-mobilisation-m-frame" x="398" y="35" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="end">06 / 07</text><text data-panel="transition-fl-fr-mobilisation-m-frame" x="22" y="76" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="25" font-weight="700" text-anchor="start">Deux ratios de</text><text data-panel="transition-fl-fr-mobilisation-m-frame" x="22" y="108" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="25" font-weight="700" text-anchor="start">mobilisation</text><text data-panel="transition-fl-fr-mobilisation-m-frame" x="22" y="149" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="start">Asie du Sud-Est hors Singapour · mai</text><text data-panel="transition-fl-fr-mobilisation-m-frame" x="22" y="172" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="start">2026</text><text data-panel="transition-fl-fr-mobilisation-m-frame" x="28" y="210" fill="var(--color-amber)" font-family="l0g Transition First Loss" font-size="18" font-weight="700" text-anchor="start">Base : 1 USD concessionnel</text><text data-panel="transition-fl-fr-mobilisation-m-frame" x="28" y="266" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="20" font-weight="700" text-anchor="start">Privé</text><text data-panel="transition-fl-fr-mobilisation-m-frame" x="392" y="266" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="23" font-weight="700" text-anchor="end">1,40</text><rect data-metric="mobilisation-0" data-value="1.4" x="28" y="284" width="145.6" height="25" fill="var(--color-signal)"/><text data-panel="transition-fl-fr-mobilisation-m-frame" x="28" y="377" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="20" font-weight="700" text-anchor="start">Commercial élargi</text><text data-panel="transition-fl-fr-mobilisation-m-frame" x="392" y="377" fill="var(--color-accent)" font-family="l0g Transition First Loss" font-size="23" font-weight="700" text-anchor="end">3,01</text><rect data-metric="mobilisation-1" data-value="3.01" x="28" y="395" width="313.04" height="25" fill="var(--color-accent)"/><text data-panel="transition-fl-fr-mobilisation-m-frame" x="28" y="490" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="18" font-weight="400" text-anchor="start">Le total commercial inclut le privé.</text><text data-panel="transition-fl-fr-mobilisation-m-frame" x="28" y="525" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="18" font-weight="400" text-anchor="start">54 opérations · environ 17,9 Md$</text><text data-panel="transition-fl-fr-mobilisation-m-frame" x="28" y="620" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="19" font-weight="700" text-anchor="start">Avant : scénario sans aide</text><line x1="210" y1="633" x2="210" y2="652" stroke="var(--color-signal)" stroke-width="3"/><path d="M 204 643 L 210 652 L 216 643" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="transition-fl-fr-mobilisation-m-frame" x="28" y="678" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="19" font-weight="700" text-anchor="start">Montage : concession minimale</text><line x1="210" y1="691" x2="210" y2="710" stroke="var(--color-signal)" stroke-width="3"/><path d="M 204 701 L 210 710 L 216 701" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="transition-fl-fr-mobilisation-m-frame" x="28" y="736" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="19" font-weight="700" text-anchor="start">Après : résultats et retrait</text><line x1="22" y1="788" x2="398" y2="788" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="transition-fl-fr-mobilisation-m-frame" x="22" y="820" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="start">R01 · G01 | Ratios descriptifs</text></svg>
