<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="transition-fl-en-discount-m-title transition-fl-en-discount-m-desc" viewBox="0 0 420 850" style="width:100%;height:auto" class="l0g-transition-first-loss-svg"><title id="transition-fl-en-discount-m-title">The price of time</title><desc id="transition-fl-en-discount-m-desc">Fictional $10 million loan, 2% annual coupon, principal repaid at year ten and a conventional 7% discount rate. Coupons have a present value of $1.405m; principal has a present value of $5.083m. The total calculated before rounding is $6.49m, a $3.51m gap to the funds advanced. The example excludes default, fees and tax. It illustrates a pricing concession.</desc><rect id="transition-fl-en-discount-m-frame" x="0" y="0" width="420" height="850" fill="var(--color-ink)"/><text data-panel="transition-fl-en-discount-m-frame" x="22" y="35" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="17" font-weight="700" text-anchor="start">l0g / TRANSITION</text><text data-panel="transition-fl-en-discount-m-frame" x="398" y="35" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="end">03 / 07</text><text data-panel="transition-fl-en-discount-m-frame" x="22" y="76" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="25" font-weight="700" text-anchor="start">The price of time</text><text data-panel="transition-fl-en-discount-m-frame" x="22" y="117" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="start">Fictional loan · 2% coupon · ten</text><text data-panel="transition-fl-en-discount-m-frame" x="22" y="140" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="start">years · 7% reference</text><text data-panel="transition-fl-en-discount-m-frame" x="28" y="216" fill="var(--color-paper)" font-family="l0g Transition Firs