81.0" y="266" width="25.5" height="125" fill="var(--color-muted)"/><rect data-metric="coupon-pv-5" data-value="0.142597" x="181.0" y="301.876728" width="25.5" height="89.123272" fill="var(--color-signal)"/><text data-panel="transition-fl-en-discount-m-frame" x="193.75" y="419" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="middle">5</text><rect data-metric="coupon-nominal-6" data-value="0.2" x="214.5" y="266" width="25.5" height="125" fill="var(--color-muted)"/><rect data-metric="coupon-pv-6" data-value="0.133268" x="214.5" y="307.707222" width="25.5" height="83.292778" fill="var(--color-signal)"/><text data-panel="transition-fl-en-discount-m-frame" x="227.25" y="419" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="middle">6</text><rect data-metric="coupon-nominal-7" data-value="0.2" x="248.0" y="266" width="25.5" height="125" fill="var(--color-muted)"/><rect data-metric="coupon-pv-7" data-value="0.12455" x="248.0" y="313.156282" width="25.5" height="77.843718" fill="var(--color-signal)"/><text data-panel="transition-fl-en-discount-m-frame" x="260.75" y="419" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="middle">7</text><rect data-metric="coupon-nominal-8" data-value="0.2" x="281.5" y="266" width="25.5" height="125" fill="var(--color-muted)"/><rect data-metric="coupon-pv-8" data-value="0.116402" x="281.5" y="318.248862" width="25.5" height="72.751138" fill="var(--color-signal)"/><text data-panel="transition-fl-en-discount-m-frame" x="294.25" y="419" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="middle">8</text><rect data-metric="coupon-nominal-9" data-value="0.2" x="315.0" y="266" width="25.5" height="125" fill="var(--color-muted)"/><rect data-metric="coupon-pv-9" data-value="0.108787" x="315.0" y="323.008282" width="25.5" height="67.991718" fill="var(--color-signal)"/><text data-panel="transition-fl-en-discount-m-frame" x="327.75" y="419" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="middle">9</text><rect data-metric="coupon-nominal-10" data-value="0.2" x="348.5" y="266" width="25.5" height="125" fill="var(--color-muted)"/><rect data-metric="coupon-pv-10" data-value="0.10167" x="348.5" y="327.456338" width="25.5" height="63.543662" fill="var(--color-signal)"/><text data-panel="transition-fl-en-discount-m-frame" x="361.25" y="419" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="middle">10</text><text data-panel="transition-fl-en-discount-m-frame" x="382" y="445" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="end">Payment year</text><text data-panel="transition-fl-en-discount-m-frame" x="28" y="465" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="start">Grey: nominal · green: present value</text><text data-panel="transition-fl-en-discount-m-frame" x="28" y="498" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="21" font-weight="700" text-anchor="start">Principal in year 10</text><text data-panel="transition-fl-en-discount-m-frame" x="28" y="540" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="23" font-weight="700" text-anchor="start">$10.000m → $5.083m</text><rect data-metric="loan-pv" data-value="6.488209" x="28" y="598" width="236.170816" height="30" fill="var(--color-signal)"/><rect data-metric="loan-gap" data-value="3.511791" x="264.170816" y="598" width="127.829184" height="30" fill="var(--color-accent)"/><text data-panel="transition-fl-en-discount-m-frame" x="28" y="673" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="20" font-weight="700" text-anchor="start">$6.49m present value</text><text data-panel="transition-fl-en-discount-m-frame" x="392" y="712" fill="var(--color-accent)" font-family="l0g Transition First Loss" font-size="20" font-weight="700" text-anchor="end">$3.51m concession</text><text data-panel="transition-fl-en-discount-m-frame" x="28" y="753" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="start">Coupon present value: $1.405m</text><line x1="22" y1="788" x2="398" y2="788" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="transition-fl-en-discount-m-frame" x="22" y="820" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="17" font-weight="400" text-anchor="start">G05 · G06 | Certain cash flows, no fees</text></svg>
