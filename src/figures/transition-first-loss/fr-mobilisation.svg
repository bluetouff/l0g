<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="transition-fl-fr-mobilisation-d-title transition-fl-fr-mobilisation-d-desc" viewBox="0 0 1000 700" style="width:100%;height:auto" class="l0g-transition-first-loss-svg"><title id="transition-fl-fr-mobilisation-d-title">Les deux périmètres du capital mobilisé</title><desc id="transition-fl-fr-mobilisation-d-desc">Dans les opérations renouvelables et batteries d’Asie du Sud-Est hors Singapour recensées par Convergence à mai 2026, un dollar concessionnel est associé à 1,40 dollar privé. Le ratio élargi est 3,01 dollars commerciaux, y compris ceux des institutions de développement. Les deux numérateurs sont distincts et le second inclut le premier. Ils décrivent la structure financière. Le suivi de l’additionnalité demande un scénario sans intervention et des résultats observés.</desc><rect id="transition-fl-fr-mobilisation-d-frame" x="0" y="0" width="1000" height="700" fill="var(--color-ink)"/><text data-panel="transition-fl-fr-mobilisation-d-frame" x="40" y="42" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="22" font-weight="700" text-anchor="start">l0g / TRANSITION</text><text data-panel="transition-fl-fr-mobilisation-d-frame" x="960" y="42" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="end">06 / 07</text><text data-panel="transition-fl-fr-mobilisation-d-frame" x="40" y="94" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="32" font-weight="700" text-anchor="start">Les deux périmètres du capital mobilisé</text><text data-panel="transition-fl-fr-mobilisation-d-frame" x="40" y="145" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="start">Asie du Sud-Est hors Singapour · mai 2026</text><text data-panel="transition-fl-fr-mobilisation-d-frame" x="40" y="210" fill="var(--color-amber)" font-family="l0g Transition First Loss" font-size="25" font-weight="700" text-anchor="start">Base : 1 USD concessionnel</text><text data-panel="transition-fl-fr-mobilisation-d-frame" x="40" y="290" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="25" font-weight="700" text-anchor="start">Privé</text><text data-panel="transition-fl-fr-mobilisation-d-frame" x="960" y="290" fill="var(--color-signal)" font-family="l0g Transition First Loss" font-size="25" font-weight="700" text-anchor="end">1,40</text><rect data-metric="mobilisation-0" data-value="1.4" x="365" y="266" width="216.0" height="25" fill="var(--color-signal)"/><text data-panel="transition-fl-fr-mobilisation-d-frame" x="40" y="386" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="25" font-weight="700" text-anchor="start">Commercial élargi</text><text data-panel="transition-fl-fr-mobilisation-d-frame" x="960" y="386" fill="var(--color-accent)" font-family="l0g Transition First Loss" font-size="25" font-weight="700" text-anchor="end">3,01</text><rect data-metric="mobilisation-1" data-value="3.01" x="365" y="362" width="464.4" height="25" fill="var(--color-accent)"/><text data-panel="transition-fl-fr-mobilisation-d-frame" x="40" y="486" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="start">Le total commercial inclut le privé et les institutions aux conditions de marché.</text><text data-panel="transition-fl-fr-mobilisation-d-frame" x="40" y="521" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="start">54 opérations · environ 17,9 Md$ de financement total</text><text data-panel="transition-fl-fr-mobilisation-d-frame" x="40" y="602" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="24" font-weight="700" text-anchor="start">Avant : sans aide</text><line x1="300" y1="594" x2="342" y2="594" stroke="var(--color-signal)" stroke-width="3"/><path d="M 333 588 L 342 594 L 333 600" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="transition-fl-fr-mobilisation-d-frame" x="365" y="602" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="24" font-weight="700" text-anchor="start">Aide minimale</text><line x1="625" y1="594" x2="667" y2="594" stroke="var(--color-signal)" stroke-width="3"/><path d="M 658 588 L 667 594 L 658 600" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="transition-fl-fr-mobilisation-d-frame" x="690" y="602" fill="var(--color-paper)" font-family="l0g Transition First Loss" font-size="24" font-weight="700" text-anchor="start">Après : résultats</text><line x1="40" y1="638" x2="960" y2="638" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="transition-fl-fr-mobilisation-d-frame" x="40" y="670" fill="var(--color-muted)" font-family="l0g Transition First Loss" font-size="22" font-weight="400" text-anchor="start">R01 · G01 | Ratios descriptifs</text></svg>
