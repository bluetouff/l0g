<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 352 280" width="100%" height="auto" style="width:100%;height:auto" role="img" aria-labelledby="oss-finance-fr-dependencies-mobile-title oss-finance-fr-dependencies-mobile-desc" xml:lang="fr">
<title id="oss-finance-fr-dependencies-mobile-title">Une dépendance, plusieurs banques</title>
<desc id="oss-finance-fr-dependencies-mobile-desc">Un composant partagé vulnérable peut être intégré à un produit commercial, appelé par un service interne ou embarqué dans un service hébergé. Trois établissements fictifs utilisent ces logiciels pour les paiements, les services clients ou les opérations de marché. Les effets dépendent de la version, de l’exposition et des protections.</desc>
