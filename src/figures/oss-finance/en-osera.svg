<text x="314" y="198" font-size="14" font-weight="500" fill="var(--color-paper)" text-anchor="start">Verification</text>
<text x="314" y="215" font-size="13" font-weight="400" fill="var(--color-muted)" text-anchor="start">at each bank</text>
<path d="M406 206H416m-4-3 4 3-4 3" fill="none" stroke="var(--color-signal)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="418" y="181" width="126" height="50" rx="6" fill="var(--color-surface)" stroke="var(--color-signal)"/>
<g transform="translate(426 193)" aria-hidden="true"><path d="M3 9h5m0-5v10m0-10h5m-5 10h5m0-10 3 0m-3 10 3 0m-3-10-2-2m2 2-2 2m2 8-2-2m2 2-2 2" fill="none" stroke="var(--color-signal)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="448" y="198" font-size="14" font-weight="500" fill="var(--color-paper)" text-anchor="start">Deployment</text>
<text x="448" y="215" font-size="13" font-weight="400" fill="var(--color-muted)" text-anchor="start">at each bank</text>
<text x="16" y="264" font-size="13" font-weight="400" fill="var(--color-muted)" text-anchor="start">Documented provenance accompanies the shared fix.</text>
</svg>
