<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 352 274" width="100%" height="auto" style="width:100%;height:auto" role="img" aria-labelledby="oss-finance-en-survey-mobile-title oss-finance-en-survey-mobile-desc" xml:lang="en">
<title id="oss-finance-en-survey-mobile-title">Reported annual savings</title>
<desc id="oss-finance-en-survey-mobile-desc">FINOS 2026 survey of 215 respondents to the question about estimated annual savings. Under 0.5 million dollars: 8%. 0.5 to 2 million: 6%. 2 to 5 million: 19%. 5 to 10 million: 32%. Over 10 million: 15%. Unsure: 20%.</desc>
