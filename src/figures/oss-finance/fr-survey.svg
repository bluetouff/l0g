<title id="oss-finance-fr-survey-title">Les économies déclarées</title>
<desc id="oss-finance-fr-survey-desc">Enquête FINOS 2026 auprès de 215 répondants à la question sur leurs économies annuelles estimées. Moins de 0,5 million de dollars : 8 %. De 0,5 à 2 millions : 6 %. De 2 à 5 millions : 19 %. De 5 à 10 millions : 32 %. Plus de 10 millions : 15 %. Incertains : 20 %.</desc>
