<title id="oss-finance-en-osera-mobile-title">A shared fix</title>
<desc id="oss-finance-en-osera-mobile-desc">Three fictional banks compare two approaches. Working separately, each prepares or obtains its own fix, verifies it and deploys it. In the model inspired by OSERA, they share preparation of the fix and evidence of its provenance. Each bank retains verification and deployment.</desc>
