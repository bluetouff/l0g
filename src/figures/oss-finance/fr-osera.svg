<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 292" width="100%" height="auto" style="width:100%;height:auto" role="img" aria-labelledby="oss-finance-fr-osera-title oss-finance-fr-osera-desc" xml:lang="fr">
<title id="oss-finance-fr-osera-title">Un correctif partagé</title>
<desc id="oss-finance-fr-osera-desc">Trois banques fictives comparent deux méthodes. En traitement séparé, chacune prépare ou obtient son propre correctif, le vérifie et le déploie. Dans le modèle inspiré d’OSERA, elles partagent la préparation du correctif et les éléments de provenance. Chacune conserve la vérification et le déploiement.</desc>
