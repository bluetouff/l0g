<title id="oss-finance-en-dependencies-mobile-title">One dependency, several banks</title>
<desc id="oss-finance-en-dependencies-mobile-desc">A vulnerable shared component may be bundled in a commercial product, called by an internal service or used by a hosted service. Three fictional institutions use this software for payments, customer services or market operations. Impact depends on the version, exposure and safeguards.</desc>
