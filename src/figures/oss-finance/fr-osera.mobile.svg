<title id="oss-finance-fr-osera-mobile-title">Un correctif partagé</title>
<desc id="oss-finance-fr-osera-mobile-desc">Trois banques fictives comparent deux méthodes. En traitement séparé, chacune prépare ou obtient son propre correctif, le vérifie et le déploie. Dans le modèle inspiré d’OSERA, elles partagent la préparation du correctif et les éléments de provenance. Chacune conserve la vérification et le déploiement.</desc>
