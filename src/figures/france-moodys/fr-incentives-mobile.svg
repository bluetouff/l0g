  <line x1="30" y1="968" x2="390" y2="968" stroke="var(--color-line-strong)" stroke-width="1"/>
  <text x="30" y="1004" font-family="l0g France Ratings" font-size="17" font-weight="700" fill="var(--color-amber)" text-anchor="start" data-panel="fdm-fr-incentives-m-mechanism">TENSION</text>
