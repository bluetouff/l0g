  <text x="30" y="143" font-family="l0g France Ratings" font-size="17" font-weight="400" fill="var(--color-muted)" text-anchor="start" data-panel="fdm-fr-incentives-m-header">Modèle émetteur-payeur / schéma</text>
  <text x="30" y="167" font-family="l0g France Ratings" font-size="17" font-weight="400" fill="var(--color-muted)" text-anchor="start" data-panel="fdm-fr-incentives-m-header">général des relations</text>
  <rect x="54" y="221" width="336" height="135" rx="0" fill="var(--color-surface-2)" id="fdm-fr-incentives-m-card-1"/>
