<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1441" style="width:100%;height:auto" class="l0g-france-moodys-svg" role="img" aria-labelledby="fdm-fr-incentives-m-title fdm-fr-incentives-m-desc">
  <title id="fdm-fr-incentives-m-title">Le client de l’agence et l’utilisateur de la note</title>
  <desc id="fdm-fr-incentives-m-desc">L’émetteur sélectionne et rémunère l’agence. L’agence publie une note utilisée par les investisseurs. Les investisseurs financent l’émetteur selon leur propre décision. La séparation des fonctions commerciales et analytiques cherche à encadrer ce conflit d’intérêts potentiel. Aucun contrat France–Moody’s n’est reconstitué.</desc>
  <rect width="420" height="1441" fill="var(--color-surface)" x="0" y="0"/>
  <rect id="fdm-fr-incentives-m-header" x="8" y="5" width="404" height="175.54" fill="none"/>
  <rect id="fdm-fr-incentives-m-mechanism" x="8" y="180.54" width="404" height="1162.46" fill="none"/>
  <rect id="fdm-fr-incentives-m-sources" x="8" y="1343" width="404" height="95" fill="none"/>
  <text x="30" y="30" font-family="l0g France Ratings" font-size="17" font-weight="700" fill="var(--color-signal)" text-anchor="start" data-panel="fdm-fr-incentives-m-header">l0g  /  09</text>
  <text x="30" y="67" font-family="l0g France Ratings" font-size="26" font-weight="700" fill="var(--color-paper)" text-anchor="start" data-panel="fdm-fr-incentives-m-header">Le client de l’agence et</text>
