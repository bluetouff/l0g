  <text x="30" y="1065" font-family="l0g France Ratings" font-size="20" font-weight="400" fill="var(--color-paper)" text-anchor="start" data-panel="fdm-fr-incentives-m-mechanism">l’investisseur attend une évaluation</text>
  <text x="30" y="1094" font-family="l0g France Ratings" font-size="20" font-weight="400" fill="var(--color-paper)" text-anchor="start" data-panel="fdm-fr-incentives-m-mechanism">indépendante.</text>
  <text x="30" y="1145" font-family="l0g France Ratings" font-size="17" font-weight="700" fill="var(--color-signal)" text-anchor="start" data-panel="fdm-fr-incentives-m-mechanism">GARDE-FOUS ANNONCÉS</text>
