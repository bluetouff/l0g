  <text x="30" y="1207" font-family="l0g France Ratings" font-size="20" font-weight="400" fill="var(--color-paper)" text-anchor="start" data-panel="fdm-fr-incentives-m-mechanism">analytique et contrôles des</text>
  <text x="30" y="1236" font-family="l0g France Ratings" font-size="20" font-weight="400" fill="var(--color-paper)" text-anchor="start" data-panel="fdm-fr-incentives-m-mechanism">méthodes.</text>
  <text x="30" y="1289" font-family="l0g France Ratings" font-size="17" font-weight="400" fill="var(--color-muted)" text-anchor="start" data-panel="fdm-fr-incentives-m-mechanism">Schéma général, sans contrat</text>
  <text x="30" y="1314" font-family="l0g France Ratings" font-size="17" font-weight="400" fill="var(--color-muted)" text-anchor="start" data-panel="fdm-fr-incentives-m-mechanism">France–Moody’s accessible.</text>
  <line x1="30" y1="1343" x2="390" y2="1343" stroke="var(--color-line-strong)" stroke-width="1"/>
  <text x="30" y="1368" font-family="l0g France Ratings" font-size="17" font-weight="400" fill="var(--color-muted)" text-anchor="start" data-panel="fdm-fr-incentives-m-sources">Sources : S&amp;P, méthode et transparence ;</text>
  <text x="30" y="1392" font-family="l0g France Ratings" font-size="17" font-weight="400" fill="var(--color-muted)" text-anchor="start" data-panel="fdm-fr-incentives-m-sources">DOJ, règlement Moody’s, 2017. Flèches</text>
  <text x="30" y="1416" font-family="l0g France Ratings" font-size="17" font-weight="400" fill="var(--color-muted)" text-anchor="start" data-panel="fdm-fr-incentives-m-sources">non proportionnelles.</text>
