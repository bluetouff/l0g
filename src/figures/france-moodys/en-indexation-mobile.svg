<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1200" style="width:100%;height:auto" class="l0g-france-moodys-svg" role="img" aria-labelledby="fdm-en-indexation-m-title fdm-en-indexation-m-desc">
  <title id="fdm-en-indexation-m-title">Inflation in the budget and in cash funding</title>
  <desc id="fdm-en-indexation-m-desc">The annual 8.5 billion provision is deducted from the deficit to calculate cash needs. Accumulated inflation uplift of 9.7 billion paid at maturity is included in redemptions.</desc>
  <rect width="420" height="1200" fill="var(--color-surface)" x="0" y="0"/>
  <rect id="fdm-en-indexation-m-header" x="8" y="5" width="404" height="173.58" fill="none"/>
  <rect id="fdm-en-indexation-m-mechanism" x="8" y="178.58" width="404" height="947.42" fill="none"/>
  <rect id="fdm-en-indexation-m-sources" x="8" y="1126" width="404" height="71" fill="none"/>
  <text x="30" y="30" font-family="l0g France Ratings" font-size="17" font-weight="700" fill="var(--color-signal)" text-anchor="start" data-panel="fdm-en-indexation-m-header">l0g  /  05</text>
  <text x="30" y="67" font-family="l0g France Ratings" font-size="26" font-weight="700" fill="var(--color-paper)" text-anchor="start" data-panel="fdm-en-indexation-m-header">Inflation in the budget</text>
  <text x="30" y="101" font-family="l0g France Ratings" font-size="26" font-weight="700" fill="var(--color-paper)" text-anchor="start" data-panel="fdm-en-indexation-m-header">and in cash funding</text>
  <text x="30" y="143" font-family="l0g France Ratings" font-size="17" font-weight="400" fill="var(--color-muted)" text-anchor="start" data-panel="fdm-en-indexation-m-header">Two different time windows / initial 2027</text>
  <text x="30" y="167" font-family="l0g France Ratings" font-size="17" font-weight="400" fill="var(--color-muted)" text-anchor="start" data-panel="fdm-en-indexation-m-header">bill / €bn</text>
  <rect x="30" y="214" width="360" height="340" rx="0" fill="var(--color-surface-2)" id="fdm-en-indexation-m-card-1"/>
  <text x="50" y="245" font-family="l0g France Ratings" font-size="17" font-weight="700" fill="var(--color-signal)" text-anchor="start" data-panel="fdm-en-indexation-m-card-1">CHARGE FOR THE YEAR</text>
  <text x="50" y="313" font-family="l0g France Ratings" font-size="42" font-weight="700" fill="var(--color-signal)" text-anchor="start" data-panel="fdm-en-indexation-m-card-1">€8.5bn</text>
  <text x="50" y="351" font-family="l0g France Ratings" font-size="21" font-weight="400" fill="var(--color-paper)" text-anchor="start" data-panel="fdm-en-indexation-m-card-1">Annual provision, included in</text>
  <text x="50" y="380.4" font-family="l0g France Ratings" font-size="21" font-weight="400" fill="var(--color-paper)" text-anchor="start" data-panel="fdm-en-indexation-m-card-1">the deficit</text>
  <line x1="210" y1="414.8" x2="210" y2="441.8" stroke="var(--color-signal)" stroke-width="2"/>
  <path d="M 206.16 434.78 L 210 441.8 L 213.84 434.78" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="50" y="476.8" font-family="l0g France Ratings" font-size="21" font-weight="700" fill="var(--color-paper)" text-anchor="start" data-panel="fdm-en-indexation-m-card-1">Removed when calculating</text>
  <text x="50" y="506.2" font-family="l0g France Ratings" font-size="21" font-weight="700" fill="var(--color-paper)" text-anchor="start" data-panel="fdm-en-indexation-m-card-1">the cash requirement</text>
  <rect x="30" y="589" width="360" height="340" rx="0" fill="var(--color-surface-2)" id="fdm-en-indexation-m-card-2"/>
  <text x="50" y="620" font-family="l0g France Ratings" font-size="17" font-weight="700" fill="var(--color-amber)" text-anchor="start" data-panel="fdm-en-indexation-m-card-2">PRINCIPAL REDEEMED</text>
  <text x="50" y="688" font-family="l0g France Ratings" font-size="42" font-weight="700" fill="var(--color-amber)" text-anchor="start" data-panel="fdm-en-indexation-m-card-2">€9.7bn</text>
  <text x="50" y="726" font-family="l0g France Ratings" font-size="21" font-weight="400" fill="var(--color-paper)" text-anchor="start" data-panel="fdm-en-indexation-m-card-2">Accumulated inflation uplift</text>
  <text x="50" y="755.4" font-family="l0g France Ratings" font-size="21" font-weight="400" fill="var(--color-paper)" text-anchor="start" data-panel="fdm-en-indexation-m-card-2">on maturing bonds</text>
  <line x1="210" y1="789.8" x2="210" y2="816.8" stroke="var(--color-amber)" stroke-width="2"/>
  <path d="M 206.16 809.78 L 210 816.8 L 213.84 809.78" fill="none" stroke="var(--color-amber)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="50" y="851.8" font-family="l0g France Ratings" font-size="21" font-weight="700" fill="var(--color-paper)" text-anchor="start" data-panel="fdm-en-indexation-m-card-2">Paid in 2027, included in</text>
  <text x="50" y="881.2" font-family="l0g France Ratings" font-size="21" font-weight="700" fill="var(--color-paper)" text-anchor="start" data-panel="fdm-en-indexation-m-card-2">redemptions</text>
  <text x="30" y="1009" font-family="l0g France Ratings" font-size="28" font-weight="700" fill="var(--color-paper)" text-anchor="start" data-panel="fdm-en-indexation-m-mechanism">−8.5 + 2.0 = −6.5</text>
  <text x="30" y="1043" font-family="l0g France Ratings" font-size="19" font-weight="400" fill="var(--color-muted)" text-anchor="start" data-panel="fdm-en-indexation-m-mechanism">Provision removed +</text>
  <text x="30" y="1069.6" font-family="l0g France Ratings" font-size="19" font-weight="400" fill="var(--color-muted)" text-anchor="start" data-panel="fdm-en-indexation-m-mechanism">investment-programme payments =</text>
  <text x="30" y="1096.2" font-family="l0g France Ratings" font-size="19" font-weight="400" fill="var(--color-muted)" text-anchor="start" data-panel="fdm-en-indexation-m-mechanism">other cash requirements.</text>
  <line x1="30" y1="1126" x2="390" y2="1126" stroke="var(--color-line-strong)" stroke-width="1"/>
  <text x="30" y="1151" font-family="l0g France Ratings" font-size="17" font-weight="400" fill="var(--color-muted)" text-anchor="start" data-panel="fdm-en-indexation-m-sources">Sources: 2027 bill, art. 57; AFT, OAT€i.</text>
  <text x="30" y="1175" font-family="l0g France Ratings" font-size="17" font-weight="400" fill="var(--color-muted)" text-anchor="start" data-panel="fdm-en-indexation-m-sources">Forecasts with different scopes.</text>
</svg>
