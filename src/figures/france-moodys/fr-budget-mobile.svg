<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 895" style="width:100%;height:auto" class="l0g-france-moodys-svg" role="img" aria-labelledby="fdm-fr-budget-m-title fdm-fr-budget-m-desc">
  <title id="fdm-fr-budget-m-title">La charge prévue gagne 10,3 milliards en 2027</title>
  <desc id="fdm-fr-budget-m-desc">59,3 milliards dans la loi de finances initiale pour 2026, 62,6 dans le révisé 2026, 72,9 dans le PLF 2027. Tous les montants ne sont pas des résultats exécutés.</desc>
