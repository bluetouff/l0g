  <text x="30" y="67" font-family="l0g France Ratings" font-size="26" font-weight="700" fill="var(--color-paper)" text-anchor="start" data-panel="fdm-fr-budget-m-header">La charge prévue gagne</text>
  <text x="30" y="101" font-family="l0g France Ratings" font-size="26" font-weight="700" fill="var(--color-paper)" text-anchor="start" data-panel="fdm-fr-budget-m-header">10,3 milliards en 2027</text>
