<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1207" style="width:100%;height:auto" class="l0g-france-moodys-svg" role="img" aria-labelledby="fdm-fr-indexation-m-title fdm-fr-indexation-m-desc">
  <title id="fdm-fr-indexation-m-title">L’inflation dans le budget et dans la trésorerie</title>
  <desc id="fdm-fr-indexation-m-desc">La provision annuelle de 8,5 milliards est retirée du déficit pour calculer le besoin de trésorerie. Les 9,7 milliards d’indexation accumulée remboursés à l’échéance sont inclus dans les amortissements.</desc>
  <rect width="420" height="1207" fill="var(--color-surface)" x="0" y="0"/>
  <rect id="fdm-fr-indexation-m-header" x="8" y="5" width="404" height="207.58" fill="none"/>
  <rect id="fdm-fr-indexation-m-mechanism" x="8" y="212.58" width="404" height="920.42" fill="none"/>
  <rect id="fdm-fr-indexation-m-sources" x="8" y="1133" width="404" height="71" fill="none"/>
  <text x="30" y="30" font-family="l0g France Ratings" font-size="17" font-weight="700" fill="var(--color-signal)" text-anchor="start" data-panel="fdm-fr-indexation-m-header">l0g  /  05</text>
  <text x="30" y="67" font-family="l0g France Ratings" font-size="26" font-weight="700" fill="var(--color-paper)" text-anchor="start" data-panel="fdm-fr-indexation-m-header">L’inflation dans le</text>
  <text x="30" y="101" font-family="l0g France Ratings" font-size="26" font-weight="700" fill="var(--color-paper)" text-anchor="start" data-panel="fdm-fr-indexation-m-header">budget et dans la</text>
  <text x="30" y="135" font-family="l0g France Ratings" font-size="26" font-weight="700" fill="var(--color-paper)" text-anchor="start" data-panel="fdm-fr-indexation-m-header">trésorerie</text>
  <text x="30" y="177" font-family="l0g France Ratings" font-size="17" font-weight="400" fill="var(--color-muted)" text-anchor="start" data-panel="fdm-fr-indexation-m-header">Deux périmètres temporels / PLF 2027</text>
  <text x="30" y="201" font-family="l0g France Ratings" font-size="17" font-weight="400" fill="var(--color-muted)" text-anchor="start" data-panel="fdm-fr-indexation-m-header">initial / Md€</text>
  <rect x="30" y="248" width="360" height="340" rx="0" fill="var(--color-surface-2)" id="fdm-fr-indexation-m-card-1"/>
  <text x="50" y="279" font-family="l0g France Ratings" font-size="17" font-weight="700" fill="var(--color-signal)" text-anchor="start" data-panel="fdm-fr-indexation-m-card-1">CHARGE DE L’EXERCICE</text>
  <text x="50" y="347" font-family="l0g France Ratings" font-size="42" font-weight="700" fill="var(--color-signal)" text-anchor="start" data-panel="fdm-fr-indexation-m-card-1">8,5 Md€</text>
  <text x="50" y="385" font-family="l0g France Ratings" font-size="21" font-weight="400" fill="var(--color-paper)" text-anchor="start" data-panel="fdm-fr-indexation-m-card-1">Provision annuelle, incluse</text>
  <text x="50" y="414.4" font-family="l0g France Ratings" font-size="21" font-weight="400" fill="var(--color-paper)" text-anchor="start" data-panel="fdm-fr-indexation-m-card-1">dans le déficit</text>
  <line x1="210" y1="448.8" x2="210" y2="475.8" stroke="var(--color-signal)" stroke-width="2"/>
  <path d="M 206.16 468.78 L 210 475.8 L 213.84 468.78" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="50" y="510.8" font-family="l0g France Ratings" font-size="21" font-weight="700" fill="var(--color-paper)" text-anchor="start" data-panel="fdm-fr-indexation-m-card-1">Retirée pour calculer le</text>
  <text x="50" y="540.2" font-family="l0g France Ratings" font-size="21" font-weight="700" fill="var(--color-paper)" text-anchor="start" data-panel="fdm-fr-indexation-m-card-1">besoin de trésorerie</text>
  <rect x="30" y="623" width="360" height="340" rx="0" fill="var(--color-surface-2)" id="fdm-fr-indexation-m-card-2"/>
  <text x="50" y="654" font-family="l0g France Ratings" font-size="17" font-weight="700" fill="var(--color-amber)" text-anchor="start" data-panel="fdm-fr-indexation-m-card-2">CAPITAL REMBOURSÉ</text>
  <text x="50" y="722" font-family="l0g France Ratings" font-size="42" font-weight="700" fill="var(--color-amber)" text-anchor="start" data-panel="fdm-fr-indexation-m-card-2">9,7 Md€</text>
  <text x="50" y="760" font-family="l0g France Ratings" font-size="21" font-weight="400" fill="var(--color-paper)" text-anchor="start" data-panel="fdm-fr-indexation-m-card-2">Indexation accumulée sur les</text>
  <text x="50" y="789.4" font-family="l0g France Ratings" font-size="21" font-weight="400" fill="var(--color-paper)" text-anchor="start" data-panel="fdm-fr-indexation-m-card-2">titres échus</text>
  <line x1="210" y1="823.8" x2="210" y2="850.8" stroke="var(--color-amber)" stroke-width="2"/>
  <path d="M 206.16 843.78 L 210 850.8 L 213.84 843.78" fill="none" stroke="var(--color-amber)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="50" y="885.8" font-family="l0g France Ratings" font-size="21" font-weight="700" fill="var(--color-paper)" text-anchor="start" data-panel="fdm-fr-indexation-m-card-2">Payée en 2027, incluse</text>
  <text x="50" y="915.2" font-family="l0g France Ratings" font-size="21" font-weight="700" fill="var(--color-paper)" text-anchor="start" data-panel="fdm-fr-indexation-m-card-2">dans les amortissements</text>
  <text x="30" y="1043" font-family="l0g France Ratings" font-size="28" font-weight="700" fill="var(--color-paper)" text-anchor="start" data-panel="fdm-fr-indexation-m-mechanism">−8,5 + 2,0 = −6,5</text>
  <text x="30" y="1077" font-family="l0g France Ratings" font-size="19" font-weight="400" fill="var(--color-muted)" text-anchor="start" data-panel="fdm-fr-indexation-m-mechanism">Provision retirée + paiements PIA =</text>
  <text x="30" y="1103.6" font-family="l0g France Ratings" font-size="19" font-weight="400" fill="var(--color-muted)" text-anchor="start" data-panel="fdm-fr-indexation-m-mechanism">autres besoins de trésorerie.</text>
  <line x1="30" y1="1133" x2="390" y2="1133" stroke="var(--color-line-strong)" stroke-width="1"/>
  <text x="30" y="1158" font-family="l0g France Ratings" font-size="17" font-weight="400" fill="var(--color-muted)" text-anchor="start" data-panel="fdm-fr-indexation-m-sources">Sources : PLF 2027, art. 57 ; AFT, OAT€i.</text>
  <text x="30" y="1182" font-family="l0g France Ratings" font-size="17" font-weight="400" fill="var(--color-muted)" text-anchor="start" data-panel="fdm-fr-indexation-m-sources">Montants prévisionnels, non additifs.</text>
</svg>
