<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tempo-en-prices-m-title tempo-en-prices-m-desc" viewBox="0 0 420 800" style="width:100%;height:auto" class="l0g-tempo-red-days-svg"><title id="tempo-en-prices-m-title">Six prices for the same electricity</title><desc id="tempo-en-prices-m-desc">EDF Tempo prices including tax at 1 August 2026, in euros per kilowatt-hour. Blue: off-peak 0.1356, peak 0.1654. White: 0.1536 and 0.1921. Red: 0.1615 and 0.7295. All six bars share a zero-to-0.8 euro per kilowatt-hour scale. Tariff day: peak 06:00 to 22:00; off-peak 22:00 to 06:00 the next day. Moving ten red peak kilowatt-hours to red off-peak saves 5.68 euros in energy charges, at fixed meter volume and subscription.</desc><rect id="tempo-en-prices-m-frame" x="0" y="0" width="420" height="800" rx="0" fill="var(--color-ink)" stroke="none" stroke-width="1"/><text data-panel="tempo-en-prices-m-frame" x="22" y="35" fill="var(--color-signal)" font-family="l0g Tempo" font-size="17" font-weight="700" text-anchor="start">l0g / TEMPO</text><text data-panel="tempo-en-prices-m-frame" x="398" y="35" fill="var(--color-muted)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="end">05 / 07</text><text data-panel="tempo-en-prices-m-frame" x="22" y="76" fill="var(--color-paper)" font-family="l0g Tempo" font-size="25" font-weight="700" text-anchor="start">Six prices for the same</text><text data-panel="tempo-en-prices-m-frame" x="22" y="107" fill="var(--color-paper)" font-family="l0g Tempo" font-size="25" font-weight="700" text-anchor="start">electricity</text><text data-panel="tempo-en-prices-m-frame" x="22" y="147" fill="var(--color-muted)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="start">EDF Tempo · including tax · 1 Aug</text><text data-panel="tempo-en-prices-m-frame" x="22" y="170" fill="var(--color-muted)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="start">2026 · €/kWh</text><text data-panel="tempo-en-prices-m-frame" x="22" y="222" fill="var(--color-paper)" font-family="l0g Tempo" font-size="17" font-weight="700" text-anchor="start">Blue off-pk</text><rect x="160" y="206" width="34.7475" height="12" rx="0" fill="var(--color-signal)" stroke="none" stroke-width="1"/><text data-panel="tempo-en-prices-m-frame" x="390" y="246" fill="var(--color-paper)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="end">0.1356</text><text data-panel="tempo-en-prices-m-frame" x="22" y="272" fill="var(--color-paper)" font-family="l0g Tempo" font-size="17" font-weight="700" text-anchor="start">Blue peak</text><rect x="160" y="256" width="42.38375" height="12" rx="0" fill="var(--color-signal)" stroke="none" stroke-width="1"/><text data-panel="tempo-en-prices-m-frame" x="390" y="296" fill="var(--color-paper)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="end">0.1654</text><text data-panel="tempo-en-prices-m-frame" x="22" y="322" fill="var(--color-paper)" font-family="l0g Tempo" font-size="17" font-weight="700" text-anchor="start">White off-pk</text><rect x="160" y="306" width="39.36" height="12" rx="0" fill="var(--color-muted)" stroke="none" stroke-width="1"/><text data-panel="tempo-en-prices-m-frame" x="390" y="346" fill="var(--color-paper)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="end">0.1536</text><text data-panel="tempo-en-prices-m-frame" x="22" y="372" fill="var(--color-paper)" font-family="l0g Tempo" font-size="17" font-weight="700" text-anchor="start">White peak</text><rect x="160" y="356" width="49.225625" height="12" rx="0" fill="var(--color-muted)" stroke="none" stroke-width="1"/><text data-panel="tempo-en-prices-m-frame" x="390" y="396" fill="var(--color-paper)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="end">0.1921</text><text data-panel="tempo-en-prices-m-frame" x="22" y="422" fill="var(--color-paper)" font-family="l0g Tempo" font-size="17" font-weight="700" text-anchor="start">Red off-pk</text><rect x="160" y="406" width="41.384375" height="12" rx="0" fill="var(--color-accent)" stroke="none" stroke-width="1"/><text data-panel="tempo-en-prices-m-frame" x="390" y="446" fill="var(--color-paper)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="end">0.1615</text><text data-panel="tempo-en-prices-m-frame" x="22" y="472" fill="var(--color-paper)" font-family="l0g Tempo" font-size="17" font-weight="700" text-anchor="start">Red peak</text><rect x="160" y="456" width="186.934375" height="12" rx="0" fill="var(--color-accent)" stroke="none" stroke-width="1"/><text data-panel="tempo-en-prices-m-frame" x="390" y="496" fill="var(--color-paper)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="end">0.7295</text><text data-panel="tempo-en-prices-m-frame" x="160.0" y="537" fill="var(--color-muted)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="middle">0</text><text data-panel="tempo-en-prices-m-frame" x="262.5" y="537" fill="var(--color-muted)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="middle">0.4</text><text data-panel="tempo-en-prices-m-frame" x="365.0" y="537" fill="var(--color-muted)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="middle">0.8</text><line x1="28" y1="600" x2="270.666667" y2="600" stroke="var(--color-accent)" stroke-width="9"/><line x1="270.666667" y1="600" x2="392" y2="600" stroke="var(--color-signal)" stroke-width="9"/><text data-panel="tempo-en-prices-m-frame" x="28" y="632" fill="var(--color-muted)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="start">06:00</text><text data-panel="tempo-en-prices-m-frame" x="270.666667" y="632" fill="var(--color-muted)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="middle">22:00</text><text data-panel="tempo-en-prices-m-frame" x="392" y="632" fill="var(--color-muted)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="end">06:00</text><text data-panel="tempo-en-prices-m-frame" x="28" y="675" fill="var(--color-signal)" font-family="l0g Tempo" font-size="20" font-weight="700" text-anchor="start">10 kWh: red peak → off-peak</text><text data-panel="tempo-en-prices-m-frame" x="28" y="705" fill="var(--color-signal)" font-family="l0g Tempo" font-size="20" font-weight="700" text-anchor="start">= €5.68 at fixed volume</text><line x1="22" y1="738" x2="398" y2="738" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="tempo-en-prices-m-frame" x="22" y="769" fill="var(--color-muted)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="start">T01 · T07 | Fixed meter volume</text></svg>
