<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tempo-fr-notice-d-title tempo-fr-notice-d-desc" viewBox="0 0 1000 700" style="width:100%;height:auto" class="l0g-tempo-red-days-svg"><title id="tempo-fr-notice-d-title">Sélection et annonce : les étapes</title><desc id="tempo-fr-notice-d-desc">Le 1er novembre 2026 entrent en vigueur la sélection des rouges fondée sur PP et l’exclusion des 24 et 31 décembre. Jusqu’au 31 octobre 2027, l’annonce officielle Tempo reste à 10:30 en J−1. À partir du 1er novembre 2027, Tempo doit être annoncé dans l’heure suivant PP ; J−2 devient possible lorsque PP est annoncé plus tôt. Un PP déclenché par un changement Ecowatt après 10:30 en J−1 peut différer du rouge Tempo. Les heures pleines facturées Tempo restent de 06:00 à 22:00.</desc><rect id="tempo-fr-notice-d-frame" x="0" y="0" width="1000" height="700" rx="0" fill="var(--color-ink)" stroke="none" stroke-width="1"/><text data-panel="tempo-fr-notice-d-frame" x="40" y="42" fill="var(--color-signal)" font-family="l0g Tempo" font-size="22" font-weight="700" text-anchor="start">l0g / TEMPO</text><text data-panel="tempo-fr-notice-d-frame" x="960" y="42" fill="var(--color-muted)" font-family="l0g Tempo" font-size="22" font-weight="400" text-anchor="end">07 / 07</text><text data-panel="tempo-fr-notice-d-frame" x="40" y="94" fill="var(--color-paper)" font-family="l0g Tempo" font-size="32" font-weight="700" text-anchor="start">Sélection et annonce : les étapes</text><text data-panel="tempo-fr-notice-d-frame" x="40" y="145" fill="var(--color-muted)" font-family="l0g Tempo" font-size="22" font-weight="400" text-anchor="start">Décision CRE du 21.10.2026 · heures françaises</text><text data-panel="tempo-fr-notice-d-frame" x="40" y="220" fill="var(--color-accent)" font-family="l0g Tempo" font-size="30" font-weight="700" text-anchor="start">01.11.2026</text><text data-panel="tempo-fr-notice-d-frame" x="40" y="268" fill="var(--color-paper)" font-family="l0g Tempo" font-size="25" font-weight="400" text-anchor="start">Sélection des rouges fondée sur PP</text><text data-panel="tempo-fr-notice-d-frame" x="40" y="304" fill="var(--color-paper)" font-family="l0g Tempo" font-size="25" font-weight="400" text-anchor="start">24 et 31 décembre exclus</text><text data-panel="tempo-fr-notice-d-frame" x="580" y="220" fill="var(--color-muted)" font-family="l0g Tempo" font-size="25" font-weight="700" text-anchor="start">JUSQU’AU 31.10.2027</text><text data-panel="tempo-fr-notice-d-frame" x="580" y="270" fill="var(--color-paper)" font-family="l0g Tempo" font-size="30" font-weight="700" text-anchor="start">J−1 · 10 h 30</text><text data-panel="tempo-fr-notice-d-frame" x="40" y="396" fill="var(--color-signal)" font-family="l0g Tempo" font-size="30" font-weight="700" text-anchor="start">01.11.2027</text><text data-panel="tempo-fr-notice-d-frame" x="40" y="447" fill="var(--color-paper)" font-family="l0g Tempo" font-size="28" font-weight="700" text-anchor="start">Publication PP</text><line x1="340" y1="438" x2="580" y2="438" stroke="var(--color-signal)" stroke-width="3"/><path d="M 571 432 L 580 438 L 571 444" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="tempo-fr-notice-d-frame" x="460" y="416" fill="var(--color-signal)" font-family="l0g Tempo" font-size="25" font-weight="700" text-anchor="middle">1 h max</text><text data-panel="tempo-fr-notice-d-frame" x="620" y="447" fill="var(--color-signal)" font-family="l0g Tempo" font-size="28" font-weight="700" text-anchor="start">Publication Tempo</text><text data-panel="tempo-fr-notice-d-frame" x="40" y="510" fill="var(--color-muted)" font-family="l0g Tempo" font-size="25" font-weight="400" text-anchor="start">J−2 possible si PP anticipé</text><text data-panel="tempo-fr-notice-d-frame" x="40" y="564" fill="var(--color-paper)" font-family="l0g Tempo" font-size="24" font-weight="400" text-anchor="start">Ecowatt après 10 h 30 en J−1 : un PP peut différer de Tempo.</text><text data-panel="tempo-fr-notice-d-frame" x="40" y="600" fill="var(--color-paper)" font-family="l0g Tempo" font-size="24" font-weight="400" text-anchor="start">HP Tempo : 06:00–22:00</text><line x1="40" y1="638" x2="960" y2="638" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="tempo-fr-notice-d-frame" x="40" y="669" fill="var(--color-muted)" font-family="l0g Tempo" font-size="22" font-weight="400" text-anchor="start">G01 · R02 · T07 | Prévenance</text></svg>
