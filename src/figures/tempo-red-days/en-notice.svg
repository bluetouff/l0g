<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tempo-en-notice-d-title tempo-en-notice-d-desc" viewBox="0 0 1000 700" style="width:100%;height:auto" class="l0g-tempo-red-days-svg"><title id="tempo-en-notice-d-title">Selection and notice: the timetable</title><desc id="tempo-en-notice-d-desc">PP-based red-day selection and the 24 and 31 December exclusions take effect on 1 November 2026. Through 31 October 2027, the official Tempo announcement remains at 10:30 on D−1. From 1 November 2027, Tempo must be announced within one hour of PP; D−2 becomes possible with an early PP announcement. A PP day triggered by an Ecowatt change after 10:30 on D−1 may differ from Tempo’s red day. Tempo peak billing hours remain 06:00 to 22:00.</desc><rect id="tempo-en-notice-d-frame" x="0" y="0" width="1000" height="700" rx="0" fill="var(--color-ink)" stroke="none" stroke-width="1"/><text data-panel="tempo-en-notice-d-frame" x="40" y="42" fill="var(--color-signal)" font-family="l0g Tempo" font-size="22" font-weight="700" text-anchor="start">l0g / TEMPO</text><text data-panel="tempo-en-notice-d-frame" x="960" y="42" fill="var(--color-muted)" font-family="l0g Tempo" font-size="22" font-weight="400" text-anchor="end">07 / 07</text><text data-panel="tempo-en-notice-d-frame" x="40" y="94" fill="var(--color-paper)" font-family="l0g Tempo" font-size="32" font-weight="700" text-anchor="start">Selection and notice: the timetable</text><text data-panel="tempo-en-notice-d-frame" x="40" y="145" fill="var(--color-muted)" font-family="l0g Tempo" font-size="22" font-weight="400" text-anchor="start">CRE decision of 21 Oct 2026 · French local time</text><text data-panel="tempo-en-notice-d-frame" x="40" y="220" fill="var(--color-accent)" font-family="l0g Tempo" font-size="30" font-weight="700" text-anchor="start">01.11.2026</text><text data-panel="tempo-en-notice-d-frame" x="40" y="268" fill="var(--color-paper)" font-family="l0g Tempo" font-size="25" font-weight="400" text-anchor="start">PP-based red-day selection</text><text data-panel="tempo-en-notice-d-frame" x="40" y="304" fill="var(--color-paper)" font-family="l0g Tempo" font-size="25" font-weight="400" text-anchor="start">24 and 31 December excluded</text><text data-panel="tempo-en-notice-d-frame" x="580" y="220" fill="var(--color-muted)" font-family="l0g Tempo" font-size="25" font-weight="700" text-anchor="start">THROUGH 31 OCT 2027</text><text data-panel="tempo-en-notice-d-frame" x="580" y="270" fill="var(--color-paper)" font-family="l0g Tempo" font-size="30" font-weight="700" text-anchor="start">D−1 · 10:30</text><text data-panel="tempo-en-notice-d-frame" x="40" y="396" fill="var(--color-signal)" font-family="l0g Tempo" font-size="30" font-weight="700" text-anchor="start">01.11.2027</text><text data-panel="tempo-en-notice-d-frame" x="40" y="447" fill="var(--color-paper)" font-family="l0g Tempo" font-size="28" font-weight="700" text-anchor="start">PP announcement</text><line x1="340" y1="438" x2="580" y2="438" stroke="var(--color-signal)" stroke-width="3"/><path d="M 571 432 L 580 438 L 571 444" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="tempo-en-notice-d-frame" x="460" y="416" fill="var(--color-signal)" font-family="l0g Tempo" font-size="25" font-weight="700" text-anchor="middle">1 h max</text><text data-panel="tempo-en-notice-d-frame" x="620" y="447" fill="var(--color-signal)" font-family="l0g Tempo" font-size="28" font-weight="700" text-anchor="start">Tempo announcement</text><text data-panel="tempo-en-notice-d-frame" x="40" y="510" fill="var(--color-muted)" font-family="l0g Tempo" font-size="25" font-weight="400" text-anchor="start">D−2 possible with an early PP signal</text><text data-panel="tempo-en-notice-d-frame" x="40" y="564" fill="var(--color-paper)" font-family="l0g Tempo" font-size="24" font-weight="400" text-anchor="start">Ecowatt after 10:30 on D−1: a PP day may differ from Tempo.</text><text data-panel="tempo-en-notice-d-frame" x="40" y="600" fill="var(--color-paper)" font-family="l0g Tempo" font-size="24" font-weight="400" text-anchor="start">Tempo peak billing: 06:00–22:00</text><line x1="40" y1="638" x2="960" y2="638" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="tempo-en-notice-d-frame" x="40" y="669" fill="var(--color-muted)" font-family="l0g Tempo" font-size="22" font-weight="400" text-anchor="start">G01 · R02 · T07 | Notice</text></svg>
