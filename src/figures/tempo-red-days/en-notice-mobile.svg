<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tempo-en-notice-m-title tempo-en-notice-m-desc" viewBox="0 0 420 800" style="width:100%;height:auto" class="l0g-tempo-red-days-svg"><title id="tempo-en-notice-m-title">Selection and notice: the timetable</title><desc id="tempo-en-notice-m-desc">PP-based red-day selection and the 24 and 31 December exclusions take effect on 1 November 2026. Through 31 October 2027, the official Tempo announcement remains at 10:30 on D−1. From 1 November 2027, Tempo must be announced within one hour of PP; D−2 becomes possible with an early PP announcement. A PP day triggered by an Ecowatt change after 10:30 on D−1 may differ from Tempo’s red day. Tempo peak billing hours remain 06:00 to 22:00.</desc><rect id="tempo-en-notice-m-frame" x="0" y="0" width="420" height="800" rx="0" fill="var(--color-ink)" stroke="none" stroke-width="1"/><text data-panel="tempo-en-notice-m-frame" x="22" y="35" fill="var(--color-signal)" font-family="l0g Tempo" font-size="17" font-weight="700" text-anchor="start">l0g / TEMPO</text><text data-panel="tempo-en-notice-m-frame" x="398" y="35" fill="var(--color-muted)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="end">07 / 07</text><text data-panel="tempo-en-notice-m-frame" x="22" y="76" fill="var(--color-paper)" font-family="l0g Tempo" font-size="25" font-weight="700" text-anchor="start">Selection and notice: the</text><text data-panel="tempo-en-notice-m-frame" x="22" y="107" fill="var(--color-paper)" font-family="l0g Tempo" font-size="25" font-weight="700" text-anchor="start">timetable</text><text data-panel="tempo-en-notice-m-frame" x="22" y="147" fill="var(--color-muted)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="start">CRE decision of 21 Oct 2026 · French</text><text data-panel="tempo-en-notice-m-frame" x="22" y="170" fill="var(--color-muted)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="start">local time</text><text data-panel="tempo-en-notice-m-frame" x="28" y="205" fill="var(--color-accent)" font-family="l0g Tempo" font-size="25" font-weight="700" text-anchor="start">01.11.2026</text><text data-panel="tempo-en-notice-m-frame" x="28" y="243" fill="var(--color-paper)" font-family="l0g Tempo" font-size="19" font-weight="400" text-anchor="start">PP-based selection; 24 and 31 Dec</text><text data-panel="tempo-en-notice-m-frame" x="28" y="270" fill="var(--color-paper)" font-family="l0g Tempo" font-size="19" font-weight="400" text-anchor="start">excluded from Tempo red days</text><text data-panel="tempo-en-notice-m-frame" x="28" y="331" fill="var(--color-muted)" font-family="l0g Tempo" font-size="21" font-weight="700" text-anchor="start">THROUGH 31 OCT 2027</text><text data-panel="tempo-en-notice-m-frame" x="28" y="369" fill="var(--color-paper)" font-family="l0g Tempo" font-size="23" font-weight="700" text-anchor="start">Tempo: D−1, 10:30</text><text data-panel="tempo-en-notice-m-frame" x="28" y="443" fill="var(--color-signal)" font-family="l0g Tempo" font-size="21" font-weight="700" text-anchor="start">FROM 1 NOV 2027</text><text data-panel="tempo-en-notice-m-frame" x="28" y="506" fill="var(--color-paper)" font-family="l0g Tempo" font-size="27" font-weight="700" text-anchor="start">PP</text><line x1="93" y1="498" x2="224" y2="498" stroke="var(--color-signal)" stroke-width="3"/><path d="M 215 492 L 224 498 L 215 504" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="tempo-en-notice-m-frame" x="160" y="482" fill="var(--color-signal)" font-family="l0g Tempo" font-size="18" font-weight="700" text-anchor="middle">1 h max</text><text data-panel="tempo-en-notice-m-frame" x="247" y="506" fill="var(--color-signal)" font-family="l0g Tempo" font-size="27" font-weight="700" text-anchor="start">Tempo</text><text data-panel="tempo-en-notice-m-frame" x="28" y="538" fill="var(--color-muted)" font-family="l0g Tempo" font-size="19" font-weight="400" text-anchor="start">D−2 possible with early PP</text><text data-panel="tempo-en-notice-m-frame" x="28" y="572" fill="var(--color-muted)" font-family="l0g Tempo" font-size="19" font-weight="400" text-anchor="start">Ecowatt after 10:30 on D−1:</text><text data-panel="tempo-en-notice-m-frame" x="28" y="606" fill="var(--color-muted)" font-family="l0g Tempo" font-size="19" font-weight="400" text-anchor="start">a PP day may differ from Tempo</text><text data-panel="tempo-en-notice-m-frame" x="28" y="674" fill="var(--color-accent)" font-family="l0g Tempo" font-size="20" font-weight="700" text-anchor="start">Tempo peak: 06:00–22:00</text><line x1="22" y1="738" x2="398" y2="738" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="tempo-en-notice-m-frame" x="22" y="769" fill="var(--color-muted)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="start">G01 · R02 · T07 | Notice</text></svg>
