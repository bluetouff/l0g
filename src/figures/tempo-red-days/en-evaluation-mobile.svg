<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tempo-en-evaluation-m-title tempo-en-evaluation-m-desc" viewBox="0 0 420 800" style="width:100%;height:auto" class="l0g-tempo-red-days-svg"><title id="tempo-en-evaluation-m-title">Results from RTE’s assessments</title><desc id="tempo-en-evaluation-m-desc">Two separate assessments reported by CRE. Across four retrospective winters, mean efficiency was 95% for old Tempo versus 94% for PP: residual demand on selected days relative to a 22-day reference. Maximum observed clearing days: 13 versus 3. In 1,400 prospective scenarios, 90% exceeded 93% efficiency; separately, 90% had fewer than three clearing days. Their joint share and a future guarantee remain undetermined.</desc><rect id="tempo-en-evaluation-m-frame" x="0" y="0" width="420" height="800" rx="0" fill="var(--color-ink)" stroke="none" stroke-width="1"/><text data-panel="tempo-en-evaluation-m-frame" x="22" y="35" fill="var(--color-signal)" font-family="l0g Tempo" font-size="17" font-weight="700" text-anchor="start">l0g / TEMPO</text><text data-panel="tempo-en-evaluation-m-frame" x="398" y="35" fill="var(--color-muted)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="end">04 / 07</text><text data-panel="tempo-en-evaluation-m-frame" x="22" y="76" fill="var(--color-paper)" font-family="l0g Tempo" font-size="25" font-weight="700" text-anchor="start">Results from RTE’s</text><text data-panel="tempo-en-evaluation-m-frame" x="22" y="107" fill="var(--color-paper)" font-family="l0g Tempo" font-size="25" font-weight="700" text-anchor="start">assessments</text><text data-panel="tempo-en-evaluation-m-frame" x="22" y="147" fill="var(--color-muted)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="start">RTE results reported by CRE · October</text><text data-panel="tempo-en-evaluation-m-frame" x="22" y="170" fill="var(--color-muted)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="start">2026</text><text data-panel="tempo-en-evaluation-m-frame" x="28" y="207" fill="var(--color-paper)" font-family="l0g Tempo" font-size="18" font-weight="700" text-anchor="start">4 WINTERS · RETROSPECTIVE</text><text data-panel="tempo-en-evaluation-m-frame" x="28" y="250" fill="var(--color-muted)" font-family="l0g Tempo" font-size="18" font-weight="400" text-anchor="start">Mean efficiency</text><text data-panel="tempo-en-evaluation-m-frame" x="28" y="291" fill="var(--color-paper)" font-family="l0g Tempo" font-size="20" font-weight="700" text-anchor="start">Tempo</text><rect x="140" y="271" width="228.0" height="13" rx="0" fill="var(--color-signal)" stroke="none" stroke-width="1"/><text data-panel="tempo-en-evaluation-m-frame" x="380" y="310" fill="var(--color-paper)" font-family="l0g Tempo" font-size="18" font-weight="700" text-anchor="end">95 %</text><text data-panel="tempo-en-evaluation-m-frame" x="28" y="335" fill="var(--color-paper)" font-family="l0g Tempo" font-size="20" font-weight="700" text-anchor="start">PP</text><rect x="140" y="315" width="225.6" height="13" rx="0" fill="var(--color-amber)" stroke="none" stroke-width="1"/><text data-panel="tempo-en-evaluation-m-frame" x="380" y="354" fill="var(--color-paper)" font-family="l0g Tempo" font-size="18" font-weight="700" text-anchor="end">94 %</text><text data-panel="tempo-en-evaluation-m-frame" x="28" y="402" fill="var(--color-muted)" font-family="l0g Tempo" font-size="18" font-weight="400" text-anchor="start">Clearing: observed maximum</text><text data-panel="tempo-en-evaluation-m-frame" x="28" y="443" fill="var(--color-accent)" font-family="l0g Tempo" font-size="27" font-weight="700" text-anchor="start">Tempo : 13 → PP : 3</text><text data-panel="tempo-en-evaluation-m-frame" x="28" y="515" fill="var(--color-paper)" font-family="l0g Tempo" font-size="18" font-weight="700" text-anchor="start">1,400 SCENARIOS · PROSPECTIVE</text><text data-panel="tempo-en-evaluation-m-frame" x="28" y="562" fill="var(--color-signal)" font-family="l0g Tempo" font-size="20" font-weight="700" text-anchor="start">90%: efficiency &gt; 93%</text><text data-panel="tempo-en-evaluation-m-frame" x="28" y="605" fill="var(--color-signal)" font-family="l0g Tempo" font-size="20" font-weight="700" text-anchor="start">90%: clearing &lt; 3 days</text><text data-panel="tempo-en-evaluation-m-frame" x="28" y="662" fill="var(--color-muted)" font-family="l0g Tempo" font-size="18" font-weight="400" text-anchor="start">Two separately measured shares.</text><text data-panel="tempo-en-evaluation-m-frame" x="28" y="688" fill="var(--color-muted)" font-family="l0g Tempo" font-size="18" font-weight="400" text-anchor="start">Joint share undetermined.</text><line x1="22" y1="738" x2="398" y2="738" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="tempo-en-evaluation-m-frame" x="22" y="769" fill="var(--color-muted)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="start">G01 | RTE assessments</text></svg>
