<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tempo-en-selection-d-title tempo-en-selection-d-desc" viewBox="0 0 1000 700" style="width:100%;height:auto" class="l0g-tempo-red-days-svg"><title id="tempo-en-selection-d-title">Stock shapes the signal</title><desc id="tempo-en-selection-d-desc">Simplified method used before 1 November 2026. Residual demand is calculated by subtracting wind and solar generation from national demand, then normalised. The forecast, date and remaining stock shape selection. Threshold crossing or a stock-clearing constraint can lead to a red day, subject to eligible dates. Each red day reduces stock by one. CRE reports 13 of 22 annual red days in a March 2026 sequence excluding weekends. Boxes count days without assigning individual dates.</desc><rect id="tempo-en-selection-d-frame" x="0" y="0" width="1000" height="700" rx="0" fill="var(--color-ink)" stroke="none" stroke-width="1"/><text data-panel="tempo-en-selection-d-frame" x="40" y="42" fill="var(--color-signal)" font-family="l0g Tempo" font-size="22" font-weight="700" text-anchor="start">l0g / TEMPO</text><text data-panel="tempo-en-selection-d-frame" x="960" y="42" fill="var(--color-muted)" font-family="l0g Tempo" font-size="22" font-weight="400" text-anchor="end">01 / 07</text><text data-panel="tempo-en-selection-d-frame" x="40" y="94" fill="var(--color-paper)" font-family="l0g Tempo" font-size="32" font-weight="700" text-anchor="start">Stock shapes the signal</text><text data-panel="tempo-en-selection-d-frame" x="40" y="145" fill="var(--color-muted)" font-family="l0g Tempo" font-size="22" font-weight="400" text-anchor="start">Previous method · through 31 Oct 2026</text><text data-panel="tempo-en-selection-d-frame" x="40" y="220" fill="var(--color-signal)" font-family="l0g Tempo" font-size="24" font-weight="700" text-anchor="start">Normalised forecast</text><text data-panel="tempo-en-selection-d-frame" x="40" y="258" fill="var(--color-signal)" font-family="l0g Tempo" font-size="24" font-weight="700" text-anchor="start">Demand − wind − solar</text><text data-panel="tempo-en-selection-d-frame" x="575" y="220" fill="var(--color-amber)" font-family="l0g Tempo" font-size="24" font-weight="700" text-anchor="start">Date + remaining stock</text><text data-panel="tempo-en-selection-d-frame" x="575" y="258" fill="var(--color-amber)" font-family="l0g Tempo" font-size="24" font-weight="700" text-anchor="start">Threshold and clearing</text><path d="M 270 280 L 270 318 L 500 318 L 500 347" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 760 280 L 760 318 L 500 318" fill="none" stroke="var(--color-amber)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="tempo-en-selection-d-frame" x="500" y="388" fill="var(--color-paper)" font-family="l0g Tempo" font-size="28" font-weight="700" text-anchor="middle">Threshold crossed OR stock clearing</text><line x1="500" y1="408" x2="500" y2="445" stroke="var(--color-signal)" stroke-width="3"/><path d="M 494 436 L 500 445 L 506 436" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="tempo-en-selection-d-frame" x="500" y="485" fill="var(--color-accent)" font-family="l0g Tempo" font-size="30" font-weight="700" text-anchor="middle">Eligible day → RED → S − 1</text><text data-panel="tempo-en-selection-d-frame" x="40" y="555" fill="var(--color-muted)" font-family="l0g Tempo" font-size="22" font-weight="700" text-anchor="start">MARCH 2026</text><text data-panel="tempo-en-selection-d-frame" x="40" y="605" fill="var(--color-accent)" font-family="l0g Tempo" font-size="36" font-weight="700" text-anchor="start">13 / 22</text><rect x="265" y="565" width="22" height="28" rx="0" fill="var(--color-accent)" stroke="none" stroke-width="1"/><rect x="295" y="565" width="22" height="28" rx="0" fill="var(--color-accent)" stroke="none" stroke-width="1"/><rect x="325" y="565" width="22" height="28" rx="0" fill="var(--color-accent)" stroke="none" stroke-width="1"/><rect x="355" y="565" width="22" height="28" rx="0" fill="var(--color-accent)" stroke="none" stroke-width="1"/><rect x="385" y="565" width="22" height="28" rx="0" fill="var(--color-accent)" stroke="none" stroke-width="1"/><rect x="415" y="565" width="22" height="28" rx="0" fill="var(--color-accent)" stroke="none" stroke-width="1"/><rect x="445" y="565" width="22" height="28" rx="0" fill="var(--color-accent)" stroke="none" stroke-width="1"/><rect x="475" y="565" width="22" height="28" rx="0" fill="var(--color-accent)" stroke="none" stroke-width="1"/><rect x="505" y="565" width="22" height="28" rx="0" fill="var(--color-accent)" stroke="none" stroke-width="1"/><rect x="535" y="565" width="22" height="28" rx="0" fill="var(--color-accent)" stroke="none" stroke-width="1"/><rect x="565" y="565" width="22" height="28" rx="0" fill="var(--color-accent)" stroke="none" stroke-width="1"/><rect x="595" y="565" width="22" height="28" rx="0" fill="var(--color-accent)" stroke="none" stroke-width="1"/><rect x="625" y="565" width="22" height="28" rx="0" fill="var(--color-accent)" stroke="none" stroke-width="1"/><rect x="655" y="565" width="22" height="28" rx="0" fill="var(--color-surface-2)" stroke="none" stroke-width="1"/><rect x="685" y="565" width="22" height="28" rx="0" fill="var(--color-surface-2)" stroke="none" stroke-width="1"/><rect x="715" y="565" width="22" height="28" rx="0" fill="var(--color-surface-2)" stroke="none" stroke-width="1"/><rect x="745" y="565" width="22" height="28" rx="0" fill="var(--color-surface-2)" stroke="none" stroke-width="1"/><rect x="775" y="565" width="22" height="28" rx="0" fill="var(--color-surface-2)" stroke="none" stroke-width="1"/><rect x="805" y="565" width="22" height="28" rx="0" fill="var(--color-surface-2)" stroke="none" stroke-width="1"/><rect x="835" y="565" width="22" height="28" rx="0" fill="var(--color-surface-2)" stroke="none" 