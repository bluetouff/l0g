<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tempo-fr-evaluation-d-title tempo-fr-evaluation-d-desc" viewBox="0 0 1000 700" style="width:100%;height:auto" class="l0g-tempo-red-days-svg"><title id="tempo-fr-evaluation-d-title">Les résultats des évaluations RTE</title><desc id="tempo-fr-evaluation-d-desc">Deux exercices distincts rapportés par la CRE. Sur quatre hivers rétrospectifs, efficacité moyenne de 95 % pour l’ancien Tempo contre 94 % pour PP : ratio de demande résiduelle des jours sélectionnés sur une référence de 22 jours. Maximum observé de jours d’apurement : 13 contre 3. Sur 1 400 scénarios prospectifs, 90 % dépassent 93 % d’efficacité ; séparément, 90 % comptent moins de trois jours d’apurement. La part commune aux deux groupes et une garantie future restent indéterminées.</desc><rect id="tempo-fr-evaluation-d-frame" x="0" y="0" width="1000" height="700" rx="0" fill="var(--color-ink)" stroke="none" stroke-width="1"/><text data-panel="tempo-fr-evaluation-d-frame" x="40" y="42" fill="var(--color-signal)" font-family="l0g Tempo" font-size="22" font-weight="700" text-anchor="start">l0g / TEMPO</text><text data-panel="tempo-fr-evaluation-d-frame" x="960" y="42" fill="var(--color-muted)" font-family="l0g Tempo" font-size="22" font-weight="400" text-anchor="end">04 / 07</text><text data-panel="tempo-fr-evaluation-d-frame" x="40" y="94" fill="var(--color-paper)" font-family="l0g Tempo" font-size="32" font-weight="700" text-anchor="start">Les résultats des évaluations RTE</text><text data-panel="tempo-fr-evaluation-d-frame" x="40" y="145" fill="var(--color-muted)" font-family="l0g Tempo" font-size="22" font-weight="400" text-anchor="start">Résultats RTE rapportés par la CRE · octobre 2026</text><text data-panel="tempo-fr-evaluation-d-frame" x="40" y="209" fill="var(--color-paper)" font-family="l0g Tempo" font-size="24" font-weight="700" text-anchor="start">4 HIVERS · RÉTROSPECTIF</text><text data-panel="tempo-fr-evaluation-d-frame" x="40" y="267" fill="var(--color-paper)" font-family="l0g Tempo" font-size="26" font-weight="700" text-anchor="start">Tempo</text><rect x="170" y="242" width="456.0" height="19" rx="0" fill="var(--color-signal)" stroke="none" stroke-width="1"/><text data-panel="tempo-fr-evaluation-d-frame" x="715" y="267" fill="var(--color-paper)" font-family="l0g Tempo" font-size="30" font-weight="700" text-anchor="start">95 %</text><text data-panel="tempo-fr-evaluation-d-frame" x="40" y="327" fill="var(--color-paper)" font-family="l0g Tempo" font-size="26" font-weight="700" text-anchor="start">PP</text><rect x="170" y="302" width="451.2" height="19" rx="0" fill="var(--color-amber)" stroke="none" stroke-width="1"/><text data-panel="tempo-fr-evaluation-d-frame" x="715" y="327" fill="var(--color-paper)" font-family="l0g Tempo" font-size="30" font-weight="700" text-anchor="start">94 %</text><text data-panel="tempo-fr-evaluation-d-frame" x="40" y="395" fill="var(--color-accent)" font-family="l0g Tempo" font-size="28" font-weight="700" text-anchor="start">Apurement : maximum 13 → 3 jours</text><text data-panel="tempo-fr-evaluation-d-frame" x="40" y="471" fill="var(--color-paper)" font-family="l0g Tempo" font-size="24" font-weight="700" text-anchor="start">1 400 SCÉNARIOS · PROSPECTIF</text><text data-panel="tempo-fr-evaluation-d-frame" x="40" y="523" fill="var(--color-signal)" font-family="l0g Tempo" font-size="28" font-weight="700" text-anchor="start">90 % : efficacité &gt; 93 %</text><text data-panel="tempo-fr-evaluation-d-frame" x="525" y="523" fill="var(--color-amber)" font-family="l0g Tempo" font-size="26" font-weight="700" text-anchor="start">90 % : apurement &lt; 3 jours</text><text data-panel="tempo-fr-evaluation-d-frame" x="40" y="587" fill="var(--color-muted)" font-family="l0g Tempo" font-size="24" font-weight="400" text-anchor="start">Parts séparées ; leur intersection reste indéterminée.</text><line x1="40" y1="638" x2="960" y2="638" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="tempo-fr-evaluation-d-frame" x="40" y="669" fill="var(--color-muted)" font-family="l0g Tempo" font-size="22" font-weight="400" text-anchor="start">G01 | Évaluations RTE</text></svg>
