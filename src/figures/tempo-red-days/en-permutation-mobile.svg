<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tempo-en-permutation-m-title tempo-en-permutation-m-desc" viewBox="0 0 420 800" style="width:100%;height:auto" class="l0g-tempo-red-days-svg"><title id="tempo-en-permutation-m-title">The red day’s date changes the bill</title><desc id="tempo-en-permutation-m-desc">Two eligible fictional working days, with peak volumes fixed before colour: A, 8 kWh; B, 20 kWh. Red A and blue B: 5.8360 + 3.3080 = 9.1440 euros. Blue A and red B: 1.3232 + 14.5900 = 15.9132 euros. Difference: 6.7692 euros, or (20 − 8) × (0.7295 − 0.1654). Same 28 kWh, one red day in the pair and 21 other annual red days unchanged. Other consumption and subscription are excluded.</desc><rect id="tempo-en-permutation-m-frame" x="0" y="0" width="420" height="800" rx="0" fill="var(--color-ink)" stroke="none" stroke-width="1"/><text data-panel="tempo-en-permutation-m-frame" x="22" y="35" fill="var(--color-signal)" font-family="l0g Tempo" font-size="17" font-weight="700" text-anchor="start">l0g / TEMPO</text><text data-panel="tempo-en-permutation-m-frame" x="398" y="35" fill="var(--color-muted)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="end">06 / 07</text><text data-panel="tempo-en-permutation-m-frame" x="22" y="76" fill="var(--color-paper)" font-family="l0g Tempo" font-size="25" font-weight="700" text-anchor="start">The red day’s date changes</text><text data-panel="tempo-en-permutation-m-frame" x="22" y="107" fill="var(--color-paper)" font-family="l0g Tempo" font-size="25" font-weight="700" text-anchor="start">the bill</text><text data-panel="tempo-en-permutation-m-frame" x="22" y="147" fill="var(--color-muted)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="start">Fictional swap · 28 peak kWh · prices</text><text data-panel="tempo-en-permutation-m-frame" x="22" y="170" fill="var(--color-muted)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="start">at 1 Aug 2026</text><text data-panel="tempo-en-permutation-m-frame" x="28" y="207" fill="var(--color-muted)" font-family="l0g Tempo" font-size="19" font-weight="400" text-anchor="start">A : 8 kWh  ·  B : 20 kWh</text><text data-panel="tempo-en-permutation-m-frame" x="28" y="235" fill="var(--color-muted)" font-family="l0g Tempo" font-size="19" font-weight="400" text-anchor="start">One red day in the pair</text><text data-panel="tempo-en-permutation-m-frame" x="28" y="304" fill="var(--color-accent)" font-family="l0g Tempo" font-size="22" font-weight="700" text-anchor="start">Red A + blue B</text><text data-panel="tempo-en-permutation-m-frame" x="28" y="341" fill="var(--color-paper)" font-family="l0g Tempo" font-size="19" font-weight="400" text-anchor="start">5.8360 + 3.3080 = €9.1440</text><rect x="28" y="366" width="208.026" height="18" rx="0" fill="var(--color-signal)" stroke="none" stroke-width="1"/><text data-panel="tempo-en-permutation-m-frame" x="28" y="438" fill="var(--color-accent)" font-family="l0g Tempo" font-size="22" font-weight="700" text-anchor="start">Blue A + red B</text><text data-panel="tempo-en-permutation-m-frame" x="28" y="475" fill="var(--color-paper)" font-family="l0g Tempo" font-size="19" font-weight="400" text-anchor="start">1.3232 + 14.5900 = €15.9132</text><rect x="28" y="500" width="362.0253" height="18" rx="0" fill="var(--color-accent)" stroke="none" stroke-width="1"/><text data-panel="tempo-en-permutation-m-frame" x="28" y="585" fill="var(--color-amber)" font-family="l0g Tempo" font-size="29" font-weight="700" text-anchor="start">Difference: + €6.7692</text><text data-panel="tempo-en-permutation-m-frame" x="28" y="634" fill="var(--color-muted)" font-family="l0g Tempo" font-size="18" font-weight="400" text-anchor="start">(20 − 8) × (0.7295 − 0.1654)</text><text data-panel="tempo-en-permutation-m-frame" x="28" y="665" fill="var(--color-muted)" font-family="l0g Tempo" font-size="18" font-weight="400" text-anchor="start">21 other red days unchanged</text><line x1="22" y1="738" x2="398" y2="738" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="tempo-en-permutation-m-frame" x="22" y="769" fill="var(--color-muted)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="start">T01 | EDF prices, tax included</text></svg>
