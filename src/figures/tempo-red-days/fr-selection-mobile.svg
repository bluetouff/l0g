<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tempo-fr-selection-m-title tempo-fr-selection-m-desc" viewBox="0 0 420 800" style="width:100%;height:auto" class="l0g-tempo-red-days-svg"><title id="tempo-fr-selection-m-title">Le stock influe sur le signal</title><desc id="tempo-fr-selection-m-desc">Schéma simplifié de la méthode antérieure au 1er novembre 2026. La demande résiduelle, obtenue en retranchant les productions éolienne et photovoltaïque à la demande nationale, est normalisée. La prévision, la date et le stock restant interviennent dans la sélection. Le franchissement du seuil ou une contrainte d’apurement peuvent conduire au rouge, sous réserve du calendrier éligible. Chaque rouge diminue le stock d’une unité. La CRE rapporte 13 des 22 rouges annuels dans une séquence de mars 2026, week-ends exclus. Les cases représentent un nombre, sans dates individuelles.</desc><rect id="tempo-fr-selection-m-frame" x="0" y="0" width="420" height="800" rx="0" fill="var(--color-ink)" stroke="none" stroke-width="1"/><text data-panel="tempo-fr-selection-m-frame" x="22" y="35" fill="var(--color-signal)" font-family="l0g Tempo" font-size="17" font-weight="700" text-anchor="start">l0g / TEMPO</text><text data-panel="tempo-fr-selection-m-frame" x="398" y="35" fill="var(--color-muted)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="end">01 / 07</text><text data-panel="tempo-fr-selection-m-frame" x="22" y="76" fill="var(--color-paper)" font-family="l0g Tempo" font-size="25" font-weight="700" text-anchor="start">Le stock influe sur le</text><text data-panel="tempo-fr-selection-m-frame" x="22" y="107" fill="var(--color-paper)" font-family="l0g Tempo" font-size="25" font-weight="700" text-anchor="start">signal</text><text data-panel="tempo-fr-selection-m-frame" x="22" y="147" fill="var(--color-muted)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="start">Ancienne méthode · jusqu’au</text><text data-panel="tempo-fr-selection-m-frame" x="22" y="170" fill="var(--color-muted)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="start">31.10.2026</text><text data-panel="tempo-fr-selection-m-frame" x="28" y="205" fill="var(--color-signal)" font-family="l0g Tempo" font-size="21" font-weight="700" text-anchor="start">Prévision : demande</text><text data-panel="tempo-fr-selection-m-frame" x="28" y="233" fill="var(--color-signal)" font-family="l0g Tempo" font-size="21" font-weight="700" text-anchor="start">− éolien − solaire</text><text data-panel="tempo-fr-selection-m-frame" x="28" y="283" fill="var(--color-amber)" font-family="l0g Tempo" font-size="21" font-weight="700" text-anchor="start">Date + stock restant</text><line x1="210" y1="309" x2="210" y2="345" stroke="var(--color-signal)" stroke-width="3"/><path d="M 204 336 L 210 345 L 216 336" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="tempo-fr-selection-m-frame" x="210" y="379" fill="var(--color-paper)" font-family="l0g Tempo" font-size="19" font-weight="700" text-anchor="middle">Seuil franchi OU apurement</text><line x1="210" y1="401" x2="210" y2="436" stroke="var(--color-signal)" stroke-width="3"/><path d="M 204 427 L 210 436 L 216 427" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="tempo-fr-selection-m-frame" x="210" y="471" fill="var(--color-accent)" font-family="l0g Tempo" font-size="21" font-weight="700" text-anchor="middle">Jour éligible → ROUGE</text><text data-panel="tempo-fr-selection-m-frame" x="210" y="503" fill="var(--color-accent)" font-family="l0g Tempo" font-size="21" font-weight="700" text-anchor="middle">Stock : S → S − 1</text><text data-panel="tempo-fr-selection-m-frame" x="28" y="568" fill="var(--color-muted)" font-family="l0g Tempo" font-size="18" font-weight="700" text-anchor="start">MARS 2026</text><text data-panel="tempo-fr-selection-m-frame" x="28" y="607" fill="var(--color-accent)" font-family="l0g Tempo" font-size="32" font-weight="700" text-anchor="start">13 / 22</text><text data-panel="tempo-fr-selection-m-frame" x="162" y="595" fill="var(--color-paper)" font-family="l0g Tempo" font-size="18" font-weight="400" text-anchor="start">rouges annuels</text><text data-panel="tempo-fr-selection-m-frame" x="162" y="620" fill="var(--color-paper)" font-family="l0g Tempo" font-size="18" font-weight="400" text-anchor="start">dans la séquence</text><rect x="28" y="640" width="25" height="21" rx="0" fill="var(--color-accent)" stroke="none" stroke-width="1"/><rect x="61" y="640" width="25" height="21" rx="0" fill="var(--color-accent)" stroke="none" stroke-width="1"/><rect x="94" y="640" width="25" height="21" rx="0" fill="var(--color-accent)" stroke="none" stroke-width="1"/><rect x="127" y="640" width="25" height="21" rx="0" fill="var(--color-accent)" stroke="none" stroke-width="1"/><rect x="160" y="640" width="25" height="21" rx="0" fill="var(--color-accent)" stroke="none" stroke-width="1"/><rect x="193" y="640" width="25" height="21" rx="0" fill="var(--color-accent)" stroke="none" stroke-width="1"/><rect x="226" y="640" width="25" height="21" rx="0" fill="var(--color-accent)" stroke="none" stroke-width="1"/><rect x="259" y="640" width="25" height="21" rx="0" fill="var(--color-accent)" stroke="none" stroke-width="1"/><rect x="292" y="640" width="25" height="21" rx="0" fill="var(--color-accent)" stroke="none" stroke-width="1"/><rect x="325" y="640" width="25" height="21" rx="0" fill="var(--color-accent)" stroke="none" stroke-width="1"/><rect x="358" y="640" width="25" height="21" rx="0" fill="var(--color-accent)" stroke="none" stroke-width="1"/><rect x="28" y="673" width="25" height="21" rx="0" fill="var(--color-accent)" stroke="none" stroke-width="1"/><rect x="61" y="673" width="25" height="21" rx="0" fill="var(--color-accent)" stroke="none" stroke-width="1"/><rect x="94" y="673" width="25" height="21" rx="0" fill="var(--color-surface-2)" stroke="none" stroke-width="1"/><rect x="127" y="673" width="25" height="21" rx="0" fill="var(--color-surface-2)" stroke="none" stroke-width="1"/><rect x="160" y="673" width="25" height="21" rx="0" fill="var(--color-surface-2)" stroke="none" stroke-width="1"/><rect x="193" y="673" width="25" height="21" rx="0" fill="var(--color-surface-2)" stroke="none" stroke-width="1"/><rect x="226" y="673" width="25" height="21" rx="0" fill="var(--color-surface-2)" stroke="none" stroke-width="1"/><rect x="259" y="673" width="25" height="21" rx="0" fill="var(--color-surface-2)" stroke="none" stroke-width="1"/><rect x="292" y="673" width="25" height="21" rx="0" fill="var(--color-surface-2)" stroke="none" stroke-width="1"/><rect x="325" y="673" width="25" height="21" rx="0" fill="var(--color-surface-2)" stroke="none" stroke-width="1"/><rect x="358" y="673" width="25" height="21" rx="0" fill="var(--color-surface-2)" stroke="none" stroke-width="1"/><line x1="22" y1="738" x2="398" y2="738" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="tempo-fr-selection-m-frame" x="22" y="769" fill="var(--color-muted)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="start">G04 · G01 | Mars 2026</text></svg>
