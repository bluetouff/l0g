<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tempo-en-profiles-m-title tempo-en-profiles-m-desc" viewBox="0 0 420 800" style="width:100%;height:auto" class="l0g-tempo-red-days-svg"><title id="tempo-en-profiles-m-title">Mean and peak rank days differently</title><desc id="tempo-en-profiles-m-desc">Two entirely fictional profiles on a shared 24-hour frame. A has 12 hours at 70 GW and 12 at 50 GW: mean 60 GW, maximum 70 GW. B has one hour at 85 GW and 23 at 45 GW: mean 46.6667 GW, maximum 85 GW. A ranks higher by mean; B ranks higher by peak. This illustration isolates two statistics without reproducing the full algorithm or operational PP maximum window.</desc><rect id="tempo-en-profiles-m-frame" x="0" y="0" width="420" height="800" rx="0" fill="var(--color-ink)" stroke="none" stroke-width="1"/><text data-panel="tempo-en-profiles-m-frame" x="22" y="35" fill="var(--color-signal)" font-family="l0g Tempo" font-size="17" font-weight="700" text-anchor="start">l0g / TEMPO</text><text data-panel="tempo-en-profiles-m-frame" x="398" y="35" fill="var(--color-muted)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="end">02 / 07</text><text data-panel="tempo-en-profiles-m-frame" x="22" y="76" fill="var(--color-paper)" font-family="l0g Tempo" font-size="25" font-weight="700" text-anchor="start">Mean and peak rank days</text><text data-panel="tempo-en-profiles-m-frame" x="22" y="107" fill="var(--color-paper)" font-family="l0g Tempo" font-size="25" font-weight="700" text-anchor="start">differently</text><text data-panel="tempo-en-profiles-m-frame" x="22" y="147" fill="var(--color-muted)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="start">Fictional profiles · 24 hours ·</text><text data-panel="tempo-en-profiles-m-frame" x="22" y="170" fill="var(--color-muted)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="start">gigawatts</text><line x1="55" y1="420.0" x2="386" y2="420.0" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="tempo-en-profiles-m-frame" x="45" y="426.0" fill="var(--color-muted)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="end">0</text><line x1="55" y1="320.0" x2="386" y2="320.0" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="tempo-en-profiles-m-frame" x="45" y="326.0" fill="var(--color-muted)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="end">50</text><line x1="55" y1="220.0" x2="386" y2="220.0" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="tempo-en-profiles-m-frame" x="45" y="226.0" fill="var(--color-muted)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="end">100</text><text data-panel="tempo-en-profiles-m-frame" x="55.0" y="448" fill="var(--color-muted)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="middle">0</text><text data-panel="tempo-en-profiles-m-frame" x="220.5" y="448" fill="var(--color-muted)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="middle">12</text><text data-panel="tempo-en-profiles-m-frame" x="386.0" y="448" fill="var(--color-muted)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="middle">24</text><path d="M 55.0 280.0 L 220.5 280.0 L 220.5 320.0 L 386.0 320.0" fill="none" stroke="var(--color-signal)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 55.0 330.0 L 303.25 330.0 L 303.25 250.0 L 317.041667 250.0 L 317.041667 330.0 L 386.0 330.0" fill="none" stroke="var(--color-amber)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="tempo-en-profiles-m-frame" x="123.958333" y="265.0" fill="var(--color-signal)" font-family="l0g Tempo" font-size="19" font-weight="700" text-anchor="middle">A · 70</text><text data-panel="tempo-en-profiles-m-frame" x="261.875" y="265.0" fill="var(--color-amber)" font-family="l0g Tempo" font-size="19" font-weight="700" text-anchor="middle">B · 85</text><text data-panel="tempo-en-profiles-m-frame" x="28" y="490" fill="var(--color-muted)" font-family="l0g Tempo" font-size="18" font-weight="700" text-anchor="start">MEAN · GW</text><text data-panel="tempo-en-profiles-m-frame" x="28" y="527" fill="var(--color-signal)" font-family="l0g Tempo" font-size="23" font-weight="700" text-anchor="start">A: 60  &gt;  B: 46.6667</text><text data-panel="tempo-en-profiles-m-frame" x="28" y="583" fill="var(--color-muted)" font-family="l0g Tempo" font-size="18" font-weight="700" text-anchor="start">PEAK · GW</text><text data-panel="tempo-en-profiles-m-frame" x="28" y="620" fill="var(--color-amber)" font-family="l0g Tempo" font-size="23" font-weight="700" text-anchor="start">B: 85  &gt;  A: 70</text><text data-panel="tempo-en-profiles-m-frame" x="28" y="677" fill="var(--color-paper)" font-family="l0g Tempo" font-size="18" font-weight="400" text-anchor="start">A : 12 h × 70 + 12 h × 50</text><text data-panel="tempo-en-profiles-m-frame" x="28" y="704" fill="var(--color-paper)" font-family="l0g Tempo" font-size="18" font-weight="400" text-anchor="start">B : 1 h × 85 + 23 h × 45</text><line x1="22" y1="738" x2="398" y2="738" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="tempo-en-profiles-m-frame" x="22" y="769" fill="var(--color-muted)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="start">G04 · R02 | Fictional profiles</text></svg>
