<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tempo-en-evaluation-d-title tempo-en-evaluation-d-desc" viewBox="0 0 1000 700" style="width:100%;height:auto" class="l0g-tempo-red-days-svg"><title id="tempo-en-evaluation-d-title">Results from RTE’s assessments</title><desc id="tempo-en-evaluation-d-desc">Two separate assessments reported by CRE. Across four retrospective winters, mean efficiency was 95% for old Tempo versus 94% for PP: residual demand on selected days relative to a 22-day reference. Maximum observed clearing days: 13 versus 3. In 1,400 prospective scenarios, 90% exceeded 93% efficiency; separately, 90% had fewer than three clearing days. Their joint share and a future guarantee remain undetermined.</desc><rect id="tempo-en-evaluation-d-frame" x="0" y="0" width="1000" height="700" rx="0" fill="var(--color-ink)" stroke="none" stroke-width="1"/><text data-panel="tempo-en-evaluation-d-frame" x="40" y="42" fill="var(--color-signal)" font-family="l0g Tempo" font-size="22" font-weight="700" text-anchor="start">l0g / TEMPO</text><text data-panel="tempo-en-evaluation-d-frame" x="960" y="42" fill="var(--color-muted)" font-family="l0g Tempo" font-size="22" font-weight="400" text-anchor="end">04 / 07</text><text data-panel="tempo-en-evaluation-d-frame" x="40" y="94" fill="var(--color-paper)" font-family="l0g Tempo" font-size="32" font-weight="700" text-anchor="start">Results from RTE’s assessments</text><text data-panel="tempo-en-evaluation-d-frame" x="40" y="145" fill="var(--color-muted)" font-family="l0g Tempo" font-size="22" font-weight="400" text-anchor="start">RTE results reported by CRE · October 2026</text><text data-panel="tempo-en-evaluation-d-frame" x="40" y="209" fill="var(--color-paper)" font-family="l0g Tempo" font-size="24" font-weight="700" text-anchor="start">4 WINTERS · RETROSPECTIVE</text><text data-panel="tempo-en-evaluation-d-frame" x="40" y="267" fill="var(--color-paper)" font-family="l0g Tempo" font-size="26" font-weight="700" text-anchor="start">Tempo</text><rect x="170" y="242" width="456.0" height="19" rx="0" fill="var(--color-signal)" stroke="none" stroke-width="1"/><text data-panel="tempo-en-evaluation-d-frame" x="715" y="267" fill="var(--color-paper)" font-family="l0g Tempo" font-size="30" font-weight="700" text-anchor="start">95 %</text><text data-panel="tempo-en-evaluation-d-frame" x="40" y="327" fill="var(--color-paper)" font-family="l0g Tempo" font-size="26" font-weight="700" text-anchor="start">PP</text><rect x="170" y="302" width="451.2" height="19" rx="0" fill="var(--color-amber)" stroke="none" stroke-width="1"/><text data-panel="tempo-en-evaluation-d-frame" x="715" y="327" fill="var(--color-paper)" font-family="l0g Tempo" font-size="30" font-weight="700" text-anchor="start">94 %</text><text data-panel="tempo-en-evaluation-d-frame" x="40" y="395" fill="var(--color-accent)" font-family="l0g Tempo" font-size="28" font-weight="700" text-anchor="start">Clearing: maximum 13 → 3 days</text><text data-panel="tempo-en-evaluation-d-frame" x="40" y="471" fill="var(--color-paper)" font-family="l0g Tempo" font-size="24" font-weight="700" text-anchor="start">1,400 SCENARIOS · PROSPECTIVE</text><text data-panel="tempo-en-evaluation-d-frame" x="40" y="523" fill="var(--color-signal)" font-family="l0g Tempo" font-size="28" font-weight="700" text-anchor="start">90%: efficiency &gt; 93%</text><text data-panel="tempo-en-evaluation-d-frame" x="525" y="523" fill="var(--color-amber)" font-family="l0g Tempo" font-size="26" font-weight="700" text-anchor="start">90%: clearing &lt; 3 days</text><text data-panel="tempo-en-evaluation-d-frame" x="40" y="587" fill="var(--color-muted)" font-family="l0g Tempo" font-size="24" font-weight="400" text-anchor="start">Separate shares; their intersection remains undetermined.</text><line x1="40" y1="638" x2="960" y2="638" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="tempo-en-evaluation-d-frame" x="40" y="669" fill="var(--color-muted)" font-family="l0g Tempo" font-size="22" font-weight="400" text-anchor="start">G01 | RTE assessments</text></svg>
