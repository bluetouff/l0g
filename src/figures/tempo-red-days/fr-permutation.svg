<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tempo-fr-permutation-d-title tempo-fr-permutation-d-desc" viewBox="0 0 1000 700" style="width:100%;height:auto" class="l0g-tempo-red-days-svg"><title id="tempo-fr-permutation-d-title">La date du rouge change le montant</title><desc id="tempo-fr-permutation-d-desc">Deux jours ouvrés fictifs éligibles, volumes en heures pleines fixés avant la couleur : A, 8 kWh ; B, 20 kWh. Rouge sur A et bleu sur B : 5,8360 + 3,3080 = 9,1440 euros. Bleu sur A et rouge sur B : 1,3232 + 14,5900 = 15,9132 euros. Écart : 6,7692 euros, soit (20 − 8) × (0,7295 − 0,1654). Même volume de 28 kWh, un rouge dans la paire et 21 autres rouges annuels inchangés. Les autres consommations et l’abonnement restent hors cadre.</desc><rect id="tempo-fr-permutation-d-frame" x="0" y="0" width="1000" height="700" rx="0" fill="var(--color-ink)" stroke="none" stroke-width="1"/><text data-panel="tempo-fr-permutation-d-frame" x="40" y="42" fill="var(--color-signal)" font-family="l0g Tempo" font-size="22" font-weight="700" text-anchor="start">l0g / TEMPO</text><text data-panel="tempo-fr-permutation-d-frame" x="960" y="42" fill="var(--color-muted)" font-family="l0g Tempo" font-size="22" font-weight="400" text-anchor="end">06 / 07</text><text data-panel="tempo-fr-permutation-d-frame" x="40" y="94" fill="var(--color-paper)" font-family="l0g Tempo" font-size="32" font-weight="700" text-anchor="start">La date du rouge change le montant</text><text data-panel="tempo-fr-permutation-d-frame" x="40" y="145" fill="var(--color-muted)" font-family="l0g Tempo" font-size="22" font-weight="400" text-anchor="start">Permutation fictive · 28 kWh HP · prix au 01.08.2026</text><text data-panel="tempo-fr-permutation-d-frame" x="40" y="214" fill="var(--color-muted)" font-family="l0g Tempo" font-size="25" font-weight="400" text-anchor="start">A : 8 kWh  ·  B : 20 kWh  ·  1 rouge dans la paire</text><text data-panel="tempo-fr-permutation-d-frame" x="40" y="286" fill="var(--color-paper)" font-family="l0g Tempo" font-size="27" font-weight="700" text-anchor="start">A rouge + B bleu</text><text data-panel="tempo-fr-permutation-d-frame" x="40" y="329" fill="var(--color-muted)" font-family="l0g Tempo" font-size="25" font-weight="400" text-anchor="start">5,8360 + 3,3080</text><rect x="400" y="268" width="297.18" height="22" rx="0" fill="var(--color-signal)" stroke="none" stroke-width="1"/><text data-panel="tempo-fr-permutation-d-frame" x="940" y="329" fill="var(--color-signal)" font-family="l0g Tempo" font-size="30" font-weight="700" text-anchor="end">9,1440 €</text><text data-panel="tempo-fr-permutation-d-frame" x="40" y="408" fill="var(--color-paper)" font-family="l0g Tempo" font-size="27" font-weight="700" text-anchor="start">A bleu + B rouge</text><text data-panel="tempo-fr-permutation-d-frame" x="40" y="451" fill="var(--color-muted)" font-family="l0g Tempo" font-size="25" font-weight="400" text-anchor="start">1,3232 + 14,5900</text><rect x="400" y="390" width="517.179" height="22" rx="0" fill="var(--color-accent)" stroke="none" stroke-width="1"/><text data-panel="tempo-fr-permutation-d-frame" x="940" y="451" fill="var(--color-accent)" font-family="l0g Tempo" font-size="30" font-weight="700" text-anchor="end">15,9132 €</text><text data-panel="tempo-fr-permutation-d-frame" x="40" y="539" fill="var(--color-amber)" font-family="l0g Tempo" font-size="36" font-weight="700" text-anchor="start">Écart : + 6,7692 €</text><text data-panel="tempo-fr-permutation-d-frame" x="40" y="590" fill="var(--color-muted)" font-family="l0g Tempo" font-size="24" font-weight="400" text-anchor="start">(20 − 8) × (0,7295 − 0,1654) · 21 autres rouges inchangés</text><line x1="40" y1="638" x2="960" y2="638" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="tempo-fr-permutation-d-frame" x="40" y="669" fill="var(--color-muted)" font-family="l0g Tempo" font-size="22" font-weight="400" text-anchor="start">T01 | Prix EDF, TTC</text></svg>
