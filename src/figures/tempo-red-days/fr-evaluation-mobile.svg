<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tempo-fr-evaluation-m-title tempo-fr-evaluation-m-desc" viewBox="0 0 420 800" style="width:100%;height:auto" class="l0g-tempo-red-days-svg"><title id="tempo-fr-evaluation-m-title">Les résultats des évaluations RTE</title><desc id="tempo-fr-evaluation-m-desc">Deux exercices distincts rapportés par la CRE. Sur quatre hivers rétrospectifs, efficacité moyenne de 95 % pour l’ancien Tempo contre 94 % pour PP : ratio de demande résiduelle des jours sélectionnés sur une référence de 22 jours. Maximum observé de jours d’apurement : 13 contre 3. Sur 1 400 scénarios prospectifs, 90 % dépassent 93 % d’efficacité ; séparément, 90 % comptent moins de trois jours d’apurement. La part commune aux deux groupes et une garantie future restent indéterminées.</desc><rect id="tempo-fr-evaluation-m-frame" x="0" y="0" width="420" height="800" rx="0" fill="var(--color-ink)" stroke="none" stroke-width="1"/><text data-panel="tempo-fr-evaluation-m-frame" x="22" y="35" fill="var(--color-signal)" font-family="l0g Tempo" font-size="17" font-weight="700" text-anchor="start">l0g / TEMPO</text><text data-panel="tempo-fr-evaluation-m-frame" x="398" y="35" fill="var(--color-muted)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="end">04 / 07</text><text data-panel="tempo-fr-evaluation-m-frame" x="22" y="76" fill="var(--color-paper)" font-family="l0g Tempo" font-size="25" font-weight="700" text-anchor="start">Les résultats des</text><text data-panel="tempo-fr-evaluation-m-frame" x="22" y="107" fill="var(--color-paper)" font-family="l0g Tempo" font-size="25" font-weight="700" text-anchor="start">évaluations RTE</text><text data-panel="tempo-fr-evaluation-m-frame" x="22" y="147" fill="var(--color-muted)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="start">Résultats RTE rapportés par la CRE ·</text><text data-panel="tempo-fr-evaluation-m-frame" x="22" y="170" fill="var(--color-muted)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="start">octobre 2026</text><text data-panel="tempo-fr-evaluation-m-frame" x="28" y="207" fill="var(--color-paper)" font-family="l0g Tempo" font-size="18" font-weight="700" text-anchor="start">4 HIVERS · RÉTROSPECTIF</text><text data-panel="tempo-fr-evaluation-m-frame" x="28" y="250" fill="var(--color-muted)" font-family="l0g Tempo" font-size="18" font-weight="400" text-anchor="start">Efficacité moyenne</text><text data-panel="tempo-fr-evaluation-m-frame" x="28" y="291" fill="var(--color-paper)" font-family="l0g Tempo" font-size="20" font-weight="700" text-anchor="start">Tempo</text><rect x="140" y="271" width="228.0" height="13" rx="0" fill="var(--color-signal)" stroke="none" stroke-width="1"/><text data-panel="tempo-fr-evaluation-m-frame" x="380" y="310" fill="var(--color-paper)" font-family="l0g Tempo" font-size="18" font-weight="700" text-anchor="end">95 %</text><text data-panel="tempo-fr-evaluation-m-frame" x="28" y="335" fill="var(--color-paper)" font-family="l0g Tempo" font-size="20" font-weight="700" text-anchor="start">PP</text><rect x="140" y="315" width="225.6" height="13" rx="0" fill="var(--color-amber)" stroke="none" stroke-width="1"/><text data-panel="tempo-fr-evaluation-m-frame" x="380" y="354" fill="var(--color-paper)" font-family="l0g Tempo" font-size="18" font-weight="700" text-anchor="end">94 %</text><text data-panel="tempo-fr-evaluation-m-frame" x="28" y="402" fill="var(--color-muted)" font-family="l0g Tempo" font-size="18" font-weight="400" text-anchor="start">Apurement : maximum observé</text><text data-panel="tempo-fr-evaluation-m-frame" x="28" y="443" fill="var(--color-accent)" font-family="l0g Tempo" font-size="27" font-weight="700" text-anchor="start">Tempo : 13 → PP : 3</text><text data-panel="tempo-fr-evaluation-m-frame" x="28" y="515" fill="var(--color-paper)" font-family="l0g Tempo" font-size="18" font-weight="700" text-anchor="start">1 400 SCÉNARIOS · PROSPECTIF</text><text data-panel="tempo-fr-evaluation-m-frame" x="28" y="562" fill="var(--color-signal)" font-family="l0g Tempo" font-size="20" font-weight="700" text-anchor="start">90 % : efficacité &gt; 93 %</text><text data-panel="tempo-fr-evaluation-m-frame" x="28" y="605" fill="var(--color-signal)" font-family="l0g Tempo" font-size="20" font-weight="700" text-anchor="start">90 % : apurement &lt; 3 jours</text><text data-panel="tempo-fr-evaluation-m-frame" x="28" y="662" fill="var(--color-muted)" font-family="l0g Tempo" font-size="18" font-weight="400" text-anchor="start">Deux parts mesurées séparément.</text><text data-panel="tempo-fr-evaluation-m-frame" x="28" y="688" fill="var(--color-muted)" font-family="l0g Tempo" font-size="18" font-weight="400" text-anchor="start">Part commune indéterminée.</text><line x1="22" y1="738" x2="398" y2="738" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="tempo-fr-evaluation-m-frame" x="22" y="769" fill="var(--color-muted)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="start">G01 | Évaluations RTE</text></svg>
