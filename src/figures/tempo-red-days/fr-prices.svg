<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tempo-fr-prices-d-title tempo-fr-prices-d-desc" viewBox="0 0 1000 700" style="width:100%;height:auto" class="l0g-tempo-red-days-svg"><title id="tempo-fr-prices-d-title">Six prix pour une même électricité</title><desc id="tempo-fr-prices-d-desc">Prix EDF Tempo, taxes comprises, au 1er août 2026 en euros par kilowattheure. Bleu : heures creuses 0,1356, heures pleines 0,1654. Blanc : 0,1536 et 0,1921. Rouge : 0,1615 et 0,7295. Les six barres partagent une échelle de zéro à 0,8 euro par kilowattheure. Journée tarifaire : heures pleines de 06:00 à 22:00 ; heures creuses de 22:00 à 06:00 le lendemain. Déplacer dix kilowattheures des heures pleines rouges vers les heures creuses rouges réduit la charge d’énergie de 5,68 euros, à volume compteur et abonnement constants.</desc><rect id="tempo-fr-prices-d-frame" x="0" y="0" width="1000" height="700" rx="0" fill="var(--color-ink)" stroke="none" stroke-width="1"/><text data-panel="tempo-fr-prices-d-frame" x="40" y="42" fill="var(--color-signal)" font-family="l0g Tempo" font-size="22" font-weight="700" text-anchor="start">l0g / TEMPO</text><text data-panel="tempo-fr-prices-d-frame" x="960" y="42" fill="var(--color-muted)" font-family="l0g Tempo" font-size="22" font-weight="400" text-anchor="end">05 / 07</text><text data-panel="tempo-fr-prices-d-frame" x="40" y="94" fill="var(--color-paper)" font-family="l0g Tempo" font-size="32" font-weight="700" text-anchor="start">Six prix pour une même électricité</text><text data-panel="tempo-fr-prices-d-frame" x="40" y="145" fill="var(--color-muted)" font-family="l0g Tempo" font-size="22" font-weight="400" text-anchor="start">EDF Tempo · TTC · 01.08.2026 · €/kWh</text><text data-panel="tempo-fr-prices-d-frame" x="40" y="210" fill="var(--color-paper)" font-family="l0g Tempo" font-size="24" font-weight="700" text-anchor="start">Bleu HC</text><rect x="230" y="194" width="97.4625" height="17" rx="0" fill="var(--color-signal)" stroke="none" stroke-width="1"/><text data-panel="tempo-fr-prices-d-frame" x="950" y="210" fill="var(--color-paper)" font-family="l0g Tempo" font-size="24" font-weight="400" text-anchor="end">0,1356</text><text data-panel="tempo-fr-prices-d-frame" x="40" y="256" fill="var(--color-paper)" font-family="l0g Tempo" font-size="24" font-weight="700" text-anchor="start">Bleu HP</text><rect x="230" y="240" width="118.88125" height="17" rx="0" fill="var(--color-signal)" stroke="none" stroke-width="1"/><text data-panel="tempo-fr-prices-d-frame" x="950" y="256" fill="var(--color-paper)" font-family="l0g Tempo" font-size="24" font-weight="400" text-anchor="end">0,1654</text><text data-panel="tempo-fr-prices-d-frame" x="40" y="302" fill="var(--color-paper)" font-family="l0g Tempo" font-size="24" font-weight="700" text-anchor="start">Blanc HC</text><rect x="230" y="286" width="110.4" height="17" rx="0" fill="var(--color-muted)" stroke="none" stroke-width="1"/><text data-panel="tempo-fr-prices-d-frame" x="950" y="302" fill="var(--color-paper)" font-family="l0g Tempo" font-size="24" font-weight="400" text-anchor="end">0,1536</text><text data-panel="tempo-fr-prices-d-frame" x="40" y="348" fill="var(--color-paper)" font-family="l0g Tempo" font-size="24" font-weight="700" text-anchor="start">Blanc HP</text><rect x="230" y="332" width="138.071875" height="17" rx="0" fill="var(--color-muted)" stroke="none" stroke-width="1"/><text data-panel="tempo-fr-prices-d-frame" x="950" y="348" fill="var(--color-paper)" font-family="l0g Tempo" font-size="24" font-weight="400" text-anchor="end">0,1921</text><text data-panel="tempo-fr-prices-d-frame" x="40" y="394" fill="var(--color-paper)" font-family="l0g Tempo" font-size="24" font-weight="700" text-anchor="start">Rouge HC</text><rect x="230" y="378" width="116.078125" height="17" rx="0" fill="var(--color-accent)" stroke="none" stroke-width="1"/><text data-panel="tempo-fr-prices-d-frame" x="950" y="394" fill="var(--color-paper)" font-family="l0g Tempo" font-size="24" font-weight="400" text-anchor="end">0,1615</text><text data-panel="tempo-fr-prices-d-frame" x="40" y="440" fill="var(--color-paper)" font-family="l0g Tempo" font-size="24" font-weight="700" text-anchor="start">Rouge HP</text><rect x="230" y="424" width="524.328125" height="17" rx="0" fill="var(--color-accent)" stroke="none" stroke-width="1"/><text data-panel="tempo-fr-prices-d-frame" x="950" y="440" fill="var(--color-paper)" font-family="l0g Tempo" font-size="24" font-weight="400" text-anchor="end">0,7295</text><text data-panel="tempo-fr-prices-d-frame" x="230.0" y="510" fill="var(--color-muted)" font-family="l0g Tempo" font-size="22" font-weight="400" text-anchor="middle">0</text><text data-panel="tempo-fr-prices-d-frame" x="517.5" y="510" fill="var(--color-muted)" font-family="l0g Tempo" font-size="22" font-weight="400" text-anchor="middle">0,4</text><text data-panel="tempo-fr-prices-d-frame" x="805.0" y="510" fill="var(--color-muted)" font-family="l0g Tempo" font-size="22" font-weight="400" text-anchor="middle">0,8</text><line x1="40" y1="540" x2="653.333333" y2="540" stroke="var(--color-accent)" stroke-width="9"/><line x1="653.333333" y1="540" x2="960" y2="540" stroke="var(--color-signal)" stroke-width="9"/><text data-panel="tempo-fr-prices-d-frame" x="40" y="572" fill="var(--color-muted)" font-family="l0g Tempo" font-size="22" font-weight="400" text-anchor="start">06:00</text><text data-panel="tempo-fr-prices-d-frame" x="653.333333" y="572" fill="var(--color-muted)" font-family="l0g Tempo" font-size="22" font-weight="400" text-anchor="middle">22:00</text><text data-panel="tempo-fr-prices-d-frame" x="960" y="572" fill="var(--color-muted)" font-family="l0g Tempo" font-size="22" font-weight="400" text-anchor="end">06:00</text><text data-panel="tempo-fr-prices-d-frame" x="40" y="620" fill="var(--color-signal)" font-family="l0g Tempo" font-size="28" font-weight="700" text-anchor="start">10 kWh : HP rouge → HC rouge = 5,68 €</text><line x1="40" y1="638" x2="960" y2="638" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="tempo-fr-prices-d-frame" x="40" y="669" fill="var(--color-muted)" font-family="l0g Tempo" font-size="22" font-weight="400" text-anchor="start">T01 · T07 | Volume compteur fixe</text></svg>
