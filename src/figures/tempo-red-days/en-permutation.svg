<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tempo-en-permutation-d-title tempo-en-permutation-d-desc" viewBox="0 0 1000 700" style="width:100%;height:auto" class="l0g-tempo-red-days-svg"><title id="tempo-en-permutation-d-title">The red day’s date changes the bill</title><desc id="tempo-en-permutation-d-desc">Two eligible fictional working days, with peak volumes fixed before colour: A, 8 kWh; B, 20 kWh. Red A and blue B: 5.8360 + 3.3080 = 9.1440 euros. Blue A and red B: 1.3232 + 14.5900 = 15.9132 euros. Difference: 6.7692 euros, or (20 − 8) × (0.7295 − 0.1654). Same 28 kWh, one red day in the pair and 21 other annual red days unchanged. Other consumption and subscription are excluded.</desc><rect id="tempo-en-permutation-d-frame" x="0" y="0" width="1000" height="700" rx="0" fill="var(--color-ink)" stroke="none" stroke-width="1"/><text data-panel="tempo-en-permutation-d-frame" x="40" y="42" fill="var(--color-signal)" font-family="l0g Tempo" font-size="22" font-weight="700" text-anchor="start">l0g / TEMPO</text><text data-panel="tempo-en-permutation-d-frame" x="960" y="42" fill="var(--color-muted)" font-family="l0g Tempo" font-size="22" font-weight="400" text-anchor="end">06 / 07</text><text data-panel="tempo-en-permutation-d-frame" x="40" y="94" fill="var(--color-paper)" font-family="l0g Tempo" font-size="32" font-weight="700" text-anchor="start">The red day’s date changes the bill</text><text data-panel="tempo-en-permutation-d-frame" x="40" y="145" fill="var(--color-muted)" font-family="l0g Tempo" font-size="22" font-weight="400" text-anchor="start">Fictional swap · 28 peak kWh · prices at 1 Aug 2026</text><text data-panel="tempo-en-permutation-d-frame" x="40" y="214" fill="var(--color-muted)" font-family="l0g Tempo" font-size="25" font-weight="400" text-anchor="start">A: 8 kWh  ·  B: 20 kWh  ·  1 red day in the pair</text><text data-panel="tempo-en-permutation-d-frame" x="40" y="286" fill="var(--color-paper)" font-family="l0g Tempo" font-size="27" font-weight="700" text-anchor="start">Red A + blue B</text><text data-panel="tempo-en-permutation-d-frame" x="40" y="329" fill="var(--color-muted)" font-family="l0g Tempo" font-size="25" font-weight="400" text-anchor="start">5.8360 + 3.3080</text><rect x="400" y="268" width="297.18" height="22" rx="0" fill="var(--color-signal)" stroke="none" stroke-width="1"/><text data-panel="tempo-en-permutation-d-frame" x="940" y="329" fill="var(--color-signal)" font-family="l0g Tempo" font-size="30" font-weight="700" text-anchor="end">€9.1440</text><text data-panel="tempo-en-permutation-d-frame" x="40" y="408" fill="var(--color-paper)" font-family="l0g Tempo" font-size="27" font-weight="700" text-anchor="start">Blue A + red B</text><text data-panel="tempo-en-permutation-d-frame" x="40" y="451" fill="var(--color-muted)" font-family="l0g Tempo" font-size="25" font-weight="400" text-anchor="start">1.3232 + 14.5900</text><rect x="400" y="390" width="517.179" height="22" rx="0" fill="var(--color-accent)" stroke="none" stroke-width="1"/><text data-panel="tempo-en-permutation-d-frame" x="940" y="451" fill="var(--color-accent)" font-family="l0g Tempo" font-size="30" font-weight="700" text-anchor="end">€15.9132</text><text data-panel="tempo-en-permutation-d-frame" x="40" y="539" fill="var(--color-amber)" font-family="l0g Tempo" font-size="36" font-weight="700" text-anchor="start">Difference: + €6.7692</text><text data-panel="tempo-en-permutation-d-frame" x="40" y="590" fill="var(--color-muted)" font-family="l0g Tempo" font-size="24" font-weight="400" text-anchor="start">(20 − 8) × (0.7295 − 0.1654) · 21 other red days unchanged</text><line x1="40" y1="638" x2="960" y2="638" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="tempo-en-permutation-d-frame" x="40" y="669" fill="var(--color-muted)" font-family="l0g Tempo" font-size="22" font-weight="400" text-anchor="start">T01 | EDF prices, tax included</text></svg>
