<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tempo-en-selection-m-title tempo-en-selection-m-desc" viewBox="0 0 420 800" style="width:100%;height:auto" class="l0g-tempo-red-days-svg"><title id="tempo-en-selection-m-title">Stock shapes the signal</title><desc id="tempo-en-selection-m-desc">Simplified method used before 1 November 2026. Residual demand is calculated by subtracting wind and solar generation from national demand, then normalised. The forecast, date and remaining stock shape selection. Threshold crossing or a stock-clearing constraint can lead to a red day, subject to eligible dates. Each red day reduces stock by one. CRE reports 13 of 22 annual red days in a March 2026 sequence excluding weekends. Boxes count days without assigning individual dates.</desc><rect id="tempo-en-selection-m-frame" x="0" y="0" width="420" height="800" rx="0" fill="var(--color-ink)" stroke="none" stroke-width="1"/><text data-panel="tempo-en-selection-m-frame" x="22" y="35" fill="var(--color-signal)" font-family="l0g Tempo" font-size="17" font-weight="700" text-anchor="start">l0g / TEMPO</text><text data-panel="tempo-en-selection-m-frame" x="398" y="35" fill="var(--color-muted)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="end">01 / 07</text><text data-panel="tempo-en-selection-m-frame" x="22" y="76" fill="var(--color-paper)" font-family="l0g Tempo" font-size="25" font-weight="700" text-anchor="start">Stock shapes the signal</text><text data-panel="tempo-en-selection-m-frame" x="22" y="116" fill="var(--color-muted)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="start">Previous method · through 31 Oct 2026</text><text data-panel="tempo-en-selection-m-frame" x="28" y="205" fill="var(--color-signal)" font-family="l0g Tempo" font-size="21" font-weight="700" text-anchor="start">Forecast: demand</text><text data-panel="tempo-en-selection-m-frame" x="28" y="233" fill="var(--color-signal)" font-family="l0g Tempo" font-size="21" font-weight="700" text-anchor="start">− wind − solar</text><text data-panel="tempo-en-selection-m-frame" x="28" y="283" fill="var(--color-amber)" font-family="l0g Tempo" font-size="21" font-weight="700" text-anchor="start">Date + remaining stock</text><line x1="210" y1="309" x2="210" y2="345" stroke="var(--color-signal)" stroke-width="3"/><path d="M 204 336 L 210 345 L 216 336" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="tempo-en-selection-m-frame" x="210" y="379" fill="var(--color-paper)" font-family="l0g Tempo" font-size="19" font-weight="700" text-anchor="middle">Threshold OR stock clearing</text><line x1="210" y1="401" x2="210" y2="436" stroke="var(--color-signal)" stroke-width="3"/><path d="M 204 427 L 210 436 L 216 427" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="tempo-en-selection-m-frame" x="210" y="471" fill="var(--color-accent)" font-family="l0g Tempo" font-size="21" font-weight="700" text-anchor="middle">Eligible day → RED</text><text data-panel="tempo-en-selection-m-frame" x="210" y="503" fill="var(--color-accent)" font-family="l0g Tempo" font-size="21" font-weight="700" text-anchor="middle">Stock: S → S − 1</text><text data-panel="tempo-en-selection-m-frame" x="28" y="568" fill="var(--color-muted)" font-family="l0g Tempo" font-size="18" font-weight="700" text-anchor="start">MARCH 2026</text><text data-panel="tempo-en-selection-m-frame" x="28" y="607" fill="var(--color-accent)" font-family="l0g Tempo" font-size="32" font-weight="700" text-anchor="start">13 / 22</text><text data-panel="tempo-en-selection-m-frame" x="162" y="595" fill="var(--color-paper)" font-family="l0g Tempo" font-size="18" font-weight="400" text-anchor="start">annual red days</text><text data-panel="tempo-en-selection-m-frame" x="162" y="620" fill="var(--color-paper)" font-family="l0g Tempo" font-size="18" font-weight="400" text-anchor="start">in the sequence</text><rect x="28" y="640" width="25" height="21" rx="0" fill="var(--color-accent)" stroke="none" stroke-width="1"/><rect x="61" y="640" width="25" height="21" rx="0" fill="var(--color-accent)" stroke="none" stroke-width="1"/><rect x="94" y="640" width="25" height="21" rx="0" fill="var(--color-accent)" stroke="none" stroke-width="1"/><rect x="127" y="640" width="25" height="21" rx="0" fill="var(--color-accent)" stroke="none" stroke-width="1"/><rect x="160" y="640" width="25" height="21" rx="0" fill="var(--color-accent)" stroke="none" stroke-width="1"/><rect x="193" y="640" width="25" height="21" rx="0" fill="var(--color-accent)" stroke="none" stroke-width="1"/><rect x="226" y="640" width="25" height="21" rx="0" fill="var(--color-accent)" stroke="none" stroke-width="1"/><rect x="259" y="640" width="25" height="21" rx="0" fill="var(--color-accent)" stroke="none" stroke-width="1"/><rect x="292" y="640" width="25" height="21" rx="0" fill="var(--color-accent)" stroke="none" stroke-width="1"/><rect x="325" y="640" width="25" height="21" rx="0" fill="var(--color-accent)" stroke="none" stroke-width="1"/><rect x="358" y="640" width="25" height="21" rx="0" fill="var(--color-accent)" stroke="none" stroke-width="1"/><rect x="28" y="673" width="25" height="21" rx="0" fill="var(--color-accent)" stroke="none" stroke-width="1"/><rect x="61" y="673" width="25" height="21" rx="0" fill="var(--color-accent)" stroke="none" stroke-width="1"/><rect x="94" y="673" width="25" height="21" rx="0" fill="var(--color-surface-2)" stroke="none" stroke-width="1"/><rect x="127" y="673" width="25" height="21" rx="0" fill="var(--color-surface-2)" stroke="none" stroke-width="1"/><rect x="160" y="673" width="25" height="21" rx="0" fill="var(--color-surface-2)" stroke="none" stroke-width="1"/><rect x="193" y="673" width="25" height="21" rx="0" fill="var(--color-surface-2)" stroke="none" stroke-width="1"/><rect x="226" y="673" width="25" height="21" rx="0" fil