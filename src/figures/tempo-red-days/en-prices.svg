<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tempo-en-prices-d-title tempo-en-prices-d-desc" viewBox="0 0 1000 700" style="width:100%;height:auto" class="l0g-tempo-red-days-svg"><title id="tempo-en-prices-d-title">Six prices for the same electricity</title><desc id="tempo-en-prices-d-desc">EDF Tempo prices including tax at 1 August 2026, in euros per kilowatt-hour. Blue: off-peak 0.1356, peak 0.1654. White: 0.1536 and 0.1921. Red: 0.1615 and 0.7295. All six bars share a zero-to-0.8 euro per kilowatt-hour scale. Tariff day: peak 06:00 to 22:00; off-peak 22:00 to 06:00 the next day. Moving ten red peak kilowatt-hours to red off-peak saves 5.68 euros in energy charges, at fixed meter volume and subscription.</desc><rect id="tempo-en-prices-d-frame" x="0" y="0" width="1000" height="700" rx="0" fill="var(--color-ink)" stroke="none" stroke-width="1"/><text data-panel="tempo-en-prices-d-frame" x="40" y="42" fill="var(--color-signal)" font-family="l0g Tempo" font-size="22" font-weight="700" text-anchor="start">l0g / TEMPO</text><text data-panel="tempo-en-prices-d-frame" x="960" y="42" fill="var(--color-muted)" font-family="l0g Tempo" font-size="22" font-weight="400" text-anchor="end">05 / 07</text><text data-panel="tempo-en-prices-d-frame" x="40" y="94" fill="var(--color-paper)" font-family="l0g Tempo" font-size="32" font-weight="700" text-anchor="start">Six prices for the same electricity</text><text data-panel="tempo-en-prices-d-frame" x="40" y="145" fill="var(--color-muted)" font-family="l0g Tempo" font-size="22" font-weight="400" text-anchor="start">EDF Tempo · including tax · 1 Aug 2026 · €/kWh</text><text data-panel="tempo-en-prices-d-frame" x="40" y="210" fill="var(--color-paper)" font-family="l0g Tempo" font-size="24" font-weight="700" text-anchor="start">Blue off-pk</text><rect x="230" y="194" width="97.4625" height="17" rx="0" fill="var(--color-signal)" stroke="none" stroke-width="1"/><text data-panel="tempo-en-prices-d-frame" x="950" y="210" fill="var(--color-paper)" font-family="l0g Tempo" font-size="24" font-weight="400" text-anchor="end">0.1356</text><text data-panel="tempo-en-prices-d-frame" x="40" y="256" fill="var(--color-paper)" font-family="l0g Tempo" font-size="24" font-weight="700" text-anchor="start">Blue peak</text><rect x="230" y="240" width="118.88125" height="17" rx="0" fill="var(--color-signal)" stroke="none" stroke-width="1"/><text data-panel="tempo-en-prices-d-frame" x="950" y="256" fill="var(--color-paper)" font-family="l0g Tempo" font-size="24" font-weight="400" text-anchor="end">0.1654</text><text data-panel="tempo-en-prices-d-frame" x="40" y="302" fill="var(--color-paper)" font-family="l0g Tempo" font-size="24" font-weight="700" text-anchor="start">White off-pk</text><rect x="230" y="286" width="110.4" height="17" rx="0" fill="var(--color-muted)" stroke="none" stroke-width="1"/><text data-panel="tempo-en-prices-d-frame" x="950" y="302" fill="var(--color-paper)" font-family="l0g Tempo" font-size="24" font-weight="400" text-anchor="end">0.1536</text><text data-panel="tempo-en-prices-d-frame" x="40" y="348" fill="var(--color-paper)" font-family="l0g Tempo" font-size="24" font-weight="700" text-anchor="start">White peak</text><rect x="230" y="332" width="138.071875" height="17" rx="0" fill="var(--color-muted)" stroke="none" stroke-width="1"/><text data-panel="tempo-en-prices-d-frame" x="950" y="348" fill="var(--color-paper)" font-family="l0g Tempo" font-size="24" font-weight="400" text-anchor="end">0.1921</text><text data-panel="tempo-en-prices-d-frame" x="40" y="394" fill="var(--color-paper)" font-family="l0g Tempo" font-size="24" font-weight="700" text-anchor="start">Red off-pk</text><rect x="230" y="378" width="116.078125" height="17" rx="0" fill="var(--color-accent)" stroke="none" stroke-width="1"/><text data-panel="tempo-en-prices-d-frame" x="950" y="394" fill="var(--color-paper)" font-family="l0g Tempo" font-size="24" font-weight="400" text-anchor="end">0.1615</text><text data-panel="tempo-en-prices-d-frame" x="40" y="440" fill="var(--color-paper)" font-family="l0g Tempo" font-size="24" font-weight="700" text-anchor="start">Red peak</text><rect x="230" y="424" width="524.328125" height="17" rx="0" fill="var(--color-accent)" stroke="none" stroke-width="1"/><text data-panel="tempo-en-prices-d-frame" x="950" y="440" fill="var(--color-paper)" font-family="l0g Tempo" font-size="24" font-weight="400" text-anchor="end">0.7295</text><text data-panel="tempo-en-prices-d-frame" x="230.0" y="510" fill="var(--color-muted)" font-family="l0g Tempo" font-size="22" font-weight="400" text-anchor="middle">0</text><text data-panel="tempo-en-prices-d-frame" x="517.5" y="510" fill="var(--color-muted)" font-family="l0g Tempo" font-size="22" font-weight="400" text-anchor="middle">0.4</text><text data-panel="tempo-en-prices-d-frame" x="805.0" y="510" fill="var(--color-muted)" font-family="l0g Tempo" font-size="22" font-weight="400" text-anchor="middle">0.8</text><line x1="40" y1="540" x2="653.333333" y2="540" stroke="var(--color-accent)" stroke-width="9"/><line x1="653.333333" y1="540" x2="960" y2="540" stroke="var(--color-signal)" stroke-width="9"/><text data-panel="tempo-en-prices-d-frame" x="40" y="572" fill="var(--color-muted)" font-family="l0g Tempo" font-size="22" font-weight="400" text-anchor="start">06:00</text><text data-panel="tempo-en-prices-d-frame" x="653.333333" y="572" fill="var(--color-muted)" font-family="l0g Tempo" font-size="22" font-weight="400" text-anchor="middle">22:00</text><text data-panel="tempo-en-prices-d-frame" x="960" y="572" fill="var(--color-muted)" font-family="l0g Tempo" font-size="22" font-weight="400" text-anchor="end">06:00</text><text data-panel="tempo-en-prices-d-frame" x="40" y="620" fill="var(--color-signal)" font-family="l0g Tempo" font-size="28" font-weight="700" text-anchor="start">10 kWh: red peak → off-peak = €5.68</text><line x1="40" y1="638" x2="960" y2="638" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="tempo-en-prices-d-frame" x="40" y="669" fill="var(--color-muted)" font-family="l0g Tempo" font-size="22" font-weight="400" text-anchor="start">T01 · T07 | Fixed meter volume</text></svg>
