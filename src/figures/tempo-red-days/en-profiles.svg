<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tempo-en-profiles-d-title tempo-en-profiles-d-desc" viewBox="0 0 1000 700" style="width:100%;height:auto" class="l0g-tempo-red-days-svg"><title id="tempo-en-profiles-d-title">Mean and peak rank days differently</title><desc id="tempo-en-profiles-d-desc">Two entirely fictional profiles on a shared 24-hour frame. A has 12 hours at 70 GW and 12 at 50 GW: mean 60 GW, maximum 70 GW. B has one hour at 85 GW and 23 at 45 GW: mean 46.6667 GW, maximum 85 GW. A ranks higher by mean; B ranks higher by peak. This illustration isolates two statistics without reproducing the full algorithm or operational PP maximum window.</desc><rect id="tempo-en-profiles-d-frame" x="0" y="0" width="1000" height="700" rx="0" fill="var(--color-ink)" stroke="none" stroke-width="1"/><text data-panel="tempo-en-profiles-d-frame" x="40" y="42" fill="var(--color-signal)" font-family="l0g Tempo" font-size="22" font-weight="700" text-anchor="start">l0g / TEMPO</text><text data-panel="tempo-en-profiles-d-frame" x="960" y="42" fill="var(--color-muted)" font-family="l0g Tempo" font-size="22" font-weight="400" text-anchor="end">02 / 07</text><text data-panel="tempo-en-profiles-d-frame" x="40" y="94" fill="var(--color-paper)" font-family="l0g Tempo" font-size="32" font-weight="700" text-anchor="start">Mean and peak rank days differently</text><text data-panel="tempo-en-profiles-d-frame" x="40" y="145" fill="var(--color-muted)" font-family="l0g Tempo" font-size="22" font-weight="400" text-anchor="start">Fictional profiles · 24 hours · gigawatts</text><line x1="100" y1="415.0" x2="940" y2="415.0" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="tempo-en-profiles-d-frame" x="90" y="421.0" fill="var(--color-muted)" font-family="l0g Tempo" font-size="22" font-weight="400" text-anchor="end">0</text><line x1="100" y1="305.0" x2="940" y2="305.0" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="tempo-en-profiles-d-frame" x="90" y="311.0" fill="var(--color-muted)" font-family="l0g Tempo" font-size="22" font-weight="400" text-anchor="end">50</text><line x1="100" y1="195.0" x2="940" y2="195.0" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="tempo-en-profiles-d-frame" x="90" y="201.0" fill="var(--color-muted)" font-family="l0g Tempo" font-size="22" font-weight="400" text-anchor="end">100</text><text data-panel="tempo-en-profiles-d-frame" x="100.0" y="443" fill="var(--color-muted)" font-family="l0g Tempo" font-size="22" font-weight="400" text-anchor="middle">0</text><text data-panel="tempo-en-profiles-d-frame" x="520.0" y="443" fill="var(--color-muted)" font-family="l0g Tempo" font-size="22" font-weight="400" text-anchor="middle">12</text><text data-panel="tempo-en-profiles-d-frame" x="940.0" y="443" fill="var(--color-muted)" font-family="l0g Tempo" font-size="22" font-weight="400" text-anchor="middle">24</text><path d="M 100.0 261.0 L 520.0 261.0 L 520.0 305.0 L 940.0 305.0" fill="none" stroke="var(--color-signal)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 100.0 316.0 L 730.0 316.0 L 730.0 228.0 L 765.0 228.0 L 765.0 316.0 L 940.0 316.0" fill="none" stroke="var(--color-amber)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="tempo-en-profiles-d-frame" x="275.0" y="246.0" fill="var(--color-signal)" font-family="l0g Tempo" font-size="26" font-weight="700" text-anchor="middle">A · 70</text><text data-panel="tempo-en-profiles-d-frame" x="625.0" y="243.0" fill="var(--color-amber)" font-family="l0g Tempo" font-size="26" font-weight="700" text-anchor="middle">B · 85</text><text data-panel="tempo-en-profiles-d-frame" x="40" y="503" fill="var(--color-muted)" font-family="l0g Tempo" font-size="22" font-weight="700" text-anchor="start">MEAN · GW</text><text data-panel="tempo-en-profiles-d-frame" x="40" y="551" fill="var(--color-signal)" font-family="l0g Tempo" font-size="32" font-weight="700" text-anchor="start">A: 60 &gt; B: 46.6667</text><text data-panel="tempo-en-profiles-d-frame" x="560" y="503" fill="var(--color-muted)" font-family="l0g Tempo" font-size="22" font-weight="700" text-anchor="start">PEAK · GW</text><text data-panel="tempo-en-profiles-d-frame" x="560" y="551" fill="var(--color-amber)" font-family="l0g Tempo" font-size="32" font-weight="700" text-anchor="start">B: 85 &gt; A: 70</text><text data-panel="tempo-en-profiles-d-frame" x="40" y="604" fill="var(--color-paper)" font-family="l0g Tempo" font-size="24" font-weight="400" text-anchor="start">A : 12 h × 70 + 12 h × 50    |    B : 1 h × 85 + 23 h × 45</text><line x1="40" y1="638" x2="960" y2="638" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="tempo-en-profiles-d-frame" x="40" y="669" fill="var(--color-muted)" font-family="l0g Tempo" font-size="22" font-weight="400" text-anchor="start">G04 · R02 | Fictional profiles</text></svg>
