<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tempo-fr-notice-m-title tempo-fr-notice-m-desc" viewBox="0 0 420 800" style="width:100%;height:auto" class="l0g-tempo-red-days-svg"><title id="tempo-fr-notice-m-title">Sélection et annonce : les étapes</title><desc id="tempo-fr-notice-m-desc">Le 1er novembre 2026 entrent en vigueur la sélection des rouges fondée sur PP et l’exclusion des 24 et 31 décembre. Jusqu’au 31 octobre 2027, l’annonce officielle Tempo reste à 10:30 en J−1. À partir du 1er novembre 2027, Tempo doit être annoncé dans l’heure suivant PP ; J−2 devient possible lorsque PP est annoncé plus tôt. Un PP déclenché par un changement Ecowatt après 10:30 en J−1 peut différer du rouge Tempo. Les heures pleines facturées Tempo restent de 06:00 à 22:00.</desc><rect id="tempo-fr-notice-m-frame" x="0" y="0" width="420" height="800" rx="0" fill="var(--color-ink)" stroke="none" stroke-width="1"/><text data-panel="tempo-fr-notice-m-frame" x="22" y="35" fill="var(--color-signal)" font-family="l0g Tempo" font-size="17" font-weight="700" text-anchor="start">l0g / TEMPO</text><text data-panel="tempo-fr-notice-m-frame" x="398" y="35" fill="var(--color-muted)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="end">07 / 07</text><text data-panel="tempo-fr-notice-m-frame" x="22" y="76" fill="var(--color-paper)" font-family="l0g Tempo" font-size="25" font-weight="700" text-anchor="start">Sélection et annonce : les</text><text data-panel="tempo-fr-notice-m-frame" x="22" y="107" fill="var(--color-paper)" font-family="l0g Tempo" font-size="25" font-weight="700" text-anchor="start">étapes</text><text data-panel="tempo-fr-notice-m-frame" x="22" y="147" fill="var(--color-muted)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="start">Décision CRE du 21.10.2026 · heures</text><text data-panel="tempo-fr-notice-m-frame" x="22" y="170" fill="var(--color-muted)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="start">françaises</text><text data-panel="tempo-fr-notice-m-frame" x="28" y="205" fill="var(--color-accent)" font-family="l0g Tempo" font-size="25" font-weight="700" text-anchor="start">01.11.2026</text><text data-panel="tempo-fr-notice-m-frame" x="28" y="243" fill="var(--color-paper)" font-family="l0g Tempo" font-size="19" font-weight="400" text-anchor="start">Sélection PP ; 24 et 31 décembre</text><text data-panel="tempo-fr-notice-m-frame" x="28" y="270" fill="var(--color-paper)" font-family="l0g Tempo" font-size="19" font-weight="400" text-anchor="start">exclus du rouge Tempo</text><text data-panel="tempo-fr-notice-m-frame" x="28" y="331" fill="var(--color-muted)" font-family="l0g Tempo" font-size="21" font-weight="700" text-anchor="start">JUSQU’AU 31.10.2027</text><text data-panel="tempo-fr-notice-m-frame" x="28" y="369" fill="var(--color-paper)" font-family="l0g Tempo" font-size="23" font-weight="700" text-anchor="start">Tempo : J−1, 10 h 30</text><text data-panel="tempo-fr-notice-m-frame" x="28" y="443" fill="var(--color-signal)" font-family="l0g Tempo" font-size="21" font-weight="700" text-anchor="start">À PARTIR DU 01.11.2027</text><text data-panel="tempo-fr-notice-m-frame" x="28" y="506" fill="var(--color-paper)" font-family="l0g Tempo" font-size="27" font-weight="700" text-anchor="start">PP</text><line x1="93" y1="498" x2="224" y2="498" stroke="var(--color-signal)" stroke-width="3"/><path d="M 215 492 L 224 498 L 215 504" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="tempo-fr-notice-m-frame" x="160" y="482" fill="var(--color-signal)" font-family="l0g Tempo" font-size="18" font-weight="700" text-anchor="middle">1 h max</text><text data-panel="tempo-fr-notice-m-frame" x="247" y="506" fill="var(--color-signal)" font-family="l0g Tempo" font-size="27" font-weight="700" text-anchor="start">Tempo</text><text data-panel="tempo-fr-notice-m-frame" x="28" y="538" fill="var(--color-muted)" font-family="l0g Tempo" font-size="19" font-weight="400" text-anchor="start">J−2 possible si PP anticipé</text><text data-panel="tempo-fr-notice-m-frame" x="28" y="572" fill="var(--color-muted)" font-family="l0g Tempo" font-size="19" font-weight="400" text-anchor="start">Ecowatt après 10 h 30 en J−1 :</text><text data-panel="tempo-fr-notice-m-frame" x="28" y="606" fill="var(--color-muted)" font-family="l0g Tempo" font-size="19" font-weight="400" text-anchor="start">un PP peut différer de Tempo</text><text data-panel="tempo-fr-notice-m-frame" x="28" y="674" fill="var(--color-accent)" font-family="l0g Tempo" font-size="20" font-weight="700" text-anchor="start">HP Tempo : 06:00–22:00</text><line x1="22" y1="738" x2="398" y2="738" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="tempo-fr-notice-m-frame" x="22" y="769" fill="var(--color-muted)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="start">G01 · R02 · T07 | Prévenance</text></svg>
