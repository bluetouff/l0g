<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tempo-fr-prices-m-title tempo-fr-prices-m-desc" viewBox="0 0 420 800" style="width:100%;height:auto" class="l0g-tempo-red-days-svg"><title id="tempo-fr-prices-m-title">Six prix pour une même électricité</title><desc id="tempo-fr-prices-m-desc">Prix EDF Tempo, taxes comprises, au 1er août 2026 en euros par kilowattheure. Bleu : heures creuses 0,1356, heures pleines 0,1654. Blanc : 0,1536 et 0,1921. Rouge : 0,1615 et 0,7295. Les six barres partagent une échelle de zéro à 0,8 euro par kilowattheure. Journée tarifaire : heures pleines de 06:00 à 22:00 ; heures creuses de 22:00 à 06:00 le lendemain. Déplacer dix kilowattheures des heures pleines rouges vers les heures creuses rouges réduit la charge d’énergie de 5,68 euros, à volume compteur et abonnement constants.</desc><rect id="tempo-fr-prices-m-frame" x="0" y="0" width="420" height="800" rx="0" fill="var(--color-ink)" stroke="none" stroke-width="1"/><text data-panel="tempo-fr-prices-m-frame" x="22" y="35" fill="var(--color-signal)" font-family="l0g Tempo" font-size="17" font-weight="700" text-anchor="start">l0g / TEMPO</text><text data-panel="tempo-fr-prices-m-frame" x="398" y="35" fill="var(--color-muted)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="end">05 / 07</text><text data-panel="tempo-fr-prices-m-frame" x="22" y="76" fill="var(--color-paper)" font-family="l0g Tempo" font-size="25" font-weight="700" text-anchor="start">Six prix pour une même</text><text data-panel="tempo-fr-prices-m-frame" x="22" y="107" fill="var(--color-paper)" font-family="l0g Tempo" font-size="25" font-weight="700" text-anchor="start">électricité</text><text data-panel="tempo-fr-prices-m-frame" x="22" y="147" fill="var(--color-muted)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="start">EDF Tempo · TTC · 01.08.2026 · €/kWh</text><text data-panel="tempo-fr-prices-m-frame" x="22" y="222" fill="var(--color-paper)" font-family="l0g Tempo" font-size="17" font-weight="700" text-anchor="start">Bleu HC</text><rect x="160" y="206" width="34.7475" height="12" rx="0" fill="var(--color-signal)" stroke="none" stroke-width="1"/><text data-panel="tempo-fr-prices-m-frame" x="390" y="246" fill="var(--color-paper)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="end">0,1356</text><text data-panel="tempo-fr-prices-m-frame" x="22" y="272" fill="var(--color-paper)" font-family="l0g Tempo" font-size="17" font-weight="700" text-anchor="start">Bleu HP</text><rect x="160" y="256" width="42.38375" height="12" rx="0" fill="var(--color-signal)" stroke="none" stroke-width="1"/><text data-panel="tempo-fr-prices-m-frame" x="390" y="296" fill="var(--color-paper)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="end">0,1654</text><text data-panel="tempo-fr-prices-m-frame" x="22" y="322" fill="var(--color-paper)" font-family="l0g Tempo" font-size="17" font-weight="700" text-anchor="start">Blanc HC</text><rect x="160" y="306" width="39.36" height="12" rx="0" fill="var(--color-muted)" stroke="none" stroke-width="1"/><text data-panel="tempo-fr-prices-m-frame" x="390" y="346" fill="var(--color-paper)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="end">0,1536</text><text data-panel="tempo-fr-prices-m-frame" x="22" y="372" fill="var(--color-paper)" font-family="l0g Tempo" font-size="17" font-weight="700" text-anchor="start">Blanc HP</text><rect x="160" y="356" width="49.225625" height="12" rx="0" fill="var(--color-muted)" stroke="none" stroke-width="1"/><text data-panel="tempo-fr-prices-m-frame" x="390" y="396" fill="var(--color-paper)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="end">0,1921</text><text data-panel="tempo-fr-prices-m-frame" x="22" y="422" fill="var(--color-paper)" font-family="l0g Tempo" font-size="17" font-weight="700" text-anchor="start">Rouge HC</text><rect x="160" y="406" width="41.384375" height="12" rx="0" fill="var(--color-accent)" stroke="none" stroke-width="1"/><text data-panel="tempo-fr-prices-m-frame" x="390" y="446" fill="var(--color-paper)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="end">0,1615</text><text data-panel="tempo-fr-prices-m-frame" x="22" y="472" fill="var(--color-paper)" font-family="l0g Tempo" font-size="17" font-weight="700" text-anchor="start">Rouge HP</text><rect x="160" y="456" width="186.934375" height="12" rx="0" fill="var(--color-accent)" stroke="none" stroke-width="1"/><text data-panel="tempo-fr-prices-m-frame" x="390" y="496" fill="var(--color-paper)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="end">0,7295</text><text data-panel="tempo-fr-prices-m-frame" x="160.0" y="537" fill="var(--color-muted)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="middle">0</text><text data-panel="tempo-fr-prices-m-frame" x="262.5" y="537" fill="var(--color-muted)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="middle">0,4</text><text data-panel="tempo-fr-prices-m-frame" x="365.0" y="537" fill="var(--color-muted)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="middle">0,8</text><line x1="28" y1="600" x2="270.666667" y2="600" stroke="var(--color-accent)" stroke-width="9"/><line x1="270.666667" y1="600" x2="392" y2="600" stroke="var(--color-signal)" stroke-width="9"/><text data-panel="tempo-fr-prices-m-frame" x="28" y="632" fill="var(--color-muted)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="start">06:00</text><text data-panel="tempo-fr-prices-m-frame" x="270.666667" y="632" fill="var(--color-muted)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="middle">22:00</text><text data-panel="tempo-fr-prices-m-frame" x="392" y="632" fill="var(--color-muted)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="end">06:00</text><text data-panel="tempo-fr-prices-m-frame" x="28" y="675" fill="var(--color-signal)" font-family="l0g Tempo" font-size="20" font-weight="700" text-anchor="start">10 kWh : HP rouge → HC rouge</text><text data-panel="tempo-fr-prices-m-frame" x="28" y="705" fill="var(--color-signal)" font-family="l0g Tempo" font-size="20" font-weight="700" text-anchor="start">= 5,68 € à volume constant</text><line x1="22" y1="738" x2="398" y2="738" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="tempo-fr-prices-m-frame" x="22" y="769" fill="var(--color-muted)" font-family="l0g Tempo" font-size="17" font-weight="400" text-anchor="start">T01 · T07 | Volume compteur fixe</text></svg>
