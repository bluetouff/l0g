<svg xmlns="http://www.w3.org/2000/svg" xml:lang="fr" viewBox="0 0 340 424" role="img" aria-labelledby="wingman-correspondance-fr-m-title wingman-correspondance-fr-m-desc" font-family="Inter Variable, Inter, sans-serif" font-weight="400" style="width:100%;height:auto">
<title id="wingman-correspondance-fr-m-title">Le compte de correspondance de MKB</title><desc id="wingman-correspondance-fr-m-desc">Une entreprise transmet une instruction à MKB. Son compte chez Deutsche Bank permet le règlement vers la banque du bénéficiaire. Deutsche Bank demande des justificatifs à MKB, qui répond. Schéma de principe, sans reconstitution d’un paiement particulier.</desc>
<text x="18" y="25" font-size="17" fill="var(--color-paper)" text-anchor="start">Le compte de MKB</text><text x="18" y="46" font-size="12.5" fill="var(--color-muted)" text-anchor="start">Paiement et information</text><rect x="18" y="67" width="112" height="88" rx="5" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text x="30" y="90" font-size="13" fill="var(--color-paper)" text-anchor="start">Entreprise</text><text x="30" y="116" font-size="13" fill="var(--color-muted)" text-anchor="start">Ordre de</text><text x="30" y="134" font-size="13" fill="var(--color-muted)" text-anchor="start">paiement</text><rect x="157" y="67" width="165" height="93" rx="5" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text x="171" y="92" font-size="16" fill="var(--color-paper)" text-anchor="start">MKB</text><text x="171" y="117" font-size="13" fill="var(--color-muted)" text-anchor="start">Client et opérations</text><text x="171" y="135" font-size="13" fill="var(--color-muted)" text-anchor="start">de sa clientèle</text><path d="M130 110H157" fill="none" stroke="var(--color-signal)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M152 107 157 110 152 113" fill="none" stroke="var(--color-signal)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><rect x="18" y="218" width="304" height="99" rx="5" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text x="33" y="243" font-size="16" fill="var(--color-paper)" text-anchor="start">Deutsche Bank</text><rect x="33" y="254" width="274" height="29" rx="5" fill="var(--color-surface)" stroke="var(--color-signal)" stroke-width="1"/><text x="170" y="274" font-size="13" fill="var(--color-signal)" text-anchor="middle">Compte de MKB</text><text x="33" y="304" font-size="13" fill="var(--color-muted)" text-anchor="start">Contrôle du partenaire et des flux</text><path d="M280 160V218" fill="none" stroke="var(--color-signal)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M277 213 280 218 283 213" fill="none" stroke="var(--color-signal)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><text x="287" y="193" font-size="11.5" fill="var(--color-signal)" text-anchor="start">Paiement</text><path d="M53 218V180H184V160" fill="none" stroke="var(--color-muted)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M181 165 184 160 187 165" fill="none" stroke="var(--color-muted)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><text x="18" y="174" font-size="12.5" fill="var(--color-muted)" text-anchor="start">Justificatifs</text><path d="M218 160V205H125V218" fill="none" stroke="var(--color-signal)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M122 213 125 218 128 213" fill="none" stroke="var(--color-signal)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><text x="165" y="200" font-size="12.5" fill="var(--color-signal)" text-anchor="middle">Réponse</text><rect x="99" y="354" width="223" height="53" rx="5" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text x="210" y="376" font-size="12.5" fill="var(--color-paper)" text-anchor="middle">Banque du bénéficiaire</text><text x="210" y="394" font-size="12.5" fill="var(--color-paper)" text-anchor="middle">Crédit du compte destinataire</text><path d="M269 317V354" fill="none" stroke="var(--color-signal)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M266 349 269 354 272 349" fill="none" stroke="var(--color-signal)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
