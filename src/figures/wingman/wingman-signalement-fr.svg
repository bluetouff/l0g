<svg xmlns="http://www.w3.org/2000/svg" xml:lang="fr" viewBox="0 0 600 361" role="img" aria-labelledby="wingman-signalement-fr-d-title wingman-signalement-fr-d-desc" font-family="Inter Variable, Inter, sans-serif" font-weight="400" style="width:100%;height:auto">
<title id="wingman-signalement-fr-d-title">Signalement et exécution du paiement</title><desc id="wingman-signalement-fr-d-desc">Schéma général du droit allemand consulté le 19 novembre 2026. Après une déclaration à la FIU, le §46 prévoit une attente jusqu’à un accord de l’autorité compétente ou l’expiration du troisième jour ouvré suivant l’envoi sans interdiction. Une opposition maintient l’arrêt. Les exceptions du §46(2) sont précisées en légende. La vigilance sur la relation bancaire se poursuit séparément.</desc>
<text x="18" y="26" font-size="17.5" fill="var(--color-paper)" text-anchor="start">Signalement et exécution du paiement</text><text x="18" y="47" font-size="12.5" fill="var(--color-muted)" text-anchor="start">Allemagne · état du droit au 19 novembre 2026</text><rect x="170" y="64" width="260" height="40" rx="5" fill="var(--color-surface)" stroke="var(--color-amber)" stroke-width="1"/><text x="300" y="89" font-size="13" fill="var(--color-paper)" text-anchor="middle">Déclaration à la FIU · §43</text><path d="M300 104V120" fill="none" stroke="var(--color-amber)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M297 115 300 120 303 115" fill="none" stroke="var(--color-amber)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><rect x="170" y="120" width="260" height="37" rx="5" fill="var(--color-surface)" stroke="var(--color-amber)" stroke-width="1"/><text x="300" y="144" font-size="13" fill="var(--color-amber)" text-anchor="middle">Paiement en attente · §46</text><path d="M300 157V171H105V182" fill="none" stroke="var(--color-line-strong)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M102 177 105 182 108 177" fill="none" stroke="var(--color-line-strong)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M300 171V182" fill="none" stroke="var(--color-line-strong)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M297 177 300 182 303 177" fill="none" stroke="var(--color-line-strong)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M300 171H495V182" fill="none" stroke="var(--color-line-strong)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M492 177 495 182 498 177" fill="none" stroke="var(--color-line-strong)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><rect x="18" y="182" width="174" height="75" rx="5" fill="var(--color-surface)" stroke="var(--color-signal)" stroke-width="1"/><text x="105" y="206" font-size="13" fill="var(--color-signal)" text-anchor="middle">Accord reçu</text><text x="105" y="229" font-size="11.8" fill="var(--color-muted)" text-anchor="middle">FIU ou parquet</text><rect x="213" y="182" width="174" height="75" rx="5" fill="var(--color-surface)" stroke="var(--color-amber)" stroke-width="1"/><text x="300" y="206" font-size="13" fill="var(--color-amber)" text-anchor="middle">Délai écoulé</text><text x="300" y="229" font-size="11.8" fill="var(--color-muted)" text-anchor="middle">3ᵉ jour ouvré après envoi</text><text x="300" y="246" font-size="11.8" fill="var(--color-muted)" text-anchor="middle">sans interdiction</text><rect x="408" y="182" width="174" height="75" rx="5" fill="var(--color-surface)" stroke="var(--color-accent)" stroke-width="1"/><text x="495" y="206" font-size="13" fill="var(--color-accent)" text-anchor="middle">Opposition</text><text x="495" y="229" font-size="11.8" fill="var(--color-muted)" text-anchor="middle">FIU ou parquet</text><path d="M105 257V269H200V280" fill="none" stroke="var(--color-signal)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M197 275 200 280 203 275" fill="none" stroke="var(--color-signal)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M300 257V269H200" fill="none" stroke="var(--color-amber)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M495 257V280" fill="none" stroke="var(--color-accent)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M492 275 495 280 498 275" fill="none" stroke="var(--color-accent)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><text x="200" y="300" font-size="13" fill="var(--color-signal)" text-anchor="middle">Exécution possible</text><text x="495" y="300" font-size="13" fill="var(--color-accent)" text-anchor="middle">Arrêt maintenu</text><path d="M18 319H582" fill="none" stroke="var(--color-line-strong)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><text x="18" y="341" font-size="12" fill="var(--color-muted)" text-anchor="start">Relation bancaire : vigilance continue, distincte du sort de ce paiement</text>
