<svg xmlns="http://www.w3.org/2000/svg" xml:lang="fr" viewBox="0 0 600 286" role="img" aria-labelledby="wingman-transition-fr-d-title wingman-transition-fr-d-desc" font-family="Inter Variable, Inter, sans-serif" font-weight="400" style="width:100%;height:auto">
<title id="wingman-transition-fr-d-title">173 jours entre décision et retrait</title><desc id="wingman-transition-fr-d-desc">Chronologie proportionnelle de la décision de sortie du 16 avril 2020 au retrait de l’accès à la compensation le 6 octobre 2020. Le préavis est envoyé le 8 mai et le risque de liquidité invoqué le 5 juin. Les publications rapportent aussi des signalements supplémentaires pendant la transition.</desc>
