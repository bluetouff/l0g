<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" viewBox="0 0 340 468" role="img" aria-labelledby="wingman-signalement-en-m-title wingman-signalement-en-m-desc" font-family="Inter Variable, Inter, sans-serif" font-weight="400" style="width:100%;height:auto">
<title id="wingman-signalement-en-m-title">Reporting and payment execution</title><desc id="wingman-signalement-en-m-desc">General German framework checked on 19 November 2026. After reporting to the FIU, section 46 provides for a hold pending competent-authority consent or expiry of the third working day after filing without prohibition. A prohibition maintains the hold. Section46(2) exceptions are identified in the caption. Relationship due diligence continues separately.</desc>
<text x="18" y="25" font-size="17" fill="var(--color-paper)" text-anchor="start">Payment after reporting</text><text x="18" y="46" font-size="12.5" fill="var(--color-muted)" text-anchor="start">Germany · framework at 19 November 2026</text><rect x="47" y="62" width="275" height="38" rx="5" fill="var(--color-surface)" stroke="var(--color-amber)" stroke-width="1"/><text x="184" y="86" font-size="13" fill="var(--color-paper)" text-anchor="middle">Report to FIU · section 43</text><path d="M184 100V117" fill="none" stroke="var(--color-amber)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M181 112 184 117 187 112" fill="none" stroke="var(--color-amber)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><rect x="47" y="117" width="275" height="38" rx="5" fill="var(--color-surface)" stroke="var(--color-amber)" stroke-width="1"/><text x="184" y="141" font-size="13" fill="var(--color-amber)" text-anchor="middle">Payment on hold · section 46</text><path d="M47 136H22V351" fill="none" stroke="var(--color-line-strong)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 199H47" fill="none" stroke="var(--color-line-strong)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M42 196 47 199 42 202" fill="none" stroke="var(--color-line-strong)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><rect x="47" y="177" width="142" height="57" rx="5" fill="var(--color-surface)" stroke="var(--color-signal)" stroke-width="1"/><text x="59" y="199" font-size="12.3" fill="var(--color-signal)" text-anchor="start">FIU or prosecutor</text><text x="59" y="215" font-size="12.3" fill="var(--color-signal)" text-anchor="start">gives consent</text><path d="M22 273H47" fill="none" stroke="var(--color-line-strong)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M42 270 47 273 42 276" fill="none" stroke="var(--color-line-strong)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><rect x="47" y="251" width="142" height="66" rx="5" fill="var(--color-surface)" stroke="var(--color-amber)" stroke-width="1"/><text x="59" y="273" font-size="12.3" fill="var(--color-amber)" text-anchor="start">Third working day</text><text x="59" y="289" font-size="12.3" fill="var(--color-amber)" text-anchor="start">after filing ends,</text><text x="59" y="305" font-size="12.3" fill="var(--color-amber)" text-anchor="start">without prohibition</text><path d="M22 353H47" fill="none" stroke="var(--color-line-strong)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M42 350 47 353 42 356" fill="none" stroke="var(--color-line-strong)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><rect x="47" y="331" width="142" height="57" rx="5" fill="var(--color-surface)" stroke="var(--color-accent)" stroke-width="1"/><text x="59" y="353" font-size="12.3" fill="var(--color-accent)" text-anchor="start">FIU or prosecutor</text><text x="59" y="369" font-size="12.3" fill="var(--color-accent)" text-anchor="start">prohibits payment</text><path d="M189 199H211V234H228" fill="none" stroke="var(--color-signal)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M223 231 228 234 223 237" fill="none" stroke="var(--color-signal)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M189 284H211V250H228" fill="none" stroke="var(--color-amber)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M223 247 228 250 223 253" fill="none" stroke="var(--color-amber)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><rect x="228" y="218" width="94" height="59" rx="5" fill="var(--color-surface)" stroke="var(--color-signal)" stroke-width="1"/><text x="275" y="241" font-size="12.5" fill="var(--color-signal)" text-anchor="middle">Execution</text><text x="275" y="259" font-size="12.5" fill="var(--color-signal)" text-anchor="middle">possible</text><path d="M189 354H228" fill="none" stroke="var(--color-accent)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M223 351 228 354 223 357" fill="none" stroke="var(--color-accent)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><rect x="228" y="332" width="94" height="55" rx="5" fill="var(--color-surface)" stroke="var(--color-accent)" stroke-width="1"/><text x="275" y="354" font-size="12.5" fill="var(--color-accent)" text-anchor="middle">Hold</text><text x="275" y="372" font-size="12.5" fill="var(--color-accent)" text-anchor="middle">maintained</text><path d="M18 408H322" fill="none" stroke="var(--color-line-strong)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><text x="18" y="431" font-size="12.3" fill="var(--color-muted)" text-anchor="start">Banking relationship: ongoing checks</text><text x="18" y="449" font-size="12.3" fill="var(--color-muted)" text-anchor="start">and a separate review of the relationship</text>
</svg>
