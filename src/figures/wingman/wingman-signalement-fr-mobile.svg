<svg xmlns="http://www.w3.org/2000/svg" xml:lang="fr" viewBox="0 0 340 468" role="img" aria-labelledby="wingman-signalement-fr-m-title wingman-signalement-fr-m-desc" font-family="Inter Variable, Inter, sans-serif" font-weight="400" style="width:100%;height:auto">
<title id="wingman-signalement-fr-m-title">Signalement et exécution du paiement</title><desc id="wingman-signalement-fr-m-desc">Schéma général du droit allemand consulté le 19 novembre 2026. Après une déclaration à la FIU, le §46 prévoit une attente jusqu’à un accord de l’autorité compétente ou l’expiration du troisième jour ouvré suivant l’envoi sans interdiction. Une opposition maintient l’arrêt. Les exceptions du §46(2) sont précisées en légende. La vigilance sur la relation bancaire se poursuit séparément.</desc>
<text x="18" y="25" font-size="17" fill="var(--color-paper)" text-anchor="start">Le paiement après signalement</text><text x="18" y="46" font-size="12.5" fill="var(--color-muted)" text-anchor="start">Allemagne · cadre au 19 novembre 2026</text><rect x="47" y="62" width="275" height="38" rx="5" fill="var(--color-surface)" stroke="var(--color-amber)" stroke-width="1"/><text x="184" y="86" font-size="13" fill="var(--color-paper)" text-anchor="middle">Déclaration à la FIU · §43</text><path d="M184 100V117" fill="none" stroke="var(--color-amber)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M181 112 184 117 187 112" fill="none" stroke="var(--color-amber)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><rect x="47" y="117" width="275" height="38" rx="5" fill="var(--color-surface)" stroke="var(--color-amber)" stroke-width="1"/><text x="184" y="141" font-size="13" fill="var(--color-amber)" text-anchor="middle">Paiement en attente · §46</text><path d="M47 136H22V351" fill="none" stroke="var(--color-line-strong)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 199H47" fill="none" stroke="var(--color-line-strong)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M42 196 47 199 42 202" fill="none" stroke="var(--color-line-strong)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><rect x="47" y="177" width="142" height="57" rx="5" fill="var(--color-surface)" stroke="var(--color-signal)" stroke-width="1"/><text x="59" y="199" font-size="12.3" fill="var(--color-signal)" text-anchor="start">Accord de la FIU</text><text x="59" y="215" font-size="12.3" fill="var(--color-signal)" text-anchor="start">ou du parquet</text><path d="M22 273H47" fill="none" stroke="var(--color-line-strong)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M42 270 47 273 42 276" fill="none" stroke="var(--color-line-strong)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><rect x="47" y="251" width="142" height="66" rx="5" fill="var(--color-surface)" stroke="var(--color-amber)" stroke-width="1"/><text x="59" y="273" font-size="12.3" fill="var(--color-amber)" text-anchor="start">3ᵉ jour ouvré écoulé</text><text x="59" y="289" font-size="12.3" fill="var(--color-amber)" text-anchor="start">après envoi, sans</text><text x="59" y="305" font-size="12.3" fill="var(--color-amber)" text-anchor="start">interdiction</text><path d="M22 353H47" fill="none" stroke="var(--color-line-strong)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M42 350 47 353 42 356" fill="none" stroke="var(--color-line-strong)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><rect x="47" y="331" width="142" height="57" rx="5" fill="var(--color-surface)" stroke="var(--color-accent)" stroke-width="1"/><text x="59" y="353" font-size="12.3" fill="var(--color-accent)" text-anchor="start">Opposition de la FIU</text><text x="59" y="369" font-size="12.3" fill="var(--color-accent)" text-anchor="start">ou du parquet</text><path d="M189 199H211V234H228" fill="none" stroke="var(--color-signal)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M223 231 228 234 223 237" fill="none" stroke="var(--color-signal)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M189 284H211V250H228" fill="none" stroke="var(--color-amber)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M223 247 228 250 223 253" fill="none" stroke="var(--color-amber)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><rect x="228" y="218" width="94" height="59" rx="5" fill="var(--color-surface)" stroke="var(--color-signal)" stroke-width="1"/><text x="275" y="241" font-size="12.5" fill="var(--color-signal)" text-anchor="middle">Exécution</text><text x="275" y="259" font-size="12.5" fill="var(--color-signal)" text-anchor="middle">possible</text><path d="M189 354H228" fill="none" stroke="var(--color-accent)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M223 351 228 354 223 357" fill="none" stroke="var(--color-accent)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><rect x="228" y="332" width="94" height="55" rx="5" fill="var(--color-surface)" stroke="var(--color-accent)" stroke-width="1"/><text x="275" y="354" font-size="12.5" fill="var(--color-accent)" text-anchor="middle">Arrêt</text><text x="275" y="372" font-size="12.5" fill="var(--color-accent)" text-anchor="middle">maintenu</text><path d="M18 408H322" fill="none" stroke="var(--color-line-strong)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><text x="18" y="431" font-size="12.3" fill="var(--color-muted)" text-anchor="start">Relation bancaire : vigilance continue</text><text x="18" y="449" font-size="12.3" fill="var(--color-muted)" text-anchor="start">et examen distinct du maintien de la relation</text>
</svg>
