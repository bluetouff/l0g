<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" viewBox="0 0 340 372" role="img" aria-labelledby="wingman-transition-en-m-title wingman-transition-en-m-desc" font-family="Inter Variable, Inter, sans-serif" font-weight="400" style="width:100%;height:auto">
<title id="wingman-transition-en-m-title">173 days from decision to withdrawal</title><desc id="wingman-transition-en-m-desc">Proportional timeline from the exit decision on 16 April 2020 to withdrawal of clearing access on 6 October 2020. Notice was sent on 8 May and liquidity risk cited on 5 June. Reporting also describes additional suspicious activity reports during the transition.</desc>
<text x="18" y="25" font-size="17" fill="var(--color-paper)" text-anchor="start">A 173-day transition</text><text x="18" y="46" font-size="12.5" fill="var(--color-muted)" text-anchor="start">MKB · 2020 · proportional axis</text><path d="M62 80V331" fill="none" stroke="var(--color-signal)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><circle cx="62" cy="80.0" r="3.5" fill="var(--color-signal)"/><circle cx="62" cy="111.92" r="3.5" fill="var(--color-signal)"/><circle cx="62" cy="152.54" r="3.5" fill="var(--color-signal)"/><circle cx="62" cy="331.0" r="3.5" fill="var(--color-signal)"/><path d="M68 80H91" fill="none" stroke="var(--color-line-strong)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><text x="94" y="74" font-size="13" fill="var(--color-paper)" text-anchor="start">16 APRIL</text><text x="94" y="92" font-size="13" fill="var(--color-paper)" text-anchor="start">Internal decision</text><path d="M68 111.92H169" fill="none" stroke="var(--color-line-strong)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><text x="174" y="111" font-size="13" fill="var(--color-paper)" text-anchor="start">8 MAY</text><text x="174" y="128" font-size="13" fill="var(--color-paper)" text-anchor="start">Thirty-day</text><text x="174" y="145" font-size="13" fill="var(--color-paper)" text-anchor="start">notice</text><path d="M68 152.54H83V166" fill="none" stroke="var(--color-line-strong)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><text x="94" y="173" font-size="13" fill="var(--color-paper)" text-anchor="start">5 JUNE</text><text x="94" y="191" font-size="13" fill="var(--color-paper)" text-anchor="start">Liquidity risk</text><text x="94" y="209" font-size="13" fill="var(--color-paper)" text-anchor="start">cited</text><rect x="94" y="239" width="228" height="54" rx="5" fill="var(--color-surface)" stroke="var(--color-accent)" stroke-width="1"/><text x="107" y="260" font-size="12.5" fill="var(--color-muted)" text-anchor="start">Further reports</text><text x="107" y="278" font-size="12.5" fill="var(--color-muted)" text-anchor="start">during the transition</text><path d="M68 331H91" fill="none" stroke="var(--color-line-strong)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><text x="94" y="330" font-size="12.5" fill="var(--color-paper)" text-anchor="start">6 OCTOBER</text><text x="94" y="349" font-size="12.5" fill="var(--color-paper)" text-anchor="start">Clearing access withdrawn</text>
</svg>
