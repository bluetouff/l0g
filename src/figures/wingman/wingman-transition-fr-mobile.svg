<svg xmlns="http://www.w3.org/2000/svg" xml:lang="fr" viewBox="0 0 340 372" role="img" aria-labelledby="wingman-transition-fr-m-title wingman-transition-fr-m-desc" font-family="Inter Variable, Inter, sans-serif" font-weight="400" style="width:100%;height:auto">
<title id="wingman-transition-fr-m-title">173 jours entre décision et retrait</title><desc id="wingman-transition-fr-m-desc">Chronologie proportionnelle de la décision de sortie du 16 avril 2020 au retrait de l’accès à la compensation le 6 octobre 2020. Le préavis est envoyé le 8 mai et le risque de liquidité invoqué le 5 juin. Les publications rapportent aussi des signalements supplémentaires pendant la transition.</desc>
<text x="18" y="25" font-size="17" fill="var(--color-paper)" text-anchor="start">173 jours de transition</text><text x="18" y="46" font-size="12.5" fill="var(--color-muted)" text-anchor="start">MKB · 2020 · axe proportionnel</text><path d="M62 80V331" fill="none" stroke="var(--color-signal)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><circle cx="62" cy="80.0" r="3.5" fill="var(--color-signal)"/><circle cx="62" cy="111.92" r="3.5" fill="var(--color-signal)"/><circle cx="62" cy="152.54" r="3.5" fill="var(--color-signal)"/><circle cx="62" cy="331.0" r="3.5" fill="var(--color-signal)"/><path d="M68 80H91" fill="none" stroke="var(--color-line-strong)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><text x="94" y="74" font-size="13" fill="var(--color-paper)" text-anchor="start">16 AVRIL</text><text x="94" y="92" font-size="13" fill="var(--color-paper)" text-anchor="start">Décision interne</text><path d="M68 111.92H169" fill="none" stroke="var(--color-line-strong)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><text x="174" y="111" font-size="13" fill="var(--color-paper)" text-anchor="start">8 MAI</text><text x="174" y="128" font-size="13" fill="var(--color-paper)" text-anchor="start">Préavis de</text><text x="174" y="145" font-size="13" fill="var(--color-paper)" text-anchor="start">30 jours</text><path d="M68 152.54H83V166" fill="none" stroke="var(--color-line-strong)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><text x="94" y="173" font-size="13" fill="var(--color-paper)" text-anchor="start">5 JUIN</text><text x="94" y="191" font-size="13" fill="var(--color-paper)" text-anchor="start">Risque de liquidité</text><text x="94" y="209" font-size="13" fill="var(--color-paper)" text-anchor="start">invoqué</text><rect x="94" y="239" width="228" height="54" rx="5" fill="var(--color-surface)" stroke="var(--color-accent)" stroke-width="1"/><text x="107" y="260" font-size="12.5" fill="var(--color-muted)" text-anchor="start">Autres signalements</text><text x="107" y="278" font-size="12.5" fill="var(--color-muted)" text-anchor="start">pendant la transition</text><path d="M68 331H91" fill="none" stroke="var(--color-line-strong)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><text x="94" y="330" font-size="12.5" fill="var(--color-paper)" text-anchor="start">6 OCTOBRE</text><text x="94" y="349" font-size="12.5" fill="var(--color-paper)" text-anchor="start">Accès à la compensation retiré</text>
</svg>
