<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" viewBox="0 0 600 305" role="img" aria-labelledby="wingman-correspondance-en-d-title wingman-correspondance-en-d-desc" font-family="Inter Variable, Inter, sans-serif" font-weight="400" style="width:100%;height:auto">
<title id="wingman-correspondance-en-d-title">MKB’s correspondent account</title><desc id="wingman-correspondance-en-d-desc">A customer sends an instruction to MKB. Its Deutsche Bank account supports settlement to the beneficiary’s bank. Deutsche Bank requests supporting information from MKB, which replies. General mechanism, without reconstructing an individual payment.</desc>
<text x="18" y="26" font-size="17.5" fill="var(--color-paper)" text-anchor="start">MKB’s correspondent account</text><text x="18" y="47" font-size="12.5" fill="var(--color-muted)" text-anchor="start">Payment and supporting information</text><rect x="18" y="88" width="110" height="86" rx="5" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text x="31" y="111" font-size="13" fill="var(--color-paper)" text-anchor="start">Customer</text><text x="31" y="137" font-size="12.5" fill="var(--color-muted)" text-anchor="start">Payment</text><text x="31" y="155" font-size="12.5" fill="var(--color-muted)" text-anchor="start">instruction</text><rect x="151" y="88" width="127" height="100" rx="5" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text x="165" y="112" font-size="16" fill="var(--color-paper)" text-anchor="start">MKB</text><text x="165" y="139" font-size="12" fill="var(--color-muted)" text-anchor="start">Knows its client</text><text x="165" y="157" font-size="12" fill="var(--color-muted)" text-anchor="start">and transactions</text><rect x="302" y="72" width="166" height="132" rx="5" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text x="315" y="97" font-size="15.5" fill="var(--color-paper)" text-anchor="start">Deutsche Bank</text><rect x="314" y="108" width="142" height="35" rx="5" fill="var(--color-surface)" stroke="var(--color-signal)" stroke-width="1"/><text x="385" y="130" font-size="12.5" fill="var(--color-signal)" text-anchor="middle">MKB’s account</text><text x="315" y="166" font-size="12" fill="var(--color-muted)" text-anchor="start">Assesses its bank client</text><text x="315" y="183" font-size="12" fill="var(--color-muted)" text-anchor="start">and payment messages</text><rect x="492" y="88" width="90" height="86" rx="5" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text x="537" y="112" font-size="12.5" fill="var(--color-paper)" text-anchor="middle">Beneficiary’s</text><text x="537" y="129" font-size="12.5" fill="var(--color-paper)" text-anchor="middle">bank</text><text x="537" y="158" font-size="12" fill="var(--color-muted)" text-anchor="middle">Credit</text><path d="M128 129H151" fill="none" stroke="var(--color-signal)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M146 126 151 129 146 132" fill="none" stroke="var(--color-signal)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M278 129H302" fill="none" stroke="var(--color-signal)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M297 126 302 129 297 132" fill="none" stroke="var(--color-signal)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M468 129H492" fill="none" stroke="var(--color-signal)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M487 126 492 129 487 132" fill="none" stroke="var(--color-signal)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M369 204V229H201V188" fill="none" stroke="var(--color-muted)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M198 193 201 188 204 193" fill="none" stroke="var(--color-muted)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><text x="286" y="222" font-size="12" fill="var(--color-muted)" text-anchor="middle">Supporting information request</text><path d="M232 188V267H422V204" fill="none" stroke="var(--color-signal)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M419 209 422 204 425 209" fill="none" stroke="var(--color-signal)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><text x="327" y="286" font-size="12.5" fill="var(--color-signal)" text-anchor="middle">MKB’s documented reply</text>
</svg>
