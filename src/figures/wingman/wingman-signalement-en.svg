<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" viewBox="0 0 600 361" role="img" aria-labelledby="wingman-signalement-en-d-title wingman-signalement-en-d-desc" font-family="Inter Variable, Inter, sans-serif" font-weight="400" style="width:100%;height:auto">
<title id="wingman-signalement-en-d-title">Reporting and payment execution</title><desc id="wingman-signalement-en-d-desc">General German framework checked on 19 November 2026. After reporting to the FIU, section 46 provides for a hold pending competent-authority consent or expiry of the third working day after filing without prohibition. A prohibition maintains the hold. Section46(2) exceptions are identified in the caption. Relationship due diligence continues separately.</desc>
