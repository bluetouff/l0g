oke-width="1"/><text x="105" y="206" font-size="13" fill="var(--color-signal)" text-anchor="middle">Consent received</text><text x="105" y="229" font-size="11.8" fill="var(--color-muted)" text-anchor="middle">FIU or prosecutor</text><rect x="213" y="182" width="174" height="75" rx="5" fill="var(--color-surface)" stroke="var(--color-amber)" stroke-width="1"/><text x="300" y="206" font-size="13" fill="var(--color-amber)" text-anchor="middle">Time elapsed</text><text x="300" y="229" font-size="11.8" fill="var(--color-muted)" text-anchor="middle">Third working day after filing</text><text x="300" y="246" font-size="11.8" fill="var(--color-muted)" text-anchor="middle">without prohibition</text><rect x="408" y="182" width="174" height="75" rx="5" fill="var(--color-surface)" stroke="var(--color-accent)" stroke-width="1"/><text x="495" y="206" font-size="13" fill="var(--color-accent)" text-anchor="middle">Prohibition</text><text x="495" y="229" font-size="11.8" fill="var(--color-muted)" text-anchor="middle">FIU or prosecutor</text><path d="M105 257V269H200V280" fill="none" stroke="var(--color-signal)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M197 275 200 280 203 275" fill="none" stroke="var(--color-signal)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M300 257V269H200" fill="none" stroke="var(--color-amber)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M495 257V280" fill="none" stroke="var(--color-accent)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M492 275 495 280 498 275" fill="none" stroke="var(--color-accent)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><text x="200" y="300" font-size="13" fill="var(--color-signal)" text-anchor="middle">Execution possible</text><text x="495" y="300" font-size="13" fill="var(--color-accent)" text-anchor="middle">Hold maintained</text><path d="M18 319H582" fill="none" stroke="var(--c