<title id="evidence-orders-en-m-title">The branches of European data production</title><desc id="evidence-orders-en-m-desc">Article 10 deadlines depend on notification and emergency status. Ten days or eight hours run from receipt of the EPOC. In a notified emergency, the 96-hour review of use runs from receipt of the notification. Statutory conditions, refusal grounds and remedies apply.</desc>
