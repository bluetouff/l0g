<title id="evidence-orders-fr-d-title">Les branches de la production européenne de données</title><desc id="evidence-orders-fr-d-desc">Les délais de l’article 10 dépendent de la notification et de l’urgence. Dix jours ou huit heures se comptent depuis réception de l’EPOC. En urgence notifiée, le contrôle de l’usage sous 96 heures commence à réception de la notification. Les conditions, refus et recours du règlement s’appliquent.</desc>
