<svg xmlns="http://www.w3.org/2000/svg" xml:lang="fr" viewBox="0 0 320 386" role="img" aria-labelledby="gaswo-scenarios-fr-m-title gaswo-scenarios-fr-m-desc" font-family="Inter Variable, Inter, sans-serif" font-weight="400" style="width:100%;height:auto">
<title id="gaswo-scenarios-fr-m-title">Les scénarios ENTSOG pour fin mars</title>
<desc id="gaswo-scenarios-fr-m-desc">Cinq scénarios publiés le 8 octobre 2026, avec gaz russe par gazoduc minimisé. Stock au 31 mars 2027 et réponse de demande en pourcentage : hiver de référence, GNL optimal 29 et 0, GNL tendu 13 et 0. Hiver froid, GNL abondant 20 et 0, GNL optimal 11 et 7, GNL tendu 11 et 12. La réponse représente une réduction de demande nécessaire ou un besoin potentiellement non couvert dans le modèle.</desc>
<metadata>{&quot;metric&quot;: [&quot;End-March 2027 EU working gas storage, share of capacity&quot;, &quot;Required demand response or potentially unmet demand in modelled Europe&quot;], &quot;stock_scope&quot;: &quot;EU&quot;, &quot;response_scope&quot;: &quot;EU plus UK, Switzerland, North Macedonia, Serbia, Bosnia and Herzegovina, Ukraine and Moldova&quot;, &quot;unit&quot;: &quot;Percent, separate 0–40 and 0–15 axes&quot;, &quot;publication_date&quot;: &quot;2026-10-08&quot;, &quot;stock_date&quot;: &quot;2027-03-31&quot;, &quot;source&quot;: &quot;https://www.entsog.eu/sites/default/files/2026-10/SO0072-26_Winter%20Supply%20Outlook%202026-27.pdf&quot;, &quot;locator&quot;: &quot;Table 1, page 5; geographical scope in section 2.2, page 13&quot;, &quot;russian_pipeline_supply&quot;: &quot;Minimised&quot;, &quot;rows&quot;: [[&quot;Reference&quot;, &quot;Optimal&quot;, 29, 0], [&quot;Reference&quot;, &quot;Tight&quot;, 13, 0], [&quot;Cold&quot;, &quot;High&quot;, 20, 0], [&quot;Cold&quot;, &quot;Optimal&quot;, 11, 7], [&quot;Cold&quot;, &quot;Tight&quot;, 11, 12]], &quot;method&quot;: &quot;Five selected scenarios from Table 1; October model, not recalibrated to observed November storage.&quot;}</metadata>
