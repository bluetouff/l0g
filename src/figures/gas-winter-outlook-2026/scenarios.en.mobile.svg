<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" viewBox="0 0 320 386" role="img" aria-labelledby="gaswo-scenarios-en-m-title gaswo-scenarios-en-m-desc" font-family="Inter Variable, Inter, sans-serif" font-weight="400" style="width:100%;height:auto">
<title id="gaswo-scenarios-en-m-title">ENTSOG scenarios for the end of March</title>
<desc id="gaswo-scenarios-en-m-desc">Five scenarios published on 8 October 2026, with Russian pipeline supplies minimised. Storage at 31 March 2027 and demand response in percent: reference winter, optimal LNG 29 and 0, tight LNG 13 and 0. Cold winter, high LNG 20 and 0, optimal LNG 11 and 7, tight LNG 11 and 12. Response represents required demand reductions or potentially unmet demand in the model.</desc>
