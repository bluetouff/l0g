<svg xmlns="http://www.w3.org/2000/svg" xml:lang="fr" viewBox="0 0 600 300" role="img" aria-labelledby="gaswo-withdrawal-fr-d-title gaswo-withdrawal-fr-d-desc" font-family="Inter Variable, Inter, sans-serif" font-weight="400" style="width:100%;height:auto">
<title id="gaswo-withdrawal-fr-d-title">Stock et débit de soutirage</title>
<desc id="gaswo-withdrawal-fr-d-desc">Schéma qualitatif de deux stockages, l’un plus rempli et l’autre moins rempli. Dans de nombreuses installations, une pression plus basse réduit le débit de soutirage disponible. Les flèches ne représentent aucune quantité ni proportion mesurée. L’AIE signale un ralentissement du soutirage sous 30 % de la capacité utile. Les caractéristiques dépendent du site.</desc>
