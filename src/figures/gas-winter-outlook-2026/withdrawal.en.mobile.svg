<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" viewBox="0 0 320 330" role="img" aria-labelledby="gaswo-withdrawal-en-m-title gaswo-withdrawal-en-m-desc" font-family="Inter Variable, Inter, sans-serif" font-weight="400" style="width:100%;height:auto">
<title id="gaswo-withdrawal-en-m-title">Inventory and withdrawal capacity</title>
<desc id="gaswo-withdrawal-en-m-desc">Qualitative comparison of higher and lower storage inventory. In many facilities, lower pressure reduces available withdrawal capacity. The arrows represent no measured flow or ratio. The IEA highlights slower withdrawal below 30% of working capacity. The relationship depends on the facility.</desc>
