  <title id="sfp-volume-en-d-1">A7A5: transaction volume drops</title>
  <desc id="sfp-volume-en-d-3">According to Elliptic, daily average A7A5 transaction volume was USD 24.3 million in June 2026, down 96% from July 2025. Two bars share a zero origin: July 2025 index 100; June 2026 approximate index 4. The reported decline is rounded. This token measure does not measure all A7 payments.</desc>
  <metadata>{"publisher": "l0g", "license": "CC-BY-4.0", "cutoff": "2026-11-19", "language": "en", "chart": "volume-token", "unit": "Index of daily transaction volume; July2025=100; USD per day for June2026 mean", "period": "July2025 and June2026; published2026-07-29", "limits": "Approximate June index4 derived from a rounded96% decline. Only two observations, no monthly interpolation. Elliptic commercial estimate not independently replicated. Neither total A7 activity nor oil receipts.", "sources": [{"id": "S13", "url": "https://www.elliptic.co/insights/the-fall-of-a7a5-how-sanctions-strangled-the-ruble-stablecoin/"}]}</metadata>
