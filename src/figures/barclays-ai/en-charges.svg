<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="bai-en-charges-d-title bai-en-charges-d-desc" class="l0g-barclays-ai-svg" style="width:100%;height:auto"><title id="bai-en-charges-d-title">Charges and savings across distinct periods</title><desc id="bai-en-charges-d-desc">Q3 structural charges of £201m, approximately £300m expected in Q4 and approximately £200m of Q3 efficiency savings. No matching project scope has been established. Positions describe timing, not cash flows or amortisation.</desc><rect id="bai-en-charges-d-frame" x="0" y="0" width="1000" height="650" rx="10" fill="var(--color-ink)"/><text data-panel="bai-en-charges-d-frame" x="38" y="40" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="22" font-weight="700" text-anchor="start">l0g / INVESTIGATION</text><text data-panel="bai-en-charges-d-frame" x="962" y="40" fill="var(--color-signal)" font-family="l0g Barclays AI" font-size="22" font-weight="700" text-anchor="end">02</text><text data-panel="bai-en-charges-d-frame" x="38" y="88" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="32" font-weight="700" text-anchor="start">Charges and savings across distinct periods</text><text data-panel="bai-en-charges-d-frame" x="38" y="128" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="22" font-weight="400" text-anchor="start">Barclays • GBP million • Q3 and Q4 2026 forecast</text><line x1="100" y1="195" x2="900" y2="195" stroke="var(--color-line-strong)" stroke-width="1.5"/><text data-panel="bai-en-charges-d-frame" x="100" y="176" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="22" font-weight="700" text-anchor="start">Q3 2026</text><text data-panel="bai-en-charges-d-frame" x="560" y="176" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="22" font-weight="700" text-anchor="start">Q4 2026</text><path d="M 504 286 L 542 286" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 533 291 L 542 286 L 533 281" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect id="bai-en-charges-d-card-q3" x="60" y="220" width="445" height="120" rx="10" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1.5"/><rect id="bai-en-charges-d-card-q4" x="545" y="220" width="395" height="120" rx="10" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1.5"/><text data-panel="bai-en-charges-d-card-q3" x="82" y="271" fill="var(--color-accent)" font-family="l0g Barclays AI" font-size="40" font-weight="700" text-anchor="start">£201m</text><text data-panel="bai-en-charges-d-card-q3" x="82" y="314" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="23" font-weight="400" text-anchor="start">Structural cost actions</text><text data-panel="bai-en-charges-d-card-q4" x="567" y="271" fill="var(--color-amber)" font-family="l0g Barclays AI" font-size="40" font-weight="700" text-anchor="start">≈ £300m</text><text data-panel="bai-en-charges-d-card-q4" x="567" y="314" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="23" font-weight="400" text-anchor="start">Forecast charges</text><rect id="bai-en-charges-d-card-savings" x="60" y="370" width="445" height="155" rx="10" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1.5"/><text data-panel="bai-en-charges-d-card-savings" x="82" y="418" fill="var(--color-signal)" font-family="l0g Barclays AI" font-size="40" font-weight="700" text-anchor="start">≈ £200m</text><text data-panel="bai-en-charges-d-card-savings" x="82" y="461" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="23" font-weight="400" text-anchor="start">Reported Q3 efficiency savings</text><text data-panel="bai-en-charges-d-frame" x="545" y="405" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="23" font-weight="400" text-anchor="start">Earlier measures may already</text><text data-panel="bai-en-charges-d-frame" x="545" y="436.74" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="23" font-weight="400" text-anchor="start">contribute to savings. A shared</text><text data-panel="bai-en-charges-d-frame" x="545" y="468.48" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="23" font-weight="400" text-anchor="start">scope is unestablished.</text><line x1="38" y1="578" x2="962" y2="578" stroke="var(--color-line-strong)" stroke-width="1.5"/><text data-panel="bai-en-charges-d-frame" x="38" y="606" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="22" font-weight="400" text-anchor="start">Source: Barclays, 22.10.2026 [S01]</text><text data-panel="bai-en-charges-d-frame" x="38" y="635" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="22" font-weight="400" text-anchor="start">Charges and payments may occur separately</text></svg>
