<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1000" role="img" aria-labelledby="bai-fr-bases-m-title bai-fr-bases-m-desc" class="l0g-barclays-ai-svg" style="width:100%;height:auto"><title id="bai-fr-bases-m-title">Trois bases pour comparer les coûts</title><desc id="bai-fr-bases-m-desc">Prévisions approximatives de Barclays au 22 octobre 2026. Total annuel 2026 : 18,5 Md£. Rythme de coûts en sortie de 2026 : 18,0 Md£, après retraitement de 0,3 Md£ de charges structurelles, 0,1 Md£ de rémunération et 0,1 Md£ de financement automobile. Total annuel 2027 : 18,4 Md£. La différence entre totaux prévus est de −0,1 Md£. Comparer le total annuel 2027 au rythme de sortie de 2026 produit +0,4 Md£ mais mélange des définitions.</desc><rect id="bai-fr-bases-m-frame" x="0" y="0" width="420" height="1000" rx="10" fill="var(--color-ink)"/><text data-panel="bai-fr-bases-m-frame" x="22" y="33" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="17" font-weight="700" text-anchor="start">l0g / ANALYSE</text><text data-panel="bai-fr-bases-m-frame" x="398" y="33" fill="var(--color-signal)" font-family="l0g Barclays AI" font-size="17" font-weight="700" text-anchor="end">05</text><text data-panel="bai-fr-bases-m-frame" x="22" y="75" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="25" font-weight="700" text-anchor="start">Trois bases pour</text><text data-panel="bai-fr-bases-m-frame" x="22" y="109.5" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="25" font-weight="700" text-anchor="start">comparer les coûts</text><text data-panel="bai-fr-bases-m-frame" x="22" y="150" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="17" font-weight="400" text-anchor="start">Prévisions Barclays • 22.10.2026 • milliards</text><text data-panel="bai-fr-bases-m-frame" x="22" y="173.46" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="17" font-weight="400" text-anchor="start">de GBP</text><text data-panel="bai-fr-bases-m-frame" x="22" y="231" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="20" font-weight="700" text-anchor="start">2026 • total prévu</text><rect x="22" y="255" width="305.25" height="30" rx="0" fill="var(--color-paper)"/><text data-panel="bai-fr-bases-m-frame" x="339.25" y="279" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="20" font-weight="700" text-anchor="start">≈ 18,5</text><text data-panel="bai-fr-bases-m-frame" x="22" y="406" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="20" font-weight="700" text-anchor="start">2026 • rythme de sortie</text><rect x="22" y="430" width="297" height="30" rx="0" fill="var(--color-signal)"/><text data-panel="bai-fr-bases-m-frame" x="339.25" y="454" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="20" font-weight="700" text-anchor="start">≈ 18,0</text><rect x="319" y="430" width="8.25" height="30" rx="0" fill="var(--color-ink)" stroke="var(--color-signal)" stroke-width="1.5"/><text data-panel="bai-fr-bases-m-frame" x="22" y="492" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="17" font-weight="400" text-anchor="start">0,5 Md£ d’éléments exclus</text><text data-panel="bai-fr-bases-m-frame" x="22" y="581" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="20" font-weight="700" text-anchor="start">2027 • total prévu</text><rect x="22" y="605" width="303.6" height="30" rx="0" fill="var(--color-paper)"/><text data-panel="bai-fr-bases-m-frame" x="337.6" y="629" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="20" font-weight="700" text-anchor="start">≈ 18,4</text><rect id="bai-fr-bases-m-card-comparison" x="22" y="797" width="376" height="85" rx="10" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1.5"/><text data-panel="bai-fr-bases-m-card-comparison" x="40" y="828" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="20" font-weight="700" text-anchor="start">Totaux prévus : −0,1 Md£</text><text data-panel="bai-fr-bases-m-card-comparison" x="40" y="861" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="18" font-weight="400" text-anchor="start">Face à la rythme de sortie : +0,4 Md£</text><line x1="22" y1="898" x2="398" y2="898" stroke="var(--color-line-strong)" stroke-width="1.5"/><text data-panel="bai-fr-bases-m-frame" x="22" y="926" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="17" font-weight="400" text-anchor="start">Source : Barclays, 22.10.2026 [S01]</text><text data-panel="bai-fr-bases-m-frame" x="22" y="963" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="17" font-weight="400" text-anchor="start">0–20 Md£ • bases de définition différentes</text></svg>
