<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 970" role="img" aria-labelledby="bai-fr-ratio-m-title bai-fr-ratio-m-desc" class="l0g-barclays-ai-svg" style="width:100%;height:auto"><title id="bai-fr-ratio-m-title">Le ratio baisse, les dépenses augmentent</title><desc id="bai-fr-ratio-m-desc">Barres à origine zéro, échelle commune 0–8 000 M£. Revenus: 7 167 puis 7 365. Dépenses totales d’exploitation: 4 497 puis 4 560. Ratio = dépenses / revenus: 62,7 % puis 61,9 %, avant arrondi entier de la banque. Les écarts sont calculés sur les valeurs publiées, sans ajustement de périmètre ou de change.</desc><rect id="bai-fr-ratio-m-frame" x="0" y="0" width="420" height="970" rx="10" fill="var(--color-ink)"/><text data-panel="bai-fr-ratio-m-frame" x="22" y="33" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="17" font-weight="700" text-anchor="start">l0g / ANALYSE</text><text data-panel="bai-fr-ratio-m-frame" x="398" y="33" fill="var(--color-signal)" font-family="l0g Barclays AI" font-size="17" font-weight="700" text-anchor="end">03</text><text data-panel="bai-fr-ratio-m-frame" x="22" y="75" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="25" font-weight="700" text-anchor="start">Le ratio baisse, les</text><text data-panel="bai-fr-ratio-m-frame" x="22" y="109.5" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="25" font-weight="700" text-anchor="start">dépenses augmentent</text><text data-panel="bai-fr-ratio-m-frame" x="22" y="150" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="17" font-weight="400" text-anchor="start">Barclays • T3 2025 / T3 2026 • millions de</text><text data-panel="bai-fr-ratio-m-frame" x="22" y="173.46" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="17" font-weight="400" text-anchor="start">GBP</text><text data-panel="bai-fr-ratio-m-frame" x="22" y="220" fill="var(--color-signal)" font-family="l0g Barclays AI" font-size="18" font-weight="700" text-anchor="start">Revenus</text><text data-panel="bai-fr-ratio-m-frame" x="180" y="220" fill="var(--color-accent)" font-family="l0g Barclays AI" font-size="18" font-weight="700" text-anchor="start">Dépenses</text><text data-panel="bai-fr-ratio-m-frame" x="22" y="245" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="19" font-weight="700" text-anchor="start">T3 2025</text><rect id="bai-fr-ratio-m-income-0" x="22" y="270" width="295.63875" height="28" rx="0" fill="var(--color-signal)"/><rect id="bai-fr-ratio-m-expenses-0" x="22" y="310" width="185.50125" height="28" rx="0" fill="var(--color-accent)"/><text data-panel="bai-fr-ratio-m-income-0" x="309.63875" y="290" fill="var(--color-surface)" font-family="l0g Barclays AI" font-size="17" font-weight="700" text-anchor="end">7 167</text><text data-panel="bai-fr-ratio-m-expenses-0" x="199.50125" y="330" fill="var(--color-surface)" font-family="l0g Barclays AI" font-size="17" font-weight="700" text-anchor="end">4 497</text><text data-panel="bai-fr-ratio-m-frame" x="22" y="387" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="31" font-weight="700" text-anchor="start">62,7 %</text><text data-panel="bai-fr-ratio-m-frame" x="22" y="420" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="17" font-weight="400" text-anchor="start">ratio</text><text data-panel="bai-fr-ratio-m-frame" x="22" y="480" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="19" font-weight="700" text-anchor="start">T3 2026</text><rect id="bai-fr-ratio-m-income-1" x="22" y="505" width="303.80625" height="28" rx="0" fill="var(--color-signal)"/><rect id="bai-fr-ratio-m-expenses-1" x="22" y="545" width="188.1" height="28" rx="0" fill="var(--color-accent)"/><text data-panel="bai-fr-ratio-m-income-1" x="317.80625" y="525" fill="var(--color-surface)" font-family="l0g Barclays AI" font-size="17" font-weight="700" text-anchor="end">7 365</text><text data-panel="bai-fr-ratio-m-expenses-1" x="202.1" y="565" fill="var(--color-surface)" font-family="l0g Barclays AI" font-size="17" font-weight="700" text-anchor="end">4 560</text><text data-panel="bai-fr-ratio-m-frame" x="22" y="622" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="31" font-weight="700" text-anchor="start">61,9 %</text><text data-panel="bai-fr-ratio-m-frame" x="22" y="655" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="17" font-weight="400" text-anchor="start">ratio</text><text data-panel="bai-fr-ratio-m-frame" x="22" y="723" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="17" font-weight="400" text-anchor="start">0</text><text data-panel="bai-fr-ratio-m-frame" x="104.5" y="723" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="17" font-weight="400" text-anchor="middle">2k</text><text data-panel="bai-fr-ratio-m-frame" x="187" y="723" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="17" font-weight="400" text-anchor="middle">4k</text><text data-panel="bai-fr-ratio-m-frame" x="269.5" y="723" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="17" font-weight="400" text-anchor="middle">6k</text><text data-panel="bai-fr-ratio-m-frame" x="352" y="723" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="17" font-weight="400" text-anchor="end">8k</text><line x1="22" y1="703" x2="352" y2="703" stroke="var(--color-line-strong)" stroke-width="1.5"/><text data-panel="bai-fr-ratio-m-frame" x="22" y="793" fill="var(--color-signal)" font-family="l0g Barclays AI" font-size="21" font-weight="700" text-anchor="start">Revenus +2,8 %</text><text data-panel="bai-fr-ratio-m-frame" x="22" y="830" fill="var(--color-accent)" font-family="l0g Barclays AI" font-size="21" font-weight="700" text-anchor="start">Dépenses +1,4 %</text><line x1="22" y1="868" x2="398" y2="868" stroke="var(--color-line-strong)" stroke-width="1.5"/><text data-panel="bai-fr-ratio-m-frame" x="22" y="896" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="17" font-weight="400" text-anchor="start">Source : Barclays, 22.10.2026 [S01]</text><text data-panel="bai-fr-ratio-m-frame" x="22" y="933" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="17" font-weight="400" text-anchor="start">Origine zéro • échelle commune : 0–8 000</text><text data-panel="bai-fr-ratio-m-frame" x="22" y="956.46" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="17" font-weight="400" text-anchor="start">M£</text></svg>
