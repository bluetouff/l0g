<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1140" role="img" aria-labelledby="bai-fr-profit-m-title bai-fr-profit-m-desc" class="l0g-barclays-ai-svg" style="width:100%;height:auto"><title id="bai-fr-profit-m-title">Le bénéfice avant impôt gagne 245 M£</title><desc id="bai-fr-profit-m-desc">Réconciliation intégrale du résultat avant impôt: 2 077 + 198 − 311 − 23 + 271 − 19 + 129 = 2 322 M£. Le crédit de prélèvements de 12 M£ en 2025 devient une charge de 11 M£. Les contentieux passent d’une charge de 255 M£ à un produit net de 16 M£. Aucune ligne ne mesure isolément l’effet de l’IA. Le graphique mobile montre les variations sur une échelle centrée sur zéro.</desc><rect id="bai-fr-profit-m-frame" x="0" y="0" width="420" height="1140" rx="10" fill="var(--color-ink)"/><text data-panel="bai-fr-profit-m-frame" x="22" y="33" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="17" font-weight="700" text-anchor="start">l0g / ANALYSE</text><text data-panel="bai-fr-profit-m-frame" x="398" y="33" fill="var(--color-signal)" font-family="l0g Barclays AI" font-size="17" font-weight="700" text-anchor="end">04</text><text data-panel="bai-fr-profit-m-frame" x="22" y="75" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="25" font-weight="700" text-anchor="start">Le bénéfice avant impôt</text><text data-panel="bai-fr-profit-m-frame" x="22" y="109.5" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="25" font-weight="700" text-anchor="start">gagne 245 M£</text><text data-panel="bai-fr-profit-m-frame" x="22" y="150" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="17" font-weight="400" text-anchor="start">Barclays • T3 2026 / T3 2025 • millions de</text><text data-panel="bai-fr-profit-m-frame" x="22" y="173.46" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="17" font-weight="400" text-anchor="start">GBP</text><text data-panel="bai-fr-profit-m-frame" x="22" y="230" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="25" font-weight="700" text-anchor="start">T3 2025 : 2 077 M£</text><text data-panel="bai-fr-profit-m-frame" x="22" y="285" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="19" font-weight="700" text-anchor="start">Revenus</text><rect x="220" y="300" width="85.14" height="24" rx="0" fill="var(--color-signal)"/><text data-panel="bai-fr-profit-m-frame" x="315.14" y="320" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="19" font-weight="700" text-anchor="start">+198</text><text data-panel="bai-fr-profit-m-frame" x="22" y="389" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="19" font-weight="700" text-anchor="start">Coûts</text><rect x="86.27" y="404" width="133.73" height="24" rx="0" fill="var(--color-accent)"/><text data-panel="bai-fr-profit-m-frame" x="76.27" y="424" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="19" font-weight="700" text-anchor="end">−311</text><text data-panel="bai-fr-profit-m-frame" x="22" y="493" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="19" font-weight="700" text-anchor="start">Prélèv.</text><rect x="210.11" y="508" width="9.89" height="24" rx="0" fill="var(--color-accent)"/><text data-panel="bai-fr-profit-m-frame" x="200.11" y="528" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="19" font-weight="700" text-anchor="end">−23</text><text data-panel="bai-fr-profit-m-frame" x="22" y="597" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="19" font-weight="700" text-anchor="start">Contentieux</text><rect x="220" y="612" width="116.53" height="24" rx="0" fill="var(--color-signal)"/><text data-panel="bai-fr-profit-m-frame" x="346.53" y="632" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="19" font-weight="700" text-anchor="start">+271</text><text data-panel="bai-fr-profit-m-frame" x="22" y="701" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="19" font-weight="700" text-anchor="start">Autres produits</text><rect x="211.83" y="716" width="8.17" height="24" rx="0" fill="var(--color-accent)"/><text data-panel="bai-fr-profit-m-frame" x="201.83" y="736" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="19" font-weight="700" text-anchor="end">−19</text><text data-panel="bai-fr-profit-m-frame" x="22" y="805" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="19" font-weight="700" text-anchor="start">Crédit</text><rect x="220" y="820" width="55.47" height="24" rx="0" fill="var(--color-signal)"/><text data-panel="bai-fr-profit-m-frame" x="285.47" y="840" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="19" font-weight="700" text-anchor="start">+129</text><line x1="220" y1="280" x2="220" y2="860" stroke="var(--color-line-strong)" stroke-width="1.5"/><text data-panel="bai-fr-profit-m-frame" x="220" y="887" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="17" font-weight="400" text-anchor="middle">0</text><text data-panel="bai-fr-profit-m-frame" x="22" y="945" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="25" font-weight="700" text-anchor="start">T3 2026 : 2 322 M£</text><text data-panel="bai-fr-profit-m-frame" x="22" y="987" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="18" font-weight="400" text-anchor="start">Contentieux + crédit : +400 M£.</text><text data-panel="bai-fr-profit-m-frame" x="22" y="1011.84" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="18" font-weight="400" text-anchor="start">Variation nette : +245 M£.</text><line x1="22" y1="1038" x2="398" y2="1038" stroke="var(--color-line-strong)" stroke-width="1.5"/><text data-panel="bai-fr-profit-m-frame" x="22" y="1066" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="17" font-weight="400" text-anchor="start">Source : Barclays, 22.10.2026 [S01]</text><text data-panel="bai-fr-profit-m-frame" x="22" y="1103" fill=