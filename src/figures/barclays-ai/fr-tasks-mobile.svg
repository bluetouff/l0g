<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1050" role="img" aria-labelledby="bai-fr-tasks-m-title bai-fr-tasks-m-desc" class="l0g-barclays-ai-svg" style="width:100%;height:auto"><title id="bai-fr-tasks-m-title">Une tâche rapide, un service à mesurer</title><desc id="bai-fr-tasks-m-desc">Exemple créé par l0g: 40 + 60 = 100 minutes; outil: 20 + 60 = 80; vérification supplémentaire: 20 + 60 + 10 = 90. Baisse du temps = 10 %. Hausse de production horaire à volume et qualité constants = 100 / 90 − 1 = 11,1 %. Ni prévision ni observation bancaire.</desc><rect id="bai-fr-tasks-m-frame" x="0" y="0" width="420" height="1050" rx="10" fill="var(--color-ink)"/><text data-panel="bai-fr-tasks-m-frame" x="22" y="33" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="17" font-weight="700" text-anchor="start">l0g / ANALYSE</text><text data-panel="bai-fr-tasks-m-frame" x="398" y="33" fill="var(--color-signal)" font-family="l0g Barclays AI" font-size="17" font-weight="700" text-anchor="end">06</text><text data-panel="bai-fr-tasks-m-frame" x="22" y="75" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="25" font-weight="700" text-anchor="start">Une tâche rapide, un</text><text data-panel="bai-fr-tasks-m-frame" x="22" y="109.5" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="25" font-weight="700" text-anchor="start">service à mesurer</text><text data-panel="bai-fr-tasks-m-frame" x="22" y="150" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="17" font-weight="400" text-anchor="start">EXEMPLE HYPOTHÉTIQUE l0g • minutes par</text><text data-panel="bai-fr-tasks-m-frame" x="22" y="173.46" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="17" font-weight="400" text-anchor="start">dossier</text><text data-panel="bai-fr-tasks-m-frame" x="22" y="256" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="21" font-weight="700" text-anchor="start">Avant</text><rect id="bai-fr-tasks-m-bar