<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="bai-fr-charges-d-title bai-fr-charges-d-desc" class="l0g-barclays-ai-svg" style="width:100%;height:auto"><title id="bai-fr-charges-d-title">Charges et économies : des périodes distinctes</title><desc id="bai-fr-charges-d-desc">201 M£ de charges structurelles au T3, environ 300 M£ prévus au T4 et environ 200 M£ d’économies d’efficacité au T3. Aucun périmètre commun n’est démontré entre ces trois montants. La mise en page décrit les calendriers; elle ne représente ni un flux de trésorerie ni un amortissement.</desc><rect id="bai-fr-charges-d-frame" x="0" y="0" width="1000" height="650" rx="10" fill="var(--color-ink)"/><text data-panel="bai-fr-charges-d-frame" x="38" y="40" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="22" font-weight="700" text-anchor="start">l0g / ANALYSE</text><text data-panel="bai-fr-charges-d-frame" x="962" y="40" fill="var(--color-signal)" font-family="l0g Barclays AI" font-size="22" font-weight="700" text-anchor="end">02</text><text data-panel="bai-fr-charges-d-frame" x="38" y="88" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="32" font-weight="700" text-anchor="start">Charges et économies : des périodes distinctes</text><text data-panel="bai-fr-charges-d-frame" x="38" y="128" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="22" font-weight="400" text-anchor="start">Barclays • millions de GBP • T3 et prévision T4 2026</text><line x1="100" y1="195" x2="900" y2="195" stroke="var(--color-line-strong)" stroke-width="1.5"/><text data-panel="bai-fr-charges-d-frame" x="100" y="176" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="22" font-weight="700" text-anchor="start">T3 2026</text><text data-panel="bai-fr-charges-d-frame" x="560" y="176" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="22" font-weight="700" text-anchor="start">T4 2026</text><path d="M 504 286 L 542 286" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 533 291 L 542 286 L 533 281" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect id="bai-fr-charges-d-card-q3" x="60" y="220" width="445" height="120" rx="10" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1.5"/><rect id="bai-fr-charges-d-card-q4" x="545" y="220" width="395" height="120" rx="10" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1.5"/><text data-panel="bai-fr-charges-d-card-q3" x="82" y="271" fill="var(--color-accent)" font-family="l0g Barclays AI" font-size="40" font-weight="700" text-anchor="start">201 M£</text><text data-panel="bai-fr-charges-d-card-q3" x="82" y="314" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="23" font-weight="400" text-anchor="start">Charges structurelles</text><text data-panel="bai-fr-charges-d-card-q4" x="567" y="271" fill="var(--color-amber)" font-family="l0g Barclays AI" font-size="40" font-weight="700" text-anchor="start">≈ 300 M£</text><text data-panel="bai-fr-charges-d-card-q4" x="567" y="314" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="23" font-weight="400" text-anchor="start">Prévision de charges</text><rect id="bai-fr-charges-d-card-savings" x="60" y="370" width="445" height="155" rx="10" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1.5"/><text data-panel="bai-fr-charges-d-card-savings" x="82" y="418" fill="var(--color-signal)" font-family="l0g Barclays AI" font-size="40" font-weight="700" text-anchor="start">≈ 200 M£</text><text data-panel="bai-fr-charges-d-card-savings" x="82" y="461" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="23" font-weight="400" text-anchor="start">Économies d’efficacité déclarées</text><text data-panel="bai-fr-charges-d-card-savings" x="82" y="492.74" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="23" font-weight="400" text-anchor="start">au T3</text><text data-panel="bai-fr-charges-d-frame" x="545" y="405" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="23" font-weight="400" text-anchor="start">Des mesures antérieures peuvent</text><text data-panel="bai-fr-charges-d-frame" x="545" y="436.74" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="23" font-weight="400" text-anchor="start">déjà contribuer aux économies.</text><text data-panel="bai-fr-charges-d-frame" x="545" y="468.48" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="23" font-weight="400" text-anchor="start">Périmètres communs non établis.</text><line x1="38" y1="578" x2="962" y2="578" stroke="var(--color-line-strong)" stroke-width="1.5"/><text data-panel="bai-fr-charges-d-frame" x="38" y="606" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="22" font-weight="400" text-anchor="start">Source : Barclays, 22.10.2026 [S01]</text><text data-panel="bai-fr-charges-d-frame" x="38" y="635" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="22" font-weight="400" text-anchor="start">Charges et paiements peuvent être décalés</text></svg>
