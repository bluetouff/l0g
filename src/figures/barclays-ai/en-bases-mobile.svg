<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1000" role="img" aria-labelledby="bai-en-bases-m-title bai-en-bases-m-desc" class="l0g-barclays-ai-svg" style="width:100%;height:auto"><title id="bai-en-bases-m-title">Three bases for comparing costs</title><desc id="bai-en-bases-m-desc">Approximate Barclays forecasts as of 22 October 2026. Full-year 2026 total: £18.5bn. 2026 exit-rate costs: £18.0bn, after excluding £0.3bn of structural cost actions, £0.1bn of compensation and £0.1bn of motor finance. Full-year 2027 total: £18.4bn. Forecast annual totals differ by −£0.1bn. Comparing the full-year 2027 total with 2026 exit-rate costs produces +£0.4bn across different definitions.</desc><rect id="bai-en-bases-m-frame" x="0" y="0" width="420" height="1000" rx="10" fill="var(--color-ink)"/><text data-panel="bai-en-bases-m-frame" x="22" y="33" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="17" font-weight="700" text-anchor="start">l0g / INVESTIGATION</text><text data-panel="bai-en-bases-m-frame" x="398" y="33" fill="var(--color-signal)" font-family="l0g Barclays AI" font-size="17" font-weight="700" text-anchor="end">05</text><text data-panel="bai-en-bases-m-frame" x="22" y="75" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="25" font-weight="700" text-anchor="start">Three bases for</text><text data-panel="bai-en-bases-m-frame" x="22" y="109.5" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="25" font-weight="700" text-anchor="start">comparing costs</text><text data-panel="bai-en-bases-m-frame" x="22" y="150" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="17" font-weight="400" text-anchor="start">Barclays forecasts • 22.10.2026 • GBP</text><text data-panel="bai-en-bases-m-frame" x="22" y="173.46" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="17" font-weight="400" text-anchor="start">billion</text><text data-panel="bai-en-bases-m-frame" x="22" y="231" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="20" font-weight="700" text-anchor="start">2026 • forecast total</text><rect x="22" y="255" width="305.25" height="30" rx="0" fill="var(--color-paper)"/><text data-panel="bai-en-bases-m-frame" x="339.25" y="279" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="20" font-weight="700" text-anchor="start">≈ 18.5</text><text data-panel="bai-en-bases-m-frame" x="22" y="406" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="20" font-weight="700" text-anchor="start">2026 • exit-rate base</text><rect x="22" y="430" width="297" height="30" rx="0" fill="var(--color-signal)"/><text data-panel="bai-en-bases-m-frame" x="339.25" y="454" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="20" font-weight="700" text-anchor="start">≈ 18.0</text><rect x="319" y="430" width="8.25" height="30" rx="0" fill="var(--color-ink)" stroke="var(--color-signal)" stroke-width="1.5"/><text data-panel="bai-en-bases-m-frame" x="22" y="492" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="17" font-weight="400" text-anchor="start">£0.5bn of excluded items</text><text data-panel="bai-en-bases-m-frame" x="22" y="581" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="20" font-weight="700" text-anchor="start">2027 • forecast total</text><rect x="22" y="605" width="303.6" height="30" rx="0" fill="var(--color-paper)"/><text data-panel="bai-en-bases-m-frame" x="337.6" y="629" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="20" font-weight="700" text-anchor="start">≈ 18.4</text><rect id="bai-en-bases-m-card-comparison" x="22" y="797" width="376" height="85" rx="10" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1.5"/><text data-panel="bai-en-bases-m-card-comparison" x="40" y="828" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="20" font-weight="700" text-anchor="start">Forecast totals: −£0.1bn</text><text data-panel="bai-en-bases-m-card-comparison" x="40" y="861" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="18" font-weight="400" text-anchor="start">Versus exit-rate base: +£0.4bn</text><line x1="22" y1="898" x2="398" y2="898" stroke="var(--color-line-strong)" stroke-width="1.5"/><text data-panel="bai-en-bases-m-frame" x="22" y="926" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="17" font-weight="400" text-anchor="start">Source: Barclays, 22.10.2026 [S01]</text><text data-panel="bai-en-bases-m-frame" x="22" y="963" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="17" font-weight="400" text-anchor="start">£0–20bn • differently defined bases</text></svg>
