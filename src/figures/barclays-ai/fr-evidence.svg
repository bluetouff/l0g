<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="bai-fr-evidence-d-title bai-fr-evidence-d-desc" class="l0g-barclays-ai-svg" style="width:100%;height:auto"><title id="bai-fr-evidence-d-title">De l’usage de l’IA à la décision d’effectif</title><desc id="bai-fr-evidence-d-desc">Schéma conceptuel proposé par l0g. Le sens des flèches indique des conditions d’évaluation, sans coefficient chiffré. Le contrôle de qualité et la comparaison avec une référence sont nécessaires pour attribuer un résultat à l’IA. La continuité et les autres emplois possibles du temps libéré interviennent avant la décision d’effectif.</desc><rect id="bai-fr-evidence-d-frame" x="0" y="0" width="1000" height="650" rx="10" fill="var(--color-ink)"/><text data-panel="bai-fr-evidence-d-frame" x="38" y="40" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="22" font-weight="700" text-anchor="start">l0g / ANALYSE</text><text data-panel="bai-fr-evidence-d-frame" x="962" y="40" fill="var(--color-signal)" font-family="l0g Barclays AI" font-size="22" font-weight="700" text-anchor="end">07</text><text data-panel="bai-fr-evidence-d-frame" x="38" y="88" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="32" font-weight="700" text-anchor="start">De l’usage de l’IA à la décision d’effectif</text><text data-panel="bai-fr-evidence-d-frame" x="38" y="128" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="22" font-weight="400" text-anchor="start">Cadre d’analyse l0g • mécanisme conceptuel</text><rect id="bai-fr-evidence-d-card-step-0" x="40" y="190" width="275" height="130" rx="10" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1.5"/><text data-panel="bai-fr-evidence-d-card-step-0" x="57" y="220" fill="var(--color-signal)" font-family="l0g Barclays AI" font-size="22" font-weight="700" text-anchor="start">1</text><text data-panel="bai-fr-evidence-d-card-step-0" x="57" y="253" fill="var(--color-paper