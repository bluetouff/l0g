<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 970" role="img" aria-labelledby="bai-fr-charges-m-title bai-fr-charges-m-desc" class="l0g-barclays-ai-svg" style="width:100%;height:auto"><title id="bai-fr-charges-m-title">Charges et économies : des périodes distinctes</title><desc id="bai-fr-charges-m-desc">201 M£ de charges structurelles au T3, environ 300 M£ prévus au T4 et environ 200 M£ d’économies d’efficacité au T3. Aucun périmètre commun n’est démontré entre ces trois montants. La mise en page décrit les calendriers; elle ne représente ni un flux de trésorerie ni un amortissement.</desc><rect id="bai-fr-charges-m-frame" x="0" y="0" width="420" height="970" rx="10" fill="var(--color-ink)"/><text data-panel="bai-fr-charges-m-frame" x="22" y="33" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="17" font-weight="700" text-anchor="start">l0g / ANALYSE</text><text data-panel="bai-fr-charges-m-frame" x="398" y="33" fill="var(--color-signal)" font-family="l0g Barclays AI" font-size="17" font-weight="700" text-anchor="end">02</text><text data-panel="bai-fr-charges-m-frame" x="22" y="75" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="25" font-weight="700" text-anchor="start">Charges et économies :</text><text data-panel="bai-fr-charges-m-frame" x="22" y="109.5" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="25" font-weight="700" text-anchor="start">des périodes distinctes</text><text data-panel="bai-fr-charges-m-frame" x="22" y="150" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="17" font-weight="400" text-anchor="start">Barclays • millions de GBP • T3 et prévision</text><text data-panel="bai-fr-charges-m-frame" x="22" y="173.46" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="17" font-weight="400" text-anchor="start">T4 2026</text><rect id="bai-fr-charges-m-card-q3" x="22" y="215" width="376" height="140" rx="10" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1.5"/><rect id="bai-fr-charges-m-card-q4" x="22" y="400" width="376" height="140" rx="10" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1.5"/><rect id="bai-fr-charges-m-card-savings" x="22" y="585" width="376" height="135" rx="10" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1.5"/><text data-panel="bai-fr-charges-m-card-q3" x="40" y="247" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="18" font-weight="700" text-anchor="start">T3 2026</text><text data-panel="bai-fr-charges-m-card-q3" x="40" y="290" fill="var(--color-accent)" font-family="l0g Barclays AI" font-size="35" font-weight="700" text-anchor="start">201 M£</text><text data-panel="bai-fr-charges-m-card-q3" x="40" y="329" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="19" font-weight="400" text-anchor="start">Charges structurelles</text><path d="M 210 366 L 210 389" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 205 380 L 210 389 L 215 380" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="bai-fr-charges-m-card-q4" x="40" y="432" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="18" font-weight="700" text-anchor="start">T4 2026</text><text data-panel="bai-fr-charges-m-card-q4" x="40" y="475" fill="var(--color-amber)" font-family="l0g Barclays AI" font-size="35" font-weight="700" text-anchor="start">≈ 300 M£</text><text data-panel="bai-fr-charges-m-card-q4" x="40" y="514" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="19" font-weight="400" text-anchor="start">Prévision de charges</text><text data-panel="bai-fr-charges-m-card-savings" x="40" y="630" fill="var(--color-signal)" font-family="l0g Barclays AI" font-size="35" font-weight="700" text-anchor="start">≈ 200 M£</text><text data-panel="bai-fr-charges-m-card-savings" x="40" y="667" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="18" font-weight="400" text-anchor="start">Économies d’efficacité déclarées au</text><text data-panel="bai-fr-charges-m-card-savings" x="40" y="691.84" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="18" font-weight="400" text-anchor="start">T3</text><text data-panel="bai-fr-charges-m-frame" x="22" y="763" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="18" font-weight="400" text-anchor="start">Des mesures antérieures peuvent déjà</text><text data-panel="bai-fr-charges-m-frame" x="22" y="787.84" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="18" font-weight="400" text-anchor="start">produire leurs effets. Périmètres</text><text data-panel="bai-fr-charges-m-frame" x="22" y="812.68" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="18" font-weight="400" text-anchor="start">communs non établis.</text><line x1="22" y1="868" x2="398" y2="868" stroke="var(--color-line-strong)" stroke-width="1.5"/><text data-panel="bai-fr-charges-m-frame" x="22" y="896" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="17" font-weight="400" text-anchor="start">Source : Barclays, 22.10.2026 [S01]</text><text data-panel="bai-fr-charges-m-frame" x="22" y="933" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="17" font-weight="400" text-anchor="start">Charges et paiements peuvent être décalés</text></svg>
