700" text-anchor="end">−19</text><text data-panel="bai-en-profit-m-frame" x="22" y="805" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="19" font-weight="700" text-anchor="start">Credit</text><rect x="220" y="820" width="55.47" height="24" rx="0" fill="var(--color-signal)"/><text data-panel="bai-en-profit-m-frame" x="285.47" y="840" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="19" font-weight="700" text-anchor="start">+129</text><line x1="220" y1="280" x2="220" y2="860" stroke="var(--color-line-strong)" stroke-width="1.5"/><text data-panel="bai-en-profit-m-frame" x="220" y="887" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="17" font-weight="400" text-anchor="middle">0</text><text data-panel="bai-en-profit-m-frame" x="22" y="945" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="25" font-weight="700" text-anchor="start">Q3 2026: £2,322m</text><text data-panel="bai-en-profit-m-frame" x="22" y="987" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="18" font-weight="400" text-anchor="start">Litigation + credit: +£400m. Net change:</text><text data-panel="bai-en-profit-m-frame" x="22" y="1011.84" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="18" font-weight="400" text-anchor="start">+£245m.</text><line x1="22" y1="1038" x2="398" y2="1038" stroke="var(--color-line-strong)" stroke-width="1.5"/><text data-panel="bai-en-profit-m-frame" x="22" y="1066" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="17" font-weight="400" text-anchor="start">Source: Barclays, 22.10.2026 [S01]</text><text data-panel="bai-en-profit-m-frame" x="22" y="1103" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="17" font-weight="400" text-anchor="start">Accounting bridge • AI effect not isolated</text></svg>
