<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1140" role="img" aria-labelledby="bai-en-profit-m-title bai-en-profit-m-desc" class="l0g-barclays-ai-svg" style="width:100%;height:auto"><title id="bai-en-profit-m-title">Pre-tax profit rises by £245m</title><desc id="bai-en-profit-m-desc">Full pretax-profit reconciliation: 2,077 + 198 − 311 − 23 + 271 − 19 + 129 = 2,322. Regulatory levies move from a £12m credit to an £11m charge; litigation moves from a £255m charge to a £16m net credit. No line isolates AI. The mobile chart uses a zero-centred delta scale.</desc><rect id="bai-en-profit-m-frame" x="0" y="0" width="420" height="1140" rx="10" fill="var(--color-ink)"/><text data-panel="bai-en-profit-m-frame" x="22" y="33" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="17" font-weight="700" text-anchor="start">l0g / INVESTIGATION</text><text data-panel="bai-en-profit-m-frame" x="398" y="33" fill="var(--color-signal)" font-family="l0g Barclays AI" font-size="17" font-weight="700" text-anchor="end">04</text><text data-panel="bai-en-profit-m-frame" x="22" y="75" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="25" font-weight="700" text-anchor="start">Pre-tax profit rises by</text><text data-panel="bai-en-profit-m-frame" x="22" y="109.5" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="25" font-weight="700" text-anchor="start">£245m</text><text data-panel="bai-en-profit-m-frame" x="22" y="150" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="17" font-weight="400" text-anchor="start">Barclays • Q3 2026 / Q3 2025 • GBP million</text><text data-panel="bai-en-profit-m-frame" x="22" y="230" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="25" font-weight="700" text-anchor="start">Q3 2025: £2,077m</text><text data-panel="bai-en-profit-m-frame" x="22" y="285" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="19" font-weight="700" text-anchor="start">Income</text><r