<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="bai-fr-ratio-d-title bai-fr-ratio-d-desc" class="l0g-barclays-ai-svg" style="width:100%;height:auto"><title id="bai-fr-ratio-d-title">Le ratio baisse, les dépenses augmentent</title><desc id="bai-fr-ratio-d-desc">Barres à origine zéro, échelle commune 0–8 000 M£. Revenus: 7 167 puis 7 365. Dépenses totales d’exploitation: 4 497 puis 4 560. Ratio = dépenses / revenus: 62,7 % puis 61,9 %, avant arrondi entier de la banque. Les écarts sont calculés sur les valeurs publiées, sans ajustement de périmètre ou de change.</desc><rect id="bai-fr-ratio-d-frame" x="0" y="0" width="1000" height="650" rx="10" fill="var(--color-ink)"/><text data-panel="bai-fr-ratio-d-frame" x="38" y="40" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="22" font-weight="700" text-anchor="start">l0g / ANALYSE</text><text data-panel="bai-fr-ratio-d-frame" x="962" y="40" fill="var(--color-signal)" font-family="l0g Barclays AI" font-size="22" font-weight="700" text-anchor="end">03</text><text data-panel="bai-fr-ratio-d-frame" x="38" y="88" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="32" font-weight="700" text-anchor="start">Le ratio baisse, les dépenses augmentent</text><text data-panel="bai-fr-ratio-d-frame" x="38" y="128" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="22" font-weight="400" text-anchor="start">Barclays • T3 2025 / T3 2026 • millions de GBP</text><text data-panel="bai-fr-ratio-d-frame" x="80" y="183" fill="var(--color-signal)" font-family="l0g Barclays AI" font-size="22" font-weight="700" text-anchor="start">Revenus</text><text data-panel="bai-fr-ratio-d-frame" x="300" y="183" fill="var(--color-accent)" font-family="l0g Barclays AI" font-size="22" font-weight="700" text-anchor="start">Dépenses</text><text data-panel="bai-fr-ratio-d-frame" x="80" y="215" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="22" font-weight="700" text-anchor="start">T3 2025</text><rect id="bai-fr-ratio-d-income-0" x="80" y="240" width="618.15375" height="30" rx="0" fill="var(--color-signal)"/><rect id="bai-fr-ratio-d-expenses-0" x="80" y="288" width="387.86625" height="30" rx="0" fill="var(--color-accent)"/><text data-panel="bai-fr-ratio-d-income-0" x="690.15375" y="263" fill="var(--color-surface)" font-family="l0g Barclays AI" font-size="22" font-weight="700" text-anchor="end">7 167</text><text data-panel="bai-fr-ratio-d-expenses-0" x="459.86625" y="311" fill="var(--color-surface)" font-family="l0g Barclays AI" font-size="22" font-weight="700" text-anchor="end">4 497</text><text data-panel="bai-fr-ratio-d-frame" x="825" y="274" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="37" font-weight="700" text-anchor="start">62,7 %</text><text data-panel="bai-fr-ratio-d-frame" x="825" y="310" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="22" font-weight="400" text-anchor="start">ratio</text><text data-panel="bai-fr-ratio-d-frame" x="80" y="375" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="22" font-weight="700" text-anchor="start">T3 2026</text><rect id="bai-fr-ratio-d-income-1" x="80" y="400" width="635.23125" height="30" rx="0" fill="var(--color-signal)"/><rect id="bai-fr-ratio-d-expenses-1" x="80" y="448" width="393.3" height="30" rx="0" fill="var(--color-accent)"/><text data-panel="bai-fr-ratio-d-income-1" x="707.23125" y="423" fill="var(--color-surface)" font-family="l0g Barclays AI" font-size="22" font-weight="700" text-anchor="end">7 365</text><text data-panel="bai-fr-ratio-d-expenses-1" x="465.3" y="471" fill="var(--color-surface)" font-family="l0g Barclays AI" font-size="22" font-weight="700" text-anchor="end">4 560</text><text data-panel="bai-fr-ratio-d-frame" x="825" y="434" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="37" font-weight="700" text-anchor="start">61,9 %</text><text data-panel="bai-fr-ratio-d-frame" x="825" y="470" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="22" font-weight="400" text-anchor="start">ratio</text><text data-panel="bai-fr-ratio-d-frame" x="80" y="505" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="22" font-weight="400" text-anchor="start">0</text><text data-panel="bai-fr-ratio-d-frame" x="252.5" y="505" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="22" font-weight="400" text-anchor="middle">2k</text><text data-panel="bai-fr-ratio-d-frame" x="425" y="505" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="22" font-weight="400" text-anchor="middle">4k</text><text data-panel="bai-fr-ratio-d-frame" x="597.5" y="505" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="22" font-weight="400" text-anchor="middle">6k</text><text data-panel="bai-fr-ratio-d-frame" x="770" y="505" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="22" font-weight="400" text-anchor="end">8k</text><line x1="80" y1="485" x2="770" y2="485" stroke="var(--color-line-strong)" stroke-width="1.5"/><text data-panel="bai-fr-ratio-d-frame" x="80" y="555" fill="var(--color-signal)" font-family="l0g Barclays AI" font-size="25" font-weight="700" text-anchor="start">Revenus +2,8 %</text><text data-panel="bai-fr-ratio-d-frame" x="500" y="555" fill="var(--color-accent)" font-family="l0g Barclays AI" font-size="25" font-weight="700" text-anchor="start">Dépenses +1,4 %</text><line x1="38" y1="578" x2="962" y2="578" stroke="var(--color-line-strong)" stroke-width="1.5"/><text data-panel="bai-fr-ratio-d-frame" x="38" y="606" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="22" font-weight="400" text-anchor="start">Source : Barclays, 22.10.2026 [S01]</text><text data-panel="bai-fr-ratio-d-frame" x="38" y="635" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="22" font-weight="400" text-anchor="start">Origine zéro • échelle commune : 0–8 000 M£</text></svg>
