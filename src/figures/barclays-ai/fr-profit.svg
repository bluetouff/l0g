<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="bai-fr-profit-d-title bai-fr-profit-d-desc" class="l0g-barclays-ai-svg" style="width:100%;height:auto"><title id="bai-fr-profit-d-title">Le bénéfice avant impôt gagne 245 M£</title><desc id="bai-fr-profit-d-desc">Réconciliation intégrale du résultat avant impôt: 2 077 + 198 − 311 − 23 + 271 − 19 + 129 = 2 322 M£. Le crédit de prélèvements de 12 M£ en 2025 devient une charge de 11 M£. Les contentieux passent d’une charge de 255 M£ à un produit net de 16 M£. Aucune ligne ne mesure isolément l’effet de l’IA. Le graphique mobile montre les variations sur une échelle centrée sur zéro.</desc><rect id="bai-fr-profit-d-frame" x="0" y="0" width="1000" height="650" rx="10" fill="var(--color-ink)"/><text data-panel="bai-fr-profit-d-frame" x="38" y="40" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="22" font-weight="700" text-anchor="start">l0g / ANALYSE</text><text data-panel="bai-fr-profit-d-frame" x="962" y="40" fill="var(--color-signal)" font-family="l0g Barclays AI" font-size="22" font-weight="700" text-anchor="end">04</text><text data-panel="bai-fr-profit-d-frame" x="38" y="88" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="32" font-weight="700" text-anchor="start">Le bénéfice avant impôt gagne 245 M£</text><text data-panel="bai-fr-profit-d-frame" x="38" y="128" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="22" font-weight="400" text-anchor="start">Barclays • T3 2026 / T3 2025 • millions de GBP</text><rect x="50" y="253.916" width="72" height="191.084" rx="0" fill="var(--color-paper)"/><text data-panel="bai-fr-profit-d-frame" x="86" y="238.916" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="22" font-weight="700" text-anchor="middle">2 077</text><text data-panel="bai-fr-profit-d-frame" x="86" y="480" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="22" font-weight="400" text-anchor="mid