<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 970" role="img" aria-labelledby="bai-en-ratio-m-title bai-en-ratio-m-desc" class="l0g-barclays-ai-svg" style="width:100%;height:auto"><title id="bai-en-ratio-m-title">The ratio falls as expenses increase</title><desc id="bai-en-ratio-m-desc">Both bars use a common zero-based scale of £0–8,000m. Income: 7,167 and 7,365. Total operating expenses: 4,497 and 4,560. Their ratio is 62.7% then 61.9%, before the bank’s whole-percentage rounding. No scope or currency adjustment.</desc><rect id="bai-en-ratio-m-frame" x="0" y="0" width="420" height="970" rx="10" fill="var(--color-ink)"/><text data-panel="bai-en-ratio-m-frame" x="22" y="33" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="17" font-weight="700" text-anchor="start">l0g / INVESTIGATION</text><text data-panel="bai-en-ratio-m-frame" x="398" y="33" fill="var(--color-signal)" font-family="l0g Barclays AI" font-size="17" font-weight="700" text-anchor="end">03</text><text data-panel="bai-en-ratio-m-frame" x="22" y="75" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="25" font-weight="700" text-anchor="start">The ratio falls as</text><text data-panel="bai-en-ratio-m-frame" x="22" y="109.5" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="25" font-weight="700" text-anchor="start">expenses increase</text><text data-panel="bai-en-ratio-m-frame" x="22" y="150" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="17" font-weight="400" text-anchor="start">Barclays • Q3 2025 / Q3 2026 • GBP million</text><text data-panel="bai-en-ratio-m-frame" x="22" y="220" fill="var(--color-signal)" font-family="l0g Barclays AI" font-size="18" font-weight="700" text-anchor="start">Income</text><text data-panel="bai-en-ratio-m-frame" x="180" y="220" fill="var(--color-accent)" font-family="l0g Barclays AI" font-size="18" font-weight="700" text-anchor="start">Expenses</text><text data-panel="bai-en-ratio-m-frame" x="22" y="245" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="19" font-weight="700" text-anchor="start">Q3 2025</text><rect id="bai-en-ratio-m-income-0" x="22" y="270" width="295.63875" height="28" rx="0" fill="var(--color-signal)"/><rect id="bai-en-ratio-m-expenses-0" x="22" y="310" width="185.50125" height="28" rx="0" fill="var(--color-accent)"/><text data-panel="bai-en-ratio-m-income-0" x="309.63875" y="290" fill="var(--color-surface)" font-family="l0g Barclays AI" font-size="17" font-weight="700" text-anchor="end">7,167</text><text data-panel="bai-en-ratio-m-expenses-0" x="199.50125" y="330" fill="var(--color-surface)" font-family="l0g Barclays AI" font-size="17" font-weight="700" text-anchor="end">4,497</text><text data-panel="bai-en-ratio-m-frame" x="22" y="387" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="31" font-weight="700" text-anchor="start">62.7%</text><text data-panel="bai-en-ratio-m-frame" x="22" y="420" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="17" font-weight="400" text-anchor="start">ratio</text><text data-panel="bai-en-ratio-m-frame" x="22" y="480" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="19" font-weight="700" text-anchor="start">Q3 2026</text><rect id="bai-en-ratio-m-income-1" x="22" y="505" width="303.80625" height="28" rx="0" fill="var(--color-signal)"/><rect id="bai-en-ratio-m-expenses-1" x="22" y="545" width="188.1" height="28" rx="0" fill="var(--color-accent)"/><text data-panel="bai-en-ratio-m-income-1" x="317.80625" y="525" fill="var(--color-surface)" font-family="l0g Barclays AI" font-size="17" font-weight="700" text-anchor="end">7,365</text><text data-panel="bai-en-ratio-m-expenses-1" x="202.1" y="565" fill="var(--color-surface)" font-family="l0g Barclays AI" font-size="17" font-weight="700" text-anchor="end">4,560</text><text data-panel="bai-en-ratio-m-frame" x="22" y="622" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="31" font-weight