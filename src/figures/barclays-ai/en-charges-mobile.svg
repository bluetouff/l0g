 AI" font-size="18" font-weight="400" text-anchor="start">Reported Q3 efficiency savings</text><text data-panel="bai-en-charges-m-frame" x="22" y="763" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="18" font-weight="400" text-anchor="start">Earlier measures may already be</text><text data-panel="bai-en-charges-m-frame" x="22" y="787.84" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="18" font-weight="400" text-anchor="start">delivering savings. A shared scope is</text><text data-panel="bai-en-charges-m-frame" x="22" y="812.68" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="18" font-weight="400" text-anchor="start">unestablished.</text><line x1="22" y1="868" x2="398" y2="868" stroke="var(--color-line-strong)" stroke-width="1.5"/><text data-panel="bai-en-charges-m-frame" x="22" y="896" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="17" font-weight="400" text-anchor="start">Source: Barclays, 22.10.2026 [S01]</text><text data-panel="bai-en-charges-m-frame" x="22" y="933" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="17" font-weight="400" text-anchor="start">Charges and payments may occur</text><text data-panel="bai-en-charges-m-frame" x="22" y="956.46" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="17" font-weight="400" text-anchor="start">separately</text></svg>
