<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 970" role="img" aria-labelledby="bai-en-charges-m-title bai-en-charges-m-desc" class="l0g-barclays-ai-svg" style="width:100%;height:auto"><title id="bai-en-charges-m-title">Charges and savings across distinct periods</title><desc id="bai-en-charges-m-desc">Q3 structural charges of £201m, approximately £300m expected in Q4 and approximately £200m of Q3 efficiency savings. No matching project scope has been established. Positions describe timing, not cash flows or amortisation.</desc><rect id="bai-en-charges-m-frame" x="0" y="0" width="420" height="970" rx="10" fill="var(--color-ink)"/><text data-panel="bai-en-charges-m-frame" x="22" y="33" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="17" font-weight="700" text-anchor="start">l0g / INVESTIGATION</text><text data-panel="bai-en-charges-m-frame" x="398" y="33" fill="var(--color-signal)" font-family="l0g Barclays AI" font-size="17" font-weight="700" text-anchor="end">02</text><text data-panel="bai-en-charges-m-frame" x="22" y="75" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="25" font-weight="700" text-anchor="start">Charges and savings</text><text data-panel="bai-en-charges-m-frame" x="22" y="109.5" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="25" font-weight="700" text-anchor="start">across distinct periods</text><text data-panel="bai-en-charges-m-frame" x="22" y="150" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="17" font-weight="400" text-anchor="start">Barclays • GBP million • Q3 and Q4 2026</text><text data-panel="bai-en-charges-m-frame" x="22" y="173.46" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="17" font-weight="400" text-anchor="start">forecast</text><rect id="bai-en-charges-m-card-q3" x="22" y="215" width="376" height="140" rx="10" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1.5"/><rect id="bai-en-charges-m-card-q4" 