<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="bai-fr-bases-d-title bai-fr-bases-d-desc" class="l0g-barclays-ai-svg" style="width:100%;height:auto"><title id="bai-fr-bases-d-title">Trois bases pour comparer les coûts</title><desc id="bai-fr-bases-d-desc">Prévisions approximatives de Barclays au 22 octobre 2026. Total annuel 2026 : 18,5 Md£. Rythme de coûts en sortie de 2026 : 18,0 Md£, après retraitement de 0,3 Md£ de charges structurelles, 0,1 Md£ de rémunération et 0,1 Md£ de financement automobile. Total annuel 2027 : 18,4 Md£. La différence entre totaux prévus est de −0,1 Md£. Comparer le total annuel 2027 au rythme de sortie de 2026 produit +0,4 Md£ mais mélange des définitions.</desc><rect id="bai-fr-bases-d-frame" x="0" y="0" width="1000" height="650" rx="10" fill="var(--color-ink)"/><text data-panel="bai-fr-bases-d-frame" x="38" y="40" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="22" font-weight="700" text-anchor="start">l0g / ANALYSE</text><text data-panel="bai-fr-bases-d-frame" x="962" y="40" fill="var(--color-signal)" font-family="l0g Barclays AI" font-size="22" font-weight="700" text-anchor="end">05</text><text data-panel="bai-fr-bases-d-frame" x="38" y="88" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="32" font-weight="700" text-anchor="start">Trois bases pour comparer les coûts</text><text data-panel="bai-fr-bases-d-frame" x="38" y="128" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="22" font-weight="400" text-anchor="start">Prévisions Barclays • 22.10.2026 • milliards de GBP</text><text data-panel="bai-fr-bases-d-frame" x="38" y="194" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="23" font-weight="700" text-anchor="start">2026 • total prévu</text><rect x="38" y="218" width="721.5" height="30" rx="0" fill="var(--color-paper)"/><text data-panel="bai-fr-bases-d-frame" x="771.5" y="242" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="24" font-weight="700" text-anchor="start">≈ 18,5</text><text data-panel="bai-fr-bases-d-frame" x="38" y="309" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="23" font-weight="700" text-anchor="start">2026 • rythme de sortie</text><rect x="38" y="333" width="702" height="30" rx="0" fill="var(--color-signal)"/><text data-panel="bai-fr-bases-d-frame" x="771.5" y="357" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="24" font-weight="700" text-anchor="start">≈ 18,0</text><rect x="740" y="333" width="19.5" height="30" rx="0" fill="var(--color-ink)" stroke="var(--color-signal)" stroke-width="1.5"/><text data-panel="bai-fr-bases-d-frame" x="38" y="395" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="22" font-weight="400" text-anchor="start">0,5 Md£ d’éléments exclus</text><text data-panel="bai-fr-bases-d-frame" x="38" y="424" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="23" font-weight="700" text-anchor="start">2027 • total prévu</text><rect x="38" y="448" width="717.6" height="30" rx="0" fill="var(--color-paper)"/><text data-panel="bai-fr-bases-d-frame" x="767.6" y="472" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="24" font-weight="700" text-anchor="start">≈ 18,4</text><rect id="bai-fr-bases-d-card-comparison" x="38" y="515" width="924" height="60" rx="10" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1.5"/><text data-panel="bai-fr-bases-d-card-comparison" x="58" y="541" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="23" font-weight="700" text-anchor="start">Totaux prévus : −0,1 Md£</text><text data-panel="bai-fr-bases-d-card-comparison" x="530" y="541" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="22" font-weight="400" text-anchor="start">Face à la rythme de sortie : +0,4 Md£</text><line x1="38" y1="578" x2="962" y2="578" stroke="var(--color-line-strong)" stroke-width="1.5"/><text data-panel="bai-fr-bases-d-frame" x="38" y="606" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="22" font-weight="400" text-anchor="start">Source : Barclays, 22.10.2026 [S01]</text><text data-panel="bai-fr-bases-d-frame" x="38" y="635" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="22" font-weight="400" text-anchor="start">0–20 Md£ • bases de définition différentes</text></svg>
