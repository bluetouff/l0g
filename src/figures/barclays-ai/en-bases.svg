<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="bai-en-bases-d-title bai-en-bases-d-desc" class="l0g-barclays-ai-svg" style="width:100%;height:auto"><title id="bai-en-bases-d-title">Three bases for comparing costs</title><desc id="bai-en-bases-d-desc">Approximate Barclays forecasts as of 22 October 2026. Full-year 2026 total: £18.5bn. 2026 exit-rate costs: £18.0bn, after excluding £0.3bn of structural cost actions, £0.1bn of compensation and £0.1bn of motor finance. Full-year 2027 total: £18.4bn. Forecast annual totals differ by −£0.1bn. Comparing the full-year 2027 total with 2026 exit-rate costs produces +£0.4bn across different definitions.</desc><rect id="bai-en-bases-d-frame" x="0" y="0" width="1000" height="650" rx="10" fill="var(--color-ink)"/><text data-panel="bai-en-bases-d-frame" x="38" y="40" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="22" font-weight="700" text-anchor="start">l0g / INVESTIGATION</text><text data-panel="bai-en-bases-d-frame" x="962" y="40" fill="var(--color-signal)" font-family="l0g Barclays AI" font-size="22" font-weight="700" text-anchor="end">05</text><text data-panel="bai-en-bases-d-frame" x="38" y="88" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="32" font-weight="700" text-anchor="start">Three bases for comparing costs</text><text data-panel="bai-en-bases-d-frame" x="38" y="128" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="22" font-weight="400" text-anchor="start">Barclays forecasts • 22.10.2026 • GBP billion</text><text data-panel="bai-en-bases-d-frame" x="38" y="194" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="23" font-weight="700" text-anchor="start">2026 • forecast total</text><rect x="38" y="218" width="721.5" height="30" rx="0" fill="var(--color-paper)"/><text data-panel="bai-en-bases-d-frame" x="771.5" y="242" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="24" font-weight="700" text-anchor="start">≈ 18.5</text><text data-panel="bai-en-bases-d-frame" x="38" y="309" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="23" font-weight="700" text-anchor="start">2026 • exit-rate base</text><rect x="38" y="333" width="702" height="30" rx="0" fill="var(--color-signal)"/><text data-panel="bai-en-bases-d-frame" x="771.5" y="357" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="24" font-weight="700" text-anchor="start">≈ 18.0</text><rect x="740" y="333" width="19.5" height="30" rx="0" fill="var(--color-ink)" stroke="var(--color-signal)" stroke-width="1.5"/><text data-panel="bai-en-bases-d-frame" x="38" y="395" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="22" font-weight="400" text-anchor="start">£0.5bn of excluded items</text><text data-panel="bai-en-bases-d-frame" x="38" y="424" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="23" font-weight="700" text-anchor="start">2027 • forecast total</text><rect x="38" y="448" width="717.6" height="30" rx="0" fill="var(--color-paper)"/><text data-panel="bai-en-bases-d-frame" x="767.6" y="472" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="24" font-weight="700" text-anchor="start">≈ 18.4</text><rect id="bai-en-bases-d-card-comparison" x="38" y="515" width="924" height="60" rx="10" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1.5"/><text data-panel="bai-en-bases-d-card-comparison" x="58" y="541" fill="var(--color-paper)" font-family="l0g Barclays AI" font-size="23" font-weight="700" text-anchor="start">Forecast totals: −£0.1bn</text><text data-panel="bai-en-bases-d-card-comparison" x="530" y="541" fill="var(--color-muted)" font-family="l0g Barclays AI" font-size="22" font-weight="400" text-anchor="start">Versus exit-rate base: +£0.4bn</text><line x1="38" y1="578" x2="962" y2="578" stroke="var(--color-line-strong)" stroke-width="1.5"/><text data-panel="bai-en-bases-d-frame" x="38" y="606" 