<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="mr07-evidence-fr-d-t mr07-evidence-fr-d-d" style="width:100%;height:auto" class="l0g-machines07-svg"><title id="mr07-evidence-fr-d-t">Acheter une capacité démontrable</title><desc id="mr07-evidence-fr-d-d">Deux types de preuve se complètent : l’exercice sur table éprouve les décisions, l’essai technique autorisé mesure une reprise dans un périmètre donné. La capacité doit être réévaluée lorsque ses dépendances changent.</desc><rect id="mr07-evidence-fr-d-frame" x="0" y="0" width="1000" height="680" rx="0" fill="var(--color-ink)" stroke="none" stroke-width="0"/><text data-panel="mr07-evidence-fr-d-frame" x="28" y="45" font-family="l0g Machine Resilience" font-size="24" font-weight="400" fill="var(--color-signal)" text-anchor="start">l0g / MACHINES</text><text data-panel="mr07-evidence-fr-d-frame" x="972" y="45" font-family="l0g Machine Resilience" font-size="24" font-weight="400" fill="var(--color-muted)" text-anchor="end">05</text><text data-panel="mr07-evidence-fr-d-frame" x="28" y="100" font-family="l0g Machine Resilience" font-size="36" font-weight="700" fill="var(--color-paper)" text-anchor="start">Acheter une capacité démontrable</text><text data-panel="mr07-evidence-fr-d-frame" x="28" y="140" font-family="l0g Machine Resilience" font-size="24" font-weight="400" fill="var(--color-muted)" text-anchor="start">Date, périmètre et conditions donnent la portée</text><rect id="mr07-evidence-fr-d-panel-function" x="28" y="186" width="944" height="90" rx="7" fill="var(--color-ink)" stroke="var(--color-signal)" stroke-width="1"/><text data-panel="mr07-evidence-fr-d-panel-function" x="44" y="223" font-family="l0g Machine Resilience" font-size="27" font-weight="400" fill="var(--color-paper)" text-anchor="start">Fonction attendue</text><text data-panel="mr07-evidence-fr-d-panel-function" x="44" y="260" font-family="l0g Machine Resilience" font-size="24" font-weight="400" fill="var(--color-muted)" text-anchor="start">Service, durée visée, ressources et sûreté.</text><rect id="mr07-evidence-fr-d-panel-proof-0" x="28" y="310" width="448" height="140" rx="7" fill="var(--color-surface-2)" stroke="none" stroke-width="0" data-proof="tabletop"/><text data-panel="mr07-evidence-fr-d-panel-proof-0" x="44" y="345" font-family="l0g Machine Resilience" font-size="25" font-weight="400" fill="var(--color-signal)" text-anchor="start">Exercice sur table</text><text data-panel="mr07-evidence-fr-d-panel-proof-0" x="44" y="387" font-family="l0g Machine Resilience" font-size="24" font-weight="400" fill="var(--color-muted)" text-anchor="start">Décisions et communications à</text><text data-panel="mr07-evidence-fr-d-panel-proof-0" x="44" y="418" font-family="l0g Machine Resilience" font-size="24" font-weight="400" fill="var(--color-muted)" text-anchor="start">éprouver.</text><path data-connector="proof-input-0" d="M252 276 L252 310" fill="none" stroke="var(--color-signal)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path data-connector="proof-input-0-head" d="M255.6 302 L252 310 L248.4 302" fill="none" stroke="var(--color-signal)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect id="mr07-evidence-fr-d-panel-proof-1" x="524" y="310" width="448" height="140" rx="7" fill="var(--color-surface-2)" stroke="none" stroke-width="0" data-proof="technical"/><text data-panel="mr07-evidence-fr-d-panel-proof-1" x="540" y="345" font-family="l0g Machine Resilience" font-size="25" font-weight="400" fill="var(--color-amber)" text-anchor="start">Essai technique autorisé</text><text data-panel="mr07-evidence-fr-d-panel-proof-1" x="540" y="387" font-family="l0g Machine Resilience" font-size="24" font-weight="400" fill="var(--color-muted)" text-anchor="start">Reprise mesurée, validation et</text><text data-panel="mr07-evidence-fr-d-panel-proof-1" x="540" y="418" font-family="l0g Machine Resilience" font-size="24" font-weight="400" fill="var(--color-muted)" text-anchor="start">périmètre.</text><path data-connector="proof-input-1" d="M748 276 L748 310" fill="none" stroke="var(--color-amber)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path data-connector="proof-input-1-head" d="M751.6 302 L748 310 L744.4 302" fill="none" stroke="var(--color-amber)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect id="mr07-evidence-fr-d-panel-record" x="28" y="485" width="944" height="80" rx="7" fill="var(--color-ink)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="mr07-evidence-fr-d-panel-record" x="44" y="520" font-family="l0g Machine Resilience" font-size="27" font-weight="400" fill="var(--color-paper)" text-anchor="start">Fiche de capacité</text><text data-panel="mr07-evidence-fr-d-panel-record" x="44" y="556" font-family="l0g Machine Resilience" font-size="24" font-weight="400" fill="var(--color-muted)" text-anchor="start">Date, versions, dépendances, résultat et limites.</text><path data-connector="proof-output-0" d="M252 450 L252 467 L500 467 L500 485" fill="none" stroke="var(--color-signal)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path data-connector="proof-output-0-head" d="M503.6 477 L500 485 L496.4 477" fill="none" stroke="var(--color-signal)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path data-connector="proof-output-1" d="M748 450 L748 467 L500 467 L500 485" fill="none" stroke="var(--color-amber)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path data-connector="proof-output-1-head" d="M503.6 477 L500 485 L496.4 477" fill="none" stroke="var(--color-amber)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="mr07-evidence-fr-d-frame" x="28" y="615" font-family="l0g Machine Resilience" font-size="24" font-weight="400" fill="var(--color-paper)" text-anchor="start">Réévaluer après un changement des dépendances.</text><text data-panel="mr07-evidence-fr-d-frame" x="28" y="650" font-family="l0g Machine Resilience" font-size="24" font-weight="400" fill="var(--color-muted)" text-anchor="start">[09, 11, 10, 13]</text></svg>