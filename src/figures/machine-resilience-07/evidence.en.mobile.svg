<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1080" role="img" aria-labelledby="mr07-evidence-en-m-t mr07-evidence-en-m-d" style="width:100%;height:auto" class="l0g-machines07-svg"><title id="mr07-evidence-en-m-t">Buy a capability you can demonstrate</title><desc id="mr07-evidence-en-m-d">Two kinds of evidence complement each other: a tabletop exercise tests decisions, while an authorised technical test measures recovery within a defined scope. Capability must be reassessed when its dependencies change.</desc><rect id="mr07-evidence-en-m-frame" x="0" y="0" width="420" height="1080" rx="0" fill="var(--color-ink)" stroke="none" stroke-width="0"/><text data-panel="mr07-evidence-en-m-frame" x="28" y="40" font-family="l0g Machine Resilience" font-size="18" font-weight="400" fill="var(--color-signal)" text-anchor="start">l0g / MACHINES</text><text data-panel="mr07-evidence-en-m-frame" x="392" y="40" font-family="l0g Machine Resilience" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="end">05</text><text data-panel="mr07-evidence-en-m-frame" x="28" y="88" font-family="l0g Machine Resilience" font-size="27" font-weight="700" fill="var(--color-paper)" text-anchor="start">Buy a capability you</text><text data-panel="mr07-evidence-en-m-frame" x="28" y="123" font-family="l0g Machine Resilience" font-size="27" font-weight="700" fill="var(--color-paper)" text-anchor="start">can demonstrate</text><text data-panel="mr07-evidence-en-m-frame" x="28" y="156" font-family="l0g Machine Resilience" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">Date, scope and conditions define the</text><text data-panel="mr07-evidence-en-m-frame" x="28" y="181" font-family="l0g Machine Resilience" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">evidence</text><rect id="mr07-evidence-en-m-panel-function" x="28" y="195" width="364" height="120" rx="7" fill="var(--color-ink)" stroke="var(--color-signal)" stroke-width="1"/><text data-panel="mr07-evidence-en-m-panel-function" x="44" y="233" font-family="l0g Machine Resilience" font-size="24" font-weight="400" fill="var(--color-paper)" text-anchor="start">Required function</text><text data-panel="mr07-evidence-en-m-panel-function" x="44" y="273" font-family="l0g Machine Resilience" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">Service, target time, resources and</text><text data-panel="mr07-evidence-en-m-panel-function" x="44" y="297" font-family="l0g Machine Resilience" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">safety.</text><rect id="mr07-evidence-en-m-panel-proof-0" x="28" y="370" width="364" height="145" rx="7" fill="var(--color-surface-2)" stroke="none" stroke-width="0" data-proof="tabletop"/><text data-panel="mr07-evidence-en-m-panel-proof-0" x="44" y="405" font-family="l0g Machine Resilience" font-size="23" font-weight="400" fill="var(--color-signal)" text-anchor="start">Tabletop exercise</text><text data-panel="mr07-evidence-en-m-panel-proof-0" x="44" y="447" font-family="l0g Machine Resilience" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">Test decisions and communications.</text><path data-connector="proof-input-0" d="M28 255 L14 255 L14 442 L28 442" fill="none" stroke="var(--color-signal)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path data-connector="proof-input-0-head" d="M22 439.3 L28 442 L22 444.7" fill="none" stroke="var(--color-signal)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect id="mr07-evidence-en-m-panel-proof-1" x="28" y="570" width="364" height="145" rx="7" fill="var(--color-surface-2)" stroke="none" stroke-width="0" data-proof="technical"/><text data-panel="mr07-evidence-en-m-panel-proof-1" x="44" y="605" font-family="l0g Machine Resilience" font-size="23" font-weight="400" fill="var(--color-amber)" text-anchor="start">Authorised technical test</text><text data-panel="mr07-evidence-en-m-panel-proof-1" x="44" y="647" font-family="l0g Machine Resilience" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">Measured recovery, validation and</text><text data-panel="mr07-evidence-en-m-panel-proof-1" x="44" y="671" font-family="l0g Machine Resilience" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">scope.</text><path data-connector="proof-input-1" d="M392 255 L406 255 L406 642 L392 642" fill="none" stroke="var(--color-amber)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path data-connector="proof-input-1-head" d="M398 644.7 L392 642 L398 639.3" fill="none" stroke="var(--color-amber)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect id="mr07-evidence-en-m-panel-record" x="28" y="830" width="364" height="145" rx="7" fill="var(--color-ink)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="mr07-evidence-en-m-panel-record" x="44" y="865" font-family="l0g Machine Resilience" font-size="24" font-weight="400" fill="var(--color-paper)" text-anchor="start">Capability record</text><text data-panel="mr07-evidence-en-m-panel-record" x="44" y="912" font-family="l0g Machine Resilience" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">Date, versions, dependencies, result</text><text data-panel="mr07-evidence-en-m-panel-record" x="44" y="936" font-family="l0g Machine Resilience" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">and limits.</text><path data-connector="proof-output-0" d="M28 442 L14 442 L14 903 L28 903" fill="none" stroke="var(--color-signal)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path data-connector="proof-output-0-head" d="M22 900.3 L28 903 L22 905.7" fill="none" stroke="var(--color-signal)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path data-connector="proof-output-1" d="M392 642 L406 642 L406 903 L392 903" fill="none" stroke="var(--color-amber)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path data-connector="proof-output-1-head" d="M398 905.7 L392 903 L398 900.3" fill="none" stroke="var(--color-amber)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="mr07-evidence-en-m-frame" x="28" y="1020" font-family="l0g Machine Resilience" font-size="18" font-weight="400" fill="var(--color-paper)" text-anchor="start">Reassess after a change.</text><text data-panel="mr07-evidence-en-m-frame" x="28" y="1050" font-family="l0g Machine Resilience" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">[09, 11, 10, 13]</text></svg>