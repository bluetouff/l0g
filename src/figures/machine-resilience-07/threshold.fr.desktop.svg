<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="mr07-threshold-fr-d-t mr07-threshold-fr-d-d" style="width:100%;height:auto" class="l0g-machines07-svg"><title id="mr07-threshold-fr-d-t">Le coût d’un renfort et son seuil</title><desc id="mr07-threshold-fr-d-d">Le cas fictif relie un budget supplémentaire de 60 000 € sur cinq ans à douze heures-sites gagnées par événement. Avec 2 500 € de marge perdue par heure-site, l’équilibre exige deux événements comparables.</desc><rect id="mr07-threshold-fr-d-frame" x="0" y="0" width="1000" height="680" rx="0" fill="var(--color-ink)" stroke="none" stroke-width="0"/><text data-panel="mr07-threshold-fr-d-frame" x="28" y="45" font-family="l0g Machine Resilience" font-size="24" font-weight="400" fill="var(--color-signal)" text-anchor="start">l0g / MACHINES</text><text data-panel="mr07-threshold-fr-d-frame" x="972" y="45" font-family="l0g Machine Resilience" font-size="24" font-weight="400" fill="var(--color-muted)" text-anchor="end">04</text><text data-panel="mr07-threshold-fr-d-frame" x="28" y="100" font-family="l0g Machine Resilience" font-size="36" font-weight="700" fill="var(--color-paper)" text-anchor="start">Le coût d’un renfort et son seuil</text><text data-panel="mr07-threshold-fr-d-frame" x="28" y="140" font-family="l0g Machine Resilience" font-size="24" font-weight="400" fill="var(--color-muted)" text-anchor="start">CAS FICTIF · euros supposés constants · horizon 5 ans</text><rect id="mr07-threshold-fr-d-panel-money-0" x="28" y="186" width="448" height="170" rx="7" fill="var(--color-surface-2)" stroke="none" stroke-width="0" data-money="cost" data-value="60000"/><text data-panel="mr07-threshold-fr-d-panel-money-0" x="44" y="221" font-family="l0g Machine Resilience" font-size="26" font-weight="400" fill="var(--color-paper)" text-anchor="start">Coût sur cinq ans</text><text data-panel="mr07-threshold-fr-d-panel-money-0" x="44" y="269" font-family="l0g Machine Resilience" font-size="24" font-weight="400" fill="var(--color-muted)" text-anchor="start">30 000 + 5 × 6 000 €</text><text data-panel="mr07-threshold-fr-d-panel-money-0" x="44" y="329" font-family="l0g Machine Resilience" font-size="36" font-weight="400" fill="var(--color-amber)" text-anchor="start">60 000 €</text><rect id="mr07-threshold-fr-d-panel-money-1" x="524" y="186" width="448" height="170" rx="7" fill="var(--color-surface-2)" stroke="none" stroke-width="0" data-money="benefit" data-value="30000"/><text data-panel="mr07-threshold-fr-d-panel-money-1" x="540" y="221" font-family="l0g Machine Resilience" font-size="26" font-weight="400" fill="var(--color-paper)" text-anchor="start">Gain par événement</text><text data-panel="mr07-threshold-fr-d-panel-money-1" x="540" y="269" font-family="l0g Machine Resilience" font-size="24" font-weight="400" fill="var(--color-muted)" text-anchor="start">12 h-sites × 2 500 €/h-site</text><text data-panel="mr07-threshold-fr-d-panel-money-1" x="540" y="329" font-family="l0g Machine Resilience" font-size="36" font-weight="400" fill="var(--color-signal)" text-anchor="start">30 000 €</text><rect id="mr07-threshold-fr-d-panel-threshold" x="28" y="400" width="944" height="100" rx="7" fill="var(--color-ink)" stroke="var(--color-signal)" stroke-width="1" data-value="2"/><text data-panel="mr07-threshold-fr-d-panel-threshold" x="44" y="443" font-family="l0g Machine Resilience" font-size="36" font-weight="400" fill="var(--color-paper)" text-anchor="start">60 000 ÷ 30 000 = 2</text><text data-panel="mr07-threshold-fr-d-panel-threshold" x="44" y="483" font-family="l0g Machine Resilience" font-size="24" font-weight="400" fill="var(--color-muted)" text-anchor="start">événements comparables sur cinq ans</text><rect id="mr07-threshold-fr-d-panel-sensitivity-0" x="28" y="550" width="296" height="80" rx="7" fill="var(--color-surface-2)" stroke="none" stroke-width="0" data-contribution="1000" data-events="5"/><text data-panel="mr07-threshold-fr-d-panel-sensitivity-0" x="44" y="581" font-family="l0g Machine Resilience" font-size="24" font-weight="400" fill="var(--color-muted)" text-anchor="start">1 000 €/h-site</text><text data-panel="mr07-threshold-fr-d-panel-sensitivity-0" x="44" y="617" font-family="l0g Machine Resilience" font-size="27" font-weight="400" fill="var(--color-amber)" text-anchor="start">5 événements</text><rect id="mr07-threshold-fr-d-panel-sensitivity-1" x="352" y="550" width="296" height="80" rx="7" fill="var(--color-surface-2)" stroke="none" stroke-width="0" data-contribution="2500" data-events="2"/><text data-panel="mr07-threshold-fr-d-panel-sensitivity-1" x="368" y="581" font-family="l0g Machine Resilience" font-size="24" font-weight="400" fill="var(--color-muted)" text-anchor="start">2 500 €/h-site</text><text data-panel="mr07-threshold-fr-d-panel-sensitivity-1" x="368" y="617" font-family="l0g Machine Resilience" font-size="27" font-weight="400" fill="var(--color-amber)" text-anchor="start">2 événements</text><rect id="mr07-threshold-fr-d-panel-sensitivity-2" x="676" y="550" width="296" height="80" rx="7" fill="var(--color-surface-2)" stroke="none" stroke-width="0" data-contribution="5000" data-events="1"/><text data-panel="mr07-threshold-fr-d-panel-sensitivity-2" x="692" y="581" font-family="l0g Machine Resilience" font-size="24" font-weight="400" fill="var(--color-muted)" text-anchor="start">5 000 €/h-site</text><text data-panel="mr07-threshold-fr-d-panel-sensitivity-2" x="692" y="617" font-family="l0g Machine Resilience" font-size="27" font-weight="400" fill="var(--color-amber)" text-anchor="start">1 événement</text><text data-panel="mr07-threshold-fr-d-frame" x="28" y="670" font-family="l0g Machine Resilience" font-size="24" font-weight="400" fill="var(--color-muted)" text-anchor="start">CALCUL L0G · CAS FICTIF</text></svg>