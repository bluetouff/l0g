<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1080" role="img" aria-labelledby="mr07-evidence-fr-m-t mr07-evidence-fr-m-d" style="width:100%;height:auto" class="l0g-machines07-svg"><title id="mr07-evidence-fr-m-t">Acheter une capacité démontrable</title><desc id="mr07-evidence-fr-m-d">Deux types de preuve se complètent : l’exercice sur table éprouve les décisions, l’essai technique autorisé mesure une reprise dans un périmètre donné. La capacité doit être réévaluée lorsque ses dépendances changent.</desc><rect id="mr07-evidence-fr-m-frame" x="0" y="0" width="420" height="1080" rx="0" fill="var(--color-ink)" stroke="none" stroke-width="0"/><text data-panel="mr07-evidence-fr-m-frame" x="28" y="40" font-family="l0g Machine Resilience" font-size="18" font-weight="400" fill="var(--color-signal)" text-anchor="start">l0g / MACHINES</text><text data-panel="mr07-evidence-fr-m-frame" x="392" y="40" font-family="l0g Machine Resilience" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="end">05</text><text data-panel="mr07-evidence-fr-m-frame" x="28" y="88" font-family="l0g Machine Resilience" font-size="27" font-weight="700" fill="var(--color-paper)" text-anchor="start">Acheter une capacité</text><text data-panel="mr07-evidence-fr-m-frame" x="28" y="123" font-family="l0g Machine Resilience" font-size="27" font-weight="700" fill="var(--color-paper)" text-anchor="start">démontrable</text><text data-panel="mr07-evidence-fr-m-frame" x="28" y="156" font-family="l0g Machine Resilience" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">Date, périmètre et conditions donnent</text><text data-panel="mr07-evidence-fr-m-frame" x="28" y="181" font-family="l0g Machine Resilience" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">la portée</text><rect id="mr07-evidence-fr-m-panel-function" x="28" y="195" width="364" height="120" rx="7" fill="var(--color-ink)" stroke="var(--color-signal)" stroke-width="1