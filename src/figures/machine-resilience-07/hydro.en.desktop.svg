<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="mr07-hydro-en-d-t mr07-hydro-en-d-d" style="width:100%;height:auto" class="l0g-machines07-svg"><title id="mr07-hydro-en-d-t">Hydro recovery varies across activities</title><desc id="mr07-hydro-en-d-d">Hydro, 26 March 2019: reported operating conditions one week after the attack. The 70–80% rate covers three Extruded Solutions units; other states remain qualitative.</desc><rect id="mr07-hydro-en-d-frame" x="0" y="0" width="1000" height="680" rx="0" fill="var(--color-ink)" stroke="none" stroke-width="0"/><text data-panel="mr07-hydro-en-d-frame" x="28" y="45" font-family="l0g Machine Resilience" font-size="24" font-weight="400" fill="var(--color-signal)" text-anchor="start">l0g / MACHINES</text><text data-panel="mr07-hydro-en-d-frame" x="972" y="45" font-family="l0g Machine Resilience" font-size="24" font-weight="400" fill="var(--color-muted)" text-anchor="end">01</text><text data-panel="mr07-hydro-en-d-frame" x="28" y="100" font-family="l0g Machine Resilience" font-size="36" font-weight="700" fill="var(--color-paper)" text-anchor="start">Hydro recovery varies across activities</text><text data-panel="mr07-hydro-en-d-frame" x="28" y="140" font-family="l0g Machine Resilience" font-size="24" font-weight="400" fill="var(--color-muted)" text-anchor="start">Hydro · reported states on 26 March 2019</text><rect id="mr07-hydro-en-d-panel-state-0" x="28" y="186" width="448" height="190" rx="7" fill="var(--color-surface-2)" stroke="none" stroke-width="0" data-state="normal" data-date="2019-03-26"/><text data-panel="mr07-hydro-en-d-panel-state-0" x="44" y="224" font-family="l0g Machine Resilience" font-size="26" font-weight="400" fill="var(--color-signal)" text-anchor="start">Normal production</text><text data-panel="mr07-hydro-en-d-panel-state-0" x="44" y="275" font-family="l0g Machine Resilience" font-size="24" font-weight="400" fill="var(--color-paper)" text-anchor="start">Energy · Bauxite &amp; Alumina</text><text data-panel="mr07-hydro-en-d-panel-state-0" x="44" y="337" font-family="l0g Machine Resilience" font-size="24" font-weight="400" fill="var(--color-muted)" text-anchor="start">Reported state, no numerical rate.</text><rect id="mr07-hydro-en-d-panel-state-1" x="524" y="186" width="448" height="190" rx="7" fill="var(--color-surface-2)" stroke="none" stroke-width="0" data-state="normal-manual" data-date="2019-03-26"/><text data-panel="mr07-hydro-en-d-panel-state-1" x="540" y="224" font-family="l0g Machine Resilience" font-size="26" font-weight="400" fill="var(--color-signal)" text-anchor="start">Normal production</text><text data-panel="mr07-hydro-en-d-panel-state-1" x="540" y="275" font-family="l0g Machine Resilience" font-size="24" font-weight="400" fill="var(--color-paper)" text-anchor="start">Primary Metal · Rolled Products</text><text data-panel="mr07-hydro-en-d-panel-state-1" x="540" y="337" font-family="l0g Machine Resilience" font-size="24" font-weight="400" fill="var(--color-muted)" text-anchor="start">Increased manual operation.</text><rect id="mr07-hydro-en-d-panel-state-2" x="28" y="415" width="448" height="200" rx="7" fill="var(--color-surface-2)" stroke="none" stroke-width="0" data-state="aggregate-rate" data-rate-low="70" data-rate-high="80" data-date="2019-03-26"/><text data-panel="mr07-hydro-en-d-panel-state-2" x="44" y="453" font-family="l0g Machine Resilience" font-size="36" font-weight="400" fill="var(--color-amber)" text-anchor="start">70–80%</text><text data-panel="mr07-hydro-en-d-panel-state-2" x="44" y="495" font-family="l0g Machine Resilience" font-size="24" font-weight="400" fill="var(--color-paper)" text-anchor="start">Extrusion Europe · Extrusion</text><text data-panel="mr07-hydro-en-d-panel-state-2" x="44" y="526" font-family="l0g Machine Resilience" font-size="24" font-weight="400" fill="var(--color-paper)" text-anchor="start">North America · Precision Tubing</text><text data-panel="mr07-hydro-en-d-panel-state-2" x="44" y="589" font-family="l0g Machine Resilience" font-size="24" font-weight="400" fill="var(--color-muted)" text-anchor="start">Aggregate rate for the three units.</text><rect id="mr07-hydro-en-d-panel-state-3" x="524" y="415" width="448" height="200" rx="7" fill="var(--color-surface-2)" stroke="none" stroke-width="0" data-state="near-standstill" data-date="2019-03-26"/><text data-panel="mr07-hydro-en-d-panel-state-3" x="540" y="453" font-family="l0g Machine Resilience" font-size="26" font-weight="400" fill="var(--color-accent)" text-anchor="start">Almost at a standstill</text><text data-panel="mr07-hydro-en-d-panel-state-3" x="540" y="504" font-family="l0g Machine Resilience" font-size="24" font-weight="400" fill="var(--color-paper)" text-anchor="start">Building Systems</text><text data-panel="mr07-hydro-en-d-panel-state-3" x="540" y="566" font-family="l0g Machine Resilience" font-size="24" font-weight="400" fill="var(--color-muted)" text-anchor="start">Fourth Extruded Solutions unit.</text><text data-panel="mr07-hydro-en-d-frame" x="28" y="670" font-family="l0g Machine Resilience" font-size="24" font-weight="400" fill="var(--color-muted)" text-anchor="start">[01, 02]</text></svg>