<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1080" role="img" aria-labelledby="mr07-threshold-en-m-t mr07-threshold-en-m-d" style="width:100%;height:auto" class="l0g-machines07-svg"><title id="mr07-threshold-en-m-t">Extra capacity and the event threshold</title><desc id="mr07-threshold-en-m-d">The hypothetical case links €60,000 of additional five-year cost to twelve site-hours saved per event. At €2,500 of lost contribution per site-hour, break-even requires two comparable events.</desc><rect id="mr07-threshold-en-m-frame" x="0" y="0" width="420" height="1080" rx="0" fill="var(--color-ink)" stroke="none" stroke-width="0"/><text data-panel="mr07-threshold-en-m-frame" x="28" y="40" font-family="l0g Machine Resilience" font-size="18" font-weight="400" fill="var(--color-signal)" text-anchor="start">l0g / MACHINES</text><text data-panel="mr07-threshold-en-m-frame" x="392" y="40" font-family="l0g Machine Resilience" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="end">04</text><text data-panel="mr07-threshold-en-m-frame" x="28" y="88" font-family="l0g Machine Resilience" font-size="27" font-weight="700" fill="var(--color-paper)" text-anchor="start">Extra capacity and the</text><text data-panel="mr07-threshold-en-m-frame" x="28" y="123" font-family="l0g Machine Resilience" font-size="27" font-weight="700" fill="var(--color-paper)" text-anchor="start">event threshold</text><text data-panel="mr07-threshold-en-m-frame" x="28" y="156" font-family="l0g Machine Resilience" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">FICTIONAL CASE · constant assumed</text><text data-panel="mr07-threshold-en-m-frame" x="28" y="181" font-family="l0g Machine Resilience" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">euros · 5-year horizon</text><rect id="mr07-threshold-en-m-panel-money-0" x="28" y="195" width="364" height="160" rx="7" fill="var(--color-surface-2)" stroke="none" stroke-width="0" data-money="cost" data-value="60000"/><text data-panel="mr07-threshold-en-m-panel-money-0" x="44" y="230" font-family="l0g Machine Resilience" font-size="22" font-weight="400" fill="var(--color-paper)" text-anchor="start">Five-year cost</text><text data-panel="mr07-threshold-en-m-panel-money-0" x="44" y="270" font-family="l0g Machine Resilience" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">30,000 + 5 × €6,000</text><text data-panel="mr07-threshold-en-m-panel-money-0" x="44" y="326" font-family="l0g Machine Resilience" font-size="30" font-weight="400" fill="var(--color-amber)" text-anchor="start">€60,000</text><rect id="mr07-threshold-en-m-panel-money-1" x="28" y="400" width="364" height="160" rx="7" fill="var(--color-surface-2)" stroke="none" stroke-width="0" data-money="benefit" data-value="30000"/><text data-panel="mr07-threshold-en-m-panel-money-1" x="44" y="435" font-family="l0g Machine Resilience" font-size="22" font-weight="400" fill="var(--color-paper)" text-anchor="start">Benefit per event</text><text data-panel="mr07-threshold-en-m-panel-money-1" x="44" y="475" font-family="l0g Machine Resilience" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">12 site-h × €2,500/site-h</text><text data-panel="mr07-threshold-en-m-panel-money-1" x="44" y="531" font-family="l0g Machine Resilience" font-size="30" font-weight="400" fill="var(--color-signal)" text-anchor="start">€30,000</text><rect id="mr07-threshold-en-m-panel-threshold" x="28" y="615" width="364" height="145" rx="7" fill="var(--color-ink)" stroke="var(--color-signal)" stroke-width="1" data-value="2"/><text data-panel="mr07-threshold-en-m-panel-threshold" x="44" y="658" font-family="l0g Machine Resilience" font-size="27" font-weight="400" fill="var(--color-paper)" text-anchor="start">60,000 ÷ 30,000 = 2</text><text data-panel="mr07-threshold-en-m-panel-threshold" x="44" y="702" font-family="l0g Machine Resilience" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">comparable events over five years</text><text data-panel="mr07-threshold-en-m-frame" x="28" y="796" font-family="l0g Machine Resilience" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">Sensitivity to lost contribution</text><rect id="mr07-threshold-en-m-panel-sensitivity-0" x="28" y="815" width="364" height="55" rx="7" fill="var(--color-surface-2)" stroke="none" stroke-width="0" data-contribution="1000" data-events="5"/><text data-panel="mr07-threshold-en-m-panel-sensitivity-0" x="44" y="849" font-family="l0g Machine Resilience" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">€1,000/site-h</text><text data-panel="mr07-threshold-en-m-panel-sensitivity-0" x="376" y="849" font-family="l0g Machine Resilience" font-size="18" font-weight="400" fill="var(--color-amber)" text-anchor="end">5 events</text><rect id="mr07-threshold-en-m-panel-sensitivity-1" x="28" y="880" width="364" height="55" rx="7" fill="var(--color-surface-2)" stroke="none" stroke-width="0" data-contribution="2500" data-events="2"/><text data-panel="mr07-threshold-en-m-panel-sensitivity-1" x="44" y="914" font-family="l0g Machine Resilience" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">€2,500/site-h</text><text data-panel="mr07-threshold-en-m-panel-sensitivity-1" x="376" y="914" font-family="l0g Machine Resilience" font-size="18" font-weight="400" fill="var(--color-amber)" text-anchor="end">2 events</text><rect id="mr07-threshold-en-m-panel-sensitivity-2" x="28" y="945" width="364" height="55" rx="7" fill="var(--color-surface-2)" stroke="none" stroke-width="0" data-contribution="5000" data-events="1"/><text data-panel="mr07-threshold-en-m-panel-sensitivity-2" x="44" y="979" font-family="l0g Machine Resilience" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">€5,000/site-h</text><text data-panel="mr07-threshold-en-m-panel-sensitivity-2" x="376" y="979" font-family="l0g Machine Resilience" font-size="18" font-weight="400" fill="var(--color-amber)" text-anchor="end">1 event</text><text data-panel="mr07-threshold-en-m-frame" x="28" y="1060" font-family="l0g Machine Resilience" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">L0G CALCULATION · FICTIONAL CASE</text></svg>