<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="learning-juniors-fr-diagnosis-m-title learning-juniors-fr-diagnosis-m-desc" viewBox="0 0 420 980" style="width:100%;height:auto" class="l0g-learning-juniors-svg">
<title id="learning-juniors-fr-diagnosis-m-title">Trois observations orientent le diagnostic</title>
<desc id="learning-juniors-fr-diagnosis-m-desc">Exercice fictif : deux postes échouent sur B, tandis que A réussit sur D. Le problème commun à B ou à son chemin d’accès devient une piste à examiner. Cas pédagogique original, sans incident réel ni procédure opérationnelle. Les observations choisies orientent une hypothèse sans identifier la cause avec certitude. La réussite sur D ne prouve pas que chaque composant de A fonctionne, ni qu’il existe une seule panne. Le retour avec un tuteur et le cas de transfert sont des modalités proposées, inspirées du RNCP40799 et de l’AFEST. Aucun script ou accès à un système n’est nécessaire.</desc>
