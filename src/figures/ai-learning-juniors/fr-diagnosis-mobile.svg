<text data-panel="learning-juniors-fr-diagnosis-m-frame" x="28" y="34" fill="var(--color-signal)" font-family="l0g Learning Juniors" font-size="17" font-weight="700" text-anchor="start">l0g / APPRENDRE</text>
<text data-panel="learning-juniors-fr-diagnosis-m-frame" x="392" y="34" fill="var(--color-muted)" font-family="l0g Learning Juniors" font-size="17" font-weight="400" text-anchor="end">04 / 05</text>
