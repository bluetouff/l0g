<text data-panel="learning-juniors-fr-diagnosis-m-frame" x="28" y="132" fill="var(--color-muted)" font-family="l0g Learning Juniors" font-size="17" font-weight="400" text-anchor="start">Cas pédagogique fictif · postes A/C</text>
