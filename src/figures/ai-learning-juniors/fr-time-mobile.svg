<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="learning-juniors-fr-time-m-title learning-juniors-fr-time-m-desc" viewBox="0 0 420 900" style="width:100%;height:auto" class="l0g-learning-juniors-svg">
<title id="learning-juniors-fr-time-m-title">Donner une destination au temps gagné</title>
<desc id="learning-juniors-fr-time-m-desc">Avec ces hypothèses, le gain net est de 11 h 40. En réserver la moitié ouvre 5 h 50 pour apprendre ; le temps propre du tuteur se budgète en plus. Modèle illustratif : 100 cas/mois, 30 min/cas avant assistance, 10 min économisées et 3 min de vérification ajoutées par cas. Référence 3 000 min ; opérations assistées 2 300 min ; gain net 700 min. Répartition à 50 % : 350 min de formation et 350 min disponibles pour d’autres usages. Onze séances de 30 min utilisent 330 min, avec 20 min restantes. Les largeurs de la barre répartissent les 3 000 min. Volume et qualité supposés constants ; temps propre du tuteur exclu. Les valeurs sont choisies, sans mesure d’effet de l’IA, de compétence ou d’emploi.</desc>
