<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="learning-juniors-en-loop-m-title learning-juniors-en-loop-m-desc" viewBox="0 0 420 1000" style="width:100%;height:auto" class="l0g-learning-juniors-svg">
<title id="learning-juniors-en-loop-m-title">From the task to experience</title>
<desc id="learning-juniors-en-loop-m-desc">The delivered service completes the intervention. Reviewing the reasoning prepares the next case. This loop depicts a proposed learning arrangement. Original diagram informed by RNCP40799 competencies and the French AFEST framework. Arrows denote work and reflection steps, with no measured duration or effect. Assistance can enter at several stages. This particular proposed arrangement has not been experimentally evaluated.</desc>
