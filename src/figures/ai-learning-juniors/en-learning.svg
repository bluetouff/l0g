<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="learning-juniors-en-learning-d-title learning-juniors-en-learning-d-desc" viewBox="0 0 1000 680" style="width:100%;height:auto" class="l0g-learning-juniors-svg">
<title id="learning-juniors-en-learning-d-title">Assisted practice, then an exam alone</title>
<desc id="learning-juniors-en-learning-d-desc">A high-school mathematics experiment in Türkiye: adjusted effects relative to the control group. Assisted-practice gains and exam outcomes measure different performances. Bastani and colleagues, PNAS 2025, Table 1. Coefficients on the 0–1 scale multiplied by 100. Practice: Base +13.7, Tutor +36.1; exam: Base −5.4, Tutor −0.4. Whiskers show ±1 published standard error, clustered by classroom: 3.1, 3.2, 2.2 and 1.3 points. These are not 95% confidence intervals. Published thresholds: p&lt;0.01 for both practice estimates; p&lt;0.05 for Base in the exam; Tutor not significant at 5%. Both panels use the same −10 to +45 axis. There are 2,848 student-session observations, not people. Tutor receives teacher-prepared guidance. The assessments differ; long-term professional retention is not measured.</desc>
