<title id="learning-juniors-en-loop-d-title">From the task to experience</title>
<desc id="learning-juniors-en-loop-d-desc">The delivered service completes the intervention. Reviewing the reasoning prepares the next case. This loop depicts a proposed learning arrangement. Original diagram informed by RNCP40799 competencies and the French AFEST framework. Arrows denote work and reflection steps, with no measured duration or effect. Assistance can enter at several stages. This particular proposed arrangement has not been experimentally evaluated.</desc>
