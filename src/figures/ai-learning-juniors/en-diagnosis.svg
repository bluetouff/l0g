<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="learning-juniors-en-diagnosis-d-title learning-juniors-en-diagnosis-d-desc" viewBox="0 0 1000 680" style="width:100%;height:auto" class="l0g-learning-juniors-svg">
<title id="learning-juniors-en-diagnosis-d-title">Three observations guide the diagnosis</title>
<desc id="learning-juniors-en-diagnosis-d-desc">Fictional exercise: two computers fail on B while A succeeds on D. A problem shared by B or its access path becomes a hypothesis to investigate. Original teaching case, with no real incident or operational procedure. The chosen observations guide a hypothesis without proving a cause. Success on D does not prove that every component of A works or that only one fault exists. Mentor review and a transfer case are proposed activities informed by RNCP40799 and AFEST. No script or system access is required.</desc>
