<text data-panel="learning-juniors-en-diagnosis-d-frame" x="40" y="40" fill="var(--color-signal)" font-family="l0g Learning Juniors" font-size="22" font-weight="700" text-anchor="start">l0g / LEARNING</text>
<text data-panel="learning-juniors-en-diagnosis-d-frame" x="960" y="40" fill="var(--color-muted)" font-family="l0g Learning Juniors" font-size="22" font-weight="400" text-anchor="end">04 / 05</text>
<text data-panel="learning-juniors-en-diagnosis-d-frame" x="40" y="93" fill="var(--color-paper)" font-family="l0g Learning Juniors" font-size="34" font-weight="700" text-anchor="start">Three observations guide the diagnosis</text>
<text data-panel="learning-juniors-en-diagnosis-d-frame" x="40" y="137" fill="var(--color-muted)" font-family="l0g Learning Juniors" font-size="22" font-weight="400" text-anchor="start">Fictional teaching case · computers A/C and printers B/D</text>
