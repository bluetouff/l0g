<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="learning-juniors-fr-learning-m-title learning-juniors-fr-learning-m-desc" viewBox="0 0 420 1000" style="width:100%;height:auto" class="l0g-learning-juniors-svg">
<title id="learning-juniors-fr-learning-m-title">L’exercice aidé, puis l’examen seul</title>
<desc id="learning-juniors-fr-learning-m-desc">Expérience en mathématiques au lycée, Turquie : effets ajustés par rapport au groupe témoin. Les gains de l’exercice assisté et le résultat à l’examen mesurent deux performances distinctes. Bastani et collègues, PNAS 2025, tableau 1. Coefficients sur l’échelle 0–1 multipliés par 100. Entraînement : Base +13,7, Tutor +36,1 ; examen : Base −5,4, Tutor −0,4. Traits = ±1 erreur standard publiée, regroupée par classe : 3,1 ; 3,2 ; 2,2 ; 1,3 points. Ces traits ne sont pas des intervalles de confiance à 95 %. Seuils publiés : p&lt;0,01 pour les deux entraînements ; p&lt;0,05 pour Base à l’examen ; Tutor non significatif à 5 %. Même axe −10 à +45 dans les deux panneaux. 2 848 observations élève-séance, et non personnes. Tutor reçoit des indications pédagogiques préparées par les enseignants. Les épreuves sont distinctes ; aucune rétention professionnelle de longue durée n’est mesurée.</desc>
