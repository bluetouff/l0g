<text data-panel="learning-juniors-en-time-d-frame" x="40" y="137" fill="var(--color-muted)" font-family="l0g Learning Juniors" font-size="22" font-weight="400" text-anchor="start">Fictional inputs · 100 cases × 30 minutes = 50 hours</text>
