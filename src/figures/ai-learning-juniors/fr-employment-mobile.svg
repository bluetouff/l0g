<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="learning-juniors-fr-employment-m-title learning-juniors-fr-employment-m-desc" viewBox="0 0 420 900" style="width:100%;height:auto" class="l0g-learning-juniors-svg">
<title id="learning-juniors-fr-employment-m-title">L’emploi selon l’âge et l’exposition</title>
<desc id="learning-juniors-fr-employment-m-desc">Dans l’échantillon américain Stanford–ADP, les indices de septembre 2026 divergent davantage selon l’exposition chez les 22–25 ans. Chaque série vaut 100 en novembre 2022. Huit observations extraites du fichier canaries_age_by_exposure.csv, millésime du 16 octobre 2026 ; dashboard daté du 21 octobre. Comparaison des deux seules dates affichées, sans interpolation mensuelle. Q1 et Q5 sont les quintiles de métiers les moins et les plus exposés, avec un poids égal par métier pour leur classement. Les salariés ne se répartissent pas également entre quintiles. Entreprises disposant de cinq ans d’historique ADP, salariés appariés à un code métier ; champ non représentatif de tout le marché américain. L’âge n’est pas l’expérience ; l’exposition n’est pas l’adoption. Ces indices ne constituent pas un effet causal de l’IA et ne recalculent pas le chiffre de 19 % du papier d’août.</desc>
