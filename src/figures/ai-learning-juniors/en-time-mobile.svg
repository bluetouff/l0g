<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="learning-juniors-en-time-m-title learning-juniors-en-time-m-desc" viewBox="0 0 420 900" style="width:100%;height:auto" class="l0g-learning-juniors-svg">
<title id="learning-juniors-en-time-m-title">Give saved time a destination</title>
<desc id="learning-juniors-en-time-m-desc">Under these assumptions, net time saved is 11 h 40. Reserving half provides 5 h 50 for learning; the mentor’s own time needs a separate budget. Illustrative model: 100 cases/month, 30 min/case before assistance, 10 min saved and 3 min added for checking per case. Baseline 3,000 min; assisted operations 2,300 min; net saving 700 min. A 50% allocation gives 350 min for learning and 350 min for other uses. Eleven 30-minute sessions take 330 min, leaving 20 min. Bar widths allocate all 3,000 min. Volume and quality are held constant; the mentor’s additional time is excluded. Inputs are chosen assumptions, not measurements of AI, skill or employment effects.</desc>
