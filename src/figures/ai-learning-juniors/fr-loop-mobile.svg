<text data-panel="learning-juniors-fr-loop-m-frame" x="392" y="34" fill="var(--color-muted)" font-family="l0g Learning Juniors" font-size="17" font-weight="400" text-anchor="end">01 / 05</text>
<text data-panel="learning-juniors-fr-loop-m-frame" x="28" y="81" fill="var(--color-paper)" font-family="l0g Learning Juniors" font-size="25" font-weight="700" text-anchor="start">Une tâche, deux résultats</text>
