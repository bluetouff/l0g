<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="learning-juniors-fr-loop-m-title learning-juniors-fr-loop-m-desc" viewBox="0 0 420 1000" style="width:100%;height:auto" class="l0g-learning-juniors-svg">
<title id="learning-juniors-fr-loop-m-title">De la tâche à l’expérience</title>
<desc id="learning-juniors-fr-loop-m-desc">Le service rendu termine l’intervention. Le retour sur le raisonnement prépare le prochain cas. Cette boucle représente une organisation pédagogique proposée. Schéma original inspiré des compétences du RNCP40799 et de la structure de l’AFEST. Les flèches représentent des passages de travail et de réflexion, sans durée ni effet mesuré. L’assistance peut intervenir à plusieurs étapes. Le parcours précis proposé ici n’a pas fait l’objet d’une évaluation expérimentale.</desc>
