<title id="learning-juniors-fr-loop-d-title">De la tâche à l’expérience</title>
<desc id="learning-juniors-fr-loop-d-desc">Le service rendu termine l’intervention. Le retour sur le raisonnement prépare le prochain cas. Cette boucle représente une organisation pédagogique proposée. Schéma original inspiré des compétences du RNCP40799 et de la structure de l’AFEST. Les flèches représentent des passages de travail et de réflexion, sans durée ni effet mesuré. L’assistance peut intervenir à plusieurs étapes. Le parcours précis proposé ici n’a pas fait l’objet d’une évaluation expérimentale.</desc>
