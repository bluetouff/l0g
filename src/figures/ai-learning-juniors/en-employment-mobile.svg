<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="learning-juniors-en-employment-m-title learning-juniors-en-employment-m-desc" viewBox="0 0 420 900" style="width:100%;height:auto" class="l0g-learning-juniors-svg">
<title id="learning-juniors-en-employment-m-title">Employment by age and exposure</title>
<desc id="learning-juniors-en-employment-m-desc">In the US Stanford–ADP sample, September 2026 indices differ more by exposure among workers aged 22–25. Every series equals 100 in November 2022. Eight observations extracted from canaries_age_by_exposure.csv, vintage 16 October 2026; dashboard dated 21 October. Only the two displayed dates are compared, with no monthly interpolation. Q1 and Q5 contain the least and most exposed occupations, ranked with equal weight per occupation. Workers are not distributed equally across quintiles. Firms have five years of ADP history; workers are matched to occupation codes. This is not a representative sample of the entire US market. Age differs from experience; exposure differs from adoption. These indices do not estimate a causal AI effect or update the August paper’s 19% figure.</desc>
