<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="learning-juniors-en-diagnosis-m-title learning-juniors-en-diagnosis-m-desc" viewBox="0 0 420 980" style="width:100%;height:auto" class="l0g-learning-juniors-svg">
<title id="learning-juniors-en-diagnosis-m-title">Three observations guide the diagnosis</title>
<desc id="learning-juniors-en-diagnosis-m-desc">Fictional exercise: two computers fail on B while A succeeds on D. A problem shared by B or its access path becomes a hypothesis to investigate. Original teaching case, with no real incident or operational procedure. The chosen observations guide a hypothesis without proving a cause. Success on D does not prove that every component of A works or that only one fault exists. Mentor review and a transfer case are proposed activities informed by RNCP40799 and AFEST. No script or system access is required.</desc>
<rect id="learning-juniors-en-diagnosis-m-frame" x="0" y="0" width="420" height="980" fill="var(--color-ink)"/>
<text data-panel="learning-juniors-en-diagnosis-m-frame" x="28" y="34" fill="var(--color-signal)" font-family="l0g Learning Juniors" font-size="17" font-weight="700" text-anchor="start">l0g / LEARNING</text>
<text data-panel="learning-juniors-en-diagnosis-m-frame" x="392" y="34" fill="var(--color-muted)" font-family="l0g Learning Juniors" font-size="17" font-weight="400" text-anchor="end">04 / 05</text>
<text data-panel="learning-juniors-en-diagnosis-m-frame" x="28" y="81" fill="var(--color-paper)" font-family="l0g Learning Juniors" font-size="25" font-weight="700" text-anchor="start">Test an explanation</text>
<text data-panel="learning-juniors-en-diagnosis-m-frame" x="28" y="132" fill="var(--color-muted)" font-family="l0g Learning Juniors" font-size="17" font-weight="400" text-anchor="start">Fictional teaching case · computers</text>
<text data-panel="learning-juniors-en-diagnosis-m-frame" x="28" y="156" fill="var(--color-muted)" font-family="l0g Learning Juniors" font-size="17" font-weight="400" text-anchor="start">A/C and printers B/D</text>
