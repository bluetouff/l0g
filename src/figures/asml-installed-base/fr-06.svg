<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="asml-fr-06-title asml-fr-06-desc" style="width:100%;height:auto" class="l0g-asml-svg"><title id="asml-fr-06-title">La licence suit la prestation</title><desc id="asml-fr-06-desc">Un équipement déjà installé peut nécessiter des pièces, logiciels et services. Les contrôles dépendent du produit, de la destination, de l’utilisateur et de la prestation. Lorsqu’une autorisation est requise, accord, délai ou refus influent sur la prestation et ses revenus.</desc><rect id="asml-fr-06-frame" x="0" y="0" width="1000" height="680" rx="0" fill="var(--color-ink)"/><text data-panel="asml-fr-06-frame" x="40" y="34" fill="var(--color-signal)" font-family="l0g ASML" font-size="24" font-weight="700" text-anchor="start">l0g / ASML</text><text data-panel="asml-fr-06-frame" x="960" y="34" fill="var(--color-muted)" font-family="l0g ASML" font-size="24" font-weight="400" text-anchor="end">06</text><text data-panel="asml-fr-06-frame" x="40" y="85" fill="var(--color-paper)" font-family="l0g ASML" font-size="34" font-weight="700" text-anchor="start">La licence suit la prestation</text><text data-panel="asml-fr-06-frame" x="40" y="134" fill="var(--color-muted)" font-family="l0g ASML" font-size="24" font-weight="400" text-anchor="start">Mécanisme réglementaire · cas par cas</text><rect id="asml-fr-06-card-6" x="40" y="190" width="270" height="118" rx="7" fill="var(--color-surface-2)"/><text data-panel="asml-fr-06-card-6" x="57" y="227" fill="var(--color-muted)" font-family="l0g ASML" font-size="25" font-weight="700" text-anchor="start">Machine installée</text><text data-panel="asml-fr-06-card-6" x="57" y="268" fill="var(--color-paper)" font-family="l0g ASML" font-size="24" font-weight="400" text-anchor="start">Chez le client</text><path data-connector="stage-0" d="M316 249 L359 249" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M351.571979 254.081782 L359 249 L351.571979 243.918218" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect id="asml-fr-06-card-11" x="365" y="190" width="270" height="118" rx="7" fill="var(--color-surface-2)"/><text data-panel="asml-fr-06-card-11" x="382" y="227" fill="var(--color-signal)" font-family="l0g ASML" font-size="25" font-weight="700" text-anchor="start">Prestation</text><text data-panel="asml-fr-06-card-11" x="382" y="268" fill="var(--color-paper)" font-family="l0g ASML" font-size="24" font-weight="400" text-anchor="start">Pièce, logiciel,</text><text data-panel="asml-fr-06-card-11" x="382" y="298" fill="var(--color-paper)" font-family="l0g ASML" font-size="24" font-weight="400" text-anchor="start">service</text><path data-connector="stage-1" d="M641 249 L684 249" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M676.571979 254.081782 L684 249 L676.571979 243.918218" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect id="asml-fr-06-card-17" x="690" y="190" width="270" height="118" rx="7" fill="var(--color-surface-2)"/><text data-panel="asml-fr-06-card-17" x="707" y="227" fill="var(--color-amber)" font-family="l0g ASML" font-size="25" font-weight="700" text-anchor="start">Règles par cas</text><text data-panel="asml-fr-06-card-17" x="707" y="268" fill="var(--color-paper)" font-family="l0g ASML" font-size="24" font-weight="400" text-anchor="start">Produit, pays,</text><text data-panel="asml-fr-06-card-17" x="707" y="298" fill="var(--color-paper)" font-family="l0g ASML" font-size="24" font-weight="400" text-anchor="start">utilisateur</text><text data-panel="asml-fr-06-frame" x="40" y="362" fill="var(--color-paper)" font-family="l0g ASML" font-size="27" font-weight="700" text-anchor="start">Si une autorisation est requise :</text><rect id="asml-fr-06-card-22" x="40" y="410" width="440" height="150" rx="7" fill="var(--color-surface-2)"/><text data-panel="asml-fr-06-card-22" x="58" y="448" fill="var(--color-signal)" font-family="l0g ASML" font-size="29" font-weight="700" text-anchor="start">Accord</text><text data-panel="asml-fr-06-card-22" x="58" y="489" fill="var(--color-paper)" font-family="l0g ASML" font-size="24" font-weight="400" text-anchor="start">Prestation possible selon ses</text><text data-panel="asml-fr-06-card-22" x="58" y="521" fill="var(--color-paper)" font-family="l0g ASML" font-size="24" font-weight="400" text-anchor="start">conditions.</text><rect id="asml-fr-06-card-26" x="520" y="410" width="440" height="150" rx="7" fill="var(--color-surface-2)"/><text data-panel="asml-fr-06-card-26" x="538" y="448" fill="var(--color-accent)" font-family="l0g ASML" font-size="29" font-weight="700" text-anchor="start">Délai / refus</text><text data-panel="asml-fr-06-card-26" x="538" y="489" fill="var(--color-paper)" font-family="l0g ASML" font-size="24" font-weight="400" text-anchor="start">Prestation et revenus</text><text data-panel="asml-fr-06-card-26" x="538" y="521" fill="var(--color-paper)" font-family="l0g ASML" font-size="24" font-weight="400" text-anchor="start">potentiellement décalés.</text><path data-connector="approved-route" d="M825 315 L825 382 L260 382 L260 402" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M254.918218 394.571979 L260 402 L265.081782 394.571979" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path data-connector="delayed-route" d="M825 382 L740 382 L740 402" fill="none" stroke="var(--color-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M734.918218 394.571979 L740 402 L745.081782 394.571979" fill="none" stroke="var(--color-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="asml-fr-06-frame" x="40" y="638" fill="var(--color-muted)" font-family="l0g ASML" font-size="24" font-weight="400" text-anchor="start">[10, 11] · règles applicables à chaque intervention.</text></svg>