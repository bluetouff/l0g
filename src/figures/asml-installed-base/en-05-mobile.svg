<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1080" role="img" aria-labelledby="asml-en-05-m-title asml-en-05-m-desc" style="width:100%;height:auto" class="l0g-asml-svg"><title id="asml-en-05-m-title">2026 meets an earlier scenario</title><desc id="asml-en-05-m-desc">Reported 2025 €8.193bn; reported nine months 2026 €8.5381bn; Q4 guidance about €3.7bn. Implied full year about €12.2bn still depends on Q4. Historical 2030 scenarios €11–13bn, published November 2024.</desc><rect id="asml-en-05-m-frame" x="0" y="0" width="420" height="1080" rx="0" fill="var(--color-ink)"/><text data-panel="asml-en-05-m-frame" x="20" y="32" fill="var(--color-signal)" font-family="l0g ASML" font-size="20" font-weight="700" text-anchor="start">l0g / ASML</text><text data-panel="asml-en-05-m-frame" x="400" y="32" fill="var(--color-muted)" font-family="l0g ASML" font-size="20" font-weight="400" text-anchor="end">05</text><text data-panel="asml-en-05-m-frame" x="20" y="80" fill="var(--color-paper)" font-family="l0g ASML" font-size="29" font-weight="700" text-anchor="start">2026 meets an earlier</text><text data-panel="asml-en-05-m-frame" x="20" y="116" fill="var(--color-paper)" font-family="l0g ASML" font-size="29" font-weight="700" text-anchor="start">scenario</text><text data-panel="asml-en-05-m-frame" x="20" y="155" fill="var(--color-muted)" font-family="l0g ASML" font-size="18" font-weight="400" text-anchor="start">Services and options · billion euros</text><text data-panel="asml-en-05-m-frame" x="25" y="245" fill="var(--color-paper)" font-family="l0g ASML" font-size="22" font-weight="700" text-anchor="start">2025 · reported</text><rect data-metric="annual-reported-eurm" data-value="8193" x="25" y="280" width="216.529286" height="32" rx="0" fill="var(--color-muted)"/><text data-panel="asml-en-05-m-frame" x="25" y="352" fill="var(--color-muted)" font-family="l0g ASML" font-size="24" font-weight="700" text-anchor="start">8.193</text><text data-panel="asml-en-05-m-frame" x="25" y=