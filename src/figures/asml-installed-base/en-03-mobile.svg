<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1080" role="img" aria-labelledby="asml-en-03-m-title asml-en-03-m-desc" style="width:100%;height:auto" class="l0g-asml-svg"><title id="asml-en-03-m-title">Services drive the increase</title><desc id="asml-en-03-m-desc">Systems gross profit €6.0382bn then €6.0411bn; service and options €2.1852bn then €3.1643bn. Changes €2.9m and €979.1m, total €982.0m. IFRS amortisation affects the comparison; unaudited half-year data.</desc><rect id="asml-en-03-m-frame" x="0" y="0" width="420" height="1080" rx="0" fill="var(--color-ink)"/><text data-panel="asml-en-03-m-frame" x="20" y="32" fill="var(--color-signal)" font-family="l0g ASML" font-size="20" font-weight="700" text-anchor="start">l0g / ASML</text><text data-panel="asml-en-03-m-frame" x="400" y="32" fill="var(--color-muted)" font-family="l0g ASML" font-size="20" font-weight="400" text-anchor="end">03</text><text data-panel="asml-en-03-m-frame" x="20" y="80" fill="var(--color-paper)" font-family="l0g ASML" font-size="29" font-weight="700" text-anchor="start">Services drive the</text><text data-panel="asml-en-03-m-frame" x="20" y="116" fill="var(--color-paper)" font-family="l0g ASML" font-size="29" font-weight="700" text-anchor="start">increase</text><text data-panel="asml-en-03-m-frame" x="20" y="155" fill="var(--color-muted)" font-family="l0g ASML" font-size="18" font-weight="400" text-anchor="start">H1 2025 and 2026 · EU-IFRS gross profit ·</text><text data-panel="asml-en-03-m-frame" x="20" y="180" fill="var(--color-muted)" font-family="l0g ASML" font-size="18" font-weight="400" text-anchor="start">€bn</text><text data-panel="asml-en-03-m-frame" x="25" y="250" fill="var(--color-paper)" font-family="l0g ASML" font-size="24" font-weight="700" text-anchor="start">H1 2025</text><text data-panel="asml-en-03-m-frame" x="25" y="285" fill="var(--color-muted)" font-family="l0g ASML" font-size="21" font-weight="700" text-anchor="start">6.038</text><text data-panel="asml-en-03-m-frame" x="253.4134" y="285" fill="var(--color-signal)" font-family="l0g ASML" font-size="21" font-weight="700" text-anchor="start">2.185</text><rect data-metric="systems-gross-eurm" data-value="6038.2" x="25" y="300" width="223.4134" height="32" rx="0" fill="var(--color-muted)"/><rect data-metric="services-gross-eurm" data-value="2185.2" x="248.4134" y="300" width="80.8524" height="32" rx="0" fill="var(--color-signal)"/><text data-panel="asml-en-03-m-frame" x="25" y="410" fill="var(--color-paper)" font-family="l0g ASML" font-size="24" font-weight="700" text-anchor="start">H1 2026</text><text data-panel="asml-en-03-m-frame" x="25" y="445" fill="var(--color-muted)" font-family="l0g ASML" font-size="21" font-weight="700" text-anchor="start">6.041</text><text data-panel="asml-en-03-m-frame" x="253.5207" y="445" fill="var(--color-signal)" font-family="l0g ASML" font-size="21" font-weight="700" text-anchor="start">3.164</text><rect data-metric="systems-gross-eurm" data-value="6041.1" x="25" y="460" width="223.5207" height="32" rx="0" fill="var(--color-muted)"/><rect data-metric="services-gross-eurm" data-value="3164.3" x="248.5207" y="460" width="117.0791" height="32" rx="0" fill="var(--color-signal)"/><text data-panel="asml-en-03-m-frame" x="25" y="625" fill="var(--color-paper)" font-family="l0g ASML" font-size="25" font-weight="700" text-anchor="start">Total increase: +€982.0m</text><rect data-metric="gross-change-eurm" data-value="2.9" x="25" y="675" width="1.092668" height="28" rx="0" fill="var(--color-muted)"/><rect data-metric="gross-change-eurm" data-value="979.1" x="26.092668" y="675" width="368.907332" height="28" rx="0" fill="var(--color-signal)"/><text data-panel="asml-en-03-m-frame" x="25" y="750" fill="var(--color-signal)" font-family="l0g ASML" font-size="24" font-weight="700" text-anchor="start">Services: +€979.1m</text><text data-panel="asml-en-03-m-frame" x="25" y="830" fill="var(--color-muted)" font-family="l0g ASML" font-size="22" font-weight="400" t