<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="asml-en-04-title asml-en-04-desc" style="width:100%;height:auto" class="l0g-asml-svg"><title id="asml-en-04-title">Upgrades take time offline</title><desc id="asml-en-04-desc">Historical NXT:1960 to NXT:1980 scenario: 230 to 295 wafer passes per hour after 42 days offline. Constant 100% availability and loading, immediate restart. Cumulative volume catches up after 190.6 days from the start. 365-day volumes 2.0148 and 2.28684 million wafer passes.</desc><rect id="asml-en-04-frame" x="0" y="0" width="1000" height="680" rx="0" fill="var(--color-ink)"/><text data-panel="asml-en-04-frame" x="40" y="34" fill="var(--color-signal)" font-family="l0g ASML" font-size="24" font-weight="700" text-anchor="start">l0g / ASML</text><text data-panel="asml-en-04-frame" x="960" y="34" fill="var(--color-muted)" font-family="l0g ASML" font-size="24" font-weight="400" text-anchor="end">04</text><text data-panel="asml-en-04-frame" x="40" y="85" fill="var(--color-paper)" font-family="l0g ASML" font-size="34" font-weight="700" text-anchor="start">Upgrades take time offline</text><text data-panel="asml-en-04-frame" x="40" y="134" fill="var(--color-muted)" font-family="l0g ASML" font-size="24" font-weight="400" text-anchor="start">Volume scenario · ASML example from 2021</text><text data-panel="asml-en-04-frame" x="40" y="185" fill="var(--color-paper)" font-family="l0g ASML" font-size="25" font-weight="700" text-anchor="start">Throughput: 230 → 295 passes/h</text><text data-panel="asml-en-04-frame" x="40" y="219" fill="var(--color-muted)" font-family="l0g ASML" font-size="24" font-weight="400" text-anchor="start">Offline: 42 days · volume in millions</text><rect id="asml-en-04-offline" x="100" y="240" width="95.506849" height="250" rx="0" fill="var(--color-surface-2)"/><line x1="100" y1="260" x2="135" y2="260" stroke="var(--color-muted)" stroke-width="3"/><text data-panel="asml-en-04-frame" x="145" y="2