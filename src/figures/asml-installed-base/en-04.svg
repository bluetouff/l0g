 stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="asml-en-04-frame" x="930" y="524" fill="var(--color-muted)" font-family="l0g ASML" font-size="24" font-weight="400" text-anchor="middle">365</text><path data-connector="baseline-volume" data-metric="volume-total-passes" data-value="2014800" d="M100 490 L930 288.52" fill="none" stroke="var(--color-muted)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path data-connector="upgraded-volume" data-metric="volume-total-passes" data-value="2286840" d="M100 490 L195.506849 490 L930 261.316" fill="none" stroke="var(--color-signal)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><line x1="533.454162" y1="384.780308" x2="533.454162" y2="490" stroke="var(--color-amber)" stroke-width="2" stroke-dasharray="6 5"/><circle cx="533.454162" cy="384.780308" r="5" fill="var(--color-amber)"/><text data-panel="asml-en-04-frame" x="100" y="568" fill="var(--color-amber)" font-family="l0g ASML" font-size="27" font-weight="700" text-anchor="start">~ 191 days to catch cumulative volume</text><text data-panel="asml-en-04-frame" x="40" y="610" fill="var(--color-signal)" font-family="l0g ASML" font-size="24" font-weight="400" text-anchor="start">365 days: 2.015 → 2.287 million passes (+13.5%).</text><text data-panel="asml-en-04-frame" x="40" y="638" fill="var(--color-muted)" font-family="l0g ASML" font-size="24" font-weight="400" text-anchor="start">[8], slide 22 · scenario: 100% loading and availability.</text></svg>