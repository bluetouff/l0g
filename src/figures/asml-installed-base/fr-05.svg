<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="asml-fr-05-title asml-fr-05-desc" style="width:100%;height:auto" class="l0g-asml-svg"><title id="asml-fr-05-title">2026 rejoint un ancien scénario</title><desc id="asml-fr-05-desc">2025 réalisé 8,193 Md€, neuf mois 2026 réalisés 8,5381 Md€, perspective T4 environ 3,7 Md€. Total implicite environ 12,2 Md€ soumis au T4. Scénarios 2030 de 11 à 13 Md€ publiés en novembre 2024.</desc><rect id="asml-fr-05-frame" x="0" y="0" width="1000" height="680" rx="0" fill="var(--color-ink)"/><text data-panel="asml-fr-05-frame" x="40" y="34" fill="var(--color-signal)" font-family="l0g ASML" font-size="24" font-weight="700" text-anchor="start">l0g / ASML</text><text data-panel="asml-fr-05-frame" x="960" y="34" fill="var(--color-muted)" font-family="l0g ASML" font-size="24" font-weight="400" text-anchor="end">05</text><text data-panel="asml-fr-05-frame" x="40" y="85" fill="var(--color-paper)" font-family="l0g ASML" font-size="34" font-weight="700" text-anchor="start">2026 rejoint un ancien scénario</text><text data-panel="asml-fr-05-frame" x="40" y="134" fill="var(--color-muted)" font-family="l0g ASML" font-size="24" font-weight="400" text-anchor="start">Services et options · milliards d’euros</text><text data-panel="asml-fr-05-frame" x="70" y="200" fill="var(--color-paper)" font-family="l0g ASML" font-size="27" font-weight="700" text-anchor="start">2025 · réalisé</text><rect data-metric="annual-reported-eurm" data-value="8193" x="70" y="235" width="503.284286" height="32" rx="0" fill="var(--color-muted)"/><text data-panel="asml-fr-05-frame" x="70" y="307" fill="var(--color-muted)" font-family="l0g ASML" font-size="27" font-weight="700" text-anchor="start">8,193</text><text data-panel="asml-fr-05-frame" x="70" y="340" fill="var(--color-paper)" font-family="l0g ASML" font-size="27" font-weight="700" text-anchor="start">2026 · réalisé + prévision</text><rect data-metric="nine-month-reported-eurm" d