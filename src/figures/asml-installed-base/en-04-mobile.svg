<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1080" role="img" aria-labelledby="asml-en-04-m-title asml-en-04-m-desc" style="width:100%;height:auto" class="l0g-asml-svg"><title id="asml-en-04-m-title">Upgrades take time offline</title><desc id="asml-en-04-m-desc">Historical NXT:1960 to NXT:1980 scenario: 230 to 295 wafer passes per hour after 42 days offline. Constant 100% availability and loading, immediate restart. Cumulative volume catches up after 190.6 days from the start. 365-day volumes 2.0148 and 2.28684 million wafer passes.</desc><rect id="asml-en-04-m-frame" x="0" y="0" width="420" height="1080" rx="0" fill="var(--color-ink)"/><text data-panel="asml-en-04-m-frame" x="20" y="32" fill="var(--color-signal)" font-family="l0g ASML" font-size="20" font-weight="700" text-anchor="start">l0g / ASML</text><text data-panel="asml-en-04-m-frame" x="400" y="32" fill="var(--color-muted)" font-family="l0g ASML" font-size="20" font-weight="400" text-anchor="end">04</text><text data-panel="asml-en-04-m-frame" x="20" y="80" fill="var(--color-paper)" font-family="l0g ASML" font-size="29" font-weight="700" text-anchor="start">Upgrades take time</text><text data-panel="asml-en-04-m-frame" x="20" y="116" fill="var(--color-paper)" font-family="l0g ASML" font-size="29" font-weight="700" text-anchor="start">offline</text><text data-panel="asml-en-04-m-frame" x="20" y="155" fill="var(--color-muted)" font-family="l0g ASML" font-size="18" font-weight="400" text-anchor="start">Volume scenario · ASML example from</text><text data-panel="asml-en-04-m-frame" x="20" y="180" fill="var(--color-muted)" font-family="l0g ASML" font-size="18" font-weight="400" text-anchor="start">2021</text><text data-panel="asml-en-04-m-frame" x="20" y="240" fill="var(--color-paper)" font-family="l0g ASML" font-size="22" font-weight="700" text-anchor="start">230 → 295 passes/h</text><text data-panel="asml-en-04-m-frame" x="20" y="274" fill="var(--color-muted)" font-family="l0g ASML" font-size="20" font-weight="400" text-anchor="start">Offline: 42 days · volume in millions</text><rect id="asml-en-04-m-offline" x="70" y="360" width="36.246575" height="330" rx="0" fill="var(--color-surface-2)"/><line x1="20" y1="310" x2="45" y2="310" stroke="var(--color-muted)" stroke-width="3"/><text data-panel="asml-en-04-m-frame" x="55" y="317" fill="var(--color-muted)" font-family="l0g ASML" font-size="18" font-weight="400" text-anchor="start">No upgrade</text><line x1="20" y1="342" x2="45" y2="342" stroke="var(--color-signal)" stroke-width="3"/><text data-panel="asml-en-04-m-frame" x="55" y="349" fill="var(--color-signal)" font-family="l0g ASML" font-size="18" font-weight="400" text-anchor="start">With upgrade</text><line x1="70" y1="690" x2="385" y2="690" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="asml-en-04-m-frame" x="58" y="697" fill="var(--color-muted)" font-family="l0g ASML" font-size="18" font-weight="400" text-anchor="end">0</text><line x1="70" y1="558" x2="385" y2="558" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="asml-en-04-m-frame" x="58" y="565" fill="var(--color-muted)" font-family="l0g ASML" font-size="18" font-weight="400" text-anchor="end">1</text><line x1="70" y1="426" x2="385" y2="426" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="asml-en-04-m-frame" x="58" y="433" fill="var(--color-muted)" font-family="l0g ASML" font-size="18" font-weight="400" text-anchor="end">2</text><line x1="70" y1="690" x2="70" y2="697" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="asml-en-04-m-frame" x="70" y="724" fill="var(--color-muted)" font-family="l0g ASML" font-size="18" font-weight="400" text-anchor="middle">0</text><line x1="156.30137" y1="690" x2="156.30137" y2="697" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="asml-en-04-m-frame" x="156.30137" y="724" fill="var(--color-muted)" font-family="l0g ASML" font-size="18" font-weight="400" text-anchor="midd