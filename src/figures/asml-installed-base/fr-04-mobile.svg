<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1080" role="img" aria-labelledby="asml-fr-04-m-title asml-fr-04-m-desc" style="width:100%;height:auto" class="l0g-asml-svg"><title id="asml-fr-04-m-title">Moderniser coûte du temps</title><desc id="asml-fr-04-m-desc">Scénario historique NXT:1960 vers NXT:1980. Cadence 230 à 295 passages par heure après 42 jours d’arrêt. Disponibilité et charge 100 %, constantes, remise en route immédiate. Rattrapage 190,6 jours depuis le début du chantier. Volumes sur 365 jours 2,0148 et 2,28684 millions de passages.</desc><rect id="asml-fr-04-m-frame" x="0" y="0" width="420" height="1080" rx="0" fill="var(--color-ink)"/><text data-panel="asml-fr-04-m-frame" x="20" y="32" fill="var(--color-signal)" font-family="l0g ASML" font-size="20" font-weight="700" text-anchor="start">l0g / ASML</text><text data-panel="asml-fr-04-m-frame" x="400" y="32" fill="var(--color-muted)" font-family="l0g ASML" font-size="20" font-weight="400" text-anchor="end">04</text><text data-panel="asml-fr-04-m-frame" x="20" y="80" fill="var(--color-paper)" font-family="l0g ASML" font-size="29" font-weight="700" text-anchor="start">Moderniser coûte du</text><text data-panel="asml-fr-04-m-frame" x="20" y="116" fill="var(--color-paper)" font-family="l0g ASML" font-size="29" font-weight="700" text-anchor="start">temps</text><text data-panel="asml-fr-04-m-frame" x="20" y="155" fill="var(--color-muted)" font-family="l0g ASML" font-size="18" font-weight="400" text-anchor="start">Scénario de volume · exemple ASML de</text><text data-panel="asml-fr-04-m-frame" x="20" y="180" fill="var(--color-muted)" font-family="l0g ASML" font-size="18" font-weight="400" text-anchor="start">2021</text><text data-panel="asml-fr-04-m-frame" x="20" y="240" fill="var(--color-paper)" font-family="l0g ASML" font-size="22" font-weight="700" text-anchor="start">230 → 295 passages/h</text><text data-panel="asml-fr-04-m-frame" x="20" y="274" fill="var(--color-muted)" font-family="l0g ASML" fo