<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1080" role="img" aria-labelledby="asml-fr-02-m-title asml-fr-02-m-desc" style="width:100%;height:auto" class="l0g-asml-svg"><title id="asml-fr-02-m-title">Le revenu suit le contrat</title><desc id="asml-fr-02-m-desc">Maintenance de disponibilité reconnue au fil du temps, OnPulse lié aux impulsions, mises à niveau reconnues à la livraison ou à l’avancement selon le contrat. Aucune proportion de revenu représentée.</desc><rect id="asml-fr-02-m-frame" x="0" y="0" width="420" height="1080" rx="0" fill="var(--color-ink)"/><text data-panel="asml-fr-02-m-frame" x="20" y="32" fill="var(--color-signal)" font-family="l0g ASML" font-size="20" font-weight="700" text-anchor="start">l0g / ASML</text><text data-panel="asml-fr-02-m-frame" x="400" y="32" fill="var(--color-muted)" font-family="l0g ASML" font-size="20" font-weight="400" text-anchor="end">02</text><text data-panel="asml-fr-02-m-frame" x="20" y="80" fill="var(--color-paper)" font-family="l0g ASML" font-size="29" font-weight="700" text-anchor="start">Le revenu suit le</text><text data-panel="asml-fr-02-m-frame" x="20" y="116" fill="var(--color-paper)" font-family="l0g ASML" font-size="29" font-weight="700" text-anchor="start">contrat</text><text data-panel="asml-fr-02-m-frame" x="20" y="155" fill="var(--color-muted)" font-family="l0g ASML" font-size="18" font-weight="400" text-anchor="start">Calendriers contractuels · schéma</text><text data-panel="asml-fr-02-m-frame" x="20" y="180" fill="var(--color-muted)" font-family="l0g ASML" font-size="18" font-weight="400" text-anchor="start">qualitatif</text><rect id="asml-fr-02-m-card-8" x="20" y="220" width="380" height="210" rx="7" fill="var(--color-surface-2)"/><text data-panel="asml-fr-02-m-card-8" x="38" y="255" fill="var(--color-muted)" font-family="l0g ASML" font-size="25" font-weight="700" text-anchor="start">Maintenance</text><text data-panel="asml-fr-02-m-card-8" x="38" y="290" fill="var(--color-paper)" font-fami