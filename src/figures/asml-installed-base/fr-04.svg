<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="asml-fr-04-title asml-fr-04-desc" style="width:100%;height:auto" class="l0g-asml-svg"><title id="asml-fr-04-title">Moderniser coûte du temps</title><desc id="asml-fr-04-desc">Scénario historique NXT:1960 vers NXT:1980. Cadence 230 à 295 passages par heure après 42 jours d’arrêt. Disponibilité et charge 100 %, constantes, remise en route immédiate. Rattrapage 190,6 jours depuis le début du chantier. Volumes sur 365 jours 2,0148 et 2,28684 millions de passages.</desc><rect id="asml-fr-04-frame" x="0" y="0" width="1000" height="680" rx="0" fill="var(--color-ink)"/><text data-panel="asml-fr-04-frame" x="40" y="34" fill="var(--color-signal)" font-family="l0g ASML" font-size="24" font-weight="700" text-anchor="start">l0g / ASML</text><text data-panel="asml-fr-04-frame" x="960" y="34" fill="var(--color-muted)" font-family="l0g ASML" font-size="24" font-weight="400" text-anchor="end">04</text><text data-panel="asml-fr-04-frame" x="40" y="85" fill="var(--color-paper)" font-family="l0g ASML" font-size="34" font-weight="700" text-anchor="start">Moderniser coûte du temps</text><text data-panel="asml-fr-04-frame" x="40" y="134" fill="var(--color-muted)" font-family="l0g ASML" font-size="24" font-weight="400" text-anchor="start">Scénario de volume · exemple ASML de 2021</text><text data-panel="asml-fr-04-frame" x="40" y="185" fill="var(--color-paper)" font-family="l0g ASML" font-size="25" font-weight="700" text-anchor="start">Cadence : 230 → 295 passages/h</text><text data-panel="asml-fr-04-frame" x="40" y="219" fill="var(--color-muted)" font-family="l0g ASML" font-size="24" font-weight="400" text-anchor="start">Arrêt : 42 jours · volume en millions</text><rect id="asml-fr-04-offline" x="100" y="240" width="95.506849" height="250" rx="0" fill="var(--color-surface-2)"/><line x1="100" y1="260" x2="135" y2="260" stroke="var(--color-muted)" stroke-width="3"/><text data-panel="asml-fr-04-frame" 