<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1080" role="img" aria-labelledby="asml-fr-06-m-title asml-fr-06-m-desc" style="width:100%;height:auto" class="l0g-asml-svg"><title id="asml-fr-06-m-title">La licence suit la prestation</title><desc id="asml-fr-06-m-desc">Un équipement déjà installé peut nécessiter des pièces, logiciels et services. Les contrôles dépendent du produit, de la destination, de l’utilisateur et de la prestation. Lorsqu’une autorisation est requise, accord, délai ou refus influent sur la prestation et ses revenus.</desc><rect id="asml-fr-06-m-frame" x="0" y="0" width="420" height="1080" rx="0" fill="var(--color-ink)"/><text data-panel="asml-fr-06-m-frame" x="20" y="32" fill="var(--color-signal)" font-family="l0g ASML" font-size="20" font-weight="700" text-anchor="start">l0g / ASML</text><text data-panel="asml-fr-06-m-frame" x="400" y="32" fill="var(--color-muted)" font-family="l0g ASML" font-size="20" font-weight="400" text-anchor="end">06</text><text data-panel="asml-fr-06-m-frame" x="20" y="80" fill="var(--color-paper)" font-family="l0g ASML" font-size="29" font-weight="700" text-anchor="start">La licence suit la</text><text data-panel="asml-fr-06-m-frame" x="20" y="116" fill="var(--color-paper)" font-family="l0g ASML" font-size="29" font-weight="700" text-anchor="start">prestation</text><text data-panel="asml-fr-06-m-frame" x="20" y="155" fill="var(--color-muted)" font-family="l0g ASML" font-size="18" font-weight="400" text-anchor="start">Mécanisme réglementaire · cas par cas</text><rect id="asml-fr-06-m-card-7" x="20" y="210" width="380" height="118" rx="7" fill="var(--color-surface-2)"/><text data-panel="asml-fr-06-m-card-7" x="37" y="247" fill="var(--color-muted)" font-family="l0g ASML" font-size="24" font-weight="700" text-anchor="start">Machine installée</text><text data-panel="asml-fr-06-m-card-7" x="37" y="288" fill="var(--color-paper)" font-family="l0g ASML" font-size="20" font-weight="400" text-anchor="start">Chez le client</text><path data-connector="stage-0" d="M210 332 L210 346" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M206.047503 340.222651 L210 346 L213.952497 340.222651" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect id="asml-fr-06-m-card-12" x="20" y="350" width="380" height="118" rx="7" fill="var(--color-surface-2)"/><text data-panel="asml-fr-06-m-card-12" x="37" y="387" fill="var(--color-signal)" font-family="l0g ASML" font-size="24" font-weight="700" text-anchor="start">Prestation</text><text data-panel="asml-fr-06-m-card-12" x="37" y="428" fill="var(--color-paper)" font-family="l0g ASML" font-size="20" font-weight="400" text-anchor="start">Pièce, logiciel, service</text><path data-connector="stage-1" d="M210 472 L210 486" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M206.047503 480.222651 L210 486 L213.952497 480.222651" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect id="asml-fr-06-m-card-17" x="20" y="490" width="380" height="118" rx="7" fill="var(--color-surface-2)"/><text data-panel="asml-fr-06-m-card-17" x="37" y="527" fill="var(--color-amber)" font-family="l0g ASML" font-size="24" font-weight="700" text-anchor="start">Règles par cas</text><text data-panel="asml-fr-06-m-card-17" x="37" y="568" fill="var(--color-paper)" font-family="l0g ASML" font-size="20" font-weight="400" text-anchor="start">Produit, pays, utilisateur</text><text data-panel="asml-fr-06-m-frame" x="20" y="655" fill="var(--color-paper)" font-family="l0g ASML" font-size="21" font-weight="700" text-anchor="start">Si une autorisation est requise :</text><rect id="asml-fr-06-m-card-21" x="20" y="700" width="380" height="125" rx="7" fill="var(--color-surface-2)"/><text data-panel="asml-fr-06-m-card-21" x="38" y="738" fill="var(--color-signal)" font-family="l0g ASML" font-size="25" font-weight="700" text-anchor="start">Accord</text><text data-panel="asml-fr-06-m-card-21" x="38" y="779" fill="var(--color-paper)" font-family="l0g ASML" font-size="20" font-weight="400" text-anchor="start">Prestation possible selon ses</text><text data-panel="asml-fr-06-m-card-21" x="38" y="806" fill="var(--color-paper)" font-family="l0g ASML" font-size="20" font-weight="400" text-anchor="start">conditions.</text><rect id="asml-fr-06-m-card-25" x="20" y="855" width="380" height="125" rx="7" fill="var(--color-surface-2)"/><text data-panel="asml-fr-06-m-card-25" x="38" y="893" fill="var(--color-accent)" font-family="l0g ASML" font-size="25" font-weight="700" text-anchor="start">Délai / refus</text><text data-panel="asml-fr-06-m-card-25" x="38" y="934" fill="var(--color-paper)" font-family="l0g ASML" font-size="20" font-weight="400" text-anchor="start">Prestation et revenus</text><text data-panel="asml-fr-06-m-card-25" x="38" y="961" fill="var(--color-paper)" font-family="l0g ASML" font-size="20" font-weight="400" text-anchor="start">potentiellement décalés.</text><path data-connector="licence-review" d="M210 610 L210 627" fill="none" stroke="var(--color-amber)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M206.047503 621.222651 L210 627 L213.952497 621.222651" fill="none" stroke="var(--color-amber)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path data-connector="approved-route" d="M210 670 L210 694" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M206.047503 688.222651 L210 694 L213.952497 688.222651" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path data-connector="delayed-route" d="M405 600 L410 600 L410 845 L398 845" fill="none" stroke="var(--color-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M403.777349 841.047503 L398 845 L403.777349 848.952497" fill="none" stroke="var(--color-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="asml-fr-06-m-frame" x="20" y="1020" fill="var(--color-muted)" font-family="l0g ASML" font-size="18" font-weight="400" text-anchor="start">[10, 11] · règles applicables à chaque</text><text data-panel="asml-fr-06-m-frame" x="20" y="1045" fill="var(--color-muted)" font-family="l0g ASML" font-size="18" font-weight="400" text-anchor="start">intervention.</text></svg>