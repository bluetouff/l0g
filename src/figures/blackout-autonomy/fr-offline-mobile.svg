<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1180" style="width:100%;height:auto" class="l0g-blackout-svg" role="img" aria-labelledby="blackout-fr-offline-m-title blackout-fr-offline-m-desc"><title id="blackout-fr-offline-m-title">Payer hors ligne, traiter après reconnexion</title><desc id="blackout-fr-offline-m-desc">l0g  /  MÉCANISMES &amp; PREUVES FIG. 05 Les deux temps du paiement hors ligne Suède · fonctionnement décrit par la Riksbank · extension annoncée le 1er juillet 2026 CONDITIONS DE FONCTIONNEMENT Commerce ouvert, stock disponible, terminal alimenté, carte éligible et PIN connu. Pendant la panne de données Carte physique + PIN Le client insère la puce et saisit son code. L’échange se fait localement avec le terminal. Contrôles locaux Éligibilité et plafonds du dispositif sont vérifiés localement. Le terminal ignore le solde du compte à cet instant. Bien remis au client La vente peut avoir lieu. L’opération reste conservée dans le terminal pour son traitement ultérieur. Un risque encadré Pour les opérations éligibles, l’accord place le risque chez l’émetteur, dans les limites et conditions prévues. INFÉRENCE L’attente peut mobiliser de la trésorerie Un versement retardé au-delà du calendrier habituel peut créer un besoin de trésorerie, selon le contrat. Au retour de la connexion Transmission des opérations Fonds après traitement Terminal et commerce Transmet les opérations conservées. Reçoit le versement sur le compte commerçant. Acquéreur Reçoit et traite les opérations. Verse les fonds au commerçant. Banque émettrice Traite les opérations transmises. Débite le compte client et règle l’acquéreur. Trois paramètres à distinguer Architecture du mémo du 3 octobre 2025 Par achat Un plafond borne chaque transaction autorisée hors ligne. Cumul de la carte Un plafond distinct couvre plusieurs achats ; une autorisation en ligne le réinitialise. Conservation Le terminal doit pouvoir garder jusqu’à sept jours de transactions. L’alimentation du terminal et l’activité du commerce restent des conditions séparées. Sources : S07 · S08 · S22 | 28.10.2026</desc>
