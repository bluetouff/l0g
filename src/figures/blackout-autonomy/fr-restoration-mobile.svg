<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1100" style="width:100%;height:auto" class="l0g-blackout-svg" role="img" aria-labelledby="blackout-fr-restoration-m-title blackout-fr-restoration-m-desc"><title id="blackout-fr-restoration-m-title">Électricité et télécoms se rétablissent ensemble</title><desc id="blackout-fr-restoration-m-desc">l0g  /  MÉCANISMES &amp; PREUVES FIG. 03 Le rétablissement forme une boucle Électricité, télécommunications et interventions partagent leurs dépendances. Réseau électrique Alimentation et conduite du système Télécommunications Liaisons, échanges et coordination alimente contribuent au pilotage coordonnent Équipes sur le terrain Intervention sur les installations des deux réseaux réparent et rétablissent Accès et logistique Routes, ravitaillement, autorisations et sécurité rendent l’intervention possible LE POINT DE COORDINATION Choisir ensemble ce qui redémarre en premier Un site utile à plusieurs liaisons peut aider d’autres services à revenir. Sa priorité télécom doit être comprise par l’acteur qui rétablit son alimentation. Source : S05 · Arcep, mai 2025 · Schéma qualitatif l0g</desc>
