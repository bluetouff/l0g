<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1060" style="width:100%;height:auto" class="l0g-blackout-svg" role="img" aria-labelledby="blackout-en-purchase-m-title blackout-en-purchase-m-desc"><title id="blackout-en-purchase-m-title">A purchase needs two working chains</title><desc id="blackout-en-purchase-m-desc">l0g  /  MECHANISMS &amp; EVIDENCE FIG. 01 A purchase needs two chains to complete Following a purchase during an outage · synthesis of Spain’s experience PREPARE THE SALE Accessible shop Staff available, accessible premises and an open business. 1 Available goods Saleable stock; working refrigeration, pump or equipment where needed. 2 Price established A working till, scale or alternative procedure. 3 These steps build on one another. ACCEPT PAYMENT Online card Powered equipment, communications and payment processing. Offline card Powered terminal, eligible card and merchant, agreed risk rules. Cash Notes available, accepted payment and arrangements for change. These routes may substitute for each other, where conditions allow. AND THE CUSTOMER RECEIVES THE GOODS The sale and payment must come together. Availability reaches all the way to the user Core financial systems can keep running while a local dependency interrupts a purchase. Backup arrangements gain meaning when tested across the whole service. l0g synthesis · Sources: S03, S22</desc>
