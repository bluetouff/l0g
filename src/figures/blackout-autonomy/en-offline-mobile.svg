<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1180" style="width:100%;height:auto" class="l0g-blackout-svg" role="img" aria-labelledby="blackout-en-offline-m-title blackout-en-offline-m-desc"><title id="blackout-en-offline-m-title">Pay offline, process after reconnection</title><desc id="blackout-en-offline-m-desc">l0g  /  MECHANISMS &amp; EVIDENCE FIG. 05 Two stages of an offline card payment Sweden · mechanism described by the Riksbank · expansion announced on 1 July 2026 OPERATING CONDITIONS Open shop, available goods, powered terminal, eligible card and known PIN. During the data outage Physical card + PIN The customer inserts the chip and enters their PIN. The card communicates locally with the terminal. Local checks Eligibility settings and payment limits are checked locally. The account balance is unknown to the terminal at this point. Goods handed over The sale can take place. The transaction stays in the terminal for later processing. Risk within a framework For qualifying transactions, the agreement places risk with the issuer, subject to the specified limits and conditions. INFERENCE The wait may require funding Payment delayed beyond the usual schedule may create a funding need, depending on the contract. When connectivity returns Transaction submission Funds after processing Terminal and merchant Sends the stored transactions. Receives funds in the merchant account. Acquirer Receives and processes transactions. Pays the merchant. Card issuer Processes the submitted transactions. Debits the customer account and pays the acquirer. Three distinct parameters Design in the 3 October 2025 memorandum Per purchase A limit bounds each offline-authorised transaction. Card total A separate cap covers multiple purchases; online authorisation resets it. Storage The terminal must be able to retain up to seven days of transactions. Power for the terminal and an operational shop remain separate requirements. Sources: S07 · S08 · S22 | 28 Oct 2026</desc>
