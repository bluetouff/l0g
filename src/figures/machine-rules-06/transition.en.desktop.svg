<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="mr06-transition-en-d-t mr06-transition-en-d-d" style="width:100%;height:auto" class="l0g-machines06-svg"><title id="mr06-transition-en-d-t">CRA transition for installed products</title><desc id="mr06-transition-en-d-d">Reporting already covers older in-scope products; other requirements follow the December 2027 transition.</desc><rect id="mr06-transition-en-d-frame" x="0" y="0" width="1000" height="680" rx="0" fill="var(--color-ink)" stroke="none" stroke-width="0"/><text data-panel="mr06-transition-en-d-frame" x="28" y="45" font-family="l0g Machine Rules" font-size="24" font-weight="400" fill="var(--color-signal)" text-anchor="start">l0g / MACHINES</text><text data-panel="mr06-transition-en-d-frame" x="972" y="45" font-family="l0g Machine Rules" font-size="24" font-weight="400" fill="var(--color-muted)" text-anchor="end">03</text><text data-panel="mr06-transition-en-d-frame" x="28" y="100" font-family="l0g Machine Rules" font-size="36" font-weight="700" fill="var(--color-paper)" text-anchor="start">CRA transition for installed products</text><text data-panel="mr06-transition-en-d-frame" x="28" y="140" font-family="l0g Machine Rules" font-size="24" font-weight="400" fill="var(--color-muted)" text-anchor="start">EU law · status on 3 November 2026</text><rect id="mr06-transition-en-d-panel-reporting" x="28" y="186" width="944" height="120" rx="7" fill="var(--color-ink)" stroke="var(--color-signal)" stroke-width="1" data-date="2026-09-11"/><text data-panel="mr06-transition-en-d-panel-reporting" x="44" y="222" font-family="l0g Machine Rules" font-size="27" font-weight="400" fill="var(--color-signal)" text-anchor="start">From 11 September 2026</text><text data-panel="mr06-transition-en-d-panel-reporting" x="44" y="260" font-family="l0g Machine Rules" font-size="24" font-weight="400" fill="var(--color-paper)" text-anchor="start">Article 14 · reporting</text><text data-panel="mr06-transition-en-d-panel-reporting" x="44" y="294" font-family="l0g Machine Rules" font-size="24" font-weight="400" fill="var(--color-muted)" text-anchor="start">Older products included; article 14 conditions apply.</text><rect id="mr06-transition-en-d-panel-transition-0" x="28" y="350" width="448" height="160" rx="7" fill="var(--color-surface-2)" stroke="none" stroke-width="0" data-branch="pre-2027" data-date="2027-12-11"/><text data-panel="mr06-transition-en-d-panel-transition-0" x="44" y="385" font-family="l0g Machine Rules" font-size="24" font-weight="400" fill="var(--color-paper)" text-anchor="start">Unit first placed on the market</text><text data-panel="mr06-transition-en-d-panel-transition-0" x="44" y="419" font-family="l0g Machine Rules" font-size="26" font-weight="400" fill="var(--color-amber)" text-anchor="start">Before 11 December 2027</text><text data-panel="mr06-transition-en-d-panel-transition-0" x="44" y="463" font-family="l0g Machine Rules" font-size="24" font-weight="400" fill="var(--color-muted)" text-anchor="start">Other requirements: assess</text><text data-panel="mr06-transition-en-d-panel-transition-0" x="44" y="494" font-family="l0g Machine Rules" font-size="24" font-weight="400" fill="var(--color-muted)" text-anchor="start">substantial modification.</text><rect id="mr06-transition-en-d-panel-transition-1" x="524" y="350" width="448" height="160" rx="7" fill="var(--color-surface-2)" stroke="none" stroke-width="0" data-branch="from-2027" data-date="2027-12-11"/><text data-panel="mr06-transition-en-d-panel-transition-1" x="540" y="385" font-family="l0g Machine Rules" font-size="24" font-weight="400" fill="var(--color-paper)" text-anchor="start">Unit first placed on the market</text><text data-panel="mr06-transition-en-d-panel-transition-1" x="540" y="419" font-family="l0g Machine Rules" font-size="26" font-weight="400" fill="var(--color-signal)" text-anchor="start">From 11 December 2027</text><text data-panel="mr06-transition-en-d-panel-transition-1" x="540" y="463" font-family="l0g Machine Rules" font-size="24" font-weight="400" fill="var(--color-muted)" text-anchor="start">General regime for in-scope units.</text><rect id="mr06-transition-en-d-panel-change" x="28" y="540" width="944" height="72" rx="7" fill="var(--color-ink)" stroke="var(--color-amber)" stroke-width="1" data-branch="substantial-change" data-date="2027-12-11"/><text data-panel="mr06-transition-en-d-panel-change" x="44" y="570" font-family="l0g Machine Rules" font-size="25" font-weight="400" fill="var(--color-paper)" text-anchor="start">Substantial modification from 11 December 2027?</text><text data-panel="mr06-transition-en-d-panel-change" x="44" y="603" font-family="l0g Machine Rules" font-size="24" font-weight="400" fill="var(--color-muted)" text-anchor="start">If qualified: CRA requirements apply.</text><path data-connector="older-product-change" d="M252 510 L252 540" fill="none" stroke="var(--color-amber)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path data-connector="older-product-change-head" d="M255.6 532 L252 540 L248.4 532" fill="none" stroke="var(--color-amber)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="mr06-transition-en-d-frame" x="28" y="640" font-family="l0g Machine Rules" font-size="24" font-weight="400" fill="var(--color-muted)" text-anchor="start">France · NIS2: transposition ongoing according to ANSSI.</text><text data-panel="mr06-transition-en-d-frame" x="28" y="670" font-family="l0g Machine Rules" font-size="24" font-weight="400" fill="var(--color-muted)" text-anchor="start">[02, 03, 04, 05]</text></svg>