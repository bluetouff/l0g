nsition-fr-d-panel-transition-1" x="540" y="463" font-family="l0g Machine Rules" font-size="24" font-weight="400" fill="var(--color-muted)" text-anchor="start">Régime général des unités</text><text data-panel="mr06-transition-fr-d-panel-transition-1" x="540" y="494" font-family="l0g Machine Rules" font-size="24" font-weight="400" fill="var(--color-muted)" text-anchor="start">concernées.</text><rect id="mr06-transition-fr-d-panel-change" x="28" y="540" width="944" height="72" rx="7" fill="var(--color-ink)" stroke="var(--color-amber)" stroke-width="1" data-branch="substantial-change" data-date="2027-12-11"/><text data-panel="mr06-transition-fr-d-panel-change" x="44" y="570" font-family="l0g Machine Rules" font-size="25" font-weight="400" fill="var(--color-paper)" text-anchor="start">Modification substantielle dès le 11.12.2027 ?</text><text data-panel="mr06-transition-fr-d-panel-change" x="44" y="603" font-family="l0g Machine Rules" font-size="24" font-weight="400" fill="var(--color-muted)" text-anchor="start">Si qualifiée : exigences du CRA.</text><path data-connector="older-product-change" d="M252 510 L252 540" fill="none" stroke="var(--color-amber)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path data-connector="older-product-change-head" d="M255.6 532 L252 540 L248.4 532" fill="none" stroke="var(--color-amber)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="mr06-transition-fr-d-frame" x="28" y="640" font-family="l0g Machine Rules" font-size="24" font-weight="400" fill="var(--color-muted)" text-anchor="start">France · NIS2 : transposition en cours selon l’ANSSI.</text><text data-panel="mr06-transition-fr-d-frame" x="28" y="670" font-family="l0g Machine Rules" font-size="24" font-weight="400" fill="var(--color-muted)" text-anchor="start">[02, 03, 04, 05]</text></svg>