l-5">RESTE ARITHMÉTIQUE</text><text x="985.0" y="424.0" font-family="l0g VAC GM" font-size="38" font-weight="700" fill="var(--color-accent)" text-anchor="start" data-panel="vac-fr-cash-panel-5">–51,443 M€</text><text x="985.0" y="470.0" font-family="l0g VAC GM" font-size="24" font-weight="400" fill="var(--color-paper)" text-anchor="start" data-panel="vac-fr-cash-panel-5">30,103 – 81,546</text><text x="80.0" y="582.0" font-family="l0g VAC GM" font-size="24" font-weight="400" fill="var(--color-paper)" text-anchor="start" data-panel="vac-fr-cash-panel-2">Un montant ponctuel de 81,546 M€ dépasse le cash-flow net d’exploitation publié.</text><text x="80.0" y="629.0" font-family="l0g VAC GM" font-size="24" font-weight="400" fill="var(--color-muted)" text-anchor="start" data-panel="vac-fr-cash-panel-2">Le solde est une soustraction pédagogique, pas un CFO retraité certifié.</text><text x="60.0" y="730" font-family="l0g VAC GM" font-size="24" font-weight="400" fill="var(--color-muted)" text-anchor="start" data-panel="vac-fr-cash-panel-0">Autre lecture : 43,7 M€ de cash et 25,8 M€ de lignes non tirées au 30 juin.</text><path d="M40 755 L1370 755" fill="none" stroke="var(--color-line-strong)" stroke-width="1.4" stroke-linecap="round" /><text x="42.0" y="798" font-family="l0g VAC GM" font-size="24" font-weight="700" fill="var(--color-signal)" text-anchor="start" data-panel="vac-fr-cash-panel-0">l0g.fr</text><text x="1372" y="798" font-family="l0g VAC GM" font-size="24" font-weight="400" fill="var(--color-muted)" text-anchor="end" data-panel="vac-fr-cash-panel-0">S01/02</text></svg>