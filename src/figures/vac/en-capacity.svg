<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1410 830" role="img" aria-labelledby="vac-capacity-en-lg-t vac-capacity-en-lg-d" style="width:100%;height:auto" class="l0g-vac-gm-svg"><title id="vac-capacity-en-lg-t">The tonnes expected from GM</title><desc id="vac-capacity-en-lg-d">REUTERS 22 OCT 2026 · SEC 8-K 13 OCT 2026. l0g illustration, published 24 October 2026.</desc><rect x="0.0" y="0.0" width="1410.0" height="830.0" rx="0" fill="var(--color-ink)" id="vac-en-capacity-panel-0" /><rect x="40.0" y="32.0" width="116.0" height="43.0" rx="20" fill="var(--color-surface-2)" id="vac-en-capacity-panel-1" /><text x="98.0" y="61.0" font-family="l0g VAC GM" font-size="24" font-weight="700" fill="var(--color-signal)" text-anchor="middle" data-panel="vac-en-capacity-panel-1">FIG 02</text><text x="178.0" y="61.0" font-family="l0g VAC GM" font-size="24" font-weight="700" fill="var(--color-muted)" text-anchor="start" data-panel="vac-en-capacity-panel-0">L0G / CRITICAL MATERIALS</text><path d="M40.0 99.0 L1370.0 99.0" fill="none" stroke="var(--color-line-strong)" stroke-width="1.2" stroke-linecap="round" /><text x="42.0" y="165.0" font-family="l0g VAC GM" font-size="48" font-weight="700" fill="var(--color-paper)" text-anchor="start" data-panel="vac-en-capacity-panel-0">The tonnes expected from GM</text><text x="42.0" y="202.0" font-family="l0g VAC GM" font-size="24" font-weight="400" fill="var(--color-muted)" text-anchor="start" data-panel="vac-en-capacity-panel-0">INVESTIGATION · 24 OCTOBER 2026</text><rect x="45.0" y="256.0" width="1320.0" height="410.0" rx="18" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1.1" id="vac-en-capacity-panel-2" /><text x="73.0" y="314.0" font-family="l0g VAC GM" font-size="24" font-weight="700" fill="var(--color-muted)" text-anchor="start" data-panel="vac-en-capacity-panel-2">DISCLOSED NAMEPLATE CAPACITY</text><text x="73.0" y="389.0" font-family="l0g VAC GM" font-size="63" font-weight="700" fill="var(--color-p