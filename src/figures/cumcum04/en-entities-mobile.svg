<text data-panel="cumcum04-en-entities-m-card-entity-1" x="40" y="753" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Inspections cited: no adjustments to</text>
<text data-panel="cumcum04-en-entities-m-card-entity-1" x="40" y="776" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">the market-making concerned.</text>
<text data-panel="cumcum04-en-entities-m-card-entity-1" x="40" y="850" fill="var(--color-signal)" font-family="l0g CumCum" font-size="17" font-weight="700" text-anchor="start">05.01.2026</text>
<text data-panel="cumcum04-en-entities-m-card-entity-1" x="40" y="884" fill="var(--color-signal)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">Investigation closed</text>
<text data-panel="cumcum04-en-entities-m-card-entity-1" x="40" y="922" fill="var(--color-paper)" font-family="l0g CumCum" font-size="23" font-weight="700" text-anchor="start">Within this case’s scope</text>
<text data-panel="cumcum04-en-entities-m-card-entity-1" x="40" y="958" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Closure concerns this investigation.</text>
<text data-panel="cumcum04-en-entities-m-frame" x="24" y="1050" fill="var(--color-signal)" font-family="l0g CumCum" font-size="17" font-weight="700" text-anchor="start">S01 / Paris / 08.01.2026 / pp.6–9</text>
<text data-panel="cumcum04-en-entities-m-frame" x="24" y="1076" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Case paths / no financial scale.</text>
