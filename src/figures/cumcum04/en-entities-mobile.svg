<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cumcum04-en-entities-m-title cumcum04-en-entities-m-desc" viewBox="0 0 420 1120" style="width:100%;height:auto" class="l0g-cumcum04-svg">
<title id="cumcum04-en-entities-m-title">HSBC: two entities, two outcomes</title><desc id="cumcum04-en-entities-m-desc">Separate transactions and legal scopes</desc>
<rect id="cumcum04-en-entities-m-frame" x="0" y="0" width="420" height="1120" rx="8" fill="var(--color-ink)"/>
<text data-panel="cumcum04-en-entities-m-frame" x="24" y="30" fill="var(--color-signal)" font-family="l0g CumCum" font-size="17" font-weight="700" text-anchor="start">l0g / CUM-CUM 04 / 01</text>
<text data-panel="cumcum04-en-entities-m-frame" x="24" y="72" fill="var(--color-paper)" font-family="l0g CumCum" font-size="26" font-weight="700" text-anchor="start">HSBC: two entities, two</text>
<text data-panel="cumcum04-en-entities-m-frame" x="24" y="105" fill="var(--color-paper)" font-family="l0g CumCum" font-size="26" font-weight="700" text-anchor="start">outcomes</text>
<text data-panel="cumcum04-en-entities-m-frame" x="24" y="135" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Separate transactions and legal scopes</text>
<rect id="cumcum04-en-entities-m-card-entity-0" x="24" y="154" width="372" height="416" rx="8" fill="var(--color-surface)" stroke="var(--color-amber)" stroke-width="1"/>
<text data-panel="cumcum04-en-entities-m-card-entity-0" x="40" y="190" fill="var(--color-paper)" font-family="l0g CumCum" font-size="23" font-weight="700" text-anchor="start">HSBC Bank plc</text>
<text data-panel="cumcum04-en-entities-m-card-entity-0" x="40" y="221" fill="var(--color-amber)" font-family="l0g CumCum" font-size="17" font-weight="700" text-anchor="start">2014–2019</text>
<text data-panel="cumcum04-en-entities-m-card-entity-0" x="40" y="256" fill="var(--color-paper)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">London decisions; transactions booked</text>
<text data-panel="cumcum04-en-entities-m-card-entity-0" x="40" y="279" fill="var(--color-paper)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">in the Paris branch.</text>
<text data-panel="cumcum04-en-entities-m-card-entity-0" x="40" y="319" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Insufficient Paris autonomy, according</text>
<text data-panel="cumcum04-en-entities-m-card-entity-0" x="40" y="342" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">to investigators.</text>
<text data-panel="cumcum04-en-entities-m-card-entity-0" x="40" y="416" fill="var(--color-amber)" font-family="l0g CumCum" font-size="17" font-weight="700" text-anchor="start">08.01.2026</text>
<text data-panel="cumcum04-en-entities-m-card-entity-0" x="40" y="450" fill="var(--color-amber)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">Agreement approved</text>
<text data-panel="cumcum04-en-entities-m-card-entity-0" x="40" y="488" fill="var(--color-paper)" font-family="l0g CumCum" font-size="23" font-weight="700" text-anchor="start">€267,531,000</text>
<text data-panel="cumcum04-en-entities-m-card-entity-0" x="40" y="524" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Proposed offence: aggravated tax fraud.</text>
<rect id="cumcum04-en-entities-m-card-entity-1" x="24" y="588" width="372" height="416" rx="8" fill="var(--color-surface)" stroke="var(--color-signal)" stroke-width="1"/>
<text data-panel="cumcum04-en-entities-m-card-entity-1" x="40" y="624" fill="var(--color-paper)" font-family="l0g CumCum" font-size="23" font-weight="700" text-anchor="start">HSBC Continental Europe</text>
<text data-panel="cumcum04-en-entities-m-card-entity-1" x="40" y="655" fill="var(--color-signal)" font-family="l0g CumCum" font-size="17" font-weight="700" text-anchor="start">ACTIVITIES TAKEN OVER</text>
<text data-panel="cumcum04-en-entities-m-card-entity-1" x="40" y="690" fill="var(--color-paper)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Transactions in its own books, without</text>
