<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cumcum04-fr-procedure-m-title cumcum04-fr-procedure-m-desc" viewBox="0 0 420 1100" style="width:100%;height:auto" class="l0g-cumcum04-svg">
<title id="cumcum04-fr-procedure-m-title">La CJIP règle un périmètre précis</title><desc id="cumcum04-fr-procedure-m-desc">France / une convention, plusieurs étapes</desc>
<rect id="cumcum04-fr-procedure-m-frame" x="0" y="0" width="420" height="1100" rx="8" fill="var(--color-ink)"/>
<text data-panel="cumcum04-fr-procedure-m-frame" x="24" y="30" fill="var(--color-signal)" font-family="l0g CumCum" font-size="17" font-weight="700" text-anchor="start">l0g / CUM-CUM 04 / 02</text>
<text data-panel="cumcum04-fr-procedure-m-frame" x="24" y="72" fill="var(--color-paper)" font-family="l0g CumCum" font-size="26" font-weight="700" text-anchor="start">La CJIP règle un</text>
<text data-panel="cumcum04-fr-procedure-m-frame" x="24" y="105" fill="var(--color-paper)" font-family="l0g CumCum" font-size="26" font-weight="700" text-anchor="start">périmètre précis</text>
<text data-panel="cumcum04-fr-procedure-m-frame" x="24" y="135" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">France / une convention, plusieurs étapes</text>
<rect id="cumcum04-fr-procedure-m-card-step-0" x="24" y="154" width="372" height="136" rx="8" fill="var(--color-surface)"/>
<text data-panel="cumcum04-fr-procedure-m-card-step-0" x="40" y="185" fill="var(--color-signal)" font-family="l0g CumCum" font-size="18" font-weight="700" text-anchor="start">01 / ACCORD</text>
<text data-panel="cumcum04-fr-procedure-m-card-step-0" x="40" y="220" fill="var(--color-paper)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Le parquet et la personne morale</text>
<text data-panel="cumcum04-fr-procedure-m-card-step-0" x="40" y="243" fill="var(--color-paper)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">signent la convention.</text>
<path d="M 210 293 L 210 305" fill="none" stroke="var(--color-signal)" stroke-width="2"/>
<path d="M 205 298 L 210 305 L 215 298" fill="none" stroke="var(--color-signal)" stroke-width="2"/>
<rect id="cumcum04-fr-procedure-m-card-step-1" x="24" y="308" width="372" height="136" rx="8" fill="var(--color-surface)"/>
<text data-panel="cumcum04-fr-procedure-m-card-step-1" x="40" y="339" fill="var(--color-signal)" font-family="l0g CumCum" font-size="18" font-weight="700" text-anchor="start">02 / VALIDATION</text>
<text data-panel="cumcum04-fr-procedure-m-card-step-1" x="40" y="374" fill="var(--color-paper)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Audience publique ; contrôle de</text>
<text data-panel="cumcum04-fr-procedure-m-card-step-1" x="40" y="397" fill="var(--color-paper)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">régularité et de proportionnalité.</text>
<path d="M 210 447 L 210 459" fill="none" stroke="var(--color-signal)" stroke-width="2"/>
<path d="M 205 452 L 210 459 L 215 452" fill="none" stroke="var(--color-signal)" stroke-width="2"/>
<rect id="cumcum04-fr-procedure-m-card-step-2" x="24" y="462" width="372" height="136" rx="8" fill="var(--color-surface)"/>
<text data-panel="cumcum04-fr-procedure-m-card-step-2" x="40" y="493" fill="var(--color-amber)" font-family="l0g CumCum" font-size="18" font-weight="700" text-anchor="start">03 / RÉTRACTATION</text>
<text data-panel="cumcum04-fr-procedure-m-card-step-2" x="40" y="528" fill="var(--color-paper)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Dix jours pour se rétracter ; cette voie</text>
<text data-panel="cumcum04-fr-procedure-m-card-step-2" x="40" y="551" fill="var(--color-paper)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">prend alors fin.</text>
<path d="M 210 601 L 210 613" fill="none" stroke="var(--color-signal)" stroke-width="2"/>
<path d="M 205 606 L 210 613 L 215 606" fill="none" stroke="var(--color-signal)" stroke-width="2"/>
<rect id="cumcum04-fr-procedure-m-card-step-3" x="24" y="616" width="372" height="136" rx="8" fill="var(--color-surface)"/>
<text data-panel="cumcum04-fr-procedure-m-card-step-3" x="40" y="647" fill="var(--color-signal)" font-family="l0g CumCum" font-size="18" font-weight="700" text-anchor="start">04 / EXÉCUTION</text>
<text data-panel="cumcum04-fr-procedure-m-card-step-3" x="40" y="682" fill="var(--color-paper)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Obligations remplies : extinction de</text>
<text data-panel="cumcum04-fr-procedure-m-card-step-3" x="40" y="705" fill="var(--color-paper)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">l’action publique dans le périmètre</text>
<text data-panel="cumcum04-fr-procedure-m-card-step-3" x="40" y="728" fill="var(--color-paper)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">convenu.</text>
<rect id="cumcum04-fr-procedure-m-card-individual" x="24" y="790" width="372" height="204" rx="8" fill="var(--color-surface)" stroke="var(--color-amber)" stroke-width="1"/>
<text data-panel="cumcum04-fr-procedure-m-card-individual" x="40" y="822" fill="var(--color-amber)" font-family="l0g CumCum" font-size="21" font-weight="700" text-anchor="start">Personnes physiques</text>
<text data-panel="cumcum04-fr-procedure-m-card-individual" x="40" y="856" fill="var(--color-paper)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Leur responsabilité personnelle reste</text>
<text data-panel="cumcum04-fr-procedure-m-card-individual" x="40" y="879" fill="var(--color-paper)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">distincte du règlement de la société.</text>
<text data-panel="cumcum04-fr-procedure-m-card-individual" x="40" y="914" fill="var(--color-amber)" font-family="l0g CumCum" font-size="17" font-weight="700" text-anchor="start">Validation : aucun jugement de</text>
<text data-panel="cumcum04-fr-procedure-m-card-individual" x="40" y="937" fill="var(--color-amber)" font-family="l0g CumCum" font-size="17" font-weight="700" text-anchor="start">culpabilité.</text>
<text data-panel="cumcum04-fr-procedure-m-frame" x="24" y="1040" fill="var(--color-signal)" font-family="l0g CumCum" font-size="17" font-weight="700" text-anchor="start">S01 / S04 / S06</text>
<text data-panel="cumcum04-fr-procedure-m-frame" x="24" y="1066" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Schéma / faits couverts par la convention.</text>
</svg>
