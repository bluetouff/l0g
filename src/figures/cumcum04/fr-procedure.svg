<text data-panel="cumcum04-fr-procedure-d-card-step-1" x="40" y="302" fill="var(--color-signal)" font-family="l0g CumCum" font-size="23" font-weight="700" text-anchor="start">02 / VALIDATION</text>
<text data-panel="cumcum04-fr-procedure-d-card-step-1" x="40" y="337" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Audience publique ; contrôle de régularité et de</text>
