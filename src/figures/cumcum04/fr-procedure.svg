<text data-panel="cumcum04-fr-procedure-d-frame" x="24" y="30" fill="var(--color-signal)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">l0g / CUM-CUM 04 / 02</text>
<text data-panel="cumcum04-fr-procedure-d-frame" x="24" y="80" fill="var(--color-paper)" font-family="l0g CumCum" font-size="30" font-weight="700" text-anchor="start">La CJIP règle un périmètre précis</text>
<text data-panel="cumcum04-fr-procedure-d-frame" x="24" y="110" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">France / une convention, plusieurs étapes</text>
<rect id="cumcum04-fr-procedure-d-card-step-0" x="24" y="154" width="596" height="105" rx="8" fill="var(--color-surface)"/>
<text data-panel="cumcum04-fr-procedure-d-card-step-0" x="40" y="185" fill="var(--color-signal)" font-family="l0g CumCum" font-size="23" font-weight="700" text-anchor="start">01 / ACCORD</text>
<text data-panel="cumcum04-fr-procedure-d-card-step-0" x="40" y="220" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Le parquet et la personne morale signent la</text>
<text data-panel="cumcum04-fr-procedure-d-card-step-0" x="40" y="248" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">convention.</text>
<path d="M 322 262 L 322 268" fill="none" stroke="var(--color-signal)" stroke-width="2"/>
<path d="M 317 261 L 322 268 L 327 261" fill="none" stroke="var(--color-signal)" stroke-width="2"/>
