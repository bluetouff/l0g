<text data-panel="cumcum04-fr-procedure-d-card-individual" x="664" y="186" fill="var(--color-amber)" font-family="l0g CumCum" font-size="25" font-weight="700" text-anchor="start">Personnes</text>
<text data-panel="cumcum04-fr-procedure-d-card-individual" x="664" y="219.75" fill="var(--color-amber)" font-family="l0g CumCum" font-size="25" font-weight="700" text-anchor="start">physiques</text>
<text data-panel="cumcum04-fr-procedure-d-card-individual" x="664" y="253.75" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Leur responsabilité</text>
<text data-panel="cumcum04-fr-procedure-d-card-individual" x="664" y="283.75" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">personnelle reste distincte</text>
<text data-panel="cumcum04-fr-procedure-d-card-individual" x="664" y="313.75" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">du règlement de la</text>
<text data-panel="cumcum04-fr-procedure-d-card-individual" x="664" y="343.75" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">société.</text>
<text data-panel="cumcum04-fr-procedure-d-card-individual" x="664" y="386.75" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">La CJIP CACIB réserve la</text>
<text data-panel="cumcum04-fr-procedure-d-card-individual" x="664" y="416.75" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">situation pénale des tiers.</text>
<text data-panel="cumcum04-fr-procedure-d-card-individual" x="664" y="459.75" fill="var(--color-amber)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">La validation ne vaut</text>
<text data-panel="cumcum04-fr-procedure-d-card-individual" x="664" y="489.75" fill="var(--color-amber)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">pas déclaration de</text>
<text data-panel="cumcum04-fr-procedure-d-card-individual" x="664" y="519.75" fill="var(--color-amber)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">culpabilité.</text>
<text data-panel="cumcum04-fr-procedure-d-frame" x="24" y="640" fill="var(--color-signal)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">S01 / S04 / S06</text>
<text data-panel="cumcum04-fr-procedure-d-frame" x="24" y="672" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Schéma / faits couverts par la convention.</text>
