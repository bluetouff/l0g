<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cumcum04-fr-procedure-d-title cumcum04-fr-procedure-d-desc" viewBox="0 0 1000 700" style="width:100%;height:auto" class="l0g-cumcum04-svg">
<title id="cumcum04-fr-procedure-d-title">La CJIP règle un périmètre précis</title><desc id="cumcum04-fr-procedure-d-desc">France / une convention, plusieurs étapes</desc>
