<text data-panel="cumcum04-fr-procedure-d-card-step-2" x="40" y="419" fill="var(--color-amber)" font-family="l0g CumCum" font-size="23" font-weight="700" text-anchor="start">03 / RÉTRACTATION</text>
<text data-panel="cumcum04-fr-procedure-d-card-step-2" x="40" y="454" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Dix jours pour se rétracter ; cette voie prend alors</text>
<text data-panel="cumcum04-fr-procedure-d-card-step-2" x="40" y="482" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">fin.</text>
