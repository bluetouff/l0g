<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cumcum04-en-procedure-d-title cumcum04-en-procedure-d-desc" viewBox="0 0 1000 700" style="width:100%;height:auto" class="l0g-cumcum04-svg">
<title id="cumcum04-en-procedure-d-title">A settlement has a defined scope</title><desc id="cumcum04-en-procedure-d-desc">France / one agreement, several stages</desc>
<rect id="cumcum04-en-procedure-d-frame" x="0" y="0" width="1000" height="700" rx="8" fill="var(--color-ink)"/>
<text data-panel="cumcum04-en-procedure-d-frame" x="24" y="30" fill="var(--color-signal)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">l0g / CUM-CUM 04 / 02</text>
<text data-panel="cumcum04-en-procedure-d-frame" x="24" y="80" fill="var(--color-paper)" font-family="l0g CumCum" font-size="30" font-weight="700" text-anchor="start">A settlement has a defined scope</text>
<text data-panel="cumcum04-en-procedure-d-frame" x="24" y="110" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">France / one agreement, several stages</text>
<rect id="cumcum04-en-procedure-d-card-step-0" x="24" y="154" width="596" height="105" rx="8" fill="var(--color-surface)"/>
<text data-panel="cumcum04-en-procedure-d-card-step-0" x="40" y="185" fill="var(--color-signal)" font-family="l0g CumCum" font-size="23" font-weight="700" text-anchor="start">01 / AGREEMENT</text>
<text data-panel="cumcum04-en-procedure-d-card-step-0" x="40" y="220" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Prosecutor and legal entity sign the agreement.</text>
<path d="M 322 262 L 322 268" fill="none" stroke="var(--color-signal)" stroke-width="2"/>
<path d="M 317 261 L 322 268 L 327 261" fill="none" stroke="var(--color-signal)" stroke-width="2"/>
<rect id="cumcum04-en-procedure-d-card-step-1" x="24" y="271" width="596" height="105" rx="8" fill="var(--color-surface)"/>
<text data-panel="cumcum04-en-procedure-d-card-step-1" x="40" y="302" fill="var(--color-signal)" font-family="l0g CumCum" font-size="23" font-weight="700" text-anchor="start">02 / APPROVAL</text>
<text data-panel="cumcum04-en-procedure-d-card-step-1" x="40" y="337" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Public hearing; regularity and proportionality</text>
<text data-panel="cumcum04-en-procedure-d-card-step-1" x="40" y="365" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">reviewed.</text>
<path d="M 322 379 L 322 385" fill="none" stroke="var(--color-signal)" stroke-width="2"/>
<path d="M 317 378 L 322 385 L 327 378" fill="none" stroke="var(--color-signal)" stroke-width="2"/>
<rect id="cumcum04-en-procedure-d-card-step-2" x="24" y="388" width="596" height="105" rx="8" fill="var(--color-surface)"/>
<text data-panel="cumcum04-en-procedure-d-card-step-2" x="40" y="419" fill="var(--color-amber)" font-family="l0g CumCum" font-size="23" font-weight="700" text-anchor="start">03 / WITHDRAWAL</text>
<text data-panel="cumcum04-en-procedure-d-card-step-2" x="40" y="454" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Ten days to withdraw, ending this settlement</text>
<text data-panel="cumcum04-en-procedure-d-card-step-2" x="40" y="482" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">route.</text>
<path d="M 322 496 L 322 502" fill="none" stroke="var(--color-signal)" stroke-width="2"/>
<path d="M 317 495 L 322 502 L 327 495" fill="none" stroke="var(--color-signal)" stroke-width="2"/>
<rect id="cumcum04-en-procedure-d-card-step-3" x="24" y="505" width="596" height="105" rx="8" fill="var(--color-surface)"/>
<text data-panel="cumcum04-en-procedure-d-card-step-3" x="40" y="536" fill="var(--color-signal)" font-family="l0g CumCum" font-size="23" font-weight="700" text-anchor="start">04 / COMPLIANCE</text>
<text data-panel="cumcum04-en-procedure-d-card-step-3" x="40" y="571" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Obligations fulfilled: public prosecution ends within</text>
<text data-panel="cumcum04-en-procedure-d-card-step-3" x="40" y="599" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">the agreed scope.</text>
<rect id="cumcum04-en-procedure-d-card-individual" x="648" y="154" width="328" height="425" rx="8" fill="var(--color-surface)" stroke="var(--color-amber)" stroke-width="1"/>
<text data-panel="cumcum04-en-procedure-d-card-individual" x="664" y="186" fill="var(--color-amber)" font-family="l0g CumCum" font-size="25" font-weight="700" text-anchor="start">Individuals</text>
<text data-panel="cumcum04-en-procedure-d-card-individual" x="664" y="220" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Personal liability remains</text>
<text data-panel="cumcum04-en-procedure-d-card-individual" x="664" y="250" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">separate from the</text>
<text data-panel="cumcum04-en-procedure-d-card-individual" x="664" y="280" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">company’s settlement.</text>
<text data-panel="cumcum04-en-procedure-d-card-individual" x="664" y="323" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">CACIB’s agreement</text>
<text data-panel="cumcum04-en-procedure-d-card-individual" x="664" y="353" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">reserves the criminal</text>
<text data-panel="cumcum04-en-procedure-d-card-individual" x="664" y="383" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">position of third parties.</text>
<text data-panel="cumcum04-en-procedure-d-card-individual" x="664" y="426" fill="var(--color-amber)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">Approval is not a</text>
<text data-panel="cumcum04-en-procedure-d-card-individual" x="664" y="456" fill="var(--color-amber)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">declaration of guilt.</text>
<text data-panel="cumcum04-en-procedure-d-frame" x="24" y="640" fill="var(--color-signal)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">S01 / S04 / S06</text>
<text data-panel="cumcum04-en-procedure-d-frame" x="24" y="672" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Process diagram / agreed facts.</text>
</svg>
