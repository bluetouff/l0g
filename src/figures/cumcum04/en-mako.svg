<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cumcum04-en-mako-d-title cumcum04-en-mako-d-desc" viewBox="0 0 1000 700" style="width:100%;height:auto" class="l0g-cumcum04-svg">
<title id="cumcum04-en-mako-d-title">The discount applies to the punitive part</title><desc id="cumcum04-en-mako-d-desc">Mako / FCA calculation / pounds sterling (£)</desc>
