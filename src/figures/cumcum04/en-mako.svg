<text data-panel="cumcum04-en-mako-d-card-component-0" x="40" y="181" fill="var(--color-signal)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">A / DISGORGEMENT</text>
<text data-panel="cumcum04-en-mako-d-card-component-0" x="40" y="225" fill="var(--color-paper)" font-family="l0g CumCum" font-size="33" font-weight="700" text-anchor="start">£1,448,345</text>
<text data-panel="cumcum04-en-mako-d-card-component-0" x="40" y="256" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Relevant revenue</text>
<text data-panel="cumcum04-en-mako-d-card-component-0" x="40" y="293" fill="var(--color-paper)" font-family="l0g CumCum" font-size="28" font-weight="700" text-anchor="start">− £311,062</text>
<text data-panel="cumcum04-en-mako-d-card-component-0" x="40" y="323" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Custodian fees</text>
