<text data-panel="cumcum04-en-mako-d-frame" x="24" y="80" fill="var(--color-paper)" font-family="l0g CumCum" font-size="30" font-weight="700" text-anchor="start">The discount applies to the punitive part</text>
<text data-panel="cumcum04-en-mako-d-frame" x="24" y="110" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Mako / FCA calculation / pounds sterling (£)</text>
