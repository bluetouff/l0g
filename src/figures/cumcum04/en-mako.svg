<text data-panel="cumcum04-en-mako-d-card-total" x="960" y="585" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="end">Rounded down to £100</text>
<text data-panel="cumcum04-en-mako-d-frame" x="24" y="646" fill="var(--color-signal)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">S15 / FCA / 17.02.2025 / §§6.4–6.26</text>
<text data-panel="cumcum04-en-mako-d-frame" x="24" y="678" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">l0g calculation / Mako case amounts only.</text>
