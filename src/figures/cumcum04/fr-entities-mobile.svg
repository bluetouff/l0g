<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cumcum04-fr-entities-m-title cumcum04-fr-entities-m-desc" viewBox="0 0 420 1120" style="width:100%;height:auto" class="l0g-cumcum04-svg">
<title id="cumcum04-fr-entities-m-title">HSBC : deux entités, deux issues</title><desc id="cumcum04-fr-entities-m-desc">Deux périmètres juridiques</desc>
<rect id="cumcum04-fr-entities-m-frame" x="0" y="0" width="420" height="1120" rx="8" fill="var(--color-ink)"/>
<text data-panel="cumcum04-fr-entities-m-frame" x="24" y="30" fill="var(--color-signal)" font-family="l0g CumCum" font-size="17" font-weight="700" text-anchor="start">l0g / CUM-CUM 04 / 01</text>
<text data-panel="cumcum04-fr-entities-m-frame" x="24" y="72" fill="var(--color-paper)" font-family="l0g CumCum" font-size="26" font-weight="700" text-anchor="start">HSBC : deux entités,</text>
<text data-panel="cumcum04-fr-entities-m-frame" x="24" y="105" fill="var(--color-paper)" font-family="l0g CumCum" font-size="26" font-weight="700" text-anchor="start">deux issues</text>
<text data-panel="cumcum04-fr-entities-m-frame" x="24" y="135" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Deux périmètres juridiques</text>
<rect id="cumcum04-fr-entities-m-card-entity-0" x="24" y="154" width="372" height="416" rx="8" fill="var(--color-surface)" stroke="var(--color-amber)" stroke-width="1"/>
<text data-panel="cumcum04-fr-entities-m-card-entity-0" x="40" y="190" fill="var(--color-paper)" font-family="l0g CumCum" font-size="23" font-weight="700" text-anchor="start">HSBC Bank plc</text>
<text data-panel="cumcum04-fr-entities-m-card-entity-0" x="40" y="221" fill="var(--color-amber)" font-family="l0g CumCum" font-size="17" font-weight="700" text-anchor="start">2014–2019</text>
<text data-panel="cumcum04-fr-entities-m-card-entity-0" x="40" y="256" fill="var(--color-paper)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Décisions à Londres ; opérations dans</text>
<text data-panel="cumcum04-fr-entities-m-card-entity-0" x="40" y="279" fill="var(--color-paper)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">les livres de la succursale parisienne.</text>
<text data-panel="cumcum04-fr-entities-m-card-entity-0" x="40" y="319" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Autonomie parisienne insuffisante</text>
<text data-panel="cumcum04-fr-entities-m-card-entity-0" x="40" y="342" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">selon l’enquête.</text>
<text data-panel="cumcum04-fr-entities-m-card-entity-0" x="40" y="416" fill="var(--color-amber)" font-family="l0g CumCum" font-size="17" font-weight="700" text-anchor="start">08.01.2026</text>
<text data-panel="cumcum04-fr-entities-m-card-entity-0" x="40" y="450" fill="var(--color-amber)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">CJIP validée</text>
<text data-panel="cumcum04-fr-entities-m-card-entity-0" x="40" y="488" fill="var(--color-paper)" font-family="l0g CumCum" font-size="23" font-weight="700" text-anchor="start">267 531 000 €</text>
<text data-panel="cumcum04-fr-entities-m-card-entity-0" x="40" y="524" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Qualification envisagée : fraude fiscale</text>
<text data-panel="cumcum04-fr-entities-m-card-entity-0" x="40" y="547" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">aggravée.</text>
<rect id="cumcum04-fr-entities-m-card-entity-1" x="24" y="588" width="372" height="416" rx="8" fill="var(--color-surface)" stroke="var(--color-signal)" stroke-width="1"/>
<text data-panel="cumcum04-fr-entities-m-card-entity-1" x="40" y="624" fill="var(--color-paper)" font-family="l0g CumCum" font-size="23" font-weight="700" text-anchor="start">HSBC Continental Europe</text>
<text data-panel="cumcum04-fr-entities-m-card-entity-1" x="40" y="655" fill="var(--color-signal)" font-family="l0g CumCum" font-size="17" font-weight="700" text-anchor="start">REPRISE DES ACTIVITÉS</text>
<text data-panel="cumcum04-fr-entities-m-card-entity-1" x="40" y="690" fill="var(--color-paper)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Opérations dans ses propres livres,</text>
<text data-panel="cumcum04-fr-entities-m-card-entity-1" x="40" y="713" fill="var(--color-paper)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">sans HSBC Bank plc.</text>
<text data-panel="cumcum04-fr-entities-m-card-entity-1" x="40" y="753" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Contrôles cités : aucune rectification</text>
<text data-panel="cumcum04-fr-entities-m-card-entity-1" x="40" y="776" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">sur la tenue de marché visée.</text>
<text data-panel="cumcum04-fr-entities-m-card-entity-1" x="40" y="850" fill="var(--color-signal)" font-family="l0g CumCum" font-size="17" font-weight="700" text-anchor="start">05.01.2026</text>
<text data-panel="cumcum04-fr-entities-m-card-entity-1" x="40" y="884" fill="var(--color-signal)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">Enquête classée</text>
<text data-panel="cumcum04-fr-entities-m-card-entity-1" x="40" y="922" fill="var(--color-paper)" font-family="l0g CumCum" font-size="23" font-weight="700" text-anchor="start">Périmètre du dossier</text>
<text data-panel="cumcum04-fr-entities-m-card-entity-1" x="40" y="958" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Le classement concerne cette enquête.</text>
<text data-panel="cumcum04-fr-entities-m-frame" x="24" y="1050" fill="var(--color-signal)" font-family="l0g CumCum" font-size="17" font-weight="700" text-anchor="start">S01 / Paris / 08.01.2026 / p.6–9</text>
<text data-panel="cumcum04-fr-entities-m-frame" x="24" y="1076" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Schéma des faits et issues / sans échelle</text>
<text data-panel="cumcum04-fr-entities-m-frame" x="24" y="1099" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">financière.</text>
</svg>
