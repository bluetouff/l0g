<text data-panel="cumcum04-en-entities-d-frame" x="24" y="30" fill="var(--color-signal)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">l0g / CUM-CUM 04 / 01</text>
<text data-panel="cumcum04-en-entities-d-frame" x="24" y="80" fill="var(--color-paper)" font-family="l0g CumCum" font-size="30" font-weight="700" text-anchor="start">HSBC: two entities, two outcomes</text>
<text data-panel="cumcum04-en-entities-d-frame" x="24" y="110" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Separate transactions and legal scopes</text>
<rect id="cumcum04-en-entities-d-card-entity-0" x="24" y="150" width="464" height="438" rx="8" fill="var(--color-surface)" stroke="var(--color-amber)" stroke-width="1"/>
<text data-panel="cumcum04-en-entities-d-card-entity-0" x="44" y="186" fill="var(--color-paper)" font-family="l0g CumCum" font-size="27" font-weight="700" text-anchor="start">HSBC Bank plc</text>
<text data-panel="cumcum04-en-entities-d-card-entity-0" x="44" y="217" fill="var(--color-amber)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">2014–2019</text>
<text data-panel="cumcum04-en-entities-d-card-entity-0" x="44" y="252" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">London decisions; transactions booked</text>
<text data-panel="cumcum04-en-entities-d-card-entity-0" x="44" y="281" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">in the Paris branch.</text>
<text data-panel="cumcum04-en-entities-d-card-entity-0" x="44" y="321" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Insufficient Paris autonomy, according</text>
<text data-panel="cumcum04-en-entities-d-card-entity-0" x="44" y="350" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">to investigators.</text>
<text data-panel="cumcum04-en-entities-d-card-entity-0" x="44" y="412" fill="var(--color-amber)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">08.01.2026</text>
<text data-panel="cumcum04-en-entities-d-card-entity-0" x="44" y="446" fill="var(--color-amber)" font-family="l0g CumCum" font-size="28" font-weight="700" text-anchor="start">Agreement approved</text>
<text data-panel="cumcum04-en-entities-d-card-entity-0" x="44" y="484" fill="var(--color-paper)" font-family="l0g CumCum" font-size="29" font-weight="700" text-anchor="start">€267,531,000</text>
<text data-panel="cumcum04-en-entities-d-card-entity-0" x="44" y="520" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Proposed offence: aggravated tax</text>
<text data-panel="cumcum04-en-entities-d-card-entity-0" x="44" y="549" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">fraud.</text>
<rect id="cumcum04-en-entities-d-card-entity-1" x="512" y="150" width="464" height="438" rx="8" fill="var(--color-surface)" stroke="var(--color-signal)" stroke-width="1"/>
<text data-panel="cumcum04-en-entities-d-card-entity-1" x="532" y="186" fill="var(--color-paper)" font-family="l0g CumCum" font-size="27" font-weight="700" text-anchor="start">HSBC Continental Europe</text>
<text data-panel="cumcum04-en-entities-d-card-entity-1" x="532" y="217" fill="var(--color-signal)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">ACTIVITIES TAKEN OVER</text>
<text data-panel="cumcum04-en-entities-d-card-entity-1" x="532" y="252" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Transactions in its own books, without</text>
<text data-panel="cumcum04-en-entities-d-card-entity-1" x="532" y="281" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">HSBC Bank plc.</text>
<text data-panel="cumcum04-en-entities-d-card-entity-1" x="532" y="321" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Inspections cited: no adjustments to</text>
<text data-panel="cumcum04-en-entities-d-card-entity-1" x="532" y="350" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">the market-making concerned.</text>
<text data-panel="cumcum04-en-entities-d-card-entity-1" x="532" y="412" fill="var(--color-signal)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">05.01.2026</text>
<text data-panel="cumcum04-en-entities-d-card-entity-1" x="532" y="446" fill="var(--color-signal)" font-family="l0g CumCum" font-size="28" font-weight="700" text-anchor="start">Investigation closed</text>
<text data-panel="cumcum04-en-entities-d-card-entity-1" x="532" y="484" fill="var(--color-paper)" font-family="l0g CumCum" font-size="29" font-weight="700" text-anchor="start">Within this case’s scope</text>
<text data-panel="cumcum04-en-entities-d-card-entity-1" x="532" y="520" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Closure concerns this investigation.</text>
<text data-panel="cumcum04-en-entities-d-frame" x="24" y="640" fill="var(--color-signal)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">S01 / Paris / 08.01.2026 / pp.6–9</text>
<text data-panel="cumcum04-en-entities-d-frame" x="24" y="672" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Case paths / no financial scale.</text>
