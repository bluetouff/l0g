<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cumcum04-en-mako-m-title cumcum04-en-mako-m-desc" viewBox="0 0 420 1010" style="width:100%;height:auto" class="l0g-cumcum04-svg">
