<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cumcum04-fr-entities-d-title cumcum04-fr-entities-d-desc" viewBox="0 0 1000 700" style="width:100%;height:auto" class="l0g-cumcum04-svg">
<title id="cumcum04-fr-entities-d-title">HSBC : deux entités, deux issues</title><desc id="cumcum04-fr-entities-d-desc">Deux périmètres juridiques</desc>
<rect id="cumcum04-fr-entities-d-frame" x="0" y="0" width="1000" height="700" rx="8" fill="var(--color-ink)"/>
<text data-panel="cumcum04-fr-entities-d-frame" x="24" y="30" fill="var(--color-signal)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">l0g / CUM-CUM 04 / 01</text>
<text data-panel="cumcum04-fr-entities-d-frame" x="24" y="80" fill="var(--color-paper)" font-family="l0g CumCum" font-size="30" font-weight="700" text-anchor="start">HSBC : deux entités, deux issues</text>
<text data-panel="cumcum04-fr-entities-d-frame" x="24" y="110" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Deux périmètres juridiques</text>
<rect id="cumcum04-fr-entities-d-card-entity-0" x="24" y="150" width="464" height="438" rx="8" fill="var(--color-surface)" stroke="var(--color-amber)" stroke-width="1"/>
<text data-panel="cumcum04-fr-entities-d-card-entity-0" x="44" y="186" fill="var(--color-paper)" font-family="l0g CumCum" font-size="27" font-weight="700" text-anchor="start">HSBC Bank plc</text>
<text data-panel="cumcum04-fr-entities-d-card-entity-0" x="44" y="217" fill="var(--color-amber)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">2014–2019</text>
<text data-panel="cumcum04-fr-entities-d-card-entity-0" x="44" y="252" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Décisions à Londres ; opérations dans</text>
<text data-panel="cumcum04-fr-entities-d-card-entity-0" x="44" y="281" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">les livres de la succursale parisienne.</text>
<text data-panel="cumcum04-fr-entities-d-card-entity-0" x="44" y="321" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Autonomie parisienne insuffisante</text>
<text data-panel="cumcum04-fr-entities-d-card-entity-0" x="44" y="350" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">selon l’enquête.</text>
<text data-panel="cumcum04-fr-entities-d-card-entity-0" x="44" y="412" fill="var(--color-amber)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">08.01.2026</text>
<text data-panel="cumcum04-fr-entities-d-card-entity-0" x="44" y="446" fill="var(--color-amber)" font-family="l0g CumCum" font-size="28" font-weight="700" text-anchor="start">CJIP validée</text>
<text data-panel="cumcum04-fr-entities-d-card-entity-0" x="44" y="484" fill="var(--color-paper)" font-family="l0g CumCum" font-size="29" font-weight="700" text-anchor="start">267 531 000 €</text>
<text data-panel="cumcum04-fr-entities-d-card-entity-0" x="44" y="520" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Qualification envisagée : fraude</text>
<text data-panel="cumcum04-fr-entities-d-card-entity-0" x="44" y="549" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">fiscale aggravée.</text>
<rect id="cumcum04-fr-entities-d-card-entity-1" x="512" y="150" width="464" height="438" rx="8" fill="var(--color-surface)" stroke="var(--color-signal)" stroke-width="1"/>
<text data-panel="cumcum04-fr-entities-d-card-entity-1" x="532" y="186" fill="var(--color-paper)" font-family="l0g CumCum" font-size="27" font-weight="700" text-anchor="start">HSBC Continental Europe</text>
<text data-panel="cumcum04-fr-entities-d-card-entity-1" x="532" y="217" fill="var(--color-signal)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">REPRISE DES ACTIVITÉS</text>
<text data-panel="cumcum04-fr-entities-d-card-entity-1" x="532" y="252" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Opérations dans ses propres livres,</text>
<text data-panel="cumcum04-fr-entities-d-card-entity-1" x="532" y="281" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">sans HSBC Bank plc.</text>
<text data-panel="cumcum04-fr-entities-d-card-entity-1" x="532" y="321" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Contrôles cités : aucune rectification</text>
<text data-panel="cumcum04-fr-entities-d-card-entity-1" x="532" y="350" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">sur la tenue de marché visée.</text>
<text data-panel="cumcum04-fr-entities-d-card-entity-1" x="532" y="412" fill="var(--color-signal)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">05.01.2026</text>
<text data-panel="cumcum04-fr-entities-d-card-entity-1" x="532" y="446" fill="var(--color-signal)" font-family="l0g CumCum" font-size="28" font-weight="700" text-anchor="start">Enquête classée</text>
<text data-panel="cumcum04-fr-entities-d-card-entity-1" x="532" y="484" fill="var(--color-paper)" font-family="l0g CumCum" font-size="29" font-weight="700" text-anchor="start">Périmètre du dossier</text>
<text data-panel="cumcum04-fr-entities-d-card-entity-1" x="532" y="520" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Le classement concerne cette</text>
<text data-panel="cumcum04-fr-entities-d-card-entity-1" x="532" y="549" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">enquête.</text>
<text data-panel="cumcum04-fr-entities-d-frame" x="24" y="640" fill="var(--color-signal)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">S01 / Paris / 08.01.2026 / p.6–9</text>
<text data-panel="cumcum04-fr-entities-d-frame" x="24" y="672" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Schéma des faits et issues / sans échelle financière.</text>
