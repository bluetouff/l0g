<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 271" width="100%" height="auto" style="width:100%;height:auto" role="img" aria-labelledby="dst-en-scope-mobile-title dst-en-scope-mobile-desc" xml:lang="en">
<title id="dst-en-scope-mobile-title">Two thresholds for the EU proposal</title>
<desc id="dst-en-scope-mobile-desc">Above €750 million in worldwide turnover and €50 million in EU digital turnover, the draft sets a 3% rate on revenues from online advertising, online intermediation and user data monetisation.</desc>
<rect x=".5" y=".5" width="319" height="270" rx="8" fill="var(--color-ink)" stroke="var(--color-line)"/>
<text x="14" y="27" font-size="17" fill="var(--color-paper)" text-anchor="start">Two thresholds for the EU proposal</text>
<text x="14" y="46" font-size="12" fill="var(--color-muted)" text-anchor="start">Draft of 21 November 2026 · paragraph 145</text>
<path d="M14 58H306" fill="none" stroke="var(--color-line)" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M81 136v9h158v-9m-79 9v7m-4-4 4 4 4-4" fill="none" stroke="var(--color-line-strong)" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(70 69)" aria-hidden="true"><path d="M11 2a9 9 0 1 0 0 18 9 9 0 0 0 0-18ZM2 11h18m-9-9a14 14 0 0 1 0 18m0-18a14 14 0 0 0 0 18" fill="none" stroke="var(--color-signal)" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="81" y="109" font-size="16" fill="var(--color-paper)" text-anchor="middle">&gt; €750m</text>
<text x="81" y="128" font-size="12" fill="var(--color-muted)" text-anchor="middle">Worldwide turnover</text>
<g transform="translate(228 69)" aria-hidden="true"><path d="M11 21c4-4 7-8 7-12A7 7 0 0 0 4 9c0 4 3 8 7 12Zm0-15a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z" fill="none" stroke="var(--color-signal)" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="239" y="109" font-size="16" fill="var(--color-paper)" text-anchor="middle">&gt; €50m</text>
<text x="239" y="128" font-size="12" fill="var(--color-muted)" text-anchor="middle">EU digital turnover</text>
<text x="160" y="175" font-size="15" fill="var(--color-signal)" text-anchor="middle">3% of covered revenue</text>
<path d="M160 181v12m-104 9v-9h208v9m-104-9v9" fill="none" stroke="var(--color-line-strong)" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(45 208)" aria-hidden="true"><path d="M3 8h5l9-4v14l-9-4H3Zm3 6 2 6h3l-2-6m11-6 1-1m-1 5h1m-1 4 1 1" fill="none" stroke="var(--color-topic-blue)" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="56" y="244" font-size="12" fill="var(--color-paper)" text-anchor="middle">Online</text>
<text x="56" y="258" font-size="12" fill="var(--color-paper)" text-anchor="middle">advertising</text>
<g transform="translate(149 208)" aria-hidden="true"><path d="M3 10v10h16V10M2 10l2-6h14l2 6m-18 0a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 6 0M9 20v-5h4v5" fill="none" stroke="var(--color-topic-blue)" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="160" y="244" font-size="12" fill="var(--color-paper)" text-anchor="middle">Online</text>
<text x="160" y="258" font-size="12" fill="var(--color-paper)" text-anchor="middle">intermediation</text>
<g transform="translate(253 208)" aria-hidden="true"><path d="M3 5a8 3 0 1 0 16 0A8 3 0 1 0 3 5Zm0 0v12a8 3 0 1 0 16 0V5M3 11a8 3 0 1 0 16 0" fill="none" stroke="var(--color-topic-blue)" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="264" y="244" font-size="12" fill="var(--color-paper)" text-anchor="middle">User data</text>
<text x="264" y="258" font-size="12" fill="var(--color-paper)" text-anchor="middle">monetisation</text>
</svg>
