<text x="108" y="113" font-size="17" fill="var(--color-paper)" text-anchor="middle">100 €</text>
<text x="108" y="132" font-size="13" fill="var(--color-paper)" text-anchor="middle">Commande</text>
<text x="108" y="150" font-size="12" fill="var(--color-muted)" text-anchor="middle">Prix client</text>
