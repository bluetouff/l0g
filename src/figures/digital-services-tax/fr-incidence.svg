<path d="M464 158v11H286v11" fill="none" stroke="var(--color-amber)" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"/>
<text x="286" y="197" font-size="13" fill="var(--color-paper)" text-anchor="middle">Deux effets possibles chez le vendeur</text>
<path d="M286 205v5m-131 7v-7h262v7" fill="none" stroke="var(--color-line-strong)" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"/>
