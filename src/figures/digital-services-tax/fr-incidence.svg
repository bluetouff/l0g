<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 572 277" width="100%" height="auto" style="width:100%;height:auto" role="img" aria-labelledby="dst-fr-incidence-desktop-title dst-fr-incidence-desktop-desc" xml:lang="fr">
<title id="dst-fr-incidence-desktop-title">Du panier aux frais du vendeur</title>
<desc id="dst-fr-incidence-desktop-desc">Dans cet exemple fictif, la plateforme facture 15 euros de commission sur une commande de 100 euros. Une majoration de 3 % sur ces 15 euros coûte 45 centimes au vendeur, qui peut en absorber le coût ou ajuster son prix.</desc>
<rect x=".5" y=".5" width="571" height="276" rx="8" fill="var(--color-ink)" stroke="var(--color-line)"/>
<text x="20" y="27" font-size="17" fill="var(--color-paper)" text-anchor="start">Du panier aux frais du vendeur</text>
<text x="20" y="46" font-size="12" fill="var(--color-muted)" text-anchor="start">Exemple fictif · prélèvement ajouté sur la commission</text>
<path d="M20 58H552" fill="none" stroke="var(--color-line)" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"/>
