<text x="286" y="113" font-size="17" fill="var(--color-paper)" text-anchor="middle">15 €</text>
<text x="286" y="132" font-size="13" fill="var(--color-paper)" text-anchor="middle">Commission</text>
<text x="286" y="150" font-size="12" fill="var(--color-muted)" text-anchor="middle">15 % du prix</text>
<g transform="translate(453 72)" aria-hidden="true"><path d="M5 2h12v18l-3-2-3 2-3-2-3 2Zm3 5h6m-6 4h6m-6 4h3" fill="none" stroke="var(--color-amber)" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="464" y="113" font-size="17" fill="var(--color-amber)" text-anchor="middle">+0,45 €</text>
