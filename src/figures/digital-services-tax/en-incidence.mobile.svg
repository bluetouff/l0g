<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 277" width="100%" height="auto" style="width:100%;height:auto" role="img" aria-labelledby="dst-en-incidence-mobile-title dst-en-incidence-mobile-desc" xml:lang="en">
<title id="dst-en-incidence-mobile-title">From checkout to seller fees</title>
<desc id="dst-en-incidence-mobile-desc">In this example, the platform charges €15 commission on a €100 order. A 3% surcharge on the €15 commission adds €0.45 in seller fees. Sellers can absorb the fee or raise their prices.</desc>
<rect x=".5" y=".5" width="319" height="276" rx="8" fill="var(--color-ink)" stroke="var(--color-line)"/>
<text x="14" y="27" font-size="17" fill="var(--color-paper)" text-anchor="start">From checkout to seller fees</text>
<text x="14" y="46" font-size="12" fill="var(--color-muted)" text-anchor="start">Illustrative example · surcharge on commission</text>
<path d="M14 58H306" fill="none" stroke="var(--color-line)" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(45 72)" aria-hidden="true"><path d="M4 7h14l2 13H2Zm4 1V6a3 3 0 0 1 6 0v2" fill="none" stroke="var(--color-signal)" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="56" y="113" font-size="17" fill="var(--color-paper)" text-anchor="middle">€100</text>
<text x="56" y="132" font-size="13" fill="var(--color-paper)" text-anchor="middle">Order value</text>
<text x="56" y="150" font-size="12" fill="var(--color-muted)" text-anchor="middle">Customer price</text>
<g transform="translate(149 72)" aria-hidden="true"><path d="M3 5h16v12H3Zm3 6h2m6 0h2m-5-3a3 3 0 1 0 0 6 3 3 0 1 0 0-6Z" fill="none" stroke="var(--color-signal)" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="160" y="113" font-size="17" fill="var(--color-paper)" text-anchor="middle">€15</text>
<text x="160" y="132" font-size="13" fill="var(--color-paper)" text-anchor="middle">Commission</text>
<text x="160" y="150" font-size="12" fill="var(--color-muted)" text-anchor="middle">15% of order</text>
<g transform="translate(253 72)" aria-hidden="true"><path d="M5 2h12v18l-3-2-3 2-3-2-3 2Zm3 5h6m-6 4h6m-6 4h3" fill="none" stroke="var(--color-amber)" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="264" y="113" font-size="17" fill="var(--color-amber)" text-anchor="middle">+€0.45</text>
<text x="264" y="132" font-size="13" fill="var(--color-paper)" text-anchor="middle">New fee</text>
<text x="264" y="150" font-size="12" fill="var(--color-muted)" text-anchor="middle">3% of the €15 fee</text>
<path d="M89 105H126m-4-4 4 4-4 4" fill="none" stroke="var(--color-line-strong)" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M193 105H230m-4-4 4 4-4 4" fill="none" stroke="var(--color-line-strong)" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M264 158v11H160v11" fill="none" stroke="var(--color-amber)" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"/>
<text x="160" y="197" font-size="13" fill="var(--color-paper)" text-anchor="middle">Two ways sellers can respond</text>
<path d="M160 205v5m-79 7v-7h158v7" fill="none" stroke="var(--color-line-strong)" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(70 222)" aria-hidden="true"><path d="M19 9V6H4a2 2 0 0 0-2 2v10h17v-4m2 0h-7V9h7Zm-4-2.5h1M4 6l13-3v3" fill="none" stroke="var(--color-topic-blue)" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"/></g>
<g transform="translate(228 222)" aria-hidden="true"><path d="M2 9h18l-2 10H4Zm4 0 3-6m7 6-3-6m-5 9 1 4m5-4-1 4" fill="none" stroke="var(--color-topic-blue)" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="81" y="260" font-size="12" fill="var(--color-paper)" text-anchor="middle">Smaller margin</text>
<text x="239" y="260" font-size="12" fill="var(--color-paper)" text-anchor="middle">Higher retail price</text>
</svg>
