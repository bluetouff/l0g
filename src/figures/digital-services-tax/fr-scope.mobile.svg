<text x="239" y="109" font-size="16" fill="var(--color-paper)" text-anchor="middle">&gt; 50 M€</text>
<text x="239" y="128" font-size="12" fill="var(--color-muted)" text-anchor="middle">Activités numériques UE</text>
<text x="160" y="175" font-size="15" fill="var(--color-signal)" text-anchor="middle">3 % des recettes visées</text>
