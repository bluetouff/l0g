<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 271" width="100%" height="auto" style="width:100%;height:auto" role="img" aria-labelledby="dst-fr-scope-mobile-title dst-fr-scope-mobile-desc" xml:lang="fr">
<title id="dst-fr-scope-mobile-title">Les deux seuils du projet européen</title>
<desc id="dst-fr-scope-mobile-desc">Au-delà de 750 millions d’euros de chiffre d’affaires mondial et de 50 millions d’euros d’activités numériques dans l’UE, le projet prévoit un taux de 3 % sur les revenus de publicité en ligne, d’intermédiation en ligne et de monétisation des données des utilisateurs.</desc>
<rect x=".5" y=".5" width="319" height="270" rx="8" fill="var(--color-ink)" stroke="var(--color-line)"/>
<text x="14" y="27" font-size="17" fill="var(--color-paper)" text-anchor="start">Les deux seuils du projet européen</text>
<text x="14" y="46" font-size="12" fill="var(--color-muted)" text-anchor="start">Projet du 21 novembre 2026 · §145</text>
<path d="M14 58H306" fill="none" stroke="var(--color-line)" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"/>
