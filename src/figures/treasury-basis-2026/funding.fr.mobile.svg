<text data-panel="tb-funding-fr-m-spread" x="42" y="655" font-family="l0g Treasury Basis" font-size="19" font-weight="400" text-anchor="start" fill="var(--color-paper)">Points de base · décennie</text>
<text data-panel="tb-funding-fr-m-spread" x="42" y="688" font-family="l0g Treasury Basis" font-size="19" font-weight="400" text-anchor="start" fill="var(--color-muted)">Association de modèle</text>
<path data-connector="footer" d="M22 747 H398" fill="none" stroke="var(--color-line-strong)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
