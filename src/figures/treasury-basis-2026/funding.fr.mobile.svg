<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 800" role="img" aria-labelledby="tb-funding-fr-m-title tb-funding-fr-m-desc" style="width:100%;height:auto" class="l0g-treasury-basis-svg">
<title id="tb-funding-fr-m-title">Positions, crédit et prix du cash</title><desc id="tb-funding-fr-m-desc">Positions longues d’environ 0,6 à 2,4 mille milliards de dollars entre 2014 et fin 2025 ; repo net de 1,8 mille milliards fin 2025. Association modélisée historique avec un écart de 10 à 20 points de base de spread repo, sans causalité isolée.</desc>
<rect id="tb-funding-fr-m-frame" stroke="var(--color-line-strong)" stroke-width="1" x="0" y="0" width="420" height="800" rx="16" fill="var(--color-ink)"/>
<text data-panel="tb-funding-fr-m-frame" x="22" y="38" font-family="l0g Treasury Basis" font-size="19" font-weight="400" text-anchor="start" fill="var(--color-signal)">l0g / MARCHÉ DES TREASURIES</text>
<text data-panel="tb-funding-fr-m-frame" x="22" y="82" font-family="l0g Treasury Basis" font-size="28" font-weight="700" text-anchor="start" fill="var(--color-paper)">Positions, crédit</text>
<text data-panel="tb-funding-fr-m-frame" x="22" y="116" font-family="l0g Treasury Basis" font-size="28" font-weight="700" text-anchor="start" fill="var(--color-paper)">et prix du cash</text>
<text data-panel="tb-funding-fr-m-frame" x="22" y="148" font-family="l0g Treasury Basis" font-size="19" font-weight="400" text-anchor="start" fill="var(--color-amber)">Périodes et unités distinctes</text>
<rect id="tb-funding-fr-m-long" stroke="var(--color-line-strong)" stroke-width="1" x="22" y="166" width="376" height="244" rx="12" fill="var(--color-surface)"/>
<text data-panel="tb-funding-fr-m-long" x="42" y="199" font-family="l0g Treasury Basis" font-size="22" font-weight="700" text-anchor="start" fill="var(--color-signal)">Positions longues · T$</text>
<text data-panel="tb-funding-fr-m-long" x="42" y="250" font-family="l0g Treasury Basis" font-size="19" font-weight="400" text-anchor="start" fill="var(--color-paper)">2014</text>
<text data-panel="tb-funding-fr-m-long" x="378" y="250" font-family="l0g Treasury Basis" font-size="26" font-weight="700" text-anchor="end" fill="var(--color-signal)">0,6</text>
<rect x="42" y="264" width="336" height="16" rx="0" fill="var(--color-surface-2)"/>
<rect data-metric="long-trend" data-value="0.6" x="42" y="264" width="84.0" height="16" rx="0" fill="var(--color-signal)"/>
<text data-panel="tb-funding-fr-m-long" x="42" y="334" font-family="l0g Treasury Basis" font-size="19" font-weight="400" text-anchor="start" fill="var(--color-paper)">Fin 2025</text>
<text data-panel="tb-funding-fr-m-long" x="378" y="334" font-family="l0g Treasury Basis" font-size="26" font-weight="700" text-anchor="end" fill="var(--color-signal)">2,4</text>
<rect x="42" y="348" width="336" height="16" rx="0" fill="var(--color-surface-2)"/>
<rect data-metric="long-trend" data-value="2.4" x="42" y="348" width="336.0" height="16" rx="0" fill="var(--color-signal)"/>
<rect id="tb-funding-fr-m-net" stroke="var(--color-line-strong)" stroke-width="1" x="22" y="437" width="376" height="111" rx="12" fill="var(--color-surface)"/>
<text data-panel="tb-funding-fr-m-net" x="42" y="470" font-family="l0g Treasury Basis" font-size="21" font-weight="700" text-anchor="start" fill="var(--color-amber)">Repo net · fin 2025</text>
<text data-panel="tb-funding-fr-m-net" data-metric="net-repo" data-value="1.8" x="42" y="514" font-family="l0g Treasury Basis" font-size="32" font-weight="700" text-anchor="start" fill="var(--color-amber)">1,8 T$</text>
<rect id="tb-funding-fr-m-spread" x="22" y="579" width="376" height="137" rx="12" fill="var(--color-surface-2)"/>
