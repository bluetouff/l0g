<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 800" role="img" aria-labelledby="tb-funding-en-m-title tb-funding-en-m-desc" style="width:100%;height:auto" class="l0g-treasury-basis-svg">
<title id="tb-funding-en-m-title">Positions, funding and the price of cash</title><desc id="tb-funding-en-m-desc">Long positions of about 0.6 to 2.4 trillion dollars from 2014 to end 2025; net repo of 1.8 trillion at end 2025. Historical model association with a 10 to 20 basis point repo-spread gap, without isolated causality.</desc>
<rect id="tb-funding-en-m-frame" stroke="var(--color-line-strong)" stroke-width="1" x="0" y="0" width="420" height="800" rx="16" fill="var(--color-ink)"/>
<text data-panel="tb-funding-en-m-frame" x="22" y="38" font-family="l0g Treasury Basis" font-size="19" font-weight="400" text-anchor="start" fill="var(--color-signal)">l0g / TREASURY MARKET</text>
<text data-panel="tb-funding-en-m-frame" x="22" y="82" font-family="l0g Treasury Basis" font-size="28" font-weight="700" text-anchor="start" fill="var(--color-paper)">Positions, funding</text>
<text data-panel="tb-funding-en-m-frame" x="22" y="116" font-family="l0g Treasury Basis" font-size="28" font-weight="700" text-anchor="start" fill="var(--color-paper)">and the price of cash</text>
<text data-panel="tb-funding-en-m-frame" x="22" y="148" font-family="l0g Treasury Basis" font-size="19" font-weight="400" text-anchor="start" fill="var(--color-amber)">Distinct periods and units</text>
<rect id="tb-funding-en-m-long" stroke="var(--color-line-strong)" stroke-width="1" x="22" y="166" width="376" height="244" rx="12" fill="var(--color-surface)"/>
<text data-panel="tb-funding-en-m-long" x="42" y="199" font-family="l0g Treasury Basis" font-size="22" font-weight="700" text-anchor="start" fill="var(--color-signal)">Long positions · $tn</text>
<text data-panel="tb-funding-en-m-long" x="42" y="250" font-family="l0g Treasury Basis" font-size="19" font-weight="400" text-anchor="start" fill="var(--color-paper)">2014</text>
<text data-panel="tb-funding-en-m-long" x="378" y="250" font-family="l0g Treasury Basis" font-size="26" font-weight="700" text-anchor="end" fill="var(--color-signal)">0.6</text>
<rect x="42" y="264" width="336" height="16" rx="0" fill="var(--color-surface-2)"/>
<rect data-metric="long-trend" data-value="0.6" x="42" y="264" width="84.0" height="16" rx="0" fill="var(--color-signal)"/>
<text data-panel="tb-funding-en-m-long" x="42" y="334" font-family="l0g Treasury Basis" font-size="19" font-weight="400" text-anchor="start" fill="var(--color-paper)">End 2025</text>
<text data-panel="tb-funding-en-m-long" x="378" y="334" font-family="l0g Treasury Basis" font-size="26" font-weight="700" text-anchor="end" fill="var(--color-signal)">2.4</text>
<rect x="42" y="348" width="336" height="16" rx="0" fill="var(--color-surface-2)"/>
<rect data-metric="long-trend" data-value="2.4" x="42" y="348" width="336.0" height="16" rx="0" fill="var(--color-signal)"/>
<rect id="tb-funding-en-m-net" stroke="var(--color-line-strong)" stroke-width="1" x="22" y="437" width="376" height="111" rx="12" fill="var(--color-surface)"/>
<text data-panel="tb-funding-en-m-net" x="42" y="470" font-family="l0g Treasury Basis" font-size="21" font-weight="700" text-anchor="start" fill="var(--color-amber)">Net repo · end 2025</text>
<text data-panel="tb-funding-en-m-net" data-metric="net-repo" data-value="1.8" x="42" y="514" font-family="l0g Treasury Basis" font-size="32" font-weight="700" text-anchor="start" fill="var(--color-amber)">$1.8tn</text>
<rect id="tb-funding-en-m-spread" x="22" y="579" width="376" height="137" rx="12" fill="var(--color-surface-2)"/>
<text data-panel="tb-funding-en-m-spread" data-metric="associated-spread" data-value="10" x="42" y="618" font-family="l0g Treasury Basis" font-size="34" font-weight="700" text-anchor="start" fill="var(--color-signal)">10–20</text>
<text data-panel="tb-funding-en-m-spread" x="42" y="655" font-family="l0g Treasury Basis" font-size="19" font-weight="400" text-anchor="start" fill="var(--color-paper)">Basis points · over the decade</text>
<text data-panel="tb-funding-en-m-spread" x="42" y="688" font-family="l0g Treasury Basis" font-size="19" font-weight="400" text-anchor="start" fill="var(--color-muted)">Model association</text>
<path data-connector="footer" d="M22 747 H398" fill="none" stroke="var(--color-line-strong)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text data-panel="tb-funding-en-m-frame" x="22" y="780" font-family="l0g Treasury Basis" font-size="19" font-weight="400" text-anchor="start" fill="var(--color-muted)">Dallas Fed [06] · $tn = $1,000bn</text>
</svg>
