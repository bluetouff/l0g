<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="tb-mechanism-fr-d-title tb-mechanism-fr-d-desc" style="width:100%;height:auto" class="l0g-treasury-basis-svg">
<title id="tb-mechanism-fr-d-title">Le circuit de l’arbitrage à crédit</title><desc id="tb-mechanism-fr-d-desc">Circuit conceptuel : gestionnaire d’actifs acheteur de futures, hedge fund acheteur d’obligations et vendeur de futures, dealer prêteur repo et fonds monétaires. Le basis trade est estimé à 830 milliards de dollars en septembre 2025.</desc>
