<text data-panel="tb-haircut-fr-m-case-0" x="38" y="473" font-family="l0g Treasury Basis" font-size="19" font-weight="400" text-anchor="start" fill="var(--color-paper)">Décote 1 %</text>
<rect id="tb-haircut-fr-m-case-1" stroke="var(--color-line-strong)" stroke-width="1" x="218" y="172" width="180" height="355" rx="12" fill="var(--color-surface)"/>
