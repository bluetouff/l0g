<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 800" role="img" aria-labelledby="tb-haircut-fr-m-title tb-haircut-fr-m-desc" style="width:100%;height:auto" class="l0g-treasury-basis-svg">
<title id="tb-haircut-fr-m-title">Une décote accrue exige du cash</title><desc id="tb-haircut-fr-m-desc">Scénario hypothétique : obligation de 100 millions de dollars à prix inchangé, décote de 1 à 3 %, financement repo de 99 à 97 millions, nécessitant 2 millions de cash supplémentaire. Le calcul exclut la marge sur futures et les variations de prix.</desc>
<rect id="tb-haircut-fr-m-frame" stroke="var(--color-line-strong)" stroke-width="1" x="0" y="0" width="420" height="800" rx="16" fill="var(--color-ink)"/>
<text data-panel="tb-haircut-fr-m-frame" x="22" y="38" font-family="l0g Treasury Basis" font-size="19" font-weight="400" text-anchor="start" fill="var(--color-signal)">l0g / MARCHÉ DES TREASURIES</text>
<text data-panel="tb-haircut-fr-m-frame" x="22" y="82" font-family="l0g Treasury Basis" font-size="28" font-weight="700" text-anchor="start" fill="var(--color-paper)">Une décote accrue</text>
<text data-panel="tb-haircut-fr-m-frame" x="22" y="116" font-family="l0g Treasury Basis" font-size="28" font-weight="700" text-anchor="start" fill="var(--color-paper)">exige du cash</text>
<text data-panel="tb-haircut-fr-m-frame" x="22" y="148" font-family="l0g Treasury Basis" font-size="19" font-weight="400" text-anchor="start" fill="var(--color-amber)">Scénario hypothétique · titre inchangé</text>
<rect id="tb-haircut-fr-m-case-0" stroke="var(--color-line-strong)" stroke-width="1" x="22" y="172" width="180" height="355" rx="12" fill="var(--color-surface)"/>
<text data-panel="tb-haircut-fr-m-case-0" x="38" y="207" font-family="l0g Treasury Basis" font-size="19" font-weight="700" text-anchor="start" fill="var(--color-signal)">DÉPART</text>
<text data-panel="tb-haircut-fr-m-case-0" data-metric="bond-value" data-value="100" x="38" y="263" font-family="l0g Treasury Basis" font-size="29" font-weight="700" text-anchor="start" fill="var(--color-signal)">100 M$</text>
<text data-panel="tb-haircut-fr-m-case-0" x="38" y="295" font-family="l0g Treasury Basis" font-size="19" font-weight="400" text-anchor="start" fill="var(--color-paper)">Titre</text>
