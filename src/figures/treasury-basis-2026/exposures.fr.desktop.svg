<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="tb-exposures-fr-d-title tb-exposures-fr-d-desc" style="width:100%;height:auto" class="l0g-treasury-basis-svg">
<title id="tb-exposures-fr-d-title">Les positions longues décomposées</title><desc id="tb-exposures-fr-d-desc">Sept catégories exclusives d’expositions longues estimées en septembre 2025, en milliards de dollars. Les barres partagent une échelle de 0 à 900 milliards. Les montants arrondis totalisent 2 395 milliards, soit environ 2 400 milliards.</desc>
