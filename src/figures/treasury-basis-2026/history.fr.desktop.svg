<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="tb-history-fr-d-title tb-history-fr-d-desc" style="width:100%;height:auto" class="l0g-treasury-basis-svg">
<title id="tb-history-fr-d-title">Deux épisodes, deux stratégies</title><desc id="tb-history-fr-d-desc">Comparaison qualitative : débouclages de basis trade en mars 2020 ; réductions estimées des positions swap spread de 60 puis 40 milliards de dollars en avril et mai 2025.</desc>
<rect id="tb-history-fr-d-frame" stroke="var(--color-line-strong)" stroke-width="1" x="0" y="0" width="1000" height="680" rx="16" fill="var(--color-ink)"/>
<text data-panel="tb-history-fr-d-frame" x="32" y="42" font-family="l0g Treasury Basis" font-size="24" font-weight="400" text-anchor="start" fill="var(--color-signal)">l0g / MARCHÉ DES TREASURIES</text>
<text data-panel="tb-history-fr-d-frame" x="32" y="94" font-family="l0g Treasury Basis" font-size="36" font-weight="700" text-anchor="start" fill="var(--color-paper)">Deux épisodes, deux stratégies</text>
<text data-panel="tb-history-fr-d-frame" x="32" y="131" font-family="l0g Treasury Basis" font-size="24" font-weight="400" text-anchor="start" fill="var(--color-amber)">Épisodes et mécanismes</text>
<rect id="tb-history-fr-d-2020" stroke="var(--color-line-strong)" stroke-width="1" x="32" y="185" width="448" height="352" rx="12" fill="var(--color-surface)"/>
<text data-panel="tb-history-fr-d-2020" x="56" y="233" font-family="l0g Treasury Basis" font-size="29" font-weight="700" text-anchor="start" fill="var(--color-signal)">MARS 2020</text>
<text data-panel="tb-history-fr-d-2020" x="56" y="294" font-family="l0g Treasury Basis" font-size="29" font-weight="700" text-anchor="start" fill="var(--color-signal)">Basis trade</text>
<text data-panel="tb-history-fr-d-2020" x="56" y="355" font-family="l0g Treasury Basis" font-size="25" font-weight="400" text-anchor="start" fill="var(--color-signal)">Débouclages documentés</text>
<text data-panel="tb-history-fr-d-2020" x="56" y="416" font-family="l0g Treasury Basis" font-size="25" font-weight="400" text-anchor="start" fill="var(--color-signal)">Ventes de titres</text>
<text data-panel="tb-history-fr-d-2020" x="56" y="477" font-family="l0g Treasury Basis" font-size="25" font-weight="400" text-anchor="start" fill="var(--color-paper)">et achats de futures</text>
<rect id="tb-history-fr-d-2025" stroke="var(--color-line-strong)" stroke-width="1" x="520" y="185" width="448" height="352" rx="12" fill="var(--color-surface)"/>
<text data-panel="tb-history-fr-d-2025" x="544" y="233" font-family="l0g Treasury Basis" font-size="29" font-weight="700" text-anchor="start" fill="var(--color-amber)">AVRIL–MAI 2025</text>
<text data-panel="tb-history-fr-d-2025" x="544" y="294" font-family="l0g Treasury Basis" font-size="29" font-weight="700" text-anchor="start" fill="var(--color-amber)">Swap spread</text>
<text data-panel="tb-history-fr-d-2025" data-metric="swap-reduction" data-value="-60" x="544" y="355" font-family="l0g Treasury Basis" font-size="25" font-weight="400" text-anchor="start" fill="var(--color-amber)">−60 Md$ en avril</text>
<text data-panel="tb-history-fr-d-2025" data-metric="swap-reduction" data-value="-40" x="544" y="416" font-family="l0g Treasury Basis" font-size="25" font-weight="400" text-anchor="start" fill="var(--color-amber)">−40 Md$ en mai</text>
<text data-panel="tb-history-fr-d-2025" x="544" y="477" font-family="l0g Treasury Basis" font-size="25" font-weight="400" text-anchor="start" fill="var(--color-paper)">Basis relativement stable</text>
<text data-panel="tb-history-fr-d-frame" x="32" y="593" font-family="l0g Treasury Basis" font-size="24" font-weight="400" text-anchor="start" fill="var(--color-muted)">Les réductions de positions diffèrent des ventes nettes.</text>
<path data-connector="footer" d="M22 627 H978" fill="none" stroke="var(--color-line-strong)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text data-panel="tb-history-fr-d-frame" x="22" y="660" font-family="l0g Treasury Basis" font-size="24" font-weight="400" text-anchor="start" fill="var(--color-muted)">Fed [01, 03, 07, 08] · épisodes</text>
</svg>
