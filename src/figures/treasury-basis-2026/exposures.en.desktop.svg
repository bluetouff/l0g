<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="tb-exposures-en-d-title tb-exposures-en-d-desc" style="width:100%;height:auto" class="l0g-treasury-basis-svg">
<title id="tb-exposures-en-d-title">Decomposing the long exposures</title><desc id="tb-exposures-en-d-desc">Seven mutually exclusive categories of estimated long exposure in September 2025, in billion dollars. Bars share a scale from 0 to 900 billion. Rounded amounts total 2,395 billion, or about 2,400 billion.</desc>
