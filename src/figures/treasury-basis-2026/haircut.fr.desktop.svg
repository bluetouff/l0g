<rect id="tb-haircut-fr-d-case-1" stroke="var(--color-line-strong)" stroke-width="1" x="520" y="180" width="448" height="320" rx="12" fill="var(--color-surface)"/>
<text data-panel="tb-haircut-fr-d-case-1" x="544" y="226" font-family="l0g Treasury Basis" font-size="26" font-weight="700" text-anchor="start" fill="var(--color-amber)">APRÈS CHOC</text>
