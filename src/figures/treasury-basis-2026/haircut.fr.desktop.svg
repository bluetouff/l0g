<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="tb-haircut-fr-d-title tb-haircut-fr-d-desc" style="width:100%;height:auto" class="l0g-treasury-basis-svg">
<title id="tb-haircut-fr-d-title">Une décote accrue exige du cash</title><desc id="tb-haircut-fr-d-desc">Scénario hypothétique : obligation de 100 millions de dollars à prix inchangé, décote de 1 à 3 %, financement repo de 99 à 97 millions, nécessitant 2 millions de cash supplémentaire. Le calcul exclut la marge sur futures et les variations de prix.</desc>
