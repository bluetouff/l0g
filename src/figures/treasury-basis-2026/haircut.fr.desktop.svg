<text data-panel="tb-haircut-fr-d-frame" x="32" y="94" font-family="l0g Treasury Basis" font-size="36" font-weight="700" text-anchor="start" fill="var(--color-paper)">Une décote accrue exige du cash</text>
<text data-panel="tb-haircut-fr-d-frame" x="32" y="131" font-family="l0g Treasury Basis" font-size="24" font-weight="400" text-anchor="start" fill="var(--color-amber)">Scénario hypothétique · titre inchangé</text>
