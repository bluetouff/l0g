<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 800" role="img" aria-labelledby="tb-clearing-fr-m-title tb-clearing-fr-m-desc" style="width:100%;height:auto" class="l0g-treasury-basis-svg">
<title id="tb-clearing-fr-m-title">La compensation change de périmètre</title><desc id="tb-clearing-fr-m-desc">Sur les mêmes montants de repos Treasury en encours moyen quotidien du 1er janvier au 30 août 2025, l’OFR mesure 45 % compensés et simule 77 % sous un périmètre de règle modélisé. Ce scénario maintient le comportement constant et reste distinct des exemptions ajoutées en octobre 2026.</desc>
<rect id="tb-clearing-fr-m-frame" stroke="var(--color-line-strong)" stroke-width="1" x="0" y="0" width="420" height="800" rx="16" fill="var(--color-ink)"/>
<text data-panel="tb-clearing-fr-m-frame" x="22" y="38" font-family="l0g Treasury Basis" font-size="19" font-weight="400" text-anchor="start" fill="var(--color-signal)">l0g / MARCHÉ DES TREASURIES</text>
<text data-panel="tb-clearing-fr-m-frame" x="22" y="82" font-family="l0g Treasury Basis" font-size="28" font-weight="700" text-anchor="start" fill="var(--color-paper)">La compensation</text>
<text data-panel="tb-clearing-fr-m-frame" x="22" y="116" font-family="l0g Treasury Basis" font-size="28" font-weight="700" text-anchor="start" fill="var(--color-paper)">change de périmètre</text>
<text data-panel="tb-clearing-fr-m-frame" x="22" y="148" font-family="l0g Treasury Basis" font-size="19" font-weight="400" text-anchor="start" fill="var(--color-amber)">Encours moyens · janv.–août 2025</text>
<rect id="tb-clearing-fr-m-case-0" stroke="var(--color-line-strong)" stroke-width="1" x="22" y="177" width="376" height="126" rx="12" fill="var(--color-surface)"/>
<text data-panel="tb-clearing-fr-m-case-0" x="42" y="210" font-family="l0g Treasury Basis" font-size="20" font-weight="700" text-anchor="start" fill="var(--color-signal)">OBSERVÉ</text>
<text data-panel="tb-clearing-fr-m-case-0" x="42" y="253" font-family="l0g Treasury Basis" font-size="37" font-weight="700" text-anchor="start" fill="var(--color-signal)">45 %</text>
<rect x="42" y="273" width="336" height="12" rx="0" fill="var(--color-surface-2)"/>
<rect data-metric="cleared-share" data-value="45" x="42" y="273" width="151.2" height="12" rx="0" fill="var(--color-signal)"/>
<rect id="tb-clearing-fr-m-case-1" stroke="var(--color-line-strong)" stroke-width="1" x="22" y="329" width="376" height="126" rx="12" fill="var(--color-surface)"/>
<text data-panel="tb-clearing-fr-m-case-1" x="42" y="362" font-family="l0g Treasury Basis" font-size="20" font-weight="700" text-anchor="start" fill="var(--color-amber)">SIMULATION</text>
<text data-panel="tb-clearing-fr-m-case-1" x="42" y="405" font-family="l0g Treasury Basis" font-size="37" font-weight="700" text-anchor="start" fill="var(--color-amber)">77 %</text>
<rect x="42" y="425" width="336" height="12" rx="0" fill="var(--color-surface-2)"/>
<rect data-metric="cleared-share" data-value="77" x="42" y="425" width="258.72" height="12" rx="0" fill="var(--color-amber)"/>
<text data-panel="tb-clearing-fr-m-frame" x="22" y="519" font-family="l0g Treasury Basis" font-size="21" font-weight="700" text-anchor="start" fill="var(--color-paper)">Encours de 2025 inchangés</text>
<text data-panel="tb-clearing-fr-m-frame" x="22" y="552" font-family="l0g Treasury Basis" font-size="19" font-weight="400" text-anchor="start" fill="var(--color-muted)">Périmètre de règle modélisé</text>
<rect id="tb-clearing-fr-m-dates" x="22" y="591" width="376" height="121" rx="12" fill="var(--color-surface-2)"/>
<text data-panel="tb-clearing-fr-m-dates" x="42" y="625" font-family="l0g Treasury Basis" font-size="20" font-weight="700" text-anchor="start" fill="var(--color-signal)">31.12.2026 · cash éligible</text>
<text data-panel="tb-clearing-fr-m-dates" x="42" y="662" font-family="l0g Treasury Basis" font-size="20" font-weight="700" text-anchor="start" fill="var(--color-amber)">30.06.2027 · repo éligible</text>
<text data-panel="tb-clearing-fr-m-dates" x="42" y="694" font-family="l0g Treasury Basis" font-size="19" font-weight="400" text-anchor="start" fill="var(--color-muted)">Exemptions ajoutées en oct. 2026</text>
<path data-connector="footer" d="M22 747 H398" fill="none" stroke="var(--color-line-strong)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text data-panel="tb-clearing-fr-m-frame" x="22" y="780" font-family="l0g Treasury Basis" font-size="19" font-weight="400" text-anchor="start" fill="var(--color-muted)">OFR [10] · SEC [09, 15]</text>
</svg>
