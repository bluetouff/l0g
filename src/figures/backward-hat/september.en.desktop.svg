<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 278" role="img" aria-labelledby="backward-hat-september-en-desktop-title backward-hat-september-en-desktop-description" width="100%" height="auto" style="width:100%;height:auto" font-family="Inter Variable, Inter, sans-serif" font-weight="400" xml:lang="en">
  <title id="backward-hat-september-en-desktop-title">September, from deposits to payouts</title>
  <desc id="backward-hat-september-en-desktop-description">The CFTC estimates an opening balance of $3 million, contributions of $15.1 million and other inflows of $0.7 million. It describes $13.4 million in payments to participants, $4.9 million in transfers to related entities and $0.1 million in miscellaneous expenses. About $0.4 million remained. Both totals use rounded estimates.</desc>
