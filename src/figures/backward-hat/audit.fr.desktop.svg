<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 261" role="img" aria-labelledby="backward-hat-audit-fr-desktop-title backward-hat-audit-fr-desktop-description" width="100%" height="auto" style="width:100%;height:auto" font-family="Inter Variable, Inter, sans-serif" font-weight="400" xml:lang="fr">
  <title id="backward-hat-audit-fr-desktop-title">La vérification bancaire contestée</title>
  <desc id="backward-hat-audit-fr-desktop-description">Selon la plainte de la SEC, deux rapports affirmaient que des relevés bancaires confirmaient 246 millions de dollars d’actifs sous gestion au 31 juillet 2025. La SEC indique que le compte cité avait un solde d’un dollar à cette date et avait reçu moins de 2,5 millions sur la période visée. Le litige porte sur la vérification revendiquée. Les actifs sous gestion et le solde bancaire sont deux mesures distinctes.</desc>
  <rect x="0" y="0" width="600" height="261" rx="8" fill="var(--color-ink)" />
  <text x="22" y="30" font-size="17.5" font-weight="400" fill="var(--color-paper)" text-anchor="start">La vérification bancaire contestée</text>
  <text x="22" y="50" font-size="12" font-weight="400" fill="var(--color-muted)" text-anchor="start">BH Capital Fund I LP · 31 juillet 2025</text>
  <path d="M22 61H578" fill="none" stroke="var(--color-line-strong)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M285 128H315" fill="none" stroke="var(--color-amber)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4" />
  <circle cx="300" cy="128" r="2.75" fill="var(--color-amber)" />
  <rect x="22" y="78" width="263" height="109" rx="6" fill="var(--color-surface)" stroke="var(--color-line-strong)" />
  <rect x="315" y="78" width="263" height="109" rx="6" fill="var(--color-surface)" stroke="var(--color-line-strong)" />
  <g transform="translate(33 86)" aria-hidden="true"><path d="M5 2h9l4 4v14H5Zm9 0v5h4M8 10h7m-7 3h7m-7 3h5" fill="none" stroke="var(--color-signal)" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round" /></g>
  <g transform="translate(326 86)" aria-hidden="true"><path d="m2 7 9-5 9 5v2H2Zm2 11h14m-16 3h18M5 9v9m4-9v9m4-9v9m4-9v9" fill="none" stroke="var(--color-topic-blue)" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round" /></g>
  <text x="62" y="102" font-size="13" font-weight="400" fill="var(--color-muted)" text-anchor="start">Dans les rapports</text>
  <text x="355" y="102" font-size="13" font-weight="400" fill="var(--color-muted)" text-anchor="start">Dans le compte cité</text>
  <text x="35" y="132" font-size="19" font-weight="400" fill="var(--color-signal)" text-anchor="start">246 M$ US</text>
  <text x="328" y="132" font-size="19" font-weight="400" fill="var(--color-topic-blue)" text-anchor="start">1 $ US</text>
  <text x="35" y="155" font-size="12.5" font-weight="400" fill="var(--color-paper)" text-anchor="start">Actifs sous gestion annoncés</text>
  <text x="328" y="155" font-size="12.5" font-weight="400" fill="var(--color-paper)" text-anchor="start">Solde à la même date</text>
  <text x="35" y="174" font-size="12" font-weight="400" fill="var(--color-muted)" text-anchor="start">Vérification par relevés alléguée</text>
  <text x="328" y="174" font-size="11.5" font-weight="400" fill="var(--color-muted)" text-anchor="start">Entrées sur la période &lt; 2,5 M$ US</text>
  <path d="M22 204H578" fill="none" stroke="var(--color-line-strong)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" />
  <text x="22" y="224" font-size="14" font-weight="400" fill="var(--color-amber)" text-anchor="start">La SEC conteste la vérification par relevés</text>
  <text x="22" y="245" font-size="12.4" font-weight="400" fill="var(--color-muted)" text-anchor="start">Actifs sous gestion et solde bancaire : deux mesures distinctes</text>
</svg>
