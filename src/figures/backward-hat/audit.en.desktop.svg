<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 261" role="img" aria-labelledby="backward-hat-audit-en-desktop-title backward-hat-audit-en-desktop-description" width="100%" height="auto" style="width:100%;height:auto" font-family="Inter Variable, Inter, sans-serif" font-weight="400" xml:lang="en">
  <title id="backward-hat-audit-en-desktop-title">The disputed bank verification</title>
  <desc id="backward-hat-audit-en-desktop-description">According to the SEC complaint, two reports claimed bank statements verified $246 million in assets under management as of July 31, 2025. The SEC says the relevant bank account held $1 that day and received less than $2.5 million during the period in question. The dispute concerns the claimed verification. Assets under management and a bank balance measure different things.</desc>
  <rect x="0" y="0" width="600" height="261" rx="8" fill="var(--color-ink)" />
  <text x="22" y="30" font-size="17.5" font-weight="400" fill="var(--color-paper)" text-anchor="start">The disputed bank verification</text>
  <text x="22" y="50" font-size="12" font-weight="400" fill="var(--color-muted)" text-anchor="start">BH Capital Fund I LP · 31 July 2025</text>
  <path d="M22 61H578" fill="none" stroke="var(--color-line-strong)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M285 128H315" fill="none" stroke="var(--color-amber)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4" />
  <circle cx="300" cy="128" r="2.75" fill="var(--color-amber)" />
  <rect x="22" y="78" width="263" height="109" rx="6" fill="var(--color-surface)" stroke="var(--color-line-strong)" />
  <rect x="315" y="78" width="263" height="109" rx="6" fill="var(--color-surface)" stroke="var(--color-line-strong)" />
  <g transform="translate(33 86)" aria-hidden="true"><path d="M5 2h9l4 4v14H5Zm9 0v5h4M8 10h7m-7 3h7m-7 3h5" fill="none" stroke="var(--color-signal)" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round" /></g>
  <g transform="translate(326 86)" aria-hidden="true"><path d="m2 7 9-5 9 5v2H2Zm2 11h14m-16 3h18M5 9v9m4-9v9m4-9v9m4-9v9" fill="none" stroke="var(--color-topic-blue)" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round" /></g>
  <text x="62" y="102" font-size="13" font-weight="400" fill="var(--color-muted)" text-anchor="start">In the reports</text>
  <text x="355" y="102" font-size="13" font-weight="400" fill="var(--color-muted)" text-anchor="start">In the cited account</text>
  <text x="35" y="132" font-size="19" font-weight="400" fill="var(--color-signal)" text-anchor="start">US$246m</text>
  <text x="328" y="132" font-size="19" font-weight="400" fill="var(--color-topic-blue)" text-anchor="start">US$1</text>
  <text x="35" y="155" font-size="12.5" font-weight="400" fill="var(--color-paper)" text-anchor="start">Reported assets under management</text>
  <text x="328" y="155" font-size="12.5" font-weight="400" fill="var(--color-paper)" text-anchor="start">Balance on the same date</text>
  <text x="35" y="174" font-size="12" font-weight="400" fill="var(--color-muted)" text-anchor="start">Claimed bank-statement verification</text>
  <text x="328" y="174" font-size="11.5" font-weight="400" fill="var(--color-muted)" text-anchor="start">Less than US$2.5m in inflows over the period</text>
  <path d="M22 204H578" fill="none" stroke="var(--color-line-strong)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" />
  <text x="22" y="224" font-size="14" font-weight="400" fill="var(--color-amber)" text-anchor="start">The SEC challenges the claimed bank verification</text>
  <text x="22" y="245" font-size="12.4" font-weight="400" fill="var(--color-muted)" text-anchor="start">Assets under management and bank cash measure different things</text>
</svg>
