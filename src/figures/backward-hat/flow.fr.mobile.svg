<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 329" role="img" aria-labelledby="backward-hat-flow-fr-mobile-title backward-hat-flow-fr-mobile-description" width="100%" height="auto" style="width:100%;height:auto" font-family="Inter Variable, Inter, sans-serif" font-weight="400" xml:lang="fr">
  <title id="backward-hat-flow-fr-mobile-title">Les virements décrits par la CFTC</title>
  <desc id="backward-hat-flow-fr-mobile-description">La CFTC allègue une collecte supérieure à 556 millions de dollars et des transferts depuis trois comptes bancaires : au moins 303 millions aux participants, environ 92,9 millions à KMAP, 41,4 à Allen Johnson Group et 27,3 à Harvey Group. Les quelque 91 millions envoyés à Coinbase sont un flux distinct cité dans la plainte, susceptible de recouper d’autres mouvements.</desc>
  <rect x="0" y="0" width="332" height="329" rx="8" fill="var(--color-ink)" />
  <text x="16" y="30" font-size="17.5" font-weight="400" fill="var(--color-paper)" text-anchor="start">Les virements décrits par la CFTC</text>
  <text x="16" y="50" font-size="12" font-weight="400" fill="var(--color-muted)" text-anchor="start">2022–2026 · Allégations · Millions USD</text>
