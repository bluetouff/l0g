<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 290" role="img" aria-labelledby="backward-hat-flow-en-desktop-title backward-hat-flow-en-desktop-description" width="100%" height="auto" style="width:100%;height:auto" font-family="Inter Variable, Inter, sans-serif" font-weight="400" xml:lang="en">
  <title id="backward-hat-flow-en-desktop-title">The transfers in the CFTC complaint</title>
  <desc id="backward-hat-flow-en-desktop-description">The CFTC alleges more than $556 million in contributions and transfers out of three bank accounts: at least $303 million to participants, about $92.9 million to KMAP, $41.4 million to Allen Johnson Group and $27.3 million to Harvey Group. The roughly $91 million sent to Coinbase is reported separately and may overlap with other movements.</desc>
