  <rect x="365" y="79" width="2.5" height="31" rx="1" fill="var(--color-accent)" />
  <text x="376" y="99" font-size="12" font-weight="400" fill="var(--color-paper)" text-anchor="start">To participants</text>
  <text x="567" y="99" font-size="14" font-weight="400" fill="var(--color-accent)" text-anchor="end">≥ 303</text>
