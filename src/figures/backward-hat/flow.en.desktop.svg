  <g transform="translate(205 110)" aria-hidden="true"><path d="m2 7 9-5 9 5v2H2Zm2 11h14m-16 3h18M5 9v9m4-9v9m4-9v9m4-9v9" fill="none" stroke="var(--color-topic-blue)" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round" /></g>
  <text x="36" y="155" font-size="19" font-weight="400" fill="var(--color-signal)" text-anchor="start">&gt; 556</text>
