  <text x="22" y="30" font-size="17.5" font-weight="400" fill="var(--color-paper)" text-anchor="start">The transfers in the CFTC complaint</text>
  <text x="22" y="50" font-size="12" font-weight="400" fill="var(--color-muted)" text-anchor="start">2022–2026 · Allegations · USD millions</text>
  <path d="M22 61H578" fill="none" stroke="var(--color-line-strong)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" />
