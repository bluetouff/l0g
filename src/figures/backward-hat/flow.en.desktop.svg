  <text x="567" y="173" font-size="14" font-weight="400" fill="var(--color-topic-blue)" text-anchor="end">≈ 41.4</text>
  <rect x="365" y="190" width="213" height="31" rx="5" fill="var(--color-surface)" stroke="var(--color-line-strong)" />
