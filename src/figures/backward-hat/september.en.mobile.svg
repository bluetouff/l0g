  <title id="backward-hat-september-en-mobile-title">September, from deposits to payouts</title>
  <desc id="backward-hat-september-en-mobile-description">The CFTC estimates an opening balance of $3 million, contributions of $15.1 million and other inflows of $0.7 million. It describes $13.4 million in payments to participants, $4.9 million in transfers to related entities and $0.1 million in miscellaneous expenses. About $0.4 million remained. Both totals use rounded estimates.</desc>
