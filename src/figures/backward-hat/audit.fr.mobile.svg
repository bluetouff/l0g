<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 334" role="img" aria-labelledby="backward-hat-audit-fr-mobile-title backward-hat-audit-fr-mobile-description" width="100%" height="auto" style="width:100%;height:auto" font-family="Inter Variable, Inter, sans-serif" font-weight="400" xml:lang="fr">
  <title id="backward-hat-audit-fr-mobile-title">La vérification bancaire contestée</title>
  <desc id="backward-hat-audit-fr-mobile-description">Selon la plainte de la SEC, deux rapports affirmaient que des relevés bancaires confirmaient 246 millions de dollars d’actifs sous gestion au 31 juillet 2025. La SEC indique que le compte cité avait un solde d’un dollar à cette date et avait reçu moins de 2,5 millions sur la période visée. Le litige porte sur la vérification revendiquée. Les actifs sous gestion et le solde bancaire sont deux mesures distinctes.</desc>
  <rect x="0" y="0" width="332" height="334" rx="8" fill="var(--color-ink)" />
  <text x="16" y="30" font-size="17.5" font-weight="400" fill="var(--color-paper)" text-anchor="start">La vérification bancaire contestée</text>
  <text x="16" y="50" font-size="12" font-weight="400" fill="var(--color-muted)" text-anchor="start">BH Capital Fund I LP · 31 juillet 2025</text>
  <path d="M16 61H316" fill="none" stroke="var(--color-line-strong)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M165 153V170" fill="none" stroke="var(--color-amber)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4" />
  <circle cx="165" cy="161" r="2.5" fill="var(--color-amber)" />
  <rect x="16" y="77" width="300" height="77" rx="6" fill="var(--color-surface)" stroke="var(--color-line-strong)" />
  <rect x="16" y="170" width="300" height="74" rx="6" fill="var(--color-surface)" stroke="var(--color-line-strong)" />
  <g transform="translate(26 80)" aria-hidden="true"><path d="M5 2h9l4 4v14H5Zm9 0v5h4M8 10h7m-7 3h7m-7 3h5" fill="none" stroke="var(--color-signal)" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round" /></g>
  <g transform="translate(26 173)" aria-hidden="true"><path d="m2 7 9-5 9 5v2H2Zm2 11h14m-16 3h18M5 9v9m4-9v9m4-9v9m4-9v9" fill="none" stroke="var(--color-topic-blue)" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round" /></g>
  <text x="55" y="97" font-size="12.5" font-weight="400" fill="var(--color-muted)" text-anchor="start">Dans les rapports</text>
  <text x="55" y="190" font-size="12.5" font-weight="400" fill="var(--color-muted)" text-anchor="start">Dans le compte cité</text>
  <text x="305" y="102" font-size="17" font-weight="400" fill="var(--color-signal)" text-anchor="end">246 M$ US</text>
  <text x="305" y="194" font-size="17" font-weight="400" fill="var(--color-topic-blue)" text-anchor="end">1 $ US</text>
  <text x="29" y="122" font-size="12.5" font-weight="400" fill="var(--color-paper)" text-anchor="start">Actifs sous gestion annoncés</text>
  <text x="29" y="142" font-size="12" font-weight="400" fill="var(--color-muted)" text-anchor="start">Vérification par relevés alléguée</text>
  <text x="29" y="213" font-size="12.5" font-weight="400" fill="var(--color-paper)" text-anchor="start">Solde à la même date</text>
  <text x="29" y="233" font-size="11.6" font-weight="400" fill="var(--color-muted)" text-anchor="start">Entrées sur la période &lt; 2,5 M$ US</text>
  <path d="M16 259H316" fill="none" stroke="var(--color-line-strong)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" />
  <text x="16" y="280" font-size="12.2" font-weight="400" fill="var(--color-amber)" text-anchor="start">La SEC conteste la vérification par relevés</text>
  <text x="16" y="301" font-size="12.4" font-weight="400" fill="var(--color-muted)" text-anchor="start">Actifs sous gestion et solde bancaire</text>
  <text x="16" y="321" font-size="12.4" font-weight="400" fill="var(--color-muted)" text-anchor="start">sont deux mesures distinctes.</text>
</svg>
