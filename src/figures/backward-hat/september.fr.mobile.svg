  <title id="backward-hat-september-fr-mobile-title">Septembre, du dépôt au retrait</title>
  <desc id="backward-hat-september-fr-mobile-description">La CFTC situe le solde de départ à environ 3 millions de dollars, les souscriptions à 15,1 millions et les autres entrées à 0,7 million. Elle décrit 13,4 millions de paiements aux participants, 4,9 millions de transferts à des sociétés liées et 0,1 million de dépenses diverses. Le solde final avoisine 0,4 million. Les deux totaux sont construits à partir d’estimations arrondies.</desc>
