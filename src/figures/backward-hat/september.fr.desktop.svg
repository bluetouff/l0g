<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 278" role="img" aria-labelledby="backward-hat-september-fr-desktop-title backward-hat-september-fr-desktop-description" width="100%" height="auto" style="width:100%;height:auto" font-family="Inter Variable, Inter, sans-serif" font-weight="400" xml:lang="fr">
  <title id="backward-hat-september-fr-desktop-title">Septembre, du dépôt au retrait</title>
  <desc id="backward-hat-september-fr-desktop-description">La CFTC situe le solde de départ à environ 3 millions de dollars, les souscriptions à 15,1 millions et les autres entrées à 0,7 million. Elle décrit 13,4 millions de paiements aux participants, 4,9 millions de transferts à des sociétés liées et 0,1 million de dépenses diverses. Le solde final avoisine 0,4 million. Les deux totaux sont construits à partir d’estimations arrondies.</desc>
