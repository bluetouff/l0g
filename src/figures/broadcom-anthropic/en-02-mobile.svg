<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1080" role="img" aria-labelledby="broadcom-en-02-m-title broadcom-en-02-m-desc" style="width:100%;height:auto" class="l0g-broadcom-svg"><title id="broadcom-en-02-m-title">Resale determines the backstop call</title><desc id="broadcom-en-02-m-desc">Teaching illustration of the default-and-sale branch. For 100 units of outstanding lease obligations, G=max(0,72.5−V). Resale values 30,60 and 90 imply 42.5,12.5 and 0 units of support. Other remedies and the creditor waterfall are outside the model.</desc><rect id="broadcom-en-02-m-frame" x="0" y="0" width="420" height="1080" rx="0" fill="var(--color-ink)"/><text data-panel="broadcom-en-02-m-frame" x="20" y="32" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="20" font-weight="700" text-anchor="start">l0g / BROADCOM</text><text data-panel="broadcom-en-02-m-frame" x="400" y="32" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="20" font-weight="400" text-anchor="end">02</text><text data-panel="broadcom-en-02-m-frame" x="20" y="80" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="29" font-weight="700" text-anchor="start">Resale determines the</text><text data-panel="broadcom-en-02-m-frame" x="20" y="116" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="29" font-weight="700" text-anchor="start">backstop call</text><text data-panel="broadcom-en-02-m-frame" x="20" y="155" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="18" font-weight="400" text-anchor="start">Default then sale · hypothetical lease</text><text data-panel="broadcom-en-02-m-frame" x="20" y="180" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="18" font-weight="400" text-anchor="start">balance L = 100 units</text><text data-panel="broadcom-en-02-m-frame" x="20" y="240" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="23" font-weight="700" text-anchor="start">G = max(0, 0.725 × L − V)</text><text data-panel="broadcom-en-02-m-frame" x="70" y="300" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="20" font-weight="400" text-anchor="start">Support G · units</text><line x1="70" y1="650" x2="385" y2="650" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="broadcom-en-02-m-frame" x="58" y="656" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="18" font-weight="400" text-anchor="end">0</text><line x1="70" y1="575" x2="385" y2="575" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="broadcom-en-02-m-frame" x="58" y="581" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="18" font-weight="400" text-anchor="end">20</text><line x1="70" y1="500" x2="385" y2="500" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="broadcom-en-02-m-frame" x="58" y="506" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="18" font-weight="400" text-anchor="end">40</text><line x1="70" y1="425" x2="385" y2="425" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="broadcom-en-02-m-frame" x="58" y="431" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="18" font-weight="400" text-anchor="end">60</text><line x1="70" y1="350" x2="385" y2="350" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="broadcom-en-02-m-frame" x="58" y="356" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="18" font-weight="400" text-anchor="end">80</text><text data-panel="broadcom-en-02-m-frame" x="70" y="684" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="18" font-weight="400" text-anchor="middle">0</text><text data-panel="broadcom-en-02-m-frame" x="227.5" y="684" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="18" font-weight="400" text-anchor="middle">50</text><text data-panel="broadcom-en-02-m-frame" x="385" y="684" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="18" font-weight="400" text-anchor="middle">100</text><path data-connector="support-curve" data-metric="support-rate" data-value="0.725" d="M70 378.125 L298.375 650 L385 650" fill="none" stroke="var(--color-signal)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><line x1="298.375" y1="350" x2="298.375" y2="650" stroke="var(--color-amber)" stroke-width="2" stroke-dasharray="6 5"/><text data-panel="broadcom-en-02-m-frame" x="306.375" y="334" fill="var(--color-amber)" font-family="l0g Broadcom" font-size="19" font-weight="700" text-anchor="start">72.5</text><circle cx="164.5" cy="490.625" r="5" fill="var(--color-amber)"/><circle cx="259" cy="603.125" r="5" fill="var(--color-amber)"/><circle cx="353.5" cy="650" r="5" fill="var(--color-amber)"/><text data-panel="broadcom-en-02-m-frame" x="227.5" y="724" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="19" font-weight="400" text-anchor="middle">Sale value V · units</text><rect id="broadcom-en-02-m-card-30" x="20" y="770" width="380" height="52" rx="7" fill="var(--color-surface-2)"/><text data-panel="broadcom-en-02-m-card-30" x="35" y="804" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="21" font-weight="400" text-anchor="start">V = 30</text><text data-panel="broadcom-en-02-m-card-30" x="385" y="804" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="24" font-weight="700" text-anchor="end">G = 42.5</text><rect id="broadcom-en-02-m-card-33" x="20" y="835" width="380" height="52" rx="7" fill="var(--color-surface-2)"/><text data-panel="broadcom-en-02-m-card-33" x="35" y="869" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="21" font-weight="400" text-anchor="start">V = 60</text><text data-panel="broadcom-en-02-m-card-33" x="385" y="869" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="24" font-weight="700" text-anchor="end">G = 12.5</text><rect id="broadcom-en-02-m-card-36" x="20" y="900" width="380" height="52" rx="7" fill="var(--color-surface-2)"/><text data-panel="broadcom-en-02-m-card-36" x="35" y="934" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="21" font-weight="400" text-anchor="start">V = 90</text><text data-panel="broadcom-en-02-m-card-36" x="385" y="934" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="24" font-weight="700" text-anchor="end">G = 0.0</text><text data-panel="broadcom-en-02-m-frame" x="20" y="1020" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="18" font-weight="400" text-anchor="start">[2] · hypothetical units; other remedies</text><text data-panel="broadcom-en-02-m-frame" x="20" y="1045" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="18" font-weight="400" text-anchor="start">and waterfall excluded.</text></svg>