<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="broadcom-fr-06-title broadcom-fr-06-desc" style="width:100%;height:auto" class="l0g-broadcom-svg"><title id="broadcom-fr-06-title">Un choc atteint plusieurs protections</title><desc id="broadcom-fr-06-desc">Un stress hypothétique de rentabilité de l’IA peut fragiliser les loyers d’Anthropic, la revente des équipements et l’activité de Broadcom. Les ressources propres, le réemploi et la capacité du fournisseur peuvent atténuer les risques. Ces protections doivent être testées ensemble; aucune probabilité ou corrélation observée n’est estimée.</desc><rect id="broadcom-fr-06-frame" x="0" y="0" width="1000" height="680" rx="0" fill="var(--color-ink)"/><text data-panel="broadcom-fr-06-frame" x="40" y="34" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="24" font-weight="700" text-anchor="start">l0g / BROADCOM</text><text data-panel="broadcom-fr-06-frame" x="960" y="34" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="end">06</text><text data-panel="broadcom-fr-06-frame" x="40" y="85" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="34" font-weight="700" text-anchor="start">Un choc atteint plusieurs protections</text><text data-panel="broadcom-fr-06-frame" x="40" y="134" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="start">Risques corrélés · scénario hypothétique</text><rect id="broadcom-fr-06-card-6" x="260" y="185" width="480" height="105" rx="7" fill="var(--color-surface-2)"/><text data-panel="broadcom-fr-06-card-6" x="276" y="218" fill="var(--color-accent)" font-family="l0g Broadcom" font-size="26" font-weight="700" text-anchor="start">Stress sur l’IA</text><text data-panel="broadcom-fr-06-card-6" x="276" y="261" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="start">Rentabilité fragilisée</text><path data-connector="common-stress" d="M500 295 L500 335 L170 335" fill="none" stroke="var(--color-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path data-connector="stress-branches" d="M500 335 L830 335" fill="none" stroke="var(--color-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect id="broadcom-fr-06-card-11" x="40" y="380" width="260" height="150" rx="7" fill="var(--color-surface-2)"/><text data-panel="broadcom-fr-06-card-11" x="56" y="414" fill="var(--color-accent)" font-family="l0g Broadcom" font-size="27" font-weight="700" text-anchor="start">Anthropic</text><text data-panel="broadcom-fr-06-card-11" x="56" y="456" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="start">Loyers fragilisés</text><text data-panel="broadcom-fr-06-card-11" x="56" y="504" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="start">Liquidités</text><path data-connector="risk-0" d="M170 335 L170 373" fill="none" stroke="var(--color-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M164.918218 365.571979 L170 373 L175.081782 365.571979" fill="none" stroke="var(--color-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect id="broadcom-fr-06-card-17" x="370" y="380" width="260" height="150" rx="7" fill="var(--color-surface-2)"/><text data-panel="broadcom-fr-06-card-17" x="386" y="414" fill="var(--color-accent)" font-family="l0g Broadcom" font-size="27" font-weight="700" text-anchor="start">Équipements</text><text data-panel="broadcom-fr-06-card-17" x="386" y="456" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="start">Revente fragilisée</text><text data-panel="broadcom-fr-06-card-17" x="386" y="504" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="start">Réemploi autorisé</text><path data-connector="risk-1" d="M500 335 L500 373" fill="none" stroke="var(--color-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.918218 365.571979 L500 373 L505.081782 365.571979" fill="none" stroke="var(--color-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect id="broadcom-fr-06-card-23" x="700" y="380" width="260" height="150" rx="7" fill="var(--color-surface-2)"/><text data-panel="broadcom-fr-06-card-23" x="716" y="414" fill="var(--color-accent)" font-family="l0g Broadcom" font-size="27" font-weight="700" text-anchor="start">Broadcom</text><text data-panel="broadcom-fr-06-card-23" x="716" y="456" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="start">Ventes et soutien</text><text data-panel="broadcom-fr-06-card-23" x="716" y="504" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="start">Cash et réemploi</text><path data-connector="risk-2" d="M830 335 L830 373" fill="none" stroke="var(--color-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M824.918218 365.571979 L830 373 L835.081782 365.571979" fill="none" stroke="var(--color-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="broadcom-fr-06-frame" x="40" y="588" fill="var(--color-amber)" font-family="l0g Broadcom" font-size="28" font-weight="700" text-anchor="start">Des protections à éprouver ensemble</text><text data-panel="broadcom-fr-06-frame" x="40" y="638" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="start">[2, 3, 4, 5, 8] · scénario ; aucune probabilité estimée.</text></svg>