<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1080" role="img" aria-labelledby="broadcom-fr-01-m-title broadcom-fr-01-m-desc" style="width:100%;height:auto" class="l0g-broadcom-svg"><title id="broadcom-fr-01-m-title">Les capitaux entrent, le risque circule</title><desc id="broadcom-fr-01-m-desc">Les banques organisent le financement de premier rang et Blackstone fournit la portion engagée du second rang. Le véhicule achète les équipements et les loue à Anthropic. Broadcom apporte un soutien conditionnel à leur valeur résiduelle. Le financement annoncé est de 63 milliards de dollars, avec premières livraisons attendues en 2027. Les flèches ne représentent pas des montants proportionnels.</desc><rect id="broadcom-fr-01-m-frame" x="0" y="0" width="420" height="1080" rx="0" fill="var(--color-ink)"/><text data-panel="broadcom-fr-01-m-frame" x="20" y="32" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="20" font-weight="700" text-anchor="start">l0g / BROADCOM</text><text data-panel="broadcom-fr-01-m-frame" x="400" y="32" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="20" font-weight="400" text-anchor="end">01</text><text data-panel="broadcom-fr-01-m-frame" x="20" y="80" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="29" font-weight="700" text-anchor="start">Les capitaux entrent,</text><text data-panel="broadcom-fr-01-m-frame" x="20" y="116" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="29" font-weight="700" text-anchor="start">le risque circule</text><text data-panel="broadcom-fr-01-m-frame" x="20" y="155" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="18" font-weight="400" text-anchor="start">Annonce du 26 octobre 2026 ·</text><text data-panel="broadcom-fr-01-m-frame" x="20" y="180" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="18" font-weight="400" text-anchor="start">architecture simplifiée</text><rect id="broadcom-fr-01-m-card-8" x="20" y="205" width="380" height="115" rx="7" fill="var(--color-surface-2)"/><text data-panel="broadcom-fr-01-m-card-8" x="36" y="235" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="22" font-weight="700" text-anchor="start">Bank of America · Citi</text><text data-panel="broadcom-fr-01-m-card-8" x="36" y="265" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="22" font-weight="700" text-anchor="start">Morgan Stanley</text><text data-panel="broadcom-fr-01-m-card-8" x="36" y="298" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="19" font-weight="400" text-anchor="start">Premier rang · arrangement</text><rect id="broadcom-fr-01-m-card-12" x="20" y="345" width="380" height="95" rx="7" fill="var(--color-surface-2)"/><text data-panel="broadcom-fr-01-m-card-12" x="36" y="378" fill="var(--color-amber)" font-family="l0g Broadcom" font-size="23" font-weight="700" text-anchor="start">Blackstone</text><text data-panel="broadcom-fr-01-m-card-12" x="36" y="415" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="19" font-weight="400" text-anchor="start">Portion engagée de second rang</text><path data-connector="bank-financing" d="M400 260 L410 260 L410 480 L210 480" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path data-connector="second-lien" d="M210 445 L210 480" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path data-connector="financing" d="M210 480 L210 500" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M206.047503 494.222651 L210 500 L213.952497 494.222651" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="broadcom-fr-01-m-frame" x="30" y="480" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="26" font-weight="700" text-anchor="start">63 Md$</text><rect id="broadcom-fr-01-m-card-20" x="20" y="510" width="380" height="105" rx="7" fill="var(--color-surface-2)"/><text data-panel="broadcom-fr-01-m-card-20" x="36" y="543" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="23" font-weight="700" text-anchor="start">SPV</text><text data-panel="broadcom-fr-01-m-card-20" x="36" y="580" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="19" font-weight="400" text-anchor="start">Propriétaire et bailleur</text><rect id="broadcom-fr-01-m-card-23" x="20" y="710" width="380" height="100" rx="7" fill="var(--color-surface-2)"/><text data-panel="broadcom-fr-01-m-card-23" x="36" y="743" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="23" font-weight="700" text-anchor="start">Anthropic</text><text data-panel="broadcom-fr-01-m-card-23" x="36" y="780" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="19" font-weight="400" text-anchor="start">Locataire et utilisateur</text><path data-connector="use" d="M140 620 L140 699" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M136.047503 693.222651 L140 699 L143.952497 693.222651" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="broadcom-fr-01-m-frame" x="30" y="669" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="18" font-weight="400" text-anchor="start">Usage</text><path data-connector="rent" d="M280 699 L280 620" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M283.952497 625.777349 L280 620 L276.047503 625.777349" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="broadcom-fr-01-m-frame" x="300" y="669" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="18" font-weight="400" text-anchor="start">Loyers</text><rect id="broadcom-fr-01-m-card-32" x="20" y="865" width="380" height="115" rx="7" fill="var(--color-surface-2)"/><text data-panel="broadcom-fr-01-m-card-32" x="36" y="898" fill="var(--color-accent)" font-family="l0g Broadcom" font-size="23" font-weight="700" text-anchor="start">Broadcom</text><text data-panel="broadcom-fr-01-m-card-32" x="36" y="935" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="19" font-weight="400" text-anchor="start">Soutien conditionnel du SPV</text><path data-connector="supplier-support" d="M20 925 L9 925 L9 565 L17 565" fill="none" stroke="var(--color-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M11.222651 568.952497 L17 565 L11.222651 561.047503" fill="none" stroke="var(--color-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="broadcom-fr-01-m-frame" x="20" y="1020" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="18" font-weight="400" text-anchor="start">[1, 2] · financement annoncé ; livraisons</text><text data-panel="broadcom-fr-01-m-frame" x="20" y="1045" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="18" font-weight="400" text-anchor="start">attendues en 2027.</text></svg>