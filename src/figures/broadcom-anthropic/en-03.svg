<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="broadcom-en-03-title broadcom-en-03-desc" style="width:100%;height:auto" class="l0g-broadcom-svg"><title id="broadcom-en-03-title">Rent can start before service</title><desc id="broadcom-en-03-desc">In the usual sequence, readiness starts the lease. Specified contractual delay circumstances can start rent before service. Notes cannot be issued before readiness or for the first quarterly instalment. Exact delay periods are redacted; no actual delay is assumed.</desc><rect id="broadcom-en-03-frame" x="0" y="0" width="1000" height="680" rx="0" fill="var(--color-ink)"/><text data-panel="broadcom-en-03-frame" x="40" y="34" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="24" font-weight="700" text-anchor="start">l0g / BROADCOM</text><text data-panel="broadcom-en-03-frame" x="960" y="34" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="end">03</text><text data-panel="broadcom-en-03-frame" x="40" y="85" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="34" font-weight="700" text-anchor="start">Rent can start before service</text><text data-panel="broadcom-en-03-frame" x="40" y="134" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="start">31 March 2026 contracts · qualitative sequences</text><text data-panel="broadcom-en-03-frame" x="40" y="190" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="27" font-weight="700" text-anchor="start">Usual sequence</text><rect id="broadcom-en-03-card-7" x="40" y="225" width="440" height="90" rx="7" fill="var(--color-surface-2)"/><text data-panel="broadcom-en-03-card-7" x="56" y="255" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="25" font-weight="700" text-anchor="start">Ready for service</text><text data-panel="broadcom-en-03-card-7" x="56" y="286" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="start">Installation and tests complete.</text><path data-connector="sequence-0-0" d="M260 319 L260 333" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M254.918218 325.571979 L260 333 L265.081782 325.571979" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect id="broadcom-en-03-card-12" x="40" y="340" width="440" height="90" rx="7" fill="var(--color-surface-2)"/><text data-panel="broadcom-en-03-card-12" x="56" y="370" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="25" font-weight="700" text-anchor="start">Lease begins</text><text data-panel="broadcom-en-03-card-12" x="56" y="401" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="start">The rent schedule starts.</text><path data-connector="sequence-0-1" d="M260 434 L260 448" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M254.918218 440.571979 L260 448 L265.081782 440.571979" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect id="broadcom-en-03-card-17" x="40" y="455" width="440" height="90" rx="7" fill="var(--color-surface-2)"/><text data-panel="broadcom-en-03-card-17" x="56" y="485" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="25" font-weight="700" text-anchor="start">First instalment</text><text data-panel="broadcom-en-03-card-17" x="56" y="516" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="start">Excluded from note financing.</text><text data-panel="broadcom-en-03-frame" x="520" y="190" fill="var(--color-amber)" font-family="l0g Broadcom" font-size="27" font-weight="700" text-anchor="start">Specified delay case</text><rect id="broadcom-en-03-card-21" x="520" y="225" width="440" height="90" rx="7" fill="var(--color-surface-2)"/><text data-panel="broadcom-en-03-card-21" x="536" y="255" fill="var(--color-amber)" font-family="l0g Broadcom" font-size="25" font-weight="700" text-anchor="start">Specified delay</text><text data-panel="broadcom-en-03-card-21" x="536" y="286" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="start">Site or installation delayed.</text><path data-connector="sequence-1-0" d="M740 319 L740 333" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M734.918218 325.571979 L740 333 L745.081782 325.571979" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect id="broadcom-en-03-card-26" x="520" y="340" width="440" height="90" rx="7" fill="var(--color-surface-2)"/><text data-panel="broadcom-en-03-card-26" x="536" y="370" fill="var(--color-amber)" font-family="l0g Broadcom" font-size="25" font-weight="700" text-anchor="start">Early lease start</text><text data-panel="broadcom-en-03-card-26" x="536" y="401" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="start">Rent can start before service.</text><path data-connector="sequence-1-1" d="M740 434 L740 448" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M734.918218 440.571979 L740 448 L745.081782 440.571979" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect id="broadcom-en-03-card-31" x="520" y="455" width="440" height="90" rx="7" fill="var(--color-surface-2)"/><text data-panel="broadcom-en-03-card-31" x="536" y="485" fill="var(--color-amber)" font-family="l0g Broadcom" font-size="25" font-weight="700" text-anchor="start">Interim cash need</text><text data-panel="broadcom-en-03-card-31" x="536" y="516" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="start">Notes unavailable before service.</text><text data-panel="broadcom-en-03-frame" x="40" y="580" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="24" font-weight="700" text-anchor="start">After readiness and the first instalment: notes remain conditional.</text><text data-panel="broadcom-en-03-frame" x="40" y="638" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="start">[3, 4, 5] · redacted periods; contractual possibility.</text></svg>