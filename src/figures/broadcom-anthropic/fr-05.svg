<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="broadcom-fr-05-title broadcom-fr-05-desc" style="width:100%;height:auto" class="l0g-broadcom-svg"><title id="broadcom-fr-05-title">Les intérêts augmentent la dette</title><desc id="broadcom-fr-05-desc">Exemple de 100 unités émises pendant 5 ans sans remboursement ou conversion. Avec 20 trimestres égaux,9%annuel donne 156,0509 unités et 13%donne 189,5838. Le taux de 9%concerne les notes émises avant une période de manquement définie au contrat; celui de 13%concerne les émissions pendant cette période. Il s’agit d’une approximation pédagogique:le contrat utilise les jours réels sur 365 et les échéances varient par tranche.</desc><rect id="broadcom-fr-05-frame" x="0" y="0" width="1000" height="680" rx="0" fill="var(--color-ink)"/><text data-panel="broadcom-fr-05-frame" x="40" y="34" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="24" font-weight="700" text-anchor="start">l0g / BROADCOM</text><text data-panel="broadcom-fr-05-frame" x="960" y="34" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="end">05</text><text data-panel="broadcom-fr-05-frame" x="40" y="85" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="34" font-weight="700" text-anchor="start">Les intérêts augmentent la dette</text><text data-panel="broadcom-fr-05-frame" x="40" y="134" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="start">Trimestres égaux · scénario pédagogique</text><text data-panel="broadcom-fr-05-frame" x="40" y="210" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="27" font-weight="700" text-anchor="start">100 unités · cinq ans</text><text data-panel="broadcom-fr-05-frame" x="90" y="250" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="start">Encours · unités</text><line x1="90" y1="540" x2="650" y2="540" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="broadcom-fr-05-frame" x="78" y="546" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="end">0</text><line x1="90" y1="478.095238" x2="650" y2="478.095238" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="broadcom-fr-05-frame" x="78" y="484.095238" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="end">50</text><line x1="90" y1="416.190476" x2="650" y2="416.190476" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="broadcom-fr-05-frame" x="78" y="422.190476" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="end">100</text><line x1="90" y1="354.285714" x2="650" y2="354.285714" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="broadcom-fr-05-frame" x="78" y="360.285714" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="end">150</text><line x1="90" y1="292.380952" x2="650" y2="292.380952" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="broadcom-fr-05-frame" x="78" y="298.380952" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="end">200</text><text data-panel="broadcom-fr-05-frame" x="90" y="574" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="middle">0</text><text data-panel="broadcom-fr-05-frame" x="202" y="574" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="middle">1</text><text data-panel="broadcom-fr-05-frame" x="314" y="574" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="middle">2</text><text data-panel="broadcom-fr-05-frame" x="426" y="574" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="middle">3</text><text data-panel="broadcom-fr-05-frame" x="538" y="574" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="middle">4</text><text data-panel="broadcom-fr-05-frame" x="650" y="574" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="middle">5</text><text data-panel="broadcom-fr-05-frame" x="370" y="610" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="middle">Années</text><path data-connector="interest-0" data-metric="final-standard" data-value="156.05092" d="M90 416.190476 L118 413.404762 L146 410.556369 L174 407.643887 L202 404.665875 L230 401.620857 L258 398.507326 L286 395.323741 L314 392.068525 L342 388.740067 L370 385.336719 L398 381.856795 L426 378.298573 L454 374.660291 L482 370.940147 L510 367.1363 L538 363.246867 L566 359.269922 L594 355.203495 L622 351.045574 L650 346.794099" fill="none" stroke="var(--color-signal)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="650" cy="346.794099" r="5" fill="var(--color-signal)"/><rect id="broadcom-fr-05-card-27" x="710" y="270" width="250" height="130" rx="7" fill="var(--color-surface-2)"/><text data-panel="broadcom-fr-05-card-27" x="726" y="305" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="28" font-weight="700" text-anchor="start">9 % → 156,1</text><text data-panel="broadcom-fr-05-card-27" x="726" y="346" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="start">Émises avant</text><text data-panel="broadcom-fr-05-card-27" x="726" y="376" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="start">manquement</text><path data-connector="interest-1" data-metric="final-breach" data-value="189.583792" d="M90 416.190476 L118 412.166667 L146 408.012083 L174 403.722476 L202 399.293457 L230 394.720494 L258 389.998