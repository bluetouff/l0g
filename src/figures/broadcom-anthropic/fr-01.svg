<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="broadcom-fr-01-title broadcom-fr-01-desc" style="width:100%;height:auto" class="l0g-broadcom-svg"><title id="broadcom-fr-01-title">Les capitaux entrent, le risque circule</title><desc id="broadcom-fr-01-desc">Les banques organisent le financement de premier rang et Blackstone fournit la portion engagée du second rang. Le véhicule achète les équipements et les loue à Anthropic. Broadcom apporte un soutien conditionnel à leur valeur résiduelle. Le financement annoncé est de 63 milliards de dollars, avec premières livraisons attendues en 2027. Les flèches ne représentent pas des montants proportionnels.</desc><rect id="broadcom-fr-01-frame" x="0" y="0" width="1000" height="680" rx="0" fill="var(--color-ink)"/><text data-panel="broadcom-fr-01-frame" x="40" y="34" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="24" font-weight="700" text-anchor="start">l0g / BROADCOM</text><text data-panel="broadcom-fr-01-frame" x="960" y="34" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="end">01</text><text data-panel="broadcom-fr-01-frame" x="40" y="85" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="34" font-weight="700" text-anchor="start">Les capitaux entrent, le risque circule</text><text data-panel="broadcom-fr-01-frame" x="40" y="134" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="start">Annonce du 26 octobre 2026 · architecture simplifiée</text><rect id="broadcom-fr-01-card-6" x="40" y="185" width="430" height="110" rx="7" fill="var(--color-surface-2)"/><text data-panel="broadcom-fr-01-card-6" x="56" y="218" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="25" font-weight="700" text-anchor="start">Bank of America · Citi</text><text data-panel="broadcom-fr-01-card-6" x="56" y="250" fill="var(--color-paper)" font-family="l0g Broadcom" font-s