olor-paper)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="start">conditionnel</text><rect id="broadcom-fr-01-card-21" x="370" y="380" width="260" height="130" rx="7" fill="var(--color-surface-2)"/><text data-panel="broadcom-fr-01-card-21" x="386" y="413" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="25" font-weight="700" text-anchor="start">SPV</text><text data-panel="broadcom-fr-01-card-21" x="386" y="456" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="start">Propriétaire et</text><text data-panel="broadcom-fr-01-card-21" x="386" y="486" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="start">bailleur</text><rect id="broadcom-fr-01-card-25" x="700" y="380" width="260" height="130" rx="7" fill="var(--color-surface-2)"/><text data-panel="broadcom-fr-01-card-25" x="716" y="413" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="25" font-weight="700" text-anchor="start">Anthropic</text><text data-panel="broadcom-fr-01-card-25" x="716" y="456" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="start">Locataire du calcul</text><path data-connector="supplier-support" d="M307 445 L362 445" fill="none" stroke="var(--color-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M354.571979 450.081782 L362 445 L354.571979 439.918218" fill="none" stroke="var(--color-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path data-connector="use" d="M637 420 L692 420" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M684.571979 425.081782 L692 420 L684.571979 414.918218" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path data-connector="rent" d="M692 475 L637 475" fill="none" stroke="var(--color-signal