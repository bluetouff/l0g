<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="broadcom-en-01-title broadcom-en-01-desc" style="width:100%;height:auto" class="l0g-broadcom-svg"><title id="broadcom-en-01-title">Capital enters, risk stays connected</title><desc id="broadcom-en-01-desc">Banks arrange first-lien financing and Blackstone provides the committed second-lien portion. The SPV buys equipment and leases it to Anthropic. Broadcom supplies conditional residual-value support. Announced financing is 63 billion dollars, with first deliveries expected in 2027. Arrows are not scaled to amounts.</desc><rect id="broadcom-en-01-frame" x="0" y="0" width="1000" height="680" rx="0" fill="var(--color-ink)"/><text data-panel="broadcom-en-01-frame" x="40" y="34" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="24" font-weight="700" text-anchor="start">l0g / BROADCOM</text><text data-panel="broadcom-en-01-frame" x="960" y="34" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="end">01</text><text data-panel="broadcom-en-01-frame" x="40" y="85" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="34" font-weight="700" text-anchor="start">Capital enters, risk stays connected</text><text data-panel="broadcom-en-01-frame" x="40" y="134" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="start">26 October 2026 announcement · simplified structure</text><rect id="broadcom-en-01-card-6" x="40" y="185" width="430" height="110" rx="7" fill="var(--color-surface-2)"/><text data-panel="broadcom-en-01-card-6" x="56" y="218" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="25" font-weight="700" text-anchor="start">Bank of America · Citi</text><text data-panel="broadcom-en-01-card-6" x="56" y="250" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="25" font-weight="700" text-anchor="start">Morgan Stanley</text><text data-panel="broa