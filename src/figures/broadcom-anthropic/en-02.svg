<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="broadcom-en-02-title broadcom-en-02-desc" style="width:100%;height:auto" class="l0g-broadcom-svg"><title id="broadcom-en-02-title">Resale determines the backstop call</title><desc id="broadcom-en-02-desc">Teaching illustration of the default-and-sale branch. For 100 units of outstanding lease obligations, G=max(0,72.5−V). Resale values 30,60 and 90 imply 42.5,12.5 and 0 units of support. Other remedies and the creditor waterfall are outside the model.</desc><rect id="broadcom-en-02-frame" x="0" y="0" width="1000" height="680" rx="0" fill="var(--color-ink)"/><text data-panel="broadcom-en-02-frame" x="40" y="34" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="24" font-weight="700" text-anchor="start">l0g / BROADCOM</text><text data-panel="broadcom-en-02-frame" x="960" y="34" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="end">02</text><text data-panel="broadcom-en-02-frame" x="40" y="85" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="34" font-weight="700" text-anchor="start">Resale determines the backstop call</text><text data-panel="broadcom-en-02-frame" x="40" y="134" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="start">Default then sale · hypothetical lease balance L = 100 units</text><text data-panel="broadcom-en-02-frame" x="40" y="218" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="30" font-weight="700" text-anchor="start">G = max(0, 0.725 × L − V)</text><text data-panel="broadcom-en-02-frame" x="90" y="270" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="start">Support G · units</text><line x1="90" y1="530" x2="650" y2="530" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="broadcom-en-02-frame" x="78" y="536" fill="var(--color-muted)" font-family=