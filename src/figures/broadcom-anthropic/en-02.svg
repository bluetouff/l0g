upport-curve" data-metric="support-rate" data-value="0.725" d="M90 330.625 L496 530 L650 530" fill="none" stroke="var(--color-signal)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><line x1="496" y1="310" x2="496" y2="530" stroke="var(--color-amber)" stroke-width="2" stroke-dasharray="6 5"/><text data-panel="broadcom-en-02-frame" x="504" y="294" fill="var(--color-amber)" font-family="l0g Broadcom" font-size="24" font-weight="700" text-anchor="start">72.5</text><circle cx="258" cy="413.125" r="5" fill="var(--color-amber)"/><circle cx="426" cy="495.625" r="5" fill="var(--color-amber)"/><circle cx="594" cy="530" r="5" fill="var(--color-amber)"/><text data-panel="broadcom-en-02-frame" x="370" y="600" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="middle">Sale value V · units</text><rect id="broadcom-en-02-card-30" x="720" y="300" width="240" height="75" rx="7" fill="var(--color-surface-2)"/><text data-panel="broadcom-en-02-card-30" x="735" y="326" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="start">V = 30</text><text data-panel="broadcom-en-02-card-30" x="945" y="361" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="28" font-weight="700" text-anchor="end">G = 42.5</text><rect id="broadcom-en-02-card-33" x="720" y="395" width="240" height="75" rx="7" fill="var(--color-surface-2)"/><text data-panel="broadcom-en-02-card-33" x="735" y="421" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="start">V = 60</text><text data-panel="broadcom-en-02-card-33" x="945" y="456" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="28" font-weight="700" text-anchor="end">G = 12.5</text><rect id="broadcom-en-02-card-36" x="720" y="490" width="240" height="75" rx="7" fill="var(--color-surface-2)"/><text data-panel="broadcom-en-02-card-36" x="735" y="516" fill="var(--color-muted)" font-family