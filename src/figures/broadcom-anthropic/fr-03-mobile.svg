<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1080" role="img" aria-labelledby="broadcom-fr-03-m-title broadcom-fr-03-m-desc" style="width:100%;height:auto" class="l0g-broadcom-svg"><title id="broadcom-fr-03-m-title">Le loyer peut précéder le service</title><desc id="broadcom-fr-03-m-desc">Dans le parcours habituel, la mise en service déclenche le bail. Certaines circonstances contractuelles de retard peuvent démarrer le loyer avant le service. L’émission de notes est exclue avant mise en service et pour la première échéance trimestrielle. Les délais exacts sont occultés; aucun retard réel n’est présumé.</desc><rect id="broadcom-fr-03-m-frame" x="0" y="0" width="420" height="1080" rx="0" fill="var(--color-ink)"/><text data-panel="broadcom-fr-03-m-frame" x="20" y="32" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="20" font-weight="700" text-anchor="start">l0g / BROADCOM</text><text data-panel="broadcom-fr-03-m-frame" x="400" y="32" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="20" font-weight="400" text-anchor="end">03</text><text data-panel="broadcom-fr-03-m-frame" x="20" y="80" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="29" font-weight="700" text-anchor="start">Le loyer peut précéder</text><text data-panel="broadcom-fr-03-m-frame" x="20" y="116" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="29" font-weight="700" text-anchor="start">le service</text><text data-panel="broadcom-fr-03-m-frame" x="20" y="155" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="18" font-weight="400" text-anchor="start">Contrats du 31 mars 2026 · séquences</text><text data-panel="broadcom-fr-03-m-frame" x="20" y="180" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="18" font-weight="400" text-anchor="start">qualitatives</text><text data-panel="broadcom-fr-03-m-frame" x="20" y="210" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="22" font-weight="700" text-anchor="start">Parcours habituel</text><rect id="broadcom-fr-03-m-card-9" x="20" y="245" width="380" height="82" rx="7" fill="var(--color-surface-2)"/><text data-panel="broadcom-fr-03-m-card-9" x="36" y="275" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="22" font-weight="700" text-anchor="start">Prêt à fonctionner</text><text data-panel="broadcom-fr-03-m-card-9" x="36" y="306" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="18" font-weight="400" text-anchor="start">Installation et tests validés.</text><path data-connector="sequence-0-0" d="M210 331 L210 343" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M206.047503 337.222651 L210 343 L213.952497 337.222651" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect id="broadcom-fr-03-m-card-14" x="20" y="350" width="380" height="82" rx="7" fill="var(--color-surface-2)"/><text data-panel="broadcom-fr-03-m-card-14" x="36" y="380" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="22" font-weight="700" text-anchor="start">Début du bail</text><text data-panel="broadcom-fr-03-m-card-14" x="36" y="411" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="18" font-weight="400" text-anchor="start">Le calendrier des loyers débute.</text><path data-connector="sequence-0-1" d="M210 436 L210 448" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M206.047503 442.222651 L210 448 L213.952497 442.222651" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect id="broadcom-fr-03-m-card-19" x="20" y="455" width="380" height="82" rx="7" fill="var(--color-surface-2)"/><text data-panel="broadcom-fr-03-m-card-19" x="36" y="485" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="22" font-weight="700" text-anchor="start">Première échéance</text><text data-panel="broadcom-fr-03-m-card-19" x="36" y="516" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="18" font-weight="400" text-anchor="start">Échéance exclue des notes.</text><text data-panel="broadcom-fr-03-m-frame" x="20" y="590" fill="var(--color-amber)" font-family="l0g Broadcom" font-size="22" font-weight="700" text-anchor="start">Retard prévu au contrat</text><rect id="broadcom-fr-03-m-card-23" x="20" y="625" width="380" height="82" rx="7" fill="var(--color-surface-2)"/><text data-panel="broadcom-fr-03-m-card-23" x="36" y="655" fill="var(--color-amber)" font-family="l0g Broadcom" font-size="22" font-weight="700" text-anchor="start">Retard prévu</text><text data-panel="broadcom-fr-03-m-card-23" x="36" y="686" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="18" font-weight="400" text-anchor="start">Site ou installation en retard.</text><path data-connector="sequence-1-0" d="M210 711 L210 723" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M206.047503 717.222651 L210 723 L213.952497 717.222651" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect id="broadcom-fr-03-m-card-28" x="20" y="730" width="380" height="82" rx="7" fill="var(--color-surface-2)"/><text data-panel="broadcom-fr-03-m-card-28" x="36" y="760" fill="var(--color-amber)" font-family="l0g Broadcom" font-size="22" font-weight="700" text-anchor="start">Début anticipé</text><text data-panel="broadcom-fr-03-m-card-28" x="36" y="791" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="18" font-weight="400" text-anchor="start">Loyer possible avant service.</text><path data-connector="sequence-1-1" d="M210 816 L210 828" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M206.047503 822.222651 L210 828 L213.952497 822.222651" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect id="broadcom-fr-03-m-card-33" x="20" y="835" width="380" height="82" rx="7" fill="var(--color-surface-2)"/><text data-panel="broadcom-fr-03-m-card-33" x="36" y="865" fill="var(--color-amber)" font-family="l0g Broadcom" font-size="22" font-weight="700" text-anchor="start">Cash intermédiaire</text><text data-panel="broadcom-fr-03-m-card-33" x="36" y="896" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="18" font-weight="400" text-anchor="start">Notes fermées avant service.</text><text data-panel="broadcom-fr-03-m-frame" x="20" y="945" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="19" font-weight="700" text-anchor="start">Après service et première</text><text data-panel="broadcom-fr-03-m-frame" x="20" y="970" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="19" font-weight="700" text-anchor="start">échéance : notes accessibles sous</text><text data-panel="broadcom-fr-03-m-frame" x="20" y="995" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="19" font-weight="700" text-anchor="start">conditions.</text><text data-panel="broadcom-fr-03-m-frame" x="20" y="1020" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="18" font-weight="400" text-anchor="start">[3, 4, 5] · délais occultés ; possibilité</text><text data-panel="broadcom-fr-03-m-frame" x="20" y="1045" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="18" font-weight="400" text-anchor="start">contractuelle.</text></svg>