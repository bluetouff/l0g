<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1080" role="img" aria-labelledby="broadcom-fr-04-m-title broadcom-fr-04-m-desc" style="width:100%;height:auto" class="l0g-broadcom-svg"><title id="broadcom-fr-04-m-title">Un loyer réglé contre une créance</title><desc id="broadcom-fr-04-m-desc">L’engagement de principal de 42 milliards de dollars est soumis à conditions. Anthropic émet une note acceptée par Broadcom; la compensation règle une obligation de services intragroupe puis un loyer éligible. Broadcom conserve une créance convertible. La chaîne finale de règlement du véhicule d’octobre reste partiellement inconnue.</desc><rect id="broadcom-fr-04-m-frame" x="0" y="0" width="420" height="1080" rx="0" fill="var(--color-ink)"/><text data-panel="broadcom-fr-04-m-frame" x="20" y="32" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="20" font-weight="700" text-anchor="start">l0g / BROADCOM</text><text data-panel="broadcom-fr-04-m-frame" x="400" y="32" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="20" font-weight="400" text-anchor="end">04</text><text data-panel="broadcom-fr-04-m-frame" x="20" y="80" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="29" font-weight="700" text-anchor="start">Un loyer réglé contre</text><text data-panel="broadcom-fr-04-m-frame" x="20" y="116" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="29" font-weight="700" text-anchor="start">une créance</text><text data-panel="broadcom-fr-04-m-frame" x="20" y="155" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="18" font-weight="400" text-anchor="start">Accord de mars 2026 · compensation</text><text data-panel="broadcom-fr-04-m-frame" x="20" y="180" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="18" font-weight="400" text-anchor="start">contractuelle</text><text data-panel="broadcom-fr-04-m-frame" x="20" y="235" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="37" font-weight="700" text-anchor="start">42 Md$</text><text data-panel="broadcom-fr-04-m-frame" x="20" y="280" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="20" font-weight="700" text-anchor="start">Plafond de principal, sous</text><text data-panel="broadcom-fr-04-m-frame" x="20" y="306" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="20" font-weight="700" text-anchor="start">conditions</text><rect id="broadcom-fr-04-m-card-11" x="20" y="335" width="380" height="120" rx="7" fill="var(--color-surface-2)"/><text data-panel="broadcom-fr-04-m-card-11" x="36" y="368" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="23" font-weight="700" text-anchor="start">01 · Anthropic</text><text data-panel="broadcom-fr-04-m-card-11" x="36" y="405" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="19" font-weight="400" text-anchor="start">Émet la note convertible.</text><path data-connector="setoff-0" d="M210 459 L210 478" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M206.047503 472.222651 L210 478 L213.952497 472.222651" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect id="broadcom-fr-04-m-card-16" x="20" y="485" width="380" height="120" rx="7" fill="var(--color-surface-2)"/><text data-panel="broadcom-fr-04-m-card-16" x="36" y="518" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="23" font-weight="700" text-anchor="start">02 · OpCo II</text><text data-panel="broadcom-fr-04-m-card-16" x="36" y="555" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="19" font-weight="400" text-anchor="start">Services intragroupe réglés.</text><path data-connector="setoff-1" d="M210 609 L210 628" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M206.047503 622.222651 L210 628 L213.952497 622.222651" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect id="broadcom-fr-04-m-card-21" x="20" y="635" width="380" height="120" rx="7" fill="var(--color-surface-2)"/><text data-panel="broadcom-fr-04-m-card-21" x="36" y="668" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="23" font-weight="700" text-anchor="start">03 · Loyer</text><text data-panel="broadcom-fr-04-m-card-21" x="36" y="705" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="19" font-weight="400" text-anchor="start">Compensation du loyer.</text><rect id="broadcom-fr-04-m-card-24" x="20" y="805" width="380" height="120" rx="7" fill="var(--color-surface-2)"/><text data-panel="broadcom-fr-04-m-card-24" x="36" y="838" fill="var(--color-amber)" font-family="l0g Broadcom" font-size="23" font-weight="700" text-anchor="start">Créance de Broadcom</text><text data-panel="broadcom-fr-04-m-card-24" x="36" y="875" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="19" font-weight="400" text-anchor="start">Dette à rembourser ou à convertir.</text><text data-panel="broadcom-fr-04-m-frame" x="20" y="965" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="19" font-weight="400" text-anchor="start">Circuit final du SPV d’octobre encore à</text><text data-panel="broadcom-fr-04-m-frame" x="20" y="990" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="19" font-weight="400" text-anchor="start">documenter.</text><text data-panel="broadcom-fr-04-m-frame" x="20" y="1020" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="18" font-weight="400" text-anchor="start">[3] · compensation ; aucun versement de</text><text data-panel="broadcom-fr-04-m-frame" x="20" y="1045" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="18" font-weight="400" text-anchor="start">cash à Anthropic.</text></svg>