<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="broadcom-en-06-title broadcom-en-06-desc" style="width:100%;height:auto" class="l0g-broadcom-svg"><title id="broadcom-en-06-title">One shock reaches several protections</title><desc id="broadcom-en-06-desc">Hypothetical stress on AI profitability can weaken Anthropic rent payments, equipment resale and Broadcom business together. Own liquidity, reuse and supplier resources can mitigate risk. These protections require joint testing; no observed correlation or probability is estimated.</desc><rect id="broadcom-en-06-frame" x="0" y="0" width="1000" height="680" rx="0" fill="var(--color-ink)"/><text data-panel="broadcom-en-06-frame" x="40" y="34" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="24" font-weight="700" text-anchor="start">l0g / BROADCOM</text><text data-panel="broadcom-en-06-frame" x="960" y="34" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="end">06</text><text data-panel="broadcom-en-06-frame" x="40" y="85" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="34" font-weight="700" text-anchor="start">One shock reaches several protections</text><text data-panel="broadcom-en-06-frame" x="40" y="134" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="start">Correlated risks · hypothetical scenario</text><rect id="broadcom-en-06-card-6" x="260" y="185" width="480" height="105" rx="7" fill="var(--color-surface-2)"/><text data-panel="broadcom-en-06-card-6" x="276" y="218" fill="var(--color-accent)" font-family="l0g Broadcom" font-size="26" font-weight="700" text-anchor="start">AI stress</text><text data-panel="broadcom-en-06-card-6" x="276" y="261" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="start">Profitability under strain</text><path data-connector="common-stress" d="M500 295 L500 335 L170 335" fill="none" stroke="var(--color-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path data-connector="stress-branches" d="M500 335 L830 335" fill="none" stroke="var(--color-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect id="broadcom-en-06-card-11" x="40" y="380" width="260" height="150" rx="7" fill="var(--color-surface-2)"/><text data-panel="broadcom-en-06-card-11" x="56" y="414" fill="var(--color-accent)" font-family="l0g Broadcom" font-size="27" font-weight="700" text-anchor="start">Anthropic</text><text data-panel="broadcom-en-06-card-11" x="56" y="456" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="start">Rent under strain</text><text data-panel="broadcom-en-06-card-11" x="56" y="504" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="start">Own liquidity</text><path data-connector="risk-0" d="M170 335 L170 373" fill="none" stroke="var(--color-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M164.918218 365.571979 L170 373 L175.081782 365.571979" fill="none" stroke="var(--color-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect id="broadcom-en-06-card-17" x="370" y="380" width="260" height="150" rx="7" fill="var(--color-surface-2)"/><text data-panel="broadcom-en-06-card-17" x="386" y="414" fill="var(--color-accent)" font-family="l0g Broadcom" font-size="27" font-weight="700" text-anchor="start">Equipment</text><text data-panel="broadcom-en-06-card-17" x="386" y="456" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="start">Weaker resale</text><text data-panel="broadcom-en-06-card-17" x="386" y="504" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="start">Reuse and rights</text><path data-connector="risk-1" d="M500 335 L500 373" fill="none" stroke="var(--color-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.918218 365.571979 L500 373 L505.081782 365.571979" fill="none" stroke="var(--color-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect id="broadcom-en-06-card-23" x="700" y="380" width="260" height="150" rx="7" fill="var(--color-surface-2)"/><text data-panel="broadcom-en-06-card-23" x="716" y="414" fill="var(--color-accent)" font-family="l0g Broadcom" font-size="27" font-weight="700" text-anchor="start">Broadcom</text><text data-panel="broadcom-en-06-card-23" x="716" y="456" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="start">Sales and support</text><text data-panel="broadcom-en-06-card-23" x="716" y="504" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="start">Cash and reuse</text><path data-connector="risk-2" d="M830 335 L830 373" fill="none" stroke="var(--color-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M824.918218 365.571979 L830 373 L835.081782 365.571979" fill="none" stroke="var(--color-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="broadcom-en-06-frame" x="40" y="588" fill="var(--color-amber)" font-family="l0g Broadcom" font-size="28" font-weight="700" text-anchor="start">Test the protections together</text><text data-panel="broadcom-en-06-frame" x="40" y="638" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="start">[2, 3, 4, 5, 8] · scenario; no probability estimated.</text></svg>