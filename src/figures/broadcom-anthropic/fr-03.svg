<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="broadcom-fr-03-title broadcom-fr-03-desc" style="width:100%;height:auto" class="l0g-broadcom-svg"><title id="broadcom-fr-03-title">Le loyer peut précéder le service</title><desc id="broadcom-fr-03-desc">Dans le parcours habituel, la mise en service déclenche le bail. Certaines circonstances contractuelles de retard peuvent démarrer le loyer avant le service. L’émission de notes est exclue avant mise en service et pour la première échéance trimestrielle. Les délais exacts sont occultés; aucun retard réel n’est présumé.</desc><rect id="broadcom-fr-03-frame" x="0" y="0" width="1000" height="680" rx="0" fill="var(--color-ink)"/><text data-panel="broadcom-fr-03-frame" x="40" y="34" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="24" font-weight="700" text-anchor="start">l0g / BROADCOM</text><text data-panel="broadcom-fr-03-frame" x="960" y="34" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="end">03</text><text data-panel="broadcom-fr-03-frame" x="40" y="85" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="34" font-weight="700" text-anchor="start">Le loyer peut précéder le service</text><text data-panel="broadcom-fr-03-frame" x="40" y="134" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="start">Contrats du 31 mars 2026 · séquences qualitatives</text><text data-panel="broadcom-fr-03-frame" x="40" y="190" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="27" font-weight="700" text-anchor="start">Parcours habituel</text><rect id="broadcom-fr-03-card-7" x="40" y="225" width="440" height="90" rx="7" fill="var(--color-surface-2)"/><text data-panel="broadcom-fr-03-card-7" x="56" y="255" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="25" font-weight="700" text-anchor="start">Prêt à fonctionner</text><text data-panel="broadcom-fr-03-card-7" x="56" y="286" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="start">Installation et tests validés.</text><path data-connector="sequence-0-0" d="M260 319 L260 333" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M254.918218 325.571979 L260 333 L265.081782 325.571979" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect id="broadcom-fr-03-card-12" x="40" y="340" width="440" height="90" rx="7" fill="var(--color-surface-2)"/><text data-panel="broadcom-fr-03-card-12" x="56" y="370" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="25" font-weight="700" text-anchor="start">Début du bail</text><text data-panel="broadcom-fr-03-card-12" x="56" y="401" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="start">Le calendrier des loyers débute.</text><path data-connector="sequence-0-1" d="M260 434 L260 448" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M254.918218 440.571979 L260 448 L265.081782 440.571979" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect id="broadcom-fr-03-card-17" x="40" y="455" width="440" height="90" rx="7" fill="var(--color-surface-2)"/><text data-panel="broadcom-fr-03-card-17" x="56" y="485" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="25" font-weight="700" text-anchor="start">Première échéance</text><text data-panel="broadcom-fr-03-card-17" x="56" y="516" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="start">Échéance exclue des notes.</text><text data-panel="broadcom-fr-03-frame" x="520" y="190" fill="var(--color-amber)" font-family="l0g Broadcom" font-size="27" font-weight="700" text-anchor="start">Retard prévu au contrat</text><rect id="broadcom-fr-03-card-21" x="520" y="225" width="440" height="90" rx="7" fill="var(--color-surface-2)"/><text data-panel="broadcom-fr-03-card-21" x="536" y="255" fill="var(--color-amber)" font-family="l0g Broadcom" font-size="25" font-weight="700" text-anchor="start">Retard prévu</text><text data-panel="broadcom-fr-03-card-21" x="536" y="286" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="start">Site ou installation en retard.</text><path data-connector="sequence-1-0" d="M740 319 L740 333" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M734.918218 325.571979 L740 333 L745.081782 325.571979" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect id="broadcom-fr-03-card-26" x="520" y="340" width="440" height="90" rx="7" fill="var(--color-surface-2)"/><text data-panel="broadcom-fr-03-card-26" x="536" y="370" fill="var(--color-amber)" font-family="l0g Broadcom" font-size="25" font-weight="700" text-anchor="start">Début anticipé</text><text data-panel="broadcom-fr-03-card-26" x="536" y="401" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="start">Loyer possible avant service.</text><path data-connector="sequence-1-1" d="M740 434 L740 448" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M734.918218 440.571979 L740 448 L745.081782 440.571979" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect id="broadcom-fr-03-card-31" x="520" y="455" width="440" height="90" rx="7" fill="var(--color-surface-2)"/><text data-panel="broadcom-fr-03-card-31" x="536" y="485" fill="var(--color-amber)" font-family="l0g Broadcom" font-size="25" font-weight="700" text-anchor="start">Cash intermédiaire</text><text data-panel="broadcom-fr-03-card-31" x="536" y="516" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="start">Notes fermées avant service.</text><text data-panel="broadcom-fr-03-frame" x="40" y="580" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="24" font-weight="700" text-anchor="start">Après service et première échéance : notes accessibles sous</text><text data-panel="broadcom-fr-03-frame" x="40" y="610" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="24" font-weight="700" text-anchor="start">conditions.</text><text data-panel="broadcom-fr-03-frame" x="40" y="638" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="start">[3, 4, 5] · délais occultés ; possibilité contractuelle.</text></svg>