<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1080" role="img" aria-labelledby="broadcom-fr-06-m-title broadcom-fr-06-m-desc" style="width:100%;height:auto" class="l0g-broadcom-svg"><title id="broadcom-fr-06-m-title">Un choc atteint plusieurs protections</title><desc id="broadcom-fr-06-m-desc">Un stress hypothétique de rentabilité de l’IA peut fragiliser les loyers d’Anthropic, la revente des équipements et l’activité de Broadcom. Les ressources propres, le réemploi et la capacité du fournisseur peuvent atténuer les risques. Ces protections doivent être testées ensemble; aucune probabilité ou corrélation observée n’est estimée.</desc><rect id="broadcom-fr-06-m-frame" x="0" y="0" width="420" height="1080" rx="0" fill="var(--color-ink)"/><text data-panel="broadcom-fr-06-m-frame" x="20" y="32" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="20" font-weight="700" text-anchor="start">l0g / BROADCOM</text><text data-panel="broadcom-fr-06-m-frame" x="400" y="32" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="20" font-weight="400" text-anchor="end">06</text><text data-panel="broadcom-fr-06-m-frame" x="20" y="80" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="29" font-weight="700" text-anchor="start">Un choc atteint</text><text data-panel="broadcom-fr-06-m-frame" x="20" y="116" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="29" font-weight="700" text-anchor="start">plusieurs protections</text><text data-panel="broadcom-fr-06-m-frame" x="20" y="155" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="18" font-weight="400" text-anchor="start">Risques corrélés · scénario hypothétique</text><rect id="broadcom-fr-06-m-card-7" x="20" y="210" width="380" height="95" rx="7" fill="var(--color-surface-2)"/><text data-panel="broadcom-fr-06-m-card-7" x="36" y="243" fill="var(--color-accent)" font-family="l0g Broadcom" font-size="23" font-weight="700" text-anchor="start">Stress sur l’IA</text><text data-panel="broadcom-fr-06-m-card-7" x="36" y="280" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="19" font-weight="400" text-anchor="start">Rentabilité fragilisée</text><path data-connector="common-stress" d="M210 310 L9 310 L9 855" fill="none" stroke="var(--color-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect id="broadcom-fr-06-m-card-11" x="20" y="350" width="380" height="155" rx="7" fill="var(--color-surface-2)"/><text data-panel="broadcom-fr-06-m-card-11" x="36" y="384" fill="var(--color-accent)" font-family="l0g Broadcom" font-size="26" font-weight="700" text-anchor="start">Anthropic</text><text data-panel="broadcom-fr-06-m-card-11" x="36" y="426" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="21" font-weight="400" text-anchor="start">Loyers fragilisés</text><text data-panel="broadcom-fr-06-m-card-11" x="36" y="473" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="19" font-weight="400" text-anchor="start">Liquidités</text><path data-connector="risk-0" d="M9 390 L16 390" fill="none" stroke="var(--color-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.222651 393.952497 L16 390 L10.222651 386.047503" fill="none" stroke="var(--color-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect id="broadcom-fr-06-m-card-17" x="20" y="550" width="380" height="155" rx="7" fill="var(--color-surface-2)"/><text data-panel="broadcom-fr-06-m-card-17" x="36" y="584" fill="var(--color-accent)" font-family="l0g Broadcom" font-size="26" font-weight="700" text-anchor="start">Équipements</text><text data-panel="broadcom-fr-06-m-card-17" x="36" y="626" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="21" font-weight="400" text-anchor="start">Revente fragilisée</text><text data-panel="broadcom-fr-06-m-card-17" x="36" y="673" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="19" font-weight="400" text-anchor="start">Réemploi autorisé</text><path data-connector="risk-1" d="M9 590 L16 590" fill="none" stroke="var(--color-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.222651 593.952497 L16 590 L10.222651 586.047503" fill="none" stroke="var(--color-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect id="broadcom-fr-06-m-card-23" x="20" y="750" width="380" height="155" rx="7" fill="var(--color-surface-2)"/><text data-panel="broadcom-fr-06-m-card-23" x="36" y="784" fill="var(--color-accent)" font-family="l0g Broadcom" font-size="26" font-weight="700" text-anchor="start">Broadcom</text><text data-panel="broadcom-fr-06-m-card-23" x="36" y="826" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="21" font-weight="400" text-anchor="start">Ventes et soutien</text><text data-panel="broadcom-fr-06-m-card-23" x="36" y="873" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="19" font-weight="400" text-anchor="start">Cash et réemploi</text><path data-connector="risk-2" d="M9 790 L16 790" fill="none" stroke="var(--color-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.222651 793.952497 L16 790 L10.222651 786.047503" fill="none" stroke="var(--color-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="broadcom-fr-06-m-frame" x="20" y="962" fill="var(--color-amber)" font-family="l0g Broadcom" font-size="22" font-weight="700" text-anchor="start">Des protections à éprouver</text><text data-panel="broadcom-fr-06-m-frame" x="20" y="990" fill="var(--color-amber)" font-family="l0g Broadcom" font-size="22" font-weight="700" text-anchor="start">ensemble</text><text data-panel="broadcom-fr-06-m-frame" x="20" y="1020" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="18" font-weight="400" text-anchor="start">[2, 3, 4, 5, 8] · scénario ; aucune</text><text data-panel="broadcom-fr-06-m-frame" x="20" y="1045" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="18" font-weight="400" text-anchor="start">probabilité estimée.</text></svg>