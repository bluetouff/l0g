xt><path data-connector="support-curve" data-metric="support-rate" data-value="0.725" d="M70 378.125 L298.375 650 L385 650" fill="none" stroke="var(--color-signal)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><line x1="298.375" y1="350" x2="298.375" y2="650" stroke="var(--color-amber)" stroke-width="2" stroke-dasharray="6 5"/><text data-panel="broadcom-fr-02-m-frame" x="306.375" y="334" fill="var(--color-amber)" font-family="l0g Broadcom" font-size="19" font-weight="700" text-anchor="start">72,5</text><circle cx="164.5" cy="490.625" r="5" fill="var(--color-amber)"/><circle cx="259" cy="603.125" r="5" fill="var(--color-amber)"/><circle cx="353.5" cy="650" r="5" fill="var(--color-amber)"/><text data-panel="broadcom-fr-02-m-frame" x="227.5" y="724" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="19" font-weight="400" text-anchor="middle">Valeur de vente V · unités</text><rect id="broadcom-fr-02-m-card-30" x="20" y="770" width="380" height="52" rx="7" fill="var(--color-surface-2)"/><text data-panel="broadcom-fr-02-m-card-30" x="35" y="804" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="21" font-weight="400" text-anchor="start">V = 30</text><text data-panel="broadcom-fr-02-m-card-30" x="385" y="804" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="24" font-weight="700" text-anchor="end">G = 42,5</text><rect id="broadcom-fr-02-m-card-33" x="20" y="835" width="380" height="52" rx="7" fill="var(--color-surface-2)"/><text data-panel="broadcom-fr-02-m-card-33" x="35" y="869" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="21" font-weight="400" text-anchor="start">V = 60</text><text data-panel="broadcom-fr-02-m-card-33" x="385" y="869" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="24" font-weight="700" text-anchor="end">G = 12,5</text><rect id="broadcom-fr-02-m-card-36" x="20" y="900" width="380" height="52" rx="7" fill="var(--color-surface-2)"/><text data-panel="broadcom-f