<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1080" role="img" aria-labelledby="broadcom-fr-02-m-title broadcom-fr-02-m-desc" style="width:100%;height:auto" class="l0g-broadcom-svg"><title id="broadcom-fr-02-m-title">La revente détermine le soutien</title><desc id="broadcom-fr-02-m-desc">Branche pédagogique du défaut suivi de cession. Pour 100 unités restant dues sur les baux, G=max(0;72,5−V). Des valeurs de revente 30,60 et 90 produisent 42,5,12,5 et 0 unités de soutien. Les autres recours et la cascade des créanciers restent hors du modèle.</desc><rect id="broadcom-fr-02-m-frame" x="0" y="0" width="420" height="1080" rx="0" fill="var(--color-ink)"/><text data-panel="broadcom-fr-02-m-frame" x="20" y="32" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="20" font-weight="700" text-anchor="start">l0g / BROADCOM</text><text data-panel="broadcom-fr-02-m-frame" x="400" y="32" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="20" font-weight="400" text-anchor="end">02</text><text data-panel="broadcom-fr-02-m-frame" x="20" y="80" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="29" font-weight="700" text-anchor="start">La revente détermine</text><text data-panel="broadcom-fr-02-m-frame" x="20" y="116" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="29" font-weight="700" text-anchor="start">le soutien</text><text data-panel="broadcom-fr-02-m-frame" x="20" y="155" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="18" font-weight="400" text-anchor="start">Défaut puis cession · solde fictif L = 100</text><text data-panel="broadcom-fr-02-m-frame" x="20" y="180" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="18" font-weight="400" text-anchor="start">unités</text><text data-panel="broadcom-fr-02-m-frame" x="20" y="240" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="23" font-weight="700" text-anchor="start">G = max(0 ; 0,725 × L − V)</text><text data-panel="broa