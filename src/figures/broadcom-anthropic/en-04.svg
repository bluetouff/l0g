<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="broadcom-en-04-title broadcom-en-04-desc" style="width:100%;height:auto" class="l0g-broadcom-svg"><title id="broadcom-en-04-title">Rent settled against a debt claim</title><desc id="broadcom-en-04-desc">The 42 billion-dollar principal commitment is conditional. Anthropic issues a note accepted by Broadcom; set-off settles an intercompany service obligation and then eligible rent. Broadcom retains a convertible claim. The October SPV’s final settlement chain remains partly undisclosed.</desc><rect id="broadcom-en-04-frame" x="0" y="0" width="1000" height="680" rx="0" fill="var(--color-ink)"/><text data-panel="broadcom-en-04-frame" x="40" y="34" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="24" font-weight="700" text-anchor="start">l0g / BROADCOM</text><text data-panel="broadcom-en-04-frame" x="960" y="34" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="end">04</text><text data-panel="broadcom-en-04-frame" x="40" y="85" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="34" font-weight="700" text-anchor="start">Rent settled against a debt claim</text><text data-panel="broadcom-en-04-frame" x="40" y="134" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="start">March 2026 agreement · contractual set-off</text><text data-panel="broadcom-en-04-frame" x="40" y="223" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="43" font-weight="700" text-anchor="start">$42bn</text><text data-panel="broadcom-en-04-frame" x="300" y="205" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="27" font-weight="700" text-anchor="start">Conditional principal commitment</text><rect id="broadcom-en-04-card-8" x="40" y="310" width="280" height="135" rx="7" fill="var(--color-surface-2)"/><text data-panel="broadcom-en-04-card-8" x="56" y="343" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="26" font-weight="700" text-anchor="start">01 · Anthropic</text><text data-panel="broadcom-en-04-card-8" x="56" y="386" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="start">Issues the</text><text data-panel="broadcom-en-04-card-8" x="56" y="416" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="start">convertible note.</text><path data-connector="setoff-0" d="M324 378 L354 378" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M346.571979 383.081782 L354 378 L346.571979 372.918218" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect id="broadcom-en-04-card-14" x="360" y="310" width="280" height="135" rx="7" fill="var(--color-surface-2)"/><text data-panel="broadcom-en-04-card-14" x="376" y="343" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="26" font-weight="700" text-anchor="start">02 · OpCo II</text><text data-panel="broadcom-en-04-card-14" x="376" y="386" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="start">Intercompany</text><text data-panel="broadcom-en-04-card-14" x="376" y="416" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="start">services settled.</text><path data-connector="setoff-1" d="M644 378 L674 378" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M666.571979 383.081782 L674 378 L666.571979 372.918218" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect id="broadcom-en-04-card-20" x="680" y="310" width="280" height="135" rx="7" fill="var(--color-surface-2)"/><text data-panel="broadcom-en-04-card-20" x="696" y="343" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="26" font-weight="700" text-anchor="start">03 · Rent</text><text data-panel="broadcom-en-04-card-20" x="696" y="386" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="start">Set-off settles the</text><text data-panel="broadcom-en-04-card-20" x="696" y="416" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="start">rent.</text><rect id="broadcom-en-04-card-24" x="40" y="480" width="920" height="100" rx="7" fill="var(--color-surface-2)"/><text data-panel="broadcom-en-04-card-24" x="56" y="513" fill="var(--color-amber)" font-family="l0g Broadcom" font-size="28" font-weight="700" text-anchor="start">Broadcom holds the claim</text><text data-panel="broadcom-en-04-card-24" x="56" y="556" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="start">Debt to repay or convert.</text><text data-panel="broadcom-en-04-frame" x="40" y="610" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="start">The October SPV settlement chain remains partly undocumented.</text><text data-panel="broadcom-en-04-frame" x="40" y="650" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="start">[3] · set-off; no cash advanced to Anthropic under a note.</text></svg>