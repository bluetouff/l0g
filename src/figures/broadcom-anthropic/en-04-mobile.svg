<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1080" role="img" aria-labelledby="broadcom-en-04-m-title broadcom-en-04-m-desc" style="width:100%;height:auto" class="l0g-broadcom-svg"><title id="broadcom-en-04-m-title">Rent settled against a debt claim</title><desc id="broadcom-en-04-m-desc">The 42 billion-dollar principal commitment is conditional. Anthropic issues a note accepted by Broadcom; set-off settles an intercompany service obligation and then eligible rent. Broadcom retains a convertible claim. The October SPV’s final settlement chain remains partly undisclosed.</desc><rect id="broadcom-en-04-m-frame" x="0" y="0" width="420" height="1080" rx="0" fill="var(--color-ink)"/><text data-panel="broadcom-en-04-m-frame" x="20" y="32" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="20" font-weight="700" text-anchor="start">l0g / BROADCOM</text><text data-panel="broadcom-en-04-m-frame" x="400" y="32" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="20" font-weight="400" text-anchor="end">04</text><text data-panel="broadcom-en-04-m-frame" x="20" y="80" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="29" font-weight="700" text-anchor="start">Rent settled against a</text><text data-panel="broadcom-en-04-m-frame" x="20" y="116" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="29" font-weight="700" text-anchor="start">debt claim</text><text data-panel="broadcom-en-04-m-frame" x="20" y="155" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="18" font-weight="400" text-anchor="start">March 2026 agreement · contractual</text><text data-panel="broadcom-en-04-m-frame" x="20" y="180" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="18" font-weight="400" text-anchor="start">set-off</text><text data-panel="broadcom-en-04-m-frame" x="20" y="235" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="37" font-weight="700" text-anchor="start">$42bn</text><text data-panel="broadcom-en-04-m-frame" x="20" y="280" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="20" font-weight="700" text-anchor="start">Conditional principal</text><text data-panel="broadcom-en-04-m-frame" x="20" y="306" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="20" font-weight="700" text-anchor="start">commitment</text><rect id="broadcom-en-04-m-card-11" x="20" y="335" width="380" height="120" rx="7" fill="var(--color-surface-2)"/><text data-panel="broadcom-en-04-m-card-11" x="36" y="368" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="23" font-weight="700" text-anchor="start">01 · Anthropic</text><text data-panel="broadcom-en-04-m-card-11" x="36" y="405" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="19" font-weight="400" text-anchor="start">Issues the convertible note.</text><path data-connector="setoff-0" d="M210 459 L210 478" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M206.047503 472.222651 L210 478 L213.952497 472.222651" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect id="broadcom-en-04-m-card-16" x="20" y="485" width="380" height="120" rx="7" fill="var(--color-surface-2)"/><text data-panel="broadcom-en-04-m-card-16" x="36" y="518" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="23" font-weight="700" text-anchor="start">02 · OpCo II</text><text data-panel="broadcom-en-04-m-card-16" x="36" y="555" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="19" font-weight="400" text-anchor="start">Intercompany services settled.</text><path data-connector="setoff-1" d="M210 609 L210 628" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M206.047503 622.222651 L210 628 L213.952497 622.222651" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect id="broadcom-en-04-m-card-21" x="20" y="635" width="380" height="120" rx="7" fill="var(--color-surface-2)"/><text data-panel="broadcom-en-04-m-card-21" x="36" y="668" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="23" font-weight="700" text-anchor="start">03 · Rent</text><text data-panel="broadcom-en-04-m-card-21" x="36" y="705" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="19" font-weight="400" text-anchor="start">Set-off settles the rent.</text><rect id="broadcom-en-04-m-card-24" x="20" y="805" width="380" height="120" rx="7" fill="var(--color-surface-2)"/><text data-panel="broadcom-en-04-m-card-24" x="36" y="838" fill="var(--color-amber)" font-family="l0g Broadcom" font-size="23" font-weight="700" text-anchor="start">Broadcom holds the claim</text><text data-panel="broadcom-en-04-m-card-24" x="36" y="875" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="19" font-weight="400" text-anchor="start">Debt to repay or convert.</text><text data-panel="broadcom-en-04-m-frame" x="20" y="965" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="19" font-weight="400" text-anchor="start">The October SPV settlement chain</text><text data-panel="broadcom-en-04-m-frame" x="20" y="990" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="19" font-weight="400" text-anchor="start">remains partly undocumented.</text><text data-panel="broadcom-en-04-m-frame" x="20" y="1020" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="18" font-weight="400" text-anchor="start">[3] · set-off; no cash advanced to</text><text data-panel="broadcom-en-04-m-frame" x="20" y="1045" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="18" font-weight="400" text-anchor="start">Anthropic under a note.</text></svg>