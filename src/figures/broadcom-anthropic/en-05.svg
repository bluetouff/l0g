<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="broadcom-en-05-title broadcom-en-05-desc" style="width:100%;height:auto" class="l0g-broadcom-svg"><title id="broadcom-en-05-title">Interest adds to the debt</title><desc id="broadcom-en-05-desc">100 hypothetical units over 5 years with no repayment or conversion. Using 20 equal quarters,9%annually gives 156.0509 units and 13%gives 189.5838. The 9%rate concerns notes issued before a defined Breach Period; 13%concerns notes issued during that period. This is a teaching approximation:the contract uses actual days over 365 and actual maturities differ by tranche.</desc><rect id="broadcom-en-05-frame" x="0" y="0" width="1000" height="680" rx="0" fill="var(--color-ink)"/><text data-panel="broadcom-en-05-frame" x="40" y="34" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="24" font-weight="700" text-anchor="start">l0g / BROADCOM</text><text data-panel="broadcom-en-05-frame" x="960" y="34" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="end">05</text><text data-panel="broadcom-en-05-frame" x="40" y="85" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="34" font-weight="700" text-anchor="start">Interest adds to the debt</text><text data-panel="broadcom-en-05-frame" x="40" y="134" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="start">Equal quarters · teaching scenario</text><text data-panel="broadcom-en-05-frame" x="40" y="210" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="27" font-weight="700" text-anchor="start">100 units · five years</text><text data-panel="broadcom-en-05-frame" x="90" y="250" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="24" font-weight="400" text-anchor="start">Amount owed · units</text><line x1="90" y1="540" x2="650" y2="540" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="bro