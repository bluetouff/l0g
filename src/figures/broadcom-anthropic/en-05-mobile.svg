<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1080" role="img" aria-labelledby="broadcom-en-05-m-title broadcom-en-05-m-desc" style="width:100%;height:auto" class="l0g-broadcom-svg"><title id="broadcom-en-05-m-title">Interest adds to the debt</title><desc id="broadcom-en-05-m-desc">100 hypothetical units over 5 years with no repayment or conversion. Using 20 equal quarters,9%annually gives 156.0509 units and 13%gives 189.5838. The 9%rate concerns notes issued before a defined Breach Period; 13%concerns notes issued during that period. This is a teaching approximation:the contract uses actual days over 365 and actual maturities differ by tranche.</desc><rect id="broadcom-en-05-m-frame" x="0" y="0" width="420" height="1080" rx="0" fill="var(--color-ink)"/><text data-panel="broadcom-en-05-m-frame" x="20" y="32" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="20" font-weight="700" text-anchor="start">l0g / BROADCOM</text><text data-panel="broadcom-en-05-m-frame" x="400" y="32" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="20" font-weight="400" text-anchor="end">05</text><text data-panel="broadcom-en-05-m-frame" x="20" y="80" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="29" font-weight="700" text-anchor="start">Interest adds to the</text><text data-panel="broadcom-en-05-m-frame" x="20" y="116" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="29" font-weight="700" text-anchor="start">debt</text><text data-panel="broadcom-en-05-m-frame" x="20" y="155" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="18" font-weight="400" text-anchor="start">Equal quarters · teaching scenario</text><text data-panel="broadcom-en-05-m-frame" x="20" y="236" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="23" font-weight="700" text-anchor="start">100 units · five years</text><text data-panel="broadcom-en-05-m-frame" x="70" y="300" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="19" font-weight="400" text-anchor="start">Amount owed · units</text><line x1="70" y1="630" x2="385" y2="630" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="broadcom-en-05-m-frame" x="58" y="636" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="18" font-weight="400" text-anchor="end">0</text><line x1="70" y1="558.571429" x2="385" y2="558.571429" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="broadcom-en-05-m-frame" x="58" y="564.571429" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="18" font-weight="400" text-anchor="end">50</text><line x1="70" y1="487.142857" x2="385" y2="487.142857" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="broadcom-en-05-m-frame" x="58" y="493.142857" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="18" font-weight="400" text-anchor="end">100</text><line x1="70" y1="415.714286" x2="385" y2="415.714286" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="broadcom-en-05-m-frame" x="58" y="421.714286" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="18" font-weight="400" text-anchor="end">150</text><line x1="70" y1="344.285714" x2="385" y2="344.285714" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="broadcom-en-05-m-frame" x="58" y="350.285714" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="18" font-weight="400" text-anchor="end">200</text><text data-panel="broadcom-en-05-m-frame" x="70" y="664" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="18" font-weight="400" text-anchor="middle">0</text><text data-panel="broadcom-en-05-m-frame" x="133" y="664" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="18" font-weight="400" text-anchor="middle">1</text><text data-panel="broadcom-en-05-m-frame" x="196" y="664" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="18" font-weight="400" text-anchor="middle">2</text><tex