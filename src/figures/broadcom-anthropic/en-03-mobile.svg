<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1080" role="img" aria-labelledby="broadcom-en-03-m-title broadcom-en-03-m-desc" style="width:100%;height:auto" class="l0g-broadcom-svg"><title id="broadcom-en-03-m-title">Rent can start before service</title><desc id="broadcom-en-03-m-desc">In the usual sequence, readiness starts the lease. Specified contractual delay circumstances can start rent before service. Notes cannot be issued before readiness or for the first quarterly instalment. Exact delay periods are redacted; no actual delay is assumed.</desc><rect id="broadcom-en-03-m-frame" x="0" y="0" width="420" height="1080" rx="0" fill="var(--color-ink)"/><text data-panel="broadcom-en-03-m-frame" x="20" y="32" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="20" font-weight="700" text-anchor="start">l0g / BROADCOM</text><text data-panel="broadcom-en-03-m-frame" x="400" y="32" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="20" font-weight="400" text-anchor="end">03</text><text data-panel="broadcom-en-03-m-frame" x="20" y="80" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="29" font-weight="700" text-anchor="start">Rent can start before</text><text data-panel="broadcom-en-03-m-frame" x="20" y="116" fill="var(--color-paper)" font-family="l0g Broadcom" font-size="29" font-weight="700" text-anchor="start">service</text><text data-panel="broadcom-en-03-m-frame" x="20" y="155" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="18" font-weight="400" text-anchor="start">31 March 2026 contracts · qualitative</text><text data-panel="broadcom-en-03-m-frame" x="20" y="180" fill="var(--color-muted)" font-family="l0g Broadcom" font-size="18" font-weight="400" text-anchor="start">sequences</text><text data-panel="broadcom-en-03-m-frame" x="20" y="210" fill="var(--color-signal)" font-family="l0g Broadcom" font-size="22" font-weight="700" text-anchor="start">Usual sequence</text><rect id="broadcom-en-03-m-card-9" 