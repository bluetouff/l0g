<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" style="width:100%;height:auto" class="l0g-ai-governance-svg" role="img" aria-labelledby="ai-governance-fr-openai-d-title ai-governance-fr-openai-d-desc"><title id="ai-governance-fr-openai-d-title">OpenAI : la décision de lancement</title><desc id="ai-governance-fr-openai-d-desc">La Fondation nomme et révoque le conseil du PBC. Son comité de sûreté et sécurité, le SSC, dispose d’une autorité d’approbation et peut suspendre une sortie. Le PBC fournit les informations et les ressources raisonnablement nécessaires. Certains changements structurels exigent un préavis de 21 jours auprès des autorités californienne et du Delaware.</desc>
