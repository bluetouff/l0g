<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1270" style="width:100%;height:auto" class="l0g-ai-governance-svg" role="img" aria-labelledby="ai-governance-en-rights-m-title ai-governance-en-rights-m-desc"><title id="ai-governance-en-rights-m-title">Rights attached to public ownership</title><desc id="ai-governance-en-rights-m-desc">Two historical agreements. In August 2025, Intel announced a 9.9% public equity arrangement including escrowed shares, with no board seat and votes generally aligned with the board. At U. S. Steel, one non-economic G share carries appointment of one director and presidential consent rights over specified decisions.</desc>
