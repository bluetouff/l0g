<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1280" style="width:100%;height:auto" class="l0g-ai-governance-svg" role="img" aria-labelledby="ai-governance-fr-anthropic-m-title ai-governance-fr-anthropic-m-desc"><title id="ai-governance-fr-anthropic-m-title">Anthropic : deux majorités</title><desc id="ai-governance-fr-anthropic-m-desc">Architecture prévue pour l’IPO. L’action F porte à elle seule 50,1 % des voix générales ; les actions A en portent 49,9 %, y compris les A détenues par les fondateurs. La classe T élit quatre des sept administrateurs ; les classes A et F en élisent trois. F et T sont sans participation économique ordinaire ; leur distribution de liquidation est plafonnée à la valeur nominale de 0,00001 dollar par action. Le S-1 nomme six administrateurs ; un des quatre sièges T autorisés est vacant.</desc>
