<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1230" style="width:100%;height:auto" class="l0g-ai-governance-svg" role="img" aria-labelledby="ai-governance-fr-courts-m-title ai-governance-fr-courts-m-desc"><title id="ai-governance-fr-courts-m-title">Anthropic et l’État : deux voies</title><desc id="ai-governance-fr-courts-m-desc">Après les directives et désignations de février et mars 2026, deux procédures distinctes suivent des bases légales différentes. Le 27 août, en Californie, les mesures larges sont jugées illégales. Le 25 septembre, la D.C. Circuit valide à deux voix contre une l’exclusion d’approvisionnement sous 41 USC §4713. Une demande de réexamen est déposée le 13 octobre.</desc>
