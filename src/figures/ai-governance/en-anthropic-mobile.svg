<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1280" style="width:100%;height:auto" class="l0g-ai-governance-svg" role="img" aria-labelledby="ai-governance-en-anthropic-m-title ai-governance-en-anthropic-m-desc"><title id="ai-governance-en-anthropic-m-title">Anthropic: two majorities</title><desc id="ai-governance-en-anthropic-m-desc">Proposed IPO architecture. Class F alone carries 50.1% of general votes; Class A carries 49.9%, including founders’ A shares. Class T elects four of seven directors; Classes A and F elect three. F and T have no ordinary economic participation; their liquidation distribution is capped at par value of $0.00001 per share. The S-1 names six directors; one of the four authorized T seats is vacant.</desc>
