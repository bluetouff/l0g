<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" style="width:100%;height:auto" class="l0g-ai-governance-svg" role="img" aria-labelledby="ai-governance-en-courts-d-title ai-governance-en-courts-d-desc"><title id="ai-governance-en-courts-d-title">Anthropic and the state: two tracks</title><desc id="ai-governance-en-courts-d-desc">After directives and designations in February and March 2026, two separate proceedings follow different statutes. On 27 August, the California district court finds the broad measures unlawful. On 25 September, the D.C. Circuit upholds the procurement exclusion under 41 USC §4713 by two votes to one. A rehearing request follows on 13 October.</desc>
