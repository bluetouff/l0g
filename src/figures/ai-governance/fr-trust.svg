<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" style="width:100%;height:auto" class="l0g-ai-governance-svg" role="img" aria-labelledby="ai-governance-fr-trust-d-title ai-governance-fr-trust-d-desc"><title id="ai-governance-fr-trust-d-title">Les coalitions de révision du trust</title><desc id="ai-governance-fr-trust-d-desc">Trois voies conditionnelles de modification ou d’extinction du LTBT sans son accord. Avant le troisième anniversaire de l’IPO et la fin de F : unanimité des fondateurs, majorité des votes E exprimés avec quorum de 40 %, puis majorité des votes A exprimés avec quorum majoritaire. Tant que F existe : deux tiers des fondateurs arrondis au supérieur, 75 % des votes E exprimés avec quorum majoritaire, puis majorité des votes A exprimés avec quorum majoritaire. Après F : 85 % des actions A en circulation. Chaque classe vote séparément.</desc>
