<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" style="width:100%;height:auto" class="l0g-ai-governance-svg" role="img" aria-labelledby="ai-governance-en-openai-d-title ai-governance-en-openai-d-desc"><title id="ai-governance-en-openai-d-title">OpenAI: the release decision</title><desc id="ai-governance-en-openai-d-desc">The Foundation appoints and removes the PBC board. Its Safety and Security Committee, the SSC, has effective approval authority and can halt a release. The PBC supplies information and reasonably necessary resources. Specified structural changes require 21 days’ notice to the California and Delaware Attorneys General.</desc>
