<text data-panel="ai-governance-en-rights-d-frame" x="34" y="641" fill="var(--color-muted)" font-family="l0g AI Governance" font-size="22" font-weight="400" text-anchor="start">Intel: August 2025 · U. S. Steel: June 2025 · * Contractual exceptions.</text>
<line x1="34" y1="671" x2="966" y2="671" stroke="var(--color-line-strong)" stroke-width="1.5"></line>
