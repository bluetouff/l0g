<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" style="width:100%;height:auto" class="l0g-ai-governance-svg" role="img" aria-labelledby="ai-governance-en-rights-d-title ai-governance-en-rights-d-desc"><title id="ai-governance-en-rights-d-title">Rights attached to public ownership</title><desc id="ai-governance-en-rights-d-desc">Two historical agreements. In August 2025, Intel announced a 9.9% public equity arrangement including escrowed shares, with no board seat and votes generally aligned with the board. At U. S. Steel, one non-economic G share carries appointment of one director and presidential consent rights over specified decisions.</desc>
<rect id="ai-governance-en-rights-d-frame" x="0" y="0" width="1000" height="720" rx="5" fill="var(--color-ink)"></rect>
<text data-panel="ai-governance-en-rights-d-frame" x="34" y="36" fill="var(--color-signal)" font-family="l0g AI Governance" font-size="22" font-weight="700" text-anchor="start">l0g / AI / 05</text>
<line x1="34" y1="52" x2="966" y2="52" stroke="var(--color-line-strong)" stroke-width="1.5"></line>
<text data-panel="ai-governance-en-rights-d-frame" x="34" y="100" fill="var(--color-paper)" font-family="l0g AI Governance" font-size="31" font-weight="700" text-anchor="start">Rights attached to public ownership</text>
<text data-panel="ai-governance-en-rights-d-frame" x="34" y="145" fill="var(--color-muted)" font-family="l0g AI Governance" font-size="22" font-weight="400" text-anchor="start">2025 agreements · different types of rights</text>
<text data-panel="ai-governance-en-rights-d-frame" x="282" y="210" fill="var(--color-paper)" font-family="l0g AI Governance" font-size="29" font-weight="700" text-anchor="start">Intel</text>
<text data-panel="ai-governance-en-rights-d-frame" x="675" y="210" fill="var(--color-paper)" font-family="l0g AI Governance" font-size="29" font-weight="700" text-anchor="start">U. S. Steel</text>
<text data-panel="ai-governance-en-rights-d-frame" x="282" y="258" fill="var(--color-signal)" font-family="l0g AI Governance" font-size="32" font-weight="700" text-anchor="start">9.9 %</text>
<text data-panel="ai-governance-en-rights-d-frame" x="675" y="258" fill="var(--color-amber)" font-family="l0g AI Governance" font-size="32" font-weight="700" text-anchor="start">1 G share</text>
<rect x="282" y="281" width="27.72" height="16" rx="0" fill="var(--color-signal)"></rect>
<rect x="309.72" y="281" width="252.28" height="16" rx="0" fill="var(--color-surface-2)"></rect>
<circle cx="851" cy="281" r="12" fill="var(--color-amber)" stroke="var(--color-ink)" stroke-width="1.5"></circle>
<text data-panel="ai-governance-en-rights-d-frame" x="34" y="355" fill="var(--color-paper)" font-family="l0g AI Governance" font-size="22" font-weight="700" text-anchor="start">Economic</text>
<text data-panel="ai-governance-en-rights-d-frame" x="282" y="355" fill="var(--color-paper)" font-family="l0g AI Governance" font-size="22" font-weight="400" text-anchor="start">Shares, including escrow</text>
<text data-panel="ai-governance-en-rights-d-frame" x="675" y="355" fill="var(--color-paper)" font-family="l0g AI Governance" font-size="22" font-weight="400" text-anchor="start">Non-economic share</text>
<line x1="34" y1="411" x2="966" y2="411" stroke="var(--color-line-strong)" stroke-width="1.5"></line>
<text data-panel="ai-governance-en-rights-d-frame" x="34" y="446" fill="var(--color-paper)" font-family="l0g AI Governance" font-size="22" font-weight="700" text-anchor="start">Board</text>
<text data-panel="ai-governance-en-rights-d-frame" x="282" y="446" fill="var(--color-paper)" font-family="l0g AI Governance" font-size="22" font-weight="400" text-anchor="start">No negotiated seat</text>
<text data-panel="ai-governance-en-rights-d-frame" x="675" y="446" fill="var(--color-paper)" font-family="l0g AI Governance" font-size="22" font-weight="400" text-anchor="start">1 appointed director</text>
<line x1="34" y1="502" x2="966" y2="502" stroke="var(--color-line-strong)" stroke-width="1.5"></line>
<text data-panel="ai-governance-en-rights-d-frame" x="34" y="537" fill="var(--color-paper)" font-family="l0g AI Governance" font-size="22" font-weight="700" text-anchor="start">Vote / consent</text>
<text data-panel="ai-governance-en-rights-d-frame" x="282" y="537" fill="var(--color-paper)" font-family="l0g AI Governance" font-size="22" font-weight="400" text-anchor="start">Votes follow the board*</text>
<text data-panel="ai-governance-en-rights-d-frame" x="675" y="537" fill="var(--color-paper)" font-family="l0g AI Governance" font-size="22" font-weight="400" text-anchor="start">Targeted industrial</text>
<text data-panel="ai-governance-en-rights-d-frame" x="675" y="564" fill="var(--color-paper)" font-family="l0g AI Governance" font-size="22" font-weight="400" text-anchor="start">consent</text>
