<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1280" style="width:100%;height:auto" class="l0g-ai-governance-svg" role="img" aria-labelledby="ai-governance-en-trust-m-title ai-governance-en-trust-m-desc"><title id="ai-governance-en-trust-m-title">The coalitions that can revise the trust</title><desc id="ai-governance-en-trust-m-desc">Three conditional routes to amend or terminate the LTBT without its consent. Before the third IPO anniversary and F sunset: unanimous founders, a majority of E votes cast with a 40% quorum, then a majority of A votes cast with a majority quorum. While F exists: two-thirds of founders rounded up, 75% of E votes cast with a majority quorum, then a majority of A votes cast with a majority quorum. After F: 85% of outstanding A shares. Each class votes separately.</desc>
