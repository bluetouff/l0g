<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" style="width:100%;height:auto" class="l0g-ai-governance-svg" role="img" aria-labelledby="ai-governance-fr-rights-d-title ai-governance-fr-rights-d-desc"><title id="ai-governance-fr-rights-d-title">Les droits attachés au capital public</title><desc id="ai-governance-fr-rights-d-desc">Deux accords historiques. En août 2025, Intel annonce une participation publique de 9,9 %, dont une partie des titres en séquestre, sans siège au conseil et avec des votes généralement alignés sur celui-ci. Chez U. S. Steel, une action G non économique permet la nomination d’un administrateur et des consentements présidentiels sur certaines décisions.</desc>
