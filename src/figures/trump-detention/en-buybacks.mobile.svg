<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 342 257" width="100%" height="auto" style="width:100%;height:auto" role="img" aria-labelledby="trump-detention-en-buybacks-mobile-title trump-detention-en-buybacks-mobile-desc" xml:lang="en">
<title id="trump-detention-en-buybacks-mobile-title">From facility sales to stock buybacks</title>
<desc id="trump-detention-en-buybacks-mobile-desc">CoreCivic signed an accelerated share repurchase agreement on August 7 and confirmed a $500 million payment on November 4. GEO announced a proposed $500 million buyback on November 18, to be funded with about $340 million in expected net proceeds from Tacoma plus operating cash flow.</desc>
<rect x="0.5" y="0.5" width="341" height="256" rx="9" fill="var(--color-ink)" fill-opacity="1" stroke="var(--color-line)"/>
<text x="16" y="30" font-size="17" fill="var(--color-paper)" text-anchor="start" font-weight="500">From facility sales to stock buybacks</text>
<text x="16" y="49" font-size="12" fill="var(--color-muted)" text-anchor="start" font-weight="400">Accelerated buybacks · November 2026</text>
<path d="M16 61H326" fill="none" stroke="var(--color-line)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="16" y="84" font-size="14" fill="var(--color-paper)" text-anchor="start" font-weight="500">CoreCivic</text>
<text x="16" y="113" font-size="12" fill="var(--color-muted)" text-anchor="start" font-weight="400">Net sale proceeds</text>
<path d="M163 109H201m-5-3 5 3-5 3" fill="none" stroke="var(--color-signal)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="214" y="108" font-size="16" fill="var(--color-signal)" text-anchor="start" font-weight="500">$500m</text>
<text x="214" y="127" font-size="12" fill="var(--color-signal)" text-anchor="start" font-weight="400">Payment confirmed</text>
<path d="M16 143H326" fill="none" stroke="var(--color-line)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="16" y="168" font-size="14" fill="var(--color-paper)" text-anchor="start" font-weight="500">GEO Group</text>
<text x="16" y="192" font-size="12" fill="var(--color-muted)" text-anchor="start" font-weight="400">≈ $340m net expected</text>
<text x="16" y="208" font-size="12" fill="var(--color-muted)" text-anchor="start" font-weight="400">from the Tacoma sale</text>
<text x="16" y="228" font-size="12" fill="var(--color-muted)" text-anchor="start" font-weight="400">+ operating cash flow</text>
<path d="M163 188H201m-5-3 5 3-5 3" fill="none" stroke="var(--color-accent)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="3 3"/>
<text x="214" y="187" font-size="16" fill="var(--color-accent)" text-anchor="start" font-weight="500">$500m</text>
<text x="214" y="206" font-size="12" fill="var(--color-accent)" text-anchor="start" font-weight="400">Plan announced</text>
<text x="214" y="223" font-size="12" fill="var(--color-muted)" text-anchor="start" font-weight="400">on November 18</text>
</svg>
