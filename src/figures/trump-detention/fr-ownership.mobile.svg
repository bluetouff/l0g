<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 342 276" width="100%" height="auto" style="width:100%;height:auto" role="img" aria-labelledby="trump-detention-fr-ownership-mobile-title trump-detention-fr-ownership-mobile-desc" xml:lang="fr">
<title id="trump-detention-fr-ownership-mobile-title">Tacoma passe à l’État fédéral</title>
<desc id="trump-detention-fr-ownership-mobile-desc">L’État fédéral, par le DHS, acquiert le centre de détention du nord-ouest à Tacoma pour 453 millions de dollars le 17 novembre 2026. GEO Group cède la propriété mais poursuit la gestion au titre d’un contrat de dix ans avec l’ICE, effectif dès le 28 octobre.</desc>
