<text x="16" y="30" font-size="17" fill="var(--color-paper)" text-anchor="start" font-weight="500">Tacoma passe à l’État fédéral</text>
<text x="16" y="49" font-size="12" fill="var(--color-muted)" text-anchor="start" font-weight="400">Centre Northwest ICE · 17 novembre 2026</text>
