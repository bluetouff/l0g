<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 342 298" width="100%" height="auto" style="width:100%;height:auto" role="img" aria-labelledby="trump-detention-fr-acquisitions-mobile-title trump-detention-fr-acquisitions-mobile-desc" xml:lang="fr">
<title id="trump-detention-fr-acquisitions-mobile-title">Huit centres cédés en six ventes</title>
<desc id="trump-detention-fr-acquisitions-mobile-desc">Le DHS acquiert quatre établissements de CoreCivic, California City pour 732,6, Otay Mesa pour 739,2, Appleton pour 495,6 et Leavenworth pour 238,4. Il achète à GEO le complexe d’Adelanto, trois sites, pour 950, et Tacoma pour 453. Le total s’élève à 3 608,8 millions de dollars en prix bruts.</desc>
