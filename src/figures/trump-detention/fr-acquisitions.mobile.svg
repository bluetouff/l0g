<text x="16" y="30" font-size="17" fill="var(--color-paper)" text-anchor="start" font-weight="500">Huit centres cédés en six ventes</text>
<text x="16" y="49" font-size="12" fill="var(--color-muted)" text-anchor="start" font-weight="400">Juillet à novembre 2026 · Prix bruts en M$ US</text>
