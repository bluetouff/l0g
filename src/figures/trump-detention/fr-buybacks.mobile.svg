<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 342 257" width="100%" height="auto" style="width:100%;height:auto" role="img" aria-labelledby="trump-detention-fr-buybacks-mobile-title trump-detention-fr-buybacks-mobile-desc" xml:lang="fr">
<title id="trump-detention-fr-buybacks-mobile-title">Des ventes aux rachats d’actions</title>
<desc id="trump-detention-fr-buybacks-mobile-desc">CoreCivic a signé un accord de rachat accéléré le 7 août et a confirmé le versement de 500 millions de dollars le 4 novembre. GEO a annoncé un projet de rachat de 500 millions le 18 novembre, financé par les quelque 340 millions de produit net attendu de Tacoma et ses flux de trésorerie d’exploitation.</desc>
<rect x="0.5" y="0.5" width="341" height="256" rx="9" fill="var(--color-ink)" fill-opacity="1" stroke="var(--color-line)"/>
<text x="16" y="30" font-size="17" fill="var(--color-paper)" text-anchor="start" font-weight="500">Des ventes aux rachats d’actions</text>
<text x="16" y="49" font-size="12" fill="var(--color-muted)" text-anchor="start" font-weight="400">Rachats accélérés (ASR) · novembre 2026</text>
<path d="M16 61H326" fill="none" stroke="var(--color-line)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="16" y="84" font-size="14" fill="var(--color-paper)" text-anchor="start" font-weight="500">CoreCivic</text>
<text x="16" y="113" font-size="12" fill="var(--color-muted)" text-anchor="start" font-weight="400">Produit net des ventes</text>
<path d="M163 109H201m-5-3 5 3-5 3" fill="none" stroke="var(--color-signal)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="214" y="108" font-size="16" fill="var(--color-signal)" text-anchor="start" font-weight="500">500 M$</text>
<text x="214" y="127" font-size="12" fill="var(--color-signal)" text-anchor="start" font-weight="400">Versement confirmé</text>
<path d="M16 143H326" fill="none" stroke="var(--color-line)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="16" y="168" font-size="14" fill="var(--color-paper)" text-anchor="start" font-weight="500">GEO Group</text>
<text x="16" y="192" font-size="12" fill="var(--color-muted)" text-anchor="start" font-weight="400">≈ 340 M$ nets attendus</text>
<text x="16" y="208" font-size="12" fill="var(--color-muted)" text-anchor="start" font-weight="400">de la vente de Tacoma</text>
<text x="16" y="228" font-size="12" fill="var(--color-muted)" text-anchor="start" font-weight="400">+ flux d’exploitation</text>
<path d="M163 188H201m-5-3 5 3-5 3" fill="none" stroke="var(--color-accent)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="3 3"/>
<text x="214" y="187" font-size="16" fill="var(--color-accent)" text-anchor="start" font-weight="500">500 M$</text>
<text x="214" y="206" font-size="12" fill="var(--color-accent)" text-anchor="start" font-weight="400">Projet annoncé</text>
<text x="214" y="223" font-size="12" fill="var(--color-muted)" text-anchor="start" font-weight="400">le 18 novembre</text>
</svg>
