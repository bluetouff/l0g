<text x="318" y="130" font-size="13" fill="var(--color-paper)" text-anchor="end" font-weight="400">739.2</text>
<text x="24" y="152" font-size="13" fill="var(--color-paper)" text-anchor="start" font-weight="400">Appleton</text>
<text x="248" y="152" font-size="12" fill="var(--color-muted)" text-anchor="end" font-weight="400">Aug. 4</text>
<text x="318" y="152" font-size="13" fill="var(--color-paper)" text-anchor="end" font-weight="400">495.6</text>
<text x="24" y="174" font-size="13" fill="var(--color-paper)" text-anchor="start" font-weight="400">Leavenworth</text>
