<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 342 298" width="100%" height="auto" style="width:100%;height:auto" role="img" aria-labelledby="trump-detention-en-acquisitions-mobile-title trump-detention-en-acquisitions-mobile-desc" xml:lang="en">
<title id="trump-detention-en-acquisitions-mobile-title">Eight facilities sold in six deals</title>
<desc id="trump-detention-en-acquisitions-mobile-desc">DHS acquired four facilities from CoreCivic: California City for 732.6, Otay Mesa for 739.2, Appleton for 495.6 and Leavenworth for 238.4. It acquired three facilities making up the Adelanto complex from GEO for 950, and Tacoma for 453. The gross purchase prices total 3,608.8 million dollars.</desc>
<rect x="0.5" y="0.5" width="341" height="297" rx="9" fill="var(--color-ink)" fill-opacity="1" stroke="var(--color-line)"/>
<text x="16" y="30" font-size="17" fill="var(--color-paper)" text-anchor="start" font-weight="500">Eight facilities sold in six deals</text>
<text x="16" y="49" font-size="12" fill="var(--color-muted)" text-anchor="start" font-weight="400">July to November 2026 · Gross prices in US$ millions</text>
<path d="M16 61H326" fill="none" stroke="var(--color-line)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="16" y="81" font-size="12" fill="var(--color-muted)" text-anchor="start" font-weight="400">CoreCivic</text>
<text x="248" y="81" font-size="12" fill="var(--color-muted)" text-anchor="end" font-weight="400">Closing</text>
<text x="318" y="81" font-size="12" fill="var(--color-muted)" text-anchor="end" font-weight="400">Gross price</text>
<path d="M16 90H326" fill="none" stroke="var(--color-line)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M16 185H326" fill="none" stroke="var(--color-line)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="16" y="202" font-size="12" fill="var(--color-muted)" text-anchor="start" font-weight="400">GEO Group</text>
