<text x="24" y="276" font-size="13" fill="var(--color-signal)" text-anchor="start" font-weight="500">Total</text>
<text x="318" y="276" font-size="14" fill="var(--color-signal)" text-anchor="end" font-weight="500">3,608.8</text>
<text x="24" y="108" font-size="13" fill="var(--color-paper)" text-anchor="start" font-weight="400">California City</text>
<text x="248" y="108" font-size="12" fill="var(--color-muted)" text-anchor="end" font-weight="400">July 2</text>
