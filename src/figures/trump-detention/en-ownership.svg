<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 572 249" width="100%" height="auto" style="width:100%;height:auto" role="img" aria-labelledby="trump-detention-en-ownership-wide-title trump-detention-en-ownership-wide-desc" xml:lang="en">
<title id="trump-detention-en-ownership-wide-title">Tacoma passes to federal ownership</title>
<desc id="trump-detention-en-ownership-wide-desc">The federal government, through DHS, acquired the Northwest ICE Processing Center in Tacoma for $453 million on November 17, 2026. GEO Group sold the facility and continued providing services under a ten-year management contract with ICE, effective October 28.</desc>
