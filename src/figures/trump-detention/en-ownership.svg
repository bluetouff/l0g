<text x="16" y="30" font-size="17" fill="var(--color-paper)" text-anchor="start" font-weight="500">Tacoma passes to federal ownership</text>
<text x="16" y="49" font-size="12" fill="var(--color-muted)" text-anchor="start" font-weight="400">Northwest ICE Processing Center · sale on Nov. 17, 2026</text>
<path d="M16 61H556" fill="none" stroke="var(--color-line)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="16" y="81" font-size="12" fill="var(--color-muted)" text-anchor="start" font-weight="400">Facility ownership</text>
