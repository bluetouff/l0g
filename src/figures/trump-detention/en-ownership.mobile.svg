<text x="71" y="155" font-size="13" fill="var(--color-paper)" text-anchor="middle" font-weight="400">GEO Group</text>
<text x="271" y="155" font-size="13" fill="var(--color-paper)" text-anchor="middle" font-weight="400">U.S. government</text>
