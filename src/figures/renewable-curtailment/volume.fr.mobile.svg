  <text x="18" y="181" font-size="12" font-weight="400" fill="var(--color-muted)" text-anchor="start">0</text>
  <path d="M17 152H313" fill="none" stroke="var(--color-line-strong)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />
  <text x="18" y="148" font-size="12" font-weight="400" fill="var(--color-muted)" text-anchor="start">1</text>
  <path d="M17 119H313" fill="none" stroke="var(--color-line-strong)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />
  <text x="18" y="115" font-size="12" font-weight="400" fill="var(--color-muted)" text-anchor="start">2</text>
  <path d="M17 86H313" fill="none" stroke="var(--color-line-strong)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />
  <text x="18" y="82" font-size="12" font-weight="400" fill="var(--color-muted)" text-anchor="start">3</text>
  <rect x="53.5" y="168.5" width="33" height="16.5" rx="2" fill="var(--color-signal)" />
  <text x="70" y="160.5" font-size="15" font-weight="400" fill="var(--color-paper)" text-anchor="middle">0,5</text>
  <text x="70" y="205" font-size="13" font-weight="400" fill="var(--color-muted)" text-anchor="middle">2023</text>
  <rect x="148.5" y="128.9" width="33" height="56.1" rx="2" fill="var(--color-signal)" />
  <text x="165" y="120.9" font-size="15" font-weight="400" fill="var(--color-paper)" text-anchor="middle">1,7</text>
  <text x="165" y="205" font-size="13" font-weight="400" fill="var(--color-muted)" text-anchor="middle">2024</text>
  <rect x="243.5" y="86.0" width="33" height="99.0" rx="2" fill="var(--color-signal)" />
  <text x="260" y="78.0" font-size="15" font-weight="400" fill="var(--color-paper)" text-anchor="middle">≈ 3</text>
  <text x="260" y="205" font-size="13" font-weight="400" fill="var(--color-muted)" text-anchor="middle">2025</text>
  <rect x="17" y="217" width="296" height="82" rx="6" fill="var(--color-surface)" stroke="var(--color-line-strong)" />
  <text x="28" y="236" font-size="12.5" font-weight="400" fill="var(--color-topic-blue)" text-anchor="start">AIE · Écrêtement technique</text>
  <text x="28" y="260" font-size="15" font-weight="400" fill="var(--color-paper)" text-anchor="start">≈ 200 TWh</text>
