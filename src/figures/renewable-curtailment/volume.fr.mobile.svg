  <text x="295" y="260" font-size="15" font-weight="400" fill="var(--color-paper)" text-anchor="end">&gt; 800 TWh</text>
  <text x="295" y="279" font-size="12.5" font-weight="400" fill="var(--color-muted)" text-anchor="end">2031 · projection</text>
