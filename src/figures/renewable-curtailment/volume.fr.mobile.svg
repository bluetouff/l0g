<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 309" role="img" aria-labelledby="renewable-curtailment-volume-fr-mobile-title renewable-curtailment-volume-fr-mobile-description" width="100%" height="auto" style="width:100%;height:auto" font-family="Inter Variable, Inter, sans-serif" font-weight="400" xml:lang="fr">
  <title id="renewable-curtailment-volume-fr-mobile-title">Éolien et solaire mis en retrait</title>
  <desc id="renewable-curtailment-volume-fr-mobile-description">En France, RTE estime la production éolienne et solaire modulée lors des prix négatifs à 0,5 TWh en 2023, 1,7 en 2024 et environ 3 en 2025. L’AIE estime séparément environ 200 TWh d’écrêtement technique en 2025 et en projette plus de 800 en 2031. Les périmètres diffèrent.</desc>
  <rect x="0" y="0" width="330" height="309" rx="9" fill="var(--color-ink)" />
  <text x="17" y="31" font-size="17" font-weight="400" fill="var(--color-paper)" text-anchor="start">Éolien et solaire mis en retrait</text>
  <text x="17" y="52" font-size="12.5" font-weight="400" fill="var(--color-muted)" text-anchor="start">France · Modulation aux prix négatifs</text>
  <text x="309" y="72" font-size="12" font-weight="400" fill="var(--color-muted)" text-anchor="end">TWh</text>
