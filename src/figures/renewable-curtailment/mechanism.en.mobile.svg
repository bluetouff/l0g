  <text x="17" y="31" font-size="17" font-weight="400" fill="var(--color-paper)" text-anchor="start">Reduced output</text>
  <text x="17" y="51" font-size="12.5" font-weight="400" fill="var(--color-muted)" text-anchor="start">Two triggers</text>
