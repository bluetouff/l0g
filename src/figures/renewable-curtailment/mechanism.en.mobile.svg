  <text x="68" y="105" font-size="12.5" font-weight="400" fill="var(--color-muted)" text-anchor="start">Available output</text>
  <rect x="17" y="137" width="140" height="71" rx="7" fill="var(--color-surface)" stroke="var(--color-line-strong)" />
