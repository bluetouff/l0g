<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 315" role="img" aria-labelledby="renewable-curtailment-mechanism-en-mobile-title renewable-curtailment-mechanism-en-mobile-description" width="100%" height="auto" style="width:100%;height:auto" font-family="Inter Variable, Inter, sans-serif" font-weight="400" xml:lang="en">
  <title id="renewable-curtailment-mechanism-en-mobile-title">Available power, reduced output</title>
  <desc id="renewable-curtailment-mechanism-en-mobile-description">A wind or solar plant can reduce its output at the grid operator’s request if the system faces a physical constraint, or shut down in response to an unfavourable price. Contract terms allocate the risk. Grid upgrades, storage and flexible demand can ease some constraints.</desc>
