<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 312" role="img" aria-labelledby="renewable-curtailment-tradeoff-en-mobile-title renewable-curtailment-tradeoff-en-mobile-description" width="100%" height="auto" style="width:100%;height:auto" font-family="Inter Variable, Inter, sans-serif" font-weight="400" xml:lang="en">
  <title id="renewable-curtailment-tradeoff-en-mobile-title">The value of a recovered MWh</title>
  <desc id="renewable-curtailment-tradeoff-en-mobile-description">Compare the expected value of recovered electricity and grid services with the full cost of each recovery option. Storage involves losses and costs for connection or cycling. Grid upgrades and demand flexibility have costs of their own. When recovery costs exceed the value delivered, accepting some curtailment can cost less. This is a qualitative diagram with no monetary values or value scale.</desc>
  <rect x="0" y="0" width="330" height="312" rx="9" fill="var(--color-ink)" />
  <text x="17" y="31" font-size="17" font-weight="400" fill="var(--color-paper)" text-anchor="start">The value of a recovered MWh</text>
  <text x="17" y="51" font-size="12.5" font-weight="400" fill="var(--color-muted)" text-anchor="start">Local trade-off · Decision rule</text>
  <rect x="17" y="67" width="296" height="186" rx="7" fill="var(--color-surface)" stroke="var(--color-line-strong)" />
  <path d="M29 130H301M29 191H301" fill="none" stroke="var(--color-line-strong)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
  <g transform="translate(29 86)" aria-hidden="true"><path d="M3 18L9 12L13 15L21 5M16 5H21V10M3 22H22" fill="none" stroke="var(--color-signal)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /></g>
  <text x="67" y="93" font-size="14.5" font-weight="400" fill="var(--color-signal)" text-anchor="start">Value of recovery</text>
  <text x="67" y="111" font-size="12.5" font-weight="400" fill="var(--color-muted)" text-anchor="start">Energy and grid services</text>
  <g transform="translate(29 147)" aria-hidden="true"><rect x="2" y="5" width="18" height="14" rx="2" fill="none" stroke="var(--color-topic-blue)" /><path d="M20 10H23V14H20M7 12H15M11 8V16" fill="none" stroke="var(--color-topic-blue)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /></g>
  <text x="67" y="154" font-size="14.5" font-weight="400" fill="var(--color-topic-blue)" text-anchor="start">Storage</text>
  <text x="67" y="173" font-size="12.5" font-weight="400" fill="var(--color-muted)" text-anchor="start">Investment, losses, cycling</text>
  <g transform="translate(29 208)" aria-hidden="true"><path d="M3 3V21H22M6 7H10V16H16V10H21M18 7L21 10L18 13" fill="none" stroke="var(--color-amber)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /></g>
  <text x="67" y="216" font-size="14.5" font-weight="400" fill="var(--color-amber)" text-anchor="start">Grid or flexible demand</text>
  <text x="67" y="234" font-size="12.5" font-weight="400" fill="var(--color-muted)" text-anchor="start">Full cost of the alternative</text>
  <text x="17" y="277" font-size="13.5" font-weight="400" fill="var(--color-paper)" text-anchor="start">Compare value with each cost</text>
  <text x="17" y="298" font-size="12.5" font-weight="400" fill="var(--color-muted)" text-anchor="start">Curtailing can cost less if costs outweigh value.</text>
</svg>
