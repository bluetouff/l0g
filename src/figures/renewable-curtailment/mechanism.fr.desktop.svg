<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 274" role="img" aria-labelledby="renewable-curtailment-mechanism-fr-desktop-title renewable-curtailment-mechanism-fr-desktop-description" width="100%" height="auto" style="width:100%;height:auto" font-family="Inter Variable, Inter, sans-serif" font-weight="400" xml:lang="fr">
  <title id="renewable-curtailment-mechanism-fr-desktop-title">Une centrale disponible, une injection réduite</title>
  <desc id="renewable-curtailment-mechanism-fr-desktop-description">Un parc éolien ou solaire peut réduire son injection à la demande du gestionnaire si une contrainte physique l’exige, ou s’arrêter en réponse à un prix défavorable. Les clauses du contrat répartissent le risque. Le réseau, le stockage et une demande flexible peuvent réduire certaines limitations.</desc>
