<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 269" role="img" aria-labelledby="renewable-curtailment-tradeoff-fr-desktop-title renewable-curtailment-tradeoff-fr-desktop-description" width="100%" height="auto" style="width:100%;height:auto" font-family="Inter Variable, Inter, sans-serif" font-weight="400" xml:lang="fr">
  <title id="renewable-curtailment-tradeoff-fr-desktop-title">Combien vaut le MWh récupéré ?</title>
  <desc id="renewable-curtailment-tradeoff-fr-desktop-description">Pour chaque option de récupération, comparer la valeur attendue des MWh et des services avec le coût complet de cette option. Le stockage comporte des pertes et des coûts de raccordement ou de cycle. Le réseau et la flexibilité de la demande ont leurs propres coûts. Si chaque option coûte plus que la valeur qu’elle apporte, accepter un écrêtement peut coûter moins. Il s’agit d’un raisonnement qualitatif sans montant ni échelle de valeur.</desc>
  <rect x="0" y="0" width="600" height="269" rx="9" fill="var(--color-ink)" />
  <text x="24" y="31" font-size="17" font-weight="400" fill="var(--color-paper)" text-anchor="start">Combien vaut le MWh récupéré ?</text>
  <text x="24" y="51" font-size="12.5" font-weight="400" fill="var(--color-muted)" text-anchor="start">Arbitrage local · Principe de décision</text>
  <rect x="24" y="71" width="552" height="141" rx="7" fill="var(--color-surface)" stroke="var(--color-line-strong)" />
  <path d="M37 118H563M37 163H563" fill="none" stroke="var(--color-line-strong)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
  <g transform="translate(39 83)" aria-hidden="true"><path d="M3 18L9 12L13 15L21 5M16 5H21V10M3 22H22" fill="none" stroke="var(--color-signal)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /></g>
  <text x="77" y="100" font-size="15" font-weight="400" fill="var(--color-signal)" text-anchor="start">Valeur de la récupération</text>
  <text x="557" y="100" font-size="13" font-weight="400" fill="var(--color-muted)" text-anchor="end">Énergie et services rendus</text>
  <g transform="translate(39 129)" aria-hidden="true"><rect x="2" y="5" width="18" height="14" rx="2" fill="none" stroke="var(--color-topic-blue)" /><path d="M20 10H23V14H20M7 12H15M11 8V16" fill="none" stroke="var(--color-topic-blue)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /></g>
  <text x="77" y="145" font-size="15" font-weight="400" fill="var(--color-topic-blue)" text-anchor="start">Stocker</text>
  <text x="557" y="145" font-size="13" font-weight="400" fill="var(--color-muted)" text-anchor="end">Investissement, pertes, cycles</text>
  <g transform="translate(39 174)" aria-hidden="true"><path d="M3 3V21H22M6 7H10V16H16V10H21M18 7L21 10L18 13" fill="none" stroke="var(--color-amber)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /></g>
  <text x="77" y="190" font-size="15" font-weight="400" fill="var(--color-amber)" text-anchor="start">Réseau ou demande flexible</text>
  <text x="557" y="190" font-size="13" font-weight="400" fill="var(--color-muted)" text-anchor="end">Coûts complets de l’alternative</text>
  <text x="24" y="234" font-size="13.5" font-weight="400" fill="var(--color-paper)" text-anchor="start">Comparer chaque coût à la valeur récupérable</text>
  <text x="24" y="253" font-size="12.5" font-weight="400" fill="var(--color-muted)" text-anchor="start">Si le coût dépasse la valeur, accepter l’écrêtement peut coûter moins.</text>
</svg>
