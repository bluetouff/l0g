<svg xmlns="http://www.w3.org/2000/svg" id="sfc-fx-fr-m-0" viewBox="0 0 600 930" role="img" aria-labelledby="sfc-fx-fr-m-1 sfc-fx-fr-m-3" width="100%" height="auto" style="width:100%;height:auto" font-family="Inter Variable, Inter, sans-serif" font-weight="400" xml:lang="fr">
  <title id="sfc-fx-fr-m-1">Dollar de référence, rouble de paiement</title>
  <desc id="sfc-fx-fr-m-3">Le coupon est calculé en dollars, puis converti en roubles. Les taux de 80 et 100 RUB par USD servent uniquement à illustrer cette conversion. Le paiement réel du 2 novembre 2026 est rapporté par l’émetteur.</desc>
  <metadata>{"publisher": "l0g", "license": "CC-BY-4.0", "cutoff": "2026-11-19", "language": "fr", "chart": "dollar-rouble", "unit": "USD coupon and RUB settlement; annual percent; 30-day period", "period": "S2 contractual terms 2026; reported payment 2026-11-02", "limits": "80 and 100 RUB per USD are illustrative exchange rates, not observations or forecasts. 13.5% is the annual coupon rate, not a realised investor return. The actual coupon payment is an issuer statement.", "sources": [{"id": "S07", "url": "https://www.e-disclosure.ru/portal/FileLoad.ashx?Fileid=1940537"}, {"id": "S08", "url": "https://www.e-disclosure.ru/portal/FileLoad.ashx?Fileid=1939674"}, {"id": "S11", "url": "https://e-disclosure.azipi.ru/messages/4603437/"}]}</metadata>
