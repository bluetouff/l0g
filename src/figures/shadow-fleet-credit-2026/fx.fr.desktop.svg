  <title id="sfc-fx-fr-d-1">Dollar de référence, rouble de paiement</title>
  <desc id="sfc-fx-fr-d-3">Le coupon est calculé en dollars, puis converti en roubles. Les taux de 80 et 100 RUB par USD servent uniquement à illustrer cette conversion. Le paiement réel du 2 novembre 2026 est rapporté par l’émetteur.</desc>
