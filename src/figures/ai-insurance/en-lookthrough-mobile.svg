<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 448" role="img" aria-labelledby="ai-insurance-en-lookthrough-m-title ai-insurance-en-lookthrough-m-desc" font-family="Inter Variable, Inter, sans-serif" font-weight="400" style="width:100%;height:auto" class="ai-insurance-svg">
  <title id="ai-insurance-en-lookthrough-m-title">Two borrowers, one possible shared customer</title>
  <desc id="ai-insurance-en-lookthrough-m-desc">Illustrative reading framework, not an observed portfolio. Insured loans for two projects may name separate borrowers, SPV A and SPV B, while both depend on the same tenant for revenue. Project A may also carry construction, property or cyber cover. Matching requires the customer, sponsor, site and other policies. A lease alone does not make the tenant a guarantor. Lines show relationships to investigate, not payments or amounts.</desc>
  <text x="20" y="30" font-size="18" font-weight="500" text-anchor="start" fill="var(--color-paper)">Two borrowers,</text>
  <text x="20" y="55" font-size="18" font-weight="500" text-anchor="start" fill="var(--color-paper)">one possible shared customer</text>
  <text x="20" y="79" font-size="14" font-weight="400" text-anchor="start" fill="var(--color-muted)">Illustrative framework · no observed portfolio</text>
  <rect x="20" y="103" width="150" height="66" rx="4" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
  <g data-icon="loan" transform="translate(39 127) scale(0.9)" fill="none" stroke="var(--color-muted)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="M-7-10H3l5 5V10H-7Z"/><path d="M3-10v5h5M-3 0H4M-3 4H4"/></g>
  <text x="59" y="131" font-size="16" font-weight="500" text-anchor="start" fill="var(--color-paper)">SPV A</text>
  <text x="35" y="153" font-size="14" font-weight="400" text-anchor="start" fill="var(--color-muted)">Project A loan</text>
  <rect x="210" y="103" width="150" height="66" rx="4" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
  <g data-icon="loan" transform="translate(229 127) scale(0.9)" fill="none" stroke="var(--color-muted)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="M-7-10H3l5 5V10H-7Z"/><path d="M3-10v5h5M-3 0H4M-3 4H4"/></g>
  <text x="249" y="131" font-size="16" font-weight="500" text-anchor="start" fill="var(--color-paper)">SPV B</text>
  <text x="225" y="153" font-size="14" font-weight="400" text-anchor="start" fill="var(--color-muted)">Project B loan</text>
  <path d="M95 169V197H285V169" fill="none" stroke="var(--color-signal)" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="190" y1="197" x2="190" y2="218" stroke="var(--color-signal)" stroke-width="1.4"/><path d="M186 212 190 218 194 212" fill="none" stroke="var(--color-signal)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="190" y="189" font-size="14" font-weight="400" text-anchor="middle" fill="var(--color-muted)">match the leases</text>
  <rect x="70" y="220" width="240" height="64" rx="4" fill="var(--color-surface)" stroke="var(--color-signal)" stroke-width="1"/>
  <g data-icon="tenant" transform="translate(90 241) scale(0.8)" fill="none" stroke="var(--color-signal)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="M-11 3a5 5 0 0 1 3-9 6 6 0 0 1 11-2 5 5 0 1 1 5 9H-11Z"/><path d="M-5 7V11M0 7V11M5 7V11"/></g>
  <text x="111" y="246" font-size="14.5" font-weight="500" text-anchor="start" fill="var(--color-paper)">Shared customer / tenant</text>
  <text x="190" y="271" font-size="14" font-weight="400" text-anchor="middle" fill="var(--color-amber)">Lease ≠ guarantee</text>
  <path d="M20 136H10V330H20" fill="none" stroke="var(--color-amber)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5"/>
  <rect x="20" y="308" width="340" height="57" rx="4" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
  <g data-icon="shield" transform="translate(39 331) scale(0.85)" fill="none" stroke="var(--color-amber)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="M0-11 9-7v7c0 5-4 9-9 12C-5 9-9 5-9 0v-7Z"/><path d="m-4 0 3 3 6-7"/></g>
  <text x="60" y="329" font-size="14.5" font-weight="400" text-anchor="start" fill="var(--color-paper)">Site A · other possible contracts</text>
  <text x="60" y="350" font-size="14" font-weight="400" text-anchor="start" fill="var(--color-muted)">Construction · property · cyber…</text>
  <line x1="20" y1="387" x2="360" y2="387" stroke="var(--color-line-strong)" stroke-width="1"/>
  <g data-icon="link" transform="translate(30 409) scale(0.8)" fill="none" stroke="var(--color-muted)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="M-3 4-5 6a4 4 0 0 1-6-6l4-4a4 4 0 0 1 6 0M3-4l2-2a4 4 0 0 1 6 6L7 4a4 4 0 0 1-6 0M-4 4 4-4"/></g>
  <text x="49" y="409" font-size="14" font-weight="400" text-anchor="start" fill="var(--color-paper)">Match: customer, sponsor, site</text>
  <text x="49" y="431" font-size="14" font-weight="400" text-anchor="start" fill="var(--color-muted)">and other insurance cover.</text>
</svg>
