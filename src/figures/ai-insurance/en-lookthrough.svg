  <rect x="24" y="307" width="360" height="41" rx="4" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
  <g data-icon="shield" transform="translate(45 327) scale(0.85)" fill="none" stroke="var(--color-amber)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="M0-11 9-7v7c0 5-4 9-9 12C-5 9-9 5-9 0v-7Z"/><path d="m-4 0 3 3 6-7"/></g>
