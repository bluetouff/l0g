  <path d="M456 185 462 189 456 193" fill="none" stroke="var(--color-signal)" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="265" y="116" font-size="15.2" font-weight="400" text-anchor="start" fill="var(--color-muted)">Match the leases</text>
  <rect x="462" y="145" width="274" height="90" rx="4" fill="var(--color-surface)" stroke="var(--color-signal)" stroke-width="1"/>
  <g data-icon="tenant" transform="translate(484 170) scale(1)" fill="none" stroke="var(--color-signal)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="M-11 3a5 5 0 0 1 3-9 6 6 0 0 1 11-2 5 5 0 1 1 5 9H-11Z"/><path d="M-5 7V11M0 7V11M5 7V11"/></g>
  <text x="507" y="174" font-size="16" font-weight="500" text-anchor="start" fill="var(--color-paper)">Shared customer / tenant</text>
