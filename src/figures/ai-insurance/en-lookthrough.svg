  <text x="483" y="220" font-size="15.2" font-weight="400" text-anchor="start" fill="var(--color-amber)">Lease ≠ guarantee</text>
  <path d="M24 137H12V324H24" fill="none" stroke="var(--color-amber)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5"/>
