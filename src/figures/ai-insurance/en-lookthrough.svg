  <text x="490" y="286" font-size="15.2" font-weight="500" text-anchor="start" fill="var(--color-paper)">Fields to match</text>
  <text x="462" y="311" font-size="15.2" font-weight="400" text-anchor="start" fill="var(--color-muted)">Customer · sponsor · site</text>
  <text x="462" y="334" font-size="15.2" font-weight="400" text-anchor="start" fill="var(--color-muted)">and other insurance cover</text>
</svg>
