<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 364" role="img" aria-labelledby="ai-insurance-en-lookthrough-d-title ai-insurance-en-lookthrough-d-desc" font-family="Inter Variable, Inter, sans-serif" font-weight="400" style="width:100%;height:auto" class="ai-insurance-svg">
  <title id="ai-insurance-en-lookthrough-d-title">Two borrowers, one possible shared customer</title>
  <desc id="ai-insurance-en-lookthrough-d-desc">Illustrative reading framework, not an observed portfolio. Insured loans for two projects may name separate borrowers, SPV A and SPV B, while both depend on the same tenant for revenue. Project A may also carry construction, property or cyber cover. Matching requires the customer, sponsor, site and other policies. A lease alone does not make the tenant a guarantor. Lines show relationships to investigate, not payments or amounts.</desc>
  <text x="24" y="31" font-size="22" font-weight="500" text-anchor="start" fill="var(--color-paper)">Two borrowers, one possible shared customer</text>
  <text x="24" y="55" font-size="15.2" font-weight="400" text-anchor="start" fill="var(--color-muted)">Illustrative framework · no observed portfolio</text>
  <text x="24" y="84" font-size="15.2" font-weight="400" text-anchor="start" fill="var(--color-muted)">Borrowers named in the insured loans</text>
  <rect x="24" y="103" width="210" height="67" rx="4" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
  <g data-icon="loan" transform="translate(45 127) scale(1)" fill="none" stroke="var(--color-muted)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="M-7-10H3l5 5V10H-7Z"/><path d="M3-10v5h5M-3 0H4M-3 4H4"/></g>
  <text x="65" y="129" font-size="17" font-weight="500" text-anchor="start" fill="var(--color-paper)">SPV A</text>
  <text x="44" y="153" font-size="15.2" font-weight="400" text-anchor="start" fill="var(--color-muted)">Project A · site A</text>
  <rect x="24" y="208" width="210" height="67" rx="4" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
  <g data-icon="loan" transform="translate(45 232) scale(1)" fill="none" stroke="var(--color-muted)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="M-7-10H3l5 5V10H-7Z"/><path d="M3-10v5h5M-3 0H4M-3 4H4"/></g>
  <text x="65" y="234" font-size="17" font-weight="500" text-anchor="start" fill="var(--color-paper)">SPV B</text>
  <text x="44" y="258" font-size="15.2" font-weight="400" text-anchor="start" fill="var(--color-muted)">Project B · site B</text>
  <path d="M234 137H340V189H462" fill="none" stroke="var(--color-signal)" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/>
