<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 348" role="img" aria-labelledby="ai-insurance-fr-guarantee-d-title ai-insurance-fr-guarantee-d-desc" font-family="Inter Variable, Inter, sans-serif" font-weight="400" style="width:100%;height:auto" class="ai-insurance-svg">
  <title id="ai-insurance-fr-guarantee-d-title">Deux engagements, deux bases de calcul</title>
  <desc id="ai-insurance-fr-guarantee-d-desc">Dans la note 12 de son 10-Q au 30 septembre 2026, Athene décrit une garantie d’AHL, sa holding, couvrant 15 % de l’obligation d’achat restante de WHCO si ce fonds fait défaut sur cette obligation. Un tiers non nommé doit séparément rembourser à AHL 35 % des montants qu’AHL paierait effectivement au titre de sa garantie. Le premier pourcentage porte sur l’obligation d’achat restante ; le second porte sur les paiements d’AHL. La source ne qualifie pas le tiers d’assureur ou de réassureur. Le paiement est jugé non probable et aucun passif n’est comptabilisé ; la garantie demeure un engagement conditionnel. Aucun montant en dollars n’est inféré.</desc>
  <text x="24" y="31" font-size="22" font-weight="500" text-anchor="start" fill="var(--color-paper)">Deux engagements, deux bases de calcul</text>
  <text x="24" y="56" font-size="15.2" font-weight="400" text-anchor="start" fill="var(--color-muted)">Garantie AHL · situation au 30 septembre 2026</text>
  <g data-icon="purchase" transform="translate(126 96) scale(0.95)" fill="none" stroke="var(--color-muted)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="M-9-9H4l5 5V10H-9ZM4-9v5h5M-5 0H4M-5 4H1"/><path d="m2 7 2 2 4-4"/></g>
  <text x="126" y="126" font-size="16" font-weight="500" text-anchor="middle" fill="var(--color-paper)">Obligation d’achat</text>
  <text x="126" y="147" font-size="16" font-weight="500" text-anchor="middle" fill="var(--color-paper)">de WHCO</text>
  <g data-icon="holdco" transform="translate(380 96) scale(0.95)" fill="none" stroke="var(--color-muted)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="M-9-9H9V9H-9ZM-4-5H-2M2-5H4M-4-1H-2M2-1H4M-4 3H-2M2 3H4M-2 9V6H2V9"/></g>
  <text x="380" y="126" font-size="17" font-weight="500" text-anchor="middle" fill="var(--color-paper)">AHL</text>
  <text x="380" y="147" font-size="15.2" font-weight="400" text-anchor="middle" fill="var(--color-muted)">Holding d’Athene</text>
  <g data-icon="party" transform="translate(634 96) scale(0.95)" fill="none" stroke="var(--color-muted)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="-5" r="4"/><path d="M-8 10V6a8 8 0 0 1 16 0v4M-5 10H5"/></g>
  <text x="634" y="126" font-size="16" font-weight="500" text-anchor="middle" fill="var(--color-paper)">Tiers</text>
  <text x="634" y="147" font-size="15.2" font-weight="400" text-anchor="middle" fill="var(--color-muted)">Identité non publiée</text>
  <line x1="380" y1="187" x2="126" y2="187" stroke="var(--color-signal)" stroke-width="1.4"/><path d="M132 183 126 187 132 191" fill="none" stroke="var(--color-signal)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="634" y1="187" x2="380" y2="187" stroke="var(--color-accent)" stroke-width="1.4"/><path d="M386 183 380 187 386 191" fill="none" stroke="var(--color-accent)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="253" y="179" font-size="18" font-weight="500" text-anchor="middle" fill="var(--color-signal)">15 %</text>
  <text x="507" y="179" font-size="18" font-weight="500" text-anchor="middle" fill="var(--color-accent)">35 %</text>
  <text x="253" y="215" font-size="15.2" font-weight="400" text-anchor="middle" fill="var(--color-paper)">de l’obligation d’achat</text>
  <text x="253" y="236" font-size="15.2" font-weight="400" text-anchor="middle" fill="var(--color-paper)">restant à exécuter</text>
  <text x="253" y="259" font-size="15.2" font-weight="400" text-anchor="middle" fill="var(--color-muted)">si WHCO fait défaut</text>
  <text x="507" y="215" font-size="15.2" font-weight="400" text-anchor="middle" fill="var(--color-paper)">des montants payés</text>
  <text x="507" y="236" font-size="15.2" font-weight="400" text-anchor="middle" fill="var(--color-paper)">par AHL sous sa garantie</text>
  <text x="507" y="259" font-size="15.2" font-weight="400" text-anchor="middle" fill="var(--color-muted)">remboursés à AHL</text>
  <line x1="24" y1="283" x2="736" y2="283" stroke="var(--color-line-strong)" stroke-width="1"/>
  <text x="24" y="307" font-size="15.2" font-weight="400" text-anchor="start" fill="var(--color-paper)">Déclencheur : défaut de WHCO sur son obligation d’achat.</text>
  <text x="24" y="332" font-size="15.2" font-weight="400" text-anchor="start" fill="var(--color-muted)">Paiement jugé non probable : aucun passif comptabilisé.</text>
</svg>
