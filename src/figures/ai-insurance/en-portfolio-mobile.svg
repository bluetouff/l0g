<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 448" role="img" aria-labelledby="ai-insurance-en-portfolio-m-title ai-insurance-en-portfolio-m-desc" font-family="Inter Variable, Inter, sans-serif" font-weight="400" style="width:100%;height:auto" class="ai-insurance-svg">
  <title id="ai-insurance-en-portfolio-m-title">Athene’s digital infrastructure investments</title>
  <desc id="ai-insurance-en-portfolio-m-desc">Athene reports $12.9 billion of funded digital infrastructure investments at 30 September 2026: chips, 3.6; secured debt, including property loans, 3.6; energy, 0.7; other, mostly hyperscaler bonds, 5.0. All four bars share one scale. Gross non-GAAP measure, including ACRA noncontrolling interests. The scope extends beyond AI. Conditional guarantees are not added to this total. CML investment-grade classification looks through to the tenant; it is not a guarantee to Athene.</desc>
  <text x="20" y="30" font-size="18" font-weight="500" text-anchor="start" fill="var(--color-paper)">Athene: $12.9bn invested</text>
  <text x="20" y="55" font-size="14" font-weight="400" text-anchor="start" fill="var(--color-muted)">Digital infrastructure · 30 Sept 2026</text>
  <text x="20" y="79" font-size="14" font-weight="400" text-anchor="start" fill="var(--color-muted)">US dollars, billions · one shared scale</text>
