<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 352" role="img" aria-labelledby="ai-insurance-fr-portfolio-d-title ai-insurance-fr-portfolio-d-desc" font-family="Inter Variable, Inter, sans-serif" font-weight="400" style="width:100%;height:auto" class="ai-insurance-svg">
  <title id="ai-insurance-fr-portfolio-d-title">Les placements numériques d’Athene</title>
  <desc id="ai-insurance-fr-portfolio-d-desc">Athene publie 12,9 milliards de dollars d’investissements financés en infrastructures numériques au 30 septembre 2026 : puces, 3,6 ; dette sécurisée, dont immobilier, 3,6 ; énergie, 0,7 ; autres, surtout obligations des hyperscalers, 5,0. Les quatre barres sont à la même échelle. Mesure brute non-GAAP incluant les intérêts minoritaires ACRA. Le périmètre est plus large que l’IA. Les garanties conditionnelles ne sont pas ajoutées à ce total. Pour les prêts immobiliers CML, le classement investment grade repose sur le locataire ; cela ne vaut pas garantie à Athene.</desc>
