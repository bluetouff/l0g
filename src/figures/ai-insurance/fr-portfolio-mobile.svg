<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 448" role="img" aria-labelledby="ai-insurance-fr-portfolio-m-title ai-insurance-fr-portfolio-m-desc" font-family="Inter Variable, Inter, sans-serif" font-weight="400" style="width:100%;height:auto" class="ai-insurance-svg">
  <title id="ai-insurance-fr-portfolio-m-title">Les placements numériques d’Athene</title>
  <desc id="ai-insurance-fr-portfolio-m-desc">Athene publie 12,9 milliards de dollars d’investissements financés en infrastructures numériques au 30 septembre 2026 : puces, 3,6 ; dette sécurisée, dont immobilier, 3,6 ; énergie, 0,7 ; autres, surtout obligations des hyperscalers, 5,0. Les quatre barres sont à la même échelle. Mesure brute non-GAAP incluant les intérêts minoritaires ACRA. Le périmètre est plus large que l’IA. Les garanties conditionnelles ne sont pas ajoutées à ce total. Pour les prêts immobiliers CML, le classement investment grade repose sur le locataire ; cela ne vaut pas garantie à Athene.</desc>
  <text x="20" y="30" font-size="18" font-weight="500" text-anchor="start" fill="var(--color-paper)">Athene : 12,9 Md$ investis</text>
  <text x="20" y="55" font-size="14" font-weight="400" text-anchor="start" fill="var(--color-muted)">Infrastructures numériques · 30 sept. 2026</text>
  <text x="20" y="79" font-size="14" font-weight="400" text-anchor="start" fill="var(--color-muted)">Milliards de dollars · même échelle</text>
