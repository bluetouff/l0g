<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 820" style="width:100%;height:auto" class="l0g-microsoft-ai-accounts-svg" role="img" aria-labelledby="ms-accounts-en-leases-m-title ms-accounts-en-leases-m-desc"><title id="ms-accounts-en-leases-m-title">Lease classification routes cash flows</title><desc id="ms-accounts-en-leases-m-desc">Announcement on 29 July 2026: the estimated useful life of datacenters and office buildings changes from fifteen to twenty-five years from FY2027. Microsoft expects more future contracts to classify as operating leases, depending on their terms. Finance leases enter the reported CapEx measure; operating leases are excluded. Finance-lease principal payments are financing cash flows, their interest is operating cash flow. Operating-lease payments are operating cash flow. Both families give rise to balance-sheet assets and liabilities.</desc>
<rect id="ms-accounts-en-leases-m-frame" x="0" y="0" width="420" height="820" rx="5" fill="var(--color-ink)"></rect>
<text data-panel="ms-accounts-en-leases-m-frame" x="24" y="32" fill="var(--color-signal)" font-family="l0g Microsoft Accounts" font-size="17" font-weight="700" text-anchor="start">l0g / MICROSOFT / 06</text>
<line x1="24" y1="47" x2="396" y2="47" stroke="var(--color-line-strong)" stroke-width="1.5"></line>
<text data-panel="ms-accounts-en-leases-m-frame" x="24" y="84" fill="var(--color-paper)" font-family="l0g Microsoft Accounts" font-size="25" font-weight="700" text-anchor="start">Lease classification</text>
<text data-panel="ms-accounts-en-leases-m-frame" x="24" y="117.75" fill="var(--color-paper)" font-family="l0g Microsoft Accounts" font-size="25" font-weight="700" text-anchor="start">routes cash flows</text>
<text data-panel="ms-accounts-en-leases-m-frame" x="24" y="142" fill="var(--color-muted)" font-family="l0g Microsoft Accounts" font-size="17" font-weight="400" text-anchor="start">Buildings · decision on 29 July 2026</text>
<rect id="ms-accounts-en-leases-m-building-life" x="24" y="175" width="372" height="113" rx="5" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1.5"></rect>
<text data-panel="ms-accounts-en-leases-m-building-life" x="40" y="207" fill="var(--color-muted)" font-family="l0g Microsoft Accounts" font-size="17" font-weight="400" text-anchor="start">Estimated useful life · FY2027</text>
<text data-panel="ms-accounts-en-leases-m-building-life" x="40" y="258" fill="var(--color-signal)" font-family="l0g Microsoft Accounts" font-size="30" font-weight="700" text-anchor="start">15 → 25 years</text>
<rect id="ms-accounts-en-leases-m-lease-0" x="24" y="315" width="372" height="201" rx="5" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1.5"></rect>
<text data-panel="ms-accounts-en-leases-m-lease-0" x="42" y="350" fill="var(--color-signal)" font-family="l0g Microsoft Accounts" font-size="24" font-weight="700" text-anchor="start">Finance lease</text>
<text data-panel="ms-accounts-en-leases-m-lease-0" x="42" y="387" fill="var(--color-paper)" font-family="l0g Microsoft Accounts" font-size="17" font-weight="700" text-anchor="start">Communicated CapEx: included</text>
<text data-panel="ms-accounts-en-leases-m-lease-0" x="42" y="421" fill="var(--color-muted)" font-family="l0g Microsoft Accounts" font-size="17" font-weight="400" text-anchor="start">Asset and liability on balance sheet</text>
<text data-panel="ms-accounts-en-leases-m-lease-0" x="42" y="468" fill="var(--color-paper)" font-family="l0g Microsoft Accounts" font-size="17" font-weight="400" text-anchor="start">Principal</text>
<line x1="202" y1="460" x2="287" y2="460" stroke="var(--color-signal)" stroke-width="2"></line>
<path d="M 281 454 L 287 460 L 281 466" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
