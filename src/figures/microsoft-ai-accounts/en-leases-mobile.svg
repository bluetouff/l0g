<path d="M 281 677 L 287 683 L 281 689" fill="none" stroke="var(--color-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
<text data-panel="ms-accounts-en-leases-m-lease-1" x="302" y="691" fill="var(--color-accent)" font-family="l0g Microsoft Accounts" font-size="20" font-weight="700" text-anchor="start">CFO</text>
<text data-panel="ms-accounts-en-leases-m-frame" x="24" y="783" fill="var(--color-muted)" font-family="l0g Microsoft Accounts" font-size="17" font-weight="400" text-anchor="start">CFO: operations · CFF: financing</text>
<text data-panel="ms-accounts-en-leases-m-frame" x="24" y="808" fill="var(--color-muted)" font-family="l0g Microsoft Accounts" font-size="17" font-weight="400" text-anchor="start">Future classification depends on contract</text>
