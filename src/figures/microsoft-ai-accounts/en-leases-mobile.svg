<text data-panel="ms-accounts-en-leases-m-lease-1" x="42" y="644" fill="var(--color-muted)" font-family="l0g Microsoft Accounts" font-size="17" font-weight="400" text-anchor="start">Asset and liability on balance sheet</text>
<text data-panel="ms-accounts-en-leases-m-lease-1" x="42" y="691" fill="var(--color-paper)" font-family="l0g Microsoft Accounts" font-size="17" font-weight="400" text-anchor="start">Lease payments</text>
