<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" style="width:100%;height:auto" class="l0g-microsoft-ai-accounts-svg" role="img" aria-labelledby="ms-accounts-fr-leases-d-title ms-accounts-fr-leases-d-desc"><title id="ms-accounts-fr-leases-d-title">Le classement oriente les flux</title><desc id="ms-accounts-fr-leases-d-desc">Annonce du 29 juillet 2026 : la durée utile estimée des datacenters et bureaux passe de quinze à vingt-cinq ans à partir de FY2027. Microsoft attend davantage de futurs contrats classés en operating leases, selon leurs conditions. Les finance leases entrent dans le CapEx communiqué ; les operating leases en sont exclus. Les paiements de principal des finance leases passent dans les flux de financement, leurs intérêts dans les flux opérationnels. Les paiements des operating leases passent dans les flux opérationnels. Les deux familles donnent lieu à des actifs et passifs au bilan.</desc>
