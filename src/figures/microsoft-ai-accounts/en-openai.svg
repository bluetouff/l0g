<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" style="width:100%;height:auto" class="l0g-microsoft-ai-accounts-svg" role="img" aria-labelledby="ms-accounts-en-openai-d-title ms-accounts-en-openai-d-desc"><title id="ms-accounts-en-openai-d-title">Accounting relationships with OpenAI</title><desc id="ms-accounts-en-openai-d-desc">Microsoft FY2026 reports 24.1 billion dollars of revenue from commercial arrangements with OpenAI, including revenue-sharing payments. Receivables related to OpenAI are 6.0 billion at 30 June 2026, a stock at a date. The OpenAI investment gain is 6.530 billion before tax and 4.963 billion after tax, distinct from operating income. These amounts use different accounting bases and are not added.</desc>
