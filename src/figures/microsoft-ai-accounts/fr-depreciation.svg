<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" style="width:100%;height:auto" class="l0g-microsoft-ai-accounts-svg" role="img" aria-labelledby="ms-accounts-fr-depreciation-d-title ms-accounts-fr-depreciation-d-desc"><title id="ms-accounts-fr-depreciation-d-title">La durée répartit la charge annuelle</title><desc id="ms-accounts-fr-depreciation-d-desc">Simulation ex ante d’un actif neuf de 120 unités, payé immédiatement, sans valeur résiduelle. Avec un amortissement linéaire sur quatre ans, la charge est 30 par an pendant quatre ans puis zéro. Sur six ans, elle est 20 par an pendant six ans. Dans les deux cas la sortie initiale et le total des charges sont 120. Le modèle explique une politique comptable et ne reproduit pas le changement prospectif de Microsoft sur son parc existant.</desc>
