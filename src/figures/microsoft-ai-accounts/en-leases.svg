<text data-panel="ms-accounts-en-leases-d-frame" x="34" y="657" fill="var(--color-muted)" font-family="l0g Microsoft Accounts" font-size="22" font-weight="400" text-anchor="start">CFO: operations · CFF: financing</text>
<text data-panel="ms-accounts-en-leases-d-frame" x="34" y="686" fill="var(--color-muted)" font-family="l0g Microsoft Accounts" font-size="22" font-weight="400" text-anchor="start">Future classification depends on contract</text>
