<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 680" style="width:100%;height:auto" class="l0g-microsoft-ai-accounts-svg" role="img" aria-labelledby="ms-accounts-en-depreciation-m-title ms-accounts-en-depreciation-m-desc"><title id="ms-accounts-en-depreciation-m-title">Useful life allocates annual expense</title><desc id="ms-accounts-en-depreciation-m-desc">Ex ante simulation of a new asset costing 120 units, paid immediately, with zero residual value. Four-year straight-line depreciation gives a charge of 30 per year for four years, then zero. Six years gives 20 per year for six years. In both cases initial cash and total expense are 120. The model explains an accounting policy; it does not reproduce Microsoft’s prospective estimate change for its existing asset base.</desc>
<rect id="ms-accounts-en-depreciation-m-frame" x="0" y="0" width="420" height="680" rx="5" fill="var(--color-ink)"></rect>
<text data-panel="ms-accounts-en-depreciation-m-frame" x="24" y="32" fill="var(--color-signal)" font-family="l0g Microsoft Accounts" font-size="17" font-weight="700" text-anchor="start">l0g / MICROSOFT / 05</text>
<line x1="24" y1="47" x2="396" y2="47" stroke="var(--color-line-strong)" stroke-width="1.5"></line>
<text data-panel="ms-accounts-en-depreciation-m-frame" x="24" y="84" fill="var(--color-paper)" font-family="l0g Microsoft Accounts" font-size="25" font-weight="700" text-anchor="start">Useful life allocates</text>
<text data-panel="ms-accounts-en-depreciation-m-frame" x="24" y="117.75" fill="var(--color-paper)" font-family="l0g Microsoft Accounts" font-size="25" font-weight="700" text-anchor="start">annual expense</text>
<text data-panel="ms-accounts-en-depreciation-m-frame" x="24" y="142" fill="var(--color-muted)" font-family="l0g Microsoft Accounts" font-size="17" font-weight="400" text-anchor="start">Fictional new asset · cost 120 · residual 0</text>
