<text data-panel="ms-accounts-en-depreciation-m-depreciation-chart" x="40" y="245" fill="var(--color-accent)" font-family="l0g Microsoft Accounts" font-size="17" font-weight="700" text-anchor="start">6 years: 20/year · rose</text>
