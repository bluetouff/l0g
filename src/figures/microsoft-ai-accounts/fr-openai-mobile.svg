<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 790" style="width:100%;height:auto" class="l0g-microsoft-ai-accounts-svg" role="img" aria-labelledby="ms-accounts-fr-openai-m-title ms-accounts-fr-openai-m-desc"><title id="ms-accounts-fr-openai-m-title">Les relations comptables avec OpenAI</title><desc id="ms-accounts-fr-openai-m-desc">Microsoft FY2026 présente 24,1 milliards de dollars de revenus d’accords commerciaux avec OpenAI, revenue sharing inclus. Au 30 juin 2026, les créances liées à OpenAI sont de 6,0 milliards, un stock à une date. Le gain sur l’investissement OpenAI est de 6,530 milliards avant impôt et 4,963 milliards après impôt, distinct du résultat opérationnel. Ces montants relèvent de bases comptables différentes et ne sont pas additionnés.</desc>
