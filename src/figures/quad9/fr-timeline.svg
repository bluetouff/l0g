<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 317" style="display:block;width:100%;height:auto" role="img" aria-labelledby="quad9-fr-timeline-title quad9-fr-timeline-desc" xml:lang="fr" font-family="system-ui, sans-serif">
  <title id="quad9-fr-timeline-title">Du jugement au retrait</title>
  <desc id="quad9-fr-timeline-desc">En 2026, le tribunal ordonne un blocage en mai et prononce une astreinte en octobre. Quad9 annonce son départ. Le jugement d’octobre indique le 14 novembre comme terme prévu et Quad9 programme son retrait le 24 novembre.</desc>
  <rect x="0" y="0" width="560" height="317" rx="13" fill="#0b0d10" stroke="none"/>
  <text x="25" y="35" font-size="19" fill="#f5f6f8" text-anchor="start">Du jugement au retrait</text>
  <line x1="25" y1="49" x2="535" y2="49" stroke="#424751"/>
  <line x1="125" y1="73" x2="125" y2="258" stroke="#424751"/>
  <text x="25" y="79" font-size="14" fill="#5eead4" text-anchor="start" font-family="ui-monospace, Menlo, monospace">13 mai</text>
  <circle cx="125" cy="74" r="4" fill="#0b0d10" stroke="#5eead4"/>
  <text x="147" y="79" font-size="15" fill="#f5f6f8" text-anchor="start">Injonction de blocage</text>
  <text x="147" y="96" font-size="12" fill="#a9adb7" text-anchor="start">Six domaines visés au départ</text>
  <text x="25" y="124" font-size="14" fill="#f5b65b" text-anchor="start" font-family="ui-monospace, Menlo, monospace">21 oct.</text>
  <circle cx="125" cy="119" r="4" fill="#0b0d10" stroke="#f5b65b"/>
  <text x="147" y="124" font-size="15" fill="#f5f6f8" text-anchor="start">Astreinte judiciaire</text>
  <text x="147" y="141" font-size="12" fill="#a9adb7" text-anchor="start">1 000 € par jour jusqu’au 14 novembre</text>
  <text x="25" y="169" font-size="14" fill="#f5b65b" text-anchor="start" font-family="ui-monospace, Menlo, monospace">22 oct.</text>
  <circle cx="125" cy="164" r="4" fill="#0b0d10" stroke="#f5b65b"/>
  <text x="147" y="169" font-size="15" fill="#f5f6f8" text-anchor="start">Quad9 annonce son retrait</text>
  <text x="147" y="186" font-size="12" fill="#a9adb7" text-anchor="start">La fondation invoque le poids des procédures</text>
  <text x="25" y="214" font-size="14" fill="#a9adb7" text-anchor="start" font-family="ui-monospace, Menlo, monospace">14 nov.</text>
  <circle cx="125" cy="209" r="4" fill="#0b0d10" stroke="#a9adb7"/>
  <text x="147" y="214" font-size="15" fill="#f5f6f8" text-anchor="start">Terme prévu des mesures WTA</text>
  <text x="147" y="231" font-size="12" fill="#a9adb7" text-anchor="start">L’astreinte de ce dossier s’arrête à cette échéance</text>
  <text x="25" y="259" font-size="14" fill="#fa8585" text-anchor="start" font-family="ui-monospace, Menlo, monospace">24 nov.</text>
  <circle cx="125" cy="254" r="4" fill="#0b0d10" stroke="#fa8585"/>
  <text x="147" y="259" font-size="15" fill="#f5f6f8" text-anchor="start">Retrait programmé à 9 h, heure de Paris</text>
  <text x="147" y="276" font-size="12" fill="#a9adb7" text-anchor="start">Quad9 vise les requêtes classées comme françaises</text>
  <text x="25" y="300" font-size="12" fill="#a9adb7" text-anchor="start">Sources : tribunal judiciaire de Paris et annonces de Quad9, 2026</text>
</svg>
