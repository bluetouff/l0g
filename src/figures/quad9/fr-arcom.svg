<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 301" style="display:block;width:100%;height:auto" role="img" aria-labelledby="quad9-fr-arcom-title quad9-fr-arcom-desc" xml:lang="fr" font-family="system-ui, sans-serif">
  <title id="quad9-fr-arcom-title">Les blocages sportifs notifiés par l’Arcom</title>
  <desc id="quad9-fr-arcom-desc">L’Arcom comptabilise 772 mesures notifiées en 2022, 1 544 en 2023, 3 794 en 2024 et 6 496 en 2025.</desc>
  <rect x="0" y="0" width="560" height="301" rx="13" fill="#0b0d10" stroke="none"/>
  <text x="25" y="35" font-size="19" fill="#f5f6f8" text-anchor="start">Les blocages sportifs notifiés par l’Arcom</text>
  <line x1="25" y1="49" x2="535" y2="49" stroke="#424751"/>
  <text x="25" y="72" font-size="13" fill="#a9adb7" text-anchor="start">Mesures notifiées au titre du blocage des services sportifs, par année</text>
  <line x1="65" y1="238.0" x2="535" y2="238.0" stroke="#424751"/>
  <text x="54" y="242.0" font-size="12" fill="#a9adb7" text-anchor="end" font-family="ui-monospace, Menlo, monospace">0</text>
  <line x1="65" y1="196.0" x2="535" y2="196.0" stroke="#424751"/>
  <text x="54" y="200.0" font-size="12" fill="#a9adb7" text-anchor="end" font-family="ui-monospace, Menlo, monospace">2 000</text>
  <line x1="65" y1="154.0" x2="535" y2="154.0" stroke="#424751"/>
  <text x="54" y="158.0" font-size="12" fill="#a9adb7" text-anchor="end" font-family="ui-monospace, Menlo, monospace">4 000</text>
  <line x1="65" y1="111.99999999999999" x2="535" y2="111.99999999999999" stroke="#424751"/>
  <text x="54" y="115.99999999999999" font-size="12" fill="#a9adb7" text-anchor="end" font-family="ui-monospace, Menlo, monospace">6 000</text>
  <rect x="91" y="221.79" width="62" height="16.21" rx="3" fill="#407c79" stroke="none"/>
  <text x="122" y="213.79" font-size="15" fill="#f5f6f8" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">772</text>
  <text x="122" y="259" font-size="12" fill="#a9adb7" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">2022</text>
  <rect x="208" y="205.58" width="62" height="32.42" rx="3" fill="#407c79" stroke="none"/>
