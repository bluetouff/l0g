  <text x="239" y="259" font-size="12" fill="#a9adb7" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">2023</text>
  <rect x="325" y="158.33" width="62" height="79.67" rx="3" fill="#407c79" stroke="none"/>
  <text x="356" y="150.33" font-size="15" fill="#f5f6f8" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">3 794</text>
  <text x="356" y="259" font-size="12" fill="#a9adb7" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">2024</text>
  <rect x="442" y="101.58" width="62" height="136.42" rx="3" fill="#5eead4" stroke="none"/>
