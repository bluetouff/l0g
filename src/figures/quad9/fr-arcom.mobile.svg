<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 344 272" style="display:block;width:100%;height:auto" role="img" aria-labelledby="quad9-fr-arcom.mobile-title quad9-fr-arcom.mobile-desc" xml:lang="fr" font-family="system-ui, sans-serif">
  <title id="quad9-fr-arcom.mobile-title">Blocage sportif : les chiffres de l’Arcom</title>
  <desc id="quad9-fr-arcom.mobile-desc">L’Arcom comptabilise 772 mesures notifiées en 2022, 1 544 en 2023, 3 794 en 2024 et 6 496 en 2025.</desc>
  <rect x="0" y="0" width="344" height="272" rx="13" fill="#0b0d10" stroke="none"/>
  <text x="17" y="35" font-size="17" fill="#f5f6f8" text-anchor="start">Blocage sportif : les chiffres de l’Arcom</text>
  <line x1="17" y1="49" x2="327" y2="49" stroke="#424751"/>
  <text x="17" y="71" font-size="12" fill="#a9adb7" text-anchor="start">Mesures de blocage notifiées, par année</text>
  <line x1="68" y1="91" x2="68" y2="236" stroke="#424751"/>
  <text x="17" y="110" font-size="13" fill="#a9adb7" text-anchor="start" font-family="ui-monospace, Menlo, monospace">2022</text>
  <rect x="68" y="97" width="22.39" height="18" rx="3" fill="#407c79" stroke="none"/>
  <text x="98.39" y="110" font-size="13" fill="#f5f6f8" text-anchor="start" font-family="ui-monospace, Menlo, monospace">772</text>
  <text x="17" y="144" font-size="13" fill="#a9adb7" text-anchor="start" font-family="ui-monospace, Menlo, monospace">2023</text>
  <rect x="68" y="131" width="44.78" height="18" rx="3" fill="#407c79" stroke="none"/>
  <text x="120.78" y="144" font-size="13" fill="#f5f6f8" text-anchor="start" font-family="ui-monospace, Menlo, monospace">1 544</text>
  <text x="17" y="178" font-size="13" fill="#a9adb7" text-anchor="start" font-family="ui-monospace, Menlo, monospace">2024</text>
  <rect x="68" y="165" width="110.03" height="18" rx="3" fill="#407c79" stroke="none"/>
  <text x="186.03" y="178" font-size="13" fill="#f5f6f8" text-anchor="start" font-family="ui-monospace, Menlo, monospace">3 794</text>
  <text x="17" y="212" font-size="13" fill="#a9adb7" text-anchor="start" font-family="ui-monospace, Menlo, monospace">2025</text>
  <rect x="68" y="199" width="188.38" height="18" rx="3" fill="#5eead4" stroke="none"/>
  <text x="264.38" y="212" font-size="13" fill="#f5f6f8" text-anchor="start" font-family="ui-monospace, Menlo, monospace">6 496</text>
  <text x="17" y="255" font-size="11" fill="#a9adb7" text-anchor="start">Source : Arcom, rapport d’activité 2025, p. 49–50</text>
</svg>
