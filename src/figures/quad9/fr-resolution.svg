<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 302" style="display:block;width:100%;height:auto" role="img" aria-labelledby="quad9-fr-resolution-title quad9-fr-resolution-desc" xml:lang="fr" font-family="system-ui, sans-serif">
  <title id="quad9-fr-resolution-title">Du nom à la connexion</title>
  <desc id="quad9-fr-resolution-desc">Le résolveur DNS cherche une adresse, au besoin auprès du serveur DNS de la zone. L’appareil peut ensuite joindre le site. Un refus du résolveur empêche de poursuivre ce trajet pour la requête concernée.</desc>
  <rect x="0" y="0" width="560" height="302" rx="13" fill="#0b0d10" stroke="none"/>
  <text x="25" y="35" font-size="19" fill="#f5f6f8" text-anchor="start">Du nom à la connexion</text>
  <line x1="25" y1="49" x2="535" y2="49" stroke="#424751"/>
  <text x="25" y="73" font-size="14" fill="#5eead4" text-anchor="start">En temps normal</text>
  <rect x="25" y="85" width="143" height="52" rx="7" fill="#15191f" stroke="#424751"/>
  <rect x="37" y="96" width="18" height="12" rx="2" fill="none" stroke="#5eead4"/>
  <line x1="42" y1="112" x2="50" y2="112" stroke="#5eead4"/>
  <line x1="46" y1="108" x2="46" y2="112" stroke="#5eead4"/>
  <text x="64" y="109" font-size="14" fill="#f5f6f8" text-anchor="start">Appareil</text>
  <text x="64" y="126" font-size="12" fill="#a9adb7" text-anchor="start">Nom du site</text>
  <rect x="208" y="85" width="143" height="52" rx="7" fill="#15191f" stroke="#424751"/>
  <circle cx="221" cy="103" r="2" fill="#0b0d10" stroke="#5eead4"/>
  <circle cx="236" cy="98" r="2" fill="#0b0d10" stroke="#5eead4"/>
  <circle cx="236" cy="108" r="2" fill="#0b0d10" stroke="#5eead4"/>
  <line x1="223" y1="103" x2="234" y2="98" stroke="#5eead4"/>
  <line x1="223" y1="103" x2="234" y2="108" stroke="#5eead4"/>
  <text x="247" y="109" font-size="14" fill="#f5f6f8" text-anchor="start">Résolveur DNS</text>
  <text x="247" y="126" font-size="12" fill="#a9adb7" text-anchor="start">Cache ou requête</text>
  <rect x="391" y="85" width="143" height="52" rx="7" fill="#15191f" stroke="#424751"/>
  <rect x="403" y="96" width="18" height="7" rx="2" fill="none" stroke="#5eead4"/>
  <rect x="403" y="106" width="18" height="7" rx="2" fill="none" stroke="#5eead4"/>
  <circle cx="407" cy="99.5" r="0.85" fill="#5eead4" stroke="none"/>
  <circle cx="407" cy="109.5" r="0.85" fill="#5eead4" stroke="none"/>
  <text x="430" y="109" font-size="14" fill="#f5f6f8" text-anchor="start">DNS de la zone</text>
  <text x="430" y="126" font-size="12" fill="#a9adb7" text-anchor="start">Adresse du site</text>
  <line x1="173" y1="103" x2="203" y2="103" stroke="#5eead4"/>
  <path d="M198 100 L203 103 L198 106" stroke="#5eead4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <line x1="356" y1="103" x2="386" y2="103" stroke="#5eead4"/>
  <path d="M381 100 L386 103 L381 106" stroke="#5eead4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <line x1="203" y1="121" x2="173" y2="121" stroke="#8db5ff"/>
  <path d="M178 118 L173 121 L178 124" stroke="#8db5ff" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <line x1="386" y1="121" x2="356" y2="121" stroke="#8db5ff"/>
  <path d="M361 118 L356 121 L361 124" stroke="#8db5ff" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="25" y="160" font-size="13" fill="#a9adb7" text-anchor="start">L’appareil utilise ensuite l’adresse pour joindre le site en HTTPS.</text>
  <line x1="25" y1="176" x2="535" y2="176" stroke="#424751"/>
  <text x="25" y="199" font-size="14" fill="#fa8585" text-anchor="start">Après le retrait annoncé</text>
  <rect x="25" y="211" width="143" height="52" rx="7" fill="#15191f" stroke="#424751"/>
  <rect x="37" y="222" width="18" height="12" rx="2" fill="none" stroke="#5eead4"/>
  <line x1="42" y1="238" x2="50" y2="238" stroke="#5eead4"/>
  <line x1="46" y1="234" x2="46" y2="238" stroke="#5eead4"/>
