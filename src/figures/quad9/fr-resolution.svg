  <path d="M367 232 L375 242 M375 232 L367 242" stroke="#fa8585" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="25" y="286" font-size="12" fill="#a9adb7" text-anchor="start">Sources : RFC 9499 et Quad9, 24 novembre 2026</text>
