  <path d="M412 221 Q405 229 412 237 M412 221 Q419 229 412 237" stroke="#a9adb7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="430" y="235" font-size="14" fill="#f5f6f8" text-anchor="start">Site web</text>
  <text x="430" y="252" font-size="12" fill="#a9adb7" text-anchor="start">Non joint ici</text>
  <line x1="173" y1="229" x2="203" y2="229" stroke="#5eead4"/>
  <path d="M198 226 L203 229 L198 232" stroke="#5eead4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <line x1="203" y1="247" x2="173" y2="247" stroke="#fa8585"/>
  <path d="M178 244 L173 247 L178 250" stroke="#fa8585" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
