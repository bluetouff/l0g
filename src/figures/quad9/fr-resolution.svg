  <circle cx="236" cy="234" r="2" fill="#0b0d10" stroke="#fa8585"/>
  <line x1="223" y1="229" x2="234" y2="224" stroke="#fa8585"/>
  <line x1="223" y1="229" x2="234" y2="234" stroke="#fa8585"/>
  <text x="247" y="235" font-size="14" fill="#f5f6f8" text-anchor="start">Quad9</text>
  <text x="220" y="252" font-size="11.5" fill="#a9adb7" text-anchor="start">Classée France</text>
  <rect x="391" y="211" width="143" height="52" rx="7" fill="#15191f" stroke="#424751"/>
  <circle cx="412" cy="229" r="8" fill="none" stroke="#a9adb7"/>
