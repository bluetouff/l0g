<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 344 310" style="display:block;width:100%;height:auto" role="img" aria-labelledby="quad9-fr-resolution.mobile-title quad9-fr-resolution.mobile-desc" xml:lang="fr" font-family="system-ui, sans-serif">
  <title id="quad9-fr-resolution.mobile-title">Du nom à la connexion</title>
  <desc id="quad9-fr-resolution.mobile-desc">Le résolveur cherche une adresse. L’appareil peut ensuite contacter le site. Un refus du résolveur empêche la connexion dans cet exemple.</desc>
