<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 301" style="display:block;width:100%;height:auto" role="img" aria-labelledby="quad9-en-arcom-title quad9-en-arcom-desc" xml:lang="en" font-family="system-ui, sans-serif">
  <title id="quad9-en-arcom-title">Sports blocking measures notified by Arcom</title>
  <desc id="quad9-en-arcom-desc">Arcom reports 772 measures notified in 2022, 1,544 in 2023, 3,794 in 2024 and 6,496 in 2025.</desc>
