  <text x="239" y="259" font-size="12" fill="#a9adb7" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">2023</text>
  <rect x="325" y="158.33" width="62" height="79.67" rx="3" fill="#407c79" stroke="none"/>
