<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 344 312" style="display:block;width:100%;height:auto" role="img" aria-labelledby="quad9-en-timeline.mobile-title quad9-en-timeline.mobile-desc" xml:lang="en" font-family="system-ui, sans-serif">
  <title id="quad9-en-timeline.mobile-title">From court order to withdrawal</title>
  <desc id="quad9-en-timeline.mobile-desc">In 2026, a court order targets six domains in May. The court imposes a penalty in October. Quad9 announces its exit, scheduled after the Court’s stated end date.</desc>
  <rect x="0" y="0" width="344" height="312" rx="13" fill="#0b0d10" stroke="none"/>
  <text x="17" y="35" font-size="17" fill="#f5f6f8" text-anchor="start">From court order to withdrawal</text>
  <line x1="17" y1="49" x2="327" y2="49" stroke="#424751"/>
  <line x1="86" y1="69" x2="86" y2="247" stroke="#424751"/>
  <text x="17" y="76" font-size="12" fill="#5eead4" text-anchor="start" font-family="ui-monospace, Menlo, monospace">13 May</text>
  <circle cx="86" cy="72" r="3.5" fill="#0b0d10" stroke="#5eead4"/>
  <text x="100" y="76" font-size="13" fill="#f5f6f8" text-anchor="start">Blocking order</text>
  <text x="100" y="93" font-size="11.5" fill="#a9adb7" text-anchor="start">Six domain names initially covered</text>
  <text x="17" y="120" font-size="12" fill="#f5b65b" text-anchor="start" font-family="ui-monospace, Menlo, monospace">21 Oct.</text>
  <circle cx="86" cy="116" r="3.5" fill="#0b0d10" stroke="#f5b65b"/>
  <text x="100" y="120" font-size="13" fill="#f5f6f8" text-anchor="start">Court-ordered penalty</text>
  <text x="100" y="137" font-size="11.5" fill="#a9adb7" text-anchor="start">€1,000 a day through 14 Nov.</text>
  <text x="17" y="164" font-size="12" fill="#f5b65b" text-anchor="start" font-family="ui-monospace, Menlo, monospace">22 Oct.</text>
  <circle cx="86" cy="160" r="3.5" fill="#0b0d10" stroke="#f5b65b"/>
  <text x="100" y="164" font-size="13" fill="#f5f6f8" text-anchor="start">Quad9 announces its withdrawal</text>
  <text x="100" y="181" font-size="11.5" fill="#a9adb7" text-anchor="start">The foundation cites court proceedings</text>
  <text x="17" y="208" font-size="12" fill="#a9adb7" text-anchor="start" font-family="ui-monospace, Menlo, monospace">14 Nov.</text>
  <circle cx="86" cy="204" r="3.5" fill="#0b0d10" stroke="#a9adb7"/>
  <text x="100" y="208" font-size="13" fill="#f5f6f8" text-anchor="start">WTA measures due to end</text>
  <text x="100" y="225" font-size="11.5" fill="#a9adb7" text-anchor="start">The penalty in this case ends, too</text>
  <text x="17" y="252" font-size="12" fill="#fa8585" text-anchor="start" font-family="ui-monospace, Menlo, monospace">24 Nov.</text>
  <circle cx="86" cy="248" r="3.5" fill="#0b0d10" stroke="#fa8585"/>
  <text x="100" y="252" font-size="13" fill="#f5f6f8" text-anchor="start">Exit scheduled for 9 a.m. in Paris</text>
  <text x="100" y="269" font-size="11.5" fill="#a9adb7" text-anchor="start">Queries mapped to France are affected</text>
  <text x="17" y="296" font-size="11" fill="#a9adb7" text-anchor="start">Sources: Paris Judicial Court and Quad9, 2026</text>
</svg>
