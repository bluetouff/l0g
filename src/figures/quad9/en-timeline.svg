<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 317" style="display:block;width:100%;height:auto" role="img" aria-labelledby="quad9-en-timeline-title quad9-en-timeline-desc" xml:lang="en" font-family="system-ui, sans-serif">
  <title id="quad9-en-timeline-title">From court order to withdrawal</title>
  <desc id="quad9-en-timeline-desc">The court orders blocking in May 2026 and imposes a daily penalty in October. Quad9 announces its withdrawal. The WTA measure expires on November 14 and Quad9 schedules its withdrawal for November 24.</desc>
  <rect x="0" y="0" width="560" height="317" rx="13" fill="#0b0d10" stroke="none"/>
  <text x="25" y="35" font-size="19" fill="#f5f6f8" text-anchor="start">From court order to withdrawal</text>
  <line x1="25" y1="49" x2="535" y2="49" stroke="#424751"/>
  <line x1="125" y1="73" x2="125" y2="258" stroke="#424751"/>
  <text x="25" y="79" font-size="14" fill="#5eead4" text-anchor="start" font-family="ui-monospace, Menlo, monospace">13 May</text>
  <circle cx="125" cy="74" r="4" fill="#0b0d10" stroke="#5eead4"/>
  <text x="147" y="79" font-size="15" fill="#f5f6f8" text-anchor="start">Blocking order</text>
  <text x="147" y="96" font-size="12" fill="#a9adb7" text-anchor="start">Six domain names initially covered</text>
  <text x="25" y="124" font-size="14" fill="#f5b65b" text-anchor="start" font-family="ui-monospace, Menlo, monospace">21 Oct.</text>
  <circle cx="125" cy="119" r="4" fill="#0b0d10" stroke="#f5b65b"/>
  <text x="147" y="124" font-size="15" fill="#f5f6f8" text-anchor="start">Court-ordered penalty</text>
  <text x="147" y="141" font-size="12" fill="#a9adb7" text-anchor="start">€1,000 a day through 14 November</text>
  <text x="25" y="169" font-size="14" fill="#f5b65b" text-anchor="start" font-family="ui-monospace, Menlo, monospace">22 Oct.</text>
  <circle cx="125" cy="164" r="4" fill="#0b0d10" stroke="#f5b65b"/>
  <text x="147" y="169" font-size="15" fill="#f5f6f8" text-anchor="start">Quad9 announces its withdrawal</text>
  <text x="147" y="186" font-size="12" fill="#a9adb7" text-anchor="start">The foundation cites the burden of court proceedings</text>
  <text x="25" y="214" font-size="14" fill="#a9adb7" text-anchor="start" font-family="ui-monospace, Menlo, monospace">14 Nov.</text>
  <circle cx="125" cy="209" r="4" fill="#0b0d10" stroke="#a9adb7"/>
  <text x="147" y="214" font-size="15" fill="#f5f6f8" text-anchor="start">WTA measures due to end</text>
  <text x="147" y="231" font-size="12" fill="#a9adb7" text-anchor="start">The penalty in this case ends on the same date</text>
  <text x="25" y="259" font-size="14" fill="#fa8585" text-anchor="start" font-family="ui-monospace, Menlo, monospace">24 Nov.</text>
  <circle cx="125" cy="254" r="4" fill="#0b0d10" stroke="#fa8585"/>
  <text x="147" y="259" font-size="15" fill="#f5f6f8" text-anchor="start">Withdrawal scheduled for 9 a.m. Paris time</text>
  <text x="147" y="276" font-size="12" fill="#a9adb7" text-anchor="start">Quad9 targets queries it identifies as coming from France</text>
  <text x="25" y="300" font-size="12" fill="#a9adb7" text-anchor="start">Sources: Paris Judicial Court and Quad9 statements, 2026</text>
</svg>
