<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 344 312" style="display:block;width:100%;height:auto" role="img" aria-labelledby="quad9-fr-timeline.mobile-title quad9-fr-timeline.mobile-desc" xml:lang="fr" font-family="system-ui, sans-serif">
  <title id="quad9-fr-timeline.mobile-title">Du jugement au retrait</title>
  <desc id="quad9-fr-timeline.mobile-desc">En 2026, une injonction vise six domaines en mai. Le tribunal prononce une astreinte en octobre. Quad9 annonce son départ, prévu après la fin des mesures WTA.</desc>
  <rect x="0" y="0" width="344" height="312" rx="13" fill="#0b0d10" stroke="none"/>
  <text x="17" y="35" font-size="17" fill="#f5f6f8" text-anchor="start">Du jugement au retrait</text>
  <line x1="17" y1="49" x2="327" y2="49" stroke="#424751"/>
  <line x1="86" y1="69" x2="86" y2="247" stroke="#424751"/>
  <text x="17" y="76" font-size="12" fill="#5eead4" text-anchor="start" font-family="ui-monospace, Menlo, monospace">13 mai</text>
  <circle cx="86" cy="72" r="3.5" fill="#0b0d10" stroke="#5eead4"/>
  <text x="100" y="76" font-size="13" fill="#f5f6f8" text-anchor="start">Injonction de blocage</text>
  <text x="100" y="93" font-size="11.5" fill="#a9adb7" text-anchor="start">Six domaines visés au départ</text>
  <text x="17" y="120" font-size="12" fill="#f5b65b" text-anchor="start" font-family="ui-monospace, Menlo, monospace">21 oct.</text>
  <circle cx="86" cy="116" r="3.5" fill="#0b0d10" stroke="#f5b65b"/>
  <text x="100" y="120" font-size="13" fill="#f5f6f8" text-anchor="start">Astreinte judiciaire</text>
  <text x="100" y="137" font-size="11.5" fill="#a9adb7" text-anchor="start">1 000 € par jour jusqu’au 14 nov.</text>
  <text x="17" y="164" font-size="12" fill="#f5b65b" text-anchor="start" font-family="ui-monospace, Menlo, monospace">22 oct.</text>
  <circle cx="86" cy="160" r="3.5" fill="#0b0d10" stroke="#f5b65b"/>
  <text x="100" y="164" font-size="13" fill="#f5f6f8" text-anchor="start">Quad9 annonce son retrait</text>
  <text x="100" y="181" font-size="11.5" fill="#a9adb7" text-anchor="start">La fondation invoque les procédures</text>
  <text x="17" y="208" font-size="12" fill="#a9adb7" text-anchor="start" font-family="ui-monospace, Menlo, monospace">14 nov.</text>
  <circle cx="86" cy="204" r="3.5" fill="#0b0d10" stroke="#a9adb7"/>
  <text x="100" y="208" font-size="13" fill="#f5f6f8" text-anchor="start">Terme prévu des mesures WTA</text>
  <text x="100" y="225" font-size="11.5" fill="#a9adb7" text-anchor="start">Fin de l’astreinte dans ce dossier</text>
  <text x="17" y="252" font-size="12" fill="#fa8585" text-anchor="start" font-family="ui-monospace, Menlo, monospace">24 nov.</text>
  <circle cx="86" cy="248" r="3.5" fill="#0b0d10" stroke="#fa8585"/>
  <text x="100" y="252" font-size="13" fill="#f5f6f8" text-anchor="start">Retrait programmé à 9 h à Paris</text>
  <text x="100" y="269" font-size="11.5" fill="#a9adb7" text-anchor="start">Quad9 vise les requêtes classées France</text>
  <text x="17" y="296" font-size="11" fill="#a9adb7" text-anchor="start">Sources : tribunal judiciaire de Paris et Quad9, 2026</text>
</svg>
