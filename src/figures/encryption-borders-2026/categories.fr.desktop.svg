<title id="borders-categories-fr-d-title">Les catégories de la notice iCloud britannique</title><desc id="borders-categories-fr-d-desc">La notice britannique distingue quinze catégories chiffrées de bout en bout par défaut, maintenues, et dix catégories supplémentaires dont la nouvelle activation ADP est indisponible. Un symbole représente une catégorie. Le trajet des clés décrit seulement la protection standard de ces dix catégories.</desc>
