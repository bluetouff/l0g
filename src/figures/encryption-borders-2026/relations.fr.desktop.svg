<title id="borders-relations-fr-d-title">Les relations qui composent une offre cloud</title><desc id="borders-relations-fr-d-desc">Le client signe avec une entité et transmet des données à un service. Le stockage physique, les droits d’administration et le contrôle des clés ont des acteurs distincts dans ce modèle hypothétique. Aucun fournisseur réel ni droit de lecture universel n’est représenté.</desc>
