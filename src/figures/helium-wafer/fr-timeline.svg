<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="he-fr-timeline-d-title he-fr-timeline-d-desc" viewBox="0 0 1000 650" style="width:100%;height:auto" class="l0g-helium-wafer-svg">
<title id="he-fr-timeline-d-title">Désignation et projet industriel : le calendrier</title><desc id="he-fr-timeline-d-desc">Deux échelles de temps distinctes. En jours, la désignation de l’hélium est signée par Audrey Robertson le 21 octobre 2026, annoncée par le DOE le 23, mise à disposition du public le 26 et prévue pour publication au Federal Register le 27. Clôture documentaire au 26 octobre : le 27 reste une échéance annoncée. En années, un avis DOE daté du 21 août 2026 établit une demande d’aide fédérale pour Dry Piney, avec un chantier envisagé du troisième trimestre 2026 au troisième trimestre 2029. Le début effectif et la décision de financement définitive restent à établir. Sources : DOE, Federal Register 2026-21884 et avis Dry Piney [1, 2, 17].</desc>
<rect id="he-fr-timeline-d-frame" x="0" y="0" width="1000" height="650" rx="12" fill="var(--color-ink)"/>
<text data-panel="he-fr-timeline-d-frame" x="24" y="30" fill="var(--color-signal)" font-family="l0g Helium Wafer" font-size="22" font-weight="700" text-anchor="start">05 / MATIÈRE ET INDUSTRIE</text>
<text data-panel="he-fr-timeline-d-frame" x="24" y="72" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="30" font-weight="700" text-anchor="start">Désignation et projet industriel : le calendrier</text>
<rect id="he-fr-timeline-d-card-days" x="22" y="112" width="956" height="270" rx="12" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="he-fr-timeline-d-card-days" x="42" y="149" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="22" font-weight="700" text-anchor="start">OCTOBRE 2026 · ÉCHELLE EN JOURS</text>
<path d="M 150 197 L 850 197" fill="none" stroke="var(--color-line-strong)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="150.0" cy="197" r="6" fill="var(--color-signal)"/>
<text data-panel="he-fr-timeline-d-card-days" x="150.0" y="185" fill="var(--color-signal)" font-family="l0g Helium Wafer" font-size="24" font-weight="700" text-anchor="middle">21</text>
<text data-panel="he-fr-timeline-d-card-days" x="150.0" y="242" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="22" font-weight="700" text-anchor="middle">Signature</text>
<text data-panel="he-fr-timeline-d-card-days" x="150.0" y="274" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="22" font-weight="400" text-anchor="middle">Audrey Robertson</text>
<circle cx="383.333333" cy="197" r="6" fill="var(--color-signal)"/>
<text data-panel="he-fr-timeline-d-card-days" x="383.333333" y="185" fill="var(--color-signal)" font-family="l0g Helium Wafer" font-size="24" font-weight="700" text-anchor="middle">23</text>
<text data-panel="he-fr-timeline-d-card-days" x="383.333333" y="300" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="22" font-weight="700" text-anchor="middle">Annonce DOE</text>
<text data-panel="he-fr-timeline-d-card-days" x="383.333333" y="332" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="22" font-weight="400" text-anchor="middle">Communiqué</text>
<circle cx="733.333333" cy="197" r="6" fill="var(--color-signal)"/>
<text data-panel="he-fr-timeline-d-card-days" x="733.333333" y="185" fill="var(--color-signal)" font-family="l0g Helium Wafer" font-size="24" font-weight="700" text-anchor="middle">26</text>
<text data-panel="he-fr-timeline-d-card-days" x="733.333333" y="242" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="22" font-weight="700" text-anchor="middle">Mise à disposition</text>
<text data-panel="he-fr-timeline-d-card-days" x="733.333333" y="274" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="22" font-weight="400" text-anchor="middle">du public</text>
<circle cx="850.0" cy="197" r="6" fill="var(--color-amber)"/>
<text data-panel="he-fr-timeline-d-card-days" x="850.0" y="185" fill="var(--color-amber)" font-family="l0g Helium Wafer" font-size="24" font-weight="700" text-anchor="middle">27</text>
<text data-panel="he-fr-timeline-d-card-days" x="850.0" y="300" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="22" font-weight="700" text-anchor="middle">Publication prévue</text>
<text data-panel="he-fr-timeline-d-card-days" x="850.0" y="332" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="22" font-weight="400" text-anchor="middle">Federal Register</text>
<text data-panel="he-fr-timeline-d-card-days" x="42" y="364" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="22" font-weight="400" text-anchor="start">Clôture documentaire : 26 octobre. Le 27 reste une date annoncée.</text>
<rect id="he-fr-timeline-d-card-years" x="22" y="402" width="956" height="160" rx="12" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="he-fr-timeline-d-card-years" x="42" y="435" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="22" font-weight="700" text-anchor="start">DRY PINEY · WYOMING · ÉCHELLE EN ANNÉES</text>
<text data-panel="he-fr-timeline-d-card-years" x="42" y="468" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="22" font-weight="400" text-anchor="start">Avis DOE du 21 août 2026 : aide fédérale sollicitée, chantier envisagé.</text>
<path d="M 100 507 L 900 507" fill="none" stroke="var(--color-signal)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 7"/>
<circle cx="100.0" cy="507" r="6" fill="var(--color-signal)"/>
<text data-panel="he-fr-timeline-d-card-years" x="100.0" y="546" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="22" font-weight="400" text-anchor="middle">T3 2026</text>
<circle cx="366.666667" cy="507" r="6" fill="var(--color-signal)"/>
<text data-panel="he-fr-timeline-d-card-years" x="366.666667" y="546" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="22" font-weight="400" text-anchor="middle">T3 2027</text>
<circle cx="633.333333" cy="507" r="6" fill="var(--color-signal)"/>
<text data-panel="he-fr-timeline-d-card-years" x="633.333333" y="546" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="22" font-weight="400" text-anchor="middle">T3 2028</text>
<circle cx="900.0" cy="507" r="6" fill="var(--color-signal)"/>
<text data-panel="he-fr-timeline-d-card-years" x="900.0" y="546" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="22" font-weight="400" text-anchor="middle">T3 2029</text>
<text data-panel="he-fr-timeline-d-frame" x="24" y="600" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="22" font-weight="400" text-anchor="start">Début effectif et financement définitif non établis. Aide sollicitée avant octobre.</text>
<text data-panel="he-fr-timeline-d-frame" x="24" y="632" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="22" font-weight="400" text-anchor="start">DOE ; Federal Register 2026-21884 ; avis Dry Piney, 21 août 2026 [1, 2, 17].</text>
</svg>
