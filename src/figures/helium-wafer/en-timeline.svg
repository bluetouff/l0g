<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="he-en-timeline-d-title he-en-timeline-d-desc" viewBox="0 0 1000 650" style="width:100%;height:auto" class="l0g-helium-wafer-svg">
<title id="he-en-timeline-d-title">Designation and industrial project: the timeline</title><desc id="he-en-timeline-d-desc">Two separate time scales. On the day scale, helium’s designation is signed by Audrey Robertson on 21 October 2026, announced by the DOE on 23 October, made available for public inspection on 26 October and scheduled for Federal Register publication on 27 October. Research cutoff: 26 October, so the 27 October date remains scheduled. On the year scale, a DOE notice dated 21 August 2026 records a federal assistance request for Dry Piney and proposed construction from Q3 2026 to Q3 2029. Actual start and the final financing decision remain unconfirmed. Sources: DOE, Federal Register 2026-21884 and Dry Piney notice [1, 2, 17].</desc>
<rect id="he-en-timeline-d-frame" x="0" y="0" width="1000" height="650" rx="12" fill="var(--color-ink)"/>
<text data-panel="he-en-timeline-d-frame" x="24" y="30" fill="var(--color-signal)" font-family="l0g Helium Wafer" font-size="22" font-weight="700" text-anchor="start">05 / MATERIALS AND INDUSTRY</text>
<text data-panel="he-en-timeline-d-frame" x="24" y="72" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="30" font-weight="700" text-anchor="start">Designation and industrial project: the timeline</text>
<rect id="he-en-timeline-d-card-days" x="22" y="112" width="956" height="270" rx="12" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="he-en-timeline-d-card-days" x="42" y="149" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="22" font-weight="700" text-anchor="start">OCTOBER 2026 · SCALE IN DAYS</text>
<path d="M 150 197 L 850 197" fill="none" stroke="var(--color-line-strong)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="150.0" cy="197" r="6" fill="var(--color-signal)"/>
<text data-panel="he-en-timeline-d-card-days" x="150.0" y="185" fill="var(--color-signal)" font-family="l0g Helium Wafer" font-size="24" font-weight="700" text-anchor="middle">21</text>
<text data-panel="he-en-timeline-d-card-days" x="150.0" y="242" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="22" font-weight="700" text-anchor="middle">Decision signed</text>
<text data-panel="he-en-timeline-d-card-days" x="150.0" y="274" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="22" font-weight="400" text-anchor="middle">Audrey Robertson</text>
<circle cx="383.333333" cy="197" r="6" fill="var(--color-signal)"/>
<text data-panel="he-en-timeline-d-card-days" x="383.333333" y="185" fill="var(--color-signal)" font-family="l0g Helium Wafer" font-size="24" font-weight="700" text-anchor="middle">23</text>
<text data-panel="he-en-timeline-d-card-days" x="383.333333" y="300" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="22" font-weight="700" text-anchor="middle">DOE announcement</text>
<text data-panel="he-en-timeline-d-card-days" x="383.333333" y="332" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="22" font-weight="400" text-anchor="middle">Press release</text>
<circle cx="733.333333" cy="197" r="6" fill="var(--color-signal)"/>
<text data-panel="he-en-timeline-d-card-days" x="733.333333" y="185" fill="var(--color-signal)" font-family="l0g Helium Wafer" font-size="24" font-weight="700" text-anchor="middle">26</text>
<text data-panel="he-en-timeline-d-card-days" x="733.333333" y="242" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="22" font-weight="700" text-anchor="middle">Public inspection</text>
<text data-panel="he-en-timeline-d-card-days" x="733.333333" y="274" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="22" font-weight="400" text-anchor="middle">Filed 26 October</text>
<circle cx="850.0" cy="197" r="6" fill="var(--color-amber)"/>
<text data-panel="he-en-timeline-d-card-days" x="850.0" y="185" fill="var(--color-amber)" font-family="l0g Helium Wafer" font-size="24" font-weight="700" text-anchor="middle">27</text>
<text data-panel="he-en-timeline-d-card-days" x="850.0" y="300" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="22" font-weight="700" text-anchor="middle">Publication due</text>
<text data-panel="he-en-timeline-d-card-days" x="850.0" y="332" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="22" font-weight="400" text-anchor="middle">Federal Register</text>
<text data-panel="he-en-timeline-d-card-days" x="42" y="364" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="22" font-weight="400" text-anchor="start">Research cutoff: 26 October. Publication on 27 October remains scheduled.</text>
<rect id="he-en-timeline-d-card-years" x="22" y="402" width="956" height="160" rx="12" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="he-en-timeline-d-card-years" x="42" y="435" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="22" font-weight="700" text-anchor="start">DRY PINEY · WYOMING · SCALE IN YEARS</text>
<text data-panel="he-en-timeline-d-card-years" x="42" y="468" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="22" font-weight="400" text-anchor="start">DOE notice of 21 August 2026: assistance request and proposed construction.</text>
<path d="M 100 507 L 900 507" fill="none" stroke="var(--color-signal)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 7"/>
<circle cx="100.0" cy="507" r="6" fill="var(--color-signal)"/>
<text data-panel="he-en-timeline-d-card-years" x="100.0" y="546" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="22" font-weight="400" text-anchor="middle">Q3 2026</text>
<circle cx="366.666667" cy="507" r="6" fill="var(--color-signal)"/>
<text data-panel="he-en-timeline-d-card-years" x="366.666667" y="546" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="22" font-weight="400" text-anchor="middle">Q3 2027</text>
<circle cx="633.333333" cy="507" r="6" fill="var(--color-signal)"/>
<text data-panel="he-en-timeline-d-card-years" x="633.333333" y="546" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="22" font-weight="400" text-anchor="middle">Q3 2028</text>
<circle cx="900.0" cy="507" r="6" fill="var(--color-signal)"/>
<text data-panel="he-en-timeline-d-card-years" x="900.0" y="546" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="22" font-weight="400" text-anchor="middle">Q3 2029</text>
<text data-panel="he-en-timeline-d-frame" x="24" y="600" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="22" font-weight="400" text-anchor="start">Actual start and final financing unconfirmed. Assistance sought before October.</text>
<text data-panel="he-en-timeline-d-frame" x="24" y="632" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="22" font-weight="400" text-anchor="start">DOE; Federal Register 2026-21884; Dry Piney notice, 21 August 2026 [1, 2, 17].</text>
</svg>
