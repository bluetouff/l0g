<text data-panel="he-en-recovery-m-card-step-5" x="88" y="708" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="17" font-weight="700" text-anchor="start">Quality check</text>
<text data-panel="he-en-recovery-m-card-step-5" x="88" y="737" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="17" font-weight="400" text-anchor="start">Reuse if on specification</text>
