<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="he-en-recovery-m-title he-en-recovery-m-desc" viewBox="0 0 420 1210" style="width:100%;height:auto" class="l0g-helium-wafer-svg">
<title id="he-en-recovery-m-title">Recovering helium, then checking its quality</title><desc id="he-en-recovery-m-desc">Generic recovery loop: distribution to fab processes, exhaust collection and sorting, contaminant-specific pretreatment, purification and quality checks. Gas meeting specifications returns to distribution; fresh supply makes up for unrecovered gas and treatment rejects. Paths show no quantified flow, and this is separate from Samsung’s actual installation topology. Samsung reports an annual saving of approximately 4.7 tonnes on one production line as of 2025. Baseline consumption is undisclosed and a group-wide recovery rate remains unknown. Sources: Samsung and patent US20250122079A1 [15, 16].</desc>
<rect id="he-en-recovery-m-frame" x="0" y="0" width="420" height="1210" rx="12" fill="var(--color-ink)"/>
<text data-panel="he-en-recovery-m-frame" x="20" y="30" fill="var(--color-signal)" font-family="l0g Helium Wafer" font-size="17" font-weight="700" text-anchor="start">04 / MATERIALS AND INDUSTRY</text>
<text data-panel="he-en-recovery-m-frame" x="20" y="65" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="22" font-weight="700" text-anchor="start">Recovering helium,</text>
<text data-panel="he-en-recovery-m-frame" x="20" y="93" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="22" font-weight="700" text-anchor="start">then checking its quality</text>
<rect id="he-en-recovery-m-card-step-0" x="70" y="160" width="316" height="75" rx="12" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
