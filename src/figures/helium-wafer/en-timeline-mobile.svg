<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="he-en-timeline-m-title he-en-timeline-m-desc" viewBox="0 0 420 1090" style="width:100%;height:auto" class="l0g-helium-wafer-svg">
<title id="he-en-timeline-m-title">Designation and industrial project: the timeline</title><desc id="he-en-timeline-m-desc">Two separate time scales. On the day scale, helium’s designation is signed by Audrey Robertson on 21 October 2026, announced by the DOE on 23 October, made available for public inspection on 26 October and scheduled for Federal Register publication on 27 October. Research cutoff: 26 October, so the 27 October date remains scheduled. On the year scale, a DOE notice dated 21 August 2026 records a federal assistance request for Dry Piney and proposed construction from Q3 2026 to Q3 2029. Actual start and the final financing decision remain unconfirmed. Sources: DOE, Federal Register 2026-21884 and Dry Piney notice [1, 2, 17].</desc>
<rect id="he-en-timeline-m-frame" x="0" y="0" width="420" height="1090" rx="12" fill="var(--color-ink)"/>
<text data-panel="he-en-timeline-m-frame" x="20" y="30" fill="var(--color-signal)" font-family="l0g Helium Wafer" font-size="17" font-weight="700" text-anchor="start">05 / MATERIALS AND INDUSTRY</text>
<text data-panel="he-en-timeline-m-frame" x="20" y="65" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="22" font-weight="700" text-anchor="start">Designation and industrial</text>
<text data-panel="he-en-timeline-m-frame" x="20" y="93" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="22" font-weight="700" text-anchor="start">project: the timeline</text>
<rect id="he-en-timeline-m-card-days" x="16" y="124" width="388" height="451" rx="12" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="he-en-timeline-m-card-days" x="32" y="158" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="17" font-weight="700" text-anchor="start">OCTOBER 2026 · DAYS</text>
<path d="M 66 195 L 66 505" fill="none" stroke="var(--color-line-strong)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="66" cy="200" r="5" fill="var(--color-signal)"/>
<text data-panel="he-en-timeline-m-card-days" x="53" y="207" fill="var(--color-signal)" font-family="l0g Helium Wafer" font-size="19" font-weight="700" text-anchor="end">21</text>
<text data-panel="he-en-timeline-m-card-days" x="90" y="206" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="17" font-weight="700" text-anchor="start">Decision signed</text>
<text data-panel="he-en-timeline-m-card-days" x="90" y="231" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="17" font-weight="400" text-anchor="start">Audrey Robertson</text>
<circle cx="66" cy="300" r="5" fill="var(--color-signal)"/>
<text data-panel="he-en-timeline-m-card-days" x="53" y="307" fill="var(--color-signal)" font-family="l0g Helium Wafer" font-size="19" font-weight="700" text-anchor="end">23</text>
<text data-panel="he-en-timeline-m-card-days" x="90" y="306" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="17" font-weight="700" text-anchor="start">DOE announcement</text>
<text data-panel="he-en-timeline-m-card-days" x="90" y="331" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="17" font-weight="400" text-anchor="start">Press release</text>
<circle cx="66" cy="450" r="5" fill="var(--color-signal)"/>
<text data-panel="he-en-timeline-m-card-days" x="53" y="457" fill="var(--color-signal)" font-family="l0g Helium Wafer" font-size="19" font-weight="700" text-anchor="end">26</text>
<text data-panel="he-en-timeline-m-card-days" x="90" y="456" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="17" font-weight="700" text-anchor="start">Public inspection</text>
<text data-panel="he-en-timeline-m-card-days" x="90" y="481" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="17" font-weight="400" text-anchor="start">Filed 26 October</text>
<circle cx="66" cy="500" r="5" fill="var(--color-amber)"/>
<text data-panel="he-en-timeline-m-card-days" x="53" y="507" fill="var(--color-amber)" font-family="l0g Helium Wafer" font-size="19" font-weight="700" text-anchor="end">27</text>
<text data-panel="he-en-timeline-m-card-days" x="90" y="506" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="17" font-weight="700" text-anchor="start">Publication due</text>
<text data-panel="he-en-timeline-m-card-days" x="90" y="531" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="17" font-weight="400" text-anchor="start">Federal Register</text>
<text data-panel="he-en-timeline-m-card-days" x="32" y="551" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="17" font-weight="400" text-anchor="start">Research cutoff: 26 October.</text>
<rect id="he-en-timeline-m-card-years" x="16" y="598" width="388" height="290" rx="12" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="he-en-timeline-m-card-years" x="32" y="632" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="17" font-weight="700" text-anchor="start">DRY PINEY · WYOMING</text>
<text data-panel="he-en-timeline-m-card-years" x="32" y="660" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="17" font-weight="700" text-anchor="start">YEARS · proposed construction</text>
<text data-panel="he-en-timeline-m-card-years" x="32" y="700" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="17" font-weight="400" text-anchor="start">DOE notice dated 21 August 2026:</text>
<text data-panel="he-en-timeline-m-card-years" x="32" y="725" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="17" font-weight="400" text-anchor="start">federal assistance requested.</text>
<path d="M 55 772 L 365 772" fill="none" stroke="var(--color-signal)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6"/>
<circle cx="55.0" cy="772" r="5" fill="var(--color-signal)"/>
<text data-panel="he-en-timeline-m-card-years" x="55.0" y="806" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="17" font-weight="400" text-anchor="middle">Q3 2026</text>
<circle cx="158.333333" cy="772" r="5" fill="var(--color-signal)"/>
<text data-panel="he-en-timeline-m-card-years" x="158.333333" y="806" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="17" font-weight="400" text-anchor="middle">Q3 2027</text>
<circle cx="261.666667" cy="772" r="5" fill="var(--color-signal)"/>
<text data-panel="he-en-timeline-m-card-years" x="261.666667" y="806" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="17" font-weight="400" text-anchor="middle">Q3 2028</text>
<circle cx="365.0" cy="772" r="5" fill="var(--color-signal)"/>
<text data-panel="he-en-timeline-m-card-years" x="365.0" y="806" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="17" font-weight="400" text-anchor="middle">Q3 2029</text>
<text data-panel="he-en-timeline-m-card-years" x="32" y="856" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="17" font-weight="400" text-anchor="start">Proposed schedule in that notice.</text>
<text data-panel="he-en-timeline-m-frame" x="24" y="928" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="17" font-weight="400" text-anchor="start">Actual start and final financing decision:</text>
<text data-panel="he-en-timeline-m-frame" x="24" y="957" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="17" font-weight="400" text-anchor="start">not established by this notice.</text>
<text data-panel="he-en-timeline-m-frame" x="24" y="986" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="17" font-weight="400" text-anchor="start">Assistance was sought before October.</text>
<text data-panel="he-en-timeline-m-frame" x="24" y="1015" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="17" font-weight="400" text-anchor="start">27 October: publication still scheduled</text>
<text data-panel="he-en-timeline-m-frame" x="24" y="1044" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="17" font-weight="400" text-anchor="start">at the 26 October cutoff. Sources [1, 2, 17].</text>
</svg>
