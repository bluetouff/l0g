<text data-panel="he-fr-wafer-m-frame" x="20" y="30" fill="var(--color-signal)" font-family="l0g Helium Wafer" font-size="17" font-weight="700" text-anchor="start">01 / MATIÈRE ET INDUSTRIE</text>
<text data-panel="he-fr-wafer-m-frame" x="20" y="65" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="22" font-weight="700" text-anchor="start">L’hélium transfère la chaleur</text>
<text data-panel="he-fr-wafer-m-frame" x="20" y="93" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="22" font-weight="700" text-anchor="start">de la plaquette</text>
