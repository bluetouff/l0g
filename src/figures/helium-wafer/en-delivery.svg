<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="he-en-delivery-d-title he-en-delivery-d-desc" viewBox="0 0 1000 650" style="width:100%;height:auto" class="l0g-helium-wafer-svg">
<title id="he-en-delivery-d-title">From stored helium to gas delivered at the fab</title><desc id="he-en-delivery-d-desc">Two independent documented assets. Beaumont cavern: announced capacity above three billion cubic feet; commissioning announced in July 2025; current fill not disclosed. HELICS container: manufacturer holding time above 48 days at a maximum pressure of 5.7 bar and ambient temperature of 30 °C. This duration is separate from a fab’s autonomy. A generic chain connects usable stock, processing, transport and qualified gas. Example of a commercial electronics grade: helium purity of at least 99.9999%. Sources: Linde and Air Liquide Taiwan [11, 12, 13, 14].</desc>
<rect id="he-en-delivery-d-frame" x="0" y="0" width="1000" height="650" rx="12" fill="var(--color-ink)"/>
<text data-panel="he-en-delivery-d-frame" x="24" y="30" fill="var(--color-signal)" font-family="l0g Helium Wafer" font-size="22" font-weight="700" text-anchor="start">03 / MATERIALS AND INDUSTRY</text>
<text data-panel="he-en-delivery-d-frame" x="24" y="72" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="30" font-weight="700" text-anchor="start">From stored helium to gas delivered at the fab</text>
