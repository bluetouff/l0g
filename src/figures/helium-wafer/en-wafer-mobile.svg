<text data-panel="he-en-wafer-m-frame" x="20" y="30" fill="var(--color-signal)" font-family="l0g Helium Wafer" font-size="17" font-weight="700" text-anchor="start">01 / MATERIALS AND INDUSTRY</text>
<text data-panel="he-en-wafer-m-frame" x="20" y="65" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="22" font-weight="700" text-anchor="start">Helium transfers heat</text>
<text data-panel="he-en-wafer-m-frame" x="20" y="93" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="22" font-weight="700" text-anchor="start">from the wafer</text>
