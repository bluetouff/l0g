<text data-panel="he-en-delivery-m-card-storage" x="32" y="155" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="17" font-weight="700" text-anchor="start">BEAUMONT · GAS</text>
<path d="M 45 190 L 375 190" fill="none" stroke="var(--color-line-strong)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 210 170 L 210 230" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
