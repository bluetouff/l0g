<text data-panel="he-en-delivery-m-card-storage" x="32" y="329" fill="var(--color-signal)" font-family="l0g Helium Wafer" font-size="21" font-weight="700" text-anchor="start">&gt; 3 billion cubic feet</text>
<text data-panel="he-en-delivery-m-card-storage" x="32" y="356" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="17" font-weight="400" text-anchor="start">Capacity announced in July 2025.</text>
<text data-panel="he-en-delivery-m-card-storage" x="32" y="381" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="17" font-weight="400" text-anchor="start">Current fill level: not disclosed.</text>
<text data-panel="he-en-delivery-m-card-transport" x="32" y="443" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="17" font-weight="700" text-anchor="start">HELICS · LIQUID</text>
<rect id="he-en-delivery-m-card-tank" x="90" y="470" width="240" height="56" rx="12" fill="var(--color-surface-2)" stroke="var(--color-line-strong)" stroke-width="1"/>
