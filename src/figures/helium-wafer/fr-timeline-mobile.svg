<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="he-fr-timeline-m-title he-fr-timeline-m-desc" viewBox="0 0 420 1090" style="width:100%;height:auto" class="l0g-helium-wafer-svg">
<title id="he-fr-timeline-m-title">Désignation et projet industriel : le calendrier</title><desc id="he-fr-timeline-m-desc">Deux échelles de temps distinctes. En jours, la désignation de l’hélium est signée par Audrey Robertson le 21 octobre 2026, annoncée par le DOE le 23, mise à disposition du public le 26 et prévue pour publication au Federal Register le 27. Clôture documentaire au 26 octobre : le 27 reste une échéance annoncée. En années, un avis DOE daté du 21 août 2026 établit une demande d’aide fédérale pour Dry Piney, avec un chantier envisagé du troisième trimestre 2026 au troisième trimestre 2029. Le début effectif et la décision de financement définitive restent à établir. Sources : DOE, Federal Register 2026-21884 et avis Dry Piney [1, 2, 17].</desc>
<rect id="he-fr-timeline-m-frame" x="0" y="0" width="420" height="1090" rx="12" fill="var(--color-ink)"/>
<text data-panel="he-fr-timeline-m-frame" x="20" y="30" fill="var(--color-signal)" font-family="l0g Helium Wafer" font-size="17" font-weight="700" text-anchor="start">05 / MATIÈRE ET INDUSTRIE</text>
<text data-panel="he-fr-timeline-m-frame" x="20" y="65" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="22" font-weight="700" text-anchor="start">Désignation et projet industriel</text>
<text data-panel="he-fr-timeline-m-frame" x="20" y="93" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="22" font-weight="700" text-anchor="start">Le calendrier</text>
<rect id="he-fr-timeline-m-card-days" x="16" y="124" width="388" height="451" rx="12" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="he-fr-timeline-m-card-days" x="32" y="158" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="17" font-weight="700" text-anchor="start">OCTOBRE 2026 · JOURS</text>
<path d="M 66 195 L 66 505" fill="none" stroke="var(--color-line-strong)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="66" cy="200" r="5" fill="var(--color-signal)"/>
<text data-panel="he-fr-timeline-m-card-days" x="53" y="207" fill="var(--color-signal)" font-family="l0g Helium Wafer" font-size="19" font-weight="700" text-anchor="end">21</text>
<text data-panel="he-fr-timeline-m-card-days" x="90" y="206" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="17" font-weight="700" text-anchor="start">Signature</text>
<text data-panel="he-fr-timeline-m-card-days" x="90" y="231" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="17" font-weight="400" text-anchor="start">Audrey Robertson</text>
<circle cx="66" cy="300" r="5" fill="var(--color-signal)"/>
<text data-panel="he-fr-timeline-m-card-days" x="53" y="307" fill="var(--color-signal)" font-family="l0g Helium Wafer" font-size="19" font-weight="700" text-anchor="end">23</text>
<text data-panel="he-fr-timeline-m-card-days" x="90" y="306" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="17" font-weight="700" text-anchor="start">Annonce DOE</text>
<text data-panel="he-fr-timeline-m-card-days" x="90" y="331" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="17" font-weight="400" text-anchor="start">Communiqué</text>
<circle cx="66" cy="450" r="5" fill="var(--color-signal)"/>
<text data-panel="he-fr-timeline-m-card-days" x="53" y="457" fill="var(--color-signal)" font-family="l0g Helium Wafer" font-size="19" font-weight="700" text-anchor="end">26</text>
<text data-panel="he-fr-timeline-m-card-days" x="90" y="456" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="17" font-weight="700" text-anchor="start">Mise à disposition</text>
<text data-panel="he-fr-timeline-m-card-days" x="90" y="481" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="17" font-weight="400" text-anchor="start">du public</text>
<circle cx="66" cy="500" r="5" fill="var(--color-amber)"/>
<text data-panel="he-fr-timeline-m-card-days" x="53" y="507" fill="var(--color-amber)" font-family="l0g Helium Wafer" font-size="19" font-weight="700" text-anchor="end">27</text>
<text data-panel="he-fr-timeline-m-card-days" x="90" y="506" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="17" font-weight="700" text-anchor="start">Publication prévue</text>
<text data-panel="he-fr-timeline-m-card-days" x="90" y="531" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="17" font-weight="400" text-anchor="start">Federal Register</text>
<text data-panel="he-fr-timeline-m-card-days" x="32" y="551" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="17" font-weight="400" text-anchor="start">Clôture documentaire : 26 octobre.</text>
<rect id="he-fr-timeline-m-card-years" x="16" y="598" width="388" height="290" rx="12" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="he-fr-timeline-m-card-years" x="32" y="632" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="17" font-weight="700" text-anchor="start">DRY PINEY · WYOMING</text>
<text data-panel="he-fr-timeline-m-card-years" x="32" y="660" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="17" font-weight="700" text-anchor="start">ANNÉES · chantier envisagé</text>
<text data-panel="he-fr-timeline-m-card-years" x="32" y="700" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="17" font-weight="400" text-anchor="start">Avis DOE du 21 août 2026 :</text>
<text data-panel="he-fr-timeline-m-card-years" x="32" y="725" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="17" font-weight="400" text-anchor="start">demande d’aide fédérale.</text>
<path d="M 55 772 L 365 772" fill="none" stroke="var(--color-signal)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6"/>
<circle cx="55.0" cy="772" r="5" fill="var(--color-signal)"/>
<text data-panel="he-fr-timeline-m-card-years" x="55.0" y="806" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="17" font-weight="400" text-anchor="middle">T3 2026</text>
<circle cx="158.333333" cy="772" r="5" fill="var(--color-signal)"/>
<text data-panel="he-fr-timeline-m-card-years" x="158.333333" y="806" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="17" font-weight="400" text-anchor="middle">T3 2027</text>
<circle cx="261.666667" cy="772" r="5" fill="var(--color-signal)"/>
<text data-panel="he-fr-timeline-m-card-years" x="261.666667" y="806" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="17" font-weight="400" text-anchor="middle">T3 2028</text>
<circle cx="365.0" cy="772" r="5" fill="var(--color-signal)"/>
<text data-panel="he-fr-timeline-m-card-years" x="365.0" y="806" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="17" font-weight="400" text-anchor="middle">T3 2029</text>
<text data-panel="he-fr-timeline-m-card-years" x="32" y="856" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="17" font-weight="400" text-anchor="start">Calendrier proposé dans cet avis.</text>
<text data-panel="he-fr-timeline-m-frame" x="24" y="928" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="17" font-weight="400" text-anchor="start">Début effectif et financement définitif :</text>
<text data-panel="he-fr-timeline-m-frame" x="24" y="957" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="17" font-weight="400" text-anchor="start">non établis par cet avis.</text>
<text data-panel="he-fr-timeline-m-frame" x="24" y="986" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="17" font-weight="400" text-anchor="start">L’aide était sollicitée avant octobre.</text>
<text data-panel="he-fr-timeline-m-frame" x="24" y="1015" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="17" font-weight="400" text-anchor="start">27 octobre : publication encore prévue</text>
<text data-panel="he-fr-timeline-m-frame" x="24" y="1044" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="17" font-weight="400" text-anchor="start">à la clôture du 26. Sources [1, 2, 17].</text>
</svg>
