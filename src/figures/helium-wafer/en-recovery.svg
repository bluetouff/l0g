<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="he-en-recovery-d-title he-en-recovery-d-desc" viewBox="0 0 1000 650" style="width:100%;height:auto" class="l0g-helium-wafer-svg">
<title id="he-en-recovery-d-title">Recovering helium, then checking its quality</title><desc id="he-en-recovery-d-desc">Generic recovery loop: distribution to fab processes, exhaust collection and sorting, contaminant-specific pretreatment, purification and quality checks. Gas meeting specifications returns to distribution; fresh supply makes up for unrecovered gas and treatment rejects. Paths show no quantified flow, and this is separate from Samsung’s actual installation topology. Samsung reports an annual saving of approximately 4.7 tonnes on one production line as of 2025. Baseline consumption is undisclosed and a group-wide recovery rate remains unknown. Sources: Samsung and patent US20250122079A1 [15, 16].</desc>
<rect id="he-en-recovery-d-frame" x="0" y="0" width="1000" height="650" rx="12" fill="var(--color-ink)"/>
<text data-panel="he-en-recovery-d-frame" x="24" y="30" fill="var(--color-signal)" font-family="l0g Helium Wafer" font-size="22" font-weight="700" text-anchor="start">04 / MATERIALS AND INDUSTRY</text>
<text data-panel="he-en-recovery-d-frame" x="24" y="72" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="30" font-weight="700" text-anchor="start">Recovering helium, then checking its quality</text>
