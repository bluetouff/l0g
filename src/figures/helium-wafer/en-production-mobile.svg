<text data-panel="he-en-production-m-card-method" x="30" y="968" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="17" font-weight="400" text-anchor="start">USGS MCS 2026, pp. 96–97 [8].</text>
