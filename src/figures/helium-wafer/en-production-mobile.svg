<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="he-en-production-m-title he-en-production-m-desc" viewBox="0 0 420 1010" style="width:100%;height:auto" class="l0g-helium-wafer-svg">
<title id="he-en-production-m-title">Two countries, roughly three quarters of output</title><desc id="he-en-production-m-desc">Estimated 2025 output in million gaseous cubic metres at 15 °C and 101.325 kPa: United States 81, Qatar 63, Russia 18, Algeria 11, Canada 6, China 3, Poland 3, South Africa less than 0.5. Published rounded world total: 190. Approximate US and Qatar share: (81 + 63) / 190, or 76%. The US figure includes helium extracted in Canada and purified in the United States. Published country values retain their rounding difference from the world total. This annual baseline is separate from available supply in October 2026. Source: USGS, Mineral Commodity Summaries 2026, pages 96 to 97 [8].</desc>
<rect id="he-en-production-m-frame" x="0" y="0" width="420" height="1010" rx="12" fill="var(--color-ink)"/>
<text data-panel="he-en-production-m-frame" x="20" y="30" fill="var(--color-signal)" font-family="l0g Helium Wafer" font-size="17" font-weight="700" text-anchor="start">02 / MATERIALS AND INDUSTRY</text>
<text data-panel="he-en-production-m-frame" x="20" y="65" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="22" font-weight="700" text-anchor="start">Two countries, roughly</text>
<text data-panel="he-en-production-m-frame" x="20" y="93" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="22" font-weight="700" text-anchor="start">three quarters of output</text>
<rect id="he-en-production-m-card-bars" x="16" y="120" width="388" height="494" rx="12" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="he-en-production-m-card-bars" x="32" y="149" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="17" font-weight="400" text-anchor="start">Estimated 2025 output</text>
<text data-panel="he-en-production-m-card-bars" x="32" y="174" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="17" font-weight="400" text-anchor="start">Million m³ of gas</text>
<text data-panel="he-en-production-m-card-bars" x="32" y="199" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="17" font-weight="400" text-anchor="start">15 °C · 101.325 kPa</text>
<text data-panel="he-en-production-m-card-bars" x="32" y="230" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="17" font-weight="400" text-anchor="start">United States</text>
