<text data-panel="he-en-production-m-card-world" x="30" y="662" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="17" font-weight="700" text-anchor="start">WORLD</text>
<text data-panel="he-en-production-m-card-world" x="30" y="701" fill="var(--color-signal)" font-family="l0g Helium Wafer" font-size="30" font-weight="700" text-anchor="start">190</text>
<text data-panel="he-en-production-m-card-world" x="30" y="729" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="17" font-weight="400" text-anchor="start">rounded total</text>
<rect id="he-en-production-m-card-share" x="215" y="636" width="189" height="108" rx="12" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="he-en-production-m-card-share" x="229" y="662" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="17" font-weight="700" text-anchor="start">USA + QATAR</text>
<text data-panel="he-en-production-m-card-share" x="229" y="701" fill="var(--color-signal)" font-family="l0g Helium Wafer" font-size="30" font-weight="700" text-anchor="start">≈ 76%</text>
<text data-panel="he-en-production-m-card-share" x="229" y="729" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="17" font-weight="400" text-anchor="start">(81 + 63) ÷ 190</text>
<rect id="he-en-production-m-card-method" x="16" y="766" width="388" height="224" rx="12" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="he-en-production-m-card-method" x="30" y="793" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="17" font-weight="400" text-anchor="start">US output includes helium extracted</text>
