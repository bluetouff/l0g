<text data-panel="he-en-wafer-d-card-method" x="42" y="512" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="22" font-weight="400" text-anchor="start">Heat: amber · regulated helium gas: mint · liquid circuit: rose</text>
<text data-panel="he-en-wafer-d-card-method" x="42" y="548" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="22" font-weight="400" text-anchor="start">Pressure, surfaces and geometry also determine heat transfer inside the tool.</text>
