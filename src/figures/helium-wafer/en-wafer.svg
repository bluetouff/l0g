<text data-panel="he-en-wafer-d-card-properties" x="658" y="378" fill="var(--color-accent)" font-family="l0g Helium Wafer" font-size="22" font-weight="700" text-anchor="start">Ar</text>
<rect id="he-en-wafer-d-bar-Ar" x="705" y="360" width="19.359375" height="24" rx="12" fill="var(--color-accent)"/>
