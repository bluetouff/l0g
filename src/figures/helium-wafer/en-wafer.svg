<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="he-en-wafer-d-title he-en-wafer-d-desc" viewBox="0 0 1000 650" style="width:100%;height:auto" class="l0g-helium-wafer-svg">
<title id="he-en-wafer-d-title">Helium transfers heat from the wafer</title><desc id="he-en-wafer-d-desc">Plasma, wafer, regulated gaseous helium, electrostatic chuck and separate liquid circuit. Enlarged cross-section, not to scale. Dilute-gas conductivities at 300 K: He 155.7, N₂ 25.9, Ar 17.7 mW/(m·K). Pressure, surfaces and geometry also affect actual transfer. Sources [3, 4, 5].</desc>
