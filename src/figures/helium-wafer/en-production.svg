<text data-panel="he-en-production-d-card-world" x="706" y="257" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="22" font-weight="400" text-anchor="start">million m³</text>
<text data-panel="he-en-production-d-card-world" x="706" y="287" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="22" font-weight="400" text-anchor="start">published, rounded total</text>
<text data-panel="he-en-production-d-card-share" x="706" y="365" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="22" font-weight="700" text-anchor="start">USA + QATAR</text>
<text data-panel="he-en-production-d-card-share" x="706" y="427" fill="var(--color-signal)" font-family="l0g Helium Wafer" font-size="43" font-weight="700" text-anchor="start">≈ 76%</text>
<text data-panel="he-en-production-d-card-share" x="706" y="470" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="22" font-weight="400" text-anchor="start">(81 + 63) ÷ 190</text>
<text data-panel="he-en-production-d-card-share" x="706" y="500" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="22" font-weight="400" text-anchor="start">approximate share</text>
<text data-panel="he-en-production-d-frame" x="24" y="550" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="22" font-weight="400" text-anchor="start">US output includes helium extracted in Canada and purified in the United States.</text>
<text data-panel="he-en-production-d-frame" x="24" y="579" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="22" font-weight="400" text-anchor="start">Country and world values retain their published rounding differences.</text>
<text data-panel="he-en-production-d-frame" x="24" y="608" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="22" font-weight="400" text-anchor="start">South Africa: upper bound. Annual baseline, separate from October 2026 supply.</text>
