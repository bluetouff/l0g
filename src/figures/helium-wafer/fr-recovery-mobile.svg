<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="he-fr-recovery-m-title he-fr-recovery-m-desc" viewBox="0 0 420 1210" style="width:100%;height:auto" class="l0g-helium-wafer-svg">
<title id="he-fr-recovery-m-title">Récupérer l’hélium, puis contrôler sa qualité</title><desc id="he-fr-recovery-m-desc">Boucle générique de récupération : distribution vers les procédés, collecte et tri des effluents, prétraitement adapté aux contaminants, purification et contrôle qualité. Le gaz conforme retourne à la distribution ; un apport extérieur complète le gaz non récupéré et les rejets de traitement. Les flèches ne représentent aucun débit quantifié et la topologie Samsung exacte reste distincte du schéma. Samsung déclare une économie annuelle d’environ 4,7 tonnes sur une ligne de production en 2025. La consommation de référence reste non précisée et le résultat laisse le taux de récupération du groupe à établir. Sources : Samsung et brevet US20250122079A1 [15, 16].</desc>
<rect id="he-fr-recovery-m-frame" x="0" y="0" width="420" height="1210" rx="12" fill="var(--color-ink)"/>
<text data-panel="he-fr-recovery-m-frame" x="20" y="30" fill="var(--color-signal)" font-family="l0g Helium Wafer" font-size="17" font-weight="700" text-anchor="start">04 / MATIÈRE ET INDUSTRIE</text>
<text data-panel="he-fr-recovery-m-frame" x="20" y="65" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="22" font-weight="700" text-anchor="start">Récupérer l’hélium,</text>
<text data-panel="he-fr-recovery-m-frame" x="20" y="93" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="22" font-weight="700" text-anchor="start">puis contrôler sa qualité</text>
