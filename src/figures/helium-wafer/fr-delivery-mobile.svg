<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="he-fr-delivery-m-title he-fr-delivery-m-desc" viewBox="0 0 420 1190" style="width:100%;height:auto" class="l0g-helium-wafer-svg">
<title id="he-fr-delivery-m-title">Du stock au gaz livré à l’usine</title><desc id="he-fr-delivery-m-desc">Deux équipements documentés et indépendants. Caverne de Beaumont : capacité annoncée supérieure à trois milliards de pieds cubes ; mise en service annoncée en juillet 2025 ; remplissage actuel non publié. Conteneur HELICS : durée de maintien annoncée supérieure à 48 jours, à une pression maximale de 5,7 bar et une température ambiante de 30 °C. Cette durée est distincte de l’autonomie d’une fab. Une chaîne générique relie stock utilisable, traitement, transport et gaz qualifié. Exemple de grade électronique commercial : hélium à au moins 99,9999 %. Sources : Linde et Air Liquide Taiwan [11, 12, 13, 14].</desc>
<rect id="he-fr-delivery-m-frame" x="0" y="0" width="420" height="1190" rx="12" fill="var(--color-ink)"/>
<text data-panel="he-fr-delivery-m-frame" x="20" y="30" fill="var(--color-signal)" font-family="l0g Helium Wafer" font-size="17" font-weight="700" text-anchor="start">03 / MATIÈRE ET INDUSTRIE</text>
<text data-panel="he-fr-delivery-m-frame" x="20" y="65" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="22" font-weight="700" text-anchor="start">Du stock au gaz livré</text>
<text data-panel="he-fr-delivery-m-frame" x="20" y="93" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="22" font-weight="700" text-anchor="start">à l’usine</text>
