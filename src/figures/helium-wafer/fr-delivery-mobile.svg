<text data-panel="he-fr-delivery-m-card-step-3" x="60" y="1005" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="17" font-weight="700" text-anchor="start">Gaz qualifié</text>
<text data-panel="he-fr-delivery-m-card-step-3" x="60" y="1032" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="17" font-weight="400" text-anchor="start">Spécification et disponibilité</text>
