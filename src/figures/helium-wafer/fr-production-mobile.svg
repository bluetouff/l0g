<rect id="he-fr-production-m-card-share" x="215" y="636" width="189" height="108" rx="12" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="he-fr-production-m-card-share" x="229" y="662" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="17" font-weight="700" text-anchor="start">USA + QATAR</text>
<text data-panel="he-fr-production-m-card-share" x="229" y="701" fill="var(--color-signal)" font-family="l0g Helium Wafer" font-size="30" font-weight="700" text-anchor="start">≈ 76 %</text>
<text data-panel="he-fr-production-m-card-share" x="229" y="729" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="17" font-weight="400" text-anchor="start">(81 + 63) ÷ 190</text>
