<text data-panel="he-fr-production-m-card-bars" x="32" y="174" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="17" font-weight="400" text-anchor="start">Millions de m³ de gaz</text>
<text data-panel="he-fr-production-m-card-bars" x="32" y="199" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="17" font-weight="400" text-anchor="start">15 °C · 101,325 kPa</text>
