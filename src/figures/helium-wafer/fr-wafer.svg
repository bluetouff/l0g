<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="he-fr-wafer-d-title he-fr-wafer-d-desc" viewBox="0 0 1000 650" style="width:100%;height:auto" class="l0g-helium-wafer-svg">
<title id="he-fr-wafer-d-title">L’hélium transfère la chaleur de la plaquette</title><desc id="he-fr-wafer-d-desc">Plasma, plaquette, hélium gazeux régulé, support électrostatique et circuit liquide séparé. Coupe agrandie, sans échelle. Conductivités à 300 K dans la limite des gaz dilués : He 155,7, N₂ 25,9, Ar 17,7 mW/(m·K). Pression, surfaces et géométrie déterminent aussi le transfert réel. Sources [3, 4, 5].</desc>
