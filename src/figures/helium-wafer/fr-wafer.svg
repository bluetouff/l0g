<text data-panel="he-fr-wafer-d-frame" x="24" y="72" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="30" font-weight="700" text-anchor="start">L’hélium transfère la chaleur de la plaquette</text>
