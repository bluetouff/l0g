<text data-panel="he-fr-production-d-card-bars" x="640" y="346" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="22" font-weight="400" text-anchor="end">6</text>
<text data-panel="he-fr-production-d-card-bars" x="40" y="386" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="22" font-weight="400" text-anchor="start">Chine</text>
