<text data-panel="he-fr-production-d-card-world" x="706" y="214" fill="var(--color-signal)" font-family="l0g Helium Wafer" font-size="50" font-weight="700" text-anchor="start">190</text>
<text data-panel="he-fr-production-d-card-world" x="706" y="257" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="22" font-weight="400" text-anchor="start">millions de m³</text>
<text data-panel="he-fr-production-d-card-world" x="706" y="287" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="22" font-weight="400" text-anchor="start">total publié, arrondi</text>
<text data-panel="he-fr-production-d-card-share" x="706" y="365" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="22" font-weight="700" text-anchor="start">USA + QATAR</text>
<text data-panel="he-fr-production-d-card-share" x="706" y="427" fill="var(--color-signal)" font-family="l0g Helium Wafer" font-size="43" font-weight="700" text-anchor="start">≈ 76 %</text>
<text data-panel="he-fr-production-d-card-share" x="706" y="470" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="22" font-weight="400" text-anchor="start">(81 + 63) ÷ 190</text>
<text data-panel="he-fr-production-d-card-share" x="706" y="500" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="22" font-weight="400" text-anchor="start">part approximative</text>
<text data-panel="he-fr-production-d-frame" x="24" y="550" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="22" font-weight="400" text-anchor="start">La ligne US inclut l’hélium extrait au Canada puis purifié aux États-Unis.</text>
<text data-panel="he-fr-production-d-frame" x="24" y="579" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="22" font-weight="400" text-anchor="start">Les arrondis nationaux et le total mondial conservent leurs écarts publiés.</text>
<text data-panel="he-fr-production-d-frame" x="24" y="608" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="22" font-weight="400" text-anchor="start">Afrique du Sud : borne supérieure. Référence annuelle, distincte des flux d’octobre.</text>
<text data-panel="he-fr-production-d-frame" x="24" y="638" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="22" font-weight="400" text-anchor="start">USGS, Mineral Commodity Summaries 2026, pp. 96–97 [8].</text>
