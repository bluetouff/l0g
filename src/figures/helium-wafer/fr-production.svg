<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="he-fr-production-d-title he-fr-production-d-desc" viewBox="0 0 1000 650" style="width:100%;height:auto" class="l0g-helium-wafer-svg">
<title id="he-fr-production-d-title">Deux pays, environ trois quarts de la production</title><desc id="he-fr-production-d-desc">Production estimée en 2025, en millions de mètres cubes gazeux à 15 °C et 101,325 kPa : États-Unis 81, Qatar 63, Russie 18, Algérie 11, Canada 6, Chine 3, Pologne 3, Afrique du Sud moins de 0,5. Total mondial publié et arrondi : 190. Part approximative États-Unis et Qatar : (81 + 63) / 190, soit 76 %. La ligne américaine inclut du gaz extrait au Canada puis purifié aux États-Unis. Les valeurs nationales arrondies conservent leur écart avec le total mondial. Référence annuelle distincte des flux disponibles en octobre 2026. Source : USGS, Mineral Commodity Summaries 2026, pages 96 à 97 [8].</desc>
<rect id="he-fr-production-d-frame" x="0" y="0" width="1000" height="650" rx="12" fill="var(--color-ink)"/>
<text data-panel="he-fr-production-d-frame" x="24" y="30" fill="var(--color-signal)" font-family="l0g Helium Wafer" font-size="22" font-weight="700" text-anchor="start">02 / MATIÈRE ET INDUSTRIE</text>
<text data-panel="he-fr-production-d-frame" x="24" y="72" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="30" font-weight="700" text-anchor="start">Deux pays, environ trois quarts de la production</text>
