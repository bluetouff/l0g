<path d="M 245 493 L 575 493" fill="none" stroke="var(--color-line-strong)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text data-panel="he-fr-production-d-card-bars" x="245" y="520" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="22" font-weight="400" text-anchor="start">0</text>
<text data-panel="he-fr-production-d-card-bars" x="575" y="520" fill="var(--color-muted)" font-family="l0g Helium Wafer" font-size="22" font-weight="400" text-anchor="end">90</text>
<rect id="he-fr-production-d-card-world" x="684" y="110" width="294" height="201" rx="12" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
