<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="he-fr-delivery-d-title he-fr-delivery-d-desc" viewBox="0 0 1000 650" style="width:100%;height:auto" class="l0g-helium-wafer-svg">
<title id="he-fr-delivery-d-title">Du stock au gaz livré à l’usine</title><desc id="he-fr-delivery-d-desc">Deux équipements documentés et indépendants. Caverne de Beaumont : capacité annoncée supérieure à trois milliards de pieds cubes ; mise en service annoncée en juillet 2025 ; remplissage actuel non publié. Conteneur HELICS : durée de maintien annoncée supérieure à 48 jours, à une pression maximale de 5,7 bar et une température ambiante de 30 °C. Cette durée est distincte de l’autonomie d’une fab. Une chaîne générique relie stock utilisable, traitement, transport et gaz qualifié. Exemple de grade électronique commercial : hélium à au moins 99,9999 %. Sources : Linde et Air Liquide Taiwan [11, 12, 13, 14].</desc>
