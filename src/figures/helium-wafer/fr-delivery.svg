<text data-panel="he-fr-delivery-d-frame" x="24" y="30" fill="var(--color-signal)" font-family="l0g Helium Wafer" font-size="22" font-weight="700" text-anchor="start">03 / MATIÈRE ET INDUSTRIE</text>
<text data-panel="he-fr-delivery-d-frame" x="24" y="72" fill="var(--color-paper)" font-family="l0g Helium Wafer" font-size="30" font-weight="700" text-anchor="start">Du stock au gaz livré à l’usine</text>
