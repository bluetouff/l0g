<text x="16" y="28" font-size="18" font-weight="500" fill="var(--color-paper)" text-anchor="start">Du lingot à la créance en or</text>
<path d="M16 42H544" fill="none" stroke="var(--color-line-strong)" stroke-width="1" opacity="1" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="16" y="56" width="164" height="78" rx="6" fill="var(--color-surface)" stroke="var(--color-line-strong)" opacity="1"/>
<g transform="translate(26 69) scale(0.29)" aria-hidden="true"><path d="M0 14 32 0 75 5 43 20Z" fill="var(--color-amber)" fill-opacity=".24" stroke="var(--color-amber)" stroke-width="2" stroke-linejoin="round"/><path d="M0 14 43 20 45 29-3 23ZM43 20 75 5 78 14 45 29M24 10l18 2" fill="none" stroke="var(--color-amber)" stroke-width="2" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 32l-3 8 48 6 33-15-1-7M45 36v10" fill="none" stroke="var(--color-amber)" stroke-width="2" opacity="1" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="55" y="82" font-size="12.5" font-weight="500" fill="var(--color-paper)" text-anchor="start">BCRA</text>
<text x="26" y="108" font-size="12.5" font-weight="400" fill="var(--color-signal)" text-anchor="start">1 000 lingots expédiés</text>
<text x="26" y="123" font-size="12" font-weight="400" fill="var(--color-muted)" text-anchor="start">Juin à août 2024</text>
<path d="M182 94h13m-4-3 4 3-4 3" fill="none" stroke="var(--color-muted)" stroke-width="1" opacity="1" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="198" y="56" width="164" height="78" rx="6" fill="var(--color-surface)" stroke="var(--color-line-strong)" opacity="1"/>
<g transform="translate(208 69) scale(0.29)" aria-hidden="true"><rect x="0" y="0" width="77" height="54" rx="6" fill="none" stroke="var(--color-amber)" opacity="1"/><rect x="7" y="6" width="63" height="41" rx="3" fill="none" stroke="var(--color-amber)" opacity="1"/><circle cx="38" cy="26" r="11" fill="none" stroke="var(--color-amber)" stroke-width="2"/><circle cx="38" cy="26" r="2.5" fill="var(--color-amber)"/><path d="M38 23V14M35 28l-8 5m14-5 7 5M8 54v5m60-5v5" fill="none" stroke="var(--color-amber)" stroke-width="2" opacity="1" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="237" y="82" font-size="12.5" font-weight="500" fill="var(--color-paper)" text-anchor="start">Banque d’Angleterre</text>
<text x="208" y="108" font-size="12.5" font-weight="400" fill="var(--color-signal)" text-anchor="start">Garde des barres</text>
<text x="208" y="123" font-size="12" font-weight="400" fill="var(--color-muted)" text-anchor="start">Pour le compte de la BRI</text>
