<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 262" width="100%" height="auto" style="width:100%;height:auto" role="img" aria-labelledby="argentina-gold-fr-custody-title argentina-gold-fr-custody-desc" xml:lang="fr">
<title id="argentina-gold-fr-custody-title">Du lingot à la créance en or</title>
<desc id="argentina-gold-fr-custody-desc">La BCRA a envoyé 1 000 lingots à la Banque d’Angleterre entre juin et août 2024. La BRI a crédité le compte non alloué de la BCRA. La part de l’or de la BCRA inscrite à la BRI est passée de 11,3 % avant les envois à 31,6 % fin 2025, en volume, selon l’AGN.</desc>
