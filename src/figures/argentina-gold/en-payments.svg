<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 269" width="100%" height="auto" style="width:100%;height:auto" role="img" aria-labelledby="argentina-gold-en-payments-title argentina-gold-en-payments-desc" xml:lang="en">
<title id="argentina-gold-en-payments-title">The cost of the gold options</title>
<desc id="argentina-gold-en-payments-desc">In 2025 Argentina’s auditor general records US$1,023 million in option-related cash outflows, made up of US$960.2 million in negative option results and US$62.8 million in premiums. Separately, the BCRA reported a US$2,505 million net gain on its gold position including hedges.</desc>
<rect x="0.5" y="0.5" width="559" height="268" rx="9" fill="var(--color-ink)" stroke="var(--color-line-strong)" opacity="1"/>
<text x="16" y="28" font-size="18" font-weight="500" fill="var(--color-paper)" text-anchor="start">The cost of the gold options</text>
<path d="M16 42H544" fill="none" stroke="var(--color-line-strong)" stroke-width="1" opacity="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="16" y="62" font-size="12" font-weight="400" fill="var(--color-muted)" text-anchor="start">Financial year 2025 · US$ millions</text>
<text x="16" y="87" font-size="13" font-weight="500" fill="var(--color-paper)" text-anchor="start">Outflows recorded by the AGN</text>
<text x="544" y="87" font-size="18" font-weight="500" fill="var(--color-accent)" text-anchor="end">1,023</text>
<rect x="16" y="99" width="495.59" height="14" rx="0" fill="var(--color-accent)" stroke="none" opacity="1"/>
<rect x="511.59" y="99" width="32.410000000000025" height="14" rx="0" fill="var(--color-amber)" stroke="none" opacity="1"/>
<rect x="16" y="132" width="7" height="7" rx="1" fill="var(--color-accent)" stroke="none" opacity="1"/>
<text x="29" y="140" font-size="13" font-weight="400" fill="var(--color-paper)" text-anchor="start">Negative option result</text>
<text x="29" y="161" font-size="16" font-weight="500" fill="var(--color-accent)" text-anchor="start">960.2</text>
<rect x="294" y="132" width="7" height="7" rx="1" fill="var(--color-amber)" stroke="none" opacity="1"/>
<text x="307" y="140" font-size="13" font-weight="400" fill="var(--color-paper)" text-anchor="start">Option premiums</text>
<text x="307" y="161" font-size="16" font-weight="500" fill="var(--color-amber)" text-anchor="start">62.8</text>
<path d="M16 171H544" fill="none" stroke="var(--color-line-strong)" stroke-width="1" opacity="1" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="16" y="181" width="528" height="68" rx="6" fill="var(--color-surface)" stroke="var(--color-line-strong)" opacity="1"/>
<text x="28" y="203" font-size="13" font-weight="500" fill="var(--color-paper)" text-anchor="start">Gold position including hedges</text>
<text x="28" y="229" font-size="12" font-weight="400" fill="var(--color-muted)" text-anchor="start">Net result reported by the BCRA</text>
<text x="532" y="229" font-size="18" font-weight="500" fill="var(--color-signal)" text-anchor="end">+2,505</text>
</svg>
