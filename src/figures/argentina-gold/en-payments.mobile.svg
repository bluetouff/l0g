<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" width="100%" height="auto" style="width:100%;height:auto" role="img" aria-labelledby="argentina-gold-en-payments-mobile-title argentina-gold-en-payments-mobile-desc" xml:lang="en">
<title id="argentina-gold-en-payments-mobile-title">The cost of the gold options</title>
<desc id="argentina-gold-en-payments-mobile-desc">In 2025 Argentina’s auditor general records US$1,023 million in option-related cash outflows, made up of US$960.2 million in negative option results and US$62.8 million in premiums. Separately, the BCRA reported a US$2,505 million net gain on its gold position including hedges.</desc>
<rect x="0.5" y="0.5" width="339" height="279" rx="9" fill="var(--color-ink)" stroke="var(--color-line-strong)" opacity="1"/>
<text x="16" y="28" font-size="17" font-weight="500" fill="var(--color-paper)" text-anchor="start">The cost of the gold options</text>
<path d="M16 42H324" fill="none" stroke="var(--color-line-strong)" stroke-width="1" opacity="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="16" y="62" font-size="12" font-weight="400" fill="var(--color-muted)" text-anchor="start">Financial year 2025 · US$ millions</text>
<text x="16" y="87" font-size="13" font-weight="500" fill="var(--color-paper)" text-anchor="start">Outflows recorded by the AGN</text>
<text x="324" y="87" font-size="18" font-weight="500" fill="var(--color-accent)" text-anchor="end">1,023</text>
<rect x="16" y="99" width="289.09" height="14" rx="0" fill="var(--color-accent)" stroke="none" opacity="1"/>
<rect x="305.09" y="99" width="18.910000000000025" height="14" rx="0" fill="var(--color-amber)" stroke="none" opacity="1"/>
<rect x="16" y="131" width="7" height="7" rx="1" fill="var(--color-accent)" stroke="none" opacity="1"/>
<text x="29" y="139" font-size="12.5" font-weight="400" fill="var(--color-paper)" text-anchor="start">Negative option result</text>
<text x="324" y="139" font-size="15" font-weight="500" fill="var(--color-accent)" text-anchor="end">960.2</text>
<rect x="16" y="155" width="7" height="7" rx="1" fill="var(--color-amber)" stroke="none" opacity="1"/>
<text x="29" y="163" font-size="12.5" font-weight="400" fill="var(--color-paper)" text-anchor="start">Option premiums</text>
<text x="324" y="163" font-size="15" font-weight="500" fill="var(--color-amber)" text-anchor="end">62.8</text>
<path d="M16 182H324" fill="none" stroke="var(--color-line-strong)" stroke-width="1" opacity="1" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="16" y="192" width="308" height="68" rx="6" fill="var(--color-surface)" stroke="var(--color-line-strong)" opacity="1"/>
<text x="28" y="214" font-size="13" font-weight="500" fill="var(--color-paper)" text-anchor="start">Gold position including hedges</text>
<text x="28" y="240" font-size="12" font-weight="400" fill="var(--color-muted)" text-anchor="start">Net result reported by the BCRA</text>
<text x="312" y="240" font-size="18" font-weight="500" fill="var(--color-signal)" text-anchor="end">+2,505</text>
</svg>
