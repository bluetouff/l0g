<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 344" width="100%" height="auto" style="width:100%;height:auto" role="img" aria-labelledby="argentina-gold-en-custody-mobile-title argentina-gold-en-custody-mobile-desc" xml:lang="en">
<title id="argentina-gold-en-custody-mobile-title">From bullion to a claim on gold</title>
<desc id="argentina-gold-en-custody-mobile-desc">Argentina’s central bank shipped 1,000 bars to the Bank of England from June to August 2024. The BIS credited the BCRA’s unallocated account. According to Argentina’s auditor general, the share of BCRA gold held through the BIS rose from 11.3% before the shipments to 31.6% at end-2025 by volume.</desc>
<rect x="0.5" y="0.5" width="339" height="343" rx="9" fill="var(--color-ink)" stroke="var(--color-line-strong)" opacity="1"/>
<text x="16" y="28" font-size="17" font-weight="500" fill="var(--color-paper)" text-anchor="start">From bullion to a claim on gold</text>
<path d="M16 42H324" fill="none" stroke="var(--color-line-strong)" stroke-width="1" opacity="1" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="16" y="52" width="308" height="56" rx="6" fill="var(--color-surface)" stroke="var(--color-line-strong)" opacity="1"/>
<g transform="translate(26 68) scale(0.35)" aria-hidden="true"><path d="M0 14 32 0 75 5 43 20Z" fill="var(--color-amber)" fill-opacity=".24" stroke="var(--color-amber)" stroke-width="2" stroke-linejoin="round"/><path d="M0 14 43 20 45 29-3 23ZM43 20 75 5 78 14 45 29M24 10l18 2" fill="none" stroke="var(--color-amber)" stroke-width="2" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 32l-3 8 48 6 33-15-1-7M45 36v10" fill="none" stroke="var(--color-amber)" stroke-width="2" opacity="1" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="72" y="71" font-size="14" font-weight="500" fill="var(--color-paper)" text-anchor="start">BCRA</text>
<text x="72" y="88" font-size="12.5" font-weight="400" fill="var(--color-signal)" text-anchor="start">1,000 bars shipped</text>
<text x="72" y="102" font-size="12" font-weight="400" fill="var(--color-muted)" text-anchor="start">June to August 2024</text>
<path d="M170 108v9m-3-3 3 3 3-3" fill="none" stroke="var(--color-muted)" stroke-width="1" opacity="1" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="16" y="118" width="308" height="56" rx="6" fill="var(--color-surface)" stroke="var(--color-line-strong)" opacity="1"/>
<g transform="translate(26 134) scale(0.35)" aria-hidden="true"><rect x="0" y="0" width="77" height="54" rx="6" fill="none" stroke="var(--color-amber)" opacity="1"/><rect x="7" y="6" width="63" height="41" rx="3" fill="none" stroke="var(--color-amber)" opacity="1"/><circle cx="38" cy="26" r="11" fill="none" stroke="var(--color-amber)" stroke-width="2"/><circle cx="38" cy="26" r="2.5" fill="var(--color-amber)"/><path d="M38 23V14M35 28l-8 5m14-5 7 5M8 54v5m60-5v5" fill="none" stroke="var(--color-amber)" stroke-width="2" opacity="1" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="72" y="137" font-size="14" font-weight="500" fill="var(--color-paper)" text-anchor="start">Bank of England</text>
<text x="72" y="154" font-size="12.5" font-weight="400" fill="var(--color-signal)" text-anchor="start">Custody of the bars</text>
<text x="72" y="168" font-size="12" font-weight="400" fill="var(--color-muted)" text-anchor="start">On behalf of the BIS</text>
<path d="M170 174v9m-3-3 3 3 3-3" fill="none" stroke="var(--color-muted)" stroke-width="1" opacity="1" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="16" y="184" width="308" height="56" rx="6" fill="var(--color-surface)" stroke="var(--color-line-strong)" opacity="1"/>
<g transform="translate(26 200) scale(0.35)" aria-hidden="true"><path d="M0 0H50L65 15V56H0ZM50 1V15H64M11 24h38m-38 9h38m-38 9h38" fill="none" stroke="var(--color-signal)" stroke-width="2" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="53" y="22" width="3" height="3" rx="0" fill="var(--color-signal)" stroke="none" opacity="1"/><rect x="53" y="31" width="3" height="3" rx="0" fill="var(--color-signal)" stroke="none" opacity="1"/><rect x="53" y="40" width="3" height="3" rx="0" fill="var(--color-signal)" stroke="none" opacity="1"/></g>
<text x="72" y="203" font-size="14" font-weight="500" fill="var(--color-paper)" text-anchor="start">Account at the BIS</text>
<text x="72" y="220" font-size="12.5" font-weight="400" fill="var(--color-signal)" text-anchor="start">Claim on gold</text>
<text x="72" y="234" font-size="12" font-weight="400" fill="var(--color-muted)" text-anchor="start">Unallocated balance</text>
<text x="16" y="259" font-size="14" font-weight="500" fill="var(--color-paper)" text-anchor="start">Share of BCRA gold at the BIS</text>
<text x="324" y="259" font-size="12" font-weight="400" fill="var(--color-muted)" text-anchor="end">By volume</text>
<text x="16" y="287" font-size="12" font-weight="400" fill="var(--color-muted)" text-anchor="start">Before transfer</text>
<rect x="120" y="276" width="143" height="12" rx="2" fill="var(--color-surface)" stroke="var(--color-line-strong)" opacity="1"/>
<rect x="120" y="276" width="16.14" height="12" rx="2" fill="var(--color-signal)" stroke="none" opacity="1"/>
<text x="324" y="287" font-size="14" font-weight="500" fill="var(--color-signal)" text-anchor="end">11.3%</text>
<text x="16" y="312" font-size="12" font-weight="400" fill="var(--color-muted)" text-anchor="start">End-2025</text>
<rect x="120" y="301" width="143" height="12" rx="2" fill="var(--color-surface)" stroke="var(--color-line-strong)" opacity="1"/>
<rect x="120" y="301" width="45.13" height="12" rx="2" fill="var(--color-signal)" stroke="none" opacity="1"/>
<text x="324" y="312" font-size="14" font-weight="500" fill="var(--color-signal)" text-anchor="end">31.6%</text>
<path d="M120.0 315v4" fill="none" stroke="var(--color-muted)" stroke-width="1" opacity="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="120.0" y="330" font-size="12" font-weight="400" fill="var(--color-muted)" text-anchor="middle">0%</text>
<path d="M191.5 315v4" fill="none" stroke="var(--color-muted)" stroke-width="1" opacity="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="191.5" y="330" font-size="12" font-weight="400" fill="var(--color-muted)" text-anchor="middle">50%</text>
<path d="M263.0 315v4" fill="none" stroke="var(--color-muted)" stroke-width="1" opacity="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="263.0" y="330" font-size="12" font-weight="400" fill="var(--color-muted)" text-anchor="middle">100%</text>
