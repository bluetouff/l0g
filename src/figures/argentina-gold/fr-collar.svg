<title id="argentina-gold-fr-collar-title">Le prix d’un plancher</title>
<desc id="argentina-gold-fr-collar-desc">Exemple fictif, une unité d’or, indice initial 100. Le détenteur achète une option de vente à 90 et vend une option d’achat à 110. Si le cours à l’échéance est de 70, 100 ou 130, la position couverte vaut 90, 100 ou 110, hors primes et frais.</desc>
