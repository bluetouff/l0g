<text x="16" y="287" font-size="12" font-weight="400" fill="var(--color-muted)" text-anchor="start">Avant envois</text>
<rect x="120" y="276" width="143" height="12" rx="2" fill="var(--color-surface)" stroke="var(--color-line-strong)" opacity="1"/>
<rect x="120" y="276" width="16.14" height="12" rx="2" fill="var(--color-signal)" stroke="none" opacity="1"/>
<text x="324" y="287" font-size="14" font-weight="500" fill="var(--color-signal)" text-anchor="end">11,3 %</text>
<text x="16" y="312" font-size="12" font-weight="400" fill="var(--color-muted)" text-anchor="start">Fin 2025</text>
<rect x="120" y="301" width="143" height="12" rx="2" fill="var(--color-surface)" stroke="var(--color-line-strong)" opacity="1"/>
<rect x="120" y="301" width="45.13" height="12" rx="2" fill="var(--color-signal)" stroke="none" opacity="1"/>
<text x="324" y="312" font-size="14" font-weight="500" fill="var(--color-signal)" text-anchor="end">31,6 %</text>
<path d="M120.0 315v4" fill="none" stroke="var(--color-muted)" stroke-width="1" opacity="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="120.0" y="330" font-size="12" font-weight="400" fill="var(--color-muted)" text-anchor="middle">0 %</text>
<path d="M191.5 315v4" fill="none" stroke="var(--color-muted)" stroke-width="1" opacity="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="191.5" y="330" font-size="12" font-weight="400" fill="var(--color-muted)" text-anchor="middle">50 %</text>
