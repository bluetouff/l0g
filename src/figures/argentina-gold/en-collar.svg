<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 292" width="100%" height="auto" style="width:100%;height:auto" role="img" aria-labelledby="argentina-gold-en-collar-title argentina-gold-en-collar-desc" xml:lang="en">
<title id="argentina-gold-en-collar-title">The price of a floor</title>
<desc id="argentina-gold-en-collar-desc">Illustrative example for one unit of gold, starting index 100. The holder buys a put at 90 and sells a call at 110. At expiry, with gold at 70, 100 or 130, the hedged value is 90, 100 or 110 before premiums and fees.</desc>
