<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 269" width="100%" height="auto" style="width:100%;height:auto" role="img" aria-labelledby="argentina-gold-fr-payments-title argentina-gold-fr-payments-desc" xml:lang="fr">
<title id="argentina-gold-fr-payments-title">La facture des options sur l’or</title>
<desc id="argentina-gold-fr-payments-desc">Pour 2025, l’AGN ventile 1 023 millions de dollars américains entre 960,2 millions au titre du résultat négatif des options et 62,8 millions de primes. La BCRA annonce par ailleurs un résultat net positif de 2 505 millions sur sa position en or, couverture comprise.</desc>
