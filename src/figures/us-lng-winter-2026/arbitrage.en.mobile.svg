<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 900" role="img" aria-labelledby="ul26-arbitrage-en-m-title ul26-arbitrage-en-m-desc" style="width:100%;height:auto" class="l0g-us-lng-winter-svg"><title id="ul26-arbitrage-en-m-title">One LNG cargo, two destinations</title><desc id="ul26-arbitrage-en-m-desc">A flexible US LNG cargo can reach Europe or Asia depending on net delivery revenue. Regional averages from March to October 2026: TTF close to 20 dollars and Asian LNG at 21.5 dollars per million BTU.</desc>
