<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="ul26-thresholds-en-d-title ul26-thresholds-en-d-desc" style="width:100%;height:auto" class="l0g-us-lng-winter-svg"><title id="ul26-thresholds-en-d-title">Three distinct storage benchmarks</title><desc id="ul26-thresholds-en-d-desc">Observed EU storage fill: 74.33% in the reading displayed on 4 November 2026. Withdrawal rates tend to decline when storage fill drops below about 30%. The IEA scenario combining cold weather and prolonged Hormuz disruption could leave fill levels below 10% at end-March 2027. Three distinct benchmarks.</desc>
