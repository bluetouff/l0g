<text data-panel="ul26-thresholds-en-m-frame" x="22" y="756" font-family="l0g US LNG Winter" font-size="19" font-weight="400" text-anchor="start" fill="var(--color-muted)">prolonged Hormuz disruption, IEA.</text>
