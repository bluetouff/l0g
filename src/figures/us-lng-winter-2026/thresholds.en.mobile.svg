<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 960" role="img" aria-labelledby="ul26-thresholds-en-m-title ul26-thresholds-en-m-desc" style="width:100%;height:auto" class="l0g-us-lng-winter-svg"><title id="ul26-thresholds-en-m-title">Three distinct storage benchmarks</title><desc id="ul26-thresholds-en-m-desc">Observed EU storage fill: 74.33% in the reading displayed on 4 November 2026. Withdrawal rates tend to decline when storage fill drops below about 30%. The IEA scenario combining cold weather and prolonged Hormuz disruption could leave fill levels below 10% at end-March 2027. Three distinct benchmarks.</desc>
<rect x="0" y="0" width="420" height="960" rx="12" fill="var(--color-ink)" stroke="none" stroke-width="1" id="ul26-thresholds-en-m-frame"/>
<text data-panel="ul26-thresholds-en-m-frame" x="22" y="36" font-family="l0g US LNG Winter" font-size="20" font-weight="700" text-anchor="start" fill="var(--color-signal)">06 / GAS · WINTER 2026</text>
<text data-panel="ul26-thresholds-en-m-frame" x="22" y="78" font-family="l0g US LNG Winter" font-size="28" font-weight="700" text-anchor="start" fill="var(--color-paper)">Three benchmarks</text>
<text data-panel="ul26-thresholds-en-m-frame" x="22" y="114" font-family="l0g US LNG Winter" font-size="28" font-weight="700" text-anchor="start" fill="var(--color-paper)">for storage</text>
<text data-panel="ul26-thresholds-en-m-frame" x="22" y="160" font-family="l0g US LNG Winter" font-size="19" font-weight="400" text-anchor="start" fill="var(--color-muted)">Working capacity · scale 0-100%</text>
<text data-panel="ul26-thresholds-en-m-frame" x="22" y="211" font-family="l0g US LNG Winter" font-size="20" font-weight="700" text-anchor="start" fill="var(--color-paper)">OBSERVATION</text>
<text data-panel="ul26-thresholds-en-m-frame" x="398" y="211" font-family="l0g US LNG Winter" font-size="26" font-weight="700" text-anchor="end" fill="var(--color-signal)">74.33 %</text>
<rect x="22" y="238" width="376" height="22" rx="0" fill="var(--color-surface-2)" stroke="none" stroke-width="1"/>
<rect x="22" y="238" width="279.4808" height="22" rx="0" fill="var(--color-signal)" stroke="none" stroke-width="1" data-metric="storage-benchmark" data-value="74.33"/>
