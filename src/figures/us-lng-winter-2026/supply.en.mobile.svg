<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 900" role="img" aria-labelledby="ul26-supply-en-m-title ul26-supply-en-m-desc" style="width:100%;height:auto" class="l0g-us-lng-winter-svg"><title id="ul26-supply-en-m-title">The global shortfall after offsets</title><desc id="ul26-supply-en-m-desc">Year-on-year change in LNG loadings, March-October 2026: Gulf loss over 60 bcm, non-Gulf gain over 40 bcm, global net loss about 20 bcm. Bounds and rounded estimates.</desc>
