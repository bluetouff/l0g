<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="ul26-supply-en-d-title ul26-supply-en-d-desc" style="width:100%;height:auto" class="l0g-us-lng-winter-svg"><title id="ul26-supply-en-d-title">The global shortfall after offsets</title><desc id="ul26-supply-en-d-desc">Year-on-year change in LNG loadings, March-October 2026: Gulf loss over 60 bcm, non-Gulf gain over 40 bcm, global net loss about 20 bcm. Bounds and rounded estimates.</desc>
