<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="inflation-budget-fr-choices-d-title inflation-budget-fr-choices-d-desc" viewBox="0 0 1000 680" style="width:100%;height:auto" class="l0g-inflation-budget-svg">
<title id="inflation-budget-fr-choices-d-title">Le ticket baisse quand l’achat change</title>
<desc id="inflation-budget-fr-choices-d-desc">Exemple construit : les prix de A et de B augmentent. Passer d’une unité de B à une unité de A fait pourtant baisser la dépense de 2 € à 1,40 €. Valeurs entièrement choisies pour l’explication, sans observation de produit ou de ménage. Référence A : 1 € puis 1,40 €, soit +40 %. Référence B : 2 € puis 2,50 €, soit +25 %. Achat choisi : une unité de B à la première date, une unité de A à la seconde ; variation de dépense = 1,40/2 −1 = −30 %. Les produits sont différents et aucune équivalence de qualité ou d’utilité n’est supposée. Le schéma explique la distinction entre prix comparable et dépense observée, éclairée par la documentation méthodologique R10.</desc>
