<text data-panel="inflation-budget-fr-choices-d-frame" x="40" y="40" fill="var(--color-signal)" font-family="l0g Inflation Budget" font-size="22" font-weight="700" text-anchor="start">l0g / BUDGET</text>
<text data-panel="inflation-budget-fr-choices-d-frame" x="960" y="40" fill="var(--color-muted)" font-family="l0g Inflation Budget" font-size="22" font-weight="400" text-anchor="end">04 / 05</text>
<text data-panel="inflation-budget-fr-choices-d-frame" x="40" y="93" fill="var(--color-paper)" font-family="l0g Inflation Budget" font-size="34" font-weight="700" text-anchor="start">Le ticket baisse quand l’achat change</text>
<text data-panel="inflation-budget-fr-choices-d-frame" x="40" y="137" fill="var(--color-muted)" font-family="l0g Inflation Budget" font-size="22" font-weight="400" text-anchor="start">Exemple fictif · un même produit est suivi sur chaque ligne</text>
