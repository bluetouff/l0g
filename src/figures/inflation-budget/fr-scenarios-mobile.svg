<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="inflation-budget-fr-scenarios-m-title inflation-budget-fr-scenarios-m-desc" viewBox="0 0 420 1000" style="width:100%;height:auto" class="l0g-inflation-budget-svg">
<title id="inflation-budget-fr-scenarios-m-title">Trois paniers, le même point de départ</title>
<desc id="inflation-budget-fr-scenarios-m-desc">Trois répartitions choisies de 2 000 € en décembre 2025 sont revalorisées avec les mêmes indices de septembre 2026. Les parts modifient le résultat du calcul. Modèle à cinq groupes, décrit dans les hypothèses de l’outil. Montants initiaux alimentation/tabac/manufacturés/énergie/services : repère 2026 = 297/33,60/477,60/152,80/1 039 € ; énergie 20 % = 300/0/400/400/900 € ; alimentation 30 % = 600/0/400/160/840 €. Coût de chaque poste = montant initial × indice septembre/indice décembre, arrondi au centime avant sommation. Coûts totaux : 2 062,44 ; 2 113,10 ; 2 062,85 €. Les barres de composition totalisent chacune 100 % ; les barres de supplément partagent l’échelle 0–120 €. Les proportions nationales servent de repère conventionnel, les deux autres répartitions sont fictives ; aucun profil démographique observé n’est représenté. Neuf mois, sans annualisation, prévision ou mesure exacte d’inflation individuelle.</desc>
