<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="inflation-budget-en-basket-d-title inflation-budget-en-basket-d-desc" viewBox="0 0 1000 680" style="width:100%;height:auto" class="l0g-inflation-budget-svg">
<title id="inflation-budget-en-basket-d-title">A small share can carry a large change</title>
<desc id="inflation-budget-en-basket-d-desc">In this five-group calculation, a 7.64% energy weight and a 22.17% price increase produce a contribution of 1.69 percentage points over nine months. December 2025 to September 2026, definitive base-2025 indices and national 2026 weights. l0g calculation: contribution = weight/10,000 × (September index/December index − 1) ×100, in percentage points. The five contributions total 3.1217607% before rounding. The published all-items index gives 3.1215608% over the same period; rounding and aggregation explain this very small difference. Contributions are displayed to three decimals, the energy formula and total to two. Chart segments start at zero; manufactured goods contribute slightly negatively. This teaching calculation is neither an official contribution series nor an annual rate.</desc>
