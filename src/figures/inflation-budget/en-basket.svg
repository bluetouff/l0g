<text data-panel="inflation-budget-en-basket-d-frame" x="40" y="40" fill="var(--color-signal)" font-family="l0g Inflation Budget" font-size="22" font-weight="700" text-anchor="start">l0g / BUDGET</text>
<text data-panel="inflation-budget-en-basket-d-frame" x="960" y="40" fill="var(--color-muted)" font-family="l0g Inflation Budget" font-size="22" font-weight="400" text-anchor="end">02 / 05</text>
<text data-panel="inflation-budget-en-basket-d-frame" x="40" y="93" fill="var(--color-paper)" font-family="l0g Inflation Budget" font-size="34" font-weight="700" text-anchor="start">A small share can carry a large change</text>
<text data-panel="inflation-budget-en-basket-d-frame" x="40" y="137" fill="var(--color-muted)" font-family="l0g Inflation Budget" font-size="22" font-weight="400" text-anchor="start">December 2025 to September 2026 · contribution points</text>
