<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="inflation-budget-en-housing-d-title inflation-budget-en-housing-d-desc" viewBox="0 0 1000 680" style="width:100%;height:auto" class="l0g-inflation-budget-svg">
<title id="inflation-budget-en-housing-d-title">Housing takes a different share</title>
<desc id="inflation-budget-en-housing-d-desc">In early 2024, net housing costs amount to €25.4 per €100 of income for the private-tenant group, against €7.4 for owners without an outstanding acquisition loan. Insee Première No.2128, published 23 September 2026, Figure 1, 2023–2024 Housing Survey. Net housing-cost ratio = total main-home expenses less housing benefits, divided by total incomes, ×100. These are ratios of group sums, rather than means of individual ratios. Income is measured before direct taxes and excludes housing benefits. Expenses include principal and interest repayments for mortgaged owners, property tax, service charges, water and energy. Coverage: main homes in France excluding Mayotte, households in ordinary dwellings, excluding student reference persons and negative household incomes. The axis spans 0–100; bars show a share of the statistical denominator, whose remainder still includes taxes and other uses. This housing measure differs from CPI consumption coverage.</desc>
<rect id="inflation-budget-en-housing-d-frame" x="0" y="0" width="1000" height="680" fill="var(--color-ink)"/>
<text data-panel="inflation-budget-en-housing-d-frame" x="40" y="40" fill="var(--color-signal)" font-family="l0g Inflation Budget" font-size="22" font-weight="700" text-anchor="start">l0g / BUDGET</text>
<text data-panel="inflation-budget-en-housing-d-frame" x="960" y="40" fill="var(--color-muted)" font-family="l0g Inflation Budget" font-size="22" font-weight="400" text-anchor="end">03 / 05</text>
<text data-panel="inflation-budget-en-housing-d-frame" x="40" y="93" fill="var(--color-paper)" font-family="l0g Inflation Budget" font-size="34" font-weight="700" text-anchor="start">Housing takes a different share</text>
