<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="inflation-budget-en-levels-m-title inflation-budget-en-levels-m-desc" viewBox="0 0 420 900" style="width:100%;height:auto" class="l0g-inflation-budget-svg">
<title id="inflation-budget-en-levels-m-title">Past increases stay in the price level</title>
<desc id="inflation-budget-en-levels-m-desc">Monthly food and all-items indices share a common reference: the 2015 average equals 100. Their averages for the first half of 2026 reach 134.7 and 122.5. Insee series 011813717 (food) and 011814630 (all items), statistical base 2025, France, all households, not seasonally adjusted, version collected on 30 October 2026. Each monthly index is divided by the mean of the twelve 2015 observations, then multiplied by 100. Lines run from January 2015 to June 2026; the panels compare the 2015 average with the first six months of 2026, rather than June alone. Calculated levels: 134.6796 and 122.5250. The vertical axis explicitly spans 95–140. Long series are backcast under Insee’s documented method; the averages agree with the rounded 35% and 23% increases in the 15 October publication.</desc>
