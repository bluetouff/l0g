<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="inflation-budget-fr-basket-d-title inflation-budget-fr-basket-d-desc" viewBox="0 0 1000 680" style="width:100%;height:auto" class="l0g-inflation-budget-svg">
<title id="inflation-budget-fr-basket-d-title">Une petite part peut peser lourd</title>
<desc id="inflation-budget-fr-basket-d-desc">Dans ce calcul à cinq agrégats, la pondération énergétique de 7,64 % et une hausse des prix de 22,17 % produisent une contribution de 1,69 point sur neuf mois. Décembre 2025 à septembre 2026, indices définitifs en base 2025 et pondérations nationales 2026. Calcul l0g : contribution = poids/10 000 × (indice septembre/indice décembre − 1) ×100, en points de pourcentage. Les cinq contributions se somment à 3,1217607 %, avant arrondi. L’indice ensemble publié donne 3,1215608 % sur la même fenêtre ; arrondis et agrégation expliquent ce très faible écart. Les valeurs affichées sont arrondies à trois décimales pour les contributions, à deux pour la formule énergétique et le total. Les traits du graphique partent de zéro ; les produits manufacturés ont une contribution légèrement négative. Ce calcul pédagogique n’est pas une série officielle de contributions ni un taux annuel.</desc>
