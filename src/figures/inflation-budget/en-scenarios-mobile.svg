<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="inflation-budget-en-scenarios-m-title inflation-budget-en-scenarios-m-desc" viewBox="0 0 420 1000" style="width:100%;height:auto" class="l0g-inflation-budget-svg">
<title id="inflation-budget-en-scenarios-m-title">Three baskets, the same starting point</title>
<desc id="inflation-budget-en-scenarios-m-desc">Three chosen allocations of €2,000 in December 2025 are revalued using the same September 2026 indices. Changing the shares changes the calculated outcome. Five-group model documented in the tool’s stated assumptions. Initial food/tobacco/manufactured/energy/services amounts: 2026 benchmark = €297/33.60/477.60/152.80/1,039; energy at 20% = €300/0/400/400/900; food at 30% = €600/0/400/160/840. Each comparative category cost equals its starting amount times the September/December index ratio, rounded to cents before summing. Total costs: €2,062.44, €2,113.10 and €2,062.85. Composition bars each total 100%; additional-cost bars share a €0–120 scale. National proportions provide a conventional benchmark; the other allocations are fictional, with no observed demographic profile represented. Nine months, with no annualisation, forecast or precise individual inflation measurement.</desc>
