<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="inflation-budget-fr-housing-m-title inflation-budget-fr-housing-m-desc" viewBox="0 0 420 1000" style="width:100%;height:auto" class="l0g-inflation-budget-svg">
<title id="inflation-budget-fr-housing-m-title">Le logement occupe une part différente</title>
<desc id="inflation-budget-fr-housing-m-desc">Début 2024, les dépenses nettes de logement représentent 25,4 € pour 100 € de revenus du groupe des locataires privés, contre 7,4 € pour les propriétaires sans emprunt d’acquisition restant. Insee Première n°2128, publié le 23 septembre 2026, figure 1, enquête Logement 2023–2024. Taux d’effort net = somme des dépenses de résidence principale moins aides au logement, divisée par somme des revenus, ×100. Il s’agit de ratios de sommes par groupe, distincts d’une moyenne de ratios individuels. Revenus avant impôts directs et hors aides au logement. Dépenses incluant notamment capital et intérêts remboursés chez les accédants, taxe foncière, charges, eau et énergie. Champ : résidences principales, France hors Mayotte, ménages en logement ordinaire, hors personne de référence étudiante et revenus négatifs. Axe 0–100 ; les barres représentent la fraction du dénominateur statistique, dont le reste inclut encore impôts et autres usages. Cette mesure de logement diffère du périmètre de consommation de l’IPC.</desc>
