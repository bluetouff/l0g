<text data-panel="inflation-budget-en-choices-m-card-purchase-1" x="254" y="636" fill="var(--color-paper)" font-family="l0g Inflation Budget" font-size="20" font-weight="700" text-anchor="start">of A</text>
<text data-panel="inflation-budget-en-choices-m-card-purchase-1" x="254" y="700" fill="var(--color-signal)" font-family="l0g Inflation Budget" font-size="29" font-weight="700" text-anchor="start">€1.40</text>
<line x1="188" y1="700" x2="232" y2="700" stroke="var(--color-signal)" stroke-width="3"/>
<path d="M 223 694 L 232 700 L 223 706" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text data-panel="inflation-budget-en-choices-m-frame" x="210" y="553" fill="var(--color-signal)" font-family="l0g Inflation Budget" font-size="23" font-weight="700" text-anchor="middle">−30%</text>
<text data-panel="inflation-budget-en-choices-m-frame" x="28" y="807" fill="var(--color-muted)" font-family="l0g Inflation Budget" font-size="17" font-weight="400" text-anchor="start">Lower spending, different products.</text>
<text data-panel="inflation-budget-en-choices-m-frame" x="28" y="832" fill="var(--color-muted)" font-family="l0g Inflation Budget" font-size="17" font-weight="400" text-anchor="start">Fictional inputs.</text>
<text data-panel="inflation-budget-en-choices-m-frame" x="28" y="873" fill="var(--color-muted)" font-family="l0g Inflation Budget" font-size="17" font-weight="400" text-anchor="start">R10</text>
