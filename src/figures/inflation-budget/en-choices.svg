<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="inflation-budget-en-choices-d-title inflation-budget-en-choices-d-desc" viewBox="0 0 1000 680" style="width:100%;height:auto" class="l0g-inflation-budget-svg">
<title id="inflation-budget-en-choices-d-title">The bill falls when the purchase changes</title>
<desc id="inflation-budget-en-choices-d-desc">Constructed example: prices of both A and B rise. Switching from one unit of B to one unit of A still reduces expenditure from €2 to €1.40. All values are chosen for explanation, with no observed product or household. Item A: €1 then €1.40, a 40% increase. Item B: €2 then €2.50, a 25% increase. Chosen purchase: one unit of B at the first date and one unit of A at the second; expenditure change = 1.40/2 −1 = −30%. The products differ; no equivalence of quality or utility is assumed. The diagram explains the distinction between comparable prices and observed expenditure, informed by methodological source R10.</desc>
<rect id="inflation-budget-en-choices-d-frame" x="0" y="0" width="1000" height="680" fill="var(--color-ink)"/>
<text data-panel="inflation-budget-en-choices-d-frame" x="40" y="40" fill="var(--color-signal)" font-family="l0g Inflation Budget" font-size="22" font-weight="700" text-anchor="start">l0g / BUDGET</text>
<text data-panel="inflation-budget-en-choices-d-frame" x="960" y="40" fill="var(--color-muted)" font-family="l0g Inflation Budget" font-size="22" font-weight="400" text-anchor="end">04 / 05</text>
<text data-panel="inflation-budget-en-choices-d-frame" x="40" y="93" fill="var(--color-paper)" font-family="l0g Inflation Budget" font-size="34" font-weight="700" text-anchor="start">The bill falls when the purchase changes</text>
<text data-panel="inflation-budget-en-choices-d-frame" x="40" y="137" fill="var(--color-muted)" font-family="l0g Inflation Budget" font-size="22" font-weight="400" text-anchor="start">Fictional example · each row follows the same product</text>
