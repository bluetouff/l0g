<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="inflation-budget-fr-levels-d-title inflation-budget-fr-levels-d-desc" viewBox="0 0 1000 680" style="width:100%;height:auto" class="l0g-inflation-budget-svg">
<title id="inflation-budget-fr-levels-d-title">Les hausses restent dans le niveau des prix</title>
<desc id="inflation-budget-fr-levels-d-desc">Les indices mensuels de l’alimentation et de l’ensemble sont ramenés à une même référence : la moyenne de 2015 égale à 100. Les moyennes du premier semestre 2026 atteignent 134,7 et 122,5. Séries Insee 011813717 (alimentation) et 011814630 (ensemble), base statistique 2025, France, ensemble des ménages, non corrigées des variations saisonnières, version du 30 octobre 2026. Chaque indice mensuel est divisé par la moyenne des douze indices de 2015, puis multiplié par 100. Courbes de janvier 2015 à juin 2026 ; les encadrés comparent la moyenne de 2015 à la moyenne des six premiers mois de 2026, et non juin seul. Niveaux calculés : 134,6796 et 122,5250. Axe vertical 95–140 explicitement gradué. Les séries longues sont rétropolées selon la documentation Insee ; les moyennes affichées retrouvent les arrondis +35 % et +23 % de la publication du 15 octobre.</desc>
