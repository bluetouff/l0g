<text x="471" y="167" font-size="14" fill="var(--color-paper)" text-anchor="middle" font-weight="400">Publication rétablie</text>
<text x="471" y="185" font-size="12" fill="var(--color-muted)" text-anchor="middle" font-weight="400">Retour des documents publics</text>
