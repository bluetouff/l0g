<text x="16" y="30" font-size="17" fill="var(--color-paper)" text-anchor="start" font-weight="500">Le registre budgétaire de l’OMB</text>
<text x="16" y="49" font-size="12" fill="var(--color-muted)" text-anchor="start" font-weight="400">Du retrait à la remise en ligne · 2025</text>
<path d="M16 61H556" fill="none" stroke="var(--color-line)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M101 107H471" fill="none" stroke="var(--color-line-strong)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="101" cy="107" r="17" fill="var(--color-surface)" stroke="var(--color-accent)" stroke-width="1"/>
<g transform="translate(90 96)" aria-hidden="true"><path d="M3 5h16v13H3zM3 8h16m-11 5h6" fill="none" stroke="var(--color-accent)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/></g>
<text x="101" y="148" font-size="12" fill="var(--color-accent)" text-anchor="middle" font-weight="500">24 mars</text>
<text x="101" y="167" font-size="14" fill="var(--color-paper)" text-anchor="middle" font-weight="400">Registre retiré</text>
<text x="101" y="185" font-size="12" fill="var(--color-muted)" text-anchor="middle" font-weight="400">L’OMB désactive son site</text>
<circle cx="286" cy="107" r="17" fill="var(--color-surface)" stroke="var(--color-paper)" stroke-width="1"/>
<g transform="translate(275 96)" aria-hidden="true"><path d="M11 4v14M7 18h8M5 7h12M5 7l-3 7h6l-3-7m12 0-3 7h6l-3-7" fill="none" stroke="var(--color-paper)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/></g>
<text x="286" y="148" font-size="12" fill="var(--color-paper)" text-anchor="middle" font-weight="500">21 juillet</text>
<text x="286" y="167" font-size="14" fill="var(--color-paper)" text-anchor="middle" font-weight="400">Ordre de rétablissement</text>
<text x="286" y="185" font-size="12" fill="var(--color-muted)" text-anchor="middle" font-weight="400">Jugement du tribunal fédéral</text>
<circle cx="471" cy="107" r="17" fill="var(--color-surface)" stroke="var(--color-signal)" stroke-width="1"/>
