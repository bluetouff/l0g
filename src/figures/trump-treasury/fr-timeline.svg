<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 572 212" width="100%" height="auto" style="width:100%;height:auto" role="img" aria-labelledby="trump-treasury-fr-timeline-wide-title trump-treasury-fr-timeline-wide-desc" xml:lang="fr">
<title id="trump-treasury-fr-timeline-wide-title">Le registre budgétaire de l’OMB</title>
<desc id="trump-treasury-fr-timeline-wide-desc">Le site de l’Office of Management and Budget est retiré le 24 mars 2025. Un tribunal fédéral ordonne le rétablissement de la publication le 21 juillet. L’OMB recommence à publier ses décisions de répartition le 15 août.</desc>
