<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 342 263" width="100%" height="auto" style="width:100%;height:auto" role="img" aria-labelledby="trump-treasury-en-timeline-mobile-title trump-treasury-en-timeline-mobile-desc" xml:lang="en">
<title id="trump-treasury-en-timeline-mobile-title">OMB’s public budget records</title>
<desc id="trump-treasury-en-timeline-mobile-desc">The Office of Management and Budget’s website was taken offline on March 24, 2025. A U.S. district court ordered publication to resume on July 21. OMB resumed publishing apportionment documents on August 15.</desc>
<rect x="0.5" y="0.5" width="341" height="262" rx="9" fill="var(--color-ink)" fill-opacity="1" stroke="var(--color-line)"/>
<text x="16" y="30" font-size="17" fill="var(--color-paper)" text-anchor="start" font-weight="500">OMB’s public budget records</text>
<text x="16" y="49" font-size="12" fill="var(--color-muted)" text-anchor="start" font-weight="400">From takedown to restoration · 2025</text>
<path d="M16 61H326" fill="none" stroke="var(--color-line)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M35 101V231" fill="none" stroke="var(--color-line-strong)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="35" cy="101" r="15" fill="var(--color-surface)" stroke="var(--color-accent)" stroke-width="1"/>
<g transform="translate(24 90)" aria-hidden="true"><path d="M3 5h16v13H3zM3 8h16m-11 5h6" fill="none" stroke="var(--color-accent)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/></g>
<text x="62" y="89" font-size="12" fill="var(--color-accent)" text-anchor="start" font-weight="500">March 24</text>
<text x="62" y="106" font-size="14" fill="var(--color-paper)" text-anchor="start" font-weight="400">Site taken offline</text>
<text x="62" y="122" font-size="12" fill="var(--color-muted)" text-anchor="start" font-weight="400">OMB takes down the site</text>
<circle cx="35" cy="166" r="15" fill="var(--color-surface)" stroke="var(--color-paper)" stroke-width="1"/>
<g transform="translate(24 155)" aria-hidden="true"><path d="M11 4v14M7 18h8M5 7h12M5 7l-3 7h6l-3-7m12 0-3 7h6l-3-7" fill="none" stroke="var(--color-paper)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/></g>
<text x="62" y="154" font-size="12" fill="var(--color-paper)" text-anchor="start" font-weight="500">July 21</text>
<text x="62" y="171" font-size="14" fill="var(--color-paper)" text-anchor="start" font-weight="400">Court orders restoration</text>
<text x="62" y="187" font-size="12" fill="var(--color-muted)" text-anchor="start" font-weight="400">District court ruling</text>
<circle cx="35" cy="231" r="15" fill="var(--color-surface)" stroke="var(--color-signal)" stroke-width="1"/>
<g transform="translate(24 220)" aria-hidden="true"><path d="M3 5h16v13H3zM3 8h16m-11 5 2 2 4-4" fill="none" stroke="var(--color-signal)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/></g>
<text x="62" y="219" font-size="12" fill="var(--color-signal)" text-anchor="start" font-weight="500">August 15</text>
<text x="62" y="236" font-size="14" fill="var(--color-paper)" text-anchor="start" font-weight="400">Public posting resumes</text>
<text x="62" y="252" font-size="12" fill="var(--color-muted)" text-anchor="start" font-weight="400">Documents return to the site</text>
