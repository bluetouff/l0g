<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 342 321" width="100%" height="auto" style="width:100%;height:auto" role="img" aria-labelledby="trump-treasury-fr-circuit-mobile-title trump-treasury-fr-circuit-mobile-desc" xml:lang="fr">
<title id="trump-treasury-fr-circuit-mobile-title">Le circuit des paiements fédéraux</title>
<desc id="trump-treasury-fr-circuit-mobile-desc">Le Congrès vote les crédits. L’OMB les répartit. L’agence engage la dépense et certifie la demande de paiement. Le Bureau of the Fiscal Service traite le paiement et le transmet à la Réserve fédérale pour règlement. L’accès du DOGE étudié ici concernait les systèmes du Trésor.</desc>
