<text x="16" y="30" font-size="17" fill="var(--color-paper)" text-anchor="start" font-weight="500">The federal payment chain</text>
<text x="16" y="49" font-size="12" fill="var(--color-muted)" text-anchor="start" font-weight="400">From appropriations to settlement</text>
