<text x="286" y="144" font-size="14" fill="var(--color-paper)" text-anchor="middle" font-weight="500">Agency</text>
<text x="286" y="162" font-size="12" fill="var(--color-muted)" text-anchor="middle" font-weight="400">Commits, certifies</text>
