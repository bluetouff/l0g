<text x="62" y="106" font-size="14" fill="var(--color-paper)" text-anchor="start" font-weight="400">Registre retiré</text>
<text x="62" y="122" font-size="12" fill="var(--color-muted)" text-anchor="start" font-weight="400">L’OMB désactive son site</text>
