<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 342 321" width="100%" height="auto" style="width:100%;height:auto" role="img" aria-labelledby="trump-treasury-en-circuit-mobile-title trump-treasury-en-circuit-mobile-desc" xml:lang="en">
<title id="trump-treasury-en-circuit-mobile-title">The federal payment chain</title>
<desc id="trump-treasury-en-circuit-mobile-desc">Congress appropriates funds. OMB apportions them. The agency incurs the obligation and certifies the payment request. The Bureau of the Fiscal Service processes the payment and sends it to the Federal Reserve for settlement. The DOGE access examined here involved Treasury systems.</desc>
