amily="l0g Sabotage Attribution" font-size="18" font-weight="400" fill="var(--color-paper)" text-anchor="start">DDIS attributes a 2024 attack on a</text><text data-panel="sa04-labels-en-m-panel-source-2" x="44" y="920" font-family="l0g Sabotage Attribution" font-size="18" font-weight="400" fill="var(--color-paper)" text-anchor="start">Danish water service to Russia. It</text><text data-panel="sa04-labels-en-m-panel-source-2" x="44" y="944" font-family="l0g Sabotage Attribution" font-size="18" font-weight="400" fill="var(--color-paper)" text-anchor="start">names Z-Pentest and state links.</text><text data-panel="sa04-labels-en-m-panel-source-2" x="44" y="968" font-family="l0g Sabotage Attribution" font-size="18" font-weight="400" fill="var(--color-paper)" text-anchor="start">Evidence is absent from the note.</text><text data-panel="sa04-labels-en-m-frame" x="28" y="1060" font-family="l0g Sabotage Attribution" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">[09, 08, 10]</text></svg>