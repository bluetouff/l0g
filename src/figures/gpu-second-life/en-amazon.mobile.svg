<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 316" width="100%" height="auto" style="width:100%;height:auto" role="img" aria-labelledby="gpu-second-life-en-amazon-mobile-title gpu-second-life-en-amazon-mobile-desc" xml:lang="en">
<title id="gpu-second-life-en-amazon-mobile-title">Amazon revises useful lives</title>
<desc id="gpu-second-life-en-amazon-mobile-desc">In 2024, Amazon extended estimated server useful lives from five to six years and reported 3.2 billion dollars less depreciation and 2.5 billion more net income. In 2025, it moved some servers and networking equipment from six years to five and reported 1.4 billion more depreciation and 1 billion less net income.</desc>
<rect x=".5" y=".5" width="319" height="315" rx="9" fill="var(--color-ink)" stroke="var(--color-line)"/>
<text x="16" y="29" font-size="16" text-anchor="start" fill="var(--color-paper)">Amazon revises useful lives</text>
<text x="16" y="47" font-size="12" text-anchor="start" fill="var(--color-muted)">Annual effects · USD billions</text>
<path d="M16 59H304" fill="none" stroke="var(--color-line)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M16 191H304" fill="none" stroke="var(--color-line)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="16" y="86" font-size="13" text-anchor="start" fill="var(--color-paper)">Jan. 2024</text>
<text x="304" y="86" font-size="14" text-anchor="end" fill="var(--color-signal)">5 → 6 years</text>
<text x="16" y="106" font-size="12" text-anchor="start" fill="var(--color-muted)">Servers</text>
<rect x="16" y="118" width="23" height="11" rx="2" fill="var(--color-ink)" fill-opacity="0" stroke="var(--color-line-strong)"/>
<rect x="44" y="118" width="23" height="11" rx="2" fill="var(--color-ink)" fill-opacity="0" stroke="var(--color-line-strong)"/>
<rect x="72" y="118" width="23" height="11" rx="2" fill="var(--color-ink)" fill-opacity="0" stroke="var(--color-line-strong)"/>
<rect x="100" y="118" width="23" height="11" rx="2" fill="var(--color-ink)" fill-opacity="0" stroke="var(--color-line-strong)"/>
<rect x="128" y="118" width="23" height="11" rx="2" fill="var(--color-ink)" fill-opacity="0" stroke="var(--color-line-strong)"/>
<rect x="156" y="118" width="23" height="11" rx="2" fill="var(--color-signal)" fill-opacity="0.21" stroke="var(--color-signal)"/>
<text x="16" y="154" font-size="12" text-anchor="start" fill="var(--color-paper)">Depreciation</text>
<text x="304" y="154" font-size="14" text-anchor="end" fill="var(--color-signal)">−3.2</text>
<text x="16" y="176" font-size="12" text-anchor="start" fill="var(--color-paper)">Net income</text>
<text x="304" y="176" font-size="14" text-anchor="end" fill="var(--color-signal)">+2.5</text>
<text x="16" y="212" font-size="13" text-anchor="start" fill="var(--color-paper)">Jan. 2025</text>
<text x="304" y="212" font-size="14" text-anchor="end" fill="var(--color-accent)">6 → 5 years</text>
<text x="16" y="232" font-size="12" text-anchor="start" fill="var(--color-muted)">Some servers and networking gear</text>
<rect x="16" y="244" width="23" height="11" rx="2" fill="var(--color-ink)" fill-opacity="0" stroke="var(--color-line-strong)"/>
<rect x="44" y="244" width="23" height="11" rx="2" fill="var(--color-ink)" fill-opacity="0" stroke="var(--color-line-strong)"/>
<rect x="72" y="244" width="23" height="11" rx="2" fill="var(--color-ink)" fill-opacity="0" stroke="var(--color-line-strong)"/>
