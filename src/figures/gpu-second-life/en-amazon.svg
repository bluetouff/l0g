<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 572 204" width="100%" height="auto" style="width:100%;height:auto" role="img" aria-labelledby="gpu-second-life-en-amazon-wide-title gpu-second-life-en-amazon-wide-desc" xml:lang="en">
<title id="gpu-second-life-en-amazon-wide-title">Amazon revises useful lives</title>
<desc id="gpu-second-life-en-amazon-wide-desc">In 2024, Amazon extended estimated server useful lives from five to six years and reported 3.2 billion dollars less depreciation and 2.5 billion more net income. In 2025, it moved some servers and networking equipment from six years to five and reported 1.4 billion more depreciation and 1 billion less net income.</desc>
