<rect x="157" y="118" width="22" height="11" rx="2" fill="var(--color-signal)" fill-opacity="0.21" stroke="var(--color-signal)"/>
<text x="22" y="154" font-size="12" text-anchor="start" fill="var(--color-paper)">Depreciation</text>
<text x="268" y="154" font-size="14" text-anchor="end" fill="var(--color-signal)">−3.2</text>
