<text x="22" y="29" font-size="18" text-anchor="start" fill="var(--color-paper)">Amazon revises useful lives</text>
<text x="22" y="47" font-size="12" text-anchor="start" fill="var(--color-muted)">Annual effects · USD billions</text>
