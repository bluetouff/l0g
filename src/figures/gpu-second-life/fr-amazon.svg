<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 572 204" width="100%" height="auto" style="width:100%;height:auto" role="img" aria-labelledby="gpu-second-life-fr-amazon-wide-title gpu-second-life-fr-amazon-wide-desc" xml:lang="fr">
<title id="gpu-second-life-fr-amazon-wide-title">Amazon révise ses durées</title>
<desc id="gpu-second-life-fr-amazon-wide-desc">En 2024, Amazon a porté la durée de vie estimée de ses serveurs de cinq à six ans. L’entreprise rapporte 3,2 milliards de dollars d’amortissement en moins et 2,5 milliards de bénéfice net en plus. En 2025, la durée baisse de six à cinq ans pour certains serveurs et équipements réseau. Amazon rapporte 1,4 milliard d’amortissement en plus et 1 milliard de bénéfice net en moins.</desc>
<rect x=".5" y=".5" width="571" height="203" rx="9" fill="var(--color-ink)" stroke="var(--color-line)"/>
<text x="22" y="29" font-size="18" text-anchor="start" fill="var(--color-paper)">Amazon révise ses durées</text>
<text x="22" y="47" font-size="12" text-anchor="start" fill="var(--color-muted)">Effets annuels · milliards USD</text>
