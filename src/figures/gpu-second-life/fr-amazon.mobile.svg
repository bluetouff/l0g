<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 316" width="100%" height="auto" style="width:100%;height:auto" role="img" aria-labelledby="gpu-second-life-fr-amazon-mobile-title gpu-second-life-fr-amazon-mobile-desc" xml:lang="fr">
<title id="gpu-second-life-fr-amazon-mobile-title">Amazon révise ses durées</title>
<desc id="gpu-second-life-fr-amazon-mobile-desc">En 2024, Amazon a porté la durée de vie estimée de ses serveurs de cinq à six ans. L’entreprise rapporte 3,2 milliards de dollars d’amortissement en moins et 2,5 milliards de bénéfice net en plus. En 2025, la durée baisse de six à cinq ans pour certains serveurs et équipements réseau. Amazon rapporte 1,4 milliard d’amortissement en plus et 1 milliard de bénéfice net en moins.</desc>
<rect x=".5" y=".5" width="319" height="315" rx="9" fill="var(--color-ink)" stroke="var(--color-line)"/>
<text x="16" y="29" font-size="16" text-anchor="start" fill="var(--color-paper)">Amazon révise ses durées</text>
<text x="16" y="47" font-size="12" text-anchor="start" fill="var(--color-muted)">Effets annuels · milliards USD</text>
<path d="M16 59H304" fill="none" stroke="var(--color-line)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M16 191H304" fill="none" stroke="var(--color-line)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="16" y="86" font-size="13" text-anchor="start" fill="var(--color-paper)">Janv. 2024</text>
<text x="304" y="86" font-size="14" text-anchor="end" fill="var(--color-signal)">5 → 6 ans</text>
<text x="16" y="106" font-size="12" text-anchor="start" fill="var(--color-muted)">Serveurs</text>
<rect x="16" y="118" width="23" height="11" rx="2" fill="var(--color-ink)" fill-opacity="0" stroke="var(--color-line-strong)"/>
<rect x="44" y="118" width="23" height="11" rx="2" fill="var(--color-ink)" fill-opacity="0" stroke="var(--color-line-strong)"/>
<rect x="72" y="118" width="23" height="11" rx="2" fill="var(--color-ink)" fill-opacity="0" stroke="var(--color-line-strong)"/>
<rect x="100" y="118" width="23" height="11" rx="2" fill="var(--color-ink)" fill-opacity="0" stroke="var(--color-line-strong)"/>
<rect x="128" y="118" width="23" height="11" rx="2" fill="var(--color-ink)" fill-opacity="0" stroke="var(--color-line-strong)"/>
<rect x="156" y="118" width="23" height="11" rx="2" fill="var(--color-signal)" fill-opacity="0.21" stroke="var(--color-signal)"/>
<text x="16" y="154" font-size="12" text-anchor="start" fill="var(--color-paper)">Amortissement</text>
<text x="304" y="154" font-size="14" text-anchor="end" fill="var(--color-signal)">−3,2</text>
<text x="16" y="176" font-size="12" text-anchor="start" fill="var(--color-paper)">Bénéfice net</text>
<text x="304" y="176" font-size="14" text-anchor="end" fill="var(--color-signal)">+2,5</text>
<text x="16" y="212" font-size="13" text-anchor="start" fill="var(--color-paper)">Janv. 2025</text>
<text x="304" y="212" font-size="14" text-anchor="end" fill="var(--color-accent)">6 → 5 ans</text>
<text x="16" y="232" font-size="12" text-anchor="start" fill="var(--color-muted)">Certains serveurs et équipements réseau</text>
<rect x="16" y="244" width="23" height="11" rx="2" fill="var(--color-ink)" fill-opacity="0" stroke="var(--color-line-strong)"/>
<rect x="44" y="244" width="23" height="11" rx="2" fill="var(--color-ink)" fill-opacity="0" stroke="var(--color-line-strong)"/>
