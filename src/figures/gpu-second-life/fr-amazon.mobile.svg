<text x="16" y="280" font-size="12" text-anchor="start" fill="var(--color-paper)">Amortissement</text>
<text x="304" y="280" font-size="14" text-anchor="end" fill="var(--color-accent)">+1,4</text>
<text x="16" y="302" font-size="12" text-anchor="start" fill="var(--color-paper)">Bénéfice net</text>
