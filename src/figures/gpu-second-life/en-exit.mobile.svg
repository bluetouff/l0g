<text x="35" y="87.0" font-size="11" text-anchor="end" fill="var(--color-muted)">120</text>
<path d="M169.5 83V182" fill="none" stroke="var(--color-line-strong)" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/>
<path d="M44 83.0L295 149.0" fill="none" stroke="var(--color-topic-blue)" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M169.5 116.0L295 182.0" fill="none" stroke="var(--color-signal)" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/>
