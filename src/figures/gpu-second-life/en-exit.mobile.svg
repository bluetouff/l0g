<circle cx="295" cy="182.0" r="3" fill="var(--color-ink)" stroke="var(--color-signal)" stroke-width="1.5"/>
<text x="44.0" y="201" font-size="11" text-anchor="middle" fill="var(--color-muted)">0</text>
<text x="106.75" y="201" font-size="11" text-anchor="middle" fill="var(--color-muted)">1</text>
