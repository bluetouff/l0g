<text x="16" y="29" font-size="16" text-anchor="start" fill="var(--color-paper)">One sale, two accounting outcomes</text>
<text x="16" y="47" font-size="12" text-anchor="start" fill="var(--color-muted)">Illustrative example · book value in USD millions</text>
