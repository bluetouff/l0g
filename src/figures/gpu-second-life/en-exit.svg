<path d="M53 83.0L536 141.67" fill="none" stroke="var(--color-topic-blue)" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M294.5 112.33L536 171.0" fill="none" stroke="var(--color-signal)" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/>
