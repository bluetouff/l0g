<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 572 264" width="100%" height="auto" style="width:100%;height:auto" role="img" aria-labelledby="gpu-second-life-en-exit-wide-title gpu-second-life-en-exit-wide-desc" xml:lang="en">
<title id="gpu-second-life-en-exit-wide-title">One sale, two accounting outcomes</title>
<desc id="gpu-second-life-en-exit-wide-desc">Equipment purchased for 120 million dollars has a book value of 80 million at the end of year two under both estimates. At the end of year four it still carries 40 million on the six-year schedule, or zero on the revised four-year schedule. Reselling it for 12 million gives either a 28 million loss or a 12 million gain. Purchase cost net of proceeds is 108 million in both cases.</desc>
