<circle cx="536" cy="171.0" r="3" fill="var(--color-ink)" stroke="var(--color-signal)" stroke-width="1.5"/>
<text x="53.0" y="190" font-size="11" text-anchor="middle" fill="var(--color-muted)">0</text>
