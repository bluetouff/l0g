<text x="22" y="29" font-size="18" text-anchor="start" fill="var(--color-paper)">One sale, two accounting outcomes</text>
<text x="22" y="47" font-size="12" text-anchor="start" fill="var(--color-muted)">Illustrative example · book value in USD millions</text>
