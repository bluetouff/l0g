<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 291" width="100%" height="auto" style="width:100%;height:auto" role="img" aria-labelledby="gpu-second-life-fr-exit-mobile-title gpu-second-life-fr-exit-mobile-desc" xml:lang="fr">
<title id="gpu-second-life-fr-exit-mobile-title">Une vente, deux résultats</title>
<desc id="gpu-second-life-fr-exit-mobile-desc">Le matériel acheté 120 millions de dollars vaut 80 millions dans les deux scénarios à la fin de la deuxième année. À la fin de la quatrième année, il vaut encore 40 millions avec une durée de six ans, ou zéro avec la durée révisée à quatre ans. Une revente de 12 millions produit donc une perte de 28 millions, ou un gain de 12 millions. Le coût d’achat diminué du prix de vente est de 108 millions dans les deux cas.</desc>
