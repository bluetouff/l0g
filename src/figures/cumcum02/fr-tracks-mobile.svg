<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cumcum02-fr-tracks-m-title cumcum02-fr-tracks-m-desc" viewBox="0 0 420 1060" style="width:100%;height:auto" class="l0g-cumcum02-svg">
<title id="cumcum02-fr-tracks-m-title">Trois actes, trois questions différentes</title><desc id="cumcum02-fr-tracks-m-desc">La transaction fiscale CACIB du 2 avril 2021 traite une question fiscale. La décision du Conseil d’État du 8 décembre 2023 porte sur une extension doctrinale. La CJIP CACIB signée le 5 et validée le 8 septembre 2025 concerne la personne morale et ne vaut pas condamnation.</desc>
<rect id="cumcum02-fr-tracks-m-frame" x="0" y="0" width="420" height="1060" rx="8" fill="var(--color-ink)"/>
<text data-panel="cumcum02-fr-tracks-m-frame" x="20" y="30" fill="var(--color-signal)" font-family="l0g CumCum" font-size="17" font-weight="700" text-anchor="start">l0g / CUM-CUM 02 / 04</text>
<text data-panel="cumcum02-fr-tracks-m-frame" x="20" y="69" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">Trois actes, trois objets</text>
<text data-panel="cumcum02-fr-tracks-m-frame" x="20" y="97" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">juridiques</text>
<text data-panel="cumcum02-fr-tracks-m-frame" x="20" y="136" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Comparer la portée avant les dates</text>
<rect id="cumcum02-fr-tracks-m-card-act-0" x="20" y="170" width="380" height="239" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="cumcum02-fr-tracks-m-card-act-0" x="34" y="197" fill="var(--color-signal)" font-family="l0g CumCum" font-size="17" font-weight="700" text-anchor="start">FISC</text>
<text data-panel="cumcum02-fr-tracks-m-card-act-0" x="34" y="233" fill="var(--color-paper)" font-family="l0g CumCum" font-size="23" font-weight="700" text-anchor="start">02.04.2021</text>
<text data-panel="cumcum02-fr-tracks-m-card-act-0" x="34" y="261" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">CACIB</text>
<text data-panel="cumcum02-fr-tracks-m-card-act-0" x="34" y="291" fill="var(--color-paper)" font-family="l0g CumCum" font-size="21" font-weight="700" text-anchor="start">Transaction fiscale</text>
<text data-panel="cumcum02-fr-tracks-m-card-act-0" x="34" y="319" fill="var(--color-paper)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Périmètre fiscal réglé ; autres années ou</text>
<text data-panel="cumcum02-fr-tracks-m-card-act-0" x="34" y="341" fill="var(--color-paper)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">instruments examinables.</text>
<text data-panel="cumcum02-fr-tracks-m-card-act-0" x="34" y="395" fill="var(--color-signal)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">S09, §14, 32</text>
<rect id="cumcum02-fr-tracks-m-card-act-1" x="20" y="425" width="380" height="239" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="cumcum02-fr-tracks-m-card-act-1" x="34" y="452" fill="var(--color-accent)" font-family="l0g CumCum" font-size="17" font-weight="700" text-anchor="start">JUGE ADMINISTRATIF</text>
<text data-panel="cumcum02-fr-tracks-m-card-act-1" x="34" y="488" fill="var(--color-paper)" font-family="l0g CumCum" font-size="23" font-weight="700" text-anchor="start">08.12.2023</text>
<text data-panel="cumcum02-fr-tracks-m-card-act-1" x="34" y="516" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">FBF / doctrine</text>
<text data-panel="cumcum02-fr-tracks-m-card-act-1" x="34" y="546" fill="var(--color-paper)" font-family="l0g CumCum" font-size="21" font-weight="700" text-anchor="start">Décision n 472587</text>
<text data-panel="cumcum02-fr-tracks-m-card-act-1" x="34" y="574" fill="var(--color-paper)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Extension annulée ; article 119 bis A et</text>
<text data-panel="cumcum02-fr-tracks-m-card-act-1" x="34" y="596" fill="var(--color-paper)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">abus de droit réservés.</text>
<text data-panel="cumcum02-fr-tracks-m-card-act-1" x="34" y="650" fill="var(--color-accent)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">S11, points 3–8</text>
<rect id="cumcum02-fr-tracks-m-card-act-2" x="20" y="680" width="380" height="239" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="cumcum02-fr-tracks-m-card-act-2" x="34" y="707" fill="var(--color-amber)" font-family="l0g CumCum" font-size="17" font-weight="700" text-anchor="start">JUSTICE PÉNALE</text>
<text data-panel="cumcum02-fr-tracks-m-card-act-2" x="34" y="743" fill="var(--color-paper)" font-family="l0g CumCum" font-size="23" font-weight="700" text-anchor="start">05 / 08.09.2025</text>
<text data-panel="cumcum02-fr-tracks-m-card-act-2" x="34" y="771" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">CACIB</text>
<text data-panel="cumcum02-fr-tracks-m-card-act-2" x="34" y="801" fill="var(--color-paper)" font-family="l0g CumCum" font-size="21" font-weight="700" text-anchor="start">Signature / validation</text>
<text data-panel="cumcum02-fr-tracks-m-card-act-2" x="34" y="829" fill="var(--color-paper)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Personne morale signataire ; validation</text>
<text data-panel="cumcum02-fr-tracks-m-card-act-2" x="34" y="851" fill="var(--color-paper)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">sans culpabilité, tiers hors règlement.</text>
<text data-panel="cumcum02-fr-tracks-m-card-act-2" x="34" y="905" fill="var(--color-amber)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">S09, §60–61 ; S12</text>
<text data-panel="cumcum02-fr-tracks-m-frame" x="20" y="958" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Des actes différents peuvent coexister</text>
<text data-panel="cumcum02-fr-tracks-m-frame" x="20" y="981" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">dans l’histoire d’une même affaire.</text>
<text data-panel="cumcum02-fr-tracks-m-frame" x="20" y="1004" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Sélection documentaire, sans échelle</text>
<text data-panel="cumcum02-fr-tracks-m-frame" x="20" y="1027" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">de montant. Sources : S09, S11, S12.</text>
</svg>
