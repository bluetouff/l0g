<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cumcum02-en-alerts-m-title cumcum02-en-alerts-m-desc" viewBox="0 0 420 990" style="width:100%;height:auto" class="l0g-cumcum02-svg">
<title id="cumcum02-en-alerts-m-title">Warnings preceded the public revelations</title><desc id="cumcum02-en-alerts-m-desc">Four milestones: tax-related findings shared in 2009; regular exchanges and proposed reassessments in 2017; CumEx Files publication on 18 October 2018; targeted assistance in February 2019. The 2009 information is broadly tax-related. Reference-document dates are shown separately.</desc>
<rect id="cumcum02-en-alerts-m-frame" x="0" y="0" width="420" height="990" rx="8" fill="var(--color-ink)"/>
<text data-panel="cumcum02-en-alerts-m-frame" x="20" y="30" fill="var(--color-signal)" font-family="l0g CumCum" font-size="17" font-weight="700" text-anchor="start">l0g / CUM-CUM 02 / 01</text>
<text data-panel="cumcum02-en-alerts-m-frame" x="20" y="69" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">Warnings before the</text>
<text data-panel="cumcum02-en-alerts-m-frame" x="20" y="97" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">revelations</text>
<text data-panel="cumcum02-en-alerts-m-frame" x="20" y="136" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Event and reference dates differ</text>
<rect id="cumcum02-en-alerts-m-card-event-0" x="60" y="176" width="340" height="151" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="cumcum02-en-alerts-m-card-event-0" x="74" y="202" fill="var(--color-signal)" font-family="l0g CumCum" font-size="20" font-weight="700" text-anchor="start">2009</text>
<text data-panel="cumcum02-en-alerts-m-frame" x="20" y="202" fill="var(--color-muted)" font-family="l0g CumCum" font-size="20" font-weight="700" text-anchor="start">01</text>
<text data-panel="cumcum02-en-alerts-m-card-event-0" x="74" y="230" fill="var(--color-paper)" font-family="l0g CumCum" font-size="19" font-weight="700" text-anchor="start">Tax-related findings</text>
<text data-panel="cumcum02-en-alerts-m-card-event-0" x="74" y="256" fill="var(--color-paper)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">AMF → tax authority: surveillance</text>
<text data-panel="cumcum02-en-alerts-m-card-event-0" x="74" y="278" fill="var(--color-paper)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">findings.</text>
<text data-panel="cumcum02-en-alerts-m-card-event-0" x="74" y="310" fill="var(--color-signal)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">ESMA 2020 [S01]</text>
<rect id="cumcum02-en-alerts-m-card-event-1" x="60" y="345" width="340" height="151" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="cumcum02-en-alerts-m-card-event-1" x="74" y="371" fill="var(--color-signal)" font-family="l0g CumCum" font-size="20" font-weight="700" text-anchor="start">2017</text>
<text data-panel="cumcum02-en-alerts-m-frame" x="20" y="371" fill="var(--color-muted)" font-family="l0g CumCum" font-size="20" font-weight="700" text-anchor="start">02</text>
<text data-panel="cumcum02-en-alerts-m-card-event-1" x="74" y="399" fill="var(--color-paper)" font-family="l0g CumCum" font-size="19" font-weight="700" text-anchor="start">Exchanges and audits</text>
<text data-panel="cumcum02-en-alerts-m-card-event-1" x="74" y="425" fill="var(--color-paper)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">May: regular exchanges. From</text>
<text data-panel="cumcum02-en-alerts-m-card-event-1" x="74" y="447" fill="var(--color-paper)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">2017: cum-cum reassessments.</text>
<text data-panel="cumcum02-en-alerts-m-card-event-1" x="74" y="479" fill="var(--color-signal)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">ESMA; Senate [S01, S03]</text>
<rect id="cumcum02-en-alerts-m-card-event-2" x="60" y="514" width="340" height="151" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="cumcum02-en-alerts-m-card-event-2" x="74" y="540" fill="var(--color-amber)" font-family="l0g CumCum" font-size="20" font-weight="700" text-anchor="start">18 OCT 2018</text>
