<text data-panel="cumcum02-en-alerts-m-card-event-2" x="74" y="568" fill="var(--color-paper)" font-family="l0g CumCum" font-size="19" font-weight="700" text-anchor="start">CumEx Files</text>
<text data-panel="cumcum02-en-alerts-m-card-event-2" x="74" y="594" fill="var(--color-paper)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Cross-border investigation reaches</text>
<text data-panel="cumcum02-en-alerts-m-card-event-2" x="74" y="616" fill="var(--color-paper)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">a wide audience.</text>
<text data-panel="cumcum02-en-alerts-m-card-event-2" x="74" y="648" fill="var(--color-amber)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">CORRECTIV 2018 [S04]</text>
<rect id="cumcum02-en-alerts-m-card-event-3" x="60" y="683" width="340" height="151" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="cumcum02-en-alerts-m-card-event-3" x="74" y="709" fill="var(--color-signal)" font-family="l0g CumCum" font-size="20" font-weight="700" text-anchor="start">FEB 2019</text>
<text data-panel="cumcum02-en-alerts-m-frame" x="20" y="709" fill="var(--color-muted)" font-family="l0g CumCum" font-size="20" font-weight="700" text-anchor="start">04</text>
<text data-panel="cumcum02-en-alerts-m-card-event-3" x="74" y="737" fill="var(--color-paper)" font-family="l0g CumCum" font-size="19" font-weight="700" text-anchor="start">Data and expertise</text>
<text data-panel="cumcum02-en-alerts-m-card-event-3" x="74" y="763" fill="var(--color-paper)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">AMF: Euroclear data and leads on</text>
<text data-panel="cumcum02-en-alerts-m-card-event-3" x="74" y="785" fill="var(--color-paper)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">trading desks.</text>
<text data-panel="cumcum02-en-alerts-m-card-event-3" x="74" y="817" fill="var(--color-signal)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">ESMA 2020 [S01]</text>
<text data-panel="cumcum02-en-alerts-m-frame" x="20" y="876" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Broad tax warnings, reassessments and</text>
<text data-panel="cumcum02-en-alerts-m-frame" x="20" y="899" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">public revelations have distinct scopes.</text>
<text data-panel="cumcum02-en-alerts-m-frame" x="20" y="922" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">2009–2019 milestones; free spacing.</text>
<text data-panel="cumcum02-en-alerts-m-frame" x="20" y="945" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">References: ESMA 2020,</text>
<text data-panel="cumcum02-en-alerts-m-frame" x="20" y="968" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Senate 2022, CORRECTIV 2018.</text>
