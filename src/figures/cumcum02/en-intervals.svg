<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cumcum02-en-intervals-d-title cumcum02-en-intervals-d-desc" viewBox="0 0 1000 650" style="width:100%;height:auto" class="l0g-cumcum02-svg">
<title id="cumcum02-en-intervals-d-title">Four dates, three documented intervals</title><desc id="cumcum02-en-intervals-d-desc">From the complaint on 29 October 2018 to the requisition on 17 September 2020: 689 days. To the DVNI letter on 25 November 2021: 434 days. To the SEJF assignment on 16 December 2021: 21 days. Total: 1,144 days. These are calendar intervals, not demonstrated days of inactivity.</desc>
<rect id="cumcum02-en-intervals-d-frame" x="0" y="0" width="1000" height="650" rx="8" fill="var(--color-ink)"/>
<text data-panel="cumcum02-en-intervals-d-frame" x="24" y="30" fill="var(--color-signal)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">l0g / CUM-CUM 02 / 03</text>
<text data-panel="cumcum02-en-intervals-d-frame" x="24" y="77" fill="var(--color-paper)" font-family="l0g CumCum" font-size="30" font-weight="700" text-anchor="start">Intervals between four recorded acts</text>
<text data-panel="cumcum02-en-intervals-d-frame" x="24" y="118" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Published gaps, without measuring inactivity. CACIB CJIP.</text>
<text data-panel="cumcum02-en-intervals-d-frame" x="24" y="208" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">Complaint → requisition</text>
<text data-panel="cumcum02-en-intervals-d-frame" x="24" y="243" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">29.10.2018 → 17.09.2020</text>
<rect id="cumcum02-en-intervals-d-bar-0" x="412" y="223" width="482.3" height="35" rx="8" fill="var(--color-amber)"/>
<text data-panel="cumcum02-en-intervals-d-frame" x="906.3" y="248" fill="var(--color-amber)" font-family="l0g CumCum" font-size="26" font-weight="700" text-anchor="start">689 d</text>
<text data-panel="cumcum02-en-intervals-d-frame" x="24" y="326" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">Requisition → DVNI letter</text>
<text data-panel="cumcum02-en-intervals-d-frame" x="24" y="361" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">17.09.2020 → 25.11.2021</text>
<rect id="cumcum02-en-intervals-d-bar-1" x="412" y="341" width="303.8" height="35" rx="8" fill="var(--color-signal)"/>
<text data-panel="cumcum02-en-intervals-d-frame" x="727.8" y="366" fill="var(--color-signal)" font-family="l0g CumCum" font-size="26" font-weight="700" text-anchor="start">434 d</text>
<text data-panel="cumcum02-en-intervals-d-frame" x="24" y="444" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">DVNI letter → SEJF assignment</text>
<text data-panel="cumcum02-en-intervals-d-frame" x="24" y="479" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">25.11.2021 → 16.12.2021</text>
<rect id="cumcum02-en-intervals-d-bar-2" x="412" y="459" width="14.7" height="35" rx="8" fill="var(--color-muted)"/>
<text data-panel="cumcum02-en-intervals-d-frame" x="438.7" y="484" fill="var(--color-muted)" font-family="l0g CumCum" font-size="26" font-weight="700" text-anchor="start">21 d</text>
<text data-panel="cumcum02-en-intervals-d-frame" x="412.0" y="553" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="middle">0</text>
<text data-panel="cumcum02-en-intervals-d-frame" x="552.0" y="553" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="middle">200</text>
<text data-panel="cumcum02-en-intervals-d-frame" x="692.0" y="553" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="middle">400</text>
<text data-panel="cumcum02-en-intervals-d-frame" x="832.0" y="553" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="middle">600</text>
<text data-panel="cumcum02-en-intervals-d-frame" x="902.0" y="553" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="middle">700</text>
<text data-panel="cumcum02-en-intervals-d-frame" x="24" y="553" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">days</text>
<rect id="cumcum02-en-intervals-d-card-total" x="24" y="566" width="952" height="55" rx="8" fill="var(--color-surface-2)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="cumcum02-en-intervals-d-card-total" x="44" y="602" fill="var(--color-amber)" font-family="l0g CumCum" font-size="28" font-weight="700" text-anchor="start">1,144 days</text>
<text data-panel="cumcum02-en-intervals-d-card-total" x="290" y="602" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Complaint → investigator assignment.</text>
<text data-panel="cumcum02-en-intervals-d-frame" x="24" y="640" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Gaps between published acts; l0g calculation. S09, §7, 11–16.</text>
</svg>
