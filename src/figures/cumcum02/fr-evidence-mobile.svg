<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cumcum02-fr-evidence-m-title cumcum02-fr-evidence-m-desc" viewBox="0 0 420 1020" style="width:100%;height:auto" class="l0g-cumcum02-svg">
<title id="cumcum02-fr-evidence-m-title">Les pièces à relier pour établir les faits</title><desc id="cumcum02-fr-evidence-m-desc">Les données de marché, les identités fiscales, les contrats et les flux doivent être rapprochés. Leur examen peut alimenter une procédure fiscale et une enquête pénale, aux objets distincts.</desc>
