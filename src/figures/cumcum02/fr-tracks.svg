<text data-panel="cumcum02-fr-tracks-d-card-act-0" x="38" y="263" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">CACIB</text>
<text data-panel="cumcum02-fr-tracks-d-card-act-0" x="38" y="308" fill="var(--color-paper)" font-family="l0g CumCum" font-size="24" font-weight="700" text-anchor="start">Transaction fiscale</text>
