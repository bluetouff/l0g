<text data-panel="cumcum02-fr-tracks-d-frame" x="24" y="77" fill="var(--color-paper)" font-family="l0g CumCum" font-size="30" font-weight="700" text-anchor="start">Trois actes, trois objets juridiques</text>
<text data-panel="cumcum02-fr-tracks-d-frame" x="24" y="119" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Comparer la portée avant les dates</text>
