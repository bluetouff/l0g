<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cumcum02-fr-tracks-d-title cumcum02-fr-tracks-d-desc" viewBox="0 0 1000 650" style="width:100%;height:auto" class="l0g-cumcum02-svg">
<title id="cumcum02-fr-tracks-d-title">Trois actes, trois questions différentes</title><desc id="cumcum02-fr-tracks-d-desc">La transaction fiscale CACIB du 2 avril 2021 traite une question fiscale. La décision du Conseil d’État du 8 décembre 2023 porte sur une extension doctrinale. La CJIP CACIB signée le 5 et validée le 8 septembre 2025 concerne la personne morale et ne vaut pas condamnation.</desc>
