<title id="cumcum02-fr-evidence-d-title">Les pièces à relier pour établir les faits</title><desc id="cumcum02-fr-evidence-d-desc">Les données de marché, les identités fiscales, les contrats et les flux doivent être rapprochés. Leur examen peut alimenter une procédure fiscale et une enquête pénale, aux objets distincts.</desc>
