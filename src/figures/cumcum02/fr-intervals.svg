<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cumcum02-fr-intervals-d-title cumcum02-fr-intervals-d-desc" viewBox="0 0 1000 650" style="width:100%;height:auto" class="l0g-cumcum02-svg">
<title id="cumcum02-fr-intervals-d-title">Quatre dates, trois intervalles documentés</title><desc id="cumcum02-fr-intervals-d-desc">Entre la plainte du 29 octobre 2018 et la réquisition du 17 septembre 2020 : 689 jours. Jusqu’à la lettre DVNI du 25 novembre 2021 : 434 jours. Jusqu’à la saisine du SEJF le 16 décembre 2021 : 21 jours. Total : 1 144 jours. Ce sont des écarts calendaires et non des jours d’inactivité démontrée.</desc>
<rect id="cumcum02-fr-intervals-d-frame" x="0" y="0" width="1000" height="650" rx="8" fill="var(--color-ink)"/>
<text data-panel="cumcum02-fr-intervals-d-frame" x="24" y="30" fill="var(--color-signal)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">l0g / CUM-CUM 02 / 03</text>
<text data-panel="cumcum02-fr-intervals-d-frame" x="24" y="77" fill="var(--color-paper)" font-family="l0g CumCum" font-size="30" font-weight="700" text-anchor="start">Les intervalles entre quatre actes</text>
<text data-panel="cumcum02-fr-intervals-d-frame" x="24" y="118" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Écarts publiés, sans mesure d’inactivité. CJIP CACIB.</text>
<text data-panel="cumcum02-fr-intervals-d-frame" x="24" y="208" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">Plainte → réquisition</text>
<text data-panel="cumcum02-fr-intervals-d-frame" x="24" y="243" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">29.10.2018 → 17.09.2020</text>
<rect id="cumcum02-fr-intervals-d-bar-0" x="412" y="223" width="482.3" height="35" rx="8" fill="var(--color-amber)"/>
<text data-panel="cumcum02-fr-intervals-d-frame" x="906.3" y="248" fill="var(--color-amber)" font-family="l0g CumCum" font-size="26" font-weight="700" text-anchor="start">689 j</text>
<text data-panel="cumcum02-fr-intervals-d-frame" x="24" y="326" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">Réquisition → lettre DVNI</text>
<text data-panel="cumcum02-fr-intervals-d-frame" x="24" y="361" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">17.09.2020 → 25.11.2021</text>
<rect id="cumcum02-fr-intervals-d-bar-1" x="412" y="341" width="303.8" height="35" rx="8" fill="var(--color-signal)"/>
<text data-panel="cumcum02-fr-intervals-d-frame" x="727.8" y="366" fill="var(--color-signal)" font-family="l0g CumCum" font-size="26" font-weight="700" text-anchor="start">434 j</text>
<text data-panel="cumcum02-fr-intervals-d-frame" x="24" y="444" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">Lettre DVNI → saisine SEJF</text>
<text data-panel="cumcum02-fr-intervals-d-frame" x="24" y="479" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">25.11.2021 → 16.12.2021</text>
<rect id="cumcum02-fr-intervals-d-bar-2" x="412" y="459" width="14.7" height="35" rx="8" fill="var(--color-muted)"/>
