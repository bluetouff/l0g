<text data-panel="cumcum02-fr-intervals-d-frame" x="24" y="553" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">jours</text>
<rect id="cumcum02-fr-intervals-d-card-total" x="24" y="566" width="952" height="55" rx="8" fill="var(--color-surface-2)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="cumcum02-fr-intervals-d-card-total" x="44" y="602" fill="var(--color-amber)" font-family="l0g CumCum" font-size="28" font-weight="700" text-anchor="start">1 144 jours</text>
<text data-panel="cumcum02-fr-intervals-d-card-total" x="290" y="602" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Plainte → saisine des enquêteurs.</text>
<text data-panel="cumcum02-fr-intervals-d-frame" x="24" y="640" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Calcul l0g sur les actes publiés. S09, §7, 11–16.</text>
