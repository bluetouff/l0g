<text data-panel="cumcum02-fr-intervals-d-frame" x="412.0" y="553" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="middle">0</text>
<text data-panel="cumcum02-fr-intervals-d-frame" x="552.0" y="553" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="middle">200</text>
<text data-panel="cumcum02-fr-intervals-d-frame" x="692.0" y="553" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="middle">400</text>
<text data-panel="cumcum02-fr-intervals-d-frame" x="832.0" y="553" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="middle">600</text>
