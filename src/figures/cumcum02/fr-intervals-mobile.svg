<text data-panel="cumcum02-fr-intervals-m-frame" x="20" y="368" fill="var(--color-paper)" font-family="l0g CumCum" font-size="19" font-weight="700" text-anchor="start">Réquisition → lettre DVNI</text>
<text data-panel="cumcum02-fr-intervals-m-frame" x="20" y="398" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">17.09.2020 → 25.11.2021</text>
<rect id="cumcum02-fr-intervals-m-bar-1" x="20" y="419" width="198.4" height="30" rx="8" fill="var(--color-signal)"/>
<text data-panel="cumcum02-fr-intervals-m-frame" x="230.4" y="444" fill="var(--color-signal)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">434 j</text>
<text data-panel="cumcum02-fr-intervals-m-frame" x="20" y="482" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">0 à 700 jours ; même échelle</text>
<text data-panel="cumcum02-fr-intervals-m-frame" x="20" y="541" fill="var(--color-paper)" font-family="l0g CumCum" font-size="19" font-weight="700" text-anchor="start">Lettre DVNI → saisine SEJF</text>
