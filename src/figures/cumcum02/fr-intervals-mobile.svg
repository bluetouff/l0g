<text data-panel="cumcum02-fr-intervals-m-frame" x="20" y="881" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">d’une inactivité démontrée.</text>
<text data-panel="cumcum02-fr-intervals-m-frame" x="20" y="904" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">CJIP CACIB, §7, 11–16 [S09] ; calcul l0g.</text>
