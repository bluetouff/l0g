<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cumcum02-fr-intervals-m-title cumcum02-fr-intervals-m-desc" viewBox="0 0 420 920" style="width:100%;height:auto" class="l0g-cumcum02-svg">
<title id="cumcum02-fr-intervals-m-title">Quatre dates, trois intervalles documentés</title><desc id="cumcum02-fr-intervals-m-desc">Entre la plainte du 29 octobre 2018 et la réquisition du 17 septembre 2020 : 689 jours. Jusqu’à la lettre DVNI du 25 novembre 2021 : 434 jours. Jusqu’à la saisine du SEJF le 16 décembre 2021 : 21 jours. Total : 1 144 jours. Ce sont des écarts calendaires et non des jours d’inactivité démontrée.</desc>
<rect id="cumcum02-fr-intervals-m-frame" x="0" y="0" width="420" height="920" rx="8" fill="var(--color-ink)"/>
<text data-panel="cumcum02-fr-intervals-m-frame" x="20" y="30" fill="var(--color-signal)" font-family="l0g CumCum" font-size="17" font-weight="700" text-anchor="start">l0g / CUM-CUM 02 / 03</text>
<text data-panel="cumcum02-fr-intervals-m-frame" x="20" y="69" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">Les intervalles entre quatre</text>
<text data-panel="cumcum02-fr-intervals-m-frame" x="20" y="97" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">actes</text>
<text data-panel="cumcum02-fr-intervals-m-frame" x="20" y="136" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Écarts publiés, sans mesure d’inactivité.</text>
<text data-panel="cumcum02-fr-intervals-m-frame" x="20" y="160" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">CJIP CACIB.</text>
<text data-panel="cumcum02-fr-intervals-m-frame" x="20" y="195" fill="var(--color-paper)" font-family="l0g CumCum" font-size="19" font-weight="700" text-anchor="start">Plainte → réquisition</text>
<text data-panel="cumcum02-fr-intervals-m-frame" x="20" y="225" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">29.10.2018 → 17.09.2020</text>
<rect id="cumcum02-fr-intervals-m-bar-0" x="20" y="246" width="314.971429" height="30" rx="8" fill="var(--color-amber)"/>
<text data-panel="cumcum02-fr-intervals-m-frame" x="346.971429" y="271" fill="var(--color-amber)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">689 j</text>
