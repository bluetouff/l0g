<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cumcum02-fr-alerts-d-title cumcum02-fr-alerts-d-desc" viewBox="0 0 1000 650" style="width:100%;height:auto" class="l0g-cumcum02-svg">
<title id="cumcum02-fr-alerts-d-title">Les alertes précèdent les révélations</title><desc id="cumcum02-fr-alerts-d-desc">Quatre repères : informations fiscales transmises en 2009, échanges et rectifications en 2017, publication des CumEx Files le 18 octobre 2018 et assistance ciblée en février 2019. Les informations de 2009 ont une portée fiscale large. Dates des sources consultées indiquées séparément.</desc>
