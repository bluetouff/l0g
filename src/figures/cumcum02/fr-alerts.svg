<text data-panel="cumcum02-fr-alerts-d-frame" x="24" y="77" fill="var(--color-paper)" font-family="l0g CumCum" font-size="30" font-weight="700" text-anchor="start">Des alertes avant les révélations</text>
<text data-panel="cumcum02-fr-alerts-d-frame" x="24" y="119" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Événement et source : dates distinctes</text>
