<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cumcum02-en-tracks-m-title cumcum02-en-tracks-m-desc" viewBox="0 0 420 1060" style="width:100%;height:auto" class="l0g-cumcum02-svg">
<title id="cumcum02-en-tracks-m-title">Three acts answering different questions</title><desc id="cumcum02-en-tracks-m-desc">CACIB’s tax settlement of 2 April 2021 addresses a tax issue. The Conseil d’État ruling of 8 December 2023 concerns an expanded administrative interpretation. CACIB’s agreement signed on 5 and approved on 8 September 2025 concerns the legal entity and is not a conviction.</desc>
<rect id="cumcum02-en-tracks-m-frame" x="0" y="0" width="420" height="1060" rx="8" fill="var(--color-ink)"/>
<text data-panel="cumcum02-en-tracks-m-frame" x="20" y="30" fill="var(--color-signal)" font-family="l0g CumCum" font-size="17" font-weight="700" text-anchor="start">l0g / CUM-CUM 02 / 04</text>
<text data-panel="cumcum02-en-tracks-m-frame" x="20" y="69" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">Three acts, three legal</text>
<text data-panel="cumcum02-en-tracks-m-frame" x="20" y="97" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">purposes</text>
<text data-panel="cumcum02-en-tracks-m-frame" x="20" y="136" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Compare scope before dates</text>
<rect id="cumcum02-en-tracks-m-card-act-0" x="20" y="170" width="380" height="239" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="cumcum02-en-tracks-m-card-act-0" x="34" y="197" fill="var(--color-signal)" font-family="l0g CumCum" font-size="17" font-weight="700" text-anchor="start">TAX</text>
<text data-panel="cumcum02-en-tracks-m-card-act-0" x="34" y="233" fill="var(--color-paper)" font-family="l0g CumCum" font-size="23" font-weight="700" text-anchor="start">02.04.2021</text>
<text data-panel="cumcum02-en-tracks-m-card-act-0" x="34" y="261" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">CACIB</text>
<text data-panel="cumcum02-en-tracks-m-card-act-0" x="34" y="291" fill="var(--color-paper)" font-family="l0g CumCum" font-size="21" font-weight="700" text-anchor="start">Tax settlement</text>
<text data-panel="cumcum02-en-tracks-m-card-act-0" x="34" y="319" fill="var(--color-paper)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Defined tax matter settled; other years</text>
<text data-panel="cumcum02-en-tracks-m-card-act-0" x="34" y="341" fill="var(--color-paper)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">or instruments may be examined.</text>
<text data-panel="cumcum02-en-tracks-m-card-act-0" x="34" y="395" fill="var(--color-signal)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">S09, §14, 32</text>
<rect id="cumcum02-en-tracks-m-card-act-1" x="20" y="425" width="380" height="239" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="cumcum02-en-tracks-m-card-act-1" x="34" y="452" fill="var(--color-accent)" font-family="l0g CumCum" font-size="17" font-weight="700" text-anchor="start">ADMIN. COURT</text>
<text data-panel="cumcum02-en-tracks-m-card-act-1" x="34" y="488" fill="var(--color-paper)" font-family="l0g CumCum" font-size="23" font-weight="700" text-anchor="start">08.12.2023</text>
<text data-panel="cumcum02-en-tracks-m-card-act-1" x="34" y="516" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">FBF / tax guidance</text>
<text data-panel="cumcum02-en-tracks-m-card-act-1" x="34" y="546" fill="var(--color-paper)" font-family="l0g CumCum" font-size="21" font-weight="700" text-anchor="start">Ruling no.472587</text>
<text data-panel="cumcum02-en-tracks-m-card-act-1" x="34" y="574" fill="var(--color-paper)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Extension quashed; article 119 bis A and</text>
<text data-panel="cumcum02-en-tracks-m-card-act-1" x="34" y="596" fill="var(--color-paper)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">abuse-of-law routes preserved.</text>
<text data-panel="cumcum02-en-tracks-m-card-act-1" x="34" y="650" fill="var(--color-accent)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">S11, points 3–8</text>
<rect id="cumcum02-en-tracks-m-card-act-2" x="20" y="680" width="380" height="239" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="cumcum02-en-tracks-m-card-act-2" x="34" y="707" fill="var(--color-amber)" font-family="l0g CumCum" font-size="17" font-weight="700" text-anchor="start">CRIMINAL JUSTICE</text>
<text data-panel="cumcum02-en-tracks-m-card-act-2" x="34" y="743" fill="var(--color-paper)" font-family="l0g CumCum" font-size="23" font-weight="700" text-anchor="start">05 / 08.09.2025</text>
<text data-panel="cumcum02-en-tracks-m-card-act-2" x="34" y="771" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">CACIB</text>
<text data-panel="cumcum02-en-tracks-m-card-act-2" x="34" y="801" fill="var(--color-paper)" font-family="l0g CumCum" font-size="21" font-weight="700" text-anchor="start">Signature / court approval</text>
<text data-panel="cumcum02-en-tracks-m-card-act-2" x="34" y="829" fill="var(--color-paper)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Signing company; approval without a</text>
<text data-panel="cumcum02-en-tracks-m-card-act-2" x="34" y="851" fill="var(--color-paper)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">declaration of guilt, third parties outside.</text>
<text data-panel="cumcum02-en-tracks-m-card-act-2" x="34" y="905" fill="var(--color-amber)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">S09, §60–61; S12</text>
<text data-panel="cumcum02-en-tracks-m-frame" x="20" y="958" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Different kinds of act can coexist</text>
<text data-panel="cumcum02-en-tracks-m-frame" x="20" y="981" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">within the same broader affair.</text>
<text data-panel="cumcum02-en-tracks-m-frame" x="20" y="1004" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Selected records, without a monetary</text>
<text data-panel="cumcum02-en-tracks-m-frame" x="20" y="1027" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">scale. Sources: S09, S11, S12.</text>
</svg>
