<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cumcum02-en-tracks-d-title cumcum02-en-tracks-d-desc" viewBox="0 0 1000 650" style="width:100%;height:auto" class="l0g-cumcum02-svg">
<title id="cumcum02-en-tracks-d-title">Three acts answering different questions</title><desc id="cumcum02-en-tracks-d-desc">CACIB’s tax settlement of 2 April 2021 addresses a tax issue. The Conseil d’État ruling of 8 December 2023 concerns an expanded administrative interpretation. CACIB’s agreement signed on 5 and approved on 8 September 2025 concerns the legal entity and is not a conviction.</desc>
<rect id="cumcum02-en-tracks-d-frame" x="0" y="0" width="1000" height="650" rx="8" fill="var(--color-ink)"/>
<text data-panel="cumcum02-en-tracks-d-frame" x="24" y="30" fill="var(--color-signal)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">l0g / CUM-CUM 02 / 04</text>
<text data-panel="cumcum02-en-tracks-d-frame" x="24" y="77" fill="var(--color-paper)" font-family="l0g CumCum" font-size="30" font-weight="700" text-anchor="start">Three acts, three legal purposes</text>
<text data-panel="cumcum02-en-tracks-d-frame" x="24" y="119" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Compare scope before dates</text>
<rect id="cumcum02-en-tracks-d-card-act-0" x="24" y="172" width="300" height="400" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="cumcum02-en-tracks-d-card-act-0" x="38" y="199" fill="var(--color-signal)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">TAX</text>
<text data-panel="cumcum02-en-tracks-d-card-act-0" x="38" y="235" fill="var(--color-paper)" font-family="l0g CumCum" font-size="27" font-weight="700" text-anchor="start">02.04.2021</text>
<text data-panel="cumcum02-en-tracks-d-card-act-0" x="38" y="263" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">CACIB</text>
<text data-panel="cumcum02-en-tracks-d-card-act-0" x="38" y="308" fill="var(--color-paper)" font-family="l0g CumCum" font-size="24" font-weight="700" text-anchor="start">Tax settlement</text>
<text data-panel="cumcum02-en-tracks-d-card-act-0" x="38" y="359" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Settlement of a defined</text>
<text data-panel="cumcum02-en-tracks-d-card-act-0" x="38" y="388" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">tax matter.</text>
<text data-panel="cumcum02-en-tracks-d-card-act-0" x="38" y="451" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Other years or</text>
<text data-panel="cumcum02-en-tracks-d-card-act-0" x="38" y="478" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">instruments may be</text>
<text data-panel="cumcum02-en-tracks-d-card-act-0" x="38" y="505" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">examined.</text>
<text data-panel="cumcum02-en-tracks-d-card-act-0" x="38" y="554" fill="var(--color-signal)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">S09, §14, 32</text>
<rect id="cumcum02-en-tracks-d-card-act-1" x="350" y="172" width="300" height="400" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="cumcum02-en-tracks-d-card-act-1" x="364" y="199" fill="var(--color-accent)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">ADMIN. COURT</text>
<text data-panel="cumcum02-en-tracks-d-card-act-1" x="364" y="235" fill="var(--color-paper)" font-family="l0g CumCum" font-size="27" font-weight="700" text-anchor="start">08.12.2023</text>
<text data-panel="cumcum02-en-tracks-d-card-act-1" x="364" y="263" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">FBF / tax guidance</text>
<text data-panel="cumcum02-en-tracks-d-card-act-1" x="364" y="308" fill="var(--color-paper)" font-family="l0g CumCum" font-size="24" font-weight="700" text-anchor="start">Ruling no.472587</text>
<text data-panel="cumcum02-en-tracks-d-card-act-1" x="364" y="359" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Challenged guidance</text>
<text data-panel="cumcum02-en-tracks-d-card-act-1" x="364" y="388" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">extension quashed.</text>
<text data-panel="cumcum02-en-tracks-d-card-act-1" x="364" y="451" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Article 119 bis A and</text>
<text data-panel="cumcum02-en-tracks-d-card-act-1" x="364" y="478" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">abuse-of-law routes</text>
<text data-panel="cumcum02-en-tracks-d-card-act-1" x="364" y="505" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">preserved.</text>
<text data-panel="cumcum02-en-tracks-d-card-act-1" x="364" y="554" fill="var(--color-accent)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">S11, points 3–8</text>
<rect id="cumcum02-en-tracks-d-card-act-2" x="676" y="172" width="300" height="400" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="cumcum02-en-tracks-d-card-act-2" x="690" y="199" fill="var(--color-amber)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">CRIMINAL JUSTICE</text>
<text data-panel="cumcum02-en-tracks-d-card-act-2" x="690" y="235" fill="var(--color-paper)" font-family="l0g CumCum" font-size="27" font-weight="700" text-anchor="start">05 / 08.09.2025</text>
<text data-panel="cumcum02-en-tracks-d-card-act-2" x="690" y="263" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">CACIB</text>
<text data-panel="cumcum02-en-tracks-d-card-act-2" x="690" y="308" fill="var(--color-paper)" font-family="l0g CumCum" font-size="24" font-weight="700" text-anchor="start">Signature / court</text>
<text data-panel="cumcum02-en-tracks-d-card-act-2" x="690" y="337" fill="var(--color-paper)" font-family="l0g CumCum" font-size="24" font-weight="700" text-anchor="start">approval</text>
<text data-panel="cumcum02-en-tracks-d-card-act-2" x="690" y="359" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Agreement with the</text>
<text data-panel="cumcum02-en-tracks-d-card-act-2" x="690" y="388" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">signing legal entity.</text>
<text data-panel="cumcum02-en-tracks-d-card-act-2" x="690" y="451" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Approval without a</text>
<text data-panel="cumcum02-en-tracks-d-card-act-2" x="690" y="478" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">declaration of guilt;</text>
<text data-panel="cumcum02-en-tracks-d-card-act-2" x="690" y="505" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">third parties outside.</text>
<text data-panel="cumcum02-en-tracks-d-card-act-2" x="690" y="554" fill="var(--color-amber)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">S09, §60–61; S12</text>
<text data-panel="cumcum02-en-tracks-d-frame" x="24" y="594" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Different kinds of act can coexist within the same broader affair.</text>
<text data-panel="cumcum02-en-tracks-d-frame" x="24" y="624" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="400" text-anchor="start">Selected records; no monetary scale. Sources: S09, S11, S12.</text>
</svg>
