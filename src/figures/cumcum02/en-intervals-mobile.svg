<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cumcum02-en-intervals-m-title cumcum02-en-intervals-m-desc" viewBox="0 0 420 920" style="width:100%;height:auto" class="l0g-cumcum02-svg">
<title id="cumcum02-en-intervals-m-title">Four dates, three documented intervals</title><desc id="cumcum02-en-intervals-m-desc">From the complaint on 29 October 2018 to the requisition on 17 September 2020: 689 days. To the DVNI letter on 25 November 2021: 434 days. To the SEJF assignment on 16 December 2021: 21 days. Total: 1,144 days. These are calendar intervals, not demonstrated days of inactivity.</desc>
<rect id="cumcum02-en-intervals-m-frame" x="0" y="0" width="420" height="920" rx="8" fill="var(--color-ink)"/>
<text data-panel="cumcum02-en-intervals-m-frame" x="20" y="30" fill="var(--color-signal)" font-family="l0g CumCum" font-size="17" font-weight="700" text-anchor="start">l0g / CUM-CUM 02 / 03</text>
<text data-panel="cumcum02-en-intervals-m-frame" x="20" y="69" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">Intervals between four</text>
<text data-panel="cumcum02-en-intervals-m-frame" x="20" y="97" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">recorded acts</text>
<text data-panel="cumcum02-en-intervals-m-frame" x="20" y="136" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Published gaps, without measuring</text>
<text data-panel="cumcum02-en-intervals-m-frame" x="20" y="160" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">inactivity. CACIB CJIP.</text>
<text data-panel="cumcum02-en-intervals-m-frame" x="20" y="195" fill="var(--color-paper)" font-family="l0g CumCum" font-size="19" font-weight="700" text-anchor="start">Complaint → requisition</text>
<text data-panel="cumcum02-en-intervals-m-frame" x="20" y="225" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">29.10.2018 → 17.09.2020</text>
<rect id="cumcum02-en-intervals-m-bar-0" x="20" y="246" width="314.971429" height="30" rx="8" fill="var(--color-amber)"/>
<text data-panel="cumcum02-en-intervals-m-frame" x="346.971429" y="271" fill="var(--color-amber)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">689 d</text>
<text data-panel="cumcum02-en-intervals-m-frame" x="20" y="309" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">0–700 days; common scale</text>
<text data-panel="cumcum02-en-intervals-m-frame" x="20" y="368" fill="var(--color-paper)" font-family="l0g CumCum" font-size="19" font-weight="700" text-anchor="start">Requisition → DVNI letter</text>
<text data-panel="cumcum02-en-intervals-m-frame" x="20" y="398" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">17.09.2020 → 25.11.2021</text>
<rect id="cumcum02-en-intervals-m-bar-1" x="20" y="419" width="198.4" height="30" rx="8" fill="var(--color-signal)"/>
<text data-panel="cumcum02-en-intervals-m-frame" x="230.4" y="444" fill="var(--color-signal)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">434 d</text>
<text data-panel="cumcum02-en-intervals-m-frame" x="20" y="482" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">0–700 days; common scale</text>
<text data-panel="cumcum02-en-intervals-m-frame" x="20" y="541" fill="var(--color-paper)" font-family="l0g CumCum" font-size="19" font-weight="700" text-anchor="start">DVNI letter → SEJF assignment</text>
<text data-panel="cumcum02-en-intervals-m-frame" x="20" y="571" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">25.11.2021 → 16.12.2021</text>
<rect id="cumcum02-en-intervals-m-bar-2" x="20" y="592" width="9.6" height="30" rx="8" fill="var(--color-muted)"/>
<text data-panel="cumcum02-en-intervals-m-frame" x="41.6" y="617" fill="var(--color-muted)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">21 d</text>
<text data-panel="cumcum02-en-intervals-m-frame" x="20" y="655" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">0–700 days; common scale</text>
<rect id="cumcum02-en-intervals-m-card-total" x="20" y="726" width="380" height="93" rx="8" fill="var(--color-surface-2)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="cumcum02-en-intervals-m-card-total" x="36" y="762" fill="var(--color-amber)" font-family="l0g CumCum" font-size="28" font-weight="700" text-anchor="start">1,144 days</text>
<text data-panel="cumcum02-en-intervals-m-card-total" x="36" y="798" fill="var(--color-paper)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Complaint → investigator assignment.</text>
<text data-panel="cumcum02-en-intervals-m-frame" x="20" y="858" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Gaps between published acts, rather than</text>
<text data-panel="cumcum02-en-intervals-m-frame" x="20" y="881" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">a measure of proven inactivity.</text>
<text data-panel="cumcum02-en-intervals-m-frame" x="20" y="904" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">CACIB CJIP, §7, 11–16 [S09]; l0g calculation.</text>
