<title id="cumcum02-en-evidence-d-title">The records that must be connected</title><desc id="cumcum02-en-evidence-d-desc">Market data, tax identities, contracts and payments must be brought together. Their examination can support a tax procedure and a criminal investigation with different purposes.</desc>
