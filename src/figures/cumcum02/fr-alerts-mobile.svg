<text data-panel="cumcum02-fr-alerts-m-card-event-3" x="74" y="817" fill="var(--color-signal)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">ESMA 2020 [S01]</text>
<text data-panel="cumcum02-fr-alerts-m-frame" x="20" y="876" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Alerte fiscale générale, rectification et</text>
<text data-panel="cumcum02-fr-alerts-m-frame" x="20" y="899" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">révélation : des portées distinctes.</text>
<text data-panel="cumcum02-fr-alerts-m-frame" x="20" y="922" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Jalons 2009–2019 ; espacement libre.</text>
<text data-panel="cumcum02-fr-alerts-m-frame" x="20" y="945" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Sources consultées : ESMA 2020,</text>
<text data-panel="cumcum02-fr-alerts-m-frame" x="20" y="968" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Sénat 2022, CORRECTIV 2018.</text>
