<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cumcum02-fr-alerts-m-title cumcum02-fr-alerts-m-desc" viewBox="0 0 420 990" style="width:100%;height:auto" class="l0g-cumcum02-svg">
<title id="cumcum02-fr-alerts-m-title">Les alertes précèdent les révélations</title><desc id="cumcum02-fr-alerts-m-desc">Quatre repères : informations fiscales transmises en 2009, échanges et rectifications en 2017, publication des CumEx Files le 18 octobre 2018 et assistance ciblée en février 2019. Les informations de 2009 ont une portée fiscale large. Dates des sources consultées indiquées séparément.</desc>
<rect id="cumcum02-fr-alerts-m-frame" x="0" y="0" width="420" height="990" rx="8" fill="var(--color-ink)"/>
<text data-panel="cumcum02-fr-alerts-m-frame" x="20" y="30" fill="var(--color-signal)" font-family="l0g CumCum" font-size="17" font-weight="700" text-anchor="start">l0g / CUM-CUM 02 / 01</text>
<text data-panel="cumcum02-fr-alerts-m-frame" x="20" y="69" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">Des alertes avant les</text>
<text data-panel="cumcum02-fr-alerts-m-frame" x="20" y="97" fill="var(--color-paper)" font-family="l0g CumCum" font-size="22" font-weight="700" text-anchor="start">révélations</text>
<text data-panel="cumcum02-fr-alerts-m-frame" x="20" y="136" fill="var(--color-muted)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Événement et source : dates distinctes</text>
<rect id="cumcum02-fr-alerts-m-card-event-0" x="60" y="176" width="340" height="151" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="cumcum02-fr-alerts-m-card-event-0" x="74" y="202" fill="var(--color-signal)" font-family="l0g CumCum" font-size="20" font-weight="700" text-anchor="start">2009</text>
<text data-panel="cumcum02-fr-alerts-m-frame" x="20" y="202" fill="var(--color-muted)" font-family="l0g CumCum" font-size="20" font-weight="700" text-anchor="start">01</text>
<text data-panel="cumcum02-fr-alerts-m-card-event-0" x="74" y="230" fill="var(--color-paper)" font-family="l0g CumCum" font-size="19" font-weight="700" text-anchor="start">Informations fiscales</text>
<text data-panel="cumcum02-fr-alerts-m-card-event-0" x="74" y="256" fill="var(--color-paper)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">AMF → fisc : résultats de</text>
