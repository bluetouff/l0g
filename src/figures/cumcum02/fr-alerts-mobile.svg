<text data-panel="cumcum02-fr-alerts-m-card-event-2" x="74" y="568" fill="var(--color-paper)" font-family="l0g CumCum" font-size="19" font-weight="700" text-anchor="start">CumEx Files</text>
<text data-panel="cumcum02-fr-alerts-m-card-event-2" x="74" y="594" fill="var(--color-paper)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">Enquête transnationale : audience</text>
