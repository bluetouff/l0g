<text data-panel="cumcum02-fr-alerts-m-card-event-0" x="74" y="310" fill="var(--color-signal)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">ESMA 2020 [S01]</text>
<rect id="cumcum02-fr-alerts-m-card-event-1" x="60" y="345" width="340" height="151" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="cumcum02-fr-alerts-m-card-event-1" x="74" y="371" fill="var(--color-signal)" font-family="l0g CumCum" font-size="20" font-weight="700" text-anchor="start">2017</text>
<text data-panel="cumcum02-fr-alerts-m-frame" x="20" y="371" fill="var(--color-muted)" font-family="l0g CumCum" font-size="20" font-weight="700" text-anchor="start">02</text>
<text data-panel="cumcum02-fr-alerts-m-card-event-1" x="74" y="399" fill="var(--color-paper)" font-family="l0g CumCum" font-size="19" font-weight="700" text-anchor="start">Échanges et contrôle</text>
