<text data-panel="cumcum02-fr-alerts-m-card-event-1" x="74" y="479" fill="var(--color-signal)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">ESMA ; Sénat [S01, S03]</text>
