<text data-panel="cumcum02-fr-alerts-m-card-event-3" x="74" y="709" fill="var(--color-signal)" font-family="l0g CumCum" font-size="20" font-weight="700" text-anchor="start">FÉV. 2019</text>
<text data-panel="cumcum02-fr-alerts-m-frame" x="20" y="709" fill="var(--color-muted)" font-family="l0g CumCum" font-size="20" font-weight="700" text-anchor="start">04</text>
<text data-panel="cumcum02-fr-alerts-m-card-event-3" x="74" y="737" fill="var(--color-paper)" font-family="l0g CumCum" font-size="19" font-weight="700" text-anchor="start">Données et expertise</text>
<text data-panel="cumcum02-fr-alerts-m-card-event-3" x="74" y="763" fill="var(--color-paper)" font-family="l0g CumCum" font-size="17" font-weight="400" text-anchor="start">AMF : données Euroclear et pistes</text>
