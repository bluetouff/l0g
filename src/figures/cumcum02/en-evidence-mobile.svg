<text data-panel="cumcum02-en-evidence-m-card-input-0" x="32" y="224" fill="var(--color-paper)" font-family="l0g CumCum" font-size="19" font-weight="700" text-anchor="start">Dates and</text>
<text data-panel="cumcum02-en-evidence-m-card-input-0" x="32" y="248" fill="var(--color-paper)" font-family="l0g CumCum" font-size="19" font-weight="700" text-anchor="start">volumes</text>
