<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cumcum02-en-evidence-m-title cumcum02-en-evidence-m-desc" viewBox="0 0 420 1020" style="width:100%;height:auto" class="l0g-cumcum02-svg">
<title id="cumcum02-en-evidence-m-title">The records that must be connected</title><desc id="cumcum02-en-evidence-m-desc">Market data, tax identities, contracts and payments must be brought together. Their examination can support a tax procedure and a criminal investigation with different purposes.</desc>
