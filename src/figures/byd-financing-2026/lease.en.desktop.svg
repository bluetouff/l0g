<title id="byd-lease-en-d-title">The €219 offer and its 49 payments</title>
<desc id="byd-lease-en-d-desc">November 2026 French DOLPHIN SURF Boost offer. First rental €1865, conditional €365 incentive, €1500 paid by an eligible customer, then 48 rentals of €219. Customer rental total €12012 including VAT. The bars show 49 payment ranks, without invented dates. Return follows the contract.</desc>
