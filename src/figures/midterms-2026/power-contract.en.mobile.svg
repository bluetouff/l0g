<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 980" role="img" aria-labelledby="mt26-power-contract-en-m-title mt26-power-contract-en-m-desc" style="width:100%;height:auto" class="l0g-midterms-svg"><title id="mt26-power-contract-en-m-title">A commitment before power arrives</title><desc id="mt26-power-contract-en-m-desc">Grid buildout and electricity supply create obligations under two separate contracts.</desc>
<rect id="mt26-power-contract-en-m-frame" x="0" y="0" width="420" height="980" rx="10" fill="var(--color-ink)" stroke="none" stroke-width="1"/>
<text data-panel="mt26-power-contract-en-m-frame" x="22" y="33" font-family="l0g Midterms" font-size="18" font-weight="700" text-anchor="start" fill="var(--color-signal)">05 / US MIDTERMS 2026</text>
<text data-panel="mt26-power-contract-en-m-frame" x="22" y="72" font-family="l0g Midterms" font-size="25" font-weight="700" text-anchor="start" fill="var(--color-paper)">The contract precedes</text>
<text data-panel="mt26-power-contract-en-m-frame" x="22" y="106" font-family="l0g Midterms" font-size="25" font-weight="700" text-anchor="start" fill="var(--color-paper)">power</text>
<path data-connector="footer-rule" d="M22 902 L398 902" fill="none" stroke="var(--color-line-strong)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text data-panel="mt26-power-contract-en-m-frame" x="22" y="927" font-family="l0g Midterms" font-size="18" font-weight="400" text-anchor="start" fill="var(--color-muted)">Sources [1] · [27]</text>
<rect id="mt26-power-contract-en-m-works" x="22" y="145" width="376" height="135" rx="10" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="mt26-power-contract-en-m-works" x="38" y="180" font-family="l0g Midterms" font-size="19" font-weight="700" text-anchor="start" fill="var(--color-signal)">BUILDOUT / LOA</text>
<text data-panel="mt26-power-contract-en-m-works" x="38" y="220" font-family="l0g Midterms" font-size="21" font-weight="400" text-anchor="start" fill="var(--color-paper)">The customer commits to grid</text>
<text data-panel="mt26-power-contract-en-m-works" x="38" y="251" font-family="l0g Midterms" font-size="21" font-weight="400" text-anchor="start" fill="var(--color-paper)">buildout costs.</text>
<path data-connector="energization" d="M210 290 L210 349" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path data-connector="energization-head" d="M204 343 L210 349 L216 343" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text data-panel="mt26-power-contract-en-m-frame" x="22" y="324" font-family="l0g Midterms" font-size="18" font-weight="400" text-anchor="start" fill="var(--color-muted)">Energization</text>
<rect id="mt26-power-contract-en-m-supply" x="22" y="363" width="376" height="135" rx="10" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="mt26-power-contract-en-m-supply" x="38" y="398" font-family="l0g Midterms" font-size="19" font-weight="700" text-anchor="start" fill="var(--color-signal)">SUPPLY / ESA</text>
<text data-panel="mt26-power-contract-en-m-supply" x="38" y="438" font-family="l0g Midterms" font-size="21" font-weight="400" text-anchor="start" fill="var(--color-paper)">The service term starts when</text>
<text data-panel="mt26-power-contract-en-m-supply" x="38" y="469" font-family="l0g Midterms" font-size="21" font-weight="400" text-anchor="start" fill="var(--color-paper)">power arrives.</text>
<rect id="mt26-power-contract-en-m-trigger" x="22" y="537" width="376" height="255" rx="10" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text data-panel="mt26-power-contract-en-m-trigger" x="38" y="570" font-family="l0g Midterms" font-size="21" font-weight="700" text-anchor="start" fill="var(--color-amber)">If the customer cancels or</text>
<text data-panel="mt26-power-contract-en-m-trigger" x="38" y="601" font-family="l0g Midterms" font-size="21" font-weight="700" text-anchor="start" fill="var(--color-amber)">delays by more than 12</text>
<text data-panel="mt26-power-contract-en-m-trigger" x="38" y="632" font-family="l0g Midterms" font-size="21" font-weight="700" text-anchor="start" fill="var(--color-amber)">months</text>
<text data-panel="mt26-power-contract-en-m-trigger" x="38" y="678" font-family="l0g Midterms" font-size="43" font-weight="700" text-anchor="start" fill="var(--color-amber)">100 %</text>
<text data-panel="mt26-power-contract-en-m-trigger" x="38" y="722" font-family="l0g Midterms" font-size="21" font-weight="400" text-anchor="start" fill="var(--color-paper)">of buildout costs, before target</text>
<text data-panel="mt26-power-contract-en-m-trigger" x="38" y="753" font-family="l0g Midterms" font-size="21" font-weight="400" text-anchor="start" fill="var(--color-paper)">energization.</text>
<text data-panel="mt26-power-contract-en-m-frame" x="22" y="849" font-family="l0g Midterms" font-size="19" font-weight="400" text-anchor="start" fill="var(--color-muted)">Review causes, exceptions and the</text>
<text data-panel="mt26-power-contract-en-m-frame" x="22" y="877" font-family="l0g Midterms" font-size="19" font-weight="400" text-anchor="start" fill="var(--color-muted)">signed contract.</text>
</svg>
