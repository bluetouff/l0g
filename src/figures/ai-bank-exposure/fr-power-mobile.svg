<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 390" role="img" aria-labelledby="ai-bank-fr-power-m-title ai-bank-fr-power-m-desc" font-family="Inter Variable, Inter, sans-serif" font-weight="400" style="width:100%;height:auto" class="ai-bank-exposure-svg">
  <title id="ai-bank-fr-power-m-title">Switch : un cadre de lettres de crédit non engagé</title>
  <desc id="ai-bank-fr-power-m-desc">Schéma général de lettre de crédit. Switch annonce le 10 juin 2026 une facilité non engagée de lettres de crédit de performance de 3,5 milliards de dollars, après 2,6 milliards annoncés en avril. Ce cadre se distingue des LC effectivement émises et des appels payés, dont les montants ne sont pas indiqués dans les communiqués examinés. L’obligation bancaire porte sur une LC émise selon ses termes, notamment les conditions d’un appel conforme. Le soutien de crédit aux obligations électriques et l’acheminement physique de l’électricité vers les campus suivent des mécanismes distincts. Flèches sans échelle monétaire. Sources : Switch et BBVA CIB, 10 juin 2026.</desc>
  <text x="18" y="29" font-size="18" font-weight="400" text-anchor="start" fill="var(--color-paper)" data-metric="announced-facility-usd-bn" data-value="3.5">Switch · 3,5 Md$</text>
  <text x="18" y="53" font-size="14" font-weight="400" text-anchor="start" fill="var(--color-muted)">10 juin 2026 · cadre non engagé</text>
  <g data-icon="bank" transform="translate(61 106) scale(1)" fill="none" stroke="var(--color-muted)" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path d="M-18-5 0-15 18-5M-16-2H16M-14 18H14M-18 22H18M-11 2V14M0 2V14M11 2V14" /></g>
  <g data-icon="letter" transform="translate(282 108) scale(1)" fill="none" stroke="var(--color-muted)" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path d="M-14-20H7L16-11V20H-14ZM7-20V-11H16M-7-3H8M-7 4H8M-7 11H1" /><path d="m3 12 3 3 6-7" stroke="var(--color-signal)" /></g>
  <g data-flow="credit-backing"><path d="M105 108H243" fill="none" stroke="var(--color-signal)" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5" /><path d="M237 104 243 108 237 112" fill="none" stroke="var(--color-signal)" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" /></g>
