<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 390" role="img" aria-labelledby="ai-bank-fr-loan-m-title ai-bank-fr-loan-m-desc" font-family="Inter Variable, Inter, sans-serif" font-weight="400" style="width:100%;height:auto" class="ai-bank-exposure-svg">
  <title id="ai-bank-fr-loan-m-title">CoreWeave : capacité, encours et part bancaire</title>
  <desc id="ai-bank-fr-loan-m-desc">La facilité DDTL 5.5 de CoreWeave a une capacité contractuelle de 2,6 milliards de dollars au 7 août 2026. Son encours brut atteint 1,555 milliard de dollars au 30 septembre 2026. Les deux barres partent de zéro et partagent la même échelle. La répartition actuelle par banque n’est pas publiée. La différence entre les deux montants ne mesure pas une capacité immédiatement disponible. Sources : 8-K du 10 août et 10-Q du 12 novembre 2026, note 10.</desc>
