  <text x="18" y="54" font-size="14" font-weight="400" text-anchor="start" fill="var(--color-muted)">Milliards de dollars</text>
  <text x="18" y="87" font-size="14.5" font-weight="400" text-anchor="start" fill="var(--color-paper)">Capacité contractuelle</text>
  <text x="18" y="106" font-size="13.5" font-weight="400" text-anchor="start" fill="var(--color-muted)">7 août 2026</text>
  <text x="362" y="99" font-size="18" font-weight="500" text-anchor="end" fill="var(--color-paper)">2,6</text>
  <rect x="18" y="117" width="344" height="12" rx="1" fill="none" stroke="var(--color-muted)" stroke-width="1.25" data-metric="facility-capacity-usd-bn" data-value="2.6" />
  <text x="18" y="165" font-size="14.5" font-weight="400" text-anchor="start" fill="var(--color-paper)">Encours brut</text>
  <text x="18" y="184" font-size="13.5" font-weight="400" text-anchor="start" fill="var(--color-muted)">30 sept. 2026</text>
  <text x="362" y="177" font-size="18" font-weight="500" text-anchor="end" fill="var(--color-signal)">1,555</text>
  <rect x="18" y="195" width="205.7384615384615" height="12" rx="1" fill="var(--color-signal)" stroke="none" stroke-width="1.25" data-metric="gross-outstanding-usd-bn" data-value="1.555" />
