  <text x="635" y="242" font-size="16" font-weight="400" text-anchor="middle" fill="var(--color-amber)">non publié</text>
  <text x="24" y="291" font-size="15.2" font-weight="400" text-anchor="start" fill="var(--color-muted)">La part retenue par chaque banque reste inconnue.</text>
