<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="ai-bank-fr-loan-d-title ai-bank-fr-loan-d-desc" font-family="Inter Variable, Inter, sans-serif" font-weight="400" style="width:100%;height:auto" class="ai-bank-exposure-svg">
  <title id="ai-bank-fr-loan-d-title">CoreWeave : capacité, encours et part bancaire</title>
  <desc id="ai-bank-fr-loan-d-desc">La facilité DDTL 5.5 de CoreWeave a une capacité contractuelle de 2,6 milliards de dollars au 7 août 2026. Son encours brut atteint 1,555 milliard de dollars au 30 septembre 2026. Les deux barres partent de zéro et partagent la même échelle. La répartition actuelle par banque n’est pas publiée. La différence entre les deux montants ne mesure pas une capacité immédiatement disponible. Sources : 8-K du 10 août et 10-Q du 12 novembre 2026, note 10.</desc>
  <text x="24" y="31" font-size="22" font-weight="500" text-anchor="start" fill="var(--color-paper)">CoreWeave · DDTL 5.5</text>
  <text x="24" y="55" font-size="15.2" font-weight="400" text-anchor="start" fill="var(--color-muted)">Milliards de dollars · même échelle, dates distinctes</text>
  <text x="24" y="93" font-size="15.5" font-weight="400" text-anchor="start" fill="var(--color-paper)">Capacité contractuelle · 7 août 2026</text>
  <text x="474" y="93" font-size="22.8" font-weight="500" text-anchor="end" fill="var(--color-paper)">2,6 Md$</text>
  <rect x="24" y="110" width="450" height="12" rx="1" fill="none" stroke="var(--color-muted)" stroke-width="1.25" data-metric="facility-capacity-usd-bn" data-value="2.6" />
  <text x="24" y="172" font-size="15.5" font-weight="400" text-anchor="start" fill="var(--color-paper)">Encours brut · 30 sept. 2026</text>
  <text x="474" y="172" font-size="22.8" font-weight="500" text-anchor="end" fill="var(--color-signal)">1,555 Md$</text>
  <rect x="24" y="189" width="269.13461538461536" height="12" rx="1" fill="var(--color-signal)" stroke="none" stroke-width="1.25" data-metric="gross-outstanding-usd-bn" data-value="1.555" />
  <line x1="24" y1="233" x2="474" y2="233" stroke="var(--color-line-strong)" stroke-width="1" />
  <line x1="24.0" y1="233" x2="24.0" y2="239" stroke="var(--color-line-strong)" stroke-width="1" />
  <text x="24.0" y="258" font-size="15.2" font-weight="400" text-anchor="middle" fill="var(--color-muted)">0</text>
  <line x1="197.07692307692307" y1="233" x2="197.07692307692307" y2="239" stroke="var(--color-line-strong)" stroke-width="1" />
  <text x="197.07692307692307" y="258" font-size="15.2" font-weight="400" text-anchor="middle" fill="var(--color-muted)">1</text>
  <line x1="370.15384615384613" y1="233" x2="370.15384615384613" y2="239" stroke="var(--color-line-strong)" stroke-width="1" />
  <text x="370.15384615384613" y="258" font-size="15.2" font-weight="400" text-anchor="middle" fill="var(--color-muted)">2</text>
  <line x1="474.0" y1="233" x2="474.0" y2="239" stroke="var(--color-line-strong)" stroke-width="1" />
  <text x="474.0" y="258" font-size="15.2" font-weight="400" text-anchor="middle" fill="var(--color-muted)">2,6</text>
  <line x1="514" y1="76" x2="514" y2="262" stroke="var(--color-line-strong)" stroke-width="1" />
  <text x="635" y="93" font-size="17" font-weight="500" text-anchor="middle" fill="var(--color-paper)">Par banque</text>
