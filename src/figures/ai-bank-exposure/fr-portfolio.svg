<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="ai-bank-fr-portfolio-d-title ai-bank-fr-portfolio-d-desc" font-family="Inter Variable, Inter, sans-serif" font-weight="400" style="width:100%;height:auto" class="ai-bank-exposure-svg">
  <title id="ai-bank-fr-portfolio-d-title">Société Générale : une poche sectorielle d’environ 12 milliards d’euros d’EaD</title>
  <desc id="ai-bank-fr-portfolio-d-desc">À fin T3 2026, Société Générale publie environ 12 milliards d’euros d’exposition en cas de défaut, ou EaD, pour une poche composée de 60 % de centres de données, 21 % de conseil informatique, 10 % d’édition de logiciels applicatifs et 9 % de programmation informatique. La barre représente ces parts. Les quelque 7,2 milliards d’euros de data centres sont un calcul l0g : 12 multiplié par 60 %, à partir de valeurs arrondies. Cette mesure inclut des expositions au bilan et hors bilan. Le périmètre sectoriel dépasse l’IA seule. Sources : résultats T3 2026, page 41, et présentation investisseurs obligataires, page 46.</desc>
  <text x="24" y="29" font-size="18" font-weight="500" text-anchor="start" fill="var(--color-paper)">Société Générale</text>
  <text x="24" y="76" font-size="22.8" font-weight="400" text-anchor="start" fill="var(--color-paper)" data-metric="sector-ead-eur-bn" data-value="12">~ 12 Md€</text>
  <text x="239" y="70" font-size="16" font-weight="400" text-anchor="start" fill="var(--color-muted)">EaD · fin T3 2026</text>
  <rect x="24" y="110" width="427.2" height="17" rx="1" fill="var(--color-signal)" stroke="none" stroke-width="1.25" fill-opacity="0.7" data-metric="sector-share-percent" data-value="60" />
  <text x="237.6" y="102" font-size="15.2" font-weight="400" text-anchor="middle" fill="var(--color-muted)">60 %</text>
  <rect x="451.2" y="110" width="149.52" height="17" rx="1" fill="var(--color-topic-blue)" stroke="none" stroke-width="1.25" fill-opacity="0.4" data-metric="sector-share-percent" data-value="21" />
  <text x="525.96" y="102" font-size="15.2" font-weight="400" text-anchor="middle" fill="var(--color-muted)">21 %</text>
  <rect x="600.72" y="110" width="71.2" height="17" rx="1" fill="var(--color-amber)" stroke="none" stroke-width="1.25" fill-opacity="0.4" data-metric="sector-share-percent" data-value="10" />
  <text x="636.32" y="102" font-size="15.2" font-weight="400" text-anchor="middle" fill="var(--color-muted)">10 %</text>
  <rect x="671.9200000000001" y="110" width="64.08" height="17" rx="1" fill="var(--color-muted)" stroke="none" stroke-width="1.25" fill-opacity="0.4" data-metric="sector-share-percent" data-value="9" />
  <text x="703.96" y="102" font-size="15.2" font-weight="400" text-anchor="middle" fill="var(--color-muted)">9 %</text>
  <line x1="24" y1="154" x2="37" y2="154" stroke="var(--color-signal)" stroke-width="2" />
  <text x="45" y="160" font-size="15.2" font-weight="400" text-anchor="start" fill="var(--color-paper)">Centres de données</text>
  <line x1="222" y1="154" x2="235" y2="154" stroke="var(--color-topic-blue)" stroke-width="2" />
  <text x="243" y="160" font-size="15.2" font-weight="400" text-anchor="start" fill="var(--color-paper)">Conseil informatique</text>
  <line x1="420" y1="154" x2="433" y2="154" stroke="var(--color-amber)" stroke-width="2" />
  <text x="441" y="160" font-size="15.2" font-weight="400" text-anchor="start" fill="var(--color-paper)">Édition de logiciels</text>
  <line x1="603" y1="154" x2="616" y2="154" stroke="var(--color-muted)" stroke-width="2" />
  <text x="624" y="160" font-size="15.2" font-weight="400" text-anchor="start" fill="var(--color-paper)">Programmation</text>
  <line x1="24" y1="187" x2="736" y2="187" stroke="var(--color-line-strong)" stroke-width="1" />
  <text x="24" y="235" font-size="22.8" font-weight="400" text-anchor="start" fill="var(--color-signal)" data-metric="derived-data-centre-ead-eur-bn" data-value="7.2">~ 7,2 Md€</text>
  <text x="246" y="220" font-size="17" font-weight="400" text-anchor="start" fill="var(--color-paper)">Data centres · calcul : 12 × 60 %</text>
  <text x="246" y="245" font-size="15.2" font-weight="400" text-anchor="start" fill="var(--color-muted)">Calcul à partir de montants arrondis</text>
  <text x="24" y="270" font-size="15.2" font-weight="400" text-anchor="start" fill="var(--color-muted)">Expositions au bilan et hors bilan</text>
  <text x="24" y="290" font-size="15.2" font-weight="400" text-anchor="start" fill="var(--color-muted)">Périmètre sectoriel plus large que l’IA</text>
</svg>
