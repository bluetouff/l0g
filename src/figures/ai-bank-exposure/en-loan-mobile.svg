  <line x1="282.6153846153846" y1="237" x2="282.6153846153846" y2="242" stroke="var(--color-line-strong)" stroke-width="1" />
  <text x="282.6153846153846" y="260" font-size="13.5" font-weight="400" text-anchor="middle" fill="var(--color-muted)">2</text>
  <line x1="362.0" y1="237" x2="362.0" y2="242" stroke="var(--color-line-strong)" stroke-width="1" />
  <text x="362.0" y="260" font-size="13.5" font-weight="400" text-anchor="middle" fill="var(--color-muted)">2.6</text>
