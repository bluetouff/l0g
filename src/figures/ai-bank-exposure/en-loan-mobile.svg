<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 390" role="img" aria-labelledby="ai-bank-en-loan-m-title ai-bank-en-loan-m-desc" font-family="Inter Variable, Inter, sans-serif" font-weight="400" style="width:100%;height:auto" class="ai-bank-exposure-svg">
  <title id="ai-bank-en-loan-m-title">CoreWeave: facility size, debt outstanding and bank holdings</title>
  <desc id="ai-bank-en-loan-m-desc">CoreWeave’s DDTL 5.5 facility has a contractual capacity of $2.6 billion on 7 August 2026. Gross debt outstanding is $1.555 billion on 30 September 2026. Both bars start at zero and use the same scale. Current holdings by individual banks are not disclosed. The difference between the amounts does not measure immediately available capacity. Sources: 10 August 8-K and 12 November 2026 10-Q, note 10.</desc>
  <text x="18" y="30" font-size="18" font-weight="500" text-anchor="start" fill="var(--color-paper)">CoreWeave · DDTL 5.5</text>
  <text x="18" y="54" font-size="14" font-weight="400" text-anchor="start" fill="var(--color-muted)">US dollars, billions</text>
  <text x="18" y="87" font-size="14.5" font-weight="400" text-anchor="start" fill="var(--color-paper)">Contractual capacity</text>
  <text x="18" y="106" font-size="13.5" font-weight="400" text-anchor="start" fill="var(--color-muted)">7 August 2026</text>
  <text x="362" y="99" font-size="18" font-weight="500" text-anchor="end" fill="var(--color-paper)">2.6</text>
  <rect x="18" y="117" width="344" height="12" rx="1" fill="none" stroke="var(--color-muted)" stroke-width="1.25" data-metric="facility-capacity-usd-bn" data-value="2.6" />
  <text x="18" y="165" font-size="14.5" font-weight="400" text-anchor="start" fill="var(--color-paper)">Gross debt outstanding</text>
  <text x="18" y="184" font-size="13.5" font-weight="400" text-anchor="start" fill="var(--color-muted)">30 September 2026</text>
  <text x="362" y="177" font-size="18" font-weight="500" text-anchor="end" fill="var(--color-signal)">1.555</text>
  <rect x="18" y="195" width="205.7384615384615" height="12" rx="1" fill="var(--color-signal)" stroke="none" stroke-width="1.25" data-metric="gross-outstanding-usd-bn" data-value="1.555" />
  <line x1="18" y1="237" x2="362" y2="237" stroke="var(--color-line-strong)" stroke-width="1" />
  <line x1="18.0" y1="237" x2="18.0" y2="242" stroke="var(--color-line-strong)" stroke-width="1" />
  <text x="18.0" y="260" font-size="13.5" font-weight="400" text-anchor="middle" fill="var(--color-muted)">0</text>
  <line x1="150.3076923076923" y1="237" x2="150.3076923076923" y2="242" stroke="var(--color-line-strong)" stroke-width="1" />
