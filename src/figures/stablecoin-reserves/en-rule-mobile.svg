<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sc-reserve-en-rule-m-title sc-reserve-en-rule-m-desc" viewBox="0 0 420 850" style="width:100%;height:auto" class="l0g-stablecoin-reserve-svg"><title id="sc-reserve-en-rule-m-title">Contracts and payments</title><desc id="sc-reserve-en-rule-m-desc">OCC timeline: proposal published 2 March 2026; final rule announced 21 October, published 23 October; effective 18 January 2027. The proposed rebuttable presumption is removed. The issuer prohibition and anti-evasion scrutiny remain. Three questions guide analysis: who pays, including on an issuer’s behalf; the nature and purpose of payment; and what contracts and flows establish. This is an analytical guide, not a ruling on any particular program. Sources: L01, L02, L04.</desc><rect id="sc-reserve-en-rule-m-frame" x="0" y="0" width="420" height="850" fill="var(--color-ink)"/><text data-panel="sc-reserve-en-rule-m-frame" x="22" y="35" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="700" text-anchor="start">l0g / STABLECOINS</text><text data-panel="sc-reserve-en-rule-m-frame" x="398" y="35" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="end">04 / 07</text><text data-panel="sc-reserve-en-rule-m-frame" x="22" y="76" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="25" font-weight="700" text-anchor="start">Contracts and payments</text><text data-panel="sc-reserve-en-rule-m-frame" x="22" y="117" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="start">OCC final rule · published 23 October</text><text data-panel="sc-reserve-en-rule-m-frame" x="22" y="140" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="start">2026</text><text data-panel="sc-reserve-en-rule-m-frame" x="28" y="220" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="19" font-weight="700" text-anchor="start">2 Mar 2026</text><text data-panel="sc-reserve-en-rule-m-frame" x="392" y="220" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="end">Proposal</text><text data-panel="sc-reserve-en-rule-m-frame" x="28" y="266" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="19" font-weight="700" text-anchor="start">21 / 23 Oct 2026</text><text data-panel="sc-reserve-en-rule-m-frame" x="392" y="266" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="end">Final rule</text><text data-panel="sc-reserve-en-rule-m-frame" x="28" y="312" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="19" font-weight="700" text-anchor="start">18 Jan 2027</text><text data-panel="sc-reserve-en-rule-m-frame" x="392" y="312" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="end">Effective</text><text data-panel="sc-reserve-en-rule-m-frame" x="28" y="382" fill="var(--color-accent)" font-family="l0g Stablecoin Reserves" font-size="19" font-weight="700" text-anchor="start">Proposed presumption removed</text><text data-panel="sc-reserve-en-rule-m-frame" x="210" y="452" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="700" text-anchor="middle">ISSUER</text><line x1="210" y1="472" x2="210" y2="510" stroke="var(--color-signal)" stroke-width="3"/><path d="M 204 501 L 210 510 L 216 501" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="sc-reserve-en-rule-m-frame" x="210" y="552" fill="var(--color-amber)" font-family="l0g Stablecoin Reserves" font-size="21" font-weight="700" text-anchor="middle">PLATFORM / AGENT?</text><line x1="210" y1="573" x2="210" y2="612" stroke="var(--color-signal)" stroke-width="3"/><path d="M 204 603 L 210 612 L 216 603" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="sc-reserve-en-rule-m-frame" x="210" y="653" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="700" text-anchor="middle">HOLDER</text><text data-panel="sc-reserve-en-rule-m-frame" x="28" y="714" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="18" font-weight="400" text-anchor="start">Contracts and actual flows</text><text data-panel="sc-reserve-en-rule-m-frame" x="28" y="741" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="18" font-weight="400" text-anchor="start">→ classification of payment</text><line x1="22" y1="788" x2="398" y2="788" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="sc-reserve-en-rule-m-frame" x="22" y="820" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="start">L01 · L02 · L04 | Analytical guide</text></svg>
