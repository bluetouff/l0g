<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sc-reserve-en-redemption-d-title sc-reserve-en-redemption-d-desc" viewBox="0 0 1000 700" style="width:100%;height:auto" class="l0g-stablecoin-reserve-svg"><title id="sc-reserve-en-redemption-d-title">From tokens to bank money</title><desc id="sc-reserve-en-redemption-d-desc">Token movement on a network and issuer redemption follow different steps. Under the OCC rule effective 18 January 2027: receipt of the customer order and satisfaction of onboarding/legal conditions trigger the obligation; two business days run to full processing and initiation of the outgoing transfer. A requested credit to an account with the issuer also qualifies. Receipt at an external bank depends on the payment route. An intermediary can add its own access step. Requests exceeding 10% of a brand’s outstanding issuance in 24 hours trigger notice and a possible OCC-decided extension. Sources: L01.</desc><rect id="sc-reserve-en-redemption-d-frame" x="0" y="0" width="1000" height="700" fill="var(--color-ink)"/><text data-panel="sc-reserve-en-redemption-d-frame" x="40" y="42" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="700" text-anchor="start">l0g / STABLECOINS</text><text data-panel="sc-reserve-en-redemption-d-frame" x="960" y="42" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="400" text-anchor="end">06 / 07</text><text data-panel="sc-reserve-en-redemption-d-frame" x="40" y="94" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="32" font-weight="700" text-anchor="start">From tokens to bank money</text><text data-panel="sc-reserve-en-redemption-d-frame" x="40" y="145" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="400" text-anchor="start">OCC rule · effective 18 January 2027</text><text data-panel="sc-reserve-en-redemption-d-frame" x="40" y="230" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="25" font-weight="700" text-anchor="start">Eligible order</text><text data-panel="sc-reserve-en-redemption-d-frame" x="40" y="266" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="25" font-weight="700" text-anchor="start">reaches issuer</text><text data-panel="sc-reserve-en-redemption-d-frame" x="400" y="230" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="25" font-weight="700" text-anchor="start">Transfer processed</text><text data-panel="sc-reserve-en-redemption-d-frame" x="400" y="266" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="25" font-weight="700" text-anchor="start">and initiated</text><text data-panel="sc-reserve-en-redemption-d-frame" x="760" y="230" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="25" font-weight="700" text-anchor="start">External bank</text><text data-panel="sc-reserve-en-redemption-d-frame" x="760" y="266" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="25" font-weight="700" text-anchor="start">Funds available</text><line x1="130" y1="310" x2="510" y2="310" stroke="var(--color-signal)" stroke-width="3"/><path d="M 501 304 L 510 310 L 501 316" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="sc-reserve-en-redemption-d-frame" x="320" y="357" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="26" font-weight="700" text-anchor="middle">2 business days max</text><line x1="550" y1="310" x2="855" y2="310" stroke="var(--color-muted)" stroke-width="3"/><path d="M 846 304 L 855 310 L 846 316" fill="none" stroke="var(--color-muted)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="sc-reserve-en-redemption-d-frame" x="720" y="357" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="24" font-weight="400" text-anchor="middle">Payment route</text><text data-panel="sc-reserve-en-redemption-d-frame" x="400" y="419" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="24" font-weight="400" text-anchor="middle">Or credit with the issuer, if requested by the customer.</text><text data-panel="sc-reserve-en-redemption-d-frame" x="40" y="502" fill="var(--color-amber)" font-family="l0g Stablecoin Reserves" font-size="26" font-weight="700" text-anchor="start">Requests &gt; 10% of issuance in 24 h → OCC notification</text><text data-panel="sc-reserve-en-redemption-d-frame" x="40" y="550" fill="var(--color-amber)" font-family="l0g Stablecoin Reserves" font-size="26" font-weight="700" text-anchor="start">Any extension depends on the supervisor’s decision.</text><line x1="40" y1="638" x2="960" y2="638" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="sc-reserve-en-redemption-d-frame" x="40" y="670" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="400" text-anchor="start">L01 | Legal deadline and payment route</text></svg>
