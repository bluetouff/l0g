<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sc-reserve-en-jurisdictions-m-title sc-reserve-en-jurisdictions-m-desc" viewBox="0 0 420 850" style="width:100%;height:auto" class="l0g-stablecoin-reserve-svg"><title id="sc-reserve-en-jurisdictions-m-title">The payers covered by the rules</title><desc id="sc-reserve-en-jurisdictions-m-desc">Targeted comparison. United States: GENIUS and the OCC rule cover yield paid by a permitted or foreign issuer solely in connection with holding, use or retention of a payment stablecoin; an agent may act on its behalf and indirect arrangements are assessed on their facts. European Union: MiCA Article 50 names both the EMT issuer and crypto-asset service provider; certain holding-duration-related benefits count as interest. Article 40 provides similar ART provisions. These European provisions apply from 30 June 2024. Jurisdiction, product and payer’s role determine the analysis. Sources: L01, L03, M06.</desc><rect id="sc-reserve-en-jurisdictions-m-frame" x="0" y="0" width="420" height="850" fill="var(--color-ink)"/><text data-panel="sc-reserve-en-jurisdictions-m-frame" x="22" y="35" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="700" text-anchor="start">l0g / STABLECOINS</text><text data-panel="sc-reserve-en-jurisdictions-m-frame" x="398" y="35" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="end">07 / 07</text><text data-panel="sc-reserve-en-jurisdictions-m-frame" x="22" y="76" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="25" font-weight="700" text-anchor="start">The payers covered by the</text><text data-panel="sc-reserve-en-jurisdictions-m-frame" x="22" y="108" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="25" font-weight="700" text-anchor="start">rules</text><text data-panel="sc-reserve-en-jurisdictions-m-frame" x="22" y="149" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="start">Selected scopes · stablecoin-related</text><text data-panel="sc-reserve-en-jurisdictions-m-frame" x="22" y="172" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="start">interest</text><text data-panel="sc-reserve-en-jurisdictions-m-frame" x="115" y="220" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="18" font-weight="700" text-anchor="middle">ISSUER</text><text data-panel="sc-reserve-en-jurisdictions-m-frame" x="308" y="220" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="18" font-weight="700" text-anchor="middle">DISTRIBUTOR</text><text data-panel="sc-reserve-en-jurisdictions-m-frame" x="28" y="280" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="18" font-weight="700" text-anchor="start">UNITED STATES</text><text data-panel="sc-reserve-en-jurisdictions-m-frame" x="392" y="280" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="end">18 Jan 2027</text><text data-panel="sc-reserve-en-jurisdictions-m-frame" x="28" y="475" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="18" font-weight="700" text-anchor="start">EUROPEAN UNION</text><text data-panel="sc-reserve-en-jurisdictions-m-frame" x="392" y="475" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="end">30 Jun 2024</text><circle cx="115" cy="324" r="8" fill="var(--color-accent)"/><circle cx="308" cy="324" r="8" fill="var(--color-amber)"/><circle cx="115" cy="519" r="8" fill="var(--color-accent)"/><circle cx="308" cy="519" r="8" fill="var(--color-accent)"/><text data-panel="sc-reserve-en-jurisdictions-m-frame" x="115" y="370" fill="var(--color-accent)" font-family="l0g Stablecoin Reserves" font-size="20" font-weight="700" text-anchor="middle">Prohibited</text><text data-panel="sc-reserve-en-jurisdictions-m-frame" x="308" y="356" fill="var(--color-amber)" font-family="l0g Stablecoin Reserves" font-size="19" font-weight="700" text-anchor="middle">Contracts</text><text data-panel="sc-reserve-en-jurisdictions-m-frame" x="308" y="383" fill="var(--color-amber)" font-family="l0g Stablecoin Reserves" font-size="19" font-weight="700" text-anchor="middle">and facts</text><line x1="28" y1="419" x2="392" y2="419" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="sc-reserve-en-jurisdictions-m-frame" x="115" y="565" fill="var(--color-accent)" font-family="l0g Stablecoin Reserves" font-size="20" font-weight="700" text-anchor="middle">Prohibited</text><text data-panel="sc-reserve-en-jurisdictions-m-frame" x="308" y="565" fill="var(--color-accent)" font-family="l0g Stablecoin Reserves" font-size="20" font-weight="700" text-anchor="middle">Prohibited</text><text data-panel="sc-reserve-en-jurisdictions-m-frame" x="28" y="669" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="18" font-weight="400" text-anchor="start">US: GENIUS + OCC</text><text data-panel="sc-reserve-en-jurisdictions-m-frame" x="28" y="700" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="18" font-weight="400" text-anchor="start">EU: MiCA, Articles 40 and 50</text><line x1="22" y1="788" x2="398" y2="788" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="sc-reserve-en-jurisdictions-m-frame" x="22" y="820" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="start">L01 · L03 · M06 | Covered products</text></svg>
