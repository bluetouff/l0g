<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sc-reserve-en-reserve-m-title sc-reserve-en-reserve-m-desc" viewBox="0 0 420 850" style="width:100%;height:auto" class="l0g-stablecoin-reserve-svg"><title id="sc-reserve-en-reserve-m-title">Capital and reserve income</title><desc id="sc-reserve-en-reserve-m-desc">Fictional example: a one-thousand-dollar subscription gives the customer one thousand USDC and the issuer one thousand dollars in reserves. Reserve assets match the redemption obligation. A hypothetical 4% simple annual rate generates forty dollars of gross income over twelve months. Principal stays covered; costs, buffers and contractual sharing determine surplus. Circle’s non-EEA terms give holders no entitlement to reserve interest. Sources: P02, L01.</desc><rect id="sc-reserve-en-reserve-m-frame" x="0" y="0" width="420" height="850" fill="var(--color-ink)"/><text data-panel="sc-reserve-en-reserve-m-frame" x="22" y="35" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="700" text-anchor="start">l0g / STABLECOINS</text><text data-panel="sc-reserve-en-reserve-m-frame" x="398" y="35" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="end">01 / 07</text><text data-panel="sc-reserve-en-reserve-m-frame" x="22" y="76" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="25" font-weight="700" text-anchor="start">Capital and reserve income</text><text data-panel="sc-reserve-en-reserve-m-frame" x="22" y="117" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="start">Fictional example · $1,000 · simple</text><text data-panel="sc-reserve-en-reserve-m-frame" x="22" y="140" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="start">annual interest</text><text data-panel="sc-reserve-en-reserve-m-frame" x="28" y="220" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="18" font-weight="700" text-anchor="start">AT ISSUANCE</text><text data-panel="sc-reserve-en-reserve-m-frame" x="28" y="265" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="20" font-weight="700" text-anchor="start">Reserve assets</text><text data-panel="sc-reserve-en-reserve-m-frame" x="390" y="265" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="21" font-weight="700" text-anchor="end">$1,000</text><line x1="28" y1="287" x2="392" y2="287" stroke="var(--color-signal)" stroke-width="10"/><text data-panel="sc-reserve-en-reserve-m-frame" x="28" y="345" fill="var(--color-accent)" font-family="l0g Stablecoin Reserves" font-size="18" font-weight="700" text-anchor="start">USDC redemption liability</text><text data-panel="sc-reserve-en-reserve-m-frame" x="390" y="345" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="21" font-weight="700" text-anchor="end">$1,000</text><line x1="28" y1="367" x2="392" y2="367" stroke="var(--color-accent)" stroke-width="10"/><text data-panel="sc-reserve-en-reserve-m-frame" x="28" y="429" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="18" font-weight="700" text-anchor="start">OVER 12 MONTHS</text><line x1="210" y1="449" x2="210" y2="487" stroke="var(--color-signal)" stroke-width="3"/><path d="M 204 478 L 210 487 L 216 478" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="sc-reserve-en-reserve-m-frame" x="210" y="533" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="27" font-weight="700" text-anchor="middle">$1,000 × 4% = $40</text><text data-panel="sc-reserve-en-reserve-m-frame" x="28" y="596" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="20" font-weight="400" text-anchor="start">Gross reserve income</text><text data-panel="sc-reserve-en-reserve-m-frame" x="28" y="632" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="20" font-weight="400" text-anchor="start">Costs and contractual sharing</text><text data-panel="sc-reserve-en-reserve-m-frame" x="28" y="704" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="18" font-weight="400" text-anchor="start">Reserve principal and income</text><text data-panel="sc-reserve-en-reserve-m-frame" x="28" y="731" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="18" font-weight="400" text-anchor="start">are separate contractual rights.</text><line x1="22" y1="788" x2="398" y2="788" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="sc-reserve-en-reserve-m-frame" x="22" y="820" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="start">P02 · L01 | Fictional example</text></svg>
