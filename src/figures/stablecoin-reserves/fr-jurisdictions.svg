<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sc-reserve-fr-jurisdictions-d-title sc-reserve-fr-jurisdictions-d-desc" viewBox="0 0 1000 700" style="width:100%;height:auto" class="l0g-stablecoin-reserve-svg"><title id="sc-reserve-fr-jurisdictions-d-title">États-Unis et Europe : les payeurs visés</title><desc id="sc-reserve-fr-jurisdictions-d-desc">Comparaison ciblée. États-Unis : GENIUS et règle OCC visent le rendement payé par l’émetteur autorisé ou étranger uniquement en lien avec la détention, l’utilisation ou la conservation d’un payment stablecoin ; un agent peut agir pour son compte et les montages indirects sont examinés selon les faits. Union européenne : MiCA article 50 nomme l’émetteur d’EMT et le prestataire de services sur crypto-actifs ; certains avantages liés à la durée de détention sont assimilés à des intérêts. L’article 40 prévoit des dispositions similaires pour les ART. Ces dispositions européennes s’appliquent depuis le 30 juin 2024. Le pays, le produit et le rôle du payeur déterminent la lecture. Sources : L01, L03, M06.</desc><rect id="sc-reserve-fr-jurisdictions-d-frame" x="0" y="0" width="1000" height="700" fill="var(--color-ink)"/><text data-panel="sc-reserve-fr-jurisdictions-d-frame" x="40" y="42" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="700" text-anchor="start">l0g / STABLECOINS</text><text data-panel="sc-reserve-fr-jurisdictions-d-frame" x="960" y="42" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="400" text-anchor="end">07 / 07</text><text data-panel="sc-reserve-fr-jurisdictions-d-frame" x="40" y="94" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="32" font-weight="700" text-anchor="start">États-Unis et Europe : les payeurs visés</text><text data-panel="sc-reserve-fr-jurisdictions-d-frame" x="40" y="145" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="400" text-anchor="start">Périmètres ciblés · intérêts liés au stablecoin</text><text data-panel="sc-reserve-fr-jurisdictions-d-frame" x="470" y="225" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="25" font-weight="700" text-anchor="middle">ÉMETTEUR</text><text data-panel="sc-reserve-fr-jurisdictions-d-frame" x="815" y="225" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="25" font-weight="700" text-anchor="middle">DISTRIBUTEUR</text><text data-panel="sc-reserve-fr-jurisdictions-d-frame" x="40" y="315" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="25" font-weight="700" text-anchor="start">ÉTATS-UNIS</text><text data-panel="sc-reserve-fr-jurisdictions-d-frame" x="40" y="352" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="400" text-anchor="start">18.01.2027</text><line x1="40" y1="382" x2="960" y2="382" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="sc-reserve-fr-jurisdictions-d-frame" x="40" y="460" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="25" font-weight="700" text-anchor="start">UNION EUROPÉENNE</text><text data-panel="sc-reserve-fr-jurisdictions-d-frame" x="40" y="497" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="400" text-anchor="start">30.06.2024</text><line x1="40" y1="527" x2="960" y2="527" stroke="var(--color-line-strong)" stroke-width="2"/><circle cx="470" cy="281" r="8" fill="var(--color-accent)"/><text data-panel="sc-reserve-fr-jurisdictions-d-frame" x="470" y="324" fill="var(--color-accent)" font-family="l0g Stablecoin Reserves" font-size="24" font-weight="700" text-anchor="middle">Interdit</text><circle cx="815" cy="281" r="8" fill="var(--color-amber)"/><text data-panel="sc-reserve-fr-jurisdictions-d-frame" x="815" y="324" fill="var(--color-amber)" font-family="l0g Stablecoin Reserves" font-size="24" font-weight="700" text-anchor="middle">Contrats et faits</text><circle cx="470" cy="426" r="8" fill="var(--color-accent)"/><text data-panel="sc-reserve-fr-jurisdictions-d-frame" x="470" y="469" fill="var(--color-accent)" font-family="l0g Stablecoin Reserves" font-size="24" font-weight="700" text-anchor="middle">Interdit</text><circle cx="815" cy="426" r="8" fill="var(--color-accent)"/><text data-panel="sc-reserve-fr-jurisdictions-d-frame" x="815" y="469" fill="var(--color-accent)" font-family="l0g Stablecoin Reserves" font-size="24" font-weight="700" text-anchor="middle">Interdit</text><text data-panel="sc-reserve-fr-jurisdictions-d-frame" x="40" y="581" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="24" font-weight="400" text-anchor="start">États-Unis : GENIUS + OCC ; UE : MiCA, articles 40 et 50.</text><line x1="40" y1="638" x2="960" y2="638" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="sc-reserve-fr-jurisdictions-d-frame" x="40" y="670" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="400" text-anchor="start">L01 · L03 · M06 | Produits couverts</text></svg>
