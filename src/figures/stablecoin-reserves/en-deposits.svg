<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sc-reserve-en-deposits-d-title sc-reserve-en-deposits-d-desc" viewBox="0 0 1000 700" style="width:100%;height:auto" class="l0g-stablecoin-reserve-svg"><title id="sc-reserve-en-deposits-d-title">A deposit moves between three banks</title><desc id="sc-reserve-en-deposits-d-desc">A fictional one-thousand-dollar circuit: initially the customer has a $1,000 deposit at bank A; after primary stablecoin issuance, the issuer has the deposit at bank B and the customer has 1,000 USDC; following a secondary-market Treasury bill purchase from a nonbank seller, that seller has the deposit at bank C, the issuer owns the bill and the customer owns USDC. Deposits in this circuit remain $1,000 at each step. This is not a universal conservation law: bank sellers, the Treasury account and Fed reverse repos produce different circuits. Sources: M01, M02, M05.</desc><rect id="sc-reserve-en-deposits-d-frame" x="0" y="0" width="1000" height="700" fill="var(--color-ink)"/><text data-panel="sc-reserve-en-deposits-d-frame" x="40" y="42" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="700" text-anchor="start">l0g / STABLECOINS</text><text data-panel="sc-reserve-en-deposits-d-frame" x="960" y="42" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="400" text-anchor="end">05 / 07</text><text data-panel="sc-reserve-en-deposits-d-frame" x="40" y="94" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="32" font-weight="700" text-anchor="start">A deposit moves between three banks</text><text data-panel="sc-reserve-en-deposits-d-frame" x="40" y="145" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="400" text-anchor="start">Fictional scenario · $1,000 · secondary purchase</text><rect id="sc-reserve-en-deposits-d-card-snapshot-1" x="30" y="180" width="300" height="207" fill="var(--color-ink)"/><text data-panel="sc-reserve-en-deposits-d-card-snapshot-1" x="40" y="225" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="24" font-weight="700" text-anchor="start">1. Customer</text><text data-panel="sc-reserve-en-deposits-d-card-snapshot-1" x="40" y="304" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="40" font-weight="700" text-anchor="start">$1,000</text><line x1="40" y1="334" x2="310" y2="334" stroke="var(--color-signal)" stroke-width="12"/><text data-panel="sc-reserve-en-deposits-d-card-snapshot-1" x="40" y="377" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="23" font-weight="400" text-anchor="start">Deposit at bank A</text><line x1="314" y1="297" x2="349" y2="297" stroke="var(--color-signal)" stroke-width="3"/><path d="M 340 291 L 349 297 L 340 303" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect id="sc-reserve-en-deposits-d-card-snapshot-2" x="355" y="180" width="300" height="207" fill="var(--color-ink)"/><text data-panel="sc-reserve-en-deposits-d-card-snapshot-2" x="365" y="225" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="24" font-weight="700" text-anchor="start">2. Issuer</text><text data-panel="sc-reserve-en-deposits-d-card-snapshot-2" x="365" y="304" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="40" font-weight="700" text-anchor="start">$1,000</text><line x1="365" y1="334" x2="635" y2="334" stroke="var(--color-signal)" stroke-width="12"/><text data-panel="sc-reserve-en-deposits-d-card-snapshot-2" x="365" y="377" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="23" font-weight="400" text-anchor="start">Deposit at bank B</text><line x1="639" y1="297" x2="674" y2="297" stroke="var(--color-signal)" stroke-width="3"/><path d="M 665 291 L 674 297 L 665 303" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect id="sc-reserve-en-deposits-d-card-snapshot-3" x="680" y="180" width="300" height="207" fill="var(--color-ink)"/><text data-panel="sc-reserve-en-deposits-d-card-snapshot-3" x="690" y="225" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="700" text-anchor="start">3. Nonbank seller</text><text data-panel="sc-reserve-en-deposits-d-card-snapshot-3" x="690" y="304" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="40" font-weight="700" text-anchor="start">$1,000</text><line x1="690" y1="334" x2="960" y2="334" stroke="var(--color-signal)" stroke-width="12"/><text data-panel="sc-reserve-en-deposits-d-card-snapshot-3" x="690" y="377" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="23" font-weight="400" text-anchor="start">Deposit at bank C</text><text data-panel="sc-reserve-en-deposits-d-frame" x="202" y="430" fill="var(--color-amber)" font-family="l0g Stablecoin Reserves" font-size="24" font-weight="700" text-anchor="middle">Primary issuance</text><text data-panel="sc-reserve-en-deposits-d-frame" x="706" y="430" fill="var(--color-amber)" font-family="l0g Stablecoin Reserves" font-size="24" font-weight="700" text-anchor="middle">Secondary Treasury bill purchase</text><text data-panel="sc-reserve-en-deposits-d-frame" x="40" y="510" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="23" font-weight="400" text-anchor="start">At the end: customer = USDC; issuer = Treasury bill; seller = bank deposit.</text><text data-panel="sc-reserve-en-deposits-d-frame" x="40" y="556" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="23" font-weight="400" text-anchor="start">Each stage is a separate snapshot; the tracked total remains $1,000.</text><line x1="40" y1="638" x2="960" y2="638" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="sc-reserve-en-deposits-d-frame" x="40" y="670" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="400" text-anchor="start">M01 · M02 · M05 | Conditional scenario</text></svg>
