<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sc-reserve-en-rule-d-title sc-reserve-en-rule-d-desc" viewBox="0 0 1000 700" style="width:100%;height:auto" class="l0g-stablecoin-reserve-svg"><title id="sc-reserve-en-rule-d-title">Payment flows guide regulatory scrutiny</title><desc id="sc-reserve-en-rule-d-desc">OCC timeline: proposal published 2 March 2026; final rule announced 21 October, published 23 October; effective 18 January 2027. The proposed rebuttable presumption is removed. The issuer prohibition and anti-evasion scrutiny remain. Three questions guide analysis: who pays, including on an issuer’s behalf; the nature and purpose of payment; and what contracts and flows establish. This is an analytical guide, not a ruling on any particular program. Sources: L01, L02, L04.</desc><rect id="sc-reserve-en-rule-d-frame" x="0" y="0" width="1000" height="700" fill="var(--color-ink)"/><text data-panel="sc-reserve-en-rule-d-frame" x="40" y="42" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="700" text-anchor="start">l0g / STABLECOINS</text><text data-panel="sc-reserve-en-rule-d-frame" x="960" y="42" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="400" text-anchor="end">04 / 07</text><text data-panel="sc-reserve-en-rule-d-frame" x="40" y="94" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="32" font-weight="700" text-anchor="start">Payment flows guide regulatory scrutiny</text><text data-panel="sc-reserve-en-rule-d-frame" x="40" y="145" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="400" text-anchor="start">OCC final rule · published 23 October 2026</text><text data-panel="sc-reserve-en-rule-d-frame" x="40" y="215" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="25" font-weight="700" text-anchor="start">2 Mar 2026</text><text data-panel="sc-reserve-en-rule-d-frame" x="40" y="251" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="23" font-weight="400" text-anchor="start">Proposal</text><text data-panel="sc-reserve-en-rule-d-frame" x="360" y="215" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="25" font-weight="700" text-anchor="start">21 / 23 Oct 2026</text><text data-panel="sc-reserve-en-rule-d-frame" x="360" y="251" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="23" font-weight="400" text-anchor="start">Final rule</text><text data-panel="sc-reserve-en-rule-d-frame" x="760" y="215" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="25" font-weight="700" text-anchor="start">18 Jan 2027</text><text data-panel="sc-reserve-en-rule-d-frame" x="760" y="251" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="23" font-weight="400" text-anchor="start">Effective</text><line x1="40" y1="278" x2="960" y2="278" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="sc-reserve-en-rule-d-frame" x="40" y="326" fill="var(--color-accent)" font-family="l0g Stablecoin Reserves" font-size="25" font-weight="700" text-anchor="start">Proposed presumption removed.</text><text data-panel="sc-reserve-en-rule-d-frame" x="40" y="362" fill="var(--color-accent)" font-family="l0g Stablecoin Reserves" font-size="25" font-weight="700" text-anchor="start">The issuer prohibition remains.</text><text data-panel="sc-reserve-en-rule-d-frame" x="145" y="430" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="24" font-weight="700" text-anchor="middle">ISSUER</text><text data-panel="sc-reserve-en-rule-d-frame" x="500" y="430" fill="var(--color-amber)" font-family="l0g Stablecoin Reserves" font-size="24" font-weight="700" text-anchor="middle">PLATFORM / AGENT?</text><text data-panel="sc-reserve-en-rule-d-frame" x="875" y="430" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="24" font-weight="700" text-anchor="middle">HOLDER</text><line x1="245" y1="423" x2="320" y2="423" stroke="var(--color-signal)" stroke-width="3"/><path d="M 311 417 L 320 423 L 311 429" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="690" y1="423" x2="770" y2="423" stroke="var(--color-signal)" stroke-width="3"/><path d="M 761 417 L 770 423 L 761 429" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="sc-reserve-en-rule-d-frame" x="500" y="518" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="26" font-weight="400" text-anchor="middle">Who bears the payment, and what does it purchase?</text><text data-panel="sc-reserve-en-rule-d-frame" x="500" y="566" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="26" font-weight="400" text-anchor="middle">Contracts + actual flows → legal classification</text><line x1="40" y1="638" x2="960" y2="638" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="sc-reserve-en-rule-d-frame" x="40" y="670" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="400" text-anchor="start">L01 · L02 · L04 | Analytical guide</text></svg>
