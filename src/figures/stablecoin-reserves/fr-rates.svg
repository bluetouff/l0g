<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sc-reserve-fr-rates-d-title sc-reserve-fr-rates-d-desc" viewBox="0 0 1000 700" style="width:100%;height:auto" class="l0g-stablecoin-reserve-svg"><title id="sc-reserve-fr-rates-d-title">Les taux modifient le revenu des réserves</title><desc id="sc-reserve-fr-rates-d-desc">Circle, T2 2025 et T2 2026 : encours moyen 61 039 et 76 524 millions de dollars ; revenu de réserve 634,274 et 667,733 millions ; rendement publié arrondi 4,1 % et 3,5 %. Circle rapporte une baisse de 66 points de base ; les taux affichés sont arrondis. Le second panneau montre un scénario distinct : moins 100 points de base pendant douze mois à compter du 1er juillet 2026, à encours et composition constants au 30 juin. Effets publiés : revenu moins 737 millions, coûts de distribution et transaction moins 360 millions, effet arithmétique après ces coûts moins 377 millions avant autres postes. Sources : F01.</desc><rect id="sc-reserve-fr-rates-d-frame" x="0" y="0" width="1000" height="700" fill="var(--color-ink)"/><text data-panel="sc-reserve-fr-rates-d-frame" x="40" y="42" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="700" text-anchor="start">l0g / STABLECOINS</text><text data-panel="sc-reserve-fr-rates-d-frame" x="960" y="42" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="400" text-anchor="end">03 / 07</text><text data-panel="sc-reserve-fr-rates-d-frame" x="40" y="94" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="32" font-weight="700" text-anchor="start">Les taux modifient le revenu des réserves</text><text data-panel="sc-reserve-fr-rates-d-frame" x="40" y="145" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="400" text-anchor="start">Circle · comptes T2 et sensibilité publiée</text><rect id="sc-reserve-fr-rates-d-card-observations" x="30" y="180" width="450" height="430" fill="var(--color-ink)"/><rect id="sc-reserve-fr-rates-d-card-sensitivity" x="540" y="180" width="430" height="430" fill="var(--color-ink)"/><text data-panel="sc-reserve-fr-rates-d-card-observations" x="40" y="215" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="23" font-weight="700" text-anchor="start">ENCOURS MOYEN · M$</text><text data-panel="sc-reserve-fr-rates-d-card-observations" x="40" y="262" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="24" font-weight="700" text-anchor="start">2025 T2</text><text data-panel="sc-reserve-fr-rates-d-card-observations" x="440" y="262" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="26" font-weight="700" text-anchor="end">61 039</text><rect data-metric="circulation-2025" data-value="61039" x="40" y="278" width="305.195" height="17" fill="var(--color-signal)"/><text data-panel="sc-reserve-fr-rates-d-card-observations" x="40" y="322" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="400" text-anchor="start">4,1 % · revenu 634,274 M$</text><text data-panel="sc-reserve-fr-rates-d-card-observations" x="40" y="354" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="24" font-weight="700" text-anchor="start">2026 T2</text><text data-panel="sc-reserve-fr-rates-d-card-observations" x="440" y="354" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="26" font-weight="700" text-anchor="end">76 524</text><rect data-metric="circulation-2026" data-value="76524" x="40" y="370" width="382.62" height="17" fill="var(--color-amber)"/><text data-panel="sc-reserve-fr-rates-d-card-observations" x="40" y="414" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="400" text-anchor="start">3,5 % · revenu 667,733 M$</text><text data-panel="sc-reserve-fr-rates-d-card-observations" x="40" y="490" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="23" font-weight="400" text-anchor="start">Rendements arrondis</text><text data-panel="sc-reserve-fr-rates-d-card-observations" x="40" y="525" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="23" font-weight="400" text-anchor="start">Baisse publiée : 66 points de base</text><text data-panel="sc-reserve-fr-rates-d-card-sensitivity" x="560" y="215" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="700" text-anchor="start">SCÉNARIO · −1 POINT · 12 MOIS</text><text data-panel="sc-reserve-fr-rates-d-card-sensitivity" x="560" y="270" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="24" font-weight="700" text-anchor="start">Revenu</text><text data-panel="sc-reserve-fr-rates-d-card-sensitivity" x="960" y="270" fill="var(--color-accent)" font-family="l0g Stablecoin Reserves" font-size="26" font-weight="700" text-anchor="end">−737 M$</text><rect data-metric="sensitivity-income" data-value="-737" x="582.44375" y="288" width="262.55625" height="17" fill="var(--color-accent)"/><text data-panel="sc-reserve-fr-rates-d-card-sensitivity" x="560" y="343" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="24" font-weight="700" text-anchor="start">Coûts</text><text data-panel="sc-reserve-fr-rates-d-card-sensitivity" x="960" y="343" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="26" font-weight="700" text-anchor="end">−360 M$</text><rect data-metric="sensitivity-costs" data-value="-360" x="716.75" y="361" width="128.25" height="17" fill="var(--color-muted)"/><text data-panel="sc-reserve-fr-rates-d-card-sensitivity" x="560" y="416" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="24" font-weight="700" text-anchor="start">Après coûts</text><text data-panel="sc-reserve-fr-rates-d-card-sensitivity" x="960" y="416" fill="var(--color-amber)" font-family="l0g Stablecoin Reserves" font-size="26" font-weight="700" text-anchor="end">−377 M$</text><rect data-metric="sensitivity-subtotal" data-value="-377" x="710.69375" y="434" width="134.30625" height="17" fill="var(--color-amber)"/><text data-panel="sc-reserve-fr-rates-d-card-sensitivity" x="560" y="527" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="23" font-weight="400" text-anchor="start">−737 − (−360) = −377 M$</text><text data-panel="sc-reserve-fr-rates-d-card-sensitivity" x="560" y="567" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="23" font-weight="400" text-anchor="start">Encours et composition constants</text><line x1="40" y1="638" x2="960" y2="638" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="sc-reserve-fr-rates-d-frame" x="40" y="670" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="400" text-anchor="start">F01 | Observations et modèle distincts</text></svg>
