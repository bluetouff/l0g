<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sc-reserve-fr-accounts-m-title sc-reserve-fr-accounts-m-desc" viewBox="0 0 420 850" style="width:100%;height:auto" class="l0g-stablecoin-reserve-svg"><title id="sc-reserve-fr-accounts-m-title">Circle et Coinbase : les flux</title><desc id="sc-reserve-fr-accounts-m-desc">Deux panneaux financiers au T2 2026, en millions de dollars et à échelle commune de zéro à 750. Circle : 667,733 de revenu de réserve plus 33,582 d’autres revenus, soit 701,315 ; moins 410,414 de distribution et transaction et 2,056 d’autres coûts, soit un RLDC de 288,845 avant charges opérationnelles. Les 324,6 liés à l’accord Coinbase sont inclus dans les 410,414. Coinbase : revenu stablecoins 292,147 ; récompenses USDC 119,108 en frais commerciaux et marketing ; différence arithmétique 173,039, distincte du bénéfice. Les périmètres ne permettent pas de relier directement 324,6 à 292,147. Sources : F01, F02.</desc><rect id="sc-reserve-fr-accounts-m-frame" x="0" y="0" width="420" height="850" fill="var(--color-ink)"/><text data-panel="sc-reserve-fr-accounts-m-frame" x="22" y="35" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="700" text-anchor="start">l0g / STABLECOINS</text><text data-panel="sc-reserve-fr-accounts-m-frame" x="398" y="35" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="end">02 / 07</text><text data-panel="sc-reserve-fr-accounts-m-frame" x="22" y="76" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="25" font-weight="700" text-anchor="start">Circle et Coinbase : les</text><text data-panel="sc-reserve-fr-accounts-m-frame" x="22" y="108" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="25" font-weight="700" text-anchor="start">flux</text><text data-panel="sc-reserve-fr-accounts-m-frame" x="22" y="149" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="start">T2 2026 · millions de dollars ·</text><text data-panel="sc-reserve-fr-accounts-m-frame" x="22" y="172" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="start">échelle 0–750</text><rect id="sc-reserve-fr-accounts-m-card-circle" x="22" y="190" width="376" height="315" fill="var(--color-ink)"/><rect id="sc-reserve-fr-accounts-m-card-coinbase" x="22" y="500" width="376" height="277" fill="var(--color-ink)"/><text data-panel="sc-reserve-fr-accounts-m-card-circle" x="28" y="220" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="23" font-weight="700" text-anchor="start">CIRCLE</text><text data-panel="sc-reserve-fr-accounts-m-card-circle" x="28" y="260" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="20" font-weight="700" text-anchor="start">Revenus : 701,315</text><rect data-metric="circle-reserve" data-value="667.733" x="28" y="278" width="324.073083" height="18" fill="var(--color-signal)"/><rect data-metric="circle-other-revenue" data-value="33.582" x="352.073083" y="278" width="16.298464" height="18" fill="var(--color-amber)"/><rect data-metric="circle-distribution" data-value="410.414" x="28.0" y="324" width="199.187595" height="18" fill="var(--color-accent)"/><rect data-metric="circle-other-costs" data-value="2.056" x="227.187595" y="324" width="0.997845" height="18" fill="var(--color-amber)"/><rect data-metric="circle-rldc" data-value="288.845" x="228.18544" y="324" width="140.186107" height="18" fill="var(--color-signal)"/><text data-panel="sc-reserve-fr-accounts-m-card-circle" x="28" y="383" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="19" font-weight="400" text-anchor="start">Distribution : 410,414</text><text data-panel="sc-reserve-fr-accounts-m-card-circle" x="28" y="411" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="19" font-weight="400" text-anchor="start">Autres coûts : 2,056</text><text data-panel="sc-reserve-fr-accounts-m-card-circle" x="28" y="439" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="19" font-weight="400" text-anchor="start">RLDC : 288,845</text><text data-panel="sc-reserve-fr-accounts-m-card-circle" x="28" y="496" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="start">Accord Coinbase : 324,6 inclus</text><text data-panel="sc-reserve-fr-accounts-m-card-circle" x="28" y="466" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="start">Réserve 667,733 + autres 33,582</text><text data-panel="sc-reserve-fr-accounts-m-card-coinbase" x="28" y="530" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="23" font-weight="700" text-anchor="start">COINBASE</text><text data-panel="sc-reserve-fr-accounts-m-card-coinbase" x="28" y="570" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="20" font-weight="700" text-anchor="start">Revenus : 292,147</text><rect data-metric="coinbase-revenue" data-value="292.147" x="28" y="588" width="141.788677" height="18" fill="var(--color-signal)"/><rect data-metric="coinbase-rewards" data-value="119.108" x="28" y="634" width="57.807083" height="18" fill="var(--color-accent)"/><rect data-metric="coinbase-subtotal" data-value="173.039" x="85.807083" y="634" width="83.981595" height="18" fill="var(--color-amber)"/><text data-panel="sc-reserve-fr-accounts-m-card-coinbase" x="28" y="693" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="19" font-weight="400" text-anchor="start">Récompenses : 119,108</text><text data-panel="sc-reserve-fr-accounts-m-card-coinbase" x="28" y="721" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="19" font-weight="400" text-anchor="start">Solde partiel : 173,039</text><line x1="22" y1="788" x2="398" y2="788" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="sc-reserve-fr-accounts-m-frame" x="22" y="820" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="start">F01 · F02 | Solde avant autres charges</text></svg>
