<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sc-reserve-en-jurisdictions-d-title sc-reserve-en-jurisdictions-d-desc" viewBox="0 0 1000 700" style="width:100%;height:auto" class="l0g-stablecoin-reserve-svg"><title id="sc-reserve-en-jurisdictions-d-title">US and EU rules cover different payers</title><desc id="sc-reserve-en-jurisdictions-d-desc">Targeted comparison. United States: GENIUS and the OCC rule cover yield paid by a permitted or foreign issuer solely in connection with holding, use or retention of a payment stablecoin; an agent may act on its behalf and indirect arrangements are assessed on their facts. European Union: MiCA Article 50 names both the EMT issuer and crypto-asset service provider; certain holding-duration-related benefits count as interest. Article 40 provides similar ART provisions. These European provisions apply from 30 June 2024. Jurisdiction, product and payer’s role determine the analysis. Sources: L01, L03, M06.</desc><rect id="sc-reserve-en-jurisdictions-d-frame" x="0" y="0" width="1000" height="700" fill="var(--color-ink)"/><text data-panel="sc-reserve-en-jurisdictions-d-frame" x="40" y="42" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="700" text-anchor="start">l0g / STABLECOINS</text><text data-panel="sc-reserve-en-jurisdictions-d-frame" x="960" y="42" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="400" text-anchor="end">07 / 07</text><text data-panel="sc-reserve-en-jurisdictions-d-frame" x="40" y="94" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="32" font-weight="700" text-anchor="start">US and EU rules cover different payers</text><text data-panel="sc-reserve-en-jurisdictions-d-frame" x="40" y="145" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="400" text-anchor="start">Selected scopes · stablecoin-related interest</text><text data-panel="sc-reserve-en-jurisdictions-d-frame" x="470" y="225" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="25" font-weight="700" text-anchor="middle">ISSUER</text><text data-panel="sc-reserve-en-jurisdictions-d-frame" x="815" y="225" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="25" font-weight="700" text-anchor="middle">DISTRIBUTOR</text><text data-panel="sc-reserve-en-jurisdictions-d-frame" x="40" y="315" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="25" font-weight="700" text-anchor="start">UNITED STATES</text><text data-panel="sc-reserve-en-jurisdictions-d-frame" x="40" y="352" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="400" text-anchor="start">18 Jan 2027</text><line x1="40" y1="382" x2="960" y2="382" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="sc-reserve-en-jurisdictions-d-frame" x="40" y="460" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="25" font-weight="700" text-anchor="start">EUROPEAN UNION</text><text data-panel="sc-reserve-en-jurisdictions-d-frame" x="40" y="497" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="400" text-anchor="start">30 Jun 2024</text><line x1="40" y1="527" x2="960" y2="527" stroke="var(--color-line-strong)" stroke-width="2"/><circle cx="470" cy="281" r="8" fill="var(--color-accent)"/><text data-panel="sc-reserve-en-jurisdictions-d-frame" x="470" y="324" fill="var(--color-accent)" font-family="l0g Stablecoin Reserves" font-size="24" font-weight="700" text-anchor="middle">Prohibited</text><circle cx="815" cy="281" r="8" fill="var(--color-amber)"/><text data-panel="sc-reserve-en-jurisdictions-d-frame" x="815" y="324" fill="var(--color-amber)" font-family="l0g Stablecoin Reserves" font-size="24" font-weight="700" text-anchor="middle">Contracts and facts</text><circle cx="470" cy="426" r="8" fill="var(--color-accent)"/><text data-panel="sc-reserve-en-jurisdictions-d-frame" x="470" y="469" fill="var(--color-accent)" font-family="l0g Stablecoin Reserves" font-size="24" font-weight="700" text-anchor="middle">Prohibited</text><circle cx="815" cy="426" r="8" fill="var(--color-accent)"/><text data-panel="sc-reserve-en-jurisdictions-d-frame" x="815" y="469" fill="var(--color-accent)" font-family="l0g Stablecoin Reserves" font-size="24" font-weight="700" text-anchor="middle">Prohibited</text><text data-panel="sc-reserve-en-jurisdictions-d-frame" x="40" y="581" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="24" font-weight="400" text-anchor="start">US: GENIUS + OCC; EU: MiCA, Articles 40 and 50.</text><line x1="40" y1="638" x2="960" y2="638" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="sc-reserve-en-jurisdictions-d-frame" x="40" y="670" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="400" text-anchor="start">L01 · L03 · M06 | Covered products</text></svg>
