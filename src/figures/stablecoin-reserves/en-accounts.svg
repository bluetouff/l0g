<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sc-reserve-en-accounts-d-title sc-reserve-en-accounts-d-desc" viewBox="0 0 1000 700" style="width:100%;height:auto" class="l0g-stablecoin-reserve-svg"><title id="sc-reserve-en-accounts-d-title">Circle and Coinbase report different scopes</title><desc id="sc-reserve-en-accounts-d-desc">Two Q2 2026 financial panels, USD millions, on a common zero-to-750 scale. Circle: reserve income 667.733 plus other revenue 33.582 equals 701.315; less distribution and transaction costs 410.414 and other costs 2.056 leaves RLDC 288.845 before operating expenses. Coinbase-agreement costs of 324.6 are included within 410.414. Coinbase: stablecoin revenue 292.147; USDC rewards 119.108 in sales and marketing; arithmetic difference 173.039, distinct from profit. Different reporting scopes prevent a direct bridge from 324.6 to 292.147. Sources: F01, F02.</desc><rect id="sc-reserve-en-accounts-d-frame" x="0" y="0" width="1000" height="700" fill="var(--color-ink)"/><text data-panel="sc-reserve-en-accounts-d-frame" x="40" y="42" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="700" text-anchor="start">l0g / STABLECOINS</text><text data-panel="sc-reserve-en-accounts-d-frame" x="960" y="42" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="400" text-anchor="end">02 / 07</text><text data-panel="sc-reserve-en-accounts-d-frame" x="40" y="94" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="32" font-weight="700" text-anchor="start">Circle and Coinbase report different scopes</text><text data-panel="sc-reserve-en-accounts-d-frame" x="40" y="145" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="400" text-anchor="start">Q2 2026 · USD million · common 0–750 scale</text><rect id="sc-reserve-en-accounts-d-card-circle" x="30" y="180" width="460" height="438" fill="var(--color-ink)"/><rect id="sc-reserve-en-accounts-d-card-coinbase" x="550" y="180" width="420" height="438" fill="var(--color-ink)"/><text data-panel="sc-reserve-en-accounts-d-card-circle" x="40" y="215" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="28" font-weight="700" text-anchor="start">CIRCLE</text><text data-panel="sc-reserve-en-accounts-d-card-circle" x="40" y="255" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="24" font-weight="700" text-anchor="start">Revenue: 701.315</text><rect data-metric="circle-reserve" data-value="667.733" x="40" y="273" width="356.124267" height="18" fill="var(--color-signal)"/><rect data-metric="circle-other-revenue" data-value="33.582" x="396.124267" y="273" width="17.9104" height="18" fill="var(--color-amber)"/><rect data-metric="circle-distribution" data-value="410.414" x="40.0" y="319" width="218.887467" height="18" fill="var(--color-accent)"/><rect data-metric="circle-other-costs" data-value="2.056" x="258.887467" y="319" width="1.096533" height="18" fill="var(--color-amber)"/><rect data-metric="circle-rldc" data-value="288.845" x="259.984" y="319" width="154.050667" height="18" fill="var(--color-signal)"/><text data-panel="sc-reserve-en-accounts-d-card-circle" x="40" y="378" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="24" font-weight="400" text-anchor="start">Distribution: 410.414</text><text data-panel="sc-reserve-en-accounts-d-card-circle" x="40" y="416" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="24" font-weight="400" text-anchor="start">Other costs: 2.056</text><text data-panel="sc-reserve-en-accounts-d-card-circle" x="40" y="454" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="24" font-weight="400" text-anchor="start">RLDC: 288.845</text><text data-panel="sc-reserve-en-accounts-d-card-circle" x="40" y="517" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="400" text-anchor="start">Coinbase agreement: 324.6 included</text><text data-panel="sc-reserve-en-accounts-d-card-circle" x="40" y="567" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="400" text-anchor="start">Reserve: 667.733; other: 33.582</text><text data-panel="sc-reserve-en-accounts-d-card-coinbase" x="560" y="215" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="28" font-weight="700" text-anchor="start">COINBASE</text><text data-panel="sc-reserve-en-accounts-d-card-coinbase" x="560" y="255" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="24" font-weight="700" text-anchor="start">Revenue: 292.147</text><rect data-metric="coinbase-revenue" data-value="292.147" x="560" y="273" width="155.811733" height="18" fill="var(--color-signal)"/><rect data-metric="coinbase-rewards" data-value="119.108" x="560" y="319" width="63.524267" height="18" fill="var(--color-accent)"/><rect data-metric="coinbase-subtotal" data-value="173.039" x="623.524267" y="319" width="92.287467" height="18" fill="var(--color-amber)"/><text data-panel="sc-reserve-en-accounts-d-card-coinbase" x="560" y="378" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="24" font-weight="400" text-anchor="start">Rewards: 119.108</text><text data-panel="sc-reserve-en-accounts-d-card-coinbase" x="560" y="416" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="24" font-weight="400" text-anchor="start">Partial subtotal: 173.039</text><text data-panel="sc-reserve-en-accounts-d-card-coinbase" x="560" y="498" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="23" font-weight="400" text-anchor="start">Before other expenses</text><text data-panel="sc-reserve-en-accounts-d-card-coinbase" x="560" y="536" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="23" font-weight="400" text-anchor="start">Different accounting scopes</text><line x1="40" y1="638" x2="960" y2="638" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="sc-reserve-en-accounts-d-frame" x="40" y="670" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="400" text-anchor="start">F01 · F02 | Before other expenses</text></svg>
