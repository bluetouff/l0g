<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sc-reserve-en-reserve-d-title sc-reserve-en-reserve-d-desc" viewBox="0 0 1000 700" style="width:100%;height:auto" class="l0g-stablecoin-reserve-svg"><title id="sc-reserve-en-reserve-d-title">Reserve capital produces an income stream</title><desc id="sc-reserve-en-reserve-d-desc">Fictional example: a one-thousand-dollar subscription gives the customer one thousand USDC and the issuer one thousand dollars in reserves. Reserve assets match the redemption obligation. A hypothetical 4% simple annual rate generates forty dollars of gross income over twelve months. Principal stays covered; costs, buffers and contractual sharing determine surplus. Circle’s non-EEA terms give holders no entitlement to reserve interest. Sources: P02, L01.</desc><rect id="sc-reserve-en-reserve-d-frame" x="0" y="0" width="1000" height="700" fill="var(--color-ink)"/><text data-panel="sc-reserve-en-reserve-d-frame" x="40" y="42" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="700" text-anchor="start">l0g / STABLECOINS</text><text data-panel="sc-reserve-en-reserve-d-frame" x="960" y="42" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="400" text-anchor="end">01 / 07</text><text data-panel="sc-reserve-en-reserve-d-frame" x="40" y="94" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="32" font-weight="700" text-anchor="start">Reserve capital produces an income stream</text><text data-panel="sc-reserve-en-reserve-d-frame" x="40" y="145" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="400" text-anchor="start">Fictional example · $1,000 · simple annual interest</text><text data-panel="sc-reserve-en-reserve-d-frame" x="40" y="223" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="26" font-weight="700" text-anchor="start">Reserve assets</text><text data-panel="sc-reserve-en-reserve-d-frame" x="40" y="275" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="42" font-weight="700" text-anchor="start">$1,000</text><line x1="40" y1="306" x2="430" y2="306" stroke="var(--color-signal)" stroke-width="12"/><text data-panel="sc-reserve-en-reserve-d-frame" x="570" y="223" fill="var(--color-accent)" font-family="l0g Stablecoin Reserves" font-size="26" font-weight="700" text-anchor="start">USDC redemption liability</text><text data-panel="sc-reserve-en-reserve-d-frame" x="570" y="275" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="42" font-weight="700" text-anchor="start">$1,000</text><line x1="570" y1="306" x2="960" y2="306" stroke="var(--color-accent)" stroke-width="12"/><text data-panel="sc-reserve-en-reserve-d-frame" x="500" y="276" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="32" font-weight="700" text-anchor="middle">=</text><line x1="500" y1="332" x2="500" y2="382" stroke="var(--color-signal)" stroke-width="3"/><path d="M 494 373 L 500 382 L 506 373" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="sc-reserve-en-reserve-d-frame" x="500" y="432" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="32" font-weight="700" text-anchor="middle">12 months at 4% → $40 gross income</text><text data-panel="sc-reserve-en-reserve-d-frame" x="500" y="505" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="25" font-weight="400" text-anchor="middle">Principal stays covered; surplus follows costs and requirements.</text><text data-panel="sc-reserve-en-reserve-d-frame" x="500" y="551" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="25" font-weight="400" text-anchor="middle">Contracts determine how income is shared.</text><line x1="40" y1="638" x2="960" y2="638" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="sc-reserve-en-reserve-d-frame" x="40" y="670" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="400" text-anchor="start">P02 · L01 | Fictional example</text></svg>
