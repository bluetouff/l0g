<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sc-reserve-fr-redemption-d-title sc-reserve-fr-redemption-d-desc" viewBox="0 0 1000 700" style="width:100%;height:auto" class="l0g-stablecoin-reserve-svg"><title id="sc-reserve-fr-redemption-d-title">Du token au remboursement bancaire</title><desc id="sc-reserve-fr-redemption-d-desc">Le mouvement du token sur un réseau et sa conversion auprès de l’émetteur suivent des étapes différentes. Dans la règle OCC applicable le 18 janvier 2027 : ordre reçu du client et conditions d’onboarding et légales satisfaites déclenchent l’obligation ; délai de deux jours ouvrés jusqu’au traitement complet et à l’initiation du transfert sortant. À la demande du client, un crédit sur compte chez l’émetteur est aussi prévu. L’arrivée dans la banque externe dépend du circuit. Un intermédiaire peut ajouter sa propre étape d’accès. Des demandes excédant 10 % de l’encours d’une marque en 24 heures déclenchent notification et possible demande d’extension, décidée par l’OCC. Sources : L01.</desc><rect id="sc-reserve-fr-redemption-d-frame" x="0" y="0" width="1000" height="700" fill="var(--color-ink)"/><text data-panel="sc-reserve-fr-redemption-d-frame" x="40" y="42" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="700" text-anchor="start">l0g / STABLECOINS</text><text data-panel="sc-reserve-fr-redemption-d-frame" x="960" y="42" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="400" text-anchor="end">06 / 07</text><text data-panel="sc-reserve-fr-redemption-d-frame" x="40" y="94" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="32" font-weight="700" text-anchor="start">Du token au remboursement bancaire</text><text data-panel="sc-reserve-fr-redemption-d-frame" x="40" y="145" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="400" text-anchor="start">Règle OCC · applicable le 18 janvier 2027</text><text data-panel="sc-reserve-fr-redemption-d-frame" x="40" y="230" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="25" font-weight="700" text-anchor="start">Ordre admissible</text><text data-panel="sc-reserve-fr-redemption-d-frame" x="40" y="266" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="25" font-weight="700" text-anchor="start">chez l’émetteur</text><text data-panel="sc-reserve-fr-redemption-d-frame" x="400" y="230" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="25" font-weight="700" text-anchor="start">Virement traité</text><text data-panel="sc-reserve-fr-redemption-d-frame" x="400" y="266" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="25" font-weight="700" text-anchor="start">et initié</text><text data-panel="sc-reserve-fr-redemption-d-frame" x="760" y="230" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="25" font-weight="700" text-anchor="start">Banque externe</text><text data-panel="sc-reserve-fr-redemption-d-frame" x="760" y="266" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="25" font-weight="700" text-anchor="start">Fonds reçus</text><line x1="130" y1="310" x2="510" y2="310" stroke="var(--color-signal)" stroke-width="3"/><path d="M 501 304 L 510 310 L 501 316" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="sc-reserve-fr-redemption-d-frame" x="320" y="357" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="26" font-weight="700" text-anchor="middle">2 jours ouvrés max</text><line x1="550" y1="310" x2="855" y2="310" stroke="var(--color-muted)" stroke-width="3"/><path d="M 846 304 L 855 310 L 846 316" fill="none" stroke="var(--color-muted)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="sc-reserve-fr-redemption-d-frame" x="720" y="357" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="24" font-weight="400" text-anchor="middle">Selon le circuit</text><text data-panel="sc-reserve-fr-redemption-d-frame" x="400" y="419" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="24" font-weight="400" text-anchor="middle">Ou crédit chez l’émetteur, à la demande du client.</text><text data-panel="sc-reserve-fr-redemption-d-frame" x="40" y="502" fill="var(--color-amber)" font-family="l0g Stablecoin Reserves" font-size="26" font-weight="700" text-anchor="start">Demandes &gt; 10 % de l’encours en 24 h → notification OCC</text><text data-panel="sc-reserve-fr-redemption-d-frame" x="40" y="550" fill="var(--color-amber)" font-family="l0g Stablecoin Reserves" font-size="26" font-weight="700" text-anchor="start">Une extension dépend de la décision du superviseur.</text><line x1="40" y1="638" x2="960" y2="638" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="sc-reserve-fr-redemption-d-frame" x="40" y="670" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="400" text-anchor="start">L01 | Délai légal et circuit bancaire</text></svg>
