<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sc-reserve-fr-deposits-d-title sc-reserve-fr-deposits-d-desc" viewBox="0 0 1000 700" style="width:100%;height:auto" class="l0g-stablecoin-reserve-svg"><title id="sc-reserve-fr-deposits-d-title">Un dépôt circule entre trois banques</title><desc id="sc-reserve-fr-deposits-d-desc">Circuit fictif de mille dollars : à l’origine, le client a un dépôt de mille dollars en banque A ; après émission primaire du stablecoin, l’émetteur a le dépôt en banque B et le client mille USDC ; après achat secondaire d’un bon du Trésor à un vendeur non bancaire, celui-ci a le dépôt en banque C, l’émetteur le titre et le client les USDC. Les dépôts du circuit restent de mille dollars à chacune des trois étapes. Le cas n’est pas une loi universelle : vendeur bancaire, compte du Trésor et reverse repo de la Fed donnent d’autres circuits. Sources : M01, M02, M05.</desc><rect id="sc-reserve-fr-deposits-d-frame" x="0" y="0" width="1000" height="700" fill="var(--color-ink)"/><text data-panel="sc-reserve-fr-deposits-d-frame" x="40" y="42" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="700" text-anchor="start">l0g / STABLECOINS</text><text data-panel="sc-reserve-fr-deposits-d-frame" x="960" y="42" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="400" text-anchor="end">05 / 07</text><text data-panel="sc-reserve-fr-deposits-d-frame" x="40" y="94" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="32" font-weight="700" text-anchor="start">Un dépôt circule entre trois banques</text><text data-panel="sc-reserve-fr-deposits-d-frame" x="40" y="145" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="400" text-anchor="start">Scénario fictif · 1 000 $ · achat secondaire</text><rect id="sc-reserve-fr-deposits-d-card-snapshot-1" x="30" y="180" width="300" height="207" fill="var(--color-ink)"/><text data-panel="sc-reserve-fr-deposits-d-card-snapshot-1" x="40" y="225" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="24" font-weight="700" text-anchor="start">1. Client</text><text data-panel="sc-reserve-fr-deposits-d-card-snapshot-1" x="40" y="304" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="40" font-weight="700" text-anchor="start">1 000 $</text><line x1="40" y1="334" x2="310" y2="334" stroke="var(--color-signal)" stroke-width="12"/><text data-panel="sc-reserve-fr-deposits-d-card-snapshot-1" x="40" y="377" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="23" font-weight="400" text-anchor="start">Dépôt en banque A</text><line x1="314" y1="297" x2="349" y2="297" stroke="var(--color-signal)" stroke-width="3"/><path d="M 340 291 L 349 297 L 340 303" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect id="sc-reserve-fr-deposits-d-card-snapshot-2" x="355" y="180" width="300" height="207" fill="var(--color-ink)"/><text data-panel="sc-reserve-fr-deposits-d-card-snapshot-2" x="365" y="225" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="24" font-weight="700" text-anchor="start">2. Émetteur</text><text data-panel="sc-reserve-fr-deposits-d-card-snapshot-2" x="365" y="304" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="40" font-weight="700" text-anchor="start">1 000 $</text><line x1="365" y1="334" x2="635" y2="334" stroke="var(--color-signal)" stroke-width="12"/><text data-panel="sc-reserve-fr-deposits-d-card-snapshot-2" x="365" y="377" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="23" font-weight="400" text-anchor="start">Dépôt en banque B</text><line x1="639" y1="297" x2="674" y2="297" stroke="var(--color-signal)" stroke-width="3"/><path d="M 665 291 L 674 297 L 665 303" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect id="sc-reserve-fr-deposits-d-card-snapshot-3" x="680" y="180" width="300" height="207" fill="var(--color-ink)"/><text data-panel="sc-reserve-fr-deposits-d-card-snapshot-3" x="690" y="225" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="700" text-anchor="start">3. Vendeur</text><text data-panel="sc-reserve-fr-deposits-d-card-snapshot-3" x="690" y="254" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="700" text-anchor="start">non bancaire</text><text data-panel="sc-reserve-fr-deposits-d-card-snapshot-3" x="690" y="304" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="40" font-weight="700" text-anchor="start">1 000 $</text><line x1="690" y1="334" x2="960" y2="334" stroke="var(--color-signal)" stroke-width="12"/><text data-panel="sc-reserve-fr-deposits-d-card-snapshot-3" x="690" y="377" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="23" font-weight="400" text-anchor="start">Dépôt en banque C</text><text data-panel="sc-reserve-fr-deposits-d-frame" x="202" y="430" fill="var(--color-amber)" font-family="l0g Stablecoin Reserves" font-size="24" font-weight="700" text-anchor="middle">Émission primaire</text><text data-panel="sc-reserve-fr-deposits-d-frame" x="706" y="430" fill="var(--color-amber)" font-family="l0g Stablecoin Reserves" font-size="24" font-weight="700" text-anchor="middle">Achat secondaire du bon du Trésor</text><text data-panel="sc-reserve-fr-deposits-d-frame" x="40" y="510" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="23" font-weight="400" text-anchor="start">Au terme du circuit : client = USDC ; émetteur = titre public ; vendeur = dépôt.</text><text data-panel="sc-reserve-fr-deposits-d-frame" x="40" y="556" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="23" font-weight="400" text-anchor="start">Chaque étape est une photographie ; le total suivi reste 1 000 $.</text><line x1="40" y1="638" x2="960" y2="638" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="sc-reserve-fr-deposits-d-frame" x="40" y="670" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="400" text-anchor="start">M01 · M02 · M05 | Scénario conditionnel</text></svg>
