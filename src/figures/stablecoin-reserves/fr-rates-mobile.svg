<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sc-reserve-fr-rates-m-title sc-reserve-fr-rates-m-desc" viewBox="0 0 420 850" style="width:100%;height:auto" class="l0g-stablecoin-reserve-svg"><title id="sc-reserve-fr-rates-m-title">L’encours et le rendement</title><desc id="sc-reserve-fr-rates-m-desc">Circle, T2 2025 et T2 2026 : encours moyen 61 039 et 76 524 millions de dollars ; revenu de réserve 634,274 et 667,733 millions ; rendement publié arrondi 4,1 % et 3,5 %. Circle rapporte une baisse de 66 points de base ; les taux affichés sont arrondis. Le second panneau montre un scénario distinct : moins 100 points de base pendant douze mois à compter du 1er juillet 2026, à encours et composition constants au 30 juin. Effets publiés : revenu moins 737 millions, coûts de distribution et transaction moins 360 millions, effet arithmétique après ces coûts moins 377 millions avant autres postes. Sources : F01.</desc><rect id="sc-reserve-fr-rates-m-frame" x="0" y="0" width="420" height="850" fill="var(--color-ink)"/><text data-panel="sc-reserve-fr-rates-m-frame" x="22" y="35" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="700" text-anchor="start">l0g / STABLECOINS</text><text data-panel="sc-reserve-fr-rates-m-frame" x="398" y="35" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="end">03 / 07</text><text data-panel="sc-reserve-fr-rates-m-frame" x="22" y="76" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="25" font-weight="700" text-anchor="start">L’encours et le rendement</text><text data-panel="sc-reserve-fr-rates-m-frame" x="22" y="117" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="start">Circle · comptes T2 et sensibilité</text><text data-panel="sc-reserve-fr-rates-m-frame" x="22" y="140" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="start">publiée</text><rect id="sc-reserve-fr-rates-m-card-observations" x="22" y="190" width="376" height="287" fill="var(--color-ink)"/><rect id="sc-reserve-fr-rates-m-card-sensitivity" x="22" y="479" width="376" height="300" fill="var(--color-ink)"/><text data-panel="sc-reserve-fr-rates-m-card-observations" x="28" y="220" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="18" font-weight="700" text-anchor="start">ENCOURS MOYEN · M$</text><text data-panel="sc-reserve-fr-rates-m-card-observations" x="28" y="267" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="19" font-weight="700" text-anchor="start">2025 T2</text><text data-panel="sc-reserve-fr-rates-m-card-observations" x="392" y="267" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="20" font-weight="700" text-anchor="end">61 039</text><rect data-metric="circulation-2025" data-value="61039" x="28" y="283" width="277.72745" height="17" fill="var(--color-signal)"/><text data-panel="sc-reserve-fr-rates-m-card-observations" x="28" y="327" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="start">4,1 % · revenu 634,274 M$</text><text data-panel="sc-reserve-fr-rates-m-card-observations" x="28" y="359" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="19" font-weight="700" text-anchor="start">2026 T2</text><text data-panel="sc-reserve-fr-rates-m-card-observations" x="392" y="359" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="20" font-weight="700" text-anchor="end">76 524</text><rect data-metric="circulation-2026" data-value="76524" x="28" y="375" width="348.1842" height="17" fill="var(--color-amber)"/><text data-panel="sc-reserve-fr-rates-m-card-observations" x="28" y="419" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="start">3,5 % · revenu 667,733 M$</text><text data-panel="sc-reserve-fr-rates-m-card-observations" x="28" y="463" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="start">Taux arrondis · baisse publiée : 66 pb</text><text data-panel="sc-reserve-fr-rates-m-card-sensitivity" x="28" y="500" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="18" font-weight="700" text-anchor="start">SCÉNARIO · −1 POINT · 12 MOIS</text><text data-panel="sc-reserve-fr-rates-m-card-sensitivity" x="28" y="555" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="18" font-weight="700" text-anchor="start">Revenu</text><text data-panel="sc-reserve-fr-rates-m-card-sensitivity" x="392" y="555" fill="var(--color-accent)" font-family="l0g Stablecoin Reserves" font-size="20" font-weight="700" text-anchor="end">−737 M$</text><rect data-metric="sensitivity-income" data-value="-737" x="47.0575" y="573" width="222.9425" height="17" fill="var(--color-accent)"/><text data-panel="sc-reserve-fr-rates-m-card-sensitivity" x="28" y="628" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="18" font-weight="700" text-anchor="start">Coûts</text><text data-panel="sc-reserve-fr-rates-m-card-sensitivity" x="392" y="628" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="20" font-weight="700" text-anchor="end">−360 M$</text><rect data-metric="sensitivity-costs" data-value="-360" x="161.1" y="646" width="108.9" height="17" fill="var(--color-muted)"/><text data-panel="sc-reserve-fr-rates-m-card-sensitivity" x="28" y="701" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="18" font-weight="700" text-anchor="start">Après coûts</text><text data-panel="sc-reserve-fr-rates-m-card-sensitivity" x="392" y="701" fill="var(--color-amber)" font-family="l0g Stablecoin Reserves" font-size="20" font-weight="700" text-anchor="end">−377 M$</text><rect data-metric="sensitivity-subtotal" data-value="-377" x="155.9575" y="719" width="114.0425" height="17" fill="var(--color-amber)"/><text data-panel="sc-reserve-fr-rates-m-card-sensitivity" x="28" y="771" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="18" font-weight="400" text-anchor="start">−737 − (−360) = −377 M$</text><line x1="22" y1="788" x2="398" y2="788" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="sc-reserve-fr-rates-m-frame" x="22" y="820" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="start">F01 | Observations et modèle distincts</text></svg>
