ed published yields</text><text data-panel="sc-reserve-en-rates-d-card-observations" x="40" y="525" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="23" font-weight="400" text-anchor="start">Reported decline: 66 basis points</text><text data-panel="sc-reserve-en-rates-d-card-sensitivity" x="560" y="215" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="700" text-anchor="start">SHOCK: −1 POINT · 12 MONTHS</text><text data-panel="sc-reserve-en-rates-d-card-sensitivity" x="560" y="270" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="24" font-weight="700" text-anchor="start">Income</text><text data-panel="sc-reserve-en-rates-d-card-sensitivity" x="960" y="270" fill="var(--color-accent)" font-family="l0g Stablecoin Reserves" font-size="26" font-weight="700" text-anchor="end">−737 $m</text><rect data-metric="sensitivity-income" data-value="-737" x="582.44375" y="288" width="262.55625" height="17" fill="var(--color-accent)"/><text data-panel="sc-reserve-en-rates-d-card-sensitivity" x="560" y="343" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="24" font-weight="700" text-anchor="start">Costs</text><text data-panel="sc-reserve-en-rates-d-card-sensitivity" x="960" y="343" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="26" font-weight="700" text-anchor="end">−360 $m</text><rect data-metric="sensitivity-costs" data-value="-360" x="716.75" y="361" width="128.25" height="17" fill="var(--color-muted)"/><text data-panel="sc-reserve-en-rates-d-card-sensitivity" x="560" y="416" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="24" font-weight="700" text-anchor="start">After costs</text><text data-panel="sc-reserve-en-rates-d-card-sensitivity" x="960" y="416" fill="var(--color-amber)" font-family="l0g Stablecoin Reserves" font-size="26" font-weight="700" text-anchor="end">−377 $m</text><rect data-metric="sensitivity-subtotal" data-value="-377" x="710.69375" y="434" width="134.30625" height="17" fill="var(--color-amber)"/><text data-panel="sc-reserve-en-rates-d-card-sensitivity" x="560" y="527" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="23" font-weight="400" text-anchor="start">−737 − (−360) = −377 $m</text><text data-panel="sc-reserve-en-rates-d-card-sensitivity" x="560" y="567" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="23" font-weight="400" text-anchor="start">Circulation and mix held fixed</text><line x1="40" y1="638" x2="960" y2="638" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="sc-reserve-en-rates-d-frame" x="40" y="670" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="400" text-anchor="start">F01 | Observations and separate model</text></svg>
