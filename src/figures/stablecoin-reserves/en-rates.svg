<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sc-reserve-en-rates-d-title sc-reserve-en-rates-d-desc" viewBox="0 0 1000 700" style="width:100%;height:auto" class="l0g-stablecoin-reserve-svg"><title id="sc-reserve-en-rates-d-title">Rates change reserve income</title><desc id="sc-reserve-en-rates-d-desc">Circle, Q2 2025 and Q2 2026: average circulation 61,039 and 76,524 USD million; reserve income 634.274 and 667.733 million; rounded published yield 4.1% and 3.5%. Circle reports a 66-basis-point decline; displayed rates are rounded. A separate scenario applies a 100-basis-point cut for twelve months from 1 July 2026 with circulation and composition held at 30 June levels. Published effects: income minus 737 million, distribution and transaction costs minus 360 million, arithmetic effect after these costs minus 377 million before other items. Sources: F01.</desc><rect id="sc-reserve-en-rates-d-frame" x="0" y="0" width="1000" height="700" fill="var(--color-ink)"/><text data-panel="sc-reserve-en-rates-d-frame" x="40" y="42" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="700" text-anchor="start">l0g / STABLECOINS</text><text data-panel="sc-reserve-en-rates-d-frame" x="960" y="42" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="400" text-anchor="end">03 / 07</text><text data-panel="sc-reserve-en-rates-d-frame" x="40" y="94" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="32" font-weight="700" text-anchor="start">Rates change reserve income</text><text data-panel="sc-reserve-en-rates-d-frame" x="40" y="145" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="400" text-anchor="start">Circle · Q2 accounts and published sensitivity</text><rect id="sc-reserve-en-rates-d-card-observations" x="30" y="180" width="450" height="430" fill="var(--color-ink)"/><rect id="sc-reserve-en-rates-d-card-sensitivity" 