<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sc-reserve-fr-deposits-m-title sc-reserve-fr-deposits-m-desc" viewBox="0 0 420 850" style="width:100%;height:auto" class="l0g-stablecoin-reserve-svg"><title id="sc-reserve-fr-deposits-m-title">Le dépôt change de banque</title><desc id="sc-reserve-fr-deposits-m-desc">Circuit fictif de mille dollars : à l’origine, le client a un dépôt de mille dollars en banque A ; après émission primaire du stablecoin, l’émetteur a le dépôt en banque B et le client mille USDC ; après achat secondaire d’un bon du Trésor à un vendeur non bancaire, celui-ci a le dépôt en banque C, l’émetteur le titre et le client les USDC. Les dépôts du circuit restent de mille dollars à chacune des trois étapes. Le cas n’est pas une loi universelle : vendeur bancaire, compte du Trésor et reverse repo de la Fed donnent d’autres circuits. Sources : M01, M02, M05.</desc><rect id="sc-reserve-fr-deposits-m-frame" x="0" y="0" width="420" height="850" fill="var(--color-ink)"/><text data-panel="sc-reserve-fr-deposits-m-frame" x="22" y="35" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="700" text-anchor="start">l0g / STABLECOINS</text><text data-panel="sc-reserve-fr-deposits-m-frame" x="398" y="35" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="end">05 / 07</text><text data-panel="sc-reserve-fr-deposits-m-frame" x="22" y="76" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="25" font-weight="700" text-anchor="start">Le dépôt change de banque</text><text data-panel="sc-reserve-fr-deposits-m-frame" x="22" y="117" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="start">Scénario fictif · 1 000 $ · achat</text><text data-panel="sc-reserve-fr-deposits-m-frame" x="22" y="140" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="start">secondaire</text><rect id="sc-reserve-fr-deposits-m-card-snapshot-1" x="22" y="200" width="376" height="108" fill="var(--color-ink)"/><text data-panel="sc-reserve-fr-deposits-m-card-snapshot-1" x="28" y="230" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="20" font-weight="700" text-anchor="start">1. Client</text><text data-panel="sc-reserve-fr-deposits-m-card-snapshot-1" x="392" y="230" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="700" text-anchor="end">1 000 $</text><line x1="28" y1="256" x2="392" y2="256" stroke="var(--color-signal)" stroke-width="10"/><text data-panel="sc-reserve-fr-deposits-m-card-snapshot-1" x="28" y="289" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="18" font-weight="400" text-anchor="start">Dépôt en banque A</text><line x1="210" y1="308" x2="210" y2="343" stroke="var(--color-signal)" stroke-width="3"/><path d="M 204 334 L 210 343 L 216 334" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="sc-reserve-fr-deposits-m-frame" x="210" y="363" fill="var(--color-amber)" font-family="l0g Stablecoin Reserves" font-size="18" font-weight="700" text-anchor="middle">Émission primaire</text><rect id="sc-reserve-fr-deposits-m-card-snapshot-2" x="22" y="366" width="376" height="108" fill="var(--color-ink)"/><text data-panel="sc-reserve-fr-deposits-m-card-snapshot-2" x="28" y="393" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="20" font-weight="700" text-anchor="start">2. Émetteur</text><text data-panel="sc-reserve-fr-deposits-m-card-snapshot-2" x="392" y="393" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="700" text-anchor="end">1 000 $</text><line x1="28" y1="419" x2="392" y2="419" stroke="var(--color-signal)" stroke-width="10"/><text data-panel="sc-reserve-fr-deposits-m-card-snapshot-2" x="28" y="452" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="18" font-weight="400" text-anchor="start">Dépôt en banque B</text><line x1="210" y1="471" x2="210" y2="506" stroke="var(--color-signal)" stroke-width="3"/><path d="M 204 497 L 210 506 L 216 497" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="sc-reserve-fr-deposits-m-frame" x="210" y="526" fill="var(--color-amber)" font-family="l0g Stablecoin Reserves" font-size="18" font-weight="700" text-anchor="middle">Achat secondaire</text><rect id="sc-reserve-fr-deposits-m-card-snapshot-3" x="22" y="532" width="376" height="108" fill="var(--color-ink)"/><text data-panel="sc-reserve-fr-deposits-m-card-snapshot-3" x="28" y="556" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="18" font-weight="700" text-anchor="start">3. Vendeur non bancaire</text><text data-panel="sc-reserve-fr-deposits-m-card-snapshot-3" x="392" y="556" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="700" text-anchor="end">1 000 $</text><line x1="28" y1="582" x2="392" y2="582" stroke="var(--color-signal)" stroke-width="10"/><text data-panel="sc-reserve-fr-deposits-m-card-snapshot-3" x="28" y="615" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="18" font-weight="400" text-anchor="start">Dépôt en banque C</text><text data-panel="sc-reserve-fr-deposits-m-frame" x="28" y="721" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="start">À la fin : USDC / bon du Trésor / dépôt</text><line x1="22" y1="788" x2="398" y2="788" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="sc-reserve-fr-deposits-m-frame" x="22" y="820" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="start">M01 · M02 · M05 | Scénario conditionnel</text></svg>
