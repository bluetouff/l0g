<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sc-reserve-fr-rule-m-title sc-reserve-fr-rule-m-desc" viewBox="0 0 420 850" style="width:100%;height:auto" class="l0g-stablecoin-reserve-svg"><title id="sc-reserve-fr-rule-m-title">Contrats et paiements</title><desc id="sc-reserve-fr-rule-m-desc">Chronologie OCC : projet publié le 2 mars 2026 ; règle finale annoncée le 21 octobre, publiée le 23 octobre ; entrée en vigueur le 18 janvier 2027. La présomption réfragable proposée est supprimée. L’interdiction visant l’émetteur et le contrôle du contournement restent. Trois questions organisent la lecture : qui paie, y compris pour le compte de l’émetteur ; quelle est la nature et la cause du paiement ; que montrent les contrats et les flux ? Le schéma décrit une méthode de lecture, sans statuer sur la légalité d’un programme particulier. Sources : L01, L02, L04.</desc><rect id="sc-reserve-fr-rule-m-frame" x="0" y="0" width="420" height="850" fill="var(--color-ink)"/><text data-panel="sc-reserve-fr-rule-m-frame" x="22" y="35" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="700" text-anchor="start">l0g / STABLECOINS</text><text data-panel="sc-reserve-fr-rule-m-frame" x="398" y="35" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="end">04 / 07</text><text data-panel="sc-reserve-fr-rule-m-frame" x="22" y="76" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="25" font-weight="700" text-anchor="start">Contrats et paiements</text><text data-panel="sc-reserve-fr-rule-m-frame" x="22" y="117" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="start">Règle OCC · publiée le 23 octobre</text><text data-panel="sc-reserve-fr-rule-m-frame" x="22" y="140" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="start">2026</text><text data-panel="sc-reserve-fr-rule-m-frame" x="28" y="220" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="19" font-weight="700" text-anchor="start">02.03.2026</text><text data-panel="sc-reserve-fr-rule-m-frame" x="392" y="220" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="end">Projet</text><text data-panel="sc-reserve-fr-rule-m-frame" x="28" y="266" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="19" font-weight="700" text-anchor="start">21 / 23.10.2026</text><text data-panel="sc-reserve-fr-rule-m-frame" x="392" y="266" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="end">Règle finale</text><text data-panel="sc-reserve-fr-rule-m-frame" x="28" y="312" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="19" font-weight="700" text-anchor="start">18.01.2027</text><text data-panel="sc-reserve-fr-rule-m-frame" x="392" y="312" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="end">Application</text><text data-panel="sc-reserve-fr-rule-m-frame" x="28" y="382" fill="var(--color-accent)" font-family="l0g Stablecoin Reserves" font-size="19" font-weight="700" text-anchor="start">Présomption proposée supprimée</text><text data-panel="sc-reserve-fr-rule-m-frame" x="210" y="452" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="700" text-anchor="middle">ÉMETTEUR</text><line x1="210" y1="472" x2="210" y2="510" stroke="var(--color-signal)" stroke-width="3"/><path d="M 204 501 L 210 510 L 216 501" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="sc-reserve-fr-rule-m-frame" x="210" y="552" fill="var(--color-amber)" font-family="l0g Stablecoin Reserves" font-size="21" font-weight="700" text-anchor="middle">PLATEFORME / AGENT ?</text><line x1="210" y1="573" x2="210" y2="612" stroke="var(--color-signal)" stroke-width="3"/><path d="M 204 603 L 210 612 L 216 603" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="sc-reserve-fr-rule-m-frame" x="210" y="653" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="700" text-anchor="middle">DÉTENTEUR</text><text data-panel="sc-reserve-fr-rule-m-frame" x="28" y="714" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="18" font-weight="400" text-anchor="start">Contrats et flux réels</text><text data-panel="sc-reserve-fr-rule-m-frame" x="28" y="741" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="18" font-weight="400" text-anchor="start">→ qualification du paiement</text><line x1="22" y1="788" x2="398" y2="788" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="sc-reserve-fr-rule-m-frame" x="22" y="820" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="start">L01 · L02 · L04 | Grille d’analyse</text></svg>
