<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sc-reserve-fr-reserve-d-title sc-reserve-fr-reserve-d-desc" viewBox="0 0 1000 700" style="width:100%;height:auto" class="l0g-stablecoin-reserve-svg"><title id="sc-reserve-fr-reserve-d-title">Le capital de réserve produit un revenu</title><desc id="sc-reserve-fr-reserve-d-desc">Exemple fictif : mille dollars versés à l’émission donnent mille USDC au client et mille dollars de réserve chez l’émetteur. Les actifs de réserve et l’obligation de rachat se font face dans son bilan. Un taux simple hypothétique de 4 % produit 40 dollars de revenu brut sur douze mois. Le principal demeure couvert ; coûts, coussins et partage contractuel déterminent le surplus. Les conditions Circle hors EEE ne donnent aucun droit aux intérêts de réserve au détenteur. Sources : P02, L01.</desc><rect id="sc-reserve-fr-reserve-d-frame" x="0" y="0" width="1000" height="700" fill="var(--color-ink)"/><text data-panel="sc-reserve-fr-reserve-d-frame" x="40" y="42" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="700" text-anchor="start">l0g / STABLECOINS</text><text data-panel="sc-reserve-fr-reserve-d-frame" x="960" y="42" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="400" text-anchor="end">01 / 07</text><text data-panel="sc-reserve-fr-reserve-d-frame" x="40" y="94" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="32" font-weight="700" text-anchor="start">Le capital de réserve produit un revenu</text><text data-panel="sc-reserve-fr-reserve-d-frame" x="40" y="145" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="400" text-anchor="start">Exemple fictif · 1 000 $ · intérêt annuel simple</text><text data-panel="sc-reserve-fr-reserve-d-frame" x="40" y="223" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="26" font-weight="700" text-anchor="start">Actifs de réserve</text><text data-panel="sc-reserve-fr-reserve-d-frame" x="40" y="275" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="42" font-weight="700" text-anchor="start">1 000 $</text><line x1="40" y1="306" x2="430" y2="306" stroke="var(--color-signal)" stroke-width="12"/><text data-panel="sc-reserve-fr-reserve-d-frame" x="570" y="223" fill="var(--color-accent)" font-family="l0g Stablecoin Reserves" font-size="26" font-weight="700" text-anchor="start">Dette de rachat USDC</text><text data-panel="sc-reserve-fr-reserve-d-frame" x="570" y="275" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="42" font-weight="700" text-anchor="start">1 000 $</text><line x1="570" y1="306" x2="960" y2="306" stroke="var(--color-accent)" stroke-width="12"/><text data-panel="sc-reserve-fr-reserve-d-frame" x="500" y="276" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="32" font-weight="700" text-anchor="middle">=</text><line x1="500" y1="332" x2="500" y2="382" stroke="var(--color-signal)" stroke-width="3"/><path d="M 494 373 L 500 382 L 506 373" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="sc-reserve-fr-reserve-d-frame" x="500" y="432" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="32" font-weight="700" text-anchor="middle">12 mois à 4 % → 40 $ de revenu brut</text><text data-panel="sc-reserve-fr-reserve-d-frame" x="500" y="505" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="25" font-weight="400" text-anchor="middle">Principal couvert ; surplus après coûts et contraintes.</text><text data-panel="sc-reserve-fr-reserve-d-frame" x="500" y="551" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="25" font-weight="400" text-anchor="middle">Le partage du revenu dépend des contrats.</text><line x1="40" y1="638" x2="960" y2="638" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="sc-reserve-fr-reserve-d-frame" x="40" y="670" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="400" text-anchor="start">P02 · L01 | Exemple fictif</text></svg>
