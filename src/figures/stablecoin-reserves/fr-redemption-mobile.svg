<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sc-reserve-fr-redemption-m-title sc-reserve-fr-redemption-m-desc" viewBox="0 0 420 850" style="width:100%;height:auto" class="l0g-stablecoin-reserve-svg"><title id="sc-reserve-fr-redemption-m-title">Le délai du remboursement</title><desc id="sc-reserve-fr-redemption-m-desc">Le mouvement du token sur un réseau et sa conversion auprès de l’émetteur suivent des étapes différentes. Dans la règle OCC applicable le 18 janvier 2027 : ordre reçu du client et conditions d’onboarding et légales satisfaites déclenchent l’obligation ; délai de deux jours ouvrés jusqu’au traitement complet et à l’initiation du transfert sortant. À la demande du client, un crédit sur compte chez l’émetteur est aussi prévu. L’arrivée dans la banque externe dépend du circuit. Un intermédiaire peut ajouter sa propre étape d’accès. Des demandes excédant 10 % de l’encours d’une marque en 24 heures déclenchent notification et possible demande d’extension, décidée par l’OCC. Sources : L01.</desc><rect id="sc-reserve-fr-redemption-m-frame" x="0" y="0" width="420" height="850" fill="var(--color-ink)"/><text data-panel="sc-reserve-fr-redemption-m-frame" x="22" y="35" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="700" text-anchor="start">l0g / STABLECOINS</text><text data-panel="sc-reserve-fr-redemption-m-frame" x="398" y="35" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="end">06 / 07</text><text data-panel="sc-reserve-fr-redemption-m-frame" x="22" y="76" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="25" font-weight="700" text-anchor="start">Le délai du remboursement</text><text data-panel="sc-reserve-fr-redemption-m-frame" x="22" y="117" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="start">Règle OCC · applicable le 18 janvier</text><text data-panel="sc-reserve-fr-redemption-m-frame" x="22" y="140" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="start">2027</text><text data-panel="sc-reserve-fr-redemption-m-frame" x="28" y="225" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="20" font-weight="700" text-anchor="start">Ordre admissible chez l’émetteur</text><line x1="210" y1="249" x2="210" y2="329" stroke="var(--color-signal)" stroke-width="3"/><path d="M 204 320 L 210 329 L 216 320" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="sc-reserve-fr-redemption-m-frame" x="234" y="277" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="18" font-weight="700" text-anchor="start">2 jours</text><text data-panel="sc-reserve-fr-redemption-m-frame" x="234" y="304" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="18" font-weight="700" text-anchor="start">ouvrés max</text><text data-panel="sc-reserve-fr-redemption-m-frame" x="210" y="377" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="19" font-weight="700" text-anchor="middle">Virement traité et initié</text><text data-panel="sc-reserve-fr-redemption-m-frame" x="210" y="406" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="19" font-weight="700" text-anchor="middle">ou crédit chez l’émetteur</text><line x1="210" y1="426" x2="210" y2="482" stroke="var(--color-signal)" stroke-width="3"/><path d="M 204 473 L 210 482 L 216 473" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="sc-reserve-fr-redemption-m-frame" x="210" y="524" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="20" font-weight="700" text-anchor="middle">Réception en banque externe</text><text data-panel="sc-reserve-fr-redemption-m-frame" x="210" y="562" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="18" font-weight="400" text-anchor="middle">Selon le circuit de paiement</text><text data-panel="sc-reserve-fr-redemption-m-frame" x="28" y="644" fill="var(--color-amber)" font-family="l0g Stablecoin Reserves" font-size="18" font-weight="700" text-anchor="start">Demandes &gt; 10 % en 24 h</text><text data-panel="sc-reserve-fr-redemption-m-frame" x="28" y="675" fill="var(--color-amber)" font-family="l0g Stablecoin Reserves" font-size="18" font-weight="700" text-anchor="start">Notification ; extension sur décision</text><text data-panel="sc-reserve-fr-redemption-m-frame" x="28" y="706" fill="var(--color-amber)" font-family="l0g Stablecoin Reserves" font-size="18" font-weight="700" text-anchor="start">de l’OCC</text><line x1="22" y1="788" x2="398" y2="788" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="sc-reserve-fr-redemption-m-frame" x="22" y="820" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="start">L01 | Délai légal et circuit bancaire</text></svg>
