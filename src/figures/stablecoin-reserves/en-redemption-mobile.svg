<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sc-reserve-en-redemption-m-title sc-reserve-en-redemption-m-desc" viewBox="0 0 420 850" style="width:100%;height:auto" class="l0g-stablecoin-reserve-svg"><title id="sc-reserve-en-redemption-m-title">The redemption deadline</title><desc id="sc-reserve-en-redemption-m-desc">Token movement on a network and issuer redemption follow different steps. Under the OCC rule effective 18 January 2027: receipt of the customer order and satisfaction of onboarding/legal conditions trigger the obligation; two business days run to full processing and initiation of the outgoing transfer. A requested credit to an account with the issuer also qualifies. Receipt at an external bank depends on the payment route. An intermediary can add its own access step. Requests exceeding 10% of a brand’s outstanding issuance in 24 hours trigger notice and a possible OCC-decided extension. Sources: L01.</desc><rect id="sc-reserve-en-redemption-m-frame" x="0" y="0" width="420" height="850" fill="var(--color-ink)"/><text data-panel="sc-reserve-en-redemption-m-frame" x="22" y="35" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="700" text-anchor="start">l0g / STABLECOINS</text><text data-panel="sc-reserve-en-redemption-m-frame" x="398" y="35" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="end">06 / 07</text><text data-panel="sc-reserve-en-redemption-m-frame" x="22" y="76" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="25" font-weight="700" text-anchor="start">The redemption deadline</text><text data-panel="sc-reserve-en-redemption-m-frame" x="22" y="117" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="start">OCC rule · effective 18 January 2027</text><text data-panel="sc-reserve-en-redemption-m-frame" x="28" y="225" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="20" font-weight="700" text-anchor="start">Eligible order reaches issuer</text><line x1="210" y1="249" x2="210" y2="329" stroke="var(--color-signal)" stroke-width="3"/><path d="M 204 320 L 210 329 L 216 320" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="sc-reserve-en-redemption-m-frame" x="234" y="277" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="18" font-weight="700" text-anchor="start">2 business</text><text data-panel="sc-reserve-en-redemption-m-frame" x="234" y="304" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="18" font-weight="700" text-anchor="start">days max</text><text data-panel="sc-reserve-en-redemption-m-frame" x="210" y="377" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="19" font-weight="700" text-anchor="middle">Transfer processed and initiated</text><text data-panel="sc-reserve-en-redemption-m-frame" x="210" y="406" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="19" font-weight="700" text-anchor="middle">or credit to issuer account</text><line x1="210" y1="426" x2="210" y2="482" stroke="var(--color-signal)" stroke-width="3"/><path d="M 204 473 L 210 482 L 216 473" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="sc-reserve-en-redemption-m-frame" x="210" y="524" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="20" font-weight="700" text-anchor="middle">Receipt at external bank</text><text data-panel="sc-reserve-en-redemption-m-frame" x="210" y="562" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="18" font-weight="400" text-anchor="middle">Depends on payment route</text><text data-panel="sc-reserve-en-redemption-m-frame" x="28" y="644" fill="var(--color-amber)" font-family="l0g Stablecoin Reserves" font-size="18" font-weight="700" text-anchor="start">Requests &gt; 10% in 24 h</text><text data-panel="sc-reserve-en-redemption-m-frame" x="28" y="675" fill="var(--color-amber)" font-family="l0g Stablecoin Reserves" font-size="18" font-weight="700" text-anchor="start">Notice; discretionary extension</text><text data-panel="sc-reserve-en-redemption-m-frame" x="28" y="706" fill="var(--color-amber)" font-family="l0g Stablecoin Reserves" font-size="18" font-weight="700" text-anchor="start">by the OCC</text><line x1="22" y1="788" x2="398" y2="788" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="sc-reserve-en-redemption-m-frame" x="22" y="820" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="start">L01 | Legal deadline and payment route</text></svg>
