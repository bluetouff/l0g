<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sc-reserve-en-rates-m-title sc-reserve-en-rates-m-desc" viewBox="0 0 420 850" style="width:100%;height:auto" class="l0g-stablecoin-reserve-svg"><title id="sc-reserve-en-rates-m-title">Circulation and reserve yield</title><desc id="sc-reserve-en-rates-m-desc">Circle, Q2 2025 and Q2 2026: average circulation 61,039 and 76,524 USD million; reserve income 634.274 and 667.733 million; rounded published yield 4.1% and 3.5%. Circle reports a 66-basis-point decline; displayed rates are rounded. A separate scenario applies a 100-basis-point cut for twelve months from 1 July 2026 with circulation and composition held at 30 June levels. Published effects: income minus 737 million, distribution and transaction costs minus 360 million, arithmetic effect after these costs minus 377 million before other items. Sources: F01.</desc><rect id="sc-reserve-en-rates-m-frame" x="0" y="0" width="420" height="850" fill="var(--color-ink)"/><text data-panel="sc-reserve-en-rates-m-frame" x="22" y="35" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="700" text-anchor="start">l0g / STABLECOINS</text><text data-panel="sc-reserve-en-rates-m-frame" x="398" y="35" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="end">03 / 07</text><text data-panel="sc-reserve-en-rates-m-frame" x="22" y="76" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="25" font-weight="700" text-anchor="start">Circulation and reserve</text><text data-panel="sc-reserve-en-rates-m-frame" x="22" y="108" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="25" font-weight="700" text-anchor="start">yield</text><text data-panel="sc-reserve-en-rates-m-frame" x="22" y="149" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="start">Circle · Q2 accounts and published</text><text data-panel="sc-reserve-en-rates-m-frame" x="22" y="172" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="start">sensitivity</text><rect id="sc-reserve-en-rates-m-card-observations" x="22" y="190" width="376" height="287" fill="var(--color-ink)"/><rect id="sc-reserve-en-rates-m-card-sensitivity" x="22" y="479" width="376" height="300" fill="var(--color-ink)"/><text data-panel="sc-reserve-en-rates-m-card-observations" x="28" y="220" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="18" font-weight="700" text-anchor="start">AVERAGE CIRCULATION · $m</text><text data-panel="sc-reserve-en-rates-m-card-observations" x="28" y="267" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="19" font-weight="700" text-anchor="start">Q2 2025</text><text data-panel="sc-reserve-en-rates-m-card-observations" x="392" y="267" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="20" font-weight="700" text-anchor="end">61 039</text><rect data-metric="circulation-2025" data-value="61039" x="28" y="283" width="277.72745" height="17" fill="var(--color-signal)"/><text data-panel="sc-reserve-en-rates-m-card-observations" x="28" y="327" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="start">4.1 % · income 634.274 $m</text><text data-panel="sc-reserve-en-rates-m-card-observations" x="28" y="359" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="19" font-weight="700" text-anchor="start">Q2 2026</text><text data-panel="sc-reserve-en-rates-m-card-observations" x="392" y="359" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="20" font-weight="700" text-anchor="end">76 524</text><rect data-metric="circulation-2026" data-value="76524" x="28" y="375" width="348.1842" height="17" fill="var(--color-amber)"/><text data-panel="sc-reserve-en-rates-m-card-observations" x="28" y="419" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="start">3.5 % · income 667.733 $m</text><text data-panel="sc-reserve-en-rates-m-card-observations" x="28" y="463" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="start">Rounded yields · reported fall: 66 bp</text><text data-panel="sc-reserve-en-rates-m-card-sensitivity" x="28" y="500" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="18" font-weight="700" text-anchor="start">SHOCK: −1 POINT · 12 MONTHS</text><text data-panel="sc-reserve-en-rates-m-card-sensitivity" x="28" y="555" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="18" font-weight="700" text-anchor="start">Income</text><text data-panel="sc-reserve-en-rates-m-card-sensitivity" x="392" y="555" fill="var(--color-accent)" font-family="l0g Stablecoin Reserves" font-size="20" font-weight="700" text-anchor="end">−737 $m</text><rect data-metric="sensitivity-income" data-value="-737" x="47.0575" y="573" width="222.9425" height="17" fill="var(--color-accent)"/><text data-panel="sc-reserve-en-rates-m-card-sensitivity" x="28" y="628" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="18" font-weight="700" text-anchor="start">Costs</text><text data-panel="sc-reserve-en-rates-m-card-sensitivity" x="392" y="628" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="20" font-weight="700" text-anchor="end">−360 $m</text><rect data-metric="sensitivity-costs" data-value="-360" x="161.1" y="646" width="108.9" height="17" fill="var(--color-muted)"/><text data-panel="sc-reserve-en-rates-m-card-sensitivity" x="28" y="701" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="18" font-weight="700" text-anchor="start">After costs</text><text data-panel="sc-reserve-en-rates-m-card-sensitivity" x="392" y="701" fill="var(--color-amber)" font-family="l0g Stablecoin Reserves" font-size="20" font-weight="700" text-anchor="end">−377 $m</text><rect data-metric="sensitivity-subtotal" data-value="-377" x="155.9575" y="719" width="114.0425" height="17" fill="var(--color-amber)"/><text data-panel="sc-reserve-en-rates-m-card-sensitivity" x="28" y="771" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="18" font-weight="400" text-anchor="start">−737 − (−360) = −377 $m</text><line x1="22" y1="788" x2="398" y2="788" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="sc-reserve-en-rates-m-frame" x="22" y="820" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="start">F01 | Observations and separate model</text></svg>
