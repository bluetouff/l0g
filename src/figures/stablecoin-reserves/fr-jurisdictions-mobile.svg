<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sc-reserve-fr-jurisdictions-m-title sc-reserve-fr-jurisdictions-m-desc" viewBox="0 0 420 850" style="width:100%;height:auto" class="l0g-stablecoin-reserve-svg"><title id="sc-reserve-fr-jurisdictions-m-title">Les payeurs sous contrôle</title><desc id="sc-reserve-fr-jurisdictions-m-desc">Comparaison ciblée. États-Unis : GENIUS et règle OCC visent le rendement payé par l’émetteur autorisé ou étranger uniquement en lien avec la détention, l’utilisation ou la conservation d’un payment stablecoin ; un agent peut agir pour son compte et les montages indirects sont examinés selon les faits. Union européenne : MiCA article 50 nomme l’émetteur d’EMT et le prestataire de services sur crypto-actifs ; certains avantages liés à la durée de détention sont assimilés à des intérêts. L’article 40 prévoit des dispositions similaires pour les ART. Ces dispositions européennes s’appliquent depuis le 30 juin 2024. Le pays, le produit et le rôle du payeur déterminent la lecture. Sources : L01, L03, M06.</desc><rect id="sc-reserve-fr-jurisdictions-m-frame" x="0" y="0" width="420" height="850" fill="var(--color-ink)"/><text data-panel="sc-reserve-fr-jurisdictions-m-frame" x="22" y="35" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="700" text-anchor="start">l0g / STABLECOINS</text><text data-panel="sc-reserve-fr-jurisdictions-m-frame" x="398" y="35" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="end">07 / 07</text><text data-panel="sc-reserve-fr-jurisdictions-m-frame" x="22" y="76" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="25" font-weight="700" text-anchor="start">Les payeurs sous contrôle</text><text data-panel="sc-reserve-fr-jurisdictions-m-frame" x="22" y="117" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="start">Périmètres ciblés · intérêts liés au</text><text data-panel="sc-reserve-fr-jurisdictions-m-frame" x="22" y="140" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="start">stablecoin</text><text data-panel="sc-reserve-fr-jurisdictions-m-frame" x="115" y="220" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="18" font-weight="700" text-anchor="middle">ÉMETTEUR</text><text data-panel="sc-reserve-fr-jurisdictions-m-frame" x="308" y="220" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="18" font-weight="700" text-anchor="middle">DISTRIBUTEUR</text><text data-panel="sc-reserve-fr-jurisdictions-m-frame" x="28" y="280" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="18" font-weight="700" text-anchor="start">ÉTATS-UNIS</text><text data-panel="sc-reserve-fr-jurisdictions-m-frame" x="392" y="280" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="end">18.01.2027</text><text data-panel="sc-reserve-fr-jurisdictions-m-frame" x="28" y="475" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="18" font-weight="700" text-anchor="start">UNION EUROPÉENNE</text><text data-panel="sc-reserve-fr-jurisdictions-m-frame" x="392" y="475" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="end">30.06.2024</text><circle cx="115" cy="324" r="8" fill="var(--color-accent)"/><circle cx="308" cy="324" r="8" fill="var(--color-amber)"/><circle cx="115" cy="519" r="8" fill="var(--color-accent)"/><circle cx="308" cy="519" r="8" fill="var(--color-accent)"/><text data-panel="sc-reserve-fr-jurisdictions-m-frame" x="115" y="370" fill="var(--color-accent)" font-family="l0g Stablecoin Reserves" font-size="20" font-weight="700" text-anchor="middle">Interdit</text><text data-panel="sc-reserve-fr-jurisdictions-m-frame" x="308" y="356" fill="var(--color-amber)" font-family="l0g Stablecoin Reserves" font-size="19" font-weight="700" text-anchor="middle">Contrats</text><text data-panel="sc-reserve-fr-jurisdictions-m-frame" x="308" y="383" fill="var(--color-amber)" font-family="l0g Stablecoin Reserves" font-size="19" font-weight="700" text-anchor="middle">et faits</text><line x1="28" y1="419" x2="392" y2="419" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="sc-reserve-fr-jurisdictions-m-frame" x="115" y="565" fill="var(--color-accent)" font-family="l0g Stablecoin Reserves" font-size="20" font-weight="700" text-anchor="middle">Interdit</text><text data-panel="sc-reserve-fr-jurisdictions-m-frame" x="308" y="565" fill="var(--color-accent)" font-family="l0g Stablecoin Reserves" font-size="20" font-weight="700" text-anchor="middle">Interdit</text><text data-panel="sc-reserve-fr-jurisdictions-m-frame" x="28" y="669" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="18" font-weight="400" text-anchor="start">États-Unis : GENIUS + OCC</text><text data-panel="sc-reserve-fr-jurisdictions-m-frame" x="28" y="700" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="18" font-weight="400" text-anchor="start">UE : MiCA, articles 40 et 50</text><line x1="22" y1="788" x2="398" y2="788" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="sc-reserve-fr-jurisdictions-m-frame" x="22" y="820" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="start">L01 · L03 · M06 | Produits couverts</text></svg>
