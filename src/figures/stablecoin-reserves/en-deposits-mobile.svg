<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sc-reserve-en-deposits-m-title sc-reserve-en-deposits-m-desc" viewBox="0 0 420 850" style="width:100%;height:auto" class="l0g-stablecoin-reserve-svg"><title id="sc-reserve-en-deposits-m-title">A deposit changes bank</title><desc id="sc-reserve-en-deposits-m-desc">A fictional one-thousand-dollar circuit: initially the customer has a $1,000 deposit at bank A; after primary stablecoin issuance, the issuer has the deposit at bank B and the customer has 1,000 USDC; following a secondary-market Treasury bill purchase from a nonbank seller, that seller has the deposit at bank C, the issuer owns the bill and the customer owns USDC. Deposits in this circuit remain $1,000 at each step. This is not a universal conservation law: bank sellers, the Treasury account and Fed reverse repos produce different circuits. Sources: M01, M02, M05.</desc><rect id="sc-reserve-en-deposits-m-frame" x="0" y="0" width="420" height="850" fill="var(--color-ink)"/><text data-panel="sc-reserve-en-deposits-m-frame" x="22" y="35" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="700" text-anchor="start">l0g / STABLECOINS</text><text data-panel="sc-reserve-en-deposits-m-frame" x="398" y="35" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="end">05 / 07</text><text data-panel="sc-reserve-en-deposits-m-frame" x="22" y="76" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="25" font-weight="700" text-anchor="start">A deposit changes bank</text><text data-panel="sc-reserve-en-deposits-m-frame" x="22" y="117" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="start">Fictional scenario · $1,000 ·</text><text data-panel="sc-reserve-en-deposits-m-frame" x="22" y="140" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="start">secondary purchase</text><rect id="sc-reserve-en-deposits-m-card-snapshot-1" x="22" y="200" width="376" height="108" fill="var(--color-ink)"/><text data-panel="sc-reserve-en-deposits-m-card-snapshot-1" x="28" y="230" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="20" font-weight="700" text-anchor="start">1. Customer</text><text data-panel="sc-reserve-en-deposits-m-card-snapshot-1" x="392" y="230" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="700" text-anchor="end">$1,000</text><line x1="28" y1="256" x2="392" y2="256" stroke="var(--color-signal)" stroke-width="10"/><text data-panel="sc-reserve-en-deposits-m-card-snapshot-1" x="28" y="289" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="18" font-weight="400" text-anchor="start">Deposit at bank A</text><line x1="210" y1="308" x2="210" y2="343" stroke="var(--color-signal)" stroke-width="3"/><path d="M 204 334 L 210 343 L 216 334" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="sc-reserve-en-deposits-m-frame" x="210" y="363" fill="var(--color-amber)" font-family="l0g Stablecoin Reserves" font-size="18" font-weight="700" text-anchor="middle">Primary issuance</text><rect id="sc-reserve-en-deposits-m-card-snapshot-2" x="22" y="366" width="376" height="108" fill="var(--color-ink)"/><text data-panel="sc-reserve-en-deposits-m-card-snapshot-2" x="28" y="393" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="20" font-weight="700" text-anchor="start">2. Issuer</text><text data-panel="sc-reserve-en-deposits-m-card-snapshot-2" x="392" y="393" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="700" text-anchor="end">$1,000</text><line x1="28" y1="419" x2="392" y2="419" stroke="var(--color-signal)" stroke-width="10"/><text data-panel="sc-reserve-en-deposits-m-card-snapshot-2" x="28" y="452" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="18" font-weight="400" text-anchor="start">Deposit at bank B</text><line x1="210" y1="471" x2="210" y2="506" stroke="var(--color-signal)" stroke-width="3"/><path d="M 204 497 L 210 506 L 216 497" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="sc-reserve-en-deposits-m-frame" x="210" y="526" fill="var(--color-amber)" font-family="l0g Stablecoin Reserves" font-size="18" font-weight="700" text-anchor="middle">Secondary purchase</text><rect id="sc-reserve-en-deposits-m-card-snapshot-3" x="22" y="532" width="376" height="108" fill="var(--color-ink)"/><text data-panel="sc-reserve-en-deposits-m-card-snapshot-3" x="28" y="556" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="18" font-weight="700" text-anchor="start">3. Nonbank seller</text><text data-panel="sc-reserve-en-deposits-m-card-snapshot-3" x="392" y="556" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="700" text-anchor="end">$1,000</text><line x1="28" y1="582" x2="392" y2="582" stroke="var(--color-signal)" stroke-width="10"/><text data-panel="sc-reserve-en-deposits-m-card-snapshot-3" x="28" y="615" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="18" font-weight="400" text-anchor="start">Deposit at bank C</text><text data-panel="sc-reserve-en-deposits-m-frame" x="28" y="721" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="start">At the end: USDC / Treasury / deposit</text><line x1="22" y1="788" x2="398" y2="788" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="sc-reserve-en-deposits-m-frame" x="22" y="820" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="17" font-weight="400" text-anchor="start">M01 · M02 · M05 | Conditional scenario</text></svg>
