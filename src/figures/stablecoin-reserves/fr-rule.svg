<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sc-reserve-fr-rule-d-title sc-reserve-fr-rule-d-desc" viewBox="0 0 1000 700" style="width:100%;height:auto" class="l0g-stablecoin-reserve-svg"><title id="sc-reserve-fr-rule-d-title">Le contrôle suit les paiements</title><desc id="sc-reserve-fr-rule-d-desc">Chronologie OCC : projet publié le 2 mars 2026 ; règle finale annoncée le 21 octobre, publiée le 23 octobre ; entrée en vigueur le 18 janvier 2027. La présomption réfragable proposée est supprimée. L’interdiction visant l’émetteur et le contrôle du contournement restent. Trois questions organisent la lecture : qui paie, y compris pour le compte de l’émetteur ; quelle est la nature et la cause du paiement ; que montrent les contrats et les flux ? Le schéma décrit une méthode de lecture, sans statuer sur la légalité d’un programme particulier. Sources : L01, L02, L04.</desc><rect id="sc-reserve-fr-rule-d-frame" x="0" y="0" width="1000" height="700" fill="var(--color-ink)"/><text data-panel="sc-reserve-fr-rule-d-frame" x="40" y="42" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="700" text-anchor="start">l0g / STABLECOINS</text><text data-panel="sc-reserve-fr-rule-d-frame" x="960" y="42" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="400" text-anchor="end">04 / 07</text><text data-panel="sc-reserve-fr-rule-d-frame" x="40" y="94" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="32" font-weight="700" text-anchor="start">Le contrôle suit les paiements</text><text data-panel="sc-reserve-fr-rule-d-frame" x="40" y="145" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="400" text-anchor="start">Règle OCC · publiée le 23 octobre 2026</text><text data-panel="sc-reserve-fr-rule-d-frame" x="40" y="215" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="25" font-weight="700" text-anchor="start">02.03.2026</text><text data-panel="sc-reserve-fr-rule-d-frame" x="40" y="251" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="23" font-weight="400" text-anchor="start">Projet</text><text data-panel="sc-reserve-fr-rule-d-frame" x="360" y="215" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="25" font-weight="700" text-anchor="start">21 / 23.10.2026</text><text data-panel="sc-reserve-fr-rule-d-frame" x="360" y="251" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="23" font-weight="400" text-anchor="start">Règle finale</text><text data-panel="sc-reserve-fr-rule-d-frame" x="760" y="215" fill="var(--color-signal)" font-family="l0g Stablecoin Reserves" font-size="25" font-weight="700" text-anchor="start">18.01.2027</text><text data-panel="sc-reserve-fr-rule-d-frame" x="760" y="251" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="23" font-weight="400" text-anchor="start">Application</text><line x1="40" y1="278" x2="960" y2="278" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="sc-reserve-fr-rule-d-frame" x="40" y="326" fill="var(--color-accent)" font-family="l0g Stablecoin Reserves" font-size="25" font-weight="700" text-anchor="start">Présomption proposée supprimée.</text><text data-panel="sc-reserve-fr-rule-d-frame" x="40" y="362" fill="var(--color-accent)" font-family="l0g Stablecoin Reserves" font-size="25" font-weight="700" text-anchor="start">Interdiction visant l’émetteur maintenue.</text><text data-panel="sc-reserve-fr-rule-d-frame" x="145" y="430" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="24" font-weight="700" text-anchor="middle">ÉMETTEUR</text><text data-panel="sc-reserve-fr-rule-d-frame" x="500" y="430" fill="var(--color-amber)" font-family="l0g Stablecoin Reserves" font-size="24" font-weight="700" text-anchor="middle">PLATEFORME / AGENT ?</text><text data-panel="sc-reserve-fr-rule-d-frame" x="875" y="430" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="24" font-weight="700" text-anchor="middle">DÉTENTEUR</text><line x1="245" y1="423" x2="320" y2="423" stroke="var(--color-signal)" stroke-width="3"/><path d="M 311 417 L 320 423 L 311 429" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="690" y1="423" x2="770" y2="423" stroke="var(--color-signal)" stroke-width="3"/><path d="M 761 417 L 770 423 L 761 429" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="sc-reserve-fr-rule-d-frame" x="500" y="518" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="26" font-weight="400" text-anchor="middle">Qui assume le paiement ? Que finance-t-il ?</text><text data-panel="sc-reserve-fr-rule-d-frame" x="500" y="566" fill="var(--color-paper)" font-family="l0g Stablecoin Reserves" font-size="26" font-weight="400" text-anchor="middle">Contrats + flux réels → qualification</text><line x1="40" y1="638" x2="960" y2="638" stroke="var(--color-line-strong)" stroke-width="2"/><text data-panel="sc-reserve-fr-rule-d-frame" x="40" y="670" fill="var(--color-muted)" font-family="l0g Stablecoin Reserves" font-size="22" font-weight="400" text-anchor="start">L01 · L02 · L04 | Grille d’analyse</text></svg>
