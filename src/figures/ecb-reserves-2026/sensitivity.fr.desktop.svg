<title id="ecbr-sensitivity-fr-d-title">Le taux change le transfert d’intérêts</title>
<desc id="ecbr-sensitivity-fr-d-desc">Sensibilité arithmétique en annualisation simple d’environ 177,6 milliards d’euros reclassés à 0 %. Les taux 1,2,3 et 4 % sont hypothétiques. Le seul taux en vigueur au 19 novembre 2026 est 2,50 %, appliqué depuis le 16 septembre et maintenu le 29 octobre. L’assiette et le stock sont constants.</desc>
