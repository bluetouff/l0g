<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" viewBox="0 0 320 326" role="img" aria-labelledby="ecbr-sensitivity-en-m-title ecbr-sensitivity-en-m-desc" font-family="Inter Variable, Inter, sans-serif" font-weight="400" style="width:100%;height:auto">
<title id="ecbr-sensitivity-en-m-title">The deposit rate changes the interest shift</title>
<desc id="ecbr-sensitivity-en-m-desc">Arithmetic sensitivity using simple annualisation of about 177.6 billion euros reclassified to 0%. Rates of 1,2,3 and 4 percent are hypothetical. The only rate in force on 19 November 2026 is 2.50 percent, effective since 16 September and maintained on 29 October. The base and balances are fixed.</desc>
