<title id="damage-paths-en-m-title">From network entry to the capabilities misused</title><desc id="damage-paths-en-m-desc">Two separate evidence sets: in Greece in 2004–2005, an unreconstructed entry preceded misuse of an interception function. Telecom publications from 2025–2026 describe equipment access followed by network functions used to collect traffic. The cases and their actors remain distinct.</desc>
