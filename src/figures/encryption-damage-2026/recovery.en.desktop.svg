<title id="damage-recovery-en-d-title">Service recovery and the fate of copies</title><desc id="damage-recovery-en-d-desc">A general sequence leads from detection to containment, rebuilding and verified resumption. A separate branch assumes a readable copy has already been taken and may remain outside. Orange’s July 2025 statement illustrates isolation-related disruption; the hypothetical copy is separate from that incident.</desc>
