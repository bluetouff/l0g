<title id="damage-paths-fr-d-title">De l’entrée dans le réseau aux fonctions détournées</title><desc id="damage-paths-fr-d-desc">Deux ensembles distincts : en Grèce en 2004–2005, une entrée non reconstituée précède le détournement d’une fonction d’interception. Les publications télécoms de 2025–2026 décrivent des accès aux équipements, puis des fonctions réseau utilisées pour collecter du trafic. Les cas et leurs acteurs demeurent distincts.</desc>
