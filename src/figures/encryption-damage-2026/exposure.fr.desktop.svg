<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="damage-exposure-fr-d-title damage-exposure-fr-d-desc" class="l0g-damage-svg" style="width:100%;height:auto">
<title id="damage-exposure-fr-d-title">Les droits délimitent le périmètre d’exposition</title><desc id="damage-exposure-fr-d-desc">Une capacité partagée compromise peut exposer plusieurs ensembles illustratifs. Une séparation effective des contrôles peut limiter le périmètre accessible. L’indépendance des droits, de l’administration et de la récupération est une hypothèse. Aucun taux de compromission ni montant n’est estimé.</desc>
