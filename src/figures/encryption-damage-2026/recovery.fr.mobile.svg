<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 920" role="img" aria-labelledby="damage-recovery-fr-m-title damage-recovery-fr-m-desc" class="l0g-damage-svg" style="width:100%;height:auto">
<title id="damage-recovery-fr-m-title">La reprise du service et le devenir des copies</title><desc id="damage-recovery-fr-m-desc">Un parcours général conduit de la détection au confinement, à la remise en état et à une reprise vérifiée. Une branche distincte suppose qu’une copie lisible a déjà été emportée et peut rester à l’extérieur. Le communiqué Orange de juillet 2025 illustre les perturbations liées à l’isolement ; la copie hypothétique lui reste distincte.</desc>
