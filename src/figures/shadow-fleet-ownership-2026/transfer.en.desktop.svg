<svg xmlns="http://www.w3.org/2000/svg" id="sfo-transfer-en-d-0" viewBox="0 0 1200 626" width="100%" height="auto" role="img" aria-labelledby="sfo-transfer-en-d-1 sfo-transfer-en-d-3" xml:lang="en" style="width:100%;height:auto" font-family="Inter Variable, Inter, sans-serif" font-weight="400">
  <title id="sfo-transfer-en-d-1">One hull, two transfers</title>
  <desc id="sfo-transfer-en-d-3">Two theoretical scenarios, without reference to a real vessel. On the left, a vessel sale from company A to company B leads to a change in the registered owner in the example shown. On the right, a sale of a controlling shareholding in company S changes its shareholder while S can remain the registered owner. The vessel’s IMO number stays the same in both cases. Identifying ultimate control requires tracing the ownership chain and control rights; this diagram does not attribute control to any person.</desc>
  <metadata>{"publisher": "l0g", "license": "CC-BY-4.0", "cutoff": "2026-11-19", "language": "en", "chart_type": "mecanisme-propriete", "sources": [{"id": "S02", "url": "https://www.imo.org/en/ourwork/iiis/pages/imo-identification-number-schemes.aspx"}, {"id": "S12", "url": "https://www.equasis.org/EquasisWeb/Static/MOA/Help/ShipInfo_Management.html"}, {"id": "S15", "url": "https://www.cr.gov.hk/en/electronic/e-servicesportal/faq/e-search.htm"}, {"id": "S16", "url": "https://www.cr.gov.hk/en/legislation/scr/faq.htm"}], "units": "generic legal ownership example; not an observed transaction", "limitations": "Sources and dates have distinct evidential roles. No ultimate beneficial owner or payment flow is asserted."}</metadata>
  <rect x="0" y="0" width="1200" height="626" rx="0" fill="var(--color-ink)" />
  <text x="40" y="82" fill="var(--color-paper)" font-family="Inter Variable, Inter, sans-serif" font-size="35" font-weight="400" text-anchor="start">One hull, two transfers</text>
  <text x="40" y="119" fill="var(--color-muted)" font-family="Inter Variable, Inter, sans-serif" font-size="26" font-weight="400" text-anchor="start">Selling a vessel and selling shares in its owning company leave different records.</text>
