<svg xmlns="http://www.w3.org/2000/svg" id="sfo-network-fr-m-0" width="100%" height="auto" viewBox="0 0 600 810" role="img" aria-labelledby="sfo-network-fr-m-1 sfo-network-fr-m-3" style="width:100%;height:auto" font-family="Inter Variable, Inter, sans-serif" font-weight="400" xml:lang="fr">
  <title id="sfo-network-fr-m-1">Trois chaînes de propriété documentées — version mobile</title>
  <desc id="sfo-network-fr-m-3">Trois chaînes sont présentées sur trois lignes : Cariba détient White Agate, Nitara détient Serpentine, et Prospect est le principal actionnaire de Citrine. Les liens de capital sont attribués au Conseil de l’Union européenne. Seul Citrine est relié aux trois navires ARROW, AMULET et BOBCAT, selon le champ Owner Address d’IRCLASS consulté le 19 novembre 2026. La création de Prospect le 6 mars 2024 est vérifiée au registre de Hong Kong. La part détenue par Prospect n’est pas publiée.</desc>
  <metadata>{"publisher": "l0g", "license": "CC-BY-4.0", "cutoff": "2026-11-19", "language": "fr", "chart_type": "reseau-propriete", "sources": [{"id": "S01", "url": "https://www.irclass.org/umbraco/Surface/Home/showShipSearchDetail/67537"}, {"id": "S06", "url": "https://www.irclass.org/umbraco/Surface/Home/showShipSearchDetail/67693"}, {"id": "S07", "url": "https://www.irclass.org/umbraco/Surface/Home/showShipSearchDetail/67327"}, {"id": "S08", "url": "https://eur-lex.europa.eu/eli/reg_impl/2026/2574/oj"}, {"id": "S09", "url": "https://www.cr.gov.hk/docs/wrpt/RNC063_2024.03.04-2024.03.10.pdf"}], "units": "equity percent where explicitly stated; otherwise relationships, not quantities", "limitations": "Sources and dates have distinct evidential roles. No ultimate beneficial owner or payment flow is asserted."}</metadata>
