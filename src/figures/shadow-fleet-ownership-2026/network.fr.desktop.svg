<svg xmlns="http://www.w3.org/2000/svg" id="sfo-network-fr-d-0" width="100%" height="auto" viewBox="0 0 1200 680" role="img" aria-labelledby="sfo-network-fr-d-1 sfo-network-fr-d-3" style="width:100%;height:auto" font-family="Inter Variable, Inter, sans-serif" font-weight="400" xml:lang="fr">
  <title id="sfo-network-fr-d-1">Trois chaînes de propriété documentées</title>
  <desc id="sfo-network-fr-d-3">Le Conseil de l’Union européenne identifie Cariba Carriers comme actionnaire unique de White Agate Marine, Nitara Carriers comme actionnaire unique de Serpentine Marine, et Prospect International Shipping comme principal actionnaire de Citrine Marine, sans publier sa part. Les traits pleins turquoise représentent ces relations de capital. Les pointillés bleus rattachent uniquement à Citrine les navires ARROW, AMULET et BOBCAT, dont le champ Owner Address des fiches IRCLASS donne ce propriétaire. Le registre de Hong Kong confirme la création de Prospect le 6 mars 2024. Le graphique n’identifie pas les bénéficiaires effectifs ultimes.</desc>
  <metadata>{"publisher": "l0g", "license": "CC-BY-4.0", "cutoff": "2026-11-19", "language": "fr", "chart_type": "reseau-propriete", "sources": [{"id": "S01", "url": "https://www.irclass.org/umbraco/Surface/Home/showShipSearchDetail/67537"}, {"id": "S06", "url": "https://www.irclass.org/umbraco/Surface/Home/showShipSearchDetail/67693"}, {"id": "S07", "url": "https://www.irclass.org/umbraco/Surface/Home/showShipSearchDetail/67327"}, {"id": "S08", "url": "https://eur-lex.europa.eu/eli/reg_impl/2026/2574/oj"}, {"id": "S09", "url": "https://www.cr.gov.hk/docs/wrpt/RNC063_2024.03.04-2024.03.10.pdf"}], "units": "equity percent where explicitly stated; otherwise relationships, not quantities", "limitations": "Sources and dates have distinct evidential roles. No ultimate beneficial owner or payment flow is asserted."}</metadata>
