<svg xmlns="http://www.w3.org/2000/svg" id="sfo-transfer-en-m-0" viewBox="0 0 600 820" width="100%" height="auto" role="img" aria-labelledby="sfo-transfer-en-m-1 sfo-transfer-en-m-3" xml:lang="en" style="width:100%;height:auto" font-family="Inter Variable, Inter, sans-serif" font-weight="400">
  <title id="sfo-transfer-en-m-1">One hull, two transfers</title>
  <desc id="sfo-transfer-en-m-3">Two theoretical scenarios, without reference to a real vessel. On the left, a vessel sale from company A to company B leads to a change in the registered owner in the example shown. On the right, a sale of a controlling shareholding in company S changes its shareholder while S can remain the registered owner. The vessel’s IMO number stays the same in both cases. Identifying ultimate control requires tracing the ownership chain and control rights; this diagram does not attribute control to any person.</desc>
