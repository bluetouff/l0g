<title id="sec-cat-governance-fr-desktop-title">Les voix au comité du CAT</title>
<desc id="sec-cat-governance-fr-desktop-description">Dans la répartition recensée par la SEC, Cboe, Nasdaq, NYSE/ICE et MIAX réunissent 21 des 29 voix. Les huit autres organismes incluent FINRA, qui détient une voix et se voit attribuer environ 40 % de la part des coûts du CAT revenant aux organismes d’autorégulation. Les deux pourcentages ont des périmètres différents.</desc>
