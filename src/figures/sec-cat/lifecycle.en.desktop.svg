<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 289" role="img" aria-labelledby="sec-cat-lifecycle-en-desktop-title sec-cat-lifecycle-en-desktop-description" width="100%" height="auto" style="width:100%;height:auto" font-family="Inter Variable, Inter, sans-serif" font-weight="400" xml:lang="en">
<title id="sec-cat-lifecycle-en-desktop-title">An order’s route through the market</title>
<desc id="sec-cat-lifecycle-en-desktop-description">A hypothetical 300-share order is split between two destinations. One hundred shares are executed and two hundred are cancelled. The CAT links the events reported by brokers and venues using identifiers and timestamps.</desc>
