<rect x="192" y="82" width="139" height="81" rx="6" fill="var(--color-surface)" stroke="var(--color-line-strong)" />
<g transform="translate(204 94)" aria-hidden="true"><path d="M3 11h6m0-7v14m0-14h11m-4-3 4 3-4 3m-7 11h11m-4-3 4 3-4 3" fill="none" stroke="var(--color-topic-blue)" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round" /></g>
<text x="205" y="133" font-size="14" font-weight="400" fill="var(--color-paper)" text-anchor="start">Order split</text>
<text x="205" y="151" font-size="12" font-weight="400" fill="var(--color-muted)" text-anchor="start">100 + 200 shares</text>
