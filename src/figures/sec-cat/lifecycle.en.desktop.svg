<circle cx="359" cy="123" r="2.5" fill="var(--color-line-strong)" stroke="none" />
<path d="M90 163V196H591V99H580M580 159H591M261 163V196M300 196V222" fill="none" stroke="var(--color-signal)" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4" />
<path d="M296 218l4 4 4-4" fill="none" stroke="var(--color-signal)" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round" />
<rect x="20" y="82" width="139" height="81" rx="6" fill="var(--color-surface)" stroke="var(--color-line-strong)" />
<g transform="translate(32 94)" aria-hidden="true"><path d="M4 2h10l4 4v15H4Zm10 0v5h4M7 10h8m-8 4h8m-8 4h5" fill="none" stroke="var(--color-signal)" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round" /></g>
<text x="33" y="133" font-size="14" font-weight="400" fill="var(--color-paper)" text-anchor="start">Order received</text>
