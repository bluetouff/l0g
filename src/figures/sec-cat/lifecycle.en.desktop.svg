<text x="20" y="29" font-size="17" font-weight="400" fill="var(--color-paper)" text-anchor="start">An order’s route through the market</text>
<text x="20" y="50" font-size="12" font-weight="400" fill="var(--color-muted)" text-anchor="start">Hypothetical example for a stock order</text>
<path d="M20 61H580" fill="none" stroke="var(--color-line-strong)" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round" />
<path d="M159 123H192" fill="none" stroke="var(--color-line-strong)" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round" />
<path d="M188 119l4 4-4 4" fill="none" stroke="var(--color-line-strong)" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round" />
<path d="M331 123H359V99H387M359 123V159H387" fill="none" stroke="var(--color-line-strong)" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round" />
