<text x="334" y="104" font-size="13" font-weight="400" fill="var(--color-paper)" text-anchor="start">SEC proposal</text>
<path d="M382 142H404M458 142H501" fill="none" stroke="var(--color-amber)" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round" />
<path d="M400 138l4 4-4 4" fill="none" stroke="var(--color-amber)" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round" />
