<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 276" role="img" aria-labelledby="sec-cat-funding-en-desktop-title sec-cat-funding-en-desktop-description" width="100%" height="auto" style="width:100%;height:auto" font-family="Inter Variable, Inter, sans-serif" font-weight="400" xml:lang="en">
<title id="sec-cat-funding-en-desktop-title">Two routes for funding the CAT</title>
<desc id="sec-cat-funding-en-desktop-description">CAT LLC’s budget of 31 March 2026 projects 147.0 million dollars in expenses, covered by 131.9 million from the liquidity reserve and 15.1 million in projected revenue, using rounded figures. The SEC intends to use funds appropriated by Congress to pay CAT costs. Section 31 transaction fees offset the SEC’s general appropriation.</desc>
<rect x="0" y="0" width="600" height="276" rx="8" fill="var(--color-ink)" stroke="none" />
<text x="20" y="29" font-size="17" font-weight="400" fill="var(--color-paper)" text-anchor="start">Two routes for funding the CAT</text>
<text x="20" y="50" font-size="12" font-weight="400" fill="var(--color-muted)" text-anchor="start">CAT LLC budget and SEC proposal</text>
<path d="M20 61H580" fill="none" stroke="var(--color-line-strong)" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round" />
<rect x="20" y="78" width="259" height="178" rx="6" fill="var(--color-surface)" stroke="var(--color-line-strong)" />
<g transform="translate(32 88)" aria-hidden="true"><path d="M3 7h16v12H3Zm3 0V4h10v3m-2 6h5m-12 0h3" fill="none" stroke="var(--color-signal)" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round" /></g>
<text x="60" y="104" font-size="13" font-weight="400" fill="var(--color-paper)" text-anchor="start">CAT LLC budget · 2026</text>
<text x="34" y="136" font-size="19" font-weight="400" fill="var(--color-signal)" text-anchor="start">$147.0m</text>
<text x="34" y="154" font-size="12" font-weight="400" fill="var(--color-muted)" text-anchor="start">Budgeted expenses</text>
<rect x="34" y="167" width="231" height="7" rx="3.5" fill="var(--color-topic-blue)" stroke="none" />
<rect x="34" y="167" width="207.2" height="7" rx="3.5" fill="var(--color-signal)" stroke="none" />
<circle cx="38" cy="195" r="3.6" fill="var(--color-signal)" stroke="none" />
<text x="50" y="199" font-size="12" font-weight="400" fill="var(--color-paper)" text-anchor="start">Liquidity reserve</text>
<text x="265" y="199" font-size="12" font-weight="400" fill="var(--color-signal)" text-anchor="end">$131.9m</text>
<circle cx="38" cy="218" r="3.6" fill="var(--color-topic-blue)" stroke="none" />
<text x="50" y="222" font-size="12" font-weight="400" fill="var(--color-paper)" text-anchor="start">Projected revenue</text>
<text x="265" y="222" font-size="12" font-weight="400" fill="var(--color-topic-blue)" text-anchor="end">$15.1m</text>
<rect x="293" y="78" width="287" height="178" rx="6" fill="var(--color-surface)" stroke="var(--color-line-strong)" />
