<text x="431" y="146" font-size="12.5" font-weight="400" fill="var(--color-paper)" text-anchor="middle">SEC</text>
<text x="530" y="146" font-size="12.5" font-weight="400" fill="var(--color-paper)" text-anchor="middle">CAT</text>
