<title id="sec-cat-governance-en-desktop-title">Votes on the CAT committee</title>
<desc id="sec-cat-governance-en-desktop-description">The SEC proposal counts 21 of 29 votes for Cboe, Nasdaq, NYSE/ICE and MIAX collectively. FINRA is one of the eight remaining organizations. It holds one vote and is allocated roughly 40 percent of the share of CAT costs assigned to self-regulatory organizations. The voting and cost measures use different denominators.</desc>
