<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 429" role="img" aria-labelledby="sec-cat-funding-fr-mobile-title sec-cat-funding-fr-mobile-description" width="100%" height="auto" style="width:100%;height:auto" font-family="Inter Variable, Inter, sans-serif" font-weight="400" xml:lang="fr">
<title id="sec-cat-funding-fr-mobile-title">Deux circuits de financement</title>
<desc id="sec-cat-funding-fr-mobile-description">Le budget prévisionnel de CAT LLC du 31 mars 2026 totalise 147,0 millions de dollars, dont 131,9 millions couverts par la réserve de liquidité et 15,1 millions par les produits projetés, selon les montants arrondis. La SEC envisage d’utiliser des crédits votés par le Congrès pour couvrir les coûts du CAT. Les prélèvements sur les transactions de la section 31 compensent la dotation générale de la SEC.</desc>
