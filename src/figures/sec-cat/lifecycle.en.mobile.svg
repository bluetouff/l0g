<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 350" role="img" aria-labelledby="sec-cat-lifecycle-en-mobile-title sec-cat-lifecycle-en-mobile-description" width="100%" height="auto" style="width:100%;height:auto" font-family="Inter Variable, Inter, sans-serif" font-weight="400" xml:lang="en">
<title id="sec-cat-lifecycle-en-mobile-title">An order’s route through the market</title>
<desc id="sec-cat-lifecycle-en-mobile-description">A hypothetical 300-share order is split between two destinations. One hundred shares are executed and two hundred are cancelled. The CAT links the events reported by brokers and venues using identifiers and timestamps.</desc>
