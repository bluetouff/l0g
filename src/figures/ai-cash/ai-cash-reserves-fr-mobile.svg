<path d="M96 242 100 248 104 242" fill="none" stroke="var(--color-signal)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="100" cy="226" r="2.5" fill="var(--color-signal)"/>
<rect x="20" y="248" width="160" height="107" rx="5" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<rect x="200" y="248" width="160" height="107" rx="5" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text x="100" y="282" font-size="18" font-weight="500" text-anchor="middle" fill="var(--color-signal)">121 M$</text>
<text x="280" y="282" font-size="18" font-weight="500" text-anchor="middle" fill="var(--color-accent)">148 M$</text>
<text x="100" y="310" font-size="14" font-weight="400" text-anchor="middle" fill="var(--color-paper)">Intérêts pendant</text>
<text x="100" y="329" font-size="14" font-weight="400" text-anchor="middle" fill="var(--color-paper)">le chantier</text>
<text x="280" y="310" font-size="14" font-weight="400" text-anchor="middle" fill="var(--color-paper)">Réserve de service</text>
<text x="280" y="329" font-size="14" font-weight="400" text-anchor="middle" fill="var(--color-paper)">de la dette</text>
<path d="M100 355V377H280V355" fill="none" stroke="var(--color-muted)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5"/>
<path d="M276 361 280 355 284 361" fill="none" stroke="var(--color-muted)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="190" y="403" font-size="14" font-weight="400" text-anchor="middle" fill="var(--color-paper)">Relais possible après épuisement</text>
<text x="190" y="421" font-size="14" font-weight="400" text-anchor="middle" fill="var(--color-paper)">du compte d’intérêts.</text>
<g data-icon="cycle" transform="translate(34 453) scale(0.8)" fill="none" stroke="var(--color-accent)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-8-5a9 9 0 0 1 16 1M8-4v-6M8-4H2M8 5a9 9 0 0 1-16-1M-8 4v6M-8 4H-2"/></g>
<text x="55" y="451" font-size="14" font-weight="400" text-anchor="start" fill="var(--color-accent)">Reconstitution sous 15 jours ouvrés,</text>
<text x="55" y="470" font-size="14" font-weight="400" text-anchor="start" fill="var(--color-accent)">selon la clause.</text>
<line x1="20" y1="484" x2="360" y2="484" stroke="var(--color-line-strong)" stroke-width="1.2"/>
<text x="20" y="501" font-size="14" font-weight="400" text-anchor="start" fill="var(--color-muted)">S05–S07 · 10/03 et 18/06/2026</text>
<text x="20" y="518" font-size="14" font-weight="400" text-anchor="start" fill="var(--color-muted)">M$ · affectations initiales, pas soldes actuels</text>
</svg>
