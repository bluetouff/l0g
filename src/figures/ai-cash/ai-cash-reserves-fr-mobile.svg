<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 536" role="img" aria-labelledby="ai-cash-fr-reserves-m-title ai-cash-fr-reserves-m-desc" font-family="Inter Variable, Inter, sans-serif" font-weight="400" class="ai-cash-svg" style="width:100%;height:auto">
<title id="ai-cash-fr-reserves-m-title">L’emprunt finance aussi l’attente du loyer</title>
<desc id="ai-cash-fr-reserves-m-desc">L’emprunt d’APLD ComputeCo 2 prévoit le séquestre du produit de l’émission jusqu’au certificat attestant notamment la condition d’accord électrique. Le 10-Q au 31 août 2026 indique que la condition a été satisfaite et l’instruction de libération donnée le 18 juin. Les affectations initiales prévues à la libération comprennent 121 millions de dollars pour les intérêts pendant la construction et 148 millions de réserve de service de la dette. Après épuisement du compte d’intérêts, la réserve peut servir aux paiements contractuels ; elle doit être reconstituée sous quinze jours ouvrés, avec une exception encadrée pendant le remplacement d’un bail résilié. Les chiffres indiquent les affectations initiales, et non les soldes actuels. Aucune réserve épuisée ni livraison totale n’est déduite.</desc>
<text x="20" y="29" font-size="18" font-weight="500" text-anchor="start" fill="var(--color-paper)">L’emprunt finance aussi</text>
<text x="20" y="54" font-size="18" font-weight="500" text-anchor="start" fill="var(--color-paper)">l’attente du loyer</text>
<text x="20" y="78" font-size="14" font-weight="400" text-anchor="start" fill="var(--color-muted)">APLD ComputeCo 2 · affectations initiales</text>
<g data-icon="lock" transform="translate(40 111) scale(1)" fill="none" stroke="var(--color-muted)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><rect x="-9" y="-1" width="18" height="12" rx="2"/><path d="M-5-1v-5a5 5 0 0 1 10 0v5M0 3v4"/></g>
<text x="66" y="109" font-size="14" font-weight="400" text-anchor="start" fill="var(--color-paper)">Produit d’émission en séquestre</text>
<text x="66" y="129" font-size="14" font-weight="400" text-anchor="start" fill="var(--color-paper)">jusqu’au certificat requis</text>
<line x1="40" y1="133" x2="40" y2="158" stroke="var(--color-muted)" stroke-width="1.3"/>
<path d="M36 152 40 158 44 152" fill="none" stroke="var(--color-muted)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<g data-icon="power" transform="translate(40 181) scale(1)" fill="none" stroke="var(--color-signal)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="m2-11-9 13h7l-2 9L8-3H1Z"/></g>
<text x="66" y="179" font-size="14" font-weight="500" text-anchor="start" fill="var(--color-paper)">Condition électrique satisfaite</text>
<text x="66" y="199" font-size="14" font-weight="500" text-anchor="start" fill="var(--color-paper)">18 juin 2026</text>
<path d="M40 204V226H280V248" fill="none" stroke="var(--color-signal)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M276 242 280 248 284 242" fill="none" stroke="var(--color-signal)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
