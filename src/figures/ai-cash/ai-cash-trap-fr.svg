<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 382" role="img" aria-labelledby="ai-cash-fr-trap-d-title ai-cash-fr-trap-d-desc" font-family="Inter Variable, Inter, sans-serif" font-weight="400" class="ai-cash-svg" style="width:100%;height:auto">
<title id="ai-cash-fr-trap-d-title">Le contrat peut retenir les recettes</title>
<desc id="ai-cash-fr-trap-d-desc">Dans DDTL 5.5, un manquement substantiel au contrat client non levé par écrit et permettant sa résiliation, ou un ratio de valeur contractuelle projetée inférieur à 2,40, déclenche un Cash Trap Event. Les flux résiduels sont retenus au rang six, après les dépenses éligibles, intérêts, principal et réserve de liquidité ; l’absence de cet événement conditionne également les nouveaux tirages. Sa persistance sur trois échéances mensuelles consécutives entraîne un remboursement anticipé sous cinq jours ouvrés à partir du cash des comptes de sûreté, pour atteindre un ratio supérieur à 2,40, dans la limite de l’argent présent. La formule détaillée du numérateur du ratio est masquée. Mécanisme contractuel : aucun déclenchement n’est établi par l’enquête. Les clauses prévoient des possibilités de levée des conditions par les prêteurs habilités.</desc>
<text x="24" y="30" font-size="21" font-weight="500" text-anchor="start" fill="var(--color-paper)">Le contrat peut retenir les recettes</text>
<text x="24" y="53" font-size="15.2" font-weight="400" text-anchor="start" fill="var(--color-muted)">DDTL 5.5 · contrat du 7 août 2026 · mécanisme conditionnel</text>
<rect x="24" y="77" width="280" height="151" rx="5" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<g data-icon="alert" transform="translate(45 101) scale(0.85)" fill="none" stroke="var(--color-accent)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M0-11 11 9H-11ZM0-4v6M0 5v1"/></g>
<text x="64" y="106" font-size="15.2" font-weight="500" text-anchor="start" fill="var(--color-paper)">Déclencheur contractuel</text>
<text x="40" y="135" font-size="15.2" font-weight="400" text-anchor="start" fill="var(--color-paper)">Manquement substantiel non levé</text>
<text x="40" y="154" font-size="15.2" font-weight="400" text-anchor="start" fill="var(--color-paper)">au contrat client, ouvrant droit</text>
<text x="40" y="173" font-size="15.2" font-weight="400" text-anchor="start" fill="var(--color-paper)">à résiliation</text>
<text x="40" y="208" font-size="15.2" font-weight="500" text-anchor="start" fill="var(--color-accent)">OU ratio de valeur projetée &lt; 2,40</text>
