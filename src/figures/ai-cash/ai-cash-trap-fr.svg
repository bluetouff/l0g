<g data-icon="calendar" transform="translate(45 275) scale(0.9)" fill="none" stroke="var(--color-accent)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><rect x="-10" y="-8" width="20" height="18" rx="2"/><path d="M-5-11v6M5-11v6M-10-2H10M-5 3h2M3 3h2M-5 7h2"/></g>
<text x="67" y="276" font-size="15.2" font-weight="500" text-anchor="start" fill="var(--color-paper)">Persistance durant 3 échéances mensuelles consécutives</text>
<text x="40" y="300" font-size="15.2" font-weight="400" text-anchor="start" fill="var(--color-signal)">Sous 5 jours ouvrés : cash des comptes de sûreté vers le remboursement anticipé</text>
<text x="40" y="320" font-size="15.2" font-weight="400" text-anchor="start" fill="var(--color-muted)">Objectif : ratio &gt; 2,40 · dans la limite du cash présent</text>
<text x="24" y="347" font-size="15.2" font-weight="400" text-anchor="start" fill="var(--color-muted)">S04 · DDTL 5.5, §1.01, 2.09, 2.20 et 4.02 · 07/08/2026</text>
<text x="24" y="369" font-size="15.2" font-weight="400" text-anchor="start" fill="var(--color-muted)">Ratios sans unité · aucun déclenchement établi ; formule détaillée du ratio masquée</text>
</svg>
