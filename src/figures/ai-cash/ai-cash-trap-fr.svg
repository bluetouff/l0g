<path d="M394 195 400 199 394 203" fill="none" stroke="var(--color-signal)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="350" cy="153" r="2.5" fill="var(--color-signal)"/>
<rect x="400" y="77" width="336" height="77" rx="5" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<g data-icon="lock" transform="translate(421 100) scale(0.85)" fill="none" stroke="var(--color-signal)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><rect x="-9" y="-1" width="18" height="12" rx="2"/><path d="M-5-1v-5a5 5 0 0 1 10 0v5M0 3v4"/></g>
<text x="442" y="102" font-size="15.5" font-weight="500" text-anchor="start" fill="var(--color-paper)">Cash résiduel retenu</text>
<text x="442" y="124" font-size="15.2" font-weight="400" text-anchor="start" fill="var(--color-muted)">Rang 6, après charges éligibles,</text>
<text x="442" y="145" font-size="15.2" font-weight="400" text-anchor="start" fill="var(--color-muted)">intérêts, principal et réserve</text>
<rect x="400" y="170" width="336" height="58" rx="5" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<g data-icon="gate" transform="translate(421 193) scale(0.85)" fill="none" stroke="var(--color-signal)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-10-9V10M10-9V10M-10-5H10M-5-5V7M0-5V7M5-5V7"/><path d="M-12 10H-7M7 10H12"/></g>
<text x="442" y="198" font-size="15.5" font-weight="500" text-anchor="start" fill="var(--color-paper)">Nouveaux tirages bloqués</text>
<text x="442" y="217" font-size="15.2" font-weight="400" text-anchor="start" fill="var(--color-muted)">Conditions d’accès non remplies</text>
<line x1="164" y1="228" x2="164" y2="251" stroke="var(--color-muted)" stroke-width="1.3"/>
<path d="M160 245 164 251 168 245" fill="none" stroke="var(--color-muted)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
