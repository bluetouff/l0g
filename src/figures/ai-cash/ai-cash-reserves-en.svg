<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 375" role="img" aria-labelledby="ai-cash-en-reserves-d-title ai-cash-en-reserves-d-desc" font-family="Inter Variable, Inter, sans-serif" font-weight="400" class="ai-cash-svg" style="width:100%;height:auto">
<title id="ai-cash-en-reserves-d-title">Borrowing also funds the wait for rent</title>
<desc id="ai-cash-en-reserves-d-desc">APLD ComputeCo 2&#x27;s financing puts offering proceeds in escrow pending a certificate confirming, among other requirements, the electricity-agreement condition. Its 31 August 2026 10-Q says the condition was satisfied and release was instructed on 18 June. Initial allocations at release include $121 million for construction-period interest and a $148 million debt-service reserve. Once the interest account is depleted, the reserve may fund contractual payments; it must be replenished within fifteen business days, with a defined exception while a terminated lease is replaced. Amounts are initial allocations, not current balances. No reserve exhaustion or full delivery is inferred.</desc>
<text x="24" y="30" font-size="21" font-weight="500" text-anchor="start" fill="var(--color-paper)">Borrowing also funds the wait for rent</text>
<text x="24" y="53" font-size="15.2" font-weight="400" text-anchor="start" fill="var(--color-muted)">APLD ComputeCo 2 · initial contractual allocations</text>
<g data-icon="lock" transform="translate(90 95) scale(1)" fill="none" stroke="var(--color-muted)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><rect x="-9" y="-1" width="18" height="12" rx="2"/><path d="M-5-1v-5a5 5 0 0 1 10 0v5M0 3v4"/></g>
<g data-icon="power" transform="translate(380 95) scale(1)" fill="none" stroke="var(--color-signal)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="m2-11-9 13h7l-2 9L8-3H1Z"/></g>
<g data-icon="account" transform="translate(650 95) scale(1)" fill="none" stroke="var(--color-muted)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><rect x="-9" y="-10" width="18" height="20" rx="2"/><path d="M-5-5H5M-5 0H5M-5 5H1"/></g>
<text x="90" y="125" font-size="15.2" font-weight="500" text-anchor="middle" fill="var(--color-paper)">Offering proceeds</text>
<text x="90" y="145" font-size="15.2" font-weight="500" text-anchor="middle" fill="var(--color-paper)">held in escrow</text>
<text x="380" y="125" font-size="15.2" font-weight="500" text-anchor="middle" fill="var(--color-paper)">Electricity condition satisfied</text>
<text x="380" y="145" font-size="15.2" font-weight="500" text-anchor="middle" fill="var(--color-paper)">18 June 2026</text>
