<line x1="24" y1="340" x2="736" y2="340" stroke="var(--color-line-strong)" stroke-width="1.2"/>
<text x="24" y="357" font-size="15.2" font-weight="400" text-anchor="start" fill="var(--color-muted)">S05–S07 · 10 Mar 2026 agreement; 31 Aug 2026 10-Q · US$ m, initial allocations</text>
