<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 558" role="img" aria-labelledby="ai-cash-fr-trap-m-title ai-cash-fr-trap-m-desc" font-family="Inter Variable, Inter, sans-serif" font-weight="400" class="ai-cash-svg" style="width:100%;height:auto">
<title id="ai-cash-fr-trap-m-title">Le contrat peut retenir les recettes</title>
<desc id="ai-cash-fr-trap-m-desc">Dans DDTL 5.5, un manquement substantiel au contrat client non levé par écrit et permettant sa résiliation, ou un ratio de valeur contractuelle projetée inférieur à 2,40, déclenche un Cash Trap Event. Les flux résiduels sont retenus au rang six, après les dépenses éligibles, intérêts, principal et réserve de liquidité ; l’absence de cet événement conditionne également les nouveaux tirages. Sa persistance sur trois échéances mensuelles consécutives entraîne un remboursement anticipé sous cinq jours ouvrés à partir du cash des comptes de sûreté, pour atteindre un ratio supérieur à 2,40, dans la limite de l’argent présent. La formule détaillée du numérateur du ratio est masquée. Mécanisme contractuel : aucun déclenchement n’est établi par l’enquête. Les clauses prévoient des possibilités de levée des conditions par les prêteurs habilités.</desc>
<text x="20" y="29" font-size="18" font-weight="500" text-anchor="start" fill="var(--color-paper)">Le contrat peut retenir</text>
<text x="20" y="54" font-size="18" font-weight="500" text-anchor="start" fill="var(--color-paper)">les recettes</text>
<text x="20" y="78" font-size="14" font-weight="400" text-anchor="start" fill="var(--color-muted)">DDTL 5.5 · contrat du 7 août 2026</text>
<rect x="20" y="96" width="340" height="114" rx="5" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<g data-icon="alert" transform="translate(40 118) scale(0.85)" fill="none" stroke="var(--color-accent)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M0-11 11 9H-11ZM0-4v6M0 5v1"/></g>
<text x="60" y="123" font-size="15" font-weight="500" text-anchor="start" fill="var(--color-paper)">Déclencheur contractuel</text>
<text x="36" y="147" font-size="14" font-weight="400" text-anchor="start" fill="var(--color-paper)">Manquement substantiel non levé</text>
<text x="36" y="166" font-size="14" font-weight="400" text-anchor="start" fill="var(--color-paper)">ouvrant droit à résiliation du contrat client</text>
<text x="36" y="193" font-size="14" font-weight="500" text-anchor="start" fill="var(--color-accent)">OU ratio de valeur projetée &lt; 2,40</text>
<path d="M190 210V228H101V246" fill="none" stroke="var(--color-signal)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M97 240 101 246 105 240" fill="none" stroke="var(--color-signal)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M190 228H279V246" fill="none" stroke="var(--color-signal)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M275 240 279 246 283 240" fill="none" stroke="var(--color-signal)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="190" cy="228" r="2.5" fill="var(--color-signal)"/>
<rect x="20" y="246" width="162" height="95" rx="5" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<rect x="198" y="246" width="162" height="95" rx="5" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<g data-icon="lock" transform="translate(42 268) scale(0.75)" fill="none" stroke="var(--color-signal)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><rect x="-9" y="-1" width="18" height="12" rx="2"/><path d="M-5-1v-5a5 5 0 0 1 10 0v5M0 3v4"/></g>
<g data-icon="gate" transform="translate(220 268) scale(0.75)" fill="none" stroke="var(--color-signal)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-10-9V10M10-9V10M-10-5H10M-5-5V7M0-5V7M5-5V7"/><path d="M-12 10H-7M7 10H12"/></g>
<text x="101" y="291" font-size="14" font-weight="500" text-anchor="middle" fill="var(--color-paper)">Cash résiduel</text>
<text x="101" y="310" font-size="14" font-weight="500" text-anchor="middle" fill="var(--color-paper)">retenu</text>
<text x="101" y="331" font-size="14" font-weight="400" text-anchor="middle" fill="var(--color-muted)">Rang 6 de la cascade</text>
<text x="279" y="291" font-size="14" font-weight="500" text-anchor="middle" fill="var(--color-paper)">Nouveaux tirages</text>
<text x="279" y="310" font-size="14" font-weight="500" text-anchor="middle" fill="var(--color-paper)">bloqués</text>
<text x="279" y="331" font-size="14" font-weight="400" text-anchor="middle" fill="var(--color-muted)">accès sous conditions</text>
<text x="20" y="365" font-size="14" font-weight="400" text-anchor="start" fill="var(--color-muted)">Avant le rang 6 : charges éligibles, intérêts,</text>
<text x="20" y="384" font-size="14" font-weight="400" text-anchor="start" fill="var(--color-muted)">principal et réserve de liquidité.</text>
<rect x="20" y="394" width="340" height="110" rx="5" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text x="36" y="417" font-size="14" font-weight="500" text-anchor="start" fill="var(--color-paper)">Persistance : 3 échéances mensuelles</text>
<text x="36" y="435" font-size="14" font-weight="500" text-anchor="start" fill="var(--color-paper)">consécutives</text>
<text x="36" y="456" font-size="14" font-weight="400" text-anchor="start" fill="var(--color-signal)">Sous 5 jours ouvrés : prépaiement</text>
<text x="36" y="474" font-size="14" font-weight="400" text-anchor="start" fill="var(--color-signal)">avec le cash de sûreté ; ratio &gt; 2,40</text>
<text x="36" y="491" font-size="14" font-weight="400" text-anchor="start" fill="var(--color-muted)">Dans la limite du cash présent</text>
<text x="20" y="523" font-size="14" font-weight="400" text-anchor="start" fill="var(--color-muted)">S04 · contrat, §1.01, 2.09, 2.20 et 4.02</text>
<text x="20" y="540" font-size="14" font-weight="400" text-anchor="start" fill="var(--color-muted)">Ratios sans unité · aucun déclenchement établi</text>
</svg>
