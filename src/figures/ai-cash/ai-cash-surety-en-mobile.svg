<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 536" role="img" aria-labelledby="ai-cash-en-surety-m-title ai-cash-en-surety-m-desc" font-family="Inter Variable, Inter, sans-serif" font-weight="400" class="ai-cash-svg" style="width:100%;height:auto">
<title id="ai-cash-en-surety-m-title">A surety bond ties up cash</title>
<desc id="ai-cash-en-surety-m-desc">In August 2026, CoreWeave purchased $275 million in surety bonds securing obligations to an electricity provider over four years. It deposited $154 million in a trust for the sureties, classified as non-current restricted cash. The sureties may request further collateral; their consent is required to return trust assets. Their identities are not disclosed. The deposit is included in the $877 million non-current restricted-cash balance at 30 September. The note does not link this arrangement to a bank letter of credit. Lines are not proportional to amounts and do not represent losses.</desc>
<text x="20" y="29" font-size="18" font-weight="500" text-anchor="start" fill="var(--color-paper)">A surety bond</text>
<text x="20" y="54" font-size="18" font-weight="500" text-anchor="start" fill="var(--color-paper)">ties up cash</text>
<text x="20" y="78" font-size="14" font-weight="400" text-anchor="start" fill="var(--color-muted)">CoreWeave · 30 September 2026</text>
