<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 558" role="img" aria-labelledby="ai-cash-en-trap-m-title ai-cash-en-trap-m-desc" font-family="Inter Variable, Inter, sans-serif" font-weight="400" class="ai-cash-svg" style="width:100%;height:auto">
<title id="ai-cash-en-trap-m-title">The contract can hold back cash</title>
<desc id="ai-cash-en-trap-m-desc">Under DDTL 5.5, a continuing material customer-contract breach that has not been waived in writing and permits termination, or a projected contract-value ratio below 2.40, creates a Cash Trap Event. Residual cash is retained at the sixth waterfall step, after eligible expenses, interest, principal and the liquidity reserve. New advances also require the absence of such an event. If it persists for three consecutive monthly payment dates, the contract provides for prepayment within five business days using cash in collateral accounts, to bring the ratio above 2.40, limited to cash held there. The detailed numerator formula is redacted. This is a contractual mechanism; the investigation establishes no activation. Conditions may be waived by authorised lenders.</desc>
<text x="20" y="29" font-size="18" font-weight="500" text-anchor="start" fill="var(--color-paper)">The contract can</text>
<text x="20" y="54" font-size="18" font-weight="500" text-anchor="start" fill="var(--color-paper)">hold back cash</text>
<text x="20" y="78" font-size="14" font-weight="400" text-anchor="start" fill="var(--color-muted)">DDTL 5.5 · 7 August 2026 agreement</text>
<rect x="20" y="96" width="340" height="114" rx="5" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<g data-icon="alert" transform="translate(40 118) scale(0.85)" fill="none" stroke="var(--color-accent)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M0-11 11 9H-11ZM0-4v6M0 5v1"/></g>
<text x="60" y="123" font-size="15" font-weight="500" text-anchor="start" fill="var(--color-paper)">Contractual trigger</text>
<text x="36" y="147" font-size="14" font-weight="400" text-anchor="start" fill="var(--color-paper)">An unwaived material breach giving</text>
<text x="36" y="166" font-size="14" font-weight="400" text-anchor="start" fill="var(--color-paper)">the customer a right to terminate</text>
<text x="36" y="193" font-size="14" font-weight="500" text-anchor="start" fill="var(--color-accent)">OR projected-value ratio &lt; 2.40</text>
<path d="M190 210V228H101V246" fill="none" stroke="var(--color-signal)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M97 240 101 246 105 240" fill="none" stroke="var(--color-signal)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M190 228H279V246" fill="none" stroke="var(--color-signal)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M275 240 279 246 283 240" fill="none" stroke="var(--color-signal)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="190" cy="228" r="2.5" fill="var(--color-signal)"/>
<rect x="20" y="246" width="162" height="95" rx="5" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<rect x="198" y="246" width="162" height="95" rx="5" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<g data-icon="lock" transform="translate(42 268) scale(0.75)" fill="none" stroke="var(--color-signal)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><rect x="-9" y="-1" width="18" height="12" rx="2"/><path d="M-5-1v-5a5 5 0 0 1 10 0v5M0 3v4"/></g>
<g data-icon="gate" transform="translate(220 268) scale(0.75)" fill="none" stroke="var(--color-signal)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-10-9V10M10-9V10M-10-5H10M-5-5V7M0-5V7M5-5V7"/><path d="M-12 10H-7M7 10H12"/></g>
<text x="101" y="291" font-size="14" font-weight="500" text-anchor="middle" fill="var(--color-paper)">Residual cash</text>
<text x="101" y="310" font-size="14" font-weight="500" text-anchor="middle" fill="var(--color-paper)">retained</text>
<text x="101" y="331" font-size="14" font-weight="400" text-anchor="middle" fill="var(--color-muted)">Waterfall step 6</text>
<text x="279" y="291" font-size="14" font-weight="500" text-anchor="middle" fill="var(--color-paper)">New advances</text>
<text x="279" y="310" font-size="14" font-weight="500" text-anchor="middle" fill="var(--color-paper)">blocked</text>
<text x="279" y="331" font-size="14" font-weight="400" text-anchor="middle" fill="var(--color-muted)">conditional funding</text>
<text x="20" y="365" font-size="14" font-weight="400" text-anchor="start" fill="var(--color-muted)">Before step 6: eligible expenses, interest,</text>
<text x="20" y="384" font-size="14" font-weight="400" text-anchor="start" fill="var(--color-muted)">principal and the liquidity reserve.</text>
<rect x="20" y="394" width="340" height="110" rx="5" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/>
<text x="36" y="417" font-size="14" font-weight="500" text-anchor="start" fill="var(--color-paper)">Persistence: 3 consecutive</text>
<text x="36" y="435" font-size="14" font-weight="500" text-anchor="start" fill="var(--color-paper)">monthly payment dates</text>
<text x="36" y="456" font-size="14" font-weight="400" text-anchor="start" fill="var(--color-signal)">Within 5 business days: prepayment</text>
<text x="36" y="474" font-size="14" font-weight="400" text-anchor="start" fill="var(--color-signal)">using collateral cash; ratio &gt; 2.40</text>
<text x="36" y="491" font-size="14" font-weight="400" text-anchor="start" fill="var(--color-muted)">Limited to the cash in those accounts</text>
<text x="20" y="523" font-size="14" font-weight="400" text-anchor="start" fill="var(--color-muted)">S04 · agreement, §§1.01, 2.09, 2.20, 4.02</text>
<text x="20" y="540" font-size="14" font-weight="400" text-anchor="start" fill="var(--color-muted)">Unitless ratios · no activation established</text>
</svg>
