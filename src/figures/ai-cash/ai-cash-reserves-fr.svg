<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 375" role="img" aria-labelledby="ai-cash-fr-reserves-d-title ai-cash-fr-reserves-d-desc" font-family="Inter Variable, Inter, sans-serif" font-weight="400" class="ai-cash-svg" style="width:100%;height:auto">
<title id="ai-cash-fr-reserves-d-title">L’emprunt finance aussi l’attente du loyer</title>
<desc id="ai-cash-fr-reserves-d-desc">L’emprunt d’APLD ComputeCo 2 prévoit le séquestre du produit de l’émission jusqu’au certificat attestant notamment la condition d’accord électrique. Le 10-Q au 31 août 2026 indique que la condition a été satisfaite et l’instruction de libération donnée le 18 juin. Les affectations initiales prévues à la libération comprennent 121 millions de dollars pour les intérêts pendant la construction et 148 millions de réserve de service de la dette. Après épuisement du compte d’intérêts, la réserve peut servir aux paiements contractuels ; elle doit être reconstituée sous quinze jours ouvrés, avec une exception encadrée pendant le remplacement d’un bail résilié. Les chiffres indiquent les affectations initiales, et non les soldes actuels. Aucune réserve épuisée ni livraison totale n’est déduite.</desc>
<text x="24" y="30" font-size="21" font-weight="500" text-anchor="start" fill="var(--color-paper)">L’emprunt finance aussi l’attente du loyer</text>
<text x="24" y="53" font-size="15.2" font-weight="400" text-anchor="start" fill="var(--color-muted)">APLD ComputeCo 2 · affectations contractuelles initiales</text>
