<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 352" role="img" aria-labelledby="ai-cash-en-surety-d-title ai-cash-en-surety-d-desc" font-family="Inter Variable, Inter, sans-serif" font-weight="400" class="ai-cash-svg" style="width:100%;height:auto">
<title id="ai-cash-en-surety-d-title">A surety bond ties up cash</title>
<desc id="ai-cash-en-surety-d-desc">In August 2026, CoreWeave purchased $275 million in surety bonds securing obligations to an electricity provider over four years. It deposited $154 million in a trust for the sureties, classified as non-current restricted cash. The sureties may request further collateral; their consent is required to return trust assets. Their identities are not disclosed. The deposit is included in the $877 million non-current restricted-cash balance at 30 September. The note does not link this arrangement to a bank letter of credit. Lines are not proportional to amounts and do not represent losses.</desc>
<text x="24" y="30" font-size="21" font-weight="500" text-anchor="start" fill="var(--color-paper)">A surety bond ties up cash</text>
<text x="24" y="53" font-size="15.2" font-weight="400" text-anchor="start" fill="var(--color-muted)">CoreWeave · August 2026 · position at 30 September</text>
<g data-icon="server" transform="translate(86 98) scale(1)" fill="none" stroke="var(--color-muted)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><rect x="-9" y="-10" width="18" height="20" rx="2"/><path d="M-9-3H9M-9 4H9M-5-6h1M-5 1h1M-5 8h1M0-6h5M0 1h5M0 8h5"/></g>
<g data-icon="vault" transform="translate(290 98) scale(1)" fill="none" stroke="var(--color-muted)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><rect x="-10" y="-9" width="20" height="18" rx="2"/><circle cx="0" cy="0" r="5"/><path d="M0-5V5M-5 0H5M-6 9v2M6 9v2"/></g>
