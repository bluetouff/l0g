<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 536" role="img" aria-labelledby="ai-cash-en-reserves-m-title ai-cash-en-reserves-m-desc" font-family="Inter Variable, Inter, sans-serif" font-weight="400" class="ai-cash-svg" style="width:100%;height:auto">
<title id="ai-cash-en-reserves-m-title">Borrowing also funds the wait for rent</title>
<desc id="ai-cash-en-reserves-m-desc">APLD ComputeCo 2&#x27;s financing puts offering proceeds in escrow pending a certificate confirming, among other requirements, the electricity-agreement condition. Its 31 August 2026 10-Q says the condition was satisfied and release was instructed on 18 June. Initial allocations at release include $121 million for construction-period interest and a $148 million debt-service reserve. Once the interest account is depleted, the reserve may fund contractual payments; it must be replenished within fifteen business days, with a defined exception while a terminated lease is replaced. Amounts are initial allocations, not current balances. No reserve exhaustion or full delivery is inferred.</desc>
<text x="20" y="29" font-size="18" font-weight="500" text-anchor="start" fill="var(--color-paper)">Borrowing also funds</text>
<text x="20" y="54" font-size="18" font-weight="500" text-anchor="start" fill="var(--color-paper)">the wait for rent</text>
<text x="20" y="78" font-size="14" font-weight="400" text-anchor="start" fill="var(--color-muted)">APLD ComputeCo 2 · initial allocations</text>
<g data-icon="lock" transform="translate(40 111) scale(1)" fill="none" stroke="var(--color-muted)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><rect x="-9" y="-1" width="18" height="12" rx="2"/><path d="M-5-1v-5a5 5 0 0 1 10 0v5M0 3v4"/></g>
<text x="66" y="109" font-size="14" font-weight="400" text-anchor="start" fill="var(--color-paper)">Offering proceeds held in escrow</text>
<text x="66" y="129" font-size="14" font-weight="400" text-anchor="start" fill="var(--color-paper)">until the required certificate</text>
<line x1="40" y1="133" x2="40" y2="158" stroke="var(--color-muted)" stroke-width="1.3"/>
