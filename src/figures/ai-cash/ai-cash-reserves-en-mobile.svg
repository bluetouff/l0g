<text x="66" y="179" font-size="14" font-weight="500" text-anchor="start" fill="var(--color-paper)">Electricity condition satisfied</text>
<text x="66" y="199" font-size="14" font-weight="500" text-anchor="start" fill="var(--color-paper)">18 June 2026</text>
