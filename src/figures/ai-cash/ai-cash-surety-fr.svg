<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 352" role="img" aria-labelledby="ai-cash-fr-surety-d-title ai-cash-fr-surety-d-desc" font-family="Inter Variable, Inter, sans-serif" font-weight="400" class="ai-cash-svg" style="width:100%;height:auto">
<title id="ai-cash-fr-surety-d-title">Une caution immobilise déjà du cash</title>
<desc id="ai-cash-fr-surety-d-desc">CoreWeave a acheté en août 2026 des cautionnements de 275 millions de dollars couvrant ses obligations envers un fournisseur d’électricité sur quatre ans. Au bénéfice des garants, 154 millions ont été déposés dans un trust et classés en trésorerie restreinte non courante. Les garants peuvent demander un complément de sûreté ; leur accord est nécessaire à une restitution. Leurs noms ne sont pas publiés. Le dépôt est inclus dans les 877 millions de trésorerie restreinte non courante au 30 septembre. La note ne relie pas ce dispositif à une lettre de crédit bancaire. Les traits ne sont pas proportionnels aux montants et ne représentent aucune perte.</desc>
<text x="24" y="30" font-size="21" font-weight="500" text-anchor="start" fill="var(--color-paper)">Une caution immobilise déjà du cash</text>
<text x="24" y="53" font-size="15.2" font-weight="400" text-anchor="start" fill="var(--color-muted)">CoreWeave · août 2026 · situation au 30 septembre</text>
