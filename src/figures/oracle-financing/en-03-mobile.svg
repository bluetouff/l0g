 advance</text><text data-panel="oracle-en-03-m-frame" x="24" y="841" fill="var(--color-paper)" font-family="l0g Oracle" font-size="20" font-weight="400" text-anchor="start">line.</text><text data-panel="oracle-en-03-m-frame" x="24" y="912" fill="var(--color-paper)" font-family="l0g Oracle" font-size="20" font-weight="400" text-anchor="start">Excluding this line: −$16.759bn,</text><text data-panel="oracle-en-03-m-frame" x="24" y="941" fill="var(--color-paper)" font-family="l0g Oracle" font-size="20" font-weight="400" text-anchor="start">other flows held fixed.</text><text data-panel="oracle-en-03-m-frame" x="24" y="1014" fill="var(--color-muted)" font-family="l0g Oracle" font-size="18" font-weight="400" text-anchor="start">Arithmetic sensitivity for one quarter.</text></svg>
