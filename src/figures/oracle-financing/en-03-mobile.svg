<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1080" role="img" aria-labelledby="oracle-en-03-m-title oracle-en-03-m-desc" style="width:100%;height:auto" class="l0g-oracle-svg"><title id="oracle-en-03-m-title">Buildout spending exceeds cash flow</title><desc id="oracle-en-03-m-desc">Identified advances are included in operating cash flow, which capital expenditure exceeds.</desc><rect id="oracle-en-03-m-frame" x="0" y="0" width="420" height="1080" rx="0" fill="var(--color-ink)"/><text data-panel="oracle-en-03-m-frame" x="24" y="34" fill="var(--color-signal)" font-family="l0g Oracle" font-size="18" font-weight="700" text-anchor="start">l0g / ORACLE</text><text data-panel="oracle-en-03-m-frame" x="396" y="34" fill="var(--color-muted)" font-family="l0g Oracle" font-size="18" font-weight="400" text-anchor="end">03</text><text data-panel="oracle-en-03-m-frame" x="24" y="85" fill="var(--color-paper)" font-family="l0g Oracle" font-size="26" font-weight="700" text-anchor="start">Buildout spending</text><text data-panel="oracle-en-03-m-frame" x="24" y="122.7" fill="var(--color-paper)" font-family="l0g Oracle" font-size="26" font-weight="700" text-anchor="start">exceeds cash flow</text><text data-panel="oracle-en-03-m-frame" x="24" y="166" fill="var(--color-muted)" font-family="l0g Oracle" font-size="18" font-weight="400" text-anchor="start">June–August 2026 · USD billions</text><text data-panel="oracle-en-03-m-frame" x="24" y="224" fill="var(--color-paper)" font-family="l0g Oracle" font-size="22" font-weight="700" text-anchor="start">Operating cash flow: 23.103</text><text data-panel="oracle-en-03-m-frame" x="24" y="267" fill="var(--color-signal)" font-family="l0g Oracle" font-size="18" font-weight="400" text-anchor="start">Excluding advances</text><text data-panel="oracle-en-03-m-frame" x="396" y="267" fill="var(--color-amber)" font-family="l0g Oracle" font-size="18" font-weight="400" text-anchor="end">Identified advances</text><rect data-metric="operating-other-u