<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="oracle-en-02-title oracle-en-02-desc" style="width:100%;height:auto" class="l0g-oracle-svg"><title id="oracle-en-02-title">Funding shifts across the buildout</title><desc id="oracle-en-02-desc">Prepayments, vendor financing and customer hardware shift cash flows and obligations.</desc><rect id="oracle-en-02-frame" x="0" y="0" width="1000" height="680" rx="0" fill="var(--color-ink)"/><text data-panel="oracle-en-02-frame" x="40" y="34" fill="var(--color-signal)" font-family="l0g Oracle" font-size="24" font-weight="700" text-anchor="start">l0g / ORACLE</text><text data-panel="oracle-en-02-frame" x="960" y="34" fill="var(--color-muted)" font-family="l0g Oracle" font-size="24" font-weight="400" text-anchor="end">02</text><text data-panel="oracle-en-02-frame" x="40" y="85" fill="var(--color-paper)" font-family="l0g Oracle" font-size="34" font-weight="700" text-anchor="start">Funding shifts across the buildout</text><text data-panel="oracle-en-02-frame" x="40" y="135" fill="var(--color-muted)" font-family="l0g Oracle" font-size="24" font-weight="400" text-anchor="start">Resource today → future obligation</text><rect id="oracle-en-02-card-flow-0" x="40" y="171" width="920" height="124" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="oracle-en-02-card-flow-0" x="58" y="205" fill="var(--color-signal)" font-family="l0g Oracle" font-size="26" font-weight="700" text-anchor="start">Customer advance</text><text data-panel="oracle-en-02-card-flow-0" x="58" y="247" fill="var(--color-paper)" font-family="l0g Oracle" font-size="24" font-weight="400" text-anchor="start">Cash before the service</text><path data-connector="flow-0" d="M410 238 L488 238" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path data-connector="flow-0-tip" d="M479 231 L488 238 L479 245" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="oracle-en-02-card-flow-0" x="520" y="226" fill="var(--color-paper)" font-family="l0g Oracle" font-size="24" font-weight="400" text-anchor="start">Oracle then delivers the service</text><rect id="oracle-en-02-card-flow-1" x="40" y="303" width="920" height="124" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="oracle-en-02-card-flow-1" x="58" y="337" fill="var(--color-signal)" font-family="l0g Oracle" font-size="26" font-weight="700" text-anchor="start">Vendor financing</text><text data-panel="oracle-en-02-card-flow-1" x="58" y="379" fill="var(--color-paper)" font-family="l0g Oracle" font-size="24" font-weight="400" text-anchor="start">Equipment before full</text><text data-panel="oracle-en-02-card-flow-1" x="58" y="413.8" fill="var(--color-paper)" font-family="l0g Oracle" font-size="24" font-weight="400" text-anchor="start">payment</text><path data-connector="flow-1" d="M410 370 L488 370" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path data-connector="flow-1-tip" d="M479 363 L488 370 L479 377" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="oracle-en-02-card-flow-1" x="520" y="358" fill="var(--color-paper)" font-family="l0g Oracle" font-size="24" font-weight="400" text-anchor="start">Oracle pays the instalments</text><rect id="oracle-en-02-card-flow-2" x="40" y="435" width="920" height="124" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="oracle-en-02-card-flow-2" x="58" y="469" fill="var(--color-signal)" font-family="l0g Oracle" font-size="26" font-weight="700" text-anchor="start">Customer hardware</text><text data-panel="oracle-en-02-card-flow-2" x="58" y="511" fill="var(--color-paper)" font-family="l0g Oracle" font-size="24" font-weight="400" text-anchor="start">The client supplies</text><text data-panel="oracle-en-02-card-flow-2" x="58" y="545.8" fill="var(--color-paper)" font-family="l0g Oracle" font-size="24" font-weight="400" text-anchor="start">machines</text><path data-connector="flow-2" d="M410 502 L488 502" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path data-connector="flow-2-tip" d="M479 495 L488 502 L479 509" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="oracle-en-02-card-flow-2" x="520" y="490" fill="var(--color-paper)" font-family="l0g Oracle" font-size="24" font-weight="400" text-anchor="start">Oracle runs the capacity</text><rect id="oracle-en-02-card-capital" x="40" y="585" width="920" height="73" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="oracle-en-02-card-capital" x="58" y="617" fill="var(--color-amber)" font-family="l0g Oracle" font-size="26" font-weight="700" text-anchor="start">Another $20bn to raise</text><text data-panel="oracle-en-02-card-capital" x="58" y="646" fill="var(--color-paper)" font-family="l0g Oracle" font-size="24" font-weight="400" text-anchor="start">10 in equity + 10 in gross debt; refinancing excluded.</text></svg>
