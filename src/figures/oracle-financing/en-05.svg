<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="oracle-en-05-title oracle-en-05-desc" style="width:100%;height:auto" class="l0g-oracle-svg"><title id="oracle-en-05-title">Revenue and rent follow different terms</title><desc id="oracle-en-05-desc">RPO shares cover unequal recognition windows; future rent follows another timetable.</desc><rect id="oracle-en-05-frame" x="0" y="0" width="1000" height="680" rx="0" fill="var(--color-ink)"/><text data-panel="oracle-en-05-frame" x="40" y="34" fill="var(--color-signal)" font-family="l0g Oracle" font-size="24" font-weight="700" text-anchor="start">l0g / ORACLE</text><text data-panel="oracle-en-05-frame" x="960" y="34" fill="var(--color-muted)" font-family="l0g Oracle" font-size="24" font-weight="400" text-anchor="end">05</text><text data-panel="oracle-en-05-frame" x="40" y="85" fill="var(--color-paper)" font-family="l0g Oracle" font-size="34" font-weight="700" text-anchor="start">Revenue and rent follow different terms</text><text data-panel="oracle-en-05-frame" x="40" y="135" fill="var(--color-muted)" font-family="l0g Oracle" font-size="24" font-weight="400" text-anchor="start">At 31 August 2026 · USD billions</text><text data-panel="oracle-en-05-frame" x="40" y="185" fill="var(--color-paper)" font-family="l0g Oracle" font-size="28" font-weight="700" text-anchor="start">$664bn awaiting recognition</text><rect data-metric="rpo-share-pct" data-value="13" x="40" y="214" width="119.6" height="34" rx="0" fill="var(--color-signal)"/><rect data-metric="rpo-share-pct" data-value="37" x="159.6" y="214" width="340.4" height="34" rx="0" fill="var(--color-amber)"/><rect data-metric="rpo-share-pct" data-value="34" x="500" y="214" width="312.8" height="34" rx="0" fill="var(--color-accent)"/><rect data-metric="rpo-share-pct" data-value="16" x="812.8" y="214" width="147.2" height="34" rx="0" fill="var(--color-muted)"/><text data-panel="oracle-en-05-frame" x="40" y="293" fill="var(--color-signal)" font-family="l0g Oracle" font-size="28" font-weight="700" text-anchor="start">13 %</text><text data-panel="oracle-en-05-frame" x="40" y="332" fill="var(--color-paper)" font-family="l0g Oracle" font-size="24" font-weight="400" text-anchor="start">1–12 months</text><text data-panel="oracle-en-05-frame" x="40" y="372" fill="var(--color-muted)" font-family="l0g Oracle" font-size="24" font-weight="400" text-anchor="start">~ 86.3bn</text><text data-panel="oracle-en-05-frame" x="275" y="293" fill="var(--color-amber)" font-family="l0g Oracle" font-size="28" font-weight="700" text-anchor="start">37 %</text><text data-panel="oracle-en-05-frame" x="275" y="332" fill="var(--color-paper)" font-family="l0g Oracle" font-size="24" font-weight="400" text-anchor="start">13–36 months</text><text data-panel="oracle-en-05-frame" x="275" y="372" fill="var(--color-muted)" font-family="l0g Oracle" font-size="24" font-weight="400" text-anchor="start">~ 245.7bn</text><text data-panel="oracle-en-05-frame" x="510" y="293" fill="var(--color-accent)" font-family="l0g Oracle" font-size="28" font-weight="700" text-anchor="start">34 %</text><text data-panel="oracle-en-05-frame" x="510" y="332" fill="var(--color-paper)" font-family="l0g Oracle" font-size="24" font-weight="400" text-anchor="start">37–60 months</text><text data-panel="oracle-en-05-frame" x="510" y="372" fill="var(--color-muted)" font-family="l0g Oracle" font-size="24" font-weight="400" text-anchor="start">~ 225.8bn</text><text data-panel="oracle-en-05-frame" x="745" y="293" fill="var(--color-muted)" font-family="l0g Oracle" font-size="28" font-weight="700" text-anchor="start">16 %</text><text data-panel="oracle-en-05-frame" x="745" y="332" fill="var(--color-paper)" font-family="l0g Oracle" font-size="24" font-weight="400" text-anchor="start">After 60 months</text><text data-panel="oracle-en-05-frame" x="745" y="372" fill="var(--color-muted)" font-family="l0g Oracle" font-size="24" font-weight="400" text-anchor="start">~ 106.2bn</text><rect id="oracle-en-05-card-leases" x="40" y="424" width="920" height="180" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="oracle-en-05-card-leases" x="58" y="467" fill="var(--color-amber)" font-family="l0g Oracle" font-size="28" font-weight="700" text-anchor="start">$288bn future leases</text><text data-panel="oracle-en-05-card-leases" x="58" y="507" fill="var(--color-muted)" font-family="l0g Oracle" font-size="24" font-weight="400" text-anchor="start">Expected commencement</text><text data-panel="oracle-en-05-card-leases" x="520" y="507" fill="var(--color-paper)" font-family="l0g Oracle" font-size="26" font-weight="700" text-anchor="start">Q2 FY2027 → FY2029</text><path data-connector="lease-term" d="M58 537 L940 537" fill="none" stroke="var(--color-amber)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path data-connector="lease-term-tip" d="M931 530 L940 537 L931 544" fill="none" stroke="var(--color-amber)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="oracle-en-05-card-leases" x="58" y="580" fill="var(--color-paper)" font-family="l0g Oracle" font-size="26" font-weight="700" text-anchor="start">Then 15 to 19 years of rent</text><text data-panel="oracle-en-05-frame" x="40" y="645" fill="var(--color-muted)" font-family="l0g Oracle" font-size="24" font-weight="400" text-anchor="start">RPO shares and durations differ. Future rent is spread over time.</text></svg>
