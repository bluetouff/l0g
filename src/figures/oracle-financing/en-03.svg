<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="oracle-en-03-title oracle-en-03-desc" style="width:100%;height:auto" class="l0g-oracle-svg"><title id="oracle-en-03-title">Buildout spending exceeds cash flow</title><desc id="oracle-en-03-desc">Identified advances are included in operating cash flow, which capital expenditure exceeds.</desc><rect id="oracle-en-03-frame" x="0" y="0" width="1000" height="680" rx="0" fill="var(--color-ink)"/><text data-panel="oracle-en-03-frame" x="40" y="34" fill="var(--color-signal)" font-family="l0g Oracle" font-size="24" font-weight="700" text-anchor="start">l0g / ORACLE</text><text data-panel="oracle-en-03-frame" x="960" y="34" fill="var(--color-muted)" font-family="l0g Oracle" font-size="24" font-weight="400" text-anchor="end">03</text><text data-panel="oracle-en-03-frame" x="40" y="85" fill="var(--color-paper)" font-family="l0g Oracle" font-size="34" font-weight="700" text-anchor="start">Buildout spending exceeds cash flow</text><text data-panel="oracle-en-03-frame" x="40" y="135" fill="var(--color-muted)" font-family="l0g Oracle" font-size="24" font-weight="400" text-anchor="start">June–August 2026 · USD billions</text><text data-panel="oracle-en-03-frame" x="40" y="194" fill="var(--color-paper)" font-family="l0g Oracle" font-size="26" font-weight="700" text-anchor="start">Operating cash flow: 23.103</text><text data-panel="oracle-en-03-frame" x="40" y="234" fill="var(--color-signal)" font-family="l0g Oracle" font-size="24" font-weight="400" text-anchor="start">Excluding advances</text><text data-panel="oracle-en-03-frame" x="960" y="234" fill="var(--color-amber)" font-family="l0g Oracle" font-size="24" font-weight="400" text-anchor="end">Identified advances</text><rect data-metric="operating-other-usdbn" data-value="11.74" x="40" y="254" width="360.026667" height="40" rx="0" fill="var(--color-signal)"/><rect data-metric="customer-advances-usdbn" data-value="11.363" x="400.026667" y="254" width="348.465333" height="40" rx="0" fill="var(--color-amber)"/><text data-panel="oracle-en-03-frame" x="40" y="329" fill="var(--color-signal)" font-family="l0g Oracle" font-size="26" font-weight="700" text-anchor="start">11.74</text><text data-panel="oracle-en-03-frame" x="406.026667" y="329" fill="var(--color-amber)" font-family="l0g Oracle" font-size="26" font-weight="700" text-anchor="start">11.363</text><text data-panel="oracle-en-03-frame" x="40" y="391" fill="var(--color-paper)" font-family="l0g Oracle" font-size="26" font-weight="700" text-anchor="start">Cash capex: 28.499</text><rect data-metric="capex-usdbn" data-value="28.499" x="40" y="412" width="873.969333" height="40" rx="0" fill="var(--color-accent)"/><rect id="oracle-en-03-card-fcf" x="40" y="499" width="920" height="100" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="oracle-en-03-card-fcf" x="58" y="535" fill="var(--color-paper)" font-family="l0g Oracle" font-size="26" font-weight="700" text-anchor="start">Reported free cash flow</text><text data-panel="oracle-en-03-card-fcf" x="570" y="538" fill="var(--color-accent)" font-family="l0g Oracle" font-size="34" font-weight="700" text-anchor="start">−$5.396bn</text><text data-panel="oracle-en-03-card-fcf" x="570" y="577" fill="var(--color-muted)" font-family="l0g Oracle" font-size="24" font-weight="400" text-anchor="start">23.103 − 28.499</text><text data-panel="oracle-en-03-frame" x="40" y="642" fill="var(--color-amber)" font-family="l0g Oracle" font-size="26" font-weight="700" text-anchor="start">49.2% from advances</text></svg>
