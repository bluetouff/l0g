<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1080" role="img" aria-labelledby="oracle-en-04-m-title oracle-en-04-m-desc" style="width:100%;height:auto" class="l0g-oracle-svg"><title id="oracle-en-04-m-title">One advance, one cash receipt</title><desc id="oracle-en-04-m-desc">Two consistent calculations reconcile advances and manufacturer financing repayments.</desc><rect id="oracle-en-04-m-frame" x="0" y="0" width="420" height="1080" rx="0" fill="var(--color-ink)"/><text data-panel="oracle-en-04-m-frame" x="24" y="34" fill="var(--color-signal)" font-family="l0g Oracle" font-size="18" font-weight="700" text-anchor="start">l0g / ORACLE</text><text data-panel="oracle-en-04-m-frame" x="396" y="34" fill="var(--color-muted)" font-family="l0g Oracle" font-size="18" font-weight="400" text-anchor="end">04</text><text data-panel="oracle-en-04-m-frame" x="24" y="85" fill="var(--color-paper)" font-family="l0g Oracle" font-size="26" font-weight="700" text-anchor="start">One advance, one cash</text><text data-panel="oracle-en-04-m-frame" x="24" y="122.7" fill="var(--color-paper)" font-family="l0g Oracle" font-size="26" font-weight="700" text-anchor="start">receipt</text><text data-panel="oracle-en-04-m-frame" x="24" y="166" fill="var(--color-muted)" font-family="l0g Oracle" font-size="18" font-weight="400" text-anchor="start">June–August 2026 · USD billions</text><rect id="oracle-en-04-m-card-equation-0" x="24" y="210" width="372" height="230" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="oracle-en-04-m-card-equation-0" x="42" y="246" fill="var(--color-signal)" font-family="l0g Oracle" font-size="20" font-weight="700" text-anchor="start">A · Reported cash flows</text><text data-panel="oracle-en-04-m-card-equation-0" x="42" y="321" fill="var(--color-paper)" font-family="l0g Oracle" font-size="23" font-weight="700" text-anchor="start">23.103 − 28.499 − 0.830</text><text data-panel="oracle-en-04-m-card-equation-0" x="42" y="365" fill="var(--color-muted)" font-family="l0g Oracle" font-size="18" font-weight="400" text-anchor="start">Operating cash − capex −</text><text data-panel="oracle-en-04-m-card-equation-0" x="42" y="391.1" fill="var(--color-muted)" font-family="l0g Oracle" font-size="18" font-weight="400" text-anchor="start">manufacturer repayment</text><rect id="oracle-en-04-m-card-equation-1" x="24" y="480" width="372" height="230" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="oracle-en-04-m-card-equation-1" x="42" y="516" fill="var(--color-signal)" font-family="l0g Oracle" font-size="20" font-weight="700" text-anchor="start">B · Advance removed on</text><text data-panel="oracle-en-04-m-card-equation-1" x="42" y="545" fill="var(--color-signal)" font-family="l0g Oracle" font-size="20" font-weight="700" text-anchor="start">both sides</text><text data-panel="oracle-en-04-m-card-equation-1" x="42" y="591" fill="var(--color-paper)" font-family="l0g Oracle" font-size="23" font-weight="700" text-anchor="start">11.740 − 17.966</text><text data-panel="oracle-en-04-m-card-equation-1" x="42" y="635" fill="var(--color-muted)" font-family="l0g Oracle" font-size="18" font-weight="400" text-anchor="start">Cash excluding advances − net</text><text data-panel="oracle-en-04-m-card-equation-1" x="42" y="661.1" fill="var(--color-muted)" font-family="l0g Oracle" font-size="18" font-weight="400" text-anchor="start">capex cash outlay</text><path data-connector="same-result" d="M210 727 L210 774" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path data-connector="same-result-tip" d="M203 765 L210 774 L217 765" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect id="oracle-en-04-m-card-balance" x="24" y="800" width="372" height="131" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="oracle-en-04-m-card-balance" x="42" y="845" fill="var(--color-amber)" font-family="l0g Oracle" font-size="24" font-weight="700" text-anchor="start">Balance: −$6.226bn</text><text data-panel="oracle-en-04-m-card-balance" x="42" y="889" fill="var(--color-paper)" font-family="l0g Oracle" font-size="18" font-weight="400" text-anchor="start">Includes $0.830bn of manufacturer</text><text data-panel="oracle-en-04-m-card-balance" x="42" y="915.1" fill="var(--color-paper)" font-family="l0g Oracle" font-size="18" font-weight="400" text-anchor="start">financing repaid.</text><text data-panel="oracle-en-04-m-frame" x="24" y="984" fill="var(--color-muted)" font-family="l0g Oracle" font-size="18" font-weight="400" text-anchor="start">Reported FCF remains −$5.396bn. Other</text><text data-panel="oracle-en-04-m-frame" x="24" y="1010.1" fill="var(--color-muted)" font-family="l0g Oracle" font-size="18" font-weight="400" text-anchor="start">financing flows are outside this</text><text data-panel="oracle-en-04-m-frame" x="24" y="1036.2" fill="var(--color-muted)" font-family="l0g Oracle" font-size="18" font-weight="400" text-anchor="start">reconciliation.</text></svg>
