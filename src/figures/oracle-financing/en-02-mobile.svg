<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1080" role="img" aria-labelledby="oracle-en-02-m-title oracle-en-02-m-desc" style="width:100%;height:auto" class="l0g-oracle-svg"><title id="oracle-en-02-m-title">Funding shifts across the buildout</title><desc id="oracle-en-02-m-desc">Prepayments, vendor financing and customer hardware shift cash flows and obligations.</desc><rect id="oracle-en-02-m-frame" x="0" y="0" width="420" height="1080" rx="0" fill="var(--color-ink)"/><text data-panel="oracle-en-02-m-frame" x="24" y="34" fill="var(--color-signal)" font-family="l0g Oracle" font-size="18" font-weight="700" text-anchor="start">l0g / ORACLE</text><text data-panel="oracle-en-02-m-frame" x="396" y="34" fill="var(--color-muted)" font-family="l0g Oracle" font-size="18" font-weight="400" text-anchor="end">02</text><text data-panel="oracle-en-02-m-frame" x="24" y="85" fill="var(--color-paper)" font-family="l0g Oracle" font-size="26" font-weight="700" text-anchor="start">Funding shifts across</text><text data-panel="oracle-en-02-m-frame" x="24" y="122.7" fill="var(--color-paper)" font-family="l0g Oracle" font-size="26" font-weight="700" text-anchor="start">the buildout</text><text data-panel="oracle-en-02-m-frame" x="24" y="166" fill="var(--color-muted)" font-family="l0g Oracle" font-size="18" font-weight="400" text-anchor="start">Resource today → future obligation</text><rect id="oracle-en-02-m-card-flow-0" x="24" y="201" width="372" height="214" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="oracle-en-02-m-card-flow-0" x="42" y="235" fill="var(--color-signal)" font-family="l0g Oracle" font-size="22" font-weight="700" text-anchor="start">Customer advance</text><text data-panel="oracle-en-02-m-card-flow-0" x="42" y="272" fill="var(--color-paper)" font-family="l0g Oracle" font-size="18" font-weight="400" text-anchor="start">Cash before the service</text><path data-connector="flow-0" d="M210 289 L210 313" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path data-connector="flow-0-tip" d="M203 304 L210 313 L217 304" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="oracle-en-02-m-card-flow-0" x="42" y="343" fill="var(--color-paper)" font-family="l0g Oracle" font-size="18" font-weight="400" text-anchor="start">Oracle then delivers the service</text><text data-panel="oracle-en-02-m-card-flow-0" x="42" y="374" fill="var(--color-muted)" font-family="l0g Oracle" font-size="18" font-weight="400" text-anchor="start">Part of future revenue is already</text><text data-panel="oracle-en-02-m-card-flow-0" x="42" y="400.1" fill="var(--color-muted)" font-family="l0g Oracle" font-size="18" font-weight="400" text-anchor="start">collected.</text><rect id="oracle-en-02-m-card-flow-1" x="24" y="433" width="372" height="214" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="oracle-en-02-m-card-flow-1" x="42" y="467" fill="var(--color-signal)" font-family="l0g Oracle" font-size="22" font-weight="700" text-anchor="start">Vendor financing</text><text data-panel="oracle-en-02-m-card-flow-1" x="42" y="504" fill="var(--color-paper)" font-family="l0g Oracle" font-size="18" font-weight="400" text-anchor="start">Equipment before full payment</text><path data-connector="flow-1" d="M210 521 L210 545" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path data-connector="flow-1-tip" d="M203 536 L210 545 L217 536" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="oracle-en-02-m-card-flow-1" x="42" y="575" fill="var(--color-paper)" font-family="l0g Oracle" font-size="18" font-weight="400" text-anchor="start">Oracle pays the instalments</text><text data-panel="oracle-en-02-m-card-flow-1" x="42" y="606" fill="var(--color-muted)" font-family="l0g Oracle" font-size="18" font-weight="400" text-anchor="start">The timing of a cash outflow shifts.</text><rect id="oracle-en-02-m-card-flow-2" x="24" y="665" width="372" height="214" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="oracle-en-02-m-card-flow-2" x="42" y="699" fill="var(--color-signal)" font-family="l0g Oracle" font-size="22" font-weight="700" text-anchor="start">Customer hardware</text><text data-panel="oracle-en-02-m-card-flow-2" x="42" y="736" fill="var(--color-paper)" font-family="l0g Oracle" font-size="18" font-weight="400" text-anchor="start">The client supplies machines</text><path data-connector="flow-2" d="M210 753 L210 777" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path data-connector="flow-2-tip" d="M203 768 L210 777 L217 768" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="oracle-en-02-m-card-flow-2" x="42" y="807" fill="var(--color-paper)" font-family="l0g Oracle" font-size="18" font-weight="400" text-anchor="start">Oracle runs the capacity</text><text data-panel="oracle-en-02-m-card-flow-2" x="42" y="838" fill="var(--color-muted)" font-family="l0g Oracle" font-size="18" font-weight="400" text-anchor="start">The investment perimeter changes.</text><rect id="oracle-en-02-m-card-capital" x="24" y="916" width="372" height="132" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="oracle-en-02-m-card-capital" x="42" y="950" fill="var(--color-amber)" font-family="l0g Oracle" font-size="20" font-weight="700" text-anchor="start">Another $20bn to raise</text><text data-panel="oracle-en-02-m-card-capital" x="42" y="986" fill="var(--color-paper)" font-family="l0g Oracle" font-size="18" font-weight="400" text-anchor="start">10 in equity + 10 in gross debt;</text><text data-panel="oracle-en-02-m-card-capital" x="42" y="1012.1" fill="var(--color-paper)" font-family="l0g Oracle" font-size="18" font-weight="400" text-anchor="start">refinancing excluded.</text></svg>
