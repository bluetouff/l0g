<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1080" role="img" aria-labelledby="oracle-fr-05-m-title oracle-fr-05-m-desc" style="width:100%;height:auto" class="l0g-oracle-svg"><title id="oracle-fr-05-m-title">Des recettes et des loyers décalés</title><desc id="oracle-fr-05-m-desc">Les parts de RPO se rapportent à des fenêtres inégales ; les loyers futurs suivent un autre calendrier.</desc><rect id="oracle-fr-05-m-frame" x="0" y="0" width="420" height="1080" rx="0" fill="var(--color-ink)"/><text data-panel="oracle-fr-05-m-frame" x="24" y="34" fill="var(--color-signal)" font-family="l0g Oracle" font-size="18" font-weight="700" text-anchor="start">l0g / ORACLE</text><text data-panel="oracle-fr-05-m-frame" x="396" y="34" fill="var(--color-muted)" font-family="l0g Oracle" font-size="18" font-weight="400" text-anchor="end">05</text><text data-panel="oracle-fr-05-m-frame" x="24" y="85" fill="var(--color-paper)" font-family="l0g Oracle" font-size="26" font-weight="700" text-anchor="start">Des recettes et des</text><text data-panel="oracle-fr-05-m-frame" x="24" y="122.7" fill="var(--color-paper)" font-family="l0g Oracle" font-size="26" font-weight="700" text-anchor="start">loyers décalés</text><text data-panel="oracle-fr-05-m-frame" x="24" y="166" fill="var(--color-muted)" font-family="l0g Oracle" font-size="18" font-weight="400" text-anchor="start">Au 31 août 2026 · milliards USD</text><text data-panel="oracle-fr-05-m-frame" x="24" y="218" fill="var(--color-paper)" font-family="l0g Oracle" font-size="22" font-weight="700" text-anchor="start">664 Md$ de prestations</text><text data-panel="oracle-fr-05-m-frame" x="24" y="266" fill="var(--color-paper)" font-family="l0g Oracle" font-size="20" font-weight="400" text-anchor="start">1–12 mois</text><text data-panel="oracle-fr-05-m-frame" x="396" y="266" fill="var(--color-signal)" font-family="l0g Oracle" font-size="22" font-weight="700" text-anchor="end">13 %</text><rect data-metric="rpo-share-pct" data-value="13" x="24" y="284" width="48.36" height="24" rx="0" fill="var(--color-signal)"/><text data-panel="oracle-fr-05-m-frame" x="24" y="359" fill="var(--color-paper)" font-family="l0g Oracle" font-size="20" font-weight="400" text-anchor="start">13–36 mois</text><text data-panel="oracle-fr-05-m-frame" x="396" y="359" fill="var(--color-amber)" font-family="l0g Oracle" font-size="22" font-weight="700" text-anchor="end">37 %</text><rect data-metric="rpo-share-pct" data-value="37" x="24" y="377" width="137.64" height="24" rx="0" fill="var(--color-amber)"/><text data-panel="oracle-fr-05-m-frame" x="24" y="452" fill="var(--color-paper)" font-family="l0g Oracle" font-size="20" font-weight="400" text-anchor="start">37–60 mois</text><text data-panel="oracle-fr-05-m-frame" x="396" y="452" fill="var(--color-accent)" font-family="l0g Oracle" font-size="22" font-weight="700" text-anchor="end">34 %</text><rect data-metric="rpo-share-pct" data-value="34" x="24" y="470" width="126.48" height="24" rx="0" fill="var(--color-accent)"/><text data-panel="oracle-fr-05-m-frame" x="24" y="545" fill="var(--color-paper)" font-family="l0g Oracle" font-size="20" font-weight="400" text-anchor="start">Après 60 mois</text><text data-panel="oracle-fr-05-m-frame" x="396" y="545" fill="var(--color-muted)" font-family="l0g Oracle" font-size="22" font-weight="700" text-anchor="end">16 %</text><rect data-metric="rpo-share-pct" data-value="16" x="24" y="563" width="59.52" height="24" rx="0" fill="var(--color-muted)"/><rect id="oracle-fr-05-m-card-leases" x="24" y="680" width="372" height="265" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="oracle-fr-05-m-card-leases" x="42" y="722" fill="var(--color-amber)" font-family="l0g Oracle" font-size="21" font-weight="700" text-anchor="start">288 Md$ de baux à démarrer</text><text data-panel="oracle-fr-05-m-card-leases" x="42" y="765" fill="var(--color-muted)" font-family="l0g Oracle" font-size="18" font-weight="400" text-anchor="start">Début attendu</text><text data-panel="oracle-fr-05-m-card-leases" x="42" y="800" fill="var(--color-paper)" font-family="l0g Oracle" font-size="20" font-weight="700" text-anchor="start">Q2 FY2027 → FY2029</text><path data-connector="lease-term" d="M42 832 L378 832" fill="none" stroke="var(--color-amber)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path data-connector="lease-term-tip" d="M369 825 L378 832 L369 839" fill="none" stroke="var(--color-amber)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text data-panel="oracle-fr-05-m-card-leases" x="42" y="884" fill="var(--color-paper)" font-family="l0g Oracle" font-size="22" font-weight="700" text-anchor="start">Puis 15 à 19 ans de bail</text><text data-panel="oracle-fr-05-m-frame" x="24" y="997" fill="var(--color-muted)" font-family="l0g Oracle" font-size="18" font-weight="400" text-anchor="start">Parts de RPO et durées distinctes. Les</text><text data-panel="oracle-fr-05-m-frame" x="24" y="1023.1" fill="var(--color-muted)" font-family="l0g Oracle" font-size="18" font-weight="400" text-anchor="start">loyers futurs sont étalés.</text></svg>
