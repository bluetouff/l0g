<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="oracle-en-04-title oracle-en-04-desc" style="width:100%;height:auto" class="l0g-oracle-svg"><title id="oracle-en-04-title">One advance, one cash receipt</title><desc id="oracle-en-04-desc">Two consistent calculations reconcile advances and manufacturer financing repayments.</desc><rect id="oracle-en-04-frame" x="0" y="0" width="1000" height="680" rx="0" fill="var(--color-ink)"/><text data-panel="oracle-en-04-frame" x="40" y="34" fill="var(--color-signal)" font-family="l0g Oracle" font-size="24" font-weight="700" text-anchor="start">l0g / ORACLE</text><text data-panel="oracle-en-04-frame" x="960" y="34" fill="var(--color-muted)" font-family="l0g Oracle" font-size="24" font-weight="400" text-anchor="end">04</text><text data-panel="oracle-en-04-frame" x="40" y="85" fill="var(--color-paper)" font-family="l0g Oracle" font-size="34" font-weight="700" text-anchor="start">One advance, one cash receipt</text><text data-panel="oracle-en-04-frame" x="40" y="135" fill="var(--color-muted)" font-family="l0g Oracle" font-size="24" font-weight="400" text-anchor="start">June–August 2026 · USD billions</text><rect id="oracle-en-04-card-equation-0" x="40" y="180" width="920" height="145" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="oracle-en-04-card-equation-0" x="58" y="216" fill="var(--color-signal)" font-family="l0g Oracle" font-size="26" font-weight="700" text-anchor="start">A · Reported cash flows</text><text data-panel="oracle-en-04-card-equation-0" x="58" y="264" fill="var(--color-paper)" font-family="l0g Oracle" font-size="32" font-weight="700" text-anchor="start">23.103 − 28.499 − 0.830</text><text data-panel="oracle-en-04-card-equation-0" x="58" y="302" fill="var(--color-muted)" font-family="l0g Oracle" font-size="24" font-weight="400" text-anchor="start">Operating cash − capex − manufacturer repayment</text><rect id="oracle-e