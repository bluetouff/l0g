<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="oracle-fr-03-title oracle-fr-03-desc" style="width:100%;height:auto" class="l0g-oracle-svg"><title id="oracle-fr-03-title">Le chantier dépasse le cash reçu</title><desc id="oracle-fr-03-desc">Les avances identifiées font partie du flux opérationnel ; les investissements le dépassent.</desc><rect id="oracle-fr-03-frame" x="0" y="0" width="1000" height="680" rx="0" fill="var(--color-ink)"/><text data-panel="oracle-fr-03-frame" x="40" y="34" fill="var(--color-signal)" font-family="l0g Oracle" font-size="24" font-weight="700" text-anchor="start">l0g / ORACLE</text><text data-panel="oracle-fr-03-frame" x="960" y="34" fill="var(--color-muted)" font-family="l0g Oracle" font-size="24" font-weight="400" text-anchor="end">03</text><text data-panel="oracle-fr-03-frame" x="40" y="85" fill="var(--color-paper)" font-family="l0g Oracle" font-size="34" font-weight="700" text-anchor="start">Le chantier dépasse le cash reçu</text><text data-panel="oracle-fr-03-frame" x="40" y="135" fill="var(--color-muted)" font-family="l0g Oracle" font-size="24" font-weight="400" text-anchor="start">Juin–août 2026 · milliards USD</text><text data-panel="oracle-fr-03-frame" x="40" y="194" fill="var(--color-paper)" font-family="l0g Oracle" font-size="26" font-weight="700" text-anchor="start">Flux opérationnel : 23,103</text><text data-panel="oracle-fr-03-frame" x="40" y="234" fill="var(--color-signal)" font-family="l0g Oracle" font-size="24" font-weight="400" text-anchor="start">Hors avances</text><text data-panel="oracle-fr-03-frame" x="960" y="234" fill="var(--color-amber)" font-family="l0g Oracle" font-size="24" font-weight="400" text-anchor="end">Avances identifiées</text><rect data-metric="operating-other-usdbn" data-value="11.74" x="40" y="254" width="360.026667" height="40" rx="0" fill="var(--color-signal)"/><rect data-metric="customer-advances-usdbn" data-value="11.363" x="400.026667" y="254" width="348.