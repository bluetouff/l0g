<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1080" role="img" aria-labelledby="oracle-fr-03-m-title oracle-fr-03-m-desc" style="width:100%;height:auto" class="l0g-oracle-svg"><title id="oracle-fr-03-m-title">Le chantier dépasse le cash reçu</title><desc id="oracle-fr-03-m-desc">Les avances identifiées font partie du flux opérationnel ; les investissements le dépassent.</desc><rect id="oracle-fr-03-m-frame" x="0" y="0" width="420" height="1080" rx="0" fill="var(--color-ink)"/><text data-panel="oracle-fr-03-m-frame" x="24" y="34" fill="var(--color-signal)" font-family="l0g Oracle" font-size="18" font-weight="700" text-anchor="start">l0g / ORACLE</text><text data-panel="oracle-fr-03-m-frame" x="396" y="34" fill="var(--color-muted)" font-family="l0g Oracle" font-size="18" font-weight="400" text-anchor="end">03</text><text data-panel="oracle-fr-03-m-frame" x="24" y="85" fill="var(--color-paper)" font-family="l0g Oracle" font-size="26" font-weight="700" text-anchor="start">Le chantier dépasse le</text><text data-panel="oracle-fr-03-m-frame" x="24" y="122.7" fill="var(--color-paper)" font-family="l0g Oracle" font-size="26" font-weight="700" text-anchor="start">cash reçu</text><text data-panel="oracle-fr-03-m-frame" x="24" y="166" fill="var(--color-muted)" font-family="l0g Oracle" font-size="18" font-weight="400" text-anchor="start">Juin–août 2026 · milliards USD</text><text data-panel="oracle-fr-03-m-frame" x="24" y="224" fill="var(--color-paper)" font-family="l0g Oracle" font-size="22" font-weight="700" text-anchor="start">Flux opérationnel : 23,103</text><text data-panel="oracle-fr-03-m-frame" x="24" y="267" fill="var(--color-signal)" font-family="l0g Oracle" font-size="18" font-weight="400" text-anchor="start">Hors avances</text><text data-panel="oracle-fr-03-m-frame" x="396" y="267" fill="var(--color-amber)" font-family="l0g Oracle" font-size="18" font-weight="400" text-anchor="end">Avances identifiées</text><rect data-metric="operating-other-usdbn" data-value="11.74" x="24" y="289" width="145.576" height="40" rx="0" fill="var(--color-signal)"/><rect data-metric="customer-advances-usdbn" data-value="11.363" x="169.576" y="289" width="140.9012" height="40" rx="0" fill="var(--color-amber)"/><text data-panel="oracle-fr-03-m-frame" x="24" y="361" fill="var(--color-signal)" font-family="l0g Oracle" font-size="22" font-weight="700" text-anchor="start">11,74</text><text data-panel="oracle-fr-03-m-frame" x="175.576" y="361" fill="var(--color-amber)" font-family="l0g Oracle" font-size="22" font-weight="700" text-anchor="start">11,363</text><text data-panel="oracle-fr-03-m-frame" x="24" y="431" fill="var(--color-paper)" font-family="l0g Oracle" font-size="22" font-weight="700" text-anchor="start">Investissements payés : 28,499</text><rect data-metric="capex-usdbn" data-value="28.499" x="24" y="454" width="353.3876" height="40" rx="0" fill="var(--color-accent)"/><rect id="oracle-fr-03-m-card-fcf" x="24" y="550" width="372" height="153" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="oracle-fr-03-m-card-fcf" x="42" y="590" fill="var(--color-paper)" font-family="l0g Oracle" font-size="22" font-weight="700" text-anchor="start">Free cash-flow publié</text><text data-panel="oracle-fr-03-m-card-fcf" x="42" y="640" fill="var(--color-accent)" font-family="l0g Oracle" font-size="32" font-weight="700" text-anchor="start">−5,396 Md$</text><text data-panel="oracle-fr-03-m-card-fcf" x="42" y="678" fill="var(--color-muted)" font-family="l0g Oracle" font-size="18" font-weight="400" text-anchor="start">23,103 − 28,499</text><text data-panel="oracle-fr-03-m-frame" x="24" y="774" fill="var(--color-amber)" font-family="l0g Oracle" font-size="24" font-weight="700" text-anchor="start">49,2 % du flux opérationnel</text><text data-panel="oracle-fr-03-m-frame" x="24" y="812" fill="var(--color-paper)" font-family="l0g Oracle" font-size="20" font-weight="400" text-anchor="start">provient de la seule ligne d’avances</text><text data-panel="oracle-fr-03-m-frame" x="24" y="841" fill="var(--color-paper)" font-family="l0g Oracle" font-size="20" font-weight="400" text-anchor="start">identifiée.</text><text data-panel="oracle-fr-03-m-frame" x="24" y="912" fill="var(--color-paper)" font-family="l0g Oracle" font-size="20" font-weight="400" text-anchor="start">Hors cette ligne : −16,759 Md$, à</text><text data-panel="oracle-fr-03-m-frame" x="24" y="941" fill="var(--color-paper)" font-family="l0g Oracle" font-size="20" font-weight="400" text-anchor="start">autres flux constants.</text><text data-panel="oracle-fr-03-m-frame" x="24" y="1014" fill="var(--color-muted)" font-family="l0g Oracle" font-size="18" font-weight="400" text-anchor="start">Sensibilité arithmétique d’un trimestre.</text></svg>
