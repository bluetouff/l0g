<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1080" role="img" aria-labelledby="oracle-fr-04-m-title oracle-fr-04-m-desc" style="width:100%;height:auto" class="l0g-oracle-svg"><title id="oracle-fr-04-m-title">Une avance, un seul encaissement</title><desc id="oracle-fr-04-m-desc">Deux calculs cohérents rapprochent les avances et les remboursements de financement fabricant.</desc><rect id="oracle-fr-04-m-frame" x="0" y="0" width="420" height="1080" rx="0" fill="var(--color-ink)"/><text data-panel="oracle-fr-04-m-frame" x="24" y="34" fill="var(--color-signal)" font-family="l0g Oracle" font-size="18" font-weight="700" text-anchor="start">l0g / ORACLE</text><text data-panel="oracle-fr-04-m-frame" x="396" y="34" fill="var(--color-muted)" font-family="l0g Oracle" font-size="18" font-weight="400" text-anchor="end">04</text><text data-panel="oracle-fr-04-m-frame" x="24" y="85" fill="var(--color-paper)" font-family="l0g Oracle" font-size="26" font-weight="700" text-anchor="start">Une avance, un seul</text><text data-panel="oracle-fr-04-m-frame" x="24" y="122.7" fill="var(--color-paper)" font-family="l0g Oracle" font-size="26" font-weight="700" text-anchor="start">encaissement</text><text data-panel="oracle-fr-04-m-frame" x="24" y="166" fill="var(--color-muted)" font-family="l0g Oracle" font-size="18" font-weight="400" text-anchor="start">Juin–août 2026 · milliards USD</text><rect id="oracle-fr-04-m-card-equation-0" x="24" y="210" width="372" height="230" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="oracle-fr-04-m-card-equation-0" x="42" y="246" fill="var(--color-signal)" font-family="l0g Oracle" font-size="20" font-weight="700" text-anchor="start">A · Flux publiés</text><text data-panel="oracle-fr-04-m-card-equation-0" x="42" y="321" fill="var(--color-paper)" font-family="l0g Oracle" font-size="23" font-weight="700" text-anchor="start">23,103 − 28,499 − 0,830</text><text data-panel="oracle-fr-04-m-card-equation-0" x="42" y="365" fill="var(--color-muted)" font-family="l0g Oracle" font-size="18" font-weight="400" text-anchor="start">Cash opérationnel − capex −</text><text data-panel="oracle-fr-04-m-card-equation-0" x="42" y="391.1" fill="var(--color-muted)" font-family="l0g Oracle" font-size="18" font-weight="400" text-anchor="start">remboursement fabricant</text><rect id="oracle-fr-04-m-card-equation-1" x="24" y="480" width="372" height="230" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="oracle-fr-04-m-card-equation-1" x="42" y="516" fill="var(--color-signal)" font-family="l0g Oracle" font-size="20" font-weight="700" text-anchor="start">B · Avance retirée des deux</text><text data-panel="oracle-fr-04-m-card-equation-1" x="42" y="545" fill="var(--color-signal)" font-family="l0g Oracle" font-size="20" font-weight="700" text-anchor="start">côtés</text><text data-panel="oracle-fr-04-m-card-equation-1" x="42" y="591" fill="var(--color-paper)" font-family="l0g Oracle" font-size="23" font-weight="700" text-anchor="start">11,740 − 17,966</text><text data-panel="oracle-fr-04-m-card-equation-1" x="42" y="635" fill="var(--color-muted)" font-family="l0g Oracle" font-size="18" font-weight="400" text-anchor="start">Cash hors avances − décaissement</text><text data-panel="oracle-fr-04-m-card-equation-1" x="42" y="661.1" fill="var(--color-muted)" font-family="l0g Oracle" font-size="18" font-weight="400" text-anchor="start">net capex</text><path data-connector="same-result" d="M210 727 L210 774" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path data-connector="same-result-tip" d="M203 765 L210 774 L217 765" fill="none" stroke="var(--color-signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect id="oracle-fr-04-m-card-balance" x="24" y="800" width="372" height="131" rx="8" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-wi