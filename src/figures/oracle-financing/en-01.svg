<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="oracle-en-01-title oracle-en-01-desc" style="width:100%;height:auto" class="l0g-oracle-svg"><title id="oracle-en-01-title">Revenue growth needs funding</title><desc id="oracle-en-01-desc">Reported Oracle revenue and future targets, with management cash-flow milestones.</desc><rect id="oracle-en-01-frame" x="0" y="0" width="1000" height="680" rx="0" fill="var(--color-ink)"/><text data-panel="oracle-en-01-frame" x="40" y="34" fill="var(--color-signal)" font-family="l0g Oracle" font-size="24" font-weight="700" text-anchor="start">l0g / ORACLE</text><text data-panel="oracle-en-01-frame" x="960" y="34" fill="var(--color-muted)" font-family="l0g Oracle" font-size="24" font-weight="400" text-anchor="end">01</text><text data-panel="oracle-en-01-frame" x="40" y="85" fill="var(--color-paper)" font-family="l0g Oracle" font-size="34" font-weight="700" text-anchor="start">Revenue growth needs funding</text><text data-panel="oracle-en-01-frame" x="40" y="135" fill="var(--color-muted)" font-family="l0g Oracle" font-size="24" font-weight="400" text-anchor="start">Revenue · USD billions</text><text data-panel="oracle-en-01-frame" x="40" y="196" fill="var(--color-paper)" font-family="l0g Oracle" font-size="26" font-weight="700" text-anchor="start">FY2026</text><text data-panel="oracle-en-01-frame" x="960" y="196" fill="var(--color-muted)" font-family="l0g Oracle" font-size="24" font-weight="400" text-anchor="end">reported 67.357</text><rect data-metric="revenue-usdbn" data-value="67.357" x="250" y="214" width="191.29388" height="22" rx="0" fill="var(--color-signal)"/><text data-panel="oracle-en-01-frame" x="40" y="279" fill="var(--color-paper)" font-family="l0g Oracle" font-size="26" font-weight="700" text-anchor="start">FY2027</text><text data-panel="oracle-en-01-frame" x="960" y="279" fill="var(--color-muted)" font-family="l0g Oracle" font-size="24" font-weight="400" text-anchor="end">minimum