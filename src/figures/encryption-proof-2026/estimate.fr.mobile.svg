<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 920" role="img" aria-labelledby="proof-estimate-fr-m-title proof-estimate-fr-m-desc" class="l0g-proof-svg" style="width:100%;height:auto">
<title id="proof-estimate-fr-m-title">La construction de l’estimation AES</title><desc id="proof-estimate-fr-m-desc">Étude réalisée pour le NIST en 2018 : données de 74 répondants, modèle pour 95 autres, soit 169 ; extrapolation sectorielle selon l’emploi représenté, secteurs avec au moins dix répondants. Résultat de 250,6 milliards de dollars constants de 2017 de bénéfices bruts estimés, cumulés à 2017 au taux réel annuel de 7 %. Programme étudié : 1996–2017 ; bénéfices élémentaires : 1998–2017. Incertitude initiale non quantifiable.</desc>
