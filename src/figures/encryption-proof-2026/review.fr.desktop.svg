<title id="proof-review-fr-d-title">Un dispositif suivi et réexaminé</title><desc id="proof-review-fr-d-desc">Proposition éditoriale l0g : décrire une capacité, comparer gain et risques, fixer conditions et moyens, observer résultats, échecs, incidents et coûts puis réexaminer la décision. Les observations peuvent conduire à corriger, suspendre ou retirer le dispositif, ou à revoir les hypothèses initiales. Modèle de décision sans durée, fréquence, probabilité ou procédure légale universelle.</desc>
