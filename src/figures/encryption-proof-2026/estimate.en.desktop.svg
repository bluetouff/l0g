<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="proof-estimate-en-d-title proof-estimate-en-d-desc" class="l0g-proof-svg" style="width:100%;height:auto">
<title id="proof-estimate-en-d-title">Building the AES estimate</title><desc id="proof-estimate-en-d-desc">2018 NIST-commissioned study: data from 74 respondents, modelling for 95 more, totalling 169; sector extrapolation by employment share, sectors with at least ten respondents. Result: estimated gross benefits of $250.6 billion in constant 2017 dollars, accumulated to 2017 at a 7% annual real rate. Program evaluated: 1996–2017; underlying benefits: 1998–2017. Initial uncertainty cannot be quantified.</desc>
