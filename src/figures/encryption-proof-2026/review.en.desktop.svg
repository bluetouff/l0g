<title id="proof-review-en-d-title">Monitoring and reconsidering a measure</title><desc id="proof-review-en-d-desc">l0g editorial proposal: define a capability, compare gains and risks, set conditions and resources, observe outcomes, failures, incidents and costs, then reconsider the decision. Observations may lead to correcting, suspending or withdrawing the measure, or revisiting the initial assumptions. Decision model with no duration, frequency, probability or universal legal procedure.</desc>
