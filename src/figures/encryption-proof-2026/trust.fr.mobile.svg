<title id="proof-trust-fr-m-title">L’inquiétude selon les destinataires envisagés</title><desc id="proof-trust-fr-m-desc">FRA, terrain du 6 au 30 novembre 2025. Part pondérée des personnes de 15 ans et plus inquiètes, notes 5 à 7 sur 7, d’un accès aux communications privées à leur insu ou sans permission. France puis UE : criminalité 64/62 %, gouvernements étrangers 49/49, entreprises 50/47, renseignement national 37/42, gouvernement national 41/42, forces de l’ordre 33/37. France incluse dans l’UE ; 26 453 répondants UE, non-utilisateurs compris. Comparaison descriptive, sans intervalle de confiance fourni.</desc>
