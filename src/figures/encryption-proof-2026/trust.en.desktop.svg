<title id="proof-trust-en-d-title">Concern by potential recipient</title><desc id="proof-trust-en-d-desc">FRA fieldwork, 6–30 November 2025. Weighted share of people aged 15 and over concerned, scores 5–7 of 7, about access to private communications without their knowledge or permission. France then EU: criminals 64/62%, foreign governments 49/49, businesses 50/47, national intelligence 37/42, national government 41/42, law enforcement 33/37. France is part of the EU; 26,453 EU respondents, non-users included. Descriptive comparison, with no supplied confidence intervals.</desc>
