<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="cl05-money-en-d-t cl05-money-en-d-d" style="width:100%;height:auto" class="l0g-machines05-svg"><title id="cl05-money-en-d-t">Compare loss and cash flows</title><desc id="cl05-money-en-d-d">Fictional case: €35,000 economic loss and €55,000 relative cash deterioration, reconciled by €20,000 of extra closing inventory.</desc><rect id="cl05-money-en-d-frame" x="0" y="0" width="1000" height="680" rx="0" fill="var(--color-ink)" stroke="none" stroke-width="0"/><text data-panel="cl05-money-en-d-frame" x="28" y="45" font-family="l0g Cold Loss" font-size="24" font-weight="400" fill="var(--color-signal)" text-anchor="start">l0g / MACHINES</text><text data-panel="cl05-money-en-d-frame" x="972" y="45" font-family="l0g Cold Loss" font-size="24" font-weight="400" fill="var(--color-muted)" text-anchor="end">02</text><text data-panel="cl05-money-en-d-frame" x="28" y="100" font-family="l0g Cold Loss" font-size="36" font-weight="700" fill="var(--color-paper)" text-anchor="start">Compare loss and cash flows</text><text data-panel="cl05-money-en-d-frame" x="28" y="140" font-family="l0g Cold Loss" font-size="24" font-weight="400" fill="var(--color-muted)" text-anchor="start">FICTIONAL CASE · EUR excluding VAT · opening stock prepaid</text><rect id="cl05-money-en-d-panel-money-0" x="28" y="186" width="448" height="285" rx="7" fill="var(--color-surface-2)" stroke="none" stroke-width="0" data-view="result" data-baseline="10000" data-incident="-25000" data-difference="35000"/><text data-panel="cl05-money-en-d-panel-money-0" x="44" y="221" font-family="l0g Cold Loss" font-size="27" font-weight="400" fill="var(--color-paper)" text-anchor="start">Period result</text><text data-panel="cl05-money-en-d-panel-money-0" x="44" y="259" font-family="l0g Cold Loss" font-size="24" font-weight="400" fill="var(--color-muted)" text-anchor="start">Normal</text><text data-panel="cl05-money-en-d-panel-money-0" x="44" y="300" font-family="l0g Cold Loss" font-size="36" font-weight="400" fill="var(--color-signal)" text-anchor="start">+10,000 €</text><text data-panel="cl05-money-en-d-panel-money-0" x="44" y="343" font-family="l0g Cold Loss" font-size="24" font-weight="400" fill="var(--color-muted)" text-anchor="start">Incident</text><text data-panel="cl05-money-en-d-panel-money-0" x="44" y="384" font-family="l0g Cold Loss" font-size="36" font-weight="400" fill="var(--color-accent)" text-anchor="start">−25,000 €</text><text data-panel="cl05-money-en-d-panel-money-0" x="44" y="450" font-family="l0g Cold Loss" font-size="32" font-weight="400" fill="var(--color-amber)" text-anchor="start">Loss: 35,000 €</text><rect id="cl05-money-en-d-panel-money-1" x="524" y="186" width="448" height="285" rx="7" fill="var(--color-surface-2)" stroke="none" stroke-width="0" data-view="cash" data-baseline="30000" data-incident="-25000" data-difference="55000"/><text data-panel="cl05-money-en-d-panel-money-1" x="540" y="221" font-family="l0g Cold Loss" font-size="27" font-weight="400" fill="var(--color-paper)" text-anchor="start">Period cash flow</text><text data-panel="cl05-money-en-d-panel-money-1" x="540" y="259" font-family="l0g Cold Loss" font-size="24" font-weight="400" fill="var(--color-muted)" text-anchor="start">Normal</text><text data-panel="cl05-money-en-d-panel-money-1" x="540" y="300" font-family="l0g Cold Loss" font-size="36" font-weight="400" fill="var(--color-signal)" text-anchor="start">+30,000 €</text><text data-panel="cl05-money-en-d-panel-money-1" x="540" y="343" font-family="l0g Cold Loss" font-size="24" font-weight="400" fill="var(--color-muted)" text-anchor="start">Incident</text><text data-panel="cl05-money-en-d-panel-money-1" x="540" y="384" font-family="l0g Cold Loss" font-size="36" font-weight="400" fill="var(--color-accent)" text-anchor="start">−25,000 €</text><text data-panel="cl05-money-en-d-panel-money-1" x="540" y="450" font-family="l0g Cold Loss" font-size="32" font-weight="400" fill="var(--color-amber)" text-anchor="start">Gap: 55,000 €</text><rect id="cl05-money-en-d-panel-reconcile" x="28" y="520" width="944" height="80" rx="7" fill="var(--color-ink)" stroke="var(--color-signal)" stroke-width="1" data-closing-stock="20000" data-recovery-outflow="25000"/><text data-panel="cl05-money-en-d-panel-reconcile" x="44" y="555" font-family="l0g Cold Loss" font-size="32" font-weight="400" fill="var(--color-paper)" text-anchor="start">55,000 − 20,000 = 35,000 €</text><text data-panel="cl05-money-en-d-panel-reconcile" x="44" y="589" font-family="l0g Cold Loss" font-size="24" font-weight="400" fill="var(--color-muted)" text-anchor="start">New closing stock, still unsold: €20,000</text><text data-panel="cl05-money-en-d-frame" x="28" y="640" font-family="l0g Cold Loss" font-size="24" font-weight="400" fill="var(--color-paper)" text-anchor="start">Recovery outflows: 20,000 + 5,000 = €25,000.</text><text data-panel="cl05-money-en-d-frame" x="28" y="670" font-family="l0g Cold Loss" font-size="24" font-weight="400" fill="var(--color-muted)" text-anchor="start">[03, 04]</text></svg>