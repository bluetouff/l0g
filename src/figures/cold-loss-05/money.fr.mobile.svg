<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1080" role="img" aria-labelledby="cl05-money-fr-m-t cl05-money-fr-m-d" style="width:100%;height:auto" class="l0g-machines05-svg"><title id="cl05-money-fr-m-t">Comparer la perte et la trésorerie</title><desc id="cl05-money-fr-m-d">Cas fictif : perte économique de 35 000 €, écart de trésorerie de 55 000 €, réconciliés par 20 000 € de stock final supplémentaire.</desc><rect id="cl05-money-fr-m-frame" x="0" y="0" width="420" height="1080" rx="0" fill="var(--color-ink)" stroke="none" stroke-width="0"/><text data-panel="cl05-money-fr-m-frame" x="28" y="40" font-family="l0g Cold Loss" font-size="18" font-weight="400" fill="var(--color-signal)" text-anchor="start">l0g / MACHINES</text><text data-panel="cl05-money-fr-m-frame" x="392" y="40" font-family="l0g Cold Loss" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="end">02</text><text data-panel="cl05-money-fr-m-frame" x="28" y="88" font-family="l0g Cold Loss" font-size="27" font-weight="700" fill="var(--color-paper)" text-anchor="start">Comparer la perte et la</text><text data-panel="cl05-money-fr-m-frame" x="28" y="123" font-family="l0g Cold Loss" font-size="27" font-weight="700" fill="var(--color-paper)" text-anchor="start">trésorerie</text><text data-panel="cl05-money-fr-m-frame" x="28" y="156" font-family="l0g Cold Loss" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">CAS FICTIF · euros hors TVA · stock</text><text data-panel="cl05-money-fr-m-frame" x="28" y="181" font-family="l0g Cold Loss" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">initial déjà payé</text><rect id="cl05-money-fr-m-panel-money-0" x="28" y="195" width="364" height="245" rx="7" fill="var(--color-surface-2)" stroke="none" stroke-width="0" data-view="result" data-baseline="10000" data-incident="-25000" data-difference="35000"/><text data-panel="cl05-money-fr-m-panel-money-0" x="44" y="230" font-family="l0g Cold Loss" font-size="23" font-weight="400" fill="var(--color-paper)" text-anchor="start">Résultat de période</text><text data-panel="cl05-money-fr-m-panel-money-0" x="44" y="278" font-family="l0g Cold Loss" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">Sans incident</text><text data-panel="cl05-money-fr-m-panel-money-0" x="206" y="283" font-family="l0g Cold Loss" font-size="27" font-weight="400" fill="var(--color-signal)" text-anchor="start">+10 000 €</text><text data-panel="cl05-money-fr-m-panel-money-0" x="44" y="333" font-family="l0g Cold Loss" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">Avec incident</text><text data-panel="cl05-money-fr-m-panel-money-0" x="206" y="338" font-family="l0g Cold Loss" font-size="27" font-weight="400" fill="var(--color-accent)" text-anchor="start">−25 000 €</text><text data-panel="cl05-money-fr-m-panel-money-0" x="44" y="402" font-family="l0g Cold Loss" font-size="30" font-weight="400" fill="var(--color-amber)" text-anchor="start">Perte : 35 000 €</text><rect id="cl05-money-fr-m-panel-money-1" x="28" y="470" width="364" height="245" rx="7" fill="var(--color-surface-2)" stroke="none" stroke-width="0" data-view="cash" data-baseline="30000" data-incident="-25000" data-difference="55000"/><text data-panel="cl05-money-fr-m-panel-money-1" x="44" y="505" font-family="l0g Cold Loss" font-size="23" font-weight="400" fill="var(--color-paper)" text-anchor="start">Flux de trésorerie</text><text data-panel="cl05-money-fr-m-panel-money-1" x="44" y="553" font-family="l0g Cold Loss" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">Sans incident</text><text data-panel="cl05-money-fr-m-panel-money-1" x="206" y="558" font-family="l0g Cold Loss" font-size="27" font-weight="400" fill="var(--color-signal)" text-anchor="start">+30 000 €</text><text data-panel="cl05-money-fr-m-panel-money-1" x="44" y="608" font-family="l0g Cold Loss" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">Avec incident</text><text data-panel="cl05-money-fr-m-panel-money-1" x="206" y="613" font-family="l0g Cold Loss" font-size="27" font-weight="400" fill="var(--color-accent)" text-anchor="start">−25 000 €</text><text data-panel="cl05-money-fr-m-panel-money-1" x="44" y="677" font-family="l0g Cold Loss" font-size="30" font-weight="400" fill="var(--color-amber)" text-anchor="start">Écart : 55 000 €</text><rect id="cl05-money-fr-m-panel-reconcile" x="28" y="760" width="364" height="125" rx="7" fill="var(--color-ink)" stroke="var(--color-signal)" stroke-width="1" data-closing-stock="20000" data-recovery-outflow="25000"/><text data-panel="cl05-money-fr-m-panel-reconcile" x="44" y="800" font-family="l0g Cold Loss" font-size="22" font-weight="400" fill="var(--color-paper)" text-anchor="start">55 000 − 20 000 = 35 000 €</text><text data-panel="cl05-money-fr-m-panel-reconcile" x="44" y="839" font-family="l0g Cold Loss" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">Stock final neuf, invendu : 20 000 €</text><rect id="cl05-money-fr-m-panel-outflows" x="28" y="935" width="364" height="85" rx="7" fill="var(--color-ink)" stroke="var(--color-line-strong)" stroke-width="1"/><text data-panel="cl05-money-fr-m-panel-outflows" x="44" y="965" font-family="l0g Cold Loss" font-size="18" font-weight="400" fill="var(--color-paper)" text-anchor="start">Décaissé pour la reprise : 20 000 +</text><text data-panel="cl05-money-fr-m-panel-outflows" x="44" y="989" font-family="l0g Cold Loss" font-size="18" font-weight="400" fill="var(--color-paper)" text-anchor="start">5 000 = 25 000 €.</text><text data-panel="cl05-money-fr-m-frame" x="28" y="1060" font-family="l0g Cold Loss" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">[03, 04]</text></svg>