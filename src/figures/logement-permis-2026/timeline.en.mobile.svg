<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 275" width="100%" height="auto" style="width:100%;height:auto" role="img" xml:lang="en" aria-labelledby="hpf-timeline-en-mobile-title hpf-timeline-en-mobile-desc">
<title id="hpf-timeline-en-mobile-title">Timelines for a new building</title>
<desc id="hpf-timeline-en-mobile-desc">Separate medians as reported by permit applicants: 13.03 weeks for formal review and 43.45 weeks for the full process. The full process includes post-decision steps, some of which can take place during construction.</desc>
<rect x="0" y="0" width="320" height="275" rx="13" fill="var(--color-surface)"/>
<rect x="0.5" y="0.5" width="319" height="274" rx="13" fill="none" stroke="var(--color-line)"/>
<text x="17" y="32" fill="var(--color-paper)" font-size="16" font-weight="400" text-anchor="start">Timelines for a new building</text>
<text x="17" y="53" fill="var(--color-muted)" font-size="12.2" font-weight="400" text-anchor="start">Applicant survey · March to May 2026</text>
<line x1="17" y1="64" x2="303" y2="64" stroke="var(--color-line)" stroke-width="1"/>
<text x="17" y="85" fill="var(--color-muted)" font-size="12" font-weight="400" text-anchor="start">Median weeks</text>
<text x="17" y="103" fill="var(--color-muted)" font-size="12.1" font-weight="400" text-anchor="start">0</text>
<line x1="17" y1="109" x2="17" y2="218" stroke="var(--color-line-strong)" stroke-width="1" stroke-dasharray="0"/>
<text x="74.2" y="103" fill="var(--color-muted)" font-size="12.1" font-weight="400" text-anchor="middle">10</text>
<line x1="74.2" y1="109" x2="74.2" y2="218" stroke="var(--color-line)" stroke-width="1" stroke-dasharray="3 4"/>
<text x="131.4" y="103" fill="var(--color-muted)" font-size="12.1" font-weight="400" text-anchor="middle">20</text>
<line x1="131.4" y1="109" x2="131.4" y2="218" stroke="var(--color-line)" stroke-width="1" stroke-dasharray="3 4"/>
<text x="188.6" y="103" fill="var(--color-muted)" font-size="12.1" font-weight="400" text-anchor="middle">30</text>
<line x1="188.6" y1="109" x2="188.6" y2="218" stroke="var(--color-line)" stroke-width="1" stroke-dasharray="3 4"/>
<text x="245.8" y="103" fill="var(--color-muted)" font-size="12.1" font-weight="400" text-anchor="middle">40</text>
<line x1="245.8" y1="109" x2="245.8" y2="218" stroke="var(--color-line)" stroke-width="1" stroke-dasharray="3 4"/>
<text x="303" y="103" fill="var(--color-muted)" font-size="12.1" font-weight="400" text-anchor="end">50</text>
<line x1="303" y1="109" x2="303" y2="218" stroke="var(--color-line)" stroke-width="1" stroke-dasharray="3 4"/>
<text x="17" y="134" fill="var(--color-paper)" font-size="13.6" font-weight="400" text-anchor="start">Formal review</text>
<rect x="17" y="143" width="286" height="11" rx="2" fill="var(--color-surface-2)"/>
<rect x="17" y="143" width="74.532" height="11" rx="2" fill="var(--color-topic-blue)" opacity=".85"/>
<text x="300" y="134" fill="var(--color-topic-blue)" font-size="15" font-weight="400" text-anchor="end">13.03</text>
<text x="17" y="189" fill="var(--color-paper)" font-size="13.6" font-weight="400" text-anchor="start">Full process</text>
<rect x="17" y="198" width="286" height="11" rx="2" fill="var(--color-surface-2)"/>
<rect x="17" y="198" width="248.534" height="11" rx="2" fill="var(--color-signal)" opacity=".85"/>
<text x="300" y="189" fill="var(--color-signal)" font-size="15" font-weight="400" text-anchor="end">43.45</text>
<line x1="17" y1="228" x2="17" y2="260" stroke="var(--color-signal)" stroke-width="1.4"/>
<text x="26" y="241" fill="var(--color-muted)" font-size="12.2" font-weight="400" text-anchor="start">The full process includes</text>
<text x="26" y="258" fill="var(--color-muted)" font-size="12.2" font-weight="400" text-anchor="start">post-decision steps.</text>
</svg>
