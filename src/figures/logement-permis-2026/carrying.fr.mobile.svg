<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 273" width="100%" height="auto" style="width:100%;height:auto" role="img" xml:lang="fr" aria-labelledby="hpf-carrying-fr-mobile-title hpf-carrying-fr-mobile-desc">
<title id="hpf-carrying-fr-mobile-title">Intérêts sur 1 M€ emprunté</title>
<desc id="hpf-carrying-fr-mobile-desc">Simulation à intérêt simple sur un million d’euros de dette mobilisée, maintenue à encours constant. À un taux annuel hypothétique de 5 %, six mois coûtent 25 000 euros et douze mois 50 000 euros. Les deux autres taux hypothétiques sont 3 % et 7 %.</desc>
