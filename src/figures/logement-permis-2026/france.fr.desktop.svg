<title id="hpf-france-fr-desktop-title">Du permis au chantier</title>
<desc id="hpf-france-fr-desktop-desc">En France hors Mayotte, les cumuls de douze mois des logements autorisés et commencés sont deux flux qui portent sur des cohortes différentes. Dernier point, septembre 2026 : 377 834 logements autorisés et 318 419 logements commencés.</desc>
