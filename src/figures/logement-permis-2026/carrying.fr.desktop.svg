<text x="521" y="224" fill="var(--color-muted)" font-size="12.1" font-weight="400" text-anchor="middle">24</text>
<text x="575" y="224" fill="var(--color-muted)" font-size="12.1" font-weight="400" text-anchor="end">Mois</text>
