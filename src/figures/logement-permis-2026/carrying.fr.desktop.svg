<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 276" width="100%" height="auto" style="width:100%;height:auto" role="img" xml:lang="fr" aria-labelledby="hpf-carrying-fr-desktop-title hpf-carrying-fr-desktop-desc">
<title id="hpf-carrying-fr-desktop-title">Intérêts sur 1 M€ emprunté</title>
<desc id="hpf-carrying-fr-desktop-desc">Simulation à intérêt simple sur un million d’euros de dette mobilisée, maintenue à encours constant. À un taux annuel hypothétique de 5 %, six mois coûtent 25 000 euros et douze mois 50 000 euros. Les deux autres taux hypothétiques sont 3 % et 7 %.</desc>
<rect x="0" y="0" width="600" height="276" rx="13" fill="var(--color-surface)"/>
<rect x="0.5" y="0.5" width="599" height="275" rx="13" fill="none" stroke="var(--color-line)"/>
<text x="25" y="32" fill="var(--color-paper)" font-size="18" font-weight="400" text-anchor="start">Intérêts sur 1 M€ emprunté</text>
<text x="25" y="53" fill="var(--color-muted)" font-size="12.2" font-weight="400" text-anchor="start">Simulation · intérêts en milliers d’euros</text>
<line x1="25" y1="64" x2="575" y2="64" stroke="var(--color-line)" stroke-width="1"/>
<text x="54" y="210" fill="var(--color-muted)" font-size="12.1" font-weight="400" text-anchor="end">0</text>
