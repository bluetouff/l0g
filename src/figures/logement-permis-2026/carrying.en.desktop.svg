<text x="54" y="127.333" fill="var(--color-muted)" font-size="12.1" font-weight="400" text-anchor="end">100</text>
<line x1="62" y1="123.333" x2="521" y2="123.333" stroke="var(--color-line)" stroke-width="1"/>
<text x="54" y="86" fill="var(--color-muted)" font-size="12.1" font-weight="400" text-anchor="end">150</text>
