<line x1="62" y1="82" x2="62" y2="206" stroke="var(--color-line)" stroke-width="1"/>
<text x="62" y="224" fill="var(--color-muted)" font-size="12.1" font-weight="400" text-anchor="middle">0</text>
<line x1="176.75" y1="82" x2="176.75" y2="206" stroke="var(--color-line)" stroke-width="1"/>
<text x="176.75" y="224" fill="var(--color-muted)" font-size="12.1" font-weight="400" text-anchor="middle">6</text>
