<rect x="0.5" y="0.5" width="599" height="275" rx="13" fill="none" stroke="var(--color-line)"/>
<text x="25" y="32" fill="var(--color-paper)" font-size="18" font-weight="400" text-anchor="start">Interest on €1m of debt</text>
<text x="25" y="53" fill="var(--color-muted)" font-size="12.2" font-weight="400" text-anchor="start">Illustrative scenario · interest in € thousands</text>
<line x1="25" y1="64" x2="575" y2="64" stroke="var(--color-line)" stroke-width="1"/>
<text x="54" y="210" fill="var(--color-muted)" font-size="12.1" font-weight="400" text-anchor="end">0</text>
