<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 276" width="100%" height="auto" style="width:100%;height:auto" role="img" xml:lang="en" aria-labelledby="hpf-carrying-en-desktop-title hpf-carrying-en-desktop-desc">
<title id="hpf-carrying-en-desktop-title">Interest on €1m of debt</title>
<desc id="hpf-carrying-en-desktop-desc">Simple interest on €1 million of drawn debt at a constant balance. At an illustrative annual rate of 5%, six months cost €25,000 and twelve months €50,000. The two other illustrative rates are 3% and 7%.</desc>
