<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="ai-private-en-map-d-title ai-private-en-map-d-desc" font-family="Inter Variable, Inter, sans-serif" font-weight="400" style="width:100%;height:auto" class="ai-private-credit-svg">
  <title id="ai-private-en-map-d-title">The fund, the loan and the banks</title>
  <desc id="ai-private-en-map-d-desc">OTF holds an $8.969 million funded CoreWeave loan and owns the subsidiary Athena Funding III. The subsidiary’s agreement amended on 11 September 2026 identifies a $150 million Deutsche Bank commitment and a $100 million First Citizens commitment. The facility has $75 million outstanding in total at 30 September 2026, with no lender breakdown of drawings identified in the documents reviewed. The documents reviewed do not establish allocation of the CoreWeave loan to Athena III, so no arrow connects the two. This map does not assign a quantified CoreWeave exposure to either bank.</desc>
  <text x="24" y="31" font-size="22" font-weight="500" text-anchor="start" fill="var(--color-paper)">The fund and its banks</text>
  <text x="24" y="55" font-size="15.2" font-weight="400" text-anchor="start" fill="var(--color-muted)">OTF · a portfolio holding and a subsidiary’s funding</text>
  <rect x="24" y="88" width="452" height="192" rx="5" fill="none" stroke="var(--color-line-strong)" stroke-width="1" />
  <g data-icon="folder" transform="translate(48 110) scale(0.5)" fill="none" stroke="var(--color-muted)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="M-17-10H-3l5 5H17V15H-17Z"/><path d="M-17 0H17"/></g>
  <text x="70" y="115" font-size="15.2" font-weight="500" text-anchor="start" fill="var(--color-paper)">OTF · consolidated group</text>
  <line x1="246" y1="136" x2="246" y2="232" stroke="var(--color-line-strong)" stroke-width="1" stroke-dasharray="3 5"/>
  <text x="44" y="157" font-size="15.2" font-weight="400" text-anchor="start" fill="var(--color-paper)">CoreWeave loan</text>
  <text x="44" y="191" font-size="22.8" font-weight="500" text-anchor="start" fill="var(--color-signal)">$8.969m</text>
  <text x="44" y="216" font-size="15.2" font-weight="400" text-anchor="start" fill="var(--color-muted)">reported holding</text>
  <text x="273" y="157" font-size="17" font-weight="500" text-anchor="start" fill="var(--color-paper)">Athena III</text>
  <text x="273" y="191" font-size="22.8" font-weight="500" text-anchor="start" fill="var(--color-paper)">$75m</text>
  <text x="273" y="216" font-size="15.2" font-weight="400" text-anchor="start" fill="var(--color-muted)">total drawn</text>
  <text x="250" y="261" font-size="15.2" font-weight="400" text-anchor="middle" fill="var(--color-amber)">Allocation of this loan to the SPV is unknown</text>
  <text x="537" y="96" font-size="15.2" font-weight="400" text-anchor="start" fill="var(--color-muted)">Credit commitments</text>
  <g data-icon="bank" transform="translate(553 135) scale(0.62)" fill="none" stroke="var(--color-muted)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="M-17-7 0-15 17-7M-17-4H17M-14 13H14M-18 17H18M-11-1V10M-4-1V10M4-1V10M11-1V10"/></g>
  <text x="583" y="132" font-size="15.2" font-weight="500" text-anchor="start" fill="var(--color-paper)">Deutsche Bank</text>
  <text x="583" y="159" font-size="22" font-weight="400" text-anchor="start" fill="var(--color-paper)">$150m</text>
  <g data-icon="bank" transform="translate(553 221) scale(0.62)" fill="none" stroke="var(--color-muted)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="M-17-7 0-15 17-7M-17-4H17M-14 13H14M-18 17H18M-11-1V10M-4-1V10M4-1V10M11-1V10"/></g>
  <text x="583" y="218" font-size="15.2" font-weight="500" text-anchor="start" fill="var(--color-paper)">First Citizens</text>
  <text x="583" y="245" font-size="22" font-weight="400" text-anchor="start" fill="var(--color-paper)">$100m</text>
  <path d="M528 147H508V188H458M528 233H508V188" fill="none" stroke="var(--color-muted)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M463 184 458 188 463 192" fill="none" stroke="var(--color-muted)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
  <text x="24" y="309" font-size="15.2" font-weight="400" text-anchor="start" fill="var(--color-muted)">$75m is the facility total; no lender breakdown identified.</text>
</svg>
