<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="ai-private-en-holdings-d-title ai-private-en-holdings-d-desc" font-family="Inter Variable, Inter, sans-serif" font-weight="400" style="width:100%;height:auto" class="ai-private-credit-svg">
  <title id="ai-private-en-holdings-d-title">Two funds holding CoreWeave debt</title>
  <desc id="ai-private-en-holdings-d-desc">At 30 September 2026, Apollo Debt Solutions BDC reports $13.004 million of funded principal held and $8.744 million of unfunded commitments to CoreWeave Financing DDTL V-V. Blue Owl Technology Finance reports $8.969 million and $6.031 million respectively. All four bars start at zero and use the same scale. Unfunded commitments remain subject to the loan conditions. Funded principal held and unfunded commitments are shown separately; the bars do not measure fair values.</desc>
