<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 420" role="img" aria-labelledby="ai-private-en-map-m-title ai-private-en-map-m-desc" font-family="Inter Variable, Inter, sans-serif" font-weight="400" style="width:100%;height:auto" class="ai-private-credit-svg">
  <title id="ai-private-en-map-m-title">The fund, the loan and the banks</title>
  <desc id="ai-private-en-map-m-desc">OTF holds an $8.969 million funded CoreWeave loan and owns the subsidiary Athena Funding III. The subsidiary’s agreement amended on 11 September 2026 identifies a $150 million Deutsche Bank commitment and a $100 million First Citizens commitment. The facility has $75 million outstanding in total at 30 September 2026, with no lender breakdown of drawings identified in the documents reviewed. The documents reviewed do not establish allocation of the CoreWeave loan to Athena III, so no arrow connects the two. This map does not assign a quantified CoreWeave exposure to either bank.</desc>
  <text x="18" y="30" font-size="18" font-weight="500" text-anchor="start" fill="var(--color-paper)">The fund and its banks</text>
  <text x="18" y="54" font-size="13.5" font-weight="400" text-anchor="start" fill="var(--color-muted)">OTF · known links, unknown loan allocation</text>
  <text x="100" y="91" font-size="14.5" font-weight="500" text-anchor="middle" fill="var(--color-paper)">Deutsche Bank</text>
  <text x="282" y="91" font-size="14.5" font-weight="500" text-anchor="middle" fill="var(--color-paper)">First Citizens</text>
  <text x="100" y="121" font-size="18" font-weight="400" text-anchor="middle" fill="var(--color-paper)">$150m</text>
  <text x="282" y="121" font-size="18" font-weight="400" text-anchor="middle" fill="var(--color-paper)">$100m</text>
  <path d="M100 135V153H278M282 135V153H278V246" fill="none" stroke="var(--color-muted)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M274 241 278 246 282 241" fill="none" stroke="var(--color-muted)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
  <text x="18" y="177" font-size="13.5" font-weight="400" text-anchor="start" fill="var(--color-muted)">Contractual commitments</text>
  <rect x="18" y="195" width="344" height="203" rx="5" fill="none" stroke="var(--color-line-strong)" stroke-width="1" />
  <g data-icon="folder" transform="translate(39 217) scale(0.45)" fill="none" stroke="var(--color-muted)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="M-17-10H-3l5 5H17V15H-17Z"/><path d="M-17 0H17"/></g>
  <text x="58" y="222" font-size="14" font-weight="500" text-anchor="start" fill="var(--color-paper)">OTF · consolidated group</text>
  <line x1="190" y1="248" x2="190" y2="327" stroke="var(--color-line-strong)" stroke-width="1" stroke-dasharray="3 5"/>
  <text x="101" y="267" font-size="13.5" font-weight="400" text-anchor="middle" fill="var(--color-paper)">CoreWeave loan</text>
  <text x="101" y="299" font-size="18" font-weight="500" text-anchor="middle" fill="var(--color-signal)">$8.969m</text>
  <text x="101" y="321" font-size="13.5" font-weight="400" text-anchor="middle" fill="var(--color-muted)">reported holding</text>
  <text x="278" y="267" font-size="16.5" font-weight="500" text-anchor="middle" fill="var(--color-paper)">Athena III</text>
  <text x="278" y="299" font-size="18" font-weight="500" text-anchor="middle" fill="var(--color-paper)">$75m</text>
  <text x="278" y="321" font-size="13.5" font-weight="400" text-anchor="middle" fill="var(--color-muted)">total drawn</text>
  <text x="190" y="358" font-size="13.5" font-weight="400" text-anchor="middle" fill="var(--color-amber)">Allocation of this loan</text>
  <text x="190" y="379" font-size="13.5" font-weight="400" text-anchor="middle" fill="var(--color-amber)">to Athena III is unknown</text>
</svg>
