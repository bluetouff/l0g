<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 420" role="img" aria-labelledby="ai-private-fr-liquidity-m-title ai-private-fr-liquidity-m-desc" font-family="Inter Variable, Inter, sans-serif" font-weight="400" style="width:100%;height:auto" class="ai-private-credit-svg">
  <title id="ai-private-fr-liquidity-m-title">La capacité de tirage dépend du collatéral</title>
  <desc id="ai-private-fr-liquidity-m-desc">Au 30 septembre 2026, la facilité Athena III présente 175 millions de dollars nominaux non tirés et un montant disponible de 93,727 millions, qui tient compte des contraintes de borrowing base. Les barres utilisent la même échelle. La base d’emprunt dépend notamment des actifs éligibles, de leur valeur retenue et des limites de concentration. L’écart n’est pas une perte et ne prouve pas une dégradation récente. Source : 10-Q OTF, note 5, page 78 et note de tableau 1 ; contrat Athena III.</desc>
