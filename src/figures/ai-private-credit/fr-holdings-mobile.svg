  <text x="362" y="262" font-size="18" font-weight="400" text-anchor="end" fill="var(--color-paper)">8,969</text>
  <rect x="18" y="280" width="124.29314057" height="10" rx="1" fill="none" stroke="var(--color-amber)" stroke-width="1.25" data-metric="otf-unfunded-usd-mn" data-value="6.031"/>
  <text x="362" y="292" font-size="18" font-weight="400" text-anchor="end" fill="var(--color-paper)">6,031</text>
