  <line x1="18.0" y1="320" x2="18.0" y2="325" stroke="var(--color-line-strong)" stroke-width="1" />
  <text x="18.0" y="342" font-size="13.5" font-weight="400" text-anchor="middle" fill="var(--color-muted)">0</text>
