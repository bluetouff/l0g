<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="ai-private-en-liquidity-d-title ai-private-en-liquidity-d-desc" font-family="Inter Variable, Inter, sans-serif" font-weight="400" style="width:100%;height:auto" class="ai-private-credit-svg">
  <title id="ai-private-en-liquidity-d-title">Drawing capacity depends on collateral</title>
  <desc id="ai-private-en-liquidity-d-desc">At 30 September 2026, the Athena III facility reports $175 million nominally unused and $93.727 million available after borrowing-base limitations. Both bars use the same scale. The borrowing base depends on eligible assets, their assessed value and concentration limits, among other conditions. The gap is not a loss and does not establish recent deterioration. Sources: OTF 10-Q, note 5, page 78 and table footnote 1; Athena III agreement.</desc>
  <text x="24" y="31" font-size="22" font-weight="500" text-anchor="start" fill="var(--color-paper)">Drawing capacity comes with conditions</text>
  <text x="24" y="55" font-size="15.2" font-weight="400" text-anchor="start" fill="var(--color-muted)">Athena III · 30 September 2026 · US dollars, millions</text>
  <text x="24" y="99" font-size="15.2" font-weight="400" text-anchor="start" fill="var(--color-paper)">Nominally unused amount</text>
  <text x="474" y="104" font-size="22.8" font-weight="500" text-anchor="end" fill="var(--color-paper)">175</text>
  <rect x="24" y="119" width="450" height="12" rx="1" fill="none" stroke="var(--color-muted)" stroke-width="1.25" data-metric="nominal-unused-usd-mn" data-value="175"/>
  <text x="24" y="181" font-size="15.2" font-weight="400" text-anchor="start" fill="var(--color-paper)">Available after borrowing-base limits</text>
  <text x="474" y="185" font-size="22.8" font-weight="500" text-anchor="end" fill="var(--color-signal)">93.727</text>
