  <text x="281.14285714285717" y="270" font-size="15.2" font-weight="400" text-anchor="middle" fill="var(--color-muted)">100</text>
  <line x1="409.7142857142857" y1="248" x2="409.7142857142857" y2="253" stroke="var(--color-line-strong)" stroke-width="1" />
  <text x="409.7142857142857" y="270" font-size="15.2" font-weight="400" text-anchor="middle" fill="var(--color-muted)">150</text>
  <line x1="474.0" y1="248" x2="474.0" y2="253" stroke="var(--color-line-strong)" stroke-width="1" />
  <text x="474.0" y="270" font-size="15.2" font-weight="400" text-anchor="middle" fill="var(--color-muted)">175</text>
