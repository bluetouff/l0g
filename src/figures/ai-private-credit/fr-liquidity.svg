<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="ai-private-fr-liquidity-d-title ai-private-fr-liquidity-d-desc" font-family="Inter Variable, Inter, sans-serif" font-weight="400" style="width:100%;height:auto" class="ai-private-credit-svg">
  <title id="ai-private-fr-liquidity-d-title">La capacité de tirage dépend du collatéral</title>
  <desc id="ai-private-fr-liquidity-d-desc">Au 30 septembre 2026, la facilité Athena III présente 175 millions de dollars nominaux non tirés et un montant disponible de 93,727 millions, qui tient compte des contraintes de borrowing base. Les barres utilisent la même échelle. La base d’emprunt dépend notamment des actifs éligibles, de leur valeur retenue et des limites de concentration. L’écart n’est pas une perte et ne prouve pas une dégradation récente. Source : 10-Q OTF, note 5, page 78 et note de tableau 1 ; contrat Athena III.</desc>
  <text x="24" y="31" font-size="22" font-weight="500" text-anchor="start" fill="var(--color-paper)">Une capacité de tirage sous conditions</text>
  <text x="24" y="55" font-size="15.2" font-weight="400" text-anchor="start" fill="var(--color-muted)">Athena III · 30 septembre 2026 · millions de dollars</text>
  <text x="24" y="99" font-size="15.2" font-weight="400" text-anchor="start" fill="var(--color-paper)">Montant nominal non tiré</text>
  <text x="474" y="104" font-size="22.8" font-weight="500" text-anchor="end" fill="var(--color-paper)">175</text>
  <rect x="24" y="119" width="450" height="12" rx="1" fill="none" stroke="var(--color-muted)" stroke-width="1.25" data-metric="nominal-unused-usd-mn" data-value="175"/>
  <text x="24" y="181" font-size="15.2" font-weight="400" text-anchor="start" fill="var(--color-paper)">Disponible sous borrowing base</text>
  <text x="474" y="185" font-size="22.8" font-weight="500" text-anchor="end" fill="var(--color-signal)">93,727</text>
  <rect x="24" y="200" width="241.01228571" height="12" rx="1" fill="var(--color-signal)" stroke="none" stroke-width="1.25" data-metric="borrowing-base-available-usd-mn" data-value="93.727"/>
  <line x1="24" y1="248" x2="474" y2="248" stroke="var(--color-line-strong)" stroke-width="1" />
