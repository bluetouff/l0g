<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 420" role="img" aria-labelledby="ai-private-en-liquidity-m-title ai-private-en-liquidity-m-desc" font-family="Inter Variable, Inter, sans-serif" font-weight="400" style="width:100%;height:auto" class="ai-private-credit-svg">
  <title id="ai-private-en-liquidity-m-title">Drawing capacity depends on collateral</title>
  <desc id="ai-private-en-liquidity-m-desc">At 30 September 2026, the Athena III facility reports $175 million nominally unused and $93.727 million available after borrowing-base limitations. Both bars use the same scale. The borrowing base depends on eligible assets, their assessed value and concentration limits, among other conditions. The gap is not a loss and does not establish recent deterioration. Sources: OTF 10-Q, note 5, page 78 and table footnote 1; Athena III agreement.</desc>
