<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 278" width="100%" height="auto" style="width:100%;height:auto" role="img" aria-labelledby="saas-agents-en-circuit-mobile-title saas-agents-en-circuit-mobile-desc" xml:lang="en">
<title id="saas-agents-en-circuit-mobile-title">Effects on the bill</title>
<desc id="saas-agents-en-circuit-mobile-desc">Productivity can reduce the number of paid seats at renewal if the customer shrinks the team. The same customer may also buy operations performed by agents. The combined effect on gross profit depends on revenue and its direct costs.</desc>
