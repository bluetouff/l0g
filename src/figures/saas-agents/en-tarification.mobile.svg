<title id="saas-agents-en-tarification-mobile-title">How agents are billed</title>
<desc id="saas-agents-en-tarification-mobile-desc">Salesforce credits cover actions. Workday credits are based on the operation performed. SAP offers an annual pool of AI Units. Microsoft has subscriptions and Copilot Studio consumption credits, depending on the offer. An illustrative sequence links requests, orchestration, inference and action.</desc>
