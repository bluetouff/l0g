<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 253" width="100%" height="auto" style="width:100%;height:auto" role="img" aria-labelledby="saas-agents-en-tarification-title saas-agents-en-tarification-desc" xml:lang="en">
<title id="saas-agents-en-tarification-title">How agents are billed</title>
<desc id="saas-agents-en-tarification-desc">Salesforce credits cover actions. Workday credits are based on the operation performed. SAP offers an annual pool of AI Units. Microsoft has subscriptions and Copilot Studio consumption credits, depending on the offer. An illustrative sequence links requests, orchestration, inference and action.</desc>
