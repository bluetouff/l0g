<title id="saas-agents-fr-tarification-mobile-title">Les unités de facturation</title>
<desc id="saas-agents-fr-tarification-mobile-desc">Les crédits de Salesforce correspondent à des actions. Workday facture des crédits par opération. SAP propose une réserve annuelle d’unités d’IA. Microsoft sépare les abonnements des crédits de consommation de Copilot Studio selon l’offre. Le parcours illustratif relie demande, orchestration, inférence et action.</desc>
