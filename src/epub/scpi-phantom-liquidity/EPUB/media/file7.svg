<title id="scpi3-en-payout-mix-title">Élysées Pierre, sources of the distribution</title>
<desc id="scpi3-en-payout-mix-desc">Élysées Pierre H1 2026: €15 per unit distributed, comprising €9.85 property income, €4.95 net capital gains and €0.20 retained earnings. The last two categories account for 34.3%. The bulletin uses the French individual income-tax basis, not final income after all personal taxes.</desc>
<rect width="520" height="850" fill="#0b0d10" />
<g font-family="ui-monospace,SFMono-Regular,Consolas,monospace">
<text x="28" y="38" fill="#5eead4" font-size="20" font-weight="700" text-anchor="start">l0g / SCPI / 03</text>
<text x="28" y="87" fill="#e7e9ee" font-size="34" font-weight="700" text-anchor="start">Élysées Pierre</text>
<text x="28" y="129" fill="#b7bdc8" font-size="25" font-weight="400" text-anchor="start">First half of 2026</text>
<text x="28" y="188" fill="#e7e9ee" font-size="29" font-weight="700" text-anchor="start">€15 distributed per unit</text>
<text x="28" y="234" fill="#e7e9ee" font-size="24" font-weight="400" text-anchor="start">Property income</text>
<text x="492" y="275" fill="#5eead4" font-size="31" font-weight="700" text-anchor="end">€9.85</text>
<rect data-bar="true" x="28" y="292" width="457.040" height="26" fill="#5eead4" />
<text x="28" y="363" fill="#e7e9ee" font-size="24" font-weight="400" text-anchor="start">Net capital gains</text>
<text x="492" y="404" fill="#f5b13d" font-size="31" font-weight="700" text-anchor="end">€4.95</text>
<rect data-bar="true" x="28" y="421" width="229.680" height="26" fill="#f5b13d" />
<text x="28" y="492" fill="#e7e9ee" font-size="24" font-weight="400" text-anchor="start">Retained earnings used</text>
<text x="492" y="533" fill="#ff4d87" font-size="31" font-weight="700" text-anchor="end">€0.20</text>
<rect data-bar="true" x="28" y="550" width="9.280" height="26" fill="#ff4d87" />
<line x1="28" y1="600" x2="492" y2="600" stroke="#343944" stroke-width="1" />
<line x1="28.0" y1="595" x2="28.0" y2="605" stroke="#343944" stroke-width="1" />
<text x="28.0" y="632" fill="#b7bdc8" font-size="20" font-weight="400" text-anchor="start">0</text>
<line x1="260.0" y1="595" x2="260.0" y2="605" stroke="#343944" stroke-width="1" />
<text x="260.0" y="632" fill="#b7bdc8" font-size="20" font-weight="400" text-anchor="middle">5</text>
<line x1="492.0" y1="595" x2="492.0" y2="605" stroke="#343944" stroke-width="1" />
<text x="492.0" y="632" fill="#b7bdc8" font-size="20" font-weight="400" text-anchor="end">10 €</text>
<text x="28" y="684" fill="#e7e9ee" font-size="24" font-weight="400" text-anchor="start">Gains + retained earnings</text>
<text x="28" y="731" fill="#f5b13d" font-size="32" font-weight="700" text-anchor="start">€5.15 / €15 = 34.3%</text>
<text x="28" y="778" fill="#b7bdc8" font-size="23" font-weight="400" text-anchor="start">Sources of first-half payments.</text>
<text x="28" y="822" fill="#b7bdc8" font-size="21" font-weight="400" text-anchor="start">HSBC REIM • H1 2026 bulletin, p. 2</text>
