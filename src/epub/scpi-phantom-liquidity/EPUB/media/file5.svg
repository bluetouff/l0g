<title id="scpi2-en-auction-title">Hypothetical example: the price that maximises trading</title>
<desc id="scpi2-en-auction-desc">At 40 euros, 100 units can trade; at 50 euros, 250; at 60 euros, 80. The maximum is 250 units at 50 euros, out of 600 offered. Prices are hypothetical and fees are excluded.</desc>
<rect width="520" height="750" fill="#0b0d10" />
<g font-family="ui-monospace,SFMono-Regular,Consolas,monospace">
<text x="26" y="38" font-size="20" fill="#5eead4" text-anchor="start" font-weight="700">l0g / SCPI / 02</text>
<text x="26" y="87" font-size="30" fill="#f5f5f7" text-anchor="start" font-weight="700">The price set by orders</text>
<text x="26" y="130" font-size="22" fill="#aab3c2" text-anchor="start">Hypothetical, excluding fees</text>
<text x="26" y="181" font-size="24" fill="#f5f5f7" text-anchor="start">Units eligible to trade</text>
<text x="26" y="251" font-size="24" fill="#f5f5f7" text-anchor="start">€40</text>
<text x="494" y="225" font-size="26" fill="#aab3c2" text-anchor="end" font-weight="700">100</text>
<rect data-bar="true" x="154" y="238" width="106.667" height="22" fill="#aab3c2" />
<text x="26" y="345" font-size="24" fill="#f5f5f7" text-anchor="start">€50</text>
<text x="494" y="319" font-size="26" fill="#5eead4" text-anchor="end" font-weight="700">250</text>
<rect data-bar="true" x="154" y="332" width="266.667" height="22" fill="#5eead4" />
<text x="26" y="439" font-size="24" fill="#f5f5f7" text-anchor="start">€60</text>
<text x="494" y="413" font-size="26" fill="#aab3c2" text-anchor="end" font-weight="700">80</text>
<rect data-bar="true" x="154" y="426" width="85.333" height="22" fill="#aab3c2" />
<line x1="154" y1="488" x2="474" y2="488" stroke="#334155" />
<text x="154" y="526" font-size="22" fill="#aab3c2" text-anchor="middle">0</text>
<text x="314" y="526" font-size="22" fill="#aab3c2" text-anchor="middle">150</text>
<text x="474" y="526" font-size="22" fill="#aab3c2" text-anchor="middle">300</text>
<text x="26" y="587" font-size="27" fill="#5eead4" text-anchor="start" font-weight="700">At €50: 250 units traded</text>
<text x="26" y="632" font-size="24" fill="#f5f5f7" text-anchor="start">350 units remain unsold</text>
<text x="26" y="678" font-size="22" fill="#aab3c2" text-anchor="start">Of 600 units offered</text>
<text x="26" y="723" font-size="20" fill="#aab3c2" text-anchor="start">AMF 422-213 • l0g calculations</text>
