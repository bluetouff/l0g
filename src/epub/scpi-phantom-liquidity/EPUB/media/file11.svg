<title id="scpi4-en-3-title">One lease, three readings</title><desc id="scpi4-en-3-desc">Fictional example: 1,000 square metres, €300 headline rent per square metre per year, six firm years. Twelve free months inside the lease and a €150,000 fit-out allowance leave €225 annualised over the lease. Adding a six-month void before the lease gives €207.69 over 78 months. Other expenses, tax, financing, indexation and discounting are excluded.</desc>
