<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 760" role="img" aria-labelledby="scpi-en-1-title scpi-en-1-desc" focusable="false" lang="en" style="display:block;width:100%;height:auto;background:#0b0d10" font-family="ui-monospace,monospace"><rect x="0" y="0" width="520" height="760" fill="#0b0d10"/>
<title id="scpi-en-1-title">From matched redemptions to transfers between investors</title>
<desc id="scpi-en-1-desc">Simplified diagram for directly held units. Suspending variable capital cancels old redemption requests; holders must submit a new sell order. Redemption reserves and private transfers are explained in the text.</desc>
<rect width="520" height="760" rx="12" fill="#0b0d10" />
<text x="26" y="39" fill="#5eead4" font-size="18" font-weight="700">l0g / SCPI / 01</text>
<text x="26" y="83" fill="#e7e9ee" font-size="28" font-weight="700">Two routes to an exit</text>
<rect data-panel="compensation" x="20" y="116" width="480" height="230" rx="10" fill="#171a20" stroke="#343944" />
<text x="40" y="151" fill="#5eead4" font-size="20" font-weight="700">1 / VARIABLE-CAPITAL REDEMPTION</text>
<text x="40" y="195" fill="#e7e9ee" font-size="22" font-weight="700">A new subscription</text>
<line x1="50" y1="212" x2="50" y2="235" stroke="#5eead4" stroke-width="2" />
<text x="40" y="270" fill="#e7e9ee" font-size="22">Counterpart to a redemption</text>
<text x="40" y="312" fill="#b7bdc8" font-size="19">Insufficient inflows can mean a wait.</text>
<rect data-panel="secondary" x="20" y="367" width="480" height="260" rx="10" fill="#171a20" stroke="#343944" />
<text x="40" y="403" fill="#ff4d87" font-size="20" font-weight="700">2 / AFTER SUSPENSION</text>
<text x="40" y="446" fill="#e7e9ee" font-size="22" font-weight="700">Old redemption request cancelled</text>
<text x="40" y="482" fill="#e7e9ee" font-size="22">A fresh sell order</text>
<line x1="50" y1="497" x2="50" y2="516" stroke="#ff4d87" stroke-width="2" />
<text x="40" y="552" fill="#e7e9ee" font-size="22" font-weight="700">A buyer at a compatible price</text>
<text x="40" y="596" fill="#b7bdc8" font-size="20">Transfer between investors</text>
<text x="26" y="671" fill="#e7e9ee" font-size="21">The investor keeps ownership</text>
<text x="26" y="704" fill="#e7e9ee" font-size="21">until the units are transferred.</text>
<text x="26" y="739" fill="#b7bdc8" font-size="18">Simplified • AMF / Praemia REIM</text>
</svg>
