<text x="48" y="207" font-size="24" fill="#5eead4" text-anchor="start">PRIMOPIERRE</text>
<text x="48" y="246" font-size="20" fill="#f5f5f7" text-anchor="start">Auction prices for fund units</text>
<line x1="56" y1="282" x2="56" y2="322" stroke="#475569" stroke-width="2"/>
<path d="M 50 315 L 56 325 L 62 315" fill="none" stroke="#aab3c2" stroke-width="2"/>
