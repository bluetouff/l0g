<title id="scpi6-en-1-title">From fund to policyholder</title><desc id="scpi6-en-1-desc">Praemia reports an effect of Primopierre auction prices on Capimmo valuation. Unit-linked policy value moves with the underlying investment. This diagram quantifies neither cash flows nor bank losses.</desc>
