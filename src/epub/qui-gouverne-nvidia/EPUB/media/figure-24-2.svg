<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 333" width="320" role="img" aria-labelledby="nv24-holdings-fr-mobile-title nv24-holdings-fr-mobile-desc" height="333"><title id="nv24-holdings-fr-mobile-title">Nvidia dans les déclarations de Trump</title><desc id="nv24-holdings-fr-mobile-desc">Deux lignes du rapport financier 2025 indiquent chacune une valeur comprise entre 5 et 25 millions de dollars. Le relevé des transactions de septembre 2026 mentionne séparément quatre achats et une vente sous le nom Nvidia. La position exacte et le gain réalisé au 23 novembre 2026 restent à établir.</desc><rect x="1" y="1" width="318" height="331" rx="7"></rect><text x="17" y="28" font-size="16">Nvidia dans les déclarations de Trump</text><text x="17" y="47" font-size="12">Valeurs déclarées, opérations et inconnues</text><path d="M17 58H303 M17 169H303 M17 257H303"></path><text x="17" y="79" font-size="13">Rapport 2025</text><path d="M84 89V129 M122 89V129 M274 89V129"></path><path d="M84 135H274 M84 135V140 M122 135V140 M274 135V140"></path><text x="17" y="104" font-size="12">Ligne 1</text><text x="17" y="126" font-size="12">Ligne 2</text><g><path d="M122 100H274 M122 95V105 M274 95V105"></path><path d="M122 122H274 M122 117V127 M274 117V127"></path></g><text x="84" y="157" text-anchor="middle" font-size="12">0</text><text x="122" y="157" text-anchor="middle" font-size="12">5</text><text x="274" y="157" text-anchor="middle" font-size="12">25 M$</text><text x="17" y="190" font-size="13">Septembre 2026</text><g transform="translate(31 211)"><circle cx="0" cy="0" r="8"></circle><path d="M-4 0H4 M0 -4V4"></path></g><g transform="translate(85 211)"><circle cx="0" cy="0" r="8"></circle><path d="M-4 0H4 M0 -4V4"></path></g><g transform="translate(139 211)"><circle cx="0" cy="0" r="8"></circle><path d="M-4 0H4 M0 -4V4"></path></g><g transform="translate(193 211)"><circle cx="0" cy="0" r="8"></circle><path d="M-4 0H4 M0 -4V4"></path></g><g transform="translate(273 211)"><rect x="-8" y="-8" width="16" height="16" rx="3"></rect><path d="M-4 0H4"></path></g><path d="M31 227V231H193V227"></path><text x="112" y="247" text-anchor="middle" font-size="12">4 achats</text><text x="273" y="247" text-anchor="middle" font-size="12">1 vente</text><path stroke="#8b909b" d="M11 2A9 9 0 1 1 11 20A9 9 0 1 1 11 2Z M8 8C8 5 14 5 14 8C14 10 11 10 11 13 M11 16H11.1" transform="translate(17 271)"></path><text x="48" y="285" font-size="13">23 novembre 2026</text><text x="17" y="312" font-size="12">Position exacte inconnue</text><text x="175" y="312" font-size="12">Gain réalisé inconnu</text></svg>