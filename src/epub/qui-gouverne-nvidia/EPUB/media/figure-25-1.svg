<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 286" width="320" role="img" aria-labelledby="nv25-controls-fr-mobile-title nv25-controls-fr-mobile-desc" height="286"><title id="nv25-controls-fr-mobile-title">Trois juridictions, trois mesures</title><desc id="nv25-controls-fr-mobile-desc">Aux États-Unis, le BIS inscrit sept entités. Une licence est requise pour une opération touchant un article soumis aux EAR lorsqu’une entité inscrite est partie à la transaction. La politique est la présomption de refus. En Malaisie, le MITI annonce un avis à venir de la MIDA sur la location, l’hébergement et les services. À Singapour, l’enquête est propre à ses autorités, qui demandent des documents et des informations.</desc><rect x="1" y="1" width="318" height="284" rx="7"></rect><text x="17" y="27" font-size="16">Trois juridictions, trois mesures</text><path d="M17 42H303 M17 120H303 M17 198H303"></path><g transform="translate(0 0)"><path d="M3 2H13L19 8V23H3Z M13 2V8H19 M7 12H15 M7 16H15 M7 20H11" transform="translate(20 65)"></path><text x="49" y="73" font-size="13">États-Unis</text><text x="49" y="91" font-size="12">BIS</text><path d="M138 76H158 M153 72L158 76L153 80"></path><text x="171" y="63" font-size="12">Sept entités inscrites</text><text x="171" y="80" font-size="12">Licence pour articles EAR</text><text x="171" y="97" font-size="12">Présomption de refus</text></g><g transform="translate(0 78)"><path d="M2 3H20V10H2Z M2 15H20V22H2Z M5 6H7 M10 6H17 M5 18H7 M10 18H17" transform="translate(20 65)"></path><text x="49" y="73" font-size="13">Malaisie</text><text x="49" y="91" font-size="12">MITI / MIDA</text><path d="M138 76H158 M153 72L158 76L153 80"></path><text x="171" y="63" font-size="12">Avis MIDA annoncé</text><text x="171" y="80" font-size="12">Éviter bail, hébergement</text><text x="171" y="97" font-size="12">et services</text></g><g transform="translate(0 156)"><path d="M2 2H14V8 M2 2V22H15 M6 7H10 M6 11H8 M6 15H8 M17 15L21 19 M17 12A4 4 0 1 1 9 12A4 4 0 1 1 17 12Z" transform="translate(20 65)"></path><text x="49" y="73" font-size="13">Singapour</text><text x="49" y="91" font-size="12">Autorités locales</text><path d="M138 76H158 M153 72L158 76L153 80"></path><text x="171" y="63" font-size="12">Enquête singapourienne</text><text x="171" y="80" font-size="12">Documents demandés</text><text x="171" y="97" font-size="12">Collecte d’informations</text></g></svg>