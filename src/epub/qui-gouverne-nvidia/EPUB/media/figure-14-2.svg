<svg xmlns="http://www.w3.org/2000/svg" width="320" viewBox="0 0 320 330" role="img" aria-labelledby="nv14-capacity-fr-mobile-title nv14-capacity-fr-mobile-desc" xml:lang="fr" height="330"><title id="nv14-capacity-fr-mobile-title">Capacité cloud et engagement</title><desc id="nv14-capacity-fr-mobile-desc">Nvidia décrit ses accords d’achat de services cloud dans son dépôt pour le trimestre clos le 26 juillet 2026. La capacité sous contrat peut servir à la recherche et développement de Nvidia ou être revendue par les clouds à des tiers. L’utilisation par Nvidia ou ces clients réduit l’engagement d’achat restant, selon les accords. Le schéma représente le mécanisme contractuel, sans échelle monétaire ou de capacité.</desc><rect x="0.6" y="0.6" width="318.8" height="328.8" rx="3" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.1"></rect><text x="18" y="28" font-family="l0g Nvidia Client Financing" font-size="16" font-weight="400" text-anchor="start" fill="#e7e9ee">Capacité cloud et engagement</text><g transform="translate(160 77)"><path d="M-23-19H-5V19H-23Z M5-19H23V19H5Z M-18-12H-10 M-18-4H-10 M-18 4H-10 M-18 12H-10 M10-12H18 M10-4H18 M10 4H18 M10 12H18" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path></g><text x="160" y="114" font-family="l0g Nvidia Client Financing" font-size="13" font-weight="400" text-anchor="middle" fill="#e7e9ee">Cloud sous contrat</text><path d="M144 127V152H71V173" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><path d="M67 168L71 173L75 168" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><text x="71" y="140" font-family="l0g Nvidia Client Financing" font-size="12" font-weight="400" text-anchor="middle" fill="#5eead4">Usage R&#x26;D</text><path d="M176 127V152H249V173" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" st