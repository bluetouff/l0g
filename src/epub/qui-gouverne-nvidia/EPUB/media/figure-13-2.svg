<svg xmlns="http://www.w3.org/2000/svg" width="320" viewBox="0 0 320 330" role="img" aria-labelledby="nv13-export-fr-mobile-title nv13-export-fr-mobile-desc" xml:lang="fr" height="330"><title id="nv13-export-fr-mobile-title">Crédit export : les rôles</title><desc id="nv13-export-fr-mobile-desc">Mécanisme général, distinct d’une opération Nvidia exécutée. Un consortium américain propose une offre intégrée à un projet étranger. Une banque prête à l’acheteur étranger, qui la rembourse. Une garantie EXIM peut couvrir le prêteur après approbation et sous conditions. Le pointillé représente cette couverture conditionnelle. Chaque agence conserve son examen. Les montants ne sont pas représentés.</desc><rect x="0.6" y="0.6" width="318.8" height="328.8" rx="3" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.1"></rect><text x="18" y="28" font-family="l0g Nvidia Succession" font-size="16" font-weight="400" text-anchor="start" fill="#e7e9ee">Crédit export : les rôles</text><g transform="translate(60 76)"><path d="M-18-14H2V8H-18Z M-13-9H-3V3H-13Z M-14-20V-14 M-7-20V-14 M-14 8V14 M-7 8V14 M-24-10H-18 M-24-3H-18 M2-10H8 M2-3H8 M14-14H27V18H14Z M18-8H23 M18-1H23 M18 6H23 M18 13H23" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path></g><text x="60" y="112" font-family="l0g Nvidia Succession" font-size="12.5" font-weight="400" text-anchor="middle" fill="#e7e9ee">Consortium US</text><path d="M102 76H210" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><path d="M205 72L210 76L205 80" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><text x="155" y="57" font-family="l0g Nvidia Succession" font-size="12" font-weight="400" text-anchor="middle" fill="#5eead4">Offre</text><g transform="translate(250 76)"><path d="M-19 0A19 19 0 1 0 19 0A19 19 0 1 0-19 0 M-19 0H19 M0-19V19 M0-19C-14-10-14 10 0 19 M0-19C14-10 14 10 0 