<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 313" width="320" role="img" aria-labelledby="nv23-oversight-fr-mobile-title nv23-oversight-fr-mobile-desc" height="313"><title id="nv23-oversight-fr-mobile-title">Direction et contrôle chez Nvidia</title><desc id="nv23-oversight-fr-mobile-desc">Le conseil présidé par Harvey Jones réintègre Jensen Huang à la direction. Colette Kress conserve la direction financière. Un comité d’administrateurs indépendants poursuit son enquête. Un comité distinct, lui aussi composé d’indépendants, supervise la sécurité nationale et les contrôles à l’exportation. Nvidia compte recruter un responsable de la conformité qui rendra compte au comité des nominations et de la gouvernance.</desc><rect x="1" y="1" width="318" height="311" rx="7"></rect><text x="17" y="27" font-size="16">Direction et contrôle chez Nvidia</text><path d="M17 42H303"></path><rect x="17" y="53" width="286" height="41" rx="4"></rect><path d="M1 6L11 1L21 6Z M2 9H20 M1 22H21 M4 19V12 M11 19V12 M18 19V12 M2 19H20" transform="translate(25 61)"></path><text x="60" y="70" font-size="14">Conseil d’administration</text><text x="60" y="86" font-size="12">Harvey Jones · président</text><path d="M36 94V275H50 M36 173H50 M36 224H50"></path><path d="M36 122H51 M47 118L51 122L47 126"></path><path d="M5 20V17C5 14 8 13 11 13S17 14 17 17V20 M2 20H20 M14 6C14 8 13 10 11 10S8 8 8 6S9 2 11 2S14 4 14 6Z" transform="translate(58 112)"></path><text x="91" y="122" font-size="14">Jensen Huang · DG</text><text x="91" y="139" font-size="12">Colette Kress · finances</text><g transform="translate(58 173)"><path d="M2 1H15V8 M2 1V22H14 M6 6H11 M6 10H9 M6 14H8 M18 15L22 20 M18 12A4 4 0 1 1 10 12A4 4 0 1 1 18 12Z" transform="translate(0 -11)" stroke="#f5b13d"></path><text x="33" y="0" font-size="13">Comité d’enquête</text><text x="33" y="16" font-size="12">Administrateurs indépendants</text></g><g transform="translate(58 224)"><path d="M11 1L20 4V11C20 16 16 20 11 23C6 20 2 16 2 11V4Z M7 11L10 14L15 8 M5 6L11 4L17 6" transform="translate(0 -11)" stroke="#7aa2f7"></path><text x="33" y="0" font-size="13">Comité sécurité et export</text><text x="33" y="16" font-size="12">Administrateurs indépendants</text></g><g transform="translate(58 275)"><path d="M2 4H20V20H2Z M2 8H20 M6 6H7 M11 6H12 M16 6H17 M6 13L8 15L11 11 M13 14H17 M6 17H17" transform="translate(0 -11)" stroke="#5eead4"></path><text x="33" y="0" font-size="13">Nominations</text><text x="33" y="16" font-size="12">et gouvernance</text></g><path d="M203 275H183 M187 271L183 275L187 279"></path><rect x="203" y="255" width="100" height="40" rx="4"></rect><text x="253" y="272" text-anchor="middle" font-size="12">Resp. conformité</text><text x="253" y="288" text-anchor="middle" font-size="12">Recrutement lancé</text></svg>