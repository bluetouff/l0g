<svg xmlns="http://www.w3.org/2000/svg" width="320" viewBox="0 0 320 330" role="img" aria-labelledby="nvidia-commitment-activation-fr-mobile-title nvidia-commitment-activation-fr-mobile-desc" xml:lang="fr" height="330"><title id="nvidia-commitment-activation-fr-mobile-title">Activer les accords neocloud</title><desc id="nvidia-commitment-activation-fr-mobile-desc">Au 25 octobre 2026, Nvidia présente 32 milliards de dollars US d’engagements supplémentaires liés aux accords neocloud, à leur maximum conditionnel. Leur activation suppose le financement des achats d’infrastructure, le déploiement opérationnel des capacités et leur acceptation par Nvidia. Les flèches représentent ces conditions, sans attester leur réalisation. Ce mécanisme concerne ces accords neocloud. Source : commentaire de la direction financière du 17 novembre 2026.</desc><rect x=".6" y=".6" width="318.8" height="328.8" rx="10" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.1"></rect><text x="16" y="28" font-family="l0g Nvidia Aolani Financing" font-size="16" font-weight="400" fill="#e7e9ee">Activer les accords neocloud</text><text x="16" y="49" font-family="l0g Nvidia Aolani Financing" font-size="12" font-weight="400" fill="#8b909b">32 Md USD · au 25 octobre 2026</text><g transform="translate(52 80)"><path d="M5 0 H24 L31 7 V31 H5 Z M24 0 V7 H31 M11 13 H24 M11 19 H24 M11 25 H20" fill="none" stroke="#5eead4" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"></path></g><text x="69" y="133" font-family="l0g Nvidia Aolani Financing" font-size="13" font-weight="400" fill="#e7e9ee" text-anchor="middle">Accords</text><text x="69" y="151" font-family="l0g Nvidia Aolani Financing" font-size="12" font-weight="400" fill="#8b909b" text-anchor="middle">neocloud</text><g transform="translate(232 80)"><path d="M0 30 H34 M4 25 H30 M6 25 V12 M13 25 V12 M21 25 V12 M28 25 V12 M1 10 L17 1 L33 10 Z" fill="none" stroke="#5eead4" stroke-width="1.25" stroke-linecap="round" stroke-linejoi