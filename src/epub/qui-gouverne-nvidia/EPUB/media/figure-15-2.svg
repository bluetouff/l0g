<svg xmlns="http://www.w3.org/2000/svg" width="320" viewBox="0 0 320 330" role="img" aria-labelledby="nv15-remote-fr-mobile-title nv15-remote-fr-mobile-desc" xml:lang="fr" height="330"><title id="nv15-remote-fr-mobile-title">Le matériel et l’accès au calcul</title><desc id="nv15-remote-fr-mobile-desc">Schéma d’usage d’infrastructure à partir des documents Bitdeer et du reportage NYT. Un fournisseur tiers apporte des équipements à un centre de données, situé ici en Malaisie. Une connexion réseau distincte relie un client distant aux serveurs. Les flèches distinguent l’acheminement du matériel de l’accès au calcul. Le fournisseur direct et le client distant restent génériques. Les propositions réglementaires rapportées par le NYT sont examinées dans l’article plutôt que dessinées comme une autorisation ou une restriction.</desc><rect x="0.6" y="0.6" width="318.8" height="328.8" rx="3" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.1"></rect><text x="18" y="28" font-family="l0g Nvidia Cantor Export" font-size="16" font-weight="400" text-anchor="start" fill="#e7e9ee">Le matériel et l’accès au calcul</text><g transform="translate(65 99)"><path d="M-20-11H20V17H-20Z M-20-11L-10-20H10L20-11 M-5-8H5V4H-5Z M-14-4H-10 M10-4H14 M-14 10H14" fill="none" stroke="#f5b13d" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path></g><text x="65" y="138" font-family="l0g Nvidia Cantor Export" font-size="12.5" font-weight="400" text-anchor="middle" fill="#e7e9ee">Fournisseur</text><text x="65" y="155" font-family="l0g Nvidia Cantor Export" font-size="12" font-weight="400" text-anchor="middle" fill="#8b909b">tiers</text><g transform="translate(250 99)"><path d="M-23-19H-5V19H-23Z M5-19H23V19H5Z M-18-12H-10 M-18-4H-10 M-18 4H-10 M-18 12H-10 M10-12H18 M10-4H18 M10 4H18 M10 12H18" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path></g><text x="250" y="138" font-family="l0g Nvidia Cantor Export" font-size="12.5" font-weight="400" text-anchor="middle" fill="#e7e9ee">Centre de données</text><text x="250" y="155" font-family="l0g Nvidia Cantor Export" font-size="12" font-weight="400" text-anchor="middle" fill="#8b909b">Malaisie</text><path d="M105 99H211" fill="none" stroke="#f5b13d" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><path d="M206 95L211 99L206 103" fill="none" stroke="#f5b13d" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><text x="158" y="81" font-family="l0g Nvidia Cantor Export" font-size="12" font-weight="400" text-anchor="middle" fill="#f5b13d">Équipements</text><g transform="translate(65 250)"><path d="M-19-16H19V9H-19Z M-25 16L-19 9H19L25 16Z M-7 13H7" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path></g><text x="65" y="290" font-family="l0g Nvidia Cantor Export" font-size="13" font-weight="400" text-anchor="middle" fill="#e7e9ee">Client distant</text><path d="M105 250H250V182" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><path d="M246 187L250 182L254 187" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><text x="177" y="233" font-family="l0g Nvidia Cantor Export" font-size="12" font-weight="400" text-anchor="middle" fill="#5eead4">Connexion réseau</text></svg>