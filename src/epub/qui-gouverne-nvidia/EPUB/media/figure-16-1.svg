<svg xmlns="http://www.w3.org/2000/svg" width="320" viewBox="0 0 320 330" role="img" aria-labelledby="nv16-bail-fr-mobile-title nv16-bail-fr-mobile-desc" xml:lang="fr" height="330"><title id="nv16-bail-fr-mobile-title">Le parcours du recours</title><desc id="nv16-bail-fr-mobile-desc">Parcours du recours contre la suspension de détention de quatre prévenus, dont Chang. Le tribunal de Keelung fixe le 26 août 2026 une caution de quatre millions de dollars taïwanais par personne, une interdiction de sortie du territoire de huit mois et un pointage régulier. Le parquet forme un recours à une date non précisée. La Haute Cour le rejette le 10 septembre 2026. La figure porte sur ces mesures provisoires et leur contrôle judiciaire.</desc><rect x="0.6" y="0.6" width="318.8" height="328.8" rx="3" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.1"></rect><text x="18" y="28" font-family="l0g Nvidia Taiwan Justice" font-size="16" font-weight="400" text-anchor="start" fill="#e7e9ee">Le parcours du recours</text><text x="64" y="56" font-family="l0g Nvidia Taiwan Justice" font-size="12" font-weight="400" text-anchor="middle" fill="#8b909b">26 août 2026</text><text x="252" y="56" font-family="l0g Nvidia Taiwan Justice" font-size="12" font-weight="400" text-anchor="middle" fill="#8b909b">Date inconnue</text><g transform="translate(64 95)"><path d="M-23-9L0-21L23-9Z M-25-3H25 M-25 21H25 M-17 2V15 M-6 2V15 M6 2V15 M17 2V15 M-29 25H29" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path></g><g transform="translate(252 95)"><path d="M-17-23H8L18-13V22H-17Z M8-23V-13H18 M-10-5H10 M-10 2H10 M-10 9H4" fill="none" stroke="#f5b13d" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path></g><path d="M105 95H211" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><path d="M206 91L211 95L206 99" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><text x="158" y="78" font-family="l0g Nvidia Taiwan Justice" font-size="12" font-weight="400" text-anchor="middle" fill="#5eead4">Décision</text><text x="64" y="138" font-family="l0g Nvidia Taiwan Justice" font-size="13" font-weight="400" text-anchor="middle" fill="#e7e9ee">Tribunal</text><text x="64" y="155" font-family="l0g Nvidia Taiwan Justice" font-size="12" font-weight="400" text-anchor="middle" fill="#e7e9ee">de Keelung</text><text x="252" y="138" font-family="l0g Nvidia Taiwan Justice" font-size="13" font-weight="400" text-anchor="middle" fill="#e7e9ee">Parquet</text><text x="64" y="183" font-family="l0g Nvidia Taiwan Justice" font-size="15" font-weight="400" text-anchor="middle" fill="#e7e9ee">4 M TWD</text><text x="64" y="201" font-family="l0g Nvidia Taiwan Justice" font-size="12" font-weight="400" text-anchor="middle" fill="#8b909b">par personne</text><path d="M252 148V165" fill="none" stroke="#f5b13d" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><path d="M248 160L252 165L256 160" fill="none" stroke="#f5b13d" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><text x="252" y="188" font-family="l0g Nvidia Taiwan Justice" font-size="12" font-weight="400" text-anchor="middle" fill="#8b909b">10 sept. 2026</text><g transform="translate(252 222)"><path d="M-23-9L0-21L23-9Z M-25-3H25 M-25 21H25 M-17 2V15 M-6 2V15 M6 2V15 M17 2V15 M-29 25H29" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path></g><text x="252" y="263" font-family="l0g Nvidia Taiwan Justice" font-size="13" font-weight="400" text-anchor="middle" fill="#e7e9ee">Haute Cour</text><text x="252" y="284" font-family="l0g Nvidia Taiwan Justice" font-size="12" font-weight="400" text-anchor="middle" fill="#e7e9ee">Rejet du recours</text><path d="M64 210V220H26V233" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><path d="M26 265V280" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><g transform="translate(26 250)"><path d="M-10-15H8V15H-10Z M-4-8H3 M-4 0H3 M-15 18L15-18" fill="none" stroke="#8b909b" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path></g><text x="48" y="244" font-family="l0g Nvidia Taiwan Justice" font-size="12" font-weight="400" text-anchor="start" fill="#e7e9ee">Sorties interdites</text><text x="48" y="261" font-family="l0g Nvidia Taiwan Justice" font-size="12" font-weight="400" text-anchor="start" fill="#8b909b">8 mois</text><g transform="translate(26 295)"><path d="M-10-15H10V15H-10Z M-5-8H5 M-5-1H5 M-5 7L-1 11L6 4" fill="none" stroke="#8b909b" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path></g><text x="48" y="296" font-family="l0g Nvidia Taiwan Justice" font-size="12" font-weight="400" text-anchor="start" fill="#e7e9ee">Pointage régulier</text><text x="160" y="319" font-family="l0g Nvidia Taiwan Justice" font-size="12" font-weight="400" text-anchor="middle" fill="#8b909b">4 prévenus, dont Chang</text></svg>