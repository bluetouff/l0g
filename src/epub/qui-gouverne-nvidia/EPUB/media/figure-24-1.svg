<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 309" width="320" role="img" aria-labelledby="nv24-timeline-fr-mobile-title nv24-timeline-fr-mobile-desc" height="309"><title id="nv24-timeline-fr-mobile-title">Le retour de Huang, heure par heure</title><desc id="nv24-timeline-fr-mobile-desc">Le 23 novembre 2026, heure de Paris, la séance matinale de Cboe C1 ouvre à 13 h 30 pour les options éligibles. À 14 h 29, Liz Landers de PBS publie son compte rendu. Nvidia annonce le retour de Jensen Huang à 14 h 55. À 15 h 15, le compte MrMikeInvesting évoque un pari allégué sur des options d’achat. À 15 h 45, le sénateur Ruben Gallego demande un examen des opérations.</desc><rect x="1" y="1" width="318" height="307" rx="7"></rect><text x="17" y="28" font-size="16">Le retour de Huang, heure par heure</text><text x="17" y="47" font-size="12">23 novembre 2026 · heure de Paris</text><path d="M17 58H303"></path><path d="M22 76V276"></path><g><circle cx="22" cy="76" r="3.3" stroke="#8b909b"></circle><path d="M1 17V4H17V11 M1 7H17 M4 2V6 M13 2V6 M4 11H7 M4 14H7 M14 15V11 M14 15H17 M14 10A5 5 0 1 1 14 20A5 5 0 1 1 14 10Z" stroke="#8b909b" transform="translate(35 67)"></path><text x="67" y="80" font-size="13" fill="#8b909b">13:30</text><text x="112" y="80" font-size="13">Pré-marché Cboe C1</text><text x="112" y="95" font-size="12">Options éligibles</text></g><g><circle cx="22" cy="163" r="3.3" stroke="#7aa2f7"></circle><path d="M1 2H19V14H10L5 19V14H1Z M4 6H16 M4 10H13" stroke="#7aa2f7" transform="translate(35 154)"></path><text x="67" y="167" font-size="13" fill="#7aa2f7">14:29</text><text x="112" y="167" font-size="13">Liz Landers (PBS)</text><text x="112" y="182" font-size="12">Compte rendu public</text></g><g><circle cx="22" cy="202" r="3.3" stroke="#5eead4"></circle><path d="M3 1H13L18 6V19H3Z M13 1V6H18 M6 10H15 M6 13H15 M6 16H11" stroke="#5eead4" transform="translate(35 193)"></path><text x="67" y="206" font-size="13" fill="#5eead4">14:55</text><text x="112" y="206" font-size="13">Communiqué Nvidia</text><text x="112" y="221" font-size="12">Annonce du retour</text></g><g><circle cx="22" cy="232" r="3.3" stroke="#f5b13d"></circle><path d="M1 3H19V15H9L5 19V15H1Z M10 6V10 M10 12H10.1" stroke="#f5b13d" transform="translate(35 223)"></path><text x="67" y="236" font-size="13" fill="#f5b13d">15:15</text><text x="112" y="236" font-size="13">MrMikeInvesting</text><text x="112" y="251" font-size="12">Pari allégué sur des calls</text></g><g><circle cx="22" cy="276" r="3.3" stroke="#7aa2f7"></circle><path d="M1 5L10 1L19 5Z M2 8H18 M4 10V16 M10 10V16 M16 10V16 M2 16H18 M1 19H19" stroke="#7aa2f7" transform="translate(35 267)"></path><text x="67" y="280" font-size="13" fill="#7aa2f7">15:45</text><text x="112" y="280" font-size="13">Demande de Gallego</text><text x="112" y="295" font-size="12">Examen des opérations</text></g></svg>