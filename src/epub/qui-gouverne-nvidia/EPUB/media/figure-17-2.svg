<svg xmlns="http://www.w3.org/2000/svg" width="320" viewBox="0 0 320 330" role="img" aria-labelledby="nv17-diligence-fr-mobile-title nv17-diligence-fr-mobile-desc" xml:lang="fr" height="330"><title id="nv17-diligence-fr-mobile-title">Le circuit de la diligence</title><desc id="nv17-diligence-fr-mobile-desc">Mécanisme de diligence des contrôles annoncés par BIS le 16 novembre 2026, section 744.24 note 3 et paragraphe e. L’exportateur obtient et peut fournir des informations suffisantes sur les contrôles KYC du centre étranger, y compris sur ses clients et leur propriété ou contrôle. Le refus ou l’insuffisance d’informations constitue une alerte qui donne présomptivement connaissance, sauf résolution avant la transaction. Une demande de pièces et de clarifications revient vers le centre ; aucun feu vert automatique n’est représenté. Pour un changement ultérieur vers l’usage couvert, le destinataire doit être informé et l’opérateur obtenir l’autorisation BIS selon les conditions du texte.</desc><rect x="0.6" y="0.6" width="318.8" height="328.8" rx="3" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.1"></rect><text x="18" y="28" font-family="l0g Nvidia Cloud Controls" font-size="16" font-weight="400" text-anchor="start" fill="#e7e9ee">Le circuit de la diligence</text><g transform="translate(48 86)"><path d="M-22-18H-3V18H-22Z M4-18H23V18H4Z M-17-10H-8 M-17-3H-8 M-17 5H-8 M9-10H18 M9-3H18 M9 5H18 M-20 23H22" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path></g><g transform="translate(160 86)"><path d="M-13-16H3L13-6V10H-13Z M3-16V-6H13 M-7 0H4 M-7 5H1 M13 10L22 20" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path></g><g transform="translate(272 86)"><path d="M-14-20H5L16-9V20H-14Z M5-20V-9H16 M-7-1H8 M-7 6H8 M-7 13H3" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path></g><path d="M78 86H126" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><path d="M121 82L126 86L121 90" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><text x="102" y="58" font-family="l0g Nvidia Cloud Controls" font-size="12" font-weight="400" text-anchor="middle" fill="#8b909b">KYC</text><path d="M195 86H240" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><path d="M235 82L240 86L235 90" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><text x="48" y="130" font-family="l0g Nvidia Cloud Controls" font-size="12" font-weight="400" text-anchor="middle" fill="#e7e9ee">Centre</text><text x="48" y="147" font-family="l0g Nvidia Cloud Controls" font-size="12" font-weight="400" text-anchor="middle" fill="#e7e9ee">étranger</text><text x="160" y="130" font-family="l0g Nvidia Cloud Controls" font-size="13" font-weight="400" text-anchor="middle" fill="#e7e9ee">KYC</text><text x="272" y="130" font-family="l0g Nvidia Cloud Controls" font-size="12" font-weight="400" text-anchor="middle" fill="#e7e9ee">Exportateur</text><text x="160" y="169" font-family="l0g Nvidia Cloud Controls" font-size="12" font-weight="400" text-anchor="middle" fill="#8b909b">Clients · propriétaires · contrôle</text><text x="160" y="191" font-family="l0g Nvidia Cloud Controls" font-size="12" font-weight="400" text-anchor="middle" fill="#8b909b">Données insuffisantes</text><path d="M160 199V210H49" fill="none" stroke="#f5b13d" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><path d="M54 206L49 210L54 214" fill="none" stroke="#f5b13d" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><g transform="translate(36 230)"><path d="M0-19L21 18H-21Z M0-7V4 M0 10V12" fill="none" stroke="#f5b13d" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path></g><text x="63" y="226" font-family="l0g Nvidia Cloud Controls" font-size="12" font-weight="400" text-anchor="start" fill="#f5b13d">Alerte à résoudre</text><text x="63" y="244" font-family="l0g Nvidia Cloud Controls" font-size="12" font-weight="400" text-anchor="start" fill="#e7e9ee">avant transaction</text><path d="M36 252H12V156H48" fill="none" stroke="#f5b13d" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"></path><path d="M43 152L48 156L43 160" fill="none" stroke="#f5b13d" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><path d="M18 253H302" fill="none" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><text x="160" y="270" font-family="l0g Nvidia Cloud Controls" font-size="12" font-weight="400" text-anchor="middle" fill="#8b909b">Changement d’usage couvert</text><g transform="translate(42 288)"><path d="M-15-13H15V12H-15Z M-15-13L0-2L15-13 M-19 17H19" fill="none" stroke="#8b909b" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path></g><g transform="translate(273 288)"><path d="M-14-20H5L16-9V20H-14Z M5-20V-9H16 M-7 4L-2 9L8-1" fill="none" stroke="#f5b13d" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path></g><path d="M75 288H240" fill="none" stroke="#f5b13d" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><path d="M235 284L240 288L235 292" fill="none" stroke="#f5b13d" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><text x="42" y="321" font-family="l0g Nvidia Cloud Controls" font-size="12" font-weight="400" text-anchor="middle" fill="#e7e9ee">Informer</text><text x="273" y="321" font-family="l0g Nvidia Cloud Controls" font-size="12" font-weight="400" text-anchor="middle" fill="#e7e9ee">Autorisation</text></svg>