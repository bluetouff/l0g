<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 254" width="320" role="img" aria-labelledby="nv23-timeline-fr-mobile-title nv23-timeline-fr-mobile-desc" height="254"><title id="nv23-timeline-fr-mobile-title">Le retour de Jensen Huang</title><desc id="nv23-timeline-fr-mobile-desc">Le 17 novembre 2026, Harvey Jones indique aux investisseurs que le conseil ne compte pas réintégrer Jensen Huang à la direction. Le 22, le conseil réintègre Huang à l’unanimité avec effet immédiat. Le 23, Nvidia rend la décision publique. La SEC accepte le formulaire 8-K à 14 h 57 min 54 s, heure de Paris. L’heure du vote du 22 reste inconnue.</desc><rect x="1" y="1" width="318" height="252" rx="7"></rect><text x="17" y="27" font-size="16">Le retour de Jensen Huang</text><path d="M17 42H303 M17 220H303"></path><path d="M27 75V181"></path><g transform="translate(27 75)"><circle cx="0" cy="0" r="3.5" stroke="#8b909b"></circle><path d="M1 2H21V16H11L6 21V16H1Z M5 7H17 M5 11H14" transform="translate(14 -11)" stroke="#8b909b"></path><text x="48" y="-8" font-size="12" fill="#8b909b">17 novembre</text><text x="48" y="8" font-size="14">Jones écarte un retour</text><text x="48" y="24" font-size="12">Lors de l’appel aux investisseurs</text></g><g transform="translate(27 128)"><circle cx="0" cy="0" r="3.5" stroke="#5eead4"></circle><path d="M2 11H6 M16 11H20L22 14V22H0V14Z M0 14H22 M6 17H16 M5 6L10 10L17 2 M4 19H5 M17 19H18" transform="translate(14 -11)" stroke="#5eead4"></path><text x="48" y="-8" font-size="12" fill="#5eead4">22 novembre</text><text x="48" y="8" font-size="14">Le conseil réintègre Huang</text><text x="48" y="24" font-size="12">Vote unanime · effet immédiat</text></g><g transform="translate(27 181)"><circle cx="0" cy="0" r="3.5" stroke="#7aa2f7"></circle><path d="M3 1H14L20 7V23H3Z M14 1V7H20 M7 11H16 M7 15H16 M7 19H12" transform="translate(14 -11)" stroke="#7aa2f7"></path><text x="48" y="-8" font-size="12" fill="#7aa2f7">23 novembre</text><text x="48" y="8" font-size="14">Nvidia annonce le retour</text><text x="48" y="24" font-size="12">8-K accepté à 14 h 57 min 54 s</text></g><text x="17" y="240" font-size="12">Heure du vote inconnue · dépôt en heure de Paris</text></svg>