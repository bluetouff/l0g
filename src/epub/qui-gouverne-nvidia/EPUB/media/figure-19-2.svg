<svg xmlns="http://www.w3.org/2000/svg" width="320" viewBox="0 0 320 330" role="img" aria-labelledby="aolani-credit-chain-fr-mobile-title aolani-credit-chain-fr-mobile-desc" xml:lang="fr" height="330"><title id="aolani-credit-chain-fr-mobile-title">Le prêt Aolani en préparation</title><desc id="aolani-credit-chain-fr-mobile-desc">Bloomberg rapporte le 17 novembre 2026 une suspension du travail sur un prêt envisagé de 480 millions de dollars US pour Aolani Cloud. DBS est arrangeur mandaté et teneur de livre. Le prêt financerait des GPU Nvidia dans un centre de données en Malaisie, dont ByteDance utiliserait le calcul à distance. Les flèches discontinues représentent le projet, avec des financeurs examinant les contrôles BIS annoncés le 16 novembre. La suspension est rapportée sur sources anonymes. Signature, tirages et issue de l’examen réglementaire ne sont pas documentés dans le reportage. Sources : Bloomberg et texte BIS.</desc><rect x=".6" y=".6" width="318.8" height="328.8" rx="10" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.1"></rect><text x="16" y="28" font-family="l0g Nvidia Aolani Financing" font-size="16" font-weight="400" fill="#e7e9ee">Le prêt Aolani en préparation</text><text x="16" y="49" font-family="l0g Nvidia Aolani Financing" font-size="12" font-weight="400" fill="#8b909b">Pause rapportée · Bloomberg, 17 nov. 2026</text><g transform="translate(52 80)"><path d="M0 30 H34 M4 25 H30 M6 25 V12 M13 25 V12 M21 25 V12 M28 25 V12 M1 10 L17 1 L33 10 Z" fill="none" stroke="#5eead4" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"></path></g><text x="69" y="133" font-family="l0g Nvidia Aolani Financing" font-size="13" font-weight="400" fill="#e7e9ee" text-anchor="middle">Banques</text><text x="69" y="151" font-family="l0g Nvidia Aolani Financing" font-size="12" font-weight="400" fill="#8b909b" text-anchor="middle">DBS arrangeur</text><g transform="translate(232 80)"><path d="M5 0 H24 L31 7 V31 H5 Z M24 0 V7 H31 M13 13 V25 M21 13 V25" fill="none" stroke="#f5b13d" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"></path></g><text x="249" y="133" font-family="l0g Nvidia Aolani Financing" font-size="14" font-weight="400" fill="#e7e9ee" text-anchor="middle">480 M USD</text><text x="249" y="151" font-family="l0g Nvidia Aolani Financing" font-size="12" font-weight="400" fill="#8b909b" text-anchor="middle">Travail suspendu</text><g transform="translate(232 185)"><path d="M2 31 H32 M6 31 V10 L17 2 L28 10 V31 M11 14 H14 M20 14 H23 M11 21 H14 M20 21 H23 M13 31 V27 H21 V31" fill="none" stroke="#5eead4" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"></path></g><text x="249" y="238" font-family="l0g Nvidia Aolani Financing" font-size="13" font-weight="400" fill="#e7e9ee" text-anchor="middle">Aolani Cloud</text><text x="249" y="256" font-family="l0g Nvidia Aolani Financing" font-size="12" font-weight="400" fill="#8b909b" text-anchor="middle">Emprunteur</text><g transform="translate(52 185)"><path d="M4 0 H30 V31 H4 Z M4 10 H30 M4 21 H30 M9 5 H20 M9 15 H20 M9 26 H20 M25 5 H26 M25 15 H26 M25 26 H26" fill="none" stroke="#5eead4" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"></path></g><text x="69" y="238" font-family="l0g Nvidia Aolani Financing" font-size="13" font-weight="400" fill="#e7e9ee" text-anchor="middle">GPU Nvidia</text><text x="69" y="256" font-family="l0g Nvidia Aolani Financing" font-size="12" font-weight="400" fill="#8b909b" text-anchor="middle">Malaisie</text><g transform="translate(52 280)"><path d="M8 24 C-5 24 -1 8 10 9 C13 -4 31 0 30 12 C41 14 36 28 27 28 H20 M8 30 L14 24 L8 18 M14 24 H0" fill="none" stroke="#5eead4" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"></path></g><text x="104" y="294" font-family="l0g Nvidia Aolani Financing" font-size="13" font-weight="400" fill="#e7e9ee">ByteDance</text><text x="104" y="313" font-family="l0g Nvidia Aolani Financing" font-size="12" font-weight="400" fill="#8b909b">Accès distant prévu</text><path d="M94 96 H220" fill="none" stroke="#f5b13d" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"></path><path d="M215 92 L220 96 L215 100" fill="none" stroke="#f5b13d" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><path d="M273 96 H303 V201 H277" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"></path><path d="M282 197 L277 201 L282 205" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><path d="M220 201 H98" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"></path><path d="M103 197 L98 201 L103 205" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><path d="M69 217 H10 V296 H45" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"></path><path d="M40 292 L45 296 L40 300" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path></svg>