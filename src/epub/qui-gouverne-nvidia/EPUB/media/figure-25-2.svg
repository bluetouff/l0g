<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 345" width="320" role="img" aria-labelledby="nv25-timeline-fr-mobile-title nv25-timeline-fr-mobile-desc" height="345"><title id="nv25-timeline-fr-mobile-title">Nvidia et les décisions de Washington</title><desc id="nv25-timeline-fr-mobile-desc">Dates choisies en 2025 et 2026. Cercles pour les actes publics ou diplomatiques, losanges pour les transactions déclarées, contour pointillé pour un fait rapporté et contesté. Les espaces entre dates ne sont pas proportionnels. Les déclarations de transaction désignent Nvidia et donnent des montants par fourchette.</desc><rect x="1" y="1" width="318" height="343" rx="7"></rect><text x="17" y="27" font-size="16">Nvidia et les décisions de Washington</text><path d="M17 40H303 M17 173H303 M17 307H303"></path><g transform="translate(17 0)"><text x="0" y="62" font-size="15">2025</text><path d="M8 81V157"></path><g transform="translate(0 81)"><path d="M8 -4L12 0L8 4L4 0Z"></path><text x="23" y="4" font-size="12">29 janv.</text><text x="96" y="4" font-size="12">Achat · 1 à 5 M$</text></g><g transform="translate(0 100)"><circle cx="8" cy="0" r="3.6"></circle><text x="23" y="4" font-size="12">9 avr.</text><text x="96" y="4" font-size="12">Licence exigée pour le H20</text></g><g transform="translate(0 119)"><circle cx="8" cy="0" r="3.6"></circle><text x="23" y="4" font-size="12">14–15 juil.</text><text x="96" y="4" font-size="12">H20 · assurance de licences</text></g><g transform="translate(0 138)"><path d="M8 -4L12 0L8 4L4 0Z"></path><text x="23" y="4" font-size="12">18 août</text><text x="96" y="4" font-size="12">Achat · 5 à 25 M$</text></g><g transform="translate(0 157)"><circle cx="8" cy="0" r="3.6"></circle><text x="23" y="4" font-size="12">8 déc.</text><text x="96" y="4" font-size="12">H200 · annonce de Trump</text></g></g><g transform="translate(17 132)"><text x="0" y="62" font-size="15">2026</text><path d="M8 81V157"></path><g transform="translate(0 81)"><circle cx="8" cy="0" r="3.6"></circle><text x="23" y="4" font-size="12">15 janv.</text><text x="96" y="4" font-size="12">Règle H200</text></g><g transform="translate(0 100)"><circle cx="8" cy="0" r="3.6"></circle><text x="23" y="4" font-size="12">Mai</text><text x="96" y="4" font-size="12">Anchorage · briefing contesté</text></g><g transform="translate(0 119)"><path d="M8 -4L12 0L8 4L4 0Z"></path><text x="23" y="4" font-size="12">18 mai</text><text x="96" y="4" font-size="12">Vente · 0,5 à 1 M$</text></g><g transform="translate(0 138)"><circle cx="8" cy="0" r="3.6"></circle><text x="23" y="4" font-size="12">22–23 nov.</text><text x="96" y="4" font-size="12">Réintégration de Huang</text></g><g transform="translate(0 157)"><circle cx="8" cy="0" r="3.6"></circle><text x="23" y="4" font-size="12">23 nov.</text><text x="96" y="4" font-size="12">BIS · sept entités inscrites</text></g></g><circle cx="21" cy="326" r="3.4"></circle><text x="30" y="330" font-size="12">Acte public</text><path d="M101 322L105 326L101 330L97 326Z"></path><text x="110" y="330" font-size="12">Opération déclarée</text><circle cx="224" cy="326" r="3.4"></circle><text x="233" y="330" font-size="12">Contesté</text></svg>