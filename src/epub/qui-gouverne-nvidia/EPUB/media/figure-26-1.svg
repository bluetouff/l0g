<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 352 255" width="352" role="img" aria-labelledby="nv26-timeline-fr-title nv26-timeline-fr-desc" font-family="Liberation Sans,Arial,sans-serif" font-weight="400" height="255"><title id="nv26-timeline-fr-title">Le retour de Huang et l’État</title><desc id="nv26-timeline-fr-desc">Les volets III et V de l0g évoquent une participation fédérale possible le 12 novembre. Le 17, Harvey Jones écarte un retour de Jensen Huang. Le conseil vote sa réintégration le 22 et Nvidia en informe le public le 23. Le 24, Trump dit au New York Post avoir envisagé une participation fédérale mais ne pas avoir soulevé la question à ce stade.</desc><rect x="1" y="1" width="350" height="253" rx="7" fill="#121419" stroke="rgba(255, 255, 255, 0.20)"></rect><text x="19" y="27" font-size="16" fill="#e7e9ee">Le retour de Huang et l’État</text><text x="19" y="46" font-size="13" fill="#8b909b">12 au 24 novembre 2026 · dates sélectionnées</text><path d="M19 56H333" fill="none" stroke="rgba(255, 255, 255, 0.10)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path><path d="M88 77V220" fill="none" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path><text x="19" y="82" font-size="13.4" fill="#8b909b">12 nov.</text><rect x="84" y="74" width="8" height="8" rx="1" fill="#121419" stroke="#7aa2f7" stroke-width="1.15"></rect><text x="106" y="82" font-size="13.7" fill="#e7e9ee">l0g avance une hypothèse</text><text x="106" y="98" font-size="13" fill="#8b909b">Participation fédérale · III et V</text><text x="19" y="117" font-size="13.4" fill="#8b909b">17 nov.</text><circle cx="88" cy="113" r="4.0" fill="#121419" stroke="#5eead4" stroke-width="1.25"></circle><text x="106" y="117" font-size="13.7" fill="#e7e9ee">Jones écarte un retour</text><text x="106" y="133" font-size="13" fill="#8b909b">Appel aux investisseurs</text><text x="19" y="152" font-size="13.4" fill="#8b909b">22 nov.</text><circle cx="88" cy="148" r="4.0" fill="#121419" stroke="#5eead4" stroke-width="1.25"></circle><text x="106" y="152" font-size="13.7" fill="#e7e9ee">Le conseil réintègre Huang</text><text x="106" y="168" font-size="13" fill="#8b909b">Vote unanime</text><text x="19" y="187" font-size="13.4" fill="#8b909b">23 nov.</text><circle cx="88" cy="183" r="4.0" fill="#121419" stroke="#5eead4" stroke-width="1.25"></circle><text x="106" y="187" font-size="13.7" fill="#e7e9ee">Nvidia annonce le retour</text><text x="19" y="222" font-size="13.4" fill="#8b909b">24 nov.</text><path d="M88 213L93 218L88 223L83 218Z" fill="#121419" stroke="#f5b13d" stroke-width="1.25"></path><text x="106" y="222" font-size="13.7" fill="#e7e9ee">Trump dit avoir envisagé une part</text><text x="106" y="238" font-size="13" fill="#8b909b">Il dit ne pas avoir soulevé le sujet</text></svg>