<svg xmlns="http://www.w3.org/2000/svg" width="320" viewBox="0 0 320 322" role="img" aria-labelledby="nv20-credit-fr-m-title nv20-credit-fr-m-desc" xml:lang="fr" height="322"><title id="nv20-credit-fr-m-title">Trois circuits de financement</title><desc id="nv20-credit-fr-m-desc">Trois circuits contractuels distincts. Des créanciers financent Nvidia, dont Moody’s maintient la note Aa1 et ramène la perspective à stable le 18 novembre 2026. Les plateformes visent à mobiliser des capitaux tiers pour proposer des prêts aux clients, avec un éventuel soutien Nvidia propre à chaque projet. La souscription d’actions Anthropic par Nvidia est conditionnée au règlement de l’introduction en Bourse. Les flèches pointillées représentent les prêts envisagés et la souscription conditionnelle. Les trois lignes ne forment pas un agrégat.</desc><rect x="0.6" y="0.6" width="318.8" height="320.8" rx="3" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.1"></rect><text x="18" y="25" font-family="l0g Nvidia Credit Transmission" font-size="16" font-weight="400" text-anchor="start" fill="#e7e9ee">Trois circuits de financement</text><text x="18" y="44" font-family="l0g Nvidia Credit Transmission" font-size="11.5" font-weight="400" text-anchor="start" fill="#8b909b">Contrats distincts · au 19 nov. 2026</text><text x="18" y="67" font-family="l0g Nvidia Credit Transmission" font-size="12" font-weight="400" text-anchor="start" fill="#8b909b">La dette de Nvidia</text><g transform="translate(18 74)"><path d="M0 6L9 1L18 6Z" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><path d="M0 9H18 M0 21H18 M3 12V18 M9 12V18 M15 12V18" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path></g><text x="45" y="93" font-family="l0g Nvidia Credit Transmission" font-size="12.5" font-weight="400" text-anchor="start" fill="#e7e9ee">Créanciers</text><g transform="translate(227 74)"><rect x="0" y="1" width="18" height="20" rx="1" fill="none" stroke="#5eead4" stroke-width="1.1"></rect><path d="M4 6H7 M11 6H14 M4 11H7 M11 11H14 M7 21V16H11V21" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path></g><text x="250" y="93" font-family="l0g Nvidia Credit Transmission" font-size="12.5" font-weight="400" text-anchor="start" fill="#e7e9ee">Nvidia</text><path d="M121 89H215" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><path d="M210 85L215 89L210 93" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><text x="168" y="78" font-family="l0g Nvidia Credit Transmission" font-size="12" font-weight="400" text-anchor="middle" fill="#5eead4">Financement</text><text x="18" y="112" font-family="l0g Nvidia Credit Transmission" font-size="12" font-weight="400" text-anchor="start" fill="#8b909b">Aa1 maintenue · perspective stable</text><text x="18" y="141" font-family="l0g Nvidia Credit Transmission" font-size="12" font-weight="400" text-anchor="start" fill="#8b909b">Les prêts aux clients</text><g transform="translate(18 151)"><rect x="0" y="1" width="12" height="9" rx="1" fill="none" stroke="#5eead4" stroke-width="1.1"></rect><rect x="5" y="6" width="12" height="9" rx="1" fill="none" stroke="#5eead4" stroke-width="1.1"></rect><rect x="10" y="11" width="12" height="9" rx="1" fill="none" stroke="#5eead4" stroke-width="1.1"></rect></g><text x="45" y="170" font-family="l0g Nvidia Credit Transmission" font-size="12.5" font-weight="400" text-anchor="start" fill="#e7e9ee">Plateformes</text><g transform="translate(227 151)"><rect x="0" y="1" width="18" height="8" rx="1" fill="none" stroke="#5eead4" stroke-width="1.1"></rect><rect x="0" y="13" width="18" height="8" rx="1" fill="none" stroke="#5eead4" stroke-width="1.1"></rect><path d="M4 5H6 M10 5H14 M4 17H6 M10 17H14" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path></g><text x="250" y="170" font-family="l0g Nvidia Credit Transmission" font-size="12.5" font-weight="400" text-anchor="start" fill="#e7e9ee">Clients IA</text><path d="M121 166H215" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"></path><path d="M210 162L215 166L210 170" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><text x="168" y="155" font-family="l0g Nvidia Credit Transmission" font-size="12" font-weight="400" text-anchor="middle" fill="#5eead4">Prêts envisagés</text><text x="18" y="188" font-family="l0g Nvidia Credit Transmission" font-size="12" font-weight="400" text-anchor="start" fill="#8b909b">Soutien Nvidia éventuel,</text><text x="18" y="203" font-family="l0g Nvidia Credit Transmission" font-size="12" font-weight="400" text-anchor="start" fill="#8b909b">selon chaque projet</text><text x="18" y="225" font-family="l0g Nvidia Credit Transmission" font-size="12" font-weight="400" text-anchor="start" fill="#8b909b">Le capital d’Anthropic</text><g transform="translate(18 235)"><rect x="0" y="1" width="18" height="20" rx="1" fill="none" stroke="#f5b13d" stroke-width="1.1"></rect><path d="M4 6H7 M11 6H14 M4 11H7 M11 11H14 M7 21V16H11V21" fill="none" stroke="#f5b13d" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path></g><text x="45" y="254" font-family="l0g Nvidia Credit Transmission" font-size="12.5" font-weight="400" text-anchor="start" fill="#e7e9ee">Nvidia</text><g transform="translate(227 235)"><path d="M1 1H12L18 7V22H1Z M12 1V7H18 M5 12H14 M5 16H14" fill="none" stroke="#f5b13d" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path></g><text x="250" y="254" font-family="l0g Nvidia Credit Transmission" font-size="12.5" font-weight="400" text-anchor="start" fill="#e7e9ee">Anthropic</text><path d="M121 250H215" fill="none" stroke="#f5b13d" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"></path><path d="M210 246L215 250L210 254" fill="none" stroke="#f5b13d" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><text x="168" y="239" font-family="l0g Nvidia Credit Transmission" font-size="12" font-weight="400" text-anchor="middle" fill="#f5b13d">Actions</text><text x="18" y="282" font-family="l0g Nvidia Credit Transmission" font-size="12" font-weight="400" text-anchor="start" fill="#8b909b">Souscription sous condition</text><text x="18" y="297" font-family="l0g Nvidia Credit Transmission" font-size="12" font-weight="400" text-anchor="start" fill="#8b909b">du règlement de l’IPO</text><path d="M18 126H302 M18 211H302" fill="none" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path></svg>