<svg xmlns="http://www.w3.org/2000/svg" width="320" viewBox="0 0 320 288" role="img" aria-labelledby="nv21-bis-fr-m-title nv21-bis-fr-m-desc" xml:lang="fr" height="288"><title id="nv21-bis-fr-m-title">H200 / MI325X : demandes et licences</title><desc id="nv21-bis-fr-m-desc">Synthèse partielle du BIS arrêtée au 11 mai 2026 et rendue publique le 19 novembre 2026. Elle recense des demandes portant sur 3 444 160 puces Nvidia H200 ou AMD MI325X et des autorisations pour 879 868 puces, réparties sur 21 demandes approuvées. Les 21 lignes approuvées du tableau portent le statut « Approved, not shipped » au 11 mai. Le périmètre comprend des entreprises établies en Chine ou dont la maison mère ultime y siège. Les deux barres représentent des quantités de puces sur une même échelle. Le statut d’expédition représenté est celui du 11 mai 2026.</desc><rect x="0.6" y="0.6" width="318.8" height="286.8" rx="3" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.1"></rect><text x="18" y="25" font-family="l0g Nvidia BIS License Snapshot" font-size="16" font-weight="400" text-anchor="start" fill="#e7e9ee">H200 / MI325X : licences</text><text x="18" y="45" font-family="l0g Nvidia BIS License Snapshot" font-size="12" font-weight="400" text-anchor="start" fill="#8b909b">Synthèse partielle · au 11 mai 2026</text><g transform="translate(18 67)"><rect x="4" y="4" width="14" height="14" rx="1" fill="none" stroke="#8b909b" stroke-width="1.1"></rect><path d="M8 8H14V14H8Z M8 0V4 M14 0V4 M8 18V22 M14 18V22 M0 8H4 M0 14H4 M18 8H22 M18 14H22" fill="none" stroke="#8b909b" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path></g><text x="52" y="83" font-family="l0g Nvidia BIS License Snapshot" font-size="13" font-weight="400" text-anchor="start" fill="#e7e9ee">Demandées</text><text x="302" y="83" font-family="l0g Nvidia BIS License Snapshot" font-size="16" font-weight="400" text-anchor="end" fill="#e7e9ee">3 444 160</text><rect x="18" y="98" width="284" height="12" 