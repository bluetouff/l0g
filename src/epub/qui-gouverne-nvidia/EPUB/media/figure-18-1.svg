<svg xmlns="http://www.w3.org/2000/svg" width="320" viewBox="0 0 320 320" role="img" aria-labelledby="nvidia-board-oversight-fr-mobile-title nvidia-board-oversight-fr-mobile-desc" xml:lang="fr" height="320"><title id="nvidia-board-oversight-fr-mobile-title">Le double rattachement annoncé</title><desc id="nvidia-board-oversight-fr-mobile-desc">Le 17 novembre 2026, Nvidia annonce que ses équipes existantes de sécurité nationale et de conformité commerciale rendront compte directement au nouveau comité permanent du conseil et à Colette Kress, DG intérimaire. Les quatre flèches et leur jonction représentent ce double rattachement. Source : communiqué Nvidia du 17 novembre 2026.</desc><rect x=".6" y=".6" width="318.8" height="318.8" rx="10" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.1"></rect><text x="16" y="28" font-family="l0g Nvidia Board Oversight" font-size="16" font-weight="400" fill="#e7e9ee">Le double rattachement annoncé</text><text x="16" y="49" font-family="l0g Nvidia Board Oversight" font-size="12" font-weight="400" fill="#8b909b">Équipes existantes · 17 novembre 2026</text><g transform="translate(58 74)"><path d="M16 0 L29 5 V16 C29 24 22 29 16 32 C10 29 3 24 3 16 V5 Z M10 15 L14 19 L23 10" fill="none" stroke="#5eead4" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"></path></g><g transform="translate(228 74)"><path d="M4 6 H28 V28 H4 Z M0 11 H32 M9 0 H23 V6 M10 17 H22 M10 22 H18" fill="none" stroke="#5eead4" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"></path></g><text x="74" y="128" font-family="l0g Nvidia Board Oversight" font-size="13" font-weight="400" fill="#e7e9ee" text-anchor="middle">Sécurité</text><text x="74" y="146" font-family="l0g Nvidia Board Oversight" font-size="13" font-weight="400" fill="#e7e9ee" text-anchor="middle">nationale</text><text x="244" y="128" font-family="l0g Nvidia Board Oversight" font-size="13" font-weight="400" fill="#e7e9ee" text-anchor="middle">Conformité</tex