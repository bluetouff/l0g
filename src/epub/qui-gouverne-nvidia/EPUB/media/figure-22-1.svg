<svg xmlns="http://www.w3.org/2000/svg" width="320" viewBox="0 0 320 288" role="img" aria-labelledby="nv22-saturn-fr-m-title nv22-saturn-fr-m-desc" xml:lang="fr" height="288">
        <title id="nv22-saturn-fr-m-title">Les loyers du financement Saturn</title>
        <desc id="nv22-saturn-fr-m-desc">Schéma du fonctionnement prévu du financement Saturn. Les investisseurs souscrivent les titres émis par Saturn Funding Trust, filiale indirecte de WHCO. WHCO, le bailleur, achète les GPU et équipements associés puis les loue à SpaceX. SpaceX doit verser à WHCO des loyers trimestriels pour chaque tranche à compter de sa livraison. Ces loyers doivent amortir la dette. Apollo et Goldman Sachs ont annoncé le 20 novembre 2026 la fixation des conditions de l’émission. Les livraisons sont attendues au premier semestre 2027. Les flèches pointillées représentent les flux prévus.</desc>
        <rect x="0.6" y="0.6" width="318.8" height="286.8" rx="3" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.1"></rect>
