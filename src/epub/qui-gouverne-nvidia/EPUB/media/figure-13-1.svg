<svg xmlns="http://www.w3.org/2000/svg" width="320" viewBox="0 0 320 330" role="img" aria-labelledby="nv13-succession-fr-mobile-title nv13-succession-fr-mobile-desc" xml:lang="fr" height="330"><title id="nv13-succession-fr-mobile-title">La succession de Nvidia</title><desc id="nv13-succession-fr-mobile-desc">Le conseil de Nvidia nomme Colette Kress directrice générale par intérim le 11 novembre 2026. Le 13, il déclare sélectionner un cabinet de recrutement. Scott Bessent appelle publiquement à un dirigeant extérieur le 15 novembre. Le pointillé désigne cet appel politique ; les traits pleins décrivent les décisions du conseil et la recherche en cours. Le poste permanent reste ouvert.</desc><rect x="0.6" y="0.6" width="318.8" height="328.8" rx="3" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.1"></rect><text x="18" y="28" font-family="l0g Nvidia Succession" font-size="16" font-weight="400" text-anchor="start" fill="#e7e9ee">La succession de Nvidia</text><g transform="translate(65 73)"><path d="M-19-13H19V8H-2L-12 17V8H-19Z M-12-5H12 M-12 1H4" fill="none" stroke="#f5b13d" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path></g><text x="65" y="109" font-family="l0g Nvidia Succession" font-size="13" font-weight="400" text-anchor="middle" fill="#e7e9ee">Bessent</text><text x="65" y="127" font-family="l0g Nvidia Succession" font-size="12" font-weight="400" text-anchor="middle" fill="#8b909b">Appel public</text><path d="M104 73H199" fill="none" stroke="#f5b13d" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"></path><path d="M194 69L199 73L194 77" fill="none" stroke="#f5b13d" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><text x="151" y="55" font-family="l0g Nvidia Succession" font-size="12" font-weight="400" text-anchor="middle" fill="#f5b13d">Extérieur</text><g transform="translate(240 73)"><path d="M-23-6H23V6H-23Z M-14-15H-6V-9H-14Z M6-15H14V-9H6Z M-14 9H-6V15H-1