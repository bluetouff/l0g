="70" y="252" font-family="l0g Nvidia Succession" font-size="13" font-weight="400" text-anchor="middle" fill="#e7e9ee">Successeur</text><text x="70" y="270" font-family="l0g Nvidia Succession" font-size="12" font-weight="400" text-anchor="middle" fill="#8b909b">Recherche en cours</text><path d="M18 302H47" fill="none" stroke="#f5b13d" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"></path><text x="58" y="306" font-family="l0g Nvidia Succession" font-size="12" font-weight="400" text-anchor="start" fill="#8b909b">Appel public · 15 nov.</text></svg>