<svg xmlns="http://www.w3.org/2000/svg" width="320" viewBox="0 0 320 330" role="img" aria-labelledby="nv17-controls-fr-mobile-title nv17-controls-fr-mobile-desc" xml:lang="fr" height="330"><title id="nv17-controls-fr-mobile-title">Deux contrôles dans le cloud</title><desc id="nv17-controls-fr-mobile-desc">Contrôles annoncés dans le texte BIS du 16 novembre 2026. Le fournisseur envoie des équipements soumis aux EAR à un centre étranger qui donne un accès distant à ses clients. Le contrôle de destination de la section 742.6 ajoute cinq pays, avec une exclusion américaine sous conditions. Le contrôle d’usage de la section 744.24 porte sur les équipements destinés à un centre, où que ce centre se trouve, lorsque l’exportateur a connaissance d’un accès supérieur à douze millions de TPP agrégé pour des entreprises dont le siège ou la société mère ultime se trouve dans le groupe D:5 ou à Macao. Le seuil peut être atteint dans un centre ou entre centres liés. Les modalités et exclusions restent celles du texte annoncé.</desc><rect x="0.6" y="0.6" width="318.8" height="328.8" rx="3" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.1"></rect><text x="18" y="28" font-family="l0g Nvidia Cloud Controls" font-size="16" font-weight="400" text-anchor="start" fill="#e7e9ee">Deux contrôles dans le cloud</text><g transform="translate(48 86)"><path d="M-14-15H14V15H-14Z M-7-7H7V7H-7Z M-21-9H-15 M-21 0H-15 M-21 9H-15 M15-9H21 M15 0H21 M15 9H21 M-8-22V-16 M0-22V-16 M8-22V-16 M-8 16V22 M0 16V22 M8 16V22" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path></g><g transform="translate(160 86)"><path d="M-22-18H-3V18H-22Z M4-18H23V18H4Z M-17-10H-8 M-17-3H-8 M-17 5H-8 M9-10H18 M9-3H18 M9 5H18 M-20 23H22" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path></g><g transform="translate(272 86)"><path d="M-21-14H21V13H-21Z M-26 18H26 M-4-7H4V1H-4Z M-10 9V6H10V9" fill="none" stroke=