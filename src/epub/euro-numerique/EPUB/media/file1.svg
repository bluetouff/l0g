<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 480 930" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="balance-shift-title-fr balance-shift-desc-fr" style="display:block;width:100%;height:auto;max-width:720px;margin:0 auto;background:#0b111a;border:1px solid rgba(255,255,255,0.12);border-radius:14px;font-family:system-ui,sans-serif">
  <title id="balance-shift-title-fr">Conversion de mille euros de dépôt en euros numériques</title>
  <desc id="balance-shift-desc-fr">Le dépôt bancaire du ménage baisse, les réserves de la banque sont transférées à l’Eurosystème et une dette en euro numérique apparaît. Si la banque se refinance, elle remplace le dépôt par une dette envers l’Eurosystème.</desc>
  <defs>
    <linearGradient id="balance-shift-bg-fr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a121c"></stop>
      <stop offset="100%" stop-color="#122236"></stop>
    </linearGradient>
    <marker id="balance-shift-arrow-fr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#68d9c8"></path>
    </marker>
  </defs>
  <rect x="1" y="1" width="478" height="928" rx="14" fill="url(#balance-shift-bg-fr)"></rect>
  <text x="24" y="38" fill="#f4f7fb" font-size="20" font-weight="750">1 000 € CHANGENT DE BILAN</text>
  <text x="24" y="63" fill="#9fb1c5" font-size="12">Canal simplifié avec utilisation des réserves</text>
  <g transform="translate(20 92)">
    <rect width="440" height="132" rx="12" fill="#172337" stroke="#7fa7ff"></rect>
    <text x="22" y="30" fill="#9bb9ff" font-size="12" font-weight="750">AVANT</text>
    <text x="22" y="58" fill="#ffffff" font-size="16" font-weight="750">Ménage</text>
    <text x="160" y="58" fill="#dbe5f0" font-size="14">actif : dépôt bancaire +1 000 €</text>
    <text x="22" y="88" fill="#ffffff" font-size="16" font-weight="750">Banque</text>
    <text x="160" y="88" fill="#dbe5f0" font-size="14">passif : dépôt +1 000 €</text>
    <text x="160" y="113" fill="#dbe5f0" font-size="14">actif : réserves +1 000 €</text>
  </g>
  <path d="M240 230 V270" stroke="#68d9c8" stroke-width="3" marker-end="url(#balance-shift-arrow-fr)"></path>
  <text x="255" y="255" fill="#8fe8da" font-size="12" font-weight="700">CONVERSION</text>
  <g transform="translate(20 286)">
    <rect width="440" height="150" rx="12" fill="#162d32" stroke="#68d9c8"></rect>
    <text x="22" y="31" fill="#8fe8da" font-size="12" font-weight="750">MOUVEMENT</text>
    <text x="22" y="62" fill="#f2f7f6" font-size="14">1. Le dépôt du client est débité.</text>
    <text x="22" y="91" fill="#f2f7f6" font-size="14">2. La banque transfère ses réserves.</text>
    <text x="22" y="120" fill="#f2f7f6" font-size="14">3. L’Eurosystème émet la créance numérique.</text>
  </g>
  <path d="M240 442 V482" stroke="#68d9c8" stroke-width="3" marker-end="url(#balance-shift-arrow-fr)"></path>
  <g transform="translate(20 498)">
    <rect width="440" height="158" rx="12" fill="#251d33" stroke="#da8cff"></rect>
    <text x="22" y="31" fill="#e6adff" font-size="12" font-weight="750">APRÈS, AVEC RÉSERVES EXISTANTES</text>
    <text x="22" y="61" fill="#ffffff" font-size="16" font-weight="750">Ménage</text>
    <text x="160" y="61" fill="#eee6f2" font-size="14">actif : euro numérique +1 000 €</text>
    <text x="22" y="93" fill="#ffffff" font-size="16" font-weight="750">Banque</text>
    <text x="160" y="93" fill="#eee6f2" font-size="14">dépôts et réserves : -1 000 €</text>
    <text x="22" y="125" fill="#ffffff" font-size="16" font-weight="750">Eurosystème</text>
    <text x="160" y="125" fill="#eee6f2" font-size="14">réserves -1 000 €</text>
    <text x="160" y="148" fill="#eee6f2" font-size="14">euro numérique +1 000 €</text>
  </g>
  <path d="M240 662 V702" stroke="#ffb86b" stroke-width="3" marker-end="url(#balance-shift-arrow-fr)"></path>
  <text x="257" y="686" fill="#ffca8e" font-size="12" font-weight="700">SI REFINANCEMENT</text>
  <g transform="translate(20 718)">
    <rect width="440" height="154" rx="12" fill="#332619" stroke="#ffb86b"></rect>
    <text x="22" y="31" fill="#ffca8e" font-size="12" font-weight="750">AUTRE CANAL POSSIBLE</text>
    <text x="22" y="62" fill="#fff4e7" font-size="14">La banque emprunte des réserves contre collatéral.</text>
    <text x="22" y="91" fill="#fff4e7" font-size="14">Le dépôt est remplacé par une dette envers</text>
    <text x="22" y="113" fill="#fff4e7" font-size="14">l’Eurosystème ou par une autre source de financement.</text>
    <text x="22" y="139" fill="#ffca8e" font-size="13" font-weight="700">Le coût et le risque dépendent alors du refinancement.</text>
  </g>
  <text x="24" y="905" fill="#8199af" font-size="11">Schéma simplifié. Les bilans complets comportent d’autres postes.</text>
</svg>
