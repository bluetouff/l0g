<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 480 1070" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="models-title-fr models-desc-fr" style="display:block;width:100%;height:auto;max-width:720px;margin:0 auto;background:#0a111a;border:1px solid rgba(255,255,255,0.12);border-radius:14px;font-family:system-ui,sans-serif">
  <title id="models-title-fr">Trois modèles du risque bancaire lié à l’euro numérique</title>
  <desc id="models-desc-fr">Comparaison entre le modèle BCE 2025, le modèle Bundesbank court terme 2024 et le modèle Bundesbank long terme 2026.</desc>
  <defs>
    <linearGradient id="models-bg-fr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a111a"></stop>
      <stop offset="100%" stop-color="#14253a"></stop>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="478" height="1068" rx="14" fill="url(#models-bg-fr)"></rect>
  <text x="24" y="38" fill="#f4f7fb" font-size="20" font-weight="750">COMPARAISON DES TROIS MODÈLES</text>
  <text x="24" y="63" fill="#9fb1c5" font-size="12">Des conclusions proches obtenues par des mécanismes différents</text>
  <g transform="translate(20 92)">
    <rect width="440" height="278" rx="13" fill="#172337" stroke="#7fa7ff" stroke-width="1.5"></rect>
    <text x="22" y="32" fill="#9bb9ff" font-size="12" font-weight="750">BCE 2025 · ZONE EURO · CHOC IMMÉDIAT</text>
    <text x="22" y="64" fill="#ffffff" font-size="18" font-weight="800">2 025 banques</text>
    <text x="230" y="64" fill="#ffffff" font-size="18" font-weight="800">données Q1 2024</text>
    <text x="22" y="100" fill="#dce6f0" font-size="13">Réserves, marché, obligations et refinancement</text>
    <text x="22" y="122" fill="#dce6f0" font-size="13">de banque centrale sous contraintes de collatéral.</text>
    <text x="22" y="154" fill="#7fa7ff" font-size="12" font-weight="750">RÉSULTAT À 3 000 €</text>
    <text x="22" y="184" fill="#ffffff" font-size="15" font-weight="700">699 Md€ de sorties</text>
    <text x="22" y="210" fill="#ffffff" font-size="15" font-weight="700">13 banques à 100 % de LCR</text>
    <text x="22" y="236" fill="#ffffff" font-size="15" font-weight="700">9 limitées par le collatéral standard</text>
    <text x="22" y="262" fill="#aebed0" font-size="11">La banque centrale appartient au mécanisme d’absorption.</text>
  </g>
  <g transform="translate(20 394)">
    <rect width="440" height="278" rx="13" fill="#152c31" stroke="#65d9c8" stroke-width="1.5"></rect>
    <text x="22" y="32" fill="#8ce9dc" font-size="12" font-weight="750">BUNDESBANK 2024 · ALLEMAGNE · COURT TERME</text>
    <text x="22" y="64" fill="#ffffff" font-size="18" font-weight="800">Conversion rapide</text>
    <text x="230" y="64" fill="#ffffff" font-size="18" font-weight="800">peu d’adaptation</text>
    <text x="22" y="100" fill="#ddf1ee" font-size="13">Le modèle teste la redistribution de HQLA</text>
    <text x="22" y="122" fill="#ddf1ee" font-size="13">dans les réseaux d’épargne et coopératifs.</text>
    <text x="22" y="154" fill="#65d9c8" font-size="12" font-weight="750">RÉSULTAT À 3 000 €</text>
    <text x="22" y="184" fill="#ffffff" font-size="15" font-weight="700">Déficit agrégé jusqu’à environ 2 % des HQLA</text>
    <text x="22" y="210" fill="#ffffff" font-size="15" font-weight="700">Aucun déficit des réseaux concernés</text>
    <text x="22" y="236" fill="#ffffff" font-size="15" font-weight="700">si la liquidité interne circule efficacement</text>
    <text x="22" y="262" fill="#afcfc9" font-size="11">La structure du groupe peut compenser l’exposition retail.</text>
  </g>
  <g transform="translate(20 696)">
    <rect width="440" height="306" rx="13" fill="#251d33" stroke="#d98bff" stroke-width="1.5"></rect>
    <text x="22" y="32" fill="#e4a9ff" font-size="12" font-weight="750">BUNDESBANK 2026 · ALLEMAGNE · LONG TERME</text>
    <text x="22" y="64" fill="#ffffff" font-size="18" font-weight="800">1 052 banques retail</text>
    <text x="250" y="64" fill="#ffffff" font-size="18" font-weight="800">données Q1 2025</text>
    <text x="22" y="100" fill="#eee6f2" font-size="13">Hausse possible des taux de dépôt, obligations</text>
    <text x="22" y="122" fill="#eee6f2" font-size="13">bancaires et nouvel équilibre de financement.</text>
    <text x="22" y="147" fill="#ffb86b" font-size="12" font-weight="700">Refinancement de banque centrale exclu.</text>
    <text x="22" y="179" fill="#d98bff" font-size="12" font-weight="750">SCÉNARIO ADVERSE À 3 000 €</text>
    <text x="22" y="211" fill="#ffffff" font-size="17" font-weight="800">ROE : environ -0,2 point</text>
    <text x="22" y="241" fill="#ffffff" font-size="17" font-weight="800">LCR : environ -7 points</text>
    <text x="22" y="273" fill="#cdbed7" font-size="12">Le choc est absorbable, mais modifie durablement</text>
    <text x="22" y="293" fill="#cdbed7" font-size="12">le prix et la structure du financement bancaire.</text>
  </g>
</svg>
