<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 590" width="100%" role="img" aria-labelledby="blocked4-fr-title blocked4-fr-desc" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;display:block;background:#0b0f14;border:1px solid #3a4654;border-radius:16px;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,sans-serif">
<title id="blocked4-fr-title">Quatre raisons juridiques différentes pour lesquelles un paiement peut être impossible</title>
<desc id="blocked4-fr-desc">Une préautorisation, un refus antifraude, un gel de sanctions et une saisie judiciaire peuvent tous empêcher un paiement. Chacun porte sur un objet distinct et repose sur une autorité différente.</desc>
<g class="blocked4-fr-desktop">
<rect width="760" height="590" rx="16" fill="#0b0f14"></rect>
<text x="32" y="46" fill="#f7f9fc" font-size="24" font-weight="760">QUATRE BASES JURIDIQUES D’UN PAIEMENT BLOQUÉ</text>
<text x="32" y="74" fill="#94a3b8" font-size="14">Le même symptôme peut venir de quatre droits différents.</text>
<rect x="30" y="110" width="335" height="188" rx="14" fill="#14272d" stroke="#62d8c6"></rect>
<text x="50" y="142" fill="#7ee5d6" font-size="15" font-weight="760">PRÉAUTORISATION</text>
<text x="50" y="172" fill="#f7f9fc" font-size="14">Une somme est réservée.</text>
<text x="50" y="195" fill="#f7f9fc" font-size="14">Elle reste dans le plafond.</text>
<line x1="50" y1="218" x2="345" y2="218" stroke="#36515b"></line>
<text x="50" y="244" fill="#b7d5d0" font-size="12">Décideur : payeur et commerçant</text>
<text x="50" y="265" fill="#b7d5d0" font-size="12">Objet : montant avant règlement</text>
<text x="50" y="286" fill="#7ee5d6" font-size="12.5" font-weight="720">Issue : règlement, annulation ou expiration</text>
<rect x="395" y="110" width="335" height="188" rx="14" fill="#302418" stroke="#ffb86b"></rect>
<text x="415" y="142" fill="#ffca91" font-size="15" font-weight="760">REFUS ANTIFRAUDE</text>
<text x="415" y="172" fill="#f7f9fc" font-size="14">Le PSP refuse un ordre.</text>
<text x="415" y="195" fill="#f7f9fc" font-size="14">Le solde reste d’usage général.</text>
<line x1="415" y1="218" x2="710" y2="218" stroke="#665039"></line>
<text x="415" y="244" fill="#d8c9b8" font-size="12">Décideur : PSP selon le droit des paiements</text>
<text x="415" y="265" fill="#d8c9b8" font-size="12">Objet : transaction ou instrument</text>
<text x="415" y="286" fill="#ffca91" font-size="12.5" font-weight="720">Issue : motif, contestation, déblocage</text>
<rect x="30" y="326" width="335" height="188" rx="14" fill="#18272c" stroke="#8dd7a9"></rect>
<text x="50" y="358" fill="#9be5b6" font-size="15" font-weight="760">GEL DE SANCTIONS</text>
<text x="50" y="388" fill="#f7f9fc" font-size="14">Une personne ou entité est ciblée.</text>
<text x="50" y="411" fill="#f7f9fc" font-size="14">Ses avoirs deviennent indisponibles.</text>
<line x1="50" y1="434" x2="345" y2="434" stroke="#3c5a48"></line>
<text x="50" y="460" fill="#bfd7c7" font-size="12">Décideur : Union, exécution par le PSP</text>
<text x="50" y="481" fill="#bfd7c7" font-size="12">Objet : personne, compte et avoirs</text>
<text x="50" y="502" fill="#9be5b6" font-size="12.5" font-weight="720">Issue : dégel ou recours contre la mesure</text>
<rect x="395" y="326" width="335" height="188" rx="14" fill="#251d33" stroke="#d98bff"></rect>
<text x="415" y="358" fill="#e2adff" font-size="15" font-weight="760">SAISIE OU GEL JUDICIAIRE</text>
<text x="415" y="388" fill="#f7f9fc" font-size="14">Un juge ou une autorité agit</text>
<text x="415" y="411" fill="#f7f9fc" font-size="14">sur un bien ou une créance.</text>
<line x1="415" y1="434" x2="710" y2="434" stroke="#594063"></line>
<text x="415" y="460" fill="#d2c2d9" font-size="12">Décideur : autorité compétente</text>
<text x="415" y="481" fill="#d2c2d9" font-size="12">Objet : patrimoine du titulaire</text>
<text x="415" y="502" fill="#e2adff" font-size="12.5" font-weight="720">Issue : procédure, exemptions et recours</text>
<rect x="30" y="538" width="700" height="28" rx="8" fill="#111923"></rect>
<text x="380" y="557" text-anchor="middle" fill="#dce6ef" font-size="12">Aucun de ces mécanismes n’exige un euro portant une catégorie d’achat ou une date d’expiration.</text>
</g>
<g class="blocked4-fr-mobile" transform="scale(2.1714)">
<rect width="350" height="272" rx="9" fill="#0b0f14"></rect>
<text x="15" y="21" fill="#f7f9fc" font-size="12.5" font-weight="760">« PAIEMENT IMPOSSIBLE » : QUEL DROIT ?</text>
<text x="15" y="34" fill="#94a3b8" font-size="7.3">La base juridique permet de situer le pouvoir.</text>
<rect x="12" y="46" width="326" height="46" rx="6" fill="#14272d" stroke="#62d8c6"></rect>
<text x="21" y="61" fill="#7ee5d6" font-size="8.2" font-weight="760">PRÉAUTORISATION</text><text x="329" y="61" text-anchor="end" fill="#f7f9fc" font-size="8">montant réservé</text>
<text x="21" y="76" fill="#b7d5d0" font-size="7.2">Accord commercial, avant règlement, puis libération.</text>
<rect x="12" y="100" width="326" height="46" rx="6" fill="#302418" stroke="#ffb86b"></rect>
<text x="21" y="115" fill="#ffca91" font-size="8.2" font-weight="760">ANTIFRAUDE</text><text x="329" y="115" text-anchor="end" fill="#f7f9fc" font-size="8">ordre refusé</text>
<text x="21" y="130" fill="#d8c9b8" font-size="7.2">Décision du PSP, motif et recours selon le droit.</text>
<rect x="12" y="154" width="326" height="46" rx="6" fill="#18272c" stroke="#8dd7a9"></rect>
<text x="21" y="169" fill="#9be5b6" font-size="8.2" font-weight="760">SANCTIONS</text><text x="329" y="169" text-anchor="end" fill="#f7f9fc" font-size="8">personne ciblée</text>
<text x="21" y="184" fill="#bfd7c7" font-size="7.2">Gel d’avoirs sur base juridique européenne.</text>
<rect x="12" y="208" width="326" height="46" rx="6" fill="#251d33" stroke="#d98bff"></rect>
<text x="21" y="223" fill="#e2adff" font-size="8.2" font-weight="760">SAISIE / GEL</text><text x="329" y="223" text-anchor="end" fill="#f7f9fc" font-size="8">bien ou créance</text>
<text x="21" y="238" fill="#d2c2d9" font-size="7.2">Autorité ou juge, procédure et exemptions.</text>
<text x="15" y="268" fill="#9fb0c0" font-size="7.2">Même blocage pratique, quatre bases différentes.</text>
</g>
</svg>
