nt-weight="850">79,1 M€ estimés</text><text x="230" y="113" fill="#ffbd78" font-size="14" font-weight="850">237,3 M€ plafond</text><text x="18" y="144" fill="#9e8ea9" font-size="11">8 offres · qualité 70 % · prix 30 %</text></g><g transform="translate(20 456)"><rect width="440" height="166" rx="12" fill="#13253a" stroke="#68d9c8"></rect><text x="18" y="27" fill="#8ce8db" font-size="12" font-weight="800">APPLICATION ET SDK · 10 ANS MAX.</text><text x="18" y="56" fill="#fff" font-size="14" font-weight="800">1. Almaviva + Fabrick</text><text x="18" y="82" fill="#dceae7" font-size="13">2. Sapient + Tremend</text><text x="18" y="113" fill="#8ce8db" font-size="14" font-weight="850">76,8 M€ estimés</text><text x="230" y="113" fill="#ffbd78" font-size="14" font-weight="850">153,6 M€ plafond</text><text x="18" y="144" fill="#859e9a" font-size="11">10 offres · qualité 60 % · prix 40 %</text></g><g transform="translate(20 638)"><rect width="440" height="166" rx="12" fill="#30251a" stroke="#ffbd78"></rect><text x="18" y="27" fill="#ffd09d" font-size="12" font-weight="800">SOLUTION OFFLINE · 15 ANS MAX.</text><text x="18" y="56" fill="#fff" font-size="14" font-weight="800">1. G+D advance52 + Currency Technology</text><text x="18" y="82" fill="#f4e8d8" font-size="13">2. equensWorldline</text><text x="18" y="113" fill="#8ce8db" font-size="14" font-weight="850">220,7 M€ estimés</text><text x="230" y="113" fill="#ffbd78" font-size="14" font-weight="850">662,1 M€ plafond</text><text x="18" y="144" fill="#b59a79" font-size="11">4 offres · qualité 70 % · prix 30 %</text></g><g transform="translate(20 820)"><rect width="440" height="166" rx="12" fill="#321d22" stroke="#ff8498"></rect><text x="18" y="27" fill="#ffa6b5" font-size="12" font-weight="800">SEPI · 10 ANS MAX.</text><text x="18" y="56" fill="#fff" font-size="14" font-weight="800">1. Senacor FCS</text><text x="18" y="82" fill="#f2e2e5" font-size="13">2. equensWorldline</text><text x="18" y="113" fill="#8ce8db" font-size="14" fon