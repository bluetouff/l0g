<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 480 1010" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t2 d2" style="font-family:system-ui,sans-serif;background:#0a111a">
<title id="t2">Cent euros, trois chaînes de rémunération</title>
<desc id="d2">Comparaison entre une carte internationale, un euro numérique à quatre coins et un euro numérique avec une banque de funding distincte.</desc>
<defs><linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a111a"></stop><stop offset="1" stop-color="#15283e"></stop></linearGradient><marker id="arr2" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#68d9c8"></path></marker></defs>
<rect x="1" y="1" width="478" height="1008" rx="15" fill="url(#g2)" stroke="#304459"></rect>
<text x="24" y="40" fill="#f4f7fb" font-size="21" font-weight="800">100 € : QUI REÇOIT QUOI ?</text>
<text x="24" y="66" fill="#9fb1c5" font-size="12">HYPOTHÈSES ILLUSTRATIVES</text>
<g transform="translate(20 92)"><rect width="440" height="240" rx="13" fill="#172337" stroke="#8facff"></rect><text x="20" y="30" fill="#a7c0ff" font-size="12" font-weight="800">CARTE INTERNATIONALE, MOYENNE ILLUSTRATIVE</text><text x="20" y="63" fill="#fff" font-size="24" font-weight="850">Commerçant : environ 0,50 €</text><path d="M220 92H390" stroke="#68d9c8" stroke-width="3" marker-end="url(#arr2)"></path><text x="20" y="98" fill="#dce7ef" font-size="13">MSC</text><text x="20" y="126" fill="#dce7ef" font-size="13">Interchange + scheme + processing</text><text x="20" y="150" fill="#dce7ef" font-size="13">+ marge acquéreur + risque + service</text><rect x="20" y="172" width="400" height="46" rx="9" fill="#101923" stroke="#3b5269"></rect><text x="34" y="191" fill="#ffbd78" font-size="11.5" font-weight="750">DONNÉE INCOMPLÈTE</text><text x="34" y="208" fill="#cad6df" font-size="11.5">Les contrats et NDAs empêchent une ventilation publique complète.</text></g>
<g transform="translate(20 354)"><rect width="440" height="262" rx="13" fill="#152c31" stroke="#68d9c8"></rect><text x="20" y="30" fill="#8ce8db" font-size="12" font-weight="800">EURO NUMÉRIQUE, MODÈLE À QUATRE COINS</text><text x="20" y="60" fill="#fff" font-size="15" font-weight="750">Commerçant</text><path d="M110 56H180" stroke="#68d9c8" stroke-width="3" marker-end="url(#arr2)"></path><text x="194" y="60" fill="#fff" font-size="15" font-weight="750">PSP acquéreur</text><path d="M300 56H370" stroke="#68d9c8" stroke-width="3" marker-end="url(#arr2)"></path><text x="20" y="103" fill="#dceae7" font-size="13">MSC finale : inconnue et plafonnée</text><text x="20" y="131" fill="#dceae7" font-size="13">Inter-PSP illustrative : environ 0,18 €</text><text x="20" y="159" fill="#dceae7" font-size="13">Scheme fee Eurosystème : 0 €</text><text x="20" y="187" fill="#dceae7" font-size="13">Settlement fee Eurosystème : 0 €</text><rect x="20" y="207" width="400" height="34" rx="8" fill="#0e1b1e" stroke="#68d9c8"></rect><text x="34" y="229" fill="#b8f0e7" font-size="11.5">Les 0,18 € couvrent uniquement le transfert inter-PSP.</text></g>
<g transform="translate(20 638)"><rect width="440" height="300" rx="13" fill="#30251a" stroke="#ffbd78"></rect><text x="20" y="30" fill="#ffd09d" font-size="12" font-weight="800">EURO NUMÉRIQUE, MODÈLE À SIX COINS</text><text x="20" y="62" fill="#fff" font-size="15" font-weight="750">Compte bancaire lié</text><path d="M155 58H220" stroke="#ffbd78" stroke-width="3" marker-end="url(#arr2)"></path><text x="234" y="62" fill="#fff" font-size="15" font-weight="750">PSP wallet</text><text x="20" y="100" fill="#f4e8d8" font-size="13">La banque de funding authentifie et fournit la liquidité.</text><text x="20" y="128" fill="#f4e8d8" font-size="13">Le PSP wallet gère le compte euro numérique.</text><text x="20" y="156" fill="#f4e8d8" font-size="13">Le PSP acquéreur sert le commerçant.</text><rect x="20" y="181" width="400" height="78" rx="10" fill="#21170f" stroke="#ff8498"></rect><text x="34" y="204" fill="#ffa6b5" font-size="12" font-weight="800">ANGLE MORT</text><text x="34" y="226" fill="#f4e8d8" font-size="12">Qui rémunère la banque de funding tierce ?</text><text x="34" y="247" fill="#f4e8d8" font-size="12">Le compromis final ne fixe pas encore la réponse.</text><text x="20" y="285" fill="#c9ab89" font-size="11">Le modèle doit associer responsabilité opérationnelle et revenu.</text></g>
<text x="24" y="980" fill="#75899d" font-size="10.5">Sources : BCE compensation model, Parlement, ECA. Synthèse l0g.</text>
</svg>
