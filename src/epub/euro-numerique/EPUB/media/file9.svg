<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 650" width="100%" role="img" aria-labelledby="layers4-fr-title layers4-fr-desc" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;display:block;background:#0b0f14;border:1px solid #3a4654;border-radius:16px;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,sans-serif">
<title id="layers4-fr-title">Six endroits différents où une règle peut agir sur un paiement</title>
<desc id="layers4-fr-desc">La règle peut porter sur l’unité monétaire, l’ordre de paiement, une réservation, l’instrument, le compte ou une personne et son patrimoine. Seule la première catégorie correspond directement à la monnaie programmable.</desc>
<g class="layers4-fr-desktop">
<rect width="760" height="650" rx="16" fill="#0b0f14"></rect>
<text x="32" y="46" fill="#f7f9fc" font-size="24" font-weight="760">OÙ VIT LA RÈGLE ?</text>
<text x="32" y="74" fill="#94a3b8" font-size="14">Même résultat apparent, six objets juridiques différents.</text>
<rect x="30" y="108" width="220" height="208" rx="14" fill="#2b1928" stroke="#ff7ea8"></rect>
<text x="48" y="142" fill="#ff9abb" font-size="15" font-weight="760">1. UNITÉ MONÉTAIRE</text>
<text x="48" y="176" fill="#f7f9fc" font-size="14">« Cet euro expire vendredi »</text>
<text x="48" y="201" fill="#f7f9fc" font-size="14">« alimentation seulement »</text>
<line x1="48" y1="225" x2="232" y2="225" stroke="#5d354e"></line>
<text x="48" y="253" fill="#d7b9c5" font-size="12">La restriction suit la valeur.</text>
<text x="48" y="276" fill="#ff9abb" font-size="13" font-weight="720">MONNAIE PROGRAMMABLE</text>
<text x="48" y="297" fill="#d7b9c5" font-size="12">Interdite par l’article 24.</text>
<rect x="270" y="108" width="220" height="208" rx="14" fill="#172337" stroke="#7fa7ff"></rect>
<text x="288" y="142" fill="#9bb9ff" font-size="15" font-weight="760">2. ORDRE DE PAIEMENT</text>
<text x="288" y="176" fill="#f7f9fc" font-size="14">« payer après livraison »</text>
<text x="288" y="201" fill="#f7f9fc" font-size="14">« payer chaque mois »</text>
<line x1="288" y1="225" x2="472" y2="225" stroke="#3b4d70"></line>
<text x="288" y="253" fill="#bdc9e5" font-size="12">La condition disparaît au règlement.</text>
<text x="288" y="276" fill="#9bb9ff" font-size="13" font-weight="720">PAIEMENT CONDITIONNEL</text>
<text x="288" y="297" fill="#bdc9e5" font-size="12">Autorisé et exploré.</text>
<rect x="510" y="108" width="220" height="208" rx="14" fill="#152c31" stroke="#62d8c6"></rect>
<text x="528" y="142" fill="#7ee5d6" font-size="15" font-weight="760">3. RÉSERVATION</text>
<text x="528" y="176" fill="#f7f9fc" font-size="14">hôtel, location, usage</text>
<text x="528" y="198" fill="#f7f9fc" font-size="14">montant bloqué</text>
<text x="528" y="217" fill="#f7f9fc" font-size="14">avant paiement</text>
<line x1="528" y1="232" x2="712" y2="232" stroke="#36515b"></line>
<text x="528" y="253" fill="#b7d5d0" font-size="12">La somme est indisponible,</text>
<text x="528" y="272" fill="#b7d5d0" font-size="12">pas spécialisée.</text>
<text x="528" y="297" fill="#7ee5d6" font-size="13" font-weight="720">PRÉAUTORISATION</text>
<rect x="30" y="340" width="220" height="208" rx="14" fill="#302418" stroke="#ffb86b"></rect>
<text x="48" y="374" fill="#ffca91" font-size="15" font-weight="760">4. INSTRUMENT</text>
<text x="48" y="408" fill="#f7f9fc" font-size="14">plafond, sans contact, carte</text>
<text x="48" y="433" fill="#f7f9fc" font-size="14">blocage de sécurité</text>
<line x1="48" y1="457" x2="232" y2="457" stroke="#665039"></line>
<text x="48" y="485" fill="#d8c9b8" font-size="12">La carte est limitée.</text>
<text x="48" y="508" fill="#ffca91" font-size="13" font-weight="720">CONTRÔLE D’ACCÈS</text>
<text x="48" y="529" fill="#d8c9b8" font-size="12">Les euros restent ordinaires.</text>
<rect x="270" y="340" width="220" height="208" rx="14" fill="#251d33" stroke="#d98bff"></rect>
<text x="288" y="374" fill="#e2adff" font-size="15" font-weight="760">5. COMPTE</text>
<text x="288" y="408" fill="#f7f9fc" font-size="14">plafond de détention</text>
<text x="288" y="430" fill="#f7f9fc" font-size="14">transfert automatique</text>
<text x="288" y="451" fill="#f7f9fc" font-size="14">de l’excédent</text>
<line x1="288" y1="465" x2="472" y2="465" stroke="#594063"></line>
<text x="288" y="490" fill="#d2c2d9" font-size="12">La quantité ou la disponibilité</text>
<text x="288" y="509" fill="#d2c2d9" font-size="12">est encadrée.</text>
<text x="288" y="534" fill="#e2adff" font-size="13" font-weight="720">RÈGLE D’ARCHITECTURE</text>
<rect x="510" y="340" width="220" height="208" rx="14" fill="#18272c" stroke="#8dd7a9"></rect>
<text x="528" y="374" fill="#9be5b6" font-size="15" font-weight="760">6. PERSONNE / BIEN</text>
<text x="528" y="408" fill="#f7f9fc" font-size="14">sanction, gel, saisie</text>
<text x="528" y="430" fill="#f7f9fc" font-size="14">décision d’une autorité</text>
<text x="528" y="451" fill="#f7f9fc" font-size="14">ou d’un juge</text>
<line x1="528" y1="465" x2="712" y2="465" stroke="#3c5a48"></line>
<text x="528" y="490" fill="#bfd7c7" font-size="12">Le droit bloque la disposition.</text>
<text x="528" y="513" fill="#9be5b6" font-size="13" font-weight="720">RESTRICTION JURIDIQUE</text>
<text x="528" y="534" fill="#bfd7c7" font-size="12">La monnaie reste fongible.</text>
<rect x="30" y="576" width="700" height="45" rx="10" fill="#111923" stroke="#344556"></rect>
<text x="50" y="604" fill="#dce6ef" font-size="13">Le test décisif : la restriction suit-elle les euros après leur transfert ?</text>
</g>
<g class="layers4-fr-mobile" transform="scale(2.1714)">
<rect width="350" height="299" rx="9" fill="#0b0f14"></rect>
<text x="15" y="21" fill="#f7f9fc" font-size="13" font-weight="760">OÙ VIT LA RÈGLE ?</text>
<text x="15" y="34" fill="#94a3b8" font-size="7.4">Seule une restriction qui suit l’unité est de la monnaie programmable.</text>
<rect x="12" y="45" width="326" height="35" rx="6" fill="#2b1928" stroke="#ff7ea8"></rect>
<text x="21" y="59" fill="#ff9abb" font-size="8.4" font-weight="760">UNITÉ</text><text x="329" y="59" text-anchor="end" fill="#f7f9fc" font-size="8.4">expire, biens limités</text>
<text x="21" y="72" fill="#d7b9c5" font-size="7.2">La restriction suit la valeur : monnaie programmable.</text>
<rect x="12" y="86" width="326" height="35" rx="6" fill="#172337" stroke="#7fa7ff"></rect>
<text x="21" y="100" fill="#9bb9ff" font-size="8.4" font-weight="760">ORDRE</text><text x="329" y="100" text-anchor="end" fill="#f7f9fc" font-size="8.4">après livraison</text>
<text x="21" y="113" fill="#bdc9e5" font-size="7.2">La condition disparaît au règlement.</text>
<rect x="12" y="127" width="326" height="35" rx="6" fill="#152c31" stroke="#62d8c6"></rect>
<text x="21" y="141" fill="#7ee5d6" font-size="8.4" font-weight="760">RÉSERVATION</text><text x="329" y="141" text-anchor="end" fill="#f7f9fc" font-size="8.4">somme bloquée</text>
<text x="21" y="154" fill="#b7d5d0" font-size="7.2">Indisponible avant paiement, libre ensuite.</text>
<rect x="12" y="168" width="326" height="35" rx="6" fill="#302418" stroke="#ffb86b"></rect>
<text x="21" y="182" fill="#ffca91" font-size="8.4" font-weight="760">INSTRUMENT</text><text x="329" y="182" text-anchor="end" fill="#f7f9fc" font-size="8.4">carte ou app</text>
<text x="21" y="195" fill="#d8c9b8" font-size="7.2">Le moyen d’accès est limité.</text>
<rect x="12" y="209" width="326" height="35" rx="6" fill="#251d33" stroke="#d98bff"></rect>
<text x="21" y="223" fill="#e2adff" font-size="8.4" font-weight="760">COMPTE</text><text x="329" y="223" text-anchor="end" fill="#f7f9fc" font-size="8.4">plafond de stock</text>
<text x="21" y="236" fill="#d2c2d9" font-size="7.2">La quantité ou la disponibilité est encadrée.</text>
<rect x="12" y="250" width="326" height="35" rx="6" fill="#18272c" stroke="#8dd7a9"></rect>
<text x="21" y="264" fill="#9be5b6" font-size="8.4" font-weight="760">PERSONNE / BIEN</text><text x="329" y="264" text-anchor="end" fill="#f7f9fc" font-size="8.4">gel ou saisie</text>
<text x="21" y="277" fill="#bfd7c7" font-size="7.2">Le droit bloque le pouvoir de disposer des avoirs.</text>
<text x="15" y="294" fill="#9fb0c0" font-size="7.4">Test : la règle survit-elle au transfert ?</text>
</g>
</svg>
