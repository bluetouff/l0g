<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 480 1040" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="a6-tests-fr-t a6-tests-fr-d" style="font-family:system-ui,sans-serif;background:#0a111a"><title id="a6-tests-fr-t">Les six tests de souveraineté</title><desc id="a6-tests-fr-d">La souveraineté opérationnelle est évaluée par la gouvernance, la visibilité, la modification, le remplacement, la continuité et la reconstruction.</desc><defs><linearGradient id="a6-tests-fr-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a111a"></stop><stop offset="1" stop-color="#14263a"></stop></linearGradient></defs><rect x="1" y="1" width="478" height="1038" rx="15" fill="url(#a6-tests-fr-bg)" stroke="#304459"></rect><text x="24" y="39" fill="#f4f7fb" font-size="20" font-weight="800">LES SIX TESTS DE SOUVERAINETÉ</text><text x="24" y="65" fill="#9fb1c5" font-size="12">Une preuve distincte pour chaque capacité</text><g transform="translate(20 94)"><rect width="440" height="132" rx="12" fill="#132b2c" stroke="#68d9c8"></rect><circle cx="35" cy="37" r="19" fill="#68d9c8"></circle><text x="35" y="43" text-anchor="middle" fill="#07131d" font-size="16" font-weight="850">1</text><text x="68" y="31" fill="#8ce8db" font-size="13" font-weight="850">GOUVERNER</text><text x="68" y="56" fill="#fff" font-size="15" font-weight="750">Qui décide, certifie et impose une correction ?</text><text x="20" y="91" fill="#dceae7" font-size="12.5">Atout : émission, registre et rulebook publics.</text><text x="20" y="114" fill="#dceae7" font-size="12.5">Angle mort : répartition précise entre les six BCN.</text></g><g transform="translate(20 242)"><rect width="440" height="132" rx="12" fill="#172337" stroke="#8facff"></rect><circle cx="35" cy="37" r="19" fill="#8facff"></circle><text x="35" y="43" text-anchor="middle" fill="#07131d" font-size="16" font-weight="850">2</text><text x="68" y="31" fill="#a7c0ff" font-size="13" font-weight="850">VOIR</text><text x="68" y="50" fill="#fff" font-size="13.5" font-weight="750">Qui inspecte code, logs, modèles</text><text x="68" y="68" fill="#fff" font-size="13.5" font-weight="750">et sous-traitants ?</text><text x="20" y="91" fill="#dce7ef" font-size="12.5">Atout : standards et contrôle contractuel BCE.</text><text x="20" y="114" fill="#dce7ef" font-size="12.5">Angle mort : droits d'audit et chaîne de sous-traitance non publics.</text></g><g transform="translate(20 390)"><rect width="440" height="132" rx="12" fill="#251d33" stroke="#dda0ff"></rect><circle cx="35" cy="37" r="19" fill="#dda0ff"></circle><text x="35" y="43" text-anchor="middle" fill="#16091c" font-size="16" font-weight="850">3</text><text x="68" y="31" fill="#e8b7ff" font-size="13" font-weight="850">MODIFIER</text><text x="68" y="56" fill="#fff" font-size="15" font-weight="750">L'Eurosystème peut-il corriger sans le titulaire ?</text><text x="20" y="91" fill="#eee6f2" font-size="12.5">Atout : droits complets publiés pour offline.</text><text x="20" y="114" fill="#eee6f2" font-size="12.5">Angle mort : quatre autres composants non vérifiables publiquement.</text></g><g transform="translate(20 538)"><rect width="440" height="132" rx="12" fill="#30251a" stroke="#ffbd78"></rect><circle cx="35" cy="37" r="19" fill="#ffbd78"></circle><text x="35" y="43" text-anchor="middle" fill="#1c1005" font-size="16" font-weight="850">4</text><text x="68" y="31" fill="#ffd09d" font-size="13" font-weight="850">REMPLACER</text><text x="68" y="50" fill="#fff" font-size="13.5" font-weight="750">Le second fournisseur peut-il</text><text x="68" y="68" fill="#fff" font-size="13.5" font-weight="750">reprendre la production ?</text><text x="20" y="91" fill="#f4e8d8" font-size="12.5">Atout : deux accords par composant.</text><text x="20" y="114" fill="#f4e8d8" font-size="12.5">Angle mort : délai, code, données, clés et bascule non démontrés.</text></g><g transform="translate(20 686)"><rect width="440" height="132" rx="12" fill="#321d22" stroke="#ff8498"></rect><circle cx="35" cy="37" r="19" fill="#ff8498"></circle><text x="35" y="43" text-anchor="middle" fill="#1c0710" font-size="16" font-weight="850">5</text><text x="68" y="31" fill="#ffa6b5" font-size="13" font-weight="850">CONTINUER</text><text x="68" y="50" fill="#fff" font-size="13.5" font-weight="750">Que reste-t-il sans store, réseau</text><text x="68" y="68" fill="#fff" font-size="13.5" font-weight="750">ou secure element ?</text><text x="20" y="91" fill="#f2e2e5" font-size="12.5">Atout : droit européen, deux lots réseau, cartes alternatives.</text><text x="20" y="114" fill="#f2e2e5" font-size="12.5">Angle mort : accès matériel et parité opérationnelle.</text></g><g transform="translate(20 834)"><rect width="440" height="132" rx="12" fill="#11202a" stroke="#68d9c8"></rect><circle cx="35" cy="37" r="19" fill="#68d9c8"></circle><text x="35" y="43" text-anchor="middle" fill="#07131d" font-size="16" font-weight="850">6</text><text x="68" y="31" fill="#8ce8db" font-size="13" font-weight="850">RECONSTRUIRE</text><text x="68" y="56" fill="#fff" font-size="15" font-weight="750">Sources, builds, clés et compétences suffisent-ils ?</text><text x="20" y="91" fill="#dceae7" font-size="12.5">Atout : références et SDK prévus dans le pilote.</text><text x="20" y="114" fill="#dceae7" font-size="12.5">Angle mort : couverture production et exercice par une autre équipe.</text></g><rect x="20" y="986" width="440" height="28" rx="8" fill="#0f1822" stroke="#ffbd78"></rect><text x="240" y="1005" text-anchor="middle" fill="#edf3f8" font-size="11.5">Le pilote doit mesurer la reprise après une défaillance.</text><text x="24" y="1030" fill="#75899d" font-size="10">Cadre d'analyse l0g, fondé sur les contrats et l'architecture publique.</text></svg>
