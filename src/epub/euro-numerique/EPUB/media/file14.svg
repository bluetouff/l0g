<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 480 1060" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t3 d3" style="font-family:system-ui,sans-serif;background:#0a111a">
<title id="t3">Comparaison des périmètres de coût à 5,77 et 18 milliards d’euros</title>
<desc id="d3">Le pont de la BCE retire certains postes et applique des synergies plus fortes. PwC maintient que les coûts sont déplacés et que certaines filiales restent autonomes.</desc>
<defs><linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a111a"></stop><stop offset="1" stop-color="#16283e"></stop></linearGradient></defs>
<rect x="1" y="1" width="478" height="1058" rx="15" fill="url(#g3)" stroke="#304459"></rect>
<text x="24" y="39" fill="#f4f7fb" font-size="20" font-weight="800">5,77 Md€ VS 18 Md€</text>
<text x="24" y="65" fill="#9fb1c5" font-size="12">Comparaison de deux architectures de coût</text>
<g transform="translate(20 92)"><rect width="440" height="396" rx="13" fill="#172337" stroke="#8facff"></rect><text x="20" y="30" fill="#a7c0ff" font-size="12" font-weight="800">PONT BCE 2025</text><text x="20" y="63" fill="#fff" font-size="22" font-weight="850">124 M€ par banque</text><text x="20" y="91" fill="#dce7ef" font-size="13">Base détaillée issue des bundles PwC</text><rect x="20" y="112" width="400" height="142" rx="10" fill="#101923" stroke="#3b5269"></rect><text x="34" y="136" fill="#ffbd78" font-size="12" font-weight="800">CORRECTIONS EXPLICITES : -20,1 M€</text><text x="34" y="163" fill="#dce7ef" font-size="12.5">Carte physique : -6,0 M€</text><text x="34" y="187" fill="#dce7ef" font-size="12.5">POS : -7,0 M€</text><text x="34" y="211" fill="#dce7ef" font-size="12.5">ATM : -5,1 M€</text><text x="34" y="235" fill="#dce7ef" font-size="12.5">Calcul des frais : -2,0 M€</text><text x="20" y="284" fill="#fff" font-size="19" font-weight="800">Base ajustée : 103,9 M€</text><text x="20" y="316" fill="#dce7ef" font-size="13">Puis synergies de groupe : 90 à 98 % pour certains IPS</text><text x="20" y="342" fill="#dce7ef" font-size="13">Synergies de marché : 25 à 40 % selon scénario</text><text x="20" y="368" fill="#dce7ef" font-size="13">Univers : 1 929 banques retail, groupes consolidés</text><text x="20" y="390" fill="#8facff" font-size="14" font-weight="850">Résultat base : 5,77 Md€</text></g>
<g transform="translate(20 510)"><rect width="440" height="396" rx="13" fill="#30251a" stroke="#ffbd78"></rect><text x="20" y="30" fill="#ffd09d" font-size="12" font-weight="800">RÉPONSE PWC / BANQUES 2026</text><text x="20" y="63" fill="#fff" font-size="22" font-weight="850">18 Md€ maintenus</text><text x="20" y="91" fill="#f4e8d8" font-size="13">Après relecture du rulebook 0.9 et de la note BCE</text><text x="20" y="132" fill="#f4e8d8" font-size="13">Synergies de groupe revendiquées : plus de 79 %</text><text x="20" y="160" fill="#f4e8d8" font-size="13">754 banques supportent un coût direct</text><text x="20" y="188" fill="#f4e8d8" font-size="13">1 828 banques utilisent entièrement la plateforme du groupe</text><rect x="20" y="214" width="400" height="132" rx="10" fill="#21170f" stroke="#ff8498"></rect><text x="34" y="238" fill="#ffa6b5" font-size="12" font-weight="800">OBJECTION</text><text x="34" y="266" fill="#f4e8d8" font-size="12.5">Même carte, POS ou ATM : nouveau schéma et certification.</text><text x="34" y="292" fill="#f4e8d8" font-size="12.5">L'outsourcing devient licence, frais de service et lock-in.</text><text x="34" y="318" fill="#f4e8d8" font-size="12.5">Les filiales sur IT distinct gardent des coûts locaux.</text><text x="20" y="378" fill="#ffbd78" font-size="14" font-weight="850">Résultat : 18 Md€ de change costs</text></g>
<rect x="20" y="928" width="440" height="88" rx="11" fill="#11202a" stroke="#68d9c8"></rect>
<text x="38" y="953" fill="#8ce8db" font-size="12" font-weight="800">LE VRAI DÉSACCORD</text>
<text x="38" y="977" fill="#edf3f8" font-size="12.5">Quel coût peut être mutualisé, et à quel prix futur du fournisseur ?</text>
<text x="38" y="999" fill="#edf3f8" font-size="12.5">Le TCO récurrent reste absent des deux calculs.</text>
<text x="24" y="1042" fill="#75899d" font-size="10.5">Sources : BCE octobre 2025, PwC juin 2025 et mars 2026.</text>
</svg>
