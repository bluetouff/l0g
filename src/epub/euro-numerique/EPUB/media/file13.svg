<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 480 990" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t1 d1" style="font-family:system-ui,sans-serif;background:#0a111a">
<title id="t1">Une facture, cinq périmètres</title>
<desc id="d1">Les coûts publiés concernent l'Eurosystème, les banques, les autres PSP, les commerçants et le coût collectif. Aucun coût total de possession n'est publié.</desc>
<defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a111a"></stop><stop offset="1" stop-color="#14263a"></stop></linearGradient></defs>
<rect x="1" y="1" width="478" height="988" rx="15" fill="url(#g1)" stroke="#304459"></rect>
<text x="24" y="40" fill="#f4f7fb" font-size="21" font-weight="800">UNE FACTURE, CINQ PÉRIMÈTRES</text>
<text x="24" y="66" fill="#9fb1c5" font-size="12">Les sous-totaux publiés ne forment pas un total consolidé</text>
<g transform="translate(20 94)"><rect width="440" height="142" rx="12" fill="#13253a" stroke="#68d9c8"></rect><text x="20" y="30" fill="#8ce8db" font-size="12" font-weight="800">1. EUROSYSTÈME</text><text x="20" y="61" fill="#fff" font-size="22" font-weight="850">1,3 Md€ + 320 M€/an</text><text x="20" y="88" fill="#dbe7ee" font-size="13">Développement central puis exploitation.</text><text x="20" y="111" fill="#dbe7ee" font-size="13">Le revenu monétaire finance une scheme fee nulle.</text><text x="20" y="132" fill="#91a5b8" font-size="11">Estimation BCE, design final encore conditionnel.</text></g>
<g transform="translate(20 254)"><rect width="440" height="162" rx="12" fill="#172337" stroke="#8facff"></rect><text x="20" y="30" fill="#a7c0ff" font-size="12" font-weight="800">2. BANQUES</text><text x="20" y="61" fill="#fff" font-size="21" font-weight="850">BCE : 4 à 5,77 Md€</text><text x="20" y="89" fill="#fff" font-size="21" font-weight="850">PwC : 18 Md€</text><text x="20" y="116" fill="#dbe7ee" font-size="13">Univers, synergies, filiales et horizon différents.</text><text x="20" y="139" fill="#ffbd78" font-size="12" font-weight="750">Estimations alternatives aux périmètres distincts.</text></g>
<g transform="translate(20 434)"><rect width="440" height="130" rx="12" fill="#251d33" stroke="#dda0ff"></rect><text x="20" y="30" fill="#e8b7ff" font-size="12" font-weight="800">3. PSP NON BANCAIRES</text><text x="20" y="62" fill="#fff" font-size="22" font-weight="850">INCONNU</text><text x="20" y="88" fill="#eee6f2" font-size="13">App, KYC, fraude, support, litiges et funding.</text><text x="20" y="111" fill="#c8b9d0" font-size="11">Aucune estimation consolidée publique.</text></g>
<g transform="translate(20 582)"><rect width="440" height="142" rx="12" fill="#30251a" stroke="#ffbd78"></rect><text x="20" y="30" fill="#ffd09d" font-size="12" font-weight="800">4. COMMERÇANTS</text><text x="20" y="62" fill="#fff" font-size="22" font-weight="850">INTÉGRATION + MSC</text><text x="20" y="88" fill="#f4e8d8" font-size="13">POS, e-commerce, certification et assistance.</text><text x="20" y="111" fill="#f4e8d8" font-size="13">La commission sera plafonnée, son niveau reste inconnu.</text><text x="20" y="132" fill="#c9ab89" font-size="11">Les petits et grands commerçants partent de tarifs différents.</text></g>
<g transform="translate(20 742)"><rect width="440" height="142" rx="12" fill="#321d22" stroke="#ff8498"></rect><text x="20" y="30" fill="#ffa6b5" font-size="12" font-weight="800">5. COÛT COLLECTIF</text><text x="20" y="62" fill="#fff" font-size="22" font-weight="850">SEIGNEURIAGE ET OPPORTUNITÉ</text><text x="20" y="88" fill="#f2e2e5" font-size="13">Le coût réduit ou mobilise le revenu de banque centrale.</text><text x="20" y="111" fill="#f2e2e5" font-size="13">L'effet final dépend du bilan, des taux et de l'adoption.</text><text x="20" y="132" fill="#cca0a8" font-size="11">Le coût peut transiter par le revenu monétaire.</text></g>
<rect x="20" y="906" width="440" height="56" rx="10" fill="#0f1822" stroke="#ff8498"></rect>
<text x="40" y="930" fill="#ff9aac" font-size="12" font-weight="800">VERDICT</text>
<text x="40" y="950" fill="#edf3f8" font-size="13">Aucun coût total de possession n'est publié au 14 août 2026.</text>
<text x="24" y="980" fill="#75899d" font-size="10.5">Sources : BCE, Commission, PwC, ECA. Synthèse l0g.</text>
</svg>
