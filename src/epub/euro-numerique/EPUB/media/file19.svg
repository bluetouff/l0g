<svg viewBox="0 0 480 970" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="a6-values-fr-t a6-values-fr-d" style="font-family:system-ui,sans-serif;background:#0a111a"><title id="a6-values-fr-t">Valeurs estimées et plafonds des marchés externes</title><desc id="a6-values-fr-d">Les barres comparent la valeur estimée et le maximum contractuel pour cinq composants et le marché réseau.</desc><defs><linearGradient id="a6-values-fr-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a111a"></stop><stop offset="1" stop-color="#14263a"></stop></linearGradient></defs><rect x="1" y="1" width="478" height="968" rx="15" fill="url(#a6-values-fr-bg)" stroke="#304459"></rect><text x="24" y="39" fill="#f4f7fb" font-size="20" font-weight="800">VALEURS DES MARCHÉS</text><text x="24" y="65" fill="#9fb1c5" font-size="12">Valeurs estimées et maxima contractuels</text><g transform="translate(24 102)"><text x="0" y="0" fill="#eef4f8" font-size="12" font-weight="750">Alias</text><rect x="0" y="15" width="12" height="13" rx="3" fill="#68d9c8"></rect><rect x="0" y="34" width="25" height="13" rx="3" fill="#ffbd78"></rect><text x="280" y="27" fill="#8ce8db" font-size="11">27,9 M€</text><text x="355" y="46" fill="#ffd09d" font-size="11">55,8 M€</text></g><g transform="translate(24 200)"><text x="0" y="0" fill="#eef4f8" font-size="12" font-weight="750">Fraude</text><rect x="0" y="15" width="36" height="13" rx="3" fill="#68d9c8"></rect><rect x="0" y="34" width="108" height="13" rx="3" fill="#ffbd78"></rect><text x="280" y="27" fill="#8ce8db" font-size="11">79,1 M€</text><text x="355" y="46" fill="#ffd09d" font-size="11">237,3 M€</text></g><g transform="translate(24 298)"><text x="0" y="0" fill="#eef4f8" font-size="12" font-weight="750">App + SDK</text><rect x="0" y="15" width="35" height="13" rx="3" fill="#68d9c8"></rect><rect x="0" y="34" width="70" height="13" rx="3" fill="#ffbd78"></rect><text x="280" y="27" fill="#8ce8db" font-size="11">76,8 M€</text><text x="355" y="46" fill="#ffd09d" font-size="11">153,6 M€</text></g><g transform="translate(24 396)"><text x="0" y="0" fill="#eef4f8" font-size="12" font-weight="750">Offline</text><rect x="0" y="15" width="100" height="13" rx="3" fill="#68d9c8"></rect><rect x="0" y="34" width="300" height="13" rx="3" fill="#ffbd78"></rect><text x="280" y="27" fill="#8ce8db" font-size="11">220,7 M€</text><text x="355" y="46" fill="#ffd09d" font-size="11">662,1 M€</text></g><g transform="translate(24 494)"><text x="0" y="0" fill="#eef4f8" font-size="12" font-weight="750">SEPI</text><rect x="0" y="15" width="12" height="13" rx="3" fill="#68d9c8"></rect><rect x="0" y="34" width="25" height="13" rx="3" fill="#ffbd78"></rect><text x="280" y="27" fill="#8ce8db" font-size="11">27,6 M€</text><text x="355" y="46" fill="#ffd09d" font-size="11">55,2 M€</text></g><g transform="translate(24 592)"><text x="0" y="0" fill="#eef4f8" font-size="12" font-weight="750">Connectivité, 2 lots</text><rect x="0" y="15" width="74" height="13" rx="3" fill="#68d9c8"></rect><rect x="0" y="34" width="161" height="13" rx="3" fill="#ffbd78"></rect><text x="280" y="27" fill="#8ce8db" font-size="11">162,84 M€</text><text x="355" y="46" fill="#ffd09d" font-size="11">355,32 M€</text></g><g transform="translate(20 700)"><rect width="440" height="110" rx="12" fill="#172337" stroke="#8facff"></rect><text x="20" y="30" fill="#a7c0ff" font-size="12" font-weight="800">CINQ COMPOSANTS ATTRIBUÉS</text><text x="20" y="64" fill="#fff" font-size="21" font-weight="850">432,1 M€ estimés</text><text x="238" y="64" fill="#ffbd78" font-size="21" font-weight="850">1,164 Md€ plafond</text><text x="20" y="91" fill="#9fb1c5" font-size="11">Développement, maintenance, exploitation et options peuvent se chevaucher.</text></g><g transform="translate(20 828)"><rect width="440" height="94" rx="12" fill="#321d22" stroke="#ff8498"></rect><text x="20" y="29" fill="#ffa6b5" font-size="12" font-weight="800">AVEC LA CONNECTIVITÉ</text><text x="20" y="60" fill="#fff" font-size="18" font-weight="850">594,94 M€ estimés · 1,51932 Md€ de plafonds</text><text x="20" y="82" fill="#cca0a8" font-size="11">Le marché réseau n'était pas attribué dans le corpus au 15 août 2026.</text></g><text x="24" y="950" fill="#ffbd78" font-size="12" font-weight="800">PLAFOND = COMMANDE MAXIMALE</text><text x="24" y="966" fill="#75899d" font-size="10">Sources : avis de marchés BCE. Calculs l0g.</text></svg>
