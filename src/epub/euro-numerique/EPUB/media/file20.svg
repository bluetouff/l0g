<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 480 1090" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="a6-off-fr-t a6-off-fr-d" style="font-family:system-ui,sans-serif;background:#0a111a"><title id="a6-off-fr-t">Chaîne de dépendance du paiement offline</title><desc id="a6-off-fr-d">Le paiement entre deux appareils peut être local, tandis que l'installation, le financement, les clés et la maintenance dépendent d'une chaîne de fournisseurs.</desc><defs><linearGradient id="a6-off-fr-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a111a"></stop><stop offset="1" stop-color="#14263a"></stop></linearGradient><marker id="a6-off-fr-arr" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#ffbd78"></path></marker></defs><rect x="1" y="1" width="478" height="1088" rx="15" fill="url(#a6-off-fr-bg)" stroke="#304459"></rect><text x="24" y="39" fill="#f4f7fb" font-size="20" font-weight="800">OFFLINE : TROIS TEMPS</text><text x="24" y="65" fill="#9fb1c5" font-size="12">Provisionnement, transaction et maintenance</text><g transform="translate(20 94)"><rect width="440" height="255" rx="13" fill="#30251a" stroke="#ffbd78"></rect><text x="20" y="29" fill="#ffd09d" font-size="12" font-weight="800">AVANT LE PAIEMENT</text><text x="20" y="62" fill="#fff" font-size="18" font-weight="850">Provisionner l'instrument</text><text x="20" y="95" fill="#f4e8d8" font-size="13">App store → OS → SDK → OEM → secure element</text><text x="20" y="121" fill="#f4e8d8" font-size="13">TSM / eSIM → PSP → HSM → service offline</text><path d="M60 165H380" stroke="#ffbd78" stroke-width="3" marker-end="url(#a6-off-fr-arr)"></path><g transform="translate(20 187)"><rect width="94" height="45" rx="9" fill="#21170f" stroke="#ffbd78"></rect><text x="47" y="20" text-anchor="middle" fill="#fff" font-size="11" font-weight="750">STORE / OS</text><text x="47" y="35" text-anchor="middle" fill="#cdb699" font-size="9.5">Apple, Google</text></g><g transform="translate(127 187)"><rect width="94" height="45" rx="9" fill="#21170f" stroke="#ffbd78"></rect><text x="47" y="20" text-anchor="middle" fill="#fff" font-size="11" font-weight="750">SECURE ELEMENT</text><text x="47" y="35" text-anchor="middle" fill="#cdb699" font-size="9.5">OEM, puce, eSIM</text></g><g transform="translate(234 187)"><rect width="78" height="45" rx="9" fill="#21170f" stroke="#ffbd78"></rect><text x="39" y="20" text-anchor="middle" fill="#fff" font-size="11" font-weight="750">PSP / HSM</text><text x="39" y="35" text-anchor="middle" fill="#cdb699" font-size="9.5">clés et compte</text></g><g transform="translate(325 187)"><rect width="95" height="45" rx="9" fill="#21170f" stroke="#ffbd78"></rect><text x="47.5" y="20" text-anchor="middle" fill="#fff" font-size="11" font-weight="750">OFFLINE</text><text x="47.5" y="35" text-anchor="middle" fill="#cdb699" font-size="9.5">G+D / secours</text></g></g><path d="M240 356V394" stroke="#68d9c8" stroke-width="3"></path><g transform="translate(20 410)"><rect width="440" height="245" rx="13" fill="#132b2c" stroke="#68d9c8" stroke-width="1.5"></rect><text x="20" y="29" fill="#8ce8db" font-size="12" font-weight="800">PENDANT LE PAIEMENT</text><text x="20" y="62" fill="#fff" font-size="18" font-weight="850">Deux appareils, transfert direct</text><g transform="translate(42 104)"><rect width="118" height="88" rx="14" fill="#0e1d1f" stroke="#68d9c8"></rect><text x="59" y="35" text-anchor="middle" fill="#fff" font-size="15" font-weight="800">APPAREIL A</text><text x="59" y="60" text-anchor="middle" fill="#a7f0e5" font-size="11">solde local</text></g><path d="M176 148H304" stroke="#68d9c8" stroke-width="4"></path><path d="M294 139L309 148L294 157" fill="none" stroke="#68d9c8" stroke-width="3"></path><text x="240" y="128" text-anchor="middle" fill="#a7f0e5" font-size="11" font-weight="750">P2P / POS</text><g transform="translate(320 104)"><rect width="78" height="88" rx="14" fill="#0e1d1f" stroke="#68d9c8"></rect><text x="39" y="35" text-anchor="middle" fill="#fff" font-size="15" font-weight="800">B</text><text x="39" y="60" text-anchor="middle" fill="#a7f0e5" font-size="11">solde local</text></g><text x="220" y="222" text-anchor="middle" fill="#dceae7" font-size="12.5">Aucun tiers n'intervient dans la transaction honnête.</text></g><path d="M240 662V700" stroke="#ff8498" stroke-width="3"></path><g transform="translate(20 716)"><rect width="440" height="260" rx="13" fill="#321d22" stroke="#ff8498"></rect><text x="20" y="29" fill="#ffa6b5" font-size="12" font-weight="800">APRÈS ET AUTOUR DU PAIEMENT</text><text x="20" y="62" fill="#fff" font-size="18" font-weight="850">Mettre à jour, révoquer, financer</text><text x="20" y="98" fill="#f2e2e5" font-size="13">• funding et defunding identifiés</text><text x="20" y="126" fill="#f2e2e5" font-size="13">• rotation des clés et applets</text><text x="20" y="154" fill="#f2e2e5" font-size="13">• appareil compromis et liste de révocation</text><text x="20" y="182" fill="#f2e2e5" font-size="13">• fin de support d'un OS ou d'un secure element</text><text x="20" y="210" fill="#f2e2e5" font-size="13">• migration vers un autre fournisseur</text><rect x="20" y="225" width="400" height="24" rx="7" fill="#211116" stroke="#ff8498"></rect><text x="220" y="242" text-anchor="middle" fill="#ffc3cd" font-size="10.8">L'usage proche du cash dépend d'une chaîne complexe.</text></g><rect x="20" y="996" width="440" height="57" rx="10" fill="#0f1822" stroke="#8facff"></rect><text x="38" y="1020" fill="#a7c0ff" font-size="12" font-weight="800">ARTICLE 33</text><text x="38" y="1041" fill="#edf3f8" font-size="12">Le droit vise un accès FRAND. Le prix, le délai et la parité restent à tester.</text><text x="24" y="1077" fill="#75899d" font-size="10">Sources : BCE, Commission européenne, mandat du Conseil. Synthèse l0g.</text></svg>
