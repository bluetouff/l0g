<?xml version='1.0' encoding='utf-8'?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 480 890" role="img" aria-labelledby="euro-banks-map-fr-title euro-banks-map-fr-desc" style="width:100%;height:auto;display:block;overflow:hidden;max-width:680px;margin:0 auto;background:#090b10;border:1px solid #252b36;border-radius:16px;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" xmlns="http://www.w3.org/2000/svg">
<ns0:title id="euro-banks-map-fr-title">Six banques et six relations documentées de nature différente</ns0:title>
<ns0:desc id="euro-banks-map-fr-desc">La carte distingue un client direct, des comptes français et suisses, un compte hérité, un compte Maxwell, une mission de conseil et un dossier de gouvernance.</ns0:desc>
<ns0:rect width="480" height="890" rx="16" fill="#090b10"/>
<ns0:text x="28" y="42" fill="#f4f6f8" font-size="19" font-weight="750">SIX BANQUES, DES PREUVES DISTINCTES</ns0:text>
<ns0:text x="28" y="68" fill="#9aa4b2" font-size="11.5">La présence dans un dossier ne suffit pas à les confondre</ns0:text>
<ns0:rect x="26" y="96" width="428" height="112" rx="12" fill="#2c1621" stroke="#ff4d87" stroke-width="1.5"/>
<ns0:text x="44" y="124" fill="#ff7aa8" font-size="13.5" font-weight="750">DEUTSCHE BANK</ns0:text>
<ns0:text x="44" y="153" fill="#f4f6f8" font-size="17" font-weight="720">Epstein, client direct</ns0:text>
<ns0:text x="44" y="179" fill="#b7bec9" font-size="11.5">Défaillances constatées par le régulateur de New York</ns0:text>
<ns0:rect x="26" y="224" width="428" height="112" rx="12" fill="#2b2315" stroke="#f5b13d" stroke-width="1.5"/>
<ns0:text x="44" y="252" fill="#ffd189" font-size="13.5" font-weight="750">HSBC</ns0:text>
<ns0:text x="44" y="279" fill="#f4f6f8" font-size="16" font-weight="720">Compte parisien fermé,</ns0:text>
<ns0:text x="44" y="298" fill="#f4f6f8" font-size="16" font-weight="720">comptes suisses cités</ns0:text>
<ns0:text x="44" y="320" fill="#b7bec9" font-size="11.5">La chronologie suisse reste incomplète</ns0:text>
<ns0:rect x="26" y="352" width="428" height="112" rx="12" fill="#14233a" stroke="#75a7ff" stroke-width="1.5"/>
<ns0:text x="44" y="380" fill="#9ec0ff" font-size="13.5" font-weight="750">BNP PARIBAS</ns0:text>
<ns0:text x="44" y="409" fill="#f4f6f8" font-size="17" font-weight="720">Compte de détail hérité de Fortis</ns0:text>
<ns0:text x="44" y="435" fill="#b7bec9" font-size="12.5">Fermé en 2018 pour des raisons de conformité</ns0:text>
<ns0:rect x="26" y="480" width="428" height="112" rx="12" fill="#172b28" stroke="#5eead4" stroke-width="1.5"/>
<ns0:text x="44" y="508" fill="#82f2e2" font-size="13.5" font-weight="750">UBS</ns0:text>
<ns0:text x="44" y="537" fill="#f4f6f8" font-size="16" font-weight="720">Carte Epstein, puis patrimoine Maxwell</ns0:text>
<ns0:text x="44" y="563" fill="#b7bec9" font-size="12.5">Deux titulaires et deux décisions différentes</ns0:text>
<ns0:rect x="26" y="608" width="428" height="112" rx="12" fill="#25203f" stroke="#9b8cff" stroke-width="1.5"/>
<ns0:text x="44" y="636" fill="#bdb4ff" font-size="13.5" font-weight="750">BARCLAYS</ns0:text>
<ns0:text x="44" y="665" fill="#f4f6f8" font-size="17" font-weight="720">Gouvernance Staley et compte Maxwell</ns0:text>
<ns0:text x="44" y="691" fill="#b7bec9" font-size="12.5">Aucun compte Epstein établi par ces pièces</ns0:text>
<ns0:rect x="26" y="736" width="428" height="126" rx="12" fill="#2a1f29" stroke="#e38bd2" stroke-width="1.5"/>
<ns0:text x="44" y="764" fill="#f0a9e4" font-size="13.5" font-weight="750">EDMOND DE ROTHSCHILD</ns0:text>
<ns0:text x="44" y="790" fill="#f4f6f8" font-size="16" font-weight="720">Southern Trust rémunérée</ns0:text>
<ns0:text x="44" y="809" fill="#f4f6f8" font-size="16" font-weight="720">comme prestataire</ns0:text>
<ns0:text x="44" y="832" fill="#b7bec9" font-size="11.5">Accord de 25 M$, paiements totalisant 24 999 980 $</ns0:text>
<ns0:text x="44" y="853" fill="#b7bec9" font-size="11.5">Ce n'est pas la preuve d'un compte Epstein</ns0:text>
</ns0:svg>
