<?xml version='1.0' encoding='utf-8'?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="sar-title-fr sar-desc-fr" style="width:100%;height:auto;display:block;background:#090b10;border:1px solid #252b36;border-radius:16px;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" xmlns="http://www.w3.org/2000/svg">
<ns0:title id="sar-title-fr">Les deux déclarations JPMorgan de 2019 se recouvrent dans le temps</ns0:title>
<ns0:desc id="sar-desc-fr">Les deux SAR commencent le 1er octobre 2003. Celui d’août finit en mai 2019 et celui de septembre en juillet 2019. Leurs montants ne constituent pas un total dédoublonné.</ns0:desc>
<ns0:rect width="720" height="470" rx="16" fill="#090b10"/>
<ns0:text x="36" y="45" fill="#f4f6f8" font-size="28" font-weight="750">UN MILLIARD, DEUX PÉRIMÈTRES</ns0:text>
<ns0:text x="36" y="76" fill="#9aa4b2" font-size="17">Même départ, fenêtres presque identiques, listes absentes</ns0:text>
<ns0:text x="36" y="130" fill="#75a7ff" font-size="18" font-weight="700">SAR DU 26 SEPTEMBRE 2019</ns0:text>
<ns0:rect x="36" y="146" width="648" height="82" rx="12" fill="#14233a" stroke="#75a7ff" stroke-width="2"/>
<ns0:text x="58" y="180" fill="#f4f6f8" font-size="26" font-weight="750">4 725 virements · 1 081 819 653 $</ns0:text>
<ns0:text x="58" y="208" fill="#b6c1ce" font-size="18">1 oct. 2003 → 22 juil. 2019</ns0:text>
<ns0:text x="36" y="273" fill="#f08bb4" font-size="18" font-weight="700">SAR DU 13 AOÛT 2019</ns0:text>
<ns0:rect x="36" y="289" width="612" height="82" rx="12" fill="#341927" stroke="#f08bb4" stroke-width="2"/>
<ns0:text x="58" y="323" fill="#f4f6f8" font-size="26" font-weight="750">469 virements · 200 979 535 $</ns0:text>
<ns0:text x="58" y="351" fill="#cdb8c1" font-size="18">1 oct. 2003 → 29 mai 2019</ns0:text>
<ns0:line x1="648" y1="289" x2="684" y2="228" stroke="#f08bb4" stroke-width="2" stroke-dasharray="5 6"/>
<ns0:rect x="36" y="401" width="648" height="44" rx="9" fill="#201a12" stroke="#d9a441"/>
<ns0:text x="360" y="429" text-anchor="middle" fill="#f0c66c" font-size="20" font-weight="750">1,2828 Md$ = SOMME BRUTE, PAS TOTAL UNIQUE</ns0:text>
</ns0:svg>
