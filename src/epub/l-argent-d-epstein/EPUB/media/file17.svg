<?xml version='1.0' encoding='utf-8'?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 480 790" role="img" aria-labelledby="barclays-chain-fr-title barclays-chain-fr-desc" style="width:100%;height:auto;display:block;max-width:680px;margin:0 auto;background:#090b10;border:1px solid #252b36;border-radius:16px;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" xmlns="http://www.w3.org/2000/svg">
<ns0:title id="barclays-chain-fr-title">La chaîne de vérification de la lettre Barclays à la FCA en 2019</ns0:title>
<ns0:desc id="barclays-chain-fr-desc">Frise verticale allant de la question de la FCA en août 2019 à l’arrivée de documents de JPMorgan en novembre, puis à la décision finale de 2025.</ns0:desc>
<ns0:rect width="480" height="790" rx="16" fill="#090b10"/>
<ns0:text x="28" y="42" fill="#f4f6f8" font-size="21" font-weight="750">L’ASSURANCE DE 2019</ns0:text>
<ns0:text x="28" y="68" fill="#9aa4b2" font-size="13.5">Une chaîne dépendante du récit de son dirigeant</ns0:text>
<ns0:line x1="72" y1="110" x2="72" y2="704" stroke="#394252" stroke-width="4"/>
<ns0:circle cx="72" cy="130" r="11" fill="#75a7ff"/>
<ns0:text x="104" y="125" fill="#9ec0ff" font-size="13.5" font-weight="750">15 AOÛT 2019</ns0:text>
<ns0:text x="104" y="151" fill="#f4f6f8" font-size="16" font-weight="700">La FCA interroge le conseil</ns0:text>
<ns0:text x="104" y="174" fill="#b7bec9" font-size="11.5">Barclays doit dire comment elle s’est informée.</ns0:text>
<ns0:circle cx="72" cy="252" r="11" fill="#9b8cff"/>
<ns0:text x="104" y="247" fill="#bdb4ff" font-size="13.5" font-weight="750">ÉTÉ ET OCTOBRE</ns0:text>
<ns0:text x="104" y="273" fill="#f4f6f8" font-size="16" font-weight="700">Entretiens et revue des registres</ns0:text>
<ns0:text x="104" y="296" fill="#b7bec9" font-size="11.5">Le conseil n’obtient pas le tableau complet.</ns0:text>
<ns0:circle cx="72" cy="374" r="11" fill="#f5b13d"/>
<ns0:text x="104" y="369" fill="#ffd189" font-size="13.5" font-weight="750">6 ET 7 OCTOBRE</ns0:text>
<ns0:text x="104" y="395" fill="#f4f6f8" font-size="16" font-weight="700">Staley vérifie puis approuve</ns0:text>
<ns0:text x="104" y="418" fill="#b7bec9" font-size="11">Il est chargé de confirmer l’exactitude du texte.</ns0:text>
<ns0:circle cx="72" cy="496" r="11" fill="#5eead4"/>
<ns0:text x="104" y="491" fill="#82f2e2" font-size="13.5" font-weight="750">8 OCTOBRE</ns0:text>
<ns0:text x="104" y="517" fill="#f4f6f8" font-size="16" font-weight="700">Nigel Higgins envoie la lettre</ns0:text>
<ns0:text x="104" y="540" fill="#b7bec9" font-size="11.5">Deux affirmations seront jugées trompeuses.</ns0:text>
<ns0:circle cx="72" cy="618" r="11" fill="#ff4d87"/>
<ns0:text x="104" y="613" fill="#ff7aa8" font-size="13.5" font-weight="750">NOVEMBRE ET DÉCEMBRE</ns0:text>
<ns0:text x="104" y="639" fill="#f4f6f8" font-size="16" font-weight="700">JPMorgan signale des documents</ns0:text>
<ns0:text x="104" y="662" fill="#b7bec9" font-size="11.5">La FCA obtient les courriels et enquête.</ns0:text>
<ns0:circle cx="72" cy="728" r="11" fill="#f4f6f8"/>
<ns0:text x="104" y="723" fill="#f4f6f8" font-size="13.5" font-weight="750">2025</ns0:text>
<ns0:text x="104" y="749" fill="#f4f6f8" font-size="16" font-weight="700">Sanction finale et interdiction</ns0:text>
<ns0:text x="104" y="772" fill="#b7bec9" font-size="11.5">Le recours de Staley échoue sur le fond.</ns0:text>
</ns0:svg>
