<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" aria-labelledby="property-title-fr property-desc-fr" style="width:100%;height:auto;display:block;background:#0b1120;border:1px solid #26324a;border-radius:16px;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" xmlns="http://www.w3.org/2000/svg">
<ns0:title id="property-title-fr">Les ventes immobilières publiques de la succession Epstein</ns0:title>
<ns0:desc id="property-desc-fr">Cinq cartes comparent valeurs déclarées en 2019 et prix de vente publics. Le prix de Zorro Ranch reste inconnu.</ns0:desc>
<ns0:style>.mobile{display:none}@media (max-width:640px){.desktop{display:none}.mobile{display:block}}</ns0:style>
<ns0:g class="desktop">
<ns0:rect width="760" height="560" rx="16" fill="#0b1120"/>
<ns0:text x="38" y="52" fill="#f7f9fc" font-size="26" font-weight="760">DE LA PIERRE À LA CAISSE</ns0:text>
<ns0:text x="38" y="81" fill="#99a7bb" font-size="15">Prix bruts publics. Zorro reste hors du sous-total de vente.</ns0:text>
