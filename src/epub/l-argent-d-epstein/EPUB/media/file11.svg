<ns0:text x="18" y="31" fill="#78d0c1" font-size="13" font-weight="740">LITTLE + GREAT ST. JAMES · 2023</ns0:text>
<ns0:text x="18" y="73" fill="#ffffff" font-size="29" font-weight="780">≈ 60,0 M$</ns0:text>
<ns0:text x="18" y="101" fill="#a8c8c4" font-size="13">valeur 2019 : 86,37 M$</ns0:text>
