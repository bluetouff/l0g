<ns0:text x="18" y="97" fill="#aeb9c9" font-size="13">valeur 2019 : 12,38 M$</ns0:text>
<ns0:text x="18" y="116" fill="#71c7a4" font-size="12">prix rapporté</ns0:text>
</ns0:g>
