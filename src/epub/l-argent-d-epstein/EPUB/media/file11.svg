<ns0:text x="18" y="31" fill="#efa0b1" font-size="13" font-weight="740">ZORRO RANCH · 2023</ns0:text>
<ns0:text x="18" y="73" fill="#ffffff" font-size="29" font-weight="780">PRIX INCONNU</ns0:text>
<ns0:text x="18" y="101" fill="#d3adb7" font-size="13">valeur 2019 : 17,25 M$</ns0:text>
<ns0:text x="18" y="121" fill="#efa0b1" font-size="12">aucune disclosure publique identifiée</ns0:text>
</ns0:g>
<ns0:rect x="38" y="430" width="684" height="82" rx="12" fill="#201d16" stroke="#8c6b2e"/>
<ns0:text x="60" y="460" fill="#f0c36a" font-size="14" font-weight="740">SOUS-TOTAL PUBLIC CONNU</ns0:text>
