<ns0:text x="420" y="474" fill="#b9aa88" font-size="13">brut ≠ cash conservé</ns0:text>
<ns0:text x="420" y="495" fill="#b9aa88" font-size="13">vente ≠ nouvelle richesse</ns0:text>
<ns0:text x="38" y="539" fill="#74839a" font-size="12">Sources : pétition probate, comptes de la succession, USVI DOJ, Forbes.</ns0:text>
