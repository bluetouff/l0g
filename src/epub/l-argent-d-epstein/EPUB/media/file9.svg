<?xml version='1.0' encoding='utf-8'?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 480 760" role="img" aria-labelledby="valar-title-fr valar-desc-fr" style="width:100%;max-width:480px;height:auto;display:block;margin:0 auto;background:#0c111b;border:1px solid #253047;border-radius:14px;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" xmlns="http://www.w3.org/2000/svg">
<ns0:title id="valar-title-fr">Les engagements, apports et valeurs Valar</ns0:title>
<ns0:desc id="valar-desc-fr">Deux fonds et quatre dates successives montrent pourquoi les valeurs Valar ne doivent pas être additionnées.</ns0:desc>
<ns0:rect width="480" height="760" rx="14" fill="#0c111b"/>
<ns0:text x="24" y="42" fill="#f6f8fb" font-size="18" font-weight="760">VALAR : MÊME CAPITAL, PLUSIEURS ÉTATS</ns0:text>
<ns0:text x="24" y="66" fill="#9ca9bb" font-size="11">Engagement, apport et valeur restent des mesures distinctes.</ns0:text>
<ns0:rect x="24" y="94" width="432" height="104" rx="10" fill="#17243b" stroke="#5f8ff3"/>
<ns0:text x="42" y="123" fill="#7da4f7" font-size="13" font-weight="750">FUND II</ns0:text>
<ns0:text x="42" y="157" fill="#ffffff" font-size="25" font-weight="780">15 M$ engagés</ns0:text>
<ns0:text x="42" y="181" fill="#c2cbd7" font-size="14">14,55 M$ versés ; compte LP : 21 000 471 $</ns0:text>
<ns0:rect x="24" y="214" width="432" height="104" rx="10" fill="#17243b" stroke="#b58af1"/>
<ns0:text x="42" y="243" fill="#c3a4f5" font-size="13" font-weight="750">FUND III</ns0:text>
<ns0:text x="42" y="277" fill="#ffffff" font-size="25" font-weight="780">25 M$ engagés</ns0:text>
<ns0:text x="42" y="301" fill="#c2cbd7" font-size="14">21 M$ versés ; compte LP : 33 345 270 $</ns0:text>
<ns0:text x="24" y="352" fill="#9ca9bb" font-size="13" font-weight="750">ÉTATS SUCCESSIFS DES MÊMES INTÉRÊTS</ns0:text>
<ns0:rect x="24" y="370" width="432" height="70" rx="9" fill="#142b31"/>
<ns0:text x="42" y="398" fill="#67c2c7" font-size="12" font-weight="750">30 JUIN 2018 · CAPITAL VERSÉ</ns0:text>
<ns0:text x="42" y="425" fill="#ffffff" font-size="23" font-weight="780">35,55 M$</ns0:text>
<ns0:rect x="24" y="452" width="432" height="70" rx="9" fill="#17243b"/>
<ns0:text x="42" y="480" fill="#c2cbd7" font-size="12" font-weight="750">30 JUIN 2018 · COMPTES LP</ns0:text>
<ns0:text x="42" y="507" fill="#ffffff" font-size="23" font-weight="780">54,346 M$</ns0:text>
<ns0:rect x="24" y="534" width="432" height="70" rx="9" fill="#231f17"/>
<ns0:text x="42" y="562" fill="#f0c36a" font-size="12" font-weight="750">31 DÉC. 2018 · ESTIMATION NON AUDITÉE</ns0:text>
<ns0:text x="42" y="589" fill="#ffffff" font-size="23" font-weight="780">90,44 M$</ns0:text>
<ns0:rect x="24" y="616" width="432" height="70" rx="9" fill="#321b22"/>
<ns0:text x="42" y="644" fill="#ffbdca" font-size="12" font-weight="750">MARS 2026 · TÉMOIGNAGE ORAL, NON RÉALISÉ</ns0:text>
<ns0:text x="42" y="671" fill="#ffffff" font-size="23" font-weight="780">≈ 172 M$</ns0:text>
<ns0:text x="240" y="724" text-anchor="middle" fill="#f0c36a" font-size="12" font-weight="700">NE PAS LES ADDITIONNER</ns0:text>
</ns0:svg>
