<?xml version='1.0' encoding='utf-8'?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 480 820" role="img" aria-labelledby="ledger-title-fr ledger-desc-fr" style="display:block;width:100%;height:auto;max-width:720px;margin:0 auto;background:#0c0d10;border:1px solid rgba(255,255,255,0.10);border-radius:12px;font-family:ui-monospace,monospace" xmlns="http://www.w3.org/2000/svg">
<ns0:title id="ledger-title-fr">Quatre chiffres publics, quatre périmètres différents</ns0:title>
<ns0:desc id="ledger-desc-fr">Quatre cartes verticales distinguent le salaire Bear Stearns, l'allégation Wexner, les honoraires Financial Trust et les honoraires Southern Trust. Ces nombres ne doivent pas être additionnés.</ns0:desc>
<ns0:text x="24" y="40" fill="#f5f6f8" font-size="20" font-weight="700">UNE FORTUNE, PAS DE</ns0:text>
<ns0:text x="24" y="64" fill="#f5f6f8" font-size="20" font-weight="700">GRAND LIVRE CONTINU</ns0:text>
<ns0:text x="24" y="94" fill="#a8adb7" font-size="12">Des objets comptables différents, parfois contemporains.</ns0:text>
<ns0:line x1="48" y1="148" x2="48" y2="564" stroke="#313641" stroke-width="2"/>
<ns0:circle cx="48" cy="148" r="8" fill="#7aa2f7"/>
<ns0:rect x="80" y="130" width="376" height="116" rx="10" fill="#151820" stroke="#7aa2f7" stroke-opacity="0.65"/>
<ns0:text x="102" y="158" fill="#7aa2f7" font-size="13" font-weight="700">1976-1981 · EMPLOI</ns0:text>
<ns0:text x="102" y="190" fill="#f5f6f8" font-size="26" font-weight="700">42 000 $</ns0:text>
<ns0:text x="102" y="214" fill="#d6d9df" font-size="13">salaire annuel documenté en avril 1979</ns0:text>
<ns0:text x="102" y="234" fill="#8b909b" font-size="11">Source : dossier du personnel</ns0:text>
<ns0:circle cx="48" cy="286" r="8" fill="#ff4d87"/>
<ns0:rect x="80" y="268" width="376" height="116" rx="10" fill="#151820" stroke="#ff4d87" stroke-opacity="0.65"/>
<ns0:text x="102" y="296" fill="#ff4d87" font-size="13" font-weight="700">1991-2007 · WEXNER</ns0:text>
<ns0:text x="102" y="328" fill="#f5f6f8" font-size="18" font-weight="700">« plusieurs centaines de M$ »</ns0:text>
<ns0:text x="102" y="352" fill="#d6d9df" font-size="13">détournement allégué ; 100 M$ restitués</ns0:text>
<ns0:text x="102" y="372" fill="#8b909b" font-size="11">Proffer des avocats, pas jugement</ns0:text>
<ns0:circle cx="48" cy="424" r="8" fill="#f5b13d"/>
<ns0:rect x="80" y="406" width="376" height="116" rx="10" fill="#151820" stroke="#f5b13d" stroke-opacity="0.65"/>
<ns0:text x="102" y="434" fill="#f5b13d" font-size="13" font-weight="700">2000-2006 · FINANCIAL TRUST</ns0:text>
<ns0:text x="102" y="466" fill="#f5f6f8" font-size="26" font-weight="700">≈ 300 M$</ns0:text>
<ns0:text x="102" y="490" fill="#d6d9df" font-size="12">honoraires agrégés, sans ventilation client</ns0:text>
<ns0:text x="102" y="510" fill="#8b909b" font-size="11">États financiers disponibles</ns0:text>
<ns0:circle cx="48" cy="562" r="8" fill="#5eead4"/>
<ns0:rect x="80" y="544" width="376" height="116" rx="10" fill="#151820" stroke="#5eead4" stroke-opacity="0.65"/>
<ns0:text x="102" y="572" fill="#5eead4" font-size="13" font-weight="700">2013-2017 · SOUTHERN TRUST</ns0:text>
<ns0:text x="102" y="604" fill="#f5f6f8" font-size="23" font-weight="700">183 999 980 $</ns0:text>
<ns0:text x="102" y="628" fill="#d6d9df" font-size="11.5">honoraires exacts, trois sources réconciliées</ns0:text>
<ns0:text x="102" y="648" fill="#8b909b" font-size="11">Contrats, factures et virements</ns0:text>
<ns0:rect x="24" y="704" width="432" height="92" rx="10" fill="#11141a" stroke="#313641"/>
<ns0:text x="46" y="734" fill="#f58b57" font-size="13" font-weight="700">RÈGLE DE LECTURE</ns0:text>
<ns0:text x="46" y="760" fill="#d6d9df" font-size="13">Salaire, allégation et honoraires ne sont pas</ns0:text>
<ns0:text x="46" y="780" fill="#d6d9df" font-size="13">des éléments à additionner en un patrimoine.</ns0:text>
</ns0:svg>
