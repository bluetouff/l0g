<?xml version='1.0' encoding='utf-8'?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 480 720" role="img" aria-labelledby="st-title-fr st-desc-fr" style="display:block;width:100%;height:auto;max-width:720px;margin:0 auto;background:#0c0d10;border:1px solid rgba(255,255,255,0.10);border-radius:12px;font-family:ui-monospace,monospace" xmlns="http://www.w3.org/2000/svg">
<ns0:title id="st-title-fr">Réconciliation des honoraires de Southern Trust, 2013 à 2017</ns0:title>
<ns0:desc id="st-desc-fr">Barres annuelles verticalement empilées montrant 158 millions de dollars de Leon Black, 24 999 980 dollars d'Edmond de Rothschild et un million de Steven Sinofsky, pour un total exact de 183 999 980 dollars.</ns0:desc>
<ns0:text x="24" y="40" fill="#f5f6f8" font-size="19" font-weight="700">SOUTHERN TRUST</ns0:text>
<ns0:text x="24" y="64" fill="#f5f6f8" font-size="19" font-weight="700">183 999 980 $ RÉCONCILIÉS</ns0:text>
<ns0:text x="24" y="92" fill="#a8adb7" font-size="12">Honoraires comptabilisés, barres ramenées à 70 M$.</ns0:text>
<ns0:rect x="24" y="114" width="432" height="94" rx="10" fill="#11141a" stroke="#313641"/>
<ns0:circle cx="46" cy="140" r="6" fill="#ff4d87"/>
<ns0:text x="62" y="145" fill="#d6d9df" font-size="13">Leon Black · 158 M$</ns0:text>
<ns0:circle cx="46" cy="166" r="6" fill="#f5b13d"/>
<ns0:text x="62" y="171" fill="#d6d9df" font-size="13">Edmond de Rothschild · 24 999 980 $</ns0:text>
<ns0:circle cx="46" cy="192" r="6" fill="#5eead4"/>
<ns0:text x="62" y="197" fill="#d6d9df" font-size="13">Steven Sinofsky · 1 M$</ns0:text>
<ns0:text x="28" y="248" fill="#f5f6f8" font-size="14" font-weight="700">2013</ns0:text>
<ns0:rect x="100" y="228" width="340" height="30" rx="5" fill="#171a21"/>
<ns0:rect x="100" y="228" width="247.7" height="30" rx="5" fill="#ff4d87"/>
<ns0:rect x="347.7" y="228" width="4.9" height="30" rx="2" fill="#5eead4"/>
<ns0:text x="114" y="248" fill="#f5f6f8" font-size="13" font-weight="700">51 M$</ns0:text>
<ns0:text x="28" y="318" fill="#f5f6f8" font-size="14" font-weight="700">2014</ns0:text>
<ns0:rect x="100" y="298" width="340" height="30" rx="5" fill="#171a21"/>
<ns0:rect x="100" y="298" width="340" height="30" rx="5" fill="#ff4d87"/>
<ns0:text x="114" y="318" fill="#f5f6f8" font-size="13" font-weight="700">70 M$</ns0:text>
<ns0:text x="28" y="388" fill="#f5f6f8" font-size="14" font-weight="700">2015</ns0:text>
<ns0:rect x="100" y="368" width="340" height="30" rx="5" fill="#171a21"/>
<ns0:rect x="100" y="368" width="145.7" height="30" rx="5" fill="#ff4d87"/>
<ns0:rect x="245.7" y="368" width="121.4" height="30" rx="2" fill="#f5b13d"/>
<ns0:text x="114" y="388" fill="#f5f6f8" font-size="13" font-weight="700">54 999 980 $</ns0:text>
<ns0:text x="28" y="458" fill="#f5f6f8" font-size="14" font-weight="700">2016</ns0:text>
<ns0:rect x="100" y="438" width="340" height="30" rx="5" fill="#171a21" stroke="#313641" stroke-dasharray="4 4"/>
<ns0:text x="114" y="458" fill="#8b909b" font-size="13">0 $ d’honoraires</ns0:text>
<ns0:text x="28" y="528" fill="#f5f6f8" font-size="14" font-weight="700">2017</ns0:text>
<ns0:rect x="100" y="508" width="340" height="30" rx="5" fill="#171a21"/>
<ns0:rect x="100" y="508" width="38.9" height="30" rx="5" fill="#ff4d87"/>
<ns0:text x="154" y="528" fill="#f5f6f8" font-size="13" font-weight="700">8 M$</ns0:text>
<ns0:rect x="24" y="578" width="432" height="112" rx="10" fill="#11141a" stroke="#313641"/>
<ns0:text x="46" y="608" fill="#f58b57" font-size="13" font-weight="700">TOTAL DES HONORAIRES</ns0:text>
<ns0:text x="46" y="638" fill="#d6d9df" font-size="14">158 M$ + 24 999 980 $ + 1 M$</ns0:text>
<ns0:text x="46" y="670" fill="#f5f6f8" font-size="21" font-weight="700">= 183 999 980 $</ns0:text>
</ns0:svg>
