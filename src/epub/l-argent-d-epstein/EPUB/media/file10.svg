<?xml version='1.0' encoding='utf-8'?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 760 540" role="img" aria-labelledby="estate-time-title-fr estate-time-desc-fr" style="width:100%;height:auto;display:block;background:#0b1120;border:1px solid #26324a;border-radius:16px;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" xmlns="http://www.w3.org/2000/svg">
<ns0:title id="estate-time-title-fr">Quatre photographies comptables de la succession Epstein</ns0:title>
<ns0:desc id="estate-time-desc-fr">Une ligne du temps montre 577,7 millions en 2019, 83,9 millions fin 2023, 145,1 millions en septembre 2024 après le remboursement fiscal et 107,6 millions fin juin 2026.</ns0:desc>
<ns0:style>.mobile{display:none}@media (max-width:640px){.desktop{display:none}.mobile{display:block}}</ns0:style>
<ns0:g class="desktop">
<ns0:rect width="760" height="540" rx="16" fill="#0b1120"/>
<ns0:text x="38" y="52" fill="#f7f9fc" font-size="26" font-weight="760">LA FORTUNE CHANGE D’ÉTAT</ns0:text>
<ns0:text x="38" y="82" fill="#99a7bb" font-size="13.5">Quatre arrêtés, quatre périmètres datés. La ligne ne mesure pas un rendement.</ns0:text>
<ns0:line x1="86" y1="290" x2="676" y2="290" stroke="#34425c" stroke-width="4"/>
