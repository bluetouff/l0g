<ns0:text x="52" y="151" fill="#8eb0ff" font-size="13" font-weight="750">15 AOÛT 2019</ns0:text>
<ns0:text x="52" y="190" fill="#ffffff" font-size="30" font-weight="780">577,7 M$</ns0:text>
<ns0:text x="52" y="216" fill="#b8c3d2" font-size="14">inventaire brut estimatif</ns0:text>
<ns0:rect x="184" y="406" width="196" height="94" rx="12" fill="#142d30" stroke="#3e9489"/>
<ns0:text x="202" y="435" fill="#77d2c3" font-size="13" font-weight="750">31 DÉC. 2023</ns0:text>
<ns0:text x="202" y="472" fill="#ffffff" font-size="28" font-weight="780">83,9 M$</ns0:text>
<ns0:text x="202" y="492" fill="#a8c8c4" font-size="13">après USVI et EVCP</ns0:text>
<ns0:rect x="388" y="104" width="186" height="116" rx="12" fill="#302817" stroke="#b98829"/>
<ns0:text x="406" y="133" fill="#f2c66c" font-size="13" font-weight="750">30 SEPT. 2024</ns0:text>
<ns0:text x="406" y="172" fill="#ffffff" font-size="29" font-weight="780">145,1 M$</ns0:text>
<ns0:text x="406" y="198" fill="#d9c79d" font-size="13">après le rebond fiscal</ns0:text>
<ns0:rect x="548" y="300" width="178" height="116" rx="12" fill="#321d27" stroke="#b85870"/>
<ns0:text x="566" y="329" fill="#f0a0b1" font-size="13" font-weight="750">30 JUIN 2026</ns0:text>
<ns0:text x="566" y="368" fill="#ffffff" font-size="29" font-weight="780">107,6 M$</ns0:text>
<ns0:text x="566" y="394" fill="#d8b2bc" font-size="13">actif brut déclaré</ns0:text>
<ns0:rect x="38" y="462" width="122" height="40" rx="9" fill="#251d13" stroke="#8b6a2d"/>
<ns0:text x="99" y="487" text-anchor="middle" fill="#f0c36a" font-size="13" font-weight="720">STOCKS DATÉS</ns0:text>
<ns0:text x="398" y="516" text-anchor="middle" fill="#76859a" font-size="12">Source : pétition probate et comptes trimestriels 17, 20 et 27.</ns0:text>
