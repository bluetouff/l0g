<ns0:circle cx="30" cy="150" r="7" fill="#efbe62"/><ns0:text x="49" y="154" fill="#f2c66c" font-size="12" font-weight="740">30 SEPT. 2024</ns0:text><ns0:text x="330" y="155" text-anchor="end" fill="#ffffff" font-size="21" font-weight="780">145,1 M$</ns0:text>
<ns0:circle cx="30" cy="189" r="7" fill="#e5879a"/><ns0:text x="49" y="193" fill="#f0a0b1" font-size="12" font-weight="740">30 JUIN 2026</ns0:text><ns0:text x="330" y="194" text-anchor="end" fill="#ffffff" font-size="21" font-weight="780">107,6 M$</ns0:text>
<ns0:text x="20" y="229" fill="#f0c36a" font-size="11" font-weight="720">STOCKS PUBLIÉS</ns0:text>
<ns0:text x="20" y="244" fill="#76859a" font-size="10">Source : pétition probate, comptes 17, 20 et 27.</ns0:text>
