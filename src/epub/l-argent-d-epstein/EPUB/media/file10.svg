<ns0:text x="20" y="27" fill="#f7f9fc" font-size="15" font-weight="760">QUATRE ARRÊTÉS, PAS UN RENDEMENT</ns0:text>
<ns0:text x="20" y="43" fill="#99a7bb" font-size="10">Les montants sont des stocks datés.</ns0:text>
<ns0:text x="20" y="56" fill="#99a7bb" font-size="10">La ligne ne mesure pas un rendement.</ns0:text>
