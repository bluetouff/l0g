<ns0:circle cx="282" cy="382" r="12" fill="#6fc5b7" stroke="#dcfff8" stroke-width="3"/>
<ns0:circle cx="474" cy="162" r="12" fill="#efbe62" stroke="#fff1c8" stroke-width="3"/>
<ns0:circle cx="676" cy="250" r="12" fill="#e5879a" stroke="#ffe1e8" stroke-width="3"/>
