<?xml version='1.0' encoding='utf-8'?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 760 620" role="img" aria-labelledby="closing-title-fr closing-desc-fr" style="width:100%;height:auto;display:block;background:#0b1120;border:1px solid #26324a;border-radius:16px;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" xmlns="http://www.w3.org/2000/svg">
<ns0:title id="closing-title-fr">Actif brut, passifs connus et priorité du 1953 Trust</ns0:title>
<ns0:desc id="closing-desc-fr">Le bilan de 107,6 millions est décomposé, puis comparé à 27 millions de passifs chiffrés et aux premiers legs prioritaires de 175 millions.</ns0:desc>
<ns0:style>.mobile{display:none}@media (max-width:640px){.desktop{display:none}.mobile{display:block}}</ns0:style>
<ns0:g class="desktop">
<ns0:rect width="760" height="620" rx="16" fill="#0b1120"/>
<ns0:text x="38" y="52" fill="#f7f9fc" font-size="26" font-weight="760">107,6 M$ : UN ACTIF BRUT, PAS UN HÉRITAGE</ns0:text>
<ns0:text x="38" y="81" fill="#99a7bb" font-size="15">Arrêté au 30 juin 2026. Taxes et autres claims restent non chiffrés.</ns0:text>
<ns0:rect x="38" y="112" width="430" height="252" rx="14" fill="#141f33" stroke="#405678"/>
<ns0:text x="60" y="143" fill="#8fa8cf" font-size="13" font-weight="750">ACTIF PUBLIÉ</ns0:text>
<ns0:rect x="60" y="164" width="364" height="64" rx="9" fill="#24426b"/>
<ns0:text x="78" y="190" fill="#b9d0fb" font-size="12">ENTITÉS DÉTENUES</ns0:text>
<ns0:text x="405" y="207" text-anchor="end" fill="#ffffff" font-size="23" font-weight="770">78,50 M$</ns0:text>
<ns0:rect x="60" y="240" width="119" height="82" rx="9" fill="#1b5a58"/>
<ns0:text x="76" y="266" fill="#9de3d8" font-size="11">CASH</ns0:text>
<ns0:text x="76" y="300" fill="#ffffff" font-size="21" font-weight="760">25,70</ns0:text>
<ns0:text x="76" y="316" fill="#9de3d8" font-size="11">M$</ns0:text>
<ns0:rect x="191" y="240" width="112" height="82" rx="9" fill="#493b1d"/>
<ns0:text x="207" y="266" fill="#efd387" font-size="11">PRÊTS</ns0:text>
<ns0:text x="207" y="300" fill="#ffffff" font-size="21" font-weight="760">3,43</ns0:text>
<ns0:text x="207" y="316" fill="#efd387" font-size="11">M$</ns0:text>
<ns0:rect x="315" y="240" width="109" height="82" rx="9" fill="#3a2530"/>
<ns0:text x="331" y="266" fill="#e9a6b6" font-size="11">BIJOUX</ns0:text>
<ns0:text x="331" y="299" fill="#ffffff" font-size="18" font-weight="760">4 055 $</ns0:text>
<ns0:text x="60" y="347" fill="#76869b" font-size="11">Somme des lignes : total publié + 0,01 $</ns0:text>
<ns0:rect x="494" y="112" width="228" height="252" rx="14" fill="#321d27" stroke="#aa5369"/>
<ns0:text x="516" y="143" fill="#efa3b3" font-size="13" font-weight="750">PASSIFS CHIFFRÉS</ns0:text>
<ns0:text x="516" y="190" fill="#ffffff" font-size="30" font-weight="790">27,0 M$</ns0:text>
<ns0:line x1="516" y1="211" x2="699" y2="211" stroke="#6b3948"/>
<ns0:text x="516" y="242" fill="#d9b2bc" font-size="13">22,5 M$ accord collectif</ns0:text>
<ns0:text x="516" y="269" fill="#d9b2bc" font-size="13">4,5 M$ fees impayés</ns0:text>
<ns0:text x="516" y="311" fill="#f0c36a" font-size="12" font-weight="720">EN PLUS : INCONNU</ns0:text>
<ns0:text x="516" y="334" fill="#c7a5ad" font-size="12">claims + taxes à déterminer</ns0:text>
<ns0:path d="M380 396 L380 430" stroke="#65738a" stroke-width="3"/>
<ns0:path d="M371 422 L380 432 L389 422" fill="none" stroke="#65738a" stroke-width="3"/>
<ns0:rect x="38" y="444" width="684" height="126" rx="14" fill="#171e2c" stroke="#68579a"/>
<ns0:text x="60" y="474" fill="#baa5ef" font-size="13" font-weight="750">1953 TRUST · APRÈS DETTES, TAXES ET ADMINISTRATION</ns0:text>
<ns0:text x="60" y="513" fill="#ffffff" font-size="26" font-weight="780">175 M$ pour les trois premiers rangs</ns0:text>
<ns0:text x="60" y="543" fill="#b8bed0" font-size="13">Shuliak 100 M$ · Indyke 50 M$ · Kahn 25 M$</ns0:text>
<ns0:text x="60" y="562" fill="#8f97aa" font-size="12">legs nominaux, aucune distribution publique identifiée</ns0:text>
<ns0:text x="38" y="602" fill="#74839a" font-size="12">Valar est déjà dans les entités. Son estimation orale de 172 M$ ne s’ajoute pas.</ns0:text>
</ns0:g>
<ns0:g class="mobile" transform="scale(2.17)">
<ns0:rect width="350" height="285" rx="16" fill="#0b1120"/>
<ns0:text x="20" y="27" fill="#f7f9fc" font-size="15" font-weight="760">ACTIF BRUT, PAS UN HÉRITAGE</ns0:text>
<ns0:text x="20" y="46" fill="#99a7bb" font-size="11">Arrêté au 30 juin 2026.</ns0:text>
<ns0:rect x="20" y="59" width="310" height="48" rx="9" fill="#141f33" stroke="#405678"/><ns0:text x="32" y="78" fill="#8fa8cf" font-size="12" font-weight="740">ACTIF PUBLIÉ</ns0:text><ns0:text x="318" y="94" text-anchor="end" fill="#ffffff" font-size="23" font-weight="780">107,645 M$</ns0:text>
<ns0:text x="32" y="126" fill="#9de3d8" font-size="11">CASH 25,705 M$</ns0:text><ns0:text x="169" y="126" fill="#efd387" font-size="11">PRÊTS 3,432 M$</ns0:text><ns0:text x="32" y="144" fill="#b9d0fb" font-size="11">ENTITÉS 78,504 M$</ns0:text>
<ns0:rect x="20" y="157" width="310" height="45" rx="9" fill="#321d27" stroke="#aa5369"/><ns0:text x="32" y="176" fill="#efa3b3" font-size="12" font-weight="740">PASSIFS CHIFFRÉS AU MOINS</ns0:text><ns0:text x="318" y="192" text-anchor="end" fill="#ffffff" font-size="22" font-weight="780">27,0 M$</ns0:text>
<ns0:rect x="20" y="215" width="310" height="43" rx="9" fill="#171e2c" stroke="#68579a"/><ns0:text x="32" y="233" fill="#baa5ef" font-size="12" font-weight="740">1953 TRUST · TROIS PREMIERS RANGS</ns0:text><ns0:text x="318" y="250" text-anchor="end" fill="#ffffff" font-size="20" font-weight="780">175 M$ nominaux</ns0:text>
<ns0:text x="20" y="270" fill="#74839a" font-size="8.5">Valar est déjà inclus dans les entités.</ns0:text>
<ns0:text x="20" y="282" fill="#74839a" font-size="8.5">Claims et taxes restent ouverts.</ns0:text>
</ns0:g>
</ns0:svg>
