<?xml version='1.0' encoding='utf-8'?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 480 610" role="img" aria-labelledby="hb-title-fr hb-desc-fr" style="width:100%;max-width:480px;height:auto;display:block;margin:0 auto;background:#0c111b;border:1px solid #253047;border-radius:14px;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" xmlns="http://www.w3.org/2000/svg">
<ns0:title id="hb-title-fr">Les trois comptabilités Highbridge</ns0:title>
<ns0:desc id="hb-desc-fr">Trois cartes verticales séparent les honoraires, l’encours et les rachats Highbridge.</ns0:desc>
<ns0:rect width="480" height="610" rx="14" fill="#0c111b"/>
<ns0:text x="24" y="42" fill="#f6f8fb" font-size="21" font-weight="760">HIGHBRIDGE : TROIS LIGNES</ns0:text>
<ns0:text x="24" y="66" fill="#9ca9bb" font-size="13.5">Même relation, mesures qui ne s’additionnent pas.</ns0:text>
<ns0:rect x="24" y="94" width="432" height="126" rx="10" fill="#17243b" stroke="#5f8ff3"/>
<ns0:text x="42" y="123" fill="#7da4f7" font-size="13" font-weight="750">REVENU · 29 DÉC. 2004</ns0:text>
<ns0:text x="42" y="160" fill="#ffffff" font-size="27" font-weight="780">15 000 000 $</ns0:text>
<ns0:text x="42" y="187" fill="#c2cbd7" font-size="14">honoraires M&amp;A versés à Financial Trust</ns0:text>
<ns0:text x="42" y="208" fill="#79c6a3" font-size="12" font-weight="700">VIREMENT TRAITÉ ET FACTURE</ns0:text>
<ns0:rect x="24" y="236" width="432" height="126" rx="10" fill="#142b31" stroke="#45a3a8"/>
<ns0:text x="42" y="265" fill="#67c2c7" font-size="13" font-weight="750">ENCOURS · 31 MAI 2014</ns0:text>
<ns0:text x="42" y="302" fill="#ffffff" font-size="27" font-weight="780">58 376 375 $</ns0:text>
<ns0:text x="42" y="329" fill="#c2cbd7" font-size="14">Haze 37,904 M$ ; Southern 20,472 M$</ns0:text>
<ns0:text x="42" y="350" fill="#9ca9bb" font-size="12">Photographie du portefeuille, pas un encaissement.</ns0:text>
<ns0:rect x="24" y="378" width="432" height="126" rx="10" fill="#321b22" stroke="#e28c9d"/>
<ns0:text x="42" y="407" fill="#eea1b0" font-size="13" font-weight="750">LIQUIDITÉ · 2014-2015</ns0:text>
<ns0:text x="42" y="444" fill="#ffffff" font-size="27" font-weight="780">59 446 789 $</ns0:text>
<ns0:text x="42" y="471" fill="#c2cbd7" font-size="14">rachats bruts, paiements finaux inclus</ns0:text>
<ns0:text x="42" y="492" fill="#f0c36a" font-size="12" font-weight="700">CE N’EST PAS UN BÉNÉFICE</ns0:text>
<ns0:rect x="24" y="530" width="432" height="48" rx="8" fill="#231f17"/>
<ns0:text x="240" y="560" text-anchor="middle" fill="#f0c36a" font-size="12" font-weight="700">PROJET 2005 : 2,25 M$ NON SIGNÉ, EXCLU</ns0:text>
</ns0:svg>
