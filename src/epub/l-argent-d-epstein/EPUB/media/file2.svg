<?xml version='1.0' encoding='utf-8'?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 480 760" role="img" aria-labelledby="black-title-fr black-desc-fr" style="display:block;width:100%;height:auto;max-width:720px;margin:0 auto;background:#0c0d10;border:1px solid rgba(255,255,255,0.10);border-radius:12px;font-family:ui-monospace,monospace" xmlns="http://www.w3.org/2000/svg">
<ns0:title id="black-title-fr">Réconciliation des montants attribués à Leon Black</ns0:title>
<ns0:desc id="black-desc-fr">Quatre cartes verticales distinguent les honoraires Dechert, le tableau bancaire du Sénat, son texte narratif et son tableau élargi. Les prêts de 2017 sont isolés comme des créances.</ns0:desc>
<ns0:text x="24" y="40" fill="#f5f6f8" font-size="19" font-weight="700">BLACK VERS EPSTEIN</ns0:text>
<ns0:text x="24" y="64" fill="#f5f6f8" font-size="19" font-weight="700">LE PÉRIMÈTRE CHANGE LE TOTAL</ns0:text>
<ns0:text x="24" y="92" fill="#a8adb7" font-size="10.5">Honoraires, virements et prêts sont des catégories différentes.</ns0:text>
<ns0:rect x="24" y="120" width="432" height="90" rx="10" fill="#151820" stroke="#5eead4" stroke-opacity="0.7"/>
<ns0:text x="46" y="148" fill="#5eead4" font-size="13" font-weight="700">DECHERT · HONORAIRES</ns0:text>
<ns0:text x="46" y="180" fill="#f5f6f8" font-size="26" font-weight="700">158 M$</ns0:text>
<ns0:text x="46" y="202" fill="#d6d9df" font-size="13">2013-2017 · 50 + 70 + 30 + 0 + 8</ns0:text>
<ns0:path d="M240 214 V228" stroke="#8b909b" stroke-width="2"/>
<ns0:path d="M235 223 L240 230 L245 223" fill="none" stroke="#8b909b" stroke-width="2"/>
<ns0:rect x="24" y="236" width="432" height="90" rx="10" fill="#151820" stroke="#7aa2f7" stroke-opacity="0.7"/>
<ns0:text x="46" y="264" fill="#7aa2f7" font-size="13" font-weight="700">TABLEAU BANCAIRE</ns0:text>
<ns0:text x="46" y="296" fill="#f5f6f8" font-size="26" font-weight="700">164,3 M$</ns0:text>
<ns0:text x="46" y="318" fill="#d6d9df" font-size="13">2013-2017 · 158 + 6,3 en 2016</ns0:text>
<ns0:path d="M240 330 V344" stroke="#8b909b" stroke-width="2"/>
<ns0:path d="M235 339 L240 346 L245 339" fill="none" stroke="#8b909b" stroke-width="2"/>
<ns0:rect x="24" y="352" width="432" height="90" rx="10" fill="#151820" stroke="#f5b13d" stroke-opacity="0.7"/>
<ns0:text x="46" y="380" fill="#f5b13d" font-size="13" font-weight="700">TEXTE DU SÉNAT</ns0:text>
<ns0:text x="46" y="412" fill="#f5f6f8" font-size="26" font-weight="700">≈ 166 M$</ns0:text>
<ns0:text x="46" y="434" fill="#d6d9df" font-size="13">2013-2017 · écart interne non réconcilié : 1,7 M$</ns0:text>
<ns0:path d="M240 446 V460" stroke="#8b909b" stroke-width="2"/>
<ns0:path d="M235 455 L240 462 L245 455" fill="none" stroke="#8b909b" stroke-width="2"/>
<ns0:rect x="24" y="468" width="432" height="90" rx="10" fill="#151820" stroke="#ff4d87" stroke-opacity="0.7"/>
<ns0:text x="46" y="496" fill="#ff4d87" font-size="13" font-weight="700">TABLE ÉLARGIE</ns0:text>
<ns0:text x="46" y="528" fill="#f5f6f8" font-size="26" font-weight="700">169,8 M$</ns0:text>
<ns0:text x="46" y="550" fill="#d6d9df" font-size="13">2012-2017 · 164,3 + 5,5</ns0:text>
<ns0:rect x="24" y="598" width="432" height="138" rx="10" fill="#11141a" stroke="#313641"/>
<ns0:text x="46" y="628" fill="#f58b57" font-size="13" font-weight="700">À PART : LES PRÊTS DE 2017</ns0:text>
<ns0:text x="46" y="658" fill="#f5f6f8" font-size="16" font-weight="700">30,5 M$ avancés · 10 M$ remboursés</ns0:text>
<ns0:text x="46" y="684" fill="#d6d9df" font-size="14">20,5 M$ encore dus au décès d’Epstein.</ns0:text>
<ns0:text x="46" y="712" fill="#a8adb7" font-size="12">Créances au bilan, pas honoraires à ajouter.</ns0:text>
</ns0:svg>
