<?xml version='1.0' encoding='utf-8'?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 480 690" role="img" aria-labelledby="barclays-boundary-fr-title barclays-boundary-fr-desc" style="width:100%;height:auto;display:block;max-width:680px;margin:0 auto;background:#090b10;border:1px solid #252b36;border-radius:16px;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" xmlns="http://www.w3.org/2000/svg">
<ns0:title id="barclays-boundary-fr-title">Deux dossiers Barclays et la frontière entre leurs preuves</ns0:title>
<ns0:desc id="barclays-boundary-fr-desc">Le premier bloc résume la gouvernance Staley et la sanction finale. Le second présente le compte Maxwell décrit par Reuters. Un troisième bloc rappelle qu’aucune de ces pièces n’établit un compte Barclays au nom d’Epstein.</ns0:desc>
<ns0:rect width="480" height="690" rx="16" fill="#090b10"/>
<ns0:text x="28" y="42" fill="#f4f6f8" font-size="21" font-weight="750">DEUX DOSSIERS, UNE FRONTIÈRE</ns0:text>
<ns0:text x="28" y="68" fill="#9aa4b2" font-size="12.5">Même banque, objets et niveaux de preuve différents</ns0:text>
<ns0:rect x="26" y="100" width="428" height="180" rx="13" fill="#14233a" stroke="#75a7ff" stroke-width="1.5"/>
<ns0:text x="46" y="132" fill="#9ec0ff" font-size="14" font-weight="750">GOUVERNANCE STALEY</ns0:text>
<ns0:text x="46" y="164" fill="#f4f6f8" font-size="18" font-weight="720">Lettre de Barclays à la FCA</ns0:text>
<ns0:text x="46" y="192" fill="#b7bec9" font-size="13.5">Deux affirmations jugées trompeuses</ns0:text>
<ns0:text x="46" y="222" fill="#f4f6f8" font-size="17" font-weight="720">1 107 306,92 £ et interdiction</ns0:text>
<ns0:text x="46" y="247" fill="#b7bec9" font-size="13.5">Sanctions personnelles définitives en 2025</ns0:text>
<ns0:rect x="26" y="306" width="428" height="198" rx="13" fill="#2b2315" stroke="#f5b13d" stroke-width="1.5"/>
<ns0:text x="46" y="338" fill="#ffd189" font-size="14" font-weight="750">COMPTE MAXWELL</ns0:text>
<ns0:text x="46" y="374" fill="#f4f6f8" font-size="20" font-weight="750">2,4 M$ fin 2018</ns0:text>
<ns0:text x="46" y="410" fill="#f4f6f8" font-size="20" font-weight="750">Plus de 600 000 $ vers UBS</ns0:text>
<ns0:text x="46" y="440" fill="#b7bec9" font-size="13.5">Dans les trois semaines suivant l’arrestation</ns0:text>
<ns0:text x="46" y="465" fill="#b7bec9" font-size="12">d’Epstein, selon les documents analysés par Reuters</ns0:text>
<ns0:rect x="26" y="530" width="428" height="126" rx="13" fill="#2c1621" stroke="#ff4d87" stroke-width="1.5"/>
<ns0:text x="46" y="562" fill="#ff7aa8" font-size="14" font-weight="750">NON ÉTABLI PAR CES PIÈCES</ns0:text>
<ns0:text x="46" y="598" fill="#f4f6f8" font-size="17" font-weight="720">Un compte Barclays au nom d’Epstein</ns0:text>
<ns0:text x="46" y="626" fill="#b7bec9" font-size="12.5">Le compte Maxwell ne permet pas cette déduction.</ns0:text>
</ns0:svg>
