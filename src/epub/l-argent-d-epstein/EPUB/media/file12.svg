<?xml version='1.0' encoding='utf-8'?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 760 590" role="img" aria-labelledby="victim-ledger-title-fr victim-ledger-desc-fr" style="width:100%;height:auto;display:block;background:#0b1120;border:1px solid #26324a;border-radius:16px;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" xmlns="http://www.w3.org/2000/svg">
<ns0:title id="victim-ledger-title-fr">Trois lignes séparées d’indemnisation et de règlement</ns0:title>
<ns0:desc id="victim-ledger-desc-fr">Le programme EVCP, les accords hors EVCP et le règlement collectif 2026 sont présentés sur trois lignes. Les règlements bancaires sont exclus.</ns0:desc>
<ns0:style>.mobile{display:none}@media (max-width:640px){.desktop{display:none}.mobile{display:block}}</ns0:style>
<ns0:g class="desktop">
<ns0:rect width="760" height="590" rx="16" fill="#0b1120"/>
<ns0:text x="38" y="52" fill="#f7f9fc" font-size="26" font-weight="760">TROIS MÉCANISMES, TROIS COMPTES</ns0:text>
<ns0:text x="38" y="81" fill="#99a7bb" font-size="13">Les montants de la succession restent séparés des accords payés par les banques.</ns0:text>
<ns0:rect x="38" y="116" width="684" height="110" rx="13" fill="#16233a" stroke="#5278b8"/>
<ns0:rect x="38" y="116" width="12" height="110" rx="6" fill="#6e9bf5"/>
<ns0:text x="70" y="146" fill="#91b2f5" font-size="13" font-weight="760">EVCP · PROGRAMME CLOS</ns0:text>
<ns0:text x="70" y="187" fill="#ffffff" font-size="30" font-weight="790">121 127 339,05 $</ns0:text>
<ns0:text x="402" y="166" fill="#b8c3d2" font-size="13">claims and other amounts</ns0:text>
<ns0:text x="402" y="190" fill="#b8c3d2" font-size="13">libellé exact du 17e compte</ns0:text>
<ns0:rect x="38" y="248" width="684" height="110" rx="13" fill="#142d30" stroke="#3e9388"/>
<ns0:rect x="38" y="248" width="12" height="110" rx="6" fill="#65c6b5"/>
