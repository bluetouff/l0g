<ns0:text x="70" y="410" fill="#f0c36a" font-size="13" font-weight="760">WARD v. INDYKE · 2026</ns0:text>
<ns0:text x="70" y="451" fill="#ffffff" font-size="30" font-weight="790">35 000 000 $</ns0:text>
