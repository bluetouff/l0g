<ns0:text x="70" y="319" fill="#ffffff" font-size="30" font-weight="790">48 599 610,90 $</ns0:text>
<ns0:text x="402" y="298" fill="#abc9c5" font-size="13">cumul reconstruit</ns0:text>
<ns0:text x="402" y="322" fill="#abc9c5" font-size="13">à partir de neuf comptes</ns0:text>
