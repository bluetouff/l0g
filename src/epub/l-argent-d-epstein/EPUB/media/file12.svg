<ns0:text x="622" y="430" text-anchor="middle" fill="#f0b28b" font-size="12" font-weight="740">ENCORE DÛ</ns0:text>
<ns0:text x="622" y="456" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="760">22,5 M$</ns0:text>
<ns0:text x="70" y="488" fill="#d7c8a7" font-size="12">approbation finale encore pendante au 7 août 2026</ns0:text>
