<title id="bdb7-en-fig2-title">Fine and forfeiture under the US agreement</title>
<desc id="bdb7-en-fig2-desc">The US$80,488,040 criminal fine and US$46,510,257 forfeiture total US$126,998,297. Up to US$26,829,346 of the fine can be credited for Brazilian payments under the agreement’s terms. The outlined portion is within the fine, not additional. Bars start at zero; displayed values are rounded to three decimal places in millions. The US$400 special assessment is excluded. These are not verified receipts.</desc>
