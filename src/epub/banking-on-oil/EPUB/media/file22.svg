<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="bdb8-svg" viewBox="0 0 420 975" style="width:100%;height:auto;background:#0b0d10" focusable="false" role="img" aria-labelledby="bdb8-en-fig2-title bdb8-en-fig2-desc" data-figure="2"><rect x="0" y="0" width="420" height="975" fill="#0b0d10"/>
<title id="bdb8-en-fig2-title">Conditions linking funding to delivery</title>
<desc id="bdb8-en-fig2-desc">A funding need may exceed usable resources. Additional funding or another firm can preserve delivery. Disruption becomes possible when the replacement is absent or too slow. Analytical diagram, with no assigned probability or volume.</desc>
<text x="24" y="38" text-anchor="start" font-size="20" style="font-family:ui-monospace,monospace;font-size:20px;font-weight:600;fill:#5eead4">02 / TRANSMISSION</text>
<text x="24" y="78" text-anchor="start" font-size="25" style="font-family:system-ui,sans-serif;font-size:25px;font-weight:650;fill:#f5f6f8">From payment to delivery</text>
<text x="24" y="112" text-anchor="start" font-size="20" style="font-family:system-ui,sans-serif;font-size:20px;font-weight:400;fill:#f5b13d">Conditional scenario, not an event</text>
<rect x="24" y="143" width="372" height="125" rx="6" style="fill:#171a20;stroke:#424751;stroke-width:1.2;" />
<text x="44" y="178" text-anchor="start" font-size="23" style="font-family:system-ui,sans-serif;font-size:23px;font-weight:650;fill:#f5f6f8">1. Funding requirement</text>
<text x="44" y="211" text-anchor="start" font-size="20" style="font-family:system-ui,sans-serif;font-size:20px;font-weight:400;fill:#e7e9ee">Costlier goods; receipts</text>
<text x="44" y="239" text-anchor="start" font-size="20" style="font-family:system-ui,sans-serif;font-size:20px;font-weight:400;fill:#e7e9ee">are late, or margins rise.</text>
<line x1="210" y1="270" x2="210" y2="300" style="stroke:#5eead4;stroke-width:1.8"/><path d="M 205 299 L 210 307 L 215 299" style="fill:none;stroke:#5eead4;stroke-width:1.8"/>
<rect x="24" y="311" width="372" height="125" rx="6" style="fill:#171a20;stroke:#424751;stroke-width:1.2;" />
<text x="44" y="348" text-anchor="start" font-size="23" style="font-family:system-ui,sans-serif;font-size:23px;font-weight:650;fill:#f5f6f8">2. Funding limit reached</text>
<text x="44" y="381" text-anchor="start" font-size="20" style="font-family:system-ui,sans-serif;font-size:20px;font-weight:400;fill:#e7e9ee">Usable resources cannot meet</text>
<text x="44" y="409" text-anchor="start" font-size="20" style="font-family:system-ui,sans-serif;font-size:20px;font-weight:400;fill:#e7e9ee">the payment deadline.</text>
<line x1="210" y1="438" x2="210" y2="468" style="stroke:#5eead4;stroke-width:1.8"/><path d="M 205 467 L 210 475 L 215 467" style="fill:none;stroke:#5eead4;stroke-width:1.8"/>
<rect x="24" y="479" width="372" height="117" rx="6" style="fill:#171a20;stroke:#424751;stroke-width:1.2;" />
<text x="44" y="515" text-anchor="start" font-size="23" style="font-family:system-ui,sans-serif;font-size:23px;font-weight:650;fill:#f5f6f8">3. Seeking a replacement</text>
<text x="44" y="548" text-anchor="start" font-size="20" style="font-family:system-ui,sans-serif;font-size:20px;font-weight:400;fill:#e7e9ee">More funding or a new firm</text>
<text x="44" y="576" text-anchor="start" font-size="20" style="font-family:system-ui,sans-serif;font-size:20px;font-weight:400;fill:#e7e9ee">taking over the transaction.</text>
<line x1="24" y1="629" x2="396" y2="629" style="stroke:#424751;stroke-width:1.3"/>
<text x="24" y="664" text-anchor="start" font-size="20" style="font-family:ui-monospace,monospace;font-size:20px;font-weight:600;fill:#a9adb7">TWO POSSIBLE OUTCOMES</text>
<rect x="24" y="686" width="372" height="118" rx="6" style="fill:#171a20;stroke:#5eead4;stroke-width:1.2;" />
<text x="44" y="723" text-anchor="start" font-size="22" style="font-family:system-ui,sans-serif;font-size:22px;font-weight:650;fill:#5eead4">Replacement in time</text>
<text x="44" y="756" text-anchor="start" font-size="20" style="font-family:system-ui,sans-serif;font-size:20px;font-weight:400;fill:#e7e9ee">Delivery continues;</text>
<text x="44" y="784" text-anchor="start" font-size="20" style="font-family:system-ui,sans-serif;font-size:20px;font-weight:400;fill:#e7e9ee">terms may change.</text>
<rect x="24" y="824" width="372" height="122" rx="6" style="fill:#171a20;stroke:#ff4d87;stroke-width:1.2;" />
<text x="44" y="861" text-anchor="start" font-size="22" style="font-family:system-ui,sans-serif;font-size:22px;font-weight:650;fill:#ff4d87">No replacement in time</text>
<text x="44" y="894" text-anchor="start" font-size="20" style="font-family:system-ui,sans-serif;font-size:20px;font-weight:400;fill:#e7e9ee">Risk of delayed or reduced</text>
<text x="44" y="922" text-anchor="start" font-size="20" style="font-family:system-ui,sans-serif;font-size:20px;font-weight:400;fill:#e7e9ee">supplies.</text>
</svg>
