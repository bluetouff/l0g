<svg xmlns="http://www.w3.org/2000/svg" id="bb3-en-recettes-2016" viewBox="0 0 480 568" width="480" height="568" role="img" aria-labelledby="bb3-en-recettes-2016-title bb3-en-recettes-2016-desc" lang="en" font-family="Arial, Helvetica, sans-serif" style="display:block;width:100%;max-width:480px;height:auto;margin:0 auto;isolation:isolate"><rect x="0" y="0" width="480" height="568" fill="#0b0d10"/>
<title id="bb3-en-recettes-2016-title">The 2016 revenue stream</title><desc id="bb3-en-recettes-2016-desc">2016: $271m from government oil sales after costs; $231m for Glencore debt service and $40m for the Treasury. Shares: 85.2% and 14.8%. This is not all government revenue.</desc>
<style>#bb3-en-recettes-2016{color:#e7e9ee;}#bb3-en-recettes-2016 text{fill:currentColor}#bb3-en-recettes-2016 .b-bg{fill:#121419}#bb3-en-recettes-2016 .b-bar{fill:#5eead4}#bb3-en-recettes-2016 .b-soft{fill:#171a20}#bb3-en-recettes-2016 .b-rule{stroke:#8b909b;fill:none}#bb3-en-recettes-2016 .b-outline{fill:#171a20;stroke:#5eead4;stroke-width:2}#bb3-en-recettes-2016 .b-proj{fill:none;stroke:#5eead4;stroke-width:2;stroke-dasharray:6 4}#bb3-en-recettes-2016 .b-muted{opacity:.84}#bb3-en-recettes-2016 .b-value{font-variant-numeric:tabular-nums}@media print{#bb3-en-recettes-2016{color:#e7e9ee;}}</style>
<rect class="b-bg" width="480" height="568" rx="10"/>
<text x="24" y="43" font-size="28" font-weight="700" text-anchor="start">The 2016 revenue stream</text><text x="24" y="78" font-size="19" font-weight="400" text-anchor="start" class="b-muted">US$ million · government oil sales</text><text x="24" y="133" font-size="42" font-weight="700" text-anchor="start">$271m</text><text x="24" y="166" font-size="21" font-weight="400" text-anchor="start">after operating and transport costs</text><rect x="24" y="193" width="368.236" height="36" class="b-bar" /><rect x="392.2361623616236" y="193" width="63.764" height="36" class="b-outline" /><rect x="24" y="267" width="14.000" height="14" class="b-bar" /><text x="51" y="291" font-size="35" font-weight="700" text-anchor="start">$231m</text><text x="24" y="327" font-size="22" font-weight="600" text-anchor="start">Glencore debt service</text><text x="24" y="357" font-size="21" font-weight="400" text-anchor="start">85.2% of receipts after costs</text><line x1="24" y1="381" x2="456" y2="381" class="b-rule" stroke-width="1.2"/><rect x="24" y="409" width="14.000" height="14" class="b-outline" /><text x="51" y="433" font-size="35" font-weight="700" text-anchor="start">$40m</text><text x="24" y="469" font-size="22" font-weight="600" text-anchor="start">Balance for the Treasury</text><text x="24" y="499" font-size="21" font-weight="400" text-anchor="start">14.8% of the same revenue stream</text><text x="24" y="544" font-size="18" font-weight="400" text-anchor="start" class="b-muted">Scope: this sales stream only.</text>
</svg>
