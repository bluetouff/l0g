<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" id="bb2-en-hedge" viewBox="0 0 480 790" width="480" height="790" role="img" aria-labelledby="bb2-en-hedge-title bb2-en-hedge-desc" lang="en" font-family="Arial, Helvetica, sans-serif" style="display:block;width:100%;max-width:480px;height:auto;margin:0 auto;isolation:isolate"><rect x="0" y="0" width="480" height="790" fill="#0b0d10"/>
<title id="bb2-en-hedge-title">Hedging one million barrels</title><desc id="bb2-en-hedge-desc">Hypothetical example. Physical oil and futures both rise from $80 to $100 per barrel. Unrealised gain on inventory: $20 million. Loss on short futures, settled in cash: $20 million. Net economic change: zero before costs. Cash settlement funding need: $20 million, excluding initial margin. Not a Trafigura transaction.</desc>
<style>#bb2-en-hedge{color:#e7e9ee;}#bb2-en-hedge text{fill:currentColor}#bb2-en-hedge .b-bg{fill:#121419}#bb2-en-hedge .b-bar,#bb2-en-hedge .b-accent{fill:#5eead4}#bb2-en-hedge .b-soft{fill:#171a20}#bb2-en-hedge .b-rule{stroke:#8b909b;fill:none}#bb2-en-hedge .b-muted{opacity:.83}#bb2-en-hedge .b-value{font-variant-numeric:tabular-nums}@media print{#bb2-en-hedge{color:#e7e9ee;}}</style>
<rect class="b-bg" width="480" height="790" rx="10"/>
<text x="24" y="41" font-size="19" font-weight="700" text-anchor="start" class="b-accent">HYPOTHETICAL EXAMPLE</text><text x="24" y="83" font-size="27" font-weight="700" text-anchor="start">Hedging one million barrels</text><text x="24" y="117" font-size="20" font-weight="400" text-anchor="start" class="b-muted">Physical and futures prices: $80 → $100</text><rect x="24" y="149" width="432" height="191" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/><text x="44" y="187" font-size="19" font-weight="700" text-anchor="start">UNSOLD PHYSICAL INVENTORY</text><text x="44" y="246" font-size="42" font-weight="700" text-anchor="start" class="b-value b-accent">+$20m</text><text x="44" y="285" font-size="22" font-weight="400" text-anchor="start">The commodity is worth more.</text><text x="44" y="316" font-size="22" font-weight="400" text-anchor="start">No sale proceeds received yet.</text><rect x="24" y="361" width="432" height="191" class="b-soft"/><text x="44" y="399" font-size="19" font-weight="700" text-anchor="start">SHORT FUTURES POSITION</text><text x="44" y="458" font-size="42" font-weight="700" text-anchor="start" class="b-value b-accent">−$20m</text><text x="44" y="497" font-size="22" font-weight="400" text-anchor="start">Loss settled in cash as the</text><text x="44" y="528" font-size="22" font-weight="400" text-anchor="start">market moves against the hedge.</text><text x="24" y="603" font-size="23" font-weight="700" text-anchor="start">Net economic change: $0</text><text x="24" y="644" font-size="23" font-weight="700" text-anchor="start" class="b-accent">Cash settlements to fund: $20m</text><path d="M24 672 H456" class="b-rule" stroke-width="1"/><text x="24" y="707" font-size="21" font-weight="400" text-anchor="start" class="b-muted">Exact hedge; before costs,</text><text x="24" y="737" font-size="21" font-weight="400" text-anchor="start" class="b-muted">basis risk and initial margin.</text><text x="24" y="770" font-size="19" font-weight="600" text-anchor="start" class="b-muted">No actual transaction is depicted.</text></svg>
