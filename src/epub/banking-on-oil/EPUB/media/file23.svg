<title id="bdb8-en-fig3-title">International work on margin preparedness</title>
<desc id="bdb8-en-fig3-desc">FSB recommendations on 10 December 2024 do not directly cover non-financial commodity traders. International margin reports followed on 15 January 2025. CPMI-IOSCO consultation on 6 May 2026, responses due by 30 June. No subsequent final text for that consultation found by 8 September. Not a complete map of applicable law.</desc>
<text x="24" y="38" text-anchor="start" font-size="20" style="font-family:ui-monospace,monospace;font-size:20px;font-weight:600;fill:#5eead4">03 / PREPAREDNESS FRAMEWORKS</text>
<text x="24" y="79" text-anchor="start" font-size="25" style="font-family:system-ui,sans-serif;font-size:25px;font-weight:650;fill:#f5f6f8">Publications and their scope</text>
<text x="24" y="113" text-anchor="start" font-size="20" style="font-family:system-ui,sans-serif;font-size:20px;font-weight:400;fill:#a9adb7">Documentary cut-off: 8 September 2026</text>
<rect x="24" y="143" width="372" height="195" rx="6" style="fill:#171a20;stroke:#5eead4;stroke-width:1.2;" />
<text x="44" y="182" text-anchor="start" font-size="22" style="font-family:ui-monospace,monospace;font-size:22px;font-weight:600;fill:#5eead4">10.12.2024 / FSB</text>
<text x="44" y="222" text-anchor="start" font-size="23" style="font-family:system-ui,sans-serif;font-size:23px;font-weight:650;fill:#f5f6f8">Liquidity preparedness</text>
<text x="44" y="259" text-anchor="start" font-size="20" style="font-family:system-ui,sans-serif;font-size:20px;font-weight:400;fill:#e7e9ee">Non-financial traders:</text>
<text x="44" y="288" text-anchor="start" font-size="20" style="font-family:system-ui,sans-serif;font-size:20px;font-weight:400;fill:#e7e9ee">not directly in scope;</text>
<text x="44" y="317" text-anchor="start" font-size="20" style="font-family:system-ui,sans-serif;font-size:20px;font-weight:400;fill:#e7e9ee">adoption as sound practices.</text>
<line x1="210" y1="340" x2="210" y2="371" style="stroke:#a9adb7;stroke-width:1.8"/><path d="M 205 370 L 210 378 L 215 370" style="fill:none;stroke:#a9adb7;stroke-width:1.8"/>
<rect x="24" y="382" width="372" height="188" rx="6" style="fill:#171a20;stroke:#424751;stroke-width:1.2;" />
<text x="44" y="421" text-anchor="start" font-size="20" style="font-family:ui-monospace,monospace;font-size:20px;font-weight:600;fill:#5eead4">15.01.2025 / BCBS–CPMI–IOSCO</text>
<text x="44" y="461" text-anchor="start" font-size="23" style="font-family:system-ui,sans-serif;font-size:23px;font-weight:650;fill:#f5f6f8">Margin transparency</text>
<text x="44" y="498" text-anchor="start" font-size="20" style="font-family:system-ui,sans-serif;font-size:20px;font-weight:400;fill:#e7e9ee">Final reports and proposals.</text>
<text x="44" y="527" text-anchor="start" font-size="20" style="font-family:system-ui,sans-serif;font-size:20px;font-weight:400;fill:#e7e9ee">Domestic implementation</text>
<text x="44" y="556" text-anchor="start" font-size="20" style="font-family:system-ui,sans-serif;font-size:20px;font-weight:400;fill:#e7e9ee">remains a separate step.</text>
<line x1="210" y1="572" x2="210" y2="603" style="stroke:#a9adb7;stroke-width:1.8"/><path d="M 205 602 L 210 610 L 215 602" style="fill:none;stroke:#a9adb7;stroke-width:1.8"/>
<rect x="24" y="614" width="372" height="214" rx="6" style="fill:#171a20;stroke:#f5b13d;stroke-width:1.2;" />
<text x="44" y="653" text-anchor="start" font-size="21" style="font-family:ui-monospace,monospace;font-size:21px;font-weight:600;fill:#f5b13d">06.05.2026 / CPMI–IOSCO</text>
<text x="44" y="693" text-anchor="start" font-size="23" style="font-family:system-ui,sans-serif;font-size:23px;font-weight:650;fill:#f5f6f8">Consultation published</text>
<text x="44" y="730" text-anchor="start" font-size="20" style="font-family:system-ui,sans-serif;font-size:20px;font-weight:400;fill:#e7e9ee">Responses due by 30 June.</text>
<text x="44" y="759" text-anchor="start" font-size="20" style="font-family:system-ui,sans-serif;font-size:20px;font-weight:400;fill:#e7e9ee">No later final text found</text>
<text x="44" y="788" text-anchor="start" font-size="20" style="font-family:system-ui,sans-serif;font-size:20px;font-weight:400;fill:#e7e9ee">in the sources reviewed</text>
<text x="44" y="817" text-anchor="start" font-size="20" style="font-family:system-ui,sans-serif;font-size:20px;font-weight:400;fill:#e7e9ee">through 8 September 2026.</text>
<text x="24" y="875" text-anchor="start" font-size="20" style="font-family:system-ui,sans-serif;font-size:20px;font-weight:400;fill:#a9adb7">Selected milestones.</text>
<text x="24" y="903" text-anchor="start" font-size="20" style="font-family:system-ui,sans-serif;font-size:20px;font-weight:400;fill:#a9adb7">Spacing is not a time scale.</text>
