<title id="bb4-en-achats-title">Purchases in February 2017</title><desc id="bb4-en-achats-desc">According to the CFTC order of 17 June 2024: 80 cargoes bought in the February 2017 MOC window, totalling 3.6 million barrels. The grid shows aggregate volume in units of 45,000 barrels, not ships or day-by-day purchases. Excess derivative exposure is not quantified in the order.</desc>
