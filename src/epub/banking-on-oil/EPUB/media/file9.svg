<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" id="bb4-en-contrats" viewBox="0 0 480 650" width="480" height="650" role="img" aria-labelledby="bb4-en-contrats-title bb4-en-contrats-desc" lang="en" font-family="Arial, Helvetica, sans-serif" style="display:block;width:100%;max-width:480px;height:auto;margin:0 auto;isolation:isolate"><rect x="0" y="0" width="480" height="650" fill="#0b0d10"/>
<title id="bb4-en-contrats-title">From the market to contracts</title><desc id="bb4-en-contrats-desc">Simplified diagram: firm bids, offers, transactions and other information feed a daily Platts assessment. Physical contracts may use the reference plus or minus a differential; indexed derivatives may use it for cash settlement. Pricing formulas and periods depend on the contract. This is not an automatic average of all transactions.</desc>
<style>#bb4-en-contrats{color:#e7e9ee;}#bb4-en-contrats text{fill:currentColor}#bb4-en-contrats .b-bg{fill:#121419}#bb4-en-contrats .b-bar{fill:#5eead4}#bb4-en-contrats .b-soft{fill:#171a20}#bb4-en-contrats .b-rule{stroke:#8b909b;fill:none}#bb4-en-contrats .b-arrow{stroke:#5eead4}#bb4-en-contrats .b-outline{fill:none;stroke:#5eead4;stroke-width:1.5}#bb4-en-contrats .b-muted{opacity:.88}#bb4-en-contrats .b-value{font-variant-numeric:tabular-nums}@media print{#bb4-en-contrats{color:#e7e9ee;}}</style>
<rect x="0" y="0" width="480" height="650" rx="8" class="b-bg"/>
<text x="24" y="42" font-size="26" font-weight="700" text-anchor="start">From the market to contracts</text><text x="24" y="75" font-size="18" font-weight="400" text-anchor="start" class="b-muted">Simplified diagram · USGC HSFO reference</text><rect x="24" y="100" width="432" height="94" rx="6" class="b-soft"/><text x="240" y="136" font-size="23" font-weight="700" text-anchor="middle">Market information</text><text x="240" y="169" font-size="20" font-weight="400" text-anchor="middle">Bids, offers, trades, other data</text><path d="M240 198 L240 223" class="b-arrow" stroke-width="2" fill="none"/><path d="M235 216 L240 223 L245 216" class="b-arrow" stroke-width="2" fill="none"/><rect x="24" y="229" width="432" height="117" rx="6" class="b-soft"/><text x="240" y="262" font-size="23" font-weight="700" text-anchor="middle">Daily Platts assessment</text><text x="240" y="294" font-size="18" font-weight="400" text-anchor="middle">A product, a location, a timing basis</text><text x="240" y="323" font-size="20" font-weight="400" text-anchor="middle">Information checked and assessed</text><path d="M240 350 V378 H128 V400 M240 378 H352 V400" class="b-arrow" stroke-width="2" fill="none"/><path d="M128 397 L128 406" class="b-arrow" stroke-width="2" fill="none"/><path d="M123 399 L128 406 L133 399" class="b-arrow" stroke-width="2" fill="none"/><path d="M352 397 L352 406" class="b-arrow" stroke-width="2" fill="none"/><path d="M347 399 L352 406 L357 399" class="b-arrow" stroke-width="2" fill="none"/><rect x="24" y="414" width="208" height="148" rx="6" class="b-soft"/><rect x="248" y="414" width="208" height="148" rx="6" class="b-soft"/><text x="128" y="447" font-size="21" font-weight="700" text-anchor="middle">Physical sale</text><text x="128" y="480" font-size="21" font-weight="400" text-anchor="middle">Benchmark</text><text x="128" y="508" font-size="21" font-weight="400" text-anchor="middle">± differential</text><text x="128" y="539" font-size="18" font-weight="400" text-anchor="middle">as contracted</text><text x="352" y="447" font-size="17" font-weight="700" text-anchor="middle">Indexed derivative</text><text x="352" y="480" font-size="21" font-weight="400" text-anchor="middle">Cash</text><text x="352" y="508" font-size="21" font-weight="400" text-anchor="middle">settlement</text><text x="352" y="539" font-size="18" font-weight="400" text-anchor="middle">as contracted</text><text x="24" y="596" font-size="17" font-weight="400" text-anchor="start">The pricing clause transmits the reference.</text><text x="24" y="627" font-size="17" font-weight="400" text-anchor="start" class="b-muted">Arrows do not represent flows of barrels.</text>
</svg>
