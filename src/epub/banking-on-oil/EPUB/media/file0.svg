<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" id="bdb1-en-timeline" viewBox="0 0 480 862" width="480" height="862" role="img" aria-labelledby="bdb1-en-timeline-title bdb1-en-timeline-desc" lang="en" style="display:block;width:100%;max-width:480px;height:auto;margin:0 auto;isolation:isolate" font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="480" height="862" fill="#0b0d10"/><title id="bdb1-en-timeline-title">The Sienna timetable</title><desc id="bdb1-en-timeline-desc">2020. 19 February: loading at Rotterdam and bill of lading signed. 12 March: UniCredit issues the letter of credit. 2 April: BP paid for 80,000 tonnes. 26 April to 2 May: ship-to-ship discharge at Sohar without production of the original bill. 13 August: the original endorsed by BP reaches the bank. Not a time-proportional scale. Source: Court of Appeal judgment of 4 May 2023, paragraphs 10 to 21.</desc><rect x="0" y="0" width="480" height="862" rx="16" fill="#121419"/><text x="24" y="39" font-size="22" font-weight="700" fill="#5eead4" text-anchor="start">01 / SIENNA</text><text x="24" y="82" font-size="28" font-weight="700" fill="#e7e9ee" text-anchor="start">The Sienna timetable</text><text x="24" y="122" font-size="22" font-weight="400" fill="#8b909b" text-anchor="start">2020 • Documented events</text><path d="M44 179 V671" fill="none" stroke="#47505c" stroke-width="3"/><circle cx="44" cy="179" r="7" fill="#5eead4"/><text x="76" y="185" font-size="25" font-weight="700" fill="#e7e9ee" text-anchor="start">19 February</text><text x="76" y="220" font-size="22" font-weight="400" fill="#e7e9ee"><tspan x="76" dy="0">Loading at Rotterdam;</tspan><tspan x="76" dy="28">bill of lading signed.</tspan></text><circle cx="44" cy="302" r="7" fill="#5eead4"/><text x="76" y="308" font-size="25" font-weight="700" fill="#e7e9ee" text-anchor="start">12 March</text><text x="76" y="343" font-size="22" font-weight="400" fill="#e7e9ee"><tspan x="76" dy="0">UniCredit issues the</tspan><tspan x="76" dy="28">letter of credit for Gulf.</tspan></text><circle cx="44" cy="425" r="7" fill="#5eead4"/><text x="76" y="431" font-size="25" font-weight="700" fill="#e7e9ee" text-anchor="start">2 April</text><text x="76" y="466" font-size="22" font-weight="400" fill="#e7e9ee"><tspan x="76" dy="0">BP is paid for</tspan><tspan x="76" dy="28">80,000 tonnes of fuel oil.</tspan></text><circle cx="44" cy="548" r="7" fill="#5eead4"/><text x="76" y="554" font-size="25" font-weight="700" fill="#e7e9ee" text-anchor="start">26 April – 2 May</text><text x="76" y="589" font-size="22" font-weight="400" fill="#e7e9ee"><tspan x="76" dy="0">Ship-to-ship discharge at</tspan><tspan x="76" dy="28">Sohar without the original.</tspan></text><circle cx="44" cy="671" r="7" fill="#5eead4"/><text x="76" y="677" font-size="25" font-weight="700" fill="#e7e9ee" text-anchor="start">13 August</text><text x="76" y="712" font-size="22" font-weight="400" fill="#e7e9ee"><tspan x="76" dy="0">The original, endorsed by BP,</tspan><tspan x="76" dy="28">reaches UniCredit.</tspan></text><path d="M24 774 H456" fill="none" stroke="#47505c"/><text x="24" y="807" font-size="22" font-weight="400" fill="#8b909b"><tspan x="24" dy="0">Chronological order;</tspan><tspan x="24" dy="28">spacing is not proportional.</tspan></text></svg>
