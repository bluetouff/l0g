<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="bdb6-svg" viewBox="0 0 540 638" width="540" height="638" style="width:100%;height:auto" focusable="false" role="img" aria-labelledby="bdb6-en-fig1-title bdb6-en-fig1-desc" data-figure="1"><rect x="0" y="0" width="540" height="638" fill="#0b0d10"/>
<style>.bdb6-svg{background:#0b0d10;color:#e7e9ee}</style>
<title id="bdb6-en-fig1-title">Two agreements, different obligations</title>
<desc id="bdb6-en-fig1-desc">In the arrangement described in the judgment, a Gupta-linked seller sells cargo to Trafigura. Repurchase is expected but is not binding at the outset. If Citi refinances the trade, it acquires title with Trafigura committed to taking the position back at maturity. Arrows show contractual relationships, not physical routes or payment timing.</desc>
<text x="28" y="38" text-anchor="start" style="font-family:ui-monospace,monospace;font-size:18px;font-weight:600;fill:#5eead4">01 / FINANCING</text>
<text x="28" y="73" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:28px;font-weight:700;fill:#f5f6f8">Two agreements,</text>
<text x="28" y="116" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:28px;font-weight:700;fill:#f5f6f8">different obligations</text>
<rect x="28" y="145" width="484" height="155" rx="6" style="fill:#171a20;stroke:rgba(255,255,255,.22);stroke-width:1.2;" />
<text x="48" y="179" text-anchor="start" style="font-family:ui-monospace,monospace;font-size:23px;font-weight:650;fill:#f5f6f8">Gupta → Trafigura</text>
<text x="48" y="215" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:21px;font-weight:400;fill:#e7e9ee">Cargo sold to the trader.</text>
<text x="48" y="246" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:21px;font-weight:400;fill:#e7e9ee">Repurchase expected later,</text>
<text x="48" y="277" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:21px;font-weight:400;fill:#e7e9ee">but not binding at the outset.</text>
<line x1="270" y1="302" x2="270" y2="334" style="stroke:#f5b13d;stroke-width:2" stroke-dasharray="5 5"/>
<text x="270" y="368" text-anchor="middle" style="font-family:system-ui,sans-serif;font-size:20px;font-weight:600;fill:#f5b13d">Trafigura connects the deals</text>
<line x1="270" y1="384" x2="270" y2="409" style="stroke:#f5b13d;stroke-width:2" stroke-dasharray="5 5"/>
<rect x="28" y="412" width="484" height="164" rx="6" style="fill:#171a20;stroke:rgba(255,255,255,.22);stroke-width:1.2;" />
<text x="48" y="447" text-anchor="start" style="font-family:ui-monospace,monospace;font-size:23px;font-weight:650;fill:#f5f6f8">Trafigura → Citi</text>
<text x="48" y="483" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:21px;font-weight:400;fill:#e7e9ee">The bank acquires title.</text>
<text x="48" y="514" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:21px;font-weight:400;fill:#e7e9ee">Trafigura commits to taking</text>
<text x="48" y="545" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:21px;font-weight:400;fill:#e7e9ee">the position back at maturity.</text>
<text x="28" y="613" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:18px;font-weight:400;fill:#a1a1aa">Simplified · agreements described in 2026</text>
</svg>
