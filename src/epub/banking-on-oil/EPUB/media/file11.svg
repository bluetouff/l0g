<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" id="bb4-en-moyenne" viewBox="0 0 480 624" width="480" height="624" role="img" aria-labelledby="bb4-en-moyenne-title bb4-en-moyenne-desc" lang="en" font-family="Arial, Helvetica, sans-serif" style="display:block;width:100%;max-width:480px;height:auto;margin:0 auto;isolation:isolate"><rect x="0" y="0" width="480" height="624" fill="#0b0d10"/>
<title id="bb4-en-moyenne-title">One day in a monthly average</title><desc id="bb4-en-moyenne-desc">Sensitivity calculation, not historical prices: a simple average of 19 values. Adding $1 per barrel to one value while leaving the other 18 unchanged adds $1/19, or $0.05263158, approximately 5.26 US cents per barrel, to the average. Adding $1 to all 19 values adds $1 to the average. This is not an estimate of the 2017 distortion.</desc>
<style>#bb4-en-moyenne{color:#e7e9ee;}#bb4-en-moyenne text{fill:currentColor}#bb4-en-moyenne .b-bg{fill:#121419}#bb4-en-moyenne .b-bar{fill:#5eead4}#bb4-en-moyenne .b-soft{fill:#171a20}#bb4-en-moyenne .b-rule{stroke:#8b909b;fill:none}#bb4-en-moyenne .b-arrow{stroke:#5eead4}#bb4-en-moyenne .b-outline{fill:none;stroke:#5eead4;stroke-width:1.5}#bb4-en-moyenne .b-muted{opacity:.88}#bb4-en-moyenne .b-value{font-variant-numeric:tabular-nums}@media print{#bb4-en-moyenne{color:#e7e9ee;}}</style>
<rect x="0" y="0" width="480" height="624" rx="8" class="b-bg"/>
