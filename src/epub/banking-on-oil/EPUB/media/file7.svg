<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" id="bb3-en-paiements" viewBox="0 0 480 760" width="480" height="760" role="img" aria-labelledby="bb3-en-paiements-title bb3-en-paiements-desc" lang="en" font-family="Arial, Helvetica, sans-serif" style="display:block;width:100%;max-width:480px;height:auto;margin:0 auto;isolation:isolate"><rect x="0" y="0" width="480" height="760" fill="#0b0d10"/>
<title id="bb3-en-paiements-title">The payment sequence</title><desc id="bb3-en-paiements-desc">2023 route: public oil sale to Glencore, SHT account at Citibank, operating priorities, debt-related payments, and the Treasury balance. Equal-sized steps do not represent amounts. Some public oil flows follow other routes. EITI could not independently verify actual account movements in the relevant section.</desc>
<style>#bb3-en-paiements{color:#e7e9ee;}#bb3-en-paiements text{fill:currentColor}#bb3-en-paiements .b-bg{fill:#121419}#bb3-en-paiements .b-bar{fill:#5eead4}#bb3-en-paiements .b-soft{fill:#171a20}#bb3-en-paiements .b-rule{stroke:#8b909b;fill:none}#bb3-en-paiements .b-outline{fill:#171a20;stroke:#5eead4;stroke-width:2}#bb3-en-paiements .b-proj{fill:none;stroke:#5eead4;stroke-width:2;stroke-dasharray:6 4}#bb3-en-paiements .b-muted{opacity:.84}#bb3-en-paiements .b-kicker{fill:#5eead4}#bb3-en-paiements .b-value{font-variant-numeric:tabular-nums}@media print{#bb3-en-paiements{color:#e7e9ee;}}</style>
<rect class="b-bg" width="480" height="760" rx="10"/>
<text x="24" y="43" font-size="28" font-weight="700" text-anchor="start">The payment sequence</text><text x="24" y="78" font-size="19" font-weight="400" text-anchor="start" class="b-muted">The route described by EITI for 2023</text><rect x="24" y="105" width="432.000" height="102" class="b-soft" rx="5"/><text x="40" y="133" font-size="16" font-weight="700" text-anchor="start" class="b-kicker">SALE</text><text x="40" y="163" font-size="21" font-weight="500" text-anchor="start">Government oil sold to Glencore</text><path d="M240 211 v11 m-5 -4 l5 5 5 -5" class="b-rule" stroke-width="2"/><rect x="24" y="229" width="432.000" height="102" class="b-soft" rx="5"/><text x="40" y="257" font-size="16" font-weight="700" text-anchor="start" class="b-kicker">DEDICATED ACCOUNT</text><text x="40" y="287" font-size="21" font-weight="500" text-anchor="start">SHT account at Citibank</text><path d="M240 335 v11 m-5 -4 l5 5 5 -5" class="b-rule" stroke-width="2"/><rect x="24" y="353" width="432.000" height="102" class="b-soft" rx="5"/><text x="40" y="381" font-size="16" font-weight="700" text-anchor="start" class="b-kicker">OPERATING PRIORITIES</text><text x="40" y="411" font-size="21" font-weight="500" text-anchor="start">Oil costs, transport</text><text x="40" y="438" font-size="21" font-weight="500" text-anchor="start">and other priority deductions</text><path d="M240 459 v11 m-5 -4 l5 5 5 -5" class="b-rule" stroke-width="2"/><rect x="24" y="477" width="432.000" height="102" class="b-soft" rx="5"/><text x="40" y="505" font-size="16" font-weight="700" text-anchor="start" class="b-kicker">FINANCING PAYMENTS</text><text x="40" y="535" font-size="21" font-weight="500" text-anchor="start">Debt, interest, fees</text><text x="40" y="562" font-size="21" font-weight="500" text-anchor="start">and contingent payments</text><path d="M240 583 v11 m-5 -4 l5 5 5 -5" class="b-rule" stroke-width="2"/><rect x="24" y="601" width="432.000" height="102" class="b-soft" rx="5"/><text x="40" y="629" font-size="16" font-weight="700" text-anchor="start" class="b-kicker">REMAINDER</text><text x="40" y="659" font-size="21" font-weight="500" text-anchor="start">Balance allocated to the Treasury</text><text x="24" y="737" font-size="18" font-weight="400" text-anchor="start" class="b-muted">Simplified route · no monetary scale</text>
</svg>
