<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" id="bb2-en-facilities" viewBox="0 0 480 676" width="480" height="676" role="img" aria-labelledby="bb2-en-facilities-title bb2-en-facilities-desc" lang="en" font-family="Arial, Helvetica, sans-serif" style="display:block;width:100%;max-width:480px;height:auto;margin:0 auto;isolation:isolate"><rect x="0" y="0" width="480" height="676" fill="#0b0d10"/>
<title id="bb2-en-facilities-title">Announced credit limits</title><desc id="bb2-en-facilities-desc">10 March 2026. European facilities: $1.8 billion for 365 days, $3.5 billion for three years and $0.5 billion for five years; total $5.8 billion. Separate backstop: $3 billion for an initial six months. Bars share a zero-based scale; these are not drawn amounts.</desc>
<style>#bb2-en-facilities{color:#e7e9ee;}#bb2-en-facilities text{fill:currentColor}#bb2-en-facilities .b-bg{fill:#121419}#bb2-en-facilities .b-bar{fill:#5eead4}#bb2-en-facilities .b-soft{fill:#171a20}#bb2-en-facilities .b-rule{stroke:#8b909b;fill:none}#bb2-en-facilities .b-muted{opacity:.83}#bb2-en-facilities .b-value{font-variant-numeric:tabular-nums}@media print{#bb2-en-facilities{color:#e7e9ee;}}</style>
<rect class="b-bg" width="480" height="676" rx="10"/>
<text x="24" y="42" font-size="28" font-weight="700" text-anchor="start">Announced credit limits</text><text x="24" y="77" font-size="20" font-weight="400" text-anchor="start" class="b-muted">10 March 2026 · US dollars, billions</text><text x="24" y="121" font-size="19" font-weight="700" text-anchor="start">EUROPEAN FACILITIES</text><text x="24" y="166" font-size="32" font-weight="700" text-anchor="start">$5.8bn in total</text><text x="24" y="210" font-size="23" font-weight="600" text-anchor="start">365 days</text><line x1="24" x2="344" y1="234" y2="234" class="b-rule" stroke-width="1"/><rect x="24" y="226" width="144.00" height="16" class="b-bar"/><text x="456" y="242" font-size="24" font-weight="700" text-anchor="end" class="b-value">1.8</text><text x="24" y="294" font-size="23" font-weight="600" text-anchor="start">3 years</text><line x1="24" x2="344" y1="318" y2="318" class="b-rule" stroke-width="1"/><rect x="24" y="310" width="280.00" height="16" class="b-bar"/><text x="456" y="326" font-size="24" font-weight="700" text-anchor="end" class="b-value">3.5</text><text x="24" y="378" font-size="23" font-weight="600" text-anchor="start">5 years</text><line x1="24" x2="344" y1="402" y2="402" class="b-rule" stroke-width="1"/><rect x="24" y="394" width="40.00" height="16" class="b-bar"/><text x="456" y="410" font-size="24" font-weight="700" text-anchor="end" class="b-value">0.5</text><path d="M24 442 H456" class="b-rule" stroke-width="1"/><text x="24" y="480" font-size="19" font-weight="700" text-anchor="start">SEPARATE BACKSTOP</text><text x="24" y="513" font-size="23" font-weight="600" text-anchor="start">Initial six-month tenor</text><line x1="24" x2="344" y1="537" y2="537" class="b-rule" stroke-width="1"/><rect x="24" y="529" width="240" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="6 4"/><text x="456" y="545" font-size="24" font-weight="700" text-anchor="end" class="b-value">3.0</text><path d="M24 578 H344" class="b-rule" stroke-width="1"/><path d="M24 575 V583" class="b-rule" stroke-width="1"/><text x="24" y="607" font-size="20" font-weight="400" text-anchor="middle" class="b-muted">0</text><path d="M104 575 V583" class="b-rule" stroke-width="1"/><text x="104" y="607" font-size="20" font-weight="400" text-anchor="middle" class="b-muted">1</text><path d="M184 575 V583" class="b-rule" stroke-width="1"/><text x="184" y="607" font-size="20" font-weight="400" text-anchor="middle" class="b-muted">2</text><path d="M264 575 V583" class="b-rule" stroke-width="1"/><text x="264" y="607" font-size="20" font-weight="400" text-anchor="middle" class="b-muted">3</text><path d="M344 575 V583" class="b-rule" stroke-width="1"/><text x="344" y="607" font-size="20" font-weight="400" text-anchor="middle" class="b-muted">4</text><text x="24" y="647" font-size="21" font-weight="600" text-anchor="start">Credit limits, not cash disbursements.</text></svg>
