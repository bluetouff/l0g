<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="bdb6-svg" viewBox="0 0 540 678" width="540" height="678" style="width:100%;height:auto" focusable="false" role="img" aria-labelledby="bdb6-en-fig2-title bdb6-en-fig2-desc" data-figure="2"><rect x="0" y="0" width="540" height="678" fill="#0b0d10"/>
<style>.bdb6-svg{background:#0b0d10;color:#e7e9ee}</style>
<title id="bdb6-en-fig2-title">Citi’s exit and the inspections</title>
<desc id="bdb6-en-fig2-desc">27 October 2022: Citi stops UIL-related financing. After 4 November, once its positions have matured, Trafigura funds the business itself. The 9 November Rotterdam inspection finds apparent steel; eight further containers inspected on 22 December contain steel. Event spacing does not measure duration.</desc>
<text x="28" y="38" text-anchor="start" style="font-family:ui-monospace,monospace;font-size:18px;font-weight:600;fill:#5eead4">02 / AUTUMN 2022</text>
<text x="28" y="73" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:26px;font-weight:700;fill:#f5f6f8">The bank exits before</text>
<text x="28" y="116" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:26px;font-weight:700;fill:#f5f6f8">the physical discovery</text>
<line x1="46" y1="168" x2="46" y2="557" style="stroke:rgba(255,255,255,.22);stroke-width:2"/>
<circle cx="46" cy="170" r="7" style="fill:#5eead4;stroke:#0b0d10;stroke-width:3"/>
<text x="73" y="175" text-anchor="start" style="font-family:ui-monospace,monospace;font-size:19px;font-weight:650;fill:#5eead4">27 OCTOBER</text>
<text x="73" y="209" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:21px;font-weight:400;fill:#e7e9ee">Citi stops financing</text>
<text x="73" y="239" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:21px;font-weight:400;fill:#e7e9ee">the UIL-related trades.</text>
<circle cx="46" cy="298" r="7" style="fill:#5eead4;stroke:#0b0d10;stroke-width:3"/>
<text x="73" y="303" text-anchor="start" style="font-family:ui-monospace,monospace;font-size:19px;font-weight:650;fill:#5eead4">AFTER 4 NOVEMBER</text>
<text x="73" y="337" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:21px;font-weight:400;fill:#e7e9ee">Trafigura funds the outstanding</text>
<text x="73" y="367" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:21px;font-weight:400;fill:#e7e9ee">buy-back business itself.</text>
<circle cx="46" cy="426" r="7" style="fill:#ff4d87;stroke:#0b0d10;stroke-width:3"/>
<text x="73" y="431" text-anchor="start" style="font-family:ui-monospace,monospace;font-size:19px;font-weight:650;fill:#ff4d87">9 NOVEMBER</text>
<text x="73" y="465" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:21px;font-weight:400;fill:#e7e9ee">First Rotterdam sample:</text>
<text x="73" y="495" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:21px;font-weight:400;fill:#e7e9ee">apparent steel, not nickel.</text>
<circle cx="46" cy="554" r="7" style="fill:#ff4d87;stroke:#0b0d10;stroke-width:3"/>
<text x="73" y="559" text-anchor="start" style="font-family:ui-monospace,monospace;font-size:19px;font-weight:650;fill:#ff4d87">22 DECEMBER</text>
<text x="73" y="593" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:21px;font-weight:400;fill:#e7e9ee">Eight more containers inspected:</text>
<text x="73" y="623" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:21px;font-weight:400;fill:#e7e9ee">steel, not the promised nickel.</text>
<text x="28" y="652" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:18px;font-weight:400;fill:#a1a1aa">Ordered events · spacing is not proportional</text>
</svg>
