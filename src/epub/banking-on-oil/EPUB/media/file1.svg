<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" id="bdb1-en-cash" viewBox="0 0 480 835" width="480" height="835" role="img" aria-labelledby="bdb1-en-cash-title bdb1-en-cash-desc" lang="en" style="display:block;width:100%;max-width:480px;height:auto;margin:0 auto;isolation:isolate" font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="480" height="835" fill="#0b0d10"/><title id="bdb1-en-cash-title">Reaching net operating cash flow</title><desc id="bdb1-en-cash-desc">Trafigura consolidated group, 1 October 2025 to 31 March 2026. US dollars in billions, unaudited. Operating cash flow before working-capital changes: plus 7.883. Working-capital changes including derivatives: minus 13.860. Net interest, tax and dividends received: minus 1.062. Net operating cash flow: minus 7.039. Accounting reconciliation, not drawn to scale. Source: 2026 half-year report, printed page 14.</desc><rect x="0" y="0" width="480" height="835" rx="16" fill="#121419"/><text x="24" y="39" font-size="22" font-weight="700" fill="#5eead4" text-anchor="start">02 / TRAFIGURA</text><text x="24" y="82" font-size="27" font-weight="700" fill="#e7e9ee"><tspan x="24" dy="0">From pre-working-capital</tspan><tspan x="24" dy="34">flow to net operating cash</tspan></text><text x="24" y="158" font-size="22" font-weight="400" fill="#8b909b" text-anchor="start">October 2025 – March 2026</text><text x="24" y="189" font-size="22" font-weight="400" fill="#8b909b" text-anchor="start">Group • USD billions</text><rect x="24" y="213" width="432" height="119" rx="10" fill="#171a20"/><text x="42" y="242" font-size="22" font-weight="400" fill="#e7e9ee"><tspan x="42" dy="0">Before changes in</tspan><tspan x="42" dy="27">working capital</tspan></text><text x="42" y="312" font-size="34" font-weight="700" fill="#5eead4" text-anchor="start">+7.883</text><path d="M240 335 v10 m-5 -5 l5 5 5 -5" fill="none" stroke="#47505c" stroke-width="2"/><rect x="24" y="350" width="432" height="119" rx="10" fill="#171a20"/><text x="42" y="379" font-size="22" font-weight="400" fill="#e7e9ee"><tspan x="42" dy="0">Inventory, receivables, payables,</tspan><tspan x="42" dy="27">prepayments; derivatives included</tspan></text><text x="42" y="449" font-size="34" font-weight="700" fill="#5eead4" text-anchor="start">−13.860</text><path d="M240 472 v10 m-5 -5 l5 5 5 -5" fill="none" stroke="#47505c" stroke-width="2"/><rect x="24" y="487" width="432" height="119" rx="10" fill="#171a20"/><text x="42" y="516" font-size="22" font-weight="400" fill="#e7e9ee"><tspan x="42" dy="0">Interest, tax and dividends</tspan><tspan x="42" dy="27">Net effect of these flows</tspan></text><text x="42" y="586" font-size="34" font-weight="700" fill="#5eead4" text-anchor="start">−1.062</text><path d="M240 609 v10 m-5 -5 l5 5 5 -5" fill="none" stroke="#47505c" stroke-width="2"/><rect x="24" y="624" width="432" height="119" rx="10" fill="#5eead4"/><text x="42" y="653" font-size="22" font-weight="400" fill="#0c0d10"><tspan x="42" dy="0">Net operating cash flow</tspan></text><text x="42" y="723" font-size="34" font-weight="700" fill="#0c0d10" text-anchor="start">−7.039</text><text x="24" y="779" font-size="22" font-weight="400" fill="#8b909b"><tspan x="24" dy="0">Reconciliation; not drawn to scale.</tspan><tspan x="24" dy="28">Unaudited data.</tspan></text></svg>
