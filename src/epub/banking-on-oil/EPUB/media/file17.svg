<rect x="28" y="280" width="66.55" height="26" rx="0" style="fill:#5eead4;" />
<text x="28" y="361" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:21px;font-weight:400;fill:#e7e9ee">Aluminium ingots</text>
<text x="511" y="361" text-anchor="end" style="font-family:ui-monospace,monospace;font-size:25px;font-weight:700;fill:#5eead4">3</text>
