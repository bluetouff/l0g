<style>.bdb6-svg{background:#0b0d10;color:#e7e9ee}</style>
<title id="bdb6-en-fig3-title">Contents of the 91 main cargoes</title>
<desc id="bdb6-en-fig3-desc">Judgment paragraph 212(1) records 77 cargoes of stainless-steel plates or sheets, 11 of iron briquettes and 3 of aluminium ingots, totalling 91 main trades within 107 disputed trades. Bars start at zero and represent counts, not volume, weight or value.</desc>
<text x="28" y="38" text-anchor="start" style="font-family:ui-monospace,monospace;font-size:18px;font-weight:600;fill:#5eead4">03 / THE CARGO FINDINGS</text>
<text x="28" y="79" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:26px;font-weight:700;fill:#f5f6f8">The 91 main cargoes</text>
<text x="28" y="116" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:19px;font-weight:400;fill:#a1a1aa">Unit: number of cargoes / trades</text>
<text x="28" y="169" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:21px;font-weight:400;fill:#e7e9ee">Stainless-steel plates / sheets</text>
<text x="511" y="169" text-anchor="end" style="font-family:ui-monospace,monospace;font-size:25px;font-weight:700;fill:#5eead4">77</text>
