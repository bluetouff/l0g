<svg xmlns="http://www.w3.org/2000/svg" id="bdb1-en-liquidity" viewBox="0 0 480 658" width="480" height="658" role="img" aria-labelledby="bdb1-en-liquidity-title bdb1-en-liquidity-desc" lang="en" style="display:block;width:100%;max-width:480px;height:auto;margin:0 auto;isolation:isolate" font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="480" height="658" fill="#0b0d10"/><title id="bdb1-en-liquidity-title">Reported liquidity resources</title><desc id="bdb1-en-liquidity-desc">Trafigura at 31 March 2026. Management-reported liquidity of 19.4 billion US dollars comprises 7.7 billion of immediately available cash and 11.7 billion of undrawn committed facilities. The 3 billion contingent facility is already included in facilities and in the total. A credit facility is not cash. Source: financial review published 4 June 2026.</desc><rect x="0" y="0" width="480" height="658" rx="16" fill="#121419"/><defs><pattern id="bdb1-en-liquidity-hatch" width="8" height="8" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="8" height="8" rx="0" fill="#171a20"/><path d="M-2 2 L2 -2 M0 8 L8 0 M6 10 L10 6" stroke="#47505c" stroke-width="1"/></pattern></defs><text x="24" y="39" font-size="22" font-weight="700" fill="#5eead4" text-anchor="start">03 / TRAFIGURA</text><text x="24" y="82" font-size="28" font-weight="700" fill="#e7e9ee" text-anchor="start">Liquidity resources</text><text x="24" y="122" font-size="22" font-weight="400" fill="#8b909b" text-anchor="start">31 March 2026 • USD billions</text><text x="24" y="195" font-size="57" font-weight="700" fill="#e7e9ee" text-anchor="start">19.4</text><text x="188" y="188" font-size="22" font-weight="400" fill="#8b909b" text-anchor="start">Reported total</text><rect x="24" y="223" width="171.4639175257732" height="32" rx="0" fill="#5eead4"/><rect x="195.4639175257732" y="223" width="260.53608247422676" height="32" rx="0" fill="url(#bdb1-en-liquidity-hatch)"/><rect x="24" y="292" width="13" height="13" rx="2" fill="#5eead4"/><text x="52" y="316" font-size="36" font-weight="700" fill="#5eead4" text-anchor="start">7.7</text><text x="52" y="352" font-size="22" font-weight="400" fill="#e7e9ee"><tspan x="52" dy="0">Immediately available</tspan><tspan x="52" dy="28">cash</tspan></text><rect x="24" y="416" width="13" height="13" rx="0" fill="url(#bdb1-en-liquidity-hatch)" stroke="#47505c"/><text x="52" y="440" font-size="36" font-weight="700" fill="#e7e9ee" text-anchor="start">11.7</text><text x="52" y="476" font-size="22" font-weight="400" fill="#e7e9ee"><tspan x="52" dy="0">Undrawn committed</tspan><tspan x="52" dy="28">credit facilities</tspan></text><rect x="24" y="544" width="432" height="91" rx="10" fill="#171a20"/><text x="42" y="576" font-size="22" font-weight="400" fill="#e7e9ee"><tspan x="42" dy="0">The $3bn contingent facility</tspan><tspan x="42" dy="29">is already included in the total.</tspan></text></svg>
