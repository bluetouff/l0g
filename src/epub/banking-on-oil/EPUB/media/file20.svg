<text x="338.0" y="469" text-anchor="middle" style="font-family:ui-monospace,monospace;font-size:18px;font-weight:400;fill:#a1a1aa">300</text>
<line x1="486.0" y1="226" x2="486.0" y2="438" style="stroke:rgba(255,255,255,.12);stroke-width:1"/>
<text x="486.0" y="469" text-anchor="middle" style="font-family:ui-monospace,monospace;font-size:18px;font-weight:400;fill:#a1a1aa">450</text>
<text x="42" y="177" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:23px;font-weight:600;fill:#f5f6f8">Federal government</text>
