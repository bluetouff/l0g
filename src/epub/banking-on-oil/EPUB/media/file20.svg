<title id="bdb7-en-fig3-title">Allocation of the agreed Brazilian payments</title>
<desc id="bdb7-en-fig3-desc">Agreed allocation in Brazil’s March 2025 Annex III: R$367,158,685.65 to the federal government as two fines and R$68,251,986.61 to Petrobras, including R$15,073,685.62 in damages. Total R$435,410,672.26. Both bars start at zero on the same scale; display rounded to three decimal places in millions. Contractual allocation, not verified cash receipts.</desc>
<text x="28" y="38" text-anchor="start" style="font-family:ui-monospace,monospace;font-size:18px;font-weight:600;fill:#5eead4">03 / BRAZILIAN AGREEMENT</text>
<text x="28" y="79" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:26px;font-weight:700;fill:#f5f6f8">The agreed recipients</text>
<text x="28" y="114" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:20px;font-weight:400;fill:#a1a1aa">March 2025 · million Brazilian reais</text>
