<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" id="bb4-fr-moyenne" viewBox="0 0 480 624" width="480" height="624" role="img" aria-labelledby="bb4-fr-moyenne-title bb4-fr-moyenne-desc" lang="fr" font-family="Arial, Helvetica, sans-serif" style="display:block;width:100%;max-width:480px;height:auto;margin:0 auto;isolation:isolate"><rect x="0" y="0" width="480" height="624" fill="#0b0d10"/>
<title id="bb4-fr-moyenne-title">Le poids d’une journée</title><desc id="bb4-fr-moyenne-desc">Calcul de sensibilité, sans prix historique : moyenne simple de 19 valeurs. Ajouter 1 dollar par baril à une seule valeur et laisser les 18 autres inchangées ajoute 1/19 dollar, soit 0,05263158 dollar ou environ 5,26 cents américains par baril, à la moyenne. Ajouter 1 dollar aux 19 valeurs ajoute 1 dollar à la moyenne. Ce n’est pas une estimation de la manipulation de 2017.</desc>
<style>#bb4-fr-moyenne{color:#e7e9ee;}#bb4-fr-moyenne text{fill:currentColor}#bb4-fr-moyenne .b-bg{fill:#121419}#bb4-fr-moyenne .b-bar{fill:#5eead4}#bb4-fr-moyenne .b-soft{fill:#171a20}#bb4-fr-moyenne .b-rule{stroke:#8b909b;fill:none}#bb4-fr-moyenne .b-arrow{stroke:#5eead4}#bb4-fr-moyenne .b-outline{fill:none;stroke:#5eead4;stroke-width:1.5}#bb4-fr-moyenne .b-muted{opacity:.88}#bb4-fr-moyenne .b-value{font-variant-numeric:tabular-nums}@media print{#bb4-fr-moyenne{color:#e7e9ee;}}</style>
<rect x="0" y="0" width="480" height="624" rx="8" class="b-bg"/>
<text x="24" y="42" font-size="26" font-weight="700" text-anchor="start">Le poids d’une journée</text><text x="24" y="76" font-size="17" font-weight="400" text-anchor="start" class="b-muted">19 valeurs · variation en dollars par baril</text><text x="24" y="123" font-size="23" font-weight="700" text-anchor="start">+1 $ sur une seule valeur</text><rect x="32" y="145" width="18" height="23" rx="0" class="b-bar"/><rect x="54" y="145" width="18" height="23" rx="0" class="b-outline"/><rect x="76" y="145" width="18" height="23" rx="0" class="b-outline"/><rect x="98" y="145" width="18" height="23" rx="0" class="b-outline"/><rect x="120" y="145" width="18" height="23" rx="0" class="b-outline"/><rect x="142" y="145" width="18" height="23" rx="0" class="b-outline"/><rect x="164" y="145" width="18" height="23" rx="0" class="b-outline"/><rect x="186" y="145" width="18" height="23" rx="0" class="b-outline"/><rect x="208" y="145" width="18" height="23" rx="0" class="b-outline"/><rect x="230" y="145" width="18" height="23" rx="0" class="b-outline"/><rect x="252" y="145" width="18" height="23" rx="0" class="b-outline"/><rect x="274" y="145" width="18" height="23" rx="0" class="b-outline"/><rect x="296" y="145" width="18" height="23" rx="0" class="b-outline"/><rect x="318" y="145" width="18" height="23" rx="0" class="b-outline"/><rect x="340" y="145" width="18" height="23" rx="0" class="b-outline"/><rect x="362" y="145" width="18" height="23" rx="0" class="b-outline"/><rect x="384" y="145" width="18" height="23" rx="0" class="b-outline"/><rect x="406" y="145" width="18" height="23" rx="0" class="b-outline"/><rect x="428" y="145" width="18" height="23" rx="0" class="b-outline"/><text x="24" y="210" font-size="21" font-weight="400" text-anchor="start" class="b-muted">1 ÷ 19</text><text x="24" y="253" font-size="35" font-weight="700" text-anchor="start" class="b-value">+0,05263 $/baril</text><text x="24" y="285" font-size="21" font-weight="400" text-anchor="start">dans la moyenne mensue