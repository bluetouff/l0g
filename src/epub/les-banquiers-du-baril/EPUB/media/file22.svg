<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="bdb8-svg" viewBox="0 0 420 975" style="width:100%;height:auto;background:#0b0d10" focusable="false" role="img" aria-labelledby="bdb8-fr-fig2-title bdb8-fr-fig2-desc" data-figure="2"><rect x="0" y="0" width="420" height="975" fill="#0b0d10"/>
<title id="bdb8-fr-fig2-title">Conditions de transmission vers une livraison</title>
<desc id="bdb8-fr-fig2-desc">Un besoin de financement peut dépasser les ressources mobilisables. Un financement additionnel ou un autre acteur peut préserver la livraison. Le risque de rupture apparaît si ce relais manque ou arrive trop tard. Schéma analytique, sans probabilité ni volume attribué.</desc>
<text x="24" y="38" text-anchor="start" font-size="20" style="font-family:ui-monospace,monospace;font-size:20px;font-weight:600;fill:#5eead4">02 / TRANSMISSION</text>
<text x="24" y="78" text-anchor="start" font-size="25" style="font-family:system-ui,sans-serif;font-size:25px;font-weight:650;fill:#f5f6f8">Du paiement à la livraison</text>
<text x="24" y="112" text-anchor="start" font-size="20" style="font-family:system-ui,sans-serif;font-size:20px;font-weight:400;fill:#f5b13d">Scénario conditionnel, non observé</text>
<rect x="24" y="143" width="372" height="125" rx="6" style="fill:#171a20;stroke:#424751;stroke-width:1.2;" />
<text x="44" y="178" text-anchor="start" font-size="23" style="font-family:system-ui,sans-serif;font-size:23px;font-weight:650;fill:#f5f6f8">1. Besoin de financement</text>
<text x="44" y="211" text-anchor="start" font-size="20" style="font-family:system-ui,sans-serif;font-size:20px;font-weight:400;fill:#e7e9ee">Achats plus chers, recettes</text>
<text x="44" y="239" text-anchor="start" font-size="20" style="font-family:system-ui,sans-serif;font-size:20px;font-weight:400;fill:#e7e9ee">tardives ou appels de marge.</text>
<line x1="210" y1="270" x2="210" y2="300" style="stroke:#5eead4;stroke-width:1.8"/><path d="M 205 299 L 210 307 L 215 299" style="fill:none;stroke:#5eead4;stroke-width:1.8"/>
<rect x="24" y="311" width="372" height="125" rx="6" style="fill:#171a20;stroke:#424751;stroke-width:1.2;" />
<text x="44" y="348" text-anchor="start" font-size="23" style="font-family:system-ui,sans-serif;font-size:23px;font-weight:650;fill:#f5f6f8">2. Limite atteinte</text>
<text x="44" y="381" text-anchor="start" font-size="20" style="font-family:system-ui,sans-serif;font-size:20px;font-weight:400;fill:#e7e9ee">Les ressources mobilisables</text>
<text x="44" y="409" text-anchor="start" font-size="20" style="font-family:system-ui,sans-serif;font-size:20px;font-weight:400;fill:#e7e9ee">ne couvrent plus l’échéance.</text>
<line x1="210" y1="438" x2="210" y2="468" style="stroke:#5eead4;stroke-width:1.8"/><path d="M 205 467 L 210 475 L 215 467" style="fill:none;stroke:#5eead4;stroke-width:1.8"/>
<rect x="24" y="479" width="372" height="117" rx="6" style="fill:#171a20;stroke:#424751;stroke-width:1.2;" />
<text x="44" y="515" text-anchor="start" font-size="23" style="font-family:system-ui,sans-serif;font-size:23px;font-weight:650;fill:#f5f6f8">3. Recherche d’un relais</text>
<text x="44" y="548" text-anchor="start" font-size="20" style="font-family:system-ui,sans-serif;font-size:20px;font-weight:400;fill:#e7e9ee">Financement supplémentaire</text>
<text x="44" y="576" text-anchor="start" font-size="20" style="font-family:system-ui,sans-serif;font-size:20px;font-weight:400;fill:#e7e9ee">ou reprise par un tiers.</text>
<line x1="24" y1="629" x2="396" y2="629" style="stroke:#424751;stroke-width:1.3"/>
<text x="24" y="664" text-anchor="start" font-size="20" style="font-family:ui-monospace,monospace;font-size:20px;font-weight:600;fill:#a9adb7">DEUX ISSUES POSSIBLES</text>
<rect x="24" y="686" width="372" height="118" rx="6" style="fill:#171a20;stroke:#5eead4;stroke-width:1.2;" />
<text x="44" y="723" text-anchor="start" font-size="22" style="font-family:system-ui,sans-serif;font-size:22px;font-weight:650;fill:#5eead4">Relais disponible à temps</text>
<text x="44" y="756" text-anchor="start" font-size="20" style="font-family:system-ui,sans-serif;font-size:20px;font-weight:400;fill:#e7e9ee">Livraison maintenue ;</text>
<text x="44" y="784" text-anchor="start" font-size="20" style="font-family:system-ui,sans-serif;font-size:20px;font-weight:400;fill:#e7e9ee">conditions parfois revues.</text>
<rect x="24" y="824" width="372" height="122" rx="6" style="fill:#171a20;stroke:#ff4d87;stroke-width:1.2;" />
<text x="44" y="861" text-anchor="start" font-size="22" style="font-family:system-ui,sans-serif;font-size:22px;font-weight:650;fill:#ff4d87">Relais absent ou tardif</text>
<text x="44" y="894" text-anchor="start" font-size="20" style="font-family:system-ui,sans-serif;font-size:20px;font-weight:400;fill:#e7e9ee">Retard ou réduction</text>
<text x="44" y="922" text-anchor="start" font-size="20" style="font-family:system-ui,sans-serif;font-size:20px;font-weight:400;fill:#e7e9ee">des approvisionnements.</text>
</svg>
