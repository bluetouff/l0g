<svg xmlns="http://www.w3.org/2000/svg" class="bdb7-svg" viewBox="0 0 540 915" style="width:100%;height:auto;" role="img" aria-labelledby="bdb7-fr-fig1-title bdb7-fr-fig1-desc" focusable="false" data-figure="1"><rect x="0" y="0" width="540" height="915" fill="#0b0d10"/>
<title id="bdb7-fr-fig1-title">Le circuit des 390 240 dollars</title>
<desc id="bdb7-fr-fig1-desc">Deux factures de 390 240 dollars : conseil pétrolier le 7 février, carrelages le 10 février. Les transferts suivent un même circuit : Trafigura Singapore verse l’équivalent en euros à l’intermédiaire le 12 février ; celui-ci transfère 390 240 dollars le 17 février vers un compte à Hong Kong, via une institution financière américaine, au bénéfice ultime de responsables de Petrobras. Les factures et les étapes ne doivent pas être additionnées. Source : faits admis, § 38(e)–(i).</desc>
<text x="28" y="38" text-anchor="start" style="font-family:ui-monospace,monospace;font-size:18px;font-weight:600;fill:#5eead4">01 / FACTURES ET VIREMENTS</text>
<text x="28" y="79" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:27px;font-weight:700;fill:#f5f6f8">Le circuit des 390 240 dollars</text>
<text x="28" y="114" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:20px;font-weight:400;fill:#a1a1aa">Février 2014 · faits admis en 2024</text>
<rect x="28" y="138" width="484" height="208" rx="6" style="fill:#171a20;stroke:rgba(255,255,255,.22);stroke-width:1.3;" />
<text x="48" y="171" text-anchor="start" style="font-family:ui-monospace,monospace;font-size:18px;font-weight:650;fill:#f5b13d">JUSTIFICATIFS</text>
<text x="48" y="210" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:21px;font-weight:400;fill:#e7e9ee">7 février : conseil pétrolier</text>
<text x="48" y="242" text-anchor="start" style="font-family:ui-monospace,monospace;font-size:25px;font-weight:650;fill:#ff4d87">390 240 USD</text>
<text x="48" y="286" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:21px;font-weight:400;fill:#e7e9ee">10 février : carrelages brésiliens</text>
<text x="48" y="318" text-anchor="start" style="font-family:ui-monospace,monospace;font-size:25px;font-weight:650;fill:#ff4d87">390 240 USD</text>
<text x="28" y="384" text-anchor="start" style="font-family:ui-monospace,monospace;font-size:18px;font-weight:650;fill:#5eead4">TRANSFERTS</text>
<rect x="54" y="407" width="432" height="96" rx="6" style="fill:#171a20;stroke:rgba(255,255,255,.22);stroke-width:1.3;" />
<text x="76" y="446" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:24px;font-weight:650;fill:#f5f6f8">Trafigura Singapore</text>
<text x="76" y="480" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:21px;font-weight:400;fill:#e7e9ee">12 fév. : équivalent versé en euros</text>
<line x1="270" y1="505" x2="270" y2="534" style="stroke:#5eead4;stroke-width:2"/><path d="M 264 533 L 270 542 L 276 533" style="fill:none;stroke:#5eead4;stroke-width:2"/>
<rect x="54" y="546" width="432" height="74" rx="6" style="fill:#171a20;stroke:rgba(255,255,255,.22);stroke-width:1.3;" />
<text x="76" y="591" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:24px;font-weight:650;fill:#f5f6f8">Intermédiaire</text>
<line x1="270" y1="622" x2="270" y2="651" style="stroke:#5eead4;stroke-width:2"/><path d="M 264 650 L 270 659 L 276 650" style="fill:none;stroke:#5eead4;stroke-width:2"/>
<rect x="54" y="663" width="432" height="122" rx="6" style="fill:#171a20;stroke:rgba(255,255,255,.22);stroke-width:1.3;" />
<text x="76" y="701" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:24px;font-weight:650;fill:#f5f6f8">Compte à Hong Kong</text>
<text x="76" y="733" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:21px;font-weight:600;fill:#5eead4">17 fév. : 390 240 USD</text>
<text x="76" y="769" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:20px;font-weight:400;fill:#a1a1aa">Via une institution financière US</text>
<text x="28" y="820" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:23px;font-weight:650;fill:#f5f6f8">Bénéficiaires visés</text>
<text x="28" y="853" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:21px;font-weight:400;fill:#e7e9ee">Des responsables de Petrobras.</text>
<text x="28" y="886" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:20px;font-weight:400;fill:#a1a1aa">Ventilation individuelle non publiée.</text>
