<svg xmlns="http://www.w3.org/2000/svg" id="bb4-fr-achats" viewBox="0 0 480 642" width="480" height="642" role="img" aria-labelledby="bb4-fr-achats-title bb4-fr-achats-desc" lang="fr" font-family="Arial, Helvetica, sans-serif" style="display:block;width:100%;max-width:480px;height:auto;margin:0 auto;isolation:isolate"><rect x="0" y="0" width="480" height="642" fill="#0b0d10"/>
<title id="bb4-fr-achats-title">Les achats de février 2017</title><desc id="bb4-fr-achats-desc">Selon la décision CFTC du 17 juin 2024 : 80 cargaisons achetées dans la fenêtre MOC en février 2017, totalisant 3,6 millions de barils. La grille représente le volume agrégé par unités de 45 000 barils, pas des navires ni les achats jour par jour. Le volume de l’exposition dérivée excédentaire n’est pas publié.</desc>
<style>#bb4-fr-achats{color:#e7e9ee;}#bb4-fr-achats text{fill:currentColor}#bb4-fr-achats .b-bg{fill:#121419}#bb4-fr-achats .b-bar{fill:#5eead4}#bb4-fr-achats .b-soft{fill:#171a20}#bb4-fr-achats .b-rule{stroke:#8b909b;fill:none}#bb4-fr-achats .b-arrow{stroke:#5eead4}#bb4-fr-achats .b-outline{fill:none;stroke:#5eead4;stroke-width:1.5}#bb4-fr-achats .b-muted{opacity:.88}#bb4-fr-achats .b-value{font-variant-numeric:tabular-nums}@media print{#bb4-fr-achats{color:#e7e9ee;}}</style>
