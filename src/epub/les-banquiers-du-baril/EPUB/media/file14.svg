<svg xmlns="http://www.w3.org/2000/svg" id="bdb5-fr-fig3" class="bdb5-svg" viewBox="0 0 440 355" style="width:100%;height:auto" role="img" aria-labelledby="bdb5-fr-fig3-title bdb5-fr-fig3-desc" focusable="false"><rect x="0" y="0" width="440" height="355" fill="#0b0d10"/><title id="bdb5-fr-fig3-title">Les engagements d’investissement en Afrique du Sud</title><desc id="bdb5-fr-fig3-desc">Le gouvernement annonce 9,85 milliards de rands sur cinq ans et une enveloppe additionnelle de 4 milliards sous condition de faisabilité. Le total potentiel est de 13,85 milliards. Échelle de zéro à quinze milliards de rands. Il ne s’agit pas de dépenses réalisées.</desc><style>.bdb5-svg {background:#0b0d10;color:#f4f4f5;font-family:Arial,Helvetica,sans-serif;display:block;width:100%;height:auto;max-width:520px;margin-inline:auto;overflow:visible;}
.bdb5-ink {fill:#f4f4f5}.bdb5-muted {fill:#a1a1aa}.bdb5-rule {stroke:#3f3f46;stroke-width:1.3;fill:none}.bdb5-blue {fill:#5eead4}.bdb5-blue-soft {fill:#12332f;stroke:#5eead4;stroke-width:1.4}.bdb5-orange {fill:#f59e0b}.bdb5-grey {fill:#71717a}.bdb5-white {fill:#0f1115}.bdb5-conditional {fill:#3a2a12;stroke:#f59e0b;stroke-width:2;stroke-dasharray:6 4}.bdb5-arrow {fill:none;stroke:#a1a1aa;stroke-width:2}.bdb5-arrowhead {fill:#a1a1aa}</style><text font-size="32" font-weight="700" text-anchor="start" class="bdb5-ink"><tspan x="24" y="43">9,85</tspan></text><text font-size="21" font-weight="400" text-anchor="start" class="bdb5-ink"><tspan x="24" y="77">Engagés sur cinq ans</tspan></text><text font-size="32" font-weight="700" text-anchor="start" class="bdb5-ink"><tspan x="282" y="43">+4</tspan></text><text font-size="21" font-weight="400" text-anchor="start" class="bdb5-ink"><tspan x="282" y="77">Conditionnels</tspan></text><rect x="24" y="117" width="257.4133" height="46" class="bdb5-blue" /><rect x="281.4133" y="117" width="104.5333" height="46" class="bdb5-conditional" /><line x1="24" y1="179" x2="416" y2="179" class="bdb5-rule" /><line x1="24.0" y1="179" x2="24.0" y2="187" class="bdb5-rule" /><text font-size="21" font-weight="400" text-anchor="middle" class="bdb5-muted"><tspan x="24.0" y="216">0</tspan></text><line x1="154.66666666666666" y1="179" x2="154.66666666666666" y2="187" class="bdb5-rule" /><text font-size="21" font-weight="400" text-anchor="middle" class="bdb5-muted"><tspan x="154.66666666666666" y="216">5</tspan></text><line x1="285.3333333333333" y1="179" x2="285.3333333333333" y2="187" class="bdb5-rule" /><text font-size="21" font-weight="400" text-anchor="middle" class="bdb5-muted"><tspan x="285.3333333333333" y="216">10</tspan></text><line x1="416.0" y1="179" x2="416.0" y2="187" class="bdb5-rule" /><text font-size="21" font-weight="400" text-anchor="middle" class="bdb5-muted"><tspan x="416.0" y="216">15</tspan></text><text font-size="26" font-weight="700" text-anchor="start" class="bdb5-ink"><tspan x="24" y="263">Total possible : 13,85</tspan></text><text font-size="20" font-weight="400" text-anchor="start" class="bdb5-muted"><tspan x="24" y="297">Milliards de rands, annoncés</tspan><tspan x="24" y="326">le 22 mai 2024 · pas des dépenses réalisées.</tspan></text></svg>
