<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" id="bb4-fr-contrats" viewBox="0 0 480 650" width="480" height="650" role="img" aria-labelledby="bb4-fr-contrats-title bb4-fr-contrats-desc" lang="fr" font-family="Arial, Helvetica, sans-serif" style="display:block;width:100%;max-width:480px;height:auto;margin:0 auto;isolation:isolate"><rect x="0" y="0" width="480" height="650" fill="#0b0d10"/>
<title id="bb4-fr-contrats-title">Du marché aux contrats</title><desc id="bb4-fr-contrats-desc">Schéma simplifié : offres fermes, transactions et autres informations alimentent une évaluation quotidienne Platts. Les contrats physiques peuvent utiliser la référence plus ou moins un différentiel ; des dérivés indexés peuvent l’utiliser pour un règlement en espèces. Les formules et périodes dépendent du contrat. Ce n’est pas une moyenne automatique de toutes les transactions.</desc>
<style>#bb4-fr-contrats{color:#e7e9ee;}#bb4-fr-contrats text{fill:currentColor}#bb4-fr-contrats .b-bg{fill:#121419}#bb4-fr-contrats .b-bar{fill:#5eead4}#bb4-fr-contrats .b-soft{fill:#171a20}#bb4-fr-contrats .b-rule{stroke:#8b909b;fill:none}#bb4-fr-contrats .b-arrow{stroke:#5eead4}#bb4-fr-contrats .b-outline{fill:none;stroke:#5eead4;stroke-width:1.5}#bb4-fr-contrats .b-muted{opacity:.88}#bb4-fr-contrats .b-value{font-variant-numeric:tabular-nums}@media print{#bb4-fr-contrats{color:#e7e9ee;}}</style>
<rect x="0" y="0" width="480" height="650" rx="8" class="b-bg"/>
<text x="24" y="42" font-size="26" font-weight="700" text-anchor="start">Du marché aux contrats</text><text x="24" y="75" font-size="18" font-weight="400" text-anchor="start" class="b-muted">Schéma simplifié · référence USGC HSFO</text><rect x="24" y="100" width="432" height="94" rx="6" class="b-soft"/><text x="240" y="136" font-size="23" font-weight="700" text-anchor="middle">Informations du marché</text><text x="240" y="169" font-size="18" font-weight="400" text-anchor="middle">Offres, transactions, autres données</text><path d="M240 198 L240 223" class="b-arrow" stroke-width="2" fill="none"/><path d="M235 216 L240 223 L245 216" class="b-arrow" stroke-width="2" fill="none"/><rect x="24" y="229" width="432" height="117" rx="6" class="b-soft"/><text x="240" y="262" font-size="23" font-weight="700" text-anchor="middle">Évaluation quotidienne Platts</text><text x="240" y="294" font-size="20" font-weight="400" text-anchor="middle">Un produit, un lieu, une échéance</text><text x="240" y="323" font-size="18" font-weight="400" text-anchor="middle">Informations vérifiées et analysées</text><path d="M240 350 V378 H128 V400 M240 378 H352 V400" class="b-arrow" stroke-width="2" fill="none"/><path d="M128 397 L128 406" class="b-arrow" stroke-width="2" fill="none"/><path d="M123 399 L128 406 L133 399" class="b-arrow" stroke-width="2" fill="none"/><path d="M352 397 L352 406" class="b-arrow" stroke-width="2" fill="none"/><path d="M347 399 L352 406 L357 399" class="b-arrow" stroke-width="2" fill="none"/><rect x="24" y="414" width="208" height="148" rx="6" class="b-soft"/><rect x="248" y="414" width="208" height="148" rx="6" class="b-soft"/><text x="128" y="447" font-size="21" font-weight="700" text-anchor="middle">Vente physique</text><text x="128" y="480" font-size="21" font-weight="400" text-anchor="middle">Référence</text><text x="128" y="508" font-size="21" font-weight="400" text-anchor="middle">± différentiel</text><text x="128" y="539" font-size="18" font-weight="400" text-anchor="middle">selon le contrat</text><text x="352" y="447" font-size="21" font-weight="700" text-anchor="middle">Dérivé indexé</text><text x="352" y="480" font-size="21" font-weight="400" text-anchor="middle">Règlement</text><text x="352" y="508" font-size="21" font-weight="400" text-anchor="middle">en espèces</text><text x="352" y="539" font-size="18" font-weight="400" text-anchor="middle">selon le contrat</text><text x="24" y="596" font-size="17" font-weight="400" text-anchor="start">La formule du contrat transmet le prix.</text><text x="24" y="627" font-size="16" font-weight="400" text-anchor="start" class="b-muted">Le schéma ne retrace pas des flux de barils.</text>
</svg>
