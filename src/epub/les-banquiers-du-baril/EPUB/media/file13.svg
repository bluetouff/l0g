<svg xmlns="http://www.w3.org/2000/svg" id="bdb5-fr-fig2" class="bdb5-svg" viewBox="0 0 440 486" style="width:100%;height:auto" role="img" aria-labelledby="bdb5-fr-fig2-title bdb5-fr-fig2-desc" focusable="false"><rect x="0" y="0" width="440" height="486" fill="#0b0d10"/><title id="bdb5-fr-fig2-title">Les approvisionnements au cœur du dossier Engen</title><desc id="bdb5-fr-fig2-desc">Le schéma juxtapose les produits raffinés par Astron et Sasol et les importations de Vitol. Ils rejoignent le distributeur Engen. L’autorisation de 2024 prévoit des contrats comportant des achats minimums aux raffineries locales. Aucun volume ni part de marché n’est représenté.</desc><style>.bdb5-svg {background:#0b0d10;color:#f4f4f5;font-family:Arial,Helvetica,sans-serif;display:block;width:100%;height:auto;max-width:520px;margin-inline:auto;overflow:visible;}
.bdb5-ink {fill:#f4f4f5}.bdb5-muted {fill:#a1a1aa}.bdb5-rule {stroke:#3f3f46;stroke-width:1.3;fill:none}.bdb5-blue {fill:#5eead4}.bdb5-blue-soft {fill:#12332f;stroke:#5eead4;stroke-width:1.4}.bdb5-orange {fill:#f59e0b}.bdb5-grey {fill:#71717a}.bdb5-white {fill:#0f1115}.bdb5-conditional {fill:#3a2a12;stroke:#f59e0b;stroke-width:2;stroke-dasharray:6 4}.bdb5-arrow {fill:none;stroke:#a1a1aa;stroke-width:2}.bdb5-arrowhead {fill:#a1a1aa}</style><rect x="14" y="18" width="199" height="177" class="bdb5-blue-soft" /><rect x="227" y="18" width="199" height="177" class="bdb5-blue-soft" /><text font-size="24" font-weight="700" text-anchor="start" class="bdb5-ink"><tspan x="28" y="52">Astron / Sasol</tspan></text><text font-size="22" font-weight="400" text-anchor="start" class="bdb5-ink"><tspan x="28" y="87">Raffinage</tspan><tspan x="28" y="114">local</tspan></text><line x1="28" y1="128" x2="196" y2="128" class="bdb5-rule" /><text font-size="19" font-weight="400" text-anchor="start" class="bdb5-ink"><tspan x="28" y="155">Achats minimums</tspan><tspan x="28" y="182">prévus au contrat</tspan></text><text font-size="26" font-weight="700" text-anchor="start" class="bdb5-ink"><tspan x="242" y="52">Vitol</tspan></text><text font-size="22" font-weight="400" text-anchor="start" class="bdb5-ink"><tspan x="242" y="87">Produits</tspan><tspan x="242" y="114">importés</tspan></text><line x1="242" y1="128" x2="409" y2="128" class="bdb5-rule" /><text font-size="21" font-weight="400" text-anchor="start" class="bdb5-ink"><tspan x="242" y="155">Autre canal</tspan><tspan x="242" y="182">de fourniture</tspan></text><path d="M113.5 195 V223 H220 M326.5 195 V223 H220 V255" class="bdb5-arrow"/><path d="M214 250 L220 262 L226 250 Z" class="bdb5-arrowhead"/><rect x="74" y="270" width="292" height="84" class="bdb5-blue-soft" /><text font-size="28" font-weight="700" text-anchor="middle" class="bdb5-ink"><tspan x="220" y="304">Engen</tspan></text><text font-size="22" font-weight="400" text-anchor="middle" class="bdb5-ink"><tspan x="220" y="336">Choix des fournisseurs</tspan></text><line x1="220" y1="354" x2="220" y2="386" class="bdb5-arrow" /><path d="M214 381 L220 393 L226 381 Z" class="bdb5-arrowhead"/><text font-size="25" font-weight="600" text-anchor="middle" class="bdb5-ink"><tspan x="220" y="426">Distribution aux clients</tspan></text><text font-size="21" font-weight="400" text-anchor="middle" class="bdb5-muted"><tspan x="220" y="463">Flux schématiques, sans volumes.</tspan></text></svg>
