<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" id="bdb1-fr-cash" viewBox="0 0 480 835" width="480" height="835" role="img" aria-labelledby="bdb1-fr-cash-title bdb1-fr-cash-desc" lang="fr" style="display:block;width:100%;max-width:480px;height:auto;margin:0 auto;isolation:isolate" font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="480" height="835" fill="#0b0d10"/><title id="bdb1-fr-cash-title">Le passage au cash opérationnel net</title><desc id="bdb1-fr-cash-desc">Trafigura, groupe consolidé, du 1er octobre 2025 au 31 mars 2026. Milliards de dollars, données non auditées. Flux opérationnels avant variations de fonds de roulement : plus 7,883. Variations de fonds de roulement, dérivés compris : moins 13,860. Intérêts, impôts et dividendes reçus : moins 1,062 en net. Flux opérationnel net : moins 7,039. Rapprochement comptable sans échelle graphique. Source : rapport semestriel 2026, page 14.</desc><rect x="0" y="0" width="480" height="835" rx="16" fill="#121419"/><text x="24" y="39" font-size="22" font-weight="700" fill="#5eead4" text-anchor="start">02 / TRAFIGURA</text><text x="24" y="82" font-size="27" font-weight="700" fill="#e7e9ee"><tspan x="24" dy="0">Du flux avant variation</tspan><tspan x="24" dy="34">au cash opérationnel net</tspan></text><text x="24" y="158" font-size="22" font-weight="400" fill="#8b909b" text-anchor="start">Oct. 2025 – mars 2026</text><text x="24" y="189" font-size="22" font-weight="400" fill="#8b909b" text-anchor="start">Groupe • Milliards USD</text><rect x="24" y="213" width="432" height="119" rx="10" fill="#171a20"/><text x="42" y="242" font-size="22" font-weight="400" fill="#e7e9ee"><tspan x="42" dy="0">Flux avant variations</tspan><tspan x="42" dy="27">de fonds de roulement</tspan></text><text x="42" y="312" font-size="34" font-weight="700" fill="#5eead4" text-anchor="start">+7,883</text><path d="M240 335 v10 m-5 -5 l5 5 5 -5" fill="none" stroke="#47505c" stroke-width="2"/><rect x="24" y="350" width="432" height="119" rx="10" fill="#171a20"/><text x="42" y="379" font-size="22" font-weight="400" fill="#e7e9ee"><tspan x="42" dy="0">Stocks, créances et dettes,</tspan><tspan x="42" dy="27">prépaiements ; dérivés inclus</tspan></text><text x="42" y="449" font-size="34" font-weight="700" fill="#5eead4" text-anchor="start">−13,860</text><path d="M240 472 v10 m-5 -5 l5 5 5 -5" fill="none" stroke="#47505c" stroke-width="2"/><rect x="24" y="487" width="432" height="119" rx="10" fill="#171a20"/><text x="42" y="516" font-size="22" font-weight="400" fill="#e7e9ee"><tspan x="42" dy="0">Intérêts, impôts et dividendes</tspan><tspan x="42" dy="27">Solde net de ces flux</tspan></text><text x="42" y="586" font-size="34" font-weight="700" fill="#5eead4" text-anchor="start">−1,062</text><path d="M240 609 v10 m-5 -5 l5 5 5 -5" fill="none" stroke="#47505c" stroke-width="2"/><rect x="24" y="624" width="432" height="119" rx="10" fill="#5eead4"/><text x="42" y="653" font-size="22" font-weight="400" fill="#0c0d10"><tspan x="42" dy="0">Flux opérationnel net</tspan></text><text x="42" y="723" font-size="34" font-weight="700" fill="#0c0d10" text-anchor="start">−7,039</text><text x="24" y="779" font-size="22" font-weight="400" fill="#8b909b"><tspan x="24" dy="0">Rapprochement sans échelle graphique.</tspan><tspan x="24" dy="28">Données non auditées.</tspan></text></svg>
