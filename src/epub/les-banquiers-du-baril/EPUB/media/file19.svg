<title id="bdb7-fr-fig2-title">Amende et confiscation dans l’accord américain</title>
<desc id="bdb7-fr-fig2-desc">L’amende de 80 488 040 dollars et la confiscation de 46 510 257 dollars totalisent 126 998 297 dollars. Jusqu’à 26 829 346 dollars de l’amende peuvent être crédités au titre de paiements au Brésil, selon les conditions de l’accord. Ce crédit, en contour pointillé, est à l’intérieur de l’amende. Les barres partent de zéro ; valeurs affichées arrondies à trois décimales en millions. Le prélèvement de 400 dollars est exclu. Ce ne sont pas des encaissements vérifiés.</desc>
<text x="28" y="38" text-anchor="start" style="font-family:ui-monospace,monospace;font-size:18px;font-weight:600;fill:#5eead4">02 / ACCORD AMÉRICAIN</text>
<text x="28" y="79" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:27px;font-weight:700;fill:#f5f6f8">Amende et confiscation</text>
<text x="28" y="114" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:20px;font-weight:400;fill:#a1a1aa">Mars 2024 · millions de dollars US</text>
