<text x="42" y="278" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:21px;font-weight:400;fill:#f5b13d">Dont crédit possible au Brésil :</text>
<text x="42" y="307" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:21px;font-weight:400;fill:#f5b13d">jusqu’à 26,829 millions.</text>
