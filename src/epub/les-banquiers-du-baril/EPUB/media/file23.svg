<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="bdb8-svg" viewBox="0 0 420 935" style="width:100%;height:auto;background:#0b0d10" focusable="false" role="img" aria-labelledby="bdb8-fr-fig3-title bdb8-fr-fig3-desc" data-figure="3"><rect x="0" y="0" width="420" height="935" fill="#0b0d10"/>
<title id="bdb8-fr-fig3-title">Étapes du travail international sur les marges</title>
<desc id="bdb8-fr-fig3-desc">Le FSB publie ses recommandations le 10 décembre 2024 : les négociants non financiers ne sont pas directement dans le périmètre. Rapports internationaux sur les marges le 15 janvier 2025. Consultation CPMI–IOSCO le 6 mai 2026, réponses au 30 juin. Aucun texte final ultérieur trouvé au 8 septembre pour cette consultation. Ne représente pas tout le droit applicable.</desc>
<text x="24" y="38" text-anchor="start" font-size="20" style="font-family:ui-monospace,monospace;font-size:20px;font-weight:600;fill:#5eead4">03 / CADRES DE PRÉPARATION</text>
<text x="24" y="79" text-anchor="start" font-size="25" style="font-family:system-ui,sans-serif;font-size:25px;font-weight:650;fill:#f5f6f8">Publications et périmètres</text>
<text x="24" y="113" text-anchor="start" font-size="20" style="font-family:system-ui,sans-serif;font-size:20px;font-weight:400;fill:#a9adb7">État documentaire : 8 septembre 2026</text>
<rect x="24" y="143" width="372" height="195" rx="6" style="fill:#171a20;stroke:#5eead4;stroke-width:1.2;" />
<text x="44" y="182" text-anchor="start" font-size="22" style="font-family:ui-monospace,monospace;font-size:22px;font-weight:600;fill:#5eead4">10.12.2024 / FSB</text>
<text x="44" y="222" text-anchor="start" font-size="23" style="font-family:system-ui,sans-serif;font-size:23px;font-weight:650;fill:#f5f6f8">Préparer la trésorerie</text>
<text x="44" y="259" text-anchor="start" font-size="20" style="font-family:system-ui,sans-serif;font-size:20px;font-weight:400;fill:#e7e9ee">Négociants non financiers :</text>
<text x="44" y="288" text-anchor="start" font-size="20" style="font-family:system-ui,sans-serif;font-size:20px;font-weight:400;fill:#e7e9ee">hors périmètre direct ;</text>
<text x="44" y="317" text-anchor="start" font-size="20" style="font-family:system-ui,sans-serif;font-size:20px;font-weight:400;fill:#e7e9ee">adoption possible.</text>
<line x1="210" y1="340" x2="210" y2="371" style="stroke:#a9adb7;stroke-width:1.8"/><path d="M 205 370 L 210 378 L 215 370" style="fill:none;stroke:#a9adb7;stroke-width:1.8"/>
<rect x="24" y="382" width="372" height="188" rx="6" style="fill:#171a20;stroke:#424751;stroke-width:1.2;" />
<text x="44" y="421" text-anchor="start" font-size="20" style="font-family:ui-monospace,monospace;font-size:20px;font-weight:600;fill:#5eead4">15.01.2025 / BCBS–CPMI–IOSCO</text>
<text x="44" y="461" text-anchor="start" font-size="23" style="font-family:system-ui,sans-serif;font-size:23px;font-weight:650;fill:#f5f6f8">Transparence des marges</text>
<text x="44" y="498" text-anchor="start" font-size="20" style="font-family:system-ui,sans-serif;font-size:20px;font-weight:400;fill:#e7e9ee">Rapports et propositions.</text>
<text x="44" y="527" text-anchor="start" font-size="20" style="font-family:system-ui,sans-serif;font-size:20px;font-weight:400;fill:#e7e9ee">Le passage au droit national</text>
<text x="44" y="556" text-anchor="start" font-size="20" style="font-family:system-ui,sans-serif;font-size:20px;font-weight:400;fill:#e7e9ee">reste une étape distincte.</text>
<line x1="210" y1="572" x2="210" y2="603" style="stroke:#a9adb7;stroke-width:1.8"/><path d="M 205 602 L 210 610 L 215 602" style="fill:none;stroke:#a9adb7;stroke-width:1.8"/>
<rect x="24" y="614" width="372" height="214" rx="6" style="fill:#171a20;stroke:#f5b13d;stroke-width:1.2;" />
<text x="44" y="653" text-anchor="start" font-size="21" style="font-family:ui-monospace,monospace;font-size:21px;font-weight:600;fill:#f5b13d">06.05.2026 / CPMI–IOSCO</text>
<text x="44" y="693" text-anchor="start" font-size="23" style="font-family:system-ui,sans-serif;font-size:23px;font-weight:650;fill:#f5f6f8">Consultation publiée</text>
<text x="44" y="730" text-anchor="start" font-size="20" style="font-family:system-ui,sans-serif;font-size:20px;font-weight:400;fill:#e7e9ee">Réponses dues au 30 juin.</text>
<text x="44" y="759" text-anchor="start" font-size="20" style="font-family:system-ui,sans-serif;font-size:20px;font-weight:400;fill:#e7e9ee">Pas de texte final trouvé</text>
<text x="44" y="788" text-anchor="start" font-size="20" style="font-family:system-ui,sans-serif;font-size:20px;font-weight:400;fill:#e7e9ee">dans les sources consultées</text>
<text x="44" y="817" text-anchor="start" font-size="20" style="font-family:system-ui,sans-serif;font-size:20px;font-weight:400;fill:#e7e9ee">au 8 septembre 2026.</text>
<text x="24" y="875" text-anchor="start" font-size="20" style="font-family:system-ui,sans-serif;font-size:20px;font-weight:400;fill:#a9adb7">Repères chronologiques sélectionnés.</text>
<text x="24" y="903" text-anchor="start" font-size="20" style="font-family:system-ui,sans-serif;font-size:20px;font-weight:400;fill:#a9adb7">Espacement sans échelle de temps.</text>
</svg>
