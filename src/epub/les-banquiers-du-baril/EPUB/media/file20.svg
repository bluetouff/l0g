<title id="bdb7-fr-fig3-title">Destination des paiements prévus au Brésil</title>
<desc id="bdb7-fr-fig3-desc">Sommes prévues dans l’annexe III brésilienne de mars 2025 : 367 158 685,65 reais à l’Union au titre de deux amendes et 68 251 986,61 reais à Petrobras, dont 15 073 685,62 reais au titre du dommage. Total 435 410 672,26 reais. Barres à origine zéro et même échelle, valeurs arrondies à trois décimales en millions. Répartition contractuelle, non constat de paiements encaissés.</desc>
<text x="28" y="38" text-anchor="start" style="font-family:ui-monospace,monospace;font-size:18px;font-weight:600;fill:#5eead4">03 / ACCORD BRÉSILIEN</text>
