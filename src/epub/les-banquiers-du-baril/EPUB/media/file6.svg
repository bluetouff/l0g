<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" id="bb3-fr-recettes-2016" viewBox="0 0 480 568" width="480" height="568" role="img" aria-labelledby="bb3-fr-recettes-2016-title bb3-fr-recettes-2016-desc" lang="fr" font-family="Arial, Helvetica, sans-serif" style="display:block;width:100%;max-width:480px;height:auto;margin:0 auto;isolation:isolate"><rect x="0" y="0" width="480" height="568" fill="#0b0d10"/>
<title id="bb3-fr-recettes-2016-title">Les recettes de 2016</title><desc id="bb3-fr-recettes-2016-desc">2016 : 271 millions de dollars de ventes de pétrole public après coûts, dont 231 millions au service de la dette Glencore et 40 millions au Trésor. Calculs : 231/271 = 85,2 %, 40/271 = 14,8 %. Il ne s’agit pas de toutes les recettes du pays.</desc>
<style>#bb3-fr-recettes-2016{color:#e7e9ee;}#bb3-fr-recettes-2016 text{fill:currentColor}#bb3-fr-recettes-2016 .b-bg{fill:#121419}#bb3-fr-recettes-2016 .b-bar{fill:#5eead4}#bb3-fr-recettes-2016 .b-soft{fill:#171a20}#bb3-fr-recettes-2016 .b-rule{stroke:#8b909b;fill:none}#bb3-fr-recettes-2016 .b-outline{fill:#171a20;stroke:#5eead4;stroke-width:2}#bb3-fr-recettes-2016 .b-proj{fill:none;stroke:#5eead4;stroke-width:2;stroke-dasharray:6 4}#bb3-fr-recettes-2016 .b-muted{opacity:.84}#bb3-fr-recettes-2016 .b-value{font-variant-numeric:tabular-nums}@media print{#bb3-fr-recettes-2016{color:#e7e9ee;}}</style>
<rect class="b-bg" width="480" height="568" rx="10"/>
<text x="24" y="43" font-size="28" font-weight="700" text-anchor="start">Les recettes de 2016</text><text x="24" y="78" font-size="19" font-weight="400" text-anchor="start" class="b-muted">Millions de dollars · pétrole public</text><text x="24" y="133" font-size="42" font-weight="700" text-anchor="start">271 M$</text><text x="24" y="166" font-size="21" font-weight="400" text-anchor="start">après exploitation et transport</text><rect x="24" y="193" width="368.236" height="36" class="b-bar" /><rect x="392.2361623616236" y="193" width="63.764" height="36" class="b-outline" /><rect x="24" y="267" width="14.000" height="14" class="b-bar" /><text x="51" y="291" font-size="35" font-weight="700" text-anchor="start">231 M$</text><text x="24" y="327" font-size="22" font-weight="600" text-anchor="start">Service de la dette Glencore</text><text x="24" y="357" font-size="21" font-weight="400" text-anchor="start">85,2 % du flux après coûts</text><line x1="24" y1="381" x2="456" y2="381" class="b-rule" stroke-width="1.2"/><rect x="24" y="409" width="14.000" height="14" class="b-outline" /><text x="51" y="433" font-size="35" font-weight="700" text-anchor="start">40 M$</text><text x="24" y="469" font-size="22" font-weight="600" text-anchor="start">Solde pour le Trésor</text><text x="24" y="499" font-size="21" font-weight="400" text-anchor="start">14,8 % du même flux</text><text x="24" y="544" font-size="18" font-weight="400" text-anchor="start" class="b-muted">Périmètre : ce circuit de ventes uniquement.</text>
</svg>
