<line x1="28" y1="464" x2="512" y2="464" style="stroke:rgba(255,255,255,.22);stroke-width:1.5"/>
<text x="28" y="498" text-anchor="start" style="font-family:ui-monospace,monospace;font-size:23px;font-weight:600;fill:#f5f6f8">77 + 11 + 3 = 91</text>
