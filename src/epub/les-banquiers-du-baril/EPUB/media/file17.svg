<svg xmlns="http://www.w3.org/2000/svg" class="bdb6-svg" viewBox="0 0 540 561" width="540" height="561" style="width:100%;height:auto" focusable="false" role="img" aria-labelledby="bdb6-fr-fig3-title bdb6-fr-fig3-desc" data-figure="3"><rect x="0" y="0" width="540" height="561" fill="#0b0d10"/>
<style>.bdb6-svg{background:#0b0d10;color:#e7e9ee}</style>
<title id="bdb6-fr-fig3-title">Contenu des 91 cargaisons principales</title>
<desc id="bdb6-fr-fig3-desc">Le paragraphe 212(1) du jugement compte 77 cargaisons de plaques ou feuilles d’acier inoxydable, 11 de briquettes de fer et 3 de lingots d’aluminium. Elles totalisent 91 transactions principales parmi les 107 litigieuses. Les barres partent de zéro et représentent un décompte, pas des volumes, masses ou valeurs.</desc>
<text x="28" y="38" text-anchor="start" style="font-family:ui-monospace,monospace;font-size:18px;font-weight:600;fill:#5eead4">03 / INVENTAIRE CONSTATÉ</text>
<text x="28" y="79" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:26px;font-weight:700;fill:#f5f6f8">Les 91 cargaisons principales</text>
<text x="28" y="116" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:19px;font-weight:400;fill:#a1a1aa">Unité : nombre de cargaisons / transactions</text>
<text x="28" y="169" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:21px;font-weight:400;fill:#e7e9ee">Acier inoxydable</text>
<text x="511" y="169" text-anchor="end" style="font-family:ui-monospace,monospace;font-size:25px;font-weight:700;fill:#5eead4">77</text>
<rect x="28" y="184" width="484" height="26" rx="0" style="fill:#171a20;" />
<rect x="28" y="184" width="465.85" height="26" rx="0" style="fill:#5eead4;" />
