<text x="149.0" y="444" text-anchor="middle" style="font-family:ui-monospace,monospace;font-size:18px;font-weight:400;fill:#a1a1aa">20</text>
<line x1="270.0" y1="414" x2="270.0" y2="421" style="stroke:rgba(255,255,255,.22);stroke-width:1.5"/>
