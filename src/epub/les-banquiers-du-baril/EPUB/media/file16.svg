<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="bdb6-svg" viewBox="0 0 540 678" width="540" height="678" style="width:100%;height:auto" focusable="false" role="img" aria-labelledby="bdb6-fr-fig2-title bdb6-fr-fig2-desc" data-figure="2"><rect x="0" y="0" width="540" height="678" fill="#0b0d10"/>
<style>.bdb6-svg{background:#0b0d10;color:#e7e9ee}</style>
<title id="bdb6-fr-fig2-title">La sortie de Citi et les inspections</title>
<desc id="bdb6-fr-fig2-desc">27 octobre 2022 : Citi arrête le financement lié à UIL. Après le 4 novembre, toutes ses positions ayant expiré, Trafigura finance elle-même ces opérations. Le 9 novembre, une inspection à Rotterdam découvre de l’acier apparent ; le 22 décembre, huit autres conteneurs révèlent de l’acier. Les espacements de cette chronologie ne mesurent pas les durées.</desc>
<text x="28" y="38" text-anchor="start" style="font-family:ui-monospace,monospace;font-size:18px;font-weight:600;fill:#5eead4">02 / AUTOMNE 2022</text>
<text x="28" y="73" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:26px;font-weight:700;fill:#f5f6f8">Le retrait bancaire précède</text>
<text x="28" y="116" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:26px;font-weight:700;fill:#f5f6f8">la découverte matérielle</text>
<line x1="46" y1="168" x2="46" y2="557" style="stroke:rgba(255,255,255,.22);stroke-width:2"/>
<circle cx="46" cy="170" r="7" style="fill:#5eead4;stroke:#0b0d10;stroke-width:3"/>
<text x="73" y="175" text-anchor="start" style="font-family:ui-monospace,monospace;font-size:19px;font-weight:650;fill:#5eead4">27 OCTOBRE</text>
<text x="73" y="209" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:21px;font-weight:400;fill:#e7e9ee">Citi arrête le financement</text>
<text x="73" y="239" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:21px;font-weight:400;fill:#e7e9ee">des opérations liées à UIL.</text>
<circle cx="46" cy="298" r="7" style="fill:#5eead4;stroke:#0b0d10;stroke-width:3"/>
<text x="73" y="303" text-anchor="start" style="font-family:ui-monospace,monospace;font-size:19px;font-weight:650;fill:#5eead4">APRÈS LE 4 NOVEMBRE</text>
<text x="73" y="337" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:21px;font-weight:400;fill:#e7e9ee">Trafigura finance elle-même</text>
<text x="73" y="367" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:21px;font-weight:400;fill:#e7e9ee">les opérations en attente.</text>
<circle cx="46" cy="426" r="7" style="fill:#ff4d87;stroke:#0b0d10;stroke-width:3"/>
<text x="73" y="431" text-anchor="start" style="font-family:ui-monospace,monospace;font-size:19px;font-weight:650;fill:#ff4d87">9 NOVEMBRE</text>
<text x="73" y="465" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:21px;font-weight:400;fill:#e7e9ee">Premier échantillon à Rotterdam :</text>
<text x="73" y="495" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:21px;font-weight:400;fill:#e7e9ee">de l’acier apparent, pas du nickel.</text>
<circle cx="46" cy="554" r="7" style="fill:#ff4d87;stroke:#0b0d10;stroke-width:3"/>
<text x="73" y="559" text-anchor="start" style="font-family:ui-monospace,monospace;font-size:19px;font-weight:650;fill:#ff4d87">22 DÉCEMBRE</text>
<text x="73" y="593" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:21px;font-weight:400;fill:#e7e9ee">Huit autres conteneurs contrôlés :</text>
<text x="73" y="623" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:21px;font-weight:400;fill:#e7e9ee">de l’acier, pas le nickel promis.</text>
<text x="28" y="652" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:18px;font-weight:400;fill:#a1a1aa">Dates ordonnées · espacements non proportionnels</text>
</svg>
