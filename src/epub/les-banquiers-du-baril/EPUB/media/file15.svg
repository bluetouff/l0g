<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="bdb6-svg" viewBox="0 0 540 638" width="540" height="638" style="width:100%;height:auto" focusable="false" role="img" aria-labelledby="bdb6-fr-fig1-title bdb6-fr-fig1-desc" data-figure="1"><rect x="0" y="0" width="540" height="638" fill="#0b0d10"/>
<style>.bdb6-svg{background:#0b0d10;color:#e7e9ee}</style>
<title id="bdb6-fr-fig1-title">Deux accords, deux obligations</title>
<desc id="bdb6-fr-fig1-desc">Dans le circuit décrit au jugement, le réseau Gupta vend une cargaison à Trafigura. Un rachat par ce réseau est attendu mais non obligatoire au départ. Si Citi refinance l’opération, elle acquiert le titre, avec l’engagement de Trafigura de reprendre la position à l’échéance. Les flèches indiquent des relations contractuelles, pas le trajet physique ni l’ordre des paiements.</desc>
<text x="28" y="38" text-anchor="start" style="font-family:ui-monospace,monospace;font-size:18px;font-weight:600;fill:#5eead4">01 / FINANCEMENT</text>
<text x="28" y="73" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:28px;font-weight:700;fill:#f5f6f8">Deux accords,</text>
<text x="28" y="116" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:28px;font-weight:700;fill:#f5f6f8">deux obligations</text>
<rect x="28" y="145" width="484" height="155" rx="6" style="fill:#171a20;stroke:rgba(255,255,255,.22);stroke-width:1.2;" />
<text x="48" y="179" text-anchor="start" style="font-family:ui-monospace,monospace;font-size:23px;font-weight:650;fill:#f5f6f8">Gupta → Trafigura</text>
<text x="48" y="215" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:21px;font-weight:400;fill:#e7e9ee">Vente d’une cargaison au négociant.</text>
<text x="48" y="246" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:21px;font-weight:400;fill:#e7e9ee">Rachat ultérieur attendu,</text>
<text x="48" y="277" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:21px;font-weight:400;fill:#e7e9ee">sans obligation initiale.</text>
<line x1="270" y1="302" x2="270" y2="334" style="stroke:#f5b13d;stroke-width:2" stroke-dasharray="5 5"/>
<text x="270" y="368" text-anchor="middle" style="font-family:system-ui,sans-serif;font-size:20px;font-weight:600;fill:#f5b13d">Trafigura assure le lien</text>
<line x1="270" y1="384" x2="270" y2="409" style="stroke:#f5b13d;stroke-width:2" stroke-dasharray="5 5"/>
<rect x="28" y="412" width="484" height="164" rx="6" style="fill:#171a20;stroke:rgba(255,255,255,.22);stroke-width:1.2;" />
<text x="48" y="447" text-anchor="start" style="font-family:ui-monospace,monospace;font-size:23px;font-weight:650;fill:#f5f6f8">Trafigura → Citi</text>
<text x="48" y="483" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:21px;font-weight:400;fill:#e7e9ee">La banque acquiert le titre.</text>
<text x="48" y="514" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:21px;font-weight:400;fill:#e7e9ee">Trafigura s’engage à reprendre</text>
<text x="48" y="545" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:21px;font-weight:400;fill:#e7e9ee">la position à l’échéance.</text>
<text x="28" y="613" text-anchor="start" style="font-family:system-ui,sans-serif;font-size:18px;font-weight:400;fill:#a1a1aa">Schéma simplifié · accords décrits en 2026</text>
</svg>
