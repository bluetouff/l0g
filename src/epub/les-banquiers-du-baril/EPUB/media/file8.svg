<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" id="bb3-fr-dette-projections" viewBox="0 0 480 624" width="480" height="624" role="img" aria-labelledby="bb3-fr-dette-projections-title bb3-fr-dette-projections-desc" lang="fr" font-family="Arial, Helvetica, sans-serif" style="display:block;width:100%;max-width:480px;height:auto;margin:0 auto;isolation:isolate"><rect x="0" y="0" width="480" height="624" fill="#0b0d10"/>
<title id="bb3-fr-dette-projections-title">Encours et projections</title><desc id="bb3-fr-dette-projections-desc">Dette classée Glencore dans le rapport FMI d’août 2025 : 191 millions de dollars à fin 2024, puis projections de 131 millions fin 2025, 131 millions fin 2026 et 71 millions fin 2027. La barre pleine représente une situation passée rapportée ; les barres à contour discontinu sont des projections. Échelle commune de zéro à 200 millions.</desc>
<style>#bb3-fr-dette-projections{color:#e7e9ee;}#bb3-fr-dette-projections text{fill:currentColor}#bb3-fr-dette-projections .b-bg{fill:#121419}#bb3-fr-dette-projections .b-bar{fill:#5eead4}#bb3-fr-dette-projections .b-soft{fill:#171a20}#bb3-fr-dette-projections .b-rule{stroke:#8b909b;fill:none}#bb3-fr-dette-projections .b-outline{fill:#171a20;stroke:#5eead4;stroke-width:2}#bb3-fr-dette-projections .b-proj{fill:none;stroke:#5eead4;stroke-width:2;stroke-dasharray:6 4}#bb3-fr-dette-projections .b-muted{opacity:.84}#bb3-fr-dette-projections .b-value{font-variant-numeric:tabular-nums}@media print{#bb3-fr-dette-projections{color:#e7e9ee;}}</style>
<rect class="b-bg" width="480" height="624" rx="10"/>
<text x="24" y="43" font-size="27" font-weight="700" text-anchor="start">Encours et projections</text><text x="24" y="78" font-size="19" font-weight="400" text-anchor="start" class="b-muted">Millions de dollars · rapport d’août 2025</text><text x="24" y="131" font-size="21" font-weight="600" text-anchor="start">Fin 2024 · encours rapporté</text><line x1="24" y1="168" x2="344" y2="168" class="b-rule" stroke-width="1.2"/><rect x="24" y="148" width="305.600" height="26" class="b-bar" /><text x="454" y="171" font-size="30" font-weight="700" text-anchor="end" class="b-value">191</text><text x="24" y="231" font-size="21" font-weight="600" text-anchor="start">Fin 2025 · projection</text><line x1="24" y1="268" x2="344" y2="268" class="b-rule" stroke-width="1.2"/><rect x="24" y="248" width="209.600" height="26" class="b-proj" /><text x="454" y="271" font-size="30" font-weight="700" text-anchor="end" class="b-value">131</text><text x="24" y="331" font-size="21" font-weight="600" text-anchor="start">Fin 2026 · projection</text><line x1="24" y1="368" x2="344" y2="368" class="b-rule" stroke-width="1.2"/><rect x="24" y="348" width="209.600" height="26" class="b-proj" /><text x="454" y="371" font-size="30" font-weight="700" text-anchor="end" class="b-value">131</text><text x="24" y="431" font-size="21" font-weight="600" text-anchor="start">Fin 2027 · projection</text><line x1="24" y1="468" x2="344" y2="468" class="b-rule" stroke-width="1.2"/><rect x="24" y="448" width="113.600" height="26" class="b-proj" /><text x="454" y="471" font-size="30" font-weight="700" text-anchor="end" class="b-value">71</text><line x1="24" y1="495" x2="344" y2="495" class="b-rule" stroke-width="1.2"/><line x1="24.0" y1="491" x2="24.0" y2="501" class="b-rule" stroke-width="1.2"/><text x="24.0" y="526" font-size="19" font-weight="400" text-anchor="start">0</text><line x1="184.0" y1="491" x2="184.0" y2="501" class="b-rule" stroke-width="1.2"/><text x="184.0" y="526" font-size="19" font-weight="400" text-anchor="middle">100</text><line x1="344.0" y1="491" x2="344.0" y2="501" class="b-rule" stroke-width="1.2"/><text x="344.0" y="526" font-size="19" font-weight="400" text-anchor="middle">200</text><text x="24" y="567" font-size="21" font-weight="600" text-anchor="start">2025–2027 : des prévisions,</text><text x="24" y="595" font-size="21" font-weight="600" text-anchor="start">pas des soldes observés en 2026.</text>
