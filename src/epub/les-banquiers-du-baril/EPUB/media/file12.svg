<svg xmlns="http://www.w3.org/2000/svg" id="bdb5-fr-fig1" class="bdb5-svg" viewBox="0 0 440 605" style="width:100%;height:auto" role="img" aria-labelledby="bdb5-fr-fig1-title bdb5-fr-fig1-desc" focusable="false"><rect x="0" y="0" width="440" height="605" fill="#0b0d10"/><title id="bdb5-fr-fig1-title">Les droits de propriété documentés</title><desc id="bdb5-fr-fig1-desc">Saras appartient intégralement au groupe Vitol après le 11 septembre 2024. VTTI publie 45 % pour IFM, 45 % sous le libellé Vitol, 10 % pour ADNOC. VARO est contrôlé conjointement par Carlyle et Vitol Refining Group selon l’avis européen de juillet 2025. Les barres de capital ne mesurent pas des volumes physiques.</desc><style>.bdb5-svg {background:#0b0d10;color:#f4f4f5;font-family:Arial,Helvetica,sans-serif;display:block;width:100%;height:auto;max-width:520px;margin-inline:auto;overflow:visible;}
.bdb5-ink {fill:#f4f4f5}.bdb5-muted {fill:#a1a1aa}.bdb5-rule {stroke:#3f3f46;stroke-width:1.3;fill:none}.bdb5-blue {fill:#5eead4}.bdb5-blue-soft {fill:#12332f;stroke:#5eead4;stroke-width:1.4}.bdb5-orange {fill:#f59e0b}.bdb5-grey {fill:#71717a}.bdb5-white {fill:#0f1115}.bdb5-conditional {fill:#3a2a12;stroke:#f59e0b;stroke-width:2;stroke-dasharray:6 4}.bdb5-arrow {fill:none;stroke:#a1a1aa;stroke-width:2}.bdb5-arrowhead {fill:#a1a1aa}</style><text font-size="29" font-weight="700" text-anchor="start" class="bdb5-ink"><tspan x="20" y="39">Saras</tspan></text><text font-size="24" font-weight="600" text-anchor="start" class="bdb5-ink"><tspan x="20" y="76">100 % · groupe Vitol</tspan></text><text font-size="21" font-weight="400" text-anchor="start" class="bdb5-muted"><tspan x="20" y="111">Acquisition achevée le 11 sept. 2024</tspan></text><rect x="20" y="133" width="400" height="16" class="bdb5-blue" /><line x1="20" y1="181" x2="420" y2="181" class="bdb5-rule" /><text font-size="29" font-weight="700" text-anchor="start" class="bdb5-ink"><tspan x="20" y="222">VTTI</tspan></text><text font-size="21" font-weight="400" text-anchor="start" class="bdb5-muted"><tspan x="20" y="256">Capital partagé · publication VTTI</tspan></text><rect x="20" y="278" width="180" height="28" class="bdb5-blue" /><rect x="200" y="278" width="180" height="28" class="bdb5-orange" /><rect x="380" y="278" width="40" height="28" class="bdb5-grey" /><text font-size="22" font-weight="600" text-anchor="start" class="bdb5-ink"><tspan x="20" y="346">IFM</tspan></text><text font-size="23" font-weight="700" text-anchor="start" class="bdb5-ink"><tspan x="20" y="377">45 %</tspan></text><text font-size="22" font-weight="600" text-anchor="start" class="bdb5-ink"><tspan x="185" y="346">Vitol*</tspan></text><text font-size="23" font-weight="700" text-anchor="start" class="bdb5-ink"><tspan x="185" y="377">45 %</tspan></text><text font-size="22" font-weight="600" text-anchor="start" class="bdb5-ink"><tspan x="334" y="346">ADNOC</tspan></text><text font-size="23" font-weight="700" text-anchor="start" class="bdb5-ink"><tspan x="334" y="377">10 %</tspan></text><text font-size="21" font-weight="400" text-anchor="start" class="bdb5-muted"><tspan x="20" y="415">*Inclut un véhicule géré par Vitol.</tspan></text><line x1="20" y1="440" x2="420" y2="440" class="bdb5-rule" /><text font-size="29" font-weight="700" text-anchor="start" class="bdb5-ink"><tspan x="20" y="482">VARO</tspan></text><text font-size="23" font-weight="600" text-anchor="start" class="bdb5-ink"><tspan x="20" y="520">Contrôle conjoint</tspan></text><text font-size="22" font-weight="400" text-anchor="start" class="bdb5-ink"><tspan x="20" y="552">Carlyle et Vitol Refining Group</tspan></text><text font-size="21" font-weight="400" text-anchor="start" class="bdb5-muted"><tspan x="20" y="585">Avis européen · 1er juillet 2025</tspan></text></svg>
