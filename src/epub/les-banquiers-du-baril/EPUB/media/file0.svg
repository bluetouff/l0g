<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" id="bdb1-fr-timeline" viewBox="0 0 480 862" width="480" height="862" role="img" aria-labelledby="bdb1-fr-timeline-title bdb1-fr-timeline-desc" lang="fr" style="display:block;width:100%;max-width:480px;height:auto;margin:0 auto;isolation:isolate" font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="480" height="862" fill="#0b0d10"/><title id="bdb1-fr-timeline-title">Le calendrier du Sienna</title><desc id="bdb1-fr-timeline-desc">2020. 19 février : chargement à Rotterdam et connaissement signé. 12 mars : émission de la lettre de crédit par UniCredit. 2 avril : paiement de BP pour 80 000 tonnes. 26 avril au 2 mai : transbordements à Sohar sans présentation de l’original. 13 août : l’original endossé par BP arrive à la banque. Dates non proportionnelles. Source : arrêt du 4 mai 2023, paragraphes 10 à 21.</desc><rect x="0" y="0" width="480" height="862" rx="16" fill="#121419"/><text x="24" y="39" font-size="22" font-weight="700" fill="#5eead4" text-anchor="start">01 / SIENNA</text><text x="24" y="82" font-size="28" font-weight="700" fill="#e7e9ee" text-anchor="start">Le calendrier du Sienna</text><text x="24" y="122" font-size="22" font-weight="400" fill="#8b909b" text-anchor="start">2020 • Événements documentés</text><path d="M44 179 V671" fill="none" stroke="#47505c" stroke-width="3"/><circle cx="44" cy="179" r="7" fill="#5eead4"/><text x="76" y="185" font-size="25" font-weight="700" fill="#e7e9ee" text-anchor="start">19 février</text><text x="76" y="220" font-size="22" font-weight="400" fill="#e7e9ee"><tspan x="76" dy="0">Chargement à Rotterdam ;</tspan><tspan x="76" dy="28">connaissement signé.</tspan></text><circle cx="44" cy="302" r="7" fill="#5eead4"/><text x="76" y="308" font-size="25" font-weight="700" fill="#e7e9ee" text-anchor="start">12 mars</text><text x="76" y="343" font-size="22" font-weight="400" fill="#e7e9ee"><tspan x="76" dy="0">UniCredit émet la lettre</tspan><tspan x="76" dy="28">de crédit pour Gulf.</tspan></text><circle cx="44" cy="425" r="7" fill="#5eead4"/><text x="76" y="431" font-size="25" font-weight="700" fill="#e7e9ee" text-anchor="start">2 avril</text><text x="76" y="466" font-size="22" font-weight="400" fill="#e7e9ee"><tspan x="76" dy="0">BP est payé pour</tspan><tspan x="76" dy="28">80 000 tonnes de fioul.</tspan></text><circle cx="44" cy="548" r="7" fill="#5eead4"/><text x="76" y="554" font-size="25" font-weight="700" fill="#e7e9ee" text-anchor="start">26 avril – 2 mai</text><text x="76" y="589" font-size="22" font-weight="400" fill="#e7e9ee"><tspan x="76" dy="0">Transbordements à Sohar,</tspan><tspan x="76" dy="28">sans l’original présenté.</tspan></text><circle cx="44" cy="671" r="7" fill="#5eead4"/><text x="76" y="677" font-size="25" font-weight="700" fill="#e7e9ee" text-anchor="start">13 août</text><text x="76" y="712" font-size="22" font-weight="400" fill="#e7e9ee"><tspan x="76" dy="0">L’original endossé par BP</tspan><tspan x="76" dy="28">arrive chez UniCredit.</tspan></text><path d="M24 774 H456" fill="none" stroke="#47505c"/><text x="24" y="807" font-size="22" font-weight="400" fill="#8b909b"><tspan x="24" dy="0">Ordre chronologique ;</tspan><tspan x="24" dy="28">espacements non proportionnels.</tspan></text></svg>
