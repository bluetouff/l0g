<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" id="bb2-fr-hedge" viewBox="0 0 480 790" width="480" height="790" role="img" aria-labelledby="bb2-fr-hedge-title bb2-fr-hedge-desc" lang="fr" font-family="Arial, Helvetica, sans-serif" style="display:block;width:100%;max-width:480px;height:auto;margin:0 auto;isolation:isolate"><rect x="0" y="0" width="480" height="790" fill="#0b0d10"/>
<title id="bb2-fr-hedge-title">Un million de barils couverts</title><desc id="bb2-fr-hedge-desc">Exemple fictif. Stock et futures passent tous deux de 80 à 100 dollars par baril. Gain de valeur non encaissé sur le stock : 20 millions de dollars. Perte sur la vente de futures, réglée en espèces : 20 millions de dollars. Variation économique nette : zéro avant coûts. Besoin de financement des règlements : 20 millions, hors garantie initiale. Ce n’est pas une opération Trafigura.</desc>
<style>#bb2-fr-hedge{color:#e7e9ee;}#bb2-fr-hedge text{fill:currentColor}#bb2-fr-hedge .b-bg{fill:#121419}#bb2-fr-hedge .b-bar,#bb2-fr-hedge .b-accent{fill:#5eead4}#bb2-fr-hedge .b-soft{fill:#171a20}#bb2-fr-hedge .b-rule{stroke:#8b909b;fill:none}#bb2-fr-hedge .b-muted{opacity:.83}#bb2-fr-hedge .b-value{font-variant-numeric:tabular-nums}@media print{#bb2-fr-hedge{color:#e7e9ee;}}</style>
<rect class="b-bg" width="480" height="790" rx="10"/>
<text x="24" y="41" font-size="19" font-weight="700" text-anchor="start" class="b-accent">EXEMPLE FICTIF</text><text x="24" y="83" font-size="27" font-weight="700" text-anchor="start">Un million de barils couverts</text><text x="24" y="117" font-size="20" font-weight="400" text-anchor="start" class="b-muted">Prix du stock et des futures : 80 → 100 $</text><rect x="24" y="149" width="432" height="191" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/><text x="44" y="187" font-size="19" font-weight="700" text-anchor="start">STOCK PHYSIQUE INVENDU</text><text x="44" y="246" font-size="42" font-weight="700" text-anchor="start" class="b-value b-accent">+20 M$</text><text x="44" y="285" font-size="22" font-weight="400" text-anchor="start">Valeur accrue de la marchandise.</text><text x="44" y="316" font-size="22" font-weight="400" text-anchor="start">Aucun encaissement à ce stade.</text><rect x="24" y="361" width="432" height="191" class="b-soft"/><text x="44" y="399" font-size="19" font-weight="700" text-anchor="start">POSITION VENDEUSE SUR FUTURES</text><text x="44" y="458" font-size="42" font-weight="700" text-anchor="start" class="b-value b-accent">−20 M$</text><text x="44" y="497" font-size="22" font-weight="400" text-anchor="start">Perte réglée en espèces au fil</text><text x="44" y="528" font-size="22" font-weight="400" text-anchor="start">des variations du marché.</text><text x="24" y="603" font-size="23" font-weight="700" text-anchor="start">Variation économique nette : 0 $</text><text x="24" y="644" font-size="23" font-weight="700" text-anchor="start" class="b-accent">Règlements à financer : 20 M$</text><path d="M24 672 H456" class="b-rule" stroke-width="1"/><text x="24" y="707" font-size="21" font-weight="400" text-anchor="start" class="b-muted">Couverture exacte ; hors coûts,</text><text x="24" y="737" font-size="21" font-weight="400" text-anchor="start" class="b-muted">risque de base et garantie initiale.</text><text x="24" y="770" font-size="19" font-weight="600" text-anchor="start" class="b-muted">Aucune opération réelle représentée.</text></svg>
