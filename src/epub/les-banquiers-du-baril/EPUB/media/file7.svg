<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" id="bb3-fr-paiements" viewBox="0 0 480 760" width="480" height="760" role="img" aria-labelledby="bb3-fr-paiements-title bb3-fr-paiements-desc" lang="fr" font-family="Arial, Helvetica, sans-serif" style="display:block;width:100%;max-width:480px;height:auto;margin:0 auto;isolation:isolate"><rect x="0" y="0" width="480" height="760" fill="#0b0d10"/>
<title id="bb3-fr-paiements-title">L’ordre des paiements</title><desc id="bb3-fr-paiements-desc">Circuit 2023 : vente publique à Glencore, compte dédié de SHT chez Citibank, coûts et déductions prioritaires, paiements liés à la dette et solde destiné au Trésor. Les étapes ont la même taille ; elles ne représentent pas des montants. Des flux publics suivent d’autres circuits. Les paiements effectifs n’ont pas été vérifiés indépendamment dans la section concernée de l’ITIE.</desc>
<style>#bb3-fr-paiements{color:#e7e9ee;}#bb3-fr-paiements text{fill:currentColor}#bb3-fr-paiements .b-bg{fill:#121419}#bb3-fr-paiements .b-bar{fill:#5eead4}#bb3-fr-paiements .b-soft{fill:#171a20}#bb3-fr-paiements .b-rule{stroke:#8b909b;fill:none}#bb3-fr-paiements .b-outline{fill:#171a20;stroke:#5eead4;stroke-width:2}#bb3-fr-paiements .b-proj{fill:none;stroke:#5eead4;stroke-width:2;stroke-dasharray:6 4}#bb3-fr-paiements .b-muted{opacity:.84}#bb3-fr-paiements .b-kicker{fill:#5eead4}#bb3-fr-paiements .b-value{font-variant-numeric:tabular-nums}@media print{#bb3-fr-paiements{color:#e7e9ee;}}</style>
<rect class="b-bg" width="480" height="760" rx="10"/>
<text x="24" y="43" font-size="28" font-weight="700" text-anchor="start">L’ordre des paiements</text><text x="24" y="78" font-size="19" font-weight="400" text-anchor="start" class="b-muted">Circuit décrit par l’ITIE pour 2023</text><rect x="24" y="105" width="432.000" height="102" class="b-soft" rx="5"/><text x="40" y="133" font-size="16" font-weight="700" text-anchor="start" class="b-kicker">VENTE</text><text x="40" y="163" font-size="21" font-weight="500" text-anchor="start">Pétrole public vendu à Glencore</text><path d="M240 211 v11 m-5 -4 l5 5 5 -5" class="b-rule" stroke-width="2"/><rect x="24" y="229" width="432.000" height="102" class="b-soft" rx="5"/><text x="40" y="257" font-size="16" font-weight="700" text-anchor="start" class="b-kicker">COMPTE DÉDIÉ</text><text x="40" y="287" font-size="21" font-weight="500" text-anchor="start">Compte SHT auprès de Citibank</text><path d="M240 335 v11 m-5 -4 l5 5 5 -5" class="b-rule" stroke-width="2"/><rect x="24" y="353" width="432.000" height="102" class="b-soft" rx="5"/><text x="40" y="381" font-size="16" font-weight="700" text-anchor="start" class="b-kicker">PRIORITÉS OPÉRATIONNELLES</text><text x="40" y="411" font-size="21" font-weight="500" text-anchor="start">Coûts pétroliers, transport</text><text x="40" y="438" font-size="21" font-weight="500" text-anchor="start">et autres imputations prioritaires</text><path d="M240 459 v11 m-5 -4 l5 5 5 -5" class="b-rule" stroke-width="2"/><rect x="24" y="477" width="432.000" height="102" class="b-soft" rx="5"/><text x="40" y="505" font-size="16" font-weight="700" text-anchor="start" class="b-kicker">PAIEMENTS FINANCIERS</text><text x="40" y="535" font-size="21" font-weight="500" text-anchor="start">Dette, intérêts, frais</text><text x="40" y="562" font-size="21" font-weight="500" text-anchor="start">et paiements conditionnels</text><path d="M240 583 v11 m-5 -4 l5 5 5 -5" class="b-rule" stroke-width="2"/><rect x="24" y="601" width="432.000" height="102" class="b-soft" rx="5"/><text x="40" y="629" font-size="16" font-weight="700" text-anchor="start" class="b-kicker">SOLDE</text><text x="40" y="659" font-size="21" font-weight="500" text-anchor="start">Montant destiné au Trésor</text><text x="24" y="737" font-size="18" font-weight="400" text-anchor="start" class="b-muted">Schéma simplifié · sans échelle de montants</text>
</svg>
