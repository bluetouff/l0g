<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 468" style="width:100%;height:auto" role="img" aria-labelledby="traces03-fr-contrat-title traces03-fr-contrat-desc" font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="480" height="468" fill="#0b0d10"/>
<title id="traces03-fr-contrat-title">Des traces aux revenus dérivés</title>
<desc id="traces03-fr-contrat-desc">Contrat Jumpshot–Lotame d’août 2018 décrit dans la plainte FTC : données et droits vers Lotame, combinaison et modélisation, licences de dérivés prévues aux clients, part des revenus prévue pour Jumpshot. Pourcentage non public. Ce schéma ne prouve ni une facture payée ni une activité actuelle.</desc>
<rect x="0" y="0" width="480" height="468" fill="#0c0e10"/>
<text x="20" y="32" font-size="24" fill="#f0f4fa" font-weight="500" text-anchor="start">Des traces aux revenus dérivés</text>
<text x="20" y="62" font-size="21" fill="#b8c8db" font-weight="400" text-anchor="start">Août 2018 · plainte FTC de 2024</text>
<text x="62" y="110" font-size="23" fill="#f0f4fa" font-weight="500" text-anchor="start">Jumpshot</text>
<text x="62" y="139" font-size="21" fill="#b8c8db" font-weight="400" text-anchor="start">Données et droits d’usage</text>
<line x1="32" y1="105" x2="32" y2="179" stroke="#72e5df" stroke-width="1.5" stroke-dasharray="4 4"/><polyline points="28,173 32,179 36,173" fill="none" stroke="#72e5df" stroke-width="1.5" stroke-linejoin="round"/>
<text x="62" y="198" font-size="23" fill="#f0f4fa" font-weight="500" text-anchor="start">Lotame</text>
<text x="62" y="227" font-size="21" fill="#b8c8db" font-weight="400" text-anchor="start">Combine et modélise</text>
<line x1="32" y1="193" x2="32" y2="267" stroke="#72e5df" stroke-width="1.5" stroke-dasharray="4 4"/><polyline points="28,261 32,267 36,261" fill="none" stroke="#72e5df" stroke-width="1.5" stroke-linejoin="round"/>
<text x="62" y="286" font-size="23" fill="#f0f4fa" font-weight="500" text-anchor="start">Clients de Lotame</text>
<text x="62" y="315" font-size="21" fill="#b8c8db" font-weight="400" text-anchor="start">Licences de dérivés prévues</text>
<line x1="20" y1="337" x2="460" y2="337" stroke="#344352" stroke-width="1.5"/>
<text x="20" y="374" font-size="22" fill="#f0f4fa" font-weight="400" text-anchor="start">Lotame</text>
<text x="460" y="374" font-size="22" fill="#f0f4fa" font-weight="400" text-anchor="end">Jumpshot</text>
<line x1="128" y1="366" x2="338" y2="366" stroke="#72e5df" stroke-width="1.5" stroke-dasharray="4 4"/><polyline points="332,362 338,366 332,370" fill="none" stroke="#72e5df" stroke-width="1.5" stroke-linejoin="round"/>
<text x="20" y="407" font-size="21" fill="#72e5df" font-weight="400" text-anchor="start">Part des revenus, taux non public</text>
<text x="20" y="447" font-size="21" fill="#b8c8db" font-weight="400" text-anchor="start">Exécution du contrat non vérifiée</text>
