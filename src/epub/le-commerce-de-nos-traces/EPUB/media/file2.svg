<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420" width="100%" style="width:100%;height:auto" role="img" aria-labelledby="traces01-fr-mobius-title traces01-fr-mobius-desc" font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="480" height="420" fill="#0b0d10"/>
<title id="traces01-fr-mobius-title">Un autre circuit : le réemploi</title>
<desc id="traces01-fr-mobius-desc">Relation de sous-traitance Deezer–Mobius documentée par la décision CNIL du 11 décembre 2025. Contrat de 2016 à 2020. Copie en avril 2019 dans un environnement de développement et de test pour améliorer les services. La CNIL retient un réemploi hors instructions. Cette décision ne démontre pas une vente à un courtier.</desc>
<rect x="0" y="0" width="480" height="420" fill="#0c0e10"/>
<text x="20" y="32" font-size="24" fill="#f0f4fa" font-weight="500" text-anchor="start">Un autre circuit : le réemploi</text>
<text x="20" y="62" font-size="21" fill="#b8c8db" font-weight="400" text-anchor="start">Constats CNIL · 11 décembre 2025</text>
<text x="64" y="111" font-size="23" fill="#f0f4fa" font-weight="500" text-anchor="start">Deezer</text>
<text x="64" y="140" font-size="21" fill="#b8c8db" font-weight="400" text-anchor="start">Client · contrat 2016–2020</text>
<line x1="32" y1="106" x2="32" y2="181" stroke="#b8c8db" stroke-width="1.5"/><polyline points="28,175 32,181 36,175" fill="none" stroke="#b8c8db" stroke-width="1.5" stroke-linejoin="round"/>
<text x="64" y="203" font-size="23" fill="#f0f4fa" font-weight="500" text-anchor="start">Mobius / Optimove</text>
<text x="64" y="232" font-size="21" fill="#b8c8db" font-weight="400" text-anchor="start">Traitement pour Deezer</text>
<line x1="32" y1="199" x2="32" y2="276" stroke="#f2c875" stroke-width="1.5" stroke-dasharray="4 4"/><polyline points="28,270 32,276 36,270" fill="none" stroke="#f2c875" stroke-width="1.5" stroke-linejoin="round"/>
<text x="64" y="295" font-size="22" fill="#f2c875" font-weight="500" text-anchor="start">Réemploi hors instructions</text>
<text x="64" y="324" font-size="21" fill="#b8c8db" font-weight="400" text-anchor="start">Copie · avril 2019 · tests</text>
<line x1="20" y1="347" x2="460" y2="347" stroke="#344352" stroke-width="1.5"/>
<text x="20" y="379" font-size="21" fill="#b8c8db" font-weight="400" text-anchor="start">La décision n’établit aucune</text>
<text x="20" y="406" font-size="21" fill="#b8c8db" font-weight="400" text-anchor="start">vente à un courtier.</text>
</svg>
