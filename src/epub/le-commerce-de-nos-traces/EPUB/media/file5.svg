<title id="traces02-fr-relations-title">Des relations de nature différente</title>
<desc id="traces02-fr-relations-desc">Trois relations sans lien entre elles dans les pièces présentées : instruction prévue d’Experian à LiveRamp ; données confiées par Deezer à Mobius dans une prestation constatée ; transfert de Gravy à Venntel allégué par la FTC, avec filiation capitalistique constatée séparément.</desc>
