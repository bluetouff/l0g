<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" style="width:100%;height:auto" role="img" aria-labelledby="traces02-fr-activation-title traces02-fr-activation-desc" font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="480" height="480" fill="#0b0d10"/>
<title id="traces02-fr-activation-title">Rendre une audience utilisable ailleurs</title>
<desc id="traces02-fr-activation-desc">Conditions Experian de décembre 2024 : le client instruit Experian, qui instruit LiveRamp ; LiveRamp doit distribuer une audience à la destination choisie, sous ses conditions. Aucun client ou flux individuel observé.</desc>
<rect x="0" y="0" width="480" height="480" fill="#0c0e10"/>
<text x="20" y="32" font-size="24" fill="#f0f4fa" font-weight="500" text-anchor="start">Activer une audience ailleurs</text>
<text x="20" y="62" font-size="21" fill="#b8c8db" font-weight="400" text-anchor="start">Conditions · décembre 2024</text>
<text x="62" y="110" font-size="23" fill="#f0f4fa" font-weight="500" text-anchor="start">Client annonceur / agence</text>
<text x="62" y="139" font-size="21" fill="#b8c8db" font-weight="400" text-anchor="start">Rôle générique, client non identifié</text>
<line x1="32" y1="105" x2="32" y2="175" stroke="#72e5df" stroke-width="1.5" stroke-dasharray="4 4"/><polyline points="28,169 32,175 36,169" fill="none" stroke="#72e5df" stroke-width="1.5" stroke-linejoin="round"/>
<text x="62" y="192" font-size="23" fill="#f0f4fa" font-weight="500" text-anchor="start">Experian</text>
<text x="62" y="221" font-size="21" fill="#b8c8db" font-weight="400" text-anchor="start">Instruit l’activation · clause 11</text>
<line x1="32" y1="187" x2="32" y2="257" stroke="#72e5df" stroke-width="1.5" stroke-dasharray="4 4"/><polyline points="28,251 32,257 36,251" fill="none" stroke="#72e5df" stroke-width="1.5" stroke-linejoin="round"/>
<text x="62" y="274" font-size="23" fill="#f0f4fa" font-weight="500" text-anchor="start">LiveRamp UK</text>
<text x="62" y="303" font-size="21" fill="#b8c8db" font-weight="400" text-anchor="start">Distribue l’audience</text>
<line x1="32" y1="269" x2="32" y2="339" stroke="#72e5df" stroke-width="1.5" stroke-dasharray="4 4"/><polyline points="28,333 32,339 36,333" fill="none" stroke="#72e5df" stroke-width="1.5" stroke-linejoin="round"/>
<text x="62" y="356" font-size="23" fill="#f0f4fa" font-weight="500" text-anchor="start">Destination publicitaire</text>
<text x="62" y="385" font-size="21" fill="#b8c8db" font-weight="400" text-anchor="start">Choisie par le client, sous conditions</text>
<line x1="20" y1="405" x2="460" y2="405" stroke="#344352" stroke-width="1.5"/>
<text x="20" y="434" font-size="21" fill="#b8c8db" font-weight="400" text-anchor="start">Aucune campagne individuelle</text>
<text x="20" y="460" font-size="21" fill="#b8c8db" font-weight="400" text-anchor="start">n’est attestée par ce schéma.</text>
</svg>
