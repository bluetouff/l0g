<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 458" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Formule du coût complet d&#x27;un mégawatt sécurisé par une adaptation du refroidissement" style="display:block;width:100%;height:auto;background:#0c0d10;border:1px solid rgba(255,255,255,0.10);border-radius:8px;margin:18px 0 22px;overflow:hidden;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <rect width="720" height="458" fill="#0c0d10"></rect>
  <text x="24" y="34" fill="#5eead4" font-size="15" font-weight="700">// Le coût complet du MW sécurisé</text>
  <text x="24" y="55" fill="#8b929e" font-size="10">Une comptabilité commune pour comparer des solutions très différentes.</text>
  <rect x="28" y="88" width="204" height="52" rx="6" fill="#15171c" stroke="#7aa2f7"></rect>
  <text x="44" y="112" fill="#7aa2f7" font-size="10" font-weight="800">CAPEX ANNUALISÉ</text>
  <text x="44" y="130" fill="#c7ccd5" font-size="9">durée de vie + taux</text>
  <rect x="258" y="88" width="204" height="52" rx="6" fill="#15171c" stroke="#5eead4"></rect>
  <text x="274" y="112" fill="#5eead4" font-size="10" font-weight="800">OPEX ET CHIMIE</text>
  <text x="274" y="130" fill="#c7ccd5" font-size="9">maintenance + traitement</text>
  <rect x="488" y="88" width="204" height="52" rx="6" fill="#15171c" stroke="#f5b13d"></rect>
  <text x="504" y="112" fill="#f5b13d" font-size="10" font-weight="800">AUXILIAIRES</text>
  <text x="504" y="130" fill="#c7ccd5" font-size="9">pompes + ventilateurs</text>
  <rect x="28" y="162" width="204" height="52" rx="6" fill="#15171c" stroke="#ff4d87"></rect>
  <text x="44" y="186" fill="#ff4d87" font-size="10" font-weight="800">ARRÊT DE CHANTIER</text>
  <text x="44" y="204" fill="#c7ccd5" font-size="9">MWh non produits</text>
  <rect x="258" y="162" width="204" height="52" rx="6" fill="#15171c" stroke="#a78bfa"></rect>
  <text x="274" y="186" fill="#a78bfa" font-size="10" font-weight="800">EAU ET REJETS</text>
  <text x="274" y="204" fill="#c7ccd5" font-size="9">prélèvement ≠ consommation</text>
  <rect x="488" y="162" width="204" height="52" rx="6" fill="#15171c" stroke="#f5b13d"></rect>
  <text x="504" y="186" fill="#f5b13d" font-size="10" font-weight="800">EXTERNALITÉS</text>
  <text x="504" y="204" fill="#c7ccd5" font-size="9">fleuve, air, mer, réseau</text>
  <text x="349" y="254" fill="#8b929e" font-size="18" font-weight="800">÷</text>
  <rect x="78" y="278" width="252" height="72" rx="8" fill="#111318" stroke="#5eead4" stroke-width="2"></rect>
  <text x="98" y="305" fill="#5eead4" font-size="11" font-weight="800">MW RÉELLEMENT SÉCURISÉS</text>
  <text x="98" y="330" fill="#c7ccd5" font-size="9">pendant le scénario climatique cible</text>
  <rect x="390" y="278" width="252" height="72" rx="8" fill="#111318" stroke="#7aa2f7" stroke-width="2"></rect>
  <text x="410" y="305" fill="#7aa2f7" font-size="11" font-weight="800">MWh DE DÉCLASSEMENT ÉVITÉS</text>
  <text x="410" y="330" fill="#c7ccd5" font-size="9">sur toute la durée de l'adaptation</text>
  <rect x="78" y="382" width="564" height="38" rx="6" fill="#15171c" stroke="#ff4d87"></rect>
  <text x="98" y="406" fill="#ff8bad" font-size="10" font-weight="800">Sans dénominateur : prix visible, efficacité inconnue.</text>
  <text x="24" y="447" fill="#777f8c" font-size="9">MÉTHODE : l0g, à partir des recommandations de transparence de la Cour des comptes.</text>
</svg>
