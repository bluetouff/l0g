  <path d="M360 314 V362" stroke="#8e96a2" stroke-width="2"></path>
  <polygon points="360,362 354,352 366,352" fill="#8e96a2"></polygon>
  <rect x="42" y="340" width="180" height="104" rx="7" fill="#111318" stroke="#39404c"></rect>
  <text x="58" y="366" fill="#d9dde4" font-size="10" font-weight="800">PIÈCES MANQUANTES</text>
  <text x="58" y="388" fill="#c1c7d0" font-size="8">• niveau minimal demandé</text>
  <text x="58" y="405" fill="#c1c7d0" font-size="8">• scénario réseau sans maintien</text>
  <text x="58" y="422" fill="#c1c7d0" font-size="8">• pièce D de surveillance</text>
  <text x="24" y="484" fill="#777f8c" font-size="9">SOURCE : ASNR 2026-DC-052. Lecture institutionnelle et inventaire documentaire l0g.</text>
