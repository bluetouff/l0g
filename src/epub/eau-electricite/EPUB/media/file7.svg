<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Chaîne de décision entre EDF, RTE, ministère, ASNR et surveillance environnementale pour une modification temporaire des rejets thermiques" style="display:block;width:100%;height:auto;background:#0c0d10;border:1px solid rgba(255,255,255,0.10);border-radius:8px;margin:18px 0 22px;overflow:hidden;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <rect width="720" height="500" fill="#0c0d10"></rect>
  <text x="24" y="34" fill="#5eead4" font-size="15" font-weight="700">// Qui transforme le besoin électrique en prescription ?</text>
  <text x="24" y="55" fill="#8b929e" font-size="10">RTE n'autorise pas le rejet. L'ASNR ne définit pas seule le besoin réseau.</text>
  <rect x="42" y="91" width="180" height="70" rx="7" fill="#15171c" stroke="#7aa2f7"></rect>
  <text x="58" y="116" fill="#7aa2f7" font-size="11" font-weight="800">MÉTÉO + HYDROLOGIE</text>
  <text x="58" y="137" fill="#c4cad2" font-size="9">prévisions, températures, débit</text>
  <rect x="42" y="205" width="180" height="82" rx="7" fill="#15171c" stroke="#f5b13d"></rect>
  <text x="58" y="230" fill="#f5b13d" font-size="11" font-weight="800">EDF</text>
  <text x="58" y="250" fill="#c4cad2" font-size="9">demande la modification</text>
  <text x="58" y="268" fill="#ff9abb" font-size="8">dossier du 8 juillet non publié</text>
  <rect x="270" y="91" width="180" height="82" rx="7" fill="#15171c" stroke="#ff4d87"></rect>
  <text x="286" y="116" fill="#ff4d87" font-size="11" font-weight="800">RTE</text>
  <text x="286" y="136" fill="#c4cad2" font-size="9">requiert un niveau minimum</text>
  <text x="286" y="154" fill="#ff9abb" font-size="8">MW et motif précis non publiés</text>
  <rect x="498" y="91" width="180" height="82" rx="7" fill="#15171c" stroke="#f5b13d"></rect>
  <text x="514" y="116" fill="#f5b13d" font-size="11" font-weight="800">MINISTÈRE</text>
  <text x="514" y="136" fill="#c4cad2" font-size="9">confirme la nécessité publique</text>
  <text x="514" y="154" fill="#ff9abb" font-size="8">courrier du 9 juillet non publié</text>
  <rect x="270" y="226" width="180" height="88" rx="7" fill="#15171c" stroke="#5eead4"></rect>
  <text x="286" y="251" fill="#5eead4" font-size="11" font-weight="800">ASNR</text>
  <text x="286" y="271" fill="#c4cad2" font-size="9">examine et décide</text>
  <text x="286" y="289" fill="#91f2df" font-size="8">décision publique 2026-DC-052</text>
  <rect x="270" y="362" width="180" height="82" rx="7" fill="#15171c" stroke="#7aa2f7"></rect>
  <text x="286" y="387" fill="#7aa2f7" font-size="11" font-weight="800">EXPLOITATION</text>
  <text x="286" y="407" fill="#c4cad2" font-size="9">puissance adaptée + surveillance</text>
  <text x="286" y="425" fill="#91f2df" font-size="8">températures transmises chaque jour</text>
  <path d="M132 161 V205" stroke="#8e96a2" stroke-width="2"></path>
  <polygon points="132,205 126,195 138,195" fill="#8e96a2"></polygon>
  <path d="M222 246 H270" stroke="#8e96a2" stroke-width="2"></path>
  <polygon points="270,246 260,240 260,252" fill="#8e96a2"></polygon>
  <path d="M360 173 V226" stroke="#8e96a2" stroke-width="2"></path>
  <polygon points="360,226 354,216 366,216" fill="#8e96a2"></polygon>
  <path d="M498 132 H450" stroke="#8e96a2" stroke-width="2"></path>
