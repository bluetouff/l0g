  <text x="52" y="211" fill="#c8cdd5" font-size="8">météo</text>
  <text x="52" y="228" fill="#c8cdd5" font-size="8">besoin RTE</text>
  <text x="52" y="245" fill="#c8cdd5" font-size="8">limite ASNR</text>
  <rect x="176" y="166" width="124" height="100" rx="6" fill="#15171c" stroke="#f5b13d"></rect>
  <text x="190" y="190" fill="#f5b13d" font-size="10" font-weight="800">RAPIDE</text>
  <text x="190" y="211" fill="#c8cdd5" font-size="8">thermie</text>
  <text x="190" y="228" fill="#c8cdd5" font-size="8">oxygène</text>
  <text x="190" y="245" fill="#c8cdd5" font-size="8">mortalité visible</text>
  <rect x="314" y="166" width="124" height="100" rx="6" fill="#15171c" stroke="#7aa2f7"></rect>
