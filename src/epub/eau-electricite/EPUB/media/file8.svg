  <text x="604" y="228" fill="#c8cdd5" font-size="8">définitive</text>
  <text x="604" y="245" fill="#c8cdd5" font-size="8">Bugey 2027</text>
  <rect x="38" y="310" width="652" height="104" rx="7" fill="#111318" stroke="#2f3540"></rect>
  <text x="54" y="336" fill="#f3f5f8" font-size="11" font-weight="800">Retour d'expérience 2022</text>
  <text x="54" y="358" fill="#c8cdd5" font-size="9">24 jours cumulés d'utilisation : Tricastin 9, Bugey 8, Golfech 6, Saint-Alban 1.</text>
  <text x="54" y="378" fill="#c8cdd5" font-size="9">Pas d'effet durable attribuable mis en évidence dans les paramètres et sites étudiés.</text>
  <text x="54" y="398" fill="#f5b13d" font-size="9">Saint-Alban : différences biologiques légères en 2022, non persistantes en 2023.</text>
  <text x="24" y="455" fill="#777f8c" font-size="9">SOURCES : ASNR, retours 2022-2025 ; décision Bugey 2026-DC-052 ; dossier EDF de surveillance.</text>
