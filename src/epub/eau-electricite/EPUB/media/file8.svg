  <text x="328" y="228" fill="#c8cdd5" font-size="8">phytoplancton</text>
  <text x="328" y="245" fill="#c8cdd5" font-size="8">diatomées</text>
  <rect x="452" y="166" width="124" height="100" rx="6" fill="#15171c" stroke="#5eead4"></rect>
