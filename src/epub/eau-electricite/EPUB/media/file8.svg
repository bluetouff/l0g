  <text x="466" y="228" fill="#c8cdd5" font-size="8">impact préliminaire</text>
  <text x="466" y="245" fill="#c8cdd5" font-size="8">compensation éventuelle</text>
  <rect x="590" y="166" width="100" height="100" rx="6" fill="#15171c" stroke="#5eead4"></rect>
