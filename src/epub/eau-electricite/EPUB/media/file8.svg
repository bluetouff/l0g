  <text x="350" y="100" text-anchor="middle" fill="#7aa2f7" font-size="10" font-weight="800">SEMAINES</text>
  <text x="505" y="100" text-anchor="middle" fill="#5eead4" font-size="10" font-weight="800">31 OCT.</text>
  <text x="650" y="100" text-anchor="middle" fill="#5eead4" font-size="10" font-weight="800">31 MARS</text>
  <rect x="38" y="166" width="124" height="100" rx="6" fill="#15171c" stroke="#ff4d87"></rect>
