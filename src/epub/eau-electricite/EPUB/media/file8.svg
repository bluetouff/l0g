<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Décalage entre la décision électrique immédiate et les délais nécessaires pour mesurer les effets écologiques des rejets thermiques" style="display:block;width:100%;height:auto;background:#0c0d10;border:1px solid rgba(255,255,255,0.10);border-radius:8px;margin:18px 0 22px;overflow:hidden;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <rect width="720" height="470" fill="#0c0d10"></rect>
  <text x="24" y="34" fill="#5eead4" font-size="15" font-weight="700">// Le réseau choisit maintenant, le fleuve répond plus tard</text>
  <text x="24" y="55" fill="#8b929e" font-size="10">Le calendrier de la preuve n'est pas celui de l'exploitation.</text>
  <line x1="52" y1="130" x2="670" y2="130" stroke="#343a45" stroke-width="3"></line>
  <circle cx="72" cy="130" r="8" fill="#ff4d87"></circle>
