<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 438" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Comparaison entre les données observées par un modèle d&#x27;adéquation et celles observées par la pompe d&#x27;une centrale" style="display:block;width:100%;height:auto;background:#0c0d10;border:1px solid rgba(255,255,255,0.10);border-radius:8px;margin:18px 0 22px;overflow:hidden;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <rect width="720" height="438" fill="#0c0d10"></rect>
  <text x="24" y="34" fill="#5eead4" font-size="15" font-weight="700">// Le modèle et la pompe ne lisent pas la même feuille</text>
  <text x="24" y="55" fill="#8b929e" font-size="10">Une perte d'actif peut être correctement représentée sans que son déclencheur physique soit visible.</text>
  <rect x="30" y="91" width="310" height="290" rx="8" fill="#15171c" stroke="#7aa2f7"></rect>
  <text x="50" y="121" fill="#7aa2f7" font-size="12" font-weight="800">LE MODÈLE D'ADÉQUATION</text>
  <rect x="50" y="145" width="270" height="42" rx="5" fill="#101318"></rect>
  <text x="66" y="163" fill="#f3f5f8" font-size="10" font-weight="700">Capacité disponible</text>
  <text x="66" y="178" fill="#89919d" font-size="9">MW par zone et technologie</text>
  <rect x="50" y="197" width="270" height="42" rx="5" fill="#101318"></rect>
  <text x="66" y="215" fill="#f3f5f8" font-size="10" font-weight="700">Scénarios probabilistes</text>
  <text x="66" y="230" fill="#89919d" font-size="9">météo, pannes et demande</text>
  <rect x="50" y="249" width="270" height="42" rx="5" fill="#101318"></rect>
  <text x="66" y="267" fill="#f3f5f8" font-size="10" font-weight="700">Importations accessibles</text>
  <text x="66" y="282" fill="#89919d" font-size="9">capacités entre zones</text>
  <rect x="50" y="301" width="270" height="42" rx="5" fill="#101318"></rect>
  <text x="66" y="319" fill="#f3f5f8" font-size="10" font-weight="700">Verdict</text>
  <text x="66" y="334" fill="#89919d" font-size="9">LOLE, LOLP et EENS</text>
  <rect x="380" y="91" width="310" height="290" rx="8" fill="#15171c" stroke="#ff4d87"></rect>
  <text x="400" y="121" fill="#ff4d87" font-size="12" font-weight="800">LA POMPE DE LA CENTRALE</text>
  <rect x="400" y="145" width="270" height="42" rx="5" fill="#101318"></rect>
  <text x="416" y="163" fill="#f3f5f8" font-size="10" font-weight="700">Hauteur locale</text>
  <text x="416" y="178" fill="#89919d" font-size="9">centimètres au droit de la prise</text>
  <rect x="400" y="197" width="270" height="42" rx="5" fill="#101318"></rect>
  <text x="416" y="215" fill="#f3f5f8" font-size="10" font-weight="700">Débit et température</text>
  <text x="416" y="230" fill="#89919d" font-size="9">m³/s et degrés réels</text>
  <rect x="400" y="249" width="270" height="42" rx="5" fill="#101318"></rect>
  <text x="416" y="267" fill="#f3f5f8" font-size="10" font-weight="700">Géométrie et équipement</text>
  <text x="416" y="282" fill="#89919d" font-size="9">embouchure, pompe, marge d'aspiration</text>
  <rect x="400" y="301" width="270" height="42" rx="5" fill="#101318"></rect>
  <text x="416" y="319" fill="#f3f5f8" font-size="10" font-weight="700">Verdict</text>
  <text x="416" y="334" fill="#89919d" font-size="9">fonctionner, réduire ou s'arrêter</text>
  <rect x="179" y="397" width="362" height="24" rx="4" fill="#111318"></rect>
  <text x="197" y="414" fill="#f5b13d" font-size="9">Même perte de MW, deux niveaux d'explication.</text>
</svg>
