<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 466" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cinq couches d&#x27;analyse électrique, de l&#x27;étude saisonnière au niveau réel du fleuve" style="display:block;width:100%;height:auto;background:#0c0d10;border:1px solid rgba(255,255,255,0.10);border-radius:8px;margin:18px 0 22px;overflow:hidden;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <rect width="720" height="466" fill="#0c0d10"></rect>
  <text x="24" y="34" fill="#5eead4" font-size="15" font-weight="700">// Une crise, cinq résolutions</text>
  <text x="24" y="55" fill="#8b929e" font-size="10">Chaque couche répond à une question différente.</text>
  <rect x="32" y="88" width="656" height="56" rx="7" fill="#15171c" stroke="#7aa2f7"></rect>
  <text x="50" y="112" fill="#7aa2f7" font-size="11" font-weight="800">SAISON</text>
  <text x="142" y="112" fill="#f3f5f8" font-size="11" font-weight="700">ENTSO-E Summer Outlook</text>
  <text x="142" y="132" fill="#aeb4be" font-size="9">Mois, zones de marché, scénarios, LOLE et EENS</text>
  <rect x="54" y="158" width="612" height="56" rx="7" fill="#15171c" stroke="#5eead4"></rect>
  <text x="72" y="182" fill="#5eead4" font-size="11" font-weight="800">7 JOURS</text>
  <text x="164" y="182" fill="#f3f5f8" font-size="11" font-weight="700">Short-Term Adequacy</text>
  <text x="164" y="202" fill="#aeb4be" font-size="9">Prévisions récentes, pannes, échanges et actions proposées</text>
  <rect x="76" y="228" width="568" height="56" rx="7" fill="#15171c" stroke="#f5b13d"></rect>
  <text x="94" y="252" fill="#f5b13d" font-size="11" font-weight="800">RÉSEAU</text>
  <text x="186" y="252" fill="#f3f5f8" font-size="11" font-weight="700">Sécurité opérationnelle</text>
  <text x="186" y="272" fill="#aeb4be" font-size="9">Flux, tension, stabilité, réserves, N-1 et congestions</text>
  <rect x="98" y="298" width="524" height="56" rx="7" fill="#15171c" stroke="#ff4d87"></rect>
  <text x="116" y="322" fill="#ff4d87" font-size="11" font-weight="800">ACTIF</text>
  <text x="208" y="322" fill="#f3f5f8" font-size="11" font-weight="700">Centrale et prise d'eau</text>
  <text x="208" y="342" fill="#aeb4be" font-size="9">Unité, pompe, seuil, rendement et règle locale</text>
  <rect x="120" y="368" width="480" height="56" rx="7" fill="#15171c" stroke="#9b8cff"></rect>
  <text x="138" y="392" fill="#9b8cff" font-size="11" font-weight="800">FLEUVE</text>
  <text x="230" y="392" fill="#f3f5f8" font-size="11" font-weight="700">Hydrologie réelle</text>
  <text x="230" y="412" fill="#aeb4be" font-size="9">Centimètres, m³/s, température et géométrie du lit</text>
</svg>
