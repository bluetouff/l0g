<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Le choc composé du Danube affecte simultanément nucléaire, hydraulique, thermique et besoins d&#x27;importation" style="display:block;width:100%;height:auto;background:#0c0d10;border:1px solid rgba(255,255,255,0.10);border-radius:8px;margin:18px 0 22px;overflow:hidden;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <rect width="720" height="460" fill="#0c0d10"></rect>
  <text x="24" y="34" fill="#5eead4" font-size="15" font-weight="700">// Un bassin, plusieurs pertes de capacité</text>
  <text x="24" y="55" fill="#8b929e" font-size="10">La corrélation climatique doit devenir une corrélation entre actifs.</text>
  <rect x="252" y="92" width="216" height="78" rx="9" fill="#171a20" stroke="#9b8cff" stroke-width="2"></rect>
  <text x="278" y="121" fill="#9b8cff" font-size="11" font-weight="800">DANUBE 2026</text>
  <text x="278" y="145" fill="#f3f5f8" font-size="12" font-weight="700">chaleur + sécheresse</text>
  <text x="278" y="160" fill="#89919d" font-size="9">niveau, débit et température</text>
  <path d="M288 170 L139 221" stroke="#56606c" stroke-width="2"></path>
  <path d="M330 170 L286 221" stroke="#56606c" stroke-width="2"></path>
  <path d="M390 170 L434 221" stroke="#56606c" stroke-width="2"></path>
  <path d="M432 170 L581 221" stroke="#56606c" stroke-width="2"></path>
  <rect x="32" y="221" width="188" height="92" rx="7" fill="#15171c" stroke="#ff4d87"></rect>
  <text x="50" y="248" fill="#ff4d87" font-size="11" font-weight="800">PAKS</text>
  <text x="50" y="270" fill="#f3f5f8" font-size="10">niveau sous les prises</text>
  <text x="50" y="289" fill="#89919d" font-size="9">nucléaire réduit puis arrêté</text>
  <rect x="236" y="221" width="188" height="92" rx="7" fill="#15171c" stroke="#7aa2f7"></rect>
  <text x="254" y="248" fill="#7aa2f7" font-size="11" font-weight="800">CERNAVODĂ</text>
  <text x="254" y="270" fill="#f3f5f8" font-size="10">bassin d'aspiration trop bas</text>
  <text x="254" y="289" fill="#89919d" font-size="9">deux unités indisponibles</text>
  <rect x="440" y="221" width="116" height="92" rx="7" fill="#15171c" stroke="#5eead4"></rect>
  <text x="458" y="248" fill="#5eead4" font-size="11" font-weight="800">ĐERDAP</text>
  <text x="458" y="270" fill="#f3f5f8" font-size="10">débit turbinable</text>
  <text x="458" y="289" fill="#89919d" font-size="9">hydro en forte baisse</text>
  <rect x="572" y="221" width="116" height="92" rx="7" fill="#15171c" stroke="#f5b13d"></rect>
  <text x="590" y="248" fill="#f5b13d" font-size="11" font-weight="800">KOSTOLAC</text>
  <text x="590" y="270" fill="#f3f5f8" font-size="10">refroidissement</text>
  <text x="590" y="289" fill="#89919d" font-size="9">thermique réduit</text>
  <path d="M126 313 L240 362" stroke="#56606c" stroke-width="2"></path>
  <path d="M330 313 L306 362" stroke="#56606c" stroke-width="2"></path>
  <path d="M498 313 L414 362" stroke="#56606c" stroke-width="2"></path>
  <path d="M630 313 L480 362" stroke="#56606c" stroke-width="2"></path>
  <rect x="197" y="362" width="326" height="54" rx="7" fill="#111318" stroke="#f5b13d"></rect>
  <text x="220" y="386" fill="#f5b13d" font-size="11" font-weight="800">PLUS D'IMPORTS ET DE FLEXIBILITÉ</text>
  <text x="220" y="404" fill="#aeb4be" font-size="9">alors que les voisins subissent une partie du même choc</text>
</svg>
