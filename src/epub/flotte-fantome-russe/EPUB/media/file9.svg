<svg xmlns="http://www.w3.org/2000/svg" id="sfp-clearing-fr-m-0" width="600" height="875" viewBox="0 0 600 875" role="img" aria-labelledby="sfp-clearing-fr-m-1 sfp-clearing-fr-m-3" font-family="Inter Variable, Inter, sans-serif" font-weight="400" xml:lang="fr">
  <title id="sfp-clearing-fr-m-1">Deux réserves, un règlement</title>
  <desc id="sfp-clearing-fr-m-3">Schéma de principe de compensation, sans montant ni proportion. Une vente extérieure relie un exportateur russe à un acheteur étranger. L’acheteur verse des devises à une réserve étrangère ; l’exportateur reçoit des roubles depuis la réserve en Russie. Une importation relie un importateur russe à un fournisseur étranger : l’importateur apporte des roubles et le fournisseur reçoit des devises. Le registre A7 rapproche les obligations de paiement entre les deux réserves. Les flèches pointillées représentent la tenue des comptes, et non un virement transfrontalier. Les ordres sont mutualisés ; ils ne sont pas appariés un pour un. Chaque réserve nécessite de la liquidité et des rééquilibrages. Le pétrole est une origine possible de devises parmi d’autres exportations. Sources S01 : FAQ A7 consultée le 19 novembre 2026 ; S03 : NCA août 2026 pp. 4–5 ; S04 : FinCEN 5 octobre 2026 p. 63213. Aucun navire, compte bancaire ou client particulier n’est représenté.</desc>
  <metadata>{"publisher": "l0g", "license": "CC-BY-4.0", "cutoff": "2026-11-19", "language": "fr", "chart": "compensation", "unit": "Qualitative payment and goods flows; no quantitative arrow weights", "period": "Public descriptions through 2026-11-19", "limits": "Illustrative mechanism, not a reconstructed individual transaction. Oil is one possible source of foreign currency. Arrows distinguish roubles, foreign currency, goods and bookkeeping.", "sources": [{"id": "S01", "url": "https://www.a7.ru/faq/"}, {"id": "S03", "url": "https://www.nationalcrimeagency.gov.uk/who-we-are/publications/826-necc-a7-sanctions-evasion-mechanism/file"}, {"id": "S04", "url": "https://www.govinfo.gov/content/pkg/FR-2026-10-05/pdf/2026-20371.pdf"}]}</metadata>
