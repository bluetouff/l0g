<svg xmlns="http://www.w3.org/2000/svg" id="sfo-transfer-fr-d-0" viewBox="0 0 1200 626" width="1200" height="626" role="img" aria-labelledby="sfo-transfer-fr-d-1 sfo-transfer-fr-d-3" xml:lang="fr" font-family="Inter Variable, Inter, sans-serif" font-weight="400">
  <title id="sfo-transfer-fr-d-1">Une coque, deux transferts</title>
  <desc id="sfo-transfer-fr-d-3">Deux scénarios théoriques, sans rattachement à un navire réel. À gauche, la vente d’un navire par la société A à la société B conduit, dans le cas illustré, à un changement de propriétaire inscrit. À droite, une cession des actions de contrôle de la société S change son actionnaire tandis que S peut rester propriétaire inscrit. Le numéro IMO du navire demeure identique dans les deux cas. Identifier le contrôle ultime exige de remonter la chaîne d’actionnariat et les droits de contrôle ; le schéma ne l’attribue à aucune personne.</desc>
  <metadata>{"publisher": "l0g", "license": "CC-BY-4.0", "cutoff": "2026-11-19", "language": "fr", "chart_type": "mecanisme-propriete", "sources": [{"id": "S02", "url": "https://www.imo.org/en/ourwork/iiis/pages/imo-identification-number-schemes.aspx"}, {"id": "S12", "url": "https://www.equasis.org/EquasisWeb/Static/MOA/Help/ShipInfo_Management.html"}, {"id": "S15", "url": "https://www.cr.gov.hk/en/electronic/e-servicesportal/faq/e-search.htm"}, {"id": "S16", "url": "https://www.cr.gov.hk/en/legislation/scr/faq.htm"}], "units": "generic legal ownership example; not an observed transaction", "limitations": "Sources and dates have distinct evidential roles. No ultimate beneficial owner or payment flow is asserted."}</metadata>
  <rect x="0" y="0" width="1200" height="626" rx="0" fill="#0c0d10"></rect>
  <text x="40" y="82" fill="#e7e9ee" font-family="Inter Variable, Inter, sans-serif" font-size="35" font-weight="400" text-anchor="start">Une coque, deux transferts</text>
  <text x="40" y="119" fill="#8b909b" font-family="Inter Variable, Inter, sans-serif" font-size="26" font-weight="400" text-anchor="start">Le navire et les actions de sa société propriétaire suivent deux opérations distinctes.</text>
