<svg xmlns="http://www.w3.org/2000/svg" id="sfi-limits-fr-d-0" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="sfi-limits-fr-d-1 sfi-limits-fr-d-3" font-family="Inter Variable, Inter, sans-serif" font-weight="400" xml:lang="fr">
  <title id="sfi-limits-fr-d-1">Les plafonds d’indemnisation</title>
  <desc id="sfi-limits-fr-d-3">Trois barres de même origine et de même échelle montrent le maximum du barème CLC, 89,77 millions de DTS, le total CLC et Fonds 1992, 203 millions, puis le total avec le Fonds complémentaire, 750 millions. Le plafond CLC varie avec la jauge brute du navire. La recevabilité du dommage et les exclusions, notamment guerre ou hostilités, sont examinées avant les plafonds. Pour un dommage recevable dans leur territoire, Oman participe au Fonds 1992 et la France aussi au Fonds complémentaire. Les valeurs ne chiffrent ni les dommages ni les paiements du Caroline Bezengi.</desc>
  <metadata>{"publisher": "l0g", "license": "CC-BY-4.0", "cutoff": "2026-11-19", "language": "fr", "chart": "plafonds", "unit": "Million Special Drawing Rights (SDR); cumulative statutory compensation limits per incident", "period": "Current limits and country status checked2026-11-19", "limits": "CLC89.77 is the maximum of a gross-tonnage-based scale, not every ship limit.203 includes CLC payments;750 includes CLC and1992Fund. Common zero and linear scale. Territory and admissibility apply. No valuation or available compensation for CarolineBezengi.", "sources": [{"id": "S05", "url": "https://documentservices.iopcfunds.org/download/85381/en/IOPC-OCT26-11-2_en.pdf"}, {"id": "S08", "url": "https://iopcfunds.org/wp-content/uploads/2018/06/Text-of-Conventions_e.pdf"}, {"id": "S10", "url": "https://iopcfunds.org/wp-content/uploads/2021/11/ITOPF-IG-IOPC-Compensation-booklet_e.pdf"}, {"id": "S11", "url": "https://documentservices.iopcfunds.org/wp-content/uploads/sites/2/2026/01/2026-1_ratifications_e.pdf"}, {"id": "S25", "url": "https://iopcfunds.org/about-us/legal-framework/1992-fund-convention-supplementary-fund-protocol/"}]}</metadata>
