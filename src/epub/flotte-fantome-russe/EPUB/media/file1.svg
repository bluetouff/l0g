<svg xmlns="http://www.w3.org/2000/svg" id="sfo-transfer-fr-m-0" viewBox="0 0 600 820" width="600" height="820" role="img" aria-labelledby="sfo-transfer-fr-m-1 sfo-transfer-fr-m-3" xml:lang="fr" font-family="Inter Variable, Inter, sans-serif" font-weight="400">
  <title id="sfo-transfer-fr-m-1">Une coque, deux transferts</title>
  <desc id="sfo-transfer-fr-m-3">Deux scénarios théoriques, sans rattachement à un navire réel. À gauche, la vente d’un navire par la société A à la société B conduit, dans le cas illustré, à un changement de propriétaire inscrit. À droite, une cession des actions de contrôle de la société S change son actionnaire tandis que S peut rester propriétaire inscrit. Le numéro IMO du navire demeure identique dans les deux cas. Identifier le contrôle ultime exige de remonter la chaîne d’actionnariat et les droits de contrôle ; le schéma ne l’attribue à aucune personne.</desc>
