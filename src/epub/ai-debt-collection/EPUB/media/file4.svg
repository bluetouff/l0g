<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="286" viewBox="0 0 360 286" role="img" aria-labelledby="ia3-en-fig1-title ia3-en-fig1-desc" focusable="false" style="display:block;width:100%;max-width:440px;height:auto;margin:0 auto;" font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="360" height="286" fill="#0b0d10"/>
<title id="ia3-en-fig1-title">Review flagged and unflagged cases</title>
<desc id="ia3-en-fig1-desc">Proposed, unexecuted protocol: review alerts for unwarranted classifications, then sample unflagged cases to identify missed needs. Use common context and criteria, retaining disagreements. No error rate has been calculated.</desc>
<rect x="0.5" y="0.5" width="359" height="285" rx="8" fill="#121419" stroke="rgba(255,255,255,0.20)" stroke-width="1" />
<text x="16" y="30" font-size="20" font-weight="600" fill="#e7e9ee">Check both sides</text>
<text x="16" y="65" font-size="14" font-weight="600" fill="#5eead4">FLAGGED</text>
<text x="196" y="65" font-size="14" font-weight="600" fill="#f5b13d">UNFLAGGED</text>
<text x="16" y="92" font-size="16" font-weight="400" fill="#e7e9ee">Check the alert,</text>
<text x="16" y="114" font-size="16" font-weight="400" fill="#e7e9ee">the need and</text>
<text x="16" y="136" font-size="16" font-weight="400" fill="#e7e9ee">the support given.</text>
<text x="196" y="92" font-size="16" font-weight="400" fill="#e7e9ee">Review a sample</text>
<text x="196" y="114" font-size="16" font-weight="400" fill="#e7e9ee">independently.</text>
<text x="196" y="136" font-size="16" font-weight="400" fill="#e7e9ee">Find missed needs.</text>
<line x1="16" y1="157" x2="344" y2="157" stroke="rgba(255,255,255,0.20)" stroke-width="1" />
<text x="16" y="184" font-size="14" font-weight="600" fill="#5eead4">A SHARED REVIEW FRAMEWORK</text>
<text x="16" y="209" font-size="16" font-weight="400" fill="#e7e9ee">Same context, predefined criteria,</text>
<text x="16" y="232" font-size="16" font-weight="400" fill="#e7e9ee">disagreements retained.</text>
<text x="16" y="267" font-size="16" font-weight="400" fill="#e7e9ee">No error rate calculated here.</text>
</svg>
