<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="294" viewBox="0 0 360 294" role="img" aria-labelledby="ia2-en-fig1-title ia2-en-fig1-desc" focusable="false" style="display:block;width:100%;max-width:440px;height:auto;margin:0 auto;" font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="360" height="294" fill="#0b0d10"/>
<title id="ia2-en-fig1-title">Three different measures</title>
<desc id="ia2-en-fig1-desc">An engagement measures a response; a receipt measures money received; verified resolution concerns the outcome of an agreement or dispute. These are not mandatory stages: an upheld dispute may close a case without payment.</desc>
<rect x="0.5" y="0.5" width="359" height="293" rx="8" fill="#121419" stroke="rgba(255,255,255,0.20)" stroke-width="1" />
<text x="16" y="30" font-size="20" font-weight="600" fill="#e7e9ee">What is being counted</text>
<text x="16" y="64" font-size="14" font-weight="600" fill="#5eead4">CONTACT</text>
<text x="16" y="87" font-size="16" font-weight="400" fill="#e7e9ee">An open, a reply, a commitment.</text>
<line x1="16" y1="102" x2="344" y2="102" stroke="rgba(255,255,255,0.20)" stroke-width="1" />
<text x="16" y="124" font-size="14" font-weight="600" fill="#5eead4">PAYMENT</text>
<text x="16" y="147" font-size="16" font-weight="400" fill="#e7e9ee">Reconcile receipts with</text>
<text x="16" y="168" font-size="16" font-weight="400" fill="#e7e9ee">reversals and refunds.</text>
<line x1="16" y1="183" x2="344" y2="183" stroke="rgba(255,255,255,0.20)" stroke-width="1" />
<text x="16" y="205" font-size="14" font-weight="600" fill="#5eead4">CASE OUTCOME</text>
<text x="16" y="228" font-size="16" font-weight="400" fill="#e7e9ee">Agreement kept or dispute handled.</text>
<text x="16" y="259" font-size="16" font-weight="400" fill="#e7e9ee">An upheld dispute may close</text>
<text x="16" y="280" font-size="16" font-weight="400" fill="#e7e9ee">the case without payment.</text>
</svg>
