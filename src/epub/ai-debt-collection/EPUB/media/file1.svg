<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="286" viewBox="0 0 360 286" role="img" aria-labelledby="ia1-en-fig2-title ia1-en-fig2-desc" focusable="false" style="display:block;width:100%;max-width:440px;height:auto;margin:0 auto;" font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="360" height="286" fill="#0b0d10"/>
<title id="ia1-en-fig2-title">From input to action: four functions</title>
<desc id="ia1-en-fig2-desc">An analytical framework: case data can feed an assessment and action selection. A message can use a template, be written by a person or be generated. Taking action on the case requires the relevant authority. Execution has to be checked in the case record. Human checks can occur at several stages.</desc>
<rect x="0.5" y="0.5" width="359" height="285" rx="8" fill="#121419" stroke="rgba(255,255,255,0.20)" stroke-width="1" />
<text x="16" y="30" font-size="20" font-weight="600" fill="#e7e9ee">From the file to action</text>
<text x="16" y="64" font-size="14" font-weight="600" fill="#5eead4">01</text>
<text x="46" y="64" font-size="16" font-weight="600" fill="#e7e9ee">Case data</text>
<text x="16" y="87" font-size="16" font-weight="400" fill="#e7e9ee">Invoices, payments, corrections.</text>
<line x1="16" y1="99" x2="344" y2="99" stroke="rgba(255,255,255,0.20)" stroke-width="1" />
<text x="16" y="122" font-size="14" font-weight="600" fill="#5eead4">02</text>
<text x="46" y="122" font-size="16" font-weight="600" fill="#e7e9ee">Assessment and routing</text>
<text x="16" y="145" font-size="16" font-weight="400" fill="#e7e9ee">A possible score and case rules.</text>
<line x1="16" y1="157" x2="344" y2="157" stroke="rgba(255,255,255,0.20)" stroke-width="1" />
<text x="16" y="180" font-size="14" font-weight="600" fill="#5eead4">03</text>
<text x="46" y="180" font-size="16" font-weight="600" fill="#e7e9ee">Writing the message</text>
<text x="16" y="203" font-size="16" font-weight="400" fill="#e7e9ee">Template, human or generated text.</text>
<line x1="16" y1="215" x2="344" y2="215" stroke="rgba(255,255,255,0.20)" stroke-width="1" />
<text x="16" y="238" font-size="14" font-weight="600" fill="#5eead4">04</text>
<text x="46" y="238" font-size="16" font-weight="600" fill="#e7e9ee">Action on the case</text>
<text x="16" y="261" font-size="16" font-weight="400" fill="#e7e9ee">Within its permissions and controls.</text>
</svg>
