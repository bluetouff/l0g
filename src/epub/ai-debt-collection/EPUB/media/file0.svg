<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="286" viewBox="0 0 360 286" role="img" aria-labelledby="ia1-en-fig1-title ia1-en-fig1-desc" focusable="false" style="display:block;width:100%;max-width:440px;height:auto;margin:0 auto;" font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="360" height="286" fill="#0b0d10"/>
<title id="ia1-en-fig1-title">Collection mandate or sale of a claim</title>
<desc id="ia1-en-fig1-desc">Under a collection mandate, the creditor retains the claim and appoints a collector. Under an assignment, the original creditor transfers the claim to a new creditor, which can also appoint a collector. These are alternatives, not mandatory consecutive steps.</desc>
<rect x="0.5" y="0.5" width="359" height="285" rx="8" fill="#121419" stroke="rgba(255,255,255,0.20)" stroke-width="1" />
<text x="16" y="30" font-size="20" font-weight="600" fill="#e7e9ee">Mandate or assignment</text>
<text x="16" y="62" font-size="14" font-weight="600" fill="#5eead4">01 · COLLECTION MANDATE</text>
<text x="16" y="91" font-size="16" font-weight="600" fill="#e7e9ee">Creditor</text>
<text x="16" y="113" font-size="16" font-weight="400" fill="#e7e9ee">keeps the claim</text>
<text x="204" y="91" font-size="16" font-weight="600" fill="#e7e9ee">Collector</text>
<text x="204" y="113" font-size="16" font-weight="400" fill="#e7e9ee">acts for them</text>
<line x1="169" y1="96" x2="191" y2="96" stroke="#5eead4" stroke-width="1" /><line x1="186" y1="92" x2="191" y2="96" stroke="#5eead4" stroke-width="1" /><line x1="186" y1="100" x2="191" y2="96" stroke="#5eead4" stroke-width="1" />
<line x1="16" y1="137" x2="344" y2="137" stroke="rgba(255,255,255,0.20)" stroke-width="1" />
<text x="16" y="163" font-size="14" font-weight="600" fill="#f5b13d">02 · ASSIGNMENT</text>
<text x="16" y="192" font-size="16" font-weight="600" fill="#e7e9ee">Original creditor</text>
<text x="204" y="192" font-size="16" font-weight="600" fill="#e7e9ee">New creditor</text>
<text x="204" y="214" font-size="16" font-weight="400" fill="#e7e9ee">owns the claim</text>
<line x1="169" y1="197" x2="191" y2="197" stroke="#5eead4" stroke-width="1" /><line x1="186" y1="193" x2="191" y2="197" stroke="#5eead4" stroke-width="1" /><line x1="186" y1="201" x2="191" y2="197" stroke="#5eead4" stroke-width="1" />
<text x="16" y="246" font-size="16" font-weight="400" fill="#e7e9ee">The buyer can also</text>
<text x="16" y="267" font-size="16" font-weight="400" fill="#e7e9ee">appoint a debt collector.</text>
</svg>
