<title id="ai-debt-en-durations-title">Two different time horizons</title>
<desc id="ai-debt-en-durations-desc">CoreWeave DDTL 5.5 financing announced August 10, 2026. Approximate durations: initial customer contracts, three years on average; loan, five years. Both bars use the same scale in years. This chart does not represent outstanding principal.</desc>
