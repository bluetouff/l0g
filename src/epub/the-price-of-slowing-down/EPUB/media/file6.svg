<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420" role="img" aria-labelledby="ai-chips-en-bottleneck-title ai-chips-en-bottleneck-desc" style="width:100%;height:auto" font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="500" height="420" fill="#0b0d10"/>
<title id="ai-chips-en-bottleneck-title">Compute or data transfer?</title>
<desc id="ai-chips-en-bottleneck-desc">Entirely hypothetical example. Same task, fully overlapping computation and transfer. Baseline: compute 20 ms, transfer 80 ms, lower bound 80 ms. Twice the compute: 10 ms and 80 ms, lower bound 80 ms. Twice the bandwidth: 20 ms and 40 ms, lower bound 40 ms. All six bars start at zero; ideal duration = maximum of the two times.</desc>
<rect x="0" y="0" width="500" height="420" rx="6" fill="#121419"/>
<text x="24" y="34" font-size="24" font-weight="700" text-anchor="start" fill="#e7e9ee">Compute or data transfer?</text>
<text x="24" y="60" font-size="20" font-weight="400" text-anchor="start" fill="#8b909b">Simulation · same task</text>
<rect x="24" y="74" width="16.000000" height="16" fill="#5eead4"/>
<text x="48" y="89" font-size="20" font-weight="400" text-anchor="start" fill="#e7e9ee">Compute</text>
<rect x="250" y="74" width="16.000000" height="16" fill="#ff4d87"/>
<text x="274" y="89" font-size="20" font-weight="400" text-anchor="start" fill="#e7e9ee">Transfer</text>
<text x="24" y="117" font-size="22" font-weight="700" text-anchor="start" fill="#e7e9ee">Baseline</text>
<text x="476" y="117" font-size="20" font-weight="400" text-anchor="end" fill="#e7e9ee">Lower bound: 80 ms</text>
<rect x="24" y="131" width="80.000000" height="18" fill="#5eead4"/>
<text x="114" y="147" font-size="20" font-weight="400" text-anchor="start" fill="#e7e9ee">20</text>
<rect x="24" y="159" width="320.000000" height="18" fill="#ff4d87"/>
<text x="354" y="175" font-size="20" font-weight="400" text-anchor="start" fill="#e7e9ee">80</text>
<text x="24" y="205" font-size="22" font-weight="700" text-anchor="start" fill="#e7e9ee">Compute ×2</text>
<text x="476" y="205" font-size="20" font-weight="400" text-anchor="end" fill="#e7e9ee">Lower bound: 80 ms</text>
<rect x="24" y="219" width="40.000000" height="18" fill="#5eead4"/>
<text x="74" y="235" font-size="20" font-weight="400" text-anchor="start" fill="#e7e9ee">10</text>
<rect x="24" y="247" width="320.000000" height="18" fill="#ff4d87"/>
<text x="354" y="263" font-size="20" font-weight="400" text-anchor="start" fill="#e7e9ee">80</text>
