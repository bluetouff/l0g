<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 362" role="img" aria-labelledby="ai-slowdown-en-gate-title ai-slowdown-en-gate-desc" style="width:100%;height:auto" font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="500" height="362" fill="#0b0d10"/>
<title id="ai-slowdown-en-gate-title">Who decides after the test?</title>
<desc id="ai-slowdown-en-gate-desc">Two 2026 proposals. Under the Hassabis framework, after a voluntary phase, passing the test would condition US market access for covered models. OpenAI proposes mandatory CAISI assessment informing a decision that remains with the developer, without a CAISI veto. Neither proposal is presented here as an enacted requirement.</desc>
<rect x="0" y="0" width="500" height="362" rx="6" fill="#121419"/>
<text x="24" y="34" font-size="24" font-weight="700" text-anchor="start" fill="#e7e9ee">Who decides after the test?</text>
<text x="24" y="66" font-size="20" font-weight="400" text-anchor="start" fill="#8b909b">Two proposals, June–July 2026</text>
<text x="128" y="111" font-size="22" font-weight="700" text-anchor="middle" fill="#ff4d87">Hassabis</text>
<text x="372" y="111" font-size="22" font-weight="700" text-anchor="middle" fill="#5eead4">OpenAI</text>
<g>
<rect x="24" y="131" width="208" height="56" rx="6" fill="#121419" stroke="rgba(255,255,255,0.20)"/>
<text x="128.0" y="167.0" font-size="22" font-weight="700" text-anchor="middle" fill="#ff4d87">Test passed</text>
</g>
<g>
<rect x="268" y="131" width="208" height="56" rx="6" fill="#121419" stroke="rgba(255,255,255,0.20)"/>
<text x="372.0" y="167.0" font-size="22" font-weight="700" text-anchor="middle" fill="#5eead4">Assessment</text>
</g>
<path d="M128 195V233 M122 226L128 233L134 226" fill="none" stroke="#ff4d87" stroke-width="2"/>
<path d="M372 195V233 M366 226L372 233L378 226" fill="none" stroke="#5eead4" stroke-width="2"/>
<g>
<rect x="24" y="241" width="208" height="72" rx="6" fill="#121419" stroke="rgba(255,255,255,0.20)"/>
<text x="128.0" y="271.5" font-size="22" font-weight="700" text-anchor="middle" fill="#ff4d87">US market</text>
<text x="128.0" y="298.5" font-size="22" font-weight="700" text-anchor="middle" fill="#ff4d87">access</text>
</g>
<g>
<rect x="268" y="241" width="208" height="72" rx="6" fill="#121419" stroke="rgba(255,255,255,0.20)"/>
<text x="372.0" y="271.5" font-size="22" font-weight="700" text-anchor="middle" fill="#5eead4">Developer</text>
<text x="372.0" y="298.5" font-size="22" font-weight="700" text-anchor="middle" fill="#5eead4">decides</text>
</g>
<text x="128" y="344" font-size="20" font-weight="400" text-anchor="middle" fill="#8b909b">Pass required</text>
<text x="372" y="344" font-size="20" font-weight="400" text-anchor="middle" fill="#8b909b">No CAISI veto</text>
</svg>
