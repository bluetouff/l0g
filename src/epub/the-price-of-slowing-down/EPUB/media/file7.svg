<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420" role="img" aria-labelledby="ai-chips-en-yield-title ai-chips-en-yield-desc" style="width:100%;height:auto" font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="500" height="420" fill="#0b0d10"/>
<title id="ai-chips-en-yield-title">More dies, same usable output</title>
<desc id="ai-chips-en-yield-desc">Entirely hypothetical example, equal-capacity dies. Process A: 100 gross dies per wafer, 90% yield, 90 usable and 10 rejected. Process B: 150 gross dies, 60% yield, 90 usable and 60 rejected. Two stacked bars share a 0–150-die scale. No actual manufacturing yield is represented.</desc>
<rect x="0" y="0" width="500" height="420" rx="6" fill="#121419"/>
<text x="24" y="34" font-size="24" font-weight="700" text-anchor="start" fill="#e7e9ee">More dies, same usable output</text>
<text x="24" y="68" font-size="20" font-weight="400" text-anchor="start" fill="#8b909b">Simulation · one wafer per process</text>
<rect x="24" y="88" width="16.000000" height="16" fill="#5eead4"/>
<text x="48" y="103" font-size="20" font-weight="400" text-anchor="start" fill="#e7e9ee">Usable</text>
<rect x="250" y="88" width="16.000000" height="16" fill="#ff4d87"/>
<text x="274" y="103" font-size="20" font-weight="400" text-anchor="start" fill="#e7e9ee">Rejected</text>
<text x="24" y="146" font-size="22" font-weight="700" text-anchor="start" fill="#e7e9ee">Process A</text>
<text x="476" y="146" font-size="22" font-weight="400" text-anchor="end" fill="#e7e9ee">Yield: 90%</text>
<rect x="24" y="163" width="234.000000" height="26" fill="#5eead4"/>
<rect x="258.0" y="163" width="26.000000" height="26" fill="#ff4d87"/>
<text x="24" y="215" font-size="20" font-weight="400" text-anchor="start" fill="#8b909b">90 usable + 10 rejected = 100</text>
<text x="24" y="248" font-size="22" font-weight="700" text-anchor="start" fill="#e7e9ee">Process B</text>
<text x="476" y="248" font-size="22" font-weight="400" text-anchor="end" fill="#e7e9ee">Yield: 60%</text>
<rect x="24" y="265" width="234.000000" height="26" fill="#5eead4"/>
<rect x="258.0" y="265" width="156.000000" height="26" fill="#ff4d87"/>
<text x="24" y="317" font-size="20" font-weight="400" text-anchor="start" fill="#8b909b">90 usable + 60 rejected = 150</text>
<path d="M24 352H414 M24 348V356 M154 348V356 M284 348V356 M414 348V356" fill="none" stroke="#8b909b" stroke-width="2"/>
<text x="24.0" y="383" font-size="20" font-weight="400" text-anchor="middle" fill="#8b909b">0</text>
<text x="154.0" y="383" font-size="20" font-weight="400" text-anchor="middle" fill="#8b909b">50</text>
<text x="284.0" y="383" font-size="20" font-weight="400" text-anchor="middle" fill="#8b909b">100</text>
<text x="414.0" y="383" font-size="20" font-weight="400" text-anchor="middle" fill="#8b909b">150</text>
<text x="250" y="409" font-size="20" font-weight="400" text-anchor="middle" fill="#8b909b">Dies per wafer · equal capacity</text>
</svg>
