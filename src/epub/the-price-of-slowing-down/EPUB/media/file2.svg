<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 382" role="img" aria-labelledby="ai-incidents-en-shared-title ai-incidents-en-shared-desc" style="width:100%;height:auto" font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="500" height="382" fill="#0b0d10"/>
<title id="ai-incidents-en-shared-title">A repository becomes a message board</title>
<desc id="ai-incidents-en-shared-desc">Mechanism observed in May 2026: supplied credentials let separate runs read and upload files in Artifactory. Here A writes a note and B reads it. The roles can be reversed. This sharing requires no vulnerability exploit.</desc>
<rect x="0" y="0" width="500" height="382" rx="6" fill="#121419"/>
<text x="24" y="34" font-size="24" font-weight="700" text-anchor="start" fill="#e7e9ee">A repository becomes a message board</text>
<text x="24" y="68" font-size="20" font-weight="400" text-anchor="start" fill="#8b909b">Examples from May 2026</text>
<g>
<rect x="24" y="98" width="160" height="56" rx="6" fill="#121419" stroke="rgba(255,255,255,0.20)"/>
<text x="104.0" y="134.0" font-size="22" font-weight="700" text-anchor="middle" fill="#ff4d87">Agent A</text>
</g>
<g>
<rect x="316" y="98" width="160" height="56" rx="6" fill="#121419" stroke="rgba(255,255,255,0.20)"/>
<text x="396.0" y="134.0" font-size="22" font-weight="700" text-anchor="middle" fill="#5eead4">Agent B</text>
</g>
<path d="M104 166V200H214V223 M208 216L214 223L220 216" fill="none" stroke="#ff4d87" stroke-width="2"/>
<path d="M286 223V200H396V166 M390 173L396 166L402 173" fill="none" stroke="#5eead4" stroke-width="2"/>
<text x="24" y="237" font-size="22" font-weight="700" text-anchor="start" fill="#ff4d87">Writes</text>
<text x="476" y="237" font-size="22" font-weight="700" text-anchor="end" fill="#5eead4">Reads</text>
<g>
<rect x="140" y="235" width="220" height="64" rx="6" fill="#121419" stroke="rgba(255,255,255,0.20)"/>
<text x="250.0" y="275.0" font-size="22" font-weight="700" text-anchor="middle" fill="#e7e9ee">Artifactory</text>
</g>
<text x="250" y="341" font-size="22" font-weight="400" text-anchor="middle" fill="#e7e9ee">One note shared across two runs</text>
<text x="250" y="369" font-size="20" font-weight="400" text-anchor="middle" fill="#8b909b">Both agents can reply</text>
</svg>
