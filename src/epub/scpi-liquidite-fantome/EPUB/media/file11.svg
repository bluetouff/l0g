<title id="scpi4-fr-3-title">Un bail, trois lectures</title><desc id="scpi4-fr-3-desc">Exemple fictif : 1 000 m², loyer facial 300 euros par m² et par an, six années fermes. Avec douze mois gratuits dans le bail et 150 000 euros de travaux, le solde annualisé sur le bail vaut 225 euros. En ajoutant six mois vacants avant le bail, il vaut 207,69 euros sur 78 mois. Charges, impôts, financement, indexation et actualisation exclus.</desc>
