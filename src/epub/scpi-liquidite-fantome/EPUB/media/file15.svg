<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 760" role="img" aria-labelledby="scpi6-fr-1-title scpi6-fr-1-desc" focusable="false" lang="fr" style="display:block;width:100%;height:auto;background:#0b0d10;font-family:ui-monospace,monospace"><rect x="0" y="0" width="520" height="760" fill="#0b0d10"/>
<title id="scpi6-fr-1-title">De la SCPI à l’épargnant</title><desc id="scpi6-fr-1-desc">Praemia décrit la prise en compte des prix de confrontation de Primopierre dans la valorisation de Capimmo. La valeur d’une unité de compte évolue avec celle du support. Ce schéma ne mesure aucun flux de trésorerie ni aucune perte bancaire.</desc>
<rect x="0" y="0" width="520" height="760" fill="#0b0d10"/>
<text x="28" y="38" font-size="20" fill="#5eead4" text-anchor="start">l0g / SCPI / 06</text>
<text x="28" y="83" font-size="26" fill="#f5f5f7" text-anchor="start">De la SCPI à l’épargnant</text>
<text x="28" y="126" font-size="22" fill="#aab3c2" text-anchor="start">Capimmo · bulletin T2 2026</text>
<rect x="28" y="170" width="464" height="102" fill="#18202b"/>
<text x="48" y="207" font-size="24" fill="#5eead4" text-anchor="start">PRIMOPIERRE</text>
<text x="48" y="246" font-size="20" fill="#f5f5f7" text-anchor="start">Prix des parts en confrontation</text>
<line x1="56" y1="282" x2="56" y2="322" stroke="#475569" stroke-width="2"/>
<path d="M 50 315 L 56 325 L 62 315" fill="none" stroke="#aab3c2" stroke-width="2"/>
<text x="85" y="311" font-size="20" fill="#aab3c2" text-anchor="start">Selon Praemia REIM</text>
<rect x="28" y="336" width="464" height="102" fill="#18202b"/>
<text x="48" y="373" font-size="24" fill="#5eead4" text-anchor="start">CAPIMMO</text>
<text x="48" y="412" font-size="20" fill="#f5f5f7" text-anchor="start">Ajustement de valorisation</text>
<line x1="56" y1="448" x2="56" y2="488" stroke="#475569" stroke-width="2"/>
<path d="M 50 481 L 56 491 L 62 481" fill="none" stroke="#aab3c2" stroke-width="2"/>
<text x="85" y="477" font-size="20" fill="#aab3c2" text-anchor="start">Valeur du support transmise</text>
<rect x="28" y="502" width="464" height="102" fill="#18202b"/>
<text x="48" y="539" font-size="24" fill="#5eead4" text-anchor="start">UNITÉ DE COMPTE</text>
<text x="48" y="578" font-size="20" fill="#f5f5f7" text-anchor="start">Valeur des droits de l’assuré</text>
<text x="28" y="654" font-size="22" fill="#f5b13d" text-anchor="start">Effet financier non chiffré ici.</text>
<text x="28" y="698" font-size="20" fill="#aab3c2" text-anchor="start">Schéma de valorisation ;</text>
<text x="28" y="732" font-size="20" fill="#aab3c2" text-anchor="start">les paiements suivent leur calendrier.</text>
