<title id="scpi4-fr-1-title">Primopierre : occupation</title><desc id="scpi4-fr-1-desc">Les composantes 73,3 %, 6,7 % et 1,7 % sont incluses dans le TOF de 81,7 %. Les 18,3 % de locaux vacants proposés à la location ne le sont pas. Les pourcentages portent sur le revenu locatif potentiel, pas les surfaces ni les sommes encaissées.</desc>
<rect x="0" y="0" width="520" height="778" fill="#0b0d10"/>
<text x="28" y="38" font-size="20" fill="#5eead4" text-anchor="start">l0g / SCPI / 04</text>
<text x="28" y="83" font-size="26" fill="#f5f5f7" text-anchor="start">Primopierre : occupation</text>
<text x="28" y="119" font-size="22" fill="#aab3c2" text-anchor="start">Composantes du TOF · T2 2026</text>
<text x="28" y="155" font-size="20" fill="#aab3c2" text-anchor="start">Part du revenu locatif potentiel</text>
<text x="28" y="193" font-size="20" fill="#aab3c2" text-anchor="start">0</text>
