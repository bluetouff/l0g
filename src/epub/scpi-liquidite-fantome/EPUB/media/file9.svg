<rect data-bar="true" x="28" y="575" width="84.912000" height="20" fill="#ff4d87"/>
<text x="28" y="642" font-size="20" fill="#aab3c2" text-anchor="start">73,3 + 6,7 + 1,7 = 81,7 %</text>
<text x="28" y="676" font-size="20" fill="#aab3c2" text-anchor="start">TOF : pondération par les loyers</text>
<text x="28" y="710" font-size="20" fill="#aab3c2" text-anchor="start">Les encaissements sont distincts.</text>
<text x="28" y="744" font-size="20" fill="#aab3c2" text-anchor="start">Source : Praemia · T2 2026, p. 4</text>
