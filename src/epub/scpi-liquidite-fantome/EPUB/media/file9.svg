<text x="492" y="369" font-size="26" fill="#f5b13d" text-anchor="end">6,7 %</text>
<rect x="28" y="383" width="464" height="20" fill="#1b2430"/>
<rect data-bar="true" x="28" y="383" width="31.088000" height="20" fill="#f5b13d"/>
