<title id="scpi6-fr-2-title">Le périmètre des banques</title><desc id="scpi6-fr-2-desc">ACPR, cinq groupes, 31 décembre 2025. 527,9 Md€ de concours et 30,1 Md€ pour compte propre composent 558 Md€. Les 238,7 Md€ aux professionnels sont inclus dans les concours. Axe commun de zéro à 600 Md€. Ce sont des expositions, sans estimation de pertes.</desc>
