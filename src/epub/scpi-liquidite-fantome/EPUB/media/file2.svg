<title id="scpi-fr-3-title">Primopierre : registres et transactions</title>
<desc id="scpi-fr-3-desc">2 190 372 parts en attente de retrait au 31 décembre 2025, 146 937 parts en attente de cession au 30 juin 2026. Les deux stocks incluent les demandes confirmées et non confirmées. Flux brut de 6 907 parts échangées de mars à juin 2026 sur le marché organisé, hors gré à gré. Aucun suivi des anciennes demandes individuellement.</desc>
