<title id="scpi3-fr-denominator-title">Primopierre, dividende et taux publié</title>
<desc id="scpi3-fr-denominator-desc">Primopierre 2024 : dividende brut 6,38 euros, prix de référence 180 euros, taux 3,54 %. En 2025 : 4,56 euros, 126 euros, 3,62 %. Dividende moins 28,5 %, référence moins 30 %.</desc>
