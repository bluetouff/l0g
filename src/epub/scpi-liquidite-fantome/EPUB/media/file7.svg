<title id="scpi3-fr-payout-mix-title">Élysées Pierre, origine de la distribution</title>
<desc id="scpi3-fr-payout-mix-desc">Élysées Pierre au premier semestre 2026 : distribution de 15 euros par part, dont 9,85 euros de revenus fonciers, 4,95 de plus-values nettes et 0,20 de report à nouveau. Les deux dernières catégories totalisent 34,3 %. Périmètre IRPP France du bulletin, pas revenu après toute fiscalité personnelle.</desc>
