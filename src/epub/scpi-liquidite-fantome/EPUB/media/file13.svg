<text x="28" y="235" font-size="22" fill="#f5f5f7" text-anchor="start">Jusqu’à un an</text>
<text x="28" y="279" font-size="30" fill="#5eead4" text-anchor="start">0 M€</text>
<rect x="28" y="300" width="464" height="22" fill="#18202b"/>
