<text x="28" y="119" font-size="22" fill="#aab3c2" text-anchor="start">Primopierre · fin 2025</text>
<text x="28" y="155" font-size="20" fill="#aab3c2" text-anchor="start">Stock par maturité résiduelle · M€</text>
<text x="28" y="193" font-size="20" fill="#aab3c2" text-anchor="start">0</text>
<text x="260" y="193" font-size="20" fill="#aab3c2" text-anchor="middle">100</text>
<text x="492" y="193" font-size="20" fill="#aab3c2" text-anchor="end">200</text>
