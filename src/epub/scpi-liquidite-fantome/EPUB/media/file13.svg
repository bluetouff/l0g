<title id="scpi5-fr-2-title">Échéances de la SCPI seule</title><desc id="scpi5-fr-2-desc">Primopierre au 31 décembre 2025, classement par maturité résiduelle des emprunts hypothécaires de la seule SCPI : 0 M€ jusqu’à un an, 153 M€ entre un et cinq ans, 175,20 M€ au-delà de cinq ans. Les 618,23 M€ des filiales ne sont pas ventilés. Ce tableau ne détaille pas tous les remboursements intermédiaires.</desc>
<rect x="0" y="0" width="520" height="798" fill="#0b0d10"/>
<text x="28" y="38" font-size="20" fill="#5eead4" text-anchor="start">l0g / SCPI / 05</text>
