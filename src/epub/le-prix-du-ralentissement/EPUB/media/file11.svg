<text x="24" y="68" font-size="20" font-weight="400" text-anchor="start" fill="#8b909b">CoreWeave · annonce du 10 août 2026</text>
<text x="24" y="124" font-size="22" font-weight="700" text-anchor="start" fill="#e7e9ee">Clients · durée moyenne</text>
<text x="476" y="124" font-size="22" font-weight="400" text-anchor="end" fill="#e7e9ee">≈ 3 ans</text>
<rect x="40.000000" y="144" width="240.000000" height="32" fill="#5eead4"/>
<text x="24" y="234" font-size="22" font-weight="700" text-anchor="start" fill="#e7e9ee">Prêt · durée totale</text>
<text x="476" y="234" font-size="22" font-weight="400" text-anchor="end" fill="#e7e9ee">≈ 5 ans</text>
