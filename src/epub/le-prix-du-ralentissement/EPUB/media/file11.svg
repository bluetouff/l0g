<title id="ai-debt-fr-durations-title">Deux durées à financer</title>
<desc id="ai-debt-fr-durations-desc">CoreWeave, financement DDTL 5.5 annoncé le 10 août 2026. Durées approximatives : contrats clients initiaux, trois ans en moyenne ; prêt, cinq ans. Deux barres de même échelle, en années. Ce graphique ne représente pas le capital restant dû.</desc>
<rect x="0" y="0" width="500" height="420" rx="6" fill="#121419"/>
