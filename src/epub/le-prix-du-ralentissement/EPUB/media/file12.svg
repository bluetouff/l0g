<title id="ai-debt-fr-guarantee-title">Ce que paie la garantie</title>
<desc id="ai-debt-fr-guarantee-desc">Exemple fictif, unités monétaires, seuil 80. Toutes les conditions de déclenchement sont supposées remplies. Compensation égale au maximum entre 80 moins la valeur du bien et zéro. Valeur 50 : paiement 30 ; valeur 90 : paiement zéro.</desc>
