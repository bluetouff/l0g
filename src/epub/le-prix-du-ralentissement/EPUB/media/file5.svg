<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420" role="img" aria-labelledby="ai-models-fr-cost-title ai-models-fr-cost-desc" style="width:100%;height:auto" font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="500" height="420" fill="#0b0d10"/>
<title id="ai-models-fr-cost-title">Quand la correction coûte plus</title>
<desc id="ai-models-fr-cost-desc">Simulation fictive, 1 000 tâches acceptées de même qualité. A : calcul 40 dollars, travail humain 1 000 dollars, total 1 040 dollars. B : calcul 200 dollars, travail humain 250 dollars, total 450 dollars. Coût humain : 30 dollars par heure ; deux minutes par tâche pour A, trente secondes pour B. Barres empilées de 0 à 1 200 dollars.</desc>
<rect x="0" y="0" width="500" height="420" rx="6" fill="#121419"/>
<text x="24" y="34" font-size="24" font-weight="700" text-anchor="start" fill="#e7e9ee">Quand la correction coûte plus</text>
<text x="24" y="68" font-size="20" font-weight="400" text-anchor="start" fill="#8b909b">Simulation · 1 000 tâches acceptées</text>
<rect x="24" y="89" width="16.000000" height="16" fill="#5eead4"/>
<text x="48" y="104" font-size="20" font-weight="400" text-anchor="start" fill="#e7e9ee">Calcul</text>
<rect x="260" y="89" width="16.000000" height="16" fill="#ff4d87"/>
<text x="284" y="104" font-size="20" font-weight="400" text-anchor="start" fill="#e7e9ee">Travail humain</text>
<text x="24" y="148" font-size="22" font-weight="700" text-anchor="start" fill="#e7e9ee">Solution A</text>
<text x="476" y="148" font-size="22" font-weight="700" text-anchor="end" fill="#e7e9ee">1 040 $</text>
<rect x="24" y="164" width="13.333333" height="26" fill="#5eead4"/>
<rect x="37.333333333333336" y="164" width="333.333333" height="26" fill="#ff4d87"/>
<text x="24" y="217" font-size="20" font-weight="400" text-anchor="start" fill="#8b909b">Calcul 40 $ + humain 1 000 $</text>
<text x="24" y="252" font-size="22" font-weight="700" text-anchor="start" fill="#e7e9ee">Solution B</text>
<text x="476" y="252" font-size="22" font-weight="700" text-anchor="end" fill="#e7e9ee">450 $</text>
<rect x="24" y="268" width="66.666667" height="26" fill="#5eead4"/>
<rect x="90.66666666666667" y="268" width="83.333333" height="26" fill="#ff4d87"/>
<text x="24" y="321" font-size="20" font-weight="400" text-anchor="start" fill="#8b909b">Calcul 200 $ + humain 250 $</text>
<path d="M24 354H424 M24 350V358 M224 350V358 M424 350V358" fill="none" stroke="#8b909b" stroke-width="2"/>
<text x="24.0" y="384" font-size="20" font-weight="400" text-anchor="middle" fill="#8b909b">0</text>
<text x="224.0" y="384" font-size="20" font-weight="400" text-anchor="middle" fill="#8b909b">600</text>
<text x="424.0" y="384" font-size="20" font-weight="400" text-anchor="middle" fill="#8b909b">1 200</text>
<text x="250" y="409" font-size="20" font-weight="400" text-anchor="middle" fill="#8b909b">Dollars US · même échelle</text>
</svg>
