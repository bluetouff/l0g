<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420" role="img" aria-labelledby="ai-chips-fr-yield-title ai-chips-fr-yield-desc" style="width:100%;height:auto" font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="500" height="420" fill="#0b0d10"/>
<title id="ai-chips-fr-yield-title">Plus de circuits, même sortie</title>
<desc id="ai-chips-fr-yield-desc">Exemple entièrement fictif, circuits de même capacité. Procédé A : 100 circuits bruts par tranche, rendement 90 %, 90 utilisables et 10 rejetés. Procédé B : 150 circuits bruts, rendement 60 %, 90 utilisables et 60 rejetés. Deux barres empilées sur la même échelle de 0 à 150 circuits. Aucun rendement industriel réel n’est représenté.</desc>
<rect x="0" y="0" width="500" height="420" rx="6" fill="#121419"/>
<text x="24" y="34" font-size="24" font-weight="700" text-anchor="start" fill="#e7e9ee">Plus de circuits, même sortie</text>
<text x="24" y="68" font-size="20" font-weight="400" text-anchor="start" fill="#8b909b">Simulation · une tranche par procédé</text>
<rect x="24" y="88" width="16.000000" height="16" fill="#5eead4"/>
<text x="48" y="103" font-size="20" font-weight="400" text-anchor="start" fill="#e7e9ee">Utilisables</text>
<rect x="250" y="88" width="16.000000" height="16" fill="#ff4d87"/>
<text x="274" y="103" font-size="20" font-weight="400" text-anchor="start" fill="#e7e9ee">Rejetés</text>
<text x="24" y="146" font-size="22" font-weight="700" text-anchor="start" fill="#e7e9ee">Procédé A</text>
<text x="476" y="146" font-size="22" font-weight="400" text-anchor="end" fill="#e7e9ee">Rendement : 90 %</text>
<rect x="24" y="163" width="234.000000" height="26" fill="#5eead4"/>
<rect x="258.0" y="163" width="26.000000" height="26" fill="#ff4d87"/>
<text x="24" y="215" font-size="20" font-weight="400" text-anchor="start" fill="#8b909b">90 utilisables + 10 rejetés = 100</text>
<text x="24" y="248" font-size="22" font-weight="700" text-anchor="start" fill="#e7e9ee">Procédé B</text>
<text x="476" y="248" font-size="22" font-weight="400" text-anchor="end" fill="#e7e9ee">Rendement : 60 %</text>
<rect x="24" y="265" width="234.000000" height="26" fill="#5eead4"/>
<rect x="258.0" y="265" width="156.000000" height="26" fill="#ff4d87"/>
<text x="24" y="317" font-size="20" font-weight="400" text-anchor="start" fill="#8b909b">90 utilisables + 60 rejetés = 150</text>
<path d="M24 352H414 M24 348V356 M154 348V356 M284 348V356 M414 348V356" fill="none" stroke="#8b909b" stroke-width="2"/>
<text x="24.0" y="383" font-size="20" font-weight="400" text-anchor="middle" fill="#8b909b">0</text>
<text x="154.0" y="383" font-size="20" font-weight="400" text-anchor="middle" fill="#8b909b">50</text>
<text x="284.0" y="383" font-size="20" font-weight="400" text-anchor="middle" fill="#8b909b">100</text>
<text x="414.0" y="383" font-size="20" font-weight="400" text-anchor="middle" fill="#8b909b">150</text>
<text x="250" y="409" font-size="20" font-weight="400" text-anchor="middle" fill="#8b909b">Circuits par tranche · capacité identique</text>
</svg>
