<svg xmlns="http://www.w3.org/2000/svg" width="320" viewBox="0 0 320 330" role="img" aria-labelledby="nv14-capital-en-mobile-title nv14-capital-en-mobile-desc" xml:lang="en" height="330"><title id="nv14-capital-en-mobile-title">Capital and demand for chips</title><desc id="nv14-capital-en-mobile-desc">Possible supplier-financing circuits, based on Nvidia’s filing for the quarter ended 26 July 2026. Nvidia can invest in AI labs, which purchase compute from clouds that buy Nvidia equipment. Other investors and operating revenue also fund the labs; the clouds have other financing sources. Each arrow represents a separate transaction. The diagram represents possible relationships rather than the path of a particular dollar.</desc><rect x="0.6" y="0.6" width="318.8" height="328.8" rx="3" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.1"></rect><text x="18" y="28" font-family="l0g Nvidia Client Financing" font-size="16" font-weight="400" text-anchor="start" fill="#e7e9ee">Capital and demand for chips</text><g transform="translate(65 107)"><path d="M-16-14H16V14H-16Z M-9-7H9V7H-9Z M-9-20V-14 M0-20V-14 M9-20V-14 M-9 14V20 M0 14V20 M9 14V20 M-22-8H-16 M-22 0H-16 M-22 8H-16 M16-8H22 M16 0H22 M16 8H22" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path></g><text x="65" y="143" font-family="l0g Nvidia Client Financing" font-size="13" font-weight="400" text-anchor="middle" fill="#e7e9ee">Nvidia</text><g transform="translate(250 107)"><path d="M-9-20H9 M-5-20V-6L-17 13Q-19 18-13 18H13Q19 18 17 13L5-6V-20 M-10 4H10 M-6 10H-2 M6 12H9" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path></g><text x="250" y="143" font-family="l0g Nvidia Client Financing" font-size="13" font-weight="400" text-anchor="middle" fill="#e7e9ee">AI labs</text><path d="M106 107H211" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><path d