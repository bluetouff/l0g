<svg xmlns="http://www.w3.org/2000/svg" width="320" viewBox="0 0 320 330" role="img" aria-labelledby="nv17-diligence-en-mobile-title nv17-diligence-en-mobile-desc" xml:lang="en" height="330"><title id="nv17-diligence-en-mobile-title">The due-diligence circuit</title><desc id="nv17-diligence-en-mobile-desc">Due-diligence mechanism in the controls announced by BIS on 16 November 2026, section 744.24 note 3 and paragraph e. The exporter obtains and can provide sufficient information about the foreign data center’s KYC checks, including customers and their ownership or control. Refused or insufficient information creates a red flag that presumptively provides knowledge unless resolved before the transaction. Requests for documents and clarification return to the data center; no automatic clearance is shown. For a later change to a covered end use, the recipient must be informed and the operator must obtain BIS authorization under the text’s conditions.</desc><rect x="0.6" y="0.6" width="318.8" height="328.8" rx="3" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.1"></rect><text x="18" y="28" font-family="l0g Nvidia Cloud Controls" font-size="16" font-weight="400" text-anchor="start" fill="#e7e9ee">The due-diligence circuit</text><g transform="translate(48 86)"><path d="M-22-18H-3V18H-22Z M4-18H23V18H4Z M-17-10H-8 M-17-3H-8 M-17 5H-8 M9-10H18 M9-3H18 M9 5H18 M-20 23H22" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path></g><g transform="translate(160 86)"><path d="M-13-16H3L13-6V10H-13Z M3-16V-6H13 M-7 0H4 M-7 5H1 M13 10L22 20" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path></g><g transform="translate(272 86)"><path d="M-14-20H5L16-9V20H-14Z M5-20V-9H16 M-7-1H8 M-7 6H8 M-7 13H3" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path></g><path d="M78 86H126" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><path d="M121 82L126 86L121 90" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><text x="102" y="58" font-family="l0g Nvidia Cloud Controls" font-size="12" font-weight="400" text-anchor="middle" fill="#8b909b">KYC</text><path d="M195 86H240" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><path d="M235 82L240 86L235 90" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><text x="48" y="130" font-family="l0g Nvidia Cloud Controls" font-size="12" font-weight="400" text-anchor="middle" fill="#e7e9ee">Foreign</text><text x="48" y="147" font-family="l0g Nvidia Cloud Controls" font-size="12" font-weight="400" text-anchor="middle" fill="#e7e9ee">data center</text><text x="160" y="130" font-family="l0g Nvidia Cloud Controls" font-size="13" font-weight="400" text-anchor="middle" fill="#e7e9ee">KYC</text><text x="272" y="130" font-family="l0g Nvidia Cloud Controls" font-size="12" font-weight="400" text-anchor="middle" fill="#e7e9ee">Exporter</text><text x="160" y="169" font-family="l0g Nvidia Cloud Controls" font-size="12" font-weight="400" text-anchor="middle" fill="#8b909b">Customers · ownership · control</text><text x="160" y="191" font-family="l0g Nvidia Cloud Controls" font-size="12" font-weight="400" text-anchor="middle" fill="#8b909b">Insufficient information</text><path d="M160 199V210H49" fill="none" stroke="#f5b13d" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><path d="M54 206L49 210L54 214" fill="none" stroke="#f5b13d" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><g transform="translate(36 230)"><path d="M0-19L21 18H-21Z M0-7V4 M0 10V12" fill="none" stroke="#f5b13d" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path></g><text x="63" y="226" font-family="l0g Nvidia Cloud Controls" font-size="12" font-weight="400" text-anchor="start" fill="#f5b13d">Resolve the red flag</text><text x="63" y="244" font-family="l0g Nvidia Cloud Controls" font-size="12" font-weight="400" text-anchor="start" fill="#e7e9ee">before the transaction</text><path d="M36 252H12V156H48" fill="none" stroke="#f5b13d" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"></path><path d="M43 152L48 156L43 160" fill="none" stroke="#f5b13d" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><path d="M18 253H302" fill="none" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><text x="160" y="270" font-family="l0g Nvidia Cloud Controls" font-size="12" font-weight="400" text-anchor="middle" fill="#8b909b">Change to a covered end use</text><g transform="translate(42 288)"><path d="M-15-13H15V12H-15Z M-15-13L0-2L15-13 M-19 17H19" fill="none" stroke="#8b909b" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path></g><g transform="translate(273 288)"><path d="M-14-20H5L16-9V20H-14Z M5-20V-9H16 M-7 4L-2 9L8-1" fill="none" stroke="#f5b13d" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path></g><path d="M75 288H240" fill="none" stroke="#f5b13d" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><path d="M235 284L240 288L235 292" fill="none" stroke="#f5b13d" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><text x="42" y="321" font-family="l0g Nvidia Cloud Controls" font-size="12" font-weight="400" text-anchor="middle" fill="#e7e9ee">Inform</text><text x="273" y="321" font-family="l0g Nvidia Cloud Controls" font-size="12" font-weight="400" text-anchor="middle" fill="#e7e9ee">Authorization</text></svg>