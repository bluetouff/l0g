<svg xmlns="http://www.w3.org/2000/svg" width="320" viewBox="0 0 320 330" role="img" aria-labelledby="nv16-outreach-en-mobile-title nv16-outreach-en-mobile-desc" xml:lang="en" height="330"><title id="nv16-outreach-en-mobile-title">Outreach and proceedings</title><desc id="nv16-outreach-en-mobile-desc">Bloomberg reports Nvidia contacts with Taiwanese political officials and an approach to TSMC for advice, on unknown dates. Those two approaches occupy the upper part of the diagram. A separate area connects prosecutors to the court to represent the proceedings. No arrow connects the reported approaches with a judicial decision.</desc><rect x="0.6" y="0.6" width="318.8" height="328.8" rx="3" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.1"></rect><text x="16" y="27" font-family="l0g Nvidia Taiwan Justice" font-size="15" font-weight="400" text-anchor="start" fill="#e7e9ee">Outreach and proceedings</text><text x="16" y="48" font-family="l0g Nvidia Taiwan Justice" font-size="12" font-weight="400" text-anchor="start" fill="#f5b13d">Contacts reported by Bloomberg</text><text x="16" y="65" font-family="l0g Nvidia Taiwan Justice" font-size="12" font-weight="400" text-anchor="start" fill="#8b909b">Dates of the approaches unknown</text><rect x="16" y="94" width="88" height="80" rx="3" fill="none" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></rect><g transform="translate(60 124)"><path d="M-14-14H14V14H-14Z M-7-7H7V7H-7Z M-8-20V-14 M0-20V-14 M8-20V-14 M-8 14V20 M0 14V20 M8 14V20 M-20-8H-14 M-20 0H-14 M-20 8H-14 M14-8H20 M14 0H20 M14 8H20" fill="none" stroke="#f5b13d" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path></g><text x="60" y="158" font-family="l0g Nvidia Taiwan Justice" font-size="13" font-weight="400" text-anchor="middle" fill="#e7e9ee">Nvidia</text><rect x="160" y="81" width="145" height="56" rx="3" fill="none" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></rect><g transform="translate(181 109)"><path d="M-9-10