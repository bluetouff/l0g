<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 286" width="320" role="img" aria-labelledby="nv25-controls-en-mobile-title nv25-controls-en-mobile-desc" height="286"><title id="nv25-controls-en-mobile-title">Three jurisdictions, three measures</title><desc id="nv25-controls-en-mobile-desc">In the United States, the BIS lists seven entities. A license is required for a transaction involving an item subject to the EAR if a listed entity is a party to the transaction. Applications face a presumption of denial. In Malaysia, MITI announces a future MIDA advisory covering leasing, hosting and services. In Singapore, authorities are requesting documents and information as part of their own investigation.</desc><rect x="1" y="1" width="318" height="284" rx="7"></rect><text x="17" y="27" font-size="16">Three jurisdictions, three measures</text><path d="M17 42H303 M17 120H303 M17 198H303"></path><g transform="translate(0 0)"><path d="M3 2H13L19 8V23H3Z M13 2V8H19 M7 12H15 M7 16H15 M7 20H11" transform="translate(20 65)"></path><text x="49" y="73" font-size="13">United States</text><text x="49" y="91" font-size="12">BIS</text><path d="M138 76H158 M153 72L158 76L153 80"></path><text x="171" y="63" font-size="12">Seven entities listed</text><text x="171" y="80" font-size="12">License for EAR items</text><text x="171" y="97" font-size="12">Presumption of denial</text></g><g transform="translate(0 78)"><path d="M2 3H20V10H2Z M2 15H20V22H2Z M5 6H7 M10 6H17 M5 18H7 M10 18H17" transform="translate(20 65)"></path><text x="49" y="73" font-size="13">Malaysia</text><text x="49" y="91" font-size="12">MITI / MIDA</text><path d="M138 76H158 M153 72L158 76L153 80"></path><text x="171" y="63" font-size="12">MIDA advisory to come</text><text x="171" y="80" font-size="12">Avoid leasing, hosting</text><text x="171" y="97" font-size="12">or providing services</text></g><g transform="translate(0 156)"><path d="M2 2H14V8 M2 2V22H15 M6 7H10 M6 11H8 M6 15H8 M17 15L21 19 M17 12A4 4 0 1 1 9 12A4 4 0 1 1 17 12Z" transform="translate(20 65)"></path><text x="49" y="73" font-size="13">Singapore</text><text x="49" y="91" font-size="12">Local authorities</text><path d="M138 76H158 M153 72L158 76L153 80"></path><text x="171" y="63" font-size="12">Singapore investigation</text><text x="171" y="80" font-size="12">Documents requested</text><text x="171" y="97" font-size="12">Information gathering</text></g></svg>