<svg xmlns="http://www.w3.org/2000/svg" width="320" viewBox="0 0 320 330" role="img" aria-labelledby="nv15-placement-en-mobile-title nv15-placement-en-mobile-desc" xml:lang="en" height="330"><title id="nv15-placement-en-mobile-title">An agency share sale</title><desc id="nv15-placement-en-mobile-desc">General mechanism for an agency sale under Bitdeer’s at-the-market programme. Bitdeer chooses a designated intermediary from twelve agents including Cantor. The agent sells shares to market investors. Gross proceeds are separated into net proceeds for Bitdeer and a conditional commission of up to three percent of the gross sale price. The prospectus also allows an intermediary to act as principal. The diagram represents the agency-sale case and assigns no proceeds to the A201 project.</desc><rect x="0.6" y="0.6" width="318.8" height="328.8" rx="3" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.1"></rect><text x="18" y="28" font-family="l0g Nvidia Cantor Export" font-size="16" font-weight="400" text-anchor="start" fill="#e7e9ee">An agency share sale</text><g transform="translate(60 96)"><path d="M-20 20V-16H4V20 M4-5H20V20 M-25 20H25 M-14-10H-8 M-14-3H-8 M-14 4H-8 M-14 11H-8 M9 2H14 M9 9H14" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path></g><text x="60" y="133" font-family="l0g Nvidia Cantor Export" font-size="13" font-weight="400" text-anchor="middle" fill="#e7e9ee">Bitdeer</text><g transform="translate(250 96)"><path d="M-22-10L0-21L22-10Z M-24-5H24 M-24 20H24 M-17 0V14 M-6 0V14 M6 0V14 M17 0V14" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path></g><text x="250" y="133" font-family="l0g Nvidia Cantor Export" font-size="13" font-weight="400" text-anchor="middle" fill="#e7e9ee">Selected agent</text><text x="250" y="151" font-family="l0g Nvidia Cantor Export" font-size="12" font-weight="400" text-anchor="middle" fill="#8b909b">Among twelve</text><text x="250" y="168" font-family="l0g Nvidia Cantor Export" font-size="12" font-weight="400" text-anchor="middle" fill="#8b909b">including Cantor</text><path d="M101 96H209" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><path d="M204 92L209 96L204 100" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><text x="155" y="78" font-family="l0g Nvidia Cantor Export" font-size="12" font-weight="400" text-anchor="middle" fill="#5eead4">Instruction</text><path d="M250 184V200" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><path d="M246 195L250 200L254 195" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><text x="234" y="204" font-family="l0g Nvidia Cantor Export" font-size="12" font-weight="400" text-anchor="end" fill="#5eead4">Shares</text><g transform="translate(250 229)"><path d="M-5-12A5 5 0 1 0 5-12A5 5 0 1 0-5-12 M-12 15V7C-12-3 12-3 12 7V15 M-20-5A4 4 0 1 0-12-5 M-22 15V9Q-22 3-17 3 M12-5A4 4 0 1 0 20-5 M17 3Q22 3 22 9V15" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path></g><text x="250" y="267" font-family="l0g Nvidia Cantor Export" font-size="13" font-weight="400" text-anchor="middle" fill="#e7e9ee">Investors</text><path d="M214 229H95" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><path d="M100 225L95 229L100 233" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><text x="180" y="222" font-family="l0g Nvidia Cantor Export" font-size="12" font-weight="400" text-anchor="middle" fill="#5eead4">Gross proceeds</text><g transform="translate(60 229)"><path d="M-13-17H13V17H-13Z M-7-10H7 M-7-3H7 M-7 4H-2 M3 4H7 M-7 10H-2 M3 10H7" fill="none" stroke="#8b909b" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path></g><text x="60" y="267" font-family="l0g Nvidia Cantor Export" font-size="12" font-weight="400" text-anchor="middle" fill="#8b909b">Settlement</text><path d="M60 195V150" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><path d="M56 155L60 150L64 155" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><text x="75" y="172" font-family="l0g Nvidia Cantor Export" font-size="12" font-weight="400" text-anchor="start" fill="#5eead4">Net proceeds</text><path d="M77 207H140V180H214" fill="none" stroke="#f5b13d" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><path d="M209 176L214 180L209 184" fill="none" stroke="#f5b13d" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><text x="130" y="198" font-family="l0g Nvidia Cantor Export" font-size="12" font-weight="400" text-anchor="end" fill="#f5b13d">Commission</text><text x="160" y="305" font-family="l0g Nvidia Cantor Export" font-size="12" font-weight="400" text-anchor="middle" fill="#f5b13d">Up to 3% of gross</text></svg>