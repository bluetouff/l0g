 stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><g transform="translate(26 250)"><path d="M-10-15H8V15H-10Z M-4-8H3 M-4 0H3 M-15 18L15-18" fill="none" stroke="#8b909b" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path></g><text x="48" y="244" font-family="l0g Nvidia Taiwan Justice" font-size="12" font-weight="400" text-anchor="start" fill="#e7e9ee">Travel restriction</text><text x="48" y="261" font-family="l0g Nvidia Taiwan Justice" font-size="12" font-weight="400" text-anchor="start" fill="#8b909b">8 months</text><g transform="translate(26 295)"><path d="M-10-15H10V15H-10Z M-5-8H5 M-5-1H5 M-5 7L-1 11L6 4" fill="none" stroke="#8b909b" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path></g><text x="48" y="296" font-family="l0g Nvidia Taiwan Justice" font-size="12" font-weight="400" text-anchor="start" fill="#e7e9ee">Regular reporting</text><text x="160" y="319" font-family="l0g Nvidia Taiwan Justice" font-size="12" font-weight="400" text-anchor="middle" fill="#8b909b">4 defendants, including Chang</text></svg>