<svg xmlns="http://www.w3.org/2000/svg" width="320" viewBox="0 0 320 330" role="img" aria-labelledby="nv16-bail-en-mobile-title nv16-bail-en-mobile-desc" xml:lang="en" height="330"><title id="nv16-bail-en-mobile-title">The path of the appeal</title><desc id="nv16-bail-en-mobile-desc">Path of the appeal over the release of four defendants, including Chang. On 26 August 2026, Keelung District Court sets bail of four million Taiwan dollars per person, an eight-month travel restriction and regular police reporting. Prosecutors appeal on an unspecified date. The High Court dismisses the appeal on 10 September 2026. This figure covers interim measures and their judicial review.</desc><rect x="0.6" y="0.6" width="318.8" height="328.8" rx="3" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.1"></rect><text x="18" y="28" font-family="l0g Nvidia Taiwan Justice" font-size="16" font-weight="400" text-anchor="start" fill="#e7e9ee">The path of the appeal</text><text x="64" y="56" font-family="l0g Nvidia Taiwan Justice" font-size="12" font-weight="400" text-anchor="middle" fill="#8b909b">26 Aug 2026</text><text x="252" y="56" font-family="l0g Nvidia Taiwan Justice" font-size="12" font-weight="400" text-anchor="middle" fill="#8b909b">Date not stated</text><g transform="translate(64 95)"><path d="M-23-9L0-21L23-9Z M-25-3H25 M-25 21H25 M-17 2V15 M-6 2V15 M6 2V15 M17 2V15 M-29 25H29" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path></g><g transform="translate(252 95)"><path d="M-17-23H8L18-13V22H-17Z M8-23V-13H18 M-10-5H10 M-10 2H10 M-10 9H4" fill="none" stroke="#f5b13d" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path></g><path d="M105 95H211" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><path d="M206 91L211 95L206 99" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><text x="158" y=