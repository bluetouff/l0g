<svg xmlns="http://www.w3.org/2000/svg" width="320" viewBox="0 0 320 288" role="img" aria-labelledby="nv22-saturn-en-m-title nv22-saturn-en-m-desc" xml:lang="en" height="288">
        <title id="nv22-saturn-en-m-title">Rent in the Saturn financing</title>
        <desc id="nv22-saturn-en-m-desc">Planned Saturn financing structure. Investors subscribe for notes issued by Saturn Funding Trust, an indirect subsidiary of WHCO. WHCO, the lessor, buys the GPUs and related equipment and leases them to SpaceX. SpaceX is to pay WHCO quarterly rents for each tranche starting on its delivery. Those rents are intended to amortize the debt. Apollo and Goldman Sachs announced pricing of the financing on November 20, 2026. Deliveries are expected in the first half of 2027. Dashed arrows show planned flows.</desc>
