<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 254" width="320" role="img" aria-labelledby="nv23-timeline-en-mobile-title nv23-timeline-en-mobile-desc" height="254"><title id="nv23-timeline-en-mobile-title">Nvidia’s board brings back Jensen Huang</title><desc id="nv23-timeline-en-mobile-desc">On November 17, 2026, Harvey Jones tells investors the board does not intend to reinstate Jensen Huang as CEO. On November 22, the board votes unanimously to reinstate Huang with immediate effect. Nvidia announces the decision on November 23. The SEC accepts the 8-K at 8:57:54 a.m. Eastern. The time of the November 22 vote is unknown.</desc><rect x="1" y="1" width="318" height="252" rx="7"></rect><text x="17" y="27" font-size="16">Nvidia’s board brings back Jensen Huang</text><path d="M17 42H303 M17 220H303"></path><path d="M27 75V181"></path><g transform="translate(27 75)"><circle cx="0" cy="0" r="3.5" stroke="#8b909b"></circle><path d="M1 2H21V16H11L6 21V16H1Z M5 7H17 M5 11H14" transform="translate(14 -11)" stroke="#8b909b"></path><text x="48" y="-8" font-size="12" fill="#8b909b">November 17</text><text x="48" y="8" font-size="14">No return planned</text><text x="48" y="24" font-size="12">Jones on the earnings call</text></g><g transform="translate(27 128)"><circle cx="0" cy="0" r="3.5" stroke="#5eead4"></circle><path d="M2 11H6 M16 11H20L22 14V22H0V14Z M0 14H22 M6 17H16 M5 6L10 10L17 2 M4 19H5 M17 19H18" transform="translate(14 -11)" stroke="#5eead4"></path><text x="48" y="-8" font-size="12" fill="#5eead4">November 22</text><text x="48" y="8" font-size="14">The board reinstates Huang</text><text x="48" y="24" font-size="12">Unanimous vote · immediate effect</text></g><g transform="translate(27 181)"><circle cx="0" cy="0" r="3.5" stroke="#7aa2f7"></circle><path d="M3 1H14L20 7V23H3Z M14 1V7H20 M7 11H16 M7 15H16 M7 19H12" transform="translate(14 -11)" stroke="#7aa2f7"></path><text x="48" y="-8" font-size="12" fill="#7aa2f7">November 23</text><text x="48" y="8" font-size="14">Nvidia announces the return</text><text x="48" y="24" font-size="12">8-K accepted at 8:57:54 a.m.</text></g><text x="17" y="240" font-size="12">Vote time undisclosed · filing time shown in ET</text></svg>