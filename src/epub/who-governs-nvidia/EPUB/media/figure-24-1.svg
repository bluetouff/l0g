<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 309" width="320" role="img" aria-labelledby="nv24-timeline-en-mobile-title nv24-timeline-en-mobile-desc" height="309"><title id="nv24-timeline-en-mobile-title">Huang’s return, minute by minute</title><desc id="nv24-timeline-en-mobile-desc">On November 23, 2026, Paris time, Cboe C1 opens premarket trading for eligible options at 13:30. PBS correspondent Liz Landers publishes her account at 14:29. Nvidia announces Jensen Huang’s return at 14:55. At 15:15, the MrMikeInvesting account posts about a purported call-options bet. At 15:45, Senator Ruben Gallego calls for a review of the trades.</desc><rect x="1" y="1" width="318" height="307" rx="7"></rect><text x="17" y="28" font-size="16">Huang’s return, minute by minute</text><text x="17" y="47" font-size="12">November 23, 2026 · Paris time</text><path d="M17 58H303"></path><path d="M22 76V276"></path><g><circle cx="22" cy="76" r="3.3" stroke="#8b909b"></circle><path d="M1 17V4H17V11 M1 7H17 M4 2V6 M13 2V6 M4 11H7 M4 14H7 M14 15V11 M14 15H17 M14 10A5 5 0 1 1 14 20A5 5 0 1 1 14 10Z" stroke="#8b909b" transform="translate(35 67)"></path><text x="67" y="80" font-size="13" fill="#8b909b">13:30</text><text x="112" y="80" font-size="13">Cboe C1 premarket</text><text x="112" y="95" font-size="12">Eligible options</text></g><g><circle cx="22" cy="163" r="3.3" stroke="#7aa2f7"></circle><path d="M1 2H19V14H10L5 19V14H1Z M4 6H16 M4 10H13" stroke="#7aa2f7" transform="translate(35 154)"></path><text x="67" y="167" font-size="13" fill="#7aa2f7">14:29</text><text x="112" y="167" font-size="13">Liz Landers (PBS)</text><text x="112" y="182" font-size="12">Publishes her account</text></g><g><circle cx="22" cy="202" r="3.3" stroke="#5eead4"></circle><path d="M3 1H13L18 6V19H3Z M13 1V6H18 M6 10H15 M6 13H15 M6 16H11" stroke="#5eead4" transform="translate(35 193)"></path><text x="67" y="206" font-size="13" fill="#5eead4">14:55</text><text x="112" y="206" font-size="13">Nvidia statement</text><text x="112" y="221" font-size="12">Announces Huang’s return</text></g><g><circle cx="22" cy="232" r="3.3" stroke="#f5b13d"></circle><path d="M1 3H19V15H9L5 19V15H1Z M10 6V10 M10 12H10.1" stroke="#f5b13d" transform="translate(35 223)"></path><text x="67" y="236" font-size="13" fill="#f5b13d">15:15</text><text x="112" y="236" font-size="13">MrMikeInvesting</text><text x="112" y="251" font-size="12">Purported call-options bet</text></g><g><circle cx="22" cy="276" r="3.3" stroke="#7aa2f7"></circle><path d="M1 5L10 1L19 5Z M2 8H18 M4 10V16 M10 10V16 M16 10V16 M2 16H18 M1 19H19" stroke="#7aa2f7" transform="translate(35 267)"></path><text x="67" y="280" font-size="13" fill="#7aa2f7">15:45</text><text x="112" y="280" font-size="13">Gallego’s request</text><text x="112" y="295" font-size="12">Calls for a trade review</text></g></svg>