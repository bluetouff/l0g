<svg xmlns="http://www.w3.org/2000/svg" width="320" viewBox="0 0 320 330" role="img" aria-labelledby="nv17-controls-en-mobile-title nv17-controls-en-mobile-desc" xml:lang="en" height="330"><title id="nv17-controls-en-mobile-title">Two controls for cloud compute</title><desc id="nv17-controls-en-mobile-desc">Controls announced in the BIS text of 16 November 2026. A supplier sends EAR-controlled equipment to a foreign data center that gives customers remote access. The destination control in section 742.6 adds five countries, with a conditional US exclusion. The end-use control in section 744.24 concerns equipment destined for a data center anywhere in the world when the exporter has knowledge of access exceeding twelve million aggregate TPP for companies headquartered in, or whose ultimate parent is headquartered in, Country Group D:5 or Macau. The threshold may be reached at one data center or across linked data centers. The announced text defines the conditions and exclusions.</desc><rect x="0.6" y="0.6" width="318.8" height="328.8" rx="3" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.1"></rect><text x="18" y="28" font-family="l0g Nvidia Cloud Controls" font-size="16" font-weight="400" text-anchor="start" fill="#e7e9ee">Two controls for cloud compute</text><g transform="translate(48 86)"><path d="M-14-15H14V15H-14Z M-7-7H7V7H-7Z M-21-9H-15 M-21 0H-15 M-21 9H-15 M15-9H21 M15 0H21 M15 9H21 M-8-22V-16 M0-22V-16 M8-22V-16 M-8 16V22 M0 16V22 M8 16V22" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path></g><g transform="translate(160 86)"><path d="M-22-18H-3V18H-22Z M4-18H23V18H4Z M-17-10H-8 M-17-3H-8 M-17 5H-8 M9-10H18 M9-3H18 M9 5H18 M-20 23H22" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path></g><g transform="translate(272 86)"><path d="M-21-14H21V13H-21Z M-26 18H26 M-4-7H4V1H-4Z M-10 9V6H10V9" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path></g><path d="M78 86H126" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><path d="M121 82L126 86L121 90" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><text x="102" y="58" font-family="l0g Nvidia Cloud Controls" font-size="12" font-weight="400" text-anchor="middle" fill="#8b909b">Hardware</text><path d="M195 86H240" fill="none" stroke="#f5b13d" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"></path><path d="M235 82L240 86L235 90" fill="none" stroke="#f5b13d" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><text x="217" y="58" font-family="l0g Nvidia Cloud Controls" font-size="12" font-weight="400" text-anchor="middle" fill="#8b909b">Access</text><text x="48" y="129" font-family="l0g Nvidia Cloud Controls" font-size="12" font-weight="400" text-anchor="middle" fill="#e7e9ee">Supplier</text><text x="160" y="129" font-family="l0g Nvidia Cloud Controls" font-size="12" font-weight="400" text-anchor="middle" fill="#e7e9ee">Foreign</text><text x="160" y="146" font-family="l0g Nvidia Cloud Controls" font-size="12" font-weight="400" text-anchor="middle" fill="#e7e9ee">data center</text><text x="272" y="129" font-family="l0g Nvidia Cloud Controls" font-size="12" font-weight="400" text-anchor="middle" fill="#e7e9ee">Remote</text><text x="272" y="146" font-family="l0g Nvidia Cloud Controls" font-size="12" font-weight="400" text-anchor="middle" fill="#e7e9ee">customer</text><path d="M102 97V159H80V172" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><path d="M76 167L80 172L84 167" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><path d="M217 97V159H240V172" fill="none" stroke="#f5b13d" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><path d="M236 167L240 172L244 167" fill="none" stroke="#f5b13d" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><text x="80" y="192" font-family="l0g Nvidia Cloud Controls" font-size="13" font-weight="400" text-anchor="middle" fill="#5eead4">Destination</text><text x="80" y="210" font-family="l0g Nvidia Cloud Controls" font-size="12" font-weight="400" text-anchor="middle" fill="#8b909b">§ 742.6</text><text x="80" y="236" font-family="l0g Nvidia Cloud Controls" font-size="12" font-weight="400" text-anchor="middle" fill="#e7e9ee">Indonesia · Malaysia</text><text x="80" y="254" font-family="l0g Nvidia Cloud Controls" font-size="12" font-weight="400" text-anchor="middle" fill="#e7e9ee">Singapore · Brazil</text><text x="80" y="272" font-family="l0g Nvidia Cloud Controls" font-size="12" font-weight="400" text-anchor="middle" fill="#e7e9ee">Thailand</text><text x="80" y="300" font-family="l0g Nvidia Cloud Controls" font-size="12" font-weight="400" text-anchor="middle" fill="#8b909b">Conditional</text><text x="80" y="317" font-family="l0g Nvidia Cloud Controls" font-size="12" font-weight="400" text-anchor="middle" fill="#8b909b">US exclusion</text><text x="240" y="192" font-family="l0g Nvidia Cloud Controls" font-size="13" font-weight="400" text-anchor="middle" fill="#f5b13d">Known end use</text><text x="240" y="210" font-family="l0g Nvidia Cloud Controls" font-size="12" font-weight="400" text-anchor="middle" fill="#8b909b">§ 744.24</text><text x="240" y="236" font-family="l0g Nvidia Cloud Controls" font-size="12" font-weight="400" text-anchor="middle" fill="#e7e9ee">D:5 / Macau</text><text x="240" y="260" font-family="l0g Nvidia Cloud Controls" font-size="16" font-weight="400" text-anchor="middle" fill="#e7e9ee">> 12 M</text><text x="240" y="279" font-family="l0g Nvidia Cloud Controls" font-size="12" font-weight="400" text-anchor="middle" fill="#e7e9ee">aggregate TPP</text><text x="240" y="300" font-family="l0g Nvidia Cloud Controls" font-si