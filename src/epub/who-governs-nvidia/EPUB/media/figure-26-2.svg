<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 352 257" width="352" role="img" aria-labelledby="nv26-mechanisms-en-title nv26-mechanisms-en-desc" font-family="Liberation Sans,Arial,sans-serif" font-weight="400" height="257"><title id="nv26-mechanisms-en-title">How the federal government takes equity</title><desc id="nv26-mechanisms-en-desc">Intel. The agreement signed August 22 and closed August 27, 2025 links federal funding with common stock. The government gets no board seat and agreed to vote with Intel’s board, subject to exceptions. The MP Materials package includes an offtake agreement, a loan, preferred stock and targeted consent rights. For Nvidia, Trump says he considered a stake. The public record contains no corresponding agreement.</desc><rect x="1" y="1" width="350" height="255" rx="7" fill="#121419" stroke="rgba(255, 255, 255, 0.20)"></rect><text x="19" y="27" font-size="16" fill="#e7e9ee">How the federal government takes equity</text><text x="19" y="46" font-size="13" fill="#8b909b">Intel and MP Materials · 2025 agreements</text><path d="M19 56H333" fill="none" stroke="rgba(255, 255, 255, 0.10)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path><path d="M19 127H333 M19 191H333" fill="none" stroke="rgba(255, 255, 255, 0.10)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path><g transform="translate(19 67)"><path d="M3 4H15V16H3Z M6 6H12V12H6Z M6 1V4 M12 1V4 M6 16V19 M12 16V19 M0 7H3 M0 13H3 M15 7H18 M15 13H18" fill="none" stroke="#5eead4" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"></path></g><text x="45" y="80" font-size="14.5" fill="#e7e9ee">Intel</text><text x="19" y="99" font-size="13.4" fill="#8b909b">Federal funding</text><text x="19" y="116" font-size="13" fill="#8b909b">Signed 22 · closed 27 Aug</text><path d="M158 98H175 M171 94L175 98L171 102" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><text x="187" y="80" font-size="13.7" fill="#e7e9ee">Common stock</text><text x="187" y="98" font-size="13" fill="#8b909b">Votes follow board advice</text><text x="187" y="115" font-size="13" fill="#8b909b">Exceptions · no board seat</text><g transform="translate(19 131)"><path d="M2 2H6V9C6 12 12 12 12 9V2H16V9C16 18 2 18 2 9Z M2 6H6 M12 6H16" fill="none" stroke="#7aa2f7" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"></path></g><text x="45" y="144" font-size="14.5" fill="#e7e9ee">MP Materials</text><text x="19" y="163" font-size="13.4" fill="#8b909b">Offtake deal and loan</text><path d="M158 162H175 M158 159V165 M175 159V165" fill="none" stroke="#7aa2f7" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><text x="187" y="144" font-size="13.7" fill="#e7e9ee">Preferred stock</text><text x="187" y="162" font-size="13" fill="#8b909b">Targeted consent rights</text><g transform="translate(19 195)"><path d="M1 1H17V12H9L5 16V12H1Z M5 5H13 M5 8H11" fill="none" stroke="#f5b13d" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"></path></g><text x="45" y="208" font-size="14.5" fill="#e7e9ee">Nvidia</text><text x="19" y="227" font-size="13.4" fill="#8b909b">Trump floats a stake</text><path d="M158 226H171" fill="none" stroke="#f5b13d" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 3"></path><circle cx="175" cy="226" r="3.2" fill="#121419" stroke="#f5b13d" stroke-width="1.25"></circle><text x="187" y="208" font-size="13.7" fill="#e7e9ee">No disclosed agreement</text><text x="187" y="226" font-size="13" fill="#8b909b">Terms remain unknown</text></svg>