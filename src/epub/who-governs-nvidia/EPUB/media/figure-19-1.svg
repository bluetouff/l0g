<svg xmlns="http://www.w3.org/2000/svg" width="320" viewBox="0 0 320 330" role="img" aria-labelledby="nvidia-commitment-activation-en-mobile-title nvidia-commitment-activation-en-mobile-desc" xml:lang="en" height="330"><title id="nvidia-commitment-activation-en-mobile-title">Activating neocloud agreements</title><desc id="nvidia-commitment-activation-en-mobile-desc">As of October 25, 2026, Nvidia reports a conditional maximum of 32 billion US dollars of additional commitments under neocloud agreements. Activation requires financing for infrastructure purchases, operational deployment of the capacity, and acceptance by Nvidia. The arrows represent these conditions without asserting they have been fulfilled. This mechanism concerns these neocloud agreements. Source: CFO commentary published November 17, 2026.</desc><rect x=".6" y=".6" width="318.8" height="328.8" rx="10" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.1"></rect><text x="16" y="28" font-family="l0g Nvidia Aolani Financing" font-size="16" font-weight="400" fill="#e7e9ee">Activating neocloud agreements</text><text x="16" y="49" font-family="l0g Nvidia Aolani Financing" font-size="12" font-weight="400" fill="#8b909b">USD 32bn · as of October 25, 2026</text><g transform="translate(52 80)"><path d="M5 0 H24 L31 7 V31 H5 Z M24 0 V7 H31 M11 13 H24 M11 19 H24 M11 25 H20" fill="none" stroke="#5eead4" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"></path></g><text x="69" y="133" font-family="l0g Nvidia Aolani Financing" font-size="13" font-weight="400" fill="#e7e9ee" text-anchor="middle">Neocloud</text><text x="69" y="151" font-family="l0g Nvidia Aolani Financing" font-size="12" font-weight="400" fill="#8b909b" text-anchor="middle">agreements</text><g transform="translate(232 80)"><path d="M0 30 H34 M4 25 H30 M6 25 V12 M13 25 V12 M21 25 V12 M28 25 V12 M1 10 L17 1 L33 10 Z" fill="none" stroke="#5eead4" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"></path></g><text x="249" y="133" font-family="l0g Nvidia Aolani Financing" font-size="13" font-weight="400" fill="#e7e9ee" text-anchor="middle">Financing</text><text x="249" y="151" font-family="l0g Nvidia Aolani Financing" font-size="12" font-weight="400" fill="#8b909b" text-anchor="middle">secured</text><g transform="translate(232 185)"><path d="M4 0 H30 V31 H4 Z M4 10 H30 M4 21 H30 M9 5 H20 M9 15 H20 M9 26 H20 M25 5 H26 M25 15 H26 M25 26 H26" fill="none" stroke="#5eead4" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"></path></g><text x="249" y="238" font-family="l0g Nvidia Aolani Financing" font-size="13" font-weight="400" fill="#e7e9ee" text-anchor="middle">Deployment</text><text x="249" y="256" font-family="l0g Nvidia Aolani Financing" font-size="12" font-weight="400" fill="#8b909b" text-anchor="middle">operational</text><g transform="translate(52 185)"><path d="M5 0 H25 L31 6 V31 H5 Z M25 0 V7 H31 M11 20 L16 25 L26 13 M11 9 H20" fill="none" stroke="#5eead4" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"></path></g><text x="69" y="238" font-family="l0g Nvidia Aolani Financing" font-size="13" font-weight="400" fill="#e7e9ee" text-anchor="middle">Acceptance</text><text x="69" y="256" font-family="l0g Nvidia Aolani Financing" font-size="12" font-weight="400" fill="#8b909b" text-anchor="middle">by Nvidia</text><g transform="translate(52 280)"><path d="M17 0 V14 M7 5 C-3 13 1 31 17 31 C33 31 37 13 27 5" fill="none" stroke="#f5b13d" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"></path></g><text x="104" y="294" font-family="l0g Nvidia Aolani Financing" font-size="13" font-weight="400" fill="#e7e9ee">Commitments</text><text x="104" y="313" font-family="l0g Nvidia Aolani Financing" font-size="12" font-weight="400" fill="#8b909b">take effect</text><path d="M94 96 H220" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"></path><path d="M215 92 L220 96 L