<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 345" width="320" role="img" aria-labelledby="nv25-timeline-en-mobile-title nv25-timeline-en-mobile-desc" height="345"><title id="nv25-timeline-en-mobile-title">Nvidia and Washington’s decisions</title><desc id="nv25-timeline-en-mobile-desc">Selected dates in 2025 and 2026. Circles mark public or diplomatic events. Diamonds mark disclosed transactions. A dashed outline marks disputed reporting. The spacing is not a measure of elapsed time. The transaction reports list Nvidia and give amounts in ranges.</desc><rect x="1" y="1" width="318" height="343" rx="7"></rect><text x="17" y="27" font-size="16">Nvidia and Washington’s decisions</text><path d="M17 40H303 M17 173H303 M17 307H303"></path><g transform="translate(17 0)"><text x="0" y="62" font-size="15">2025</text><path d="M8 81V157"></path><g transform="translate(0 81)"><path d="M8 -4L12 0L8 4L4 0Z"></path><text x="23" y="4" font-size="12">Jan 29</text><text x="96" y="4" font-size="12">Purchase · $1m–$5m</text></g><g transform="translate(0 100)"><circle cx="8" cy="0" r="3.6"></circle><text x="23" y="4" font-size="12">Apr 9</text><text x="96" y="4" font-size="12">H20 license required</text></g><g transform="translate(0 119)"><circle cx="8" cy="0" r="3.6"></circle><text x="23" y="4" font-size="12">Jul 14–15</text><text x="96" y="4" font-size="12">H20 · licensing assurance</text></g><g transform="translate(0 138)"><path d="M8 -4L12 0L8 4L4 0Z"></path><text x="23" y="4" font-size="12">Aug 18</text><text x="96" y="4" font-size="12">Purchase · $5m–$25m</text></g><g transform="translate(0 157)"><circle cx="8" cy="0" r="3.6"></circle><text x="23" y="4" font-size="12">Dec 8</text><text x="96" y="4" font-size="12">Trump announces H200 policy</text></g></g><g transform="translate(17 132)"><text x="0" y="62" font-size="15">2026</text><path d="M8 81V157"></path><g transform="translate(0 81)"><circle cx="8" cy="0" r="3.6"></circle><text x="23" y="4" font-size="12">Jan 15</text><text x="96" y="4" font-size="12">H200 rule</text></g><g transform="translate(0 100)"><circle cx="8" cy="0" r="3.6"></circle><text x="23" y="4" font-size="12">May</text><text x="96" y="4" font-size="12">Anchorage · disputed briefing</text></g><g transform="translate(0 119)"><path d="M8 -4L12 0L8 4L4 0Z"></path><text x="23" y="4" font-size="12">May 18</text><text x="96" y="4" font-size="12">Sale · $0.5m–$1m</text></g><g transform="translate(0 138)"><circle cx="8" cy="0" r="3.6"></circle><text x="23" y="4" font-size="12">Nov 22–23</text><text x="96" y="4" font-size="12">Huang reinstated</text></g><g transform="translate(0 157)"><circle cx="8" cy="0" r="3.6"></circle><text x="23" y="4" font-size="12">Nov 23</text><text x="96" y="4" font-size="12">BIS adds seven entities</text></g></g><circle cx="21" cy="326" r="3.4"></circle><text x="30" y="330" font-size="12">Public event</text><path d="M101 322L105 326L101 330L97 326Z"></path><text x="110" y="330" font-size="12">Disclosed trade</text><circle cx="224" cy="326" r="3.4"></circle><text x="233" y="330" font-size="12">Disputed</text></svg>