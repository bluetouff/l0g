<svg xmlns="http://www.w3.org/2000/svg" width="320" viewBox="0 0 320 330" role="img" aria-labelledby="nvidia-investigation-timeline-en-mobile-title nvidia-investigation-timeline-en-mobile-desc" xml:lang="en" height="330"><title id="nvidia-investigation-timeline-en-mobile-title">The Megaspeed chronology</title><desc id="nvidia-investigation-timeline-en-mobile-desc">According to the joint Commerce–DOJ statement dated November 16, 2026, Commerce began a Megaspeed investigation in 2024 and requested Nvidia records in May 2025. BIS agents and Singaporean officials conducted an on-site check and interviewed Alice Huang in June 2025. DOJ then took the lead in the criminal investigation, at an unspecified date. Nvidia also placed Megaspeed on its commercial no-sell list in June 2025. The statement does not establish the order of the two June actions. Source: joint Commerce–DOJ statement.</desc><rect x=".6" y=".6" width="318.8" height="328.8" rx="10" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.1"></rect><text x="16" y="28" font-family="l0g Nvidia Board Oversight" font-size="16" font-weight="400" fill="#e7e9ee">The Megaspeed chronology</text><text x="16" y="49" font-family="l0g Nvidia Board Oversight" font-size="12" font-weight="400" fill="#8b909b">Commerce–DOJ account · Nov 16, 2026</text><g transform="translate(54 80)"><path d="M19 10 C19 0 3 0 3 10 C3 20 19 20 19 10 Z M17 17 L29 29 M8 10 H14 M11 7 V13" fill="none" stroke="#5eead4" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"></path></g><g transform="translate(231 80)"><path d="M5 0 H24 L31 7 V31 H5 Z M24 0 V7 H31 M11 13 H25 M11 19 H25 M11 25 H21" fill="none" stroke="#5eead4" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"></path></g><path d="M95 95 H218" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><path d="M213 91 L218 95 L213 99" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><path d="M277 95 H302 V199 H278" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><path d="M283 195 L278 199 L283 203" fill="none" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><g transform="translate(231 184)"><path d="M1 30 H33 M5 30 V8 L17 1 L29 8 V30 M10 12 H14 M20 12 H24 M10 18 H14 M20 18 H24 M12 30 V24 H22 V30" fill="none" stroke="#5eead4" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"></path></g><g transform="translate(53 184)"><path d="M17 0 V30 M5 30 H29 M4 8 H30 M6 8 L0 20 H12 Z M28 8 L22 20 H34 Z M12 4 H22" fill="none" stroke="#f5b13d" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"></path></g><path d="M219 199 H99" fill="none" stroke="#f5b13d" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><path d="M104 195 L99 199 L104 203" fill="none" stroke="#f5b13d" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><text x="69" y="73" font-family="l0g Nvidia Board Oversight" font-size="13" font-weight="400" fill="#5eead4" text-anchor="middle">2024</text><text x="249" y="73" font-family="l0g Nvidia Board Oversight" font-size="13" font-weight="400" fill="#5eead4" text-anchor="middle">May 2025</text><text x="69" y="132" font-family="l0g Nvidia Board Oversight" font-size="13" font-weight="400" fill="#e7e9ee" text-anchor="middle">Commerce</text><text x="69" y="150" font-family="l0g Nvidia Board Oversight" font-size="12" font-weight="400" fill="#e7e9ee" text-anchor="middle">Investigation begins</text><text x="249" y="132" font-family="l0g Nvidia Board Oversight" font-size="13" font-weight="400" fill="#e7e9ee" text-anchor="middle">Nvidia records</text><text x="249" y="150" font-family="l0g Nvidia Board Oversight" font-size="12" font-weight="400" fill="#e7e9ee" text-anchor="middle">requested</text><text x="249" y="177" font-family="l0g Nvidia Board Oversight" font-size="13" font-weight="400" fill="#5eead4" text-anchor="middle">June 2025</text><text x="157" y="181" font-family="l0g Nvidia Board Oversight" font-size="12" font-weight="400" fill="#f5b13d" text-anchor="middle">After the check</text><text x="249" y="231" font-family="l0g Nvidia Board Oversight" font-size="13" font-weight="400" fill="#e7e9ee" text-anchor="middle">BIS + Singapore</text><text x="249" y="247" font-family="l0g Nvidia Board Oversight" font-size="12" font-weight="400" fill="#e7e9ee" text-anchor="middle">On-site check</text><text x="249" y="263" font-family="l0g Nvidia Board Oversight" font-size="12" font-weight="400" fill="#8b909b" text-anchor="middle">Alice Huang interviewed</text><text x="70" y="239" font-family="l0g Nvidia Board Oversight" font-size="13" font-weight="400" fill="#e7e9ee" text-anchor="middle">DOJ · criminal</text><text x="70" y="257" font-family="l0g Nvidia Board Oversight" font-size="12" font-weight="400" fill="#8b909b" text-anchor="middle">Date unspecified</text><path d="M16 279 H304" fill="none" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path><text x="16" y="303" font-family="l0g Nvidia Board Oversight" font-size="12" font-weight="400" fill="#5eead4">June 2025</text><g transform="translate(105 284)"><path d="M1 5 H25 V27 H1 Z M8 0 H18 V5 M6 11 L20 22 M20 11 L6 22" fill="none" stroke="#f5b13d" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"></path></g><text x="145" y="303" font-family="l0g Nvidia Board Oversight" font-size="13" font-weight="400" fill="#e7e9ee">Nvidia: no-sell list</text><text x="16" y="324" font-family="l0g Nvidia Board Oversight" font-size="12" font-weight="400" fill="#8b909b">Order of the two June actions unspecified</text></svg>