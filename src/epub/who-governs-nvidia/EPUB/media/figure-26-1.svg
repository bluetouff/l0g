<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 352 255" width="352" role="img" aria-labelledby="nv26-timeline-en-title nv26-timeline-en-desc" font-family="Liberation Sans,Arial,sans-serif" font-weight="400" height="255"><title id="nv26-timeline-en-title">Huang’s return and federal equity</title><desc id="nv26-timeline-en-desc">On November 12, parts III and V of l0g raise the possibility of a federal stake. On November 17, Harvey Jones says the board does not intend to reinstate Jensen Huang. The board votes to reinstate Huang on November 22; Nvidia announces the decision on November 23. On November 24, Trump tells the New York Post he considered a federal stake but did not bring it up at that point.</desc><rect x="1" y="1" width="350" height="253" rx="7" fill="#121419" stroke="rgba(255, 255, 255, 0.20)"></rect><text x="19" y="27" font-size="16" fill="#e7e9ee">Huang’s return and federal equity</text><text x="19" y="46" font-size="13" fill="#8b909b">November 12 to 24, 2026 · selected dates</text><path d="M19 56H333" fill="none" stroke="rgba(255, 255, 255, 0.10)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path><path d="M88 77V220" fill="none" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path><text x="19" y="82" font-size="13.4" fill="#8b909b">Nov 12</text><rect x="84" y="74" width="8" height="8" rx="1" fill="#121419" stroke="#7aa2f7" stroke-width="1.15"></rect><text x="106" y="82" font-size="13.7" fill="#e7e9ee">l0g raises a possible stake</text><text x="106" y="98" font-size="13" fill="#8b909b">Federal equity · parts III and V</text><text x="19" y="117" font-size="13.4" fill="#8b909b">Nov 17</text><circle cx="88" cy="113" r="4.0" fill="#121419" stroke="#5eead4" stroke-width="1.25"></circle><text x="106" y="117" font-size="13.7" fill="#e7e9ee">Jones says no return is planned</text><text x="106" y="133" font-size="13" fill="#8b909b">Investor call</text><text x="19" y="152" font-size="13.4" fill="#8b909b">Nov 22</text><circle cx="88" cy="148" r="4.0" fill="#121419" stroke="#5eead4" stroke-width="1.25"></circle><text x="106" y="152" font-size="13.7" fill="#e7e9ee">Board reinstates Huang</text><text x="106" y="168" font-size="13" fill="#8b909b">Unanimous vote</text><text x="19" y="187" font-size="13.4" fill="#8b909b">Nov 23</text><circle cx="88" cy="183" r="4.0" fill="#121419" stroke="#5eead4" stroke-width="1.25"></circle><text x="106" y="187" font-size="13.7" fill="#e7e9ee">Nvidia announces the return</text><text x="19" y="222" font-size="13.4" fill="#8b909b">Nov 24</text><path d="M88 213L93 218L88 223L83 218Z" fill="#121419" stroke="#f5b13d" stroke-width="1.25"></path><text x="106" y="222" font-size="13.7" fill="#e7e9ee">Trump says he considered a stake</text><text x="106" y="238" font-size="13" fill="#8b909b">He says he did not bring it up</text></svg>