<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 900" width="100%" role="img" aria-labelledby="free-models-en-title free-models-en-desc" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" style="display:block;width:100%;height:auto;overflow:hidden;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#0c0d10">
<title id="free-models-en-title">Six ways to write zero euros</title>
<desc id="free-models-en-desc">Free offers may be standalone, restricted to a legal status, capped by a small quota, free up to a high threshold, limited by another usage, or bundled with a paid product.</desc>
<rect x="1" y="1" width="718" height="898" rx="16" fill="#0c0d10" stroke="#2b3038"></rect>
<text x="32" y="48" fill="#f5f6f8" font-size="21" font-weight="700">SIX WAYS TO WRITE €0</text>
<text x="32" y="74" fill="#8b909b" font-size="12">The entry price says nothing about scope, duration or exit.</text>
<rect x="30" y="106" width="320" height="190" rx="14" fill="#10211f" stroke="#5eead4"></rect>
<text x="52" y="136" fill="#5eead4" font-size="13" font-weight="700">1. STANDALONE ZERO</text>
<text x="52" y="168" fill="#f5f6f8" font-size="14">The regulatory core is displayed</text>
<text x="52" y="191" fill="#f5f6f8" font-size="14">at €0, sometimes with no account.</text>
<text x="52" y="226" fill="#aeb4bf" font-size="12">Public examples:</text>
<text x="52" y="248" fill="#aeb4bf" font-size="12">Qonto, Dougs, Indy, Abby, Tiime</text>
<text x="52" y="272" fill="#f5b13d" font-size="11">Check users, API and support.</text>
<rect x="370" y="106" width="320" height="190" rx="14" fill="#151a23" stroke="#7aa2f7"></rect>
<text x="392" y="136" fill="#7aa2f7" font-size="13" font-weight="700">2. STATUS-GATED ZERO</text>
<text x="392" y="168" fill="#f5f6f8" font-size="14">Zero depends on the company's</text>
<text x="392" y="191" fill="#f5f6f8" font-size="14">legal or tax status.</text>
<text x="392" y="226" fill="#aeb4bf" font-size="12">Pennylane:</text>
<text x="392" y="248" fill="#aeb4bf" font-size="12">micro, 1 user, 1,200 a year</text>
<text x="392" y="272" fill="#f5b13d" font-size="11">Growth may trigger another plan.</text>
<rect x="30" y="318" width="320" height="190" rx="14" fill="#211713" stroke="#f5b13d"></rect>
<text x="52" y="348" fill="#f5b13d" font-size="13" font-weight="700">3. TINY QUOTA</text>
<text x="52" y="380" fill="#f5f6f8" font-size="14">The free plan exists, but</text>
<text x="52" y="403" fill="#f5f6f8" font-size="14">ordinary activity exceeds it fast.</text>
<text x="52" y="438" fill="#aeb4bf" font-size="12">B2BRouter: 24 transactions/year</text>
<text x="52" y="460" fill="#aeb4bf" font-size="12">VosFactures: 3 documents/month</text>
<text x="52" y="484" fill="#f5b13d" font-size="11">The billable unit must be defined.</text>
<rect x="370" y="318" width="320" height="190" rx="14" fill="#111d25" stroke="#33b5e5"></rect>
<text x="392" y="348" fill="#33b5e5" font-size="13" font-weight="700">4. HIGH THRESHOLD</text>
<text x="392" y="380" fill="#f5f6f8" font-size="14">Zero covers meaningful volume,</text>
<text x="392" y="403" fill="#f5f6f8" font-size="14">then pricing becomes proportional.</text>
<text x="392" y="438" fill="#aeb4bf" font-size="12">SUPER PDP: 1,000/month</text>
<text x="392" y="460" fill="#aeb4bf" font-size="12">macompta.fr: 20/month standalone</text>
<text x="392" y="484" fill="#f5b13d" font-size="11">Overage pricing must be simulated.</text>
<rect x="30" y="530" width="320" height="190" rx="14" fill="#19151f" stroke="#c084fc"></rect>
<text x="52" y="560" fill="#c084fc" font-size="13" font-weight="700">5. USAGE-LIMITED</text>
<text x="52" y="592" fill="#f5f6f8" font-size="14">The limit sits somewhere other</text>
<text x="52" y="615" fill="#f5f6f8" font-size="14">than the invoice count.</text>
<text x="52" y="650" fill="#aeb4bf" font-size="12">Shine Facture:</text>
<text x="52" y="672" fill="#aeb4bf" font-size="12">unlimited invoices advertised, 5 clients</text>
<text x="52" y="696" fill="#f5b13d" font-size="11">The relevant meter may stay hidden.</text>
<rect x="370" y="530" width="320" height="190" rx="14" fill="#211317" stroke="#ff4d87"></rect>
<text x="392" y="560" fill="#ff8fb0" font-size="13" font-weight="700">6. BUNDLE OR PROMOTION</text>
<text x="392" y="592" fill="#f5f6f8" font-size="14">The platform is included in a paid</text>
<text x="392" y="615" fill="#f5f6f8" font-size="14">product, or free for a limited time.</text>
<text x="392" y="650" fill="#aeb4bf" font-size="12">Sage, Cegid, Dext: included</text>
<text x="392" y="672" fill="#aeb4bf" font-size="12">Kolecto: first year for new firms</text>
<text x="392" y="696" fill="#f5b13d" font-size="11">No extra charge is not no cost.</text>
<rect x="30" y="756" width="660" height="104" rx="13" fill="#111720" stroke="#3a4049"></rect>
<text x="52" y="788" fill="#8b909b" font-size="12" font-weight="700">PUBLIC-OFFER AUDIT RESULT</text>
<text x="52" y="820" fill="#f5f6f8" font-size="15">13 OF 19: UNAMBIGUOUS ZERO-PRICE ENTRY.</text>
<text x="52" y="846" fill="#d6d9df" font-size="12">The scope of zero matters more than its presence in a headline.</text>
<text x="32" y="884" fill="#737985" font-size="9">SOURCES: official operator price lists, l0g snapshot taken on 22 August 2026.</text>
</svg>
