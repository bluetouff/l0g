<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 700" width="100%" role="img" aria-labelledby="ppf-cost-en-title ppf-cost-en-desc" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" style="font-family:ui-monospace,SFMono-Regular,monospace;background:#0c0d10">
<title id="ppf-cost-en-title">Four public cost estimates for the e-invoicing project</title>
<desc id="ppf-cost-en-desc">The €19.6m, €86m, €122m and €267.72m figures cover different dates and scopes. They are not a consistent series of overruns.</desc>
<rect x="1" y="1" width="718" height="698" rx="16" fill="#0c0d10" stroke="#2b3038"></rect>
<text x="32" y="48" fill="#f5f6f8" font-size="22" font-weight="700">FOUR FIGURES, FOUR SCOPES</text>
<text x="32" y="73" fill="#8b909b" font-size="12">Published amounts cannot be mechanically subtracted.</text>
<rect x="32" y="102" width="656" height="104" rx="12" fill="#121419" stroke="#5eead4"></rect>
<text x="52" y="130" fill="#5eead4" font-size="12" font-weight="700">2021 · FTAP AGREEMENT</text>
<text x="52" y="166" fill="#f5f6f8" font-size="28" font-weight="700">€19.6M</text>
<text x="218" y="154" fill="#d6d9df" font-size="14">public platform construction</text>
<text x="218" y="178" fill="#8b909b" font-size="12">within the scope funded by this agreement</text>
<rect x="32" y="224" width="656" height="104" rx="12" fill="#121419" stroke="#7aa2f7"></rect>
<text x="52" y="252" fill="#7aa2f7" font-size="12" font-weight="700">MAY 2022 · DINUM, WORKSTREAM 1</text>
<text x="52" y="288" fill="#f5f6f8" font-size="28" font-weight="700">€86M</text>
<text x="218" y="276" fill="#d6d9df" font-size="14">project construction</text>
<text x="218" y="300" fill="#8b909b" font-size="12">estimate still described as incomplete</text>
<rect x="32" y="346" width="656" height="104" rx="12" fill="#121419" stroke="#f5b13d"></rect>
<text x="52" y="374" fill="#f5b13d" font-size="12" font-weight="700">JANUARY 2023 · DINUM, FULL PROJECT</text>
<text x="52" y="410" fill="#f5f6f8" font-size="28" font-weight="700">€122M</text>
<text x="218" y="398" fill="#d6d9df" font-size="14">revised construction estimate</text>
<text x="218" y="422" fill="#8b909b" font-size="12">€210M with two years of operations</text>
<rect x="32" y="468" width="656" height="104" rx="12" fill="#121419" stroke="#ff4d87"></rect>
<text x="52" y="496" fill="#ff8fb0" font-size="12" font-weight="700">2026 FINANCE BILL · 2021-2028 PROJECT</text>
<text x="52" y="532" fill="#f5f6f8" font-size="28" font-weight="700">€267.72M</text>
<text x="250" y="520" fill="#d6d9df" font-size="14">full cost through rollout</text>
<text x="250" y="544" fill="#8b909b" font-size="12">including personnel and retained infrastructure</text>
<rect x="32" y="594" width="656" height="70" rx="12" fill="#1a1015" stroke="#ff4d87"></rect>
<text x="52" y="622" fill="#ff8fb0" font-size="12" font-weight="700">STILL UNKNOWN</text>
<text x="52" y="648" fill="#f5f6f8" font-size="15">Amount paid for functions developed and later removed.</text>
</svg>
