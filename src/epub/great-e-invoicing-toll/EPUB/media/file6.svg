<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 940" width="100%" role="img" aria-labelledby="objects-en-title objects-en-desc" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" style="display:block;width:100%;height:auto;overflow:hidden;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#0c0d10">
<title id="objects-en-title">An electronic invoice creates three distinct objects</title>
<desc id="objects-en-desc">The full document moves between companies and platforms. The directory is used for routing. Structured data and statuses are sent to the tax authority.</desc>
<rect x="1" y="1" width="718" height="938" rx="16" fill="#0c0d10" stroke="#2b3038"></rect>
<text x="32" y="48" fill="#f5f6f8" font-size="21" font-weight="700">ONE INVOICE, THREE OBJECTS</text>
<text x="32" y="74" fill="#8b909b" font-size="12">The document, address and tax twin follow distinct routes.</text>
<rect x="30" y="104" width="660" height="280" rx="14" fill="#10211f" stroke="#5eead4"></rect>
<text x="52" y="136" fill="#5eead4" font-size="13" font-weight="700">1. THE FULL DOCUMENT</text>
<text x="52" y="160" fill="#aeb4bf" font-size="11">Structured invoice, readable representation and attachments.</text>
<rect x="50" y="194" width="130" height="100" rx="11" fill="#152a28" stroke="#3fae9f"></rect>
<text x="115" y="224" fill="#f5f6f8" font-size="12" font-weight="700" text-anchor="middle">SENDER</text>
<text x="115" y="247" fill="#b7c6c3" font-size="10" text-anchor="middle">creates and</text>
<text x="115" y="266" fill="#b7c6c3" font-size="10" text-anchor="middle">approves</text>
<rect x="213" y="194" width="130" height="100" rx="11" fill="#152a28" stroke="#3fae9f"></rect>
<text x="278" y="224" fill="#f5f6f8" font-size="12" font-weight="700" text-anchor="middle">SENDER PA</text>
<text x="278" y="247" fill="#b7c6c3" font-size="10" text-anchor="middle">checks and</text>
<text x="278" y="266" fill="#b7c6c3" font-size="10" text-anchor="middle">routes</text>
<rect x="376" y="194" width="130" height="100" rx="11" fill="#152a28" stroke="#3fae9f"></rect>
<text x="441" y="224" fill="#f5f6f8" font-size="12" font-weight="700" text-anchor="middle">BUYER PA</text>
<text x="441" y="247" fill="#b7c6c3" font-size="10" text-anchor="middle">receives and</text>
<text x="441" y="266" fill="#b7c6c3" font-size="10" text-anchor="middle">delivers</text>
<rect x="539" y="194" width="130" height="100" rx="11" fill="#152a28" stroke="#3fae9f"></rect>
<text x="604" y="224" fill="#f5f6f8" font-size="12" font-weight="700" text-anchor="middle">BUYER</text>
<text x="604" y="247" fill="#b7c6c3" font-size="10" text-anchor="middle">views, rejects</text>
<text x="604" y="266" fill="#b7c6c3" font-size="10" text-anchor="middle">or pays</text>
<line x1="180" y1="244" x2="205" y2="244" stroke="#5eead4" stroke-width="3"></line>
<polygon points="205,244 195,238 195,250" fill="#5eead4"></polygon>
<line x1="343" y1="244" x2="368" y2="244" stroke="#5eead4" stroke-width="3"></line>
<polygon points="368,244 358,238 358,250" fill="#5eead4"></polygon>
<line x1="506" y1="244" x2="531" y2="244" stroke="#5eead4" stroke-width="3"></line>
<polygon points="531,244 521,238 521,250" fill="#5eead4"></polygon>
<text x="52" y="330" fill="#f5b13d" font-size="11">One PA may hold both roles when both companies use the same operator.</text>
<text x="52" y="353" fill="#8b909b" font-size="10">The full document is not the only file transmitted in the tax circuit.</text>
<rect x="30" y="410" width="310" height="178" rx="14" fill="#1b1b14" stroke="#f5b13d"></rect>
<text x="52" y="442" fill="#f5b13d" font-size="13" font-weight="700">2. CENTRAL DIRECTORY</text>
<text x="52" y="476" fill="#f5f6f8" font-size="13">Identifies the platform and</text>
<text x="52" y="500" fill="#f5f6f8" font-size="13">the buyer receiving address.</text>
<text x="52" y="538" fill="#aeb4bf" font-size="11">No invoice content.</text>
<text x="52" y="560" fill="#aeb4bf" font-size="11">Legal purpose: routing.</text>
<rect x="380" y="410" width="310" height="178" rx="14" fill="#151a28" stroke="#7aa2f7"></rect>
<text x="402" y="442" fill="#7aa2f7" font-size="13" font-weight="700">3. THE TAX TWIN</text>
<text x="402" y="476" fill="#f5f6f8" font-size="13">Structured file, statuses,</text>
<text x="402" y="500" fill="#f5f6f8" font-size="13">transactions and payments.</text>
<text x="402" y="538" fill="#aeb4bf" font-size="11">Sent by the sender PA.</text>
<text x="402" y="560" fill="#aeb4bf" font-size="11">General deadline: 24 hours.</text>
<rect x="30" y="616" width="660" height="270" rx="14" fill="#17131b" stroke="#ff85ad"></rect>
<text x="52" y="648" fill="#ff85ad" font-size="13" font-weight="700">AROUND THE REGULATED PIPE</text>
<text x="52" y="672" fill="#aeb4bf" font-size="11">Optional services can add further readers.</text>
<rect x="50" y="704" width="188" height="66" rx="10" fill="#241b16" stroke="#a87747"></rect>
<text x="144" y="732" fill="#f5f6f8" font-size="11" font-weight="700" text-anchor="middle">SOFTWARE OR ERP</text>
<text x="144" y="752" fill="#c8b7aa" font-size="10" text-anchor="middle">creation and synchronisation</text>
<rect x="266" y="704" width="188" height="66" rx="10" fill="#241b16" stroke="#a87747"></rect>
<text x="360" y="732" fill="#f5f6f8" font-size="11" font-weight="700" text-anchor="middle">ACCOUNTANT</text>
<text x="360" y="752" fill="#c8b7aa" font-size="10" text-anchor="middle">access under an engagement</text>
<rect x="482" y="704" width="188" height="66" rx="10" fill="#241b16" stroke="#a87747"></rect>
<text x="576" y="732" fill="#f5f6f8" font-size="11" font-weight="700" text-anchor="middle">BANK AND PAYMENT</text>
<text x="576" y="752" fill="#c8b7aa" font-size="10" text-anchor="middle">matching and settlement</text>
<rect x="50" y="792" width="188" height="66" rx="10" fill="#241b16" stroke="#a87747"></rect>
<text x="144" y="820" fill="#f5f6f8" font-size="11" font-weight="700" text-anchor="middle">INTEGRATED AI</text>
<text x="144" y="840" fill="#c8b7aa" font-size="10" text-anchor="middle">OCR, search, assistance</text>
<rect x="266" y="792" width="188" height="66" rx="10" fill="#241b16" stroke="#a87747"></rect>
<text x="360" y="820" fill="#f5f6f8" font-size="11" font-weight="700" text-anchor="middle">EXTERNAL ASSISTANT</text>
<text x="360" y="840" fill="#c8b7aa" font-size="10" text-anchor="middle">data sent on request</text>
<rect x="482" y="792" width="188" height="66" rx="10" fill="#241b16" stroke="#a87747"></rect>
<text x="576" y="820" fill="#f5f6f8" font-size="11" font-weight="700" text-anchor="middle">CREDIT OR FACTORING</text>
<text x="576" y="840" fill="#c8b7aa" font-size="10" text-anchor="middle">when the service is active</text>
<text x="32" y="918" fill="#6f7580" font-size="10">French framework at 22 August 2026. Optional access depends on contracts.</text>
</svg>
