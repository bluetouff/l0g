<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 760" width="100%" role="img" aria-labelledby="mobility-clock-en-title mobility-clock-en-desc" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" style="display:block;width:100%;height:auto;overflow:hidden;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#0c0d10">
<title id="mobility-clock-en-title">The regulatory clock for switching approved platforms</title>
<desc id="mobility-clock-en-desc">The arrival platform notifies the departure platform within two business days, the departure platform has five days to object on customer-will grounds, then the arrival platform has fifteen days to update the directory. The commercial contract remains separate.</desc>
<rect x="1" y="1" width="718" height="758" rx="16" fill="#0c0d10" stroke="#2b3038"></rect>
<text x="32" y="48" fill="#f5f6f8" font-size="21" font-weight="700">SWITCHING PA: THE DECREE'S CLOCK</text>
<text x="32" y="74" fill="#8b909b" font-size="12">Decree no. 2026-677 of 27 July 2026, Article 7</text>
<line x1="92" y1="134" x2="92" y2="566" stroke="#3a4049" stroke-width="4"></line>
<circle cx="92" cy="150" r="17" fill="#5eead4"></circle>
<text x="92" y="155" text-anchor="middle" fill="#08110f" font-size="11" font-weight="700">0</text>
<rect x="134" y="112" width="526" height="78" rx="11" fill="#10211f" stroke="#5eead4"></rect>
<text x="156" y="141" fill="#5eead4" font-size="12" font-weight="700">FORMAL CUSTOMER AGREEMENT</text>
<text x="156" y="166" fill="#f5f6f8" font-size="13">The arrival platform receives a dated, signed agreement.</text>
<circle cx="92" cy="258" r="17" fill="#7aa2f7"></circle>
<text x="92" y="263" text-anchor="middle" fill="#0b1020" font-size="9" font-weight="700">2 days</text>
<rect x="134" y="220" width="526" height="78" rx="11" fill="#151a23" stroke="#7aa2f7"></rect>
<text x="156" y="249" fill="#7aa2f7" font-size="12" font-weight="700">WITHIN TWO BUSINESS DAYS</text>
<text x="156" y="274" fill="#f5f6f8" font-size="13">Arrival sends the agreement to the departure platform.</text>
<circle cx="92" cy="366" r="17" fill="#f5b13d"></circle>
<text x="92" y="371" text-anchor="middle" fill="#1a1103" font-size="9" font-weight="700">5 days</text>
<rect x="134" y="320" width="526" height="94" rx="11" fill="#211713" stroke="#f5b13d"></rect>
<text x="156" y="349" fill="#f5b13d" font-size="12" font-weight="700">FIVE DAYS TO OBJECT</text>
<text x="156" y="374" fill="#f5f6f8" font-size="13">Objection must challenge the customer's intention,</text>
<text x="156" y="396" fill="#f5f6f8" font-size="13">for example through a more recent formal agreement.</text>
<circle cx="92" cy="488" r="19" fill="#ff4d87"></circle>
<text x="92" y="493" text-anchor="middle" fill="#21070f" font-size="8" font-weight="700">15 days</text>
<rect x="134" y="442" width="526" height="94" rx="11" fill="#211317" stroke="#ff4d87"></rect>
<text x="156" y="471" fill="#ff8fb0" font-size="12" font-weight="700">FIFTEEN DAYS AFTER AGREEMENT</text>
<text x="156" y="496" fill="#f5f6f8" font-size="13">The arrival platform updates the directory</text>
<text x="156" y="518" fill="#f5f6f8" font-size="13">and informs the company.</text>
<rect x="30" y="590" width="318" height="118" rx="12" fill="#111720" stroke="#5eead4"></rect>
<text x="52" y="620" fill="#5eead4" font-size="12" font-weight="700">TECHNICAL CONTINUITY</text>
<text x="52" y="648" fill="#f5f6f8" font-size="13">Status services remain for one year.</text>
<text x="52" y="672" fill="#f5f6f8" font-size="13">Continuity information supplied</text>
<text x="52" y="694" fill="#f5f6f8" font-size="13">within five business days on request.</text>
<rect x="372" y="590" width="318" height="118" rx="12" fill="#211713" stroke="#f5b13d"></rect>
<text x="394" y="620" fill="#f5b13d" font-size="12" font-weight="700">SEPARATE CONTRACT</text>
<text x="394" y="648" fill="#f5f6f8" font-size="13">Updating the directory does not</text>
<text x="394" y="672" fill="#f5f6f8" font-size="13">automatically terminate</text>
<text x="394" y="694" fill="#f5f6f8" font-size="13">the commercial subscription.</text>
<text x="32" y="740" fill="#737985" font-size="9">SOURCE: Légifrance, Decree no. 2026-677, Article 7. Deadlines are business days.</text>
</svg>
