<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 760" width="100%" role="img" aria-labelledby="audit-en-title audit-en-desc" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" style="display:block;width:100%;height:auto;overflow:hidden;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#0c0d10">
<title id="audit-en-title">The control stages for a French approved platform</title>
<desc id="audit-en-desc">Registration, interoperability tests, the initial audit, surveillance audit and renewal follow distinct timetables.</desc>
<rect x="1" y="1" width="718" height="758" rx="16" fill="#0c0d10" stroke="#2b3038"></rect>
<text x="32" y="48" fill="#f5f6f8" font-size="21" font-weight="700">APPROVAL RUNS ON SEVERAL CLOCKS</text>
<text x="32" y="74" fill="#8b909b" font-size="12">Regulatory schedule, not the status of an individual platform.</text>
<line x1="94" y1="142" x2="94" y2="654" stroke="#39414d" stroke-width="4"></line>
<circle cx="94" cy="146" r="12" fill="#5eead4"></circle>
<rect x="132" y="106" width="526" height="86" rx="12" fill="#10211f" stroke="#5eead4"></rect>
<text x="154" y="136" fill="#5eead4" font-size="13" font-weight="700">REGISTRATION AND TESTS</text>
<text x="154" y="160" fill="#f5f6f8" font-size="11">Application, security, ISO 27001 and interoperability.</text>
<text x="154" y="179" fill="#aeb4bf" font-size="10">The tests condition final registration.</text>
<circle cx="94" cy="274" r="12" fill="#7aa2f7"></circle>
<rect x="132" y="226" width="526" height="102" rx="12" fill="#141a28" stroke="#7aa2f7"></rect>
<text x="154" y="256" fill="#7aa2f7" font-size="13" font-weight="700">BY THE END OF YEAR ONE</text>
<text x="154" y="280" fill="#f5f6f8" font-size="11">Initial compliance audit report.</text>
<text x="154" y="300" fill="#aeb4bf" font-size="10">At least one month of activity after registration.</text>
<text x="154" y="317" fill="#aeb4bf" font-size="10">Announced correction period: three months at most.</text>
<circle cx="94" cy="410" r="12" fill="#f5b13d"></circle>
<rect x="132" y="362" width="526" height="102" rx="12" fill="#1b1b14" stroke="#f5b13d"></rect>
<text x="154" y="392" fill="#f5b13d" font-size="13" font-weight="700">BY THE END OF YEAR TWO</text>
<text x="154" y="416" fill="#f5f6f8" font-size="11">Surveillance audit report.</text>
<text x="154" y="436" fill="#aeb4bf" font-size="10">It targets substantial changes since the previous audit.</text>
<text x="154" y="453" fill="#aeb4bf" font-size="10">At least one month within the final six-month period.</text>
<circle cx="94" cy="546" r="12" fill="#ff85ad"></circle>
<rect x="132" y="498" width="526" height="102" rx="12" fill="#21151c" stroke="#ff85ad"></rect>
<text x="154" y="528" fill="#ff85ad" font-size="13" font-weight="700">RENEWAL AFTER THREE YEARS</text>
<text x="154" y="552" fill="#f5f6f8" font-size="11">A new compliance report accompanies the request.</text>
<text x="154" y="572" fill="#aeb4bf" font-size="10">Surveillance follows during the next two years.</text>
<circle cx="94" cy="654" r="12" fill="#8b909b"></circle>
<rect x="132" y="626" width="526" height="60" rx="12" fill="#15171b" stroke="#4a505a"></rect>
<text x="154" y="652" fill="#f5f6f8" font-size="11" font-weight="700">PUBLIC QUESTION</text>
<text x="154" y="673" fill="#aeb4bf" font-size="10">Which report was filed, when, and which reservations were closed?</text>
<text x="32" y="724" fill="#6f7580" font-size="10">Sources: CGI Annex II, Arts 242 nonies B and C; Annex IV, Art. 41 septies A. Accessed 22 August 2026.</text>
</svg>
