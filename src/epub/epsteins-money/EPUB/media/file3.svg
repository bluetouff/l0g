<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 480 820" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="timeline-title-en timeline-desc-en" style="width:100%;height:auto;display:block;max-width:720px;margin:0 auto;background:#090b10;border:1px solid #252b36;border-radius:16px;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,sans-serif">
<title id="timeline-title-en">From early alert to retrospective reporting</title>
<desc id="timeline-desc-en">Parallel timeline of JPMorgan and Deutsche Bank from 2002 to 2019, showing alerts, retention decisions, the handover and late filings.</desc>
<rect width="480" height="820" rx="16" fill="#090b10"></rect>
<text x="28" y="42" fill="#f4f6f8" font-size="22" font-weight="750">ALERTS, DECISIONS, EXITS</text>
<text x="28" y="68" fill="#9aa4b2" font-size="15">Two successive banks, one continuous risk</text>
<text x="28" y="108" fill="#75a7ff" font-size="16" font-weight="750">JPMORGAN</text>
<rect x="28" y="124" width="424" height="70" rx="10" fill="#14233a" stroke="#75a7ff"></rect>
<text x="46" y="153" fill="#75a7ff" font-size="15" font-weight="750">2002</text>
<text x="112" y="151" fill="#f4f6f8" font-size="18" font-weight="750">First SAR</text>
<text x="112" y="176" fill="#b6c1ce" font-size="15">$194,300 reported</text>
<rect x="28" y="208" width="424" height="70" rx="10" fill="#14233a" stroke="#75a7ff"></rect>
<text x="46" y="237" fill="#75a7ff" font-size="15" font-weight="750">2011</text>
<text x="112" y="235" fill="#f4f6f8" font-size="18" font-weight="750">Retain the client</text>
<text x="112" y="260" fill="#b6c1ce" font-size="15">Decision after internal review</text>
<rect x="28" y="292" width="424" height="78" rx="10" fill="#14233a" stroke="#75a7ff"></rect>
<text x="46" y="322" fill="#75a7ff" font-size="15" font-weight="750">2013</text>
<text x="112" y="320" fill="#f4f6f8" font-size="18" font-weight="750">Direct exit</text>
<text x="112" y="346" fill="#b6c1ce" font-size="15">Third-party work still allowed</text>
<path d="M240 389 V409" fill="none" stroke="#d9a441" stroke-width="3"></path>
<path d="M232 400 L240 410 L248 400" fill="none" stroke="#d9a441" stroke-width="3"></path>
<text x="28" y="441" fill="#f08bb4" font-size="16" font-weight="750">DEUTSCHE BANK</text>
<rect x="28" y="457" width="424" height="70" rx="10" fill="#341927" stroke="#f08bb4"></rect>
<text x="46" y="486" fill="#f08bb4" font-size="15" font-weight="750">2013</text>
<text x="112" y="484" fill="#f4f6f8" font-size="18" font-weight="750">Onboarding</text>
<text x="112" y="509" fill="#cdb8c1" font-size="15">Client rated high-risk</text>
<rect x="28" y="541" width="424" height="70" rx="10" fill="#341927" stroke="#f08bb4"></rect>
<text x="46" y="570" fill="#f08bb4" font-size="15" font-weight="750">2015</text>
<text x="112" y="568" fill="#f4f6f8" font-size="18" font-weight="750">Retained with conditions</text>
<text x="112" y="593" fill="#cdb8c1" font-size="15">Conditions not transmitted</text>
<rect x="28" y="625" width="424" height="70" rx="10" fill="#341927" stroke="#f08bb4"></rect>
<text x="46" y="654" fill="#f08bb4" font-size="15" font-weight="750">2018</text>
<text x="112" y="652" fill="#f4f6f8" font-size="18" font-weight="750">Termination letter</text>
<text x="112" y="677" fill="#cdb8c1" font-size="15">21 December</text>
<rect x="28" y="709" width="424" height="70" rx="10" fill="#341927" stroke="#f08bb4"></rect>
<text x="46" y="738" fill="#f08bb4" font-size="15" font-weight="750">2019</text>
<text x="112" y="736" fill="#f4f6f8" font-size="18" font-weight="750">Retrospective SARs</text>
<text x="112" y="761" fill="#cdb8c1" font-size="15">Over $250m per Senate staff</text>
<text x="28" y="803" fill="#6f7a89" font-size="13">Filing dates ≠ legal dates of initial detection.</text>
</svg>
