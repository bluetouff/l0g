<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 480 610" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hb-title-en hb-desc-en" style="width:100%;max-width:480px;height:auto;display:block;margin:0 auto;background:#0c111b;border:1px solid #253047;border-radius:14px;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,sans-serif">
<title id="hb-title-en">The three Highbridge ledgers</title>
<desc id="hb-desc-en">Three vertical cards distinguish the Highbridge fee, balance and redemptions.</desc>
<rect width="480" height="610" rx="14" fill="#0c111b"></rect>
<text x="24" y="42" fill="#f6f8fb" font-size="21" font-weight="760">HIGHBRIDGE: THREE LINES</text>
<text x="24" y="66" fill="#9ca9bb" font-size="14">One relationship, measures that cannot be added.</text>
<rect x="24" y="94" width="432" height="126" rx="10" fill="#17243b" stroke="#5f8ff3"></rect>
<text x="42" y="123" fill="#7da4f7" font-size="13" font-weight="750">INCOME · DEC. 29, 2004</text>
<text x="42" y="160" fill="#ffffff" font-size="27" font-weight="780">$15,000,000</text>
<text x="42" y="187" fill="#c2cbd7" font-size="14">M&#x26;A fee paid to Financial Trust</text>
<text x="42" y="208" fill="#79c6a3" font-size="12" font-weight="700">PROCESSED WIRE AND INVOICE</text>
<rect x="24" y="236" width="432" height="126" rx="10" fill="#142b31" stroke="#45a3a8"></rect>
<text x="42" y="265" fill="#67c2c7" font-size="13" font-weight="750">BALANCE · MAY 31, 2014</text>
<text x="42" y="302" fill="#ffffff" font-size="27" font-weight="780">$58,376,375</text>
<text x="42" y="329" fill="#c2cbd7" font-size="14">Haze $37.904m ; Southern $20.472m</text>
<text x="42" y="350" fill="#9ca9bb" font-size="12">Portfolio snapshot, not cash received.</text>
<rect x="24" y="378" width="432" height="126" rx="10" fill="#321b22" stroke="#e28c9d"></rect>
<text x="42" y="407" fill="#eea1b0" font-size="13" font-weight="750">LIQUIDITY · 2014-2015</text>
<text x="42" y="444" fill="#ffffff" font-size="27" font-weight="780">$59,446,789</text>
<text x="42" y="471" fill="#c2cbd7" font-size="14">gross redemptions, final payments included</text>
<text x="42" y="492" fill="#f0c36a" font-size="12" font-weight="700">THIS IS NOT A PROFIT</text>
<rect x="24" y="530" width="432" height="48" rx="8" fill="#231f17"></rect>
<text x="240" y="560" text-anchor="middle" fill="#f0c36a" font-size="12" font-weight="700">2005 $2.25M PROPOSAL: UNSIGNED, EXCLUDED</text>
</svg>
