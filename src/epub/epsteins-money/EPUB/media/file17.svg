<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 480 790" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="barclays-chain-en-title barclays-chain-en-desc" style="width:100%;height:auto;display:block;max-width:680px;margin:0 auto;background:#090b10;border:1px solid #252b36;border-radius:16px;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,sans-serif">
<title id="barclays-chain-en-title">The verification chain for Barclays' 2019 letter to the FCA</title>
<desc id="barclays-chain-en-desc">A vertical timeline from the FCA's August 2019 question to the arrival of JPMorgan documents in November, followed by the final 2025 decision.</desc>
<rect width="480" height="790" rx="16" fill="#090b10"></rect>
<text x="28" y="42" fill="#f4f6f8" font-size="21" font-weight="750">THE 2019 ASSURANCE</text>
<text x="28" y="68" fill="#9aa4b2" font-size="13.5">A chain dependent on its chief executive's account</text>
<line x1="72" y1="110" x2="72" y2="704" stroke="#394252" stroke-width="4"></line>
<circle cx="72" cy="130" r="11" fill="#75a7ff"></circle>
<text x="104" y="125" fill="#9ec0ff" font-size="13.5" font-weight="750">15 AUGUST 2019</text>
<text x="104" y="151" fill="#f4f6f8" font-size="16" font-weight="700">The FCA questions the board</text>
<text x="104" y="174" fill="#b7bec9" font-size="12.5">Barclays must explain how it informed itself.</text>
<circle cx="72" cy="252" r="11" fill="#9b8cff"></circle>
<text x="104" y="247" fill="#bdb4ff" font-size="13.5" font-weight="750">SUMMER AND OCTOBER</text>
<text x="104" y="273" fill="#f4f6f8" font-size="16" font-weight="700">Interviews and records review</text>
<text x="104" y="296" fill="#b7bec9" font-size="11.5">The board does not obtain the complete picture.</text>
<circle cx="72" cy="374" r="11" fill="#f5b13d"></circle>
<text x="104" y="369" fill="#ffd189" font-size="13.5" font-weight="750">6 AND 7 OCTOBER</text>
<text x="104" y="395" fill="#f4f6f8" font-size="16" font-weight="700">Staley checks and approves</text>
<text x="104" y="418" fill="#b7bec9" font-size="12.5">He is asked to confirm the text is accurate.</text>
<circle cx="72" cy="496" r="11" fill="#5eead4"></circle>
<text x="104" y="491" fill="#82f2e2" font-size="13.5" font-weight="750">8 OCTOBER</text>
<text x="104" y="517" fill="#f4f6f8" font-size="16" font-weight="700">Nigel Higgins sends the letter</text>
<text x="104" y="540" fill="#b7bec9" font-size="12.5">Two statements will be found misleading.</text>
<circle cx="72" cy="618" r="11" fill="#ff4d87"></circle>
<text x="104" y="613" fill="#ff7aa8" font-size="13.5" font-weight="750">NOVEMBER AND DECEMBER</text>
<text x="104" y="639" fill="#f4f6f8" font-size="16" font-weight="700">JPMorgan flags documents</text>
<text x="104" y="662" fill="#b7bec9" font-size="12.5">The FCA obtains the emails and investigates.</text>
<circle cx="72" cy="728" r="11" fill="#f4f6f8"></circle>
<text x="104" y="723" fill="#f4f6f8" font-size="13.5" font-weight="750">2025</text>
<text x="104" y="749" fill="#f4f6f8" font-size="16" font-weight="700">Final penalty and ban</text>
<text x="104" y="772" fill="#b7bec9" font-size="12.5">Staley's challenge fails on the substance.</text>
</svg>
