<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="property-title-en property-desc-en" style="width:100%;height:auto;display:block;background:#0b1120;border:1px solid #26324a;border-radius:16px;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,sans-serif">
<title id="property-title-en">Public real estate sales by the Epstein estate</title>
<desc id="property-desc-en">Five cards compare 2019 declared values and reported gross sale prices. Zorro Ranch remains undisclosed.</desc>
<style>.mobile{display:none}@media (max-width:640px){.desktop{display:none}.mobile{display:block}}</style>
<g class="desktop">
<rect width="760" height="560" rx="16" fill="#0b1120"></rect>
<text x="38" y="52" fill="#f7f9fc" font-size="26" font-weight="760">FROM PROPERTY TO CASH</text>
<text x="38" y="81" fill="#99a7bb" font-size="15">Reported gross prices. Zorro is excluded from the known sale subtotal.</text>
<g transform="translate(38 112)">
<rect width="214" height="126" rx="12" fill="#16233a" stroke="#47679d"></rect>
<text x="18" y="30" fill="#8fb0f5" font-size="13" font-weight="740">PALM BEACH · 2021</text>
<text x="18" y="70" fill="#ffffff" font-size="27" font-weight="780">$18.5M</text>
<text x="18" y="97" fill="#aeb9c9" font-size="13">2019 value: $12.38M</text>
<text x="18" y="116" fill="#71c7a4" font-size="12">reported price</text>
</g>
<g transform="translate(273 112)">
<rect width="214" height="126" rx="12" fill="#16233a" stroke="#47679d"></rect>
<text x="18" y="30" fill="#8fb0f5" font-size="13" font-weight="740">NEW YORK · 2021</text>
<text x="18" y="70" fill="#ffffff" font-size="27" font-weight="780">$51.0M</text>
<text x="18" y="97" fill="#aeb9c9" font-size="13">2019 value: $55.93M</text>
<text x="18" y="116" fill="#71c7a4" font-size="12">reported price</text>
</g>
<g transform="translate(508 112)">
<rect width="214" height="126" rx="12" fill="#16233a" stroke="#47679d"></rect>
<text x="18" y="30" fill="#8fb0f5" font-size="13" font-weight="740">PARIS · 2022</text>
<text x="18" y="70" fill="#ffffff" font-size="27" font-weight="780">≈ $10.4M</text>
<text x="18" y="97" fill="#aeb9c9" font-size="13">2019 value: $8.67M</text>
<text x="18" y="116" fill="#eabb5e" font-size="12">approximate conversion</text>
</g>
<g transform="translate(38 264)">
<rect width="332" height="132" rx="12" fill="#142d30" stroke="#3d9186"></rect>
<text x="18" y="31" fill="#78d0c1" font-size="13" font-weight="740">LITTLE + GREAT ST. JAMES · 2023</text>
<text x="18" y="73" fill="#ffffff" font-size="29" font-weight="780">≈ $60.0M</text>
<text x="18" y="101" fill="#a8c8c4" font-size="13">2019 value: $86.37M</text>
<text x="18" y="121" fill="#eabb5e" font-size="12">50% of net Little St. James proceeds to USVI</text>
</g>
<g transform="translate(392 264)">
<rect width="330" height="132" rx="12" fill="#321d27" stroke="#ad5369"></rect>
<text x="18" y="31" fill="#efa0b1" font-size="13" font-weight="740">ZORRO RANCH · 2023</text>
<text x="18" y="73" fill="#ffffff" font-size="29" font-weight="780">PRICE UNKNOWN</text>
<text x="18" y="101" fill="#d3adb7" font-size="13">2019 value: $17.25M</text>
<text x="18" y="121" fill="#efa0b1" font-size="12">no public disclosure identified</text>
</g>
<rect x="38" y="430" width="684" height="82" rx="12" fill="#201d16" stroke="#8c6b2e"></rect>
<text x="60" y="460" fill="#f0c36a" font-size="14" font-weight="740">KNOWN PUBLIC SUBTOTAL</text>
<text x="60" y="493" fill="#ffffff" font-size="22" font-weight="780">$139.9M + Zorro unknown</text>
<text x="510" y="474" fill="#b9aa88" font-size="13">gross ≠ cash retained</text>
<text x="510" y="495" fill="#b9aa88" font-size="13">sale ≠ new wealth</text>
<text x="38" y="539" fill="#74839a" font-size="12">Sources: probate petition, estate accounts, USVI DOJ, Forbes.</text>
</g>
<g class="mobile" transform="scale(2.17)">
<rect width="350" height="258" rx="16" fill="#0b1120"></rect>
<text x="20" y="27" fill="#f7f9fc" font-size="15" font-weight="760">PUBLIC PROPERTY SALES</text>
<text x="20" y="46" fill="#99a7bb" font-size="11">Reported gross prices, not net sale proceeds.</text>
<rect x="20" y="59" width="310" height="30" rx="7" fill="#16233a"></rect><text x="32" y="78" fill="#8fb0f5" font-size="12" font-weight="740">PALM BEACH · 2021</text><text x="318" y="79" text-anchor="end" fill="#ffffff" font-size="18" font-weight="780">$18.5M</text>
<rect x="20" y="94" width="310" height="30" rx="7" fill="#16233a"></rect><text x="32" y="113" fill="#8fb0f5" font-size="12" font-weight="740">NEW YORK · 2021</text><text x="318" y="114" text-anchor="end" fill="#ffffff" font-size="18" font-weight="780">$51.0M</text>
<rect x="20" y="129" width="310" height="30" rx="7" fill="#16233a"></rect><text x="32" y="148" fill="#8fb0f5" font-size="12" font-weight="740">PARIS · 2022</text><text x="318" y="149" text-anchor="end" fill="#ffffff" font-size="18" font-weight="780">≈$10.4M</text>
<rect x="20" y="164" width="310" height="30" rx="7" fill="#142d30"></rect><text x="32" y="183" fill="#78d0c1" font-size="12" font-weight="740">LITTLE + GREAT ST. JAMES · 2023</text><text x="318" y="184" text-anchor="end" fill="#ffffff" font-size="18" font-weight="780">≈$60.0M</text>
<rect x="20" y="199" width="310" height="30" rx="7" fill="#321d27"></rect><text x="32" y="218" fill="#efa0b1" font-size="12" font-weight="740">ZORRO RANCH · 2023</text><text x="318" y="219" text-anchor="end" fill="#ffffff" font-size="16" font-weight="780">PRICE UNKNOWN</text>
<text x="20" y="246" fill="#f0c36a" font-size="12" font-weight="740">KNOWN SUBTOTAL: $139.9M</text>
</g>
</svg>
