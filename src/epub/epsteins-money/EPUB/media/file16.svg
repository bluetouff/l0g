<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 480 690" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="barclays-boundary-en-title barclays-boundary-en-desc" style="width:100%;height:auto;display:block;max-width:680px;margin:0 auto;background:#090b10;border:1px solid #252b36;border-radius:16px;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,sans-serif">
<title id="barclays-boundary-en-title">Two Barclays records and the boundary between their evidence</title>
<desc id="barclays-boundary-en-desc">The first block summarises Staley governance and the final sanction. The second presents the Maxwell account described by Reuters. A third states that none of this evidence establishes a Barclays account in Epstein's name.</desc>
<rect width="480" height="690" rx="16" fill="#090b10"></rect>
<text x="28" y="42" fill="#f4f6f8" font-size="21" font-weight="750">TWO RECORDS, ONE BOUNDARY</text>
<text x="28" y="68" fill="#9aa4b2" font-size="13.5">Same bank, different subjects and levels of proof</text>
<rect x="26" y="100" width="428" height="180" rx="13" fill="#14233a" stroke="#75a7ff" stroke-width="1.5"></rect>
<text x="46" y="132" fill="#9ec0ff" font-size="14" font-weight="750">STALEY GOVERNANCE</text>
<text x="46" y="164" fill="#f4f6f8" font-size="18" font-weight="720">Barclays letter to the FCA</text>
<text x="46" y="192" fill="#b7bec9" font-size="13.5">Two statements found to be misleading</text>
<text x="46" y="222" fill="#f4f6f8" font-size="17" font-weight="720">£1,107,306.92 and a ban</text>
<text x="46" y="247" fill="#b7bec9" font-size="13.5">Final personal sanctions in 2025</text>
<rect x="26" y="306" width="428" height="198" rx="13" fill="#2b2315" stroke="#f5b13d" stroke-width="1.5"></rect>
<text x="46" y="338" fill="#ffd189" font-size="14" font-weight="750">MAXWELL ACCOUNT</text>
<text x="46" y="374" fill="#f4f6f8" font-size="20" font-weight="750">$2.4m at end-2018</text>
<text x="46" y="410" fill="#f4f6f8" font-size="20" font-weight="750">More than $600,000 to UBS</text>
<text x="46" y="440" fill="#b7bec9" font-size="13.5">Within three weeks after Epstein's arrest,</text>
<text x="46" y="465" fill="#b7bec9" font-size="13.5">according to documents analysed by Reuters</text>
<rect x="26" y="530" width="428" height="126" rx="13" fill="#2c1621" stroke="#ff4d87" stroke-width="1.5"></rect>
<text x="46" y="562" fill="#ff7aa8" font-size="14" font-weight="750">NOT ESTABLISHED BY THIS EVIDENCE</text>
<text x="46" y="598" fill="#f4f6f8" font-size="17" font-weight="720">A Barclays account in Epstein's name</text>
<text x="46" y="626" fill="#b7bec9" font-size="11.5">The Maxwell account does not support that inference.</text>
</svg>
