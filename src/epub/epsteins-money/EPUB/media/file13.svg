<rect x="20" y="157" width="310" height="45" rx="9" fill="#321d27" stroke="#aa5369"></rect><text x="32" y="176" fill="#efa3b3" font-size="12" font-weight="740">QUANTIFIED LIABILITIES, AT LEAST</text><text x="318" y="192" text-anchor="end" fill="#ffffff" font-size="22" font-weight="780">$27.0M</text>
<rect x="20" y="215" width="310" height="43" rx="9" fill="#171e2c" stroke="#68579a"></rect><text x="32" y="233" fill="#baa5ef" font-size="12" font-weight="740">1953 TRUST · FIRST THREE RANKS</text><text x="318" y="250" text-anchor="end" fill="#ffffff" font-size="20" font-weight="780">$175M NOMINAL</text>
<text x="20" y="275" fill="#74839a" font-size="10">Valar is already included. Claims and taxes remain open.</text>
