<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="closing-title-en closing-desc-en" style="width:100%;height:auto;display:block;background:#0b1120;border:1px solid #26324a;border-radius:16px;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,sans-serif">
<title id="closing-title-en">Gross assets, known liabilities and the 1953 Trust priority</title>
<desc id="closing-desc-en">The 107.6 million dollar balance is split into components, then compared with 27 million in quantified liabilities and 175 million in the first three trust bequests.</desc>
<style>.mobile{display:none}@media (max-width:640px){.desktop{display:none}.mobile{display:block}}</style>
<g class="desktop">
<rect width="760" height="620" rx="16" fill="#0b1120"></rect>
<text x="38" y="52" fill="#f7f9fc" font-size="26" font-weight="760">$107.6M: GROSS ASSETS, NOT AN INHERITANCE</text>
<text x="38" y="81" fill="#99a7bb" font-size="15">At June 30, 2026. Taxes and other claims remain unquantified.</text>
<rect x="38" y="112" width="430" height="252" rx="14" fill="#141f33" stroke="#405678"></rect>
