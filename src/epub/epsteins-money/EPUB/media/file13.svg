<rect x="60" y="240" width="119" height="82" rx="9" fill="#1b5a58"></rect>
<text x="76" y="266" fill="#9de3d8" font-size="11">CASH</text>
<text x="76" y="300" fill="#ffffff" font-size="21" font-weight="760">$25.70</text>
<text x="76" y="316" fill="#9de3d8" font-size="11">MILLION</text>
<rect x="191" y="240" width="112" height="82" rx="9" fill="#493b1d"></rect>
<text x="207" y="266" fill="#efd387" font-size="11">LOANS</text>
<text x="207" y="300" fill="#ffffff" font-size="21" font-weight="760">$3.43</text>
<text x="207" y="316" fill="#efd387" font-size="11">MILLION</text>
<rect x="315" y="240" width="109" height="82" rx="9" fill="#3a2530"></rect>
<text x="331" y="266" fill="#e9a6b6" font-size="11">JEWELRY</text>
<text x="331" y="299" fill="#ffffff" font-size="18" font-weight="760">$4,055</text>
<text x="60" y="347" fill="#76869b" font-size="11">Components add to reported total + $0.01</text>
<rect x="494" y="112" width="228" height="252" rx="14" fill="#321d27" stroke="#aa5369"></rect>
<text x="516" y="143" fill="#efa3b3" font-size="13" font-weight="750">QUANTIFIED LIABILITIES</text>
<text x="516" y="190" fill="#ffffff" font-size="30" font-weight="790">$27.0M</text>
<line x1="516" y1="211" x2="699" y2="211" stroke="#6b3948"></line>
<text x="516" y="242" fill="#d9b2bc" font-size="13">$22.5M class balance</text>
<text x="516" y="269" fill="#d9b2bc" font-size="13">$4.5M unpaid fees</text>
<text x="516" y="311" fill="#f0c36a" font-size="12" font-weight="720">ALSO: UNKNOWN</text>
<text x="516" y="334" fill="#c7a5ad" font-size="11">claims + taxes to be determined</text>
<path d="M380 396 L380 430" stroke="#65738a" stroke-width="3"></path>
<path d="M371 422 L380 432 L389 422" fill="none" stroke="#65738a" stroke-width="3"></path>
<rect x="38" y="444" width="684" height="126" rx="14" fill="#171e2c" stroke="#68579a"></rect>
<text x="60" y="474" fill="#baa5ef" font-size="13" font-weight="750">1953 TRUST · AFTER DEBTS, TAXES AND ADMINISTRATION</text>
<text x="60" y="513" fill="#ffffff" font-size="26" font-weight="780">$175M in the first three priority ranks</text>
<text x="60" y="543" fill="#b8bed0" font-size="13">Shuliak $100M · Indyke $50M · Kahn $25M</text>
<text x="60" y="562" fill="#8f97aa" font-size="12">nominal bequests, no public distribution identified</text>
<text x="38" y="602" fill="#74839a" font-size="12">Valar is already inside the entity line. Its oral $172M estimate is not additive.</text>
</g>
