<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 480 890" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="euro-banks-map-en-title euro-banks-map-en-desc" style="width:100%;height:auto;display:block;overflow:hidden;max-width:680px;margin:0 auto;background:#090b10;border:1px solid #252b36;border-radius:16px;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,sans-serif">
<title id="euro-banks-map-en-title">Six banks and six documented relationships of different kinds</title>
<desc id="euro-banks-map-en-desc">The map distinguishes a direct client, French and Swiss accounts, an inherited account, a Maxwell account, an advisory engagement and a governance case.</desc>
<rect width="480" height="890" rx="16" fill="#090b10"></rect>
<text x="28" y="42" fill="#f4f6f8" font-size="20" font-weight="750">SIX BANKS, DISTINCT EVIDENCE</text>
<text x="28" y="68" fill="#9aa4b2" font-size="11">Appearing in a record does not make the cases equivalent</text>
<rect x="26" y="96" width="428" height="112" rx="12" fill="#2c1621" stroke="#ff4d87" stroke-width="1.5"></rect>
<text x="44" y="124" fill="#ff7aa8" font-size="13.5" font-weight="750">DEUTSCHE BANK</text>
<text x="44" y="153" fill="#f4f6f8" font-size="17" font-weight="720">Epstein as a direct client</text>
<text x="44" y="179" fill="#b7bec9" font-size="12.5">Failures found by New York's financial regulator</text>
<rect x="26" y="224" width="428" height="112" rx="12" fill="#2b2315" stroke="#f5b13d" stroke-width="1.5"></rect>
<text x="44" y="252" fill="#ffd189" font-size="13.5" font-weight="750">HSBC</text>
<text x="44" y="281" fill="#f4f6f8" font-size="14.5" font-weight="720">Paris account closed, Swiss accounts listed</text>
<text x="44" y="307" fill="#b7bec9" font-size="12.5">The Swiss timeline remains incomplete</text>
<rect x="26" y="352" width="428" height="112" rx="12" fill="#14233a" stroke="#75a7ff" stroke-width="1.5"></rect>
<text x="44" y="380" fill="#9ec0ff" font-size="13.5" font-weight="750">BNP PARIBAS</text>
<text x="44" y="409" fill="#f4f6f8" font-size="17" font-weight="720">Retail account inherited from Fortis</text>
<text x="44" y="435" fill="#b7bec9" font-size="12.5">Closed in 2018 for compliance reasons</text>
<rect x="26" y="480" width="428" height="112" rx="12" fill="#172b28" stroke="#5eead4" stroke-width="1.5"></rect>
<text x="44" y="508" fill="#82f2e2" font-size="13.5" font-weight="750">UBS</text>
<text x="44" y="537" fill="#f4f6f8" font-size="17" font-weight="720">Epstein card, then Maxwell wealth</text>
<text x="44" y="563" fill="#b7bec9" font-size="12.5">Two account holders and two different decisions</text>
<rect x="26" y="608" width="428" height="112" rx="12" fill="#25203f" stroke="#9b8cff" stroke-width="1.5"></rect>
<text x="44" y="636" fill="#bdb4ff" font-size="13.5" font-weight="750">BARCLAYS</text>
<text x="44" y="665" fill="#f4f6f8" font-size="17" font-weight="720">Staley governance and Maxwell account</text>
<text x="44" y="691" fill="#b7bec9" font-size="12.5">No Epstein account established by these records</text>
<rect x="26" y="736" width="428" height="126" rx="12" fill="#2a1f29" stroke="#e38bd2" stroke-width="1.5"></rect>
<text x="44" y="764" fill="#f0a9e4" font-size="13.5" font-weight="750">EDMOND DE ROTHSCHILD</text>
<text x="44" y="793" fill="#f4f6f8" font-size="15.5" font-weight="720">Southern Trust paid as a service provider</text>
<text x="44" y="819" fill="#b7bec9" font-size="12.5">$25m agreement, payments totalling $24,999,980</text>
<text x="44" y="842" fill="#b7bec9" font-size="12.5">This is not proof of an Epstein account</text>
</svg>
