<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 480 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="st-title-en st-desc-en" style="display:block;width:100%;height:auto;max-width:720px;margin:0 auto;background:#0c0d10;border:1px solid rgba(255,255,255,0.10);border-radius:12px;font-family:ui-monospace,monospace">
<title id="st-title-en">Reconciliation of Southern Trust fee income, 2013 to 2017</title>
<desc id="st-desc-en">Vertically stacked annual bars show $158 million from Leon Black, $24,999,980 from Edmond de Rothschild and $1 million from Steven Sinofsky, for an exact total of $183,999,980.</desc>
<text x="24" y="40" fill="#f5f6f8" font-size="19" font-weight="700">SOUTHERN TRUST</text>
<text x="24" y="64" fill="#f5f6f8" font-size="19" font-weight="700">$183,999,980 RECONCILED</text>
<text x="24" y="92" fill="#a8adb7" font-size="12">Recorded fee income, bars scaled to $70m.</text>
<rect x="24" y="114" width="432" height="94" rx="10" fill="#11141a" stroke="#313641"></rect>
<circle cx="46" cy="140" r="6" fill="#ff4d87"></circle>
<text x="62" y="145" fill="#d6d9df" font-size="13">Leon Black · $158m</text>
<circle cx="46" cy="166" r="6" fill="#f5b13d"></circle>
<text x="62" y="171" fill="#d6d9df" font-size="13">Edmond de Rothschild · $24,999,980</text>
<circle cx="46" cy="192" r="6" fill="#5eead4"></circle>
<text x="62" y="197" fill="#d6d9df" font-size="13">Steven Sinofsky · $1m</text>
<text x="28" y="248" fill="#f5f6f8" font-size="14" font-weight="700">2013</text>
<rect x="100" y="228" width="340" height="30" rx="5" fill="#171a21"></rect>
<rect x="100" y="228" width="247.7" height="30" rx="5" fill="#ff4d87"></rect>
<rect x="347.7" y="228" width="4.9" height="30" rx="2" fill="#5eead4"></rect>
<text x="114" y="248" fill="#f5f6f8" font-size="13" font-weight="700">$51m</text>
<text x="28" y="318" fill="#f5f6f8" font-size="14" font-weight="700">2014</text>
<rect x="100" y="298" width="340" height="30" rx="5" fill="#171a21"></rect>
<rect x="100" y="298" width="340" height="30" rx="5" fill="#ff4d87"></rect>
<text x="114" y="318" fill="#f5f6f8" font-size="13" font-weight="700">$70m</text>
<text x="28" y="388" fill="#f5f6f8" font-size="14" font-weight="700">2015</text>
<rect x="100" y="368" width="340" height="30" rx="5" fill="#171a21"></rect>
<rect x="100" y="368" width="145.7" height="30" rx="5" fill="#ff4d87"></rect>
<rect x="245.7" y="368" width="121.4" height="30" rx="2" fill="#f5b13d"></rect>
<text x="114" y="388" fill="#f5f6f8" font-size="13" font-weight="700">$54,999,980</text>
<text x="28" y="458" fill="#f5f6f8" font-size="14" font-weight="700">2016</text>
<rect x="100" y="438" width="340" height="30" rx="5" fill="#171a21" stroke="#313641" stroke-dasharray="4 4"></rect>
<text x="114" y="458" fill="#8b909b" font-size="13">$0 in fee income</text>
<text x="28" y="528" fill="#f5f6f8" font-size="14" font-weight="700">2017</text>
<rect x="100" y="508" width="340" height="30" rx="5" fill="#171a21"></rect>
<rect x="100" y="508" width="38.9" height="30" rx="5" fill="#ff4d87"></rect>
<text x="154" y="528" fill="#f5f6f8" font-size="13" font-weight="700">$8m</text>
<rect x="24" y="578" width="432" height="112" rx="10" fill="#11141a" stroke="#313641"></rect>
<text x="46" y="608" fill="#f58b57" font-size="13" font-weight="700">TOTAL FEE INCOME</text>
<text x="46" y="638" fill="#d6d9df" font-size="14">$158m + $24,999,980 + $1m</text>
<text x="46" y="670" fill="#f5f6f8" font-size="21" font-weight="700">= $183,999,980</text>
</svg>
