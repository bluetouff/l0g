<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 480 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="valar-title-en valar-desc-en" style="width:100%;max-width:480px;height:auto;display:block;margin:0 auto;background:#0c111b;border:1px solid #253047;border-radius:14px;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,sans-serif">
<title id="valar-title-en">Valar commitments, contributions and values</title>
<desc id="valar-desc-en">Two funds and four successive dates show why Valar values cannot be added together.</desc>
<rect width="480" height="760" rx="14" fill="#0c111b"></rect>
<text x="24" y="42" fill="#f6f8fb" font-size="18.5" font-weight="760">VALAR: SAME CAPITAL, SEVERAL STATES</text>
<text x="24" y="66" fill="#9ca9bb" font-size="11">Commitment, paid-in capital and value are distinct measures.</text>
<rect x="24" y="94" width="432" height="104" rx="10" fill="#17243b" stroke="#5f8ff3"></rect>
<text x="42" y="123" fill="#7da4f7" font-size="13" font-weight="750">FUND II</text>
<text x="42" y="157" fill="#ffffff" font-size="25" font-weight="780">$15m committed</text>
<text x="42" y="181" fill="#c2cbd7" font-size="14">$14.55m paid ; LP capital: $21,000,471</text>
<rect x="24" y="214" width="432" height="104" rx="10" fill="#17243b" stroke="#b58af1"></rect>
<text x="42" y="243" fill="#c3a4f5" font-size="13" font-weight="750">FUND III</text>
<text x="42" y="277" fill="#ffffff" font-size="25" font-weight="780">$25m committed</text>
<text x="42" y="301" fill="#c2cbd7" font-size="14">$21m paid ; LP capital: $33,345,270</text>
<text x="24" y="352" fill="#9ca9bb" font-size="13" font-weight="750">SUCCESSIVE STATES OF THE SAME INTERESTS</text>
<rect x="24" y="370" width="432" height="70" rx="9" fill="#142b31"></rect>
<text x="42" y="398" fill="#67c2c7" font-size="12" font-weight="750">JUNE 30, 2018 · PAID-IN CAPITAL</text>
<text x="42" y="425" fill="#ffffff" font-size="23" font-weight="780">$35.55m</text>
<rect x="24" y="452" width="432" height="70" rx="9" fill="#17243b"></rect>
<text x="42" y="480" fill="#c2cbd7" font-size="12" font-weight="750">JUNE 30, 2018 · LP CAPITAL</text>
<text x="42" y="507" fill="#ffffff" font-size="23" font-weight="780">$54.346m</text>
<rect x="24" y="534" width="432" height="70" rx="9" fill="#231f17"></rect>
<text x="42" y="562" fill="#f0c36a" font-size="12" font-weight="750">DEC. 31, 2018 · UNAUDITED ESTIMATE</text>
<text x="42" y="589" fill="#ffffff" font-size="23" font-weight="780">$90.44m</text>
<rect x="24" y="616" width="432" height="70" rx="9" fill="#321b22"></rect>
<text x="42" y="644" fill="#ffbdca" font-size="12" font-weight="750">MARCH 2026 · ORAL, UNREALIZED TESTIMONY</text>
<text x="42" y="671" fill="#ffffff" font-size="23" font-weight="780">≈ $172m</text>
<text x="240" y="724" text-anchor="middle" fill="#f0c36a" font-size="12" font-weight="700">DO NOT ADD THEM</text>
</svg>
