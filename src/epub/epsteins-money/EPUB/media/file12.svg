<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 590" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="victim-ledger-title-en victim-ledger-desc-en" style="width:100%;height:auto;display:block;background:#0b1120;border:1px solid #26324a;border-radius:16px;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,sans-serif">
<title id="victim-ledger-title-en">Three separate survivor compensation and settlement lines</title>
<desc id="victim-ledger-desc-en">The EVCP, settlements outside the EVCP and the 2026 class settlement appear as three lines. Bank settlements are excluded.</desc>
<style>.mobile{display:none}@media (max-width:640px){.desktop{display:none}.mobile{display:block}}</style>
<g class="desktop">
<rect width="760" height="590" rx="16" fill="#0b1120"></rect>
<text x="38" y="52" fill="#f7f9fc" font-size="26" font-weight="760">THREE MECHANISMS, THREE ACCOUNTS</text>
<text x="38" y="81" fill="#99a7bb" font-size="15">Estate-funded amounts stay separate from settlements funded by banks.</text>
<rect x="38" y="116" width="684" height="110" rx="13" fill="#16233a" stroke="#5278b8"></rect>
<rect x="38" y="116" width="12" height="110" rx="6" fill="#6e9bf5"></rect>
<text x="70" y="146" fill="#91b2f5" font-size="13" font-weight="760">EVCP · CLOSED PROGRAM</text>
<text x="70" y="187" fill="#ffffff" font-size="30" font-weight="790">$121,127,339.05</text>
<text x="402" y="166" fill="#b8c3d2" font-size="13">claims and other amounts</text>
<text x="402" y="190" fill="#b8c3d2" font-size="13">exact wording in accounting 17</text>
<rect x="38" y="248" width="684" height="110" rx="13" fill="#142d30" stroke="#3e9388"></rect>
<rect x="38" y="248" width="12" height="110" rx="6" fill="#65c6b5"></rect>
<text x="70" y="278" fill="#7dd2c3" font-size="13" font-weight="760">OUTSIDE EVCP · YEAR-END 2025</text>
<text x="70" y="319" fill="#ffffff" font-size="30" font-weight="790">$48,599,610.90</text>
<text x="402" y="298" fill="#abc9c5" font-size="13">reconstructed cumulative total</text>
<text x="402" y="322" fill="#abc9c5" font-size="13">from nine estate filings</text>
<rect x="38" y="380" width="684" height="126" rx="13" fill="#302817" stroke="#a97b27"></rect>
<rect x="38" y="380" width="12" height="126" rx="6" fill="#e9b956"></rect>
<text x="70" y="410" fill="#f0c36a" font-size="13" font-weight="760">WARD v. INDYKE · 2026</text>
<text x="70" y="451" fill="#ffffff" font-size="30" font-weight="790">$35,000,000</text>
<rect x="402" y="404" width="130" height="68" rx="9" fill="#19342f"></rect>
<text x="467" y="430" text-anchor="middle" fill="#78d1b6" font-size="12" font-weight="740">DEPOSITED</text>
<text x="467" y="456" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="760">$12.5M</text>
<rect x="548" y="404" width="148" height="68" rx="9" fill="#3b2520"></rect>
<text x="622" y="430" text-anchor="middle" fill="#f0b28b" font-size="12" font-weight="740">STILL PAYABLE</text>
<text x="622" y="456" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="760">$22.5M</text>
<text x="70" y="488" fill="#d7c8a7" font-size="12">final approval still pending on Aug. 7, 2026</text>
<rect x="38" y="528" width="684" height="35" rx="8" fill="#321d27" stroke="#a95268" stroke-dasharray="5 5"></rect>
<text x="380" y="551" text-anchor="middle" fill="#eea1b1" font-size="13" font-weight="730">JPMORGAN + DEUTSCHE BANK: OUTSIDE PAYERS, EXCLUDED</text>
</g>
<g class="mobile" transform="scale(2.17)">
<rect width="350" height="271" rx="16" fill="#0b1120"></rect>
<text x="20" y="27" fill="#f7f9fc" font-size="15" font-weight="760">THREE SEPARATE MECHANISMS</text>
<text x="20" y="46" fill="#99a7bb" font-size="11">Bank settlements are not estate outflows.</text>
<rect x="20" y="60" width="310" height="39" rx="8" fill="#16233a" stroke="#5278b8"></rect><text x="32" y="77" fill="#91b2f5" font-size="12" font-weight="740">EVCP · CLOSED PROGRAM</text><text x="32" y="94" fill="#ffffff" font-size="19" font-weight="780">$121.127M</text>
<rect x="20" y="106" width="310" height="39" rx="8" fill="#142d30" stroke="#3e9388"></rect><text x="32" y="123" fill="#7dd2c3" font-size="12" font-weight="740">OUTSIDE EVCP · YEAR-END 2025</text><text x="32" y="140" fill="#ffffff" font-size="19" font-weight="780">$48.600M</text>
<rect x="20" y="152" width="310" height="62" rx="8" fill="#302817" stroke="#a97b27"></rect><text x="32" y="170" fill="#f0c36a" font-size="12" font-weight="740">WARD v. INDYKE · 2026</text><text x="32" y="197" fill="#ffffff" font-size="20" font-weight="780">$35.0M</text><text x="184" y="188" fill="#78d1b6" font-size="11">DEPOSITED $12.5M</text><text x="184" y="205" fill="#f0b28b" font-size="11">PAYABLE $22.5M</text>
<text x="20" y="239" fill="#d7c8a7" font-size="11">Final approval remained pending on Aug. 7, 2026.</text>
<text x="20" y="260" fill="#eea1b1" font-size="11" font-weight="730">JPMORGAN AND DEUTSCHE BANK: EXCLUDED</text>
</g>
</svg>
