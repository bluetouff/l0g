<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="estate-time-title-en estate-time-desc-en" style="width:100%;height:auto;display:block;background:#0b1120;border:1px solid #26324a;border-radius:16px;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,sans-serif">
<title id="estate-time-title-en">Four accounting snapshots of the Epstein estate</title>
<desc id="estate-time-desc-en">A timeline shows 577.7 million dollars in 2019, 83.9 million at the end of 2023, 145.1 million in September 2024 after the tax refund and 107.6 million at the end of June 2026.</desc>
<style>.mobile{display:none}@media (max-width:640px){.desktop{display:none}.mobile{display:block}}</style>
<g class="desktop">
<rect width="760" height="540" rx="16" fill="#0b1120"></rect>
<text x="38" y="52" fill="#f7f9fc" font-size="26" font-weight="760">THE FORTUNE CHANGES FORM</text>
<text x="38" y="82" fill="#99a7bb" font-size="13">Four cut-off dates, four defined scopes. The line is not a return calculation.</text>
<line x1="86" y1="290" x2="676" y2="290" stroke="#34425c" stroke-width="4"></line>
<path d="M86 290 C172 290 202 382 282 382 S398 162 474 162 S584 250 676 250" fill="none" stroke="#5d8df4" stroke-width="5"></path>
<circle cx="86" cy="290" r="12" fill="#78a2ff" stroke="#dce7ff" stroke-width="3"></circle>
<circle cx="282" cy="382" r="12" fill="#6fc5b7" stroke="#dcfff8" stroke-width="3"></circle>
<circle cx="474" cy="162" r="12" fill="#efbe62" stroke="#fff1c8" stroke-width="3"></circle>
<circle cx="676" cy="250" r="12" fill="#e5879a" stroke="#ffe1e8" stroke-width="3"></circle>
<rect x="34" y="122" width="196" height="116" rx="12" fill="#16233a" stroke="#496cae"></rect>
<text x="52" y="151" fill="#8eb0ff" font-size="13" font-weight="750">AUG. 15, 2019</text>
<text x="52" y="190" fill="#ffffff" font-size="30" font-weight="780">$577.7M</text>
<text x="52" y="216" fill="#b8c3d2" font-size="14">provisional gross inventory</text>
<rect x="184" y="406" width="196" height="94" rx="12" fill="#142d30" stroke="#3e9489"></rect>
<text x="202" y="435" fill="#77d2c3" font-size="13" font-weight="750">DEC. 31, 2023</text>
<text x="202" y="472" fill="#ffffff" font-size="28" font-weight="780">$83.9M</text>
<text x="202" y="492" fill="#a8c8c4" font-size="13">after USVI and EVCP</text>
<rect x="388" y="104" width="186" height="116" rx="12" fill="#302817" stroke="#b98829"></rect>
<text x="406" y="133" fill="#f2c66c" font-size="13" font-weight="750">SEPT. 30, 2024</text>
<text x="406" y="172" fill="#ffffff" font-size="29" font-weight="780">$145.1M</text>
<text x="406" y="198" fill="#d9c79d" font-size="13">after the tax rebound</text>
<rect x="548" y="300" width="178" height="116" rx="12" fill="#321d27" stroke="#b85870"></rect>
<text x="566" y="329" fill="#f0a0b1" font-size="13" font-weight="750">JUNE 30, 2026</text>
<text x="566" y="368" fill="#ffffff" font-size="29" font-weight="780">$107.6M</text>
<text x="566" y="394" fill="#d8b2bc" font-size="13">reported gross assets</text>
<rect x="38" y="462" width="122" height="40" rx="9" fill="#251d13" stroke="#8b6a2d"></rect>
<text x="99" y="487" text-anchor="middle" fill="#f0c36a" font-size="13" font-weight="720">DATED STOCKS</text>
<text x="398" y="516" text-anchor="middle" fill="#76859a" font-size="12">Sources: probate petition and quarterly accountings 17, 20 and 27.</text>
</g>
<g class="mobile" transform="scale(2.17)">
<rect width="350" height="248" rx="16" fill="#0b1120"></rect>
<text x="20" y="27" fill="#f7f9fc" font-size="15" font-weight="760">FOUR SNAPSHOTS, NOT A RETURN</text>
<text x="20" y="46" fill="#99a7bb" font-size="11">Each figure is a dated stock, not an investment return.</text>
<line x1="30" y1="66" x2="30" y2="207" stroke="#34425c" stroke-width="3"></line>
<circle cx="30" cy="72" r="7" fill="#78a2ff"></circle><text x="49" y="76" fill="#8eb0ff" font-size="12" font-weight="740">AUG. 15, 2019</text><text x="330" y="77" text-anchor="end" fill="#ffffff" font-size="21" font-weight="780">$577.7M</text>
<circle cx="30" cy="111" r="7" fill="#6fc5b7"></circle><text x="49" y="115" fill="#77d2c3" font-size="12" font-weight="740">DEC. 31, 2023</text><text x="330" y="116" text-anchor="end" fill="#ffffff" font-size="21" font-weight="780">$83.9M</text>
<circle cx="30" cy="150" r="7" fill="#efbe62"></circle><text x="49" y="154" fill="#f2c66c" font-size="12" font-weight="740">SEPT. 30, 2024</text><text x="330" y="155" text-anchor="end" fill="#ffffff" font-size="21" font-weight="780">$145.1M</text>
<circle cx="30" cy="189" r="7" fill="#e5879a"></circle><text x="49" y="193" fill="#f0a0b1" font-size="12" font-weight="740">JUNE 30, 2026</text><text x="330" y="194" text-anchor="end" fill="#ffffff" font-size="21" font-weight="780">$107.6M</text>
<text x="20" y="229" fill="#f0c36a" font-size="11" font-weight="720">REPORTED STOCKS</text>
<text x="20" y="244" fill="#76859a" font-size="10">Probate petition and accountings 17, 20 and 27.</text>
</g>
</svg>
