<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 480 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="black-title-en black-desc-en" style="display:block;width:100%;height:auto;max-width:720px;margin:0 auto;background:#0c0d10;border:1px solid rgba(255,255,255,0.10);border-radius:12px;font-family:ui-monospace,monospace">
<title id="black-title-en">Reconciliation of totals attributed to Leon Black</title>
<desc id="black-desc-en">Four vertical cards distinguish Dechert fees, the Senate bank-wire table, the Senate narrative and the wider table. The 2017 loans are separated as receivables.</desc>
<text x="24" y="40" fill="#f5f6f8" font-size="19" font-weight="700">BLACK TO EPSTEIN</text>
<text x="24" y="64" fill="#f5f6f8" font-size="19" font-weight="700">SCOPE CHANGES THE TOTAL</text>
<text x="24" y="92" fill="#a8adb7" font-size="11">Fees, wires and loans are different accounting categories.</text>
<rect x="24" y="120" width="432" height="90" rx="10" fill="#151820" stroke="#5eead4" stroke-opacity="0.7"></rect>
<text x="46" y="148" fill="#5eead4" font-size="13" font-weight="700">DECHERT FEES</text>
<text x="46" y="180" fill="#f5f6f8" font-size="26" font-weight="700">$158m</text>
<text x="46" y="202" fill="#d6d9df" font-size="13">2013-2017 · 50 + 70 + 30 + 0 + 8</text>
<path d="M240 214 V228" stroke="#8b909b" stroke-width="2"></path>
<path d="M235 223 L240 230 L245 223" fill="none" stroke="#8b909b" stroke-width="2"></path>
<rect x="24" y="236" width="432" height="90" rx="10" fill="#151820" stroke="#7aa2f7" stroke-opacity="0.7"></rect>
<text x="46" y="264" fill="#7aa2f7" font-size="13" font-weight="700">BANK-WIRE TABLE</text>
<text x="46" y="296" fill="#f5f6f8" font-size="26" font-weight="700">$164.3m</text>
<text x="46" y="318" fill="#d6d9df" font-size="13">2013-2017 · $158m + $6.3m in 2016</text>
<path d="M240 330 V344" stroke="#8b909b" stroke-width="2"></path>
<path d="M235 339 L240 346 L245 339" fill="none" stroke="#8b909b" stroke-width="2"></path>
<rect x="24" y="352" width="432" height="90" rx="10" fill="#151820" stroke="#f5b13d" stroke-opacity="0.7"></rect>
<text x="46" y="380" fill="#f5b13d" font-size="13" font-weight="700">SENATE NARRATIVE</text>
<text x="46" y="412" fill="#f5f6f8" font-size="26" font-weight="700">≈ $166m</text>
<text x="46" y="434" fill="#d6d9df" font-size="13">2013-2017 · unreconciled internal gap: $1.7m</text>
<path d="M240 446 V460" stroke="#8b909b" stroke-width="2"></path>
<path d="M235 455 L240 462 L245 455" fill="none" stroke="#8b909b" stroke-width="2"></path>
<rect x="24" y="468" width="432" height="90" rx="10" fill="#151820" stroke="#ff4d87" stroke-opacity="0.7"></rect>
<text x="46" y="496" fill="#ff4d87" font-size="13" font-weight="700">WIDER TABLE</text>
<text x="46" y="528" fill="#f5f6f8" font-size="26" font-weight="700">$169.8m</text>
<text x="46" y="550" fill="#d6d9df" font-size="13">2012-2017 · $164.3m + $5.5m</text>
<rect x="24" y="598" width="432" height="138" rx="10" fill="#11141a" stroke="#313641"></rect>
<text x="46" y="628" fill="#f58b57" font-size="13" font-weight="700">SEPARATE: THE 2017 LOANS</text>
<text x="46" y="658" fill="#f5f6f8" font-size="16" font-weight="700">$30.5m advanced · $10m repaid</text>
<text x="46" y="684" fill="#d6d9df" font-size="14">$20.5m still owed when Epstein died.</text>
<text x="46" y="712" fill="#a8adb7" font-size="12">Balance-sheet receivables, not fees to add.</text>
</svg>
