<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" role="img" aria-labelledby="reserves02-fr-1-wide-title reserves02-fr-1-wide-desc" lang="fr"><title id="reserves02-fr-1-wide-title">Qui tient quelle clé ?</title><desc id="reserves02-fr-1-wide-desc">Circuit décrit lors de l’audition du 8 avril 2026 : demande du distributeur, validation DGEC, mise à disposition par la SAGESS et enlèvement au dépôt. Les prêteurs financent la dette ; les opérateurs paient la couverture des coûts via le CPSSP. Aucun délai ni volume représenté.</desc><rect x="0" y="0" width="960" height="650" fill="#0c0d10" rx="12"></rect><rect x="0" y="0" width="960" height="4" fill="#5eead4"></rect><text x="28" y="32" fill="#5eead4" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start">l0g / RÉSERVES / 02.1</text><text x="28" y="74" fill="#e7e9ee" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" text-anchor="start">Qui tient quelle clé ?</text><text x="28" y="110" fill="#8b909b" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Les droits, le produit et les deux circuits de l’argent.</text><rect x="28" y="155" width="336" height="106" fill="#121419" rx="9" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.2" data-card="actor"></rect><rect x="28" y="155" width="4" height="106" fill="#7aa2f7"></rect><g transform="translate(46 177) scale(0.84)" data-icon="state"><path d="M2 12 L22 2 L42 12 H2 M2 48 H42 M9 18 V40 M22 18 V40 M35 18 V40" fill="none" stroke="#7aa2f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><text x="104" y="190" fill="#7aa2f7" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">DGEC / État</text><text x="104" y="222" fill="#e7e9ee" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Autorise la mobilisation</text><rect x="596" y="155" width="336" height="106" fill="#121419" rx="9" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.2" data-card="actor"></rect><rect x="596" y="155" width="4" height="106" fill="#5eead4"></rect><g transform="translate(614 177) scale(0.84)" data-icon="document"><path d="M5 2 H28 L40 14 V48 H5 Z M28 2 V14 H40 M13 24 H32 M13 32 H32 M13 40 H27" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><text x="672" y="190" fill="#5eead4" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">SAGESS</text><text x="672" y="222" fill="#e7e9ee" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Possède le produit</text><text x="672" y="247" fill="#e7e9ee" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Organise sa disponibilité</text><rect x="28" y="340" width="336" height="106" fill="#121419" rx="9" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.2" data-card="actor"></rect><rect x="28" y="340" width="4" height="106" fill="#ff4d87"></rect><g transform="translate(46 362) scale(0.84)" data-icon="truck"><path d="M2 9 H29 V34 H2 Z M29 18 H39 L48 27 V34 H29" fill="none" stroke="#ff4d87" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="11" cy="37" r="5" fill="#121419" stroke="#ff4d87" stroke-width="2"></circle><circle cx="38" cy="37" r="5" fill="#121419" stroke="#ff4d87" stroke-width="2"></circle></g><text x="104" y="375" fill="#ff4d87" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">Distributeur</text><text x="104" y="407" fill="#e7e9ee" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Demande puis enlève</text><text x="104" y="432" fill="#e7e9ee" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">le produit autorisé</text><rect x="596" y="34