<title id="reserves06-fr-1-panel1-dark-title">Décision et attentes</title><desc id="reserves06-fr-1-panel1-dark-desc">Schéma qualitatif : l’annonce fixe volume, produit et calendrier. Le signal de prix agit sur les attentes d’offre et le choix de conserver des stocks ; le connecteur ambre se poursuit vers le prix de gros au troisième volet. Aucun volume ni délai mesuré.</desc>
