  <text x="240" y="164" font-size="24" fill="#e7e9ee" font-weight="400" text-anchor="start">tonnes physiques</text>
  <text x="152" y="198" font-size="22" fill="#5eead4" font-weight="600" text-anchor="start">Propriétaire du produit : A</text>
  <text x="718" y="164" font-size="30" fill="#e7e9ee" font-weight="700" text-anchor="middle">70 + 30 = 100</text>
  <text x="718" y="198" font-size="20" fill="#8b909b" font-weight="400" text-anchor="middle">Le stock physique reste le même</text>
