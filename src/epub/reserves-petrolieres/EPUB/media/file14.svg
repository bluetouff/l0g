<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" role="img" aria-labelledby="reserves02-fr-4-wide-title reserves02-fr-4-wide-desc" lang="fr" font-family="Arial, Helvetica, sans-serif">
  <title id="reserves02-fr-4-wide-title">Un stock, deux couvertures</title>
  <desc id="reserves02-fr-4-wide-desc">Exemple fictif, avant l’achat par B. Un seul stock physique de 100 tonnes appartient à A. Chaque case représente une tonne : 70 cases turquoise couvrent l’obligation de A et 30 cases ambre sont réservées à B. B rémunère A pour la réservation ; A maintient l’accès contractuel de B aux 30 tonnes. Le droit d’achat ne crée pas de stock supplémentaire : 70 plus 30 égale 100 tonnes.</desc>
  <rect x="0" y="0" width="960" height="650" rx="16" fill="#0c0d10"></rect>
  <text x="28" y="46" font-size="30" fill="#e7e9ee" font-weight="700" text-anchor="start">Un stock, deux couvertures</text>
  <text x="28" y="78" font-size="20" fill="#8b909b" font-weight="400" text-anchor="start">Exemple fictif · 100 tonnes appartenant à A, avant achat par B</text>
  <rect x="28" y="104" width="904" height="300" rx="12" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.5"></rect>
