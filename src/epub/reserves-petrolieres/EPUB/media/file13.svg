<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 620" role="img" aria-labelledby="reserves02-fr-3-mobile-title reserves02-fr-3-mobile-desc" lang="fr" font-family="Arial, Helvetica, sans-serif">
<title id="reserves02-fr-3-mobile-title">SAGESS : dette et échéances</title>
<desc id="reserves02-fr-3-mobile-desc">Au 31 décembre 2025, dette externe nominale de 4 145 millions d’euros, hors prêt CPSSP et intérêts dus : 3 600 millions d’obligations et 545 millions de NEU CP à court terme. Principal obligataire à rembourser : 500 millions en 2027, 600 en 2028, 500 par an de 2029 à 2031 et 1 000 en 2032. Histogramme sur une échelle linéaire partant de zéro. Ligne bancaire de 1 000 millions non tirée, séparée de la dette empruntée. L’émission de février 2026 est exclue de cet arrêté historique.</desc>
