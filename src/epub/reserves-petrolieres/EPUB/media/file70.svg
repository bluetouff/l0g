<title id="reserves06-fr-3-wide-title">La baisse et la hausse passent par plusieurs semaines</title><desc id="reserves06-fr-3-wide-desc">Trois repères de l’étude Banque de France publiée en 2021 : +1 % du coût du gazole raffiné donne +0,45 % du prix HTT à une semaine, +0,72 % à 14 jours ouvrés, +0,75 % à terme. Pas de nouvelle estimation 2026.</desc>
