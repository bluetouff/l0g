<title id="reserves06-fr-1-wide-title">Deux chemins vers le prix</title><desc id="reserves06-fr-1-wide-desc">Schéma qualitatif : anticipations et flux physiques convergent vers le prix de gros, puis le détail. Aucun volume ni délai mesuré.</desc>
