<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 516" role="img" aria-labelledby="reserves05-fr-1-panel1-dark-title reserves05-fr-1-panel1-dark-desc" data-figure="1" data-diagram="release-contracts" data-as-of="2026-10-03" data-scale="qualitative" data-observed-flows="unavailable" width="400" height="516" data-crop-start="0" data-crop-end="516" data-panel="1">
<title id="reserves05-fr-1-panel1-dark-title">Vente SPR : pétrole et paiement</title><desc id="reserves05-fr-1-panel1-dark-desc">Schéma qualitatif de vente SPR : la réserve publique livre du pétrole à l’acheteur, qui paie selon le contrat. Aucun volume représenté.</desc><metadata>{"edition": "2026-10-03", "sources": [{"id": "S03", "publisher": "US Department of Energy", "title": "SPR Sales and Exchanges", "url": "https://www.energy.gov/hgeo/opr/spr-sales-and-exchanges", "reference_period": "Présentation générale, consultée le 3 octobre 2026"}, {"id": "S04", "publisher": "SAGESS", "title": "Fournir", "url": "https://www.sagess.fr/fr/logistique/constituer-des-stocks-prives-pour-parer-aux-penuries/fournir", "reference_period": "Procédure générale publiée par l’opérateur ; consultation du 3 octobre 2026"}, {"id": "S05", "publisher": "International Energy Agency", "title": "France Oil Security Policy", "url": "https://www.iea.org/articles/france-oil-security-policy", "reference_period": "Évaluation institutionnelle publiée en juin 2022"}, {"id": "S22", "publisher": "Ministère français chargé de l’énergie", "title": "La chaîne pétrolière", "url": "https://www.ecologie.gouv.fr/politiques-publiques/chaine-petroliere", "reference_period": "Description institutionnelle ; données de dates hétérogènes"}], "convention": "Schéma qualitatif : vente américaine contre paiement ; échange américain contre restitution et prime ; mise à disposition SAGESS avec retour en bac. Flèches sans proportion. Aucun tarif français supposé."}</metadata>
