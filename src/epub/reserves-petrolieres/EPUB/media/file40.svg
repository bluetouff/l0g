<title id="reserves04-fr-2-panel2-dark-title">Golfe, Rocheuses, Côte Ouest et échelle</title><desc id="reserves04-fr-2-panel2-dark-desc">Même échelle de volumes : Golfe 95,9 %, Rocheuses 97,3 %, Côte Ouest 93,4 %. Entrées brutes et capacité opérable, sans estimation de diesel supplémentaire. Taux EIA publiés le 30 septembre 2026, arrondis indépendants.</desc><metadata>{"edition": "2026-10-03", "sources": [{"id": "S12", "publisher": "U.S. Energy Information Administration", "title": "Glossary: barrels per calendar day / barrels per stream day", "url": "https://www.eia.gov/tools/glossary/index.php?id=B", "reference_period": "Définitions consultées le 3 octobre 2026."}, {"id": "S13", "publisher": "U.S. Energy Information Administration", "title": "Glossary: operable capacity and utilization", "url": "https://www.eia.gov/tools/glossary/index.php?id=O", "reference_period": "Définitions consultées le 3 octobre 2026."}, {"id": "S14", "publisher": "U.S. Energy Information Administration", "title": "Weekly Petroleum Status Report, Table 2", "url": "https://www.eia.gov/petroleum/supply/weekly/archive/2026/2026_09_30/pdf/table2.pdf", "reference_period": "Semaine terminée le 25 septembre 2026 ; États-Unis et cinq PADD."}], "convention": "États-Unis, semaine au 25 septembre 2026. Entrées brutes en distillation et capacité opérable, en millions de barils par jour. Taux publiés EIA, arrondis indépendants. L’écart ne chiffre pas une production additionnelle de diesel."}</metadata>
