<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 620" role="img" aria-labelledby="reserves02-fr-4-mobile-title reserves02-fr-4-mobile-desc" lang="fr" font-family="Arial, Helvetica, sans-serif">
  <title id="reserves02-fr-4-mobile-title">Un stock, deux couvertures</title>
  <desc id="reserves02-fr-4-mobile-desc">Exemple fictif, avant l’achat par B. Un seul stock physique de 100 tonnes appartient à A. Chaque case représente une tonne : 70 cases turquoise couvrent l’obligation de A et 30 cases ambre sont réservées à B. B rémunère A pour la réservation ; A maintient l’accès contractuel de B aux 30 tonnes. Le droit d’achat ne crée pas de stock supplémentaire : 70 plus 30 égale 100 tonnes.</desc>
