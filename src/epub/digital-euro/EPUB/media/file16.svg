<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 480 1010" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t2e d2e" style="font-family:system-ui,sans-serif;background:#0a111a">
<title id="t2e">One hundred euros, three payment chains</title>
<desc id="d2e">Comparison between an international card, a four-corner digital euro model and a model with a separate funding bank.</desc>
<defs><linearGradient id="g2e" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a111a"></stop><stop offset="1" stop-color="#15283e"></stop></linearGradient><marker id="arr2e" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#68d9c8"></path></marker></defs>
<rect x="1" y="1" width="478" height="1008" rx="15" fill="url(#g2e)" stroke="#304459"></rect>
<text x="24" y="40" fill="#f4f7fb" font-size="21" font-weight="800">€100: WHO RECEIVES WHAT?</text>
<text x="24" y="66" fill="#9fb1c5" font-size="12">ILLUSTRATIVE ASSUMPTIONS</text>
<g transform="translate(20 92)"><rect width="440" height="240" rx="13" fill="#172337" stroke="#8facff"></rect><text x="20" y="30" fill="#a7c0ff" font-size="12" font-weight="800">INTERNATIONAL CARD, ILLUSTRATIVE AVERAGE</text><text x="20" y="63" fill="#fff" font-size="24" font-weight="850">Merchant: around €0.50</text><path d="M220 92H390" stroke="#68d9c8" stroke-width="3" marker-end="url(#arr2e)"></path><text x="20" y="98" fill="#dce7ef" font-size="13">MSC</text><text x="20" y="126" fill="#dce7ef" font-size="13">Interchange + scheme + processing</text><text x="20" y="150" fill="#dce7ef" font-size="13">+ acquirer margin + risk + service</text><rect x="20" y="172" width="400" height="46" rx="9" fill="#101923" stroke="#3b5269"></rect><text x="34" y="191" fill="#ffbd78" font-size="11.5" font-weight="750">INCOMPLETE DATA</text><text x="34" y="208" fill="#cad6df" font-size="11.5">Contracts and NDAs prevent a full public breakdown.</text></g>
<g transform="translate(20 354)"><rect width="440" height="262" rx="13" fill="#152c31" stroke="#68d9c8"></rect><text x="20" y="30" fill="#8ce8db" font-size="12" font-weight="800">DIGITAL EURO, FOUR-CORNER MODEL</text><text x="20" y="60" fill="#fff" font-size="15" font-weight="750">Merchant</text><path d="M91 56H170" stroke="#68d9c8" stroke-width="3" marker-end="url(#arr2e)"></path><text x="184" y="60" fill="#fff" font-size="15" font-weight="750">Acquiring PSP</text><path d="M290 56H370" stroke="#68d9c8" stroke-width="3" marker-end="url(#arr2e)"></path><text x="20" y="103" fill="#dceae7" font-size="13">Final MSC: unknown and capped</text><text x="20" y="131" fill="#dceae7" font-size="13">Illustrative inter-PSP: around €0.18</text><text x="20" y="159" fill="#dceae7" font-size="13">Eurosystem scheme fee: €0</text><text x="20" y="187" fill="#dceae7" font-size="13">Eurosystem settlement fee: €0</text><rect x="20" y="207" width="400" height="34" rx="8" fill="#0e1b1e" stroke="#68d9c8"></rect><text x="34" y="229" fill="#b8f0e7" font-size="11.5">The €0.18 covers only the inter-PSP transfer.</text></g>
<g transform="translate(20 638)"><rect width="440" height="300" rx="13" fill="#30251a" stroke="#ffbd78"></rect><text x="20" y="30" fill="#ffd09d" font-size="12" font-weight="800">DIGITAL EURO, SIX-CORNER MODEL</text><text x="20" y="62" fill="#fff" font-size="15" font-weight="750">Linked bank account</text><path d="M157 58H220" stroke="#ffbd78" stroke-width="3" marker-end="url(#arr2e)"></path><text x="234" y="62" fill="#fff" font-size="15" font-weight="750">Wallet PSP</text><text x="20" y="100" fill="#f4e8d8" font-size="13">The funding bank authenticates and supplies liquidity.</text><text x="20" y="128" fill="#f4e8d8" font-size="13">The wallet PSP manages the digital euro account.</text><text x="20" y="156" fill="#f4e8d8" font-size="13">The acquiring PSP serves the merchant.</text><rect x="20" y="181" width="400" height="78" rx="10" fill="#21170f" stroke="#ff8498"></rect><text x="34" y="204" fill="#ffa6b5" font-size="12" font-weight="800">BLIND SPOT</text><text x="34" y="226" fill="#f4e8d8" font-size="12">Who pays the third-party funding bank?</text><text x="34" y="247" fill="#f4e8d8" font-size="12">The final compromise has not answered yet.</text><text x="20" y="285" fill="#c9ab89" font-size="11">The model must align operational liability with revenue.</text></g>
<text x="24" y="980" fill="#75899d" font-size="10.5">Sources: ECB compensation model, Parliament, ECA. l0g synthesis.</text>
</svg>
