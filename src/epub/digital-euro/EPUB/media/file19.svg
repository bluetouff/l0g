<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 480 1120" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="a6-contracts-en-t a6-contracts-en-d" style="font-family:system-ui,sans-serif;background:#0a111a"><title id="a6-contracts-en-t">Five components and ten framework agreements</title><desc id="a6-contracts-en-d">For each component, the ECB ranked one first provider and one second provider. Estimated values and ceilings are not expenditure.</desc><defs><linearGradient id="a6-contracts-en-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a111a"></stop><stop offset="1" stop-color="#14263a"></stop></linearGradient></defs><rect x="1" y="1" width="478" height="1118" rx="15" fill="url(#a6-contracts-en-bg)" stroke="#304459"></rect><text x="24" y="39" fill="#f4f7fb" font-size="20" font-weight="800">5 COMPONENTS, 10 AGREEMENTS</text><text x="24" y="65" fill="#9fb1c5" font-size="12">First ranked, second if required</text><g transform="translate(20 92)"><rect width="440" height="166" rx="12" fill="#172337" stroke="#8facff"></rect><text x="18" y="27" fill="#a7c0ff" font-size="12" font-weight="800">ALIAS LOOKUP · 10 YEARS MAX.</text><text x="18" y="56" fill="#fff" font-size="14" font-weight="800">1. Sapient + Tremend</text><text x="18" y="82" fill="#dce7ef" font-size="13">2. equensWorldline</text><text x="18" y="113" fill="#8ce8db" font-size="14" font-weight="850">€27.9m estimated</text><text x="230" y="113" fill="#ffbd78" font-size="14" font-weight="850">€55.8m ceiling</text><text x="18" y="144" fill="#8598aa" font-size="11">9 tenders · quality 60% · price 40%</text></g><g transform="translate(20 274)"><rect width="440" height="166" rx="12" fill="#251d33" stroke="#dda0ff"></rect><text x="18" y="27" fill="#e8b7ff" font-size="12" font-weight="800">RISK AND FRAUD · 15 YEARS MAX.</text><text x="18" y="56" fill="#fff" font-size="14" font-weight="800">1. Feedzai</text><text x="18" y="82" fill="#eee6f2" font-size="13">2. Capgemini Deutschland</text><text x="18" y="113" fill="#8ce8db" font-size="14" font-weight="850">€79.1m estimated</text><text x="230" y="113" fill="#ffbd78" font-size="14" font-weight="850">€237.3m ceiling</text><text x="18" y="144" fill="#9e8ea9" font-size="11">8 tenders · quality 70% · price 30%</text></g><g transform="translate(20 456)"><rect width="440" height="166" rx="12" fill="#13253a" stroke="#68d9c8"></rect><text x="18" y="27" fill="#8ce8db" font-size="12" font-weight="800">APP AND SDK · 10 YEARS MAX.</text><text x="18" y="56" fill="#fff" font-size="14" font-weight="800">1. Almaviva + Fabrick</text><text x="18" y="82" fill="#dceae7" font-size="13">2. Sapient + Tremend</text><text x="18" y="113" fill="#8ce8db" font-size="14" font-weight="850">€76.8m estimated</text><text x="230" y="113" fill="#ffbd78" font-size="14" font-weight="850">€153.6m ceiling</text><text x="18" y="144" fill="#859e9a" font-size="11">10 tenders · quality 60% · price 40%</text></g><g transform="translate(20 638)"><rect width="440" height="166" rx="12" fill="#30251a" stroke="#ffbd78"></rect><text x="18" y="27" fill="#ffd09d" font-size="12" font-weight="800">OFFLINE SOLUTION · 15 YEARS MAX.</text><text x="18" y="56" fill="#fff" font-size="14" font-weight="800">1. G+D advance52 + Currency Technology</text><text x="18" y="82" fill="#f4e8d8" font-size="13">2. equensWorldline</text><text x="18" y="113" fill="#8ce8db" font-size="14" font-weight="850">€220.7m estimated</text><text x="230" y="113" fill="#ffbd78" font-size="14" font-weight="850">€662.1m ceiling</text><text x="18" y="144" fill="#b59a79" font-size="11">4 tenders · quality 70% · price 30%</text></g><g transform="translate(20 820)"><rect width="440" height="166" rx="12" fill="#321d22" stroke="#ff8498"></rect><text x="18" y="27" fill="#ffa6b5" font-size="12" font-weight="800">SEPI · 10 YEARS MAX.</text><text x="18" y="56" fill="#fff" font-size="14" font-weight="800">1. Senacor FCS</text><text x="18" y="82" fill="#f2e2e5" font-size="13">2. equensWorldline</text><text x="18" y="113" fill="#8ce8db" font-size="14" font-weight="850">€27.6m estimated</text><text x="230" y="113" fill="#ffbd78" font-size="14" font-weight="850">€55.2m ceiling</text><text x="18" y="144" fill="#ac858e" font-size="11">4 tenders · quality 60% · price 40%</text></g><rect x="20" y="1006" width="440" height="76" rx="10" fill="#0f1822" stroke="#68d9c8"></rect><text x="38" y="1031" fill="#8ce8db" font-size="12" font-weight="800">KEY DISTINCTION</text><text x="38" y="1054" fill="#edf3f8" font-size="12.5">The second provider opens a contractual option.</text><text x="38" y="1074" fill="#edf3f8" font-size="12.5">Operational failover requires a separate test.</text><text x="24" y="1108" fill="#75899d" font-size="10">Sources: ECB award notices, October 2025. l0g synthesis.</text></svg>
