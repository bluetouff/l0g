<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 480 1030" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="a6-arch-en-t a6-arch-en-d" style="font-family:system-ui,sans-serif;background:#0a111a"><title id="a6-arch-en-t">The digital euro machine in four layers</title><desc id="a6-arch-en-d">The monetary core is public, specialist services combine public and private control, PSPs distribute the money, and devices and networks create external dependencies.</desc><defs><linearGradient id="a6-arch-en-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a111a"></stop><stop offset="1" stop-color="#14263a"></stop></linearGradient><marker id="a6-arch-en-arr" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#68d9c8"></path></marker></defs><rect x="1" y="1" width="478" height="1028" rx="15" fill="url(#a6-arch-en-bg)" stroke="#304459"></rect><text x="24" y="39" fill="#f4f7fb" font-size="20" font-weight="800">THE MACHINE IN FOUR LAYERS</text><text x="24" y="65" fill="#9fb1c5" font-size="12">Sovereignty changes with the layer being examined</text><g transform="translate(20 94)"><rect width="440" height="170" rx="13" fill="#132b2c" stroke="#68d9c8" stroke-width="1.4"></rect><text x="20" y="29" fill="#8ce8db" font-size="12" font-weight="800">1. MONEY AND LEDGER</text><text x="20" y="61" fill="#fff" font-size="18" font-weight="850">Six national central banks</text><text x="20" y="91" fill="#dceae7" font-size="13">Issuance, holdings, final settlement and limits.</text><text x="20" y="116" fill="#dceae7" font-size="13">The monetary liability remains in the Eurosystem.</text><rect x="290" y="117" width="126" height="31" rx="999" fill="#0e1d1f" stroke="#68d9c8"></rect><text x="353" y="137" text-anchor="middle" fill="#a7f0e5" font-size="11" font-weight="800">PUBLIC CONTROL</text></g><path d="M240 270V306" stroke="#68d9c8" stroke-width="3" marker-end="url(#a6-arch-en-arr)"></path><g transform="translate(20 322)"><rect width="440" height="186" rx="13" fill="#172337" stroke="#8facff" stroke-width="1.4"></rect><text x="20" y="29" fill="#a7c0ff" font-size="12" font-weight="800">2. DESP SERVICES</text><text x="20" y="61" fill="#fff" font-size="18" font-weight="850">Public core + five private components</text><text x="20" y="92" fill="#dce7ef" font-size="13">Aliases, fraud, app, offline and SEPI.</text><text x="20" y="117" fill="#dce7ef" font-size="13">ECB governance, contractual development and operation.</text><rect x="20" y="138" width="178" height="30" rx="999" fill="#101923" stroke="#8facff"></rect><text x="109" y="158" text-anchor="middle" fill="#c4d3ff" font-size="11" font-weight="800">PUBLIC + EU PRIVATE</text></g><path d="M240 514V550" stroke="#68d9c8" stroke-width="3" marker-end="url(#a6-arch-en-arr)"></path><g transform="translate(20 566)"><rect width="440" height="170" rx="13" fill="#30251a" stroke="#ffbd78" stroke-width="1.4"></rect><text x="20" y="29" fill="#ffd09d" font-size="12" font-weight="800">3. DISTRIBUTION</text><text x="20" y="61" fill="#fff" font-size="18" font-weight="850">Banks and other PSPs</text><text x="20" y="91" fill="#f4e8d8" font-size="13">KYC, accounts, interfaces, support, disputes and funding.</text><text x="20" y="116" fill="#f4e8d8" font-size="13">The customer relationship stays private and regulated.</text><rect x="265" y="119" width="151" height="29" rx="999" fill="#21170f" stroke="#ffbd78"></rect><text x="340" y="138" text-anchor="middle" fill="#ffe0b7" font-size="11" font-weight="800">REGULATED PRIVATE</text></g><path d="M240 742V778" stroke="#ffbd78" stroke-width="3" marker-end="url(#a6-arch-en-arr)"></path><g transform="translate(20 794)"><rect width="440" height="170" rx="13" fill="#321d22" stroke="#ff8498" stroke-width="1.4"></rect><text x="20" y="29" fill="#ffa6b5" font-size="12" font-weight="800">4. DEVICES AND NETWORKS</text><text x="20" y="61" fill="#fff" font-size="18" font-weight="850">OS, stores, secure elements and NSPs</text><text x="20" y="91" fill="#f2e2e5" font-size="13">Apple, Google, OEMs, HSMs, TSMs, telecoms and data centres.</text><text x="20" y="116" fill="#f2e2e5" font-size="13">EU law constrains these dependencies without removing them.</text><rect x="258" y="119" width="158" height="29" rx="999" fill="#211116" stroke="#ff8498"></rect><text x="337" y="138" text-anchor="middle" fill="#ffc3cd" font-size="11" font-weight="800">MIXED DEPENDENCIES</text></g><rect x="20" y="982" width="440" height="28" rx="8" fill="#0f1822" stroke="#68d9c8"></rect><text x="240" y="1001" text-anchor="middle" fill="#dfeaf0" font-size="11.5">Final test: who can take over each layer without external permission?</text><text x="24" y="1022" fill="#75899d" font-size="10">Sources: ECB, procurements, Council mandate. l0g synthesis.</text></svg>
