<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 480 990" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t1e d1e" style="font-family:system-ui,sans-serif;background:#0a111a">
<title id="t1e">One bill, five perimeters</title>
<desc id="d1e">Published costs cover the Eurosystem, banks, other PSPs, merchants and the collective cost. No total cost of ownership has been published.</desc>
<defs><linearGradient id="g1e" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a111a"></stop><stop offset="1" stop-color="#14263a"></stop></linearGradient></defs>
<rect x="1" y="1" width="478" height="988" rx="15" fill="url(#g1e)" stroke="#304459"></rect>
<text x="24" y="40" fill="#f4f7fb" font-size="21" font-weight="800">ONE BILL, FIVE PERIMETERS</text>
<text x="24" y="66" fill="#9fb1c5" font-size="12">Published subtotals do not form a consolidated total</text>
<g transform="translate(20 94)"><rect width="440" height="142" rx="12" fill="#13253a" stroke="#68d9c8"></rect><text x="20" y="30" fill="#8ce8db" font-size="12" font-weight="800">1. EUROSYSTEM</text><text x="20" y="61" fill="#fff" font-size="22" font-weight="850">€1.3bn + €320m/year</text><text x="20" y="88" fill="#dbe7ee" font-size="13">Central development followed by operations.</text><text x="20" y="111" fill="#dbe7ee" font-size="13">Monetary income funds a zero scheme fee.</text><text x="20" y="132" fill="#91a5b8" font-size="11">ECB estimate, final design still conditional.</text></g>
<g transform="translate(20 254)"><rect width="440" height="162" rx="12" fill="#172337" stroke="#8facff"></rect><text x="20" y="30" fill="#a7c0ff" font-size="12" font-weight="800">2. BANKS</text><text x="20" y="61" fill="#fff" font-size="21" font-weight="850">ECB: €4bn to €5.77bn</text><text x="20" y="89" fill="#fff" font-size="21" font-weight="850">PwC: €18bn</text><text x="20" y="116" fill="#dbe7ee" font-size="13">Different entities, synergies, functions and horizons.</text><text x="20" y="139" fill="#ffbd78" font-size="12" font-weight="750">Alternative estimates with different scopes.</text></g>
<g transform="translate(20 434)"><rect width="440" height="130" rx="12" fill="#251d33" stroke="#dda0ff"></rect><text x="20" y="30" fill="#e8b7ff" font-size="12" font-weight="800">3. NON-BANK PSPS</text><text x="20" y="62" fill="#fff" font-size="22" font-weight="850">UNKNOWN</text><text x="20" y="88" fill="#eee6f2" font-size="13">App, KYC, fraud, support, disputes and funding.</text><text x="20" y="111" fill="#c8b9d0" font-size="11">No public consolidated estimate.</text></g>
<g transform="translate(20 582)"><rect width="440" height="142" rx="12" fill="#30251a" stroke="#ffbd78"></rect><text x="20" y="30" fill="#ffd09d" font-size="12" font-weight="800">4. MERCHANTS</text><text x="20" y="62" fill="#fff" font-size="22" font-weight="850">INTEGRATION + MSC</text><text x="20" y="88" fill="#f4e8d8" font-size="13">POS, e-commerce, certification and support.</text><text x="20" y="111" fill="#f4e8d8" font-size="13">The fee will be capped; its level remains unknown.</text><text x="20" y="132" fill="#c9ab89" font-size="11">Small and large merchants start from different prices.</text></g>
<g transform="translate(20 742)"><rect width="440" height="142" rx="12" fill="#321d22" stroke="#ff8498"></rect><text x="20" y="30" fill="#ffa6b5" font-size="12" font-weight="800">5. COLLECTIVE COST</text><text x="20" y="62" fill="#fff" font-size="22" font-weight="850">SEIGNIORAGE AND OPPORTUNITY</text><text x="20" y="88" fill="#f2e2e5" font-size="13">The cost uses or reduces central-bank income.</text><text x="20" y="111" fill="#f2e2e5" font-size="13">The outcome depends on balance sheets, rates and use.</text><text x="20" y="132" fill="#cca0a8" font-size="11">The cost can flow through monetary income.</text></g>
<rect x="20" y="906" width="440" height="56" rx="10" fill="#0f1822" stroke="#ff8498"></rect>
<text x="40" y="930" fill="#ff9aac" font-size="12" font-weight="800">VERDICT</text>
<text x="40" y="950" fill="#edf3f8" font-size="13">No total cost of ownership was public on 14 August 2026.</text>
<text x="24" y="980" fill="#75899d" font-size="10.5">Sources: ECB, Commission, PwC, ECA. l0g synthesis.</text>
</svg>
