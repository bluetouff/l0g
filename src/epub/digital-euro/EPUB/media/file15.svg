<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 480 1060" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t3e d3e" style="font-family:system-ui,sans-serif;background:#0a111a">
<title id="t3e">Comparing the €5.77 billion and €18 billion cost perimeters</title>
<desc id="d3e">The ECB bridge removes selected items and applies stronger synergies. PwC says costs are shifted and some subsidiaries remain autonomous.</desc>
<defs><linearGradient id="g3e" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a111a"></stop><stop offset="1" stop-color="#16283e"></stop></linearGradient></defs>
<rect x="1" y="1" width="478" height="1058" rx="15" fill="url(#g3e)" stroke="#304459"></rect>
<text x="24" y="39" fill="#f4f7fb" font-size="20" font-weight="800">€5.77BN VS €18BN</text>
<text x="24" y="65" fill="#9fb1c5" font-size="12">A comparison of two cost architectures</text>
<g transform="translate(20 92)"><rect width="440" height="396" rx="13" fill="#172337" stroke="#8facff"></rect><text x="20" y="30" fill="#a7c0ff" font-size="12" font-weight="800">ECB BRIDGE, 2025</text><text x="20" y="63" fill="#fff" font-size="22" font-weight="850">€124m per bank</text><text x="20" y="91" fill="#dce7ef" font-size="13">Detailed base built from PwC bundles</text><rect x="20" y="112" width="400" height="142" rx="10" fill="#101923" stroke="#3b5269"></rect><text x="34" y="136" fill="#ffbd78" font-size="12" font-weight="800">EXPLICIT CORRECTIONS: -€20.1m</text><text x="34" y="163" fill="#dce7ef" font-size="12.5">Physical card: -€6.0m</text><text x="34" y="187" fill="#dce7ef" font-size="12.5">POS: -€7.0m</text><text x="34" y="211" fill="#dce7ef" font-size="12.5">ATM: -€5.1m</text><text x="34" y="235" fill="#dce7ef" font-size="12.5">Fee calculation: -€2.0m</text><text x="20" y="284" fill="#fff" font-size="19" font-weight="800">Adjusted base: €103.9m</text><text x="20" y="316" fill="#dce7ef" font-size="13">Group synergies: 90% to 98% for some IPS</text><text x="20" y="342" fill="#dce7ef" font-size="13">Market synergies: 25% to 40% by scenario</text><text x="20" y="368" fill="#dce7ef" font-size="13">Universe: 1,929 retail banks, groups consolidated</text><text x="20" y="390" fill="#8facff" font-size="14" font-weight="850">Base result: €5.77bn</text></g>
<g transform="translate(20 510)"><rect width="440" height="396" rx="13" fill="#30251a" stroke="#ffbd78"></rect><text x="20" y="30" fill="#ffd09d" font-size="12" font-weight="800">PWC / BANK RESPONSE, 2026</text><text x="20" y="63" fill="#fff" font-size="22" font-weight="850">€18bn maintained</text><text x="20" y="91" fill="#f4e8d8" font-size="13">After reviewing rulebook 0.9 and the ECB note</text><text x="20" y="132" fill="#f4e8d8" font-size="13">Claimed average group synergies: above 79%</text><text x="20" y="160" fill="#f4e8d8" font-size="13">754 banks bear a direct cost</text><text x="20" y="188" fill="#f4e8d8" font-size="13">1,828 banks fully use their group platform</text><rect x="20" y="214" width="400" height="132" rx="10" fill="#21170f" stroke="#ff8498"></rect><text x="34" y="238" fill="#ffa6b5" font-size="12" font-weight="800">OBJECTION</text><text x="34" y="266" fill="#f4e8d8" font-size="12.5">Same card, POS or ATM: new scheme and certification.</text><text x="34" y="292" fill="#f4e8d8" font-size="12.5">Outsourcing becomes licence, service fees and lock-in.</text><text x="34" y="318" fill="#f4e8d8" font-size="12.5">Subsidiaries on separate IT retain local costs.</text><text x="20" y="378" fill="#ffbd78" font-size="14" font-weight="850">Result: €18bn of change costs</text></g>
<rect x="20" y="928" width="440" height="88" rx="11" fill="#11202a" stroke="#68d9c8"></rect>
<text x="38" y="953" fill="#8ce8db" font-size="12" font-weight="800">THE REAL DISAGREEMENT</text>
<text x="38" y="977" fill="#edf3f8" font-size="12.5">Which cost can be shared, and at what future vendor price?</text>
<text x="38" y="999" fill="#edf3f8" font-size="12.5">Recurring total cost remains absent from both estimates.</text>
<text x="24" y="1042" fill="#75899d" font-size="10.5">Sources: ECB October 2025, PwC June 2025 and March 2026.</text>
</svg>
