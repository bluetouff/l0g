<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 480 1040" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="a6-tests-en-t a6-tests-en-d" style="font-family:system-ui,sans-serif;background:#0a111a"><title id="a6-tests-en-t">The six sovereignty tests</title><desc id="a6-tests-en-d">Operational sovereignty is assessed through governance, visibility, modification, replacement, continuity and reconstruction.</desc><defs><linearGradient id="a6-tests-en-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a111a"></stop><stop offset="1" stop-color="#14263a"></stop></linearGradient></defs><rect x="1" y="1" width="478" height="1038" rx="15" fill="url(#a6-tests-en-bg)" stroke="#304459"></rect><text x="24" y="39" fill="#f4f7fb" font-size="20" font-weight="800">THE SIX SOVEREIGNTY TESTS</text><text x="24" y="65" fill="#9fb1c5" font-size="12">Separate evidence for each capability</text><g transform="translate(20 94)"><rect width="440" height="132" rx="12" fill="#132b2c" stroke="#68d9c8"></rect><circle cx="35" cy="37" r="19" fill="#68d9c8"></circle><text x="35" y="43" text-anchor="middle" fill="#07131d" font-size="16" font-weight="850">1</text><text x="68" y="31" fill="#8ce8db" font-size="13" font-weight="850">GOVERN</text><text x="68" y="56" fill="#fff" font-size="15" font-weight="750">Who decides, certifies and orders correction?</text><text x="20" y="91" fill="#dceae7" font-size="12.5">Strength: public issuance, ledger and rulebook.</text><text x="20" y="114" fill="#dceae7" font-size="12.5">Blind spot: exact role split across the six NCBs.</text></g><g transform="translate(20 242)"><rect width="440" height="132" rx="12" fill="#172337" stroke="#8facff"></rect><circle cx="35" cy="37" r="19" fill="#8facff"></circle><text x="35" y="43" text-anchor="middle" fill="#07131d" font-size="16" font-weight="850">2</text><text x="68" y="31" fill="#a7c0ff" font-size="13" font-weight="850">SEE</text><text x="68" y="50" fill="#fff" font-size="13.5" font-weight="750">Who inspects code, logs, models</text><text x="68" y="68" fill="#fff" font-size="13.5" font-weight="750">and subcontractors?</text><text x="20" y="91" fill="#dce7ef" font-size="12.5">Strength: standards and ECB contractual control.</text><text x="20" y="114" fill="#dce7ef" font-size="12.5">Blind spot: public audit rights and subcontractor chain.</text></g><g transform="translate(20 390)"><rect width="440" height="132" rx="12" fill="#251d33" stroke="#dda0ff"></rect><circle cx="35" cy="37" r="19" fill="#dda0ff"></circle><text x="35" y="43" text-anchor="middle" fill="#16091c" font-size="16" font-weight="850">3</text><text x="68" y="31" fill="#e8b7ff" font-size="13" font-weight="850">MODIFY</text><text x="68" y="56" fill="#fff" font-size="15" font-weight="750">Can the Eurosystem fix it without the supplier?</text><text x="20" y="91" fill="#eee6f2" font-size="12.5">Strength: full published rights for offline.</text><text x="20" y="114" fill="#eee6f2" font-size="12.5">Blind spot: four other components not publicly verifiable.</text></g><g transform="translate(20 538)"><rect width="440" height="132" rx="12" fill="#30251a" stroke="#ffbd78"></rect><circle cx="35" cy="37" r="19" fill="#ffbd78"></circle><text x="35" y="43" text-anchor="middle" fill="#1c1005" font-size="16" font-weight="850">4</text><text x="68" y="31" fill="#ffd09d" font-size="13" font-weight="850">REPLACE</text><text x="68" y="56" fill="#fff" font-size="15" font-weight="750">Can the second provider take over production?</text><text x="20" y="91" fill="#f4e8d8" font-size="12.5">Strength: two agreements per component.</text><text x="20" y="114" fill="#f4e8d8" font-size="12.5">Blind spot: time, code, data, keys and failover unproven.</text></g><g transform="translate(20 686)"><rect width="440" height="132" rx="12" fill="#321d22" stroke="#ff8498"></rect><circle cx="35" cy="37" r="19" fill="#ff8498"></circle><text x="35" y="43" text-anchor="middle" fill="#1c0710" font-size="16" font-weight="850">5</text><text x="68" y="31" fill="#ffa6b5" font-size="13" font-weight="850">CONTINUE</text><text x="68" y="50" fill="#fff" font-size="13.5" font-weight="750">What remains without a store, network</text><text x="68" y="68" fill="#fff" font-size="13.5" font-weight="750">or secure element?</text><text x="20" y="91" fill="#f2e2e5" font-size="12.5">Strength: EU law, two network lots, card alternatives.</text><text x="20" y="114" fill="#f2e2e5" font-size="12.5">Blind spot: hardware access and operational parity.</text></g><g transform="translate(20 834)"><rect width="440" height="132" rx="12" fill="#11202a" stroke="#68d9c8"></rect><circle cx="35" cy="37" r="19" fill="#68d9c8"></circle><text x="35" y="43" text-anchor="middle" fill="#07131d" font-size="16" font-weight="850">6</text><text x="68" y="31" fill="#8ce8db" font-size="13" font-weight="850">REBUILD</text><text x="68" y="56" fill="#fff" font-size="15" font-weight="750">Are source, builds, keys and skills sufficient?</text><text x="20" y="91" fill="#dceae7" font-size="12.5">Strength: pilot references and SDK source planned.</text><text x="20" y="114" fill="#dceae7" font-size="12.5">Blind spot: production coverage and another-team exercise.</text></g><rect x="20" y="986" width="440" height="28" rx="8" fill="#0f1822" stroke="#ffbd78"></rect><text x="240" y="1005" text-anchor="middle" fill="#edf3f8" font-size="11.5">The pilot should measure recovery after failure.</text><text x="24" y="1030" fill="#75899d" font-size="10">l0g analysis framework based on public contracts and architecture.</text></svg>
