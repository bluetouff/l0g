<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="100%" role="img" aria-labelledby="terms-en-title terms-en-desc" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;display:block;background:#0b0f14;border:1px solid #3a4654;border-radius:16px;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,sans-serif">
<title id="terms-en-title">Four different protections for payment data</title>
<desc id="terms-en-desc">Anonymisation, pseudonymisation, tokenisation and encryption remove different risks and provide different routes back to identity.</desc>
<g class="terms-en-desktop">
<rect width="760" height="540" rx="16" fill="#0b0f14"></rect>
<text x="32" y="48" fill="#f7f9fc" font-size="24" font-weight="760">FOUR WORDS, FOUR PROTECTIONS</text>
<text x="32" y="76" fill="#94a3b8" font-size="14">Replacing a name with a code does not make the data anonymous.</text>
<rect x="30" y="112" width="165" height="330" rx="14" fill="#14232b" stroke="#5eead4"></rect>
<text x="47" y="148" fill="#5eead4" font-size="15" font-weight="760">ANONYMISED</text>
<text x="47" y="184" fill="#f7f9fc" font-size="14">The reasonable link</text>
<text x="47" y="205" fill="#f7f9fc" font-size="14">to the person</text>
<text x="47" y="226" fill="#f7f9fc" font-size="14">has been broken.</text>
<line x1="47" y1="252" x2="178" y2="252" stroke="#36515b"></line>
<text x="47" y="282" fill="#a8bac5" font-size="12">Return to identity:</text>
<text x="47" y="305" fill="#5eead4" font-size="13" font-weight="720">not intended</text>
<text x="47" y="350" fill="#a8bac5" font-size="12">Example:</text>
<text x="47" y="373" fill="#dce6eb" font-size="12">genuinely aggregated</text>
<text x="47" y="392" fill="#dce6eb" font-size="12">statistics that cannot</text>
<text x="47" y="411" fill="#dce6eb" font-size="12">be re-identified</text>
<rect x="208" y="112" width="165" height="330" rx="14" fill="#182236" stroke="#8fa9ff"></rect>
<text x="225" y="148" fill="#8fa9ff" font-size="15" font-weight="760">PSEUDONYMISED</text>
<text x="225" y="184" fill="#f7f9fc" font-size="14">The name becomes a</text>
<text x="225" y="205" fill="#f7f9fc" font-size="14">technical identifier.</text>
<text x="225" y="226" fill="#f7f9fc" font-size="14">The link exists elsewhere.</text>
<line x1="225" y1="252" x2="356" y2="252" stroke="#3b4d70"></line>
<text x="225" y="282" fill="#aab7d7" font-size="12">Return to identity:</text>
<text x="225" y="305" fill="#8fa9ff" font-size="13" font-weight="720">yes, with the key</text>
<text x="225" y="350" fill="#aab7d7" font-size="12">Digital euro:</text>
<text x="225" y="373" fill="#dde4f6" font-size="12">user ID, DEAN or</text>
<text x="225" y="392" fill="#dde4f6" font-size="12">central account without</text>
<text x="225" y="411" fill="#dde4f6" font-size="12">the civil name</text>
<rect x="386" y="112" width="165" height="330" rx="14" fill="#291d33" stroke="#db8cff"></rect>
<text x="403" y="148" fill="#db8cff" font-size="15" font-weight="760">TOKENISED</text>
<text x="403" y="184" fill="#f7f9fc" font-size="14">A surrogate replaces</text>
<text x="403" y="205" fill="#f7f9fc" font-size="14">the data in one</text>
<text x="403" y="226" fill="#f7f9fc" font-size="14">specific channel.</text>
<line x1="403" y1="252" x2="534" y2="252" stroke="#594063"></line>
<text x="403" y="282" fill="#cab7d2" font-size="12">Return to data:</text>
<text x="403" y="305" fill="#db8cff" font-size="13" font-weight="720">yes, if authorised</text>
<text x="403" y="350" fill="#cab7d2" font-size="12">Digital euro:</text>
<text x="403" y="373" fill="#eee3f2" font-size="12">QR, link or NFC</text>
<text x="403" y="392" fill="#eee3f2" font-size="12">token managed</text>
<text x="403" y="411" fill="#eee3f2" font-size="12">by SEPI</text>
<rect x="564" y="112" width="165" height="330" rx="14" fill="#302418" stroke="#ffb86b"></rect>
<text x="581" y="148" fill="#ffb86b" font-size="15" font-weight="760">ENCRYPTED</text>
<text x="581" y="184" fill="#f7f9fc" font-size="14">Content stays</text>
<text x="581" y="205" fill="#f7f9fc" font-size="14">unreadable without</text>
<text x="581" y="226" fill="#f7f9fc" font-size="14">the key.</text>
<line x1="581" y1="252" x2="712" y2="252" stroke="#665039"></line>
<text x="581" y="282" fill="#d4c2ab" font-size="12">Reading:</text>
<text x="581" y="305" fill="#ffb86b" font-size="13" font-weight="720">yes, by recipient</text>
<text x="581" y="350" fill="#d4c2ab" font-size="12">Digital euro:</text>
<text x="581" y="373" fill="#f1e7da" font-size="12">objects carried</text>
<text x="581" y="392" fill="#f1e7da" font-size="12">between PSPs</text>
<text x="581" y="411" fill="#f1e7da" font-size="12">through DESP</text>
<rect x="30" y="470" width="699" height="43" rx="9" fill="#111923" stroke="#344556"></rect>
<text x="48" y="497" fill="#dce6ef" font-size="13">Online use relies on pseudonymised data.</text>
</g>
<g class="terms-en-mobile" transform="scale(2.1714)">
<rect width="350" height="249" rx="9" fill="#0b0f14"></rect>
<text x="15" y="22" fill="#f7f9fc" font-size="14" font-weight="760">FOUR DIFFERENT PROTECTIONS</text>
<text x="15" y="36" fill="#94a3b8" font-size="8">A code in place of the name is not enough.</text>
<rect x="13" y="47" width="324" height="39" rx="7" fill="#14232b" stroke="#5eead4"></rect>
<text x="23" y="63" fill="#5eead4" font-size="9" font-weight="760">ANONYMISED</text><text x="327" y="63" text-anchor="end" fill="#f7f9fc" font-size="9">link broken</text>
<text x="23" y="78" fill="#b7c8d0" font-size="8">A reasonable return to identity is not intended.</text>
<rect x="13" y="94" width="324" height="39" rx="7" fill="#182236" stroke="#8fa9ff"></rect>
<text x="23" y="110" fill="#8fa9ff" font-size="9" font-weight="760">PSEUDONYMISED</text><text x="327" y="110" text-anchor="end" fill="#f7f9fc" font-size="9">separate key</text>
<text x="23" y="125" fill="#bdc9e5" font-size="8">The person can be restored with additional information.</text>
<rect x="13" y="141" width="324" height="39" rx="7" fill="#291d33" stroke="#db8cff"></rect>
<text x="23" y="157" fill="#db8cff" font-size="9" font-weight="760">TOKENISED</text><text x="327" y="157" text-anchor="end" fill="#f7f9fc" font-size="9">surrogate value</text>
<text x="23" y="172" fill="#d2c2d9" font-size="8">An authorised actor can retrieve the underlying data.</text>
<rect x="13" y="188" width="324" height="39" rx="7" fill="#302418" stroke="#ffb86b"></rect>
<text x="23" y="204" fill="#ffb86b" font-size="9" font-weight="760">ENCRYPTED</text><text x="327" y="204" text-anchor="end" fill="#f7f9fc" font-size="9">read with key</text>
<text x="23" y="219" fill="#d8c9b8" font-size="8">Content is protected while metadata can remain visible.</text>
<text x="15" y="241" fill="#9fb0c0" font-size="8">Online mode relies on pseudonymisation.</text>
</g>
</svg>
