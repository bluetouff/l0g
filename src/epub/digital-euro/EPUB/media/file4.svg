<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 480 1040" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="funding-title-en funding-desc-en" style="display:block;width:100%;height:auto;max-width:720px;margin:0 auto;background:#0a111a;border:1px solid rgba(255,255,255,0.12);border-radius:14px;font-family:system-ui,sans-serif">
  <title id="funding-title-en">The funding funnel after a deposit outflow</title>
  <desc id="funding-desc-en">The bank first uses reserves, then markets in normal times, followed by central-bank funding against collateral. Residual funding identifies the most constrained banks.</desc>
  <defs>
    <linearGradient id="funding-bg-en" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a111a"></stop>
      <stop offset="100%" stop-color="#15283d"></stop>
    </linearGradient>
    <marker id="funding-arrow-en" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#65d9c8"></path>
    </marker>
  </defs>
  <rect x="1" y="1" width="478" height="1038" rx="14" fill="url(#funding-bg-en)"></rect>
  <text x="24" y="38" fill="#f4f7fb" font-size="20" font-weight="750">THE BANK FUNDING PATH</text>
  <text x="24" y="63" fill="#9fb1c5" font-size="12">Simplified order of funding resources in the model</text>
  <g transform="translate(35 92)">
    <rect width="410" height="92" rx="12" fill="#322116" stroke="#ffb86b"></rect>
    <text x="22" y="31" fill="#ffcb96" font-size="12" font-weight="750">SHOCK</text>
    <text x="22" y="61" fill="#ffffff" font-size="19" font-weight="800">Retail deposit outflow</text>
    <text x="285" y="61" fill="#ffcb96" font-size="15" font-weight="700">up to €699bn</text>
  </g>
  <path d="M240 190 V228" stroke="#65d9c8" stroke-width="3" marker-end="url(#funding-arrow-en)"></path>
  <g transform="translate(50 244)">
    <rect width="380" height="104" rx="12" fill="#172337" stroke="#7fa7ff"></rect>
    <text x="22" y="30" fill="#9bb9ff" font-size="12" font-weight="750">1. OWN RESERVES</text>
    <text x="22" y="60" fill="#ffffff" font-size="15" font-weight="700">First absorption line</text>
    <text x="22" y="84" fill="#dbe5f0" font-size="12">Reduces the bank’s liquidity buffer.</text>
  </g>
  <path d="M240 354 V392" stroke="#65d9c8" stroke-width="3" marker-end="url(#funding-arrow-en)"></path>
  <g transform="translate(65 408)">
    <rect width="350" height="116" rx="12" fill="#152c31" stroke="#65d9c8"></rect>
    <text x="22" y="30" fill="#8ce9dc" font-size="12" font-weight="750">2. MARKETS AND BONDS</text>
    <text x="22" y="60" fill="#ffffff" font-size="14" font-weight="700">Secured or unsecured, several maturities</text>
    <text x="22" y="85" fill="#ddf1ee" font-size="12">Available in the normal scenario.</text>
    <text x="22" y="105" fill="#ffb86b" font-size="12" font-weight="700">Interbank market closed in flight-to-safety.</text>
  </g>
  <path d="M240 530 V568" stroke="#65d9c8" stroke-width="3" marker-end="url(#funding-arrow-en)"></path>
  <g transform="translate(80 584)">
    <rect width="320" height="116" rx="12" fill="#251d33" stroke="#d98bff"></rect>
    <text x="22" y="30" fill="#e4a9ff" font-size="12" font-weight="750">3. STANDARD REFINANCING</text>
    <text x="22" y="60" fill="#ffffff" font-size="14" font-weight="700">Eurosystem against eligible collateral</text>
    <text x="22" y="85" fill="#eee6f2" font-size="12">HQLA or eligible non-HQLA assets.</text>
    <text x="22" y="105" fill="#eee6f2" font-size="12">Collateral replaces market access.</text>
  </g>
  <path d="M240 706 V744" stroke="#ffb86b" stroke-width="3" marker-end="url(#funding-arrow-en)"></path>
  <g transform="translate(95 760)">
    <rect width="290" height="122" rx="12" fill="#3a1e20" stroke="#ff718a"></rect>
    <text x="20" y="30" fill="#ff99aa" font-size="12" font-weight="750">4. RESIDUAL NEED</text>
    <text x="20" y="59" fill="#ffffff" font-size="14" font-weight="700">Currently ineligible assets</text>
    <text x="20" y="84" fill="#f6e3e7" font-size="12">Residual need serves as a stress</text>
    <text x="20" y="103" fill="#f6e3e7" font-size="12">indicator within the model.</text>
  </g>
  <g transform="translate(20 904)">
    <rect width="210" height="88" rx="10" fill="#111b26" stroke="#ffb86b"></rect>
    <text x="16" y="27" fill="#ffcb96" font-size="12" font-weight="750">13 BANKS</text>
    <text x="16" y="51" fill="#e6edf5" font-size="12">reach the 100%</text>
    <text x="16" y="70" fill="#e6edf5" font-size="12">LCR threshold</text>
  </g>
  <g transform="translate(250 904)">
    <rect width="210" height="88" rx="10" fill="#111b26" stroke="#ff718a"></rect>
    <text x="16" y="27" fill="#ff99aa" font-size="12" font-weight="750">9 BANKS</text>
    <text x="16" y="51" fill="#e6edf5" font-size="12">hit the standard</text>
    <text x="16" y="70" fill="#e6edf5" font-size="12">collateral constraint</text>
  </g>
</svg>
