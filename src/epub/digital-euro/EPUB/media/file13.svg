<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 650" width="100%" role="img" aria-labelledby="actors4-en-title actors4-en-desc" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;display:block;background:#0b0f14;border:1px solid #3a4654;border-radius:16px;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,sans-serif">
<title id="actors4-en-title">Allocation of powers around the digital euro</title>
<desc id="actors4-en-desc">The legislature defines the money and its limits, the ECB supplies infrastructure within the law, PSPs develop services, users consent, and authorities or courts apply legal restrictions.</desc>
<g class="actors4-en-desktop">
<rect width="760" height="650" rx="16" fill="#0b0f14"></rect>
<text x="32" y="46" fill="#f7f9fc" font-size="24" font-weight="760">WHO CAN DECIDE WHAT?</text>
<text x="32" y="74" fill="#94a3b8" font-size="14">Decision-making is split among several actors.</text>
<rect x="270" y="112" width="220" height="94" rx="14" fill="#172337" stroke="#7fa7ff"></rect>
<text x="380" y="143" text-anchor="middle" fill="#9bb9ff" font-size="15" font-weight="760">PARLIAMENT + COUNCIL</text>
<text x="380" y="169" text-anchor="middle" fill="#f7f9fc" font-size="12.5">define the money, prohibition</text>
<text x="380" y="188" text-anchor="middle" fill="#f7f9fc" font-size="12.5">and allocation of powers</text>
<rect x="42" y="244" width="210" height="122" rx="14" fill="#14272d" stroke="#62d8c6"></rect>
<text x="147" y="274" text-anchor="middle" fill="#7ee5d6" font-size="15" font-weight="760">ECB / EUROSYSTEM</text>
<text x="147" y="301" text-anchor="middle" fill="#f7f9fc" font-size="12.5">standards, settlement, reservation</text>
<text x="147" y="322" text-anchor="middle" fill="#f7f9fc" font-size="12.5">and possible issuance decision</text>
<text x="147" y="347" text-anchor="middle" fill="#a9bec5" font-size="11.5">within the regulation</text>
<rect x="275" y="244" width="210" height="122" rx="14" fill="#302418" stroke="#ffb86b"></rect>
<text x="380" y="274" text-anchor="middle" fill="#ffca91" font-size="15" font-weight="760">PSPs / PROVIDERS</text>
<text x="380" y="301" text-anchor="middle" fill="#f7f9fc" font-size="12.5">business logic, interface, oracle</text>
<text x="380" y="322" text-anchor="middle" fill="#f7f9fc" font-size="12.5">and additional services</text>
<text x="380" y="347" text-anchor="middle" fill="#d8c9b8" font-size="11.5">subject to payments law</text>
<rect x="508" y="244" width="210" height="122" rx="14" fill="#251d33" stroke="#d98bff"></rect>
<text x="613" y="274" text-anchor="middle" fill="#e2adff" font-size="15" font-weight="760">USER</text>
<text x="613" y="301" text-anchor="middle" fill="#f7f9fc" font-size="12.5">accepts a condition, mandate</text>
<text x="613" y="322" text-anchor="middle" fill="#f7f9fc" font-size="12.5">or pre-authorisation</text>
<text x="613" y="347" text-anchor="middle" fill="#d2c2d9" font-size="11.5">consent and revocation</text>
<rect x="158" y="410" width="210" height="122" rx="14" fill="#18272c" stroke="#8dd7a9"></rect>
<text x="263" y="440" text-anchor="middle" fill="#9be5b6" font-size="15" font-weight="760">COMMISSION</text>
<text x="263" y="467" text-anchor="middle" fill="#f7f9fc" font-size="12.5">delegated or implementing acts</text>
<text x="263" y="488" text-anchor="middle" fill="#f7f9fc" font-size="12.5">within delegated matters</text>
<text x="263" y="513" text-anchor="middle" fill="#bfd7c7" font-size="11.5">cannot overturn the law alone</text>
<rect x="392" y="410" width="210" height="122" rx="14" fill="#2b1928" stroke="#ff7ea8"></rect>
<text x="497" y="440" text-anchor="middle" fill="#ff9abb" font-size="15" font-weight="760">AUTHORITIES / COURTS</text>
<text x="497" y="467" text-anchor="middle" fill="#f7f9fc" font-size="12.5">sanctions, AML, freeze, seizure</text>
<text x="497" y="488" text-anchor="middle" fill="#f7f9fc" font-size="12.5">and confiscation</text>
<text x="497" y="513" text-anchor="middle" fill="#d7b9c5" font-size="11.5">under a targeted legal basis</text>
<path d="M380 206 V228" stroke="#7fa7ff" stroke-width="2"></path>
<path d="M147 228 H613" stroke="#52657b" stroke-width="1.5"></path>
<path d="M147 228 V244 M380 228 V244 M613 228 V244" stroke="#52657b" stroke-width="1.5"></path>
<path d="M380 366 V390" stroke="#52657b" stroke-width="1.5"></path>
<path d="M263 390 H497" stroke="#52657b" stroke-width="1.5"></path>
<path d="M263 390 V410 M497 390 V410" stroke="#52657b" stroke-width="1.5"></path>
<rect x="90" y="570" width="580" height="48" rx="10" fill="#111923" stroke="#344556"></rect>
<text x="380" y="590" text-anchor="middle" fill="#ffca91" font-size="12" font-weight="720">ARTICLE 24 BINDS THE ECB’S TECHNICAL POWERS</text>
<text x="380" y="607" text-anchor="middle" fill="#dce6ef" font-size="11.5">A substantive change would require a new legislative process.</text>
</g>
<g class="actors4-en-mobile" transform="scale(2.1714)">
<rect width="350" height="299" rx="9" fill="#0b0f14"></rect>
<text x="15" y="21" fill="#f7f9fc" font-size="13" font-weight="760">WHO CAN DECIDE WHAT?</text>
<text x="15" y="34" fill="#94a3b8" font-size="7.4">Power is split among several authorities.</text>
<rect x="12" y="46" width="326" height="37" rx="6" fill="#172337" stroke="#7fa7ff"></rect>
<text x="21" y="61" fill="#9bb9ff" font-size="8.3" font-weight="760">PARLIAMENT + COUNCIL</text>
<text x="21" y="74" fill="#bdc9e5" font-size="7.2">They define the money, prohibition and allocation of powers.</text>
<rect x="12" y="90" width="326" height="37" rx="6" fill="#14272d" stroke="#62d8c6"></rect>
<text x="21" y="105" fill="#7ee5d6" font-size="8.3" font-weight="760">ECB / EUROSYSTEM</text>
<text x="21" y="118" fill="#b7d5d0" font-size="7.2">Standards, settlement and reservation within the law.</text>
<rect x="12" y="134" width="326" height="37" rx="6" fill="#302418" stroke="#ffb86b"></rect>
<text x="21" y="149" fill="#ffca91" font-size="8.3" font-weight="760">PSPs / PROVIDERS</text>
<text x="21" y="162" fill="#d8c9b8" font-size="7.2">Services, interface, oracle and business logic.</text>
<rect x="12" y="178" width="326" height="37" rx="6" fill="#251d33" stroke="#d98bff"></rect>
<text x="21" y="193" fill="#e2adff" font-size="8.3" font-weight="760">USER</text>
<text x="21" y="206" fill="#d2c2d9" font-size="7.2">Consent, modification and revocation by service.</text>
<rect x="12" y="222" width="158" height="40" rx="6" fill="#18272c" stroke="#8dd7a9"></rect>
<text x="21" y="237" fill="#9be5b6" font-size="8" font-weight="760">COMMISSION</text>
<text x="21" y="251" fill="#bfd7c7" font-size="6.8">Bounded acts.</text>
<rect x="180" y="222" width="158" height="40" rx="6" fill="#2b1928" stroke="#ff7ea8"></rect>
<text x="189" y="237" fill="#ff9abb" font-size="8" font-weight="760">AUTHORITIES / COURTS</text>
<text x="189" y="251" fill="#d7b9c5" font-size="6.8">Freeze, seizure, sanctions.</text>
<rect x="12" y="271" width="326" height="19" rx="5" fill="#111923"></rect>
<text x="175" y="284" text-anchor="middle" fill="#ffca91" font-size="7.2" font-weight="720">Expiry would require a new legislative procedure.</text>
</g>
</svg>
