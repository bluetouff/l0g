  <title id="sfc-fx-en-d-1">Dollar reference, rouble payment</title>
  <desc id="sfc-fx-en-d-3">The coupon is calculated in dollars, then converted into roubles. Rates of 80 and 100 RUB per USD are used solely to illustrate the calculation. The issuer reports the actual 2 November 2026 payment.</desc>
