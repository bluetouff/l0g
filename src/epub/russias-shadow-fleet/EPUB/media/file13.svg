<svg xmlns="http://www.w3.org/2000/svg" id="sfi-certificate-en-m-0" width="600" height="816" viewBox="0 0 600 816" role="img" aria-labelledby="sfi-certificate-en-m-1 sfi-certificate-en-m-3" font-family="Inter Variable, Inter, sans-serif" font-weight="400" xml:lang="en">
  <title id="sfi-certificate-en-m-1">From certificate to compensation</title>
  <desc id="sfi-certificate-en-m-3">Before an incident, the insurer supplies a Blue Card, the competent State issues a CLC certificate and the ship presents it for inspection. After an incident, victims may bring a direct claim against the insurer or guarantor. Cover depends on the cause, territory and admissible damage. Certification and compensation are separate processes.</desc>
  <metadata>{"publisher": "l0g", "license": "CC-BY-4.0", "cutoff": "2026-11-19", "language": "en", "chart": "certificat", "unit": "Qualitative certification and direct-action pathways; unscaled arrows", "period": "Convention framework and public administrative guidance checked2026-11-19", "limits": "Illustrative legal mechanism, not the certificate or policy of a named ship. A state certificate is distinct from a state guarantee to pay. Direct action and compensation remain subject to treaty scope and admissibility.", "sources": [{"id": "S08", "url": "https://iopcfunds.org/wp-content/uploads/2018/06/Text-of-Conventions_e.pdf"}, {"id": "S13", "url": "https://www.dma.dk/ship-survey-and-registration/apply-for-a-certificate"}]}</metadata>
