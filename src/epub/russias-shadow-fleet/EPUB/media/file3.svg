  <title id="sfo-network-en-m-1">Three documented ownership chains — mobile</title>
  <desc id="sfo-network-en-m-3">Three rows show Cariba owning White Agate, Nitara owning Serpentine, and Prospect as Citrine’s main shareholder. Equity links are attributed to the Council of the European Union. Only Citrine is linked to ARROW, AMULET and BOBCAT, based on IRCLASS’s Owner Address field accessed on 19 November 2026. Prospect’s incorporation on 6 March 2024 is verified in Hong Kong’s registry. Its percentage stake is not disclosed.</desc>
