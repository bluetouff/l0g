  <rect x="28" y="399" width="544" height="164" rx="18" fill="#121419" stroke="rgba(255, 255, 255, 0.20)"></rect>
  <text x="50" y="435" font-family="Inter Variable, Inter, sans-serif" font-size="26.5" font-weight="400" fill="#7aa2f7" text-anchor="start">02 / FIX THE EXCHANGE RATE</text>
  <text x="50" y="482" font-family="Inter Variable, Inter, sans-serif" font-size="29" font-weight="400" fill="#7aa2f7" text-anchor="start">T−2 business days</text>
  <text x="50" y="519" font-family="Inter Variable, Inter, sans-serif" font-size="26.5" font-weight="400" fill="#e7e9ee" text-anchor="start">Bank of Russia official rate</text>
  <text x="50" y="548" font-family="Inter Variable, Inter, sans-serif" font-size="26.5" font-weight="400" fill="#8b909b" text-anchor="start">before the payment date</text>
  <text x="28" y="609" font-family="Inter Variable, Inter, sans-serif" font-size="26.5" font-weight="400" fill="#ff4d87" text-anchor="start">03 / SETTLEMENT</text>
