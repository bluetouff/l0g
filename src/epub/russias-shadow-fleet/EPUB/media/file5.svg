  <text x="50" y="251" font-family="Inter Variable, Inter, sans-serif" font-size="29" font-weight="400" fill="#e7e9ee" text-anchor="start">USD 100 face value</text>
  <text x="50" y="285" font-family="Inter Variable, Inter, sans-serif" font-size="26.5" font-weight="400" fill="#8b909b" text-anchor="start">13.5% p.a. · 30 days</text>
  <text x="50" y="322" font-family="Inter Variable, Inter, sans-serif" font-size="26.5" font-weight="400" fill="#e7e9ee" text-anchor="start">100 × 13.5% × 30 / 365</text>
