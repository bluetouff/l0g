<svg xmlns="http://www.w3.org/2000/svg" id="sfp-clearing-en-d-0" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="sfp-clearing-en-d-1 sfp-clearing-en-d-3" font-family="Inter Variable, Inter, sans-serif" font-weight="400" xml:lang="en">
  <title id="sfp-clearing-en-d-1">Two pools, one settlement</title>
  <desc id="sfp-clearing-en-d-3">Illustrative offsetting mechanism; no amounts or quantities are represented. An export sale links a Russian exporter with a foreign buyer. The buyer supplies foreign currency to an overseas liquidity pool; the exporter receives roubles from a pool in Russia. An import links a Russian importer with a foreign supplier: the importer provides roubles and the supplier receives foreign currency. The A7 ledger reconciles payment obligations between the two pools. Dashed arrows represent bookkeeping, not a cross-border transfer. Orders are pooled rather than matched one for one. Each pool requires liquidity and rebalancing. Oil is one possible source of foreign currency among other exports. Sources S01: A7 FAQ consulted 19 November 2026; S03: NCA August 2026 pp. 4–5; S04: FinCEN 5 October 2026 p. 63213. No particular vessel, bank account or customer is represented.</desc>
  <metadata>{"publisher": "l0g", "license": "CC-BY-4.0", "cutoff": "2026-11-19", "language": "en", "chart": "compensation", "unit": "Qualitative payment and goods flows; no quantitative arrow weights", "period": "Public descriptions through 2026-11-19", "limits": "Illustrative mechanism, not a reconstructed individual transaction. Oil is one possible source of foreign currency. Arrows distinguish roubles, foreign currency, goods and bookkeeping.", "sources": [{"id": "S01", "url": "https://www.a7.ru/faq/"}, {"id": "S03", "url": "https://www.nationalcrimeagency.gov.uk/who-we-are/publications/826-necc-a7-sanctions-evasion-mechanism/file"}, {"id": "S04", "url": "https://www.govinfo.gov/content/pkg/FR-2026-10-05/pdf/2026-20371.pdf"}]}</metadata>
