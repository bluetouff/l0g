  <rect x="42" y="340" width="180" height="104" rx="7" fill="#111318" stroke="#39404c"></rect>
  <text x="58" y="366" fill="#d9dde4" font-size="10" font-weight="800">MISSING FILES</text>
  <text x="58" y="388" fill="#c1c7d0" font-size="8">• minimum output requested</text>
  <text x="58" y="405" fill="#c1c7d0" font-size="8">• grid case without operation</text>
  <text x="58" y="422" fill="#c1c7d0" font-size="8">• monitoring appendix D</text>
  <text x="24" y="484" fill="#777f8c" font-size="9">SOURCE: ASNR 2026-DC-052. Institutional reading and l0g document inventory.</text>
</svg>
