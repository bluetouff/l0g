<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Time lag between an immediate electricity decision and the time required to measure ecological effects of thermal discharges" style="display:block;width:100%;height:auto;background:#0c0d10;border:1px solid rgba(255,255,255,0.10);border-radius:8px;margin:18px 0 22px;overflow:hidden;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <rect width="720" height="470" fill="#0c0d10"></rect>
  <text x="24" y="34" fill="#5eead4" font-size="15" font-weight="700">// The grid decides now; the river answers later</text>
  <text x="24" y="55" fill="#8b929e" font-size="10">The evidence calendar is not the operating calendar.</text>
  <line x1="52" y1="130" x2="670" y2="130" stroke="#343a45" stroke-width="3"></line>
  <circle cx="72" cy="130" r="8" fill="#ff4d87"></circle>
  <circle cx="205" cy="130" r="8" fill="#f5b13d"></circle>
  <circle cx="350" cy="130" r="8" fill="#7aa2f7"></circle>
  <circle cx="505" cy="130" r="8" fill="#5eead4"></circle>
  <circle cx="650" cy="130" r="8" fill="#5eead4"></circle>
  <text x="72" y="100" text-anchor="middle" fill="#ff4d87" font-size="10" font-weight="800">DAY 0</text>
  <text x="205" y="100" text-anchor="middle" fill="#f5b13d" font-size="10" font-weight="800">DAYS</text>
  <text x="350" y="100" text-anchor="middle" fill="#7aa2f7" font-size="10" font-weight="800">WEEKS</text>
  <text x="505" y="100" text-anchor="middle" fill="#5eead4" font-size="10" font-weight="800">31 OCT</text>
  <text x="650" y="100" text-anchor="middle" fill="#5eead4" font-size="10" font-weight="800">31 MAR</text>
  <rect x="38" y="166" width="124" height="100" rx="6" fill="#15171c" stroke="#ff4d87"></rect>
  <text x="52" y="190" fill="#ff4d87" font-size="10" font-weight="800">DECISION</text>
  <text x="52" y="211" fill="#c8cdd5" font-size="8">weather</text>
  <text x="52" y="228" fill="#c8cdd5" font-size="8">RTE need</text>
  <text x="52" y="245" fill="#c8cdd5" font-size="8">ASNR limit</text>
  <rect x="176" y="166" width="124" height="100" rx="6" fill="#15171c" stroke="#f5b13d"></rect>
  <text x="190" y="190" fill="#f5b13d" font-size="10" font-weight="800">FAST</text>
  <text x="190" y="211" fill="#c8cdd5" font-size="8">temperature</text>
  <text x="190" y="228" fill="#c8cdd5" font-size="8">oxygen</text>
  <text x="190" y="245" fill="#c8cdd5" font-size="8">visible mortality</text>
  <rect x="314" y="166" width="124" height="100" rx="6" fill="#15171c" stroke="#7aa2f7"></rect>
  <text x="328" y="190" fill="#7aa2f7" font-size="10" font-weight="800">DELAYED</text>
  <text x="328" y="211" fill="#c8cdd5" font-size="8">cyanobacteria</text>
  <text x="328" y="228" fill="#c8cdd5" font-size="8">phytoplankton</text>
  <text x="328" y="245" fill="#c8cdd5" font-size="8">diatoms</text>
  <rect x="452" y="166" width="124" height="100" rx="6" fill="#15171c" stroke="#5eead4"></rect>
  <text x="466" y="190" fill="#5eead4" font-size="10" font-weight="800">2026 REPORT</text>
  <text x="466" y="211" fill="#c8cdd5" font-size="8">operation</text>
  <text x="466" y="228" fill="#c8cdd5" font-size="8">initial impact</text>
  <text x="466" y="245" fill="#c8cdd5" font-size="8">possible remedy</text>
  <rect x="590" y="166" width="100" height="100" rx="6" fill="#15171c" stroke="#5eead4"></rect>
  <text x="604" y="190" fill="#5eead4" font-size="10" font-weight="800">FINAL</text>
  <text x="604" y="211" fill="#c8cdd5" font-size="8">definitive</text>
  <text x="604" y="228" fill="#c8cdd5" font-size="8">Bugey</text>
  <text x="604" y="245" fill="#c8cdd5" font-size="8">assessment</text>
  <rect x="38" y="310" width="652" height="104" rx="7" fill="#111318" stroke="#2f3540"></rect>
  <text x="54" y="336" fill="#f3f5f8" font-size="11" font-weight="800">2022 operating experience</text>
  <text x="54" y="358" fill="#c8cdd5" font-size="9">24 cumulative days: Tricastin 9, Bugey 8, Golfech 6, Saint-Alban 1.</text>
  <text x="54" y="378" fill="#c8cdd5" font-size="9">No attributable lasting effect identified in the sites and parameters studied.</text>
  <text x="54" y="398" fill="#f5b13d" font-size="9">Saint-Alban: small 2022 biological differences, no longer observed in 2023.</text>
  <text x="24" y="455" fill="#777f8c" font-size="9">SOURCES: ASNR 2022-2025 reviews; Bugey decision 2026-DC-052; EDF monitoring file.</text>
</svg>
