<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 455" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The three thermal-discharge tiers applying at Bugey in summer 2026: normal conditions, exceptional climatic conditions and a temporary ASNR decision" style="display:block;width:100%;height:auto;background:#0c0d10;border:1px solid rgba(255,255,255,0.10);border-radius:8px;margin:18px 0 22px;overflow:hidden;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <rect width="720" height="455" fill="#0c0d10"></rect>
  <text x="24" y="34" fill="#5eead4" font-size="15" font-weight="700">// Bugey: three regulatory steps</text>
  <text x="24" y="55" fill="#8b929e" font-size="10">The third tier is not simply a higher CCE limit.</text>
  <rect x="28" y="92" width="204" height="244" rx="7" fill="#15171c" stroke="#5eead4"></rect>
  <text x="46" y="120" fill="#5eead4" font-size="12" font-weight="800">1. NORMAL</text>
  <text x="46" y="140" fill="#9ca3ae" font-size="9">1 May to 15 September</text>
  <text x="46" y="187" fill="#f3f5f8" font-size="20" font-weight="800">≤ 26°C</text>
  <text x="46" y="205" fill="#aeb4be" font-size="9">mean downstream temperature</text>
  <line x1="46" y1="226" x2="210" y2="226" stroke="#2c323d"></line>
  <text x="46" y="255" fill="#f3f5f8" font-size="18" font-weight="800">ΔT ≤ 5°C</text>
  <text x="46" y="274" fill="#aeb4be" font-size="9">ordinary operation</text>
  <text x="46" y="308" fill="#7f8793" font-size="9">Permanent prescription</text>
  <rect x="258" y="92" width="204" height="244" rx="7" fill="#15171c" stroke="#7aa2f7"></rect>
  <text x="276" y="120" fill="#7aa2f7" font-size="12" font-weight="800">2. CCE</text>
  <text x="276" y="140" fill="#9ca3ae" font-size="9">RTE requires the units</text>
  <text x="276" y="187" fill="#f3f5f8" font-size="20" font-weight="800">≤ 27°C</text>
  <text x="276" y="205" fill="#aeb4be" font-size="9">mean downstream temperature</text>
  <line x1="276" y1="226" x2="440" y2="226" stroke="#2c323d"></line>
  <text x="276" y="255" fill="#f3f5f8" font-size="18" font-weight="800">ΔT ≤ 1°C</text>
  <text x="276" y="274" fill="#aeb4be" font-size="9">planned temporary exposure</text>
  <text x="276" y="308" fill="#7f8793" font-size="9">Permanent second tier</text>
  <rect x="488" y="92" width="204" height="244" rx="7" fill="#15171c" stroke="#ff4d87"></rect>
  <text x="506" y="120" fill="#ff4d87" font-size="12" font-weight="800">3. R. 593-40</text>
  <text x="506" y="140" fill="#9ca3ae" font-size="9">12 to 20 July 2026</text>
  <text x="506" y="187" fill="#f3f5f8" font-size="20" font-weight="800">ΔT ≤ 1°C</text>
  <text x="506" y="205" fill="#aeb4be" font-size="9">direct operative limit</text>
  <line x1="506" y1="226" x2="670" y2="226" stroke="#2c323d"></line>
  <text x="506" y="253" fill="#f5b13d" font-size="14" font-weight="800">projected ≤ 28°C</text>
  <text x="506" y="274" fill="#aeb4be" font-size="9">reactors 4 and 5 only</text>
  <text x="506" y="308" fill="#7f8793" font-size="9">Case-by-case ASNR decision</text>
  <path d="M232 214 H258" stroke="#89909b" stroke-width="2"></path>
  <polygon points="258,214 248,208 248,220" fill="#89909b"></polygon>
  <path d="M462 214 H488" stroke="#89909b" stroke-width="2"></path>
  <polygon points="488,214 478,208 478,220" fill="#89909b"></polygon>
  <rect x="28" y="365" width="664" height="52" rx="6" fill="#111318" stroke="#2a303a"></rect>
  <text x="44" y="387" fill="#f5b13d" font-size="10" font-weight="800">Method point</text>
  <text x="44" y="405" fill="#c7ccd5" font-size="9">28°C supports the assessment. Article 1 directly caps warming at 1°C.</text>
  <text x="24" y="443" fill="#777f8c" font-size="9">SOURCES: EDF Open Data; ASNR July 2025 note and decision 2026-DC-052.</text>
</svg>
