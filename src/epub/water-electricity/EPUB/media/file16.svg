<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 444" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Implementation status of Europe&#x27;s seven-day adequacy process according to ACER monitoring published in 2025" style="display:block;width:100%;height:auto;background:#0c0d10;border:1px solid rgba(255,255,255,0.10);border-radius:8px;margin:18px 0 22px;overflow:hidden;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <rect width="720" height="444" fill="#0c0d10"></rect>
  <text x="24" y="34" fill="#5eead4" font-size="15" font-weight="700">// ACER's view of the seven-day safety net</text>
  <text x="24" y="55" fill="#8b929e" font-size="10">Monitoring carried out in 2025 across regional coordination centres.</text>
  <rect x="32" y="91" width="304" height="116" rx="8" fill="#15171c" stroke="#5eead4"></rect>
  <text x="52" y="119" fill="#5eead4" font-size="11" font-weight="800">MONITORED LEGAL REQUIREMENT</text>
  <text x="52" y="158" fill="#f3f5f8" font-size="20" font-weight="800">100% implemented</text>
  <text x="52" y="181" fill="#89919d" font-size="9">seven-day assessment performed in rotation</text>
  <rect x="384" y="91" width="304" height="116" rx="8" fill="#15171c" stroke="#7aa2f7"></rect>
  <text x="404" y="119" fill="#7aa2f7" font-size="11" font-weight="800">STSAA METHODOLOGY</text>
  <text x="404" y="158" fill="#f3f5f8" font-size="20" font-weight="800">59% reported</text>
  <text x="404" y="181" fill="#89919d" font-size="9">rounded to 60% on ACER's webpage</text>
  <rect x="32" y="238" width="656" height="58" rx="7" fill="#111318" stroke="#343c47"></rect>
  <text x="50" y="261" fill="#aeb4be" font-size="10">Other report categories, subject to rounding:</text>
  <text x="50" y="281" fill="#f5b13d" font-size="10" font-weight="700">33% “other” · 7% not applicable · 2% not started</text>
</svg>
