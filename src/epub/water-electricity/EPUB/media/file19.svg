<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 458" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Full-cost formula for a megawatt secured through cooling adaptation" style="display:block;width:100%;height:auto;background:#0c0d10;border:1px solid rgba(255,255,255,0.10);border-radius:8px;margin:18px 0 22px;overflow:hidden;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <rect width="720" height="458" fill="#0c0d10"></rect>
  <text x="24" y="34" fill="#5eead4" font-size="15" font-weight="700">// Full cost of a secured megawatt</text>
  <text x="24" y="55" fill="#8b929e" font-size="10">A common accounting frame for very different options.</text>
  <rect x="28" y="88" width="204" height="52" rx="6" fill="#15171c" stroke="#7aa2f7"></rect>
  <text x="44" y="112" fill="#7aa2f7" font-size="10" font-weight="800">ANNUALISED CAPEX</text>
  <text x="44" y="130" fill="#c7ccd5" font-size="9">lifetime + discount rate</text>
  <rect x="258" y="88" width="204" height="52" rx="6" fill="#15171c" stroke="#5eead4"></rect>
  <text x="274" y="112" fill="#5eead4" font-size="10" font-weight="800">OPEX AND CHEMISTRY</text>
  <text x="274" y="130" fill="#c7ccd5" font-size="9">maintenance + treatment</text>
  <rect x="488" y="88" width="204" height="52" rx="6" fill="#15171c" stroke="#f5b13d"></rect>
  <text x="504" y="112" fill="#f5b13d" font-size="10" font-weight="800">AUXILIARY POWER</text>
  <text x="504" y="130" fill="#c7ccd5" font-size="9">pumps + fans</text>
  <rect x="28" y="162" width="204" height="52" rx="6" fill="#15171c" stroke="#ff4d87"></rect>
  <text x="44" y="186" fill="#ff4d87" font-size="10" font-weight="800">CONSTRUCTION OUTAGE</text>
  <text x="44" y="204" fill="#c7ccd5" font-size="9">generation not produced</text>
  <rect x="258" y="162" width="204" height="52" rx="6" fill="#15171c" stroke="#a78bfa"></rect>
  <text x="274" y="186" fill="#a78bfa" font-size="10" font-weight="800">WATER AND DISCHARGES</text>
  <text x="274" y="204" fill="#c7ccd5" font-size="9">withdrawal ≠ consumption</text>
  <rect x="488" y="162" width="204" height="52" rx="6" fill="#15171c" stroke="#f5b13d"></rect>
  <text x="504" y="186" fill="#f5b13d" font-size="10" font-weight="800">EXTERNALITIES</text>
  <text x="504" y="204" fill="#c7ccd5" font-size="9">river, air, sea, grid</text>
  <text x="349" y="254" fill="#8b929e" font-size="18" font-weight="800">÷</text>
  <rect x="78" y="278" width="252" height="72" rx="8" fill="#111318" stroke="#5eead4" stroke-width="2"></rect>
  <text x="98" y="305" fill="#5eead4" font-size="11" font-weight="800">CAPACITY ACTUALLY SECURED</text>
  <text x="98" y="330" fill="#c7ccd5" font-size="9">during the target climate scenario</text>
  <rect x="390" y="278" width="252" height="72" rx="8" fill="#111318" stroke="#7aa2f7" stroke-width="2"></rect>
  <text x="410" y="305" fill="#7aa2f7" font-size="11" font-weight="800">DERATING AVOIDED OVER LIFE</text>
  <text x="410" y="330" fill="#c7ccd5" font-size="9">across the adaptation lifetime</text>
  <rect x="78" y="382" width="564" height="38" rx="6" fill="#15171c" stroke="#ff4d87"></rect>
  <text x="98" y="406" fill="#ff8bad" font-size="10" font-weight="800">Without a denominator: visible price, unknown effectiveness.</text>
  <text x="24" y="447" fill="#777f8c" font-size="9">METHOD: l0g, based on transparency recommendations from the Court of Auditors.</text>
</svg>
