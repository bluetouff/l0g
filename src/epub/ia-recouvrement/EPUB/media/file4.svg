<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="286" viewBox="0 0 360 286" role="img" aria-labelledby="ia3-fr-fig1-title ia3-fr-fig1-desc" focusable="false" style="display:block;width:100%;max-width:440px;height:auto;margin:0 auto;" font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="360" height="286" fill="#0b0d10"/>
<title id="ia3-fr-fig1-title">Examiner les alertes et les dossiers non signalés</title>
<desc id="ia3-fr-fig1-desc">Protocole proposé, non exécuté : examiner les alertes pour rechercher les classements injustifiés, puis un échantillon de dossiers sans alerte pour rechercher des difficultés manquées. Employer un contexte et des critères communs, conserver les désaccords. Aucun taux d’erreur calculé.</desc>
<rect x="0.5" y="0.5" width="359" height="285" rx="8" fill="#121419" stroke="rgba(255,255,255,0.20)" stroke-width="1" />
<text x="16" y="30" font-size="20" font-weight="600" fill="#e7e9ee">Contrôler les deux côtés</text>
<text x="16" y="65" font-size="14" font-weight="600" fill="#5eead4">AVEC ALERTE</text>
<text x="196" y="65" font-size="14" font-weight="600" fill="#f5b13d">SANS ALERTE</text>
<text x="16" y="92" font-size="16" font-weight="400" fill="#e7e9ee">Vérifier l’alerte,</text>
<text x="16" y="114" font-size="16" font-weight="400" fill="#e7e9ee">le besoin et</text>
<text x="16" y="136" font-size="16" font-weight="400" fill="#e7e9ee">l’aide apportée.</text>
<text x="196" y="92" font-size="16" font-weight="400" fill="#e7e9ee">Relire un échantillon</text>
<text x="196" y="114" font-size="16" font-weight="400" fill="#e7e9ee">indépendamment.</text>
<text x="196" y="136" font-size="16" font-weight="400" fill="#e7e9ee">Chercher les oublis.</text>
<line x1="16" y1="157" x2="344" y2="157" stroke="rgba(255,255,255,0.20)" stroke-width="1" />
<text x="16" y="184" font-size="14" font-weight="600" fill="#5eead4">MÊME CADRE DE CONTRÔLE</text>
<text x="16" y="209" font-size="16" font-weight="400" fill="#e7e9ee">Même contexte, critères définis,</text>
<text x="16" y="232" font-size="16" font-weight="400" fill="#e7e9ee">désaccords conservés.</text>
<text x="16" y="267" font-size="16" font-weight="400" fill="#e7e9ee">Aucun taux d’erreur calculé ici.</text>
</svg>
