<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="294" viewBox="0 0 360 294" role="img" aria-labelledby="ia2-fr-fig1-title ia2-fr-fig1-desc" focusable="false" style="display:block;width:100%;max-width:440px;height:auto;margin:0 auto;" font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="360" height="294" fill="#0b0d10"/>
<title id="ia2-fr-fig1-title">Trois mesures à distinguer</title>
<desc id="ia2-fr-fig1-desc">Un engagement mesure une réaction ; un encaissement mesure un mouvement d’argent ; une résolution vérifiée porte sur le devenir de l’accord ou de la contestation. Ces dimensions ne sont pas des étapes obligatoires : une contestation reconnue peut clore le dossier sans paiement.</desc>
<rect x="0.5" y="0.5" width="359" height="293" rx="8" fill="#121419" stroke="rgba(255,255,255,0.20)" stroke-width="1" />
<text x="16" y="30" font-size="20" font-weight="600" fill="#e7e9ee">Ce que l’on compte</text>
<text x="16" y="64" font-size="14" font-weight="600" fill="#5eead4">CONTACT</text>
<text x="16" y="87" font-size="16" font-weight="400" fill="#e7e9ee">Ouverture, réponse, engagement.</text>
<line x1="16" y1="102" x2="344" y2="102" stroke="rgba(255,255,255,0.20)" stroke-width="1" />
<text x="16" y="124" font-size="14" font-weight="600" fill="#5eead4">PAIEMENT</text>
<text x="16" y="147" font-size="16" font-weight="400" fill="#e7e9ee">Sommes reçues, annulations et</text>
<text x="16" y="168" font-size="16" font-weight="400" fill="#e7e9ee">remboursements à rapprocher.</text>
<line x1="16" y1="183" x2="344" y2="183" stroke="rgba(255,255,255,0.20)" stroke-width="1" />
<text x="16" y="205" font-size="14" font-weight="600" fill="#5eead4">ISSUE DU DOSSIER</text>
<text x="16" y="228" font-size="16" font-weight="400" fill="#e7e9ee">Accord tenu ou contestation traitée.</text>
<text x="16" y="259" font-size="16" font-weight="400" fill="#e7e9ee">Une contestation reconnue peut</text>
<text x="16" y="280" font-size="16" font-weight="400" fill="#e7e9ee">clore le dossier sans paiement.</text>
</svg>
