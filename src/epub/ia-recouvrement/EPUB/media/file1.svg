<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="286" viewBox="0 0 360 286" role="img" aria-labelledby="ia1-fr-fig2-title ia1-fr-fig2-desc" focusable="false" style="display:block;width:100%;max-width:440px;height:auto;margin:0 auto;" font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="360" height="286" fill="#0b0d10"/>
<title id="ia1-fr-fig2-title">De la donnée à l’action : quatre fonctions</title>
<desc id="ia1-fr-fig2-desc">Grille de lecture : les données du dossier peuvent alimenter une évaluation et un choix d’action. Le message peut être fixe, rédigé par un humain ou généré. Une action dans le dossier requiert les pouvoirs correspondants. L’exécution doit être vérifiée dans le dossier. Les contrôles humains peuvent intervenir à plusieurs étapes.</desc>
<rect x="0.5" y="0.5" width="359" height="285" rx="8" fill="#121419" stroke="rgba(255,255,255,0.20)" stroke-width="1" />
<text x="16" y="30" font-size="20" font-weight="600" fill="#e7e9ee">Du dossier à l’action</text>
<text x="16" y="64" font-size="14" font-weight="600" fill="#5eead4">01</text>
<text x="46" y="64" font-size="16" font-weight="600" fill="#e7e9ee">Données du dossier</text>
<text x="16" y="87" font-size="16" font-weight="400" fill="#e7e9ee">Factures, paiements, corrections.</text>
<line x1="16" y1="99" x2="344" y2="99" stroke="rgba(255,255,255,0.20)" stroke-width="1" />
<text x="16" y="122" font-size="14" font-weight="600" fill="#5eead4">02</text>
<text x="46" y="122" font-size="16" font-weight="600" fill="#e7e9ee">Évaluation et orientation</text>
<text x="16" y="145" font-size="16" font-weight="400" fill="#e7e9ee">Score éventuel et règles de traitement.</text>
<line x1="16" y1="157" x2="344" y2="157" stroke="rgba(255,255,255,0.20)" stroke-width="1" />
<text x="16" y="180" font-size="14" font-weight="600" fill="#5eead4">03</text>
<text x="46" y="180" font-size="16" font-weight="600" fill="#e7e9ee">Rédaction du message</text>
<text x="16" y="203" font-size="16" font-weight="400" fill="#e7e9ee">Texte fixe, humain ou généré.</text>
<line x1="16" y1="215" x2="344" y2="215" stroke="rgba(255,255,255,0.20)" stroke-width="1" />
<text x="16" y="238" font-size="14" font-weight="600" fill="#5eead4">04</text>
<text x="46" y="238" font-size="16" font-weight="600" fill="#e7e9ee">Action sur le dossier</text>
<text x="16" y="261" font-size="16" font-weight="400" fill="#e7e9ee">Selon les pouvoirs et contrôles prévus.</text>
</svg>
