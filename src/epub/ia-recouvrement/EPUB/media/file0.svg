<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="286" viewBox="0 0 360 286" role="img" aria-labelledby="ia1-fr-fig1-title ia1-fr-fig1-desc" focusable="false" style="display:block;width:100%;max-width:440px;height:auto;margin:0 auto;" font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="360" height="286" fill="#0b0d10"/>
<title id="ia1-fr-fig1-title">Mandat ou cession : deux situations</title>
<desc id="ia1-fr-fig1-desc">Dans le mandat, le créancier conserve la créance et charge un recouvreur d’agir pour son compte. Dans la cession, le créancier initial transfère la créance à un nouveau créancier. Celui-ci peut aussi mandater un recouvreur. Ce sont deux situations de principe, pas deux étapes obligatoires.</desc>
<rect x="0.5" y="0.5" width="359" height="285" rx="8" fill="#121419" stroke="rgba(255,255,255,0.20)" stroke-width="1" />
<text x="16" y="30" font-size="20" font-weight="600" fill="#e7e9ee">Mandat ou cession</text>
<text x="16" y="62" font-size="14" font-weight="600" fill="#5eead4">01 · MANDAT</text>
<text x="16" y="91" font-size="16" font-weight="600" fill="#e7e9ee">Créancier</text>
<text x="16" y="113" font-size="16" font-weight="400" fill="#e7e9ee">garde la créance</text>
<text x="204" y="91" font-size="16" font-weight="600" fill="#e7e9ee">Recouvreur</text>
<text x="204" y="113" font-size="16" font-weight="400" fill="#e7e9ee">agit pour lui</text>
<line x1="169" y1="96" x2="191" y2="96" stroke="#5eead4" stroke-width="1" /><line x1="186" y1="92" x2="191" y2="96" stroke="#5eead4" stroke-width="1" /><line x1="186" y1="100" x2="191" y2="96" stroke="#5eead4" stroke-width="1" />
<line x1="16" y1="137" x2="344" y2="137" stroke="rgba(255,255,255,0.20)" stroke-width="1" />
<text x="16" y="163" font-size="14" font-weight="600" fill="#f5b13d">02 · CESSION</text>
<text x="16" y="192" font-size="16" font-weight="600" fill="#e7e9ee">Créancier initial</text>
<text x="204" y="192" font-size="16" font-weight="600" fill="#e7e9ee">Acquéreur</text>
<text x="204" y="214" font-size="16" font-weight="400" fill="#e7e9ee">détient la créance</text>
<line x1="169" y1="197" x2="191" y2="197" stroke="#5eead4" stroke-width="1" /><line x1="186" y1="193" x2="191" y2="197" stroke="#5eead4" stroke-width="1" /><line x1="186" y1="201" x2="191" y2="197" stroke="#5eead4" stroke-width="1" />
<text x="16" y="246" font-size="16" font-weight="400" fill="#e7e9ee">L’acquéreur peut aussi</text>
<text x="16" y="267" font-size="16" font-weight="400" fill="#e7e9ee">mandater un recouvreur.</text>
</svg>
