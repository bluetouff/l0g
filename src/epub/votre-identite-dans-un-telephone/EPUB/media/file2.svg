<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 360 1040" width="100%" role="img" aria-labelledby="alt-cost-fr-title alt-cost-fr-desc" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" style="display:block;width:100%;height:auto;overflow:hidden;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#0c0d10">
<title id="alt-cost-fr-title">Comparaison publiée des parcours FranceConnect+ et de leurs alternatives</title>
<desc id="alt-cost-fr-desc">Quatre démarches sont comparées. Les parcours alternatifs ajoutent selon le service des semaines, une signature externe ou un déplacement.</desc>
<rect x="1" y="1" width="358" height="1038" rx="14" fill="#0c0d10" stroke="#2b3038"/>
<text x="18" y="31" fill="#f5f6f8" font-size="15.5" font-weight="700">PARCOURS OFFICIELS COMPARÉS</text>
<text x="18" y="53" fill="#8b909b" font-size="9.5">Conditions officielles au 28 août 2026.</text>
<text x="18" y="67" fill="#8b909b" font-size="9.5">Pas des temps mesurés par l0g.</text>

<rect x="14" y="88" width="332" height="210" rx="12" fill="#101319" stroke="#5eead4"/>
<text x="28" y="116" fill="#5eead4" font-size="13" font-weight="700">MON COMPTE FORMATION</text>
<rect x="28" y="132" width="304" height="58" rx="8" fill="#10211f" stroke="#2e8f82"/>
<text x="40" y="153" fill="#5eead4" font-size="10.5" font-weight="700">FRANCECONNECT+</text>
<text x="40" y="174" fill="#f5f6f8" font-size="10.5">Identité renforcée : parcours d’achat</text>
<rect x="28" y="200" width="304" height="72" rx="8" fill="#21151c" stroke="#ff85ad"/>
<text x="40" y="221" fill="#ff85ad" font-size="10.5" font-weight="700">ALTERNATIVE PUBLIÉE</text>
<text x="40" y="242" fill="#f5f6f8" font-size="10.5">Contrôle manuel : environ 4 semaines</text>
<text x="40" y="260" fill="#aeb4bf" font-size="9.5">La procédure papier peut durer davantage.</text>
<text x="28" y="287" fill="#6f7580" font-size="8.5">Source : Mon Compte Formation.</text>

<rect x="14" y="316" width="332" height="210" rx="12" fill="#101319" stroke="#7aa2f7"/>
<text x="28" y="344" fill="#7aa2f7" font-size="13" font-weight="700">FRANCE RÉNOV’</text>
<rect x="28" y="360" width="304" height="58" rx="8" fill="#141a28" stroke="#506fb2"/>
<text x="40" y="381" fill="#7aa2f7" font-size="10.5" font-weight="700">FRANCECONNECT+ RECOMMANDÉ</text>
<text x="40" y="402" fill="#f5f6f8" font-size="10.5">Compte sécurisé : parcours d’aide</text>
<rect x="28" y="428" width="304" height="72" rx="8" fill="#21151c" stroke="#ff85ad"/>
<text x="40" y="449" fill="#ff85ad" font-size="10.5" font-weight="700">ALTERNATIVE PUBLIÉE</text>
<text x="40" y="470" fill="#f5f6f8" font-size="10.5">Compte par courriel : contrôle postal</text>
<text x="40" y="488" fill="#aeb4bf" font-size="9.5">Vérification pouvant prendre 2 semaines.</text>
<text x="28" y="515" fill="#6f7580" font-size="8.5">Source : portail France Rénov’.</text>

<rect x="14" y="544" width="332" height="210" rx="12" fill="#101319" stroke="#f5b13d"/>
<text x="28" y="572" fill="#f5b13d" font-size="13" font-weight="700">GUICHET UNIQUE INPI</text>
<rect x="28" y="588" width="304" height="58" rx="8" fill="#1b1b14" stroke="#9f7626"/>
<text x="40" y="609" fill="#f5b13d" font-size="10.5" font-weight="700">FRANCECONNECT+</text>
<text x="40" y="630" fill="#f5f6f8" font-size="10.5">Confirmation et signature dans le portail</text>
<rect x="28" y="656" width="304" height="72" rx="8" fill="#21151c" stroke="#ff85ad"/>
<text x="40" y="677" fill="#ff85ad" font-size="10.5" font-weight="700">ALTERNATIVE PUBLIÉE</text>
<text x="40" y="698" fill="#f5f6f8" font-size="10.5">Certificat qualifié et signature externe</text>
<text x="40" y="716" fill="#aeb4bf" font-size="9.5">PDF à télécharger, signer et réimporter.</text>
<text x="28" y="743" fill="#6f7580" font-size="8.5">Source : INPI. Aucun délai moyen publié.</text>

<rect x="14" y="772" width="332" height="210" rx="12" fill="#101319" stroke="#a78bfa"/>
<text x="28" y="800" fill="#a78bfa" font-size="13" font-weight="700">PROCURATION DE VOTE</text>
<rect x="28" y="816" width="304" height="58" rx="8" fill="#171426" stroke="#7561b4"/>
<text x="40" y="837" fill="#a78bfa" font-size="10.5" font-weight="700">FRANCE IDENTITÉ CERTIFIÉE</text>
<text x="40" y="858" fill="#f5f6f8" font-size="10.5">Demande complète sans contrôle physique</text>
<rect x="28" y="884" width="304" height="72" rx="8" fill="#21151c" stroke="#ff85ad"/>
<text x="40" y="905" fill="#ff85ad" font-size="10.5" font-weight="700">ALTERNATIVE PUBLIÉE</text>
<text x="40" y="926" fill="#f5f6f8" font-size="10.5">Demande en ligne ou papier</text>
<text x="40" y="944" fill="#aeb4bf" font-size="9.5">Puis contrôle d’identité en personne.</text>
<text x="28" y="971" fill="#6f7580" font-size="8.5">Source : Service-Public.</text>

<rect x="14" y="999" width="332" height="24" rx="7" fill="#15171b" stroke="#343943"/>
<text x="180" y="1015" text-anchor="middle" fill="#aeb4bf" font-size="8.5">Une alternative publiée n’est pas encore une performance mesurée.</text>
</svg>
