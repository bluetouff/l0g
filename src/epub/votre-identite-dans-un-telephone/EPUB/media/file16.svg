<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 360 790" width="100%" role="img" aria-labelledby="unit-fr-title unit-fr-desc" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" style="display:block;width:100%;height:auto;overflow:hidden;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#0c0d10">
<title id="unit-fr-title">UN CENTIME MULTIPLIÉ PAR DES MILLIONS</title>
<desc id="unit-fr-desc">Modèle de sensibilité théorique appliqué à 9,6 millions de connexions annuelles, sans estimation des tarifs actuels.</desc>
<rect x="1" y="1" width="358" height="788" rx="16" fill="#0c0d10" stroke="#2b3038"/>
<text x="18" y="40" fill="#f5f6f8" font-size="13.5" font-weight="700">UN CENTIME MULTIPLIÉ</text>
<text x="18" y="60" fill="#f5f6f8" font-size="13.5" font-weight="700">PAR DES MILLIONS</text>
<text x="18" y="82" fill="#8b909b" font-size="8.4">9,6 M de connexions annuelles, hypothèse de rythme constant</text>
<rect x="20" y="112" width="320" height="88" rx="12" fill="#15171b" stroke="#3a4049"/>
<text x="36" y="140" fill="#f5f6f8" font-size="10" font-weight="700">FORMULE</text>
<text x="36" y="166" fill="#aeb4bf" font-size="8.8">connexions annuelles × prix unitaire</text>
<rect x="22" y="232" width="316" height="112" rx="12" fill="#10211f" stroke="#5eead4"/>
<text x="38" y="260" fill="#5eead4" font-size="10.5" font-weight="700">0,01 € PAR CONNEXION</text>
<text x="38" y="294" fill="#f5f6f8" font-size="20" font-weight="700">96 000 € / AN</text>
<text x="38" y="322" fill="#6f7580" font-size="8.3">Scénario mathématique, pas un tarif observé</text>
<rect x="22" y="372" width="316" height="112" rx="12" fill="#1b1b14" stroke="#f5b13d"/>
<text x="38" y="400" fill="#f5b13d" font-size="10.5" font-weight="700">0,05 € PAR CONNEXION</text>
<text x="38" y="434" fill="#f5f6f8" font-size="20" font-weight="700">480 000 € / AN</text>
<text x="38" y="462" fill="#6f7580" font-size="8.3">Scénario mathématique, pas un tarif observé</text>
<rect x="22" y="512" width="316" height="112" rx="12" fill="#171217" stroke="#ff4d87"/>
<text x="38" y="540" fill="#ff85ad" font-size="10.5" font-weight="700">0,10 € PAR CONNEXION</text>
<text x="38" y="574" fill="#f5f6f8" font-size="20" font-weight="700">960 000 € / AN</text>
<text x="38" y="602" fill="#6f7580" font-size="8.3">Scénario mathématique, pas un tarif observé</text>
<rect x="16" y="670" width="328" height="86" rx="10" fill="#15171b" stroke="#3a4049"/>
<text x="32" y="698" fill="#f5f6f8" font-size="9.1" font-weight="700">INCONNU AU 28 AOÛT 2026</text>
<text x="32" y="724" fill="#aeb4bf" font-size="8.2">Part facturée, prix réel, forfaits, remises,</text>
<text x="32" y="742" fill="#aeb4bf" font-size="8.2">échecs payants et répartition public/privé.</text>
</svg>
