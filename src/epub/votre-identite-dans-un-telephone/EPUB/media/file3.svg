<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 360 620" width="100%" role="img" aria-labelledby="a11y-fr-title a11y-fr-desc" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" style="display:block;width:100%;height:auto;overflow:hidden;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#0c0d10">
<title id="a11y-fr-title">Derniers audits chiffrés d’accessibilité publiés pour France Identité</title>
<desc id="a11y-fr-desc">Les audits du 23 mai 2025 portaient sur des versions de préproduction. iOS respectait 35,14 pour cent des critères applicables et Android 36,11 pour cent.</desc>
<rect x="1" y="1" width="358" height="618" rx="14" fill="#0c0d10" stroke="#2b3038"/>
<text x="18" y="31" fill="#f5f6f8" font-size="15" font-weight="700">ACCESSIBILITÉ : DERNIER AUDIT CHIFFRÉ</text>
<text x="18" y="53" fill="#8b909b" font-size="9.5">RAAM 1.0, 23 mai 2025, versions de préproduction</text>

<rect x="16" y="82" width="328" height="156" rx="12" fill="#101319" stroke="#7aa2f7"/>
<text x="30" y="111" fill="#7aa2f7" font-size="13" font-weight="700">iOS</text>
<text x="330" y="111" text-anchor="end" fill="#f5f6f8" font-size="19" font-weight="700">35,14 %</text>
<text x="30" y="134" fill="#aeb4bf" font-size="9.5">des critères applicables respectés</text>
<rect x="30" y="156" width="300" height="15" rx="7.5" fill="#242934"/>
<rect x="30" y="156" width="105.42" height="15" rx="7.5" fill="#7aa2f7"/>
<text x="30" y="199" fill="#ff85ad" font-size="11" font-weight="700">ÉTAT : NON CONFORME</text>
<text x="30" y="219" fill="#8b909b" font-size="9">Audit externe publié par France Titres.</text>

<rect x="16" y="256" width="328" height="156" rx="12" fill="#101319" stroke="#5eead4"/>
<text x="30" y="285" fill="#5eead4" font-size="13" font-weight="700">ANDROID</text>
<text x="330" y="285" text-anchor="end" fill="#f5f6f8" font-size="19" font-weight="700">36,11 %</text>
<text x="30" y="308" fill="#aeb4bf" font-size="9.5">des critères applicables respectés</text>
<rect x="30" y="330" width="300" height="15" rx="7.5" fill="#242934"/>
<rect x="30" y="330" width="108.33" height="15" rx="7.5" fill="#5eead4"/>
<text x="30" y="373" fill="#ff85ad" font-size="11" font-weight="700">ÉTAT : NON CONFORME</text>
<text x="30" y="393" fill="#8b909b" font-size="9">Audit externe publié par France Titres.</text>

<rect x="16" y="430" width="328" height="130" rx="12" fill="#1b1b14" stroke="#f5b13d"/>
<text x="30" y="457" fill="#f5b13d" font-size="11" font-weight="700">À NE PAS CONFONDRE</text>
<text x="30" y="481" fill="#f5f6f8" font-size="9.5">• Ce n’est pas un taux d’utilisateurs capables.</text>
<text x="30" y="502" fill="#f5f6f8" font-size="9.5">• Ce n’est pas un audit daté d’août 2026.</text>
<text x="30" y="523" fill="#f5f6f8" font-size="9.5">• La préproduction pouvait différer du public.</text>
<text x="30" y="544" fill="#aeb4bf" font-size="9">La page consultée n’affiche pas de nouveau score mobile.</text>

<text x="18" y="584" fill="#6f7580" font-size="8.5">Source : déclaration d’accessibilité France Identité.</text>
<text x="18" y="600" fill="#6f7580" font-size="8.5">Consultation : 28 août 2026.</text>
</svg>
