<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 360 810" width="100%" role="img" aria-labelledby="double-fr-title double-fr-desc" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" style="display:block;width:100%;height:auto;overflow:hidden;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#0c0d10">
<title id="double-fr-title">DEUX CHRONOMÈTRES, UN RISQUE</title>
<desc id="double-fr-desc">Le temps de récupération technique doit être comparé au temps restant avant l’échéance économique</desc>
<rect x="1" y="1" width="358" height="808" rx="16" fill="#0c0d10" stroke="#2b3038"/>
<text x="18" y="42" fill="#f5f6f8" font-size="15" font-weight="700">DEUX CHRONOMÈTRES, UN RISQUE</text>
<text x="18" y="65" fill="#8b909b" font-size="8.5">Le dommage apparaît quand le second expire d’abord</text>
<rect x="16" y="96" width="328" height="222" rx="14" fill="#10211f" stroke="#5eead4"/>
<text x="32" y="126" fill="#5eead4" font-size="11" font-weight="700">HORLOGE TECHNIQUE</text>
<text x="32" y="154" fill="#f5f6f8" font-size="9.3">Ancien moyen invalidé</text>
<text x="32" y="177" fill="#f5f6f8" font-size="9.3">Identité de base reconstruite</text>
<text x="32" y="200" fill="#f5f6f8" font-size="9.3">Certification éventuellement restaurée</text>
<text x="32" y="223" fill="#f5f6f8" font-size="9.3">Service final à nouveau accessible</text>
<rect x="32" y="248" width="196" height="28" rx="6" fill="#17322d"/>
<text x="130" y="267" text-anchor="middle" fill="#5eead4" font-size="8.2" font-weight="700">DÉLAI COMPLET NON PUBLIÉ</text>
<text x="32" y="298" fill="#6f7580" font-size="7.8">48 h concerne le résultat d’une certification</text>
<path d="M180 330 V364" stroke="#f5b13d" stroke-width="2.5"/>
<path d="M174 356 L180 366 L186 356" fill="#f5b13d"/>
<rect x="16" y="374" width="328" height="300" rx="14" fill="#21151c" stroke="#ff85ad"/>
<text x="32" y="404" fill="#ff85ad" font-size="11" font-weight="700">HORLOGE ÉCONOMIQUE</text>
<text x="32" y="434" fill="#f5f6f8" font-size="9.2">CPF, parcours alternatif</text>
<text x="32" y="454" fill="#aeb4bf" font-size="8.4">48 h à 4 semaines selon la méthode</text>
<line x1="32" y1="474" x2="328" y2="474" stroke="#3a2931"/>
<text x="32" y="500" fill="#f5f6f8" font-size="9.2">France Rénov’, compte par e-mail</text>
<text x="32" y="520" fill="#aeb4bf" font-size="8.4">Vérification postale : jusqu’à 2 semaines</text>
<line x1="32" y1="540" x2="328" y2="540" stroke="#3a2931"/>
<text x="32" y="566" fill="#f5f6f8" font-size="9.2">INPI, modification ou cessation</text>
<text x="32" y="586" fill="#aeb4bf" font-size="8.4">Alternative : certificat qualifié</text>
<text x="32" y="607" fill="#aeb4bf" font-size="8.4">et signature électronique avancée</text>
<rect x="32" y="628" width="266" height="28" rx="6" fill="#35202b"/>
<text x="165" y="647" text-anchor="middle" fill="#ff85ad" font-size="8.2" font-weight="700">ÉCHÉANCE PROPRE À CHAQUE DOSSIER</text>
<rect x="14" y="712" width="332" height="76" rx="8" fill="#15171b" stroke="#3a4049"/>
<text x="26" y="733" fill="#aeb4bf" font-size="7.8">Les délais publiés décrivent les alternatives,</text>
<text x="26" y="749" fill="#aeb4bf" font-size="7.8">pas la récupération actuelle de France Identité.</text>
<text x="26" y="769" fill="#6f7580" font-size="7.6">La perte dépend de la date réelle du dossier.</text>
</svg>
