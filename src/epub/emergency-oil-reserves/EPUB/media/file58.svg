<title id="reserves05-en-3-panel1-dark-title">March: principal and premium due back</title><desc id="reserves05-en-3-panel1-dark-desc">DOE commitment announced on 20 March 2026: 45.2 million barrels awarded, 55.0 due back, including a premium of 9.8, or 21.7% of principal. Future return, with no observed receipt.</desc><metadata>{"edition": "2026-10-03", "sources": [{"id": "S03", "publisher": "US Department of Energy", "title": "SPR Sales and Exchanges", "url": "https://www.energy.gov/hgeo/opr/spr-sales-and-exchanges", "reference_period": "Présentation générale, consultée le 3 octobre 2026"}, {"id": "S08", "publisher": "US Department of Energy", "title": "Energy Department Begins Delivering SPR Barrels at Record Speeds", "url": "https://www.energy.gov/hgeo/articles/energy-department-begins-delivering-spr-barrels-record-speeds", "reference_period": "Attributions et premier départ annoncés le 20 mars 2026"}, {"id": "S14", "publisher": "US Department of Energy", "title": "Energy Department Awards Contracts from the Strategic Petroleum Reserve, Advancing President Trump’s Historic Emergency Exchange", "url": "https://www.energy.gov/hgeo/opr/articles/energy-department-awards-contracts-strategic-petroleum-reserve-advancing", "reference_period": "Attribution du 11 mai et bilan déclaré à cette date"}], "convention": "Two DOE exchange awards. March: 45.2 principal plus 9.8 future premium, total return 55. May: 53.3 plus 15.1, total return 68.4. Million barrels. Ratios are not annualised; returns are promised, not received."}</metadata>
