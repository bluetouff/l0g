<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 620" role="img" aria-labelledby="reserves02-en-1-mobile-title reserves02-en-1-mobile-desc" lang="en"><title id="reserves02-en-1-mobile-title">Who holds which key?</title><desc id="reserves02-en-1-mobile-desc">Release chain described at the 8 April 2026 hearing: distributor request, DGEC approval, SAGESS makes supplies available and fuel is collected from storage. Lenders fund debt; operators cover costs through the CPSSP. No delivery time or quantity is represented.</desc><rect x="0" y="0" width="480" height="620" fill="#0c0d10" rx="12"></rect><rect x="0" y="0" width="480" height="4" fill="#5eead4"></rect><text x="24" y="32" fill="#5eead4" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start">l0g / OIL RESERVES / 02.1</text><text x="24" y="68" fill="#e7e9ee" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">Who holds which key?</text><text x="24" y="102" fill="#8b909b" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Request, approval, release of supplies.</text><rect x="24" y="142" width="200" height="130" fill="#121419" rx="9" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.2" data-card="actor"></rect><rect x="24" y="142" width="4" height="130" fill="#ff4d87"></rect><g transform="translate(38 160) scale(0.56)" data-icon="truck"><path d="M2 9 H29 V34 H2 Z M29 18 H39 L48 27 V34 H29" fill="none" stroke="#ff4d87" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="11" cy="37" r="5" fill="#121419" stroke="#ff4d87" stroke-width="2"></circle><circle cx="38" cy="37" r="5" fill="#121419" stroke="#ff4d87" stroke-width="2"></circle></g><text x="76" y="180" fill="#ff4d87" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start">Distributor</text><text x="40" y="218" fill="#e7e9ee" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Requests then</text><text x="40" y="243" fill="#e7e9ee" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">collects supplies</text><rect x="256" y="142" width="200" height="130" fill="#121419" rx="9" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.2" data-card="actor"></rect><rect x="256" y="142" width="4" height="130" fill="#7aa2f7"></rect><g transform="translate(270 160) scale(0.56)" data-icon="state"><path d="M2 12 L22 2 L42 12 H2 M2 48 H42 M9 18 V40 M22 18 V40 M35 18 V40" fill="none" stroke="#7aa2f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><text x="308" y="180" fill="#7aa2f7" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start">DGEC / State</text><text x="272" y="218" fill="#e7e9ee" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Approves the</text><text x="272" y="243" fill="#e7e9ee" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">release</text><rect x="24" y="310" width="200" height="130" fill="#121419" rx="9" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.2" data-card="actor"></rect><rect x="24" y="310" width="4" height="130" fill="#f5b13d"></rect><g transform="translate(38 328) scale(0.56)" data-icon="depot"><ellipse cx="22" cy="10" rx="20" ry="8" fill="none" stroke="#f5b13d" stroke-width="2"></ellipse><path d="M2 10 V40 Q22 56 42 40 V10 M2 25 Q22 40 42 25 M42 35 H51 V44" fill="none" stroke="#f5b13d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><text x="76" y="348" fill="#f5b13d" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start">Storage site</text><text x="40" y="386" fill="#e7e9ee" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Stores oil</text><text x=