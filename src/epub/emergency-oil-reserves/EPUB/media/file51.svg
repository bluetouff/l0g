<marker id="reserves05-en-1-panel2-dark-i" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="#e7e9ee"></path></marker>
