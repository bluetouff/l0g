<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 516 400 340" role="img" aria-labelledby="reserves05-en-1-panel2-dark-title reserves05-en-1-panel2-dark-desc" data-figure="1" data-diagram="release-contracts" data-as-of="2026-10-03" data-scale="qualitative" data-observed-flows="unavailable" width="400" height="340" data-crop-start="516" data-crop-end="856" data-panel="2">
<title id="reserves05-en-1-panel2-dark-title">SPR exchange: principal and premium</title><desc id="reserves05-en-1-panel2-dark-desc">Qualitative SPR exchange: oil is awarded to a borrower, with future return of principal plus an oil premium. Dashed lines indicate a future return.</desc><metadata>{"edition": "2026-10-03", "sources": [{"id": "S03", "publisher": "US Department of Energy", "title": "SPR Sales and Exchanges", "url": "https://www.energy.gov/hgeo/opr/spr-sales-and-exchanges", "reference_period": "Présentation générale, consultée le 3 octobre 2026"}, {"id": "S04", "publisher": "SAGESS", "title": "Fournir", "url": "https://www.sagess.fr/fr/logistique/constituer-des-stocks-prives-pour-parer-aux-penuries/fournir", "reference_period": "Procédure générale publiée par l’opérateur ; consultation du 3 octobre 2026"}, {"id": "S05", "publisher": "International Energy Agency", "title": "France Oil Security Policy", "url": "https://www.iea.org/articles/france-oil-security-policy", "reference_period": "Évaluation institutionnelle publiée en juin 2022"}, {"id": "S22", "publisher": "Ministère français chargé de l’énergie", "title": "La chaîne pétrolière", "url": "https://www.ecologie.gouv.fr/politiques-publiques/chaine-petroliere", "reference_period": "Description institutionnelle ; données de dates hétérogènes"}], "convention": "Qualitative routes: US sale for payment; US exchange for return plus premium; SAGESS temporary allocation with in-tank return. Arrows are not proportional. No French fee is assumed."}</metadata>
