<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" role="img" aria-labelledby="reserves02-en-3-wide-title reserves02-en-3-wide-desc" lang="en" font-family="Arial, Helvetica, sans-serif">
<title id="reserves02-en-3-wide-title">SAGESS: the debt repayment calendar</title>
<desc id="reserves02-en-3-wide-desc">At 31 December 2025, nominal external debt of 4,145 million euros, excluding the CPSSP loan and interest payable: 3,600 million of bonds and 545 million of short-term NEU CP. Bond principal due: 500 million in 2027, 600 in 2028, 500 each year from 2029 to 2031 and 1,000 in 2032. Vertical bars use a linear scale starting at zero. A 1,000 million undrawn bank facility is separate from drawn debt. The February 2026 issue is excluded from this historical snapshot.</desc>
