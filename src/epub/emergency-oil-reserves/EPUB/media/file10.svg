<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="reserves02-en-2-wide-title reserves02-en-2-wide-desc" lang="en"><title id="reserves02-en-2-wide-title">Two ways to share the obligation</title><desc id="reserves02-en-2-wide-desc">Two alternatives for approved operators in metropolitan France: CPSSP 56% and direct 44%, or CPSSP 90% and direct 10%. Each obligation is normalised to 100%. These shares do not measure physical inventories.</desc><rect x="0" y="0" width="960" height="560" fill="#0c0d10" rx="12"></rect><rect x="0" y="0" width="960" height="4" fill="#5eead4"></rect><text x="28" y="32" fill="#5eead4" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start">l0g / OIL RESERVES / 02.2</text><text x="28" y="74" fill="#e7e9ee" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" text-anchor="start">Two ways to share the obligation</text><text x="28" y="110" fill="#8b909b" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Approved operators in metropolitan France · each obligation = 100%</text><rect x="28" y="138" width="14" height="14" fill="#5eead4" rx="2"></rect><text x="52" y="153" fill="#5eead4" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start">CPSSP</text><rect x="508" y="138" width="14" height="14" fill="#ff4d87" rx="2"></rect><text x="532" y="153" fill="#ff4d87" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start">Direct responsibility</text><text x="28" y="233" fill="#e7e9ee" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start">Option A</text><rect x="168.0" y="195" width="425.6" height="60" fill="#5eead4" data-value="56" data-share="delegated" data-arrangement="A"></rect><text x="380.8" y="236" fill="#0c0d10" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" text-anchor="middle" data-percentage="56">56%</text><rect x="593.6" y="195" width="334.4" height="60" fill="#ff4d87" data-value="44" data-share="direct" data-arrangement="A"></rect><text x="760.8" y="236" fill="#0c0d10" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" text-anchor="middle" data-percentage="44">44%</text><text x="28" y="358" fill="#e7e9ee" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start">Option B</text><rect x="168.0" y="320" width="684.0" height="60" fill="#5eead4" data-value="90" data-share="delegated" data-arrangement="B"></rect><text x="510.0" y="361" fill="#0c0d10" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" text-anchor="middle" data-percentage="90">90%</text><rect x="852.0" y="320" width="76.0" height="60" fill="#ff4d87" data-value="10" data-share="direct" data-arrangement="B"></rect><text x="890.0" y="361" fill="#0c0d10" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" text-anchor="middle" data-percentage="10">10%</text><path d="M168.0 394 V400" fill="none" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path><text x="168.0" y="416" fill="#8b909b" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">0</text><path d="M358.0 394 V400" fill="none" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path><text x="358.0" y="416" fill="#8b909b" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="middle">25</text><path d="M548.0 394 V400" fill="none" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path><text x="548.0" y="416" fill="#8b909b" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="middle">50</text><path d="M738.0 394 V400" fill="none" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path><text x="738.0" y="416" fill="#8b909b" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="middle">75</text><path d="M928.0 394 V400" fill="none" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path><text x="928.0" y="416" fill="#8b909b" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="end">100%</text><rect x="28" y="448" width="430" height="96" fill="#121419" rx="9" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.2" data-card="coverage"></rect><rect x="28" y="448" width="430" height="3" fill="#5eead4"></rect><text x="46" y="480" fill="#5eead4" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start">Collective provision</text><text x="46" y="506" fill="#e7e9ee" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">SAGESS stocks and</text><text x="46" y="531" fill="#e7e9ee" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">availability agreements.</text><rect x="480" y="448" width="452" height="96" fill="#121419" rx="9" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.2" data-card="coverage"></rect><rect x="480" y="448" width="452" height="3" fill="#ff4d87"></rect><text x="498" y="480" fill="#ff4d87" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start">Direct responsibility</text><text x="498" y="506" fill="#e7e9ee" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Owned stocks or rights</text><text x="498" y="531" fill="#e7e9ee" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">to acquire a third party’s oil.</text></svg>