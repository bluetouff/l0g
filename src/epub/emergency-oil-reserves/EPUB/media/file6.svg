<text x="60" y="288" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#8b909b" text-anchor="start">Collective implementation of</text>
<text x="60" y="313" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#8b909b" text-anchor="start">March pledges</text>
