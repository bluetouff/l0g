<text x="44" y="37" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#e7e9ee" text-anchor="start">l0g.</text>
<text x="1076" y="35" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#8b909b" text-anchor="end">RESERVES / 05 · 01</text>
