<title id="reserves05-en-1-wide-title">Three contracts that release oil</title><desc id="reserves05-en-1-wide-desc">Qualitative routes: US sale for payment; US exchange for return plus premium; SAGESS temporary allocation with in-tank return. Arrows are not proportional. No French fee is assumed.</desc><metadata>{"edition": "2026-10-03", "sources": [{"id": "S03", "publisher": "US Department of Energy", "title": "SPR Sales and Exchanges", "url": "https://www.energy.gov/hgeo/opr/spr-sales-and-exchanges", "reference_period": "Présentation générale, consultée le 3 octobre 2026"}, {"id": "S04", "publisher": "SAGESS", "title": "Fournir", "url": "https://www.sagess.fr/fr/logistique/constituer-des-stocks-prives-pour-parer-aux-penuries/fournir", "reference_period": "Procédure générale publiée par l’opérateur ; consultation du 3 octobre 2026"}, {"id": "S05", "publisher": "International Energy Agency", "title": "France Oil Security Policy", "url": "https://www.iea.org/articles/france-oil-security-policy", "reference_period": "Évaluation institutionnelle publiée en juin 2022"}, {"id": "S22", "publisher": "Ministère français chargé de l’énergie", "title": "La chaîne pétrolière", "url": "https://www.ecologie.gouv.fr/politiques-publiques/chaine-petroliere", "reference_period": "Description institutionnelle ; données de dates hétérogènes"}], "convention": "Qualitative routes: US sale for payment; US exchange for return plus premium; SAGESS temporary allocation with in-tank return. Arrows are not proportional. No French fee is assumed."}</metadata>
