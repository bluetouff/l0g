(255, 255, 255, 0.20)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path><text x="348.0" y="386" fill="#8b909b" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="middle">75</text><path d="M456.0 364 V370" fill="none" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path><text x="456.0" y="386" fill="#8b909b" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="end">100%</text><rect x="24" y="416" width="208" height="106" fill="#121419" rx="9" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.2" data-card="coverage"></rect><rect x="24" y="416" width="208" height="3" fill="#5eead4"></rect><text x="40" y="448" fill="#5eead4" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start">Collective</text><text x="40" y="477" fill="#e7e9ee" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">SAGESS stocks</text><text x="40" y="503" fill="#e7e9ee" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">and contracts</text><rect x="248" y="416" width="208" height="106" fill="#121419" rx="9" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.2" data-card="coverage"></rect><rect x="248" y="416" width="208" height="3" fill="#ff4d87"></rect><text x="264" y="448" fill="#ff4d87" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start">Direct</text><text x="264" y="477" fill="#e7e9ee" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Owned stocks</text><text x="264" y="503" fill="#e7e9ee" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">or purchase rights</text></svg>