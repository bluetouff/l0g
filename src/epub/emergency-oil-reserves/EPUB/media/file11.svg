<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 550" role="img" aria-labelledby="reserves02-en-2-mobile-title reserves02-en-2-mobile-desc" lang="en"><title id="reserves02-en-2-mobile-title">Sharing the obligation</title><desc id="reserves02-en-2-mobile-desc">Two alternatives for approved operators in metropolitan France: CPSSP 56% and direct 44%, or CPSSP 90% and direct 10%. Each obligation is normalised to 100%. These shares do not measure physical inventories.</desc><rect x="0" y="0" width="480" height="550" fill="#0c0d10" rx="12"></rect><rect x="0" y="0" width="480" height="4" fill="#5eead4"></rect><text x="24" y="32" fill="#5eead4" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start">l0g / OIL RESERVES / 02.2</text><text x="24" y="68" fill="#e7e9ee" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">Sharing the obligation</text><text x="24" y="102" fill="#8b909b" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Two alternatives · obligation = 100%</text><rect x="24" y="126" width="14" height="14" fill="#5eead4" rx="2"></rect><text x="48" y="141" fill="#5eead4" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start">CPSSP</text><rect x="224" y="126" width="14" height="14" fill="#ff4d87" rx="2"></rect><text x="248" y="141" fill="#ff4d87" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start">Direct share</text><text x="24" y="176" fill="#e7e9ee" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start">Option A</text><rect x="24.0" y="192" width="241.92" height="54" fill="#5eead4" data-value="56" data-share="delegated" data-arrangement="A"></rect><text x="144.95999999999998" y="229" fill="#0c0d10" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" text-anchor="middle" data-percenta