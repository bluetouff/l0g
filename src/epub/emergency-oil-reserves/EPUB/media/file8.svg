<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" role="img" aria-labelledby="reserves02-en-1-wide-title reserves02-en-1-wide-desc" lang="en"><title id="reserves02-en-1-wide-title">Who holds which key?</title><desc id="reserves02-en-1-wide-desc">Release chain described at the 8 April 2026 hearing: distributor request, DGEC approval, SAGESS makes supplies available and fuel is collected from storage. Lenders fund debt; operators cover costs through the CPSSP. No delivery time or quantity is represented.</desc><rect x="0" y="0" width="960" height="650" fill="#0c0d10" rx="12"></rect><rect x="0" y="0" width="960" height="4" fill="#5eead4"></rect><text x="28" y="32" fill="#5eead4" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start">l0g / OIL RESERVES / 02.1</text><text x="28" y="74" fill="#e7e9ee" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" text-anchor="start">Who holds which key?</text><text x="28" y="110" fill="#8b909b" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Rights, physical fuel and the two flows of money.</text><rect x="28" y="155" width="336" height="106" fill="#121419" rx="9" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.2" data-card="actor"></rect><rect x="28" y="155" width="4" height="106" fill="#7aa2f7"></rect><g transform="translate(46 177) scale(0.84)" data-icon="state"><path d="M2 12 L22 2 L42 12 H2 M2 48 H42 M9 18 V40 M22 18 V40 M35 18 V40" fill="none" stroke="#7aa2f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><text x="104" y="190" fill="#7aa2f7" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">DGEC / State</text><text x="104" y="222" fill="#e7e9ee" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Authorises emergency</text><text x="104" y="247" fill="#e7e9ee" font-family="Arial, Helvet