  <text x="718" y="164" font-size="30" fill="#e7e9ee" font-weight="700" text-anchor="middle">70 + 30 = 100</text>
  <text x="718" y="198" font-size="20" fill="#8b909b" font-weight="400" text-anchor="middle">Physical inventory is unchanged</text>
