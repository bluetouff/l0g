<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" role="img" aria-labelledby="reserves02-en-4-wide-title reserves02-en-4-wide-desc" lang="en" font-family="Arial, Helvetica, sans-serif">
  <title id="reserves02-en-4-wide-title">One stock, two obligations</title>
  <desc id="reserves02-en-4-wide-desc">Fictional example, before B buys. A owns a single physical stock of 100 tonnes. Each square represents one tonne: 70 teal squares cover A’s obligation and 30 amber squares are reserved for B. B pays A for the reservation; A maintains B’s contractual access to the 30 tonnes. The right to buy creates no additional physical stock: 70 plus 30 equals 100 tonnes.</desc>
  <rect x="0" y="0" width="960" height="650" rx="16" fill="#0c0d10"></rect>
  <text x="28" y="46" font-size="30" fill="#e7e9ee" font-weight="700" text-anchor="start">One stock, two obligations</text>
  <text x="28" y="78" font-size="20" fill="#8b909b" font-weight="400" text-anchor="start">Fictional example · 100 tonnes owned by A, before B exercises its right to buy</text>
  <rect x="28" y="104" width="904" height="300" rx="12" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.5"></rect>
