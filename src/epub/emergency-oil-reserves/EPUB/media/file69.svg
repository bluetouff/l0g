<title id="reserves06-en-2-panel2-dark-title">Hypothetical example with unchanged taxes</title><desc id="reserves06-en-2-panel2-dark-desc">Hypothetical example, separate from observations: a fall of ten pre-tax cents per litre, with unchanged excise and 20% VAT, lowers the tax-inclusive price by twelve cents. With full transmission, that saves €6 on fifty litres; this is not a forecast.</desc>
