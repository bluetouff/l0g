<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 776" role="img" aria-labelledby="reserves04-en-3-wide-title reserves04-en-3-wide-desc" data-diagram="donges-selected-notices">
<title id="reserves04-en-3-wide-title">Donges: a restart in stages</title><desc id="reserves04-en-3-wide-desc">Four operator notices in 2026. Publication dates are distinct from scheduled operations. No full-shutdown duration or recovered throughput is inferred.</desc><metadata>{"edition": "2026-10-03", "sources": [{"id": "S02", "publisher": "TotalEnergies Donges", "title": "Grand Arrêt 2026 : manœuvres d’arrêt d’unités", "url": "https://donges.totalenergies.fr/toutes-les-actualites/grand-arret-2026-de-la-raffinerie-de-donges-manoeuvres-darret-dunites", "reference_period": "Manœuvres commencées la semaine de publication, annoncées jusqu’au 17 mai 2026."}, {"id": "S03", "publisher": "TotalEnergies Donges", "title": "Redémarrage progressif des unités de la raffinerie", "url": "https://donges.totalenergies.fr/toutes-les-actualites/redemarrage-progressif-des-unites-de-la-raffinerie-0", "reference_period": "Bulletin du 23 juin 2026 ; référence interne au 20 juin."}, {"id": "S04", "publisher": "TotalEnergies Donges", "title": "Le redémarrage des unités de la raffinerie se poursuit", "url": "https://donges.totalenergies.fr/toutes-les-actualites/le-redemarrage-des-unites-de-la-raffinerie-se-poursuit", "reference_period": "Situation décrite le 3 août 2026."}, {"id": "S05", "publisher": "TotalEnergies Donges", "title": "Raffinerie de Donges : redémarrage d’une unité", "url": "https://donges.totalenergies.fr/toutes-les-actualites/raffinerie-de-donges-redemarrage-dune-unite", "reference_period": "Manœuvres annoncées pour le lundi 10 août 2026."}], "convention": "Four operator notices in 2026. Publication dates are distinct from scheduled operations. No full-shutdown duration or recovered throughput is inferred."}</metadata>
