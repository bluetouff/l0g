<text x="64" y="254" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#e7e9ee" text-anchor="start">Shutdown manoeuvres</text>
<text x="64" y="286" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#8b909b" text-anchor="start">Units shut down for</text>
