<text x="64" y="334" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#8b909b" text-anchor="start">upgrades.</text>
<path d="M606.8684210526316,431 L606.8684210526316,382 L529.5,382 L529.5,364" fill="none" stroke="#5eead4" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"></path>
<circle cx="606.8684210526316" cy="431" r="6" fill="#5eead4" stroke="#121419" stroke-width="2"></circle>
<rect x="367" y="190" width="325" height="174" rx="9" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.5"></rect>
<text x="387" y="221" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#5eead4" text-anchor="start">23 JUNE</text>
<text x="387" y="254" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#e7e9ee" text-anchor="start">A phased restart</text>
<text x="387" y="286" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#8b909b" text-anchor="start">Work is gradually ending and</text>
<text x="387" y="310" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#8b909b" text-anchor="start">equipment is returning to service in</text>
<text x="387" y="334" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#8b909b" text-anchor="start">stages.</text>
<path d="M875.5263157894736,431 L875.5263157894736,446 L855.5,446 L855.5,510" fill="none" stroke="#5eead4" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"></path>
<circle cx="875.5263157894736" cy="431" r="6" fill="#5eead4" stroke="#121419" stroke-width="2"></circle>
<rect x="635" y="510" width="441" height="148" rx="9" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.5"></rect>
<text x="655" y="541" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#5eead4" text-anchor="start">3 AUGUST</text>
<text x="655" y="574" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#e7e9ee" text-anchor="start">Restart continues</text>
<text x="655" y="606" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#8b909b" text-anchor="start">A further notice says that production units are still</text>
<text x="655" y="630" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#8b909b" text-anchor="start">restarting.</text>
<path d="M914.8421052631579,431 L914.8421052631579,382 L903.0,382 L903.0,364" fill="none" stroke="#5eead4" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"></path>
<circle cx="914.8421052631579" cy="431" r="6" fill="#5eead4" stroke="#121419" stroke-width="2"></circle>
<rect x="730" y="190" width="346" height="174" rx="9" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.5"></rect>
<text x="750" y="221" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#5eead4" text-anchor="start">9 AUGUST</text>
<text x="750" y="254" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#e7e9ee" text-anchor="start">One unit starting up</text>
<text x="750" y="286" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#8b909b" text-anchor="start">Further manoeuvres are scheduled</text>
<text x="750" y="310" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#8b909b" text-anchor="start">for the next day, 10 August.</text>
<rect x="44" y="510" width="554" height="148" rx="9" fill="#1a292c"></rect>
<text x="66" y="545" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#e7e9ee" text-anchor="start">Recovered output still has to be measured</text>
<text x="66" y="580" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#e7e9ee" text-anchor="start">These milestones document stages. They establish</text>
<text x="66" y="607" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#e7e9ee" text-anchor="start">neither a continuous full shutdown nor the current</text>
<text x="66" y="634" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#e7e9ee" text-anchor="start">operating rate.</text>
<path d="M44,688 L1076,688" fill="none" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"></path>
<text x="44" y="711" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#8b909b" text-anchor="start">Source: TotalEnergies Donges notices · April to August 2026</text>
<text x="44" y="734" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="start">Axis: publication dates. Announcements are not measurements of production.</text>
</svg>