<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1248" role="img" aria-labelledby="microsoft-cloud-licensing-rights-fr-mobile-title microsoft-cloud-licensing-rights-fr-mobile-desc"><title id="microsoft-cloud-licensing-rights-fr-mobile-title">Deux logiciels, trois voies cloud</title><desc id="microsoft-cloud-licensing-rights-fr-mobile-desc">Service composé de SQL Server et Windows Server, sur infrastructure partagée, avec licences éligibles et Software Assurance ou abonnement actif. Azure permet de réutiliser des licences éligibles via Azure Hybrid Benefit. Un Authorized Outsourcer hors Listed Providers et leurs infrastructures permet le Flexible Virtualization Benefit pour les deux logiciels. Chez AWS ou Google en tant que partenaire de mobilité qualifié, SQL Server peut relever de License Mobility et Windows Server est fourni par l’hébergeur. Les droits historiques et le matériel dédié sont hors de ce schéma simplifié.</desc><rect x="0" y="0" width="400" height="1248" rx="18" fill="#0c0d10" stroke="none" stroke-width="1"></rect><g data-region="eyebrow" data-bounds="24 16 352 34"><text x="32" y="37" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5eead4" text-anchor="start">l0g / DROITS DE DÉPLOIEMENT</text></g><g data-region="heading" data-bounds="24 55 352 85"><text x="32" y="91" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#e7e9ee" text-anchor="start">Deux logiciels,</text><text x="32" y="125" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#e7e9ee" text-anchor="start">trois voies cloud</text></g><g data-region="subtitle" data-bounds="24 141 352 63"><text x="32" y="164" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="start">Exemple de service utilisant SQL Server</text><text x="32" y="187" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="start">et Windows Server, sur matériel mutualisé.</text></g><g data-service="two-product-workload"><rect x="72" y="221" width="256" height="135" rx="12" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.5"></rect></g><g data-region="service-heading" data-bounds="80 228 240 40"><text x="200" y="256" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#e7e9ee" text-anchor="middle">Service métier</text></g><g data-layer="sql"><rect x="88" y="272" width="224" height="31" rx="4" fill="#171a20" stroke="none" stroke-width="1"></rect></g><g data-region="source-product-0" data-bounds="95 270 210 35"><text x="200" y="294" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#5eead4" text-anchor="middle">SQL Server</text></g><g data-layer="windows"><rect x="88" y="310" width="224" height="31" rx="4" fill="#171a20" stroke="none" stroke-width="1"></rect></g><g data-region="source-product-1" data-bounds="95 308 210 35"><text x="200" y="332" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#e7e9ee" text-anchor="middle">Windows Server</text></g><g data-flow-layer="sql"><line x1="193" y1="364" x2="193" y2="379" stroke="#5eead4" stroke-width="1.5"></line><line x1="20" y1="379" x2="193" y2="379" stroke="#5eead4" stroke-width="1.5"></line><line x1="20" y1="379" x2="20" y2="925" stroke="#5eead4" stroke-width="1.5"></line><line x1="20" y1="511" x2="46" y2="511" stroke="#5eead4" stroke-width="2"></line><path d="M38 515 L46 511 L38 507" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><line x1="20" y1="718" x2="46" y2="718" stroke="#5eead4" stroke-width="2"></line><path d="M38 722 L46 718 L38 714" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><line x1="20" y1="925" x2="46" y2="925" stroke="#5eead4" stroke-width="2"></line><path d="M38 929 L46 925 L38 921" fill="none" stroke="#5eead4" 