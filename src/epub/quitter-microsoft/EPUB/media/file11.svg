ont-weight="400" fill="#8b909b" text-anchor="start">Licences éligibles, avec Software Assurance</text><text x="32" y="1091" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#8b909b" text-anchor="start">ou abonnement actif. Vue simplifiée.</text><text x="32" y="1114" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#8b909b" text-anchor="start">Les droits historiques et le matériel dédié</text><text x="32" y="1137" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#8b909b" text-anchor="start">relèvent de conditions distinctes.</text></g><g data-region="rights-source" data-bounds="24 1159 352 65"><text x="32" y="1181" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#8b909b" text-anchor="start">Sources : conditions et guides Microsoft,</text><text x="32" y="1204" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#8b909b" text-anchor="start">vérifiés le 9 octobre 2026.</text></g></svg>