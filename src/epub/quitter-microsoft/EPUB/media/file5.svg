 sans-serif" font-size="16" font-weight="700" fill="#ff4d87" text-anchor="middle">A a été relié à l’identifiant de C.</text></g><g data-region="pair-validation" data-bounds="24 1159 352 86"><text x="32" y="1183" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#5eead4" text-anchor="start">Comparer les paires au fichier d’origine.</text><text x="32" y="1207" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#5eead4" text-anchor="start">Faire vérifier la correspondance</text><text x="32" y="1231" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#5eead4" text-anchor="start">par un second opérateur.</text></g><line x1="32" y1="1273" x2="368" y2="1273" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></line><g data-region="incident-label" data-bounds="24 1290 352 36"><text x="32" y="1311" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#8b909b" text-anchor="start">INCIDENT DOCUMENTÉ · 6–7 AOÛT 2025</text></g><g data-region="incident-count" data-bounds="24 1328 142 80"><text x="32" y="1384" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#e7e9ee" text-anchor="start">790</text></g><g data-region="incident-unit" data-bounds="163 1339 213 70"><text x="171" y="1366" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#e7e9ee" text-anchor="start">comptes affectés</text><text x="171" y="1393" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#e7e9ee" text-anchor="start">selon Dataport</text></g><g data-region="incident-source" data-bounds="24 1428 352 115"><text x="32" y="1450" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#8b909b" text-anchor="start">Le rapport attribue l’incident à un tri partiel</text><text x="32" y="1473" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#8b909b" 