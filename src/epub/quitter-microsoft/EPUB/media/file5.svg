<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1572" role="img" aria-labelledby="microsoft-exit-identity-fr-mobile-title microsoft-exit-identity-fr-mobile-desc"><title id="microsoft-exit-identity-fr-mobile-title">Une mauvaise paire, une autre boîte</title><desc id="microsoft-exit-identity-fr-mobile-desc">Exemple pédagogique avec données fictives : C est associé à ID 03, A à ID 01, B à ID 02. Trier seulement la colonne des adresses donne A avec ID 03, B avec ID 01 et C avec ID 02. Comparer avec les paires d’origine et effectuer un second contrôle permet de vérifier les associations A–01, B–02 et C–03. Séparément, le rapport Dataport du 15 août 2025 documente 790 comptes affectés par un mauvais rapprochement lors de la migration des 6 et 7 août. Les trois lignes fictives ne reproduisent pas ces comptes.</desc><rect x="0" y="0" width="400" height="1572" rx="18" fill="#0c0d10" stroke="none" stroke-width="1"></rect><g data-region="eyebrow" data-bounds="24 16 352 34"><text x="32" y="37" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5eead4" text-anchor="start">l0g / INTÉGRITÉ DE LA MIGRATION</text></g><g data-region="heading" data-bounds="24 55 352 82"><text x="32" y="91" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#e7e9ee" text-anchor="start">Une mauvaise paire,</text><text x="32" y="125" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#e7e9ee" text-anchor="start">une autre boîte</text></g><g data-region="subtitle" data-bounds="24 141 352 63"><text x="32" y="164" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="start">Exemple pédagogique, données fictives.</text><text x="32" y="187" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="start">Adresse et identifiant doivent rester associés.</text></g><g data-region="original-heading" data-bounds="24 208 352 44"><text x="32" y="236" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#e7e9ee" text-anchor="start">01 · Paires d’origine</text></g><rect x="32" y="262" width="336" height="220" rx="10" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></rect><rect x="33" y="263" width="334" height="45" rx="8" fill="#171a20" stroke="none" stroke-width="1"></rect><g data-region="original-left-col" data-bounds="39 263 154 40"><text x="116" y="287" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#8b909b" text-anchor="middle">Adresse</text></g><g data-region="original-right-col" data-bounds="207 263 154 40"><text x="284" y="287" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#8b909b" text-anchor="middle">Identifiant</text></g><g data-pair="original" data-address="C" data-identity="03"><g data-region="original-address-0" data-bounds="44 312 132 43"><text x="110" y="338" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#e7e9ee" text-anchor="middle">Boîte C</text></g><g data-region="original-id-0" data-bounds="222 312 132 43"><text x="288" y="338" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#e7e9ee" text-anchor="middle">ID 03</text></g><line x1="188" y1="336" x2="212" y2="336" stroke="#8b909b" stroke-width="2"></line><path d="M204 340 L212 336 L204 332" fill="none" stroke="#8b909b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><line x1="46" y1="360" x2="354" y2="360" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></line><g data-pair="original" data-address="A" data-identity="01"><g data-region="original-address-1" data-bounds="44 366 132 43"><text x="110" y="392" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#e7e9ee" text-anchor="middle">Boîte A</text></g><g data-region="original-id-1" data-bounds="222 366 132 43"><text x="288" y="392" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#e7e9ee" text-anchor="middle">ID 01</text></g><line x1="188" y1="390" x2="212" y2="390" stroke="#8b909b" stroke-width="2"></line><path d="M204 394 L212 390 L204 386" fill="none" stroke="#8b909b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><line x1="46" y1="414" x2="354" y2="414" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></line><g data-pair="original" data-address="B" data-identity="02"><g data-region="original-address-2" data-bounds="44 420 132 43"><text x="110" y="446" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#e7e9ee" text-anchor="middle">Boîte B</text></g><g data-region="original-id-2" data-bounds="222 420 132 43"><text x="288" y="446" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#e7e9ee" text-anchor="middle">ID 02</text></g><line x1="188" y1="444" x2="212" y2="444" stroke="#8b909b" stroke-width="2"></line><path d="M204 448 L212 444 L204 440" fill="none" stroke="#8b909b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><line x1="200" y1="491" x2="200" y2="514" stroke="#ff4d87" stroke-width="2" stroke-dasharray="4 5"></line><path d="M196 506 L200 514 L204 506" fill="none" stroke="#ff4d87" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><g data-region="broken-heading" data-bounds="24 523 352 44"><text x="32" y="551" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#ff4d87" text-anchor="start">02 · Une colonne triée</text></g><rect x="32" y="577" width="336" height="220" rx="10" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></rect><rect x="33" y="578" width="334" height="45" rx="8" fill="#171a20" stroke="none" stroke-width="1"></rect><g data-region="broken-left-col" data-bounds="39 578 154 40"><text x="116" y="602" font-family="Arial, Helvetica, sans-serif" f