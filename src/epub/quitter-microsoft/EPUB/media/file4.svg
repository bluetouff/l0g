2" y="565" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#8b909b" text-anchor="start">son identifiant.</text></g><g data-region="broken-explainer" data-bounds="348 487 304 89"><text x="356" y="512" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#ff4d87" text-anchor="start">L’ordre des identifiants</text><text x="356" y="538" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#ff4d87" text-anchor="start">n’a pas suivi celui des adresses.</text><text x="356" y="564" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#ff4d87" text-anchor="start">A se retrouve associé à ID 03.</text></g><g data-region="pair-validation" data-bounds="672 487 304 89"><text x="680" y="512" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#5eead4" text-anchor="start">Comparer au fichier d’origine.</text><text x="680" y="538" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#5eead4" text-anchor="start">Faire vérifier les paires</text><text x="680" y="564" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#5eead4" text-anchor="start">par un second opérateur.</text></g><line x1="32" y1="629" x2="968" y2="629" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></line><g data-region="incident-label" data-bounds="24 646 952 36"><text x="32" y="669" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#8b909b" text-anchor="start">INCIDENT DOCUMENTÉ · 6–7 AOÛT 2025</text></g><g data-region="incident-count" data-bounds="24 684 171 80"><text x="32" y="746" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" fill="#e7e9ee" text-anchor="start">790</text></g><g data-region="incident-unit" data-bounds="192 695 768 70"><text x="200" y="724" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#e7e9ee" text-anchor="start">comptes affectés</text><text x="200" y="751" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#e7e9ee" text-anchor="start">selon Dataport</text></g><g data-region="incident-source" data-bounds="24 784 952 68"><text x="32" y="809" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#8b909b" text-anchor="start">Le rapport attribue l’incident à un tri partiel et à l’absence du contrôle à quatre yeux.</text><text x="32" y="835" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#8b909b" text-anchor="start">Source : rapport Dataport du 15 août 2025, annexé à la réponse 20/3628 du Landtag.</text></g></svg>