<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 877" role="img" aria-labelledby="microsoft-exit-identity-fr-desktop-title microsoft-exit-identity-fr-desktop-desc"><title id="microsoft-exit-identity-fr-desktop-title">Une mauvaise paire, une autre boîte</title><desc id="microsoft-exit-identity-fr-desktop-desc">Exemple pédagogique avec données fictives : C est associé à ID 03, A à ID 01, B à ID 02. Trier seulement la colonne des adresses donne A avec ID 03, B avec ID 01 et C avec ID 02. Comparer avec les paires d’origine et effectuer un second contrôle permet de vérifier les associations A–01, B–02 et C–03. Séparément, le rapport Dataport du 15 août 2025 documente 790 comptes affectés par un mauvais rapprochement lors de la migration des 6 et 7 août. Les trois lignes fictives ne reproduisent pas ces comptes.</desc><rect x="0" y="0" width="1000" height="877" rx="18" fill="#0c0d10" stroke="none" stroke-width="1"></rect><g data-region="eyebrow" data-bounds="24 16 952 34"><text x="32" y="39" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#5eead4" text-anchor="start">l0g / INTÉGRITÉ DE LA MIGRATION</text></g><g data-region="heading" data-bounds="24 55 952 59"><text x="32" y="97" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#e7e9ee" text-anchor="start">Une mauvaise paire, une autre boîte</text></g><g data-region="subtitle" data-bounds="24 116 952 40"><text x="32" y="142" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#8b909b" text-anchor="start">Exemple pédagogique, données fictives. Adresse et identifiant doivent rester associés.</text></g><g data-region="original-heading" data-bounds="24 197 304 44"><text x="32" y="226" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#e7e9ee" text-anchor="start">01 · Paires d’origine</text></g><rect x="32" y="251" width="288" height="220" rx="10" fill="#121419" stroke="rgba(255, 255, 255, 0.