<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1650" role="img" aria-labelledby="microsoft-choice-switching-fr-mobile-title microsoft-choice-switching-fr-mobile-desc"><title id="microsoft-choice-switching-fr-mobile-title">Les étapes d’une sortie cloud</title><desc id="microsoft-choice-switching-fr-mobile-desc">Article 25 du Data Act, services couverts. Dès la demande, préavis de deux mois au maximum, puis transition normalement de trente jours calendaires au maximum, avec continuité du service. Si ce délai est techniquement impossible, le fournisseur le justifie et le notifie sous quatorze jours ouvrables à compter de la demande, avec une transition alternative de sept mois au maximum. Le client peut prolonger la transition une fois pour une durée qu’il juge appropriée. Le schéma ne calcule aucune durée totale et ne fixe pas le départ des sept mois. La récupération dure au moins trente jours calendaires après la fin de la transition convenue. L’effacement suit ce délai, ou une date ultérieure convenue, si le changement a réussi. Le contrat est résilié au succès du changement, avec notification au client.</desc><rect x="0" y="0" width="400" height="1650" rx="18" fill="#0c0d10" stroke="none" stroke-width="1"></rect><g data-region="eyebrow" data-bounds="24 16 352 34"><text x="34" y="37" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5eead4" text-anchor="start">l0g / DATA ACT</text></g><g data-region="heading" data-bounds="24 55 352 85"><text x="34" y="91" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#e7e9ee" text-anchor="start">Les étapes</text><text x="34" y="125" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#e7e9ee" text-anchor="start">d’une sortie cloud</text></g><g data-region="subtitle" data-bounds="24 141 352 63"><text x="34" y="164" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="start">Contrat de service couvert · article 25</text><text x="34" y="187" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="start">Délais distincts · schéma sans échelle de temps</text></g><g data-node="notice"><rect x="32" y="220" width="336" height="152" rx="8" fill="#171a20" stroke="none" stroke-width="1"></rect></g><g data-region="notice-stage" data-bounds="40 228 320 38"><text x="50" y="251" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#8b909b" text-anchor="start">PRÉAVIS</text></g><g data-region="notice-duration" data-bounds="40 267 320 56"><text x="50" y="307" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#e7e9ee" text-anchor="start">≤ 2 mois</text></g><g data-region="notice-rule" data-bounds="40 326 320 38"><text x="50" y="350" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#e7e9ee" text-anchor="start">Dès la demande de changement</text></g><g data-edge="notice-to-transition"><path d="M200 380 L200 698" fill="none" stroke="#8b909b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><line x1="200" y1="698" x2="200" y2="720" stroke="#8b909b" stroke-width="2"></line><path d="M196 712 L200 720 L204 712" fill="none" stroke="#8b909b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-node="technical-extension"><rect x="24" y="429" width="156" height="225" rx="8" fill="#121419" stroke="#f5b13d" stroke-width="1"></rect></g><g data-node="customer-extension"><rect x="220" y="429" width="156" height="225" rx="8" fill="#121419" stroke="#5eead4" stroke-width="1"></rect></g><g data-region="technical-label" data-bounds="32 438 140 209"><text x="102" y="459" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" fill="#f5b13d" text-anchor="middle">Impossibilité</text><text x="102" y="486" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" fill="#f5b13d" text-anchor="middle">technique motivée</text><text x="102" y="513" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" fill="#f5b13d" text-anchor="middle">Notification sous</text><text x="102" y="540" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" fill="#f5b13d" text-anchor="middle">14 jours ouvrables</text><text x="102" y="567" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" fill="#f5b13d" text-anchor="middle">dès la demande</text><text x="102" y="594" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" fill="#f5b13d" text-anchor="middle">Transition alternative</text><text x="102" y="621" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" fill="#f5b13d" text-anchor="middle">≤ 7 mois</text></g><g data-region="customer-label" data-bounds="228 448 140 182"><text x="298" y="470" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#5eead4" text-anchor="middle">Choix du client</text><text x="298" y="498" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#5eead4" text-anchor="middle">Une prolongation</text><text x="298" y="526" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#5eead4" text-anchor="middle">de la transition</text><text x="298" y="554" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#5eead4" text-anchor="middle">Durée qu’il juge</text><text x="298" y="582" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#5eead4" text-anchor="middle">appropriée</text></g><g data-edge="technical-to-transition"><path d="M102 662 L102 690 L200 690" fill="none" stroke="#f5b13d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-edge="customer-to-transition"><path d="M298 662 L298 690 L200 690" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-node="transition"><rect x="32" y="730" width="336" height="200" rx="8" fill="#171a20" stroke="none" stroke-width="1"></rect></g><g data-region="transition-stage" data-bounds="40 740 320 38"><text x="50" y="763" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#8b909b" text-anchor="start">TRANSITION</text></g><g data-region="transition-duration" data-bounds="40 781 320 53"><text x="50" y="816" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#e7e9ee" text-anchor="start">≤ 30 jours calendaires</text></g><g data-region="transition-rule" data-bounds="40 841 320 87"><text x="50" y="865" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#e7e9ee" text-anchor="start">Règle normale, après le préavis</text><text x="50" y="891" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#e7e9ee" text-anchor="start">Service maintenu</text><text x="50" y="917" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#e7e9ee" text-anchor="start">Les branches modifient cette période.</text></g><g data-edge="transition-to-retrieval"><line x1="200" y1="938" x2="200" y2="987" stroke="#5eead4" stroke-width="2"></line><path d="M196 979 L200 987 L204 979" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-node="retrieval"><rect x="32" y="997" width="336" height="178" rx="8" fill="#171a20" stroke="none" stroke-width="1"></rect></g><g data-region="retrieval-stage" data-bounds="40 1007 320 38"><text x="50" y="1030" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#8b909b" text-anchor="start">RÉCUPÉRATION</text></g><g data-region="retrieval-duration" data-bounds="40 1048 320 53"><text x="50" y="1083" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#e7e9ee" text-anchor="start">≥ 30 jours calendaires</text></g><g data-region="retrieval-rule" data-bounds="40 1107 320 64"><text x="50" y="1132" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#e7e9ee" text-anchor="start">Après la fin de la transition</text><text x="50" y="1159" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#e7e9ee" text-anchor="start">convenue avec le fournisseur</text></g><g data-edge="retrieval-to-erasure"><line x1="200" y1="1183" x2="200" y2="1223" stroke="#5eead4" stroke-width="2"></line><path d="M196 1215 L200 1223 L204 1215" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-node="erasure"><rect x="32" y="1233" width="336" height="155" rx="8" fill="#171a20" stroke="none" stroke-width="1"></rect></g><g data-region="erasure-stage" data-bounds="40 1243 320 38"><text x="50" y="1266" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#8b909b" text-anchor="start">EFFACEMENT</text></g><g data-region="erasure-rule" data-bounds="40 1285 320 91"><text x="50" y="1310" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#e7e9ee" text-anchor="start">Après le délai de récupération,</text><text x="50" y="1337" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#e7e9ee" text-anchor="start">ou à une date ultérieure convenue,</text><text x="50" y="1364" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#e7e9ee" text-anchor="start">si le changement a réussi.</text></g><g data-region="termination" data-bounds="24 1415 352 110"><text x="34" y="1441" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#5eead4" text-anchor="start">Au succès du changement :</text><text x="34" y="1470" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#5eead4" text-anchor="start">résiliation du contrat,</text><text x="34" y="1499" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#5eead4" text-anchor="start">notifiée par le fournisseur.</text></g><g data-region="switching-source" data-bounds="24 1550 352 72"><text x="34" y="1571" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#8b909b" text-anchor="start">Source : règlement (UE) 2023/2854,</text><text x="34" y="1595" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#8b909b" text-anchor="start">article 25, § 2 à 5.</text></g></svg>