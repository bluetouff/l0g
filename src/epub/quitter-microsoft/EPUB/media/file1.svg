ont-size="16" font-weight="700" fill="#e7e9ee" text-anchor="middle">Fichiers</text></g><g data-region="destination-accounts" data-bounds="272 532 116 38"><text x="330" y="556" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#e7e9ee" text-anchor="middle">Comptes</text></g><g data-region="destination-apps" data-bounds="272 736 116 64"><text x="330" y="758" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#e7e9ee" text-anchor="middle">Apps et</text><text x="330" y="779" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#e7e9ee" text-anchor="middle">automatismes</text></g><line x1="110" y1="299" x2="290" y2="299" stroke="#5eead4" stroke-width="2"></line><path d="M282 303 L290 299 L282 295" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><g data-region="content-transfer" data-bounds="111 231 176 60"><text x="199" y="256" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#5eead4" text-anchor="middle">Migrer</text><text x="199" y="279" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#5eead4" text-anchor="middle">le contenu</text></g><line x1="110" y1="498" x2="290" y2="498" stroke="#f5b13d" stroke-width="2" stroke-dasharray="5 6"></line><path d="M282 502 L290 498 L282 494" fill="none" stroke="#f5b13d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><g data-region="account-mapping" data-bounds="111 432 176 60"><text x="199" y="457" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#f5b13d" text-anchor="middle">Rapprocher</text><text x="199" y="480" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#f5b13d" text-anchor="middle">les identités</text></g><line x1="330" y1="461" x2="330" y2="390" stroke="#f5b13d" stroke-width="2" stroke-dasharray="5 6"></line><path d="M334 398 L330 390 L326 398" fill="none" stroke="#f5b13d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><g data-region="permission-check" data-bounds="133 347 170 88"><text x="218" y="370" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="middle">Droits maintenus</text><text x="218" y="392" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="middle">si les identités</text><text x="218" y="414" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="middle">correspondent</text></g><line x1="110" y1="702" x2="290" y2="702" stroke="#f5b13d" stroke-width="2" stroke-dasharray="5 6"></line><path d="M282 706 L290 702 L282 698" fill="none" stroke="#f5b13d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><g data-region="app-reconnection" data-bounds="111 613 176 86"><text x="199" y="637" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#f5b13d" text-anchor="middle">Republier les apps,</text><text x="199" y="660" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#f5b13d" text-anchor="middle">recréer les flux,</text><text x="199" y="683" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#f5b13d" text-anchor="middle">puis les reconnecter</text></g><line x1="362" y1="702" x2="382" y2="702" stroke="#f5b13d" stroke-width="2" stroke-dasharray="5 6"></line><line x1="382" y1="702" x2="382" y2="299" stroke="#f5b13d" stroke-width="2" stroke-dasharray="5 6"></line><line x1="382" y1="299" x2="361" y2="299" stroke="#f5b13d" stroke-width="2" stroke-dasharray="5 6"></line><path d="M369 295 L361 299 L369 303" fill="none" stroke="#f5b13d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><line x1="32" y1="821" x2="368" y2="821" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></line><line