<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1039" role="img" aria-labelledby="microsoft-exit-dependencies-fr-mobile-title microsoft-exit-dependencies-fr-mobile-desc"><title id="microsoft-exit-dependencies-fr-mobile-title">Les liens qui font fonctionner le service</title><desc id="microsoft-exit-dependencies-fr-mobile-desc">Schéma pédagogique de migration SharePoint vers SharePoint. Le contenu est transféré, les identités rapprochées, les droits sont maintenus si les identités correspondent, les applications republiées et les flux recréés et reconnectés à destination. Les flèches continues indiquent le contenu, les pointillés les relations à traiter. Ce périmètre Microsoft vers Microsoft ne mesure pas une sortie vers un autre fournisseur.</desc><rect x="0" y="0" width="400" height="1039" rx="18" fill="#0c0d10" stroke="none" stroke-width="1"></rect><g data-region="eyebrow" data-bounds="24 16 352 34"><text x="32" y="37" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5eead4" text-anchor="start">l0g / DÉPENDANCES</text></g><g data-region="heading" data-bounds="24 55 352 82"><text x="32" y="91" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#e7e9ee" text-anchor="start">Les liens qui font</text><text x="32" y="125" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#e7e9ee" text-anchor="start">fonctionner le service</text></g><g data-region="subtitle" data-bounds="24 141 352 63"><text x="32" y="164" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="start">SharePoint → SharePoint : le contenu</text><text x="32" y="187" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="start">et les relations du service à reconstituer.</text></g><g data-region="source" data-bounds="24 214 126 42"><text x="87" y="240" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#e7e9ee" text-anchor="middle">Source</text></g><g data-region="destination" data-bounds="250 214 126 42"><text x="313" y="240" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#e7e9ee" text-anchor="middle">Destination</text></g><path d="M50 270 L77 270 L90 283 L90 328 L50 328 L50 270" fill="none" stroke="#e7e9ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M77 270 L77 283 L90 283" fill="none" stroke="#e7e9ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><line x1="60" y1="295" x2="80" y2="295" stroke="#e7e9ee" stroke-width="2"></line><line x1="60" y1="306" x2="80" y2="306" stroke="#e7e9ee" stroke-width="2"></line><line x1="60" y1="317" x2="73" y2="317" stroke="#e7e9ee" stroke-width="2"></line><circle cx="70" cy="485" r="10" fill="none" stroke="#e7e9ee" stroke-width="2"></circle><path d="M48 523 C48 497 92 497 92 523" fill="none" stroke="#e7e9ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><line x1="48" y1="523" x2="92" y2="523" stroke="#e7e9ee" stroke-width="2"></line><rect x="45" y="677" width="50" height="50" rx="7" fill="#121419" stroke="#e7e9ee" stroke-width="2"></rect><line x1="45" y1="692" x2="95" y2="692" stroke="#e7e9ee" stroke-width="2"></line><path d="M60 702 L54 708 L60 714" fill="none" stroke="#e7e9ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M80 702 L86 708 L80 714" fill="none" stroke="#e7e9ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><line x1="73" y1="701" x2="67" y2="716" stroke="#e7e9ee" stroke-width="2"></line><g data-region="source-documents" data-bounds="12 337 116 38"><text x="70" y="361" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#e7e9ee" text-anchor="middle">Fichiers</text></g><g data-region="source-accounts" data-bounds="12 532 116 38"><text x="70" y="556" font-family="Arial, Helvetica, sans-s