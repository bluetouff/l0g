<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 655" role="img" aria-labelledby="microsoft-contracts-procurement-fr-desktop-title microsoft-contracts-procurement-fr-desktop-desc"><title id="microsoft-contracts-procurement-fr-desktop-title">Le besoin délimite la concurrence</title><desc id="microsoft-contracts-procurement-fr-desktop-desc">Croydon a défini un besoin Microsoft Enterprise Licensing Agreement et Azure. Quatre offres ont été reçues. La pondération des critères d’attribution est de 70 % pour le prix, 20 % pour la technique et 10 % pour la valeur sociale, sur un total de 100 %. Ces pourcentages sont des poids de critères, pas des notes obtenues. Le marché a été attribué à Bytes Software Services Limited pour la période du 1 juillet 2025 au 30 juin 2028. Avis publié le 11 juillet 2025.</desc><rect x="0" y="0" width="1000" height="655" rx="18" fill="#0c0d10" stroke="none" stroke-width="1"></rect><g data-region="eyebrow" data-bounds="24 16 952 34"><text x="32" y="39" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#5eead4" text-anchor="start">l0g / COMMANDE PUBLIQUE</text></g><g data-region="heading" data-bounds="24 55 952 59"><text x="32" y="97" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#e7e9ee" text-anchor="start">Le besoin délimite la concurrence</text></g><g data-region="subtitle" data-bounds="24 116 952 40"><text x="32" y="142" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#8b909b" text-anchor="start">Croydon, 2025 : quatre offres reçues pour un environnement déjà défini.</text></g><g data-scope="Microsoft Enterprise Agreement and Azure"><rect x="32" y="174" width="936" height="166" rx="12" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></rect><g data-region="scope-heading" data-bounds="48 184 452 37"><text x="56" y="207" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#8b909b" text-a