<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1489" role="img" aria-labelledby="microsoft-workflow-reporting-fr-mobile-title microsoft-workflow-reporting-fr-mobile-desc"><title id="microsoft-workflow-reporting-fr-mobile-title">Deux voies pour remettre un budget</title><desc id="microsoft-workflow-reporting-fr-mobile-desc">Deux circuits de préparation et de collecte, sur des secteurs et des campagnes distincts. Pour la campagne médico-sociale CNSA EPRD 2025, les consignes requièrent Excel : les macros génèrent les onglets, les données sont saisies puis le cadre au format xls est déposé dans ImportEPRD. Pour la campagne hospitalière ATIH EPRD-PGFP 2026, la macro du cadre Excel xlsm génère un CSV ; un logiciel financier peut aussi produire un fichier texte structuré conforme, sous réserve du développement de l’export par son éditeur. Les fichiers passent par des contrôles d’import dans ANCRE. La saisie web directe est également disponible. Le guide prévoit un état Excel pour contrôler les données après la collecte. Aucune comparaison de performances ou de taux de migration.</desc><rect x="0" y="0" width="400" height="1489" rx="18" fill="#0c0d10" stroke="none" stroke-width="1"></rect><g data-region="eyebrow" data-bounds="24 16 352 34"><text x="32" y="37" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5eead4" text-anchor="start">l0g / PROCÉDURES BUDGÉTAIRES</text></g><g data-region="heading" data-bounds="24 55 352 85"><text x="32" y="91" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#e7e9ee" text-anchor="start">Deux voies pour</text><text x="32" y="125" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#e7e9ee" text-anchor="start">remettre un budget</text></g><g data-region="subtitle" data-bounds="24 141 352 63"><text x="32" y="164" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="start">Préparation et collecte des données</text><text x="32" y="187" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="start">Deux périmètres et deux campagnes distincts</text></g><g data-region="cnsa-scope" data-bounds="24 219 352 62"><text x="32" y="242" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#e7e9ee" text-anchor="start">CNSA · médico-social · EPRD 2025</text><text x="32" y="268" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#e7e9ee" text-anchor="start">Excel requis · février 2025</text></g><g data-node="cnsa-excel"><rect x="32" y="309" width="154" height="85" rx="8" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></rect></g><g data-region="cnsa-excel-title" data-bounds="35 312 148 40"><text x="109" y="337" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#e7e9ee" text-anchor="middle">Microsoft Excel</text></g><g data-region="cnsa-excel-detail" data-bounds="36 352 146 35"><text x="109" y="374" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#8b909b" text-anchor="middle">Macros activées</text></g><g data-edge="cnsa-generate-tabs"><line x1="194" y1="351" x2="206" y2="351" stroke="#5eead4" stroke-width="2"></line><path d="M198 355 L206 351 L198 347" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-node="cnsa-tabs"><rect x="218" y="309" width="150" height="85" rx="8" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></rect></g><g data-region="cnsa-tabs-title" data-bounds="221 312 144 40"><text x="293" y="336" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#5eead4" text-anchor="middle">Onglets générés</text></g><g data-region="cnsa-tabs-detail" data-bounds="222 352 142 35"><text x="293" y="374" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#8b909b" text-anchor="middle">Puis saisie</text></g><g data-edge="cnsa-save-frame"><path d="M293 402 L293 435 L106 435 L106 463" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><line x1="106" y1="453" x2="106" y2="463" stroke="#5eead4" stroke-width="2"></line><path d="M102 455 L106 463 L110 455" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-node="cnsa-xls"><rect x="32" y="475" width="148" height="55" rx="8" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></rect></g><g data-region="cnsa-xls-title" data-bounds="35 478 142 40"><text x="106" y="504" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#e7e9ee" text-anchor="middle">Cadre .xls</text></g><g data-edge="cnsa-submit"><line x1="188" y1="502" x2="206" y2="502" stroke="#5eead4" stroke-width="2"></line><path d="M198 506 L206 502 L198 498" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-node="cnsa-import"><rect x="218" y="475" width="150" height="55" rx="8" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></rect></g><g data-region="cnsa-import-title" data-bounds="221 478 144 40"><text x="293" y="505" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#5eead4" text-anchor="middle">ImportEPRD</text></g><line x1="32" y1="568" x2="368" y2="568" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></line><g data-region="atih-scope" data-bounds="24 582 352 62"><text x="32" y="605" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#e7e9ee" text-anchor="start">ATIH · hôpitaux · EPRD-PGFP 2026</text><text x="32" y="631" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#e7e9ee" text-anchor="start">Préparation possible par plusieurs chemins</text></g><g data-node="atih-excel"><rect x="32" y="672" width="154" height="86" rx="8" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></rect></g><g data-region="atih-excel-title" data-bounds="35 675 148 40"><text x="109" y="702" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#e7e9ee" text-anchor="middle">Excel .xlsm</text></g><g data-region="atih-excel-detail" data-bounds="36 715 146 35"><text x="109" y="737" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#8b909b" text-anchor="middle">Macro de génération</text></g><g data-node="atih-software"><rect x="218" y="672" width="150" height="86" rx="8" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></rect></g><g data-region="atih-software-title" data-bounds="221 675 144 40"><text x="293" y="698" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#e7e9ee" text-anchor="middle">Logiciel financier</text></g><g data-region="atih-software-detail" data-bounds="222 715 142 35"><text x="293" y="737" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#8b909b" text-anchor="middle">Export par l’éditeur</text></g><g data-edge="atih-excel-csv"><line x1="109" y1="766" x2="109" y2="790" stroke="#5eead4" stroke-width="2"></line><path d="M105 782 L109 790 L113 782" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-edge="atih-software-text"><line x1="293" y1="766" x2="293" y2="790" stroke="#5eead4" stroke-width="2"></line><path d="M289 782 L293 790 L297 782" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-node="atih-csv"><rect x="32" y="802" width="154" height="55" rx="8" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></rect></g><g data-region="atih-csv-title" data-bounds="35 805 148 42"><text x="109" y="834" font-family="Arial, Helvetica, sans-serif" font-size="2