-size="14" font-weight="400" fill="#8b909b" text-anchor="start">et des campagnes distincts.</text></g><g data-region="reporting-source" data-bounds="24 1403 352 67"><text x="32" y="1425" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#8b909b" text-anchor="start">Sources : consignes CNSA 2025 ;</text><text x="32" y="1448" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#8b909b" text-anchor="start">guide ATIH EPRD-PGFP 2026.</text></g></svg>