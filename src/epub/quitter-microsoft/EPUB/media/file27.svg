<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1690" role="img" aria-labelledby="microsoft-choice-sovereignty-fr-mobile-title microsoft-choice-sovereignty-fr-mobile-desc"><title id="microsoft-choice-sovereignty-fr-mobile-title">Un seuil, puis un score pondéré</title><desc id="microsoft-choice-sovereignty-fr-mobile-desc">Marché cloud de la Commission européenne. Huit objectifs doivent chacun atteindre au moins SEAL 2. Un seul objectif insuffisant entraîne le rejet. Le niveau SEAL global est le minimum des huit niveaux, et non leur moyenne. Les offres satisfaisant le seuil peuvent ensuite être comparées par leur score de souveraineté : chaque score d’objectif est divisé par son maximum, puis pondéré à 15, 10, 10, 15, 20, 15, 10 et 5 pour cent. Ce score contribue au score de qualité. Aucun score candidat ni poids dans la note finale du marché n’est représenté.</desc><rect x="0" y="0" width="400" height="1690" rx="18" fill="#0c0d10" stroke="none" stroke-width="1"></rect><g data-region="eyebrow" data-bounds="24 16 352 34"><text x="34" y="37" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5eead4" text-anchor="start">l0g / CHOIX DU CLOUD</text></g><g data-region="heading" data-bounds="24 55 352 85"><text x="34" y="91" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#e7e9ee" text-anchor="start">Un seuil, puis</text><text x="34" y="125" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#e7e9ee" text-anchor="start">un score pondéré</text></g><g data-region="subtitle" data-bounds="24 141 352 63"><text x="34" y="164" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="start">Marché de la Commission européenne</text><text x="34" y="187" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="start">Cadre 2025 · guide de mise en œuvre 2026</text></g><g data-node="objectives"><rect x="32" y="220" width="336" height="333" rx="8" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></rect></g><g data-region="objectives-heading" data-bounds="40 229 320 38"><text x="50" y="253" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#e7e9ee" text-anchor="start">8 OBJECTIFS ÉVALUÉS</text></g><g data-region="objective-1" data-bounds="44 271 312 37"><text x="54" y="296" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#e7e9ee" text-anchor="start">1 · Stratégie</text></g><g data-region="objective-2" data-bounds="44 305 312 37"><text x="54" y="330" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#e7e9ee" text-anchor="start">2 · Droit et juridiction</text></g><g data-region="objective-3" data-bounds="44 339 312 37"><text x="54" y="364" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#e7e9ee" text-anchor="start">3 · Données et IA</text></g><g data-region="objective-4" data-bounds="44 373 312 37"><text x="54" y="398" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#e7e9ee" text-anchor="start">4 · Opérations</text></g><g data-region="objective-5" data-bounds="44 407 312 37"><text x="54" y="432" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#e7e9ee" text-anchor="start">5 · Chaîne de fournisseurs</text></g><g data-region="objective-6" data-bounds="44 441 312 37"><text x="54" y="466" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#e7e9ee" text-anchor="start">6 · Technologie</text></g><g data-region="objective-7" data-bounds="44 475 312 37"><text x="54" y="500" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#e7e9ee" text-anchor="start">7 · Sécurité et conformité</text></g><g data-region="objective-8" data-bounds="44 509 312 37"><text x="54" y="534" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#e7e9ee" text-anchor="start">8 · Environnement</text></g><g data-edge="objectives-to-threshold"><line x1="200" y1="561" x2="200" y2="595" stroke="#5eead4" stroke-width="2"></line><path d="M196 587 L200 595 L204 587" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-node="minimum-gate"><rect x="32" y="605" width="336" height="169" rx="8" fill="#121419" stroke="#5eead4" stroke-width="1"></rect></g><g data-region="threshold-heading" data-bounds="40 613 320 38"><text x="200" y="636" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#5eead4" text-anchor="middle">SEUIL DU MARCHÉ</text></g><g data-region="minimum" data-bounds="40 651 320 66"><text x="200" y="699" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#e7e9ee" text-anchor="middle">SEAL 2</text></g><g data-region="minimum-rule" data-bounds="40 716 320 45"><text x="200" y="740" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#e7e9ee" text-anchor="middle">Au minimum sur chacun des 8 objectifs</text></g><g data-edge="threshold-passed"><line x1="116" y1="782" x2="116" y2="821" stroke="#5eead4" stroke-width="2"></line><path d="M112 813 L116 821 L120 813" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-edge="threshold-failed"><line x1="284" y1="782" x2="284" y2="821" stroke="#f5b13d" stroke-width="2"></line><path d="M280 813 L284 821 L288 813" fill="none" stroke="#f5b13d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-node="eligible"><rect x="32" y="831" width="158" height="116" rx="8" fill="#171a20" stroke="none" stroke-width="1"></rect></g><g data-region="eligible-label" data-bounds="40 841 142 96"><text x="111" y="865" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#5eead4" text-anchor="middle">Seuil satisfait</text><text x="111" y="900" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#5eead4" text-anchor="middle">Score comparé</text></g><g data-node="rejected"><rect x="210" y="831" width="158" height="116" rx="8" fill="#171a20" stroke="none" stroke-width="1"></rect></g><g data-region="rejection" data-bounds="218 836 142 103"><text x="289" y="859" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" fill="#f5b13d" text-anchor="middle">Un objectif</text><text x="289" y="887" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" fill="#f5b13d" text-anchor="middle">sous le seuil :</text><text x="289" y="915" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" fill="#f5b13d" text-anchor="middle">offre écartée</text></g><g data-edge="eligible-to-score"><path d="M116 955 L116 981 L200 981" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><line x1="200" y1="981" x2="200" y2="1007" stroke="#5eead4" stroke-width="2"></line><path d="M196 999 L200 1007 L204 999" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-region="weights-heading" data-bounds="24 1019 352 68"><text x="34" y="1044" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#e7e9ee" text-anchor="start">Poids des objectifs 1 à 8</text><text x="34" y="1070" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#e7e9ee" text-anchor="start">Total : 100 %</text></g><g data-weight="15" data-objective="1"><rect x="48" y="1110" width="92" height="45" rx="0" fill="#5eead4" stroke="none" stroke-width="1"></rect></g><g data-region="weight-1" data-bounds="153 1113.5 215 38"><text x="163" y="1136.5" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#e7e9ee" text-anchor="start">Objectif 1 · 15 %</text></g><g data-weight="10" data-objective="2"><rect x="48" y="1155" width="92" height="30" rx="0" fill="#5eead4" stroke="none" stroke-width="1"></rect><line x1="48" y1="1155" x2="140" y2="1155" stroke="#0c0d10" stroke-width="2"></line></g><g data-region="weight-2" data-bounds="153 1151 215 38"><text x="163" y="1174" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#e7e9ee" text-anchor="start">Objectif 2 · 10 %</text></g><g data-weight="10" data-objective="3"><rect x="48" y="1185" width="92" height="30" rx="0" fill="#5eead4" stroke="none" stroke-width="1"></rect><line x1="48" y1="1185" x2="140" y2="1185" stroke="#0c0d10" stroke-width="2"></line></g><g data-region="weight-3" data-bounds="153 1181 215 38"><text x="163" y="1204" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#e7e9ee" text-anchor="start">Objectif 3 · 10 %</text></g><g data-weight="15" data-objective="4"><rect x="48" y="1215" width="92" height="45" rx="0" fill="#5eead4" stroke="none" stroke-width="1"></rect><line x1="48" y1="1215" x2="140" y2="1215" stroke="#0c0d10" stroke-width="2"></line></g><g data-region="weight-4" data-bounds="153 1218.5 215 38"><text x="163" y="1241.5" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#e7e9ee" text-anchor="start">Objectif 4 · 15 %</text></g><g data-weight="20" data-objective="5"><rect x="48" y="1260" width="92" height="60" rx="0" fill="#5eead4" stroke="none" stroke-width="1"></rect><line x1="48" y1="1260" x2="140" y2="1260" stroke="#0c0d10" stroke-width="2"></line></g><g data-region="weight-5" data-bounds="153 1271 215 38"><text x="163" y="1294" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#e7e9ee" text-anchor="start">Objectif 5 · 20 %</text></g><g data-weight="15" data-objective="6"><rect x="48" y="1320" width="92" height="45" rx="0" fill="#5eead4" stroke="none" stroke-width="1"></rect><line x1="48" y1="1320" x2="140" y2="132