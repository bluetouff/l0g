8b909b" text-anchor="start">Source : Commission européenne.</text><text x="34" y="1605" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#8b909b" text-anchor="start">Chaque score est divisé par son</text><text x="34" y="1629" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#8b909b" text-anchor="start">maximum, puis pondéré.</text><text x="34" y="1653" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#8b909b" text-anchor="start">Aucune note de candidat représentée.</text></g></svg>