<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1080" role="img" aria-labelledby="microsoft-transition-cost-spending-fr-mobile-title microsoft-transition-cost-spending-fr-mobile-desc"><title id="microsoft-transition-cost-spending-fr-mobile-title">Les dépenses déclarées pour deux projets</title><desc id="microsoft-transition-cost-spending-fr-mobile-desc">Dépenses déclarées pour LibreOffice et Open-Xchange dans la réponse du gouvernement du Schleswig-Holstein du 21 septembre 2026, page 3. Cumul 2024–2025 : 2,495 et 15,5766 millions d’euros. En 2026, à date de la réponse : 0,253 et 1,6747 million d’euros. Les quatre barres suivent la même échelle linéaire, de zéro à 18 millions d’euros. Les périodes sont distinctes et 2026 est partiel. Champ limité aux deux projets, sans mesure du coût total de sortie ni calcul de rentabilité.</desc><rect x="0" y="0" width="400" height="1080" rx="18" fill="#0c0d10" stroke="none" stroke-width="1"></rect><g data-region="eyebrow" data-bounds="24 16 352 34"><text x="32" y="37" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5eead4" text-anchor="start">l0g / FINANCER LA TRANSITION</text></g><g data-region="heading" data-bounds="24 55 352 85"><text x="32" y="91" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#e7e9ee" text-anchor="start">Les dépenses déclarées</text><text x="32" y="125" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#e7e9ee" text-anchor="start">pour deux projets</text></g><g data-region="subtitle" data-bounds="24 141 352 63"><text x="32" y="164" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="start">Schleswig-Holstein · LibreOffice et Open-Xchange</text><text x="32" y="187" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="start">Réponse du 21 septembre 2026</text></g><g data-region="period-0" data-bounds=