<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1630" role="img" aria-labelledby="microsoft-workflow-consultation-fr-mobile-title microsoft-workflow-consultation-fr-mobile-desc"><title id="microsoft-workflow-consultation-fr-mobile-title">Le circuit derrière l’export Excel</title><desc id="microsoft-workflow-consultation-fr-mobile-desc">Circuit documenté de la solution MHCLG pour les consultations locales en Angleterre. Chaque jour, Power Automate lit les courriels non lus d’une boîte de messagerie Microsoft 365 partagée, archive les messages dans une bibliothèque SharePoint, convertit le corps HTML en texte et crée une ligne de suivi au statut New. Les pièces jointes sont associées à cette ligne. Un accusé peut être envoyé au participant, puis le message est marqué comme lu. L’export Excel emporte des champs et un lien vers le message, ainsi que le nombre de pièces jointes ; les fichiers restent dans SharePoint. Les accès nécessitent des connexions et des autorisations. Schéma du chemin de succès, sans mesure de volumes déployés.</desc><rect x="0" y="0" width="400" height="1630" rx="18" fill="#0c0d10" stroke="none" stroke-width="1"></rect><g data-region="eyebrow" data-bounds="24 16 352 34"><text x="32" y="37" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5eead4" text-anchor="start">l0g / PROCÉDURE ET DONNÉES</text></g><g data-region="heading" data-bounds="24 55 352 85"><text x="32" y="91" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#e7e9ee" text-anchor="start">Le circuit derrière</text><text x="32" y="125" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#e7e9ee" text-anchor="start">l’export Excel</text></g><g data-region="subtitle" data-bounds="24 141 352 63"><text x="32" y="164" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="start">Consultations locales en Angleterre</text><text x="32" y="187" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="start">Solution publique MHCLG · 27 février 2025</text></g><g data-node="participant"><rect x="64" y="222" width="272" height="70" rx="10" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></rect></g><g data-region="participant-title" data-bounds="68 224 264 42"><text x="200" y="253" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#e7e9ee" text-anchor="middle">Participant</text></g><g data-region="participant-detail" data-bounds="64 258 272 34"><text x="200" y="280" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#8b909b" text-anchor="middle">Courriel + pièces jointes</text></g><g data-node="mailbox"><rect x="64" y="347" width="272" height="96" rx="10" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></rect></g><g data-region="mailbox-title" data-bounds="68 350 264 43"><text x="200" y="380" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#e7e9ee" text-anchor="middle">Office 365</text></g><g data-region="mailbox-detail" data-bounds="66 387 268 56"><text x="200" y="410" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="middle">Messagerie partagée</text><text x="200" y="432" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="middle">Messages non lus</text></g><g data-node="power-automate"><rect x="64" y="505" width="272" height="285" rx="12" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></rect></g><g data-region="engine-title" data-bounds="69 510 262 43"><text x="200" y="540" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#e7e9ee" text-anchor="middle">Power Automate</text></g><g data-region="engine-frequency" data-bounds="69 551 262 35"><text x="200" y="572" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#8b909b" text-anchor="middle">Chaque jour · étapes réussies</text></g><g data-step="archive-message"><g data-region="engine-step-0" data-bounds="73 582 254 36"><text x="200" y="605" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#5eead4" text-anchor="middle">Archiver le message</text></g></g><line x1="200" y1="621" x2="200" y2="632" stroke="#8b909b" stroke-width="2"></line><path d="M196 624 L200 632 L204 624" fill="none" stroke="#8b909b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><g data-step="convert-and-create-row"><g data-region="engine-step-1" data-bounds="73 637 254 64"><text x="200" y="660" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#5eead4" text-anchor="middle">Corps HTML → texte</text><text x="200" y="683" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#5eead4" text-anchor="middle">Créer une ligne : statut « New »</text></g></g><line x1="200" y1="698" x2="200" y2="706" stroke="#8b909b" stroke-width="2"></line><path d="M196 698 L200 706 L204 698" fill="none" stroke="#8b909b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><g data-step="attach-files"><g data-region="engine-step-2" data-bounds="73 711 254 36"><text x="200" y="734" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#5eead4" text-anchor="middle">Joindre les pièces à la ligne</text></g></g><g data-node="sharepoint"><rect x="64" y="835" width="272" height="270" rx="12" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></rect></g><g data-region="sharepoint-title" data-bounds="71 840 258 44"><text x="200" y="871" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#e7e9ee" text-anchor="middle">SharePoint</text></g><g data-storage="message-file"><rect x="76" y="892" width="248" height="78" rx="6" fill="#171a20" stroke="none" stroke-width="1"></rect></g><g data-region="message-archive" data-bounds="79 895 242 72"><text x="200" y="920" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#e7e9ee" text-anchor="middle">Bibliothèque</text><text x="200" y="946" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#e7e9ee" text-anchor="middle">Message enregistré</text></g><g data-storage="list-item"><rect x="76" y="989" width="248" height="102" rx="6" fill="#171a20" stroke="none" stroke-width="1"></rect></g><g data-region="list-fields" data-bounds="79 991 242 100"><text x="200" y="1013" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#e7e9ee" text-anchor="middle">Liste de suivi</text><text x="200" y="1039" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#e7e9ee" text-anchor="middle">Expéditeur · date · texte</text><text x="200" y="1065" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#e7e9ee" text-anchor="middle">Lien du message · pièces jointes</text></g><g data-edge="email-input"><line x1="200" y1="300" x2="200" y2="335" stroke="#5eead4" stroke-width="2"></line><path d="M196 327 L200 335 L204 327" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-edge="unread-input"><line x1="200" y1="451" x2="200" y2="493" stroke="#5eead4" stroke-width="2"></line><path d="M196 485 L200 493 L204 485" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-edge="store-results"><line x1="200" y1="798" x2="200" y2="823" stroke="#5eead4" stroke-width="2"></line><path d="M196 815 L200 823 L204 815" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-edge="optional-acknowledgement"><path d="M64 766 L24 766 L24 256 L52 256" fill="none" stroke="#f5b13d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"></path><line x1="42" y1="256" x2="52" y2="256" stroke="#f5b13d" stroke-width="2"></line><path d="M44 260 L52 256 L44 252" fill="none" stroke="#f5b13d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-edge="mark-as-read"><path d="M336 784 L374 784 L374 394 L348 394" fill="none" stroke="#e7e9ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><line x1="358" y1="394" x2="348" y2="394" stroke="#e7e9ee" stroke-width="2"></line><path d="M356 390 L348 394 L356 398" fill="none" stroke="#e7e9ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-region="return-paths" data-bounds="24 1130 352 63"><text x="32" y="1152" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#8b909b" text-anchor="start">Pointillé : accusé facultatif.</text><text x="32" y="1175" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#8b909b" text-anchor="start">Trait plein : message marqué comme lu.</text></g><line x1="32" y1="1230" x2="368" y2="1230" stroke="#f5b13d" stroke-width="1.5" stroke-dasharray="6 6"></line><g data-region="export-boundary" data-bounds="24 1185 352 40"><text x="32" y="1207" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#f5b13d" text-anchor="start">EXPORT DE LA LISTE</text></g><g data-edge="list-export"><line x1="352" y1="1113" x2="382" y2="1113" stroke="#5eead4" stroke-width="2"></line><line x1="382" y1="1113" x2="382" y2="1261" stroke="#5eead4" stroke-width="2"></line><line x1="200" y1="1261" x2="382" y2="1261" stroke="#5eead4" stroke-width="2"></line><line x1="200" y1="1261" x2="200" y2="1276" stroke="#5eead4" stroke-width="2"></line><path d="M196 1268 L200 1276 L204 1268" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-node="excel-export"><rect x="64" y="1288" width="272" height="119" rx="10" fill="#171a20" stroke="none" stroke-width="1"></rect></g><g data-region="excel-title" data-bounds="72 1292 256 43"><text x="200" y="1322" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#e7e9ee" text-anchor="middle">Excel</text></g><g data-region="excel-fields" data-bounds="71 1334 258 70"><text x="200" y="1356" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#e7e9ee" text-anchor="middle">Champs de la liste + lien du message</text><text x="200" y="1381" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#e7e9ee" text-anchor="middle">Nombre de pièces jointes</text></g><g data-region="export-limit" data-bounds="24 1430 352 90"><text x="32" y="1453" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="start">Messages et pièces jointes restent</text><text x="32" y="1478" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="start">dans SharePoint. Leur accès dépend</text><text x="32" y="1503" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="start">des connexions et des autorisations.</text></g><line x1="32" y1="1530" x2="368" y2="1530" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></line><g data-region="consultation-source" data-bounds="24 1540 352 70"><text x="32" y="1562" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#8b909b" text-anchor="start">Sources : guides MHCLG du 27 février 2025</text><text x="32" y="1585" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#8b909b" text-anchor="start">et solution publique 1.0.0.13.</text></g></svg>