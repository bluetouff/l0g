<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1344" role="img" aria-labelledby="microsoft-transition-cost-overlap-fr-mobile-title microsoft-transition-cost-overlap-fr-mobile-desc"><title id="microsoft-transition-cost-overlap-fr-mobile-title">Financer la période de coexistence</title><desc id="microsoft-transition-cost-overlap-fr-mobile-desc">Schéma pédagogique générique, sans échelle de temps ni de coûts. La solution existante reste financée pendant la préparation de la nouvelle, les adaptations, la formation et les bascules par vagues validées. La fin des charges correspondantes dépend de l’arrêt effectif de l’ancien service et de l’ajustement du contrat. Des vagues partielles peuvent prolonger la coexistence. La nouvelle solution demande ensuite support, maintenance et évolutions.</desc><rect x="0" y="0" width="400" height="1344" rx="18" fill="#0c0d10" stroke="none" stroke-width="1"></rect><g data-region="eyebrow" data-bounds="24 16 352 34"><text x="32" y="37" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5eead4" text-anchor="start">l0g / LE CALENDRIER DES CHARGES</text></g><g data-region="heading" data-bounds="24 55 352 85"><text x="32" y="91" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#e7e9ee" text-anchor="start">Financer la période</text><text x="32" y="125" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#e7e9ee" text-anchor="start">de coexistence</text></g><g data-region="subtitle" data-bounds="24 141 352 63"><text x="32" y="164" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="start">Schéma pédagogique · déroulement par étapes</text><text x="32" y="187" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="start">Durées et montants non représentés</text></g><g data-region="old-lane" data-bounds="24 218 128 41"><text x="88" y="241" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#f5b13d" text-anchor="middle">EXISTANT</text></g><g data-region="new-lane" data-bounds="168 218 208 41"><text x="272" y="241" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#5eead4" text-anchor="middle">NOUVEAU</text></g><g data-node="old-operation"><rect x="32" y="282" width="112" height="526" rx="6" fill="#171a20" stroke="none" stroke-width="1"></rect></g><rect x="32" y="282" width="5" height="526" rx="0" fill="#f5b13d" stroke="none" stroke-width="1"></rect><g data-node="new-preparation"><rect x="176" y="282" width="192" height="176" rx="6" fill="#171a20" stroke="none" stroke-width="1"></rect></g><g data-node="validated-waves"><rect x="176" y="511" width="192" height="122" rx="6" fill="#171a20" stroke="none" stroke-width="1"></rect></g><g data-node="new-maintenance"><rect x="176" y="704" width="192" height="105" rx="6" fill="#171a20" stroke="none" stroke-width="1"></rect></g><rect x="176" y="704" width="5" height="105" rx="0" fill="#5eead4" stroke="none" stroke-width="1"></rect><g data-region="old-cost" data-bounds="36 309 104 143"><text x="88" y="332" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#f5b13d" text-anchor="middle">Service</text><text x="88" y="360" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#f5b13d" text-anchor="middle">et contrat</text><text x="88" y="388" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#f5b13d" text-anchor="middle">encore</text><text x="88" y="416" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#f5b13d" text-anchor="middle">financés</text></g><g data-region="prepare-detail" data-bounds="184 301 176 125"><text x="272" y="327" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#e7e9ee" text-anchor="middle">Préparation</text><text x="272" y="361" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#e7e9ee" text-anchor="middle">Adaptations</text><text x="272" y="395" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#e7e9ee" text-anchor="middle">Formation</text></g><g data-region="waves-detail" data-bounds="184 523 176 100"><text x="272" y="548" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#5eead4" text-anchor="middle">Validation</text><text x="272" y="575" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#5eead4" text-anchor="middle">puis bascules</text><text x="272" y="602" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#5eead4" text-anchor="middle">par vagues</text></g><g data-region="maintenance-detail" data-bounds="184 715 176 85"><text x="272" y="741" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#5eead4" text-anchor="middle">Support</text><text x="272" y="770" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#5eead4" text-anchor="middle">et maintenance</text></g><g data-edge="preparation-to-waves"><line x1="272" y1="466" x2="272" y2="501" stroke="#5eead4" stroke-width="2"></line><path d="M268 493 L272 501 L276 493" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-edge="waves-to-support"><line x1="272" y1="642" x2="272" y2="694" stroke="#5eead4" stroke-width="2"></line><path d="M268 686 L272 694 L276 686" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-region="coexistence" data-bounds="168 829 208 66"><text x="272" y="852" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="middle">Deux environnements</text><text x="272" y="875" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="middle">à financer</text></g><g data-gate="conditional-exit"><line x1="26" y1="808" x2="150" y2="808" stroke="#f5b13d" stroke-width="3"></line><line x1="88" y1="816" x2="88" y2="884" stroke="#f5b13d" stroke-width="2"></line><path d="M84 876 L88 884 L92 876" fill="none" stroke="#f5b13d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-node="exit-condition"><rect x="32" y="896" width="336" height="112" rx="6" fill="#171a20" stroke="none" stroke-width="1"></rect></g><g data-region="exit-condition-detail" data-bounds="40 900 320 100"><text x="200" y="923" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#f5b13d" text-anchor="middle">Service arrêté + contrat ajusté</text><text x="200" y="951" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#f5b13d" text-anchor="middle">Fin des charges correspondantes</text><text x="200" y="979" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#f5b13d" text-anchor="middle">selon les conditions du contrat.</text></g><g data-edge="continuing-maintenance"><path d="M368 756 L383 756 L383 1044 L272 1044 L272 1064" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><line x1="272" y1="1054" x2="272" y2="1064" stroke="#5eead4" stroke-width="2"></line><path d="M268 1056 L272 1064 L276 1056" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-node="ongoing-support"><rect x="32" y="1076" width="336" height="69" rx="6" fill="#171a20" stroke="none" stroke-width="1"></rect></g><g data-region="ongoing-support-detail" data-bounds="40 1082 320 60"><text x="200" y="1105" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#5eead4" text-anchor="middle">Support, maintenance et évolutions</text><text x="200" y="1130" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#5eead4" text-anchor="middle">se poursuivent.</text></g><g data-region="condition-note" data-bounds="24 1171 352 72"><text x="32" y="1195" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#8b909b" text-anchor="start">Des vagues partielles peuvent</text><text x="32" y="1221" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#8b909b" text-anchor="start">prolonger la coexistence.</text></g><g data-region="method-source" data-bounds="24 1260 352 66"><text x="32" y="1281" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#8b909b" text-anchor="start">Méthode : Cabinet Office, mars 2022</text><text x="32" y="1304" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#8b909b" text-anchor="start">et Green Book, 2026 · Schéma l0g</text></g></svg>