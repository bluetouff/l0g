<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 638" role="img" aria-labelledby="microsoft-exit-dependencies-fr-desktop-title microsoft-exit-dependencies-fr-desktop-desc"><title id="microsoft-exit-dependencies-fr-desktop-title">Les liens qui font fonctionner le service</title><desc id="microsoft-exit-dependencies-fr-desktop-desc">Schéma pédagogique de migration SharePoint vers SharePoint. Le contenu est transféré, les identités rapprochées, les droits sont maintenus si les identités correspondent, les applications republiées et les flux recréés et reconnectés à destination. Les flèches continues indiquent le contenu, les pointillés les relations à traiter. Ce périmètre Microsoft vers Microsoft ne mesure pas une sortie vers un autre fournisseur.</desc><rect x="0" y="0" width="1000" height="638" rx="18" fill="#0c0d10" stroke="none" stroke-width="1"></rect><g data-region="eyebrow" data-bounds="24 16 952 34"><text x="32" y="39" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#5eead4" text-anchor="start">l0g / DÉPENDANCES</text></g><g data-region="heading" data-bounds="24 55 952 59"><text x="32" y="97" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#e7e9ee" text-anchor="start">Les liens qui font fonctionner le service</text></g><g data-region="subtitle" data-bounds="24 116 952 40"><text x="32" y="142" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#8b909b" text-anchor="start">SharePoint → SharePoint : le contenu et les relations du service à reconstituer.</text></g><g data-region="source" data-bounds="24 157 262 42"><text x="155" y="187" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#e7e9ee" text-anchor="middle">Source</text></g><g data-region="destination" data-bounds="714 157 262 42"><text x="845" y="187" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#e7e9ee" text-anchor="middle">Destin