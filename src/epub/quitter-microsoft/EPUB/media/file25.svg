ans-serif" font-size="13" font-weight="400" fill="#8b909b" text-anchor="start">Source : Munich Open Source,</text><text x="34" y="1425" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#8b909b" text-anchor="start">page « LibreOffice ».</text></g></svg>