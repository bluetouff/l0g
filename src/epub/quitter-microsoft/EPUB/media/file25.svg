<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1460" role="img" aria-labelledby="microsoft-migration-practice-upstream-fr-mobile-title microsoft-migration-practice-upstream-fr-mobile-desc"><title id="microsoft-migration-practice-upstream-fr-mobile-title">Faire circuler les améliorations</title><desc id="microsoft-migration-practice-upstream-fr-mobile-desc">Circuit historique de contribution décrit par Munich, où LibreOffice était utilisé au sein de LiMux jusqu’à fin 2023. Les corrections et fonctions municipales étaient d’abord proposées dans la branche principale LibreOffice de The Document Foundation, puis passaient son assurance qualité. Après validation, elles étaient portées dans la version municipale. Elles bénéficient également au LibreOffice partagé. Ce schéma ne décrit pas le parc informatique actuel de Munich.</desc><rect x="0" y="0" width="400" height="1460" rx="18" fill="#0c0d10" stroke="none" stroke-width="1"></rect><g data-region="eyebrow" data-bounds="24 16 352 34"><text x="34" y="37" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5eead4" text-anchor="start">l0g / ENTRETENIR UNE ALTERNATIVE</text></g><g data-region="heading" data-bounds="24 55 352 85"><text x="34" y="91" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#e7e9ee" text-anchor="start">Faire circuler</text><text x="34" y="125" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#e7e9ee" text-anchor="start">les améliorations</text></g><g data-region="subtitle" data-bounds="24 141 352 63"><text x="34" y="164" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="start">Circuit historique décrit par Munich</text><text x="34" y="187" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="start">LibreOffice dans LiMux jusqu’à fin 2023</text></g><g data-node="municipality"><rect x="32" y="219" width="336" height="152" rx="8" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></rect></g><g data-region="city-heading" data-bounds="40 228 320 41"><text x="50" y="255" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#e7e9ee" text-anchor="start">MUNICH</text></g><g data-region="contribution-label" data-bounds="40 277 320 82"><text x="200" y="302" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#e7e9ee" text-anchor="middle">Corrections de bugs et fonctionnalités</text><text x="200" y="330" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#e7e9ee" text-anchor="middle">Contributions municipales</text></g><g data-node="contribution"></g><g data-edge="contribute-upstream"><line x1="200" y1="379" x2="200" y2="447" stroke="#5eead4" stroke-width="2"></line><path d="M196 439 L200 447 L204 439" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-region="first" data-bounds="213 389 155 42"><text x="223" y="411" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#5eead4" text-anchor="start">D’ABORD</text></g><g data-node="common-project"><rect x="32" y="458" width="336" height="528" rx="8" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></rect></g><g data-region="project-heading" data-bounds="40 472 320 65"><text x="200" y="498" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#5eead4" text-anchor="middle">THE DOCUMENT</text><text x="200" y="524" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#5eead4" text-anchor="middle">FOUNDATION</text></g><g data-node="main-branch"><rect x="64" y="558" width="272" height="91" rx="8" fill="#171a20" stroke="none" stroke-width="1"></rect></g><g data-region="main-branch-label" data-bounds="72 568 256 77"><text x="200" y="597" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#5eead4" text-anchor="middle">Branche principale</text><text x="200" y="626" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#5eead4" text-anchor="middle">de LibreOffice</text></g><g data-edge="main-to-qa"><line x1="200" y1="657" x2="200" y2="687" stroke="#5eead4" stroke-width="2"></line><path d="M196 679 L200 687 L204 679" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-node="quality-assurance"><rect x="64" y="697" width="272" height="106" rx="8" fill="#171a20" stroke="none" stroke-width="1"></rect></g><g data-region="qa-label" data-bounds="72 707 256 87"><text x="200" y="733" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#e7e9ee" text-anchor="middle">Assurance qualité chez TDF</text><text x="200" y="764" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#e7e9ee" text-anchor="middle">Validation</text></g><g data-edge="shared-contribution"><line x1="200" y1="811" x2="200" y2="845" stroke="#5eead4" stroke-width="2"></line><path d="M196 837 L200 845 L204 837" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-node="shared-benefit"><rect x="64" y="855" width="272" height="105" rx="8" fill="#171a20" stroke="none" stroke-width="1"></rect></g><g data-region="shared-benefit-label" data-bounds="72 868 256 84"><text x="200" y="894" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#5eead4" text-anchor="middle">Contributions intégrées</text><text x="200" y="924" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#5eead4" text-anchor="middle">à LibreOffice partagé</text></g><g data-edge="approved-local-port"><path d="M64 750 L16 750 L16 1172 L56 1172" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoi