<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1152" role="img" aria-labelledby="microsoft-contracts-activation-fr-mobile-title microsoft-contracts-activation-fr-mobile-desc"><title id="microsoft-contracts-activation-fr-mobile-title">Une règle de groupe ouvre des services</title><desc id="microsoft-contracts-activation-fr-mobile-desc">Schéma pédagogique du mécanisme Entra : un compte membre d’un groupe reçoit la licence produit attribuée à ce groupe. L’administrateur peut activer ou désactiver les plans de service du produit. Rejoindre le groupe déclenche l’attribution, le quitter retire cette attribution. D’autres groupes ou attributions directes peuvent maintenir la même licence. Le schéma porte sur les droits d’accès ; l’installation du logiciel est une autre étape.</desc><rect x="0" y="0" width="400" height="1152" rx="18" fill="#0c0d10" stroke="none" stroke-width="1"></rect><g data-region="eyebrow" data-bounds="24 16 352 34"><text x="32" y="37" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5eead4" text-anchor="start">l0g / DU COMPTE À L’ACCÈS</text></g><g data-region="heading" data-bounds="24 55 352 85"><text x="32" y="91" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#e7e9ee" text-anchor="start">Une règle de groupe</text><text x="32" y="125" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#e7e9ee" text-anchor="start">ouvre des services</text></g><g data-region="subtitle" data-bounds="24 141 352 63"><text x="32" y="164" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="start">Entra attribue les licences.</text><text x="32" y="187" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="start">L’administrateur choisit les plans de service.</text></g><circle cx="83" cy="234" r="11" fill="none" stroke="#e7e9ee" stroke-width="2"></circle><path d="M61 