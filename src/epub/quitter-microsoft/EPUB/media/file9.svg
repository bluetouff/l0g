ne" stroke-width="1"></circle><g data-plan="disabled"><rect x="209" y="634" width="167" height="112" rx="10" fill="#121419" stroke="#f5b13d" stroke-width="1.5"></rect></g><g data-region="plan-1" data-bounds="213 642 159 38"><text x="292.5" y="667" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#f5b13d" text-anchor="middle">Plan désactivé</text></g><g data-region="access-1" data-bounds="213 677 159 34"><text x="292.5" y="699" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#e7e9ee" text-anchor="middle">Service écarté</text></g><rect x="273" y="722" width="38" height="12" rx="6" fill="#0c0d10" stroke="#f5b13d" stroke-width="1"></rect><circle cx="280" cy="728" r="4" fill="#f5b13d" stroke="none" stroke-width="1"></circle><g data-region="membership-enter" data-bounds="24 779 352 62"><text x="32" y="804" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#5eead4" text-anchor="start">Rejoindre le groupe :</text><text x="32" y="829" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#5eead4" text-anchor="start">sa licence est attribuée au compte.</text></g><g data-region="membership-leave" data-bounds="24 856 352 62"><text x="32" y="881" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#f5b13d" text-anchor="start">Quitter le groupe :</text><text x="32" y="906" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#f5b13d" text-anchor="start">cette attribution est retirée.</text></g><line x1="32" y1="949" x2="368" y2="949" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></line><g data-region="activation-scope" data-bounds="24 961 352 114"><text x="32" y="983" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#8b909b" text-anchor="start">Cas pédagogique : attribution de droits d’accès.</text><text x="32" y="1006" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#8b909b" text-anchor="start">L’installation du logiciel est une autre étape.</text><text x="32" y="1029" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#8b909b" text-anchor="start">D’autres groupes ou attributions directes</text><text x="32" y="1052" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#8b909b" text-anchor="start">peuvent maintenir la même licence.</text></g><g data-region="activation-source" data-bounds="24 1070 352 63"><text x="32" y="1092" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#8b909b" text-anchor="start">Sources : Microsoft Learn, attribution</text><text x="32" y="1115" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#8b909b" text-anchor="start">des licences par groupes, consulté le 8 oct. 2026.</text></g></svg>