<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="microsoft-transition-cost-spending-fr-desktop-title microsoft-transition-cost-spending-fr-desktop-desc"><title id="microsoft-transition-cost-spending-fr-desktop-title">Les dépenses déclarées pour deux projets</title><desc id="microsoft-transition-cost-spending-fr-desktop-desc">Dépenses déclarées pour LibreOffice et Open-Xchange dans la réponse du gouvernement du Schleswig-Holstein du 21 septembre 2026, page 3. Cumul 2024–2025 : 2,495 et 15,5766 millions d’euros. En 2026, à date de la réponse : 0,253 et 1,6747 million d’euros. Les quatre barres suivent la même échelle linéaire, de zéro à 18 millions d’euros. Les périodes sont distinctes et 2026 est partiel. Champ limité aux deux projets, sans mesure du coût total de sortie ni calcul de rentabilité.</desc><rect x="0" y="0" width="1000" height="700" rx="18" fill="#0c0d10" stroke="none" stroke-width="1"></rect><g data-region="eyebrow" data-bounds="24 16 952 34"><text x="32" y="39" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#5eead4" text-anchor="start">l0g / FINANCER LA TRANSITION</text></g><g data-region="heading" data-bounds="24 55 952 59"><text x="32" y="97" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#e7e9ee" text-anchor="start">Les dépenses déclarées pour deux projets</text></g><g data-region="subtitle" data-bounds="24 116 952 40"><text x="32" y="142" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#8b909b" text-anchor="start">Schleswig-Holstein · LibreOffice et Open-Xchange · Réponse du 21 septembre 2026</text></g><g data-region="period-0" data-bounds="24 177 952 42"><text x="32" y="206" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#e7e9ee" text-anchor="start">2024–2025 · deux années cumulées</text></g><g data-region="project-0-0" data-bounds="24 247 202 40"><text x="32" y="275" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#e7e9ee" text-anchor="start">LibreOffice</text></g><g data-bar="0-libreOffice" data-euros="2495000" data-scale="0.00003388888888888889"><rect x="248" y="251" width="84.55277777777778" height="32" rx="0" fill="#5eead4" stroke="none" stroke-width="1"></rect></g><g data-region="amount-0-0" data-bounds="339.5527777777778 244 100 48"><text x="347.5527777777778" y="274" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#5eead4" text-anchor="start">2,50</text></g><g data-region="project-0-1" data-bounds="24 315 202 40"><text x="32" y="343" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#e7e9ee" text-anchor="start">Open-Xchange</text></g><g data-bar="0-openXchange" data-euros="15576600" data-scale="0.00003388888888888889"><rect x="248" y="319" width="527.8736666666667" height="32" rx="0" fill="#f5b13d" stroke="none" stroke-width="1"></rect></g><g data-region="amount-0-1" data-bounds="782.8736666666667 312 100 48"><text x="790.8736666666667" y="342" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#f5b13d" text-anchor="start">15,58</text></g><g data-region="period-1" data-bounds="24 376 952 42"><text x="32" y="405" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#e7e9ee" text-anchor="start">2026 · dépenses à date · année partielle</text></g><g data-region="project-1-0" data-bounds="24 446 202 40"><text x="32" y="474" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#e7e9ee" text-anchor="start">LibreOffice</text></g><g data-bar="1-libreOffice" data-euros="253000" data-scale="0.00003388888888888889"><rect x="248" y="450" width="8.57388888888889" height="32" rx="0" fill="#5eead4" stroke="none" stroke-width="1"></rect></g><g data-region="amount-1-0" data-bounds="263.5738888888889 443 100 48"><text x="271.5738888888889" y="473" font-fam