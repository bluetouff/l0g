-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-node="cnsa-xls"><rect x="558" y="278" width="152" height="58" rx="8" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></rect></g><g data-region="cnsa-xls-title" data-bounds="561 281 146 40"><text x="634" y="307" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#e7e9ee" text-anchor="middle">Cadre .xls</text></g><g data-edge="cnsa-submit"><line x1="718" y1="306" x2="746" y2="306" stroke="#5eead4" stroke-width="2"></line><path d="M738 310 L746 306 L738 302" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-node="cnsa-import"><rect x="758" y="278" width="210" height="58" rx="8" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></rect></g><g data-region="cnsa-import-title" data-bounds="761 281 204 42"><text x="863" y="310" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#5eead4" text-anchor="middle">ImportEPRD</text></g><line x1="32" y1="389" x2="968" y2="389" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></line><g data-region="atih-scope" data-bounds="24 403 952 65"><text x="32" y="430" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#e7e9ee" text-anchor="start">ATIH · hôpitaux · EPRD-PGFP 2026</text><text x="32" y="456" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#e7e9ee" text-anchor="start">Préparation possible par plusieurs chemins</text></g><g data-node="atih-excel"><rect x="32" y="490" width="222" height="83" rx="8" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></rect></g><g data-region="atih-excel-title" data-bounds="35 493 216 42"><text x="143" y="522" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#e7e9ee" text-anchor="middle">Excel .xlsm</text></g><g data-region="atih-excel-detail" data-bounds="36 533 214 35"><text x="143" y="556" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="middle">Macro de génération</text></g><g data-edge="atih-excel-csv"><line x1="262" y1="532" x2="300" y2="532" stroke="#5eead4" stroke-width="2"></line><path d="M292 536 L300 532 L292 528" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-node="atih-csv"><rect x="312" y="505" width="230" height="55" rx="8" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></rect></g><g data-region="atih-csv-title" data-bounds="315 508 224 42"><text x="427" y="537" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#5eead4" text-anchor="middle">CSV</text></g><g data-node="atih-software"><rect x="32" y="609" width="222" height="86" rx="8" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></rect></g><g data-region="atih-software-title" data-bounds="35 612 216 40"><text x="143" y="640" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#e7e9ee" text-anchor="middle">Logiciel financier</text></g><g data-region="atih-software-detail" data-bounds="36 652 214 35"><text x="143" y="675" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="middle">Export développé par l’éditeur</text></g><g data-edge="atih-software-text"><line x1="262" y1="651" x2="300" y2="651" stroke="#5eead4" stroke-width="2"></line><path d="M292 655 L300 651 L292 647" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-node="atih-structured"><rect x="312" y="624" width="230" height="55" rx="8" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></rect></g><g data-region="atih-structured-title" data-bounds="315 627 224 40"><text x="427" y="655" font-family="Arial, Helvetica, sans-serif" font-size="20" font-