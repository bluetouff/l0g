<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 889" role="img" aria-labelledby="microsoft-workflow-reporting-fr-desktop-title microsoft-workflow-reporting-fr-desktop-desc"><title id="microsoft-workflow-reporting-fr-desktop-title">Deux voies pour remettre un budget</title><desc id="microsoft-workflow-reporting-fr-desktop-desc">Deux circuits de préparation et de collecte, sur des secteurs et des campagnes distincts. Pour la campagne médico-sociale CNSA EPRD 2025, les consignes requièrent Excel : les macros génèrent les onglets, les données sont saisies puis le cadre au format xls est déposé dans ImportEPRD. Pour la campagne hospitalière ATIH EPRD-PGFP 2026, la macro du cadre Excel xlsm génère un CSV ; un logiciel financier peut aussi produire un fichier texte structuré conforme, sous réserve du développement de l’export par son éditeur. Les fichiers passent par des contrôles d’import dans ANCRE. La saisie web directe est également disponible. Le guide prévoit un état Excel pour contrôler les données après la collecte. Aucune comparaison de performances ou de taux de migration.</desc><rect x="0" y="0" width="1000" height="889" rx="18" fill="#0c0d10" stroke="none" stroke-width="1"></rect><g data-region="eyebrow" data-bounds="24 16 952 34"><text x="32" y="39" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#5eead4" text-anchor="start">l0g / PROCÉDURES BUDGÉTAIRES</text></g><g data-region="heading" data-bounds="24 55 952 59"><text x="32" y="97" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#e7e9ee" text-anchor="start">Deux voies pour remettre un budget</text></g><g data-region="subtitle" data-bounds="24 116 952 40"><text x="32" y="142" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#8b909b" text-anchor="start">Préparation et collecte des données · Deux périmètres et deux campagnes distincts</text></g><g data-region="cnsa-scope" data-bounds="24 174 952 65"><t