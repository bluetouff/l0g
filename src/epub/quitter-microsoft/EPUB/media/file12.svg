<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 735" role="img" aria-labelledby="microsoft-cloud-licensing-comparison-fr-desktop-title microsoft-cloud-licensing-comparison-fr-desktop-desc"><title id="microsoft-cloud-licensing-comparison-fr-desktop-title">Comparer les licences à usage constant</title><desc id="microsoft-cloud-licensing-comparison-fr-desktop-desc">Méthode de comparaison de la CMA, données Azure UK 2024. L’usage mesuré en vcore-heures et ajusté pour l’utilisation est valorisé aux prix SPLA facturés par Microsoft à AWS ou Google, pour reconstruire un coût fournisseur hypothétique. Ce coût est comparé à la dépense de licence du client Azure pour le même usage, nette des remises. La différence concerne des prix amont et des prix clients, et non deux factures finales ou le coût interne réel de Microsoft. Périmètre : Windows Server sous Azure Hybrid Benefit, SQL Server PAYG en IaaS, clients dépensant au moins 10 000 dollars par an sur Azure. Les montants détaillés ne sont pas publics.</desc><rect x="0" y="0" width="1000" height="735" rx="18" fill="#0c0d10" stroke="none" stroke-width="1"></rect><g data-region="eyebrow" data-bounds="24 16 952 34"><text x="32" y="39" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#5eead4" text-anchor="start">l0g / PRIX AMONT ET PRIX CLIENT</text></g><g data-region="heading" data-bounds="24 55 952 59"><text x="32" y="97" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#e7e9ee" text-anchor="start">Comparer les licences à usage constant</text></g><g data-region="subtitle" data-bounds="24 116 952 40"><text x="32" y="142" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#8b909b" text-anchor="start">Méthode CMA · Azure au Royaume-Uni · 2024 · Windows Server sous AHB · SQL Server en PAYG</text></g><g data-input="same-azure-usage"><rect x="240" y="173" width="520" height="83" rx="10" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.5"></rect></g><g data-region="usage" data-bounds="248 178 504 44"><text x="500" y="209" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#e7e9ee" text-anchor="middle">Usage Azure UK · 2024</text></g><g data-region="usage-unit" data-bounds="248 216 504 35"><text x="500" y="240" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#8b909b" text-anchor="middle">Heures-cœurs virtuels, ajustées</text></g><line x1="500" y1="264" x2="500" y2="274" stroke="#8b909b" stroke-width="2"></line><line x1="247" y1="274" x2="753" y2="274" stroke="#8b909b" stroke-width="2"></line><line x1="247" y1="274" x2="247" y2="287" stroke="#5eead4" stroke-width="2"></line><path d="M243 279 L247 287 L251 279" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><line x1="753" y1="274" x2="753" y2="287" stroke="#5eead4" stroke-width="2"></line><path d="M749 279 L753 287 L757 279" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><g data-comparison="supplier-hypothesis"><rect x="32" y="299" width="430" height="166" rx="10" fill="#121419" stroke="#f5b13d" stroke-width="1.5"></rect></g><g data-region="channel-0" data-bounds="40 306 414 35"><text x="247" y="328" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#8b909b" text-anchor="middle">MICROSOFT → AWS / GOOGLE</text></g><g data-region="operation-0" data-bounds="40 345 414 42"><text x="247" y="374" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#f5b13d" text-anchor="middle">Usage ajusté × prix SPLA</text></g><line x1="48" y1="392" x2="446" y2="392" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></line><g data-region="result-0" data-bounds="40 400 414 66"><text x="247" y="428" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#e7e9ee" text-anchor="middle">Coût fournisseur</text><text x="247" y="453" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#e7e9ee" text-anchor="middle">hypothétique</text></g><g data-comparison="azure-customer-spend"><rect x="538" y="299" width="430" height="166" rx="10" fill="#121419" stroke="#5eead4" stroke-width="1.5"></rect></g><g data-region="channel-1" data-bounds="546 306 414 35"><text x="753" y="328" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#8b909b" text-anchor="middle">MICROSOFT AZURE → CLIENT</text></g><g data-region="operation-1" data-bounds="546 345 414 42"><text x="753" y="374" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#5eead4" text-anchor="middle">Dépense pour ce même usage</text></g><line x1="554" y1="392" x2="952" y2="392" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></line><g data-region="result-1" data-bounds="546 400 414 66"><text x="753" y="428" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#e7e9ee" text-anchor="middle">Dépense client de licence</text><text x="753" y="453" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#e7e9ee" text-anchor="middle">nette des remises</text></g><line x1="247" y1="473" x2="247" y2="490" stroke="#f5b13d" stroke-width="2" stroke-dasharray="5 5"></line><line x1="247" y1="490" x2="500" y2="490" stroke="#f5b13d" stroke-width="2" stroke-dasharray="5 5"></line><line x1="753" y1="473" x2="753" y2="490" stroke="#5eead4" stroke-width="2"></line><line x1="500" y1="490" x2="753" y2="490" stroke="#5eead4" stroke-width="2"></line><line x1="500" y1="490" x2="500" y2="513" stroke="#e7e9ee" stroke-width="2"></line><path d="M496 505 L500 513 L504 505" fill="none" stroke="#e7e9ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><rect x="260" y="526" width="480" height="84" rx="10" fill="#171a20" stroke="none" stroke-width="1"></rect><g data-region="difference-formula" data-bounds="268 532 464 42"><text x="500" y="561" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#e7e9ee" text-anchor="middle">Coût hypothétique − dépense client</text></g><g data-region="difference-meaning" data-bounds="268 571 464 39"><text x="500" y="598" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#5eead4" text-anchor="middle">Écart calculé par la CMA</text></g><line x1="32" y1="636" x2="968" y2="636" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></line><g data-region="comparison-scope" data-bounds="24 645 952 64"><text x="32" y="669" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#8b909b" text-anchor="start">Périmètre : licences IaaS, clients avec au moins 10 000 $ de dépenses Azure annuelles.</text></g><g data-region="comparison-source" data-bounds="24 685 952 40"><text x="32" y="709" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#8b909b" text-anchor="start">Source : CMA, annexe T, T.5, T.8, T.25, T.55–65 et T.72 (2025). Montants caviardés.</text></g></svg>