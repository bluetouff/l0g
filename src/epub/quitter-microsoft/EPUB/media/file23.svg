<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1470" role="img" aria-labelledby="microsoft-migration-practice-qualification-fr-mobile-title microsoft-migration-practice-qualification-fr-mobile-desc"><title id="microsoft-migration-practice-qualification-fr-mobile-title">Qualifier le travail sur un même poste</title><desc id="microsoft-migration-practice-qualification-fr-mobile-desc">Schleswig-Holstein. Au 7 octobre 2025, eJuVa 6.4, édité par PDV, corrige le format des courriels et pièces jointes transférés de Thunderbird vers eJuVa. Le test isolé a réussi. La qualification commune eJuVa et VIS-Justiz sur le même poste reste nécessaire : test eJuVa achevé, tests miroirs VIS-Justiz en cours. Le rapport du 4 novembre annonce une livraison de la fonctionnalité en octobre dans certaines installations, dont la justice, sans nommer la version livrée. Le 19 mars 2026, le parcours Thunderbird est disponible et le parcours web fait l’objet d’un développement séparé.</desc><rect x="0" y="0" width="400" height="1470" rx="18" fill="#0c0d10" stroke="none" stroke-width="1"></rect><g data-region="eyebrow" data-bounds="24 16 352 34"><text x="34" y="37" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5eead4" text-anchor="start">l0g / MIGRATION EN PRATIQUE</text></g><g data-region="heading" data-bounds="24 55 352 85"><text x="34" y="91" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#e7e9ee" text-anchor="start">Qualifier le travail</text><text x="34" y="125" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#e7e9ee" text-anchor="start">sur un même poste</text></g><g data-region="subtitle" data-bounds="24 141 352 63"><text x="34" y="164" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="start">Schleswig-Holstein · courriels et dossiers</text><text x="34" y="187" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="start">États documentés en 2025 et 2026</text></g><g data-region="correction-stage" data-bounds="24 218 352 39"><text x="34" y="242" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#5eead4" text-anchor="start">1 · CORRECTION</text></g><g data-node="isolated-test"><rect x="32" y="269" width="336" height="200" rx="8" fill="#171a20" stroke="none" stroke-width="1"></rect></g><g data-region="mail-origin" data-bounds="40 279 320 40"><text x="200" y="303" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#e7e9ee" text-anchor="middle">Thunderbird · courriel + pièces jointes</text></g><g data-edge="mail-to-correction"><line x1="200" y1="328" x2="200" y2="354" stroke="#8b909b" stroke-width="2"></line><path d="M196 346 L200 354 L204 346" fill="none" stroke="#8b909b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-region="corrected-version" data-bounds="40 365 320 44"><text x="200" y="396" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#e7e9ee" text-anchor="middle">eJuVa 6.4 (PDV)</text></g><g data-region="isolated-result" data-bounds="40 420 320 40"><text x="200" y="444" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#5eead4" text-anchor="middle">Format corrigé · test isolé réussi</text></g><g data-edge="isolated-to-cross"><line x1="200" y1="478" x2="200" y2="509" stroke="#5eead4" stroke-width="2"></line><path d="M196 501 L200 509 L204 501" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-region="qualification-stage" data-bounds="24 521 352 40"><text x="34" y="545" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#5eead4" text-anchor="start">2 · QUALIFICATION CROISÉE</text></g><g data-node="same-workstation"><rect x="32" y="575" width="336" height="258" rx="8" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></rect></g><g data-region="same-workstation-label" data-bounds="40 585 320 43"><text x="200" y="611" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#e7e9ee" text-anchor="middle">UN MÊME POSTE</text></g><g data-node="ejuva"><rect x="48" y="650" width="136" height="116" rx="8" fill="#171a20" stroke="none" stroke-width="1"></rect></g><g data-node="vis"><rect x="216" y="650" width="136" height="116" rx="8" fill="#171a20" stroke="none" stroke-width="1"></rect></g><g data-region="ejuva-title" data-bounds="52 659 128 41"><text x="116" y="687" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#e7e9ee" text-anchor="middle">eJuVa</text></g><g data-region="vis-title" data-bounds="220 659 128 41"><text x="284" y="687" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#e7e9ee" text-anchor="middle">VIS-Justiz</text></g><g data-region="ejuva-status" data-bounds="52 706 128 58"><text x="116" y="730" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#5eead4" text-anchor="middle">Test</text><text x="116" y="753" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#5eead4" text-anchor="middle">achevé</text></g><g data-region="vis-status" data-bounds="220 706 128 58"><text x="284" y="730" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#f5b13d" text-anchor="middle">Tests miroirs</text><text x="284" y="753" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#f5b13d" text-anchor="middle">en cours</text></g><g data-edge="cross-qualification"><line x1="190" y1="685" x2="210" y2="685" stroke="#8b909b" stroke-width="2"></line><path d="M202 689 L210 685 L202 681" fill="none" stroke="#8b909b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><line x1="210" y1="725" x2="190" y2="725" stroke="#8b909b" stroke-width="2"></line><path d="M198 721 L190 725 L198 729" fill="none" stroke="#8b909b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-region="snapshot" data-bounds="40 783 320 39"><text x="200" y="807" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#8b909b" text-anchor="middle">Constat du 7 octobre 2025</text></g><g data-edge="later-report"><line x1="200" y1="842" x2="200" y2="876" stroke="#8b909b" stroke-width="2" stroke-dasharray="4 5"></line><path d="M196 868 L200 876 L204 868" fill="none" stroke="#8b909b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-region="delivery-stage" data-bounds="24 890 352 40"><text x="34" y="914" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#5eead4" text-anchor="start">3 · LIVRAISON LOCALE</text></g><g data-node="local-delivery"><rect x="32" y="944" width="336" height="155" rx="8" fill="#171a20" stroke="none" stroke-width="1"></rect></g><g data-region="delivery-date" data-bounds="40 951 320 40"><text x="200" y="975" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#8b909b" text-anchor="middle">Compte rendu du 4 novembre 2025</text></g><g data-region="delivery-result" data-bounds="40 1005 320 91"><text x="200" y="1029" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#e7e9ee" text-anchor="middle">Fonction livrée en octobre</text><text x="200" y="1057" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#e7e9ee" text-anchor="middle">Certaines installations,</text><text x="200" y="1085" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#e7e9ee" text-anchor="middle">dont la justice.</text></g><g data-region="later-status" data-bounds="24 1125 352 40"><text x="34" y="1149" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#8b909b" text-anchor="start">19 MARS 2026 · LES PARCOURS</text></g><g data-node="thunderbird-route"><rect x="32" y="1179" width="336" height="71" rx="8" fill="#171a20" stroke="none" stroke-width="1"></rect></g><g data-region="thunderbird-route-label" data-bounds="40 1182 320 65"><text x="200" y="1207" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#5eead4" text-anchor="middle">Thunderbird → dossier</text><text x="200" y="1233" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#5eead4" text-anchor="middle">Disponible</text></g><g data-node="web-route"><rect x="32" y="1266" width="336" height="71" rx="8" fill="#171a20" stroke="none" stroke-width="1"></rect></g><g data-region="web-route-label" data-bounds="40 1269 320 65"><text x="200" y="1294" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#f5b13d" text-anchor="middle">Parcours web</text><text x="200" y="1320" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#f5b13d" text-anchor="middle">Développement séparé</text></g><g data-region="qualification-source" data-bounds="24 1363 352 96"><text x="34" y="1384" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#8b909b" text-anchor="start">Sources : Landtag, 20/3632, p. 3–4 ;</text><text x="34" y="1408" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#8b909b" text-anchor="start">20/5509, p. 2–3 ; 20/6328, p. 4.</text><text x="34" y="1432" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#8b909b" text-anchor="start">Pointillés : constat ultérieur.</text></g></svg>