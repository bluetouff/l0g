<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 710" role="img" aria-labelledby="microsoft-migration-practice-qualification-fr-desktop-title microsoft-migration-practice-qualification-fr-desktop-desc"><title id="microsoft-migration-practice-qualification-fr-desktop-title">Qualifier le travail sur un même poste</title><desc id="microsoft-migration-practice-qualification-fr-desktop-desc">Schleswig-Holstein. Au 7 octobre 2025, eJuVa 6.4, édité par PDV, corrige le format des courriels et pièces jointes transférés de Thunderbird vers eJuVa. Le test isolé a réussi. La qualification commune eJuVa et VIS-Justiz sur le même poste reste nécessaire : test eJuVa achevé, tests miroirs VIS-Justiz en cours. Le rapport du 4 novembre annonce une livraison de la fonctionnalité en octobre dans certaines installations, dont la justice, sans nommer la version livrée. Le 19 mars 2026, le parcours Thunderbird est disponible et le parcours web fait l’objet d’un développement séparé.</desc><rect x="0" y="0" width="1000" height="710" rx="18" fill="#0c0d10" stroke="none" stroke-width="1"></rect><g data-region="eyebrow" data-bounds="24 16 952 34"><text x="34" y="39" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#5eead4" text-anchor="start">l0g / MIGRATION EN PRATIQUE</text></g><g data-region="heading" data-bounds="24 55 952 59"><text x="34" y="97" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#e7e9ee" text-anchor="start">Qualifier le travail sur un même poste</text></g><g data-region="subtitle" data-bounds="24 116 952 40"><text x="34" y="142" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#8b909b" text-anchor="start">Schleswig-Holstein · courriels et dossiers · États documentés en 2025 et 2026</text></g><g data-region="correction-stage" data-bounds="24 177 280 40"><text x="34" y="201" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#5eead4" text-anchor="start">1 · CORRECTION</text></g><g data-region="qualification-stage" data-bounds="326 177 382 40"><text x="517" y="201" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#5eead4" text-anchor="middle">2 · QUALIFICATION CROISÉE</text></g><g data-region="delivery-stage" data-bounds="750 177 226 40"><text x="760" y="201" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#5eead4" text-anchor="start">3 · LIVRAISON LOCALE</text></g><g data-node="isolated-test"><rect x="32" y="234" width="260" height="262" rx="8" fill="#171a20" stroke="none" stroke-width="1"></rect></g><g data-region="mail-origin" data-bounds="44 242 236 67"><text x="162" y="269" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" fill="#e7e9ee" text-anchor="middle">Thunderbird</text><text x="162" y="297" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" fill="#e7e9ee" text-anchor="middle">Courriel + pièces jointes</text></g><g data-edge="mail-to-correction"><line x1="162" y1="316" x2="162" y2="342" stroke="#8b909b" stroke-width="2"></line><path d="M158 334 L162 342 L166 334" fill="none" stroke="#8b909b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-region="corrected-version" data-bounds="44 353 236 43"><text x="162" y="383" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#e7e9ee" text-anchor="middle">eJuVa 6.4 (PDV)</text></g><g data-region="isolated-result" data-bounds="44 400 236 74"><text x="162" y="426" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#5eead4" text-anchor="middle">Format corrigé</text><text x="162" y="456" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#5eead4" text-anchor="middle">Test isolé réussi</text></g><g data-node="same-workstation"><rect x="334" y="234" width="366" height="262" rx="8" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></rect></g><g data-region="same-workstation-label" data-bounds="342 245 350 45"><text x="517" y="271" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#e7e9ee" text-anchor="middle">UN MÊME POSTE</text></g><g data-node="ejuva"><rect x="350" y="305" width="150" height="131" rx="8" fill="#171a20" stroke="none" stroke-width="1"></rect></g><g data-node="vis"><rect x="534" y="305" width="150" height="131" rx="8" fill="#171a20" stroke="none" stroke-width="1"></rect></g><g data-region="ejuva-title" data-bounds="354 317 142 42"><text x="425" y="345" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#e7e9ee" text-anchor="middle">eJuVa</text></g><g data-region="vis-title" data-bounds="538 317 142 42"><text x="609" y="345" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#e7e9ee" text-anchor="middle">VIS-Justiz</text></g><g data-region="ejuva-status" data-bounds="354 368 142 61"><text x="425" y="393" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#5eead4" text-anchor="middle">Test</text><text x="425" y="417" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#5eead4" text-anchor="middle">achevé</text></g><g data-region="vis-status" data-bounds="538 368 142 60"><text x="609" y="392" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#f5b13d" text-anchor="middle">Tests miroirs</text><text x="609" y="416" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#f5b13d" text-anchor="middle">en cours</text></g><g data-edge="cross-qualification"><line x1="506" y1="352" x2="528" y2="352" stroke="#8b909b" stroke-width="2"></line><path d="M520 356 L528 352 L520 348" fill="none" stroke="#8b909b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><line x1="528" y1="386" x2="506" y2="386" stroke="#8b909b" stroke-width="2"></line><path d="M514 382 L506 386 L514 390" fill="none" stroke="#8b909b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-region="snapshot" data-bounds="342 448 350 40"><text x="517" y="472" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#8b909b" text-anchor="middle">Constat du 7 octobre 2025</text></g><g data-edge="isolated-to-cross"><line x1="300" y1="344" x2="326" y2="344" stroke="#5eead4" stroke-width="2"></line><path d="M318 348 L326 344 L318 340" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-node="local-delivery"><rect x="758" y="234" width="210" height="262" rx="8" fill="#171a20" stroke="none" stroke-width="1"></rect></g><g data-region="delivery-date" data-bounds="766 246 194 65"><text x="863" y="271" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#8b909b" text-anchor="middle">4 novembre 2025</text><text x="863" y="299" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#8b909b" text-anchor="middle">Compte rendu</text></g><g data-region="delivery-result" data-bounds="766 329 194 144"><text x="863" y="353" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#e7e9ee" text-anchor="middle">Fonction livrée</text><text x="863" y="384" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#e7e9ee" text-anchor="middle">en octobre</text><text x="863" y="415" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#e7e9ee" text-anchor="middle">Certaines installations,</text><text x="863" y="446" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#e7e9ee" text-anchor="middle">dont la justice</text></g><g data-edge="later-report"><line x1="710" y1="344" x2="748" y2="344" stroke="#8b909b" stroke-width="2" stroke-dasharray="4 5"></line><path d="M740 348 L748 344 L740 340" fill="none" stroke="#8b909b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-region="later-status" data-bounds="24 521 952 40"><text x="34" y="544" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#8b909b" text-anchor="start">19 MARS 2026 · DEUX PARCOURS DISTINCTS</text></g><g data-node="thunderbird-route"><rect x="32" y="570" width="435" height="63" rx="8" fill="#171a20" stroke="none" stroke-width="1"></rect></g><g data-region="thunderbird-route-label" data-bounds="42 581 415 42"><text x="249.5" y="607" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#5eead4" text-anchor="middle">Thunderbird → dossier : disponible</text></g><g data-node="web-route"><rect x="501" y="570" width="467" height="63" rx="8" fill="#171a20" stroke="none" stroke-width="1"></rect></g><g data-region="web-route-label" data-bounds="511 581 447 42"><text x="734.5" y="607" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#f5b13d" text-anchor="middle">Parcours web : développement séparé</text></g><g data-region="qualification-source" data-bounds="24 661 952 35"><text x="34" y="682" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#8b909b" text-anchor="start">Sources : Landtag, 20/3632, p. 3–4 ; 20/5509, p. 2–3 ; 20/6328, p. 4 · Pointillés : constat ultérieur</text></g></svg>