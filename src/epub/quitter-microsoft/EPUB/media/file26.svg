<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 758" role="img" aria-labelledby="microsoft-choice-sovereignty-fr-desktop-title microsoft-choice-sovereignty-fr-desktop-desc"><title id="microsoft-choice-sovereignty-fr-desktop-title">Un seuil, puis un score pondéré</title><desc id="microsoft-choice-sovereignty-fr-desktop-desc">Marché cloud de la Commission européenne. Huit objectifs doivent chacun atteindre au moins SEAL 2. Un seul objectif insuffisant entraîne le rejet. Le niveau SEAL global est le minimum des huit niveaux, et non leur moyenne. Les offres satisfaisant le seuil peuvent ensuite être comparées par leur score de souveraineté : chaque score d’objectif est divisé par son maximum, puis pondéré à 15, 10, 10, 15, 20, 15, 10 et 5 pour cent. Ce score contribue au score de qualité. Aucun score candidat ni poids dans la note finale du marché n’est représenté.</desc><rect x="0" y="0" width="1000" height="758" rx="18" fill="#0c0d10" stroke="none" stroke-width="1"></rect><g data-region="eyebrow" data-bounds="24 16 952 34"><text x="34" y="39" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#5eead4" text-anchor="start">l0g / CHOIX DU CLOUD</text></g><g data-region="heading" data-bounds="24 55 952 59"><text x="34" y="97" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#e7e9ee" text-anchor="start">Un seuil, puis un score pondéré</text></g><g data-region="subtitle" data-bounds="24 116 952 40"><text x="34" y="142" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#8b909b" text-anchor="start">Marché de la Commission européenne · Cadre 2025 · guide de mise en œuvre 2026</text></g><g data-node="objectives"><rect x="32" y="184" width="337" height="330" rx="8" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></rect></g><g data-region="objectives-heading" data-bounds="40 191 321 38"><text x="50" y="215" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#e7e9ee" text-anchor="start">8 OBJECTIFS ÉVALUÉS</text></g><g data-region="objective-1" data-bounds="44 235 313 37"><text x="54" y="260" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#e7e9ee" text-anchor="start">1 · Stratégie</text></g><g data-edge="objective-1-to-threshold"><path d="M377 255 C401 255 410 326 437 326" fill="none" stroke="#8b909b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-region="objective-2" data-bounds="44 269 313 37"><text x="54" y="294" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#e7e9ee" text-anchor="start">2 · Droit et juridiction</text></g><g data-edge="objective-2-to-threshold"><path d="M377 289 C401 289 410 326 437 326" fill="none" stroke="#8b909b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-region="objective-3" data-bounds="44 303 313 37"><text x="54" y="328" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#e7e9ee" text-anchor="start">3 · Données et IA</text></g><g data-edge="objective-3-to-threshold"><path d="M377 323 C401 323 410 326 437 326" fill="none" stroke="#8b909b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-region="objective-4" data-bounds="44 337 313 37"><text x="54" y="362" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#e7e9ee" text-anchor="start">4 · Opérations</text></g><g data-edge="objective-4-to-threshold"><path d="M377 357 C401 357 410 326 437 326" fill="none" stroke="#8b909b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-region="objective-5" data-bounds="44 371 313 37"><text x="54" y="396" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#e7e9ee" text-anchor="start">5 · Chaîne de fournisseurs</text></g><g data-edge="objective-5-to-threshold"><path d="M377 391 C401 391 410 326 437 326" fill="none" stroke="#8b909b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-region="objective-6" data-bounds="44 405 313 37"><text x="54" y="430" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#e7e9ee" text-anchor="start">6 · Technologie</text></g><g data-edge="objective-6-to-threshold"><path d="M377 425 C401 425 410 326 437 326" fill="none" stroke="#8b909b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-region="objective-7" data-bounds="44 439 313 37"><text x="54" y="464" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#e7e9ee" text-anchor="start">7 · Sécurité et conformité</text></g><g data-edge="objective-7-to-threshold"><path d="M377 459 C401 459 410 326 437 326" fill="none" stroke="#8b909b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-region="objective-8" data-bounds="44 473 313 37"><text x="54" y="498" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#e7e9ee" text-anchor="start">8 · Environnement</text></g><g data-edge="objective-8-to-threshold"><path d="M377 493 C401 493 410 326 437 326" fill="none" stroke="#8b909b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-node="minimum-gate"><rect x="445" y="222" width="224" height="202" rx="8" fill="#121419" stroke="#5eead4" stroke-width="1"></rect></g><g data-region="threshold-heading" data-bounds="453 233 208 36"><text x="557" y="256" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#5eead4" text-anchor="middle">SEUIL DU MARCHÉ</text></g><g data-region="minimum" data-bounds="453 272 208 72"><text x="557" y="320" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#e7e9ee" text-anchor="middle">SEAL 2</text></g><g data-region="minimum-rule" data-bounds="453 346 208 70"><text x