<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 722" role="img" aria-labelledby="microsoft-choice-switching-fr-desktop-title microsoft-choice-switching-fr-desktop-desc"><title id="microsoft-choice-switching-fr-desktop-title">Les étapes d’une sortie cloud</title><desc id="microsoft-choice-switching-fr-desktop-desc">Article 25 du Data Act, services couverts. Dès la demande, préavis de deux mois au maximum, puis transition normalement de trente jours calendaires au maximum, avec continuité du service. Si ce délai est techniquement impossible, le fournisseur le justifie et le notifie sous quatorze jours ouvrables à compter de la demande, avec une transition alternative de sept mois au maximum. Le client peut prolonger la transition une fois pour une durée qu’il juge appropriée. Le schéma ne calcule aucune durée totale et ne fixe pas le départ des sept mois. La récupération dure au moins trente jours calendaires après la fin de la transition convenue. L’effacement suit ce délai, ou une date ultérieure convenue, si le changement a réussi. Le contrat est résilié au succès du changement, avec notification au client.</desc><rect x="0" y="0" width="1000" height="722" rx="18" fill="#0c0d10" stroke="none" stroke-width="1"></rect><g data-region="eyebrow" data-bounds="24 16 952 34"><text x="34" y="39" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#5eead4" text-anchor="start">l0g / DATA ACT</text></g><g data-region="heading" data-bounds="24 55 952 59"><text x="34" y="97" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#e7e9ee" text-anchor="start">Les étapes d’une sortie cloud</text></g><g data-region="subtitle" data-bounds="24 116 952 40"><text x="34" y="142" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#8b909b" text-anchor="start">Contrat de service couvert · article 25 · Délais distincts · schéma sans échelle de temps</text></g><g data-node="technical-extension"><rect x="32" y="190" width="460" height="124" rx="8" fill="#121419" stroke="#f5b13d" stroke-width="1"></rect></g><g data-region="technical-label" data-bounds="40 198 444 108"><text x="50" y="222" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#f5b13d" text-anchor="start">IMPOSSIBILITÉ TECHNIQUE MOTIVÉE</text><text x="50" y="253" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#f5b13d" text-anchor="start">Notification sous 14 jours ouvrables dès la demande</text><text x="50" y="284" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#f5b13d" text-anchor="start">Transition alternative : 7 mois au maximum</text></g><g data-node="customer-extension"><rect x="534" y="190" width="434" height="124" rx="8" fill="#121419" stroke="#5eead4" stroke-width="1"></rect></g><g data-region="customer-label" data-bounds="542 198 418 107"><text x="552" y="222" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#5eead4" text-anchor="start">CHOIX DU CLIENT</text><text x="552" y="253" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#5eead4" text-anchor="start">Une prolongation de la transition</text><text x="552" y="284" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#5eead4" text-anchor="start">Pour une durée qu’il juge appropriée</text></g><g data-edge="technical-to-transition"><path d="M262 322 L262 338 L400 338" fill="none" stroke="#f5b13d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-edge="customer-to-transition"><path d="M751 322 L751 338 L400 338" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-edge="extensions-modify-transition"><line x1="400" y1="338" x2="400" y2="360" stroke="#5eead4" stroke-width="2"></line><path d="M396 352 L400 360 L404 352" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-node="notice"><rect x="32" y="370" width="202" height="222" rx="8" fill="#171a20" stroke="none" stroke-width="1"></rect></g><g data-node="transition"><rect x="276" y="370" width="254" height="222" rx="8" fill="#171a20" stroke="none" stroke-width="1"></rect></g><g data-node="retrieval"><rect x="572" y="370" width="218" height="222" rx="8" fill="#171a20" stroke="none" stroke-width="1"></rect></g><g data-node="erasure"><rect x="830" y="370" width="138" height="222" rx="8" fill="#171a20" stroke="none" stroke-width="1"></rect></g><g data-region="notice-stage" data-bounds="40 382 186 38"><text x="50" y="405" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#8b909b" text-anchor="start">PRÉAVIS</text></g><g data-region="notice-duration" data-bounds="40 425 186 57"><text x="50" y="462" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#e7e9ee" text-anchor="start">≤ 2 mois</text></g><g data-region="notice-rule" data-bounds="40 487 186 89"><text x="50" y="512" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#e7e9ee" text-anchor="start">À compter de</text><text x="50" y="538" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#e7e9ee" text-anchor="start">la demande</text><text x="50" y="564" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#e7e9ee" text-anchor="start">de changement</text></g><g data-edge="notice-to-transition"><line x1="242" y1="477" x2="268" y2="477" stroke="#5eead4" stroke-width="2"></line><path d="M260 481 L268 477 L260 473" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-region="transition-stage" data-bounds="284 382 238 38"><text x="294" y="405" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#8b909b" text-anchor="start">TRANSITION</text></g><g data-region="transition-duration" data-bounds="284 425 238 57"><text x="294" y="463" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#e7e9ee" text-anchor="start">≤ 30 jours</text></g><g data-region="transition-rule" data-bounds="284 487 238 87"><text x="294" y="511" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#e7e9ee" text-anchor="start">Calendaires · règle normale</text><text x="294" y="537" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#e7e9ee" text-anchor="start">Après le préavis</text><text x="294" y="563" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#e7e9ee" text-anchor="start">Service maintenu</text></g><g data-edge="transition-to-retrieval"><line x1="538" y1="477" x2="564" y2="477" stroke="#5eead4" stroke-width="2"></line><path d="M556 481 L564 477 L556 473" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-region="retrieval-stage" data-bounds="580 382 202 38"><text x="590" y="405" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#8b909b" text-anchor="start">RÉCUPÉRATION</text></g><g data-region="retrieval-duration" data-bounds="580 425 202 57"><text x="590" y="462" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#e7e9ee" text-anchor="start">≥ 30 jours</text></g><g data-region="retrieval-rule" data-bounds="580 487 202 87"><text x="590" y="511" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#e7e9ee" text-anchor="start">Calendaires</text><text x="590" y="537" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#e7e9ee" text-anchor="start">Après la fin de</text><text x="590" y="563" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#e7e9ee" text-anchor="start">la transition convenue</text></g><g data-edge="retrieval-to-erasure"><line x1="798" y1="477" x2="822" y2="477" stroke="#5eead4" stroke-width="2"></line><path d="M814 481 L822 477 L814 473" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-region="erasure-stage" data-bounds="838 382 122 38"><text x="899" y="403" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#8b909b" text-anchor="middle">EFFACEMENT</text></g><g data-region="erasure-rule" data-bounds="838 438 122 157"><text x="899" y="459" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" fill="#e7e9ee" text-anchor="middle">Après le délai</text><text x="899" y="480" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" fill="#e7e9ee" text-anchor="middle">de récupération</text><text x="899" y="501" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" fill="#e7e9ee" text-anchor="middle">ou à une date</text><text x="899" y="522" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" fill="#e7e9ee" text-anchor="middle">ultérieure</text><text x="899" y="543" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" fill="#e7e9ee" text-anchor="middle">convenue</text><text x="899" y="564" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" fill="#e7e9ee" text-anchor="middle">Si le changement</text><text x="899" y="585" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" fill="#e7e9ee" text-anchor="middle">a réussi</text></g><g data-region="termination" data-bounds="24 615 952 44"><text x="34" y="641" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#5eead4" text-anchor="start">Au succès du changement : résiliation du contrat, notifiée par le fournisseur.</text></g><g data-region="switching-source" data-bounds="24 674 952 34"><text x="34" y="695" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#8b909b" text-anchor="start">Source : règlement (UE) 2023/2854, article 25, § 2 à 5 · Les branches modifient la transition.</text></g></svg>