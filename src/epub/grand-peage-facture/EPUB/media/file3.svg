<svg viewBox="0 0 720 720" width="100%" role="img" aria-labelledby="numbers-title-fr numbers-desc-fr" preserveAspectRatio="xMidYMid meet" overflow="hidden" xmlns="http://www.w3.org/2000/svg" style="font-family:ui-monospace,SFMono-Regular,monospace;background:#0c0d10">
<title id="numbers-title-fr">Ce que les nombres disent et ne disent pas</title>
<desc id="numbers-desc-fr">La liste officielle compte 148 plateformes principales et 18 dossiers en attente. Le chiffre de quinze infrastructures vient d'un compte rendu secondaire. Aucune liste officielle ne les nomme.</desc>
<rect x="1" y="1" width="718" height="718" rx="16" fill="#0c0d10" stroke="#2b3038"></rect>
<text x="32" y="46" fill="#f5f6f8" font-size="21" font-weight="700">QUATRE NOMBRES, QUATRE NIVEAUX DE PREUVE</text>
<text x="32" y="70" fill="#8b909b" font-size="12">Photographie des fichiers accessibles le 22 août 2026.</text>
<rect x="32" y="98" width="656" height="118" rx="12" fill="#10211f" stroke="#5eead4"></rect>
<rect x="54" y="123" width="112" height="66" rx="9" fill="#0c302b" stroke="#5eead4"></rect>
<text x="110" y="154" text-anchor="middle" fill="#5eead4" font-size="28" font-weight="700">148</text>
<text x="110" y="176" text-anchor="middle" fill="#b8e8df" font-size="10">liste principale</text>
<text x="190" y="138" fill="#5eead4" font-size="11" font-weight="700">SOURCE PRIMAIRE</text>
<text x="190" y="164" fill="#f5f6f8" font-size="17" font-weight="700">Lignes du fichier principal de la DGFiP</text>
<text x="190" y="188" fill="#c3cbc9" font-size="12">Autorisation visible, pas moteur indépendant démontré.</text>
<rect x="32" y="236" width="656" height="118" rx="12" fill="#142039" stroke="#7aa2f7"></rect>
<rect x="54" y="261" width="112" height="66" rx="9" fill="#172b53" stroke="#7aa2f7"></rect>
<text x="110" y="292" text-anchor="middle" fill="#7aa2f7" font-size="28" font-weight="700">18</text>
<text x="110" y="314" text-anchor="middle" fill="#c5d6fa" font-size="10">tests en attente</text>
<text x="190" y="276" fill="#7aa2f7" font-size="11" font-weight="700">SOURCE PRIMAIRE</text>
<text x="190" y="302" fill="#f5f6f8" font-size="17" font-weight="700">Dossiers complets encore en interopérabilité</text>
<text x="190" y="326" fill="#c9d3e8" font-size="12">Population distincte de la liste principale.</text>
<rect x="32" y="374" width="656" height="118" rx="12" fill="#2b2315" stroke="#f5b13d"></rect>
<rect x="54" y="399" width="112" height="66" rx="9" fill="#3b2d12" stroke="#f5b13d"></rect>
<text x="110" y="430" text-anchor="middle" fill="#f5b13d" font-size="28" font-weight="700">15</text>
<text x="110" y="452" text-anchor="middle" fill="#f0d49b" font-size="10">infrastructures</text>
<text x="190" y="414" fill="#f5b13d" font-size="11" font-weight="700">SOURCE SECONDAIRE ATTRIBUÉE</text>
<text x="190" y="440" fill="#f5f6f8" font-size="17" font-weight="700">Estimation rapportée au nom de la DGFiP</text>
<text x="190" y="464" fill="#e4d5b8" font-size="12">Aucune méthodologie publique retrouvée par l0g.</text>
<rect x="32" y="512" width="656" height="118" rx="12" fill="#2d151f" stroke="#ff4d87"></rect>
<rect x="54" y="537" width="112" height="66" rx="9" fill="#3b1422" stroke="#ff4d87"></rect>
<text x="110" y="568" text-anchor="middle" fill="#ff8fb0" font-size="28" font-weight="700">0</text>
<text x="110" y="590" text-anchor="middle" fill="#f4bfd0" font-size="10">liste nominative</text>
<text x="190" y="552" fill="#ff8fb0" font-size="11" font-weight="700">DOCUMENT PUBLIC TROUVÉ</text>
<text x="190" y="578" fill="#f5f6f8" font-size="17" font-weight="700">Aucun fichier officiel ne nomme les quinze</text>
<text x="190" y="602" fill="#e5c4cf" font-size="12">Ni volumes par moteur, ni relations de support publiées.</text>
<rect x="32" y="654" width="656" height="38" rx="9" fill="#181b21" stroke="#3a4049"></rect>
<text x="360" y="678" text-anchor="middle" fill="#d6d9df" font-size="12">QUESTION OUVERTE : COMBIEN D'INFRASTRUCTURES ?</text>
</svg>
