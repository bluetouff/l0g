<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 900" width="100%" role="img" aria-labelledby="free-models-title free-models-desc" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" style="display:block;width:100%;height:auto;overflow:hidden;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#0c0d10">
<title id="free-models-title">Six manières d’écrire zéro euro</title>
<desc id="free-models-desc">Les offres gratuites peuvent être autonomes, réservées à un statut, limitées par un petit quota, gratuites jusqu’à un seuil élevé, limitées par un autre usage ou incluses dans un produit payé.</desc>
<rect x="1" y="1" width="718" height="898" rx="16" fill="#0c0d10" stroke="#2b3038"></rect>
<text x="32" y="48" fill="#f5f6f8" font-size="21" font-weight="700">SIX MANIÈRES D’ÉCRIRE 0 €</text>
<text x="32" y="74" fill="#8b909b" font-size="12">Le prix d’entrée ne décrit ni le périmètre, ni la durée, ni la sortie.</text>
<rect x="30" y="106" width="320" height="190" rx="14" fill="#10211f" stroke="#5eead4"></rect>
<text x="52" y="136" fill="#5eead4" font-size="13" font-weight="700">1. ZÉRO AUTONOME</text>
<text x="52" y="168" fill="#f5f6f8" font-size="14">Le socle réglementaire est affiché</text>
<text x="52" y="191" fill="#f5f6f8" font-size="14">à 0 €, parfois sans compte requis.</text>
<text x="52" y="226" fill="#aeb4bf" font-size="12">Exemples publics :</text>
<text x="52" y="248" fill="#aeb4bf" font-size="12">Qonto, Dougs, Indy, Abby, Tiime</text>
<text x="52" y="272" fill="#f5b13d" font-size="11">À vérifier : utilisateurs, API, support.</text>
<rect x="370" y="106" width="320" height="190" rx="14" fill="#151a23" stroke="#7aa2f7"></rect>
<text x="392" y="136" fill="#7aa2f7" font-size="13" font-weight="700">2. STATUT RÉSERVÉ</text>
<text x="392" y="168" fill="#f5f6f8" font-size="14">Le zéro dépend de la forme</text>
<text x="392" y="191" fill="#f5f6f8" font-size="14">ou du régime de l’entreprise.</text>
<text x="392" y="226" fill="#aeb4bf" font-size="12">Pennylane :</text>
<text x="392" y="248" fill="#aeb4bf" font-size="12">micro, 1 utilisateur, 1 200/an</text>
<text x="392" y="272" fill="#f5b13d" font-size="11">La croissance peut changer de plan.</text>
<rect x="30" y="318" width="320" height="190" rx="14" fill="#211713" stroke="#f5b13d"></rect>
<text x="52" y="348" fill="#f5b13d" font-size="13" font-weight="700">3. PETIT QUOTA</text>
<text x="52" y="380" fill="#f5f6f8" font-size="14">Le plan gratuit existe, mais</text>
<text x="52" y="403" fill="#f5f6f8" font-size="14">une activité normale le dépasse vite.</text>
<text x="52" y="438" fill="#aeb4bf" font-size="12">B2BRouter : 24 transactions/an</text>
<text x="52" y="460" fill="#aeb4bf" font-size="12">VosFactures : 3 documents/mois</text>
<text x="52" y="484" fill="#f5b13d" font-size="11">Le mot facturable doit être défini.</text>
<rect x="370" y="318" width="320" height="190" rx="14" fill="#111d25" stroke="#33b5e5"></rect>
<text x="392" y="348" fill="#33b5e5" font-size="13" font-weight="700">4. SEUIL ÉLEVÉ</text>
<text x="392" y="380" fill="#f5f6f8" font-size="14">Le zéro couvre un vrai volume,</text>
<text x="392" y="403" fill="#f5f6f8" font-size="14">puis le tarif devient proportionnel.</text>
<text x="392" y="438" fill="#aeb4bf" font-size="12">SUPER PDP : 1 000/mois</text>
<text x="392" y="460" fill="#aeb4bf" font-size="12">macompta.fr : 20/mois hors abonnement</text>
<text x="392" y="484" fill="#f5b13d" font-size="11">Le dépassement doit être simulé.</text>
<rect x="30" y="530" width="320" height="190" rx="14" fill="#19151f" stroke="#c084fc"></rect>
<text x="52" y="560" fill="#c084fc" font-size="13" font-weight="700">5. USAGE LIMITÉ</text>
<text x="52" y="592" fill="#f5f6f8" font-size="14">La limite porte ailleurs que sur</text>
<text x="52" y="615" fill="#f5f6f8" font-size="14">le nombre de factures.</text>
<text x="52" y="650" fill="#aeb4bf" font-size="12">Shine Facture :</text>
<text x="52" y="672" fill="#aeb4bf" font-size="12">factures annoncées illimitées, 5 clients</text>
<text x="52" y="696" fill="#f5b13d" font-size="11">Le bon compteur n’est pas toujours visible.</text>
<rect x="370" y="530" width="320" height="190" rx="14" fill="#211317" stroke="#ff4d87"></rect>
<text x="392" y="560" fill="#ff8fb0" font-size="13" font-weight="700">6. BUNDLE OU PROMOTION</text>
<text x="392" y="592" fill="#f5f6f8" font-size="14">La PA est incluse dans un produit</text>
<text x="392" y="615" fill="#f5f6f8" font-size="14">payé, ou gratuite pendant un temps.</text>
<text x="392" y="650" fill="#aeb4bf" font-size="12">Sage, Cegid, Dext : inclus</text>
<text x="392" y="672" fill="#aeb4bf" font-size="12">Kolecto : première année créateur</text>
<text x="392" y="696" fill="#f5b13d" font-size="11">Sans surcoût ne signifie pas sans coût.</text>
<rect x="30" y="756" width="660" height="104" rx="13" fill="#111720" stroke="#3a4049"></rect>
<text x="52" y="788" fill="#8b909b" font-size="12" font-weight="700">RÉSULTAT DE L’AUDIT PUBLIC</text>
<text x="52" y="820" fill="#f5f6f8" font-size="15">13 SUR 19 : ENTRÉE À 0 € NON AMBIGUË.</text>
<text x="52" y="846" fill="#d6d9df" font-size="12">Le périmètre du zéro compte davantage que sa présence dans le titre.</text>
<text x="32" y="884" fill="#737985" font-size="9">SOURCES : grilles officielles des opérateurs, photographie l0g au 22 août 2026.</text>
</svg>
