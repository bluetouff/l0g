<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 700" width="100%" role="img" aria-labelledby="ppf-cost-title ppf-cost-desc" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" style="font-family:ui-monospace,SFMono-Regular,monospace;background:#0c0d10">
<title id="ppf-cost-title">Quatre évaluations publiques du coût du projet de facturation électronique</title>
<desc id="ppf-cost-desc">Les montants de 19,6, 86, 122 et 267,72 millions d’euros correspondent à des dates et périmètres différents. Ils ne forment pas une série homogène de dépassements.</desc>
<rect x="1" y="1" width="718" height="698" rx="16" fill="#0c0d10" stroke="#2b3038"></rect>
<text x="32" y="48" fill="#f5f6f8" font-size="22" font-weight="700">QUATRE CHIFFRES, QUATRE PÉRIMÈTRES</text>
<text x="32" y="73" fill="#8b909b" font-size="12">Les montants publiés ne peuvent pas être soustraits mécaniquement.</text>
<rect x="32" y="102" width="656" height="104" rx="12" fill="#121419" stroke="#5eead4"></rect>
<text x="52" y="130" fill="#5eead4" font-size="12" font-weight="700">2021 · CONTRAT FTAP</text>
<text x="52" y="166" fill="#f5f6f8" font-size="28" font-weight="700">19,6 M€</text>
<text x="218" y="154" fill="#d6d9df" font-size="14">construction de la plateforme publique</text>
<text x="218" y="178" fill="#8b909b" font-size="12">dans le périmètre financé par ce contrat</text>
<rect x="32" y="224" width="656" height="104" rx="12" fill="#121419" stroke="#7aa2f7"></rect>
<text x="52" y="252" fill="#7aa2f7" font-size="12" font-weight="700">MAI 2022 · DINUM, VOLET 1</text>
<text x="52" y="288" fill="#f5f6f8" font-size="28" font-weight="700">86 M€</text>
<text x="218" y="276" fill="#d6d9df" font-size="14">construction du projet</text>
<text x="218" y="300" fill="#8b909b" font-size="12">évaluation encore qualifiée d’incomplète</text>
<rect x="32" y="346" width="656" height="104" rx="12" fill="#121419" stroke="#f5b13d"></rect>
<text x="52" y="374" fill="#f5b13d" font-size="12" font-weight="700">JANVIER 2023 · DINUM, PROJET COMPLET</text>
<text x="52" y="410" fill="#f5f6f8" font-size="28" font-weight="700">122 M€</text>
<text x="218" y="398" fill="#d6d9df" font-size="14">construction réévaluée</text>
<text x="218" y="422" fill="#8b909b" font-size="12">210 M€ avec deux années de fonctionnement</text>
<rect x="32" y="468" width="656" height="104" rx="12" fill="#121419" stroke="#ff4d87"></rect>
<text x="52" y="496" fill="#ff8fb0" font-size="12" font-weight="700">PLF 2026 · PROJET 2021-2028</text>
<text x="52" y="532" fill="#f5f6f8" font-size="28" font-weight="700">267,72 M€</text>
<text x="250" y="520" fill="#d6d9df" font-size="14">coût complet jusqu’au déploiement</text>
<text x="250" y="544" fill="#8b909b" font-size="12">personnel et infrastructure conservée compris</text>
<rect x="32" y="594" width="656" height="70" rx="12" fill="#1a1015" stroke="#ff4d87"></rect>
<text x="52" y="622" fill="#ff8fb0" font-size="12" font-weight="700">LE CHIFFRE ENCORE INCONNU</text>
<text x="52" y="648" fill="#f5f6f8" font-size="15">Montant payé pour les fonctions développées puis supprimées.</text>
</svg>
