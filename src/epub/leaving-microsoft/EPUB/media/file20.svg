<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="microsoft-transition-cost-overlap-en-desktop-title microsoft-transition-cost-overlap-en-desktop-desc"><title id="microsoft-transition-cost-overlap-en-desktop-title">Funding the period of coexistence</title><desc id="microsoft-transition-cost-overlap-en-desktop-desc">Generic teaching diagram without a time or cost scale. The existing service remains funded during preparation, adaptation, training and validated migration waves. Ending the corresponding costs depends on closing the old service and adjusting its contract. Partial waves may prolong coexistence. The new service continues to require support, maintenance and development.</desc><rect x="0" y="0" width="1000" height="700" rx="18" fill="#0c0d10" stroke="none" stroke-width="1"></rect><g data-region="eyebrow" data-bounds="24 16 952 34"><text x="32" y="39" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#5eead4" text-anchor="start">l0g / WHEN COSTS START AND END</text></g><g data-region="heading" data-bounds="24 55 952 59"><text x="32" y="97" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#e7e9ee" text-anchor="start">Funding the period of coexistence</text></g><g data-region="subtitle" data-bounds="24 116 952 40"><text x="32" y="142" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#8b909b" text-anchor="start">Illustrative process · sequence of stages · No duration or spending scale</text></g><rect x="465" y="227" width="283" height="330" rx="10" fill="#121419" stroke="none" stroke-width="1"></rect><g data-region="coexistence" data-bounds="465 188 283 38"><text x="606.5" y="212" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#f5b13d" text-anchor="middle">COEXISTENCE</text></g><g data-region="prepare-phase" data-bounds="240 188 210 38"><text x="345" y="212" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#8b909b" text-anchor="middle">PREPARATION</text></g><g data-region="steady-phase" data-bounds="755 188 213 38"><text x="861.5" y="212" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#8b909b" text-anchor="middle">OPERATIONS</text></g><line x1="248" y1="231" x2="968" y2="231" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></line><g data-node="old-operation"><rect x="248" y="267" width="500" height="56" rx="6" fill="#171a20" stroke="none" stroke-width="1"></rect></g><rect x="248" y="267" width="5" height="56" rx="0" fill="#f5b13d" stroke="none" stroke-width="1"></rect><g data-node="new-preparation"><rect x="248" y="370" width="196" height="69" rx="6" fill="#171a20" stroke="none" stroke-width="1"></rect></g><g data-node="validated-waves"><rect x="480" y="370" width="250" height="69" rx="6" fill="#171a20" stroke="none" stroke-width="1"></rect></g><g data-node="new-maintenance"><rect x="480" y="490" width="488" height="57" rx="6" fill="#171a20" stroke="none" stroke-width="1"></rect></g><rect x="480" y="490" width="5" height="57" rx="0" fill="#5eead4" stroke="none" stroke-width="1"></rect><g data-region="old-lane" data-bounds="24 271 207 42"><text x="32" y="299" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#e7e9ee" text-anchor="start">Existing service</text></g><g data-region="old-cost" data-bounds="262 276 469 42"><text x="496.5" y="304" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#f5b13d" text-anchor="middle">Service and contract still funded</text></g><g data-region="new-lane" data-bounds="24 368 207 74"><text x="32" y="394" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#e7e9ee" text-anchor="start">New service</text><text x="32" y="420" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#e7e9ee" text-anchor="start">and user support</text></g><g data-region="prepare-detail" data-bounds="253 372 186 63"><text x="346" y="398" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#e7e9ee" text-anchor="middle">Adaptation</text><text x="346" y="423" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#e7e9ee" text-anchor="middle">Training</text></g><g data-region="waves-detail" data-bounds="485 372 240 63"><text x="605" y="398" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#5eead4" text-anchor="middle">Validate, then switch</text><text x="605" y="423" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#5eead4" text-anchor="middle">in waves</text></g><g data-edge="preparation-to-waves"><line x1="450" y1="404" x2="474" y2="404" stroke="#5eead4" stroke-width="2"></line><path d="M466 408 L474 404 L466 400" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-edge="waves-to-support"><line x1="605" y1="447" x2="605" y2="481" stroke="#5eead4" stroke-width="2"></line><path d="M601 473 L605 481 L609 473" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-region="support-lane" data-bounds="24 494 207 42"><text x="32" y="522" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#e7e9ee" text-anchor="start">Ongoing service</text></g><g data-region="maintenance-detail" data-bounds="491 498 465 43"><text x="723.5" y="526" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#5eead4" text-anchor="middle">Support · maintenance · development</text></g><g data-gate="conditional-exit"><line x1="748" y1="257" x2="748" y2="335" stroke="#f5b13d" stroke-width="3"></line></g><g data-region="exit-condition" data-bounds="758 249 211 90"><text x="766" y="273" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#f5b13d" text-anchor="start">Service closed</text><text x="766" y="298" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#f5b13d" text-anchor="start">contract adjusted</text><text x="766" y="323" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#f5b13d" text-anchor="start">Costs released¹</text></g><g data-region="condition-note" data-bounds="24 585 952 69"><text x="32" y="611" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#8b909b" text-anchor="start">¹ The corresponding costs end subject to the contract terms.</text><text x="32" y="638" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#8b909b" text-anchor="start">Partial migration waves can extend the period of coexistence.</text></g><g data-region="method-source" data-bounds="24 660 952 35"><text x="32" y="682" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#8b909b" text-anchor="start">Method: Cabinet Office, March 2022 · Green Book, 2026 · l0g diagram</text></g></svg>