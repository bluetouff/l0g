<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 710" role="img" aria-labelledby="microsoft-migration-practice-qualification-en-desktop-title microsoft-migration-practice-qualification-en-desktop-desc"><title id="microsoft-migration-practice-qualification-en-desktop-title">Qualifying the workflow on one workstation</title><desc id="microsoft-migration-practice-qualification-en-desktop-desc">Schleswig-Holstein. On 7 October 2025, eJuVa 6.4, supplied by PDV, corrects the format of email and attachments transferred from Thunderbird to eJuVa. Its isolated test passed. Joint qualification with VIS-Justiz on the same workstation is still required: the eJuVa test is complete and mirror tests in VIS-Justiz are ongoing. The 4 November report records delivery of the feature in October to some installations, including justice, without identifying the delivered version. On 19 March 2026, the Thunderbird route is available and the web route is under separate development.</desc><rect x="0" y="0" width="1000" height="710" rx="18" fill="#0c0d10" stroke="none" stroke-width="1"></rect><g data-region="eyebrow" data-bounds="24 16 952 34"><text x="34" y="39" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#5eead4" text-anchor="start">l0g / MIGRATION IN PRACTICE</text></g><g data-region="heading" data-bounds="24 55 952 59"><text x="34" y="97" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#e7e9ee" text-anchor="start">Qualifying the workflow on one workstation</text></g><g data-region="subtitle" data-bounds="24 116 952 40"><text x="34" y="142" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#8b909b" text-anchor="start">Schleswig-Holstein · email and case files · Documented states in 2025 and 2026</text></g><g data-region="correction-stage" data-bounds="24 177 280 40"><text x="34" y="201" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#5eead4" t