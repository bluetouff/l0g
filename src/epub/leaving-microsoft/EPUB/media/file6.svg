<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 655" role="img" aria-labelledby="microsoft-contracts-procurement-en-desktop-title microsoft-contracts-procurement-en-desktop-desc"><title id="microsoft-contracts-procurement-en-desktop-title">The specification sets the competition</title><desc id="microsoft-contracts-procurement-en-desktop-desc">Croydon specified a Microsoft Enterprise Licensing Agreement and Azure requirement. Four bids were received. Award criteria were weighted 70% price, 20% technical and 10% social value, totalling 100%. These percentages are criterion weights, not bidders’ scores. The contract was awarded to Bytes Software Services Limited for 1 July 2025 to 30 June 2028. Notice published 11 July 2025.</desc><rect x="0" y="0" width="1000" height="655" rx="18" fill="#0c0d10" stroke="none" stroke-width="1"></rect><g data-region="eyebrow" data-bounds="24 16 952 34"><text x="32" y="39" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#5eead4" text-anchor="start">l0g / PUBLIC PROCUREMENT</text></g><g data-region="heading" data-bounds="24 55 952 59"><text x="32" y="97" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#e7e9ee" text-anchor="start">The specification sets the competition</text></g><g data-region="subtitle" data-bounds="24 116 952 40"><text x="32" y="142" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#8b909b" text-anchor="start">Croydon, 2025: four bids received for an already specified environment.</text></g><g data-scope="Microsoft Enterprise Agreement and Azure"><rect x="32" y="174" width="936" height="166" rx="12" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></rect><g data-region="scope-heading" data-bounds="48 184 452 37"><text x="56" y="207" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#8b909b" text-anchor="start">SPECIFIED REQUIREMENT</text></g><g data-region="scope-product" data-bounds="48 221 454 84"><text x="56" y="256" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#e7e9ee" text-anchor="start">Microsoft Enterprise</text><text x="56" y="290" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#e7e9ee" text-anchor="start">Agreement + Azure</text></g><g data-region="offers-heading" data-bounds="538 193 418 43"><text x="747" y="223" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#5eead4" text-anchor="middle">4 bids received</text></g><g data-offer="anonymous"><rect x="558" y="245" width="48" height="58" rx="5" fill="#0c0d10" stroke="#e7e9ee" stroke-width="2"></rect><line x1="569" y1="261" x2="595" y2="261" stroke="#8b909b" stroke-width="2"></line><line x1="569" y1="274" x2="595" y2="274" stroke="#8b909b" stroke-width="2"></line><line x1="569" y1="287" x2="587" y2="287" stroke="#8b909b" stroke-width="2"></line></g><g data-offer="anonymous"><rect x="664" y="245" width="48" height="58" rx="5" fill="#0c0d10" stroke="#e7e9ee" stroke-width="2"></rect><line x1="675" y1="261" x2="701" y2="261" stroke="#8b909b" stroke-width="2"></line><line x1="675" y1="274" x2="701" y2="274" stroke="#8b909b" stroke-width="2"></line><line x1="675" y1="287" x2="693" y2="287" stroke="#8b909b" stroke-width="2"></line></g><g data-offer="anonymous"><rect x="770" y="245" width="48" height="58" rx="5" fill="#0c0d10" stroke="#e7e9ee" stroke-width="2"></rect><line x1="781" y1="261" x2="807" y2="261" stroke="#8b909b" stroke-width="2"></line><line x1="781" y1="274" x2="807" y2="274" stroke="#8b909b" stroke-width="2"></line><line x1="781" y1="287" x2="799" y2="287" stroke="#8b909b" stroke-width="2"></line></g><g data-offer="anonymous"><rect x="876" y="245" width="48" height="58" rx="5" fill="#0c0d10" stroke="#e7e9ee" stroke-width="2"></rect><line x1="887" y1="261" x2="913" y2="261" stroke="#8b909b" stroke-width="2"></line><line x1="887" y1="274" x2="913" y2="274" stroke="#8b909b" stroke-width="2"></line><line x1="887" y1="287" x2="905" y2="287" stroke="#8b909b" stroke-width="2"></line></g></g><line x1="582" y1="308" x2="582" y2="362" stroke="#8b909b" stroke-width="1.5"></line><line x1="688" y1="308" x2="688" y2="362" stroke="#8b909b" stroke-width="1.5"></line><line x1="794" y1="308" x2="794" y2="362" stroke="#8b909b" stroke-width="1.5"></line><line x1="900" y1="308" x2="900" y2="362" stroke="#8b909b" stroke-width="1.5"></line><line x1="582" y1="362" x2="900" y2="362" stroke="#8b909b" stroke-width="1.5"></line><line x1="700" y1="362" x2="700" y2="400" stroke="#5eead4" stroke-width="2"></line><path d="M696 392 L700 400 L704 392" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><g data-region="weights-heading" data-bounds="24 365 680 39"><text x="32" y="392" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#e7e9ee" text-anchor="start">Award criteria · total weighting: 100%</text></g><g data-criterion="price" data-weight="70" data-bar-width="680"><rect x="40" y="411" width="476" height="42" rx="0" fill="#5eead4" stroke="none" stroke-width="1"></rect></g><g data-region="weight-price" data-bounds="40 411 476 42"><text x="278" y="437" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0c0d10" text-anchor="middle">70 %</text></g><g data-criterion="technical" data-weight="20" data-bar-width="680"><rect x="516" y="411" width="136" height="42" rx="0" fill="#f5b13d" stroke="none" stroke-width="1"></rect></g><g data-region="weight-technical" data-bounds="516 411 136 42"><text x="584" y="437" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0c0d10" text-anchor="middle">20 %</text></g><g data-criterion="social" data-weight="10" data-bar-width="680"><rect x="652" y="411" width="68" height="42" rx="0" fill="#8b909b" stroke="none" stroke-width="1"></rect></g><g data-region="weight-social" data-bou