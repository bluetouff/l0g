68" y2="550" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></line><g data-region="contract-dates" data-bounds="24 563 952 40"><text x="32" y="589" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#e7e9ee" text-anchor="start">Contract: 1 July 2025 to 30 June 2028</text></g><g data-region="procurement-source" data-bounds="24 607 952 40"><text x="32" y="631" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#8b909b" text-anchor="start">Source: Find a Tender, notice 039343-2025, published 11 July 2025.</text></g></svg>