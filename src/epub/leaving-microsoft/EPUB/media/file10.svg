<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 709" role="img" aria-labelledby="microsoft-cloud-licensing-rights-en-desktop-title microsoft-cloud-licensing-rights-en-desktop-desc"><title id="microsoft-cloud-licensing-rights-en-desktop-title">Two products, three cloud routes</title><desc id="microsoft-cloud-licensing-rights-en-desktop-desc">Service comprising SQL Server and Windows Server on shared infrastructure, with eligible licences and active Software Assurance or subscription. Azure allows eligible licences to be reused through Azure Hybrid Benefit. An Authorized Outsourcer outside Listed Providers and their infrastructure permits Flexible Virtualization Benefit for both products. With AWS or Google as a qualified Mobility Partner, SQL Server can use License Mobility and Windows Server is supplied by the host. Historical rights and dedicated hardware fall outside this simplified diagram.</desc><rect x="0" y="0" width="1000" height="709" rx="18" fill="#0c0d10" stroke="none" stroke-width="1"></rect><g data-region="eyebrow" data-bounds="24 16 952 34"><text x="32" y="39" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#5eead4" text-anchor="start">l0g / DEPLOYMENT RIGHTS</text></g><g data-region="heading" data-bounds="24 55 952 59"><text x="32" y="97" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#e7e9ee" text-anchor="start">Two products, three cloud routes</text></g><g data-region="subtitle" data-bounds="24 116 952 40"><text x="32" y="142" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#8b909b" text-anchor="start">Example service using SQL Server and Windows Server, on shared hardware.</text></g><g data-service="two-product-workload"><rect x="345" y="173" width="310" height="135" rx="12" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.5"></rect></g><g data-region="service-heading" data-bounds="353 180 294 40"><text x="500" y="208" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#e7e9ee" text-anchor="middle">Business service</text></g><g data-layer="sql"><rect x="361" y="224" width="278" height="31" rx="4" fill="#171a20" stroke="none" stroke-width="1"></rect></g><g data-region="source-product-0" data-bounds="368 222 264 35"><text x="500" y="246" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#5eead4" text-anchor="middle">SQL Server</text></g><g data-layer="windows"><rect x="361" y="262" width="278" height="31" rx="4" fill="#171a20" stroke="none" stroke-width="1"></rect></g><g data-region="source-product-1" data-bounds="368 260 264 35"><text x="500" y="284" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#e7e9ee" text-anchor="middle">Windows Server</text></g><g data-flow-layer="sql"><line x1="493" y1="316" x2="493" y2="321" stroke="#5eead4" stroke-width="1.5"></line><line x1="171" y1="321" x2="815" y2="321" stroke="#5eead4" stroke-width="1.5"></line><line x1="171" y1="321" x2="171" y2="345" stroke="#5eead4" stroke-width="2"></line><path d="M167 337 L171 345 L175 337" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><line x1="493" y1="321" x2="493" y2="345" stroke="#5eead4" stroke-width="2"></line><path d="M489 337 L493 345 L497 337" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><line x1="815" y1="321" x2="815" y2="345" stroke="#5eead4" stroke-width="2"></line><path d="M811 337 L815 345 L819 337" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-flow-layer="windows"><line x1="507" y1="316" x2="507" y2="332" stroke="#e7e9ee" stroke-width="1.5"></line><line x1="185" y1="332" x2="829" y2="332" stroke="#e7e9ee" stroke-width="1.5"></line><line x1="185" y1="332" x2="185" y2="345" stroke="#e7e9ee" stroke-width="2"></line><path d="M181 337 L185 345 L189 337" fill="none" stroke="#e7e9ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><line x1="507" y1="332" x2="507" y2="345" stroke="#e7e9ee" stroke-width="2"></line><path d="M503 337 L507 345 L511 337" fill="none" stroke="#e7e9ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><line x1="829" y1="332" x2="829" y2="345" stroke="#e7e9ee" stroke-width="2"></line><path d="M825 337 L829 345 L833 337" fill="none" stroke="#e7e9ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-route="azure"><rect x="32" y="353" width="292" height="167" rx="11" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></rect></g><g data-region="route-0" data-bounds="39 359 278 43"><text x="178" y="389" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#e7e9ee" text-anchor="middle">Azure</text></g><g data-region="mechanism-0" data-bounds="36 400 284 35"><text x="178" y="421" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#8b909b" text-anchor="middle">Azure Hybrid Benefit</text></g><line x1="46" y1="440" x2="310" y2="440" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></line><rect x="44" y="449" width="268" height="30" rx="4" fill="#171a20" stroke="none" stroke-width="1"></rect><rect x="44" y="487" width="268" height="30" rx="4" fill="#171a20" stroke="none" stroke-width="1"></rect><g data-region="sql-0" data-bounds="42 447 272 35"><text x="178" y="471" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#5eead4" text-anchor="middle">Eligible SQL licence</text></g><g data-region="windows-0" data-bounds="42 485 272 35"><text x="178" y="508" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#e7e9ee" text-anchor="middle">Eligible Windows licence</text></g><g data-region="route-note-0" data-bounds="24 526 308 35"><text x="178" y="547" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#8b909b" text-anchor="middle">Use eligible existing licences</text></g><g data-route="outsourcer"><rect x="354" y="353" width="292" height="167" rx="11" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></rect></g><g data-region="route-1" data-bounds="361 359 278 43"><text x="500" y="389" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#e7e9ee" text-anchor="middle">Authorized Outsourcer</text></g><g data-region="mechanism-1" data-bounds="358 400 284 35"><text x="500" y="421" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#8b909b" text-anchor="middle">Flexible Virtualization Benefit</text></g><line x1="368" y1="440" x2="632" y2="440" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></line><rect x="366" y="449" width="268" height="30" rx="4" fill="#171a20" stroke="none" stroke-width="1"></rect><rect x="366" y="487" width="268" height="30" rx="4" fill="#171a20" stroke="none" stroke-width="1"></rect><g data-region="sql-1" data-bounds="364 447 272 35"><text x="500" y="471" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#5eead4" text-anchor="middle">Eligible SQL licence</text></g><g data-region="windows-1" data-bounds="364 485 272 35"><text x="500" y="508" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#e7e9ee" text-anchor="middle">Eligible Windows licence</text></g><g data-region="route-note-1" data-bounds="346 526 308 35"><text x="500" y="547" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#8b909b" text-anchor="middle">Outside Listed Providers’ clouds</text></g><g data-route="listed"><rect x="676" y="353" width="292" height="167" rx="11" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></rect></g><g data-region="route-2" data-bounds="683 359 278 43"><text x="822" y="389" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#e7e9ee" text-anchor="middle">AWS / Google</text></g><g data-region="mechanism-2" data-bounds="680 400 284 35"><text x="822" y="421" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#8b909b" text-anchor="middle">Qualified Mobility Partner</text></g><line x1="690" y1="440" x2="954" y2="440" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></line><rect x="688" y="449" width="268" height="30" rx="4" fill="#171a20" stroke="none" stroke-width="1"></rect><rect x="688" y="487" width="268" height="30" rx="4" fill="#171a20" stroke="none" stroke-width="1"></rect><g data-region="sql-2" data-bounds="686 447 272 35"><text x="822" y="471" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#5eead4" text-anchor="middle">SQL: License Mobility</text></g><g data-region="windows-2" data-bounds="686 485 272 35"><text x="822" y="508" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#f5b13d" text-anchor="middle">Windows supplied by the host</text></g><g data-region="route-note-2" data-bounds="668 526 308 35"><text x="822" y="547" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#8b909b" text-anchor="middle">SQL: eligibility and verification</text></g><line x1="32" y1="578" x2="968" y2="578" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></line><g data-region="rights-scope" data-bounds="24 588 952 63"><text x="32" y="612" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#8b909b" text-anchor="start">Eligible licences with active Software Assurance or subscription. Simplified view.</text><text x="32" y="635" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#8b909b" text-anchor="start">Historical rights and dedicated hardware have separate conditions.</text></g><g data-region="rights-source" data-bounds="24 653 952 38"><text x="32" y="677" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#8b909b" text-anchor="start">Sources: Microsoft terms and guidance, reviewed 9 October 2026.</text></g></svg>