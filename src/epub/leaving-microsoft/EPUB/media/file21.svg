<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1344" role="img" aria-labelledby="microsoft-transition-cost-overlap-en-mobile-title microsoft-transition-cost-overlap-en-mobile-desc"><title id="microsoft-transition-cost-overlap-en-mobile-title">Funding the period of coexistence</title><desc id="microsoft-transition-cost-overlap-en-mobile-desc">Generic teaching diagram without a time or cost scale. The existing service remains funded during preparation, adaptation, training and validated migration waves. Ending the corresponding costs depends on closing the old service and adjusting its contract. Partial waves may prolong coexistence. The new service continues to require support, maintenance and development.</desc><rect x="0" y="0" width="400" height="1344" rx="18" fill="#0c0d10" stroke="none" stroke-width="1"></rect><g data-region="eyebrow" data-bounds="24 16 352 34"><text x="32" y="37" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5eead4" text-anchor="start">l0g / WHEN COSTS START AND END</text></g><g data-region="heading" data-bounds="24 55 352 85"><text x="32" y="91" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#e7e9ee" text-anchor="start">Funding the period</text><text x="32" y="125" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#e7e9ee" text-anchor="start">of coexistence</text></g><g data-region="subtitle" data-bounds="24 141 352 63"><text x="32" y="164" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="start">Illustrative process · sequence of stages</text><text x="32" y="187" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="start">No duration or spending scale</text></g><g data-region="old-lane" data-bounds="24 218 128 41"><text x="88" y="241" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#f5b13d" text-anchor="middle">EXISTING</text></g><g data-region="new-lane" data-bounds="168 218 208 41"><text x="272" y="241" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#5eead4" text-anchor="middle">NEW SERVICE</text></g><g data-node="old-operation"><rect x="32" y="282" width="112" height="526" rx="6" fill="#171a20" stroke="none" stroke-width="1"></rect></g><rect x="32" y="282" width="5" height="526" rx="0" fill="#f5b13d" stroke="none" stroke-width="1"></rect><g data-node="new-preparation"><rect x="176" y="282" width="192" height="176" rx="6" fill="#171a20" stroke="none" stroke-width="1"></rect></g><g data-node="validated-waves"><rect x="176" y="511" width="192" height="122" rx="6" fill="#171a20" stroke="none" stroke-width="1"></rect></g><g data-node="new-maintenance"><rect x="176" y="704" width="192" height="105" rx="6" fill="#171a20" stroke="none" stroke-width="1"></rect></g><rect x="176" y="704" width="5" height="105" rx="0" fill="#5eead4" stroke="none" stroke-width="1"></rect><g data-region="old-cost" data-bounds="36 309 104 143"><text x="88" y="332" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#f5b13d" text-anchor="middle">Service</text><text x="88" y="360" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#f5b13d" text-anchor="middle">and</text><text x="88" y="388" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#f5b13d" text-anchor="middle">contract</text><text x="88" y="416" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#f5b13d" text-anchor="middle">funded</text></g><g data-region="prepare-detail" data-bounds="184 301 176 125"><text x="272" y="327" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#e7e9ee" text-anchor="middle">Preparation</text><text x="272" y="361" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#e7e9ee" text-anchor="middle">Adaptation</text><text x="272" y="395" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#e7e9ee" text-anchor="middle">Training</text></g><g data-region="waves-detail" data-bounds="184 523 176 100"><text x="272" y="548" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#5eead4" text-anchor="middle">Validation</text><text x="272" y="575" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#5eead4" text-anchor="middle">then switching</text><text x="272" y="602" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#5eead4" text-anchor="middle">in waves</text></g><g data-region="maintenance-detail" data-bounds="184 715 176 85"><text x="272" y="741" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#5eead4" text-anchor="middle">Support</text><text x="272" y="770" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#5eead4" text-anchor="middle">and maintenance</text></g><g data-edge="preparation-to-waves"><line x1="272" y1="466" x2="272" y2="501" stroke="#5eead4" stroke-width="2"></line><path d="M268 493 L272 501 L276 493" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-edge="waves-to-support"><line x1="272" y1="642" x2="272" y2="694" stroke="#5eead4" stroke-width="2"></line><path d="M268 686 L272 694 L276 686" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-region="coexistence" data-bounds="168 829 208 66"><text x="272" y="852" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="middle">Two environments</text><text x="272" y="875" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="middle">to fund</text></g><g data-gate="conditional-exit"><line x1="26" y1="808" x2="150" y2="808" stroke="#f5b13d" stroke-width="3"></line><line x1="88" y1="816" x2="88" y2="884" stroke="#f5b13d" stroke-width="2"></line><path d="M84 876 L88 884 L92 876" fill="none" stroke="#f5b13d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-node="exit-condition"><rect x="32" y="896" width="336" height="112" rx="6" fill="#171a20" stroke="none" stroke-width="1"></rect></g><g data-region="exit-condition-detail" data-bounds="40 900 320 100"><text x="200" y="923" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#f5b13d" text-anchor="middle">Service closed + contract adjusted</text><text x="200" y="951" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#f5b13d" text-anchor="middle">The corresponding costs end</text><text x="200" y="979" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#f5b13d" text-anchor="middle">subject to the contract terms.</text></g><g data-edge="continuing-maintenance"><path d="M368 756 L383 756 L383 1044 L272 1044 L272 1064" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><line x1="272" y1="1054" x2="272" y2="1064" stroke="#5eead4" stroke-width="2"></line><path d="M268 1056 L272 1064 L276 1056" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-node="ongoing-support"><rect x="32" y="1076" width="336" height="69" rx="6" fill="#171a20" stroke="none" stroke-width="1"></rect></g><g data-region="ongoing-support-detail" data-bounds="40 1082 320 60"><text x="200" y="1105" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#5eead4" text-anchor="middle">Support, maintenance and development</text><text x="200" y="1130" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#5eead4" text-anchor="middle">continue.</text></g><g data-region="condition-note" data-bounds="24 1171 352 72"><text x="32" y="1195" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#8b909b" text-anchor="start">Partial migration waves can</text><text x="32" y="1221" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#8b909b" text-anchor="start">extend the coexistence period.</text></g><g data-region="method-source" data-bounds="24 1260 352 66"><text x="32" y="1281" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#8b909b" text-anchor="start">Method: Cabinet Office, March 2022</text><text x="32" y="1304" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#8b909b" text-anchor="start">and Green Book, 2026 · l0g diagram</text></g></svg>