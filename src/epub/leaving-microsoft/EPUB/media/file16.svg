<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 857" role="img" aria-labelledby="microsoft-workflow-consultation-en-desktop-title microsoft-workflow-consultation-en-desktop-desc"><title id="microsoft-workflow-consultation-en-desktop-title">The workflow behind an Excel export</title><desc id="microsoft-workflow-consultation-en-desktop-desc">Documented MHCLG workflow for local plan consultations in England. Each day, Power Automate reads unread messages in a shared Microsoft 365 mailbox, archives the emails in a SharePoint document library, converts the HTML body to text and creates a response-list row with New status. Attachments are added to that row. An optional acknowledgement is sent to the participant, then the email is marked as read. The Excel export contains list fields, a link to the saved email and the number of attachments; the files remain in SharePoint. Access requires connections and permissions. Successful processing path, without claims about deployed volumes.</desc><rect x="0" y="0" width="1000" height="857" rx="18" fill="#0c0d10" stroke="none" stroke-width="1"></rect><g data-region="eyebrow" data-bounds="24 16 952 34"><text x="32" y="39" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#5eead4" text-anchor="start">l0g / WORKFLOW AND DATA</text></g><g data-region="heading" data-bounds="24 55 952 59"><text x="32" y="97" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#e7e9ee" text-anchor="start">The workflow behind an Excel export</text></g><g data-region="subtitle" data-bounds="24 116 952 40"><text x="32" y="142" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#8b909b" text-anchor="start">Local plan consultations in England · Public MHCLG solution · 27 February 2025</text></g><g data-node="participant"><rect x="32" y="200" width="164" height="70" rx="10" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></rect></g><g data-region="participant-title" data-bounds="36 202 156 40"><text x="114" y="230" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#e7e9ee" text-anchor="middle">Participant</text></g><g data-region="participant-detail" data-bounds="32 236 164 34"><text x="114" y="257" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#8b909b" text-anchor="middle">Email + attachments</text></g><g data-node="mailbox"><rect x="32" y="350" width="164" height="96" rx="10" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></rect></g><g data-region="mailbox-title" data-bounds="36 353 156 42"><text x="114" y="382" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#e7e9ee" text-anchor="middle">Office 365</text></g><g data-region="mailbox-detail" data-bounds="34 390 160 56"><text x="114" y="412" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#8b909b" text-anchor="middle">Shared mailbox</text><text x="114" y="434" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#8b909b" text-anchor="middle">Unread messages</text></g><g data-node="power-automate"><rect x="284" y="177" width="354" height="355" rx="12" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></rect></g><g data-region="engine-title" data-bounds="289 182 344 46"><text x="461" y="214" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#e7e9ee" text-anchor="middle">Power Automate</text></g><g data-region="engine-frequency" data-bounds="289 223 344 35"><text x="461" y="246" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="middle">Daily · successful processing path</text></g><g data-step="archive-message"><g data-region="engine-step-0" data-bounds="293 276 336 37"><text x="461" y="301" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#5eead4" text-anchor="middle">Archive the message</text></g></g><line x1="461" y1="315" x2="461" y2="343" stroke="#8b909b" stroke-width="2"></line><path d="M457 335 L461 343 L465 335" fill="none" stroke="#8b909b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><g data-step="convert-and-create-row"><g data-region="engine-step-1" data-bounds="293 348 336 64"><text x="461" y="373" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#5eead4" text-anchor="middle">HTML body → text</text><text x="461" y="399" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#5eead4" text-anchor="middle">Create a row: status “New”</text></g></g><line x1="461" y1="409" x2="461" y2="419" stroke="#8b909b" stroke-width="2"></line><path d="M457 411 L461 419 L465 411" fill="none" stroke="#8b909b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><g data-step="attach-files"><g data-region="engine-step-2" data-bounds="293 424 336 37"><text x="461" y="449" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#5eead4" text-anchor="middle">Attach files to the row</text></g></g><g data-region="engine-final-state" data-bounds="292 485 338 36"><text x="461" y="508" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="middle">Optional reply, then mark as read</text></g><g data-node="sharepoint"><rect x="710" y="177" width="258" height="355" rx="12" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></rect></g><g data-region="sharepoint-title" data-bounds="717 182 244 46"><text x="839" y="214" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#e7e9ee" text-anchor="middle">SharePoint</text></g><g data-storage="message-file"><rect x="722" y="254" width="234" height="78" rx="6" fill="#171a20" stroke="none" stroke-width="1"></rect></g><g data-region="message-archive" data-bounds="725 257 228 72"><text x="839" y="283" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#e7e9ee" text-anchor="middle">Document library</text><text x="839" y="309" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#e7e9ee" text-anchor="middle">Saved email</text></g><g data-storage="list-item"><rect x="722" y="383" width="234" height="121" rx="6" fill="#171a20" stroke="none" stroke-width="1"></rect></g><g data-region="list-fields" data-bounds="725 385 228 100"><text x="839" y="407" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#e7e9ee" text-anchor="middle">Response list</text><text x="839" y="433" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#e7e9ee" text-anchor="middle">Sender · date · text</text><text x="839" y="459" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#e7e9ee" text-anchor="middle">Email link · attachments</text></g><g data-edge="email-input"><line x1="114" y1="278" x2="114" y2="338" stroke="#5eead4" stroke-width="2"></line><path d="M110 330 L114 338 L118 330" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-edge="unread-input"><path d="M204 374 L252 374 L252 244 L272 244" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><line x1="262" y1="244" x2="272" y2="244" stroke="#5eead4" stroke-width="2"></line><path d="M264 248 L272 244 L264 240" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-edge="archive-output"><line x1="646" y1="296" x2="698" y2="296" stroke="#5eead4" stroke-width="2"></line><path d="M690 300 L698 296 L690 292" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-edge="row-output"><path d="M646 377 L674 377 L674 407 L698 407" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><line x1="688" y1="407" x2="698" y2="407" stroke="#5eead4" stroke-width="2"></line><path d="M690 411 L698 407 L690 403" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-edge="attachment-output"><line x1="646" y1="443" x2="698" y2="443" stroke="#5eead4" stroke-width="2"></line><path d="M690 447 L698 443 L690 439" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-edge="optional-acknowledgement"><path d="M284 490 L220 490 L220 233 L208 233" fill="none" stroke="#f5b13d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"></path><line x1="218" y1="233" x2="208" y2="233" stroke="#f5b13d" stroke-width="2"></line><path d="M216 229 L208 233 L216 237" fill="none" stroke="#f5b13d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-edge="mark-as-read"><path d="M284 516 L234 516 L234 418 L208 418" fill="none" stroke="#e7e9ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><line x1="218" y1="418" x2="208" y2="418" stroke="#e7e9ee" stroke-width="2"></line><path d="M216 414 L208 418 L216 422" fill="none" stroke="#e7e9ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-region="return-paths" data-bounds="24 470 244 70"><text x="32" y="491" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#8b909b" text-anchor="start">Optional reply: dashed</text><text x="32" y="513" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#8b909b" text-anchor="start">Mark as read: solid</text></g><line x1="32" y1="595" x2="968" y2="595" stroke="#f5b13d" stroke-width="1.5" stroke-dasharray="6 6"></line><g data-region="export-boundary" data-bounds="24 550 536 40"><text x="32" y="574" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#f5b13d" text-anchor="start">EXPORT THE LIST</text></g><g data-edge="list-export"><line x1="839" y1="540" x2="839" y2="617" stroke="#5eead4" stroke-width="2"></line><path d="M835 609 L839 617 L843 609" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-node="excel-export"><rect x="620" y="629" width="348" height="119" rx="10" fill="#171a20" stroke="none" stroke-width="1"></rect></g><g data-region="excel-title" data-bounds="628 633 332 43"><text x="794" y="663" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#e7e9ee" text-anchor="middle">Excel</text></g><g data-region="excel-fields" data-bounds="627 675 334 70"><text x="794" y="699" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#e7e9ee" text-anchor="middle">List fields + link to the email</text><text x="794" y="724" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#e7e9ee" text-anchor="middle">Number of attached files</text></g><g data-region="export-limit" data-bounds="24 641 548 90"><text x="32" y="666" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#8b909b" text-anchor="start">Emails and attachments remain in SharePoint.</text><text x="32" y="691" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#8b909b" text-anchor="start">Connections and permissions govern service access.</text></g><line x1="32" y1="784" x2="968" y2="784" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></line><g data-region="consultation-source" data-bounds="24 794 952 40"><text x="32" y="818" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#8b909b" text-anchor="start">Sources: MHCLG guides, 27 February 2025, and public solution 1.0.0.13.</text></g></svg>