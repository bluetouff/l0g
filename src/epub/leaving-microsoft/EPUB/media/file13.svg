<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1148" role="img" aria-labelledby="microsoft-cloud-licensing-comparison-en-mobile-title microsoft-cloud-licensing-comparison-en-mobile-desc"><title id="microsoft-cloud-licensing-comparison-en-mobile-title">Comparing licences at constant usage</title><desc id="microsoft-cloud-licensing-comparison-en-mobile-desc">CMA comparison methodology using Azure UK data for 2024. Usage in vcore-hours, adjusted for utilisation, is valued at Microsoft’s SPLA prices to AWS or Google to reconstruct a hypothetical supplier input cost. This is compared with the Azure customer’s licence spend for the same usage, net of discounts. The difference concerns upstream and customer-facing prices, not two final customer bills or Microsoft’s actual internal cost. Scope: Windows Server under Azure Hybrid Benefit, SQL Server PAYG IaaS, customers spending at least 10,000 dollars annually on Azure. Detailed amounts are not public.</desc><rect x="0" y="0" width="400" height="1148" rx="18" fill="#0c0d10" stroke="none" stroke-width="1"></rect><g data-region="eyebrow" data-bounds="24 16 352 34"><text x="32" y="37" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5eead4" text-anchor="start">l0g / INPUT AND CUSTOMER PRICES</text></g><g data-region="heading" data-bounds="24 55 352 85"><text x="32" y="91" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#e7e9ee" text-anchor="start">Comparing licences</text><text x="32" y="125" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#e7e9ee" text-anchor="start">at constant usage</text></g><g data-region="subtitle" data-bounds="24 141 352 63"><text x="32" y="164" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="start">CMA method · Azure UK · 2024 ·</text><text x="32" y="187" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="start">Windows Server with AHB · SQL Server PAYG</text></g><g data-input="same-azure-usage"><rect x="40" y="223" width="320" height="83" rx="10" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.5"></rect></g><g data-region="usage" data-bounds="48 228 304 42"><text x="200" y="256" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#e7e9ee" text-anchor="middle">Azure UK usage · 2024</text></g><g data-region="usage-unit" data-bounds="48 266 304 35"><text x="200" y="288" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#8b909b" text-anchor="middle">vcore-hours adjusted for utilisation</text></g><line x1="200" y1="314" x2="200" y2="341" stroke="#8b909b" stroke-width="2"></line><line x1="20" y1="341" x2="200" y2="341" stroke="#8b909b" stroke-width="2"></line><line x1="20" y1="341" x2="20" y2="632" stroke="#8b909b" stroke-width="2"></line><line x1="20" y1="429" x2="46" y2="429" stroke="#5eead4" stroke-width="2"></line><path d="M38 433 L46 429 L38 425" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><line x1="20" y1="632" x2="46" y2="632" stroke="#5eead4" stroke-width="2"></line><path d="M38 636 L46 632 L38 628" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><g data-comparison="supplier-hypothesis"><rect x="54" y="367" width="310" height="164" rx="10" fill="#121419" stroke="#f5b13d" stroke-width="1.5"></rect></g><g data-region="channel-0" data-bounds="62 374 294 35"><text x="209" y="395" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#8b909b" text-anchor="middle">MICROSOFT → AWS / GOOGLE</text></g><g data-region="operation-0" data-bounds="62 413 294 39"><text x="209" y="438" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#f5b13d" text-anchor="middle">Adjusted usage × SPLA price</text></g><line x1="70" y1="460" x2="348" y2="460" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></line><g data-region="result-0" data-bounds="62 468 294 66"><text x="209" y="494" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#e7e9ee" text-anchor="middle">Hypothetical</text><text x="209" y="519" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#e7e9ee" text-anchor="middle">supplier input cost</text></g><g data-comparison="azure-customer-spend"><rect x="54" y="570" width="310" height="164" rx="10" fill="#121419" stroke="#5eead4" stroke-width="1.5"></rect></g><g data-region="channel-1" data-bounds="62 577 294 35"><text x="209" y="598" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#8b909b" text-anchor="middle">MICROSOFT AZURE → CUSTOMER</text></g><g data-region="operation-1" data-bounds="62 616 294 39"><text x="209" y="641" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#5eead4" text-anchor="middle">Spend for the same usage</text></g><line x1="70" y1="663" x2="348" y2="663" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></line><g data-region="result-1" data-bounds="62 671 294 66"><text x="209" y="697" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#e7e9ee" text-anchor="middle">Customer licence spend</text><text x="209" y="722" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#e7e9ee" text-anchor="middle">net of discounts</text></g><line x1="372" y1="483" x2="383" y2="483" stroke="#f5b13d" stroke-width="2" stroke-dasharray="5 5"></line><line x1="383" y1="483" x2="383" y2="761" stroke="#f5b13d" stroke-width="2" stroke-dasharray="5 5"></line><line x1="372" y1="689" x2="383" y2="689" stroke="#5eead4" stroke-width="2"></line><line x1="200" y1="761" x2="383" y2="761" stroke="#8b909b" stroke-width="2"></line><line x1="200" y1="761" x2="200" y2="785" stroke="#e7e9ee" stroke-width="2"></line><path d="M196 777 L200 785 L204 777" fill="none" stroke="#e7e9ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><rect x="32" y="797" width="336" height="84" rx="10" fill="#171a20" stroke="none" stroke-width="1"></rect><g data-region="difference-formula" data-bounds="40 803 320 40"><text x="200" y="827" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#e7e9ee" text-anchor="middle">Hypothetical cost − customer spend</text></g><g data-region="difference-meaning" data-bounds="40 842 320 37"><text x="200" y="867" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#5eead4" text-anchor="middle">Difference calculated by the CMA</text></g><line x1="32" y1="914" x2="368" y2="914" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></line><g data-region="comparison-scope" data-bounds="24 923 352 136"><text x="32" y="945" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#8b909b" text-anchor="start">Scope: licences, IaaS usage only.</text><text x="32" y="968" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#8b909b" text-anchor="start">Customers with at least $10,000 in annual</text><text x="32" y="991" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#8b909b" text-anchor="start">Azure spend. Supplier cost reconstructed;</text><text x="32" y="1014" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#8b909b" text-anchor="start">customer spend reported by Microsoft.</text><text x="32" y="1037" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#8b909b" text-anchor="start">Detailed amounts are not public.</text></g><g data-region="comparison-source" data-bounds="24 1058 352 65"><text x="32" y="1080" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#8b909b" text-anchor="start">Source: CMA, Appendix T, paragraphs</text><text x="32" y="1103" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#8b909b" text-anchor="start">T.5, T.8, T.25, T.55–65 and T.72 (2025).</text></g></svg>