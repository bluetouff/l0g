<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1460" role="img" aria-labelledby="microsoft-migration-practice-upstream-en-mobile-title microsoft-migration-practice-upstream-en-mobile-desc"><title id="microsoft-migration-practice-upstream-en-mobile-title">Sharing improvements with LibreOffice</title><desc id="microsoft-migration-practice-upstream-en-mobile-desc">Historical contribution process described by Munich, where LibreOffice was used within LiMux through the end of 2023. Municipal fixes and features first entered The Document Foundation LibreOffice main branch, then underwent its quality assurance. After approval, they were ported to the municipal version. The contributions also benefit shared LibreOffice. This diagram does not describe Munich’s current IT estate.</desc><rect x="0" y="0" width="400" height="1460" rx="18" fill="#0c0d10" stroke="none" stroke-width="1"></rect><g data-region="eyebrow" data-bounds="24 16 352 34"><text x="34" y="37" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5eead4" text-anchor="start">l0g / MAINTAINING AN ALTERNATIVE</text></g><g data-region="heading" data-bounds="24 55 352 85"><text x="34" y="91" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#e7e9ee" text-anchor="start">Sharing improvements</text><text x="34" y="125" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#e7e9ee" text-anchor="start">with LibreOffice</text></g><g data-region="subtitle" data-bounds="24 141 352 63"><text x="34" y="164" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="start">Historical process described by Munich</text><text x="34" y="187" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="start">LibreOffice in LiMux through the end of 2023</text></g><g data-node="municipality"><rect x="32" y="219" width="336" height="152" rx="8" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></rect></g><g data-region="city-heading" data-bounds="40 228 320 41"><text x="50" y="255" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#e7e9ee" text-anchor="start">MUNICH</text></g><g data-region="contribution-label" data-bounds="40 277 320 82"><text x="200" y="302" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#e7e9ee" text-anchor="middle">Bug fixes and features</text><text x="200" y="330" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#e7e9ee" text-anchor="middle">Municipal contributions</text></g><g data-node="contribution"></g><g data-edge="contribute-upstream"><line x1="200" y1="379" x2="200" y2="447" stroke="#5eead4" stroke-width="2"></line><path d="M196 439 L200 447 L204 439" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-region="first" data-bounds="213 389 155 42"><text x="223" y="411" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#5eead4" text-anchor="start">FIRST</text></g><g data-node="common-project"><rect x="32" y="458" width="336" height="528" rx="8" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></rect></g><g data-region="project-heading" data-bounds="40 472 320 65"><text x="200" y="498" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#5eead4" text-anchor="middle">THE DOCUMENT</text><text x="200" y="524" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#5eead4" text-anchor="middle">FOUNDATION</text></g><g data-node="main-branch"><rect x="64" y="558" width="272" height="91" rx="8" fill="#171a20" stroke="none" stroke-width="1"></rect></g><g data-region="main-branch-label" data-bounds="72 568 256 77"><text x="200" y="597" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#5eead4" text-anchor="middle">LibreOffice</text><text x="200" y="626" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#5eead4" text-anchor="middle">main branch</text></g><g data-edge="main-to-qa"><line x1="200" y1="657" x2="200" y2="687" stroke="#5eead4" stroke-width="2"></line><path d="M196 679 L200 687 L204 679" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-node="quality-assurance"><rect x="64" y="697" width="272" height="106" rx="8" fill="#171a20" stroke="none" stroke-width="1"></rect></g><g data-region="qa-label" data-bounds="72 707 256 87"><text x="200" y="733" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#e7e9ee" text-anchor="middle">Quality assurance at TDF</text><text x="200" y="764" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#e7e9ee" text-anchor="middle">Approval</text></g><g data-edge="shared-contribution"><line x1="200" y1="811" x2="200" y2="845" stroke="#5eead4" stroke-width="2"></line><path d="M196 837 L200 845 L204 837" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-node="shared-benefit"><rect x="64" y="855" width="272" height="105" rx="8" fill="#171a20" stroke="none" stroke-width="1"></rect></g><g data-region="shared-benefit-label" data-bounds="72 868 256 84"><text x="200" y="894" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#5eead4" text-anchor="middle">Contributions included</text><text x="200" y="924" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#5eead4" text-anchor="middle">in shared LibreOffice</text></g><g data-edge="approved-local-port"><path d="M64 750 L16 750 L16 1172 L56 1172" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><line x1="40" y1="1172" x2="56" y2="1172" stroke="#5eead4" stroke-width="2"></line><path d="M48 1176 L56 1172 L48 1168" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-region="after-approval" data-bounds="32 1022 336 61"><text x="200" y="1045" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#5eead4" text-anchor="middle">AFTER APPROVAL</text><text x="200" y="1070" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#5eead4" text-anchor="middle">Back to the municipal version</text></g><g data-node="local-version"><rect x="64" y="1110" width="304" height="118" rx="8" fill="#171a20" stroke="none" stroke-width="1"></rect></g><g data-region="local-version-label" data-bounds="72 1121 288 94"><text x="216" y="1147" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#e7e9ee" text-anchor="middle">MUNICH</text><text x="216" y="1175" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#e7e9ee" text-anchor="middle">Municipal version</text><text x="216" y="1203" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#e7e9ee" text-anchor="middle">of LibreOffice</text></g><g data-region="process-note" data-bounds="24 1260 352 101"><text x="34" y="1283" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="start">Historical process described by the city.</text><text x="34" y="1310" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="start">LibreOffice was used within LiMux</text><text x="34" y="1337" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="start">through the end of 2023.</text></g><g data-region="upstream-source" data-bounds="24 1380 352 65"><text x="34" y="1401" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#8b909b" text-anchor="start">Source: Munich Open Source,</text><text x="34" y="1425" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#8b909b" text-anchor="start">“LibreOffice” page.</text></g></svg>