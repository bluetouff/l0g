<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1124" role="img" aria-labelledby="microsoft-contracts-procurement-en-mobile-title microsoft-contracts-procurement-en-mobile-desc"><title id="microsoft-contracts-procurement-en-mobile-title">The specification sets the competition</title><desc id="microsoft-contracts-procurement-en-mobile-desc">Croydon specified a Microsoft Enterprise Licensing Agreement and Azure requirement. Four bids were received. Award criteria were weighted 70% price, 20% technical and 10% social value, totalling 100%. These percentages are criterion weights, not bidders’ scores. The contract was awarded to Bytes Software Services Limited for 1 July 2025 to 30 June 2028. Notice published 11 July 2025.</desc><rect x="0" y="0" width="400" height="1124" rx="18" fill="#0c0d10" stroke="none" stroke-width="1"></rect><g data-region="eyebrow" data-bounds="24 16 352 34"><text x="32" y="37" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5eead4" text-anchor="start">l0g / PUBLIC PROCUREMENT</text></g><g data-region="heading" data-bounds="24 55 352 85"><text x="32" y="91" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#e7e9ee" text-anchor="start">The specification</text><text x="32" y="125" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#e7e9ee" text-anchor="start">sets the competition</text></g><g data-region="subtitle" data-bounds="24 141 352 63"><text x="32" y="164" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="start">Croydon, 2025: four bids received</text><text x="32" y="187" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="start">for an already specified environment.</text></g><g data-scope="Microsoft Enterprise Agreement and Azure"><rect x="32" y="220" width="336" height="245" rx="12" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></rect><g data-region="scope-heading" data-bounds="40 230 320 37"><text x="48" y="251" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#8b909b" text-anchor="start">SPECIFIED REQUIREMENT</text></g><g data-region="scope-product" data-bounds="40 267 320 84"><text x="48" y="297" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#e7e9ee" text-anchor="start">Microsoft Enterprise</text><text x="48" y="326" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#e7e9ee" text-anchor="start">Agreement + Azure</text></g><g data-region="offers-heading" data-bounds="40 340 320 39"><text x="200" y="366" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#5eead4" text-anchor="middle">4 bids received</text></g><g data-offer="anonymous"><rect x="56" y="377" width="48" height="58" rx="5" fill="#0c0d10" stroke="#e7e9ee" stroke-width="2"></rect><line x1="67" y1="393" x2="93" y2="393" stroke="#8b909b" stroke-width="2"></line><line x1="67" y1="406" x2="93" y2="406" stroke="#8b909b" stroke-width="2"></line><line x1="67" y1="419" x2="85" y2="419" stroke="#8b909b" stroke-width="2"></line></g><g data-offer="anonymous"><rect x="136" y="377" width="48" height="58" rx="5" fill="#0c0d10" stroke="#e7e9ee" stroke-width="2"></rect><line x1="147" y1="393" x2="173" y2="393" stroke="#8b909b" stroke-width="2"></line><line x1="147" y1="406" x2="173" y2="406" stroke="#8b909b" stroke-width="2"></line><line x1="147" y1="419" x2="165" y2="419" stroke="#8b909b" stroke-width="2"></line></g><g data-offer="anonymous"><rect x="216" y="377" width="48" height="58" rx="5" fill="#0c0d10" stroke="#e7e9ee" stroke-width="2"></rect><line x1="227" y1="393" x2="253" y2="393" stroke="#8b909b" stroke-width="2"></line><line x1="227" y1="406" x2="253" y2="406" stroke="#8b909b" stroke-width="2"></line><line x1="227" y1="419" x2="245" y2="419" stroke="#8b909b" stroke-width="2"></line></g><g data-offer="anonymous"><rect x="296" y="377" width="48" height="58" rx="5" fill="#0c0d10" stroke="#e7e9ee" stroke-width="2"></rect><line x1="307" y1="393" x2="333" y2="393" stroke="#8b909b" stroke-width="2"></line><line x1="307" y1="406" x2="333" y2="406" stroke="#8b909b" stroke-width="2"></line><line x1="307" y1="419" x2="325" y2="419" stroke="#8b909b" stroke-width="2"></line></g></g><line x1="80" y1="440" x2="80" y2="491" stroke="#8b909b" stroke-width="1.5"></line><line x1="160" y1="440" x2="160" y2="491" stroke="#8b909b" stroke-width="1.5"></line><line x1="240" y1="440" x2="240" y2="491" stroke="#8b909b" stroke-width="1.5"></line><line x1="320" y1="440" x2="320" y2="491" stroke="#8b909b" stroke-width="1.5"></line><line x1="80" y1="491" x2="320" y2="491" stroke="#8b909b" stroke-width="1.5"></line><line x1="200" y1="491" x2="200" y2="523" stroke="#5eead4" stroke-width="2"></line><path d="M196 515 L200 523 L204 515" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><g data-region="weights-heading" data-bounds="24 529 352 62"><text x="32" y="554" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#e7e9ee" text-anchor="start">Award criteria</text><text x="32" y="579" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#e7e9ee" text-anchor="start">Total weighting: 100%</text></g><g data-criterion="price" data-weight="70" data-bar-width="320"><rect x="40" y="594" width="224" height="40" rx="0" fill="#5eead4" stroke="none" stroke-width="1"></rect></g><g data-criterion="technical" data-weight="20" data-bar-width="320"><rect x="264" y="594" width="64" height="40" rx="0" fill="#f5b13d" stroke="none" stroke-width="1"></rect></g><g data-criterion="social" data-weight="10" data-bar-width="320"><rect x="328" y="594" width="32" height="40" rx="0" fill="#8b909b" stroke="none" stroke-width="1"></rect></g><rect x="40" y="658" width="12" height="12" rx="2" fill="#5eead4" stroke="none" stroke-width="1"></rect><g data-region="criterion-0" data-bounds="60 642 306 39"><text x="68" y="667" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#e7e9ee" text-anchor="start">Price · 70%</text></g><rect x="40" y="696" width="12" height="12" rx="2" fill="#f5b13d" stroke="none" stroke-width="1"></rect><g data-region="criterion-1" data-bounds="60 680 306 39"><text x="68" y="705" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#e7e9ee" text-anchor="start">Technical · 20%</text></g><rect x="40" y="734" width="12" height="12" rx="2" fill="#8b909b" stroke="none" stroke-width="1"></rect><g data-region="criterion-2" data-bounds="60 718 306 39"><text x="68" y="743" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#e7e9ee" text-anchor="start">Social value · 10%</text></g><line x1="200" y1="767" x2="200" y2="803" stroke="#5eead4" stroke-width="2"></line><path d="M196 795 L200 803 L204 795" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><g data-region="winner-label" data-bounds="24 810 352 35"><text x="200" y="831" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#8b909b" text-anchor="middle">CONTRACT AWARDED TO</text></g><g data-region="winner" data-bounds="24 843 352 56"><text x="200" y="883" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#5eead4" text-anchor="middle">Bytes</text></g><g data-region="winner-full" data-bounds="24 892 352 37"><text x="200" y="915" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#e7e9ee" text-anchor="middle">Bytes Software Services Limited</text></g><line x1="32" y1="956" x2="368" y2="956" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></line><g data-region="contract-dates" data-bounds="24 969 352 65"><text x="32" y="994" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#e7e9ee" text-anchor="start">Contract: 1 July 2025</text><text x="32" y="1020" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#e7e9ee" text-anchor="start">to 30 June 2028</text></g><g data-region="procurement-source" data-bounds="24 1044 352 65"><text x="32" y="1066" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#8b909b" text-anchor="start">Source: notice 039343-2025, Find a Tender.</text><text x="32" y="1089" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#8b909b" text-anchor="start">Published 11 July 2025.</text></g></svg>