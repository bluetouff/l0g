<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1650" role="img" aria-labelledby="microsoft-choice-switching-en-mobile-title microsoft-choice-switching-en-mobile-desc"><title id="microsoft-choice-switching-en-mobile-title">The stages of a cloud exit</title><desc id="microsoft-choice-switching-en-mobile-desc">Article 25 of the Data Act for covered services. The request starts a notice period of up to two months, followed by a standard transition of up to thirty calendar days with service continuity. If this is technically unfeasible, the provider must justify and notify it within fourteen working days of the request, with an alternative transition of up to seven months. The customer may extend the transition once for a period it considers appropriate. This diagram calculates no total duration and assigns no starting point to the seven months. Retrieval lasts at least thirty calendar days after the agreed transition ends. Erasure follows that period, or a later agreed date, if switching succeeded. The contract terminates on successful switching and the customer is notified.</desc><rect x="0" y="0" width="400" height="1650" rx="18" fill="#0c0d10" stroke="none" stroke-width="1"></rect><g data-region="eyebrow" data-bounds="24 16 352 34"><text x="34" y="37" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5eead4" text-anchor="start">l0g / DATA ACT</text></g><g data-region="heading" data-bounds="24 55 352 85"><text x="34" y="91" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#e7e9ee" text-anchor="start">The stages</text><text x="34" y="125" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#e7e9ee" text-anchor="start">of a cloud exit</text></g><g data-region="subtitle" data-bounds="24 141 352 63"><text x="34" y="164" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="start">Covered service contract · Article 25</text><text x="34" y="187" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="start">Separate deadlines · diagram not to time scale</text></g><g data-node="notice"><rect x="32" y="220" width="336" height="152" rx="8" fill="#171a20" stroke="none" stroke-width="1"></rect></g><g data-region="notice-stage" data-bounds="40 228 320 38"><text x="50" y="251" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#8b909b" text-anchor="start">NOTICE</text></g><g data-region="notice-duration" data-bounds="40 267 320 56"><text x="50" y="307" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#e7e9ee" text-anchor="start">≤ 2 months</text></g><g data-region="notice-rule" data-bounds="40 326 320 38"><text x="50" y="350" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#e7e9ee" text-anchor="start">From the switching request</text></g><g data-edge="notice-to-transition"><path d="M200 380 L200 698" fill="none" stroke="#8b909b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><line x1="200" y1="698" x2="200" y2="720" stroke="#8b909b" stroke-width="2"></line><path d="M196 712 L200 720 L204 712" fill="none" stroke="#8b909b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-node="technical-extension"><rect x="24" y="429" width="156" height="225" rx="8" fill="#121419" stroke="#f5b13d" stroke-width="1"></rect></g><g data-node="customer-extension"><rect x="220" y="429" width="156" height="225" rx="8" fill="#121419" stroke="#5eead4" stroke-width="1"></rect></g><g data-region="technical-label" data-bounds="32 438 140 209"><text x="102" y="459" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" fill="#f5b13d" text-anchor="middle">Justified technical</text><text x="102" y="486" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" fill="#f5b13d" text-anchor="middle">infeasibility</text><text x="102" y="513" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" fill="#f5b13d" text-anchor="middle">Notice within</text><text x="102" y="540" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" fill="#f5b13d" text-anchor="middle">14 working days</text><text x="102" y="567" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" fill="#f5b13d" text-anchor="middle">of the request</text><text x="102" y="594" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" fill="#f5b13d" text-anchor="middle">Alternative transition</text><text x="102" y="621" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" fill="#f5b13d" text-anchor="middle">≤ 7 months</text></g><g data-region="customer-label" data-bounds="228 448 140 182"><text x="298" y="470" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#5eead4" text-anchor="middle">Customer’s choice</text><text x="298" y="498" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#5eead4" text-anchor="middle">One extension</text><text x="298" y="526" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#5eead4" text-anchor="middle">of the transition</text><text x="298" y="554" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#5eead4" text-anchor="middle">For a period</text><text x="298" y="582" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#5eead4" text-anchor="middle">the customer</text><text x="298" y="610" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#5eead4" text-anchor="middle">deems suitable</text></g><g data-edge="technical-to-transition"><path d="M102 662 L102 690 L200 690" fill="none" stroke="#f5b13d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-edge="customer-to-transition"><path d="M298 662 L298 690 L200 690" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-node="transition"><rect x="32" y="730" width="336" height="200" rx="8" fill="#171a20" stroke="none" stroke-width="1"></rect></g><g data-region="transition-stage" data-bounds="40 740 320 38"><text x="50" y="763" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#8b909b" text-anchor="start">TRANSITION</text></g><g data-region="transition-duration" data-bounds="40 781 320 53"><text x="50" y="816" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#e7e9ee" text-anchor="start">≤ 30 calendar days</text></g><g data-region="transition-rule" data-bounds="40 841 320 87"><text x="50" y="865" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#e7e9ee" text-anchor="start">Standard rule, after the notice period</text><text x="50" y="891" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#e7e9ee" text-anchor="start">Service continues</text><text x="50" y="917" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#e7e9ee" text-anchor="start">Branches modify this period.</text></g><g data-edge="transition-to-retrieval"><line x1="200" y1="938" x2="200" y2="987" stroke="#5eead4" stroke-width="2"></line><path d="M196 979 L200 987 L204 979" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-node="retrieval"><rect x="32" y="997" width="336" height="178" rx="8" fill="#171a20" stroke="none" stroke-width="1"></rect></g><g data-region="retrieval-stage" data-bounds="40 1007 320 38"><text x="50" y="1030" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#8b909b" text-anchor="start">RETRIEVAL</text></g><g data-region="retrieval-duration" data-bounds="40 1048 320 53"><text x="50" y="1083" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#e7e9ee" text-anchor="start">≥ 30 calendar days</text></g><g data-region="retrieval-rule" data-bounds="40 1107 320 64"><text x="50" y="1132" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#e7e9ee" text-anchor="start">After the transition agreed</text><text x="50" y="1159" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#e7e9ee" text-anchor="start">with the provider has ended</text></g><g data-edge="retrieval-to-erasure"><line x1="200" y1="1183" x2="200" y2="1223" stroke="#5eead4" stroke-width="2"></line><path d="M196 1215 L200 1223 L204 1215" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-node="erasure"><rect x="32" y="1233" width="336" height="155" rx="8" fill="#171a20" stroke="none" stroke-width="1"></rect></g><g data-region="erasure-stage" data-bounds="40 1243 320 38"><text x="50" y="1266" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#8b909b" text-anchor="start">ERASURE</text></g><g data-region="erasure-rule" data-bounds="40 1285 320 91"><text x="50" y="1310" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#e7e9ee" text-anchor="start">After the retrieval period,</text><text x="50" y="1337" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#e7e9ee" text-anchor="start">or at a later agreed date,</text><text x="50" y="1364" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#e7e9ee" text-anchor="start">if switching has succeeded.</text></g><g data-region="termination" data-bounds="24 1415 352 110"><text x="34" y="1441" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#5eead4" text-anchor="start">On successful switching:</text><text x="34" y="1470" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#5eead4" text-anchor="start">the provider notifies the customer</text><text x="34" y="1499" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#5eead4" text-anchor="start">of contract termination.</text></g><g data-region="switching-source" data-bounds="24 1550 352 72"><text x="34" y="1571" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#8b909b" text-anchor="start">Source: Regulation (EU) 2023/2854,</text><text x="34" y="1595" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#8b909b" text-anchor="start">Article 25(2)–(5).</text></g></svg>