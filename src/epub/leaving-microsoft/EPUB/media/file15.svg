nt-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#8b909b" text-anchor="start">Sources: CNSA 2025 guidance;</text><text x="32" y="1448" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#8b909b" text-anchor="start">ATIH EPRD-PGFP 2026 user guide.</text></g></svg>