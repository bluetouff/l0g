<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1489" role="img" aria-labelledby="microsoft-workflow-reporting-en-mobile-title microsoft-workflow-reporting-en-mobile-desc"><title id="microsoft-workflow-reporting-en-mobile-title">Two ways to submit a budget</title><desc id="microsoft-workflow-reporting-en-mobile-desc">Two preparation and collection workflows for different sectors and reporting years. CNSA guidance for the 2025 social care EPRD campaign requires Excel: macros generate worksheets, data is entered and the xls workbook is submitted to ImportEPRD. In the 2026 hospital ATIH EPRD-PGFP campaign, the Excel xlsm macro produces a CSV; finance software may also produce conforming structured text, with the export developed by its vendor. Files undergo import checks in ANCRE. Direct web entry is also available. The guide includes an Excel statement for reviewing collected data. This is not a comparison of performance or migration rates.</desc><rect x="0" y="0" width="400" height="1489" rx="18" fill="#0c0d10" stroke="none" stroke-width="1"></rect><g data-region="eyebrow" data-bounds="24 16 352 34"><text x="32" y="37" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5eead4" text-anchor="start">l0g / BUDGET REPORTING</text></g><g data-region="heading" data-bounds="24 55 352 85"><text x="32" y="91" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#e7e9ee" text-anchor="start">Two ways to</text><text x="32" y="125" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#e7e9ee" text-anchor="start">submit a budget</text></g><g data-region="subtitle" data-bounds="24 141 352 63"><text x="32" y="164" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="start">Preparing and collecting the data</text><text x="32" y="187" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="start">Two different scopes and reporting years</text></g><g data-region="cnsa-scope" data-bounds="24 219 352 62"><text x="32" y="242" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#e7e9ee" text-anchor="start">CNSA · social care sector · EPRD 2025</text><text x="32" y="268" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#e7e9ee" text-anchor="start">Excel required · February 2025</text></g><g data-node="cnsa-excel"><rect x="32" y="309" width="154" height="85" rx="8" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></rect></g><g data-region="cnsa-excel-title" data-bounds="35 312 148 40"><text x="109" y="337" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#e7e9ee" text-anchor="middle">Microsoft Excel</text></g><g data-region="cnsa-excel-detail" data-bounds="36 352 146 35"><text x="109" y="374" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#8b909b" text-anchor="middle">Macros enabled</text></g><g data-edge="cnsa-generate-tabs"><line x1="194" y1="351" x2="206" y2="351" stroke="#5eead4" stroke-width="2"></line><path d="M198 355 L206 351 L198 347" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-node="cnsa-tabs"><rect x="218" y="309" width="150" height="85" rx="8" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></rect></g><g data-region="cnsa-tabs-title" data-bounds="221 312 144 40"><text x="293" y="336" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#5eead4" text-anchor="middle">Worksheets</text></g><g data-region="cnsa-tabs-detail" data-bounds="222 352 142 35"><text x="293" y="374" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#8b909b" text-anchor="middle">Generate + fill</text></g><g data-edge="cnsa-save-frame"><path d="M293 402 L293 435 L106 435 L106 463" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><line x1="106" y1="453" x2="106" y2="463" stroke="#5eead4" stroke-width="2"></line><path d="M102 455 L106 463 L110 455" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-node="cnsa-xls"><rect x="32" y="475" width="148" height="55" rx="8" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></rect></g><g data-region="cnsa-xls-title" data-bounds="35 478 142 40"><text x="106" y="504" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#e7e9ee" text-anchor="middle">Workbook .xls</text></g><g data-edge="cnsa-submit"><line x1="188" y1="502" x2="206" y2="502" stroke="#5eead4" stroke-width="2"></line><path d="M198 506 L206 502 L198 498" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-node="cnsa-import"><rect x="218" y="475" width="150" height="55" rx="8" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></rect></g><g data-region="cnsa-import-title" data-bounds="221 478 144 40"><text x="293" y="505" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#5eead4" text-anchor="middle">ImportEPRD</text></g><line x1="32" y1="568" x2="368" y2="568" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></line><g data-region="atih-scope" data-bounds="24 582 352 62"><text x="32" y="605" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#e7e9ee" text-anchor="start">ATIH · hospitals · EPRD-PGFP 2026</text><text x="32" y="631" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#e7e9ee" text-anchor="start">Several ways to prepare the submission</text></g><g data-node="atih-excel"><rect x="32" y="672" width="154" height="86" rx="8" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></rect></g><g data-region="atih-excel-title" data-bounds="35 675 148 40"><text x="109" y="702" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#e7e9ee" text-anchor="middle">Excel .xlsm</text></g><g data-region="atih-excel-detail" data-bounds="36 715 146 35"><text x="109" y="737" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#8b909b" text-anchor="middle">Generation macro</text></g><g data-node="atih-software"><rect x="218" y="672" width="150" height="86" rx="8" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></rect></g><g data-region="atih-software-title" data-bounds="221 675 144 40"><text x="293" y="698" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#e7e9ee" text-anchor="middle">Finance software</text></g><g data-region="atih-software-detail" data-bounds="222 715 142 35"><text x="293" y="737" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#8b909b" text-anchor="middle">Vendor export</text></g><g data-edge="atih-excel-csv"><line x1="109" y1="766" x2="109" y2="790" stroke="#5eead4" stroke-width="2"></line><path d="M105 782 L109 790 L113 782" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-edge="atih-software-text"><line x1="293" y1="766" x2="293" y2="790" stroke="#5eead4" stroke-width="2"></line><path d="M289 782 L293 790 L297 782" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-node="atih-csv"><rect x="32" y="802" width="154" height="55" rx="8" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></rect></g><g data-region="atih-csv-title" data-bounds="35 805 148 42"><text x="109" y="834" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#5eead4" text-anchor="middle">CSV</text></g><g data-node="atih-structured"><rect x="218" y="802" width="150" height="55" rx="8" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></rect></g><g data-region="atih-structured-title" data-bounds="221 805 144 40"><text x="293" y="829" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#5eead4" text-anchor="middle">Structured text</text></g><g data-edge="atih-imports"><line x1="109" y1="865" x2="109" y2="891" stroke="#5eead4" stroke-width="2"></line><line x1="293" y1="865" x2="293" y2="891" stroke="#5eead4" stroke-width="2"></line><line x1="109" y1="891" x2="293" y2="891" stroke="#5eead4" stroke-width="2"></line><line x1="200" y1="891" x2="200" y2="912" stroke="#5eead4" stroke-width="2"></line><path d="M196 904 L200 912 L204 904" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-node="ancre"><rect x="56" y="924" width="288" height="219" rx="12" fill="#171a20" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></rect></g><g data-region="ancre-title" data-bounds="64 928 272 46"><text x="200" y="960" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#e7e9ee" text-anchor="middle">ANCRE</text></g><g data-region="ancre-import-checks" data-bounds="64 975 272 63"><text x="200" y="997" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#5eead4" text-anchor="middle">Import: header and row checks</text><text x="200" y="1022" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#5eead4" text-anchor="middle">FINESS · year · codes</text></g><line x1="72" y1="1048" x2="328" y2="1048" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></line><g data-region="ancre-web-entry" data-bounds="64 1061 272 70"><text x="200" y="1084" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#e7e9ee" text-anchor="middle">Direct web entry available</text><text x="200" y="1110" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="