<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="microsoft-migration-practice-upstream-en-desktop-title microsoft-migration-practice-upstream-en-desktop-desc"><title id="microsoft-migration-practice-upstream-en-desktop-title">Sharing improvements with LibreOffice</title><desc id="microsoft-migration-practice-upstream-en-desktop-desc">Historical contribution process described by Munich, where LibreOffice was used within LiMux through the end of 2023. Municipal fixes and features first entered The Document Foundation LibreOffice main branch, then underwent its quality assurance. After approval, they were ported to the municipal version. The contributions also benefit shared LibreOffice. This diagram does not describe Munich’s current IT estate.</desc><rect x="0" y="0" width="1000" height="720" rx="18" fill="#0c0d10" stroke="none" stroke-width="1"></rect><g data-region="eyebrow" data-bounds="24 16 952 34"><text x="34" y="39" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#5eead4" text-anchor="start">l0g / MAINTAINING AN ALTERNATIVE</text></g><g data-region="heading" data-bounds="24 55 952 59"><text x="34" y="97" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#e7e9ee" text-anchor="start">Sharing improvements with LibreOffice</text></g><g data-region="subtitle" data-bounds="24 116 952 40"><text x="34" y="142" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#8b909b" text-anchor="start">Historical process described by Munich · LibreOffice in LiMux through the end of 2023</text></g><g data-node="municipality"><rect x="32" y="199" width="280" height="375" rx="8" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></rect></g><g data-node="common-project"><rect x="416" y="199" width="552" height="375" rx="8" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></rect></g><g data-region="city-heading" data-bounds="44 209 256 43"><text x="54" y="236" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#e7e9ee" text-anchor="start">MUNICH</text></g><g data-region="project-heading" data-bounds="428 209 528 43"><text x="438" y="236" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#5eead4" text-anchor="start">THE DOCUMENT FOUNDATION</text></g><g data-node="contribution"><rect x="48" y="273" width="248" height="110" rx="8" fill="#171a20" stroke="none" stroke-width="1"></rect></g><g data-region="contribution-label" data-bounds="56 284 232 95"><text x="172" y="309" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#e7e9ee" text-anchor="middle">Bug fixes</text><text x="172" y="336" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#e7e9ee" text-anchor="middle">and features</text><text x="172" y="363" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#e7e9ee" text-anchor="middle">Municipal contributions</text></g><g data-node="main-branch"><rect x="440" y="273" width="254" height="110" rx="8" fill="#171a20" stroke="none" stroke-width="1"></rect></g><g data-region="main-branch-label" data-bounds="448 289 238 82"><text x="567" y="319" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#5eead4" text-anchor="middle">LibreOffice</text><text x="567" y="350" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#5eead4" text-anchor="middle">main branch</text></g><g data-edge="contribute-upstream"><line x1="304" y1="327" x2="432" y2="327" stroke="#5eead4" stroke-width="2"></line><path d="M424 331 L432 327 L424 323" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-region="first" data-bounds="312 274 112 38"><text x="368" y="296" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#5eead4" text-anchor="middle">FIRST</text></g><g data-edge="main-to-qa"><line x1="567" y1="391" x2="567" y2="419" stroke="#5eead4" stroke-width="2"></line><path d="M563 411 L567 419 L571 411" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-node="quality-assurance"><rect x="440" y="430" width="254" height="110" rx="8" fill="#171a20" stroke="none" stroke-width="1"></rect></g><g data-region="qa-label" data-bounds="448 441 238 90"><text x="567" y="467" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#e7e9ee" text-anchor="middle">Quality assurance</text><text x="567" y="493" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#e7e9ee" text-anchor="middle">at TDF</text><text x="567" y="519" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#e7e9ee" text-anchor="middle">Approval</text></g><g data-node="local-version"><rect x="48" y="430" width="248" height="110" rx="8" fill="#171a20" stroke="none" stroke-width="1"></rect></g><g data-region="local-version-label" data-bounds="56 445 232 79"><text x="172" y="473" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#e7e9ee" text-anchor="middle">Municipal version</text><text x="172" y="504" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#e7e9ee" text-anchor="middle">of LibreOffice</text></g><g data-edge="approved-local-port"><line x1="432" y1="485" x2="304" y2="485" stroke="#5eead4" stroke-width="2"></line><path d="M312 481 L304 485 L312 489" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-region="after-approval" data-bounds="307 406 126 61"><text x="370" y="427" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5eead4" text-anchor="middle">AFTER</text><text x="370" y="450" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5eead4" text-anchor="middle">APPROVAL</text></g><g data-node="shared-benefit"><rect x="750" y="430" width="194" height="110" rx="8" fill="#171a20" stroke="none" stroke-width="1"></rect></g><g data-region="shared-benefit-label" data-bounds="758 441 178 91"><text x="847" y="466" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#5eead4" text-anchor="middle">Contributions</text><text x="847" y="493" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#5eead4" text-anchor="middle">in shared</text><text x="847" y="520" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#5eead4" text-anchor="middle">LibreOffice</text></g><g data-edge="shared-contribution"><line x1="702" y1="485" x2="742" y2="485" stroke="#5eead4" stroke-width="2"></line><path d="M734 489 L742 485 L734 481" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-region="shared-note" data-bounds="730 283 228 98"><text x="844" y="309" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#8b909b" text-anchor="middle">The same work</text><text x="844" y="337" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#8b909b" text-anchor="middle">becomes part of</text><text x="844" y="365" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#8b909b" text-anchor="middle">the common project.</text></g><g data-region="process-note" data-bounds="24 598 952 66"><text x="34" y="624" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#8b909b" text-anchor="start">The city describes work passing through the common project before returning to its own version.</text><text x="34" y="652" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#8b909b" text-anchor="start">This process relates to the historical use of LibreOffice within LiMux.</text></g><g data-region="upstream-source" data-bounds="24 675 952 34"><text x="34" y="696" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#8b909b" text-anchor="start">Source: Munich Open Source, “LibreOffice” page · Historical contribution process</text></g></svg>