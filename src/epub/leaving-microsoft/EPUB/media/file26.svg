<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 758" role="img" aria-labelledby="microsoft-choice-sovereignty-en-desktop-title microsoft-choice-sovereignty-en-desktop-desc"><title id="microsoft-choice-sovereignty-en-desktop-title">A threshold, then a weighted score</title><desc id="microsoft-choice-sovereignty-en-desktop-desc">European Commission cloud procurement. All eight objectives must reach at least SEAL 2. Failure on any objective leads to rejection. The overall SEAL is the minimum of the eight levels, not their average. Offers meeting the threshold can then be compared through their sovereignty score: each objective score is divided by its maximum and weighted at 15, 10, 10, 15, 20, 15, 10 and 5 percent. The result contributes to the quality score. No candidate scores or weight within the overall tender score are represented.</desc><rect x="0" y="0" width="1000" height="758" rx="18" fill="#0c0d10" stroke="none" stroke-width="1"></rect><g data-region="eyebrow" data-bounds="24 16 952 34"><text x="34" y="39" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#5eead4" text-anchor="start">l0g / CLOUD PROCUREMENT</text></g><g data-region="heading" data-bounds="24 55 952 59"><text x="34" y="97" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#e7e9ee" text-anchor="start">A threshold, then a weighted score</text></g><g data-region="subtitle" data-bounds="24 116 952 40"><text x="34" y="142" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#8b909b" text-anchor="start">European Commission procurement · 2025 framework · 2026 implementation guide</text></g><g data-node="objectives"><rect x="32" y="184" width="337" height="330" rx="8" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></rect></g><g data-region="objectives-heading" data-bounds="40 191 321 38"><text x="50" y="215" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="70