<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 722" role="img" aria-labelledby="microsoft-choice-switching-en-desktop-title microsoft-choice-switching-en-desktop-desc"><title id="microsoft-choice-switching-en-desktop-title">The stages of a cloud exit</title><desc id="microsoft-choice-switching-en-desktop-desc">Article 25 of the Data Act for covered services. The request starts a notice period of up to two months, followed by a standard transition of up to thirty calendar days with service continuity. If this is technically unfeasible, the provider must justify and notify it within fourteen working days of the request, with an alternative transition of up to seven months. The customer may extend the transition once for a period it considers appropriate. This diagram calculates no total duration and assigns no starting point to the seven months. Retrieval lasts at least thirty calendar days after the agreed transition ends. Erasure follows that period, or a later agreed date, if switching succeeded. The contract terminates on successful switching and the customer is notified.</desc><rect x="0" y="0" width="1000" height="722" rx="18" fill="#0c0d10" stroke="none" stroke-width="1"></rect><g data-region="eyebrow" data-bounds="24 16 952 34"><text x="34" y="39" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#5eead4" text-anchor="start">l0g / DATA ACT</text></g><g data-region="heading" data-bounds="24 55 952 59"><text x="34" y="97" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#e7e9ee" text-anchor="start">The stages of a cloud exit</text></g><g data-region="subtitle" data-bounds="24 116 952 40"><text x="34" y="142" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#8b909b" text-anchor="start">Covered service contract · Article 25 · Separate deadlines · diagram not to time scale</text></g><g data-node="technical-extension"><rect x="32" y="190" width="460" height="124" rx="8" fill="#121419" stroke="#f5b13d" stroke-width="1"></rect></g><g data-region="technical-label" data-bounds="40 198 444 108"><text x="50" y="222" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#f5b13d" text-anchor="start">JUSTIFIED TECHNICAL INFEASIBILITY</text><text x="50" y="253" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#f5b13d" text-anchor="start">Notice within 14 working days of the switching request</text><text x="50" y="284" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#f5b13d" text-anchor="start">Alternative transition: up to 7 months</text></g><g data-node="customer-extension"><rect x="534" y="190" width="434" height="124" rx="8" fill="#121419" stroke="#5eead4" stroke-width="1"></rect></g><g data-region="customer-label" data-bounds="542 198 418 107"><text x="552" y="222" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#5eead4" text-anchor="start">CUSTOMER’S CHOICE</text><text x="552" y="253" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#5eead4" text-anchor="start">One extension of the transition</text><text x="552" y="284" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#5eead4" text-anchor="start">For a period the customer considers appropriate</text></g><g data-edge="technical-to-transition"><path d="M262 322 L262 338 L400 338" fill="none" stroke="#f5b13d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-edge="customer-to-transition"><path d="M751 322 L751 338 L400 338" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-edge="extensions-modify-transition"><line x1="400" y1="338" x2="400" y2="360" stroke="#5eead4" stroke-width="2"></line><path d="M396 352 L400 360 L404 352" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-node="notice"><rect x="32" y="370" width="202" height="222" rx="8" fill="#171a20" stroke="none" stroke-width="1"></rect></g><g data-node="transition"><rect x="276" y="370" width="254" height="222" rx="8" fill="#171a20" stroke="none" stroke-width="1"></rect></g><g data-node="retrieval"><rect x="572" y="370" width="218" height="222" rx="8" fill="#171a20" stroke="none" stroke-width="1"></rect></g><g data-node="erasure"><rect x="830" y="370" width="138" height="222" rx="8" fill="#171a20" stroke="none" stroke-width="1"></rect></g><g data-region="notice-stage" data-bounds="40 382 186 38"><text x="50" y="405" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#8b909b" text-anchor="start">NOTICE</text></g><g data-region="notice-duration" data-bounds="40 425 186 57"><text x="50" y="462" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#e7e9ee" text-anchor="start">≤ 2 months</text></g><g data-region="notice-rule" data-bounds="40 487 186 83"><text x="50" y="512" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#e7e9ee" text-anchor="start">From the</text><text x="50" y="538" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#e7e9ee" text-anchor="start">switching request</text></g><g data-edge="notice-to-transition"><line x1="242" y1="477" x2="268" y2="477" stroke="#5eead4" stroke-width="2"></line><path d="M260 481 L268 477 L260 473" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-region="transition-stage" data-bounds="284 382 238 38"><text x="294" y="405" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#8b909b" text-anchor="start">TRANSITION</text></g><g data-region="transition-duration" data-bounds="284 425 238 57"><text x="294" y="463" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#e7e9ee" text-anchor="start">≤ 30 days</text></g><g data-region="transition-rule" data-bounds="284 487 238 87"><text x="294" y="511" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#e7e9ee" text-anchor="start">Calendar days · standard rule</text><text x="294" y="537" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#e7e9ee" text-anchor="start">After the notice period</text><text x="294" y="563" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#e7e9ee" text-anchor="start">Service continues</text></g><g data-edge="transition-to-retrieval"><line x1="538" y1="477" x2="564" y2="477" stroke="#5eead4" stroke-width="2"></line><path d="M556 481 L564 477 L556 473" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-region="retrieval-stage" data-bounds="580 382 202 38"><text x="590" y="405" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#8b909b" text-anchor="start">RETRIEVAL</text></g><g data-region="retrieval-duration" data-bounds="580 425 202 57"><text x="590" y="462" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#e7e9ee" text-anchor="start">≥ 30 days</text></g><g data-region="retrieval-rule" data-bounds="580 487 202 87"><text x="590" y="511" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#e7e9ee" text-anchor="start">Calendar days</text><text x="590" y="537" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#e7e9ee" text-anchor="start">After the agreed</text><text x="590" y="563" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#e7e9ee" text-anchor="start">transition ends</text></g><g data-edge="retrieval-to-erasure"><line x1="798" y1="477" x2="822" y2="477" stroke="#5eead4" stroke-width="2"></line><path d="M814 481 L822 477 L814 473" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-region="erasure-stage" data-bounds="838 382 122 38"><text x="899" y="403" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#8b909b" text-anchor="middle">ERASURE</text></g><g data-region="erasure-rule" data-bounds="838 438 122 140"><text x="899" y="459" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" fill="#e7e9ee" text-anchor="middle">After the</text><text x="899" y="480" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" fill="#e7e9ee" text-anchor="middle">retrieval period</text><text x="899" y="501" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" fill="#e7e9ee" text-anchor="middle">or at a later</text><text x="899" y="522" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" fill="#e7e9ee" text-anchor="middle">agreed date</text><text x="899" y="543" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" fill="#e7e9ee" text-anchor="middle">If switching</text><text x="899" y="564" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" fill="#e7e9ee" text-anchor="middle">succeeded</text></g><g data-region="termination" data-bounds="24 615 952 44"><text x="34" y="641" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#5eead4" text-anchor="start">On successful switching: the provider notifies the customer of contract termination.</text></g><g data-region="switching-source" data-bounds="24 674 952 34"><text x="34" y="695" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#8b909b" text-anchor="start">Source: Regulation (EU) 2023/2854, Article 25(2)–(5) · Branches modify the transition.</text></g></svg>