<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1572" role="img" aria-labelledby="microsoft-exit-identity-en-mobile-title microsoft-exit-identity-en-mobile-desc"><title id="microsoft-exit-identity-en-mobile-title">A broken pairing, a different mailbox</title><desc id="microsoft-exit-identity-en-mobile-desc">Teaching example with fictional data: C maps to ID 03, A to ID 01 and B to ID 02. Sorting only the address column yields A with ID 03, B with ID 01 and C with ID 02. Comparing against the original pairs and performing a second check verifies A–01, B–02 and C–03. Separately, Dataport’s report of 15 August 2025 documents 790 accounts affected by a mapping error during the 6–7 August migration. The three fictional rows do not reproduce those accounts.</desc><rect x="0" y="0" width="400" height="1572" rx="18" fill="#0c0d10" stroke="none" stroke-width="1"></rect><g data-region="eyebrow" data-bounds="24 16 352 34"><text x="32" y="37" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5eead4" text-anchor="start">l0g / MIGRATION INTEGRITY</text></g><g data-region="heading" data-bounds="24 55 352 82"><text x="32" y="91" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#e7e9ee" text-anchor="start">A broken pairing,</text><text x="32" y="125" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#e7e9ee" text-anchor="start">a different mailbox</text></g><g data-region="subtitle" data-bounds="24 141 352 63"><text x="32" y="164" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="start">Teaching example, fictional data.</text><text x="32" y="187" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="start">Address and identifier must remain paired.</text></g><g data-region="original-heading" data-bounds="24 208 352 44"><text x="32" y="236" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#e7e9ee" text-anchor="start">01 · Original pairs</text></g><rect x="32" y="262" width="336" height="220" rx="10" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></rect><rect x="33" y="263" width="334" height="45" rx="8" fill="#171a20" stroke="none" stroke-width="1"></rect><g data-region="original-left-col" data-bounds="39 263 154 40"><text x="116" y="287" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#8b909b" text-anchor="middle">Address</text></g><g data-region="original-right-col" data-bounds="207 263 154 40"><text x="284" y="287" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#8b909b" text-anchor="middle">Identifier</text></g><g data-pair="original" data-address="C" data-identity="03"><g data-region="original-address-0" data-bounds="44 312 132 43"><text x="110" y="338" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#e7e9ee" text-anchor="middle">Mailbox C</text></g><g data-region="original-id-0" data-bounds="222 312 132 43"><text x="288" y="338" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#e7e9ee" text-anchor="middle">ID 03</text></g><line x1="188" y1="336" x2="212" y2="336" stroke="#8b909b" stroke-width="2"></line><path d="M204 340 L212 336 L204 332" fill="none" stroke="#8b909b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><line x1="46" y1="360" x2="354" y2="360" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></line><g data-pair="original" data-address="A" data-identity="01"><g data-region="original-address-1" data-bounds="44 366 132 43"><text x="110" y="392" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#e7e9ee" text-anchor="middle">Mailbox A</text></g><g data-region="original-id-1" data-bounds="222 366 132 43"><text x="288" y="392" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#e7e9ee" text-anchor="middle">ID 01</text></g><line x1="188" y1="390" x2="212" y2="390" stroke="#8b909b" stroke-width="2"></line><path d="M204 394 L212 390 L204 386" fill="none" stroke="#8b909b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><line x1="46" y1="414" x2="354" y2="414" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></line><g data-pair="original" data-address="B" data-identity="02"><g data-region="original-address-2" data-bounds="44 420 132 43"><text x="110" y="446" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#e7e9ee" text-anchor="middle">Mailbox B</text></g><g data-region="original-id-2" data-bounds="222 420 132 43"><text x="288" y="446" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#e7e9ee" text-anchor="middle">ID 02</text></g><line x1="188" y1="444" x2="212" y2="444" stroke="#8b909b" stroke-width="2"></line><path d="M204 448 L212 444 L204 440" fill="none" stroke="#8b909b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><line x1="200" y1="491" x2="200" y2="514" stroke="#ff4d87" stroke-width="2" stroke-dasharray="4 5"></line><path d="M196 506 L200 514 L204 506" fill="none" stroke="#ff4d87" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><g data-region="broken-heading" data-bounds="24 523 352 44"><text x="32" y="551" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#ff4d87" text-anchor="start">02 · One column sorted</text></g><rect x="32" y="577" width="336" height="220" rx="10" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></rect><rect x="33" y="578" width="334" height="45" rx="8" fill="#171a20" stroke="none" stroke-width="1"></rect><g data-region="broken-left-col" data-bounds="39 578 154 40"><text x="116" y="602" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#8b909b" text-anchor="middle">Address</text></g><g data-region="broken-right-col" data-bounds="207 578 154 40"><text x="284" y="602" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#8b909b" text-anchor="middle">Identifier</text></g><g data-pair="broken" data-address="A" data-identity="03"><g data-region="broken-address-0" data-bounds="44 627 132 43"><text x="110" y="653" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#e7e9ee" text-anchor="middle">Mailbox A</text></g><g data-region="broken-id-0" data-bounds="222 627 132 43"><text x="288" y="653" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#ff4d87" text-anchor="middle">ID 03</text></g><path d="M195 646 L205 656 M195 656 L205 646" fill="none" stroke="#ff4d87" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><line x1="46" y1="675" x2="354" y2="675" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></line><g data-pair="broken" data-address="B" data-identity="01"><g data-region="broken-address-1" data-bounds="44 681 132 43"><text x="110" y="707" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#e7e9ee" text-anchor="middle">Mailbox B</text></g><g data-region="broken-id-1" data-bounds="222 681 132 43"><text x="288" y="707" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#ff4d87" text-anchor="middle">ID 01</text></g><path d="M195 700 L205 710 M195 710 L205 700" fill="none" stroke="#ff4d87" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><line x1="46" y1="729" x2="354" y2="729" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></line><g data-pair="broken" data-address="C" data-identity="02"><g data-region="broken-address-2" data-bounds="44 735 132 43"><text x="110" y="761" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#e7e9ee" text-anchor="middle">Mailbox C</text></g><g data-region="broke