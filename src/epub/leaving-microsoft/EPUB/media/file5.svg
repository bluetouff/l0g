" stroke="#5eead4" stroke-width="2"></line><path d="M204 1000 L212 996 L204 992" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><line x1="46" y1="1020" x2="354" y2="1020" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></line><g data-pair="verified" data-address="B" data-identity="02"><g data-region="verified-address-1" data-bounds="44 1026 132 43"><text x="110" y="1052" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#e7e9ee" text-anchor="middle">Mailbox B</text></g><g data-region="verified-id-1" data-bounds="222 1026 132 43"><text x="288" y="1052" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#5eead4" text-anchor="middle">ID 02</text></g><line x1="188" y1="1050" x2="212" y2="1050" stroke="#5eead4" stroke-width="2"></line><path d="M204 1054 L212 1050 L204 1046" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><line x1="46" y1="1074" x2="354" y2="1074" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></line><g data-pair="verified" data-address="C" data-identity="03"><g data-region="verified-address-2" data-bounds="44 1080 132 43"><text x="110" y="1106" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#e7e9ee" text-anchor="middle">Mailbox C</text></g><g data-region="verified-id-2" data-bounds="222 1080 132 43"><text x="288" y="1106" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#5eead4" text-anchor="middle">ID 03</text></g><line x1="188" y1="1104" x2="212" y2="1104" stroke="#5eead4" stroke-width="2"></line><path d="M204 1108 L212 1104 L204 1100" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-region="broken-explainer" data-bounds="24 818 352 44"><text x="200" y="842" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#ff4d87" text-anchor="middle">A was linked to C’s identifier.</text></g><g data-region="pair-validation" data-bounds="24 1159 352 86"><text x="32" y="1183" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#5eead4" text-anchor="start">Compare pairs with the original file.</text><text x="32" y="1207" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#5eead4" text-anchor="start">Have a second operator</text><text x="32" y="1231" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#5eead4" text-anchor="start">verify the mapping.</text></g><line x1="32" y1="1273" x2="368" y2="1273" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></line><g data-region="incident-label" data-bounds="24 1290 352 36"><text x="32" y="1311" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#8b909b" text-anchor="start">DOCUMENTED INCIDENT · 6–7 AUGUST 2025</text></g><g data-region="incident-count" data-bounds="24 1328 142 80"><text x="32" y="1384" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#e7e9ee" text-anchor="start">790</text></g><g data-region="incident-unit" data-bounds="163 1339 213 70"><text x="171" y="1366" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#e7e9ee" text-anchor="start">accounts affected</text><text x="171" y="1393" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#e7e9ee" text-anchor="start">according to Dataport</text></g><g data-region="incident-source" data-bounds="24 1428 352 115"><text x="32" y="1450" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#8b909b" text-anchor="start">The report attributes the incident to a partial</text><text x="32" y="1473" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#8b909b" text-anchor="start">sort and a missing four-eyes check.</text><text x="32" y="1496" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#8b909b" text-anchor="start">Source: Dataport report, 15 August 2025,</text><text x="32" y="1519" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#8b909b" text-anchor="start">annexed to Landtag reply 20/3628.</text></g></svg>