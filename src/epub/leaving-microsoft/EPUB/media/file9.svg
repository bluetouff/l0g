<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1152" role="img" aria-labelledby="microsoft-contracts-activation-en-mobile-title microsoft-contracts-activation-en-mobile-desc"><title id="microsoft-contracts-activation-en-mobile-title">A group policy grants service access</title><desc id="microsoft-contracts-activation-en-mobile-desc">Educational Entra mechanism: an account belonging to a group inherits the product licence assigned to that group. The administrator can enable or disable the product’s service plans. Joining the group triggers assignment; leaving removes this assignment. Other groups or direct assignments can retain the same licence. This diagram concerns access rights; software installation is a separate step.</desc><rect x="0" y="0" width="400" height="1152" rx="18" fill="#0c0d10" stroke="none" stroke-width="1"></rect><g data-region="eyebrow" data-bounds="24 16 352 34"><text x="32" y="37" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5eead4" text-anchor="start">l0g / FROM ACCOUNT TO ACCESS</text></g><g data-region="heading" data-bounds="24 55 352 85"><text x="32" y="91" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#e7e9ee" text-anchor="start">A group policy</text><text x="32" y="125" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#e7e9ee" text-anchor="start">grants service access</text></g><g data-region="subtitle" data-bounds="24 141 352 63"><text x="32" y="164" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="start">Entra assigns the licences.</text><text x="32" y="187" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="start">The administrator chooses the service plans.</text></g><circle cx="83" cy="234" r="11" fill="none" stroke="#e7e9ee" stroke-width="2"></circle><path d="M61 273 C61 247 105 247 105 273" fill="none" stroke="#e7e9ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><line x1="61" y1="273" x2="105" y2="273" stroke="#e7e9ee" stroke-width="2"></line><g data-region="account" data-bounds="126 222 248 70"><text x="134" y="250" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#e7e9ee" text-anchor="start">User</text><text x="134" y="278" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#e7e9ee" text-anchor="start">account</text></g><g data-node="group"><rect x="96" y="333" width="208" height="80" rx="10" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="2"></rect></g><g data-region="group" data-bounds="104 342 192 44"><text x="200" y="373" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#e7e9ee" text-anchor="middle">Group</text></g><g data-region="group-detail" data-bounds="104 378 192 34"><text x="200" y="400" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#8b909b" text-anchor="middle">Assignment policy</text></g><line x1="200" y1="292" x2="200" y2="325" stroke="#5eead4" stroke-width="2"></line><path d="M196 317 L200 325 L204 317" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><g data-node="product-licence"><rect x="96" y="474" width="208" height="80" rx="10" fill="#121419" stroke="#5eead4" stroke-width="2"></rect></g><g data-region="product" data-bounds="104 484 192 42"><text x="200" y="513" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#5eead4" text-anchor="middle">Product licence</text></g><g data-region="product-detail" data-bounds="104 520 192 34"><text x="200" y="542" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#8b909b" text-anchor="middle">From the group</text></g><g data-link="group-to-licence"><line x1="200" y1="421" x2="200" y2="466" stroke="#5eead4" stroke-width="2"></line><path d="M196 458 L200 466 L204 458" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-region="administrator" data-bounds="24 565 156 62"><text x="32" y="587" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#f5b13d" text-anchor="start">Administrator</text><text x="32" y="609" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#f5b13d" text-anchor="start">choice</text></g><line x1="200" y1="554" x2="200" y2="616" stroke="#5eead4" stroke-width="2"></line><line x1="108" y1="616" x2="292" y2="616" stroke="#5eead4" stroke-width="2"></line><g data-link="licence-to-enabled"><line x1="108" y1="616" x2="108" y2="626" stroke="#5eead4" stroke-width="2"></line><path d="M104 618 L108 626 L112 618" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-link="licence-to-disabled"><line x1="292" y1="616" x2="292" y2="626" stroke="#f5b13d" stroke-width="2" stroke-dasharray="4 5"></line><path d="M288 618 L292 626 L296 618" fill="none" stroke="#f5b13d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-plan="enabled"><rect x="24" y="634" width="167" height="112" rx="10" fill="#121419" stroke="#5eead4" stroke-width="1.5"></rect></g><g data-region="plan-0" data-bounds="28 642 159 38"><text x="107.5" y="667" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#5eead4" text-anchor="middle">Enabled plan</text></g><g data-region="access-0" data-bounds="28 677 159 34"><text x="107.5" y="699" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#e7e9ee" text-anchor="middle">Access granted</text></g><rect x="88" y="722" width="38" height="12" rx="6" fill="#0c0d10" stroke="#5eead4" stroke-width="1"></rect><circle cx="119" cy="728" r="4" fill="#5eead4" stroke="none" stroke-width="1"></circle><g data-plan="disabled"><rect x="209" y="634" width="167" height="112" rx="10" fill="#121419" stroke="#f5b13d" stroke-width="1.5"></rect></g><g data-region="plan-1" data-bounds="213 642 159 38"><text x="292.5" y="667" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#f5b13d" text-anchor="middle">Disabled plan</text></g><g data-region="access-1" data-bounds="213 677 159 34"><text x="292.5" y="699" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#e7e9ee" text-anchor="middle">Service excluded</text></g><rect x="273" y="722" width="38" height="12" rx="6" fill="#0c0d10" stroke="#f5b13d" stroke-width="1"></rect><circle cx="280" cy="728" r="4" fill="#f5b13d" stroke="none" stroke-width="1"></circle><g data-region="membership-enter" data-bounds="24 779 352 62"><text x="32" y="804" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#5eead4" text-anchor="start">Join the group:</text><text x="32" y="829" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#5eead4" text-anchor="start">its licence is assigned to the account.</text></g><g data-region="membership-leave" data-bounds="24 856 352 62"><text x="32" y="881" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#f5b13d" text-anchor="start">Leave the group:</text><text x="32" y="906" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#f5b13d" text-anchor="start">this assignment is removed.</text></g><line x1="32" y1="949" x2="368" y2="949" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></line><g data-region="activation-scope" data-bounds="24 961 352 114"><text x="32" y="983" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#8b909b" text-anchor="start">Teaching example: assigning access rights.</text><text x="32" y="1006" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#8b909b" text-anchor="start">Software installation is a separate step.</text><text x="32" y="1029" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#8b909b" text-anchor="start">Other groups or direct assignments</text><text x="32" y="1052" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#8b909b" text-anchor="start">can retain the same licence.</text></g><g data-region="activation-source" data-bounds="24 1070 352 63"><text x="32" y="1092" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#8b909b" text-anchor="start">Sources: Microsoft Learn, group-based</text><text x="32" y="1115" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#8b909b" text-anchor="start">licensing, accessed 8 October 2026.</text></g></svg>