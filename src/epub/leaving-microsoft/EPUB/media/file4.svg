<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 877" role="img" aria-labelledby="microsoft-exit-identity-en-desktop-title microsoft-exit-identity-en-desktop-desc"><title id="microsoft-exit-identity-en-desktop-title">A broken pairing, a different mailbox</title><desc id="microsoft-exit-identity-en-desktop-desc">Teaching example with fictional data: C maps to ID 03, A to ID 01 and B to ID 02. Sorting only the address column yields A with ID 03, B with ID 01 and C with ID 02. Comparing against the original pairs and performing a second check verifies A–01, B–02 and C–03. Separately, Dataport’s report of 15 August 2025 documents 790 accounts affected by a mapping error during the 6–7 August migration. The three fictional rows do not reproduce those accounts.</desc><rect x="0" y="0" width="1000" height="877" rx="18" fill="#0c0d10" stroke="none" stroke-width="1"></rect><g data-region="eyebrow" data-bounds="24 16 952 34"><text x="32" y="39" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#5eead4" text-anchor="start">l0g / MIGRATION INTEGRITY</text></g><g data-region="heading" data-bounds="24 55 952 59"><text x="32" y="97" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#e7e9ee" text-anchor="start">A broken pairing, a different mailbox</text></g><g data-region="subtitle" data-bounds="24 116 952 40"><text x="32" y="142" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#8b909b" text-anchor="start">Teaching example, fictional data. Address and identifier must remain paired.</text></g><g data-region="original-heading" data-bounds="24 197 304 44"><text x="32" y="226" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#e7e9ee" text-anchor="start">01 · Original pairs</text></g><rect x="32" y="251" width="288" height="220" rx="10" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></rect><rect x="33" y="252" width="286" height="45" rx="8" fill="#171a20" stroke="none" stroke-width="1"></rect><g data-region="original-left-col" data-bounds="39 252 130 40"><text x="104" y="276" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#8b909b" text-anchor="middle">Address</text></g><g data-region="original-right-col" data-bounds="183 252 130 40"><text x="248" y="276" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#8b909b" text-anchor="middle">Identifier</text></g><g data-pair="original" data-address="C" data-identity="03"><g data-region="original-address-0" data-bounds="44 301 108 43"><text x="98" y="326" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#e7e9ee" text-anchor="middle">Mailbox C</text></g><g data-region="original-id-0" data-bounds="198 301 108 43"><text x="252" y="326" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#e7e9ee" text-anchor="middle">ID 03</text></g><line x1="164" y1="325" x2="188" y2="325" stroke="#8b909b" stroke-width="2"></line><path d="M180 329 L188 325 L180 321" fill="none" stroke="#8b909b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><line x1="46" y1="349" x2="306" y2="349" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></line><g data-pair="original" data-address="A" data-identity="01"><g data-region="original-address-1" data-bounds="44 355 108 43"><text x="98" y="380" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#e7e9ee" text-anchor="middle">Mailbox A</text></g><g data-region="original-id-1" data-bounds="198 355 108 43"><text x="252" y="380" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#e7e9ee" text-anchor="middle">ID 01</text></g><line x1="164" y1="379" x2="188" y2="379" stroke="#8b909b" stroke-width="2"></line><path d="M180 383 L188 379 L180 375" fill="none" stroke="#8b909b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><line x1="46" y1="403" x2="306" y2="403" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></line><g data-pair="original" data-address="B" data-identity="02"><g data-region="original-address-2" data-bounds="44 409 108 43"><text x="98" y="434" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#e7e9ee" text-anchor="middle">Mailbox B</text></g><g data-region="original-id-2" data-bounds="198 409 108 43"><text x="252" y="434" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#e7e9ee" text-anchor="middle">ID 02</text></g><line x1="164" y1="433" x2="188" y2="433" stroke="#8b909b" stroke-width="2"></line><path d="M180 437 L188 433 L180 429" fill="none" stroke="#8b909b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><line x1="327" y1="363" x2="349" y2="363" stroke="#ff4d87" stroke-width="2" stroke-dasharray="4 5"></line><path d="M341 367 L349 363 L341 359" fill="none" stroke="#ff4d87" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><g data-region="broken-heading" data-bounds="348 197 304 44"><text x="356" y="226" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#ff4d87" text-anchor="start">02 · One column sorted</text></g><rect x="356" y="251" width="288" height="220" rx="10" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></rect><rect x="357" y="252" width="286" height="45" rx="8" fill="#171a20" stroke="none" stroke-width="1"></rect><g data-region="broken-left-col" data-bounds="363 252 130 40"><text x="428" y="276" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#8b909b" text-anchor="middle">Address</text></g><g data-region="broken-right-col" data-bounds="507 252 130 40"><text x="572" y="276" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#8b909b" text-anchor="middle">Identifier</text></g><g data-pair="broken" data-address="A" data-identity="03"><g data-region="broken-address-0" data-bounds="368 301 108 43"><text x="422" y="326" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#e7e9ee" text-anchor="middle">Mailbox A</text></g><g data-region="broken-id-0" data-bounds="522 301 108 43"><text x="576" y="326" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#ff4d87" text-anchor="middle">ID 03</text></g><path d="M495 320 L505 330 M495 330 L505 320" fill="none" stroke="#ff4d87" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><line x1="370" y1="349" x2="630" y2="349" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></line><g data-pair="broken" data-address="B" data-identity="01"><g data-region="broken-address-1" data-bounds="368 355 108 43"><text x="422" y="380" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#e7e9ee" text-anchor="middle">Mailbox B</text></g><g data-region="broken-id-1" data-bounds="522 355 108 43"><text x="576" y="380" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#ff4d87" text-anchor="middle">ID 01</text></g><path d="M495 374 L505 384 M495 384 L505 374" fill="none" stroke="#ff4d87" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><line x1="370" y1="403" x2="630" y2="403" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></line><g data-pair="broken" data-address="C" data-identity="02"><g data-region="broken-address-2" data-bounds="368 409 108 43"><text x="422" y="434" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#e7e9ee" text-anchor="middle">Mailbox C</text></g><g data-region="broken-id-2" data-bounds="522 409 108 43"><text x="576" y="434" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#ff4d87" text-anchor="middle">ID 02</text></g><path d="M495 428 L505 438 M495 438 L505 428" fill="none" stroke="#ff4d87" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><line x1="651" y1="363" x2="673" y2="363" stroke="#5eead4" stroke-width="2" stroke-dasharray="4 5"></line><path d="M665 367 L673 363 L665 359" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><g data-region="verified-heading" data-bounds="672 197 304 44"><text x="680" y="226" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#5eead4" text-anchor="start">03 · Verified pairs</text></g><rect x="680" y="251" width="288" height="220" rx="10" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></rect><rect x="681" y="252" width="286" height="45" rx="8" fill="#171a20" stroke="none" stroke-width="1"></rect><g data-region="verified-left-col" data-bounds="687 252 130 40"><text x="752" y="276" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#8b909b" text-anchor="middle">Address</text></g><g data-region="verified-right-col" data-bounds="831 252 130 40"><text x="896" y="276" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#8b909b" text-anchor="middle">Identifier</text></g><g data-pair="verified" data-address="A" data-identity="01"><g data-region="verified-address-0" data-bounds="692 301 108 43"><text x="746" y="326" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#e7e9ee" text-anchor="middle">Mailbox A</text></g><g data-region="verified-id-0" data-bounds="846 301 108 43"><text x="900" y="326" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#5eead4" text-anchor="middle">ID 01</text></g><line x1="812" y1="325" x2="836" y2="325" stroke="#5eead4" stroke-width="2"></line><path d="M828 329 L836 325 L828 321" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><line x1="694" y1="349" x2="954" y2="349" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></line><g data-pair="verified" data-address="B" data-identity="02"><g data-region="verified-address-1" data-bounds="692 355 108 43"><text x="746" y="380" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#e7e9ee" text-anchor="middle">Mailbox B</text></g><g data-region="verified-id-1" data-bounds="846 355 108 43"><text x="900" y="380" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#5eead4" text-anchor="middle">ID 02</text></g><line x1="812" y1="379" x2="836" y2="379" stroke="#5eead4" stroke-width="2"></line><path d="M828 383 L836 379 L828 375" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><line x1="694" y1="403" x2="954" y2="403" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></line><g data-pair="verified" data-address="C" data-identity="03"><g data-region="verified-address-2" data-bounds="692 409 108 43"><text x="746" y="434" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#e7e9ee" text-anchor="middle">Mailbox C</text></g><g data-region="verified-id-2" data-bounds="846 409 108 43"><text x="900" y="434" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#5eead4" text-anchor="middle">ID 03</text></g><line x1="812" y1="433" x2="836" y2="433" stroke="#5eead4" stroke-width="2"></line><path d="M828 437 L836 433 L828 429" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-region="original-explainer" data-bounds="24 487 304 89"><text x="32" y="513" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#8b909b" text-anchor="start">Order does not matter.</text><text x="32" y="539" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#8b909b" text-anchor="start">Each address retains</text><text x="32" y="565" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#8b909b" text-anchor="start">its own identifier.</text></g><g data-region="broken-explainer" data-bounds="348 487 304 89"><text x="356" y="512" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#ff4d87" text-anchor="start">Identifiers did not move</text><text x="356" y="538" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#ff4d87" text-anchor="start">with their addresses.</text><text x="356" y="564" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#ff4d87" text-anchor="start">A is now paired with ID 03.</text></g><g data-region="pair-validation" data-bounds="672 487 304 89"><text x="680" y="512" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#5eead4" text-anchor="start">Compare with the original file.</text><text x="680" y="538" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#5eead4" text-anchor="start">Have a second operator</text><text x="680" y="564" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#5eead4" text-anchor="start">verify the pairs.</text></g><line x1="32" y1="629" x2="968" y2="629" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></line><g data-region="incident-label" data-bounds="24 646 952 36"><text x="32" y="669" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#8b909b" text-anchor="start">DOCUMENTED INCIDENT · 6–7 AUGUST 2025</text></g><g data-region="incident-count" data-bounds="24 684 171 80"><text x="32" y="746" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" fill="#e7e9ee" text-anchor="start">790</text></g><g data-region="incident-unit" data-bounds="192 695 768 70"><text x="200" y="724" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#e7e9ee" text-anchor="start">accounts affected</text><text x="200" y="751" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#e7e9ee" text-anchor="start">according to Dataport</text></g><g data-region="incident-source" data-bounds="24 784 952 68"><text x="32" y="809" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#8b909b" text-anchor="start">The report attributes the incident to a partial sort and a missing four-eyes check.</text><text x="32" y="835" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#8b909b" text-anchor="start">Source: Dataport report of 15 August 2025, annexed to Landtag reply 20/3628.</text></g></svg>