<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="microsoft-contracts-activation-en-desktop-title microsoft-contracts-activation-en-desktop-desc"><title id="microsoft-contracts-activation-en-desktop-title">A group policy grants service access</title><desc id="microsoft-contracts-activation-en-desktop-desc">Educational Entra mechanism: an account belonging to a group inherits the product licence assigned to that group. The administrator can enable or disable the product’s service plans. Joining the group triggers assignment; leaving removes this assignment. Other groups or direct assignments can retain the same licence. This diagram concerns access rights; software installation is a separate step.</desc><rect x="0" y="0" width="1000" height="700" rx="18" fill="#0c0d10" stroke="none" stroke-width="1"></rect><g data-region="eyebrow" data-bounds="24 16 952 34"><text x="32" y="39" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#5eead4" text-anchor="start">l0g / FROM ACCOUNT TO ACCESS</text></g><g data-region="heading" data-bounds="24 55 952 59"><text x="32" y="97" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#e7e9ee" text-anchor="start">A group policy grants service access</text></g><g data-region="subtitle" data-bounds="24 116 952 40"><text x="32" y="142" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#8b909b" text-anchor="start">Entra assigns the licences. The administrator chooses the service plans.</text></g><circle cx="85" cy="288" r="11" fill="none" stroke="#e7e9ee" stroke-width="2"></circle><path d="M63 327 C63 301 107 301 107 327" fill="none" stroke="#e7e9ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><line x1="63" y1="327" x2="107" y2="327" stroke="#e7e9ee" stroke-width="2"></line><g data-region="account" data-bounds="24 344 134 66"><text x="91" y="369" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#e7e9ee" text-anchor="middle">User</text><text x="91" y="393" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#e7e9ee" text-anchor="middle">account</text></g><g data-node="group"><rect x="183" y="253" width="204" height="96" rx="10" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="2"></rect></g><g data-region="group" data-bounds="191 262 188 44"><text x="285" y="293" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#e7e9ee" text-anchor="middle">Group</text></g><g data-region="group-detail" data-bounds="191 298 188 34"><text x="285" y="321" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="middle">Assignment policy</text></g><line x1="122" y1="302" x2="175" y2="302" stroke="#5eead4" stroke-width="2"></line><path d="M167 306 L175 302 L167 298" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><g data-node="product-licence"><rect x="453" y="253" width="184" height="96" rx="10" fill="#121419" stroke="#5eead4" stroke-width="2"></rect></g><g data-region="product" data-bounds="461 263 168 40"><text x="545" y="291" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#5eead4" text-anchor="middle">Product licence</text></g><g data-region="product-detail" data-bounds="461 299 168 34"><text x="545" y="321" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#8b909b" text-anchor="middle">From the group</text></g><g data-link="group-to-licence"><line x1="395" y1="302" x2="445" y2="302" stroke="#5eead4" stroke-width="2"></line><path d="M437 306 L445 302 L437 298" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-region="administrator" data-bounds="700 195 276 40"><text x="708" y="219" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#f5b13d" text-anchor="start">Administrator-selected plans</text></g><line x1="645" y1="302" x2="682" y2="302" stroke="#5eead4" stroke-width="2"></line><line x1="682" y1="287" x2="682" y2="410" stroke="#5eead4" stroke-width="2"></line><g data-link="licence-to-enabled"><line x1="682" y1="287" x2="720" y2="287" stroke="#5eead4" stroke-width="2"></line><path d="M712 291 L720 287 L712 283" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-link="licence-to-disabled"><line x1="682" y1="410" x2="720" y2="410" stroke="#f5b13d" stroke-width="2" stroke-dasharray="4 5"></line><path d="M712 414 L720 410 L712 406" fill="none" stroke="#f5b13d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g data-plan="enabled"><rect x="728" y="248" width="240" height="78" rx="10" fill="#121419" stroke="#5eead4" stroke-width="1.5"></rect></g><g data-region="plan-0" data-bounds="732 256 232 40"><text x="848" y="284" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#5eead4" text-anchor="middle">Enabled plan</text></g><g data-region="access-0" data-bounds="732 291 232 35"><text x="848" y="315" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#e7e9ee" text-anchor="middle">Access granted</text></g><g data-plan="disabled"><rect x="728" y="371" width="240" height="78" rx="10" fill="#121419" stroke="#f5b13d" stroke-width="1.5"></rect></g><g data-region="plan-1" data-bounds="732 379 232 40"><text x="848" y="407" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#f5b13d" text-anchor="middle">Disabled plan</text></g><g data-region="access-1" data-bounds="732 414 232 35"><text x="848" y="438" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#e7e9ee" text-anchor="middle">Service excluded</text></g><g data-region="membership-enter" data-bounds="24 470 462 70"><text x="32" y="496" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#5eead4" text-anchor="start">Join the group:</text><text x="32" y="521" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#5eead4" text-anchor="start">its licence is assigned to the account.</text></g><g data-region="membership-leave" data-bounds="504 470 472 70"><text x="512" y="496" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#f5b13d" text-anchor="start">Leave the group:</text><text x="512" y="521" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#f5b13d" text-anchor="start">this assignment is removed.</text></g><line x1="32" y1="564" x2="968" y2="564" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"></line><g data-region="activation-scope" data-bounds="24 576 952 61"><text x="32" y="600" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#8b909b" text-anchor="start">Teaching example: assigning access rights. Software installation is a separate step.</text><text x="32" y="625" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#8b909b" text-anchor="start">Other groups or direct assignments can retain the same licence.</text></g><g data-region="activation-source" data-bounds="24 644 952 40"><text x="32" y="668" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#8b909b" text-anchor="start">Sources: Microsoft Learn, group-based licensing, accessed 8 October 2026.</text></g></svg>