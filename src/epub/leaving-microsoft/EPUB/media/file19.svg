<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1080" role="img" aria-labelledby="microsoft-transition-cost-spending-en-mobile-title microsoft-transition-cost-spending-en-mobile-desc"><title id="microsoft-transition-cost-spending-en-mobile-title">Reported spending on two projects</title><desc id="microsoft-transition-cost-spending-en-mobile-desc">Spending reported for LibreOffice and Open-Xchange in the Schleswig-Holstein government response of 21 September 2026, page 3. Combined 2024–2025: €2.495m and €15.5766m. In 2026, to the response date: €0.253m and €1.6747m. All four bars use the same linear scale from zero to €18m. The periods differ and 2026 is partial. Scope is limited to these two projects, without an estimate of total exit cost or return on investment.</desc><rect x="0" y="0" width="400" height="1080" rx="18" fill="#0c0d10" stroke="none" stroke-width="1"></rect><g data-region="eyebrow" data-bounds="24 16 352 34"><text x="32" y="37" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5eead4" text-anchor="start">l0g / FUNDING THE TRANSITION</text></g><g data-region="heading" data-bounds="24 55 352 85"><text x="32" y="91" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#e7e9ee" text-anchor="start">Reported spending</text><text x="32" y="125" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#e7e9ee" text-anchor="start">on two projects</text></g><g data-region="subtitle" data-bounds="24 141 352 63"><text x="32" y="164" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="start">Schleswig-Holstein · two projects</text><text x="32" y="187" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="start">Response dated 21 September 2026</text></g><g data-region="period-0" data-bounds="24 219 352 68"><text x="32" y="245" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#e7e9ee" text-anchor="start">2024–2025</text><text x="32" y="272" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#e7e9ee" text-anchor="start">Two years combined</text></g><g data-region="project-0-0" data-bounds="24 289 352 38"><text x="32" y="315" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#e7e9ee" text-anchor="start">LibreOffice</text></g><g data-bar="0-libreOffice" data-euros="2495000" data-scale="0.00001611111111111111"><rect x="40" y="332" width="40.19722222222222" height="32" rx="0" fill="#5eead4" stroke="none" stroke-width="1"></rect></g><g data-region="amount-0-0" data-bounds="87.19722222222222 325 78 48"><text x="95.19722222222222" y="351" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#5eead4" text-anchor="start">2.50</text></g><g data-region="project-0-1" data-bounds="24 396 352 38"><text x="32" y="422" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#e7e9ee" text-anchor="start">Open-Xchange</text></g><g data-bar="0-openXchange" data-euros="15576600" data-scale="0.00001611111111111111"><rect x="40" y="439" width="250.95633333333333" height="32" rx="0" fill="#f5b13d" stroke="none" stroke-width="1"></rect></g><g data-region="amount-0-1" data-bounds="297.9563333333333 432 78 48"><text x="305.9563333333333" y="458" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#f5b13d" text-anchor="start">15.58</text></g><g data-region="period-1" data-bounds="24 522 352 68"><text x="32" y="548" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#e7e9ee" text-anchor="start">2026 · spending to date</text><text x="32" y="575" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#e7e9ee" text-anchor="start">Partial year at the response date</text></g><g data-region="project-1-0" data-bounds="24 592 352 38"