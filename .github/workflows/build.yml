name: build

# Le build et toute la toolchain npm vivent ici, sur un runner éphémère
# détruit après chaque exécution. zen ne build jamais et ne détient aucun
# secret de déploiement.

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - LICENSE
      - CITATION.cff
      - SECURITY.md
      - MEMOIRE-LOCALE.md
      - docs/**
      - .github/MCP_RELEASE_NOTES.md
      - .github/workflows/codeql.yml
      - .github/workflows/publish-mcp.yml
      - .github/workflows/risk-producers.yml
      - renovate.json
  pull_request:
    branches: [main]
    paths-ignore:
      - README.md
      - LICENSE
      - CITATION.cff
      - SECURITY.md
      - MEMOIRE-LOCALE.md
      - docs/**
      - .github/MCP_RELEASE_NOTES.md
      - .github/workflows/codeql.yml
      - .github/workflows/publish-mcp.yml
      - .github/workflows/risk-producers.yml
      - renovate.json
  workflow_dispatch:

permissions: {}

concurrency:
  group: build-${{ github.ref }}
  # Les validations PR obsolètes peuvent être coupées. Une publication main forme
  # une transaction built + archive et ne doit jamais être interrompue entre les pushes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  svg-source:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate complete SVG source suite
        run: |
          node --test scripts/svg-test-suites.test.mjs
          npm run test:inline-svg:source

  validate-pr-build:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout append-only Black Box archive
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: black-box-archive
          path: .black-box-archive
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp-server/package-lock.json

      - name: Restore content-addressed OG cache
        id: og_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/l0g-og
          key: ${{ runner.os }}-${{ runner.arch }}-og-v1-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-og-v1-${{ hashFiles('package-lock.json') }}-

      - name: Install (lockfile strict)
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix mcp-server --omit=dev --no-audit --no-fund

      - name: Validate pull request
        env:
          L0G_BLACK_BOX_ARCHIVE_DIR: ${{ github.workspace }}/.black-box-archive
          L0G_OG_CACHE_DIR: ${{ github.workspace }}/.cache/l0g-og
        run: |
          node scripts/black-box-archive.mjs validate --archive .black-box-archive
          npm run test:dependencies
          npm run test:ci-policy
          npm run test:editorial-protocol
          npm run test:deploy
          npm run check
          npm run build:ci

  validate-pr:
    # Preserve the existing required check name, with all parallel tests included.
    needs: [validate-pr-build, svg-source]
    if: always() && github.event_name == 'pull_request'
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require both complete PR suites
        env:
          BUILD_RESULT: ${{ needs.validate-pr-build.result }}
          SVG_RESULT: ${{ needs.svg-source.result }}
        run: test "$BUILD_RESULT" = success && test "$SVG_RESULT" = success

  build:
    outputs:
      artifact-id: ${{ steps.release_artifact.outputs.artifact-id }}
      build-attempt: ${{ steps.release_coordinates.outputs.build-attempt }}
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions officielles uniquement, épinglées sur un SHA immuable.
      # Renovate conserve le SHA et le commentaire de version à jour.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp-server/package-lock.json

      - name: Require the current main commit
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$GITHUB_SHA" = "$(git rev-parse refs/remotes/origin/main)"

      - name: Fix deterministic build timestamp
        id: release_coordinates
        run: |
          echo "build-attempt=${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "L0G_BUILD_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "L0G_SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Checkout append-only Black Box archive
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: black-box-archive
          path: .black-box-archive
          fetch-depth: 1
          persist-credentials: false

      - name: Restore content-addressed OG cache
        id: og_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/l0g-og
          key: ${{ runner.os }}-${{ runner.arch }}-og-v1-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-og-v1-${{ hashFiles('package-lock.json') }}-

      - name: Install (lockfile strict)
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix mcp-server --omit=dev --no-audit --no-fund

      - name: Test release and deployment contracts
        run: |
          npm run test:dependencies
          npm run test:ci-policy
          npm run test:editorial-protocol
          npm run test:deploy

      - name: Build once from the new immutable Black Box frame
        env:
          L0G_BLACK_BOX_ARCHIVE_DIR: ${{ github.workspace }}/.black-box-archive
          L0G_APPEND_BLACK_BOX_FRAME: '1'
          L0G_OG_CACHE_DIR: ${{ github.workspace }}/.cache/l0g-og
          BLACK_BOX_COMPUTED_AT: ${{ env.L0G_BUILD_TIMESTAMP }}
          BLACK_BOX_ATTESTATION_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: npm run build:ci

      - name: Test MCP server against built Agent Surface
        env:
          L0G_DATA_DIR: ${{ github.workspace }}/dist
          MCP_ALLOWED_HOSTS: 127.0.0.1,localhost
          MCP_ALLOWED_ORIGINS: http://127.0.0.1:8851
          MCP_GIT_SHA: ${{ github.sha }}
          MCP_HOST: 127.0.0.1
          MCP_PORT: 8851
          MCP_RATE_MAX: 1000
          MCP_USAGE_PATH: ${{ runner.temp }}/l0g-mcp-usage.json
          URL: http://127.0.0.1:8851/mcp
        run: |
          cd mcp-server
          node server.mjs &
          MCP_PID=$!
          trap 'kill "$MCP_PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8851/healthz >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8851/healthz
          node test-client.mjs
          node test-compact-client.mjs
          node agent-bench.mjs --url "$URL" --output ../dist/api/v1/agent-bench.json

      - name: Package deterministic static release
        env:
          SOURCE_DATE_EPOCH: ${{ env.L0G_SOURCE_DATE_EPOCH }}
        run: |
          mkdir -p release
          {
            echo 'L0G_RELEASE_SCHEMA=1'
            echo "L0G_RELEASE_REPOSITORY=${GITHUB_REPOSITORY}"
            echo "L0G_RELEASE_SOURCE_REF=${GITHUB_REF}"
            echo "L0G_RELEASE_SOURCE_SHA=${GITHUB_SHA}"
            echo "L0G_RELEASE_RUN_ID=${GITHUB_RUN_ID}"
            echo "L0G_RELEASE_RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT}"
          } > release/source.env
          install -m 0644 release/source.env dist/source.env
          tar --sort=name --mtime="@${SOURCE_DATE_EPOCH}" --owner=0 --group=0 --numeric-owner \
            --pax-option=delete=atime,delete=ctime -C dist -cf - . \
            | gzip -n -9 > release/l0g-site.tar.gz
          (cd release && sha256sum l0g-site.tar.gz > l0g-site.tar.gz.sha256)

      - name: Stage checked release and single new archive frame
        run: node scripts/stage-ci-release.mjs stage --archive .black-box-archive --release release --dist dist --output ci-release

      - name: Transfer release to gated publisher
        id: release_artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checked-static-release-${{ github.run_attempt }}
          path: ci-release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Save validated OG cache on main only
        if: github.ref == 'refs/heads/main' && steps.og_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/l0g-og
          key: ${{ steps.og_cache.outputs.cache-primary-key }}

  publish:
    # No attestation or write token is issued until both complete suites pass.
    needs: [build, svg-source]
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: black-box-archive
          path: .black-box-archive
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Require the current main commit before publication
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$GITHUB_SHA" = "$(git rev-parse refs/remotes/origin/main)"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: ci-release
          merge-multiple: true

      - name: Verify exact source, archive base and release checksum
        env:
          L0G_CI_BUILD_ATTEMPT: ${{ needs.build.outputs.build-attempt }}
        run: node scripts/stage-ci-release.mjs restore --input ci-release --archive .black-box-archive --release release --dist dist

      - name: Attest the complete static release and Agent Surface manifests
        id: attest_static
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            release/l0g-site.tar.gz
            dist/agents.json
            dist/openapi.json
            dist/api/v1/integrity.json
            dist/api/v1/black-box.json
            dist/api/v1/agent-bench.json

      - name: Stage the offline attestation bundle
        run: cp "${{ steps.attest_static.outputs.bundle-path }}" release/l0g-site.tar.gz.sigstore.jsonl

      - name: Publish to `built` branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `built` est uniquement un transport de release. Le serveur n'active
          # jamais un arbre statique Git non attesté, seulement l'archive vérifiée.
          bash deploy/prepare-static-transport.sh release publish
          cd publish
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "build ${GITHUB_SHA}"
          git branch -M built
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" built

      - name: Publish append-only Black Box archive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git -C .black-box-archive config user.name "github-actions[bot]"
          git -C .black-box-archive config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .black-box-archive add frames
          git -C .black-box-archive commit -q -m "frame ${GITHUB_SHA::8}"
          git -C .black-box-archive push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:black-box-archive
