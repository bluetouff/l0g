name: risk producers

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches:
      - main
    paths:
      - .github/workflows/risk-producers.yml
      - scripts/check-risk-producers.mjs
      - scripts/risk-producer-audit.mjs
      - scripts/risk-producer-audit.test.mjs
      - scripts/risk-deployment.test.mjs
      - ops/risk-aggregator/**
      - deploy/l0g.fr.apache.conf

permissions:
  contents: read

concurrency:
  group: risk-producers
  cancel-in-progress: true

jobs:
  end-to-end:
    if: github.repository == 'bluetouff/l0g'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.23.4'
      - name: Test the monitoring contract
        run: node --test scripts/risk-producer-audit.test.mjs scripts/risk-deployment.test.mjs
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Test server revision and rollback contracts
        run: python -m unittest discover -s ops/risk-aggregator -p 'test*.py'
      - name: Probe deployed producers, aggregator and both histories
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: node scripts/check-risk-producers.mjs
