<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="ge-healthcare-network-scale-fr-desktop-title ge-healthcare-network-scale-fr-desktop-desc" style="width:100%;height:auto">
<title id="ge-healthcare-network-scale-fr-desktop-title">Le réseau grandit avant même l’approbation commerciale</title><desc id="ge-healthcare-network-scale-fr-desktop-desc">L’extension industrielle et clinique ne recouvre pas les mêmes périmètres.</desc><defs><marker id="ge-healthcare-network-scale-fr-desktop-arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="var(--color-paper, #e7e9ee)"/></marker></defs>
<rect x="0" y="0" width="1200" height="800" rx="24" fill="var(--color-ink, #0c0d10)"/>
<text x="40" y="55" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="28px" font-weight="800">Le réseau grandit avant même l’approbation commerciale</text>
<text x="40" y="82" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-muted, #8b909b)" font-size="14px">FAPI-74 : capacité de fabrication connue, essais Phase III en cours, produit encore expérimental aux États-Unis.</text>
<rect x="70" y="185" width="245" height="330" rx="18" fill="color-mix(in srgb, var(--color-signal, #5eead4) 10%, var(--color-surface-2, #171a20))" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1.5"/>
<text x="95" y="225" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="16px" font-weight="750">Jan. 2025</text>
<text x="95" y="325" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="32px" font-weight="800">5</text>
<text x="95" y="375" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="16px" font-weight="750">sites FAPI-74</text>
<rect x="350" y="185" width="245" height="330" rx="18" fill="color-mix(in srgb, var(--color-signal, #5eead4) 24%, var(--color-surface-2, #171a20))" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1.5"/>
<text x="375" y="225" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="16px" font-weight="750">Jan. 2026</text>
<text x="375" y="325" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="32px" font-weight="800">7</text>
<text x="375" y="375" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="16px" font-weight="750">sites FAPI-74</text>
<rect x="630" y="185" width="245" height="330" rx="18" fill="color-mix(in srgb, var(--color-amber, #f5b13d) 10%, var(--color-surface-2, #171a20))" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1.5"/>
<text x="655" y="225" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="16px" font-weight="750">Août 2026</text>
<text x="655" y="325" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="32px" font-weight="800">15</text>
<text x="655" y="375" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="16px" font-weight="750">sites Phase III activés</text>
<rect x="910" y="185" width="245" height="330" rx="18" fill="color-mix(in srgb, var(--color-amber, #f5b13d) 18%, var(--color-surface-2, #171a20))" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1.5"/>
<text x="935" y="225" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="16px" font-weight="750">Oct. 2026</text>
<text x="935" y="325" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="32px" font-weight="800">15 / 21</text>
<text x="935" y="375" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="16px" font-weight="750">sites CMO / cyclotrons</text>
<line x1="190" y1="560" x2="1010" y2="560" stroke="var(--color-signal, #5eead4)" stroke-width="6"/>
<circle cx="190" cy="560" r="10" fill="var(--color-signal, #5eead4)"/>
<circle cx="470" cy="560" r="10" fill="var(--color-signal, #5eead4)"/>
<circle cx="750" cy="560" r="10" fill="var(--color-signal, #5eead4)"/>
<circle cx="1030" cy="560" r="10" fill="var(--color-signal, #5eead4)"/>
<rect x="125" y="625" width="950" height="85" rx="18" fill="color-mix(in srgb, var(--color-amber, #f5b13d) 10%, var(--color-surface-2, #171a20))" stroke="var(--color-amber, #f5b13d)" stroke-width="1.5"/>
<text x="160" y="665" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="13px">Attention : les 15 sites CMO annoncés en octobre ne correspondent pas à 15 sites FAPI-74.</text>
<text x="40" y="775" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-muted, #8b909b)" font-size="11px">Sources : SOFIE 15 Jan 2025, 27 Jan 2026, 21 Aug 2026 ; GE HealthCare 5 Oct 2026.</text>
</svg>
