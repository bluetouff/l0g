<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="ge-healthcare-pdx-context-en-desktop-title ge-healthcare-pdx-context-en-desktop-desc" style="width:100%;height:auto">
<title id="ge-healthcare-pdx-context-en-desktop-title">The deal lands inside GE HealthCare’s growth engine</title><desc id="ge-healthcare-pdx-context-en-desktop-desc">PDx: the buyer’s financial context ahead of closing.</desc><defs><marker id="ge-healthcare-pdx-context-en-desktop-arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="var(--color-paper, #e7e9ee)"/></marker></defs>
<rect x="0" y="0" width="1200" height="800" rx="24" fill="var(--color-ink, #0c0d10)"/>
<text x="40" y="55" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="28px" font-weight="800">The deal lands inside GE HealthCare’s growth engine</text>
<text x="40" y="82" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-muted, #8b909b)" font-size="14px">PDx: strong revenue, high margin, accelerating U.S. radiopharmaceutical momentum.</text>
<rect x="70" y="170" width="245" height="285" rx="18" fill="color-mix(in srgb, var(--color-signal, #5eead4) 10%, var(--color-surface-2, #171a20))" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1.5"/>
<text x="95" y="210" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="16px" font-weight="750">2025 PDx</text>
<text x="95" y="300" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="32px" font-weight="800">$2.9B</text>
<text x="95" y="350" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="13px">revenue</text>
<rect x="350" y="170" width="245" height="285" rx="18" fill="color-mix(in srgb, var(--color-amber, #f5b13d) 10%, var(--color-surface-2, #171a20))" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1.5"/>
<text x="375" y="210" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="16px" font-weight="750">T2 2026</text>
<text x="375" y="300" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="32px" font-weight="800">$843M</text>
<text x="375" y="350" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="13px">quarterly revenue</text>
<rect x="630" y="170" width="245" height="285" rx="18" fill="color-mix(in srgb, var(--color-amber, #f5b13d) 18%, var(--color-surface-2, #171a20))" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1.5"/>
<text x="655" y="210" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="16px" font-weight="750">T2 2026</text>
<text x="655" y="300" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="32px" font-weight="800">+15.6%</text>
<text x="655" y="350" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="13px">reported YoY growth</text>
<rect x="910" y="170" width="245" height="285" rx="18" fill="color-mix(in srgb, var(--color-accent, #ff4d87) 12%, var(--color-surface-2, #171a20))" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1.5"/>
<text x="935" y="210" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="16px" font-weight="750">T2 2026</text>
<text x="935" y="300" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="32px" font-weight="800">29.6%</text>
<text x="935" y="350" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="13px">segment EBIT margin</text>
<rect x="90" y="520" width="1020" height="145" rx="18" fill="var(--color-signal, #5eead4)" stroke="var(--color-signal, #5eead4)" stroke-width="1.5"/>
<text x="130" y="570" font-family="Inter,Arial" fill="var(--color-ink, #0c0d10)" font-size="14px" font-weight="650">GE HealthCare expects SOFIE to grow in the low double digits and says the deal should be accretive to revenue</text>
<text x="130" y="593" font-family="Inter,Arial" fill="var(--color-ink, #0c0d10)" font-size="14px" font-weight="650">growth, adjusted EBIT margin and adjusted EPS in the first full year.</text>
<text x="40" y="775" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-muted, #8b909b)" font-size="11px">Sources: GE HealthCare FY2025, Q2 2026 and acquisition release. SOFIE outlook statements are GE</text>
<text x="40" y="790" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-muted, #8b909b)" font-size="11px">estimates.</text>
</svg>
