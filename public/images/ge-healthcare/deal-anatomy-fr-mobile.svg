<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1100" viewBox="0 0 760 1100" role="img" aria-labelledby="ge-healthcare-deal-anatomy-fr-mobile-title ge-healthcare-deal-anatomy-fr-mobile-desc" style="width:100%;height:auto">
<title id="ge-healthcare-deal-anatomy-fr-mobile-title">Ce que GE HealthCare achète pour 945 M$</title><desc id="ge-healthcare-deal-anatomy-fr-mobile-desc">Le prix annoncé par GE agrège plusieurs actifs dont la ventilation n’a pas été communiquée.</desc><defs><marker id="ge-healthcare-deal-anatomy-fr-mobile-arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="var(--color-paper, #e7e9ee)"/></marker></defs>
<rect x="0" y="0" width="760" height="1100" rx="24" fill="var(--color-ink, #0c0d10)"/>
<text x="40" y="55" font-family="Inter,Arial" fill="var(--color-paper, #e7e9ee)" font-size="26px" font-weight="800">Ce que GE HealthCare achète pour 945 M$</text>
<text x="40" y="92" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-muted, #8b909b)" font-size="14px">GE a annoncé le prix, sans communiquer la ventilation</text>
<text x="40" y="110" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-muted, #8b909b)" font-size="14px">ni les comptes récents de SOFIE.</text>
<rect x="60" y="140" width="640" height="155" rx="18" fill="var(--color-signal, #5eead4)" stroke="var(--color-signal, #5eead4)" stroke-width="1.5"/>
<text x="380" y="210" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-ink, #0c0d10)" font-size="32px" font-weight="800">$945M</text>
<text x="380" y="250" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-ink, #0c0d10)" font-size="16px" font-weight="750">en numéraire</text>
<rect x="60" y="330" width="640" height="130" rx="18" fill="color-mix(in srgb, var(--color-signal, #5eead4) 10%, var(--color-surface-2, #171a20))" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1.5"/>
<text x="90" y="366" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="16px" font-weight="750">Réseau industriel</text>
<text x="90" y="400" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="13px">15 sites CMO</text>
<text x="90" y="420" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="13px">21 cyclotrons</text>
<rect x="60" y="480" width="640" height="130" rx="18" fill="color-mix(in srgb, var(--color-amber, #f5b13d) 10%, var(--color-surface-2, #171a20))" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1.5"/>
<text x="90" y="516" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="16px" font-weight="750">Propriété intellectuelle</text>
<text x="90" y="550" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="13px">droits US sur FAPI-74</text>
<text x="90" y="570" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="13px">Phase III</text>
<rect x="60" y="630" width="640" height="130" rx="18" fill="color-mix(in srgb, var(--color-amber, #f5b13d) 18%, var(--color-surface-2, #171a20))" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1.5"/>
<text x="90" y="666" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="16px" font-weight="750">Plateforme CDMO</text>
<text x="90" y="700" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="13px">développement + fabrication</text>
<text x="90" y="720" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="13px">théranostique</text>
<rect x="60" y="780" width="640" height="130" rx="18" fill="color-mix(in srgb, var(--color-accent, #ff4d87) 12%, var(--color-surface-2, #171a20))" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1.5"/>
<text x="90" y="816" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="16px" font-weight="750">Relations clients</text>
<text x="90" y="850" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="13px">SOFIE doit continuer</text>
<text x="90" y="870" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="13px">à servir d’autres fournisseurs</text>
<rect x="60" y="945" width="640" height="90" rx="18" fill="color-mix(in srgb, var(--color-amber, #f5b13d) 10%, var(--color-surface-2, #171a20))" stroke="var(--color-amber, #f5b13d)" stroke-width="1.5"/>
<text x="90" y="980" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="13px">GE n’a pas communiqué : revenus 2026, EBITDA, dette nette</text>
<text x="90" y="998" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="13px">de SOFIE et ventilation du prix.</text>
</svg>
