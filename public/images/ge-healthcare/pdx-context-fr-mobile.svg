<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1060" viewBox="0 0 760 1060" role="img" aria-labelledby="ge-healthcare-pdx-context-fr-mobile-title ge-healthcare-pdx-context-fr-mobile-desc" style="width:100%;height:auto">
<title id="ge-healthcare-pdx-context-fr-mobile-title">Le deal tombe dans le moteur de croissance de GE HealthCare</title><desc id="ge-healthcare-pdx-context-fr-mobile-desc">PDx : contexte financier de l’acquéreur avant la clôture.</desc><defs><marker id="ge-healthcare-pdx-context-fr-mobile-arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="var(--color-paper, #e7e9ee)"/></marker></defs>
<rect x="0" y="0" width="760" height="1060" rx="24" fill="var(--color-ink, #0c0d10)"/>
<text x="40" y="55" font-family="Inter,Arial" fill="var(--color-paper, #e7e9ee)" font-size="26px" font-weight="800">Le deal tombe dans le moteur de croissance</text>
<text x="40" y="87" font-family="Inter,Arial" fill="var(--color-paper, #e7e9ee)" font-size="26px" font-weight="800">de GE HealthCare</text>
<text x="40" y="106" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-muted, #8b909b)" font-size="14px">PDx : revenus solides, marge élevée, accélération des</text>
<text x="40" y="124" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-muted, #8b909b)" font-size="14px">radiopharmaceutiques US.</text>
<rect x="60" y="140" width="640" height="150" rx="18" fill="color-mix(in srgb, var(--color-signal, #5eead4) 10%, var(--color-surface-2, #171a20))" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1.5"/>
<text x="90" y="175" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="16px" font-weight="750">2025 PDx</text>
<text x="90" y="232" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="32px" font-weight="800">$2.9B</text>
<text x="360" y="230" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="13px">revenus</text>
<rect x="60" y="315" width="640" height="150" rx="18" fill="color-mix(in srgb, var(--color-amber, #f5b13d) 10%, var(--color-surface-2, #171a20))" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1.5"/>
<text x="90" y="350" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="16px" font-weight="750">T2 2026</text>
<text x="90" y="407" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="32px" font-weight="800">$843M</text>
<text x="360" y="405" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="13px">revenus trimestriels</text>
<rect x="60" y="490" width="640" height="150" rx="18" fill="color-mix(in srgb, var(--color-amber, #f5b13d) 18%, var(--color-surface-2, #171a20))" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1.5"/>
<text x="90" y="525" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="16px" font-weight="750">T2 2026</text>
<text x="90" y="582" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="32px" font-weight="800">+15.6%</text>
<text x="360" y="580" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="13px">croissance YoY publiée</text>
<rect x="60" y="665" width="640" height="150" rx="18" fill="color-mix(in srgb, var(--color-accent, #ff4d87) 12%, var(--color-surface-2, #171a20))" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1.5"/>
<text x="90" y="700" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="16px" font-weight="750">T2 2026</text>
<text x="90" y="757" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="32px" font-weight="800">29.6%</text>
<text x="360" y="755" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="13px">marge EBIT segment</text>
<rect x="60" y="860" width="640" height="115" rx="18" fill="var(--color-signal, #5eead4)" stroke="var(--color-signal, #5eead4)" stroke-width="1.5"/>
<text x="90" y="905" font-family="Inter,Arial" fill="var(--color-ink, #0c0d10)" font-size="13px" font-weight="650">GE estime SOFIE en croissance “low double digits” et</text>
<text x="90" y="924" font-family="Inter,Arial" fill="var(--color-ink, #0c0d10)" font-size="13px" font-weight="650">l’opération relutive au premier exercice complet.</text>
<text x="40" y="1015" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-muted, #8b909b)" font-size="11px">Sources : GE HealthCare FY2025, T2 2026 et communiqué</text>
<text x="40" y="1030" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-muted, #8b909b)" font-size="11px">d’acquisition. Les objectifs relatifs à SOFIE sont des</text>
<text x="40" y="1045" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-muted, #8b909b)" font-size="11px">estimations de GE.</text>
</svg>
