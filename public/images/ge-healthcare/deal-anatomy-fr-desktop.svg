<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="ge-healthcare-deal-anatomy-fr-desktop-title ge-healthcare-deal-anatomy-fr-desktop-desc" style="width:100%;height:auto">
<title id="ge-healthcare-deal-anatomy-fr-desktop-title">Ce que GE HealthCare achète pour 945 M$</title><desc id="ge-healthcare-deal-anatomy-fr-desktop-desc">Le prix annoncé par GE agrège plusieurs actifs dont la ventilation n’a pas été communiquée.</desc><defs><marker id="ge-healthcare-deal-anatomy-fr-desktop-arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="var(--color-paper, #e7e9ee)"/></marker></defs>
<rect x="0" y="0" width="1200" height="800" rx="24" fill="var(--color-ink, #0c0d10)"/>
<text x="40" y="55" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="28px" font-weight="800">Ce que GE HealthCare achète pour 945 M$</text>
<text x="40" y="82" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-muted, #8b909b)" font-size="14px">GE a annoncé le prix, sans publier la ventilation ni les comptes récents de SOFIE.</text>
<rect x="60" y="160" width="260" height="520" rx="18" fill="var(--color-signal, #5eead4)" stroke="var(--color-signal, #5eead4)" stroke-width="1.5"/>
<text x="190" y="300" text-anchor="middle" font-family="Inter,Arial" fill="var(--color-ink, #0c0d10)" font-size="58px" font-weight="800">$945M</text>
<text x="190" y="345" text-anchor="middle" font-family="Inter,Arial" fill="var(--color-ink, #0c0d10)" font-size="16px" font-weight="700">numéraire</text>
<rect x="360" y="150" width="350" height="210" rx="18" fill="color-mix(in srgb, var(--color-signal, #5eead4) 10%, var(--color-surface-2, #171a20))" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1.5"/>
<text x="385" y="192" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="16px" font-weight="750">Réseau industriel</text>
<text x="385" y="232" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="13px">15 sites CMO</text>
<text x="385" y="254" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="13px">21 cyclotrons</text>
<rect x="360" y="400" width="350" height="210" rx="18" fill="color-mix(in srgb, var(--color-amber, #f5b13d) 10%, var(--color-surface-2, #171a20))" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1.5"/>
<text x="385" y="442" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="16px" font-weight="750">Propriété intellectuelle</text>
<text x="385" y="482" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="13px">droits US sur FAPI-74</text>
<text x="385" y="504" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="13px">Phase III</text>
<rect x="750" y="150" width="350" height="210" rx="18" fill="color-mix(in srgb, var(--color-amber, #f5b13d) 18%, var(--color-surface-2, #171a20))" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1.5"/>
<text x="775" y="192" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="16px" font-weight="750">Plateforme CDMO</text>
<text x="775" y="232" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="13px">développement + fabrication</text>
<text x="775" y="254" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="13px">théranostique</text>
<rect x="750" y="400" width="350" height="210" rx="18" fill="color-mix(in srgb, var(--color-accent, #ff4d87) 12%, var(--color-surface-2, #171a20))" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1.5"/>
<text x="775" y="442" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="16px" font-weight="750">Relations clients</text>
<text x="775" y="482" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="13px">SOFIE doit continuer</text>
<text x="775" y="504" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="13px">à servir d’autres fournisseurs</text>
<rect x="360" y="660" width="740" height="75" rx="18" fill="color-mix(in srgb, var(--color-amber, #f5b13d) 10%, var(--color-surface-2, #171a20))" stroke="var(--color-amber, #f5b13d)" stroke-width="1.5"/>
<text x="390" y="695" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="13px">Le multiple ne peut être établi ici : les comptes récents</text>
<text x="390" y="713" font-family="Inter,Arial,Helvetica,sans-serif" fill="var(--color-paper, #e7e9ee)" font-size="13px">de SOFIE ne sont pas communiqués par GE.</text>
</svg>
