<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 1045" width="440" height="1045" role="img" aria-labelledby="gpu-credit-gpu-f4-en-m-title gpu-credit-gpu-f4-en-m-desc" style="width:100%;height:auto">
<title id="gpu-credit-gpu-f4-en-m-title">Revenue falls faster than the debt bill</title>
<desc id="gpu-credit-gpu-f4-en-m-desc">Annual receipts before and after renewal, showing the funding shortfall.</desc>
<rect width="440" height="1045" fill="var(--color-ink, #0c0d10)"/>
<text x="24.000" y="35.000" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start" letter-spacing="1.1">l0g / ILLUSTRATION / USD m</text>
<text x="416.000" y="35.000" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="end">04</text>
<text x="24.000" y="75.000" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Revenue falls faster than the</text>
<text x="24.000" y="106.320" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">debt bill</text>
<text x="24.000" y="133.320" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Price −25% and billed hours −20%: revenue −40%,</text>
<text x="24.000" y="155.760" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">cash costs held at $18m.</text>
<text x="24.000" y="195.760" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Initial contract</text>
<text x="24.000" y="231.760" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Revenue: $50m</text>
<rect x="24.000" y="251.760" width="141.120" height="58.000" rx="0" fill="var(--color-topic-blue, #7aa2f7)"/>
<rect x="165.120" y="251.760" width="144.772" height="58.000" rx="0" fill="var(--color-down, #ff4d87)"/>
<rect x="309.892" y="251.760" width="106.108" height="58.000" rx="0" fill="var(--color-signal, #5eead4)"/>
<text x="94.560" y="288.760" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="var(--color-ink, #0c0d10)" text-anchor="middle">18</text>
<text x="237.506" y="288.760" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="var(--color-ink, #0c0d10)" text-anchor="middle">18.47</text>
<text x="362.946" y="288.760" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="var(--color-ink, #0c0d10)" text-anchor="middle">13.53</text>
<text x="24.000" y="341.760" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Cash before debt: $32m | DSCR 1.73×</text>
<text x="24.000" y="372.760" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="var(--color-signal, #5eead4)" text-anchor="start">$13.53m residual cash after the payment.</text>
<text x="24.000" y="510.760" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">After renewal</text>
<text x="24.000" y="546.760" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Revenue: $30m</text>
<rect x="24.000" y="566.760" width="141.120" height="58.000" rx="0" fill="var(--color-topic-blue, #7aa2f7)"/>
<rect x="165.120" y="566.760" width="94.080" height="58.000" rx="0" fill="var(--color-down, #ff4d87)"/>
<rect x="259.200" y="566.760" width="50.692" height="58.000" rx="0" fill="var(--color-ink, #0c0d10)" stroke="var(--color-down, #ff4d87)" stroke-width="2" stroke-dasharray="6 4"/>
<text x="94.560" y="603.760" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="var(--color-ink, #0c0d10)" text-anchor="middle">18</text>
<text x="212.160" y="603.760" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="var(--color-ink, #0c0d10)" text-anchor="middle">12.00</text>
<text x="284.546" y="603.760" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="var(--color-down, #ff4d87)" text-anchor="middle">6.47</text>
<text x="24.000" y="656.760" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Cash before debt: $12m | DSCR 0.65×</text>
<text x="24.000" y="687.760" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="var(--color-down, #ff4d87)" text-anchor="start">Additional funding required: $6.47m a year.</text>
<rect x="24.000" y="807.760" width="14.000" height="14.000" rx="0" fill="var(--color-topic-blue, #7aa2f7)"/>
<text x="48.000" y="820.760" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Cash costs</text>
<rect x="24.000" y="838.760" width="14.000" height="14.000" rx="0" fill="var(--color-down, #ff4d87)"/>
<text x="48.000" y="851.760" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Debt paid</text>
<rect x="24.000" y="869.760" width="14.000" height="14.000" rx="0" fill="var(--color-signal, #5eead4)"/>
<text x="48.000" y="882.760" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Residual cash</text>
<line x1="24.000" y1="924.760" x2="416.000" y2="924.760" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1"/>
<text x="24.000" y="951.760" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">l0g calculations : model M1 / M2.</text>
<text x="24.000" y="976.760" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Scheduled debt service: $18.47m/year. Dashed section is a</text>
<text x="24.000" y="994.960" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">cash need. This scenario does not directly apply to receipts</text>
<text x="24.000" y="1013.160" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">protected by take-or-pay.</text>
</svg>