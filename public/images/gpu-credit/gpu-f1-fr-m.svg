<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 1023" width="440" height="1023" role="img" aria-labelledby="gpu-credit-gpu-f1-fr-m-title gpu-credit-gpu-f1-fr-m-desc" style="width:100%;height:auto">
<title id="gpu-credit-gpu-f1-fr-m-title">Quatre horloges autour d’un GPU</title>
<desc id="gpu-credit-gpu-f1-fr-m-desc">Durées de natures différentes, séparées par fonction.</desc>
<rect width="440" height="1023" fill="var(--color-ink, #0c0d10)"/>
<text x="24.000" y="35.000" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start" letter-spacing="1.1">l0g / REPÈRES DOCUMENTÉS</text>
<text x="416.000" y="35.000" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="end">01</text>
<text x="24.000" y="75.000" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Quatre horloges autour d’un</text>
<text x="24.000" y="106.320" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">GPU</text>
<text x="24.000" y="133.320" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Des repères différents : durée technique, comptes,</text>
<text x="24.000" y="155.760" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">clients et remboursement.</text>
<text x="24.000" y="195.760" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">CLIENTS</text>
<text x="24.000" y="235.760" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">≈ 3 ans</text>
<text x="24.000" y="265.760" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Durée moyenne des contrats de la DDTL 5.5.</text>
<rect x="24.000" y="282.760" width="392.000" height="12.000" rx="0" fill="color-mix(in srgb, var(--color-signal, #5eead4) 8%, var(--color-surface-2, #171a20))"/>
<rect x="24.000" y="282.760" width="117.600" height="12.000" rx="0" fill="var(--color-signal, #5eead4)"/>
<text x="24.000" y="334.760" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">DETTE</text>
<text x="24.000" y="374.760" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="var(--color-down, #ff4d87)" text-anchor="start">≈ 5 ans</text>
<text x="24.000" y="404.760" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Échéance finale : 1er septembre 2031.</text>
<rect x="24.000" y="421.760" width="392.000" height="12.000" rx="0" fill="color-mix(in srgb, var(--color-signal, #5eead4) 8%, var(--color-surface-2, #171a20))"/>
<rect x="24.000" y="421.760" width="196.000" height="12.000" rx="0" fill="var(--color-down, #ff4d87)"/>
<text x="24.000" y="473.760" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">COMPTABILITÉ</text>
<text x="24.000" y="513.760" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="start">6 ans</text>
<text x="24.000" y="543.760" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Durée estimée des équipements technologiques</text>
<text x="24.000" y="565.860" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">dans les comptes 2025 de CoreWeave.</text>
<rect x="24.000" y="582.860" width="392.000" height="12.000" rx="0" fill="color-mix(in srgb, var(--color-signal, #5eead4) 8%, var(--color-surface-2, #171a20))"/>
<rect x="24.000" y="582.860" width="235.200" height="12.000" rx="0" fill="var(--color-topic-blue, #7aa2f7)"/>
<text x="24.000" y="634.860" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">THÈSE INDUSTRIELLE</text>
<text x="24.000" y="674.860" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">Vers 10 ans</text>
<text x="24.000" y="704.860" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Horizon évoqué par Nvidia pour l’A100 ; une</text>
<text x="24.000" y="726.960" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">affirmation du fournisseur.</text>
<rect x="24.000" y="743.960" width="392.000" height="12.000" rx="0" fill="color-mix(in srgb, var(--color-signal, #5eead4) 8%, var(--color-surface-2, #171a20))"/>
<rect x="24.000" y="743.960" width="392.000" height="12.000" rx="0" fill="var(--color-ink, #0c0d10)" stroke="var(--color-muted, #8b909b)" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="24.000" y="795.960" width="392.000" height="108.000" rx="4" fill="var(--color-surface-2, #171a20)"/>
<text x="42.000" y="824.960" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Le décalage à financer : les</text>
<text x="42.000" y="849.660" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">engagements clients peuvent se</text>
<text x="42.000" y="874.360" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">terminer avant la dette.</text>
<line x1="24.000" y1="920.960" x2="416.000" y2="920.960" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1"/>
<text x="24.000" y="947.960" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">Sources : S02, S05, S06, S07.</text>
<text x="24.000" y="972.960" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Durées non additives ; repères distincts, sans cohorte</text>
<text x="24.000" y="991.160" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">commune ni courbe de survie observée.</text>
</svg>