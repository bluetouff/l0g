<rect x="540.774" y="413.000" width="535.226" height="66.000" rx="0" fill="color-mix(in srgb, var(--color-down, #ff4d87) 12%, var(--color-surface-2, #171a20))"/>
<text x="292.387" y="455.000" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="var(--color-ink, #0c0d10)" text-anchor="middle">15.43</text>
<text x="808.387" y="455.000" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="var(--color-down, #ff4d87)" text-anchor="middle">16.62</text>
<text x="44.000" y="514.000" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">$15.43m remains financed; $16.62m must be repaid from another source.</text>
<text x="44.000" y="556.000" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="var(--color-signal, #5eead4)" text-anchor="start">Counterpoint: $40.60m of cash from the first three years could cover the paydown, if retained.</text>
