<text x="44.000" y="619.000" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">l0g calculations : model M3 / model.json.</text>
<text x="44.000" y="644.000" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Simplified annual model, unchanged rate. It does not implement DDTL 5.5 monthly tests, its 2.40 contract-value ratio or cure rights.</text>
