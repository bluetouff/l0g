<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 676" width="1120" height="676" role="img" aria-labelledby="gpu-credit-gpu-f6-en-d-title gpu-credit-gpu-f6-en-d-desc" style="width:100%;height:auto">
<title id="gpu-credit-gpu-f6-en-d-title">$16.62 million needed to resize the loan</title>
<desc id="gpu-credit-gpu-f6-en-d-desc">Resizing calculation at 1.35 coverage, 10% rate and two years remaining.</desc>
<rect width="1120" height="676" fill="var(--color-ink, #0c0d10)"/>
<text x="44.000" y="40.000" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start" letter-spacing="1.1">l0g / ILLUSTRATION / USD m</text>
<text x="1076.000" y="40.000" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="end">06</text>
<text x="44.000" y="89.000" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">$16.62 million needed to resize the loan</text>
<text x="44.000" y="116.000" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">End of year 3: two payments remain, against only $12m in future annual cash.</text>
<rect x="44.000" y="156.000" width="328.000" height="173.000" rx="4" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1"/>
<text x="62.000" y="190.000" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">Future annual cash</text>
<text x="62.000" y="251.000" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">$12.00m</text>
<text x="62.000" y="290.000" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">After cash costs</text>
<line x1="374.000" y1="238.000" x2="393.000" y2="238.000" stroke="var(--color-signal, #5eead4)" stroke-width="2"/>
<path d="M385.979,241.835 L393.000,238.000 L385.979,234.165" fill="none" stroke="var(--color-signal, #5eead4)" stroke-width="2" stroke-linejoin="round"/>
<rect x="396.000" y="156.000" width="328.000" height="173.000" rx="4" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1"/>
<text x="414.000" y="190.000" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">Allowable debt payment</text>
<text x="414.000" y="251.000" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">$8.89m</text>
<text x="414.000" y="290.000" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">12 ÷ 1.35</text>
<line x1="726.000" y1="238.000" x2="745.000" y2="238.000" stroke="var(--color-signal, #5eead4)" stroke-width="2"/>
<path d="M737.979,241.835 L745.000,238.000 L737.979,234.165" fill="none" stroke="var(--color-signal, #5eead4)" stroke-width="2" stroke-linejoin="round"/>
<rect x="748.000" y="156.000" width="328.000" height="173.000" rx="4" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1"/>
<text x="766.000" y="190.000" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">Supported debt</text>
<text x="766.000" y="251.000" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">$15.43m</text>
<text x="766.000" y="290.000" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Two payments discounted at 10%</text>
<text x="44.000" y="390.000" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Debt remaining: $32.05m</text>
