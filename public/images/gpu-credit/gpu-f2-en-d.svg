<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 876" width="1120" height="876" role="img" aria-labelledby="gpu-credit-gpu-f2-en-d-title gpu-credit-gpu-f2-en-d-desc" style="width:100%;height:auto">
<title id="gpu-credit-gpu-f2-en-d-title">The protection is in the contracts</title>
<desc id="gpu-credit-gpu-f2-en-d-desc">Comparison of CoreWeave DDTL 5.5 and Lambda Compute I.</desc>
<rect width="1120" height="876" fill="var(--color-ink, #0c0d10)"/>
<text x="44.000" y="40.000" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start" letter-spacing="1.1">l0g / TRANSACTIONS 2026</text>
<text x="1076.000" y="40.000" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="end">02</text>
<text x="44.000" y="89.000" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">The protection is in the contracts</text>
<text x="44.000" y="116.000" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Two observed financings with different exposure to customer renewal.</text>
<rect x="44.000" y="156.000" width="504.000" height="610.000" rx="5" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1"/>
<text x="62.000" y="187.000" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">Aug 10, 2026</text>
<text x="62.000" y="221.000" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">CoreWeave / DDTL 5.5</text>
<text x="62.000" y="276.000" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="var(--color-down, #ff4d87)" text-anchor="start">$2.6bn</text>
<rect x="62.000" y="311.000" width="150.667" height="66.000" rx="3" fill="var(--color-ink, #0c0d10)"/>
<text x="70.000" y="338.000" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Customers</text>
<line x1="213.667" y1="344.000" x2="219.667" y2="344.000" stroke="var(--color-down, #ff4d87)" stroke-width="1.5"/>
<path d="M212.646,347.835 L219.667,344.000 L212.646,340.165" fill="none" stroke="var(--color-down, #ff4d87)" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="220.667" y="311.000" width="150.667" height="66.000" rx="3" fill="var(--color-ink, #0c0d10)"/>
<text x="228.667" y="338.000" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">GPU project</text>
<line x1="372.333" y1="344.000" x2="378.333" y2="344.000" stroke="var(--color-down, #ff4d87)" stroke-width="1.5"/>
<path d="M371.313,347.835 L378.333,344.000 L371.313,340.165" fill="none" stroke="var(--color-down, #ff4d87)" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="379.333" y="311.000" width="150.667" height="66.000" rx="3" fill="var(--color-ink, #0c0d10)"/>
<text x="387.333" y="338.000" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Lenders</text>
<text x="62.000" y="418.000" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="var(--color-down, #ff4d87)" text-anchor="start">≈ 3-year contracts / ≈ 5-year debt</text>
<text x="62.000" y="449.000" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Renew the contracts or resize the debt.</text>
<line x1="62.000" y1="506.000" x2="530.000" y2="506.000" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1"/>
<text x="62.000" y="537.000" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="var(--color-down, #ff4d87)" text-anchor="start">Parent guarantee: CoreWeave</text>
<text x="62.000" y="568.000" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Payment recourse to the group, in addition to project</text>
<text x="62.000" y="591.400" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">security.</text>
<text x="62.000" y="691.000" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Term SOFR + 5.50 percentage points</text>
<text x="62.000" y="741.000" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Maturity: Sep 1, 2031</text>
<rect x="572.000" y="156.000" width="504.000" height="610.000" rx="5" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1"/>
<text x="590.000" y="187.000" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">Oct 1–2, 2026</text>
<text x="590.000" y="221.000" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Lambda / Compute I</text>
<text x="590.000" y="276.000" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">$1.008bn</text>
<rect x="590.000" y="311.000" width="150.667" height="66.000" rx="3" fill="var(--color-ink, #0c0d10)"/>
<text x="598.000" y="338.000" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">2 customers</text>
<line x1="741.667" y1="344.000" x2="747.667" y2="344.000" stroke="var(--color-signal, #5eead4)" stroke-width="1.5"/>
<path d="M740.646,347.835 L747.667,344.000 L740.646,340.165" fill="none" stroke="var(--color-signal, #5eead4)" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="748.667" y="311.000" width="150.667" height="66.000" rx="3" fill="var(--color-ink, #0c0d10)"/>
<text x="756.667" y="338.000" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">GPU project</text>
<line x1="900.333" y1="344.000" x2="906.333" y2="344.000" stroke="var(--color-signal, #5eead4)" stroke-width="1.5"/>
<path d="M899.313,347.835 L906.333,344.000 L899.313,340.165" fill="none" stroke="var(--color-signal, #5eead4)" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="907.333" y="311.000" width="150.667" height="66.000" rx="3" fill="var(--color-ink, #0c0d10)"/>
<text x="915.333" y="338.000" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Lenders</text>
<text x="590.000" y="418.000" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">Payment for reserved capacity</text>
<text x="590.000" y="449.000" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">No re-leasing exposure in DBRS’s analysis.</text>
<line x1="590.000" y1="506.000" x2="1058.000" y2="506.000" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1"/>
<text x="590.000" y="537.000" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">Take-or-pay commitments</text>
<text x="590.000" y="568.000" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Delivery, acceptance and availability still matter.</text>
<text x="590.000" y="691.000" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Fixed rate: 6.78%</text>
<text x="590.000" y="741.000" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Maturity: May 30, 2033</text>
<line x1="44.000" y1="792.000" x2="1076.000" y2="792.000" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1"/>
<text x="44.000" y="819.000" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">Sources : S06–S09, S12–S13.</text>
<text x="44.000" y="844.000" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Committed limits, not drawn balances. Contracts and recourse differ; rates do not constitute a ranking.</text>
</svg>