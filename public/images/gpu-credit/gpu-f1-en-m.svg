<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 991" width="440" height="991" role="img" aria-labelledby="gpu-credit-gpu-f1-en-m-title gpu-credit-gpu-f1-en-m-desc" style="width:100%;height:auto">
<title id="gpu-credit-gpu-f1-en-m-title">Four clocks around one GPU</title>
<desc id="gpu-credit-gpu-f1-en-m-desc">Different kinds of duration shown separately by function.</desc>
<rect width="440" height="991" fill="var(--color-ink, #0c0d10)"/>
<text x="24.000" y="35.000" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start" letter-spacing="1.1">l0g / DOCUMENTED REFERENCE POINTS</text>
<text x="416.000" y="35.000" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="end">01</text>
<text x="24.000" y="75.000" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Four clocks around one GPU</text>
<text x="24.000" y="102.000" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Different reference points: hardware, accounts,</text>
<text x="24.000" y="124.440" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">customers and repayment.</text>
<text x="24.000" y="164.440" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">CUSTOMERS</text>
<text x="24.000" y="204.440" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">≈ 3 years</text>
<text x="24.000" y="234.440" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Average customer-contract term in DDTL 5.5.</text>
<rect x="24.000" y="251.440" width="392.000" height="12.000" rx="0" fill="color-mix(in srgb, var(--color-signal, #5eead4) 8%, var(--color-surface-2, #171a20))"/>
<rect x="24.000" y="251.440" width="117.600" height="12.000" rx="0" fill="var(--color-signal, #5eead4)"/>
<text x="24.000" y="303.440" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">DEBT</text>
<text x="24.000" y="343.440" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="var(--color-down, #ff4d87)" text-anchor="start">≈ 5 years</text>
<text x="24.000" y="373.440" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Final loan maturity: September 1, 2031.</text>
<rect x="24.000" y="390.440" width="392.000" height="12.000" rx="0" fill="color-mix(in srgb, var(--color-signal, #5eead4) 8%, var(--color-surface-2, #171a20))"/>
<rect x="24.000" y="390.440" width="196.000" height="12.000" rx="0" fill="var(--color-down, #ff4d87)"/>
<text x="24.000" y="442.440" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">ACCOUNTING</text>
<text x="24.000" y="482.440" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="start">6 years</text>
<text x="24.000" y="512.440" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Estimated technology-equipment life in</text>
<text x="24.000" y="534.540" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">CoreWeave’s 2025 accounts.</text>
<rect x="24.000" y="551.540" width="392.000" height="12.000" rx="0" fill="color-mix(in srgb, var(--color-signal, #5eead4) 8%, var(--color-surface-2, #171a20))"/>
<rect x="24.000" y="551.540" width="235.200" height="12.000" rx="0" fill="var(--color-topic-blue, #7aa2f7)"/>
<text x="24.000" y="603.540" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">INDUSTRIAL THESIS</text>
<text x="24.000" y="643.540" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">Towards 10 years</text>
<text x="24.000" y="673.540" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Horizon Nvidia describes for A100; a supplier’s</text>
<text x="24.000" y="695.640" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">claim.</text>
<rect x="24.000" y="712.640" width="392.000" height="12.000" rx="0" fill="color-mix(in srgb, var(--color-signal, #5eead4) 8%, var(--color-surface-2, #171a20))"/>
<rect x="24.000" y="712.640" width="392.000" height="12.000" rx="0" fill="var(--color-ink, #0c0d10)" stroke="var(--color-muted, #8b909b)" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="24.000" y="764.640" width="392.000" height="108.000" rx="4" fill="var(--color-surface-2, #171a20)"/>
<text x="42.000" y="793.640" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">The gap to underwrite: customer</text>
<text x="42.000" y="818.340" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">commitments can end before the loan</text>
<text x="42.000" y="843.040" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">does.</text>
<line x1="24.000" y1="889.640" x2="416.000" y2="889.640" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1"/>
<text x="24.000" y="916.640" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">Sources : S02, S05, S06, S07.</text>
<text x="24.000" y="941.640" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Non-additive durations; separate reference points, not one</text>
<text x="24.000" y="959.840" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">cohort or an observed survival curve.</text>
</svg>