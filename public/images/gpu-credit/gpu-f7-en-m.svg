<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 1173" width="440" height="1173" role="img" aria-labelledby="gpu-credit-gpu-f7-en-m-title gpu-credit-gpu-f7-en-m-desc" style="width:100%;height:auto">
<title id="gpu-credit-gpu-f7-en-m-title">From sale price to cash recovered</title>
<desc id="gpu-credit-gpu-f7-en-m-desc">Gross sale35, fee3.5 and transfer2 leave29.5, a2.55 shortfall before guarantees.</desc>
<rect width="440" height="1173" fill="var(--color-ink, #0c0d10)"/>
<text x="24.000" y="35.000" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start" letter-spacing="1.1">l0g / ILLUSTRATION / USD m</text>
<text x="416.000" y="35.000" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="end">07</text>
<text x="24.000" y="75.000" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">From sale price to cash</text>
<text x="24.000" y="106.320" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">recovered</text>
<text x="24.000" y="133.320" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Hypothetical sale just after the third payment:</text>
<text x="24.000" y="155.760" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">$32.05m of principal is still due.</text>
<text x="24.000" y="221.760" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">Gross price</text>
<text x="416.000" y="221.760" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="end">35.00</text>
<rect x="24.000" y="238.760" width="392.000" height="20.000" rx="0" fill="var(--color-muted, #8b909b)"/>
<text x="24.000" y="310.760" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">Selling costs (10%)</text>
<text x="416.000" y="310.760" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="var(--color-down, #ff4d87)" text-anchor="end">−3.50</text>
<rect x="24.000" y="327.760" width="39.200" height="20.000" rx="0" fill="var(--color-down, #ff4d87)"/>
<text x="24.000" y="399.760" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">Transfer / preparation</text>
<text x="416.000" y="399.760" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="var(--color-down, #ff4d87)" text-anchor="end">−2.00</text>
<rect x="24.000" y="416.760" width="22.400" height="20.000" rx="0" fill="var(--color-down, #ff4d87)"/>
<text x="24.000" y="488.760" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">Net proceeds</text>
<text x="416.000" y="488.760" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="end">29.50</text>
<rect x="24.000" y="505.760" width="330.400" height="20.000" rx="0" fill="var(--color-signal, #5eead4)"/>
<rect x="24.000" y="561.760" width="392.000" height="103.000" rx="4" fill="color-mix(in srgb, var(--color-down, #ff4d87) 12%, var(--color-surface-2, #171a20))"/>
<text x="41.000" y="592.760" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="var(--color-down, #ff4d87)" text-anchor="start">Lender shortfall: $2.55m, before</text>
<text x="41.000" y="621.360" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="var(--color-down, #ff4d87)" text-anchor="start">any claim on a guarantor.</text>
<text x="24.000" y="689.760" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Three possible prices, same cost rules</text>
<rect x="24.000" y="712.760" width="392.000" height="92.000" rx="3" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1"/>
<text x="39.000" y="740.760" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Gross 25 → net 20.50</text>
<text x="39.000" y="776.760" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="var(--color-down, #ff4d87)" text-anchor="start">Shortfall: 11.55</text>
<rect x="24.000" y="819.760" width="392.000" height="92.000" rx="3" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1"/>
<text x="39.000" y="847.760" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Gross 35 → net 29.50</text>
<text x="39.000" y="883.760" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="var(--color-down, #ff4d87)" text-anchor="start">Shortfall: 2.55</text>
<rect x="24.000" y="926.760" width="392.000" height="92.000" rx="3" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1"/>
<text x="39.000" y="954.760" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Gross 45 → net 38.50</text>
<text x="39.000" y="990.760" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">After-debt surplus: 6.45</text>
<line x1="24.000" y1="1052.760" x2="416.000" y2="1052.760" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1"/>
<text x="24.000" y="1079.760" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">l0g calculations : model M4 / recovery.csv.</text>
<text x="24.000" y="1104.760" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Scenario prices, not quotations. Sale fee: 10% of gross; other</text>
<text x="24.000" y="1122.960" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">costs: $2m. Accrued interest and other creditors excluded.</text>
<text x="24.000" y="1141.160" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Selling ends the project’s rentals.</text>
</svg>