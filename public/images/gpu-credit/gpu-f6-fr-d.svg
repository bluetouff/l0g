<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 696" width="1120" height="696" role="img" aria-labelledby="gpu-credit-gpu-f6-fr-d-title gpu-credit-gpu-f6-fr-d-desc" style="width:100%;height:auto">
<title id="gpu-credit-gpu-f6-fr-d-title">16,62 millions à trouver pour réduire la dette</title>
<desc id="gpu-credit-gpu-f6-fr-d-desc">Calcul du redimensionnement à 1,35 de couverture, taux 10 %, deux ans.</desc>
<rect width="1120" height="696" fill="var(--color-ink, #0c0d10)"/>
<text x="44.000" y="40.000" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start" letter-spacing="1.1">l0g / SIMULATION / M$</text>
<text x="1076.000" y="40.000" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="end">06</text>
<text x="44.000" y="89.000" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">16,62 millions à trouver pour réduire la dette</text>
<text x="44.000" y="116.000" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Fin de l’année 3 : deux paiements restent, avec seulement 12 M$ de cash annuel futur.</text>
<rect x="44.000" y="156.000" width="328.000" height="173.000" rx="4" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1"/>
<text x="62.000" y="190.000" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">Cash annuel futur</text>
<text x="62.000" y="251.000" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">12,00 M$</text>
<text x="62.000" y="290.000" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Après charges payées</text>
<line x1="374.000" y1="238.000" x2="393.000" y2="238.000" stroke="var(--color-signal, #5eead4)" stroke-width="2"/>
<path d="M385.979,241.835 L393.000,238.000 L385.979,234.165" fill="none" stroke="var(--color-signal, #5eead4)" stroke-width="2" stroke-linejoin="round"/>
<rect x="396.000" y="156.000" width="328.000" height="173.000" rx="4" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1"/>
<text x="414.000" y="190.000" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">Paiement admissible</text>
<text x="414.000" y="251.000" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">8,89 M$</text>
<text x="414.000" y="290.000" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">12 ÷ 1,35</text>
<line x1="726.000" y1="238.000" x2="745.000" y2="238.000" stroke="var(--color-signal, #5eead4)" stroke-width="2"/>
<path d="M737.979,241.835 L745.000,238.000 L737.979,234.165" fill="none" stroke="var(--color-signal, #5eead4)" stroke-width="2" stroke-linejoin="round"/>
<rect x="748.000" y="156.000" width="328.000" height="173.000" rx="4" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1"/>
<text x="766.000" y="190.000" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">Dette soutenable</text>
<text x="766.000" y="251.000" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">15,43 M$</text>
<text x="766.000" y="290.000" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Deux annuités, actualisées à 10 %</text>
<text x="44.000" y="390.000" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Dette restante : 32,05 M$</text>
<rect x="44.000" y="413.000" width="496.774" height="66.000" rx="0" fill="var(--color-signal, #5eead4)"/>
<rect x="540.774" y="413.000" width="535.226" height="66.000" rx="0" fill="color-mix(in srgb, var(--color-down, #ff4d87) 12%, var(--color-surface-2, #171a20))"/>
<text x="292.387" y="455.000" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="var(--color-ink, #0c0d10)" text-anchor="middle">15,43</text>
<text x="808.387" y="455.000" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="var(--color-down, #ff4d87)" text-anchor="middle">16,62</text>
<text x="44.000" y="514.000" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">15,43 M$ restent financés ; 16,62 M$ doivent être remboursés par une autre ressource.</text>
<text x="44.000" y="556.000" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="var(--color-signal, #5eead4)" text-anchor="start">Contrepoint : 40,60 M$ de cash des trois premières années pourraient couvrir cet effort, s’ils ont été conservés.</text>
<line x1="44.000" y1="592.000" x2="1076.000" y2="592.000" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1"/>
<text x="44.000" y="619.000" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">Calculs l0g : modèle M3 / model.json.</text>
<text x="44.000" y="644.000" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Hypothèse annuelle simplifiée, taux inchangé. Ce calcul ne reproduit pas les tests mensuels, le ratio contractuel 2,40 ou les droits de remède de</text>
<text x="44.000" y="664.800" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">la DDTL 5.5.</text>
</svg>