<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 768" width="1120" height="768" role="img" aria-labelledby="gpu-credit-gpu-f4-fr-d-title gpu-credit-gpu-f4-fr-d-desc" style="width:100%;height:auto">
<title id="gpu-credit-gpu-f4-fr-d-title">Les recettes baissent plus vite que la dette</title>
<desc id="gpu-credit-gpu-f4-fr-d-desc">Décomposition des recettes annuelles avant et après renouvellement ; déficit de financement.</desc>
