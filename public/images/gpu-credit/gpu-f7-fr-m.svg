<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 1173" width="440" height="1173" role="img" aria-labelledby="gpu-credit-gpu-f7-fr-m-title gpu-credit-gpu-f7-fr-m-desc" style="width:100%;height:auto">
<title id="gpu-credit-gpu-f7-fr-m-title">Du prix de vente au cash récupéré</title>
