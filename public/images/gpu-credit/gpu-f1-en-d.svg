<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 782" width="1120" height="782" role="img" aria-labelledby="gpu-credit-gpu-f1-en-d-title gpu-credit-gpu-f1-en-d-desc" style="width:100%;height:auto">
<title id="gpu-credit-gpu-f1-en-d-title">Four clocks around one GPU</title>
<desc id="gpu-credit-gpu-f1-en-d-desc">Different kinds of duration shown separately by function.</desc>
<rect width="1120" height="782" fill="var(--color-ink, #0c0d10)"/>
<text x="44.000" y="40.000" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start" letter-spacing="1.1">l0g / DOCUMENTED REFERENCE POINTS</text>
<text x="1076.000" y="40.000" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="end">01</text>
<text x="44.000" y="89.000" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Four clocks around one GPU</text>
<text x="44.000" y="116.000" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Different reference points: hardware, accounts, customers and repayment.</text>
<text x="44.000" y="173.000" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">CUSTOMERS</text>
<text x="44.000" y="211.000" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">≈ 3 years</text>
<text x="280.000" y="174.000" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Average customer-contract term in DDTL 5.5.</text>
<rect x="715.000" y="166.000" width="360.000" height="18.000" rx="0" fill="color-mix(in srgb, var(--color-signal, #5eead4) 8%, var(--color-surface-2, #171a20))"/>
<rect x="715.000" y="166.000" width="108.000" height="18.000" rx="0" fill="var(--color-signal, #5eead4)"/>
<text x="715.000" y="215.000" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="var(--color-signal, #5eead4)" text-anchor="start">Duration : 3 years</text>
<text x="44.000" y="288.000" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">DEBT</text>
<text x="44.000" y="326.000" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="var(--color-down, #ff4d87)" text-anchor="start">≈ 5 years</text>
<text x="280.000" y="289.000" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Final loan maturity: September 1, 2031.</text>
<rect x="715.000" y="281.000" width="360.000" height="18.000" rx="0" fill="color-mix(in srgb, var(--color-signal, #5eead4) 8%, var(--color-surface-2, #171a20))"/>
<rect x="715.000" y="281.000" width="180.000" height="18.000" rx="0" fill="var(--color-down, #ff4d87)"/>
<text x="715.000" y="330.000" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="var(--color-down, #ff4d87)" text-anchor="start">Duration : 5 years</text>
<text x="44.000" y="403.000" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">ACCOUNTING</text>
<text x="44.000" y="441.000" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="start">6 years</text>
<text x="280.000" y="404.000" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Estimated technology-equipment life in</text>
<text x="280.000" y="427.400" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">CoreWeave’s 2025 accounts.</text>
<rect x="715.000" y="396.000" width="360.000" height="18.000" rx="0" fill="color-mix(in srgb, var(--color-signal, #5eead4) 8%, var(--color-surface-2, #171a20))"/>
<rect x="715.000" y="396.000" width="216.000" height="18.000" rx="0" fill="var(--color-topic-blue, #7aa2f7)"/>
<text x="715.000" y="445.000" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="start">Duration : 6 years</text>
<text x="44.000" y="518.000" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">INDUSTRIAL THESIS</text>
<text x="44.000" y="556.000" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">Towards 10</text>
<text x="44.000" y="589.600" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">years</text>
<text x="280.000" y="519.000" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Horizon Nvidia describes for A100; a supplier’s</text>
<text x="280.000" y="542.400" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">claim.</text>
<rect x="715.000" y="511.000" width="360.000" height="18.000" rx="0" fill="color-mix(in srgb, var(--color-signal, #5eead4) 8%, var(--color-surface-2, #171a20))"/>
<rect x="715.000" y="511.000" width="360.000" height="18.000" rx="0" fill="var(--color-ink, #0c0d10)" stroke="var(--color-muted, #8b909b)" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="715.000" y="560.000" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Supplier horizon : 10 years</text>
<rect x="44.000" y="616.000" width="1032.000" height="65.000" rx="4" fill="var(--color-surface-2, #171a20)"/>
<text x="62.000" y="645.000" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">The gap to underwrite: customer commitments can end before the loan does.</text>
<line x1="44.000" y1="698.000" x2="1076.000" y2="698.000" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1"/>
<text x="44.000" y="725.000" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">Sources : S02, S05, S06, S07.</text>
<text x="44.000" y="750.000" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Non-additive durations; separate reference points, not one cohort or an observed survival curve.</text>
</svg>