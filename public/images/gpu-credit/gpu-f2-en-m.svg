<text x="50.000" y="1005.760" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">2 customers</text>
<line x1="156.333" y1="1011.760" x2="162.333" y2="1011.760" stroke="var(--color-signal, #5eead4)" stroke-width="1.5"/>
<path d="M155.313,1015.595 L162.333,1011.760 L155.313,1007.925" fill="none" stroke="var(--color-signal, #5eead4)" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="163.333" y="978.760" width="113.333" height="66.000" rx="3" fill="var(--color-ink, #0c0d10)"/>
<text x="171.333" y="1005.760" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">GPU project</text>
<line x1="277.667" y1="1011.760" x2="283.667" y2="1011.760" stroke="var(--color-signal, #5eead4)" stroke-width="1.5"/>
<path d="M276.646,1015.595 L283.667,1011.760 L276.646,1007.925" fill="none" stroke="var(--color-signal, #5eead4)" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="284.667" y="978.760" width="113.333" height="66.000" rx="3" fill="var(--color-ink, #0c0d10)"/>
<text x="292.667" y="1005.760" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Lenders</text>
<text x="42.000" y="1085.760" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">Payment for reserved capacity</text>
<text x="42.000" y="1116.760" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">No re-leasing exposure in DBRS’s analysis.</text>
<line x1="42.000" y1="1173.760" x2="398.000" y2="1173.760" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1"/>
<text x="42.000" y="1204.760" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">Take-or-pay commitments</text>
<text x="42.000" y="1235.760" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Delivery, acceptance and availability still</text>
<text x="42.000" y="1259.160" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">matter.</text>
<text x="42.000" y="1358.760" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Fixed rate: 6.78%</text>
<text x="42.000" y="1398.760" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Maturity: May 30, 2033</text>
<line x1="24.000" y1="1449.760" x2="416.000" y2="1449.760" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1"/>
<text x="24.000" y="1476.760" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">Sources : S06–S09, S12–S13.</text>
<text x="24.000" y="1501.760" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Committed limits, not drawn balances. Contracts and recourse</text>
<text x="24.000" y="1519.960" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">differ; rates do not constitute a ranking.</text>
