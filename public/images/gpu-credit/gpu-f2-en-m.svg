<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 1551" width="440" height="1551" role="img" aria-labelledby="gpu-credit-gpu-f2-en-m-title gpu-credit-gpu-f2-en-m-desc" style="width:100%;height:auto">
<title id="gpu-credit-gpu-f2-en-m-title">The protection is in the contracts</title>
<desc id="gpu-credit-gpu-f2-en-m-desc">Comparison of CoreWeave DDTL 5.5 and Lambda Compute I.</desc>
<rect width="440" height="1551" fill="var(--color-ink, #0c0d10)"/>
<text x="24.000" y="35.000" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start" letter-spacing="1.1">l0g / TRANSACTIONS 2026</text>
<text x="416.000" y="35.000" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="end">02</text>
<text x="24.000" y="75.000" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">The protection is in the</text>
<text x="24.000" y="106.320" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">contracts</text>
<text x="24.000" y="133.320" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Two observed financings with different exposure to</text>
<text x="24.000" y="155.760" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">customer renewal.</text>
<rect x="24.000" y="195.760" width="392.000" height="600.000" rx="5" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1"/>
<text x="42.000" y="226.760" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">Aug 10, 2026</text>
<text x="42.000" y="260.760" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">CoreWeave / DDTL 5.5</text>
<text x="42.000" y="315.760" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="var(--color-down, #ff4d87)" text-anchor="start">$2.6bn</text>
<rect x="42.000" y="350.760" width="113.333" height="66.000" rx="3" fill="var(--color-ink, #0c0d10)"/>
<text x="50.000" y="377.760" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Customers</text>
<line x1="156.333" y1="383.760" x2="162.333" y2="383.760" stroke="var(--color-down, #ff4d87)" stroke-width="1.5"/>
<path d="M155.313,387.595 L162.333,383.760 L155.313,379.925" fill="none" stroke="var(--color-down, #ff4d87)" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="163.333" y="350.760" width="113.333" height="66.000" rx="3" fill="var(--color-ink, #0c0d10)"/>
<text x="171.333" y="377.760" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">GPU project</text>
<line x1="277.667" y1="383.760" x2="283.667" y2="383.760" stroke="var(--color-down, #ff4d87)" stroke-width="1.5"/>
<path d="M276.646,387.595 L283.667,383.760 L276.646,379.925" fill="none" stroke="var(--color-down, #ff4d87)" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="284.667" y="350.760" width="113.333" height="66.000" rx="3" fill="var(--color-ink, #0c0d10)"/>
<text x="292.667" y="377.760" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Lenders</text>
<text x="42.000" y="457.760" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="var(--color-down, #ff4d87)" text-anchor="start">≈ 3-year contracts / ≈ 5-year debt</text>
<text x="42.000" y="488.760" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Renew the contracts or resize the debt.</text>
<line x1="42.000" y1="545.760" x2="398.000" y2="545.760" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1"/>
<text x="42.000" y="576.760" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="var(--color-down, #ff4d87)" text-anchor="start">Parent guarantee: CoreWeave</text>
<text x="42.000" y="607.760" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Payment recourse to the group, in addition</text>
<text x="42.000" y="631.160" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">to project security.</text>
<text x="42.000" y="730.760" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Term SOFR + 5.50 percentage points</text>
<text x="42.000" y="770.760" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Maturity: Sep 1, 2031</text>
<rect x="24.000" y="823.760" width="392.000" height="600.000" rx="5" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1"/>
<text x="42.000" y="854.760" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">Oct 1–2, 2026</text>
<text x="42.000" y="888.760" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Lambda / Compute I</text>
<text x="42.000" y="943.760" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">$1.008bn</text>
