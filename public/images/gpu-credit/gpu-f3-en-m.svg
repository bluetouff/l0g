<rect x="24.000" y="743.760" width="392.000" height="88.000" rx="3" fill="color-mix(in srgb, var(--color-signal, #5eead4) 8%, var(--color-surface-2, #171a20))" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1"/>
<text x="39.000" y="772.760" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">6 years</text>
<text x="39.000" y="811.760" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="start">50m book value</text>
<rect x="24.000" y="845.760" width="392.000" height="88.000" rx="3" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1"/>
<text x="39.000" y="874.760" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">10 years</text>
<text x="39.000" y="913.760" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="start">70m book value</text>
<text x="24.000" y="959.760" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="var(--color-down, #ff4d87)" text-anchor="start">In all three cases, debt remaining: $32.05m.</text>
<line x1="24.000" y1="998.760" x2="416.000" y2="998.760" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1"/>
<text x="24.000" y="1025.760" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">l0g calculations : model M1 / data/model.json.</text>
<text x="24.000" y="1050.760" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Straight-line depreciation, zero accounting residual. No resale</text>
<text x="24.000" y="1068.960" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">price is inferred from these curves.</text>
