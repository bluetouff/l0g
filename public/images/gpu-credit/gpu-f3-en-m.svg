<text x="224.500" y="457.616" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="var(--color-down, #ff4d87)" text-anchor="end">32.05 debt</text>
<text x="24.000" y="615.760" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">After year three, by accounting life</text>
