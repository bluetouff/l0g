<text x="346.833" y="546.760" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="middle">5</text>
<text x="403.000" y="546.760" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="middle">6</text>
