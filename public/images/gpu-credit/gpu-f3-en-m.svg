<line x1="66.000" y1="444.760" x2="403.000" y2="444.760" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1"/>
<text x="56.000" y="449.760" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="end">25</text>
<line x1="66.000" y1="369.760" x2="403.000" y2="369.760" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1"/>
<text x="56.000" y="374.760" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="end">50</text>
<line x1="66.000" y1="294.760" x2="403.000" y2="294.760" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1"/>
<text x="56.000" y="299.760" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="end">75</text>
<line x1="66.000" y1="219.760" x2="403.000" y2="219.760" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1"/>
<text x="56.000" y="224.760" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="end">100</text>
<text x="66.000" y="546.760" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="middle">0</text>
