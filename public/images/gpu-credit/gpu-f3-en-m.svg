<path d="M66.000,219.760 L122.167,269.760 L178.333,319.760 L234.500,369.760 L290.667,419.760 L346.833,469.760 L403.000,519.760" fill="none" stroke="var(--color-topic-blue, #7aa2f7)" stroke-width="3" stroke-linejoin="round"/>
<path d="M66.000,309.760 L122.167,344.157 L178.333,381.995 L234.500,423.616 L290.667,469.399 L346.833,519.760 L403.000,519.760" fill="none" stroke="var(--color-down, #ff4d87)" stroke-width="3" stroke-linejoin="round"/>
