<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 1100" width="440" height="1100" role="img" aria-labelledby="gpu-credit-gpu-f3-en-m-title gpu-credit-gpu-f3-en-m-desc" style="width:100%;height:auto">
<title id="gpu-credit-gpu-f3-en-m-title">Two curves for the same equipment</title>
<desc id="gpu-credit-gpu-f3-en-m-desc">Six-year carrying value and outstanding debt, compared at the end of year three.</desc>
<rect width="440" height="1100" fill="var(--color-ink, #0c0d10)"/>
<text x="24.000" y="35.000" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start" letter-spacing="1.1">l0g / ILLUSTRATION / USD m</text>
<text x="416.000" y="35.000" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="end">03</text>
<text x="24.000" y="75.000" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Two curves for the same</text>
<text x="24.000" y="106.320" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">equipment</text>
<text x="24.000" y="133.320" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Hypothetical project: $100m equipment, $70m loan</text>
<text x="24.000" y="155.760" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">at 10%, five annual payments.</text>
