<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 782" width="1120" height="782" role="img" aria-labelledby="gpu-credit-gpu-f1-fr-d-title gpu-credit-gpu-f1-fr-d-desc" style="width:100%;height:auto">
<title id="gpu-credit-gpu-f1-fr-d-title">Quatre horloges autour d’un GPU</title>
<desc id="gpu-credit-gpu-f1-fr-d-desc">Durées de natures différentes, séparées par fonction.</desc>
<rect width="1120" height="782" fill="var(--color-ink, #0c0d10)"/>
<text x="44.000" y="40.000" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start" letter-spacing="1.1">l0g / REPÈRES DOCUMENTÉS</text>
<text x="1076.000" y="40.000" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="end">01</text>
<text x="44.000" y="89.000" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Quatre horloges autour d’un GPU</text>
<text x="44.000" y="116.000" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Des repères différents : durée technique, comptes, clients et remboursement.</text>
<text x="44.000" y="173.000" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">CLIENTS</text>
<text x="44.000" y="211.000" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">≈ 3 ans</text>
<text x="280.000" y="174.000" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Durée moyenne des contrats de la DDTL 5.5.</text>
<rect x="715.000" y="166.000" width="360.000" height="18.000" rx="0" fill="color-mix(in srgb, var(--color-signal, #5eead4) 8%, var(--color-surface-2, #171a20))"/>
<rect x="715.000" y="166.000" width="108.000" height="18.000" rx="0" fill="var(--color-signal, #5eead4)"/>
<text x="715.000" y="215.000" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="var(--color-signal, #5eead4)" text-anchor="start">Durée : 3 ans</text>
<text x="44.000" y="288.000" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">DETTE</text>
<text x="44.000" y="326.000" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="var(--color-down, #ff4d87)" text-anchor="start">≈ 5 ans</text>
<text x="280.000" y="289.000" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Échéance finale : 1er septembre 2031.</text>
<rect x="715.000" y="281.000" width="360.000" height="18.000" rx="0" fill="color-mix(in srgb, var(--color-signal, #5eead4) 8%, var(--color-surface-2, #171a20))"/>
<rect x="715.000" y="281.000" width="180.000" height="18.000" rx="0" fill="var(--color-down, #ff4d87)"/>
<text x="715.000" y="330.000" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="var(--color-down, #ff4d87)" text-anchor="start">Durée : 5 ans</text>
<text x="44.000" y="403.000" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">COMPTABILITÉ</text>
<text x="44.000" y="441.000" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="start">6 ans</text>
<text x="280.000" y="404.000" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Durée estimée des équipements</text>
<text x="280.000" y="427.400" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">technologiques dans les comptes 2025 de</text>
<text x="280.000" y="450.800" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">CoreWeave.</text>
<rect x="715.000" y="396.000" width="360.000" height="18.000" rx="0" fill="color-mix(in srgb, var(--color-signal, #5eead4) 8%, var(--color-surface-2, #171a20))"/>
<rect x="715.000" y="396.000" width="216.000" height="18.000" rx="0" fill="var(--color-topic-blue, #7aa2f7)"/>
<text x="715.000" y="445.000" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="start">Durée : 6 ans</text>
<text x="44.000" y="518.000" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">THÈSE INDUSTRIELLE</text>
<text x="44.000" y="556.000" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">Vers 10 ans</text>
<text x="280.000" y="519.000" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Horizon évoqué par Nvidia pour l’A100 ; une</text>
<text x="280.000" y="542.400" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">affirmation du fournisseur.</text>
<rect x="715.000" y="511.000" width="360.000" height="18.000" rx="0" fill="color-mix(in srgb, var(--color-signal, #5eead4) 8%, var(--color-surface-2, #171a20))"/>
<rect x="715.000" y="511.000" width="360.000" height="18.000" rx="0" fill="var(--color-ink, #0c0d10)" stroke="var(--color-muted, #8b909b)" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="715.000" y="560.000" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Horizon avancé : 10 ans</text>
<rect x="44.000" y="616.000" width="1032.000" height="65.000" rx="4" fill="var(--color-surface-2, #171a20)"/>
<text x="62.000" y="645.000" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Le décalage à financer : les engagements clients peuvent se terminer avant la dette.</text>
<line x1="44.000" y1="698.000" x2="1076.000" y2="698.000" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="1"/>
<text x="44.000" y="725.000" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">Sources : S02, S05, S06, S07.</text>
<text x="44.000" y="750.000" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Durées non additives ; repères distincts, sans cohorte commune ni courbe de survie observée.</text>
</svg>