<text x="24.000" y="976.760" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Dette prévue : 18,47 M$/an. Le segment pointillé est un besoin</text>
<text x="24.000" y="994.960" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">de cash. Scénario non applicable tel quel à des recettes</text>
<text x="24.000" y="1013.160" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">protégées par take-or-pay.</text>
