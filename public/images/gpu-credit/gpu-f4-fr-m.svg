<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 1045" width="440" height="1045" role="img" aria-labelledby="gpu-credit-gpu-f4-fr-m-title gpu-credit-gpu-f4-fr-m-desc" style="width:100%;height:auto">
<title id="gpu-credit-gpu-f4-fr-m-title">Les recettes baissent plus vite que la dette</title>
<desc id="gpu-credit-gpu-f4-fr-m-desc">Décomposition des recettes annuelles avant et après renouvellement ; déficit de financement.</desc>
<rect width="440" height="1045" fill="var(--color-ink, #0c0d10)"/>
<text x="24.000" y="35.000" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start" letter-spacing="1.1">l0g / SIMULATION / M$</text>
<text x="416.000" y="35.000" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="end">04</text>
