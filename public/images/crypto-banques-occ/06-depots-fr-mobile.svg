l(#occ-crypto-aefb879-6-fr-True)"/><text x="338.00" y="1061.34" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="var(--color-amber, #f5b13d)" text-anchor="start">100 $</text><rect x="44" y="1094.34" width="532" height="125" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="66.00" y="1133.34" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">BANQUE B · ÉMETTEUR</text><text x="66.00" y="1190.34" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">0 $ au terme du transit</text><path d="M310 1225.34 V1266.34" fill="none" stroke="var(--color-amber, #f5b13d)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#occ-crypto-aefb879-6-fr-True)"/><text x="338.00" y="1251.34" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="var(--color-amber, #f5b13d)" text-anchor="start">100 $</text><rect x="44" y="1284.34" width="532" height="125" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="66.00" y="1323.34" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="start">BANQUE C · VENDEUR NON BANCAIRE</text><text x="66.00" y="1380.34" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">+100 $ de dépôt</text><rect x="44" y="1432.34" width="532" height="174" rx="12" fill="var(--color-surface, #121419)"/><text x="66.00" y="1476.34" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Variation nette des dépôts : 0 $</text><text x="66.00" y="1519.09" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Le vendeur détient le dépôt chez C.</text><text x="66.00" y="1549.09" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">L’émetteur détient le titre.</text><line x1="44" y1="1646.34" x2="576" y2="1646.34" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2" opacity="1"/><text x="44.00" y="1684.34" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Source du mécanisme : Federal Reserve, FEDS Notes,</text><text x="44.00" y="1709.34" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">17.12.2025 (S25).</text><text x="44.00" y="1745.34" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Calculs l0g. Cas B : titre acheté à un vendeur non bancaire sur</text><text x="44.00" y="1768.14" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">le marché secondaire. Les variations portent sur les dépôts,</text><text x="44.00" y="1790.94" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">hors frais. Autres contreparties et émissions nouvelles :</text><text x="44.00" y="1813.74" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">écritures différentes.</text></svg>