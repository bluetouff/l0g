<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1845" viewBox="0 0 620 1845" role="img" aria-labelledby="occ-crypto-title-6-fr-True occ-crypto-desc-6-fr-True" style="width:100%;height:auto"><title id="occ-crypto-title-6-fr-True">Les 100 dollars changent d’adresse</title><desc id="occ-crypto-desc-6-fr-True">Deux parcours hypothétiques de 100 dollars. Les dépôts quittent la banque A mais réapparaissent chez B ou C. Total inchangé dans ces hypothèses ; composition et localisation modifiées.</desc><defs><marker id="occ-crypto-a71d3c0-6-fr-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-signal, #5eead4)"/></marker><marker id="occ-crypto-aefb879-6-fr-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-amber, #f5b13d)"/></marker><marker id="occ-crypto-af19c90-6-fr-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-down, #ff4d87)"/></marker><marker id="occ-crypto-a9fc6f2-6-fr-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-topic-blue, #7aa2f7)"/></marker><marker id="occ-crypto-aa9b9c7-6-fr-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-muted, #8b909b)"/></marker></defs><rect width="620" height="1845" fill="var(--color-ink, #0c0d10)"/><text x="44.00" y="45.00" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">l0g  /  FINANCE &amp; POUVOIR</text><text x="576.00" y="45.00" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="end">06</text><text x="44.00" y="101.00" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Les 100 dollars changent</text><text x="44.00" y="139.42" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">d’adresse</text><text x="44.00" y="178.84" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Deux exemples hypothétiques. Le client reçoit 100</text><text x="44.00" y="207.59" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">jetons à un dollar.</text><text x="44.00" y="263.34" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">A / RÉSERVES EN DÉPÔT</text><rect x="44" y="294.84" width="532" height="125" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="66.00" y="333.84" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="var(--color-down, #ff4d87)" text-anchor="start">BANQUE A · CLIENT INITIAL</text><text x="66.00" y="390.84" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">−100 $ de dépôt</text><path d="M310 425.84 V466.84" fill="none" stroke="var(--color-amber, #f5b13d)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#occ-crypto-aefb879-6-fr-True)"/><text x="338.00" y="451.84" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="var(--color-amber, #f5b13d)" text-anchor="start">100 $</text><rect x="44" y="484.84" width="532" height="125" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong,