<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1529" viewBox="0 0 620 1529" role="img" aria-labelledby="occ-crypto-title-4-fr-True occ-crypto-desc-4-fr-True" style="width:100%;height:auto"><title id="occ-crypto-title-4-fr-True">Capital et liquidité : deux tests</title><desc id="occ-crypto-desc-4-fr-True">Au capital hypothétique de 15, 20 ou 30 millions, le plancher de liquidité est de 7,5, 10 ou 15 millions. Une réserve distincte couvre 180 jours de cessation d’activité.</desc><defs><marker id="occ-crypto-a71d3c0-4-fr-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-signal, #5eead4)"/></marker><marker id="occ-crypto-aefb879-4-fr-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-amber, #f5b13d)"/></marker><marker id="occ-crypto-af19c90-4-fr-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-down, #ff4d87)"/></marker><marker id="occ-crypto-a9fc6f2-4-fr-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-topic-blue, #7aa2f7)"/></marker><marker id="occ-crypto-aa9b9c7-4-fr-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-muted, #8b909b)"/></marker></defs><rect width="620" height="1529" fill="var(--color-ink, #0c0d10)"/><text x="44.00" y="45.00" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">l0g  /  FINANCE &amp; POUVOIR</text><text x="576.00" y="45.00" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="end">04</text><text x="44.00" y="101.00" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Capital et liquidité : deux tests</text><text x="44.00" y="140.42" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Protego / National Digital Trust Company ·</text><text x="44.00" y="169.17" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">conditions du 13 février 2026.</text><rect x="44" y="202.92" width="532" height="131" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="67.00" y="243.92" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">CAPITAL TIER 1 : AU MOINS 15 M$</text><text x="67.00" y="282.42" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Liquidité : le plus élevé de 50 % du capital ou</text><text x="67.00" y="311.17" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">7,5 M$.</text><text x="44.00" y="399.92" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">TROIS NIVEAUX HYPOTHÉTIQUES DE CAPITAL</text><text x="44.00" y="485.92" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Capital testé : 15 M$</text><rect x="44" y="510.91999999999996" width="266.0" height="59" rx="0" fill="var(--color-surface-2, #171a20)" stroke="var(--color-muted, #8b909b)" stroke-width="2"/><rect x="44" y="510.91999999999996" width="133.0" height="59" rx="0" fill="var(--color-signal, #5eead4)"/><text x="44.00" y="606.92" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">Liquidité minimale : 7,5 M$</text><text x="44.00" y="677.92" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Capital testé : 20 M$</text><rect x="44" y="702.92" width="354.6666666666667" height="59" rx="0" fill="var(--color-surface-2, #171a20)" stroke="var(--color-muted, #8b909b)" stroke-width="2"/><rect x="44" y="702.92" width="177.33333333333334" height="59" rx="0" fill="var(--color-signal, #5eead4)"/><text x="44.00" y="798.92" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">Liquidité minimale : 10,0 M$</text><text x="44.00" y="869.92" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Capital testé : 30 M$</text><rect x="44" y="894.92" width="532.0" height="59" rx="0" fill="var(--color-surface-2, #171a20)" stroke="var(--color-muted, #8b909b)" stroke-width="2"/><rect x="44" y="894.92" width="266.0" height="59" rx="0" fill="var(--color-signal, #5eead4)"/><text x="44.00" y="990.92" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">Liquidité minimale : 15,0 M$</text><rect x="44" y="1032.92" width="532" height="280" rx="12" fill="var(--color-surface, #121419)" stroke="var(--color-amber, #f5b13d)" stroke-width="2"/><text x="68.00" y="1073.92" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">LIQUIDITÉ SUPPLÉMENTAIRE</text><text x="68.00" y="1157.17" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">180</text><text x="68.00" y="1206.17" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">jours de dépenses d’arrêt ordonné</text><text x="68.00" y="1252.17" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Sans double comptage. Montant en dollars non</text><text x="68.00" y="1280.92" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">publié.</text><line x1="44" y1="1352.92" x2="576" y2="1352.92" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2" opacity="1"/><text x="44.00" y="1390.92" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Source : OCC, Corporate Decision 1366, p. 8, conditions</text><text x="44.00" y="1415.92" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">4–5 (S13).</text><text x="44.00" y="1451.92" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Conditions pour les trois premières années. Barres : exemples</text><text x="44.00" y="1474.72" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">calculés, pas des soldes observés. La part verte est incluse :</text><text x="44.00" y="1497.52" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">capital et liquidité ne s’additionnent pas.</text></svg>