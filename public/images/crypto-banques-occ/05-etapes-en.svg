<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1082" viewBox="0 0 1120 1082" role="img" aria-labelledby="occ-crypto-title-5-en-False occ-crypto-desc-5-en-False" style="width:100%;height:auto"><title id="occ-crypto-title-5-en-False">From application to permission to open</title><desc id="occ-crypto-desc-5-en-False">Circle application June 30, 2025, conditional approval December 12, final approval announced July 10, 2026. Initial custody scope; reserve management contemplated later.</desc><defs><marker id="occ-crypto-a71d3c0-5-en-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-signal, #5eead4)"/></marker><marker id="occ-crypto-aefb879-5-en-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-amber, #f5b13d)"/></marker><marker id="occ-crypto-af19c90-5-en-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-down, #ff4d87)"/></marker><marker id="occ-crypto-a9fc6f2-5-en-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-topic-blue, #7aa2f7)"/></marker><marker id="occ-crypto-aa9b9c7-5-en-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-muted, #8b909b)"/></marker></defs><rect width="1120" height="1082" fill="var(--color-ink, #0c0d10)"/><text x="44.00" y="45.00" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">l0g  /  FINANCE &amp; POWER</text><text x="1076.00" y="45.00" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="end">05</text><text x="44.00" y="109.00" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">From application to permission to open</text><text x="44.00" y="148.46" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Circle: documented milestones and a defined initial scope.</text><line x1="204" y1="216.95999999999998" x2="916" y2="216.95999999999998" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="3" opacity="1"/><circle cx="204" cy="216.95999999999998" r="11" fill="var(--color-topic-blue, #7aa2f7)"/><rect x="44" y="260.96" width="320" height="237" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><rect x="44" y="278.96" width="4" height="201" rx="1" fill="var(--color-topic-blue, #7aa2f7)"/><text x="66.00" y="297.96" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="start">Jun 30, 2025</text><text x="66.00" y="337.96" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Application filed</text><text x="66.00" y="376.71" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">First National Digital</text><text x="66.00" y="404.21" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Currency Bank</text><circle cx="560" cy="216.95999999999998" r="11" fill="var(--color-amber, #f5b13d)"/><rect x="400" y="260.96" width="320" height="237" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><rect x="400" y="278.96" width="4" height="201" rx="1" fill="var(--color-amber, #f5b13d)"/><text x="422.00" y="297.96" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">Dec 12, 2025</text><text x="422.00" y="337.96" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Conditional approval</text><text x="422.00" y="376.71" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Pre-opening requirements</text><text x="422.00" y="404.21" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">to be met</text><circle cx="916" cy="216.95999999999998" r="11" fill="var(--color-signal, #5eead4)"/><rect x="756" y="260.96" width="320" height="237" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><rect x="756" y="278.96" width="4" height="201" rx="1" fill="var(--color-signal, #5eead4)"/><text x="778.00" y="297.96" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">Jul 10, 2026</text><text x="778.00" y="337.96" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Final approval</text><text x="778.00" y="371.71" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">announced</text><text x="778.00" y="410.46" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Circle National Trust</text><rect x="44" y="549.96" width="496" height="249" rx="12" fill="var(--color-surface, #121419)" stroke="var(--color-signal, #5eead4)" stroke-width="2"/><text x="69.00" y="591.96" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">ANNOUNCED LAUNCH SCOPE</text><text x="69.00" y="655.96" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Fiduciary custody for</text><text x="69.00" y="698.46" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Circle and its affiliates.</text><rect x="580" y="549.96" width="496" height="249" rx="12" fill="var(--color-ink, #0c0d10)" stroke="var(--color-amber, #f5b13d)" stroke-width="2" stroke-dasharray="6 6"/><text x="605.00" y="591.96" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">CONTEMPLATED FUTURE CAPABILITIES</text><text x="605.00" y="644.96" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">USDC reserve management. Some</text><text x="605.00" y="679.96" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">institutional clients, depending on</text><text x="605.00" y="714.96" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">demand.</text><text x="44.00" y="874.96" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">The charter concerns a subsidiary and a business, with distinct approval</text><text x="44.00" y="911.21" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">stages.</text><line x1="44" y1="959.0400000000001" x2="1076" y2="959.0400000000001" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2" opacity="1"/><text x="44.00" y="995.04" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Sources: OCC, Dec 12, 2025 (S12) · Circle, Jul 10, 2026 (S16).</text><text x="44.00" y="1029.54" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Final approval and launch scope as reported by Circle, an interested source. Milestones not time-scaled. Future capabilities</text><text x="44.00" y="1051.14" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">remain distinct.</text></svg>