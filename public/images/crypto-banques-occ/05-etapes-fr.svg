<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1046" viewBox="0 0 1120 1046" role="img" aria-labelledby="occ-crypto-title-5-fr-False occ-crypto-desc-5-fr-False" style="width:100%;height:auto"><title id="occ-crypto-title-5-fr-False">Du dossier au droit d’ouvrir</title><desc id="occ-crypto-desc-5-fr-False">Demande Circle le 30 juin 2025, accord conditionnel le 12 décembre, accord final annoncé le 10 juillet 2026. Conservation au lancement ; gestion des réserves envisagée ultérieurement.</desc><defs><marker id="occ-crypto-a71d3c0-5-fr-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-signal, #5eead4)"/></marker><marker id="occ-crypto-aefb879-5-fr-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-amber, #f5b13d)"/></marker><marker id="occ-crypto-af19c90-5-fr-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-down, #ff4d87)"/></marker><marker id="occ-crypto-a9fc6f2-5-fr-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-topic-blue, #7aa2f7)"/></marker><marker id="occ-crypto-aa9b9c7-5-fr-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-muted, #8b909b)"/></marker></defs><rect width="1120" height="1046" fill="var(--color-ink, #0c0d10)"/><text x="44.00" y="45.00" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">l0g  /  FINANCE &amp; POUVOIR</text><text x="1076.00" y="45.00" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="end">05</text><text x="44.00" y="109.00" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Du dossier au droit d’ouvrir</text><text x="44.00" y="148.46" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Circle : une chronologie documentée, un périmètre initial précis.</text><line x1="204" y1="216.95999999999998" x2="916" y2="216.95999999999998" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="3" opacity="1"/><circle cx="204" cy="216.95999999999998" r="11" fill="var(--color-topic-blue, #7aa2f7)"/><rect x="44" y="260.96" width="320" height="237" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><rect x="44" y="278.96" width="4" height="201" rx="1" fill="var(--color-topic-blue, #7aa2f7)"/><text x="66.00" y="297.96" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="start">30.06.2025</text><text x="66.00" y="337.96" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Demande reçue</text><text x="66.00" y="376.71" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">First National Digital</text><text x="66.00" y="404.21" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Currency Bank</text><circle cx="560" cy="216.95999999999998" r="11" fill="var(--color-amber, #f5b13d)"/><rect x="400" y="260.96" width="320" height="237" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><rect x="400" y="278.96" width="4" height="201" rx="1" fill="var(--color-amber, #f5b13d)"/><text x="422.00" y="297.96" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">12.12.2025</text><text x="422.00" y="337.96" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Accord conditionnel</text><text x="422.00" y="376.71" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Exigences préalables à</text><text x="422.00" y="404.21" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">satisfaire</text><circle cx="916" cy="216.95999999999998" r="11" fill="var(--color-signal, #5eead4)"/><rect x="756" y="260.96" width="320" height="237" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><rect x="756" y="278.96" width="4" height="201" rx="1" fill="var(--color-signal, #5eead4)"/><text x="778.00" y="297.96" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">10.07.2026</text><text x="778.00" y="337.96" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Accord final annoncé</text><text x="778.00" y="376.71" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Circle National Trust</text><rect x="44" y="549.96" width="496" height="249" rx="12" fill="var(--color-surface, #121419)" stroke="var(--color-signal, #5eead4)" stroke-width="2"/><text x="69.00" y="591.96" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">PÉRIMÈTRE DE LANCEMENT ANNONCÉ</text><text x="69.00" y="655.96" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Conservation fiduciaire</text><text x="69.00" y="698.46" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">pour Circle et ses affiliés.</text><rect x="580" y="549.96" width="496" height="249" rx="12" fill="var(--color-ink, #0c0d10)" stroke="var(--color-amber, #f5b13d)" stroke-width="2" stroke-dasharray="6 6"/><text x="605.00" y="591.96" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">CAPACITÉS FUTURES ENVISAGÉES</text><text x="605.00" y="644.96" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Gestion des réserves USDC.</text><text x="605.00" y="679.96" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Certains clients institutionnels,</text><text x="605.00" y="714.96" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">selon la demande.</text><text x="44.00" y="874.96" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">L’agrément concerne une filiale et un métier, avec des étapes à respecter.</text><line x1="44" y1="922.7900000000001" x2="1076" y2="922.7900000000001" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2" opacity="1"/><text x="44.00" y="958.79" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Sources : OCC, 12.12.2025 (S12) · Circle, 10.07.2026 (S16).</text><text x="44.00" y="993.29" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Accord final et périmètre de lancement selon Circle, source intéressée. Étapes non espacées à l’échelle du temps. Les capacités</text><text x="44.00" y="1014.89" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">futures restent distinguées.</text></svg>