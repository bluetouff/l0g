<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1301" viewBox="0 0 620 1301" role="img" aria-labelledby="occ-crypto-title-1-fr-True occ-crypto-desc-1-fr-True" style="width:100%;height:auto"><title id="occ-crypto-title-1-fr-True">Une enseigne, trois décisions</title><desc id="occ-crypto-desc-1-fr-True">Trois branches indépendantes : agrément OCC, assurance FDIC et accès aux services de la Fed.</desc><defs><marker id="occ-crypto-a71d3c0-1-fr-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-signal, #5eead4)"/></marker><marker id="occ-crypto-aefb879-1-fr-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-amber, #f5b13d)"/></marker><marker id="occ-crypto-af19c90-1-fr-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-down, #ff4d87)"/></marker><marker id="occ-crypto-a9fc6f2-1-fr-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-topic-blue, #7aa2f7)"/></marker><marker id="occ-crypto-aa9b9c7-1-fr-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-muted, #8b909b)"/></marker></defs><rect width="620" height="1301" fill="var(--color-ink, #0c0d10)"/><text x="44.00" y="45.00" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">l0g  /  FINANCE &amp; POUVOIR</text><text x="576.00" y="45.00" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="end">01</text><text x="44.00" y="101.00" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Une enseigne, trois décisions</text><text x="44.00" y="140.42" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Chaque autorité répond à une question différente.</text><rect x="44" y="174.17" width="532" height="95" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="310.00" y="209.17" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="middle">ENTREPRISE FINANCIÈRE</text><text x="310.00" y="242.17" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="middle">Quel métier, quelle protection, quel accès ?</text><path d="M65 294.16999999999996 V884.17" fill="none" stroke="var(--color-muted, #8b909b)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M65 377.16999999999996 H100" fill="none" stroke="var(--color-signal, #5eead4)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#occ-crypto-a71d3c0-1-fr-True)"/><rect x="112" y="309.16999999999996" width="464" height="196" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="134.00" y="351.17" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">OCC</text><text x="134.00" y="388.17" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Autoriser l’activité</text><text x="134.00" y="426.92" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Périmètre du métier, contrôles,</text><text x="134.00" y="455.67" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">conditions de l’agrément.</text><text x="134.00" y="484.17" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">Agrément spécialisé</text><path d="M65 593.17 H100" fill="none" stroke="var(--color-amber, #f5b13d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#occ-crypto-aefb879-1-fr-True)"/><rect x="112" y="525.17" width="464" height="196" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="134.00" y="567.17" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">FDIC</text><text x="134.00" y="604.17" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Assurer les dépôts</text><text x="134.00" y="642.92" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Dépôts éligibles dans une banque</text><text x="134.00" y="671.67" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">assurée. Cryptoactifs exclus.</text><text x="134.00" y="700.17" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">250 000 $ · plafond standard</text><path d="M65 809.17 H100" fill="none" stroke="var(--color-topic-blue, #7aa2f7)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#occ-crypto-a9fc6f2-1-fr-True)"/><rect x="112" y="741.17" width="464" height="196" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="134.00" y="783.17" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="start">FED</text><text x="134.00" y="820.17" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Régler les paiements</text><text x="134.00" y="858.92" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Éligibilité légale et décision distincte</text><text x="134.00" y="887.67" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">d’une Reserve Bank.</text><text x="134.00" y="916.17" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="start">Accès et services autorisés</text><rect x="44" y="978.17" width="532" height="130" rx="12" fill="var(--color-surface, #121419)"/><text x="66.00" y="1021.17" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">La protection suit le produit et son</text><text x="66.00" y="1053.67" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">statut juridique.</text><line x1="44" y1="1148.17" x2="576" y2="1148.17" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2" opacity="1"/><text x="44.00" y="1186.17" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Sources : OCC (S04, S13) · FDIC (S18) · Federal Reserve</text><text x="44.00" y="1211.17" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">(S23).</text><text x="44.00" y="1247.17" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Schéma institutionnel au 04.10.2026. FDIC : par déposant,</text><text x="44.00" y="1269.97" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">banque assurée et catégorie de propriété du compte.</text></svg>