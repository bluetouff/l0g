roke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><rect x="101" y="430.91999999999996" width="4" height="149" rx="1" fill="var(--color-amber, #f5b13d)"/><text x="123.00" y="449.92" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">12.12.2025</text><text x="123.00" y="489.92" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Accord conditionnel</text><text x="123.00" y="529.67" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Exigences préalables à satisfaire</text><circle cx="68" cy="660.92" r="12" fill="var(--color-signal, #5eead4)"/><line x1="68" y1="673.92" x2="68" y2="815.92" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2" opacity="1"/><rect x="101" y="622.92" width="475" height="185" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><rect x="101" y="640.92" width="4" height="149" rx="1" fill="var(--color-signal, #5eead4)"/><text x="123.00" y="659.92" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">10.07.2026</text><text x="123.00" y="699.92" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Accord final annoncé</text><text x="123.00" y="739.67" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Circle National Trust</text><rect x="44" y="842.92" width="532" height="209" rx="12" fill="var(--color-surface, #121419)" stroke="var(--color-signal, #5eead4)" stroke-width="2"/><text x="68.00" y="882.92" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">PÉRIMÈTRE DE LANCEMENT ANNONCÉ</text><text x="68.00" y="933.17" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Conservation fiduciaire pour</text><text x="68.00" y="971.92" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Circle et ses affiliés.</text><rect x="44" y="1084.92" width="532" height="266" rx="12" fill="var(--color-ink, #0c0d10)" stroke="var(--color-amber, #f5b13d)" stroke-width="2" stroke-dasharray="6 6"/><text x="68.00" y="1125.92" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">CAPACITÉS FUTURES ENVISAGÉES</text><text x="68.00" y="1170.92" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Gestion des réserves USDC. Services</text><text x="68.00" y="1204.67" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">directs à certains clients institutionnels,</text><text x="68.00" y="1238.42" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">selon la demande.</text><line x1="44" y1="1390.92" x2="576" y2="1390.92" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2" opacity="1"/><text x="44.00" y="1428.92" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Sources : OCC, 12.12.2025 (S12) · Circle, 10.07.2026</text><text x="44.00" y="1453.92" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">(S16).</text><text x="44.00" y="1489.92" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Accord final et périmètre de lancement selon Circle, source</text><text x="44.00" y="1512.72" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">intéressée. Étapes non espacées à l’échelle du temps. Les</text><text x="44.00" y="1535.52" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">capacités futures restent distinguées.</text></svg>