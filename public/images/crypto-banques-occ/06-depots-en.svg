<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1223" viewBox="0 0 1120 1223" role="img" aria-labelledby="occ-crypto-title-6-en-False occ-crypto-desc-6-en-False" style="width:100%;height:auto"><title id="occ-crypto-title-6-en-False">The $100 changes address</title><desc id="occ-crypto-desc-6-en-False">Two hypothetical $100 flows. Deposits leave Bank A but reappear at B or C. Totals unchanged under these assumptions, with changed location and composition.</desc><defs><marker id="occ-crypto-a71d3c0-6-en-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-signal, #5eead4)"/></marker><marker id="occ-crypto-aefb879-6-en-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-amber, #f5b13d)"/></marker><marker id="occ-crypto-af19c90-6-en-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-down, #ff4d87)"/></marker><marker id="occ-crypto-a9fc6f2-6-en-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-topic-blue, #7aa2f7)"/></marker><marker id="occ-crypto-aa9b9c7-6-en-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-muted, #8b909b)"/></marker></defs><rect width="1120" height="1223" fill="var(--color-ink, #0c0d10)"/><text x="44.00" y="45.00" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">l0g  /  FINANCE &amp; POWER</text><text x="1076.00" y="45.00" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="end">06</text><text x="44.00" y="109.00" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">The $100 changes address</text><text x="44.00" y="148.46" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Two hypothetical examples. The customer receives 100 one-dollar tokens.</text><text x="44.00" y="202.96" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">A / RESERVES KEPT AS BANK DEPOSITS</text><rect x="44" y="247.95999999999998" width="312" height="210" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="66.00" y="285.96" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="var(--color-down, #ff4d87)" text-anchor="start">BANK A</text><text x="66.00" y="325.96" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Original customer</text><text x="66.00" y="412.96" font-family="Arial, Helvetica, sans-serif" font-size="41" font-weight="700" fill="var(--color-down, #ff4d87)" text-anchor="start">−$100</text><rect x="404" y="247.95999999999998" width="312" height="210" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="426.00" y="285.96" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">BANK B</text><text x="426.00" y="325.96" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Stablecoin issuer</text><text x="426.00" y="412.96" font-family="Arial, Helvetica, sans-serif" font-size="41" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">+$100</text><path d="M365 342.96 H390" fill="none" stroke="var(--color-amber, #f5b13d)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#occ-crypto-aefb879-6-en-False)"/><text x="357.00" y="235.96" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="var(--color-amber, #f5b13d)" text-anchor="middle">$100</text><rect x="764" y="247.95999999999998" width="312" height="210" rx="12" fill="var(--color-surface, #121419)"/><text x="786.00" y="287.96" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">ISSUER’S RESERVE</text><text x="786.00" y="351.96" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">A deposit at B</text><rect x="44" y="492.96" width="1032" height="114" rx="12" fill="var(--color-surface, #121419)"/><text x="68.00" y="535.96" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">System deposits: net change = $0</text><text x="68.00" y="573.96" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">A loses the deposit; B receives a deposit in the issuer’s name.</text><text x="44.00" y="655.96" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">B / PURCHASE OF AN OUTSTANDING SECURITY</text><rect x="44" y="700.96" width="312" height="210" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="66.00" y="738.96" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="var(--color-down, #ff4d87)" text-anchor="start">BANK A</text><text x="66.00" y="778.96" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Original customer</text><text x="66.00" y="865.96" font-family="Arial, Helvetica, sans-serif" font-size="41" font-weight="700" fill="var(--color-down, #ff4d87)" text-anchor="start">−$100</text><rect x="404" y="700.96" width="312" height="210" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="426.00" y="738.96" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">BANK B</text><text x="426.00" y="778.96" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Stablecoin issuer</text><text x="426.00" y="865.96" font-family="Arial, Helvetica, sans-serif" font-size="41" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">$0</text><rect x="764" y="700.96" width="312" height="210" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="786.00" y="738.96" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="start">BANK C</text><text x="786.00" y="778.96" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Nonbank seller</text><text x="786.00" y="865.96" font-family="Arial, Helvetica, sans-serif" font-size="41" font-weight="700" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="start">+$100</text><path d="M365 795.96 H390" fill="none" stroke="var(--color-amber, #f5b13d)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#occ-crypto-aefb879-6-en-False)"/><text x="357.00" y="688.96" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="var(--color-amber, #f5b13d)" text-anchor="middle">$100</text><path d="M725 795.96 H750" fill="none" stroke="var(--color-amber, #f5b13d)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#occ-crypto-aefb879-6-en-False)"/><text x="717.00" y="688.96" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="var(--color-amber, #f5b13d)" text-anchor="middle">$100</text><rect x="44" y="945.96" width="1032" height="114" rx="12" fill="var(--color-surface, #121419)"/><text x="68.00" y="988.96" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">System deposits: net change = $0</text><text x="68.00" y="1026.96" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">A loses the deposit; C receives the seller’s. The issuer holds the security.</text><line x1="44" y1="1099.96" x2="1076" y2="1099.96" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2" opacity="1"/><text x="44.00" y="1135.96" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Mechanism source: Federal Reserve, FEDS Notes, Dec 17, 2025 (S25).</text><text x="44.00" y="1170.46" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">l0g calculations. Case B: security bought from a nonbank seller in the secondary market. Changes are in deposits, excluding</text><text x="44.00" y="1192.06" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">fees. Other counterparties and new issuance produce different entries.</text></svg>