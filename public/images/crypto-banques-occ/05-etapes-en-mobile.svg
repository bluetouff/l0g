th="532" height="209" rx="12" fill="var(--color-surface, #121419)" stroke="var(--color-signal, #5eead4)" stroke-width="2"/><text x="68.00" y="921.34" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">ANNOUNCED LAUNCH SCOPE</text><text x="68.00" y="971.59" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Fiduciary custody for Circle and</text><text x="68.00" y="1010.34" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">its affiliates.</text><rect x="44" y="1123.34" width="532" height="266" rx="12" fill="var(--color-ink, #0c0d10)" stroke="var(--color-amber, #f5b13d)" stroke-width="2" stroke-dasharray="6 6"/><text x="68.00" y="1164.34" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">CONTEMPLATED FUTURE CAPABILITIES</text><text x="68.00" y="1209.34" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">USDC reserve management. Direct</text><text x="68.00" y="1243.09" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">services for some institutional clients,</text><text x="68.00" y="1276.84" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="var(--color-paper, #e7e9ee)" text-anchor="start">depending on demand.</text><line x1="44" y1="1429.34" x2="576" y2="1429.34" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2" opacity="1"/><text x="44.00" y="1467.34" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Sources: OCC, Dec 12, 2025 (S12) · Circle, Jul 10, 2026<