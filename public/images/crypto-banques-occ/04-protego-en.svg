<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1243" viewBox="0 0 1120 1243" role="img" aria-labelledby="occ-crypto-title-4-en-False occ-crypto-desc-4-en-False" style="width:100%;height:auto"><title id="occ-crypto-title-4-en-False">Capital and liquidity: two tests</title><desc id="occ-crypto-desc-4-en-False">At hypothetical capital levels of $15m, $20m or $30m, minimum liquid assets are $7.5m, $10m or $15m. A separate liquidity requirement covers 180 days of wind-down expenses.</desc><defs><marker id="occ-crypto-a71d3c0-4-en-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-signal, #5eead4)"/></marker><marker id="occ-crypto-aefb879-4-en-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-amber, #f5b13d)"/></marker><marker id="occ-crypto-af19c90-4-en-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-down, #ff4d87)"/></marker><marker id="occ-crypto-a9fc6f2-4-en-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-topic-blue, #7aa2f7)"/></marker><marker id="occ-crypto-aa9b9c7-4-en-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-muted, #8b909b)"/></marker></defs><rect width="1120" height="1243" fill="var(--color-ink, #0c0d10)"/><text x="44.00" y="45.00" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">l0g  /  FINANCE &amp; POWER</text><text x="1076.00" y="45.00" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="end">04</text><text x="44.00" y="109.00" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Capital and liquidity: two tests</text><text x="44.00" y="148.46" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Protego / National Digital Trust Company · February 13, 2026 conditions.</text><rect x="44" y="181.95999999999998" width="1032" height="101" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="67.00" y="222.96" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">TIER 1 CAPITAL: AT LEAST $15M</text><text x="67.00" y="261.46" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Liquidity: the greater of 50% of capital or $7.5m.</text><text x="44.00" y="351.96" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">THREE HYPOTHETICAL CAPITAL LEVELS</text><line x1="93" y1="736.96" x2="1055" y2="736.96" stroke="var(--color-muted, #8b909b)" stroke-width="1" opacity="1"/><rect x="187" y="586.96" width="132" height="150" rx="0" fill="var(--color-surface-2, #171a20)" stroke="var(--color-muted, #8b909b)" stroke-width="2"/><rect x="187" y="661.96" width="132" height="75.0" rx="0" fill="var(--color-signal, #5eead4)"/><text x="253.00" y="569.96" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="middle">$15m</text><text x="253.00" y="702.96" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="var(--color-ink, #0c0d10)" text-anchor="middle">$7.5m</text><text x="253.00" y="781.96" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="middle">Test capital</text><rect x="501" y="536.96" width="132" height="200" rx="0" fill="var(--color-surface-2, #171a20)" stroke="var(--color-muted, #8b909b)" stroke-width="2"/><rect x="501" y="636.96" width="132" height="100.0" rx="0" fill="var(--color-signal, #5eead4)"/><text x="567.00" y="519.96" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="middle">$20m</text><text x="567.00" y="677.96" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="var(--color-ink, #0c0d10)" text-anchor="middle">$10m</text><text x="567.00" y="781.96" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="middle">Test capital</text><rect x="815" y="436.96000000000004" width="132" height="300" rx="0" fill="var(--color-surface-2, #171a20)" stroke="var(--color-muted, #8b909b)" stroke-width="2"/><rect x="815" y="586.96" width="132" height="150.0" rx="0" fill="var(--color-signal, #5eead4)"/><text x="881.00" y="419.96" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="middle">$30m</text><text x="881.00" y="627.96" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="var(--color-ink, #0c0d10)" text-anchor="middle">$15m</text><text x="881.00" y="781.96" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="middle">Test capital</text><rect x="44" y="824.96" width="19" height="19" rx="0" fill="var(--color-signal, #5eead4)"/><text x="74.00" y="843.96" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Capital-linked liquidity requirement: $7.5m / $10m / $15m.</text><rect x="44" y="900.96" width="1032" height="179" rx="12" fill="var(--color-surface, #121419)" stroke="var(--color-amber, #f5b13d)" stroke-width="2"/><text x="71.00" y="938.96" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">ADDITIONAL LIQUIDITY, WITHOUT DOUBLE COUNTING</text><text x="72.00" y="1021.96" font-family="Arial, Helvetica, sans-serif" font-size="57" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">180</text><text x="214.00" y="997.96" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">days of wind-down operating expenses</text><text x="72.00" y="1061.96" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Dollar amount not published in the decision.</text><line x1="44" y1="1119.96" x2="1076" y2="1119.96" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2" opacity="1"/><text x="44.00" y="1155.96" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Source : OCC, Corporate Decision 1366, p. 8, conditions 4–5 (S13).</text><text x="44.00" y="1190.46" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Conditions for the first three years. Bars are calculated examples, not observed balances. Teal is an included share: do not add</text><text x="44.00" y="1212.06" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">capital and liquidity.</text></svg>