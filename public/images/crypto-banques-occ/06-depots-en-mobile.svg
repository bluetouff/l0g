<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1807" viewBox="0 0 620 1807" role="img" aria-labelledby="occ-crypto-title-6-en-True occ-crypto-desc-6-en-True" style="width:100%;height:auto"><title id="occ-crypto-title-6-en-True">The $100 changes address</title><desc id="occ-crypto-desc-6-en-True">Two hypothetical $100 flows. Deposits leave Bank A but reappear at B or C. Totals unchanged under these assumptions, with changed location and composition.</desc><defs><marker id="occ-crypto-a71d3c0-6-en-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-signal, #5eead4)"/></marker><marker id="occ-crypto-aefb879-6-en-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-amber, #f5b13d)"/></marker><marker id="occ-crypto-af19c90-6-en-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-down, #ff4d87)"/></marker><marker id="occ-crypto-a9fc6f2-6-en-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-topic-blue, #7aa2f7)"/></marker><marker id="occ-crypto-aa9b9c7-6-en-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-muted, #8b909b)"/></marker></defs><rect width="620" height="1807" fill="var(--color-ink, #0c0d10)"/><text x="44.00" y="45.00" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">l0g  /  FINANCE &amp; POWER</text><text x="576.00" y="45.00" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="end">06</text><text x="44.00" y="101.00" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">The $100 changes address</text><text x="44.00" y="140.42" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Two hypothetical examples. The customer receives</text><text x="44.00" y="169.17" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">100 one-dollar tokens.</text><text x="44.00" y="224.92" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">A / RESERVES KEPT ON DEPOSIT</text><rect x="44" y="256.41999999999996" width="532" height="125" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="66.00" y="295.42" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="var(--color-down, #ff4d87)" text-anchor="start">BANK A · ORIGINAL CUSTOMER</text><text x="66.00" y="352.42" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">−$100 deposit</text><path d="M310 387.41999999999996 V428.41999999999996" fill="none" stroke="var(--color-amber, #f5b13d)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#occ-crypto-aefb879-6-en-True)"/><text x="338.00" y="413.42" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="var(--color-amber, #f5b13d)" text-anchor="start">$100</text><rect x="44" y="446.41999999999996" width="532" height="125" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="66.00" y="485.42" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">BANK B · ISSUER</text><text x="66.00" y="542.42" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">+$100 deposit</text><rect x="44" y="594.42" width="532" height="174" rx="12" fill="var(--color-surface, #121419)"/><text x="66.00" y="638.42" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Net change in deposits: $0</text><text x="66.00" y="681.17" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">The issuer keeps its reserve as a deposit at</text><text x="66.00" y="711.17" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">B.</text><text x="44.00" y="834.42" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">B / BUYING AN EXISTING SECURITY</text><rect x="44" y="865.92" width="532" height="125" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="66.00" y="904.92" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="var(--color-down, #ff4d87)" text-anchor="start">BANK A · ORIGINAL CUSTOMER</text><text x="66.00" y="961.92" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">−$100 deposit</text><path d="M310 996.92 V1037.92" fill="none" stroke="var(--color-amber, #f5b13d)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#occ-crypto-aefb879-6-en-True)"/><text x="338.00" y="1022.92" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="var(--color-amber, #f5b13d)" text-anchor="start">$100</text><rect x="44" y="1055.92" width="532" height="125" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="66.00" y="1094.92" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">BANK B · ISSUER</text><text x="66.00" y="1151.92" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">$0 after transit</text><path d="M310 1186.92 V1227.92" fill="none" stroke="var(--color-amber, #f5b13d)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#occ-crypto-aefb879-6-en-True)"/><text x="338.00" y="1212.92" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="var(--color-amber, #f5b13d)" text-anchor="start">$100</text><rect x="44" y="1245.92" width="532" height="125" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="66.00" y="1284.92" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="start">BANK C · NONBANK SELLER</text><text x="66.00" y="1341.92" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">+$100 deposit</text><rect x="44" y="1393.92" width="532" height="174" rx="12" fill="var(--color-surface, #121419)"/><text x="66.00" y="1437.92" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Net change in deposits: $0</text><text x="66.00" y="1480.67" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">The seller holds the deposit at C. The issuer</text><text x="66.00" y="1510.67" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">holds the security.</text><line x1="44" y1="1607.92" x2="576" y2="1607.92" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2" opacity="1"/><text x="44.00" y="1645.92" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Mechanism source: Federal Reserve, FEDS Notes, Dec 17,</text><text x="44.00" y="1670.92" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">2025 (S25).</text><text x="44.00" y="1706.92" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">l0g calculations. Case B: security bought from a nonbank seller</text><text x="44.00" y="1729.72" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">in the secondary market. Changes are in deposits, excluding</text><text x="44.00" y="1752.52" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">fees. Other counterparties and new issuance produce different</text><text x="44.00" y="1775.32" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">entries.</text></svg>