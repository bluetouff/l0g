<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1157" viewBox="0 0 1120 1157" role="img" aria-labelledby="occ-crypto-title-3-en-False occ-crypto-desc-3-en-False" style="width:100%;height:auto"><title id="occ-crypto-title-3-en-False">Custody already has a place</title><desc id="occ-crypto-desc-3-en-False">Proportional bar of $6.8 trillion: $5.2 trillion fiduciary and $1.6 trillion custody/safekeeping as of September 30, 2025.</desc><defs><marker id="occ-crypto-a71d3c0-3-en-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-signal, #5eead4)"/></marker><marker id="occ-crypto-aefb879-3-en-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-amber, #f5b13d)"/></marker><marker id="occ-crypto-af19c90-3-en-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-down, #ff4d87)"/></marker><marker id="occ-crypto-a9fc6f2-3-en-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-topic-blue, #7aa2f7)"/></marker><marker id="occ-crypto-aa9b9c7-3-en-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-muted, #8b909b)"/></marker></defs><rect width="1120" height="1157" fill="var(--color-ink, #0c0d10)"/><text x="44.00" y="45.00" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">l0g  /  FINANCE &amp; POWER</text><text x="1076.00" y="45.00" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="end">03</text><text x="44.00" y="109.00" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Custody already has a place</text><text x="44.00" y="148.46" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Assets administered by OCC-supervised uninsured national trust banks.</text><text x="44.00" y="269.96" font-family="Arial, Helvetica, sans-serif" font-size="88" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">$6.8tn</text><text x="44.00" y="317.96" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Stock as of September 30, 2025</text><rect x="44" y="387.96" width="789.1764705882354" height="100" rx="0" fill="var(--color-signal, #5eead4)"/><rect x="833.1764705882354" y="387.96" width="242.82352941176464" height="100" rx="0" fill="var(--color-amber, #f5b13d)"/><line x1="44" y1="494.96" x2="44" y2="505.96" stroke="var(--color-muted, #8b909b)" stroke-width="1" opacity="1"/><text x="44.00" y="530.96" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">0</text><line x1="560.0" y1="494.96" x2="560.0" y2="505.96" stroke="var(--color-muted, #8b909b)" stroke-width="1" opacity="1"/><text x="560.00" y="530.96" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="middle">3.4</text><line x1="1076" y1="494.96" x2="1076" y2="505.96" stroke="var(--color-muted, #8b909b)" stroke-width="1" opacity="1"/><text x="1076.00" y="530.96" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="end">$6.8tn</text><rect x="44" y="572.96" width="666" height="219" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><rect x="44" y="592.96" width="5" height="175" rx="0" fill="var(--color-signal, #5eead4)"/><text x="70.00" y="636.96" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">$5.2tn</text><text x="70.00" y="681.96" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Fiduciary accounts</text><text x="70.00" y="722.96" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">76.5% of administered assets</text><rect x="734" y="572.96" width="342" height="219" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><rect x="734" y="592.96" width="5" height="175" rx="0" fill="var(--color-amber, #f5b13d)"/><text x="758.00" y="634.96" font-family="Arial, Helvetica, sans-serif" font-size="41" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">$1.6tn</text><text x="758.00" y="678.96" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Custody / safekeeping</text><text x="758.00" y="750.96" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">23.5% of the total</text><rect x="44" y="834.96" width="1032" height="180" rx="12" fill="var(--color-surface, #121419)"/><text x="70.00" y="873.96" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">THE CORRECT SCOPE</text><text x="70.00" y="925.96" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">All administered assets within this bank category.</text><text x="70.00" y="967.96" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Distinct from deposits, banks’ own assets and the crypto-only market.</text><line x1="44" y1="1054.96" x2="1076" y2="1054.96" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2" opacity="1"/><text x="44.00" y="1090.96" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Source : OCC, Conditional Approval 1358, note 7 (S15).</text><text x="44.00" y="1125.46" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Nominal US dollars. Shares calculated as 5.2 / 6.8 and 1.6 / 6.8, rounded to 0.1 percentage point.</text></svg>