$.</text><rect x="44" y="900.96" width="1032" height="179" rx="12" fill="var(--color-surface, #121419)" stroke="var(--color-amber, #f5b13d)" stroke-width="2"/><text x="71.00" y="938.96" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">LIQUIDITÉ SUPPLÉMENTAIRE, SANS DOUBLE COMPTAGE</text><text x="72.00" y="1021.96" font-family="Arial, Helvetica, sans-serif" font-size="57" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">180</text><text x="214.00" y="997.96" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">jours de dépenses d’arrêt ordonné</text><text x="72.00" y="1061.96" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Montant en dollars non publié dans la décision.</text><line x1="44" y1="1119.96" x2="1076" y2="1119.96" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2" opacity="1"/><text x="44.00" y="1155.96" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Source : OCC, Corporate Decision 1366, p. 8, conditions 4–5 (S13).</text><text x="44.00" y="1190.46" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Conditions pour les trois premières années. Barres : exemples calculés, pas des soldes observés. La part verte est incluse :</text><text x="44.00" y="1212.06" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">capital et liquidité ne s’additionnent pas.</text></svg>