" y="967.96" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">À distinguer des dépôts, du bilan propre et du seul marché crypto.</text><line x1="44" y1="1054.96" x2="1076" y2="1054.96" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2" opacity="1"/><text x="44.00" y="1090.96" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Source : OCC, Conditional Approval 1358, note 7 (S15).</text><text x="44.00" y="1125.46" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Milliards de dollars nominaux. Parts calculées : 5 200 / 6 800 et 1 600 / 6 800, arrondies à 0,1 point.</text></svg>