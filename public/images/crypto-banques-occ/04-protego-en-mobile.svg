<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1529" viewBox="0 0 620 1529" role="img" aria-labelledby="occ-crypto-title-4-en-True occ-crypto-desc-4-en-True" style="width:100%;height:auto"><title id="occ-crypto-title-4-en-True">Capital and liquidity: two tests</title><desc id="occ-crypto-desc-4-en-True">At hypothetical capital levels of $15m, $20m or $30m, minimum liquid assets are $7.5m, $10m or $15m. A separate liquidity requirement covers 180 days of wind-down expenses.</desc><defs><marker id="occ-crypto-a71d3c0-4-en-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-signal, #5eead4)"/></marker><marker id="occ-crypto-aefb879-4-en-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-amber, #f5b13d)"/></marker><marker id="occ-crypto-af19c90-4-en-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-down, #ff4d87)"/></marker><marker id="occ-crypto-a9fc6f2-4-en-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-topic-blue, #7aa2f7)"/></marker><marker id="occ-crypto-aa9b9c7-4-en-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-muted, #8b909b)"/></marker></defs><rect width="620" height="1529" fill="var(--color-ink, #0c0d10)"/><text x="44.00" y="45.00" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">l0g  /  FINANCE &amp; POWER</text><text x="576.00" y="45.00" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="end">04</text><text x="44.00" y="101.00" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Capital and liquidity: two tests</text><text x="44.00" y="140.42" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Protego / National Digital Trust Company · February</text><text x="44.00" y="169.17" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">13, 2026 conditions.</text><rect x="44" y="202.92" width="532" height="131" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="67.00" y="243.92" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">TIER 1 CAPITAL: AT LEAST $15M</text><text x="67.00" y="282.42" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Liquidity: the greater of 50% of capital or</text><text x="67.00" y="311.17" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">$7.5m.</text><text x="44.00" y="399.92" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">THREE HYPOTHETICAL CAPITAL LEVELS</text><text x="44.00" y="485.92" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Test capital: $15m</text><rect x="44" y="510.91999999999996" width="266.0" height="59" rx="0" fill="var(--color-surface-2, #171a20)" stroke="var(--color-muted, #8b909b)" stroke-width="2"/><rect x="44" y="510.91999999999996" width="133.0" height="59" rx="0" fill="var(--color-signal, #5eead4)"/><t