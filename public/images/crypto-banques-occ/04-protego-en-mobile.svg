ily="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">days of wind-down expenses</text><text x="68.00" y="1252.17" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">No double counting. Dollar amount not</text><text x="68.00" y="1280.92" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">published.</text><line x1="44" y1="1352.92" x2="576" y2="1352.92" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2" opacity="1"/><text x="44.00" y="1390.92" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Source : OCC, Corporate Decision 1366, p. 8, conditions</text><text x="44.00" y="1415.92" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">4–5 (S13).</text><text x="44.00" y="1451.92" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Conditions for the first three years. Bars are calculated</text><text x="44.00" y="1474.72" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">examples, not observed balances. Teal is an included share:</text><text x="44.00" y="1497.52" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">do not add capital and liquidity.</text></svg>