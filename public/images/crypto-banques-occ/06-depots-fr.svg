<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1223" viewBox="0 0 1120 1223" role="img" aria-labelledby="occ-crypto-title-6-fr-False occ-crypto-desc-6-fr-False" style="width:100%;height:auto"><title id="occ-crypto-title-6-fr-False">Les 100 dollars changent d’adresse</title><desc id="occ-crypto-desc-6-fr-False">Deux parcours hypothétiques de 100 dollars. Les dépôts quittent la banque A mais réapparaissent chez B ou C. Total inchangé dans ces hypothèses ; composition et localisation modifiées.</desc><defs><marker id="occ-crypto-a71d3c0-6-fr-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-signal, #5eead4)"/></marker><marker id="occ-crypto-aefb879-6-fr-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-amber, #f5b13d)"/></marker><marker id="occ-crypto-af19c90-6-fr-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-down, #ff4d87)"/></marker><marker id="occ-crypto-a9fc6f2-6-fr-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-topic-blue, #7aa2f7)"/></marker><marker id="occ-crypto-aa9b9c7-6-fr-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-muted, #8b909b)"/></marker></defs><rect width="1120" height="1223" fill="var(--color-ink, #0c0d10)"/><text x="44.00" y="45.00" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">l0g  /  FINANCE &amp; POUVOIR</text><text x="1076.00" y="45.00" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="end">06</text><text x="44.00" y="109.00" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Les 100 dollars changent d’adresse</text><text x="44.00" y="148.46" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Deux exemples hypothétiques. Le client reçoit 100 jetons à un dollar.</text><text x="44.00" y="202.96" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">A / RÉSERVES CONSERVÉES EN DÉPÔT</text><rect x="44" y="247.95999999999998" width="312" height="210" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="66.00" y="285.96" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="var(--color-down, #ff4d87)" text-anchor="start">BANQUE A</text><text x="66.00" y="325.96" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Client initial</text><text x="66.00" y="412.96" font-family="Arial, Helvetica, sans-serif" font-size="41" font-weight="700" fill="var(--color-down, #ff4d87)" text-anchor="start">−100 $</text><rect x="404" y="247.95999999999998" width="312" height="210" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><text x="426.00" y="285.96" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">BANQUE B</text><text x="426.00" y="325.96" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Émetteur du</text><text x="426.00" y="357.21" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">stablecoin</text><text x="426.00" y="412.96" font-family="Arial, Helvetica, sans-serif" font-size="41" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">+100 $</text><path d="M365 342.96 H390" fill="none" stroke="var(--color-amber, #f5b13d)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#occ-crypto-aefb879-6-fr-False)"/><text x="357.00" y="235.96" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="var(--color-amber, #f5b13d)" text-anchor="middle">100 $</text><rect x="764" y="247.95999999999998" width="312" height="210" rx="12" fill="var(--color-surface, #121419)"/><text x="786.00" y="287.96" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">RÉSERVE DE L’ÉMETTEUR</text><text x="786.00" y="351.96" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Un dépôt chez B</text><rect x="44" y="492.96" width="1032" height="114" rx="12" fill="var(--color-surface, #121419)"/><text x="68.00" y="535.96" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Dépôts du système : variation nette = 0 $</text><text x="68.00" y="573.96" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">A perd le dépôt ; B reçoit un dépôt au nom de l’émetteur.</text><text x="44.00" y="655.96" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">B / ACHAT D’UN TITRE DÉJÀ EN CIRCULATION</text><rect x="44" y="700.96" width="312" height="210" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/>