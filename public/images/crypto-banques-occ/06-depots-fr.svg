s variations portent sur les dépôts, hors</text><text x="44.00" y="1192.06" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">frais. Autres contreparties et émissions nouvelles : écritures différentes.</text></svg>