<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1408" viewBox="0 0 620 1408" role="img" aria-labelledby="occ-crypto-title-3-en-True occ-crypto-desc-3-en-True" style="width:100%;height:auto"><title id="occ-crypto-title-3-en-True">Custody already has a place</title><desc id="occ-crypto-desc-3-en-True">Proportional bar of $6.8 trillion: $5.2 trillion fiduciary and $1.6 trillion custody/safekeeping as of September 30, 2025.</desc><defs><marker id="occ-crypto-a71d3c0-3-en-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-signal, #5eead4)"/></marker><marker id="occ-crypto-aefb879-3-en-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-amber, #f5b13d)"/></marker><marker id="occ-crypto-af19c90-3-en-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-down, #ff4d87)"/></marker><marker id="occ-crypto-a9fc6f2-3-en-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-topic-blue, #7aa2f7)"/></marker><marker id="occ-crypto-aa9b9c7-3-en-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-muted, #8b909b)"/></marker></defs><rect width="620" height="1408" fill="var(--color-ink, #0c0d10)"/><text x="44.00" y="45.00" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">l0g  /  FINANCE &amp; POWER</text><text x="576.00" y="45.00" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="end">03</text><text x="44.00" y="101.00" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Custody already has a place</text><text x="44.00" y="140.42" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Assets administered by OCC-supervised uninsured</text><text x="44.00" y="169.17" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">national trust banks.</text><text x="44.00" y="268.92" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">$6.8tn</text><text x="44.00" y="316.92" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Stock as of September 30, 2025</text><rect x="44" y="382.91999999999996" width="406.82352941176475" height="100" rx="0" fill="var(--color-signal, #5eead4)"/><rect x="450.82352941176475" y="382.91999999999996" width="125.17647058823525" height="100" rx="0" fill="var(--color-amber, #f5b13d)"/><line x1="44" y1="489.91999999999996" x2="44" y2="500.91999999999996" stroke="var(--color-muted, #8b909b)" stroke-width="1" opacity="1"/><text x="44.00" y="525.92" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">0</text><line x1="310.0" y1="489.91999999999996" x2="310.0" y2="500.91999999999996" stroke="var(--color-muted, #8b909b)" stroke-width="1" opacity="1"/><text x="310.00" y="525.92" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="middle">3.4</text><line x1="576" y1="489.91999999999996" x2="576" y2="500.91999999999996" stroke="var(--color-muted, #8b909b)" stroke-width="1" opacity="1"/><text x="576.00" y="525.92" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="end">$6.8tn</text><rect x="44" y="577.92" width="532" height="205" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><rect x="44" y="597.92" width="5" height="165" rx="0" fill="var(--color-signal, #5eead4)"/><text x="68.00" y="641.92" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="var(--color-signal, #5eead4)" text-anchor="start">$5.2tn</text><text x="68.00" y="687.92" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Fiduciary accounts</text><text x="68.00" y="745.92" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">76.5% of the total</text><rect x="44" y="805.92" width="532" height="205" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2"/><rect x="44" y="825.92" width="5" height="165" rx="0" fill="var(--color-amber, #f5b13d)"/><text x="68.00" y="869.92" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">$1.6tn</text><text x="68.00" y="915.92" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Custody / safekeeping</text><text x="68.00" y="973.92" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">23.5% of the total</text><rect x="44" y="1033.92" width="532" height="206" rx="12" fill="var(--color-surface, #121419)"/><text x="67.00" y="1074.92" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">THE CORRECT SCOPE</text><text x="67.00" y="1120.92" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">All administered assets. Distinct from</text><text x="67.00" y="1153.42" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">deposits, banks’ own assets and the</text><text x="67.00" y="1185.92" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">crypto-only market.</text><line x1="44" y1="1279.92" x2="576" y2="1279.92" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2" opacity="1"/><text x="44.00" y="1317.92" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Source : OCC, Conditional Approval 1358, note 7 (S15).</text><text x="44.00" y="1353.92" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Nominal US dollars. Shares calculated as 5.2 / 6.8 and 1.6 /</text><text x="44.00" y="1376.72" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">6.8, rounded to 0.1 percentage point.</text></svg>