"49" font-weight="700" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="start">3 500</text><line x1="308" y1="467.96" x2="308" y2="657.96" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2" opacity="1"/><text x="339.00" y="491.96" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">U.S. Army → UMAC</text><text x="339.00" y="534.96" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="start">Moteurs commandés, selon UMAC</text><text x="339.00" y="575.71" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Programme A.B.E. de la 101e division aéroportée.</text><text x="339.00" y="614.46" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Valeur financière non publiée dans le communiqué.</text><rect x="44" y="705.96" width="1032" height="238" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-muted, #8b909b)" stroke-width="2" stroke-dasharray="8 6"/><text x="67.00" y="743.96" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">PERSPECTIVE 2026</text><text x="67.00" y="829.96" font-family="Arial, Helvetica, sans-serif" font-size="49" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">20 000</text><line x1="308" y1="729.96" x2="308" y2="919.96" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2" opacity="1"/><text x="339.00" y="753.96" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">U.S. Army · perspective</text><text x="339.00" y="796.96" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">Composants envisagés</text><text x="339.00" y="837.71" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Incluent des moteurs, mais ne sont pas un nombre de drones.</text><text x="339.00" y="876.46" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Déclaration prospective du 15 octobre 2025 ; exécution non établie ici.</text><line x1="44" y1="1028.9" x2="1076" y2="1028.9" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2" opacity="1"/><text x="44.00" y="1064.90" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Sources : S13, S14, S17 · annonces de 2025</text><text x="44.00" y="1099.40" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Ces volumes et montants ne s’additionnent pas en un contrat unique.</text></svg>