<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1130" viewBox="0 0 1120 1130" role="img" aria-labelledby="title-4-en-False desc-4-en-False" style="width:100%;height:auto"><title id="title-4-en-False">Three disclosures to keep separate</title><desc id="desc-4-en-False">$12.8m Strategic Logix order; 3,500 motors announced for the Army; 20,000 prospective components.</desc><defs><marker id="a71d3c0-4-en-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-signal, #5eead4)"/></marker><marker id="aefb879-4-en-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-amber, #f5b13d)"/></marker><marker id="af19c90-4-en-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-down, #ff4d87)"/></marker><marker id="a9fc6f2-4-en-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-topic-blue, #7aa2f7)"/></marker><marker id="aa9b9c7-4-en-False" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-muted, #8b909b)"/></marker></defs><rect width="1120" height="1130" fill="var(--color-ink, #0c0d10)"/><line x1="44" y1="140" x2="44" y2="1040" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="0.45" opacity="0.28"/><line x1="130" y1="140" x2="130" y2="1040" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="0.45" opacity="0.28"/><line x1="216" y1="140" x2="216" y2="1040" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="0.45" opacity="0.28"/><line x1="302" y1="140" x2="302" y2="1040" stroke="var(--color-line-strong, rgba(255, 255, 255, 