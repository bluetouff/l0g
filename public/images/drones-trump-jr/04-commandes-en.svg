nchor="start">Customer, unit and status determine what each claim establishes.</text><rect x="44" y="181.95999999999998" width="1032" height="238" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-amber, #f5b13d)" stroke-width="2"/><text x="67.00" y="219.96" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">30.09.2025</text><text x="67.00" y="305.96" font-family="Arial, Helvetica, sans-serif" font-size="49" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">$12.8m</text><line x1="308" y1="205.95999999999998" x2="308" y2="395.96" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2" opacity="1"/><text x="339.00" y="229.96" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Strategic Logix → UMAC</text><text x="339.00" y="272.96" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">Industrial order</text><text x="339.00" y="313.71" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">More than 160,000 components for RRSL systems.</text><text x="339.00" y="352.46" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">A private customer is named. The upstream public award remains to be</text><text x="339.00" y="378.71" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">traced.</text><rect x="44" y="443.96" width="1032" height="238" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-topic-blue, #7aa2f7)" stroke-width="2"/><text x="67.00" y="481.96" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="start">15.10.2025</text><text x="67.00" y="567.96" font-family="Arial, Helvetica, sans-serif" font-size="49" font-weight="700" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="start">3,500</text><line x1="308" y1="467.96" x2="308" y2="657.96" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2" opacity="1"/><text x="339.00" y="491.96" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">U.S. Army → UMAC</text><text x="339.00" y="534.96" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="start">Motors ordered, according to UMAC</text><text x="339.00" y="575.71" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">The 101st Airborne Division’s A.B.E. programme.</text><text x="339.00" y="614.46" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Financial value not disclosed in the release.</text><rect x="44" y="705.96" width="1032" height="238" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-muted, #8b909b)" stroke-width="2" stroke-dasharray="8 6"/><text x="67.00" y="743.96" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">2026 EXPECTATION</text><text x="67.00" y="829.96" font-family="Arial, Helvetica, sans-serif" font-size="49" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">20,000</text><line x1="308" y1="729.96" x2="308" y2="919.96" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2" opacity="1"/><text x="339.00" y="753.96" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">U.S. Army · prospective</text><text x="339.00" y="796.96" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">Components contemplated</text><text x="339.00" y="837.71" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Include motors, but are not a count of drones.</text><text x="339.00" y="876.46" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Forward-looking statement of Oct 15, 2025; execution not established</text><text x="339.00" y="902.71" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">here.</text><line x1="44" y1="1028.9" x2="1076" y2="1028.9" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2" opacity="1"/><text x="44.00" y="1064.90" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Sources: S13, S14, S17 · 2025 announcements</text><text x="44.00" y="1099.40" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">These quantities and amounts do not add up to a single contract.</text></svg>