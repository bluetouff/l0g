 0.20))" stroke-width="0.45" opacity="0.28"/><line x1="388" y1="140" x2="388" y2="1460" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="0.45" opacity="0.28"/><line x1="474" y1="140" x2="474" y2="1460" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="0.45" opacity="0.28"/><line x1="560" y1="140" x2="560" y2="1460" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="0.45" opacity="0.28"/><text x="44.00" y="45.00" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">l0g  /  ENQUÊTE</text><text x="576.00" y="45.00" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="end">04</text><text x="44.00" y="101.00" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Trois annonces à garder</text><text x="44.00" y="139.42" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">séparées</text><text x="44.00" y="178.84" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Client, unité et statut : le contrat change avec le</text><text x="44.00" y="207.59" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">périmètre.</text><rect x="44" y="241.33999999999997" width="532" height="374" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-amber, #f5b13d)" stroke-width="2"/><text x="66.00" y="280.34" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">30.09.2025</text><text x="66.00" y="343.34" font-family="Arial, Helvetica, sans-serif" font-size="49" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">12,8 M$</text><text x="66.00" y="388.34" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Strategic Logix → UMAC</text><text x="66.00" y="434.34" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Commande industrielle</text><text x="66.00" y="475.59" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Plus de 160 000 composants pour les</text><text x="66.00" y="504.34" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">systèmes RRSL.</text><text x="66.00" y="545.09" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Un client privé est nommé. L’attribution publique en</text><text x="66.00" y="571.34" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">amont reste à retracer.</text><rect x="44" y="639.3399999999999" width="532" height="374" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-topic-blue, #7aa2f7)" stroke-width="2"/><text x="66.00" y="678.34" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="start">15.10.2025</text><text x="66.00" y="741.34" font-family="Arial, Helvetica, sans-serif" font-size="49" font-weight="700" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="start">3 500</text><text x="66.00" y="786.34" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">U.S. Army → UMAC</text><text x="66.00" y="832.34" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Moteurs commandés, selon UMAC</text><text x="66.00" y="873.59" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Programme A.B.E. de la 101e division</text><text x="66.00" y="902.34" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">aéroportée.</text><text x="66.00" y="943.09" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Valeur financière non publiée dans le communiqué.</text><rect x="44" y="1037.34" width="532" height="374" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-muted, #8b909b)" stroke-width="2" stroke-dasharray="8 6"/><text x="66.00" y="1076.34" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">PERSPECTIVE 2026</text><text x="66.00" y="1139.34" font-family="Arial, Helvetica, sans-serif" font-size="49" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">20 000</text><text x="66.00" y="1184.34" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">U.S. Army · perspective</text><text x="66.00" y="1230.34" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Composants envisagés</text><text x="66.00" y="1271.59" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Incluent des moteurs, mais ne sont pas un</text><text x="66.00" y="1300.34" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">nombre de drones.</text><text x="66.00" y="1341.09" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Déclaration prospective du 15 octobre 2025 ;</text><text x="66.00" y="1367.34" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">exécution non établie ici.</text><line x1="44" y1="1443.34" x2="576" y2="1443.34" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2" opacity="1"/><text x="44.00" y="1481.34" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Sources : S13, S14, S17 · annonces de 2025</text><text x="44.00" y="1517.34" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Ces volumes et montants ne s’additionnent pas en un contrat</text><text x="44.00" y="1540.14" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">unique.</text></svg>