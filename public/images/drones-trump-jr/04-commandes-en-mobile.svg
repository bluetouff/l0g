<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1571" viewBox="0 0 620 1571" role="img" aria-labelledby="title-4-en-True desc-4-en-True" style="width:100%;height:auto"><title id="title-4-en-True">Three disclosures to keep separate</title><desc id="desc-4-en-True">$12.8m Strategic Logix order; 3,500 motors announced for the Army; 20,000 prospective components.</desc><defs><marker id="a71d3c0-4-en-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-signal, #5eead4)"/></marker><marker id="aefb879-4-en-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-amber, #f5b13d)"/></marker><marker id="af19c90-4-en-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-down, #ff4d87)"/></marker><marker id="a9fc6f2-4-en-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-topic-blue, #7aa2f7)"/></marker><marker id="aa9b9c7-4-en-True" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="var(--color-muted, #8b909b)"/></marker></defs><rect width="620" height="1571" fill="var(--color-ink, #0c0d10)"/><line x1="44" y1="140" x2="44" y2="1460" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="0.45" opacity="0.28"/><line x1="130" y1="140" x2="130" y2="1460" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="0.45" opacity="0.28"/><line x1="216" y1="140" x2="216" y2="1460" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="0.45" opacity="0.28"/><line x1="302" y1="140" x2="302" y2="1460" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="0.45" opacity="0.28"/><line x1="388" y1="140" x2="388" y2="1460" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="0.45" opacity="0.28"/><line x1="474" y1="140" x2="474" y2="1460" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="0.45" opacity="0.28"/><line x1="560" y1="140" x2="560" y2="1460" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="0.45" opacity="0.28"/><text x="44.00" y="45.00" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">l0g  /  INVESTIGATION</text><text x="576.00" y="45.00" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="end">04</text><text x="44.00" y="101.00" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Three disclosures to keep</text><text x="44.00" y="139.42" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">separate</text><text x="44.00" y="178.84" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Customer, unit and status determine what each</text><text x="44.00" y="207.59" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">claim establishes.</text><rect x="44" y="241.33999999999997" width="532" height="374" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-amber, #f5b13d)" stroke-width="2"/><text x="66.00" y="280.34" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">30.09.2025</text><text x="66.00" y="343.34" font-family="Arial, Helvetica, sans-serif" font-size="49" font-weight="700" fill="var(--color-amber, #f5b13d)" text-anchor="start">$12.8m</text><text x="66.00" y="388.34" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Strategic Logix → UMAC</text><text x="66.00" y="434.34" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Industrial order</text><text x="66.00" y="475.59" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">More than 160,000 components for RRSL</text><text x="66.00" y="504.34" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">systems.</text><text x="66.00" y="545.09" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">A private customer is named. The upstream public</text><text x="66.00" y="571.34" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">award remains to be traced.</text><rect x="44" y="639.3399999999999" width="532" height="374" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-topic-blue, #7aa2f7)" stroke-width="2"/><text x="66.00" y="678.34" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="start">15.10.2025</text><text x="66.00" y="741.34" font-family="Arial, Helvetica, sans-serif" font-size="49" font-weight="700" fill="var(--color-topic-blue, #7aa2f7)" text-anchor="start">3,500</text><text x="66.00" y="786.34" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">U.S. Army → UMAC</text><text x="66.00" y="832.34" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Motors ordered, according to UMAC</text><text x="66.00" y="873.59" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">The 101st Airborne Division’s A.B.E.</text><text x="66.00" y="902.34" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">programme.</text><text x="66.00" y="943.09" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Financial value not disclosed in the release.</text><rect x="44" y="1037.34" width="532" height="374" rx="12" fill="var(--color-surface-2, #171a20)" stroke="var(--color-muted, #8b909b)" stroke-width="2" stroke-dasharray="8 6"/><text x="66.00" y="1076.34" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">2026 EXPECTATION</text><text x="66.00" y="1139.34" font-family="Arial, Helvetica, sans-serif" font-size="49" font-weight="700" fill="var(--color-muted, #8b909b)" text-anchor="start">20,000</text><text x="66.00" y="1184.34" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">U.S. Army · prospective</text><text x="66.00" y="1230.34" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="var(--color-paper, #e7e9ee)" text-anchor="start">Components contemplated</text><text x="66.00" y="1271.59" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Include motors, but are not a count of drones.</text><text x="66.00" y="1312.34" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Forward-looking statement of Oct 15, 2025;</text><text x="66.00" y="1338.59" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">execution not established here.</text><line x1="44" y1="1443.34" x2="576" y2="1443.34" stroke="var(--color-line-strong, rgba(255, 255, 255, 0.20))" stroke-width="2" opacity="1"/><text x="44.00" y="1481.34" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">Sources: S13, S14, S17 · 2025 announcements</text><text x="44.00" y="1517.34" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">These quantities and amounts do not add up to a single</text><text x="44.00" y="1540.14" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="var(--color-muted, #8b909b)" text-anchor="start">contract.</text></svg>