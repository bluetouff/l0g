<title id="reserves05-fr-2-full-wide-title">Des volumes proposés aux contrats</title><desc id="reserves05-fr-2-full-wide-desc">Quatre appels américains appariés à leurs attributions, mars-mai 2026. Plafonds 86, 10, 30 et 92,5 millions ; attributions 45,2, 8,5, 26 et 53,3. Ce ne sont pas des livraisons. Plafonds non additionnables.</desc><style>:root{color-scheme:light;--color-ink:#e7e9ee;--color-surface:#ffffff;--color-surface-2:#eef0f4;--color-line-strong:rgba(12, 13, 16, 0.26);--color-paper:#1b1d23;--color-muted:#4d5461;--color-signal:#0b5f58;--color-accent:#a50f4d;--color-amber:#92400e;--color-topic-blue:#1d4ed8}@media(prefers-color-scheme:dark){:root{color-scheme:dark;--color-ink:#0c0d10;--color-surface:#121419;--color-surface-2:#171a20;--color-line-strong:rgba(255, 255, 255, 0.20);--color-paper:#e7e9ee;--color-muted:#8b909b;--color-signal:#5eead4;--color-accent:#ff4d87;--color-amber:#f5b13d;--color-topic-blue:#7aa2f7}}</style><metadata>{"edition": "2026-10-03", "sources": [{"id": "S07", "publisher": "US Department of Energy", "title": "Energy Department Initiates Strategic Petroleum Reserve Emergency Exchange to Stabilize Global Oil Supply", "url": "https://www.energy.gov/articles/energy-department-initiates-strategic-petroleum-reserve-emergency-exchange-stabilize", "reference_period": "Premier appel d’échange de mars 2026"}, {"id": "S08", "publisher": "US Department of Energy", "title": "Energy Department Begins Delivering SPR Barrels at Record Speeds", "url": "https://www.energy.gov/hgeo/articles/energy-department-begins-delivering-spr-barrels-record-speeds", "reference_period": "Attributions et premier départ annoncés le 20 mars 2026"}, {"id": "S09", "publisher": "US Department of Energy", "title": "Energy Department Initiates Additional Strategic Petroleum Reserve Emergency Exchange", "url": "https://www.energy.gov/hgeo/articles/energy-department-initiates-additional-strategic-petroleum-reserve-emergency-exchange", "reference_period": "Appel du 1er avril 2026"}, {"id": "S10", "publisher": "US Department of Energy", "title": "Energy Department Awards Contracts for 8.5 Million Barrels from SPR in Second Phase of Emergency Exchange", "url": "https://www.energy.gov/hgeo/opr/articles/energy-department-awards-contracts-85-million-barrels-spr-second-phase-emergency", "reference_period": "Attribution du 10 avril 2026"}, {"id": "S11", "publisher": "US Department of Energy", "title": "Energy Department Continues Initiating Strategic Petroleum Reserve Emergency Exchange", "url": "https://www.energy.gov/hgeo/opr/articles/energy-department-continues-initiating-strategic-petroleum-reserve-emergency", "reference_period": "Appel du 9 avril 2026"}, {"id": "S12", "publisher": "US Department of Energy", "title": "Energy Department Awards New Contracts from the Strategic Petroleum Reserve, Advancing Emergency Exchange", "url": "https://www.energy.gov/hgeo/opr/articles/energy-department-awards-new-contracts-strategic-petroleum-reserve-advancing", "reference_period": "Attribution du 17 avril 2026"}, {"id": "S13", "publisher": "US Department of Energy", "title": "Energy Department Issues RFP to Continue Swift Execution of President Trump’s 172-Million-Barrel SPR Exchange", "url": "https://www.energy.gov/hgeo/opr/articles/energy-department-issues-rfp-continue-swift-execution-president-trumps-172", "reference_period": "Appel du 30 avril 2026"}, {"id": "S14", "publisher": "US Department of Energy", "title": "Energy Department Awards Contracts from the Strategic Petroleum Reserve, Advancing President Trump’s Historic Emergency Exchange", "url": "https://www.energy.gov/hgeo/opr/articles/energy-department-awards-contracts-strategic-petroleum-reserve-advancing", "reference_period": "Attribution du 11 mai et bilan déclaré à cette date"}], "convention": "Quatre appels américains appariés à leurs attributions, mars-mai 2026. Plafonds 86, 10, 30 et 92,5 millions ; attributions 45,2, 8,5, 26 et 53,3. Ce ne sont pas des livraisons. Plafonds non additionnables."}</metadata>
