<text x="98" y="627" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="var(--color-paper)" text-anchor="middle">Public</text>
<text x="98" y="649" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="var(--color-paper)" text-anchor="middle">reserve</text>
<text x="302" y="638" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="var(--color-signal)" text-anchor="middle">Borrower</text>
<path d="M177,631 L221,631" fill="none" stroke="var(--color-signal)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#reserves05-en-1-full-mobile-t)" />
<text x="200" y="585" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="var(--color-signal)" text-anchor="middle">OIL</text>
<path d="M302,665 L302,719 L98,719 L98,670" fill="none" stroke="var(--color-amber)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#reserves05-en-1-full-mobile-a)" />
<text x="34" y="753" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="var(--color-amber)" text-anchor="start">Return of principal + extra oil</text>
