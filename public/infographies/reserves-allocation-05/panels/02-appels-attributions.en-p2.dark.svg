<title id="reserves05-en-2-panel2-dark-title">Two April solicitations and their awards</title><desc id="reserves05-en-2-panel2-dark-desc">1 April solicitation: ceiling 10.0, 10 April award 8.5, or 85.0%. 9 April solicitation: ceiling 30.0, 17 April award 26.0, or 86.7%. Million barrels, common scale.</desc><metadata>{"edition": "2026-10-03", "sources": [{"id": "S07", "publisher": "US Department of Energy", "title": "Energy Department Initiates Strategic Petroleum Reserve Emergency Exchange to Stabilize Global Oil Supply", "url": "https://www.energy.gov/articles/energy-department-initiates-strategic-petroleum-reserve-emergency-exchange-stabilize", "reference_period": "Premier appel d’échange de mars 2026"}, {"id": "S08", "publisher": "US Department of Energy", "title": "Energy Department Begins Delivering SPR Barrels at Record Speeds", "url": "https://www.energy.gov/hgeo/articles/energy-department-begins-delivering-spr-barrels-record-speeds", "reference_period": "Attributions et premier départ annoncés le 20 mars 2026"}, {"id": "S09", "publisher": "US Department of Energy", "title": "Energy Department Initiates Additional Strategic Petroleum Reserve Emergency Exchange", "url": "https://www.energy.gov/hgeo/articles/energy-department-initiates-additional-strategic-petroleum-reserve-emergency-exchange", "reference_period": "Appel du 1er avril 2026"}, {"id": "S10", "publisher": "US Department of Energy", "title": "Energy Department Awards Contracts for 8.5 Million Barrels from SPR in Second Phase of Emergency Exchange", "url": "https://www.energy.gov/hgeo/opr/articles/energy-department-awards-contracts-85-million-barrels-spr-second-phase-emergency", "reference_period": "Attribution du 10 avril 2026"}, {"id": "S11", "publisher": "US Department of Energy", "title": "Energy Department Continues Initiating Strategic Petroleum Reserve Emergency Exchange", "url": "https://www.energy.gov/hgeo/opr/articles/energy-department-continues-initiating-strategic-petroleum-reserve-emergency", "reference_period": "Appel du 9 avril 2026"}, {"id": "S12", "publisher": "US Department of Energy", "title": "Energy Department Awards New Contracts from the Strategic Petroleum Reserve, Advancing Emergency Exchange", "url": "https://www.energy.gov/hgeo/opr/articles/energy-department-awards-new-contracts-strategic-petroleum-reserve-advancing", "reference_period": "Attribution du 17 avril 2026"}, {"id": "S13", "publisher": "US Department of Energy", "title": "Energy Department Issues RFP to Continue Swift Execution of President Trump’s 172-Million-Barrel SPR Exchange", "url": "https://www.energy.gov/hgeo/opr/articles/energy-department-issues-rfp-continue-swift-execution-president-trumps-172", "reference_period": "Appel du 30 avril 2026"}, {"id": "S14", "publisher": "US Department of Energy", "title": "Energy Department Awards Contracts from the Strategic Petroleum Reserve, Advancing President Trump’s Historic Emergency Exchange", "url": "https://www.energy.gov/hgeo/opr/articles/energy-department-awards-contracts-strategic-petroleum-reserve-advancing", "reference_period": "Attribution du 11 mai et bilan déclaré à cette date"}], "convention": "Four US solicitations matched to awards, March–May 2026. Ceilings: 86, 10, 30 and 92.5 million; awards: 45.2, 8.5, 26 and 53.3. These are not deliveries. Successive ceilings are not additive."}</metadata>
