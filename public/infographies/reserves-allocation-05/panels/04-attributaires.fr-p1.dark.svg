<title id="reserves05-fr-4-panel1-dark-title">Candidats, offres et trois premiers attributaires</title><desc id="reserves05-fr-4-panel1-dark-desc">Vente SPR annoncée le 9 mars 2023 : 11 entreprises, 119 offres, six attributaires et 26 millions de barils de brut. Marathon reçoit 8,4, Equinor 7,3 et Shell Trading 3,6 millions de barils.</desc><metadata>{"edition": "2026-10-03", "sources": [{"id": "S18", "publisher": "US Department of Energy", "title": "DOE Awards FY23 Congressionally Mandated Sale of Crude Oil from the Strategic Petroleum Reserve", "url": "https://www.energy.gov/ceser/articles/doe-awards-fy23-congressionally-mandated-sale-crude-oil-strategic-petroleum-reserve", "reference_period": "Une vente prescrite par le Congrès, attribution du 9 mars 2023"}], "convention": "Vente américaine prescrite par le Congrès, attribution du 9 mars 2023. 11 entreprises soumettent 119 offres ; six reçoivent 26 millions de barils. Volumes nominatifs ; les deux premiers totalisent 60,4 % de cette seule vente."}</metadata>
