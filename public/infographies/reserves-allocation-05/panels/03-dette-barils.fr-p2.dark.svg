<title id="reserves05-fr-3-panel2-dark-title">Mai : principal, prime et limites du calcul</title><desc id="reserves05-fr-3-panel2-dark-desc">Engagement annoncé le 11 mai 2026 : 53,3 millions de barils attribués, 68,4 à restituer, dont 15,1 de prime, soit 28,3 % du principal. Même échelle. Ratios de quantités non annualisés ; attribution distincte de livraison et retour promis distinct de réception.</desc><metadata>{"edition": "2026-10-03", "sources": [{"id": "S03", "publisher": "US Department of Energy", "title": "SPR Sales and Exchanges", "url": "https://www.energy.gov/hgeo/opr/spr-sales-and-exchanges", "reference_period": "Présentation générale, consultée le 3 octobre 2026"}, {"id": "S08", "publisher": "US Department of Energy", "title": "Energy Department Begins Delivering SPR Barrels at Record Speeds", "url": "https://www.energy.gov/hgeo/articles/energy-department-begins-delivering-spr-barrels-record-speeds", "reference_period": "Attributions et premier départ annoncés le 20 mars 2026"}, {"id": "S14", "publisher": "US Department of Energy", "title": "Energy Department Awards Contracts from the Strategic Petroleum Reserve, Advancing President Trump’s Historic Emergency Exchange", "url": "https://www.energy.gov/hgeo/opr/articles/energy-department-awards-contracts-strategic-petroleum-reserve-advancing", "reference_period": "Attribution du 11 mai et bilan déclaré à cette date"}], "convention": "Deux échanges annoncés par le DOE. Mars : principal attribué 45,2 et prime future 9,8, retour total 55. Mai : 53,3 plus 15,1, retour total 68,4. Millions de barils. Ratios non annualisés ; retours promis, pas reçus."}</metadata>
