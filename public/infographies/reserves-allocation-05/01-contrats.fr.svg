<title id="reserves05-fr-1-full-wide-title">Trois contrats pour libérer un stock</title><desc id="reserves05-fr-1-full-wide-desc">Schéma qualitatif : vente américaine contre paiement ; échange américain contre restitution et prime ; mise à disposition SAGESS avec retour en bac. Flèches sans proportion. Aucun tarif français supposé.</desc><style>:root{color-scheme:light;--color-ink:#e7e9ee;--color-surface:#ffffff;--color-surface-2:#eef0f4;--color-line-strong:rgba(12, 13, 16, 0.26);--color-paper:#1b1d23;--color-muted:#4d5461;--color-signal:#0b5f58;--color-accent:#a50f4d;--color-amber:#92400e;--color-topic-blue:#1d4ed8}@media(prefers-color-scheme:dark){:root{color-scheme:dark;--color-ink:#0c0d10;--color-surface:#121419;--color-surface-2:#171a20;--color-line-strong:rgba(255, 255, 255, 0.20);--color-paper:#e7e9ee;--color-muted:#8b909b;--color-signal:#5eead4;--color-accent:#ff4d87;--color-amber:#f5b13d;--color-topic-blue:#7aa2f7}}</style><metadata>{"edition": "2026-10-03", "sources": [{"id": "S03", "publisher": "US Department of Energy", "title": "SPR Sales and Exchanges", "url": "https://www.energy.gov/hgeo/opr/spr-sales-and-exchanges", "reference_period": "Présentation générale, consultée le 3 octobre 2026"}, {"id": "S04", "publisher": "SAGESS", "title": "Fournir", "url": "https://www.sagess.fr/fr/logistique/constituer-des-stocks-prives-pour-parer-aux-penuries/fournir", "reference_period": "Procédure générale publiée par l’opérateur ; consultation du 3 octobre 2026"}, {"id": "S05", "publisher": "International Energy Agency", "title": "France Oil Security Policy", "url": "https://www.iea.org/articles/france-oil-security-policy", "reference_period": "Évaluation institutionnelle publiée en juin 2022"}, {"id": "S22", "publisher": "Ministère français chargé de l’énergie", "title": "La chaîne pétrolière", "url": "https://www.ecologie.gouv.fr/politiques-publiques/chaine-petroliere", "reference_period": "Description institutionnelle ; données de dates hétérogènes"}], "convention": "Schéma qualitatif : vente américaine contre paiement ; échange américain contre restitution et prime ; mise à disposition SAGESS avec retour en bac. Flèches sans proportion. Aucun tarif français supposé."}</metadata>
