<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 930" role="img" aria-labelledby="ecb2026-2-fr-desktop-full-title ecb2026-2-fr-desktop-full-desc" style="width:100%;height:auto" data-source-composition="complete-original" data-figure="2">
<title id="ecb2026-2-fr-desktop-full-title">Du prêt au règlement interbancaire</title><desc id="ecb2026-2-fr-desktop-full-desc">Exemple fictif de 20 M€. La banque dispose déjà des garanties utilisées pour se refinancer.</desc>
<style>:root{color-scheme:dark;--ecb-ink:#0c0d10;--ecb-surface:#121419;--ecb-surface-2:#171a20;--ecb-paper:#e7e9ee;--ecb-muted:#8b909b;--ecb-signal:#5eead4;--ecb-amber:#f5b13d;--ecb-topic-blue:#7aa2f7;--ecb-line-strong:rgba(255, 255, 255, 0.20)}@media(prefers-color-scheme:light){:root{color-scheme:light;--ecb-ink:#e7e9ee;--ecb-surface:#ffffff;--ecb-surface-2:#eef0f4;--ecb-paper:#1b1d23;--ecb-muted:#4d5461;--ecb-signal:#0b5f58;--ecb-amber:#92400e;--ecb-topic-blue:#1d4ed8;--ecb-line-strong:rgba(12, 13, 16, 0.26)}}</style><defs><marker id="ecb2026-2-fr-desktop-full-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="var(--ecb-signal)"/></marker></defs>
<rect x="0.00" y="0.00" width="1200.00" height="930.00" rx="0" fill="var(--ecb-ink)"/>
<text x="54.00" y="40.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="var(--ecb-paper)" text-anchor="start">l0g</text>
<text x="1146.00" y="38.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="var(--ecb-muted)" text-anchor="end">GARANTIES BANCAIRES / 02</text>
<line x1="54.00" y1="57.00" x2="1146.00" y2="57.00" stroke="var(--ecb-line-strong)" stroke-width="1"/>
<text x="54.00" y="101.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="38" font-weight="700" fill="var(--ecb-paper)" text-anchor="start">Du prêt au règlement interbancaire</text>
<text x="54.00" y="132.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="var(--ecb-muted)" text-anchor="start">Exemple fictif de 20 M€. La banque dispose déjà des garanties utilisées pour se refinancer.</text>
<rect x="54.00" y="164.00" width="472.00" height="222.00" rx="8" fill="var(--ecb-surface)" stroke="var(--ecb-line-strong)" stroke-width="1.2"/>
<circle cx="82" cy="198.0" r="16" fill="var(--ecb-signal)"/>
<text x="82.00" y="204.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="var(--ecb-ink)" text-anchor="middle">1</text>
<text x="112.00" y="205.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="var(--ecb-paper)" text-anchor="start">Le prêt crée le dépôt</text>
<text x="79.00" y="250.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="var(--ecb-paper)" text-anchor="start">Banque A : +20 de créance, +20 de</text>
<text x="79.00" y="277.30" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="var(--ecb-paper)" text-anchor="start">dépôt client.</text>
<text x="79.00" y="358.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="33" font-weight="700" fill="var(--ecb-signal)" text-anchor="start">20 M€</text>
<rect x="674.00" y="164.00" width="472.00" height="222.00" rx="8" fill="var(--ecb-surface)" stroke="var(--ecb-line-strong)" stroke-width="1.2"/>
<circle cx="702" cy="198.0" r="16" fill="var(--ecb-signal)"/>
<text x="702.00" y="204.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="var(--ecb-ink)" text-anchor="middle">2</text>
<text x="732.00" y="205.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="var(--ecb-paper)" text-anchor="start">Le client paie son</text>
<text x="732.00" y="235.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="var(--ecb-paper)" text-anchor="start">fournisseur</text>
<text x="699.00" y="267.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="var(--ecb-paper)" text-anchor="start">Le dépôt quitte A ; le fournisseur est</text>
<text x="699.00" y="294.30" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="var(--ecb-paper)" text-anchor="start">crédité chez B.</text>
<text x="699.00" y="358.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="33" font-weight="700" fill="var(--ecb-signal)" text-anchor="start">20 M€</text>
<rect x="674.00" y="439.00" width="472.00" height="222.00" rx="8" fill="var(--ecb-surface)" stroke="var(--ecb-line-strong)" stroke-width="1.2"/>
<circle cx="702" cy="473.0" r="16" fill="var(--ecb-signal)"/>
<text x="702.00" y="479.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="var(--ecb-ink)" text-anchor="middle">3</text>
<text x="732.00" y="480.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="var(--ecb-paper)" text-anchor="start">A règle B en réserves</text>
<text x="699.00" y="525.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="var(--ecb-paper)" text-anchor="start">Réserves : −20 chez A, +20 chez B. Le</text>
<text x="699.00" y="552.30" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="var(--ecb-paper)" text-anchor="start">prêt reste chez A.</text>
<text x="699.00" y="633.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="33" font-weight="700" fill="var(--ecb-signal)" text-anchor="start">A → B</text>
<rect x="54.00" y="439.00" width="472.00" height="222.00" rx="8" fill="var(--ecb-surface)" stroke="var(--ecb-line-strong)" stroke-width="1.2"/>
<circle cx="82" cy="473.0" r="16" fill="var(--ecb-signal)"/>
<text x="82.00" y="479.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="var(--ecb-ink)" text-anchor="middle">4</text>
<text x="112.00" y="480.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="var(--ecb-paper)" text-anchor="start">A reconstitue sa liquidité</text>
<text x="79.00" y="525.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="var(--ecb-paper)" text-anchor="start">25 de garanties × 80 % = 20 de</text>
<text x="79.00" y="552.30" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="var(--ecb-paper)" text-anchor="start">financement. Dette nouvelle envers la</text>
<text x="79.00" y="579.60" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="var(--ecb-paper)" text-anchor="start">banque centrale.</text>
<text x="79.00" y="633.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="33" font-weight="700" fill="var(--ecb-signal)" text-anchor="start">25 → 20</text>
<path d="M545,276.0 L650,276.0" fill="none" stroke="var(--ecb-signal)" stroke-width="2" marker-end="url(#ecb2026-2-fr-desktop-full-arrow)"/>
<path d="M910,393.0 L910,424.0" fill="none" stroke="var(--ecb-signal)" stroke-width="2" marker-end="url(#ecb2026-2-fr-desktop-full-arrow)"/>
<path d="M650,550.0 L545,550.0" fill="none" stroke="var(--ecb-signal)" stroke-width="2" marker-end="url(#ecb2026-2-fr-desktop-full-arrow)"/>
<text x="54.00" y="723.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="700" fill="var(--ecb-paper)" text-anchor="start">Financement obtenu ≠ fonds propres créés</text>
<text x="54.00" y="759.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="var(--ecb-muted)" text-anchor="start">Décote de 20 % et séquence de paiement : hypothèses pédagogiques.</text>
<line x1="54.00" y1="862.90" x2="1146.00" y2="862.90" stroke="var(--ecb-line-strong)" stroke-width="1"/>
<text x="54.00" y="887.90" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="var(--ecb-muted)" text-anchor="start">Sources : Bank of England [9], BCE [10, 11]. Le prêt peut être refinancé avant ou après le paiement selon les réserves déjà</text>
<text x="54.00" y="910.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="var(--ecb-muted)" text-anchor="start">disponibles. Montants en M€.</text>
</svg>
