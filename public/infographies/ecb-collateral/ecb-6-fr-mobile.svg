<title id="ecb2026-6-fr-mobile-full-title">La même perte, deux marges de sécurité</title><desc id="ecb2026-6-fr-mobile-full-desc">Scénario fictif : la capacité de chaque panier passe de 100 à 90 M€. Les financements déjà utilisés restent constants.</desc>
