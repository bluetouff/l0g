<text x="28.00" y="1111.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="var(--ecb-muted)" text-anchor="start">Source : calculs l0g. La marge libre mesure une capacité de</text>
