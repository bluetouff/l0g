<text x="54.00" y="827.90" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="var(--ecb-muted)" text-anchor="start">Sources : orientations BCE/2026/26 et /27 [2, 3], ECAF [5]. Notes fictives. Ni comparaison historique avant/après, ni garantie</text>
