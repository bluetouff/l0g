<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1180" role="img" aria-labelledby="ecb2026-3-en-mobile-full-title ecb2026-3-en-mobile-full-desc" style="width:100%;height:auto" data-source-composition="complete-original" data-figure="3">
<title id="ecb2026-3-en-mobile-full-title">The selected rating changes coverage</title><desc id="ecb2026-3-en-mobile-full-desc">Fictional category IV bank bond, fixed coupon, 6 years, €100m value. The same future grid is used in both calculations.</desc>
<style>:root{color-scheme:dark;--ecb-ink:#0c0d10;--ecb-surface:#121419;--ecb-surface-2:#171a20;--ecb-paper:#e7e9ee;--ecb-muted:#8b909b;--ecb-signal:#5eead4;--ecb-amber:#f5b13d;--ecb-topic-blue:#7aa2f7;--ecb-line-strong:rgba(255, 255, 255, 0.20)}@media(prefers-color-scheme:light){:root{color-scheme:light;--ecb-ink:#e7e9ee;--ecb-surface:#ffffff;--ecb-surface-2:#eef0f4;--ecb-paper:#1b1d23;--ecb-muted:#4d5461;--ecb-signal:#0b5f58;--ecb-amber:#92400e;--ecb-topic-blue:#1d4ed8;--ecb-line-strong:rgba(12, 13, 16, 0.26)}}</style><defs><marker id="ecb2026-3-en-mobile-full-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="var(--ecb-signal)"/></marker></defs>
<rect x="0.00" y="0.00" width="520.00" height="1180.00" rx="0" fill="var(--ecb-ink)"/>
<text x="28.00" y="40.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="var(--ecb-paper)" text-anchor="start">l0g</text>
<text x="492.00" y="38.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="400" fill="var(--ecb-muted)" text-anchor="end">BANK COLLATERAL / 03</text>
<line x1="28.00" y1="57.00" x2="492.00" y2="57.00" stroke="var(--ecb-line-strong)" stroke-width="1"/>
<text x="28.00" y="98.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="700" fill="var(--ecb-paper)" text-anchor="start">The selected rating</text>
<text x="28.00" y="133.70" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="700" fill="var(--ecb-paper)" text-anchor="start">changes coverage</text>
<text x="28.00" y="164.70" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="var(--ecb-muted)" text-anchor="start">Fictional category IV bank bond, fixed coupon, 6</text>
<text x="28.00" y="189.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="var(--ecb-muted)" text-anchor="start">years, €100m value. The same future grid is used</text>
<text x="28.00" y="213.30" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="var(--ecb-muted)" text-anchor="start">in both calculations.</text>
<rect x="28.00" y="245.30" width="146.00" height="106.00" rx="8" fill="var(--ecb-surface)" stroke="var(--ecb-line-strong)" stroke-width="1.2"/>
<text x="101.00" y="276.30" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="var(--ecb-muted)" text-anchor="middle">Agency A</text>
<text x="101.00" y="324.30" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" font-weight="700" fill="var(--ecb-paper)" text-anchor="middle">A−</text>
<rect x="187.00" y="245.30" width="146.00" height="106.00" rx="8" fill="var(--ecb-surface-2)" stroke="var(--ecb-line-strong)" stroke-width="1.2"/>
<text x="260.00" y="276.30" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="var(--ecb-muted)" text-anchor="middle">Agency B</text>
<text x="260.00" y="324.30" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" font-weight="700" fill="var(--ecb-signal)" text-anchor="middle">BBB+</text>
<rect x="346.00" y="245.30" width="146.00" height="106.00" rx="8" fill="var(--ecb-surface)" stroke="var(--ecb-line-strong)" stroke-width="1.2"/>
<text x="419.00" y="276.30" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="var(--ecb-muted)" text-anchor="middle">Agency C</text>
<text x="419.00" y="324.30" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" font-weight="700" fill="var(--ecb-paper)" text-anchor="middle">BBB</text>
<text x="28.00" y="390.30" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="var(--ecb-paper)" text-anchor="start">Second-best rating: BBB+ → quality</text>
<text x="28.00" y="416.55" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="var(--ecb-paper)" text-anchor="start">step 3</text>
<text x="28.00" y="451.30" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="var(--ecb-paper)" text-anchor="start">Using A− · 12%</text>
<rect x="28.00" y="473.30" width="365.00" height="35.00" rx="0" fill="var(--ecb-surface-2)"/>
<rect x="28.00" y="473.30" width="321.20" height="35.00" rx="0" fill="var(--ecb-signal)"/>
<text x="407.00" y="499.55" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="var(--ecb-paper)" text-anchor="start">88</text>
<text x="28.00" y="577.30" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="var(--ecb-paper)" text-anchor="start">Using BBB+ · 20%</text>
<rect x="28.00" y="599.30" width="365.00" height="35.00" rx="0" fill="var(--ecb-surface-2)"/>
<rect x="28.00" y="599.30" width="292.00" height="35.00" rx="0" fill="var(--ecb-signal)"/>
<text x="407.00" y="625.55" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="var(--ecb-paper)" text-anchor="start">80</text>
<text x="28.00" y="693.30" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="700" fill="var(--ecb-amber)" text-anchor="start">Isolated difference: €8m</text>
<rect x="28.00" y="746.30" width="464.00" height="244.00" rx="8" fill="var(--ecb-surface-2)"/>
<text x="46.00" y="781.30" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="var(--ecb-paper)" text-anchor="start">The single-rating case</text>
<text x="46.00" y="837.30" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" font-weight="700" fill="var(--ecb-amber)" text-anchor="start">BBB− → BB+</text>
<text x="46.00" y="879.30" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="var(--ecb-paper)" text-anchor="start">One notch can cross the general</text>
<text x="46.00" y="906.30" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="var(--ecb-paper)" text-anchor="start">threshold. Coverage becomes zero if the</text>
<text x="46.00" y="933.30" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="var(--ecb-paper)" text-anchor="start">asset becomes ineligible.</text>
<line x1="28.00" y1="1096.00" x2="492.00" y2="1096.00" stroke="var(--ecb-line-strong)" stroke-width="1"/>
<text x="28.00" y="1121.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="var(--ecb-muted)" text-anchor="start">Sources: ECB/2026/26 and /27 [2, 3], ECAF [5]. Fictional</text>
<text x="28.00" y="1140.50" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="var(--ecb-muted)" text-anchor="start">ratings. Not a historical before/after comparison; no</text>
<text x="28.00" y="1160.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="var(--ecb-muted)" text-anchor="start">qualifying public guarantee is assumed.</text>
</svg>
