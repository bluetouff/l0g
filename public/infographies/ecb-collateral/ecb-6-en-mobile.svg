<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1170" role="img" aria-labelledby="ecb2026-6-en-mobile-full-title ecb2026-6-en-mobile-full-desc" style="width:100%;height:auto" data-source-composition="complete-original" data-figure="6">
<title id="ecb2026-6-en-mobile-full-title">The same loss, two different buffers</title><desc id="ecb2026-6-en-mobile-full-desc">Fictional scenario: each pool’s capacity falls from €100m to €90m. Existing borrowing is unchanged.</desc>
