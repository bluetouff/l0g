<text x="28.00" y="40.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="var(--ecb-paper)" text-anchor="start">l0g</text>
<text x="492.00" y="38.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="400" fill="var(--ecb-muted)" text-anchor="end">BANK COLLATERAL / 06</text>
