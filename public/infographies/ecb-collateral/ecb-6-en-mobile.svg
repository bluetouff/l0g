<text x="28.00" y="801.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="var(--ecb-amber)" text-anchor="start">Buffer consumed: 66.7%</text>
<rect x="28.00" y="883.00" width="464.00" height="148.00" rx="8" fill="var(--ecb-surface-2)"/>
<text x="46.00" y="918.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="var(--ecb-paper)" text-anchor="start">New cash need: €12m</text>
<text x="46.00" y="959.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="var(--ecb-paper)" text-anchor="start">A can cover it. B needs €7m elsewhere</text>
<text x="46.00" y="986.30" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="var(--ecb-paper)" text-anchor="start">or must add collateral.</text>
<line x1="28.00" y1="1086.00" x2="492.00" y2="1086.00" stroke="var(--ecb-line-strong)" stroke-width="1"/>
<text x="28.00" y="1111.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="var(--ecb-muted)" text-anchor="start">Source: l0g calculations. Headroom is collateral capacity, not</text>
<text x="28.00" y="1130.50" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="var(--ecb-muted)" text-anchor="start">cash already held. There is no automatic multiplier from</text>
<text x="28.00" y="1150.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="var(--ecb-muted)" text-anchor="start">capacity loss to customer lending.</text>
