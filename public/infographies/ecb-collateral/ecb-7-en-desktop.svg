<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1060" role="img" aria-labelledby="ecb2026-7-en-desktop-full-title ecb2026-7-en-desktop-full-desc" style="width:100%;height:auto" data-source-composition="complete-original" data-figure="7">
<title id="ecb2026-7-en-desktop-full-title">Three separate timetables</title><desc id="ecb2026-7-en-desktop-full-desc">Publication dates, legal implementation and temporary arrangements. Chronological sequence, not a proportional time axis.</desc>
<style>:root{color-scheme:dark;--ecb-ink:#0c0d10;--ecb-surface:#121419;--ecb-surface-2:#171a20;--ecb-paper:#e7e9ee;--ecb-muted:#8b909b;--ecb-signal:#5eead4;--ecb-amber:#f5b13d;--ecb-topic-blue:#7aa2f7;--ecb-line-strong:rgba(255, 255, 255, 0.20)}@media(prefers-color-scheme:light){:root{color-scheme:light;--ecb-ink:#e7e9ee;--ecb-surface:#ffffff;--ecb-surface-2:#eef0f4;--ecb-paper:#1b1d23;--ecb-muted:#4d5461;--ecb-signal:#0b5f58;--ecb-amber:#92400e;--ecb-topic-blue:#1d4ed8;--ecb-line-strong:rgba(12, 13, 16, 0.26)}}</style><defs><marker id="ecb2026-7-en-desktop-full-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="var(--ecb-signal)"/></marker></defs>
<rect x="0.00" y="0.00" width="1200.00" height="1060.00" rx="0" fill="var(--ecb-ink)"/>
<text x="54.00" y="40.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="var(--ecb-paper)" text-anchor="start">l0g</text>
<text x="1146.00" y="38.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="var(--ecb-muted)" text-anchor="end">BANK COLLATERAL / 07</text>
<line x1="54.00" y1="57.00" x2="1146.00" y2="57.00" stroke="var(--ecb-line-strong)" stroke-width="1"/>
<text x="54.00" y="101.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="38" font-weight="700" fill="var(--ecb-paper)" text-anchor="start">Three separate timetables</text>
<text x="54.00" y="132.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="var(--ecb-muted)" text-anchor="start">Publication dates, legal implementation and temporary arrangements. Chronological sequence, not a proportional</text>
<text x="54.00" y="157.65" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="var(--ecb-muted)" text-anchor="start">time axis.</text>
<line x1="64.00" y1="199.65" x2="64.00" y2="874.65" stroke="var(--ecb-line-strong)" stroke-width="3"/>
<circle cx="64" cy="206.65" r="8" fill="var(--ecb-muted)"/>
<text x="107.00" y="214.65" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="var(--ecb-paper)" text-anchor="start">19 Dec 2025</text>
<text x="440.00" y="214.65" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" fill="var(--ecb-muted)" text-anchor="start">FRANCE</text>
<text x="440.00" y="247.65" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="var(--ecb-paper)" text-anchor="start">Banque de France ends its temporary PGE arrangement.</text>
<circle cx="64" cy="338.65" r="8" fill="var(--ecb-muted)"/>
<text x="107.00" y="346.65" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="var(--ecb-paper)" text-anchor="start">22 Sep 2026</text>
<text x="440.00" y="346.65" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" fill="var(--ecb-muted)" text-anchor="start">EUROSYSTEM</text>
<text x="440.00" y="379.65" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="var(--ecb-paper)" text-anchor="start">Guidelines ECB/2026/26 and ECB/2026/27 signed.</text>
<circle cx="64" cy="470.65" r="8" fill="var(--ecb-muted)"/>
<text x="107.00" y="478.65" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="var(--ecb-paper)" text-anchor="start">29 Sep 2026</text>
<text x="440.00" y="478.65" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" fill="var(--ecb-muted)" text-anchor="start">PUBLICATION</text>
<text x="440.00" y="511.65" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="var(--ecb-paper)" text-anchor="start">Guidelines and explanatory announcement released.</text>
<circle cx="64" cy="602.65" r="8" fill="var(--ecb-signal)"/>
<text x="107.00" y="610.65" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="var(--ecb-signal)" text-anchor="start">30 Nov 2026</text>
<text x="440.00" y="610.65" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" fill="var(--ecb-muted)" text-anchor="start">IMPLEMENTATION</text>
<text x="440.00" y="643.65" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="var(--ecb-paper)" text-anchor="start">New rating, haircut and classification rules apply.</text>
<circle cx="64" cy="734.65" r="8" fill="var(--ecb-muted)"/>
<text x="107.00" y="742.65" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="var(--ecb-paper)" text-anchor="start">End-2026</text>
<text x="440.00" y="742.65" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" fill="var(--ecb-muted)" text-anchor="start">GENERAL DEADLINE</text>
<text x="440.00" y="775.65" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="var(--ecb-paper)" text-anchor="start">COVID-guaranteed loans eligible only by temporary</text>
<text x="440.00" y="804.63" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="var(--ecb-paper)" text-anchor="start">exception leave that route.</text>
<circle cx="64" cy="866.65" r="8" fill="var(--ecb-muted)"/>
<text x="107.00" y="874.65" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="var(--ecb-paper)" text-anchor="start">Nov 2027 at earliest</text>
<text x="440.00" y="874.65" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" fill="var(--ecb-muted)" text-anchor="start">PORTFOLIOS</text>
<text x="440.00" y="907.65" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="var(--ecb-paper)" text-anchor="start">Planned integration of non-financial credit claim portfolios</text>
<text x="440.00" y="936.63" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="var(--ecb-paper)" text-anchor="start">into the general framework.</text>
<line x1="54.00" y1="992.90" x2="1146.00" y2="992.90" stroke="var(--ecb-line-strong)" stroke-width="1"/>
<text x="54.00" y="1017.90" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="var(--ecb-muted)" text-anchor="start">Sources: guidelines [2, 3], ECB announcement [1], transition [12], Banque de France [13]. Ending a collateral exception does</text>
<text x="54.00" y="1040.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="var(--ecb-muted)" text-anchor="start">not itself change the customer’s loan contract.</text>
</svg>
