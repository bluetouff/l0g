<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1490" role="img" aria-labelledby="ecb2026-5-fr-mobile-full-title ecb2026-5-fr-mobile-full-desc" style="width:100%;height:auto" data-source-composition="complete-original" data-figure="5">
<title id="ecb2026-5-fr-mobile-full-title">Le titre revient au guichet</title><desc id="ecb2026-5-fr-mobile-full-desc">Une titrisation retenue peut fournir du financement à la banque qui l’a créée. Le statut du titre change sa décote.</desc>
