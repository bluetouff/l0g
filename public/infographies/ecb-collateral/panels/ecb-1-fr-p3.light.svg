<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 790 520 200" role="img" aria-labelledby="ecb2026-1-fr-p3-light-title ecb2026-1-fr-p3-light-desc" style="width:100%;height:auto" data-source-composition="complete-original" data-figure="1" width="520" height="200" data-crop-start="790" data-crop-end="990" data-panel="3">
<title id="ecb2026-1-fr-p3-light-title">Le besoin de garanties supplémentaire</title><desc id="ecb2026-1-fr-p3-light-desc">Hypothèses pédagogiques : prix, décotes, valeur comptable et emprunt fictifs. Aucun taux de ce scénario n’est un ancien barème officiel. Le besoin de garanties supplémentaire.</desc>
