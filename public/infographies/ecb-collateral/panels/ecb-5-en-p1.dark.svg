<text x="45.00" y="652.30" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#e7e9ee" text-anchor="start">Lends reserves; the bank must repay the funding.</text>
<text x="28.00" y="727.30" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#5eead4" text-anchor="start">↖ Reserves back to the bank</text>
