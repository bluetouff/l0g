<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 740" role="img" aria-labelledby="ecb2026-5-en-p1-dark-title ecb2026-5-en-p1-dark-desc" style="width:100%;height:auto" data-source-composition="complete-original" data-figure="5" width="520" height="740" data-crop-start="0" data-crop-end="740" data-panel="1">
<title id="ecb2026-5-en-p1-dark-title">The complete reserves circuit</title><desc id="ecb2026-5-en-p1-dark-desc">Future haircuts, reliable market value €100m, quality 1 or 2, euros, no further markdown. Six-year maturity for covered bonds; six-year weighted average life for ABS. The complete reserves circuit.</desc>
<defs><marker id="ecb2026-5-en-p1-dark-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#5eead4"/></marker></defs>
<rect x="0.00" y="0.00" width="520.00" height="1490.00" rx="0" fill="#0c0d10"/>
<text x="28.00" y="40.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#e7e9ee" text-anchor="start">l0g</text>
<text x="492.00" y="38.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="400" fill="#8b909b" text-anchor="end">BANK COLLATERAL / 05</text>
<line x1="28.00" y1="57.00" x2="492.00" y2="57.00" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"/>
<text x="28.00" y="98.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="700" fill="#e7e9ee" text-anchor="start">The security returns as</text>
<text x="28.00" y="133.70" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="700" fill="#e7e9ee" text-anchor="start">collateral</text>
<text x="28.00" y="164.70" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#8b909b" text-anchor="start">A retained securitisation can fund the bank that</text>
<text x="28.00" y="189.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#8b909b" text-anchor="start">originated it. The status of the security changes its</text>
<text x="28.00" y="213.30" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#8b909b" text-anchor="start">haircut.</text>
<rect x="28.00" y="245.30" width="464.00" height="88.00" rx="7" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.2"/>
