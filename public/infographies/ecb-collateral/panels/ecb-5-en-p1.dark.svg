<rect x="28.00" y="1126.30" width="343.10" height="33.00" rx="0" fill="#5eead4"/>
<text x="407.00" y="1151.05" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#e7e9ee" text-anchor="start">94</text>
<text x="28.00" y="1204.30" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#e7e9ee" text-anchor="start">Retained · haircut 10%</text>
