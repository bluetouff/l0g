<text x="45.00" y="304.30" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#e7e9ee" text-anchor="start">Borrowers’ repayments</text>
<path d="M260,337.29999999999995 L260,356.29999999999995" fill="none" stroke="#5eead4" stroke-width="2" marker-end="url(#ecb2026-5-en-p1-dark-arrow)"/>
