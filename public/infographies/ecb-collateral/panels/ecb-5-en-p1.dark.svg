<text x="28.00" y="1431.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="start">Source: ECB/2026/27, tables 2, 2a, 3a, 3b [3]. Comparisons</text>
<text x="28.00" y="1450.50" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="start">within the future grid, excluding other markdowns. Secured</text>
