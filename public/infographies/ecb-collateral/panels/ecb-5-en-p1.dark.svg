<text x="45.00" y="390.30" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#e7e9ee" text-anchor="start">Securitisation vehicle</text>
<text x="45.00" y="420.30" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#e7e9ee" text-anchor="start">Securities backed by the loans</text>
<path d="M260,453.29999999999995 L260,472.29999999999995" fill="none" stroke="#5eead4" stroke-width="2" marker-end="url(#ecb2026-5-en-p1-dark-arrow)"/>
