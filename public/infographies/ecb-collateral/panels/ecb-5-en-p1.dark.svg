<text x="45.00" y="506.30" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#e7e9ee" text-anchor="start">ABS retained and pledged</text>
<text x="45.00" y="536.30" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#e7e9ee" text-anchor="start">Collateral mobilised by the originator</text>
<path d="M260,569.3 L260,588.3" fill="none" stroke="#5eead4" stroke-width="2" marker-end="url(#ecb2026-5-en-p1-dark-arrow)"/>
