<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 704" role="img" aria-labelledby="ecb2026-7-en-p1-light-title ecb2026-7-en-p1-light-desc" style="width:100%;height:auto" data-source-composition="complete-original" data-figure="7" width="520" height="704" data-crop-start="0" data-crop-end="704" data-panel="1">
<title id="ecb2026-7-en-p1-light-title">2025–September 2026: transition, signing and publication</title><desc id="ecb2026-7-en-p1-light-desc">Documented dates for different kinds of event. Portfolio integration is scheduled for November 2027 at the earliest. The French temporary PGE framework ended in December 2025. 2025–September 2026: transition, signing and publication.</desc>
<defs><marker id="ecb2026-7-en-p1-light-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#0b5f58"/></marker></defs>
