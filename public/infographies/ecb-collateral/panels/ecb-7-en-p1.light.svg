<text x="74.00" y="756.60" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#0b5f58" text-anchor="start">30 Nov 2026</text>
<text x="74.00" y="786.60" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="700" fill="#4d5461" text-anchor="start">IMPLEMENTATION</text>
<text x="74.00" y="817.60" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#1b1d23" text-anchor="start">New rating, haircut and classification rules</text>
<text x="74.00" y="841.35" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#1b1d23" text-anchor="start">apply.</text>
<circle cx="43" cy="926.6" r="8" fill="#4d5461"/>
<text x="74.00" y="931.60" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#1b1d23" text-anchor="start">End-2026</text>
<text x="74.00" y="961.60" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="700" fill="#4d5461" text-anchor="start">GENERAL DEADLINE</text>
<text x="74.00" y="992.60" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#1b1d23" text-anchor="start">COVID-guaranteed loans eligible only by</text>
<text x="74.00" y="1016.35" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#1b1d23" text-anchor="start">temporary exception leave that route.</text>
<circle cx="43" cy="1101.6" r="8" fill="#4d5461"/>
<text x="74.00" y="1106.60" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#1b1d23" text-anchor="start">Nov 2027 at earliest</text>
<text x="74.00" y="1136.60" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="700" fill="#4d5461" text-anchor="start">PORTFOLIOS</text>
<text x="74.00" y="1167.60" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#1b1d23" text-anchor="start">Planned integration of non-financial credit</text>
<text x="74.00" y="1191.35" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#1b1d23" text-anchor="start">claim portfolios into the general</text>
<text x="74.00" y="1215.10" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#1b1d23" text-anchor="start">framework.</text>
<line x1="28.00" y1="1256.00" x2="492.00" y2="1256.00" stroke="rgba(12, 13, 16, 0.26)" stroke-width="1"/>
<text x="28.00" y="1281.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#4d5461" text-anchor="start">Sources: guidelines [2, 3], ECB announcement [1], transition</text>
<text x="28.00" y="1300.50" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#4d5461" text-anchor="start">[12], Banque de France [13]. Ending a collateral exception</text>
<text x="28.00" y="1320.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#4d5461" text-anchor="start">does not itself change the customer’s loan contract.</text>
