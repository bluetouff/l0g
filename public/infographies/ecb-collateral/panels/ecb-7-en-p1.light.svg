<text x="28.00" y="40.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#1b1d23" text-anchor="start">l0g</text>
<text x="492.00" y="38.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="400" fill="#4d5461" text-anchor="end">BANK COLLATERAL / 07</text>
<line x1="28.00" y1="57.00" x2="492.00" y2="57.00" stroke="rgba(12, 13, 16, 0.26)" stroke-width="1"/>
<text x="28.00" y="98.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="700" fill="#1b1d23" text-anchor="start">Three separate timetables</text>
<text x="28.00" y="129.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#4d5461" text-anchor="start">Publication dates, legal implementation and</text>
<text x="28.00" y="153.30" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#4d5461" text-anchor="start">temporary arrangements. Chronological sequence,</text>
<text x="28.00" y="177.60" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#4d5461" text-anchor="start">not a proportional time axis.</text>
<line x1="43.00" y1="219.60" x2="43.00" y2="1109.60" stroke="rgba(12, 13, 16, 0.26)" stroke-width="3"/>
<circle cx="43" cy="226.6" r="8" fill="#4d5461"/>
<text x="74.00" y="231.60" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#1b1d23" text-anchor="start">19 Dec 2025</text>
<text x="74.00" y="261.60" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="700" fill="#4d5461" text-anchor="start">FRANCE</text>
<text x="74.00" y="292.60" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#1b1d23" text-anchor="start">Banque de France ends its temporary PGE</text>
<text x="74.00" y="316.35" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#1b1d23" text-anchor="start">arrangement.</text>
<circle cx="43" cy="401.6" r="8" fill="#4d5461"/>
<text x="74.00" y="406.60" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#1b1d23" text-anchor="start">22 Sep 2026</text>
<text x="74.00" y="436.60" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="700" fill="#4d5461" text-anchor="start">EUROSYSTEM</text>
<text x="74.00" y="467.60" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#1b1d23" text-anchor="start">Guidelines ECB/2026/26 and ECB/2026/27</text>
<text x="74.00" y="491.35" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#1b1d23" text-anchor="start">signed.</text>
