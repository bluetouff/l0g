<text x="74.00" y="581.60" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#1b1d23" text-anchor="start">29 Sep 2026</text>
<text x="74.00" y="611.60" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="700" fill="#4d5461" text-anchor="start">PUBLICATION</text>
<text x="74.00" y="642.60" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#1b1d23" text-anchor="start">Guidelines and explanatory announcement</text>
<text x="74.00" y="666.35" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#1b1d23" text-anchor="start">released.</text>
