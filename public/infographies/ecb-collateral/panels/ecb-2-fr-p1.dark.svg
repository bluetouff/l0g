<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 645" role="img" aria-labelledby="ecb2026-2-fr-p1-dark-title ecb2026-2-fr-p1-dark-desc" style="width:100%;height:auto" data-source-composition="complete-original" data-figure="2" width="520" height="645" data-crop-start="0" data-crop-end="645" data-panel="1">
<title id="ecb2026-2-fr-p1-dark-title">1–2 · Le prêt crée le dépôt, puis le client paie</title><desc id="ecb2026-2-fr-p1-dark-desc">Circuit simplifié, montants fictifs. Le prêt commercial et la dette de refinancement restent deux contrats distincts. 1–2 · Le prêt crée le dépôt, puis le client paie.</desc>
<defs><marker id="ecb2026-2-fr-p1-dark-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#5eead4"/></marker></defs>
<rect x="0.00" y="0.00" width="520.00" height="1280.00" rx="0" fill="#0c0d10"/>
<text x="28.00" y="40.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#e7e9ee" text-anchor="start">l0g</text>
<text x="492.00" y="38.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="400" fill="#8b909b" text-anchor="end">GARANTIES BANCAIRES / 02</text>
<line x1="28.00" y1="57.00" x2="492.00" y2="57.00" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"/>
<text x="28.00" y="98.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="700" fill="#e7e9ee" text-anchor="start">Du prêt au règlement</text>
<text x="28.00" y="133.70" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="700" fill="#e7e9ee" text-anchor="start">interbancaire</text>
<text x="28.00" y="164.70" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#8b909b" text-anchor="start">Exemple fictif de 20 M€. La banque dispose déjà</text>
<text x="28.00" y="189.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#8b909b" text-anchor="start">des garanties utilisées pour se refinancer.</text>
<circle cx="45" cy="233.0" r="15" fill="#5eead4"/>
<text x="45.00" y="239.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#0c0d10" text-anchor="middle">1</text>
<text x="75.00" y="239.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#e7e9ee" text-anchor="start">Le prêt crée le dépôt</text>
<text x="75.00" y="269.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#e7e9ee" text-anchor="start">Banque A : +20 de créance, +20 de</text>
<text x="75.00" y="295.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#e7e9ee" text-anchor="start">dépôt client.</text>
<text x="75.00" y="380.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="700" fill="#5eead4" text-anchor="start">20 M€</text>
<path d="M45,269.0 L45,411.0" fill="none" stroke="#5eead4" stroke-width="2" marker-end="url(#ecb2026-2-fr-p1-dark-arrow)"/>
<circle cx="45" cy="451.0" r="15" fill="#5eead4"/>
<text x="45.00" y="457.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#0c0d10" text-anchor="middle">2</text>
<text x="75.00" y="457.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#e7e9ee" text-anchor="start">Le client paie son fournisseur</text>
<text x="75.00" y="487.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#e7e9ee" text-anchor="start">Le dépôt quitte A ; le fournisseur est</text>
<text x="75.00" y="513.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#e7e9ee" text-anchor="start">crédité chez B.</text>
<text x="75.00" y="598.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="700" fill="#5eead4" text-anchor="start">20 M€</text>
<path d="M45,487.0 L45,629.0" fill="none" stroke="#5eead4" stroke-width="2" marker-end="url(#ecb2026-2-fr-p1-dark-arrow)"/>
<circle cx="45" cy="669.0" r="15" fill="#5eead4"/>
<text x="45.00" y="675.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#0c0d10" text-anchor="middle">3</text>
<text x="75.00" y="675.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#e7e9ee" text-anchor="start">A règle B en réserves</text>
<text x="75.00" y="705.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#e7e9ee" text-anchor="start">Réserves : −20 chez A, +20 chez B. Le</text>
<text x="75.00" y="731.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#e7e9ee" text-anchor="start">prêt reste chez A.</text>
<text x="75.00" y="816.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="700" fill="#5eead4" text-anchor="start">A → B</text>
<path d="M45,705.0 L45,847.0" fill="none" stroke="#5eead4" stroke-width="2" marker-end="url(#ecb2026-2-fr-p1-dark-arrow)"/>
<circle cx="45" cy="887.0" r="15" fill="#5eead4"/>
<text x="45.00" y="893.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#0c0d10" text-anchor="middle">4</text>
<text x="75.00" y="893.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#e7e9ee" text-anchor="start">A reconstitue sa liquidité</text>
<text x="75.00" y="923.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#e7e9ee" text-anchor="start">25 de garanties × 80 % = 20 de</text>
<text x="75.00" y="949.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#e7e9ee" text-anchor="start">financement. Dette nouvelle envers la</text>
<text x="75.00" y="975.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#e7e9ee" text-anchor="start">banque centrale.</text>
<text x="75.00" y="1034.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="700" fill="#5eead4" text-anchor="start">25 → 20</text>
<line x1="28.00" y1="1196.00" x2="492.00" y2="1196.00" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"/>
<text x="28.00" y="1221.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="start">Sources : Bank of England [9], BCE [10, 11]. Le prêt peut être</text>
<text x="28.00" y="1240.50" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="start">refinancé avant ou après le paiement selon les réserves déjà</text>
<text x="28.00" y="1260.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#8b909b" text-anchor="start">disponibles. Montants en M€.</text>
</svg>
