<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1490" role="img" aria-labelledby="ecb2026-5-en-mobile-full-title ecb2026-5-en-mobile-full-desc" style="width:100%;height:auto" data-source-composition="complete-original" data-figure="5">
<title id="ecb2026-5-en-mobile-full-title">The security returns as collateral</title><desc id="ecb2026-5-en-mobile-full-desc">A retained securitisation can fund the bank that originated it. The status of the security changes its haircut.</desc>
<style>:root{color-scheme:dark;--ecb-ink:#0c0d10;--ecb-surface:#121419;--ecb-surface-2:#171a20;--ecb-paper:#e7e9ee;--ecb-muted:#8b909b;--ecb-signal:#5eead4;--ecb-amber:#f5b13d;--ecb-topic-blue:#7aa2f7;--ecb-line-strong:rgba(255, 255, 255, 0.20)}@media(prefers-color-scheme:light){:root{color-scheme:light;--ecb-ink:#e7e9ee;--ecb-surface:#ffffff;--ecb-surface-2:#eef0f4;--ecb-paper:#1b1d23;--ecb-muted:#4d5461;--ecb-signal:#0b5f58;--ecb-amber:#92400e;--ecb-topic-blue:#1d4ed8;--ecb-line-strong:rgba(12, 13, 16, 0.26)}}</style><defs><marker id="ecb2026-5-en-mobile-full-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="var(--ecb-signal)"/></marker></defs>
<rect x="0.00" y="0.00" width="520.00" height="1490.00" rx="0" fill="var(--ecb-ink)"/>
<text x="28.00" y="40.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="var(--ecb-paper)" text-anchor="start">l0g</text>
<text x="492.00" y="38.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="400" fill="var(--ecb-muted)" text-anchor="end">BANK COLLATERAL / 05</text>
<line x1="28.00" y1="57.00" x2="492.00" y2="57.00" stroke="var(--ecb-line-strong)" stroke-width="1"/>
<text x="28.00" y="98.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="700" fill="var(--ecb-paper)" text-anchor="start">The security returns as</text>
<text x="28.00" y="133.70" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="700" fill="var(--ecb-paper)" text-anchor="start">collateral</text>
<text x="28.00" y="164.70" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="var(--ecb-muted)" text-anchor="start">A retained securitisation can fund the bank that</text>
<text x="28.00" y="189.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="var(--ecb-muted)" text-anchor="start">originated it. The status of the security changes its</text>
<text x="28.00" y="213.30" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="var(--ecb-muted)" text-anchor="start">haircut.</text>
<rect x="28.00" y="245.30" width="464.00" height="88.00" rx="7" fill="var(--ecb-surface)" stroke="var(--ecb-line-strong)" stroke-width="1.2"/>
<text x="45.00" y="274.30" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="var(--ecb-paper)" text-anchor="start">Bank-originated loans</text>
<text x="45.00" y="304.30" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="var(--ecb-paper)" text-anchor="start">Borrowers’ repayments</text>
<path d="M260,337.29999999999995 L260,356.29999999999995" fill="none" stroke="var(--ecb-signal)" stroke-width="2" marker-end="url(#ecb2026-5-en-mobile-full-arrow)"/>
<rect x="28.00" y="361.30" width="464.00" height="88.00" rx="7" fill="var(--ecb-surface)" stroke="var(--ecb-line-strong)" stroke-width="1.2"/>
<text x="45.00" y="390.30" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="var(--ecb-paper)" text-anchor="start">Securitisation vehicle</text>
<text x="45.00" y="420.30" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="var(--ecb-paper)" text-anchor="start">Securities backed by the loans</text>
<path d="M260,453.29999999999995 L260,472.29999999999995" fill="none" stroke="var(--ecb-signal)" stroke-width="2" marker-end="url(#ecb2026-5-en-mobile-full-arrow)"/>
<rect x="28.00" y="477.30" width="464.00" height="88.00" rx="7" fill="var(--ecb-surface)" stroke="var(--ecb-line-strong)" stroke-width="1.2"/>
<text x="45.00" y="506.30" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="var(--ecb-paper)" text-anchor="start">ABS retained and pledged</text>
<text x="45.00" y="536.30" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="var(--ecb-paper)" text-anchor="start">Collateral mobilised by the originator</text>
<path d="M260,569.3 L260,588.3" fill="none" stroke="var(--ecb-signal)" stroke-width="2" marker-end="url(#ecb2026-5-en-mobile-full-arrow)"/>
<rect x="28.00" y="593.30" width="464.00" height="88.00" rx="7" fill="var(--ecb-surface)" stroke="var(--ecb-line-strong)" stroke-width="1.2"/>
<text x="45.00" y="622.30" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="var(--ecb-paper)" text-anchor="start">Central bank</text>
<text x="45.00" y="652.30" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="var(--ecb-paper)" text-anchor="start">Lends reserves; the bank must repay the funding.</text>
<text x="28.00" y="727.30" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="var(--ecb-signal)" text-anchor="start">↖ Reserves back to the bank</text>
<text x="28.00" y="793.30" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="var(--ecb-paper)" text-anchor="start">Covered bond · fixed coupon · 6-year maturity</text>
<text x="28.00" y="830.30" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="var(--ecb-paper)" text-anchor="start">Ordinary · haircut 3.5%</text>
<rect x="28.00" y="850.30" width="365.00" height="33.00" rx="0" fill="var(--ecb-surface-2)"/>
<rect x="28.00" y="850.30" width="352.23" height="33.00" rx="0" fill="var(--ecb-signal)"/>
<text x="407.00" y="875.05" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="var(--ecb-paper)" text-anchor="start">96.5</text>
<text x="28.00" y="928.30" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="var(--ecb-paper)" text-anchor="start">Own-use · haircut 13%</text>
<rect x="28.00" y="948.30" width="365.00" height="33.00" rx="0" fill="var(--ecb-surface-2)"/>
<rect x="28.00" y="948.30" width="317.55" height="33.00" rx="0" fill="var(--ecb-signal)"/>
<text x="407.00" y="973.05" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="var(--ecb-paper)" text-anchor="start">87</text>
<text x="28.00" y="1044.30" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="var(--ecb-paper)" text-anchor="start">ABS · senior tranche</text>
<text x="28.00" y="1069.30" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="var(--ecb-paper)" text-anchor="start">6-year weighted average life</text>
<text x="28.00" y="1106.30" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="var(--ecb-paper)" text-anchor="start">Non-retained · haircut 6%</text>
<rect x="28.00" y="1126.30" width="365.00" height="33.00" rx="0" fill="var(--ecb-surface-2)"/>
<rect x="28.00" y="1126.30" width="343.10" height="33.00" rx="0" fill="var(--ecb-signal)"/>
<text x="407.00" y="1151.05" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="var(--ecb-paper)" text-anchor="start">94</text>
<text x="28.00" y="1204.30" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="var(--ecb-paper)" text-anchor="start">Retained · haircut 10%</text>
<rect x="28.00" y="1224.30" width="365.00" height="33.00" rx="0" fill="var(--ecb-surface-2)"/>
<rect x="28.00" y="1224.30" width="328.50" height="33.00" rx="0" fill="var(--ecb-signal)"/>
<text x="407.00" y="1249.05" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="var(--ecb-paper)" text-anchor="start">90</text>
<line x1="28.00" y1="1406.00" x2="492.00" y2="1406.00" stroke="var(--ecb-line-strong)" stroke-width="1"/>
<text x="28.00" y="1431.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="var(--ecb-muted)" text-anchor="start">Source: ECB/2026/27, tables 2, 2a, 3a, 3b [3]. Comparisons</text>
<text x="28.00" y="1450.50" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="var(--ecb-muted)" text-anchor="start">within the future grid, excluding other markdowns. Secured</text>
<text x="28.00" y="1470.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="var(--ecb-muted)" text-anchor="start">funding alone does not demonstrate a credit-risk transfer.</text>
