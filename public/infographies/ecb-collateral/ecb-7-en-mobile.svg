<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1340" role="img" aria-labelledby="ecb2026-7-en-mobile-full-title ecb2026-7-en-mobile-full-desc" style="width:100%;height:auto" data-source-composition="complete-original" data-figure="7">
<title id="ecb2026-7-en-mobile-full-title">Three separate timetables</title><desc id="ecb2026-7-en-mobile-full-desc">Publication dates, legal implementation and temporary arrangements. Chronological sequence, not a proportional time axis.</desc>
