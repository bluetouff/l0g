<text x="74.00" y="961.60" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="700" fill="var(--ecb-muted)" text-anchor="start">GENERAL DEADLINE</text>
<text x="74.00" y="992.60" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="var(--ecb-paper)" text-anchor="start">COVID-guaranteed loans eligible only by</text>
<text x="74.00" y="1016.35" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="var(--ecb-paper)" text-anchor="start">temporary exception leave that route.</text>
<circle cx="43" cy="1101.6" r="8" fill="var(--ecb-muted)"/>
<text x="74.00" y="1106.60" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="var(--ecb-paper)" text-anchor="start">Nov 2027 at earliest</text>
<text x="74.00" y="1136.60" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="700" fill="var(--ecb-muted)" text-anchor="start">PORTFOLIOS</text>
<text x="74.00" y="1167.60" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="var(--ecb-paper)" text-anchor="start">Planned integration of non-financial credit</text>
<text x="74.00" y="1191.35" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="var(--ecb-paper)" text-anchor="start">claim portfolios into the general</text>
<text x="74.00" y="1215.10" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="var(--ecb-paper)" text-anchor="start">framework.</text>
<line x1="28.00" y1="1256.00" x2="492.00" y2="1256.00" stroke="var(--ecb-line-strong)" stroke-width="1"/>
<text x="28.00" y="1281.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="var(--ecb-muted)" text-anchor="start">Sources: guidelines [2, 3], ECB announcement [1], transition</text>
<text x="28.00" y="1300.50" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="var(--ecb-muted)" text-anchor="start">[12], Banque de France [13]. Ending a collateral exception</text>
<text x="28.00" y="1320.00" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="var(--ecb-muted)" text-anchor="start">does not itself change the customer’s loan contract.</text>
