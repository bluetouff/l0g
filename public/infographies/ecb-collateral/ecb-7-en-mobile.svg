<text x="74.00" y="436.60" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="700" fill="var(--ecb-muted)" text-anchor="start">EUROSYSTEM</text>
<text x="74.00" y="467.60" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="var(--ecb-paper)" text-anchor="start">Guidelines ECB/2026/26 and ECB/2026/27</text>
