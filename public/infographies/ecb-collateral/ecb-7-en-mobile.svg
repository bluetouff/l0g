<text x="74.00" y="817.60" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="var(--ecb-paper)" text-anchor="start">New rating, haircut and classification rules</text>
<text x="74.00" y="841.35" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="var(--ecb-paper)" text-anchor="start">apply.</text>
