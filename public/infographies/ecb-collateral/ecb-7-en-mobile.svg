<text x="74.00" y="231.60" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="var(--ecb-paper)" text-anchor="start">19 Dec 2025</text>
<text x="74.00" y="261.60" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="700" fill="var(--ecb-muted)" text-anchor="start">FRANCE</text>
