<line x1="54.00" y1="992.90" x2="1146.00" y2="992.90" stroke="var(--ecb-line-strong)" stroke-width="1"/>
<text x="54.00" y="1017.90" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="var(--ecb-muted)" text-anchor="start">Sources : orientations [2, 3], communiqué BCE [1], transition [12], Banque de France [13]. La fin d’une dérogation ne modifie</text>
