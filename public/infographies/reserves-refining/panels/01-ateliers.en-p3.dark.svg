<title id="reserves04-en-1-panel3-dark-title">Blending, checks and products</title><desc id="reserves04-en-1-panel3-dark-desc">Blending and checks prepare diesel and jet fuel to their distinct specifications. Selected routes, with no yields or Donges site layout.</desc><metadata>{"edition": "2026-10-03", "sources": [{"id": "S06", "publisher": "U.S. Energy Information Administration", "title": "Refining crude oil: the refining process", "url": "https://www.eia.gov/energyexplained/oil-and-petroleum-products/refining-crude-oil-the-refining-process.php", "reference_period": "Description technique générale, consultée le 3 octobre 2026."}, {"id": "S08", "publisher": "Pennsylvania State University / Semih Eser", "title": "Catalytic Hydrocracking, FSC 432", "url": "https://courses.ems.psu.edu/fsc432/node/644", "reference_period": "Principes de procédé ; date de mise à jour non établie."}, {"id": "S22", "publisher": "Pennsylvania State University / Semih Eser", "title": "Hydrogen Production, FSC 432", "url": "https://courses.ems.psu.edu/fsc432/node/651", "reference_period": "Principes techniques, date de mise à jour non établie."}, {"id": "S24", "publisher": "Pennsylvania State University / Semih Eser", "title": "FSC 432, Petroleum Refining: sections Catalytic Hydrotreatment and finishing", "url": "https://courses.ems.psu.edu/fsc432/book/export/html/2", "reference_period": "Principes techniques du cours."}], "convention": "Qualitative diagram of selected refining routes. Hydrogen supports treatment and conversion. No yields shown; hydrocracking depends on configuration. This is not a diagram of Donges."}</metadata>
