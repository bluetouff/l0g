<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 980 400 430" role="img" aria-labelledby="reserves04-fr-1-panel3-light-title reserves04-fr-1-panel3-light-desc" data-diagram="refining-dependencies" style="width:100%;height:auto" width="400" height="430" data-crop-start="980" data-crop-end="1410" data-panel="3">
<title id="reserves04-fr-1-panel3-light-title">Mélanges, contrôles et produits</title><desc id="reserves04-fr-1-panel3-light-desc">Des mélanges et contrôles préparent le gazole et le carburéacteur selon leurs spécifications distinctes. Voies sélectionnées, sans rendement ni plan de Donges.</desc><metadata>{"edition": "2026-10-03", "sources": [{"id": "S06", "publisher": "U.S. Energy Information Administration", "title": "Refining crude oil: the refining process", "url": "https://www.eia.gov/energyexplained/oil-and-petroleum-products/refining-crude-oil-the-refining-process.php", "reference_period": "Description technique générale, consultée le 3 octobre 2026."}, {"id": "S08", "publisher": "Pennsylvania State University / Semih Eser", "title": "Catalytic Hydrocracking, FSC 432", "url": "https://courses.ems.psu.edu/fsc432/node/644", "reference_period": "Principes de procédé ; date de mise à jour non établie."}, {"id": "S22", "publisher": "Pennsylvania State University / Semih Eser", "title": "Hydrogen Production, FSC 432", "url": "https://courses.ems.psu.edu/fsc432/node/651", "reference_period": "Principes techniques, date de mise à jour non établie."}, {"id": "S24", "publisher": "Pennsylvania State University / Semih Eser", "title": "FSC 432, Petroleum Refining: sections Catalytic Hydrotreatment and finishing", "url": "https://courses.ems.psu.edu/fsc432/book/export/html/2", "reference_period": "Principes techniques du cours."}], "convention": "Schéma qualitatif de voies sélectionnées de raffinage. Hydrogène partagé par traitement et conversion. Aucun rendement ; la branche hydrocraquage dépend de la configuration. Ce schéma ne décrit pas Donges."}</metadata>
