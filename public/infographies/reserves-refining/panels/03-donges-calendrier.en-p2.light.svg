<text x="24" y="34" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#1b1d23" text-anchor="start">l0g.</text>
<text x="376" y="32" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#4d5461" text-anchor="end">RESERVES / 04 · 03</text>
