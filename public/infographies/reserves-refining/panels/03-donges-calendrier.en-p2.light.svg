<text x="24" y="83" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#1b1d23" text-anchor="start">Donges: a restart in stages</text>
<text x="24" y="123" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#4d5461" text-anchor="start">Four operator notices · 2026</text>
<text x="24" y="173" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#4d5461" text-anchor="start">Sequence, spaced for readability</text>
<path d="M36,201 L36,842" fill="none" stroke="#0b5f58" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
<circle cx="36" cy="228" r="6" fill="#0b5f58" stroke="#ffffff" stroke-width="2" />
<rect x="56" y="200" width="320" height="162" rx="9" fill="#ffffff" stroke="rgba(12, 13, 16, 0.26)" stroke-width="1.5" />
<text x="74" y="229" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#0b5f58" text-anchor="start">23 APRIL</text>
<text x="74" y="261" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1b1d23" text-anchor="start">Shutdown manoeuvres</text>
<text x="74" y="291" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#4d5461" text-anchor="start">Units shut down for inspection,</text>
<text x="74" y="314" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#4d5461" text-anchor="start">maintenance and upgrades.</text>
<circle cx="36" cy="410" r="6" fill="#0b5f58" stroke="#ffffff" stroke-width="2" />
<rect x="56" y="382" width="320" height="162" rx="9" fill="#ffffff" stroke="rgba(12, 13, 16, 0.26)" stroke-width="1.5" />
<text x="74" y="411" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#0b5f58" text-anchor="start">23 JUNE</text>
<text x="74" y="443" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1b1d23" text-anchor="start">A phased restart</text>
<text x="74" y="473" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#4d5461" text-anchor="start">Work is gradually ending and</text>
<text x="74" y="496" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#4d5461" text-anchor="start">equipment is returning to service in</text>
<text x="74" y="519" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#4d5461" text-anchor="start">stages.</text>
<circle cx="36" cy="592" r="6" fill="#0b5f58" stroke="#ffffff" stroke-width="2" />
<rect x="56" y="564" width="320" height="162" rx="9" fill="#ffffff" stroke="rgba(12, 13, 16, 0.26)" stroke-width="1.5" />
<text x="74" y="593" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#0b5f58" text-anchor="start">3 AUGUST</text>
<text x="74" y="625" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1b1d23" text-anchor="start">Restart continues</text>
<text x="74" y="655" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#4d5461" text-anchor="start">A further notice says that production</text>
<text x="74" y="678" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#4d5461" text-anchor="start">units are still restarting.</text>
<circle cx="36" cy="774" r="6" fill="#0b5f58" stroke="#ffffff" stroke-width="2" />
<rect x="56" y="746" width="320" height="162" rx="9" fill="#ffffff" stroke="rgba(12, 13, 16, 0.26)" stroke-width="1.5" />
<text x="74" y="775" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#0b5f58" text-anchor="start">9 AUGUST</text>
<text x="74" y="807" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1b1d23" text-anchor="start">One unit starting up</text>
<text x="74" y="837" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#4d5461" text-anchor="start">Further manoeuvres are scheduled</text>
<text x="74" y="860" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#4d5461" text-anchor="start">for the next day, 10 August.</text>
<rect x="24" y="938" width="352" height="76" rx="9" fill="#e7efee" />
<text x="42" y="965" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#1b1d23" text-anchor="start">Recovered throughput and current</text>
<text x="42" y="988" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#1b1d23" text-anchor="start">operating rates remain unknown.</text>
<path d="M24,1025 L376,1025" fill="none" stroke="rgba(12, 13, 16, 0.26)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" />
<text x="24" y="1048" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#4d5461" text-anchor="start">Source: TotalEnergies Donges</text>
<text x="24" y="1071" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#4d5461" text-anchor="start">Publication dates. Neither a throughput series nor a full-shutdown</text>
