<text x="64" y="455" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="var(--color-signal)" text-anchor="start">HYDROTRAITEMENT</text>
<text x="64" y="486" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="var(--color-paper)" text-anchor="start">Retirer des contaminants, dont le</text>
