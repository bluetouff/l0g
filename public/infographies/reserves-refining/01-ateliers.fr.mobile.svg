<text x="64" y="606" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="var(--color-amber)" text-anchor="start">HYDROGÈNE</text>
<text x="64" y="635" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="var(--color-amber)" text-anchor="start">Réactif pour les deux ateliers</text>
<path d="M200,574 L200,535" fill="none" stroke="var(--color-amber)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#reserves04-fr-1-full-mobile-a)" />
<path d="M356,620 L381,620 L381,884 L361,884" fill="none" stroke="var(--color-amber)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#reserves04-fr-1-full-mobile-a)" />
<text x="44" y="717.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="var(--color-muted)" text-anchor="start">AUTRES COUPES</text>
<text x="44" y="748" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">D’autres circuits produisent</text>
<text x="44" y="773" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">notamment des composants</text>
<text x="44" y="798" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">d’essence. Une voie de conversion</text>
