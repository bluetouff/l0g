<marker id="reserves04-fr-1-full-mobile-s" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="var(--color-muted)" /></marker>
