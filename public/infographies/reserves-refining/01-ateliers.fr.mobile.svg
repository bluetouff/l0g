<text x="64" y="1063" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="var(--color-paper)" text-anchor="start">Chaque produit est préparé selon</text>
<text x="64" y="1087" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="var(--color-paper)" text-anchor="start">ses spécifications.</text>
<path d="M200,1108 L200,1136 L115,1136 L115,1154" fill="none" stroke="var(--color-signal)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#reserves04-fr-1-full-mobile-t)" />
