<rect x="44" y="1160" width="142" height="62" rx="9" fill="color-mix(in srgb, var(--color-signal) 10%, var(--color-surface))" stroke="var(--color-signal)" stroke-width="1.5" />
<text x="115" y="1199" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="var(--color-signal)" text-anchor="middle">GAZOLE</text>
<rect x="214" y="1160" width="142" height="62" rx="9" fill="color-mix(in srgb, var(--color-signal) 10%, var(--color-surface))" stroke="var(--color-signal)" stroke-width="1.5" />
<text x="285" y="1199" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="var(--color-signal)" text-anchor="middle">JET</text>
<text x="44" y="1260" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="var(--color-muted)" text-anchor="start">Schéma général. Aucun plan de site ni</text>
<text x="44" y="1282" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="var(--color-muted)" text-anchor="start">rendement chiffré.</text>
