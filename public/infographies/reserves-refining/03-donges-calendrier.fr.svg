té", "url": "https://donges.totalenergies.fr/toutes-les-actualites/raffinerie-de-donges-redemarrage-dune-unite", "reference_period": "Manœuvres annoncées pour le lundi 10 août 2026."}], "convention": "Quatre bulletins de l’exploitant en 2026. Dates de publication distinguées des opérations annoncées. Aucune durée d’arrêt total ni débit retrouvé inféré."}</metadata>
