<text x="24" y="83" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="var(--color-paper)" text-anchor="start">The units behind the diesel</text>
<text x="24" y="123" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="var(--color-muted)" text-anchor="start">Processes and dependencies · Functional</text>
<text x="24" y="144" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="var(--color-muted)" text-anchor="start">diagram</text>
