<text x="64" y="868" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="var(--color-signal)" text-anchor="start">HYDROCRACKING</text>
<text x="64" y="897" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="var(--color-signal)" text-anchor="start">Where installed</text>
<text x="64" y="925" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="var(--color-paper)" text-anchor="start">Convert selected heavier feeds.</text>
