<text x="64" y="635" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="var(--color-amber)" text-anchor="start">Input to both processing units</text>
<path d="M200,574 L200,535" fill="none" stroke="var(--color-amber)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#reserves04-en-1-full-mobile-a)" />
<path d="M356,620 L381,620 L381,884 L361,884" fill="none" stroke="var(--color-amber)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#reserves04-en-1-full-mobile-a)" />
<text x="44" y="717.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="var(--color-muted)" text-anchor="start">OTHER FRACTIONS</text>
<text x="44" y="748" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">Other routes make products such as</text>
<text x="44" y="773" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="var(--color-muted)" text-anchor="start">petrol components. A conversion route</text>
