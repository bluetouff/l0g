<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1410" role="img" aria-labelledby="reserves04-en-1-full-mobile-title reserves04-en-1-full-mobile-desc" data-diagram="refining-dependencies" style="width:100%;height:auto">
<title id="reserves04-en-1-full-mobile-title">The units behind the diesel</title><desc id="reserves04-en-1-full-mobile-desc">Qualitative diagram of selected refining routes. Hydrogen supports treatment and conversion. No yields shown; hydrocracking depends on configuration. This is not a diagram of Donges.</desc><style>:root{color-scheme:light;--color-ink:#e7e9ee;--color-surface:#ffffff;--color-surface-2:#eef0f4;--color-line-strong:rgba(12, 13, 16, 0.26);--color-paper:#1b1d23;--color-muted:#4d5461;--color-signal:#0b5f58;--color-accent:#a50f4d;--color-amber:#92400e;--color-topic-blue:#1d4ed8}@media(prefers-color-scheme:dark){:root{color-scheme:dark;--color-ink:#0c0d10;--color-surface:#121419;--color-surface-2:#171a20;--color-line-strong:rgba(255, 255, 255, 0.20);--color-paper:#e7e9ee;--color-muted:#8b909b;--color-signal:#5eead4;--color-accent:#ff4d87;--color-amber:#f5b13d;--color-topic-blue:#7aa2f7}}</style><metadata>{"edition": "2026-10-03", "sources": [{"id": "S06", "publisher": "U.S. Energy Information Administration", "title": "Refining crude oil: the refining process", "url": "https://www.eia.gov/energyexplained/oil-and-petroleum-products/refining-crude-oil-the-refining-process.php", "reference_period": "Description technique générale, consultée le 3 octobre 2026."}, {"id": "S08", "publisher": "Pennsylvania State University / Semih Eser", "title": "Catalytic Hydrocracking, FSC 432", "url": "https://courses.ems.psu.edu/fsc432/node/644", "reference_period": "Principes de procédé ; date de mise à jour non établie."}, {"id": "S22", "publisher": "Pennsylvania State University / Semih Eser", "title": "Hydrogen Production, FSC 432", "url": "https://courses.ems.psu.edu/fsc432/node/651", "reference_period": "Principes techniques, date de mise à jour non établie."}, {"id": "S24", "publisher": "Pennsylvania State University / Semih Eser", "title": "FSC 432, Petroleum Refining: sections Catalytic Hydrotreatment and finishing", "url": "https://courses.ems.psu.edu/fsc432/book/export/html/2", "reference_period": "Principes techniques du cours."}], "convention": "Qualitative diagram of selected refining routes. Hydrogen supports treatment and conversion. No yields shown; hydrocracking depends on configuration. This is not a diagram of Donges."}</metadata>
