<title id="reserves04-fr-3-full-mobile-title">Donges : les étapes d’une reprise</title><desc id="reserves04-fr-3-full-mobile-desc">Quatre bulletins de l’exploitant en 2026. Dates de publication distinguées des opérations annoncées. Aucune durée d’arrêt total ni débit retrouvé inféré.</desc><style>:root{color-scheme:light;--color-ink:#e7e9ee;--color-surface:#ffffff;--color-surface-2:#eef0f4;--color-line-strong:rgba(12, 13, 16, 0.26);--color-paper:#1b1d23;--color-muted:#4d5461;--color-signal:#0b5f58;--color-accent:#a50f4d;--color-amber:#92400e;--color-topic-blue:#1d4ed8}@media(prefers-color-scheme:dark){:root{color-scheme:dark;--color-ink:#0c0d10;--color-surface:#121419;--color-surface-2:#171a20;--color-line-strong:rgba(255, 255, 255, 0.20);--color-paper:#e7e9ee;--color-muted:#8b909b;--color-signal:#5eead4;--color-accent:#ff4d87;--color-amber:#f5b13d;--color-topic-blue:#7aa2f7}}</style><metadata>{"edition": "2026-10-03", "sources": [{"id": "S02", "publisher": "TotalEnergies Donges", "title": "Grand Arrêt 2026 : manœuvres d’arrêt d’unités", "url": "https://donges.totalenergies.fr/toutes-les-actualites/grand-arret-2026-de-la-raffinerie-de-donges-manoeuvres-darret-dunites", "reference_period": "Manœuvres commencées la semaine de publication, annoncées jusqu’au 17 mai 2026."}, {"id": "S03", "publisher": "TotalEnergies Donges", "title": "Redémarrage progressif des unités de la raffinerie", "url": "https://donges.totalenergies.fr/toutes-les-actualites/redemarrage-progressif-des-unites-de-la-raffinerie-0", "reference_period": "Bulletin du 23 juin 2026 ; référence interne au 20 juin."}, {"id": "S04", "publisher": "TotalEnergies Donges", "title": "Le redémarrage des unités de la raffinerie se poursuit", "url": "https://donges.totalenergies.fr/toutes-les-actualites/le-redemarrage-des-unites-de-la-raffinerie-se-poursuit", "reference_period": "Situation décrite le 3 août 2026."}, {"id": "S05", "publisher": "TotalEnergies Donges", "title": "Raffinerie de Donges : redémarrage d’une unité", "url": "https://donges.totalenergies.fr/toutes-les-actualites/raffinerie-de-donges-redemarrage-dune-unite", "reference_period": "Manœuvres annoncées pour le lundi 10 août 2026."}], "convention": "Quatre bulletins de l’exploitant en 2026. Dates de publication distinguées des opérations annoncées. Aucune durée d’arrêt total ni débit retrouvé inféré."}</metadata>
