e="var(--color-line-strong)" stroke-width="1.5" /><rect x="32" y="734.03" width="4" height="148.75" rx="2" fill="var(--color-signal)" /><text x="50.00" y="763.03" fill="var(--color-signal)" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">30.09 · MILWAUKEE</text><text x="50.00" y="797.03" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Trade working group announced. A</text><text x="50.00" y="829.53" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">negotiated exit remains open.</text><rect x="32" y="904.78" width="536" height="181.25" rx="15" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1.5" /><rect x="32" y="904.78" width="4" height="181.25" rx="2" fill="var(--color-amber)" /><text x="50.00" y="933.78" fill="var(--color-amber)" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">01.10 · BRASÍLIA</text><text x="50.00" y="967.78" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Alleged $1m funding: AGU requests</text><text x="50.00" y="1000.28" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">investigation. Payment remains</text><text x="50.00" y="1032.78" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">unverified.</text><rect x="32" y="1108.03" width="536" height="82" rx="15" fill="var(--color-surface-2)" /><text x="52.00" y="1142.03" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start">04.10.2026  →  VOTE</text><text x="52.00" y="1170.03" fill="var(--color-muted)" font-family="DejaVu Sans, Arial, sans-