lor-accent)" /><text x="416.00" y="345.85" fill="var(--color-accent)" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">B · CHALLENGE</text><text x="416.00" y="379.85" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Uncertainty persists</text><text x="416.00" y="407.15" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Watch: nature of</text><text x="416.00" y="434.45" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">objections, then any new</text><text x="416.00" y="461.75" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">measures.</text><path d="M560,301.85 H914 V312.85" fill="none" stroke="var(--color-amber)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 8" marker-end="url(#brazil-pressure-en-6-full-wide-amber)" /><rect x="752" y="316.85" width="324" height="243" rx="15" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1.5" /><rect x="752" y="316.85" width="4" height="243" rx="2" fill="var(--color-amber)" /><text x="770.00" y="345.85" fill="var(--color-amber)" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">C · CONDITIONS</text><text x="770.00" y="379.85" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Explicit concessions</text><text x="770.00" y="407.15" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Watch: texts linking</text><text x="770.00" y="434.45" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" 