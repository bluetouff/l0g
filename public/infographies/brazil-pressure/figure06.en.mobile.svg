="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Uncertainty persists</text><text x="99.00" y="731.96" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Watch: nature of objections, then</text><text x="99.00" y="764.46" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">any new measures.</text><path d="M 48,408.21000000000004 L 48,660.46" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 8" /><path d="M 48,660.46 L 70,660.46" fill="none" stroke="var(--color-accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 8" marker-end="url(#brazil-pressure-en-6-full-mobile-red)" /><rect x="81" y="842.71" width="487" height="181.25" rx="15" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1.5" /><rect x="81" y="842.71" width="4" height="181.25" rx="2" fill="var(--color-amber)" /><text x="99.00" y="871.71" fill="var(--color-amber)" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">C · CONDITIONS</text><text x="99.00" y="905.71" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Explicit concessions</text><text x="99.00" y="938.21" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Watch: texts linking market access</text><text x="99.00" y="970.71" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">to specific commitments.</text><path d="M 48,408.21000000000004 L 48,866.71" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 8" 