l, sans-serif" font-size="19" font-weight="400" text-anchor="start">escalation. No election outcome is anticipated.</text><text x="32.00" y="1427.41" fill="var(--color-muted)" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Sources: S01 · S05 · S19 · S27 · l0g analysis</text><text x="32.00" y="1453.41" fill="var(--color-signal)" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">03.10.2026  ·  l0g.fr</text></svg>
