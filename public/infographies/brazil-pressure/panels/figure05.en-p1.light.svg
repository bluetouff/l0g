.00" y="1620.41" fill="#4d5461" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">contractual electoral quid pro quo established.</text><text x="32.00" y="1645.11" fill="#4d5461" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Deliveries remain to be verified.</text><text x="32.00" y="1692.11" fill="#4d5461" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Sources: S21–S24 · SEC filings / issuers</text><text x="32.00" y="1718.11" fill="#0b5f58" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">03.10.2026  ·  l0g.fr</text></g></svg>
