" /><text x="89.00" y="405.71" fill="#1d4ed8" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">BANK CREDIT</text><text x="89.00" y="439.71" fill="#1b1d23" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">≤ $500m · Commitment letter;</text><text x="89.00" y="472.21" fill="#1b1d23" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">conditions</text><path d="M 48,391.71000000000004 L 48,553.46" fill="none" stroke="#4d5461" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><circle cx="48" cy="391.71000000000004" r="6" fill="#1d4ed8" /><rect x="71" y="549.46" width="497" height="148.75" rx="15" fill="#ffffff" stroke="rgba(12, 13, 16, 0.26)" stroke-width="1.5" /><rect x="71" y="549.46" width="4" height="148.75" rx="2" fill="#92400e" /><text x="89.00" y="578.46" fill="#92400e" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">PUBLIC PURCHASES</text><text x="89.00" y="612.46" fill="#1b1d23" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">≥ $300m · Forward contracts over 5</text><text x="89.00" y="644.96" fill="#1b1d23" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">years</text><path d="M 48,564.46 L 48,726.21" fill="none" stroke="#4d5461" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><circle cx="48" cy="564.46" r="6" fill="#92400e" /><path d="M 48,718.21 L 48,745.21" fill="none" stroke="#4d5461" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><path d="M 48,745.21 L 70,745.21" fill="none" stroke="#4d5461" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#brazil-pressure-en-5-panel1-light-line)" /><rect x="71" y="722.21" width="497" height="148.75" rx="15" fill="#ffffff" stroke="rgba(12, 13, 16, 0.26)" s