<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 1043 600 441" role="img" aria-labelledby="brazil-pressure-en-6-panel3-dark-title brazil-pressure-en-6-panel3-dark-desc" data-figure="6" data-model="alternative-post-election-scenarios" data-scenario="alternative-without-probabilities" data-first-round="2026-10-04" data-possible-runoff="2026-10-25" style="width:100%;height:auto" width="600" height="441" data-crop-start="1043" data-crop-end="1484" data-panel="3"><title id="brazil-pressure-en-6-panel3-dark-title">Military risk and scenario limits</title><desc id="brazil-pressure-en-6-panel3-dark-desc">Military risk is treated separately through decisions, legal basis, deployment and objectives. An FTO designation is not an authorisation to use force. Scenarios have no probabilities and anticipate no election result.</desc><defs><marker id="brazil-pressure-en-6-panel3-dark-bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0c0d10" /></marker><marker id="brazil-pressure-en-6-panel3-dark-panel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#121419" /></marker><marker id="brazil-pressure-en-6-panel3-dark-panel2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#171a20" /></marker><marker id="brazil-pressure-en-6-panel3-dark-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e7e9ee" /></marker><marker id="brazil-pressure-en-6-panel3-dark-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b909b" /></marker><marker id="brazil-pressure-en-6-panel3-dark-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5eead4" /></marker><marker id="brazil-pressure-en-6-panel3-dark-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f5b13d" /></marker><marker id="brazil-pressure-en-6-panel3-dark-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff4d87" /></marker><marker id="brazil-pressure-en-6-panel3-dark-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7aa2f7" /></marker><marker id="brazil-pressure-en-6-panel3-dark-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b909b" /></marker></defs><defs><clipPath id="brazil-pressure-en-6-panel3-dark-viewport" clipPathUnits="userSpaceOnUse"><rect x="0" y="1043" width="600" height="441" /></clipPath></defs><g clip-path="url(#brazil-pressure-en-6-panel3-dark-viewport)" data-source-composition="complete"><rect width="600" height="1484" rx="20" fill="#0c0d10" /><path d="M 0,0 V 1484" stroke="#e7e9ee" stroke-opacity="0.025" /><path d="M 80,0 V 1484" stroke="#e7e9ee" stroke-opacity="0.025" /><path d="M 160,0 V 1484" stroke="#e7e9ee" stroke-opacity="0.025" /><path d="M 240,0 V 1484" stroke="#e7e9ee" stroke-opacity="0.025" /><path d="M 320,0 V 1484" stroke="#e7e9ee" stroke-opacity="0.025" /><path d="M 400,0 V 1484" stroke="#e7e9ee" stroke-opacity="0.025" /><path d="M 480,0 V 1484" stroke="#e7e9ee" stroke-opacity="0.025" /><path d="M 560,0 V 1484" stroke="#e7e9ee" stroke-opacity="0.025" /><text x="32.00" y="34.00" fill="#5eead4" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start">l0g  /  THE GEOPOLITICS OF CAPITAL</text><text x="568.00" y="34.00" fill="#8b909b" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="end">06</text><text x="32.00" y="91.00" fill="#e7e9ee" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start">After the vote, three</text><text x="32.00" y="134.18" fill="#e7e9ee" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start">branches</text><text x="32.00" y="169.18" fill="#8b909b" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">Scenarios without probabilities. Official</text><text x="32.00" y="200.46" fill="#8b909b" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">decisions will distinguish the paths.</text><rect x="32" y="236.46" width="536" height="148.75" rx="15" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.5" /><rect x="32" y="236.46" width="4" height="148.75" rx="2" fill="#7aa2f7" /><text x="50.00" y="265.46" fill="#7aa2f7" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">04.10 / 25.10.2026</text><text x="50.00" y="299.46" fill="#e7e9ee" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Result established by Brazil’s electoral</text><text x="50.00" y="331.96" fill="#e7e9ee" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">institutions</text><rect x="81" y="430.21000000000004" width="487" height="181.25" rx="15" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.5" /><rect x="81" y="430.21000000000004" width="4" height="181.25" rx="2" fill="#5eead4" /><text x="99.00" y="459.21" fill="#5eead4" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">A · RECOGNITION</text><text x="99.00" y="493.21" fill="#e7e9ee" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Negotiations continue</text><text x="99.00" y="525.71" fill="#e7e9ee" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Watch: official recognition and</text><text x="99.00" y="558.21" fill="#e7e9ee" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">instruments reducing tariffs.</text><path d="M 48,408.21000000000004 L 48,454.21000000000004" fill="none" stroke="#8b909b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 8" /><path d="M 48,454.21000000000004 L 70,454.21000000000004" fill="none" stroke="#5eead4" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 8" marker-end="url(#brazil-pressure-en-6-panel3-dark-teal)" /><rect x="81" y="636.46" width="487" height="181.25" rx="15" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.5" /><rect x="81" y="636.46" width="4" height="181.25" rx="2" fill="#ff4d87" /><text x="99.00" y="665.46" fill="#ff4d87" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">B · CHALLENGE</text><text x="99.00" y="699.46" fill="#e7e9ee" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Uncertainty persists</text><text x="99.00" y="731.96" fill="#e7e9ee" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Watch: nature of objections, then</text><text x="99.00" y="764.46" fill="#e7e9ee" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">any new measures.</text><path d="M 48,408.21000000000004 L 48,660.46" fill="none" stroke="#8b909b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 8" /><path d="M 48,660.46 L 70,660.46" fill="none" stroke="#ff4d87" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 8" marker-end="url(#brazil-pressure-en-6-panel3-dark-red)" /><rect x="81" y="842.71" width="487" height="181.25" rx="15" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.5" /><rect x="81" y="842.71" width="4" height="181.25" rx="2" fill="#f5b13d" /><text x="99.00" y="871.71" fill="#f5b13d" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">C · CONDITIONS</text><text x="99.00" y="905.71" fill="#e7e9ee" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Explicit concessions</text><text x="99.00" y="938.21" fill="#e7e9ee" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Watch: texts linking market access</text><text x="99.00" y="970.71" fill="#e7e9ee" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">to specific commitments.</text><path d="M 48,408.21000000000004 L 48,866.71" fill="none" stroke="#8b909b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 8" /><path d="M 48,866.71 L 70,866.71" fill="none" stroke="#f5b13d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 8" marker-end="url(#brazil-pressure-en-6-panel3-dark-amber)" /><path d="M 32,1048.96 L 568,1048.96" fill="none" stroke="rgba(255, 255, 255, 0.20)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="32" y="1083.96" width="536" height="213.75" rx="15" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.5" /><rect x="32" y="1083.96" width="4" height="213.75" rx="2" fill="#7aa2f7" /><text x="50.00" y="1112.96" fill="#7aa2f7" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">MILITARY RISK · SEPARATE CASE</text><text x="50.00" y="1146.96" fill="#e7e9ee" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Requires its own evidence: decision,</text><text x="50.00" y="1179.46" fill="#e7e9ee" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">legal basis, deployment and objectives.</text><text x="50.00" y="1211.96" fill="#e7e9ee" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">FTO designation is not an authorisation</text><text x="50.00" y="1244.46" fill="#e7e9ee" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">to use force.</text><path d="M 32,1324.71 L 568,1324.71" fill="none" stroke="rgba(255, 255, 255, 0.20)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="32.00" y="1355.71" fill="#8b909b" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">These are alternative branches, not automatic</text><text x="32.00" y="1380.41" fill="#8b909b" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">escalation. No election outcome is anticipated.</text><text x="32.00" y="1427.41" fill="#8b909b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Sources: S01 · S05 · S19 · S27 · l0g analysis</text><text x="32.00" y="1453.41" fill="#5eead4" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">03.10.2026  ·  l0g.fr</text></g></svg>
