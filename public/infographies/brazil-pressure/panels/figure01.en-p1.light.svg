23" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start">Pressure changes its route</text><text x="32.00" y="126.00" fill="#4d5461" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">Withdrawals, renewed tariffs and two parallel</text><text x="32.00" y="157.28" fill="#4d5461" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">tracks before the vote.</text><rect x="66" y="193.28" width="502" height="116.25" rx="15" fill="#ffffff" stroke="rgba(12, 13, 16, 0.26)" stroke-width="1.5" /><rect x="66" y="193.28" width="4" height="116.25" rx="2" fill="#a50f4d" /><text x="84.00" y="222.28" fill="#a50f4d" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">30.07.2025</text><text x="84.00" y="256.28" fill="#1b1d23" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">+40% tariff and Moraes designation</text><circle cx="43" cy="215.28" r="7" fill="#a50f4d" /><path d="M 43,225.28 L 43,335.53" fill="none" stroke="#4d5461" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#brazil-pressure-en-1-panel1-light-line)" /><rect x="66" y="339.53" width="502" height="148.75" rx="15" fill="#ffffff" stroke="rgba(12, 13, 16, 0.26)" stroke-width="1.5" /><rect x="66" y="339.53" width="4" height="148.75" rx="2" fill="#1d4ed8" /><text x="84.00" y="368.53" fill="#1d4ed8" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">12.12.25 / 20.02.26</text><text x="84.00" y="402.53" fill="#1b1d23" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Sanctions removed, then IEEPA</text><text x="84.00" y="435.03" fill="#1b1d23" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">duties ended</text><circle cx="43" cy="361.53" r="7" fill="#1d4ed8" /><path d="M 43,371.53 L 43,514.28" fill="none" stroke="#4d5461" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#brazil-pressure-en-1-panel1-light-line)" /><rect x="66" y="518.28" width="502" height="148.75" rx="15" fill="#ffffff" stroke="rgba(12, 13, 16, 0.26)" stroke-width="1.5" /><rect x="66" y="518.28" width="4" height="148.75" rx="2" fill="#92400e" /><text x="84.00" y="547.28" fill="#92400e" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">22 / 24.07.2026</text><text x="84.00" y="581.28" fill="#1b1d23" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Section 301: +25%, then +12.5% for</text><text x="84.00" y="613.78" fill="#1b1d23" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">covered goods</text><circle cx="43" cy="540.28" r="7" fill="#92400e" /><text x="32.00" y="697.03" fill="#0b5f58" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">BEFORE THE VOTE: TWO SIMULTANEOUS TRACKS</text><rect x="32" y="734.03" width="536" height="148.75" rx="15" fill="#ffffff" stroke="rgba(12, 13, 16, 0.26)" stroke-width="1.5" /><rect x="32" y="734.03" width="4" height="148.75" rx="2" fill="#0b5f58" /><text x="50.00" y="763.03" fill="#0b5f58" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">30.09 · MILWAUKEE</text><text x="50.00" y="797.03" fill="#1b1d23" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Trade working group announced. A</text><text x="50.00" y="829.53" fill="#1b1d23" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">negotiated exit remains open.</text><rect x="32" y="904.78" width="536" height="181.25" rx="15" fill="#ffffff" stroke="rgba(12, 13, 16, 0.26)" stroke-width="1.5" /><rect x="32" y="904.78" width="4" height="181.25" rx="2" fill="#92400e" /><text x="50.00" y="933.78" fill="#92400e" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">01.10 · BRASÍLIA</text><text x="50.00" y="967.78" fill="#1b1d23" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Alleged $1m funding: AGU requests</text><text x="50.00" y="1000.28" fill="#1b1d23" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">investigation. Payment remains</text><text x="50.00" y="1032.78" fill="#1b1d23" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">unverified.</text><rect x="32" y="1108.03" width="536" height="82" rx="15" fill="#eef0f4" /><text x="52.00" y="1142.03" fill="#1b1d23" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start">04.10.2026  →  VOTE</text><text x="52.00" y="1170.03" fill="#4d5461" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">25 October: possible runoff</text><path d="M 32,1216.03 L 568,1216.03" fill="none" stroke="rgba(12, 13, 16, 0.26)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="32.00" y="1247.03" fill="#4d5461" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Decision chronology, not a severity scale.</text><text x="32.00" y="1294.03" fill="#4d5461" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Sources: S01 · S03 · S09 · S11–S13 · S15 · S27</text><text x="32.00" y="1320.03" fill="#0b5f58" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">03.10.2026  ·  l0g.fr</text></g></svg>
