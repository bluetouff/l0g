0" text-anchor="end">06</text><text x="32.00" y="91.00" fill="#1b1d23" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start">Après le vote, trois</text><text x="32.00" y="134.18" fill="#1b1d23" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start">bifurcations</text><text x="32.00" y="169.18" fill="#4d5461" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">Scénarios sans probabilités. Les actes officiels</text><text x="32.00" y="200.46" fill="#4d5461" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">permettront de distinguer les trajectoires.</text><rect x="32" y="236.46" width="536" height="148.75" rx="15" fill="#ffffff" stroke="rgba(12, 13, 16, 0.26)" stroke-width="1.5" /><rect x="32" y="236.46" width="4" height="148.75" rx="2" fill="#1d4ed8" /><text x="50.00" y="265.46" fill="#1d4ed8" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">04.10 / 25.10.2026</text><text x="50.00" y="299.46" fill="#1b1d23" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Résultat établi par les institutions</text><text x="50.00" y="331.96" fill="#1b1d23" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">électorales brésiliennes</text><rect x="81" y="430.21000000000004" width="487" height="181.25" rx="15" fill="#ffffff" stroke="rgba(12, 13, 16, 0.26)" stroke-width="1.5" /><rect x="81" y="430.21000000000004" width="4" height="181.25" rx="2" fill="#0b5f58" /><text x="99.00" y="459.21" fill="#0b5f58" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">A · RECONNAISSANCE</text><text x="99.00" y="493.21" fill="#1b1d23" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Négociation poursuivie</text><text x="99.00" y="525.71" fill="#1b1d23" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">À vérifier : déclaration officielle et</text><text x="99.00" y="558.21" fill="#1b1d23" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">actes réduisant les tarifs.</text><path d="M 48,408.21000000000004 L 48,454.21000000000004" fill="none" stroke="#4d5461" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 8" /><path d="M 48,454.21000000000004 L 70,454.21000000000004" fill="none" stroke="#0b5f58" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 8" marker-end="url(#brazil-pressure-fr-6-panel1-light-teal)" /><rect x="81" y="636.46" width="487" height="213.75" rx="15" fill="#ffffff" stroke="rgba(12, 13, 16, 0.26)" stroke-width="1.5" /><rect x="81" y="636.46" width="4" height="213.75" rx="2" fill="#a50f4d" /><text x="99.00" y="665.46" fill="#a50f4d" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">B · CONTESTATION</text><text x="99.00" y="699.46" fill="#1b1d23" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Incertitude prolongée</text><text x="99.00" y="731.96" fill="#1b1d23" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">À vérifier : nature des objections,</text><text x="99.00" y="764.46" fill="#1b1d23" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">puis éventuelles mesures</text><text x="99.00" y="796.96" fill="#1b1d23" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">nouvelles.</text><path d="M 48,408.21000000000004 L 48,660.46" fill="none" stroke="#4d5461" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 8" /><path d="M 48,660.46 L 70,660.46" fill="none" stroke="#a50f4d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 8" marker-end="url(#brazil-pressure-fr-6-panel1-light-red)" /><rect x="81" y="875.21" width="487" height="181.25" rx="15" fill="#ffffff" stroke="rgba(12, 13, 16, 0.26)" stroke-width="1.5" /><rect x="81" y="875.21" width="4" height="181.25" rx="2" fill="#92400e" /><text x="99.00" y="904.21" fill="#92400e" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">C · CONDITIONS</text><text x="99.00" y="938.21" fill="#1b1d23" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Concessions explicites</text><text x="99.00" y="970.71" fill="#1b1d23" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">À vérifier : textes liant accès au</text><text x="99.00" y="1003.21" fill="#1b1d23" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">marché et engagements précis.</text><path d="M 48,408.21000000000004 L 48,899.21" fill="none" stroke="#4d5461" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 8" /><path d="M 48,899.21 L 70,899.21" fill="none" stroke="#92400e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 8" marker-end="url(#brazil-pressure-fr-6-panel1-light-amber)" /><path d="M 32,1081.46 L 568,1081.46" fill="none" stroke="rgba(12, 13, 16, 0.26)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="32" y="1116.46" width="536" height="213.75" rx="15" fill="#ffffff" stroke="rgba(12, 13, 16, 0.26)" stroke-width="1.5" /><rect x="32" y="1116.46" width="4" height="213.75" rx="2" fill="#1d4ed8" /><text x="50.00" y="1145.46" fill="#1d4ed8" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">RISQUE MILITAIRE · DOSSIER SÉPARÉ</text><text x="50.00" y="1179.46" fill="#1b1d23" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Exiger des preuves propres : décision,</text><text x="50.00" y="1211.96" fill="#1b1d23" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">base juridique, déploiement et</text><text x="50.00" y="1244.46" fill="#1b1d23" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">objectifs. Une désignation FTO ne vaut</text><text x="50.00" y="1276.96" fill="#1b1d23" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">pas autorisation de force.</text><path d="M 32,1357.21 L 568,1357.21" fill="none" stroke="rgba(12, 13, 16, 0.26)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="32.00" y="1388.21" fill="#4d5461" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Les branches sont alternatives, pas une escalade</text><text x="32.00" y="1412.91" fill="#4d5461" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">automatique. Aucun résultat électoral anticipé.</text><text x="32.00" y="1459.91" fill="#4d5461" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Sources : S01 · S05 · S19 · S27 · analyse l0g</text><text x="32.00" y="1485.91" fill="#0b5f58" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">03.10.2026  ·  l0g.fr</text></g></svg>
