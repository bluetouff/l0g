Vu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Négociation poursuivie</text><text x="99.00" y="525.71" fill="#e7e9ee" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">À vérifier : déclaration officielle et</text><text x="99.00" y="558.21" fill="#e7e9ee" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">actes réduisant les tarifs.</text><path d="M 48,408.21000000000004 L 48,454.21000000000004" fill="none" stroke="#8b909b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 8" /><path d="M 48,454.21000000000004 L 70,454.21000000000004" fill="none" stroke="#5eead4" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 8" marker-end="url(#brazil-pressure-fr-6-panel3-dark-teal)" /><rect x="81" y="636.46" width="487" height="213.75" rx="15" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.5" /><rect x="81" y="636.46" width="4" height="213.75" rx="2" fill="#ff4d87" /><text x="99.00" y="665.46" fill="#ff4d87" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">B · CONTESTATION</text><text x="99.00" y="699.46" fill="#e7e9ee" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Incertitude prolongée</text><text x="99.00" y="731.96" fill="#e7e9ee" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">À vérifier : nature des objections,</text><text x="99.00" y="764.46" fill="#e7e9ee" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">puis éventuelles mesures</text><text x="99.00" y="796.96" fill="#e7e9ee" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">nouvelles.</text><path d="M 48,408.21000000000004 L 48,660.46" fill="none" stroke="#8b909b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 8" /><path d="M 48,660.46 L 70,660.46" fill="none" stroke="#ff4d87" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 8" marker-end="url(#brazil-pressure-fr-6-panel3-dark-red)" /><rect x="81" y="875.21" width="487" height="181.25" rx="15" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.5" /><rect x="81" y="875.21" width="4" height="181.25" rx="2" fill="#f5b13d" /><text x="99.00" y="904.21" fill="#f5b13d" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">C · CONDITIONS</text><text x="99.00" y="938.21" fill="#e7e9ee" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Concessions explicites</text><text x="99.00" y="970.71" fill="#e7e9ee" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">À vérifier : textes liant accès au</text><text x="99.00" y="1003.21" fill="#e7e9ee" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">marché et engagements précis.</text><path d="M 48,408.21000000000004 L 48,899.21" fill="none" stroke="#8b909b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 8" /><path d="M 48,899.21 L 70,899.21" fill="none" stroke="#f5b13d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 8" marker-end="url(#brazil-pressure-fr-6-panel3-dark-amber)" /><path d="M 32,1081.46 L 568,1081.46" fill="none" stroke="rgba(255, 255, 255, 0.20)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="32" y="1116.46" width="536" height="213.75" rx="15" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.5" /><rect x="32" y="1116.46" width="4" height="213.75" rx="2" fill="#7aa2f7" /><text x="50.00" y="1145.46" fill="#7aa2f7" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">RISQUE MILITAIRE · DOSSIER SÉPARÉ</text><text x="50.00" y="1179.46" fill="#e7e9ee" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Exiger des preuves propres : décision,</text><text x="50.00" y="1211.96" fill="#e7e9ee" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">base juridique, déploiement et</text><text x="50.00" y="1244.46" fill="#e7e9ee" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">objectifs. Une désignation FTO ne vaut</text><text x="50.00" y="1276.96" fill="#e7e9ee" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">pas autorisation de force.</text><path d="M 32,1357.21 L 568,1357.21" fill="none" stroke="rgba(255, 255, 255, 0.20)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="32.00" y="1388.21" fill="#8b909b" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Les branches sont alternatives, pas une escalade</text><text x="32.00" y="1412.91" fill="#8b909b" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">automatique. Aucun résultat électoral anticipé.</text><text x="32.00" y="1459.91" fill="#8b909b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Sources : S01 · S05 · S19 · S27 · analyse l0g</text><text x="32.00" y="1485.91" fill="#5eead4" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">03.10.2026  ·  l0g.fr</text></g></svg>
