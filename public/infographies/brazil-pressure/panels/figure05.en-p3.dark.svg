-dark-line)" /><rect x="71" y="722.21" width="497" height="148.75" rx="15" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.5" /><rect x="71" y="722.21" width="4" height="148.75" rx="2" fill="#5eead4" /><text x="89.00" y="751.21" fill="#5eead4" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">PURCHASING SPV</text><text x="89.00" y="785.21" fill="#e7e9ee" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Funded demand + purchase</text><text x="89.00" y="817.71" fill="#e7e9ee" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">financing</text><text x="32.00" y="913.96" fill="#f5b13d" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start">CONTRACT · 15 YEARS</text><rect x="71" y="933.96" width="497" height="148.75" rx="15" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.5" /><rect x="71" y="933.96" width="4" height="148.75" rx="2" fill="#5eead4" /><text x="89.00" y="962.96" fill="#5eead4" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">SERRA VERDE · GOIÁS</text><text x="89.00" y="996.96" fill="#e7e9ee" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">100% of the Phase 1 scope: Nd, Pr,</text><text x="89.00" y="1029.46" fill="#e7e9ee" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Dy, Tb. Price floors.</text><path d="M 44,948.96 L 44,1067.71" fill="none" stroke="#5eead4" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#brazil-pressure-en-5-panel3-dark-teal)" /><rect x="32" y="1107.71" width="536" height="148.75" rx="15" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.5" /><rect x="32" y="1107.71" width="4" height="148.75" rx="2" fill="#7aa2f7" /><text x="50.00" y="1136.71" fill="#7aa2f7" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">DFC · PROJECT FINANCING</text><text x="50.00" y="1170.71" fill="#e7e9ee" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">$565m announced to optimise and</text><text x="50.00" y="1203.21" fill="#e7e9ee" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">expand the project.</text><rect x="32" y="1281.46" width="536" height="181.25" rx="15" fill="#121419" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.5" /><rect x="32" y="1281.46" width="4" height="181.25" rx="2" fill="#f5b13d" /><text x="50.00" y="1310.46" fill="#f5b13d" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">TOWARDS THE INDUSTRIAL CHAIN</text><text x="50.00" y="1344.46" fill="#e7e9ee" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Production → separation / metals →</text><text x="50.00" y="1376.96" fill="#e7e9ee" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">magnets. First deliveries initially</text><text x="50.00" y="1409.46" fill="#e7e9ee" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">expected early Q4.</text><text x="32.00" y="1492.71" fill="#e7e9ee" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start">03.09.2026 · COMBINATION COMPLETED</text><text x="32.00" y="1527.71" fill="#5eead4" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start">USA Rare Earth + Serra Verde</text><path d="M 32,1564.71 L 568,1564.71" fill="none" stroke="rgba(255, 255, 255, 0.20)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="32.00" y="1595.71" fill="#8b909b" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Commitments and conditional credit ≠ cash paid. No</text><text x="32.00" y="1620.41" fill="#8b909b" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">contractual electoral quid pro quo established.</text><text x="32.00" y="1645.11" fill="#8b909b" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Deliveries remain to be verified.</text><text x="32.00" y="1692.11" fill="#8b909b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Sources: S21–S24 · SEC filings / issuers</text><text x="32.00" y="1718.11" fill="#5eead4" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">03.10.2026  ·  l0g.fr</text></g></svg>
