" y="818.21" fill="#92400e" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">CASE A</text><text x="50.00" y="852.21" fill="#1b1d23" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Supplier price unchanged: the importer</text><text x="50.00" y="884.71" fill="#1b1d23" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">finances $137.50.</text><rect x="32" y="957.96" width="536" height="148.75" rx="15" fill="#ffffff" stroke="rgba(12, 13, 16, 0.26)" stroke-width="1.5" /><rect x="32" y="957.96" width="4" height="148.75" rx="2" fill="#0b5f58" /><text x="50.00" y="986.96" fill="#0b5f58" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">CASE B</text><text x="50.00" y="1020.96" fill="#1b1d23" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Final cost held at $100: supplier price</text><text x="50.00" y="1053.46" fill="#1b1d23" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">$72.73, a 27.27% reduction.</text><path d="M 32,1126.71 L 568,1126.71" fill="none" stroke="rgba(12, 13, 16, 0.26)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="32.00" y="1157.71" fill="#4d5461" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Excludes freight, ordinary duties and other charges.</text><text x="32.00" y="1182.41" fill="#4d5461" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Actual burden-sharing is unknown.</text><text x="32.00" y="1229.41" fill="#4d5461" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Sources: S13 · S15 · l0g calculation</text><text x="32.00" y="1255.41" fill="#0b5f58" font-family="DejaVu Sans, Arial, sans-se