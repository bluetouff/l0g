ure-en-4-panel2-light-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0b5f58" /></marker><marker id="brazil-pressure-en-4-panel2-light-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#92400e" /></marker><marker id="brazil-pressure-en-4-panel2-light-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a50f4d" /></marker><marker id="brazil-pressure-en-4-panel2-light-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8" /></marker><marker id="brazil-pressure-en-4-panel2-light-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4d5461" /></marker></defs><defs><clipPath id="brazil-pressure-en-4-panel2-light-viewport" clipPathUnits="userSpaceOnUse"><rect x="0" y="729" width="600" height="408" /></clipPath></defs><g clip-path="url(#brazil-pressure-en-4-panel2-light-viewport)" data-source-composition="complete"><rect width="600" height="1919" rx="20" fill="#e7e9ee" /><path d="M 0,0 V 1919" stroke="#1b1d23" stroke-opacity="0.025" /><path d="M 80,0 V 1919" stroke="#1b1d23" stroke-opacity="0.025" /><path d="M 160,0 V 1919" stroke="#1b1d23" stroke-opacity="0.025" /><path d="M 240,0 V 1919" stroke="#1b1d23" stroke-opacity="0.025" /><path d="M 320,0 V 1919" stroke="#1b1d23" stroke-opacity="0.025" /><path d="M 400,0 V 1919" stroke="#1b1d23" stroke-opacity="0.025" /><path d="M 480,0 V 1919" stroke="#1b1d23" stroke-opacity="0.025" /><path d="M 560,0 V 1919" stroke="#1b1d23" stroke-opacity="0.025" /><text x="32.00" y="34.00" fill="#0b5f58" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start">l0g  /  THE GEOPOLITICS OF CAPITAL</text><text x="568.00" y="34.00" fill="#4d5461" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="end">04</text><text x="32.00" y="91.00" fill="#1b1d23" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start">From politics to financing</text><text x="32.00" y="126.00" fill="#4d5461" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">A possible transmission chain, then observed</text><text x="32.00" y="157.28" fill="#4d5461" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">financial context. Two evidence levels.</text><rect x="71" y="193.28" width="497" height="116.25" rx="15" fill="#ffffff" stroke="rgba(12, 13, 16, 0.26)" stroke-width="1.5" /><rect x="71" y="193.28" width="4" height="116.25" rx="2" fill="#92400e" /><text x="89.00" y="222.28" fill="#92400e" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">STEP 1</text><text x="89.00" y="256.28" fill="#1b1d23" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Institutional uncertainty</text><path d="M 47,213.28 L 47,335.53" fill="none" stroke="#92400e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 8" marker-end="url(#brazil-pressure-en-4-panel2-light-amber)" /><circle cx="47" cy="208.28" r="6" fill="#92400e" /><rect x="71" y="332.53" width="497" height="116.25" rx="15" fill="#ffffff" stroke="rgba(12, 13, 16, 0.26)" stroke-width="1.5" /><rect x="71" y="332.53" width="4" height="116.25" rx="2" fill="#92400e" /><text x="89.00" y="361.53" fill="#92400e" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">STEP 2</text><text x="89.00" y="395.53" fill="#1b1d23" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Demand for hedging</text><path d="M 47,352.53 L 47,474.78" fill="none" stroke="#92400e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 8" marker-end="url(#brazil-pressure-en-4-panel2-light-amber)" /><circle cx="47" cy="347.53" r="6" fill="#92400e" /><rect x="71" y="471.78" width="497" height="116.25" rx="15" fill="#ffffff" stroke="rgba(12, 13, 16, 0.26)" stroke-width="1.5" /><rect x="71" y="471.78" width="4" height="116.25" rx="2" fill="#92400e" /><text x="89.00" y="500.78" fill="#92400e" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">STEP 3</text><text x="89.00" y="534.78" fill="#1b1d23" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Credit and FX repriced</text><path d="M 47,491.78 L 47,614.03" fill="none" stroke="#92400e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 8" marker-end="url(#brazil-pressure-en-4-panel2-light-amber)" /><circle cx="47" cy="486.78" r="6" fill="#92400e" /><rect x="71" y="611.03" width="497" height="116.25" rx="15" fill="#ffffff" stroke="rgba(12, 13, 16, 0.26)" stroke-width="1.5" /><rect x="71" y="611.03" width="4" height="116.25" rx="2" fill="#92400e" /><text x="89.00" y="640.03" fill="#92400e" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">STEP 4</text><text x="89.00" y="674.03" fill="#1b1d23" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Investment delayed</text><circle cx="47" cy="626.03" r="6" fill="#92400e" /><text x="32.00" y="750.28" fill="#0b5f58" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start">ONE FX MOVE, TWO BALANCE SHEETS</text><rect x="32" y="783.28" width="536" height="148.75" rx="15" fill="#ffffff" stroke="rgba(12, 13, 16, 0.26)" stroke-width="1.5" /><rect x="32" y="783.28" width="4" height="148.75" rx="2" fill="#0b5f58" /><text x="50.00" y="812.28" fill="#0b5f58" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">DOLLAR REVENUES</text><text x="50.00" y="846.28" fill="#1b1d23" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">A weaker real can support margins</text><text x="50.00" y="878.78" fill="#1b1d23" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">when costs remain local.</text><rect x="32" y="954.03" width="536" height="148.75" rx="15" fill="#ffffff" stroke="rgba(12, 13, 16, 0.26)" stroke-width="1.5" /><rect x="32" y="954.03" width="4" height="148.75" rx="2" fill="#a50f4d" /><text x="50.00" y="983.03" fill="#a50f4d" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">DOLLAR DEBT</text><text x="50.00" y="1017.03" fill="#1b1d23" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Real-denominated revenues may</text><text x="50.00" y="1049.53" fill="#1b1d23" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">struggle to cover debt payments.</text><path d="M 32,1124.78 L 568,1124.78" fill="none" stroke="rgba(12, 13, 16, 0.26)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="32.00" y="1164.78" fill="#1d4ed8" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start">OBSERVED CONTEXT · AUGUST 2026</text><rect x="32" y="1196.78" width="536" height="148.75" rx="15" fill="#ffffff" stroke="rgba(12, 13, 16, 0.26)" stroke-width="1.5" /><rect x="32" y="1196.78" width="4" height="148.75" rx="2" fill="#1d4ed8" /><text x="50.00" y="1225.78" fill="#1d4ed8" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">STOCK · END-AUGUST</text><text x="50.00" y="1259.78" fill="#1b1d23" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">$372.6bn reserves</text><text x="50.00" y="1292.28" fill="#1b1d23" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Central-bank reserves.</text><rect x="32" y="1365.53" width="536" height="181.25" rx="15" fill="#ffffff" stroke="rgba(12, 13, 16, 0.26)" stroke-width="1.5" /><rect x="32" y="1365.53" width="4" height="181.25" rx="2" fill="#1d4ed8" /><text x="50.00" y="1394.53" fill="#1d4ed8" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">FLOWS · 12 MONTHS</text><text x="50.00" y="1428.53" fill="#1b1d23" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">$63.0bn / $86.6bn</text><text x="50.00" y="1461.03" fill="#1b1d23" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Current-account deficit / net inward</text><text x="50.00" y="1493.53" fill="#1b1d23" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">direct investment.</text><rect x="32" y="1566.78" width="536" height="148.75" rx="15" fill="#ffffff" stroke="rgba(12, 13, 16, 0.26)" stroke-width="1.5" /><rect x="32" y="1566.78" width="4" height="148.75" rx="2" fill="#1d4ed8" /><text x="50.00" y="1595.78" fill="#1d4ed8" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">FLOW · ONE MONTH</text><text x="50.00" y="1629.78" fill="#1b1d23" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">$5.2bn outflow</text><text x="50.00" y="1662.28" fill="#1b1d23" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Net portfolio outflow in August.</text><path d="M 32,1735.53 L 568,1735.53" fill="none" stroke="rgba(12, 13, 16, 0.26)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="32.00" y="1766.53" fill="#4d5461" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Direct investment includes reinvested earnings and</text><text x="32.00" y="1791.23" fill="#4d5461" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">intercompany transactions. Dashed paths are</text><text x="32.00" y="1815.93" fill="#4d5461" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">scenarios, not estimated causality.</text><text x="32.00" y="1862.93" fill="#4d5461" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Sources: S18–S20 · l0g analysis</text><text x="32.00" y="1888.93" fill="#0b5f58" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">03.10.2026  ·  l0g.fr</text></g></svg>
