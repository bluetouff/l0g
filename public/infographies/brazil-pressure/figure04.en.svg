ort margins when</text><text x="62.00" y="481.60" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">costs remain local.</text><rect x="582" y="390.0" width="494" height="171" rx="15" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1.5" /><rect x="582" y="390.0" width="4" height="171" rx="2" fill="var(--color-accent)" /><text x="600.00" y="419.00" fill="var(--color-accent)" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">DOLLAR DEBT</text><text x="600.00" y="453.00" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">Real-denominated revenues may</text><text x="600.00" y="481.60" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">struggle to cover debt payments.</text><path d="M 44,594.0 L 1076,594.0" fill="none" stroke="var(--color-line-strong)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="44.00" y="634.00" fill="var(--color-topic-blue)" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start">OBSERVED CONTEXT · AUGUST 2026</text><rect x="44" y="666.0" width="324" height="204" rx="15" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1.5" /><rect x="44" y="666.0" width="4" height="204" rx="2" fill="var(--color-topic-blue)" /><text x="62.00" y="695.00" fill="var(--color-topic-blue)" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">STOCK · END-AUGUST</text><text x="62.00" y="729.00" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">$372.6bn reserves</text><text x="62.00" y="756.30" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Central-bank reserves.</text><rect x="398" y="666.0" width="324" height="204" rx="15" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1.5" /><rect x="398" y="666.0" width="4" height="204" rx="2" fill="var(--color-topic-blue)" /><text x="416.00" y="695.00" fill="var(--color-topic-blue)" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">FLOWS · 12 MONTHS</text><text x="416.00" y="729.00" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">$63.0bn / $86.6bn</text><text x="416.00" y="756.30" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Current-account deficit /</text><text x="416.00" y="783.60" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">net inward direct</text><text x="416.00" y="810.90" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">investment.</text><rect x="752" y="666.0" width="324" height="204" rx="15" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1.5" /><rect x="752" y="666.0" width="4" height="204" rx="2" fill="var(--color-topic-blue)" /><text x="770.00" y="695.00" fill="var(--color-topic-blue)" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">FLOW · ONE MONTH</text><text x="770.00" y="729.00" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">$5.2bn outflow</text><text x="770.00" y="756.30" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Net portfolio outflow in</text><text x="770.00" y="783.60" fill="var(--color-pape