roke-opacity="0.025" /><path d="M 320,0 V 1286" stroke="var(--color-paper)" stroke-opacity="0.025" /><path d="M 400,0 V 1286" stroke="var(--color-paper)" stroke-opacity="0.025" /><path d="M 480,0 V 1286" stroke="var(--color-paper)" stroke-opacity="0.025" /><path d="M 560,0 V 1286" stroke="var(--color-paper)" stroke-opacity="0.025" /><text x="32.00" y="34.00" fill="var(--color-signal)" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start">l0g  /  THE GEOPOLITICS OF CAPITAL</text><text x="568.00" y="34.00" fill="var(--color-muted)" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="end">02</text><text x="32.00" y="91.00" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start">The tariff reaches the</text><text x="32.00" y="134.18" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start">margin</text><text x="32.00" y="169.18" fill="var(--color-muted)" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">A $100 example for goods covered by both</text><text x="32.00" y="200.46" fill="var(--color-muted)" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">July 2026 measures.</text><rect x="32" y="236.46" width="536" height="148.75" rx="15" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1.5" /><rect x="32" y="236.46" width="4" height="148.75" rx="2" fill="var(--color-topic-blue)" /><text x="50.00" y="265.46" fill="var(--color-topic-blue)" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">CHECK COVERAGE FIRST</text><text x="50.00" y="299.46" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Origin + tariff code + entry date +</text><text x="50.00" y="331.96" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">exemptions under both measures.</text><text x="32.00" y="423.21" fill="var(--color-amber)" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start">37.5 additional points</text><text x="32.00" y="463.21" fill="var(--color-muted)" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">The case covered by both measures</text><rect x="32" y="508.21000000000004" width="389.8181818181818" height="70" rx="0" fill="var(--color-signal)" data-component="customs-value" data-value="100" data-unit="USD" /><rect x="421.8181818181818" y="508.21000000000004" width="97.45454545454545" height="70" rx="0" fill="var(--color-amber)" data-component="additional-duty-25" data-value="25" data-unit="USD" /><rect x="519.2727272727273" y="508.21000000000004" width="48.72727272727273" height="70" rx="0" fill="var(--color-accent)" data-component="additional-duty-12.5" data-value="12.5" data-unit="USD" /><text x="48.00" y="554.21" fill="var(--color-ink)" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start">$100</text><circle cx="39" cy="608.21" r="5" fill="var(--color-signal)" /><text x="54.00" y="615.21" fill="var(--color-muted)" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Value $100</text><circle cx="39" cy="642.21" r="5" fill="var(--color-amber)" /><text x="54.00" y="649.21" fill="var(--color-muted)" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">+$25</text><circle cx="39" cy="676.21" r="5" fill="var(--color-accent)" /><text x="54.00" y="683.21" fill="var(--color-muted)" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">+$12.50</text><text x="568.00" y="682.21" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="end">$137.50</text><path d="M 32,726.21 L 568,726.21" fill="none" stroke="var(--color-line-strong)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="32.00" y="764.21" fill="var(--color-signal)" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start">WHO ABSORBS THE SHOCK?</text><rect x="32" y="789.21" width="536" height="148.75" rx="15" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1.5" /><rect x="32" y="789.21" width="4" height="148.75" rx="2" fill="var(--color-amber)" /><text x="50.00" y="818.21" fill="var(--color-amber)" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">CASE A</text><text x="50.00" y="852.21" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Supplier price unchanged: the importer</text><text x="50.00" y="884.71" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">finances $137.50.</text><rect x="32" y="957.96" width="536" height="148.75" rx="15" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1.5" /><rect x="32" y="957.96" width="4" height="148.75" rx="2" fill="var(--color-signal)" /><text x="50.00" y="986.96" fill="var(--color-signal)" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">CASE B</text><text x="50.00" y="1020.96" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Final cost held at $100: supplier price</text><text x="50.00" y="1053.46" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">$72.73, a 27.27% reduction.</text><path d="M 32,1126.71 L 568,1126.71" fill="none" stroke="var(--color-line-strong)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="32.00" y="1157.71" fill="var(--color-muted)" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Excludes freight, ordinary duties and other charges.</text><text x="32.00" y="1182.41" fill="var(--color-muted)" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Actual burden-sharing is unknown.</text><text x="32.00" y="1229.41" fill="var(--color-muted)" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Sources: S13 · S15 · l0g calculation</text><text x="32.00" y="1255.41" fill="var(--color-signal)" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">03.10.2026  ·  l0g.fr</text></svg>
