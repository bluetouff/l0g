--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">≥ $300m · Forward contracts over 5</text><text x="89.00" y="644.96" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">years</text><path d="M 48,564.46 L 48,726.21" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><circle cx="48" cy="564.46" r="6" fill="var(--color-amber)" /><path d="M 48,718.21 L 48,745.21" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><path d="M 48,745.21 L 70,745.21" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#brazil-pressure-en-5-full-mobile-line)" /><rect x="71" y="722.21" width="497" height="148.75" rx="15" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1.5" /><rect x="71" y="722.21" width="4" height="148.75" rx="2" fill="var(--color-signal)" /><text x="89.00" y="751.21" fill="var(--color-signal)" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">PURCHASING SPV</text><text x="89.00" y="785.21" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Funded demand + purchase</text><text x="89.00" y="817.71" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">financing</text><text x="32.00" y="913.96" fill="var(--color-amber)" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start">CONTRACT · 15 YEARS</text><rect x="71" y="933.96" width="497" height="148.75" rx="15" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1.5" /><rect x="71" y="933.96" width="4" height="148.75" rx="2" fill="var(--col