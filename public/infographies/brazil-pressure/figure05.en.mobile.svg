ll="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Production → separation / metals →</text><text x="50.00" y="1376.96" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">magnets. First deliveries initially</text><text x="50.00" y="1409.46" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">expected early Q4.</text><text x="32.00" y="1492.71" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start">03.09.2026 · COMBINATION COMPLETED</text><text x="32.00" y="1527.71" fill="var(--color-signal)" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start">USA Rare Earth + Serra Verde</text><path d="M 32,1564.71 L 568,1564.71" fill="none" stroke="var(--color-line-strong)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="32.00" y="1595.71" fill="var(--color-muted)" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Commitments and conditional credit ≠ cash paid. No</text><text x="32.00" y="1620.41" fill="var(--color-muted)" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">contractual electoral quid pro quo established.</text><text x="32.00" y="1645.11" fill="var(--color-muted)" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Deliveries remain to be verified.</text><text x="32.00" y="1692.11" fill="var(--color-muted)" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Sources: S21–S24 · SEC filings / issuers</text><text x="32.00" y="1718.11" fill="var(--color-signal)" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="40