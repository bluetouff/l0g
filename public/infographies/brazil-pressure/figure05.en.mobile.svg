<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1749" role="img" aria-labelledby="brazil-pressure-en-5-full-mobile-title brazil-pressure-en-5-full-mobile-desc" data-figure="5" data-model="separated-financing-instruments" data-unit="USD-million" data-public-investment-commitment="750" data-conditional-bank-facility-cap="500" data-forward-public-purchases-min="300" data-forward-purchase-years="5" data-offtake-years="15" data-dfc-project-financing="565" data-dfc-instrument="signed-loan-announced" data-dfc-announcement-date="2026-02-04" data-dfc-disbursement="not-quantified" data-instruments-not-additive="true" style="width:100%;height:auto"><title id="brazil-pressure-en-5-full-mobile-title">Contracts organise the resource</title><desc id="brazil-pressure-en-5-full-mobile-desc">The buyer SPV links a $750m public investment commitment, a conditional bank facility up to $500m and government forward purchases of at least $300m over five years. A 15-year offtake covers the relevant Phase 1 output with price floors. Separate $565m DFC project financing. Different instruments, not equivalent cash disbursements.</desc><style>:root{color-scheme:light;--color-ink:#e7e9ee;--color-surface:#ffffff;--color-surface-2:#eef0f4;--color-line-strong:rgba(12, 13, 16, 0.26);--color-paper:#1b1d23;--color-muted:#4d5461;--color-signal:#0b5f58;--color-accent:#a50f4d;--color-amber:#92400e;--color-topic-blue:#1d4ed8}@media(prefers-color-scheme:dark){:root{color-scheme:dark;--color-ink:#0c0d10;--color-surface:#121419;--color-surface-2:#171a20;--color-line-strong:rgba(255, 255, 255, 0.20);--color-paper:#e7e9ee;--color-muted:#8b909b;--color-signal:#5eead4;--color-accent:#ff4d87;--color-amber:#f5b13d;--color-topic-blue:#7aa2f7}}</style><defs><marker id="brazil-pressure-en-5-full-mobile-bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-ink)" /></marker><marker id="brazil-pressure-en-5-full-m