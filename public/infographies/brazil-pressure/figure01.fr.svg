<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 875" role="img" aria-labelledby="brazil-pressure-fr-1-full-wide-title brazil-pressure-fr-1-full-wide-desc" data-figure="1" data-model="policy-chronology" style="width:100%;height:auto"><title id="brazil-pressure-fr-1-full-wide-title">Une pression qui change de voie</title><desc id="brazil-pressure-fr-1-full-wide-desc">Les sanctions de Moraes sont retirées le 12 décembre 2025; les droits IEEPA cessent en février 2026. De nouvelles mesures 301 apparaissent en juillet. Le 30 septembre, négociation commerciale; le 1er octobre, demande d’enquête sur un financement allégué.</desc><style>:root{color-scheme:light;--color-ink:#e7e9ee;--color-surface:#ffffff;--color-surface-2:#eef0f4;--color-line-strong:rgba(12, 13, 16, 0.26);--color-paper:#1b1d23;--color-muted:#4d5461;--color-signal:#0b5f58;--color-accent:#a50f4d;--color-amber:#92400e;--color-topic-blue:#1d4ed8}@media(prefers-color-scheme:dark){:root{color-scheme:dark;--color-ink:#0c0d10;--color-surface:#121419;--color-surface-2:#171a20;--color-line-strong:rgba(255, 255, 255, 0.20);--color-paper:#e7e9ee;--color-muted:#8b909b;--color-signal:#5eead4;--color-accent:#ff4d87;--color-amber:#f5b13d;--color-topic-blue:#7aa2f7}}</style><defs><marker id="brazil-pressure-fr-1-full-wide-bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-ink)" /></marker><marker id="brazil-pressure-fr-1-full-wide-panel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-surface)" /></marker><marker id="brazil-pressure-fr-1-full-wide-panel2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-surface-2)" /></marker><marker id="brazil-pressure-fr-1-full-wide-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-paper)" /></marker><marker id="brazil-pressure-fr-1-full-wide-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-muted)" /></marker><marker id="brazil-pressure-fr-1-full-wide-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-signal)" /></marker><marker id="brazil-pressure-fr-1-full-wide-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-amber)" /></marker><marker id="brazil-pressure-fr-1-full-wide-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-accent)" /></marker><marker id="brazil-pressure-fr-1-full-wide-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-topic-blue)" /></marker><marker id="brazil-pressure-fr-1-full-wide-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-muted)" /></marker></defs><rect width="1120" height="875" rx="20" fill="var(--color-ink)" /><path d="M 0,0 V 875" stroke="var(--color-paper)" stroke-opacity="0.025" /><path d="M 80,0 V 875" stroke="var(--color-paper)" stroke-opacity="0.025" /><path d="M 160,0 V 875" stroke="var(--color-paper)" stroke-opacity="0.025" /><path d="M 240,0 V 875" stroke="var(--color-paper)" stroke-opacity="0.025" /><path d="M 320,0 V 875" stroke="var(--color-paper)" stroke-opacity="0.025" /><path d="M 400,0 V 875" stroke="var(--color-paper)" stroke-opacity="0.025" /><path d="M 480,0 V 875" stroke="var(--color-paper)" stroke-opacity="0.025" /><path d="M 560,0 V 875" stroke="var(--color-paper)" stroke-opacity="0.025" /><path d="M 640,0 V 875" stroke="var(--color-paper)" stroke-opacity="0.025" /><path d="M 720,0 V 875" stroke="var(--color-paper)" stroke-opacity="0.025" /><path d="M 800,0 V 875" stroke="var(--color-paper)" stroke-opacity="0.025" /><path d="M 880,0 V 875" stroke="var(--color-paper)" stroke-opacity="0.025" /><path d="M 960,0 V 875" stroke="var(--color-paper)" stroke-opacity="0.025" /><path d="M 1040,0 V 875" stroke="var(--color-paper)" stroke-opacity="0.025" /><text x="44.00" y="34.00" fill="var(--color-signal)" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">l0g  /  GÉOPOLITIQUE DU CAPITAL</text><text x="1076.00" y="34.00" fill="var(--color-muted)" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="end">01</text><text x="44.00" y="91.00" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="39" font-weight="700" text-anchor="start">Une pression qui change de voie</text><text x="44.00" y="126.00" fill="var(--color-muted)" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Les retraits de 2025-2026, puis le retour des tarifs et deux voies ouvertes avant le vote.</text><rect x="44" y="162.0" width="316" height="185" rx="15" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1.5" /><rect x="44" y="162.0" width="4" height="185" rx="2" fill="var(--color-accent)" /><text x="62.00" y="191.00" fill="var(--color-accent)" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">30.07.2025</text><text x="62.00" y="225.00" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">Tarif +40 % et sanction</text><text x="62.00" y="253.60" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">de Moraes</text><rect x="402" y="162.0" width="316" height="185" rx="15" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1.5" /><rect x="402" y="162.0" width="4" height="185" rx="2" fill="var(--color-topic-blue)" /><text x="420.00" y="191.00" fill="var(--color-topic-blue)" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">12.12.25 / 20.02.26</text><text x="420.00" y="225.00" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">Sanctions retirées, puis</text><text x="420.00" y="253.60" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">droits IEEPA terminés</text><rect x="760" y="162.0" width="316" height="185" rx="15" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1.5" /><rect x="760" y="162.0" width="4" height="185" rx="2" fill="var(--color-amber)" /><text x="778.00" y="191.00" fill="var(--color-amber)" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">22 / 24.07.2026</text><text x="778.00" y="225.00" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">Section 301 : +25 %,</text><text x="778.00" y="253.60" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">puis +12,5 % selon les</text><text x="778.00" y="282.20" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">produits</text><path d="M 363,253.0 L 391,253.0" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#brazil-pressure-fr-1-full-wide-line)" /><path d="M 721,253.0 L 749,253.0" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#brazil-pressure-fr-1-full-wide-line)" /><text x="44.00" y="385.00" fill="var(--color-signal)" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start">AVANT LE SCRUTIN : DEUX VOIES SIMULTANÉES</text><rect x="44" y="422.0" width="494" height="181" rx="15" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1.5" /><rect x="44" y="422.0" width="4" height="181" rx="2" fill="var(--color-signal)" /><text x="62.00" y="451.00" fill="var(--color-signal)" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">30.09 · MILWAUKEE</text><text x="62.00" y="485.00" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">Groupe de travail commercial annoncé.</text><text x="62.00" y="513.60" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">Une sortie négociée reste ouverte.</text><rect x="582" y="422.0" width="494" height="181" rx="15" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1.5" /><rect x="582" y="422.0" width="4" height="181" rx="2" fill="var(--color-amber)" /><text x="600.00" y="451.00" fill="var(--color-amber)" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">01.10 · BRASÍLIA</text><text x="600.00" y="485.00" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">Financement allégué de 1 M$ : l’AGU</text><text x="600.00" y="513.60" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">demande une enquête. Versement à</text><text x="600.00" y="542.20" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">établir.</text><rect x="44" y="633.0" width="1032" height="82" rx="15" fill="var(--color-surface-2)" /><text x="64.00" y="667.00" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start">04.10.2026  →  VOTE</text><text x="64.00" y="695.00" fill="var(--color-muted)" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">25 octobre : second tour éventuel</text><path d="M 44,741.0 L 1076,741.0" fill="none" stroke="var(--color-line-strong)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="44.00" y="772.00" fill="var(--color-muted)" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Chronologie des décisions, sans échelle de gravité.</text><text x="44.00" y="819.00" fill="var(--color-muted)" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Sources : S01 · S03 · S09 · S11–S13 · S15 · S27</text><text x="44.00" y="845.00" fill="var(--color-signal)" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">03.10.2026  ·  l0g.fr</text></svg>
