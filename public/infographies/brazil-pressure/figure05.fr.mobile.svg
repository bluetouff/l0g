<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1781" role="img" aria-labelledby="brazil-pressure-fr-5-full-mobile-title brazil-pressure-fr-5-full-mobile-desc" data-figure="5" data-model="separated-financing-instruments" data-unit="USD-million" data-public-investment-commitment="750" data-conditional-bank-facility-cap="500" data-forward-public-purchases-min="300" data-forward-purchase-years="5" data-offtake-years="15" data-dfc-project-financing="565" data-dfc-instrument="signed-loan-announced" data-dfc-announcement-date="2026-02-04" data-dfc-disbursement="not-quantified" data-instruments-not-additive="true" style="width:100%;height:auto"><title id="brazil-pressure-fr-5-full-mobile-title">Le contrat organise la ressource</title><desc id="brazil-pressure-fr-5-full-mobile-desc">Le SPV acheteur combine engagement public de 750 millions, crédit bancaire potentiel de 500 millions sous conditions et achats à terme publics d’au moins 300 millions sur cinq ans. Il achète la production couverte de phase 1 pendant 15 ans, avec prix planchers. Un financement DFC de 565 millions soutient séparément le projet. Montants de natures différentes, non assimilables à des décaissements.</desc><style>:root{color-scheme:light;--color-ink:#e7e9ee;--color-surface:#ffffff;--color-surface-2:#eef0f4;--color-line-strong:rgba(12, 13, 16, 0.26);--color-paper:#1b1d23;--color-muted:#4d5461;--color-signal:#0b5f58;--color-accent:#a50f4d;--color-amber:#92400e;--color-topic-blue:#1d4ed8}@media(prefers-color-scheme:dark){:root{color-scheme:dark;--color-ink:#0c0d10;--color-surface:#121419;--color-surface-2:#171a20;--color-line-strong:rgba(255, 255, 255, 0.20);--color-paper:#e7e9ee;--color-muted:#8b909b;--color-signal:#5eead4;--color-accent:#ff4d87;--color-amber:#f5b13d;--color-topic-blue:#7aa2f7}}</style><defs><marker id="brazil-pressure-fr-5-full-mobile-bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="va