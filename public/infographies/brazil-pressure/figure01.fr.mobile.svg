<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1394" role="img" aria-labelledby="brazil-pressure-fr-1-full-mobile-title brazil-pressure-fr-1-full-mobile-desc" data-figure="1" data-model="policy-chronology" style="width:100%;height:auto"><title id="brazil-pressure-fr-1-full-mobile-title">Une pression qui change de voie</title><desc id="brazil-pressure-fr-1-full-mobile-desc">Les sanctions de Moraes sont retirées le 12 décembre 2025; les droits IEEPA cessent en février 2026. De nouvelles mesures 301 apparaissent en juillet. Le 30 septembre, négociation commerciale; le 1er octobre, demande d’enquête sur un financement allégué.</desc><style>:root{color-scheme:light;--color-ink:#e7e9ee;--color-surface:#ffffff;--color-surface-2:#eef0f4;--color-line-strong:rgba(12, 13, 16, 0.26);--color-paper:#1b1d23;--color-muted:#4d5461;--color-signal:#0b5f58;--color-accent:#a50f4d;--color-amber:#92400e;--color-topic-blue:#1d4ed8}@media(prefers-color-scheme:dark){:root{color-scheme:dark;--color-ink:#0c0d10;--color-surface:#121419;--color-surface-2:#171a20;--color-line-strong:rgba(255, 255, 255, 0.20);--color-paper:#e7e9ee;--color-muted:#8b909b;--color-signal:#5eead4;--color-accent:#ff4d87;--color-amber:#f5b13d;--color-topic-blue:#7aa2f7}}</style><defs><marker id="brazil-pressure-fr-1-full-mobile-bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-ink)" /></marker><marker id="brazil-pressure-fr-1-full-mobile-panel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-surface)" /></marker><marker id="brazil-pressure-fr-1-full-mobile-panel2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-surface-2)" /></marker><marker id="brazil-pressure-fr-1-full-mobile-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-paper)" /></marker><marker id="brazil-pressure-fr-1-full-mobile-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-muted)" /></marker><marker id="brazil-pressure-fr-1-full-mobile-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-signal)" /></marker><marker id="brazil-pressure-fr-1-full-mobile-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-amber)" /></marker><marker id="brazil-pressure-fr-1-full-mobile-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-accent)" /></marker><marker id="brazil-pressure-fr-1-full-mobile-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-topic-blue)" /></marker><marker id="brazil-pressure-fr-1-full-mobile-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-muted)" /></marker></defs><rect width="600" height="1394" rx="20" fill="var(--color-ink)" /><path d="M 0,0 V 1394" stroke="var(--color-paper)" stroke-opacity="0.025" /><path d="M 80,0 V 1394" stroke="var(--color-paper)" stroke-opacity="0.025" /><path d="M 160,0 V 1394" stroke="var(--color-paper)" stroke-opacity="0.025" /><path d="M 240,0 V 1394" stroke="var(--color-paper)" stroke-opacity="0.025" /><path d="M 320,0 V 1394" stroke="var(--color-paper)" stroke-opacity="0.025" /><path d="M 400,0 V 1394" stroke="var(--color-paper)" stroke-opacity="0.025" /><path d="M 480,0 V 1394" stroke="var(--color-paper)" stroke-opacity="0.025" /><path d="M 560,0 V 1394" stroke="var(--color-paper)" stroke-opacity="0.025" /><text x="32.00" y="34.00" fill="var(--color-signal)" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start">l0g  /  GÉOPOLITIQUE DU CAPITAL</text><text x="568.00" y="34.00" fill="var(--color-muted)" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="end">01</text><text x="32.00" y="91.00" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start">Une pression qui change de</text><text x="32.00" y="134.18" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start">voie</text><text x="32.00" y="169.18" fill="var(--color-muted)" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">Les retraits de 2025-2026, puis le retour des</text><text x="32.00" y="200.46" fill="var(--color-muted)" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">tarifs et deux voies ouvertes avant le vote.</text><rect x="66" y="236.46" width="502" height="116.25" rx="15" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1.5" /><rect x="66" y="236.46" width="4" height="116.25" rx="2" fill="var(--color-accent)" /><text x="84.00" y="265.46" fill="var(--color-accent)" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">30.07.2025</text><text x="84.00" y="299.46" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Tarif +40 % et sanction de Moraes</text><circle cx="43" cy="258.46000000000004" r="7" fill="var(--color-accent)" /><path d="M 43,268.46000000000004 L 43,378.71000000000004" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#brazil-pressure-fr-1-full-mobile-line)" /><rect x="66" y="382.71000000000004" width="502" height="148.75" rx="15" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1.5" /><rect x="66" y="382.71000000000004" width="4" height="148.75" rx="2" fill="var(--color-topic-blue)" /><text x="84.00" y="411.71" fill="var(--color-topic-blue)" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">12.12.25 / 20.02.26</text><text x="84.00" y="445.71" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Sanctions retirées, puis droits IEEPA</text><text x="84.00" y="478.21" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">terminés</text><circle cx="43" cy="404.71000000000004" r="7" fill="var(--color-topic-blue)" /><path d="M 43,414.71000000000004 L 43,557.46" fill="none" stroke="var(--color-muted)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#brazil-pressure-fr-1-full-mobile-line)" /><rect x="66" y="561.46" width="502" height="148.75" rx="15" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1.5" /><rect x="66" y="561.46" width="4" height="148.75" rx="2" fill="var(--color-amber)" /><text x="84.00" y="590.46" fill="var(--color-amber)" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">22 / 24.07.2026</text><text x="84.00" y="624.46" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Section 301 : +25 %, puis +12,5 %</text><text x="84.00" y="656.96" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">selon les produits</text><circle cx="43" cy="583.46" r="7" fill="var(--color-amber)" /><text x="32.00" y="740.21" fill="var(--color-signal)" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">AVANT LE SCRUTIN : DEUX VOIES SIMULTANÉES</text><rect x="32" y="777.21" width="536" height="148.75" rx="15" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1.5" /><rect x="32" y="777.21" width="4" height="148.75" rx="2" fill="var(--color-signal)" /><text x="50.00" y="806.21" fill="var(--color-signal)" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">30.09 · MILWAUKEE</text><text x="50.00" y="840.21" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Groupe de travail commercial annoncé.</text><text x="50.00" y="872.71" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Une sortie négociée reste ouverte.</text><rect x="32" y="947.96" width="536" height="181.25" rx="15" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1.5" /><rect x="32" y="947.96" width="4" height="181.25" rx="2" fill="var(--color-amber)" /><text x="50.00" y="976.96" fill="var(--color-amber)" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">01.10 · BRASÍLIA</text><text x="50.00" y="1010.96" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Financement allégué de 1 M$ : l’AGU</text><text x="50.00" y="1043.46" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">demande une enquête. Versement à</text><text x="50.00" y="1075.96" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">établir.</text><rect x="32" y="1151.21" width="536" height="82" rx="15" fill="var(--color-surface-2)" /><text x="52.00" y="1185.21" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start">04.10.2026  →  VOTE</text><text x="52.00" y="1213.21" fill="var(--color-muted)" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">25 octobre : second tour éventuel</text><path d="M 32,1259.21 L 568,1259.21" fill="none" stroke="var(--color-line-strong)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="32.00" y="1290.21" fill="var(--color-muted)" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Chronologie des décisions, sans échelle de gravité.</text><text x="32.00" y="1337.21" fill="var(--color-muted)" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Sources : S01 · S03 · S09 · S11–S13 · S15 · S27</text><text x="32.00" y="1363.21" fill="var(--color-signal)" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">03.10.2026  ·  l0g.fr</text></svg>
