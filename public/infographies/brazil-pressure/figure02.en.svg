th d="M 320,0 V 1014" stroke="var(--color-paper)" stroke-opacity="0.025" /><path d="M 400,0 V 1014" stroke="var(--color-paper)" stroke-opacity="0.025" /><path d="M 480,0 V 1014" stroke="var(--color-paper)" stroke-opacity="0.025" /><path d="M 560,0 V 1014" stroke="var(--color-paper)" stroke-opacity="0.025" /><path d="M 640,0 V 1014" stroke="var(--color-paper)" stroke-opacity="0.025" /><path d="M 720,0 V 1014" stroke="var(--color-paper)" stroke-opacity="0.025" /><path d="M 800,0 V 1014" stroke="var(--color-paper)" stroke-opacity="0.025" /><path d="M 880,0 V 1014" stroke="var(--color-paper)" stroke-opacity="0.025" /><path d="M 960,0 V 1014" stroke="var(--color-paper)" stroke-opacity="0.025" /><path d="M 1040,0 V 1014" stroke="var(--color-paper)" stroke-opacity="0.025" /><text x="44.00" y="34.00" fill="var(--color-signal)" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">l0g  /  THE GEOPOLITICS OF CAPITAL</text><text x="1076.00" y="34.00" fill="var(--color-muted)" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="end">02</text><text x="44.00" y="91.00" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="39" font-weight="700" text-anchor="start">The tariff reaches the margin</text><text x="44.00" y="126.00" fill="var(--color-muted)" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">A $100 example for goods covered by both July 2026 measures.</text><rect x="44" y="162.0" width="1032" height="111.15" rx="15" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1.5" /><rect x="44" y="162.0" width="4" height="111.15" rx="2" fill="var(--color-topic-blue)" /><text x="62.00" y="191.00" fill="var(--color-topic-blue)" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">CHECK COVERAGE FIRST</text><text x="62.00" y="225.00" fill="var(--color-paper)"