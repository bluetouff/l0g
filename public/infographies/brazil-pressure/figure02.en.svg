<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1014" role="img" aria-labelledby="brazil-pressure-en-2-full-wide-title brazil-pressure-en-2-full-wide-desc" data-figure="2" data-model="tariff-conditional-example" data-customs-value="100" data-additional-rates="25,12.5" data-total-cost="137.5" data-constant-cost-supplier-price="72.73" data-supplier-price-reduction-percent="27.27" data-unit="USD" data-kind="conditional-calculation" style="width:100%;height:auto"><title id="brazil-pressure-en-2-full-wide-title">The tariff reaches the margin</title><desc id="brazil-pressure-en-2-full-wide-desc">Conditional example: $100 customs value plus $25 and $12.50 additional duties equals $137.50. Keeping the final cost at $100 would require a $72.73 supplier price. Not a national average or price forecast.</desc><style>:root{color-scheme:light;--color-ink:#e7e9ee;--color-surface:#ffffff;--color-surface-2:#eef0f4;--color-line-strong:rgba(12, 13, 16, 0.26);--color-paper:#1b1d23;--color-muted:#4d5461;--color-signal:#0b5f58;--color-accent:#a50f4d;--color-amber:#92400e;--color-topic-blue:#1d4ed8}@media(prefers-color-scheme:dark){:root{color-scheme:dark;--color-ink:#0c0d10;--color-surface:#121419;--color-surface-2:#171a20;--color-line-strong:rgba(255, 255, 255, 0.20);--color-paper:#e7e9ee;--color-muted:#8b909b;--color-signal:#5eead4;--color-accent:#ff4d87;--color-amber:#f5b13d;--color-topic-blue:#7aa2f7}}</style><defs><marker id="brazil-pressure-en-2-full-wide-bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-ink)" /></marker><marker id="brazil-pressure-en-2-full-wide-panel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-surface)" /></marker><marker id="brazil-pressure-en-2-full-wide-panel2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-s