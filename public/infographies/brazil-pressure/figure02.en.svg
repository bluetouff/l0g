l, sans-serif" font-size="44" font-weight="700" text-anchor="end">$137.50</text><path d="M 44,614.15 L 1076,614.15" fill="none" stroke="var(--color-line-strong)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="44.00" y="652.15" fill="var(--color-signal)" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start">WHO ABSORBS THE SHOCK?</text><rect x="44" y="677.15" width="494" height="174" rx="15" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1.5" /><rect x="44" y="677.15" width="4" height="174" rx="2" fill="var(--color-amber)" /><text x="62.00" y="706.15" fill="var(--color-amber)" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">CASE A</text><text x="62.00" y="740.15" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">Supplier price unchanged: the importer</text><text x="62.00" y="768.75" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">finances $137.50.</text><rect x="582" y="677.15" width="494" height="174" rx="15" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1.5" /><rect x="582" y="677.15" width="4" height="174" rx="2" fill="var(--color-signal)" /><text x="600.00" y="706.15" fill="var(--color-signal)" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">CASE B</text><text x="600.00" y="740.15" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">Final cost held at $100: supplier price</text><text x="600.00" y="768.75" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">$72.73, a 27.27% reduction.</text><path d="M 44,879.15 L 1076,879.15" fill="none" stroke="var(--color-line-strong)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="44.00" y="910.15" fill="var(--color-muted)" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Excludes freight, ordinary duties and other charges. Actual burden-sharing is unknown.</text><text x="44.00" y="957.15" fill="var(--color-muted)" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Sources: S13 · S15 · l0g calculation</text><text x="44.00" y="983.15" fill="var(--color-signal)" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">03.10.2026  ·  l0g.fr</text></svg>
