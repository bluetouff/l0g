"1388.21" fill="var(--color-muted)" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Les branches sont alternatives, pas une escalade</text><text x="32.00" y="1412.91" fill="var(--color-muted)" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">automatique. Aucun résultat électoral anticipé.</text><text x="32.00" y="1459.91" fill="var(--color-muted)" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Sources : S01 · S05 · S19 · S27 · analyse l0g</text><text x="32.00" y="1485.91" fill="var(--color-signal)" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">03.10.2026  ·  l0g.fr</text></svg>
