 y="611.03" width="497" height="116.25" rx="15" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1.5" /><rect x="71" y="611.03" width="4" height="116.25" rx="2" fill="var(--color-amber)" /><text x="89.00" y="640.03" fill="var(--color-amber)" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">STEP 4</text><text x="89.00" y="674.03" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Investment delayed</text><circle cx="47" cy="626.03" r="6" fill="var(--color-amber)" /><text x="32.00" y="750.28" fill="var(--color-signal)" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start">ONE FX MOVE, TWO BALANCE SHEETS</text><rect x="32" y="783.28" width="536" height="148.75" rx="15" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1.5" /><rect x="32" y="783.28" width="4" height="148.75" rx="2" fill="var(--color-signal)" /><text x="50.00" y="812.28" fill="var(--color-signal)" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">DOLLAR REVENUES</text><text x="50.00" y="846.28" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">A weaker real can support margins</text><text x="50.00" y="878.78" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">when costs remain local.</text><rect x="32" y="954.03" width="536" height="148.75" rx="15" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1.5" /><rect x="32" y="954.03" width="4" height="148.75" rx="2" fill="var(--color-accent)" /><text x="50.00" y="983.03" fill="var(--color-accent)" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">DOLLAR DEBT</text><text x="50.00" y="1017.03" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Real-denominated revenues may</text><text x="50.00" y="1049.53" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">struggle to cover debt payments.</text><path d="M 32,1124.78 L 568,1124.78" fill="none" stroke="var(--color-line-strong)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="32.00" y="1164.78" fill="var(--color-topic-blue)" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start">OBSERVED CONTEXT · AUGUST 2026</text><rect x="32" y="1196.78" width="536" height="148.75" rx="15" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1.5" /><rect x="32" y="1196.78" width="4" height="148.75" rx="2" fill="var(--color-topic-blue)" /><text x="50.00" y="1225.78" fill="var(--color-topic-blue)" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">STOCK · END-AUGUST</text><text x="50.00" y="1259.78" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">$372.6bn reserves</text><text x="50.00" y="1292.28" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Central-bank reserves.</text><rect x="32" y="1365.53" width="536" height="181.25" rx="15" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1.5" /><rect x="32" y="1365.53" width="4" height="181.25" rx="2" fill="var(--color-topic-blue)" /><text x="50.00" y="1394.53" fill="var(--color-topic-blue)" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">FLOWS · 12 MONTHS</text><text x="50.00" y="1428.53" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">$63.0bn / $86.6bn</text><text x="50.00" y="1461.03" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Current-account deficit / net inward</text><text x="50.00" y="1493.53" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">direct investment.</text><rect x="32" y="1566.78" width="536" height="148.75" rx="15" fill="var(--color-surface)" stroke="var(--color-line-strong)" stroke-width="1.5" /><rect x="32" y="1566.78" width="4" height="148.75" rx="2" fill="var(--color-topic-blue)" /><text x="50.00" y="1595.78" fill="var(--color-topic-blue)" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">FLOW · ONE MONTH</text><text x="50.00" y="1629.78" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">$5.2bn outflow</text><text x="50.00" y="1662.28" fill="var(--color-paper)" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Net portfolio outflow in August.</text><path d="M 32,1735.53 L 568,1735.53" fill="none" stroke="var(--color-line-strong)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="32.00" y="1766.53" fill="var(--color-muted)" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Direct investment includes reinvested earnings and</text><text x="32.00" y="1791.23" fill="var(--color-muted)" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">intercompany transactions. Dashed paths are</text><text x="32.00" y="1815.93" fill="var(--color-muted)" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">scenarios, not estimated causality.</text><text x="32.00" y="1862.93" fill="var(--color-muted)" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Sources: S18–S20 · l0g analysis</text><text x="32.00" y="1888.93" fill="var(--color-signal)" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">03.10.2026  ·  l0g.fr</text></svg>
