<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1919" role="img" aria-labelledby="brazil-pressure-en-4-full-mobile-title brazil-pressure-en-4-full-mobile-desc" data-figure="4" data-model="scenario-fx-financing" data-scenario="qualitative" data-observed-period="2026-08" data-unit="USD-billion" data-reserve-stock="372.6" data-reserve-asof="2026-08-31" data-current-account-deficit-12m="63" data-inward-direct-investment-12m="86.6" data-domestic-portfolio-outflow-1m="5.2" data-stocks-flows-distinct="true" style="width:100%;height:auto"><title id="brazil-pressure-en-4-full-mobile-title">From politics to financing</title><desc id="brazil-pressure-en-4-full-mobile-desc">Scenario: uncertainty, hedging, credit, investment. Dollar revenues and dollar debt create different exposures. August context: $372.6bn reserves; $63bn current-account deficit and $86.6bn inward direct investment over 12 months; $5.2bn monthly portfolio outflow. Stocks and flows are not pooled.</desc><style>:root{color-scheme:light;--color-ink:#e7e9ee;--color-surface:#ffffff;--color-surface-2:#eef0f4;--color-line-strong:rgba(12, 13, 16, 0.26);--color-paper:#1b1d23;--color-muted:#4d5461;--color-signal:#0b5f58;--color-accent:#a50f4d;--color-amber:#92400e;--color-topic-blue:#1d4ed8}@media(prefers-color-scheme:dark){:root{color-scheme:dark;--color-ink:#0c0d10;--color-surface:#121419;--color-surface-2:#171a20;--color-line-strong:rgba(255, 255, 255, 0.20);--color-paper:#e7e9ee;--color-muted:#8b909b;--color-signal:#5eead4;--color-accent:#ff4d87;--color-amber:#f5b13d;--color-topic-blue:#7aa2f7}}</style><defs><marker id="brazil-pressure-en-4-full-mobile-bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-ink)" /></marker><marker id="brazil-pressure-en-4-full-mobile-panel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="v