<title id="reserves06-en-3-full-wide-title">Price changes pass through over several weeks</title><desc id="reserves06-en-3-full-wide-desc">Three estimates published by Banque de France in 2021: a 1% refined-diesel cost increase gives pre-tax retail responses of 0.45% at one week, 0.72% at 14 working days and 0.75% in the long run. Not a new 2026 estimate.</desc>
<metadata>{"edition":"2026-10-03","convention":"Banque de France estimates published on 14 October 2021: for a 1% rise in refined diesel costs, the pre-tax retail price response is 0.45% after one week, or 60% of the final response. A historical result.","sources":[{"id":"S06","publisher":"Banque de France ; Erwan Gautier, Magali Marx, Paul Vertier","title":"Quelle transmission des prix du pétrole aux prix des carburants ?","url":"https://www.banque-france.fr/fr/publications-et-statistiques/publications/quelle-transmission-des-prix-du-petrole-aux-prix-des-carburants","reference_period":"Résultats publiés en 2021 ; date de fin de l’échantillon non précisée dans le billet"}]}</metadata><style>:root{color-scheme:light;--color-ink:#e7e9ee;--color-surface:#ffffff;--color-surface-2:#eef0f4;--color-line-strong:rgba(12, 13, 16, 0.26);--color-paper:#1b1d23;--color-muted:#4d5461;--color-signal:#0b5f58;--color-accent:#a50f4d;--color-amber:#92400e;--color-topic-blue:#1d4ed8}@media(prefers-color-scheme:dark){:root{color-scheme:dark;--color-ink:#0c0d10;--color-surface:#121419;--color-surface-2:#171a20;--color-line-strong:rgba(255, 255, 255, 0.20);--color-paper:#e7e9ee;--color-muted:#8b909b;--color-signal:#5eead4;--color-accent:#ff4d87;--color-amber:#f5b13d;--color-topic-blue:#7aa2f7}}</style><defs><marker id="reserves06-en-3-full-wide-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--color-signal)" /></marker><marker id="reserves06-en-3-full-wide-signal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="var(--color-amber)" stroke-width="1.6" /></marker></defs>
