<title id="reserves06-en-1-panel3-light-title">Wholesale and pump prices</title><desc id="reserves06-en-1-panel3-light-desc">Wholesale prices receive physical flows and the expectations signal from the previous panels, then feed into pump prices. Logistics, contracts, competition and taxes also matter. Qualitative arrows, without a measured volume or time scale.</desc>
<metadata>{"edition":"2026-10-03","convention":"Qualitative mechanism: the announcement sets quantity, product and timing. The price signal affects supply expectations and inventory decisions; its amber connector continues to the wholesale price in panel three. No measured quantity or timing.","sources":[{"id":"S04","publisher":"Ministère de la Transition écologique / DGEC","title":"Prix des produits pétroliers","url":"https://www.ecologie.gouv.fr/politiques-publiques/prix-produits-petroliers","reference_period":"Page explicative et portail de séries consultés le 3 octobre 2026"},{"id":"S11","publisher":"Federal Reserve Bank of Dallas ; Lutz Kilian, Xiaoqing Zhou","title":"Does Drawing Down the U.S. Strategic Petroleum Reserve Help Stabilize Oil Prices? Working Paper 1916","url":"https://www.dallasfed.org/-/media/documents/research/papers/2019/wp1916.pdf","reference_period":"Modélisation historique du marché mondial du pétrole ; version du 19 décembre 2019"},{"id":"S12","publisher":"U.S. Energy Information Administration","title":"Factors affecting diesel prices","url":"https://www.eia.gov/energyexplained/diesel-fuel/factors-affecting-diesel-prices.php","reference_period":"Mécanismes économiques ; page consultée le 3 octobre 2026"},{"id":"S13","publisher":"U.S. Energy Information Administration","title":"Gasoline price fluctuations","url":"https://www.eia.gov/energyexplained/gasoline/price-fluctuations.php","reference_period":"Explication des stocks et des fluctuations de prix"}]}</metadata><defs><marker id="reserves06-en-1-panel3-light-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0b5f58" /></marker><marker id="reserves06-en-1-panel3-light-signal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#92400e" stroke-width="1.6" /></marker></defs>
