<title id="reserves06-fr-3-panel2-light-title">Réponses à quatorze jours et à terme</title><desc id="reserves06-fr-3-panel2-light-desc">Après quatorze jours ouvrés : réponse HTT de 0,72 %, soit 96 % de la réponse finale. À terme : 0,75 %, soit 100 %. Axe commun de 0 à 0,8 %. Environ vingt jours ouvrés au total dans cette étude ; aucune courbe quotidienne interpolée ni prévision 2026.</desc>
