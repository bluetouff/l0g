<title id="reserves06-fr-2-full-mobile-title">Ce que contient le prix d’un litre</title><desc id="reserves06-fr-2-full-mobile-desc">Gazole 25 septembre 2026 : 136,80 centimes hors taxes + 60,75 d’accise + 39,51 de TVA = 237,06. Scénario distinct : −10 HTT entraîne −12 TTC, à fiscalité constante.</desc>
