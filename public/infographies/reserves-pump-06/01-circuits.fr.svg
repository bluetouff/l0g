<title id="reserves06-fr-1-full-wide-title">Deux chemins vers le prix</title><desc id="reserves06-fr-1-full-wide-desc">Schéma qualitatif : anticipations et flux physiques convergent vers le prix de gros, puis le détail. Aucun volume ni délai mesuré.</desc>
<metadata>{"edition":"2026-10-03","convention":"Schéma qualitatif : l’annonce fixe volume, produit et calendrier. Le signal de prix agit sur les attentes d’offre et le choix de conserver des stocks ; le connecteur ambre se poursuit vers le prix de gros au troisième volet. Aucun volume ni délai mesuré.","sources":[{"id":"S04","publisher":"Ministère de la Transition écologique / DGEC","title":"Prix des produits pétroliers","url":"https://www.ecologie.gouv.fr/politiques-publiques/prix-produits-petroliers","reference_period":"Page explicative et portail de séries consultés le 3 octobre 2026"},{"id":"S11","publisher":"Federal Reserve Bank of Dallas ; Lutz Kilian, Xiaoqing Zhou","title":"Does Drawing Down the U.S. Strategic Petroleum Reserve Help Stabilize Oil Prices? Working Paper 1916","url":"https://www.dallasfed.org/-/media/documents/research/papers/2019/wp1916.pdf","reference_period":"Modélisation historique du marché mondial du pétrole ; version du 19 décembre 2019"},{"id":"S12","publisher":"U.S. Energy Information Administration","title":"Factors affecting diesel prices","url":"https://www.eia.gov/energyexplained/diesel-fuel/factors-affecting-diesel-prices.php","reference_period":"Mécanismes économiques ; page consultée le 3 octobre 2026"},{"id":"S13","publisher":"U.S. Energy Information Administration","title":"Gasoline price fluctuations","url":"https://www.eia.gov/energyexplained/gasoline/price-fluctuations.php","reference_period":"Explication des stocks et des fluctuations de prix"}]}</metadata><style>:root{color-scheme:light;--color-ink:#e7e9ee;--color-surface:#ffffff;--color-surface-2:#eef0f4;--color-line-strong:rgba(12, 13, 16, 0.26);--color-paper:#1b1d23;--color-muted:#4d5461;--color-signal:#0b5f58;--color-accent:#a50f4d;--color-amber:#92400e;--color-topic-blue:#1d4ed8}@media(prefers-color-scheme:dark){:root{color-scheme:dark;--color-ink:#0c0d10;--color-surface:#121419;--color-surface-2:#171a20;--color-line-strong:rgba(255, 255, 255, 0.20);--color-paper:#e7