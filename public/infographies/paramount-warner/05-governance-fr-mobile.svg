<title id="pw2026-05-governance-fr-mobile-full-title">Qui nomme le gardien de l’indépendance ?</title><desc id="pw2026-05-governance-fr-mobile-full-desc">Le conseil du groupe nomme un comité de cinq journalistes ; ce comité lui rend compte via le responsable conformité. Il règle les différends éditoriaux de CBS et CNN dans un périmètre principalement américain.</desc>
