<title id="pw2026-04-commitments-fr-wide-full-title">Des sorties garanties, sous conditions</title><desc id="pw2026-04-commitments-fr-wide-full-desc">Minima 2027 à 2031 sous hypothèse de clôture en 2026 : 30, 30, 32, 32, 32 films, dont 20, 20, 21, 21, 21 à large sortie. Rattrapage six mois puis cession Miramax sous douze mois si le déficit persiste.</desc>
