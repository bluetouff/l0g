<title id="pw2026-05-governance-fr-wide-full-title">Qui nomme le gardien de l’indépendance ?</title><desc id="pw2026-05-governance-fr-wide-full-desc">Le conseil du groupe nomme un comité de cinq journalistes ; ce comité lui rend compte via le responsable conformité. Il règle les différends éditoriaux de CBS et CNN dans un périmètre principalement américain.</desc>
<metadata>{"asOf":"2026-10-04","source":"05-governance-fr.svg","sourceGeometrySha256":"d3c5c9a6691f30d6ca1cf6b4cb98f7b4f53d42fbcc7c88ff2dfe94dd8af12d91","sources":["S31"],"caption":"Lecture du §III.D du projet de règlement déposé le 21 septembre. L’instance dispose de protections réelles mais sa nomination et sa reddition de comptes restent rattachées au conseil du groupe. Schéma d’une organisation future, non d’un comité déjà installé."}</metadata><style>:root{color-scheme:dark;--pw-ink:#101d28;--pw-surface:#182d3a;--pw-paper:#f7f2e8;--pw-muted:#b2c6cd;--pw-line:#36515e;--pw-amber:#ffb16e;--pw-mint:#75d7c4;--pw-violet:#b7a3e0;--pw-blue:#83aed9;--pw-other:#536e81;--pw-ink-text:#101d28;--pw-amber-fill:#ffb16e;--pw-mint-fill:#75d7c4;--pw-violet-fill:#b7a3e0;--pw-blue-fill:#83aed9;--pw-other-fill:#536e81}@media(prefers-color-scheme:light){:root{color-scheme:light;--pw-ink:#e7e9ee;--pw-surface:#ffffff;--pw-paper:#1b1d23;--pw-muted:#4d5461;--pw-line:rgba(12, 13, 16, 0.26);--pw-amber:#92400e;--pw-mint:#0b5f58;--pw-violet:#654796;--pw-blue:#1d4ed8;--pw-other:#4d5461;--pw-ink-text:#1b1d23;--pw-amber-fill:#ffb16e;--pw-mint-fill:#75d7c4;--pw-violet-fill:#b7a3e0;--pw-blue-fill:#83aed9;--pw-other-fill:#536e81}}</style><defs><marker id="pw2026-05-governance-fr-wide-full-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="var(--pw-muted)"/></marker><pattern id="pw2026-05-governance-fr-wide-full-hatch" patternUnits="userSpaceOnUse" width="10" height="10"><path d="M-2 2 L2 -2 M0 10 L10 0 M8 12 L12 8" stroke="var(--pw-ink-text)" stroke-width="2" opacity=".2"/></pattern></defs>
