<title id="pw2026-05-governance-en-mobile-full-title">Who appoints the independence watchdog?</title><desc id="pw2026-05-governance-en-mobile-full-desc">The company board appoints five journalists; they report back through the chief compliance officer. The editorial board handles CBS and CNN disputes within a primarily US remit.</desc>
