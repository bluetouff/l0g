<title id="pw2026-05-governance-en-panel1-light-title">The corporate board appoints the editorial board</title><desc id="pw2026-05-governance-en-panel1-light-desc">Reading of §III.D of the proposed settlement filed September 21. Genuine safeguards coexist with appointment and reporting through the corporate board. This is a required future structure, not an already-appointed body. The corporate board appoints the editorial board.</desc>
