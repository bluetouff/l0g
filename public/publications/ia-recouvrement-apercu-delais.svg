<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" role="img" aria-labelledby="ia6-fr-fig-title ia6-fr-fig-desc" style="width:100%;height:auto" font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="500" height="350" fill="#0b0d10"/>
<title id="ia6-fr-fig-title">Deux délais, deux points de départ</title>
<desc id="ia6-fr-fig-desc">Le délai de réponse RGPD part de la réception de la demande : un mois, avec prolongation possible de deux mois annoncée au premier mois. L’opposition à une injonction de payer en France suit un calendrier indépendant : en principe un mois après la signification. Les cas particuliers sont expliqués dans le texte.</desc>
<text x="12" y="30" font-size="24" font-weight="700" fill="#e7e9ee">Accès aux données · RGPD</text>
<text x="12" y="60" font-size="20" fill="#8b909b">Départ : réception de la demande</text>
<g data-region="response"><rect x="12" y="76" width="152" height="78" rx="8" fill="#121419" stroke="#5eead4"/><text x="88" y="108" text-anchor="middle" font-size="24" font-weight="700" fill="#5eead4">1 mois</text><text x="88" y="138" text-anchor="middle" font-size="20" fill="#e7e9ee">Réponse</text></g>
<path d="M165 115 H177 M171 109 L177 115 L171 121" fill="none" stroke="#8b909b" stroke-width="2"/>
<g data-region="extension"><rect x="184" y="76" width="304" height="78" rx="8" fill="#121419" stroke="rgba(255,255,255,0.20)"/><text x="336" y="108" text-anchor="middle" font-size="24" font-weight="700" fill="#e7e9ee">+ 2 mois possibles</text><text x="336" y="138" text-anchor="middle" font-size="20" fill="#8b909b">Prolongation motivée</text></g>
<text x="12" y="184" font-size="20" fill="#8b909b">À annoncer dans le premier mois.</text>
<text x="12" y="224" font-size="24" font-weight="700" fill="#e7e9ee">Opposition · Injonction de payer</text>
<text x="12" y="254" font-size="20" fill="#8b909b">Départ : signification, en France</text>
<g data-region="objection"><rect x="12" y="266" width="152" height="76" rx="8" fill="#121419" stroke="#ff4d87"/><text x="88" y="298" text-anchor="middle" font-size="24" font-weight="700" fill="#ff4d87">1 mois</text><text x="88" y="328" text-anchor="middle" font-size="20" fill="#e7e9ee">En principe</text></g>
<text x="184" y="292" font-size="20" font-weight="700" fill="#e7e9ee">Calendrier indépendant</text>
<text x="184" y="324" font-size="20" fill="#8b909b">Cas particuliers : voir le texte</text>
</svg>
