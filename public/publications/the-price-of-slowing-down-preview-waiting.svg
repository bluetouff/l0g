<title id="ai-time-en-discount-title">The price of two more years</title>
<desc id="ai-time-en-discount-desc">Hypothetical simulation: a single future payment of 100, no interim cash flows. Present value: 78.35 at 5% over 5 years; 62.09 at 10% over 5 years; 51.32 at 10% over 7 years. Shared zero-to-100 scale. Delay alone reduces value by 17.4% between the last two cases.</desc>
<rect x="0" y="0" width="500" height="420" rx="6" fill="#121419"/>
<text x="24" y="36" font-size="24" font-weight="700" text-anchor="start" fill="#e7e9ee">The price of two more years</text>
<text x="24" y="68" font-size="20" font-weight="400" text-anchor="start" fill="#8b909b">Simulation · future payment = 100</text>
<text x="24" y="110" font-size="22" font-weight="700" text-anchor="start" fill="#e7e9ee">5 years · rate 5%</text>
<text x="476" y="110" font-size="22" font-weight="400" text-anchor="end" fill="#e7e9ee">78.35</text>
<rect x="36.000000" y="126" width="313.410467" height="26" fill="#5eead4"/>
<text x="24" y="194" font-size="22" font-weight="700" text-anchor="start" fill="#e7e9ee">5 years · rate 10%</text>
<text x="476" y="194" font-size="22" font-weight="400" text-anchor="end" fill="#e7e9ee">62.09</text>
<rect x="36.000000" y="210" width="248.368529" height="26" fill="#ff4d87"/>
<text x="24" y="278" font-size="22" font-weight="700" text-anchor="start" fill="#e7e9ee">7 years · rate 10%</text>
<text x="476" y="278" font-size="22" font-weight="400" text-anchor="end" fill="#e7e9ee">51.32</text>
