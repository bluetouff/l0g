<title id="ai-time-fr-discount-title">Le prix de deux ans de plus</title>
<desc id="ai-time-fr-discount-desc">Simulation fictive : un seul paiement futur de 100, aucun flux intermédiaire. Valeur actuelle : 78,35 à 5 % sur 5 ans ; 62,09 à 10 % sur 5 ans ; 51,32 à 10 % sur 7 ans. Échelle commune de zéro à 100. Le retard seul réduit la valeur de 17,4 % entre les deux derniers cas.</desc>
